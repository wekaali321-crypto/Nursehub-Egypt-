<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 942" width="872" height="942"><rect width="872" height="942" fill="#ffffff"/><text x="436" y="70" font-size="46" text-anchor="middle" font-weight="700" fill="#1f2d3d" font-family="Arial, Helvetica, sans-serif">Intradermal injection site</text><g transform="translate(40,150)"><path d="M20,70 C120,30 420,20 560,60 C640,80 700,100 760,90 C780,130 770,190 700,200 C560,220 300,200 120,200 C40,190 10,130 20,70 Z" fill="#f1c9a5" stroke="#c99a73" stroke-width="4"/><circle cx="330" cy="125" r="34" fill="#fbf1e6" stroke="#d9b99a" stroke-width="4"/><circle cx="330" cy="125" r="18" fill="#fffaf3" opacity="0.8"/></g><text x="430" y="420" font-size="34" text-anchor="middle" font-weight="700" fill="#1f2d3d" font-family="Arial, Helvetica, sans-serif">Immediately after injection: pale wheal (bleb)</text><g transform="translate(40,520)"><path d="M20,70 C120,30 420,20 560,60 C640,80 700,100 760,90 C780,130 770,190 700,200 C560,220 300,200 120,200 C40,190 10,130 20,70 Z" fill="#f1c9a5" stroke="#c99a73" stroke-width="4"/><circle cx="330" cy="125" r="62" fill="#ef9a9a" opacity="0.55"/><circle cx="330" cy="125" r="40" fill="#e57373" stroke="#c62828" stroke-width="4"/><ellipse cx="318" cy="112" rx="14" ry="9" fill="#ffcdd2" opacity="0.8"/></g><text x="430" y="790" font-size="34" text-anchor="middle" font-weight="700" fill="#1f2d3d" font-family="Arial, Helvetica, sans-serif">Later: skin reaction at the site (redness / induration)</text><text x="436" y="900" font-size="26" text-anchor="middle" font-weight="400" fill="#78909c" font-family="Arial, Helvetica, sans-serif">Schematic drawing</text></svg>