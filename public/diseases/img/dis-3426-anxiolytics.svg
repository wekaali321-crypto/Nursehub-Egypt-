<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 288" width="640" height="288" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="مضادات القلق: Benzodiazepines وBarbiturates وBuspirone"><rect width="640" height="288" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">مضادات القلق: Benzodiazepines وBarbiturates وBuspirone</text><rect x="326.0" y="46" width="302.0" height="188" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Benzodiazepines (-lam/-pam)</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• Alprazolam، Midazolam (-lam)</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• Temazepam، Clonazepam (-pam)</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• قلق وتشنج</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• تزيد GABA: تبطّئ العلامات الحيوية</text><text x="616.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">   والدماغ</text><text x="616.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">• عند النوم؛ لا تفوّت جرعات</text><text x="616.0" y="202" text-anchor="start" font-size="12.5" fill="#1d2939">• لا كحول ولا آلات خطرة</text><text x="616.0" y="220" text-anchor="start" font-size="12.5" fill="#1d2939">• ترياق: Flumazenil (للأفيونات: Naloxone)</text><rect x="12.0" y="46" width="302.0" height="98" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="12.0" y="60" width="302.0" height="14" fill="#b42318"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Barbiturates: Phenobarbital</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• يبقى طويلًا بالجسم (جيد وسيئ)</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• سمّية: هبوط ضغط وتثبيط تنفسي</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• قيّم التنفس والضغط</text><rect x="12.0" y="156" width="302.0" height="116" rx="10" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.2"/><rect x="12.0" y="156" width="302.0" height="28" rx="10" fill="#2e7d4f"/><rect x="12.0" y="170" width="302.0" height="14" fill="#2e7d4f"/><text x="163.0" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Buspirone</text><text x="302.0" y="204" text-anchor="start" font-size="12.5" fill="#1d2939">• كامل الأثر خلال 2–4 أسابيع</text><text x="302.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• لا أعراض انسحاب ولا تهدئة</text><text x="302.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• مسموح القيادة</text><text x="302.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• لا يُستعمل للنوبات الحادة</text></svg>