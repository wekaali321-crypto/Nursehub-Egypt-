<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 418" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="418" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تثقيف العين ورعاية ما بعد استئصال الدرقية</text><rect x="325" y="48" width="295" height="152" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">العين (جحوظ)</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">تمارين حركة العين الكاملة</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">قطرة دموع صناعية</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">نظارة شمس داكنة</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">أغلق الجفن بشريط أو غطاء عين</text><rect x="20" y="48" width="295" height="152" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">تجنب 5 S</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">Sodium (الصوديوم) ورفع الرأس</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">Stimulants: جمّع الرعاية وخفّت الضوء</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">Smoking</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">Stress</text><text x="305" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">Sepsis (عدوى) — ولا تلمس الرقبة ولا تدلكها</text><rect x="325" y="210" width="295" height="192" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="210" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">بعد الجراحة: ABC</text><text x="610" y="262" text-anchor="start" font-size="12.5" fill="#1e293b">A: أنبوب رغامى وعدة فغر بجانب السرير</text><text x="610" y="282" text-anchor="start" font-size="12.5" fill="#1e293b">(أولوية 1)</text><text x="610" y="302" text-anchor="start" font-size="12.5" fill="#1e293b">B: صرير حنجرة وجودة الصوت</text><text x="610" y="322" text-anchor="start" font-size="12.5" fill="#1e293b">C: نزف حول الوسادة والجرح، الرأس والرقبة</text><text x="610" y="342" text-anchor="start" font-size="12.5" fill="#1e293b">محايدان</text><text x="610" y="362" text-anchor="start" font-size="12.5" fill="#1e293b">HOB 30–45 ولا استلقاء مسطح ولا ثني/مد</text><text x="610" y="382" text-anchor="start" font-size="12.5" fill="#1e293b">الرقبة</text><rect x="20" y="210" width="295" height="192" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><rect x="20" y="210" width="295" height="30" rx="12" fill="#9333ea"/><text x="167.5" y="231" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الكالسيوم</text><text x="305" y="262" text-anchor="start" font-size="12.5" fill="#1e293b">أقل من 8.6 (الطبيعي 8.6–10.2)</text><text x="305" y="282" text-anchor="start" font-size="12.5" fill="#1e293b">Chvostek: وخز الخد</text><text x="305" y="302" text-anchor="start" font-size="12.5" fill="#1e293b">Trousseau: تشنج اليد بكفة الضغط 3 دقائق</text><text x="305" y="322" text-anchor="start" font-size="12.5" fill="#1e293b">وخز حول الفم وتشنج عضلي</text>
</svg>
