<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 496" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="496" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مصطلحات القلب الأساسية</text>
<rect x="14" y="44" width="300" height="150" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><rect x="14" y="44" width="300" height="26" rx="10" fill="#0f766e"/><text x="164.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >القلب كمضخة</text><text x="304" y="89" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >البطين الأيسر هو المضخة الرئيسية</text><text x="304" y="107.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >الشرايين: تدفع الدم المؤكسج بعيداً عن القلب (A = Away)</text><text x="304" y="126.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >الأوردة: تسحب الدم غير المؤكسج للقلب (V = Vacuum)</text><rect x="326" y="44" width="300" height="150" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><rect x="326" y="44" width="300" height="26" rx="10" fill="#2563eb"/><text x="476" y="62" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >النتاج القلبي CO</text><rect x="336" y="86" width="70" height="44" rx="8" fill="#fb7185"/><text x="371" y="106" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >CO</text><text x="371" y="122" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" >النتاج</text><text x="418" y="114" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a" >=</text><rect x="430" y="86" width="80" height="44" rx="8" fill="#f97316"/><text x="470" y="106" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >SV</text><text x="470" y="122" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" >حجم الضربة</text><text x="520" y="114" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a" >×</text><rect x="530" y="86" width="86" height="44" rx="8" fill="#6366f1"/><text x="573" y="106" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >HR</text><text x="573" y="122" text-anchor="middle" font-size="10.5" font-weight="700" fill="#fff" >معدل القلب</text><text x="476" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >الطبيعي 4–8 لتر/دقيقة | HR 60–100</text><rect x="14" y="206" width="200" height="126" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="1.5"/><rect x="14" y="206" width="200" height="26" rx="10" fill="#0ea5e9"/><text x="114.0" y="224" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >الحمل المسبق Preload</text><text x="204" y="251" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >امتلاء وتمدد عضلة البطين قبل</text><text x="204" y="269" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" > الانقباض</text><rect x="222" y="206" width="200" height="126" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><rect x="222" y="206" width="200" height="26" rx="10" fill="#7c3aed"/><text x="322.0" y="224" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >الحمل البعدي Afterload</text><text x="412" y="251" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >المقاومة التي يواجهها القلب </text><text x="412" y="269" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >لدفع الدم (SVR)</text><rect x="430" y="206" width="200" height="126" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="430" y="206" width="200" height="26" rx="10" fill="#dc2626"/><text x="530.0" y="224" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >كسر القذف EF</text><text x="620" y="251" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >نسبة الدم المطرودة في كل انق</text><text x="620" y="269" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >باض: 55–70% طبيعي، 40% أو أق</text><text x="620" y="287" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >ل سيئ (فشل قلب)</text><rect x="14" y="344" width="300" height="136" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><rect x="14" y="344" width="300" height="26" rx="10" fill="#16a34a"/><text x="164.0" y="362" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >الدورات</text><text x="304" y="389" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >رئوية: دم غير مؤكسج من البطين الأيمن للرئتين ثم للأيسر</text><text x="304" y="407" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >جهازية: دم مؤكسج من القلب لباقي الجسم</text><text x="304" y="425" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >تاجية: تغذي عضلة القلب بالشرايين التاجية</text><rect x="326" y="344" width="300" height="136" rx="10" fill="#fff" stroke="#be185d" stroke-width="1.5"/><rect x="326" y="344" width="300" height="26" rx="10" fill="#be185d"/><text x="476.0" y="362" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >مؤشرات</text><text x="616" y="389" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >BNP: 100 طبيعي، 300+ خفيف، 600+ متوسط، 900+ شديد (فشل قلب)</text><text x="616" y="407" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >ANP: ببتيد ناتريوريتي أذيني</text>
</svg>
