<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 346" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="346" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">علاج القذف المبكر خطوة بخطوة</text>
<rect x="24" y="48" width="592" height="170" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="400" y="66" width="190" height="130" rx="12" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.5"/><text x="495" y="96" text-anchor="middle" font-size="16" font-weight="800" fill="#2563eb">رشّة</text><text x="495" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">سبراي مخدر على الحشفة قبل </text><text x="495" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">الجماع بربع ساعة (حسب الوص</text><text x="495" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">فة)</text><rect x="200" y="66" width="190" height="130" rx="12" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.5"/><text x="295" y="96" text-anchor="middle" font-size="16" font-weight="800" fill="#2563eb">انتظار</text><text x="295" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">بعدها يتم المسح أو الواقي </text><text x="295" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">لو أمكن حسب النشرة</text><text x="295" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a"></text><rect x="0" y="66" width="190" height="130" rx="12" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.5"/><text x="95" y="96" text-anchor="middle" font-size="16" font-weight="800" fill="#2563eb">تدريب</text><text x="95" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">طريقة التوقف والبدء (Stop-</text><text x="95" y="142" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">start) والضغط (Squeeze)</text><text x="95" y="160" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a"></text><rect x="24" y="232" width="592" height="90" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="320" y="262" text-anchor="middle" font-size="14" font-weight="800" fill="#92400e">موضوع حساس: خصوصية، سرية، بدون سخرية</text><text x="320" y="288" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">اسأل عن الصحة العامة والأدوية قبل أي دواء</text>
</svg>