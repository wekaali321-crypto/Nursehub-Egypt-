<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
<rect width="640" height="380" rx="16" fill="#f8fafc"/>
<text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >مضادات القيء ومحفزات حركة المعدة</text>
<rect x="330" y="50" width="300" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="330" y="50" width="300" height="28" rx="10" fill="#0369a1"/>
<text x="480.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >ondansetron (Zofran)</text>
<text x="480.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >الاستعمال: غثيان وقيء العلاج الكيماوي</text>
<text x="480.0" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >أخطر أثر: Torsades de Pointes (QT)</text>
<text x="480.0" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >متلازمة السيروتونين: هياج، ضغط، تسرع قلب، تيبس</text>
<rect x="10" y="50" width="310" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="50" width="310" height="28" rx="10" fill="#b91c1c"/>
<text x="165.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >metoclopramide (Reglan)</text>
<text x="165.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >يسرّع إفراغ المعدة</text>
<text x="165.0" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >مضاد استطباب مع نزف أو انسداد</text>
<text x="165.0" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >أعراض خارج هرمية: مص الشفاه، انتفاخ الخدين، رمش العين</text>
<text x="165.0" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >بلّغ فوراً واستفسر عن الأمر</text>
<rect x="10" y="235" width="620" height="135" rx="10" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5"/>
<text x="320" y="262" text-anchor="middle" font-size="14" font-weight="800" fill="#0369a1" >تذكير</text>
<text x="320" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b" >طفل يتقيأ أثناء الكيماوي: أوقف التسريب، اغسل الخط (flush)، أعط الأوندانسيترون</text>
<text x="320" y="322" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b" >ميتوكلوبراميد: أعطه على معدة فارغة وراقب EPS والخزل المتأخر</text>
</svg>