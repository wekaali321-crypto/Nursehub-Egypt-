<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 332" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="332" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أورام المخ: أنواع وأسباب وأعراض</text>
<rect x="14" y="44" width="300" height="130" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><rect x="14" y="44" width="300" height="26" rx="10" fill="#0369a1"/><text x="164.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >أورام المخ</text><text x="304" y="89" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >كتلة أو نمو خلايا شاذة في المخ</text><text x="304" y="110.5" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >حميد (غير سرطاني) أو خبيث (سرطاني)</text><rect x="326" y="44" width="300" height="130" rx="10" fill="#fff" stroke="#be185d" stroke-width="1.5"/><rect x="326" y="44" width="300" height="26" rx="10" fill="#be185d"/><text x="476.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >الأسباب</text><text x="616" y="89" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >الأولية الخبيثة: غازية يصعب استئصالها</text><text x="616" y="110" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >الأطفال: تعرض لمسرطنات أثناء الحمل</text><text x="616" y="128" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >  والتطور الجنيني</text><text x="616" y="149" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >البالغون: لا عوامل واضحة</text><rect x="14" y="186" width="612" height="130" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="14" y="186" width="612" height="26" rx="10" fill="#dc2626"/><text x="320.0" y="204" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >الأعراض</text><text x="616" y="231" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >1) تشنجات</text><text x="616" y="252.5" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >2) علامات ارتفاع الضغط داخل الجمجمة: صداع، قيء، تغير الحالة الذهنية</text><text x="616" y="274.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >3) قد تتأخر الأعراض حتى المراحل المتقدمة</text>
</svg>
