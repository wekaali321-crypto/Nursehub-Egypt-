<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="360" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التسمم بالرصاص (Lead) عند الأطفال</text><rect x="330" y="50" width="290" height="80" rx="10" fill="#6366f1"/><text x="475.0" y="67.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الآلية والمصدر</text><text x="475.0" y="84.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">تراكم الرصاص بالدم</text><text x="475.0" y="101.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">الأطفال أقل من 6 سنوات الأكثر عرضة</text><text x="475.0" y="118.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">مصادر: دهانات منازل قديمة (قبل 1970) وأنابيب رصاص</text><rect x="20" y="50" width="300" height="80" rx="10" fill="#f59e0b"/><text x="170.0" y="67.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">الاضطراب العصبي المعرفي</text><text x="170.0" y="84.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">خفيف: فرط حركة واندفاع</text><text x="170.0" y="101.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">متوسط: صعوبات تعلم وضعف رؤية وسمع</text><text x="170.0" y="118.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">شديد: نوبات وموت</text><rect x="330" y="145" width="290" height="70" rx="10" fill="#ef4444"/><text x="475.0" y="165.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">أعراض أخرى</text><text x="475.0" y="183.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">أنيميا · نقص وزن</text><text x="475.0" y="201.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">خمول وإرهاق</text><rect x="20" y="145" width="300" height="70" rx="10" fill="#16a34a"/><text x="170.0" y="157.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">تثقيف</text><text x="170.0" y="174.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">فحوص دم متابعة للرصاص</text><text x="170.0" y="191.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">تفتيش المنزل لمصدر الرصاص</text><text x="170.0" y="208.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">غسل اليدين قبل الوجبات</text><rect x="20" y="230" width="600" height="100" rx="10" fill="#0ea5e9"/><text x="320.0" y="257.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج والمتابعة</text><text x="320.0" y="274.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">علاج بالاستخلاب (Chelation) وفحم منشط أو EDTA بحسب الشدة</text><text x="320.0" y="291.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">مستوى 5-14 ميكروغرام/دل: إحالة للخدمات الاجتماعية ومتابعة بعد شهر ثم كل 3-4 أشهر</text><text x="320.0" y="308.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">المعدن المطلوب فحصه لطفل بمنزل مبني 1960: الرصاص</text></svg>