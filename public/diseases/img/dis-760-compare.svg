<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="310" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الكبيبات الكلوية الحاد مقابل المتلازمة الكلوية</text><rect x="502" y="50" width="122" height="32" fill="#0d9488"/><text x="563" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">وجه المقارنة</text><rect x="259" y="50" width="243" height="32" fill="#0d9488"/><text x="381" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التهاب الكبيبات</text><rect x="16" y="50" width="243" height="32" fill="#0d9488"/><text x="138" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المتلازمة الكلوية (Nephrosis)</text><rect x="502" y="82" width="122" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="102" text-anchor="start" font-size="13" fill="#0f172a">الآلية</text><rect x="259" y="82" width="243" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="494" y="102" text-anchor="start" font-size="13" fill="#0f172a">التهاب وتندب في الكلى</text><rect x="16" y="82" width="243" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="251" y="102" text-anchor="start" font-size="13" fill="#0f172a">التهاب وتندب مع فقد كبير للبروتين</text><text x="251" y="121" text-anchor="start" font-size="13" fill="#0f172a">في البول</text><rect x="502" y="132" width="122" height="50" fill="#ccfbf1" stroke="#cbd5e1"/><text x="616" y="152" text-anchor="start" font-size="13" fill="#0f172a">السبب</text><rect x="259" y="132" width="243" height="50" fill="#ccfbf1" stroke="#cbd5e1"/><text x="494" y="152" text-anchor="start" font-size="13" fill="#0f172a">عدوى غالبًا بالمكورات العقدية</text><text x="494" y="171" text-anchor="start" font-size="13" fill="#0f172a">وتزول غالبًا خلال 14 يومًا</text><rect x="16" y="132" width="243" height="50" fill="#ccfbf1" stroke="#cbd5e1"/><text x="251" y="152" text-anchor="start" font-size="13" fill="#0f172a">أمراض مناعية ذاتية مثل الذئبة،</text><text x="251" y="171" text-anchor="start" font-size="13" fill="#0f172a">ومحفزات 4 S</text><rect x="502" y="182" width="122" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="202" text-anchor="start" font-size="13" fill="#0f172a">البول</text><rect x="259" y="182" width="243" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="494" y="202" text-anchor="start" font-size="13" fill="#0f172a">بروتين أقل نسبيًا</text><rect x="16" y="182" width="243" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="251" y="202" text-anchor="start" font-size="13" fill="#0f172a">بروتين عالٍ جدًا</text><rect x="502" y="213" width="122" height="31" fill="#ccfbf1" stroke="#cbd5e1"/><text x="616" y="233" text-anchor="start" font-size="13" fill="#0f172a">الدم</text><rect x="259" y="213" width="243" height="31" fill="#ccfbf1" stroke="#cbd5e1"/><text x="494" y="233" text-anchor="start" font-size="13" fill="#0f172a">WBC مرتفع، حمى</text><rect x="16" y="213" width="243" height="31" fill="#ccfbf1" stroke="#cbd5e1"/><text x="251" y="233" text-anchor="start" font-size="13" fill="#0f172a">ألبومين منخفض (Hypoalbuminemia)</text><rect x="502" y="244" width="122" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="264" text-anchor="start" font-size="13" fill="#0f172a">العلاج</text><rect x="259" y="244" width="243" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="494" y="264" text-anchor="start" font-size="13" fill="#0f172a">أكمل المضادات، قلّل البروتين،</text><text x="494" y="283" text-anchor="start" font-size="13" fill="#0f172a">ACEi/ARBs، مدرّات</text><rect x="16" y="244" width="243" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="251" y="264" text-anchor="start" font-size="13" fill="#0f172a">زد البروتين، عالج السبب،</text><text x="251" y="283" text-anchor="start" font-size="13" fill="#0f172a">ستيرويدات (-sone مثل prednisone)</text></svg>