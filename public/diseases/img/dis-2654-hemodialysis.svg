<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="480" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">غسيل الدم: قبل وأثناء وبعد</text><rect x="330" y="46" width="290" height="110" rx="10" fill="#2563eb"/><text x="475.0" y="82.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">قبل الغسيل</text><text x="475.0" y="97.0" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">وزن وعلامات حيوية</text><text x="475.0" y="112.0" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">افحص الناسور: Thrill وBruit</text><text x="475.0" y="127.0" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">احجز خافضات الضغط (ACEi وBB وCCB ومدرات)</text><rect x="20" y="46" width="300" height="110" rx="10" fill="#7c3aed"/><text x="170.0" y="89.5" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">يُغسل من الدم</text><text x="170.0" y="104.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">المضادات الحيوية • Digoxin</text><text x="170.0" y="119.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">فيتامينات B/C وفوليك: بعد الغسيل</text><rect x="20" y="166" width="600" height="60" rx="10" fill="#fee2e2"/><text x="320.0" y="191.85" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">متلازمة اختلال التوازن (DDS): إزالة سريعة تُورّم خلايا الدماغ فيرتفع ICP</text><text x="320.0" y="207.85" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">اهتياج وتوهان، قيء، صداع • الأولوية: أوقف أو أبطئ الغسيل وأبلغ</text><rect x="20" y="236" width="300" height="100" rx="10" fill="#fef3c7"/><text x="170.0" y="274.5" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">علامات غير طبيعية في الناسور</text><text x="170.0" y="289.5" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">شحوب، تنميل/وخز، نبض ضعيف</text><text x="170.0" y="304.5" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">تأخر امتلاء الشعيرات، ألم، عدوى، نزف</text><rect x="330" y="236" width="290" height="100" rx="10" fill="#dcfce7"/><text x="475.0" y="273.85" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">العناية</text><text x="475.0" y="289.85" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">كرة مطاطية للقبض • وذمة معتادة</text><text x="475.0" y="305.85" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">افحص الرجفة عدة مرات يوميًا</text><rect x="20" y="346" width="600" height="124" rx="10" fill="#e2e8f0"/><text x="320.0" y="386.7" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">ممنوع في ذراع الناسور</text><text x="320.0" y="403.7" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">ملابس أو مجوهرات ضاغطة (ساعة) • قياس ضغط</text><text x="320.0" y="420.7" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">النوم عليها • كريمات ولوشن</text><text x="320.0" y="437.7" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">حمل أكثر من 5 رطل (≈2.3 كجم) بما فيها الحقيبة</text></svg>