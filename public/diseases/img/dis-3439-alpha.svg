<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" width="640" height="306" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="حاصرات ألفا: Phentolamine"><rect width="640" height="306" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">حاصرات ألفا: Phentolamine</text><rect x="326.0" y="46" width="302.0" height="80" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الآلية</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• تنبيه ألفا = انقباض وعائي</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• حجبها = توسع الأوعية</text><rect x="12.0" y="46" width="302.0" height="134" rx="10" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#2e7d4f"/><rect x="12.0" y="60" width="302.0" height="14" fill="#2e7d4f"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الاستعمال</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• ارتفاع الضغط من ورم القواتم</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   (Pheochromocytoma)</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• ضغط مرتفع قبل الجراحة</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• منع/علاج تلف النسيج بعد تسرب dopamine أو</text><text x="302.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">   norepinephrine</text><rect x="326.0" y="138" width="302.0" height="80" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="326.0" y="138" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="326.0" y="152" width="302.0" height="14" fill="#a86a00"/><text x="477.0" y="157" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">آثار</text><text x="616.0" y="186" text-anchor="start" font-size="12.5" fill="#1d2939">• ضعف، انخفاض ضغط انتصابي</text><text x="616.0" y="204" text-anchor="start" font-size="12.5" fill="#1d2939">• اضطراب نظم، هبوط ضغط، تسرع قلب</text><rect x="12.0" y="192" width="302.0" height="98" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="12.0" y="192" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="12.0" y="206" width="302.0" height="14" fill="#b42318"/><text x="163.0" y="211" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">موانع</text><text x="302.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• فرط الحساسية</text><text x="302.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• مرض الشريان التاجي</text><text x="302.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">• لا تداخلات مذكورة</text></svg>