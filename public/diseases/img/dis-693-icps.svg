<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 222" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="222" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تدخلات ICPS</text><rect x="564" y="50" width="60" height="32" fill="#2563eb"/><text x="594" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الحرف</text><rect x="374" y="50" width="191" height="32" fill="#2563eb"/><text x="469" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التدخل</text><rect x="16" y="50" width="358" height="32" fill="#2563eb"/><text x="195" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التفاصيل</text><rect x="564" y="82" width="60" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="102" text-anchor="end" font-size="13" fill="#0f172a">I</text><rect x="374" y="82" width="191" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="556" y="102" text-anchor="end" font-size="13" fill="#0f172a">تثبيت الرأس والعمود الرقبي</text><rect x="16" y="82" width="358" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="366" y="102" text-anchor="end" font-size="13" fill="#0f172a">وضع محايد وتقليب كوحدة (Log roll)</text><rect x="564" y="113" width="60" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="616" y="133" text-anchor="end" font-size="13" fill="#0f172a">C</text><rect x="374" y="113" width="191" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="556" y="133" text-anchor="end" font-size="13" fill="#0f172a">خفض CO2</text><rect x="16" y="113" width="358" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="366" y="133" text-anchor="end" font-size="13" fill="#0f172a">فرط تهوية بأمر الطبيب يخفض ICP بتضييق الأوعية</text><rect x="564" y="144" width="60" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="164" text-anchor="end" font-size="13" fill="#0f172a">P</text><rect x="374" y="144" width="191" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="556" y="164" text-anchor="end" font-size="13" fill="#0f172a">الوضعية</text><rect x="16" y="144" width="358" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="366" y="164" text-anchor="end" font-size="13" fill="#0f172a">رأس 30–35° أو أعلى، لا ثني، لا سعال/عطس/فالسالفا</text><rect x="564" y="175" width="60" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="616" y="195" text-anchor="end" font-size="13" fill="#0f172a">S</text><rect x="374" y="175" width="191" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="556" y="195" text-anchor="end" font-size="13" fill="#0f172a">الشفط</text><rect x="16" y="175" width="358" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="366" y="195" text-anchor="end" font-size="13" fill="#0f172a">10 ثوانٍ أو أقل مع أكسجين 100% قبل وبعد</text></svg>