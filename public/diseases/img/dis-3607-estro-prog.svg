<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 358" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="358" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الإستروجين مقابل البروجستين</text><rect x="520.0" y="48" width="100.0" height="28.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="570.0" y="67.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">البند</text><rect x="270.0" y="48" width="250.0" height="28.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="395.0" y="67.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">الإستروجينات</text><rect x="20.0" y="48" width="250.0" height="28.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="145.0" y="67.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">البروجستينات</text><rect x="520.0" y="76.5" width="100.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="570.0" y="96.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">المصدر</text><rect x="270.0" y="76.5" width="250.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="395.0" y="96.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">جريب المبيض وقليل من قشرة الكظر</text><rect x="20.0" y="76.5" width="250.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="145.0" y="96.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الجسم الأصفر والمشيمة وقليل من</text><text x="145.0" y="114.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الكظر</text><rect x="520.0" y="123.5" width="100.0" height="102.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="570.0" y="143.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الآلية</text><rect x="270.0" y="123.5" width="250.0" height="102.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="395.0" y="143.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">نمو المهبل والرحم والأنابيب</text><text x="395.0" y="161.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">والثدي، يؤثر على الغدد النخامية</text><text x="395.0" y="180.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">التناسلية، احتباس سوائل، يرقق مخاط</text><text x="395.0" y="198.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">عنق الرحم، يحفظ الكالسيوم</text><text x="395.0" y="217.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">والفوسفور</text><rect x="20.0" y="123.5" width="250.0" height="102.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="145.0" y="143.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">يحوّل بطانة الرحم من تكاثرية إلى</text><text x="145.0" y="161.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">إفرازية، ضروري لنمو المشيمة، يثبط</text><text x="145.0" y="180.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الغدد التناسلية النخامية فلا ينضج</text><text x="145.0" y="198.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الجريب</text><rect x="520.0" y="226.0" width="100.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="570.0" y="245.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الاستعمال</text><rect x="270.0" y="226.0" width="250.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="395.0" y="245.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">موانع حمل مع البروجستين، تعويض</text><text x="395.0" y="264.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الإستروجين بعد انقطاع الطمث</text><rect x="20.0" y="226.0" width="250.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="145.0" y="245.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">انقطاع الطمث الثانوي، انتباذ بطانة</text><text x="145.0" y="264.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الرحم، نزف رحمي وظيفي، موانع حمل</text><rect x="520.0" y="273.0" width="100.0" height="65.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="570.0" y="292.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أدوية</text><rect x="270.0" y="273.0" width="250.0" height="65.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="395.0" y="292.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">conjugated estrogens (Premarin)،</text><text x="395.0" y="311.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">esterified estrogens (Menest)،</text><text x="395.0" y="329.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">estropipate</text><rect x="20.0" y="273.0" width="250.0" height="65.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="145.0" y="292.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">progesterone، medroxyprogesterone</text><text x="145.0" y="311.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">(Provera)، norethindrone (Aygestin)</text></svg>