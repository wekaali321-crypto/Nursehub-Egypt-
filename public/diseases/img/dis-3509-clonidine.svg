<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="360" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">clonidine: الآلية والتعليمات الذهبية</text><rect x="380" y="45" width="245" height="100" rx="10" fill="#dbeafe"/><text x="502.5" y="73" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">الآلية</text><text x="502.5" y="91" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">منبّه ألفا 2 في الجهاز العصبي</text><text x="502.5" y="109" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">يقلل الودي المركزي</text><text x="502.5" y="127" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">يقل المعدل والنتاج والضغط</text><rect x="15" y="45" width="345" height="100" rx="10" fill="#dcfce7"/><text x="187.5" y="82" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">الاستعمال</text><text x="187.5" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">خافض ضغط قوي جدًا</text><text x="187.5" y="118" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">يُستعمل أخيرًا إذا لم تستجب الحالة لغيره</text><rect x="15" y="170" width="610" height="70" rx="10" fill="#fee2e2"/><text x="320" y="201" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">الأولوية: لا تتوقف فجأة (Abruptly) — خفّض الجرعة تدريجيًا خلال 2–4 أيام</text><text x="320" y="219" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">قد يحدث ارتفاع ضغط ارتدادي (حوالي 180 انقباضي)</text><rect x="15" y="265" width="300" height="70" rx="10" fill="#fef9c3"/><text x="165" y="296" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">لصقة clonidine</text><text x="165" y="314" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">تُغيَّر كل 7 أيام</text><rect x="330" y="265" width="295" height="70" rx="10" fill="#ffedd5"/><text x="477.5" y="296" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">تجنّب: الكحول، مضادات الهيستامين،</text><text x="477.5" y="314" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">NSAIDs، مثبطات الجهاز العصبي</text></svg>