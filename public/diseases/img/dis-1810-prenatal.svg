<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 421" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="421" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التثقيف قبل الولادة: تغذية ووزن وسلامة</text><rect x="326.0" y="50" width="294.0" height="99" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="326.0" y="50" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="473.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">عام</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="start">• تجنب الكحول والتبغ</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="start">• فحص مناعة الحصبة الألمانية</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="start">• موعد أسنان</text><rect x="20.0" y="50" width="294.0" height="99" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="20.0" y="50" width="294.0" height="28" rx="10" fill="#7c3aed"/><text x="167.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الثلث الثاني</text><text x="304.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="start">• فحص سكر الحمل وتسمم الحمل</text><text x="304.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="start">• Quickening</text><text x="304.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="start">• سونار بطني</text><rect x="326.0" y="161" width="294.0" height="133" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="326.0" y="161" width="294.0" height="28" rx="10" fill="#16a34a"/><text x="473.0" y="20" dy="161" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الوزن</text><text x="610.0" y="207" font-size="12.5" fill="#0f172a" text-anchor="start">• الزيادة المتوقعة 25-35 رطلاً</text><text x="610.0" y="224" font-size="12.5" fill="#0f172a" text-anchor="start">• BMI 18.5-24.9</text><text x="610.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="start">• رطل أسبوعياً في الثلثين 2 و3</text><rect x="20.0" y="161" width="294.0" height="133" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="20.0" y="161" width="294.0" height="28" rx="10" fill="#ea580c"/><text x="167.0" y="20" dy="161" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التغذية</text><text x="304.0" y="207" font-size="12.5" fill="#0f172a" text-anchor="start">• حمض فوليك 400 mcg يومياً</text><text x="304.0" y="224" font-size="12.5" fill="#0f172a" text-anchor="start">• كالسيوم 500 ملجم</text><text x="304.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="start">• حديد من اللحوم والفواكه المجففة</text><text x="304.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="start">• بروتين: دجاج مشوي وجرجير وزبدة فول</text><text x="304.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="start">سوداني وعصير</text><rect x="326.0" y="306" width="294.0" height="99" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><rect x="326.0" y="306" width="294.0" height="28" rx="10" fill="#b91c1c"/><text x="473.0" y="20" dy="306" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">تجنب</text><text x="610.0" y="352" font-size="12.5" fill="#0f172a" text-anchor="start">• ملح وزبدة ودهون ومارجرين زائدة</text><text x="610.0" y="369" font-size="12.5" fill="#0f172a" text-anchor="start">• ألبان غير مبسترة وجبن بري</text><text x="610.0" y="386" font-size="12.5" fill="#0f172a" text-anchor="start">• سلطة بيض جاهزة وساندوتشات الديلي</text></svg>