<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="394" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">ملخص مضاعفات الولادة (1): AFE وعسر الولادة وعسر الكتف والسريعة</text><rect x="330" y="44" width="300" height="150" rx="10" fill="#fff" stroke="#be123c" stroke-width="2"/><rect x="330" y="44" width="300" height="30" rx="10" fill="#be123c"/><rect x="330" y="62" width="300" height="12" fill="#be123c"/><text x="480.0" y="65" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">انصمام السائل الأمنيوسي (AFE)</text><text x="620" y="94" text-anchor="start" font-size="12.5" fill="#0f172a">السائل يتسرب لدم الأم: حالة مميتة</text><text x="620" y="115" text-anchor="start" font-size="12.5" fill="#0f172a">ألم صدر مفاجئ، هبوط ضغط، تسرع</text><text x="620" y="136" text-anchor="start" font-size="12.5" fill="#0f172a">ضيق نفس، زرقة</text><text x="620" y="157" text-anchor="start" font-size="12.5" fill="#0f172a">العلاج: أبلغي الطبيب، سوائل ودم</text><text x="620" y="178" text-anchor="start" font-size="12.5" fill="#0f172a">أكسجين، مساعدة في التنبيب</text><rect x="10" y="44" width="310" height="150" rx="10" fill="#fff" stroke="#6d28d9" stroke-width="2"/><rect x="10" y="44" width="310" height="30" rx="10" fill="#6d28d9"/><rect x="10" y="62" width="310" height="12" fill="#6d28d9"/><text x="165.0" y="65" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">عسر الولادة (Dystocia)</text><text x="310" y="94" text-anchor="start" font-size="12.5" fill="#0f172a">ولادة بطيئة أو صعبة</text><text x="310" y="115" text-anchor="start" font-size="12.5" fill="#0f172a">جنين كبير (&gt; 8 أرطال 13 أونصة)</text><text x="310" y="136" text-anchor="start" font-size="12.5" fill="#0f172a">BMI &gt; 25، عمر متقدم، خصوبة صعبة</text><text x="310" y="157" text-anchor="start" font-size="12.5" fill="#0f172a">اتساع متوقف (مثلًا عند 4 سم)</text><text x="310" y="178" text-anchor="start" font-size="12.5" fill="#0f172a">تغيير وضع، أوكسيتوسين، بضع أغشية</text><rect x="330" y="208" width="300" height="170" rx="10" fill="#fff" stroke="#b45309" stroke-width="2"/><rect x="330" y="208" width="300" height="30" rx="10" fill="#b45309"/><rect x="330" y="226" width="300" height="12" fill="#b45309"/><text x="480.0" y="229" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">عسر الكتف (Shoulder dystocia)</text><text x="620" y="258" text-anchor="start" font-size="12.5" fill="#0f172a">الرأس يخرج ويعلق الكتف خلف العانة</text><text x="620" y="279" text-anchor="start" font-size="12.5" fill="#0f172a">أكثر من 5 دقائق = خطر اختناق</text><text x="620" y="300" text-anchor="start" font-size="12.5" fill="#0f172a">McRoberts: ثني الساقين نحو البطن</text><text x="620" y="321" text-anchor="start" font-size="12.5" fill="#0f172a">ضغط فوق العانة للأسفل</text><text x="620" y="342" text-anchor="start" font-size="12.5" fill="#0f172a">سجّلي الوقت وأعلني مروره واطلبي مساعدة</text><text x="620" y="363" text-anchor="start" font-size="12.5" fill="#0f172a">ممنوع: مثبطات رحم، ضغط قاع، ملقط/شفط</text><rect x="10" y="208" width="310" height="170" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/><rect x="10" y="208" width="310" height="30" rx="10" fill="#0f766e"/><rect x="10" y="226" width="310" height="12" fill="#0f766e"/><text x="165.0" y="229" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الولادة السريعة (Precipitous)</text><text x="310" y="258" text-anchor="start" font-size="12.5" fill="#0f172a">خلال 3 ساعات أو أقل من بدء الانقباضات</text><text x="310" y="279" text-anchor="start" font-size="12.5" fill="#0f172a">الخطر: انقباضات مفرطة، أوكسيتوسين،</text><text x="310" y="300" text-anchor="start" font-size="12.5" fill="#0f172a">تعدد ولادات</text><text x="310" y="321" text-anchor="start" font-size="12.5" fill="#0f172a">الأم: نزف، تمزق رحم، AFE</text><text x="310" y="342" text-anchor="start" font-size="12.5" fill="#0f172a">المولود: نزيف جمجمة، نقص أكسجة</text><text x="310" y="363" text-anchor="start" font-size="12.5" fill="#0f172a">دفّئيه وجلد لجلد، لا تشدي الحبل</text></svg>