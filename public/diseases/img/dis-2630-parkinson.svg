<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="420" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">باركنسون: دوبامين منخفض وأسيتيل كولين مرتفع</text><rect x="330" y="46" width="290" height="62" rx="10" fill="#7c3aed"/><text x="475.0" y="72.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">موت عصبونات الحركة</text><text x="475.0" y="88.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">نقص Dopamine وزيادة Acetylcholine (لعاب وإفرازات)</text><rect x="20" y="46" width="300" height="62" rx="10" fill="#0891b2"/><text x="170.0" y="72.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3 علامات رئيسية</text><text x="170.0" y="88.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">مشية جرجرة وقلة تأرجح الذراع • Pill rolling • رعشة راحة</text><rect x="20" y="118" width="600" height="36" rx="10" fill="#e2e8f0"/><text x="320.0" y="140.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">بطء الحركة (Bradykinesia) • عسر بلع وسيلان لعاب</text><rect x="20" y="162" width="600" height="70" rx="10" fill="#fee2e2"/><text x="320.0" y="184.85" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">المجرى الهوائي أولوية</text><text x="320.0" y="200.85" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">شفط جاهز بجانب السرير • غذاء مهروس لقيمات صغيرة • مناديل • مُثخّن للسوائل</text><text x="320.0" y="216.85" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">رأس مرتفع (High Fowler) وجلوس منتصب</text><rect x="20" y="242" width="300" height="84" rx="10" fill="#dcfce7"/><text x="170.0" y="257.5" text-anchor="middle" font-size="10" font-weight="700" fill="#14532d">الأدوية</text><text x="170.0" y="272.5" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">Levodopa + Carbidopa (تجنب البروتين)</text><text x="170.0" y="287.5" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">Pramipexole (ناهض دوبامين)</text><text x="170.0" y="302.5" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">Benztropine للرعشة</text><text x="170.0" y="317.5" text-anchor="middle" font-size="10" font-weight="600" fill="#14532d">Selegiline (MAOI يرفع الدوبامين)</text><rect x="330" y="242" width="290" height="84" rx="10" fill="#fef3c7"/><text x="475.0" y="263.85" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">مفاهيم</text><text x="475.0" y="279.85" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">تقل الرعشة عند الانشغال بنشاط</text><text x="475.0" y="295.85" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">الهدف الواقعي: أفضل وظيفة ضمن حدوده</text><text x="475.0" y="311.85" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">«سيشفيني العلاج» = يحتاج تثقيفًا</text><rect x="20" y="336" width="600" height="70" rx="10" fill="#e0f2fe"/><text x="320.0" y="366.85" text-anchor="middle" font-size="11" font-weight="700" fill="#0c4a6e">تشخيص: CT ضمور دماغي • بطء حركة الجهاز الهضمي</text><text x="320.0" y="382.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0c4a6e">استجابة إيجابية لجرعة منخفضة من Levodopa/Carbidopa</text></svg>