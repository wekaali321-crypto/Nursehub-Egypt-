<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="396" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">ملخص مضاعفات الولادة: DIC والعقي ومتلازمة الشفط</text><rect x="330" y="44" width="300" height="196" rx="10" fill="#fff" stroke="#be123c" stroke-width="2"/><rect x="330" y="44" width="300" height="30" rx="10" fill="#be123c"/><rect x="330" y="62" width="300" height="12" fill="#be123c"/><text x="480.0" y="65" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">DIC (تخثر منتشر داخل الأوعية)</text><text x="620" y="94" text-anchor="start" font-size="12.5" fill="#0f172a">استهلاك عوامل التخثر والصفائح</text><text x="620" y="115" text-anchor="start" font-size="12.5" fill="#0f172a">نزف داخلي وخارجي معًا</text><text x="620" y="136" text-anchor="start" font-size="12.5" fill="#0f172a">الأسباب: انفصال المشيمة، موت الجنين</text><text x="620" y="157" text-anchor="start" font-size="12.5" fill="#0f172a">نزف من مواضع الوخز، نمشات وكدمات</text><text x="620" y="178" text-anchor="start" font-size="12.5" fill="#0f172a">ضيق نفس، قصور كلوي</text><text x="620" y="199" text-anchor="start" font-size="12.5" fill="#0f172a">الأولوية: تحاليل التخثر والفيبرينوجين</text><text x="620" y="220" text-anchor="start" font-size="12.5" fill="#0f172a">والصفائح، ثم دم وسوائل وأكسجين</text><rect x="10" y="44" width="310" height="196" rx="10" fill="#fff" stroke="#92400e" stroke-width="2"/><rect x="10" y="44" width="310" height="30" rx="10" fill="#92400e"/><rect x="10" y="62" width="310" height="12" fill="#92400e"/><text x="165.0" y="65" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">السائل الملوّن بالعقي (Meconium)</text><text x="310" y="94" text-anchor="start" font-size="12.5" fill="#0f172a">أخضر أو أصفر أو بني، ورائحة كريهة</text><text x="310" y="115" text-anchor="start" font-size="12.5" fill="#0f172a">أشيع مع: مقعدي، ضائقة جنين،</text><text x="310" y="136" text-anchor="start" font-size="12.5" fill="#0f172a">حمل متأخر (بعد 40 أسبوعًا)</text><text x="310" y="157" text-anchor="start" font-size="12.5" fill="#0f172a">يدل على نقص أكسجة الجنين</text><text x="310" y="178" text-anchor="start" font-size="12.5" fill="#0f172a">التجهيز: إنعاش المولود وشفط رغامي</text><text x="310" y="199" text-anchor="start" font-size="12.5" fill="#0f172a">مع تهوية بالأنبوب الرغامي</text><text x="310" y="220" text-anchor="start" font-size="12.5" fill="#0f172a">سائل كريه = إنذار عدوى ومضاعفات</text><rect x="10" y="254" width="620" height="126" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/><rect x="10" y="254" width="620" height="30" rx="10" fill="#0f766e"/><rect x="10" y="272" width="620" height="12" fill="#0f766e"/><text x="320.0" y="275" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">متلازمة شفط العقي (MAS)</text><text x="620" y="304" text-anchor="start" font-size="12.5" fill="#0f172a">المولود يستنشق خليط العقي والسائل فتتعطل المبادلة الغازية</text><text x="620" y="325" text-anchor="start" font-size="12.5" fill="#0f172a">عوامل الخطر: أكثر من 40 أسبوعًا، سكري، ضغط، طلق طويل أو عسير</text><text x="620" y="346" text-anchor="start" font-size="12.5" fill="#0f172a">المضاعفات: ضائقة جنين، استرواح الصدر (Pneumothorax)، اختناق ولادي</text><text x="620" y="367" text-anchor="start" font-size="12.5" fill="#0f172a">من أهم أسباب المرض الشديد والوفاة عند حديثي الولادة</text></svg>