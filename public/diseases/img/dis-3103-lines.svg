<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="420" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع القسطرة الوريدية المركزية وقسطرة فوق الجافية</text>
  <rect x="330" y="50" width="290" height="150" rx="10" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">المركزي النفقي (Tunneled)</text><text x="608" y="96" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• علاج وريدي طويل الأمد</text><text x="608" y="115" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• يُدخل في غرفة العمليات</text><text x="608" y="134" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• جهاز تسريب متقطع (نظام مغلق)</text><text x="608" y="153" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• تُغسل بهيبارين مخفف</text><rect x="20" y="50" width="290" height="150" rx="10" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">المنفذ الوريدي (Port) المزروع</text><text x="298" y="96" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• تحت الجلد جراحيًا</text><text x="298" y="115" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• يُجسّ ثم يُدخل بإبرة non-coring</text><text x="298" y="134" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• غسل دوري بالهيبارين</text><rect x="330" y="215" width="290" height="190" rx="10" fill="#fef9c3" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="237" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">خط PICC</text><text x="608" y="261" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• علاج طويل غالبًا بالمنزل</text><text x="608" y="280" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• الوريد الباسيليكي الأشهر</text><text x="608" y="299" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• الطرف في تحت الترقوة/الأجوف العلوي</text><text x="608" y="318" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• نزف بسيط عند الإدخال طبيعي؛ بعد 24 ساعة يُبلَّغ</text><text x="608" y="337" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• التهاب الوريد شائع</text><rect x="20" y="215" width="290" height="190" rx="10" fill="#fce7f3" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="237" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">قسطرة فوق الجافية (Epidural)</text><text x="298" y="261" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• غير مركزية، في الحيز فوق الجافية</text><text x="298" y="280" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• لإعطاء مسكنات</text><text x="298" y="299" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• قيّم العلامات الحيوية والتنفس</text><text x="298" y="318" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• افحص الموضع وجهاز التسريب</text><text x="298" y="337" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• اسحب قبل الحقن؛ أكثر من 1 mL</text><text x="298" y="356" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• سائل رائق أو دم = لا تحقن وبلّغ</text>
</svg>
