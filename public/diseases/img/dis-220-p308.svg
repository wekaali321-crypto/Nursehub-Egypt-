<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 556" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="556" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">القرحة الهضمية PUD</text>
<rect x="346.0" y="52" width="320.0" height="117.0" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="346.0" y="52" width="320.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="506.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">معدية Gastric</text>
<text x="656.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• الألم يزيد مع الأكل بعد 30–60 دقيقة</text>
<text x="656.0" y="115.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• فقد وزن</text>
<text x="656.0" y="134.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قيء دموي</text>
<text x="656.0" y="153.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• "Epigastric/ظهر"</text>
<rect x="14.0" y="52" width="320.0" height="117.0" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="14.0" y="52" width="320.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="174.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">اثني عشرية Duodenal</text>
<text x="324.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• الألم يخف مع الأكل ويزيد بعد 2–3 ساعات</text>
<text x="324.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">وليلاً</text>
<text x="324.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• زيادة وزن</text>
<text x="324.0" y="151.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• براز أسود قطراني</text>
<rect x="346.0" y="181.0" width="320.0" height="132.25" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.2"/>
<rect x="346.0" y="181.0" width="320.0" height="26" rx="10" fill="#6366f1" fill-opacity="1" stroke="#6366f1" stroke-width="1.2"/>
<text x="506.0" y="199.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأسباب</text>
<text x="656.0" y="225.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• بكتيريا H. pylori</text>
<text x="656.0" y="244.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• مضادات الالتهاب NSAIDs: نابروكسين،</text>
<text x="656.0" y="261.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">إندوميثاسين، إيبوبروفين</text>
<text x="656.0" y="280.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• التوتر يطيل المرض</text>
<rect x="14.0" y="181.0" width="320.0" height="132.25" rx="10" fill="#7f1d1d" fill-opacity="0.1" stroke="#7f1d1d" stroke-width="1.2"/>
<rect x="14.0" y="181.0" width="320.0" height="26" rx="10" fill="#7f1d1d" fill-opacity="1" stroke="#7f1d1d" stroke-width="1.2"/>
<text x="174.0" y="199.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">المضاعفات</text>
<text x="324.0" y="225.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• انثقاب = بريتوان وإنتان: حمى فوق 100.3ف، ألم</text>
<text x="324.0" y="242.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">ارتدادي، بطن كاللوح، قلق، تسرع قلب وتنفس (أبلغ</text>
<text x="324.0" y="259.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الطبيب)</text>
<text x="324.0" y="278.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• نزف: براز قطراني وقيء دموي</text>
<text x="324.0" y="298.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• انسداد مخرج المعدة</text>
<rect x="346.0" y="325.25" width="320.0" height="203.25" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="346.0" y="325.25" width="320.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="506.0" y="343.25" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الفحوص والتثقيف</text>
<text x="656.0" y="369.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• المنظار EGD أو أشعة الباريوم العلوية</text>
<text x="656.0" y="388.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• صيام ومنع تدخين 8 ساعات قبل الإجراء</text>
<text x="656.0" y="407.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• المتوقع: مغص أثناءه وبراز طباشيري أبيض بعد</text>
<text x="656.0" y="425.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الباريوم</text>
<text x="656.0" y="444.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• اشرب سوائل أكثر وخذ ملينات لطرد الصبغة (حسب</text>
<text x="656.0" y="461.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الطبيب)</text>
<rect x="14.0" y="325.25" width="320.0" height="203.25" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="14.0" y="325.25" width="320.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="174.0" y="343.25" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأدوية والتثقيف</text>
<text x="324.0" y="369.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• مضادات حيوية لـH. pylori: أموكسيسيلين،</text>
<text x="324.0" y="386.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">كلاريثرومايسين، تتراسيكلين، ميترونيدازول،</text>
<text x="324.0" y="403.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">بزموت (بيبتو-بزمول)</text>
<text x="324.0" y="423.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• مخفضات الحمض: مضادات حموضة، H2 (رانيتيدين)،</text>
<text x="324.0" y="440.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">PPI (أوميبرازول)</text>
<text x="324.0" y="459.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• حماة الغشاء: سوكرالفات، ميزوبروستول (لا</text>
<text x="324.0" y="476.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">للحامل)</text>
<text x="324.0" y="496.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تجنب الحار والدهني والمقلي والحمضي والكافيين</text>
<text x="324.0" y="513.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">والكحول والتدخين وNSAIDs، وأبلغ عن براز أسود</text>
</svg>
