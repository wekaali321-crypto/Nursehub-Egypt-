<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="342" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الفطريات الجلدية (Tinea)</text><rect x="330" y="52" width="300" height="129.0" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأنواع</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• Tinea = السعفة (Ringworm)</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• Tinea pedis = قدم الرياضي</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• Tinea capitis فروة الرأس</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• Tinea corporis الجسم</text><text x="620" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• كلها شديدة العدوى على سطح الجلد</text><rect x="10" y="52" width="310" height="94.19999999999999" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأعراض</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• طفح دائري ذو حافة حمراء ووسط شفاف</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قشور وحكة</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• حول الأصابع: رطوبة وحكة (قدم الرياضي)</text><rect x="330" y="189.0" width="300" height="129.0" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M330,199.0 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#16a34a"/><text x="480.0" y="208.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج</text><text x="620" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• جريزيوفولفين: السعفة (Corporis) وفروة</text><text x="620" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الرأس</text><text x="620" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• يستغرق أسابيع إلى شهورًا</text><text x="620" y="284.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• لا توقفه عند اختفاء الحكة</text><text x="620" y="301.59999999999997" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• يُمتص أفضل مع وجبة عالية الدهون</text><rect x="10" y="189.0" width="310" height="111.6" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M10,199.0 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#dc2626"/><text x="165.0" y="208.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التثقيف (أولوية)</text><text x="310" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أهم نقطة: منع انتشار العدوى</text><text x="310" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• لا مشاركة فرش أو مناشف أو قبعات أو ملابس</text><text x="310" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• جوارب قطنية، أصابع نظيفة وجافة</text><text x="310" y="284.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• نقع الأصابع في محلول بورو</text></svg>