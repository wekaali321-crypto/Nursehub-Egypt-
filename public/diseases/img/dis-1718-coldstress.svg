<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="244" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">البرودة (Cold stress) عند المولود</text><rect x="426" y="46" width="193" height="152" rx="12" fill="#bae6fd"/><text x="522.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">العلامات</text><text x="522.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">خمول وتهيّج</text><text x="522.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">بطء قلب وتسرع تنفس ونقص أكسجة</text><text x="522.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">نقص سكر وعدم تحمل رضعة</text><text x="522.5" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">ضعف مص وبكاء وقلة توتر</text><text x="522.5" y="176" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">لا يرتعش (لا قدرة على الارتعاش)</text><rect x="223" y="46" width="193" height="152" rx="12" fill="#bbf7d0"/><text x="319.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الأسباب</text><text x="319.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">طبقة دهن تحت الجلد رقيقة</text><text x="319.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">مولود مبلل (تبخر)</text><rect x="20" y="46" width="193" height="152" rx="12" fill="#fde68a"/><text x="116.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الوقاية والتدخل</text><text x="116.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">جلد لجلد</text><text x="116.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">جفّف فورًا وضع قبعة</text><text x="116.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">دفاية إشعاعية قبل الوزن</text><text x="116.5" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">بطانيات مدفأة</text><text x="116.5" y="176" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">حاضنة مدفأة للنقل</text><text x="320" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">المولود الدافئ يقلل نقص السكر ونقص الأكسجة واليرقان</text>
</svg>
