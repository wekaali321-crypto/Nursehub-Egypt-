<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 378" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="378" rx="16" fill="#f8fafc"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">اختيار المضاد في الالتهاب السفلي حسب نتيجة تحليل البول (كما في المرجع)</text><rect x="450" y="48" width="160" height="70" rx="10" fill="#22c55e" stroke="#22c55e" stroke-width="2"/><text x="530.0" y="88.2" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">صديد 5–30</text><rect x="30" y="48" width="410" height="70" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/><text x="235.0" y="78.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">Uvamine retard (نيتروفيورانتوين)</text><text x="235.0" y="97.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">كل 12 ساعة لمدة أسبوع</text><rect x="450" y="130" width="160" height="70" rx="10" fill="#eab308" stroke="#eab308" stroke-width="2"/><text x="530.0" y="170.2" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">صديد 30–50</text><rect x="30" y="130" width="410" height="70" rx="10" fill="#fff" stroke="#eab308" stroke-width="2"/><text x="235.0" y="160.1" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">Cipro 500 أو Septrin كل 12 ساعة أسبوع</text><text x="235.0" y="179.1" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">أو Levoflox/Tavacin يومياً 5 أيام</text><rect x="450" y="212" width="160" height="70" rx="10" fill="#f97316" stroke="#f97316" stroke-width="2"/><text x="530.0" y="252.2" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">صديد أكتر من 50</text><rect x="30" y="212" width="410" height="70" rx="10" fill="#fff" stroke="#f97316" stroke-width="2"/><text x="235.0" y="242.1" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">مزرعة أولاً</text><text x="235.0" y="261.1" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">ثم Ciprofloxacin تجريبي لحد النتيجة</text><rect x="30" y="300" width="580" height="64" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="320.0" y="327.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">تحديث: اختيار المضاد بيعتمد على الأعراض والمزرعة والمقاومة المحلية</text><text x="320.0" y="345.2" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">مش على عدد الصديد فقط — القائمة دي للتعرّف على روشتات المرجع</text></svg>