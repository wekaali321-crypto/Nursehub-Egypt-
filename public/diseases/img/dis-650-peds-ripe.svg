<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="292" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أدوية السل RIPE: ما يُراقب</text><rect x="20" y="46" width="600" height="30" rx="8" fill="#1e3a8a"/><text x="555.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الدواء</text><text x="255.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">تنبيه تمريضي</text><rect x="20" y="76" width="600" height="48" fill="#e0e7ff"/><text x="555.0" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Rifampin (R)</text><text x="255.0" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">لون برتقالي-أحمر طبيعي بالدموع والبول والعرق؛ نظارات بدل العدسات؛ موانع</text><text x="255.0" y="114" text-anchor="middle" font-size="12.5"  fill="#0f172a">الحمل الفموية تفشل → وسيلة غير هرمونية؛ راقب اليرقان</text><rect x="20" y="124" width="600" height="66" fill="#fff"/><text x="555.0" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Isoniazid INH (I)</text><text x="255.0" y="144" text-anchor="middle" font-size="12.5"  fill="#0f172a">الأكثر اختبارًا؛ يعيق فيتامين B6 → اعتلال أعصاب؛ يُعطى B6 25–50</text><text x="255.0" y="162" text-anchor="middle" font-size="12.5"  fill="#0f172a">مجم/يوم؛ أبلغ عن تنميل/وخز/ترنح؛ سمية كبدية: يرقان، بول داكن، تعب،</text><text x="255.0" y="180" text-anchor="middle" font-size="12.5"  fill="#0f172a">ارتفاع AST/ALT → احجز الدواء؛ لا كحول</text><rect x="20" y="190" width="600" height="30" fill="#e0e7ff"/><text x="555.0" y="210" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Pyrazinamide (P)</text><text x="255.0" y="210" text-anchor="middle" font-size="12.5"  fill="#0f172a">قليل الأسئلة؛ كلها سامة للكبد</text><rect x="20" y="220" width="600" height="30" fill="#fff"/><text x="555.0" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Ethambutol (E)</text><text x="255.0" y="240" text-anchor="middle" font-size="12.5"  fill="#0f172a">العين: تشوش رؤية وتغير ألوان؛ فحص عين أساسي ودوري</text><text x="320" y="272" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">كل أدوية السل سامة للكبد — الجرعات للتعلّم وتراجع مع الطبيب</text>
</svg>
