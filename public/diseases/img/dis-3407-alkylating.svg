<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" width="640" height="324" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="مؤثرات الألكلة (Alkylating Agents)"><rect width="640" height="324" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">مؤثرات الألكلة (Alkylating Agents)</text><rect x="326.0" y="46" width="302.0" height="134" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">ماذا تفعل؟</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• تُتلف الخلية (تؤلكل الـDNA) فتموت</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   الخلايا السرطانية أكثر من السليمة</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• غير نوعية لدورة الخلية (Cell cycle non-</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">   specific)</text><text x="616.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• الاستعمال: علاج السرطان</text><rect x="12.0" y="46" width="302.0" height="152" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="12.0" y="60" width="302.0" height="14" fill="#b42318"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الآثار الجانبية</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• تثبيط نقي العظم (أنيميا، قلة بيض، قلة</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   صفائح)</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• التهاب الفم (Stomatitis)</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• إسهال</text><text x="302.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• تساقط الشعر</text><text x="302.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">• الأشيع: قلة البيض وقلة الصفائح</text><rect x="326.0" y="192" width="302.0" height="116" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="326.0" y="192" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="326.0" y="206" width="302.0" height="14" fill="#a86a00"/><text x="477.0" y="211" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">موانع الاستعمال</text><text x="616.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• قلة البيض/الصفائح، أنيميا</text><text x="616.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• عدوى خطيرة، قصور كلوي شديد</text><text x="616.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">• حساسية للدواء</text><text x="616.0" y="294" text-anchor="start" font-size="12.5" fill="#1d2939">• الحمل</text><rect x="12.0" y="210" width="302.0" height="98" rx="10" fill="#efe9fb" stroke="#6a4bb5" stroke-width="1.2"/><rect x="12.0" y="210" width="302.0" height="28" rx="10" fill="#6a4bb5"/><rect x="12.0" y="224" width="302.0" height="14" fill="#6a4bb5"/><text x="163.0" y="229" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التداخلات</text><text x="302.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• Phenytoin: زيادة خطر التشنج</text><text x="302.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">• Aminoglycosides: سمية كلوية وسمعية</text><text x="302.0" y="294" text-anchor="start" font-size="12.5" fill="#1d2939">• مدرّات العروة: سمية سمعية</text></svg>