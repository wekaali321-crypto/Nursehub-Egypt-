<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 265" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="265" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">أجهزة مراقبة الجنين</text><rect x="20" y="50" width="290" height="190" rx="12" fill="#e0f2fe"/><text x="165" y="78" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">خارجي (External)</text><text x="165" y="106" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">سونو/دوبلر: لنبض الجنين</text><text x="165" y="128" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">يوضع عند نقطة أقصى نبض (PMI) أعلى ظهر الجنين</text><text x="165" y="150" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">رأسي: أسفل بطن الأم، مقعدي: أعلى البطن</text><text x="165" y="176" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">توكو (Toco): لنشاط الرحم، يوضع أعلى البطن</text><text x="165" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#0369a1">غير جراحي</text><rect x="330" y="50" width="290" height="190" rx="12" fill="#fee2e2"/><text x="475" y="78" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">داخلي (FSE): قطب فروة الرأس</text><text x="475" y="106" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">سلك رفيع على فروة رأس الجنين عبر العنق</text><text x="475" y="128" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">أدق ولا تؤثر فيه الحركة، لحالات الخطورة</text><text x="475" y="152" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">شروطه: الكيس الأمنيوسي منفجر</text><text x="475" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">واتساع العنق 2 سم على الأقل</text><text x="475" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">خطر عدوى مرتفع</text>
</svg>
