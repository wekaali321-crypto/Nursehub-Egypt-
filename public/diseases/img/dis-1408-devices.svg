<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 379" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="379" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أجهزة توصيل الأكسجين</text><rect x="498" y="50" width="126" height="32" fill="#2563eb"/><text x="561" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الجهاز</text><rect x="393" y="50" width="105" height="32" fill="#2563eb"/><text x="446" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التدفق</text><rect x="289" y="50" width="105" height="32" fill="#2563eb"/><text x="341" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">FiO2 التقريبي</text><rect x="16" y="50" width="273" height="32" fill="#2563eb"/><text x="152" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ملاحظات</text><rect x="498" y="82" width="126" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="102" text-anchor="start" font-size="13" fill="#0f172a">قنية أنفية NC</text><rect x="393" y="82" width="105" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="490" y="102" text-anchor="start" font-size="13" fill="#0f172a">1–6 L/min</text><rect x="289" y="82" width="105" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="385" y="102" text-anchor="start" font-size="13" fill="#0f172a">25–45%</text><rect x="16" y="82" width="273" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="281" y="102" text-anchor="start" font-size="13" fill="#0f172a">استخدام قصير بعد الجراحة؛ الطويل يجفف</text><text x="281" y="121" text-anchor="start" font-size="13" fill="#0f172a">المخاط فيُضاف ترطيب</text><rect x="498" y="132" width="126" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="616" y="152" text-anchor="start" font-size="13" fill="#0f172a">قناع وجه بسيط</text><rect x="393" y="132" width="105" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="490" y="152" text-anchor="start" font-size="13" fill="#0f172a">6–10 L/min</text><rect x="289" y="132" width="105" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="385" y="152" text-anchor="start" font-size="13" fill="#0f172a">40–60%</text><rect x="16" y="132" width="273" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="281" y="152" text-anchor="start" font-size="13" fill="#0f172a">بديل لإعادة التنفس الجزئي والكلي</text><rect x="498" y="163" width="126" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="183" text-anchor="start" font-size="13" fill="#0f172a">قناع إعادة تنفس</text><text x="616" y="202" text-anchor="start" font-size="13" fill="#0f172a">جزئي</text><rect x="393" y="163" width="105" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="490" y="183" text-anchor="start" font-size="13" fill="#0f172a">6–10 L/min</text><rect x="289" y="163" width="105" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="385" y="183" text-anchor="start" font-size="13" fill="#0f172a">35–60%</text><rect x="16" y="163" width="273" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="281" y="183" text-anchor="start" font-size="13" fill="#0f172a">يشبه NRB لكن بدون صمامات الرفرفة</text><text x="281" y="202" text-anchor="start" font-size="13" fill="#0f172a">الجانبية</text><rect x="498" y="213" width="126" height="69" fill="#dbeafe" stroke="#cbd5e1"/><text x="616" y="233" text-anchor="start" font-size="13" fill="#0f172a">قناع غير معيد</text><text x="616" y="252" text-anchor="start" font-size="13" fill="#0f172a">للتنفس NRB</text><rect x="393" y="213" width="105" height="69" fill="#dbeafe" stroke="#cbd5e1"/><text x="490" y="233" text-anchor="start" font-size="13" fill="#0f172a">10–15 L/min</text><rect x="289" y="213" width="105" height="69" fill="#dbeafe" stroke="#cbd5e1"/><text x="385" y="233" text-anchor="start" font-size="13" fill="#0f172a">60–100%</text><rect x="16" y="213" width="273" height="69" fill="#dbeafe" stroke="#cbd5e1"/><text x="281" y="233" text-anchor="start" font-size="13" fill="#0f172a">طوارئ وتسمم CO؛ إذا انكمشت الحقيبة</text><text x="281" y="252" text-anchor="start" font-size="13" fill="#0f172a">عند الشهيق = زد التدفق؛ لا تفتح</text><text x="281" y="271" text-anchor="start" font-size="13" fill="#0f172a">صمامات الرفرفة</text><rect x="498" y="282" width="126" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="302" text-anchor="start" font-size="13" fill="#0f172a">قناع فنتوري</text><text x="616" y="321" text-anchor="start" font-size="13" fill="#0f172a">Venturi</text><rect x="393" y="282" width="105" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="490" y="302" text-anchor="start" font-size="13" fill="#0f172a">FiO2 24–60%</text><text x="490" y="321" text-anchor="start" font-size="13" fill="#0f172a">(4–10)</text><rect x="289" y="282" width="105" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="385" y="302" text-anchor="start" font-size="13" fill="#0f172a">الأدق</text><rect x="16" y="282" width="273" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="281" y="302" text-anchor="start" font-size="13" fill="#0f172a">COPD غير المستقر الذي لا يتحمل تغير</text><text x="281" y="321" text-anchor="start" font-size="13" fill="#0f172a">التركيز</text><rect x="498" y="332" width="126" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="616" y="352" text-anchor="start" font-size="13" fill="#0f172a">خيمة الوجه</text><rect x="393" y="332" width="105" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="490" y="352" text-anchor="start" font-size="13" fill="#0f172a">—</text><rect x="289" y="332" width="105" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="385" y="352" text-anchor="start" font-size="13" fill="#0f172a">ترطيب عالٍ</text><rect x="16" y="332" width="273" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="281" y="352" text-anchor="start" font-size="13" fill="#0f172a">إصابات وحروق الوجه</text></svg>