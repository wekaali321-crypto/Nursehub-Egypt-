<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="540" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الأسيستول، الحمل، وما بعد الإنعاش</text>
  <rect x="330" y="50" width="290" height="170" rx="10" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">علاج الأسيستول</text><text x="608" y="96" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• 1) CPR عالي الجودة (الأولوية)</text><text x="608" y="121" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• 2) إبينفرين كل 3–5 دقائق</text><text x="608" y="146" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• 3) تنبيب وتهوية</text><text x="608" y="171" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• 4) عالج الأسباب (Hs &amp; Ts)</text><text x="608" y="196" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• لا صدمة: Asystole وPEA</text><rect x="20" y="50" width="290" height="170" rx="10" fill="#fce7f3" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">الإنعاش في الحمل</text><text x="298" y="96" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• الضغطات أعلى قليلًا على القص</text><text x="298" y="121" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• أزح الرحم يدويًا لليسار</text><text x="298" y="146" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• أو بطانية تحت الجنب الأيمن</text><text x="298" y="171" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• ليس على الظهر (Supine)</text><text x="298" y="196" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• لو لم تعد الدورة بعد 4 دقائق:</text><text x="298" y="221" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• قيصرية فورية (نحو 5 دقائق)</text><rect x="20" y="235" width="600" height="130" rx="10" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="257" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">بعد عودة النبض (Post-resuscitation)</text><text x="608" y="281" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• فاقد الوعي ولا ينفذ الأوامر ← تبريد علاجي (Hypothermia)</text><text x="608" y="308" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• مثال: سوائل باردة وفق البروتوكول، ومراقبة مستمرة</text><text x="320" y="395" text-anchor="middle" font-size="12.5" font-weight="500" fill="#475569">الأسباب العكسية Hs &amp; Ts: نقص أكسجين، فشل تنفسي، سموم، جلطات، أملاح</text><rect x="20" y="410" width="600" height="110" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/><text x="320" y="438" text-anchor="middle" font-size="14" font-weight="800" fill="#1e293b">تذكير الامتحان</text><text x="320" y="466" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">منقذ وحيد: ابدأ ضغطات الصدر قبل طلب النجدة (في الاختبار).</text><text x="320" y="490" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">الإنعاش أولًا لأنه يوفر الأكسجين والتروية للدماغ فورًا.</text>
</svg>
