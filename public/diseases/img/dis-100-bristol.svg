<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 438" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="438" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مقياس بريستول لشكل البراز (سجّله في الورقة)</text><rect x="326" y="52" width="284" height="76" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/><text x="468" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#991b1b">نوع 1: كور صلبة منفصلة</text><text x="468" y="102" text-anchor="middle" font-size="12.5" fill="#991b1b">إمساك شديد</text><rect x="30" y="52" width="284" height="76" rx="12" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="172" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#9a3412">نوع 2: سجق متكتل</text><text x="172" y="102" text-anchor="middle" font-size="12.5" fill="#9a3412">إمساك</text><rect x="326" y="140" width="284" height="76" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="468" y="168" text-anchor="middle" font-size="14.5" font-weight="800" fill="#166534">نوع 3: سجق بشقوق</text><text x="468" y="190" text-anchor="middle" font-size="12.5" fill="#166534">طبيعي</text><rect x="30" y="140" width="284" height="76" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="172" y="168" text-anchor="middle" font-size="14.5" font-weight="800" fill="#166534">نوع 4: سجق أملس</text><text x="172" y="190" text-anchor="middle" font-size="12.5" fill="#166534">طبيعي (المثالي)</text><rect x="326" y="228" width="284" height="76" rx="12" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="468" y="256" text-anchor="middle" font-size="14.5" font-weight="800" fill="#854d0e">نوع 5: قطع لينة بحواف واضحة</text><text x="468" y="278" text-anchor="middle" font-size="12.5" fill="#854d0e">يميل للإسهال</text><rect x="30" y="228" width="284" height="76" rx="12" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="172" y="256" text-anchor="middle" font-size="14.5" font-weight="800" fill="#9a3412">نوع 6: قطع هشة رخوة</text><text x="172" y="278" text-anchor="middle" font-size="12.5" fill="#9a3412">إسهال</text><rect x="326" y="316" width="284" height="76" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/><text x="468" y="344" text-anchor="middle" font-size="14.5" font-weight="800" fill="#991b1b">نوع 7: مائي بدون قطع</text><text x="468" y="366" text-anchor="middle" font-size="12.5" fill="#991b1b">إسهال شديد</text><rect x="30" y="316" width="284" height="76" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="172" y="344" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e40af">هدف التمريض</text><text x="172" y="366" text-anchor="middle" font-size="12.5" fill="#1e40af">سجّل النوع + عدد المرات</text><text x="172" y="383" text-anchor="middle" font-size="12.5" fill="#1e40af">كل وردية</text><text x="320" y="426" text-anchor="middle" font-size="12.5" fill="#475569">النوع 1 و 2 = إمساك • 3 و 4 = طبيعي • 5 إلى 7 = ميل للإسهال</text></svg>