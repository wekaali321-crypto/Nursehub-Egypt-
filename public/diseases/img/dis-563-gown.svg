<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="330" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أي جزء من الجاون المعقم يعتبر معقماً؟</text>
<g transform="translate(70,50)">
<circle cx="90" cy="25" r="20" fill="#e2e8f0" stroke="#64748b"/>
<path d="M60 50 L120 50 L160 70 L160 130 L135 130 L130 75 L130 230 L50 230 L50 75 L45 130 L20 130 L20 70 Z" fill="#fff" stroke="#64748b"/>
<rect x="50" y="52" width="80" height="78" fill="#86efac" opacity=".7"/>
<rect x="20" y="85" width="25" height="48" fill="#86efac" opacity=".7"/><rect x="135" y="85" width="25" height="48" fill="#86efac" opacity=".7"/>
<rect x="50" y="130" width="80" height="100" fill="#fca5a5" opacity=".6"/>
<line x1="50" y1="130" x2="130" y2="130" stroke="#0f172a" stroke-dasharray="4"/>
<text x="90" y="260" text-anchor="middle" font-size="12" fill="#475569">من الأمام</text></g>
<g font-size="14"><rect x="610" y="70" width="18" height="18" fill="#86efac"/><text x="600" y="84" text-anchor="start" fill="#0f172a" font-weight="700">معقم: الصدر حتى مستوى الوسط + الأكمام (حتى الكوع)</text>
<rect x="610" y="110" width="18" height="18" fill="#fca5a5"/><text x="600" y="124" text-anchor="start" fill="#0f172a" font-weight="700">غير معقم: تحت الوسط، الظهر، الرقبة والكتف</text></g>
<g font-size="13" fill="#334155"><text x="610" y="170" text-anchor="start">• ارفع اليدين فوق مستوى الوسط ولا تنزلهما للجنب</text><text x="610" y="195" text-anchor="start">• لا تدخل يداك تحت الإبط أو تلمس الظهر</text><text x="610" y="220" text-anchor="start">• لا تمرّر الأدوات خلف ظهر أحد، ولا تتقاطع الأيدي</text><text x="610" y="245" text-anchor="start">• لو غير مغسول: لا تلمس أي شيء أخضر/أزرق معقم</text></g></svg>