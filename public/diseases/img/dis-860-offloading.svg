<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="420" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">الوضعية وإعفاء الضغط: ميل 30 درجة وكعب معلّق</text><rect x="332" y="46" width="300" height="290" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="482" y="72" text-anchor="middle" font-size="16" font-weight="800" fill="#0f766e">على الجنب بزاوية 30 درجة</text><rect x="346" y="270" width="272" height="14" rx="4" fill="#94a3b8"/><polygon points="540,270 600,270 600,222" fill="#fbbf24" stroke="#b45309" stroke-width="2"/><text x="570" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">وسادة</text><g transform="rotate(-30 470 232)"><ellipse cx="470" cy="232" rx="84" ry="32" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/></g><circle cx="408" cy="196" r="20" fill="#fde68a" stroke="#b45309" stroke-width="2"/><circle cx="440" cy="263" r="8" fill="#16a34a"/><path d="M404 270 A 50 50 0 0 1 447 247" fill="none" stroke="#dc2626" stroke-width="2.5"/><text x="398" y="246" text-anchor="end" font-size="15" font-weight="800" fill="#dc2626">30°</text><circle cx="528" cy="206" r="10" fill="#dc2626"/><line x1="528" y1="196" x2="528" y2="106" stroke="#dc2626" stroke-width="2"/><text x="482" y="100" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">الورك العلوي مرفوع، لا ضغط على</text><text x="482" y="118" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">النتوء العظمي (المدور الكبير)</text><text x="482" y="306" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">وسادة بين الركبتين والكاحلين</text><text x="482" y="324" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">رأس السرير 30 درجة أو أقل ما أمكن</text><rect x="8" y="46" width="316" height="290" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="166" y="72" text-anchor="middle" font-size="16" font-weight="800" fill="#0f766e">الكعب معلّق في الهواء</text><rect x="24" y="238" width="284" height="14" rx="4" fill="#94a3b8"/><rect x="112" y="204" width="132" height="34" rx="12" fill="#fbbf24" stroke="#b45309" stroke-width="2"/><text x="178" y="226" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">وسادة تحت الساق</text><path d="M40 190 L112 188 L232 184 L268 196 L276 214 L254 218 L238 204 L112 206 L40 208 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="2"/><circle cx="270" cy="204" r="10" fill="#16a34a"/><text x="246" y="160" text-anchor="middle" font-size="13.5" font-weight="700" fill="#15803d">فراغ تحت الكعب</text><line x1="268" y1="168" x2="270" y2="192" stroke="#16a34a" stroke-width="2"/><text x="166" y="278" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">الركبة مثنية قليلاً</text><text x="166" y="298" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">الضغط على الربلة لا على الوريد</text><text x="166" y="318" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">لا يلمس الكعب الفراش ولا الوسادة</text><rect x="8" y="346" width="624" height="62" rx="12" fill="#ecfeff" stroke="#0e7490"/><text x="320" y="370" text-anchor="middle" font-size="14" font-weight="800" fill="#0e7490">جدول إعادة التوضيع فردي حسب الخطر والسطح وتحمل الجلد (غالباً كل ساعتين)</text><text x="320" y="392" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">ارفع ولا تسحب: الاحتكاك والقص يؤذيان الجلد، وبعد كل تغيير افحص الجلد</text></svg>