<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="540" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">العناية بالفغرة وتغيير الكيس: الخطوات</text>
  <rect x="20" y="50" width="600" height="70" rx="10" fill="#cffafe" stroke="#06b6d4" stroke-width="1.5"/><text x="320" y="78" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">الغرض: منع العدوى، مراقبة الخارج، تقييم التغذية والترطيب</text><text x="320" y="102" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">الفغرة السليمة لونها أحمر نضر (لحمي) لا شاحب</text><rect x="20" y="135" width="600" height="330" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="160" text-anchor="middle" font-size="14" font-weight="800" fill="#1e293b">خطوات التغيير</text><text x="610" y="188" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">1) أمر الطبيب والموافقة والهوية والخصوصية وغسل اليدين</text><text x="610" y="212" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">2) وضع الجلوس، اسطوانة مدرجة تحت الكيس لقياس الخارج</text><text x="610" y="236" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">3) أزل المشبك وأفرغ المحتوى ثم امسح حافة الكيس بمنديل</text><text x="610" y="260" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">4) اخلع الكيس من الأعلى مع دفع الجلد بعيدًا عن اللاصق</text><text x="610" y="284" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">5) نظّف الجلد المحيط بقماشة وماء دافئ ثم جفف بالتربيت</text><text x="610" y="308" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">6) كريم حاجز لا أقرب من 2 بوصة من الفغرة واتركه يجف</text><text x="610" y="332" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">7) قس الفغرة وقصّ فتحة اللاصق أكبر بنحو ⅛ بوصة</text><text x="610" y="356" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">8) انزع الورق الخلفي والصقه فوق الفغرة، أملس الهواء واضغط 5 دقائق</text><text x="610" y="380" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">9) ضع المشبك في أسفل الكيس الجديد واغسل يديك</text><text x="610" y="404" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">10) وثّق: حجم الفغرة، لونها ورائحتها وإفرازها واحمرارها وتسلخها</text><text x="610" y="428" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">11) وثّق البراز: الكمية واللون والرائحة وتحمل المريض</text><rect x="20" y="478" width="600" height="60" rx="10" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="500" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">نصيحة</text><text x="608" y="524" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• اسمح للمريض بروتينه المنزلي في العناية بالكيس قدر الإمكان</text>
</svg>
