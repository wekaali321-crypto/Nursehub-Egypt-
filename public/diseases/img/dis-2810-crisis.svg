<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 529" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="529" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">إدارة الأزمة والسلوك العدواني</text><rect x="486.5" y="50" width="133.5" height="93.19999999999999" rx="10" fill="#fff" stroke="#a16207" stroke-width="1.5"/><path d="M486.5 60a10 10 0 0 1 10-10h113.5a10 10 0 0 1 10 10v22h-133.5z" fill="#a16207"/><text x="553.25" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">⁦1⁩ الحدث المُحرِّك</text><text x="610" y="96" text-anchor="start" font-size="12" font-weight="700" fill="#a16207">⁦•⁩</text><text x="598" y="96" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">قلق استجابةً</text><text x="598" y="113.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">لتهديد</text><line x1="484.5" y1="96.6" x2="466.5" y2="96.6" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="331" y="50" width="133.5" height="93.19999999999999" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><path d="M331 60a10 10 0 0 1 10-10h113.5a10 10 0 0 1 10 10v22h-133.5z" fill="#c2410c"/><text x="397.75" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">⁦2⁩ التصعيد</text><text x="454.5" y="96" text-anchor="start" font-size="12" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="442.5" y="96" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">تزايد القلق</text><text x="442.5" y="113.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">والهياج</text><line x1="329" y1="96.6" x2="311" y2="96.6" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="175.5" y="50" width="133.5" height="93.19999999999999" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M175.5 60a10 10 0 0 1 10-10h113.5a10 10 0 0 1 10 10v22h-133.5z" fill="#b91c1c"/><text x="242.25" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">⁦3⁩ الأزمة</text><text x="299" y="96" text-anchor="start" font-size="12" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="287" y="96" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">نوبة غضب أو عنف</text><text x="287" y="113.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">أو صراخ</text><line x1="173.5" y1="96.6" x2="155.5" y2="96.6" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="20" y="50" width="133.5" height="93.19999999999999" rx="10" fill="#fff" stroke="#475569" stroke-width="1.5"/><path d="M20 60a10 10 0 0 1 10-10h113.5a10 10 0 0 1 10 10v22h-133.5z" fill="#475569"/><text x="86.75" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">⁦4⁩ ما بعد الأزمة</text><text x="143.5" y="96" text-anchor="start" font-size="12" font-weight="700" fill="#475569">⁦•⁩</text><text x="131.5" y="96" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">تفكك واكتئاب</text><text x="131.5" y="113.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">(مثال: لا أستطيع</text><text x="131.5" y="130.8" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">النهوض)</text><text x="320" y="167.2" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">ترتيب التدخل: التواصل أولاً ← ثم الدواء ← ثم التقييد/العزل كملاذ أخير</text><rect x="326" y="183.2" width="294" height="182.875" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><path d="M326 193.2a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#15803d"/><text x="473" y="204.2" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التواصل (⁦5⁩ خطوات)</text><text x="610" y="229.7" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="229.7" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">اشرح كل نشاط رعاية بهدوء (نقطة امتحان)</text><text x="610" y="250.825" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="250.825" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أزل المحرّك</text><text x="610" y="271.95" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="271.95" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">بيئة قليلة التنبيه، وليس قرب محطة التمريض</text><text x="610" y="293.075" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="293.075" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">حدد مصدر الغضب</text><text x="610" y="314.2" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="314.2" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">اعترف بمشاعر المريض</text><text x="610" y="335.325" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="335.325" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">تعليمات بسيطة وصوت هادئ، عرّف نفسك، وقف</text><text x="598" y="353.45" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">بمسافة ومعك دعم</text><rect x="20" y="183.2" width="294" height="182.875" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M20 193.2a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#b91c1c"/><text x="167" y="204.2" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التقييد الجسدي</text><text x="304" y="229.7" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="292" y="229.7" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أمر طبي بالتقييد (يجدد كل ⁦4⁩ ساعات للبالغين)</text><text x="304" y="250.825" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="292" y="250.825" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">يقيّمه الطبيب خلال ساعة من الأمر</text><text x="304" y="271.95" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="292" y="271.95" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">توثيق كل ⁦15⁩ دقيقة</text><text x="304" y="293.075" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="292" y="293.075" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">راقب واستوفِ احتياجاته الجسدية</text><rect x="470" y="378.075" width="150" height="29.4" fill="#0e7490" stroke="#cbd5e1"/><text x="545" y="395.075" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الفئة</text><rect x="255.7142857142857" y="378.075" width="214.2857142857143" height="29.4" fill="#0e7490" stroke="#cbd5e1"/><text x="362.85714285714283" y="395.075" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الدواء</text><rect x="19.99999999999997" y="378.075" width="235.71428571428572" height="29.4" fill="#0e7490" stroke="#cbd5e1"/><text x="137.85714285714283" y="395.075" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">ملاحظة</text><rect x="470" y="407.47499999999997" width="150" height="64.19999999999999" fill="#f8fafc" stroke="#cbd5e1"/><text x="545" y="424.47499999999997" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">مضاد قلق (بنزوديازيبين:</text><text x="545" y="441.87499999999994" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">تنتهي أسماؤها بـ ⁦pam⁩ أو</text><text x="545" y="459.275" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">⁦lam)⁩</text><rect x="255.7142857142857" y="407.47499999999997" width="214.2857142857143" height="64.19999999999999" fill="#f8fafc" stroke="#cbd5e1"/><text x="362.85714285714283" y="424.47499999999997" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">⁦Lorazepam (Ativan)⁩</text><rect x="19.99999999999997" y="407.47499999999997" width="235.71428571428572" height="64.19999999999999" fill="#f8fafc" stroke="#cbd5e1"/><text x="137.85714285714283" y="424.47499999999997" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">تهدئة</text><rect x="470" y="471.67499999999995" width="150" height="46.8" fill="#fff" stroke="#cbd5e1"/><text x="545" y="488.67499999999995" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">مضادات ذهان</text><rect x="255.7142857142857" y="471.67499999999995" width="214.2857142857143" height="46.8" fill="#fff" stroke="#cbd5e1"/><text x="362.85714285714283" y="488.67499999999995" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">⁦Haloperidol (Haldol), Ziprasidone⁩</text><text x="362.85714285714283" y="506.07499999999993" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">⁦(Geodon)⁩</text><rect x="19.99999999999997" y="471.67499999999995" width="235.71428571428572" height="46.8" fill="#fff" stroke="#cbd5e1"/><text x="137.85714285714283" y="488.67499999999995" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">سلوك عنيف</text></svg>