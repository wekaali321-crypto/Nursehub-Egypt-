<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="280" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تقييم الفندس بعد الولادة</text><rect x="20" y="50" width="290" height="150" rx="12" fill="#bbf7d0"/><text x="165" y="78" text-anchor="middle" font-size="16" font-weight="800" fill="#14532d">طبيعي</text><text x="165" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">متماسك (Firm)</text><text x="165" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">في الخط الوسطي</text><text x="165" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">عند مستوى السرة</text><text x="165" y="178" text-anchor="middle" font-size="11" font-weight="500" fill="#166534">استمرار التدليك غير لازم</text><rect x="330" y="50" width="290" height="150" rx="12" fill="#fecaca"/><text x="475" y="78" text-anchor="middle" font-size="16" font-weight="800" fill="#7f1d1d">غير طبيعي</text><text x="475" y="106" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">رخو (Boggy) = ارتخاء رحمي: نزف</text><text x="475" y="128" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">أعلى من السرة أو منحرف جانبًا</text><text x="475" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">= مثانة ممتلئة</text><text x="475" y="178" text-anchor="middle" font-size="11" font-weight="500" fill="#991b1b">تدليك الرحم + أوكسيتوسين / إفراغ المثانة</text><text x="320" y="235" text-anchor="middle" font-size="12" font-weight="500" fill="#475569">القاعدة: افحصي الفندس أولًا، وأفرغي المثانة، ودلّكي الرحم الرخو حتى يتماسك</text>
</svg>
