<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="300" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">اختيار دواء الضغط حسب السن والمرحلة</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="20" y="45" width="140" height="36" rx="8" fill="#0f172a"/><text x="90" y="68" fill="#fff">المرحلة</text>
    <rect x="168" y="45" width="215" height="36" rx="8" fill="#0f172a"/><text x="275" y="68" fill="#fff">أقل من 55 سنة</text>
    <rect x="391" y="45" width="229" height="36" rx="8" fill="#0f172a"/><text x="505" y="68" fill="#fff">أكتر من 55 سنة</text>
    <rect x="20" y="90" width="140" height="42" rx="8" fill="#eab308"/><text x="90" y="116" fill="#422006">مرحلة 1</text>
    <rect x="168" y="90" width="215" height="42" rx="8" fill="#dbeafe"/><text x="275" y="116" fill="#1e3a8a" direction="ltr">A or B</text>
    <rect x="391" y="90" width="229" height="42" rx="8" fill="#dcfce7"/><text x="505" y="116" fill="#14532d" direction="ltr">C or D</text>
    <rect x="20" y="140" width="140" height="42" rx="8" fill="#f97316"/><text x="90" y="166" fill="#fff">مرحلة 2</text>
    <rect x="168" y="140" width="452" height="42" rx="8" fill="#e0e7ff"/><text x="394" y="166" fill="#312e81" direction="ltr">(A or B)  +  (C or D)</text>
    <rect x="20" y="190" width="140" height="42" rx="8" fill="#dc2626"/><text x="90" y="216" fill="#fff">مرحلة 3</text>
    <rect x="168" y="190" width="452" height="42" rx="8" fill="#fee2e2"/><text x="394" y="216" fill="#7f1d1d" direction="ltr">(A or B)  +  C  +  D</text>
    <rect x="20" y="240" width="600" height="40" rx="8" fill="#f3e8ff"/><text x="320" y="265" fill="#581c87">ضغط مقاوم: أضف Alpha blocker أو Spironolactone أو مدر آخر</text>
  </g>
  <text x="320" y="294" text-anchor="middle" font-size="10" fill="#64748b" direction="ltr">A = ACEi/ARB · B = Beta blocker · C = CCB · D = Diuretic</text>
</svg>
