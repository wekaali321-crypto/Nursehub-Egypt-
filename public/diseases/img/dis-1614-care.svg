<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="452" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قسطرة القلب وأنبوب الصدر والعناية بعد الجراحة</text>
<rect x="14" y="44" width="300" height="210" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><rect x="14" y="44" width="300" height="26" rx="10" fill="#2563eb"/><text x="164.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >قبل القسطرة</text><text x="304" y="89" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >سؤال عن حساسية اليود</text><text x="304" y="108" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >صيام: 4–6 ساعات للأطفال، أقل للرضع</text><text x="304" y="127" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >أبلغ عن طفح حفاض شديد</text><rect x="326" y="44" width="300" height="210" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="326" y="44" width="300" height="26" rx="10" fill="#dc2626"/><text x="476.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >بعد القسطرة</text><text x="616" y="89" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >الأولوية: النبض البعيد عن موضع القسطرة</text><text x="616" y="107.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >نبض ضعيف: طبيعي</text><text x="616" y="126.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >غير الطبيعي: طرف بارد وشاحب</text><text x="616" y="144.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >ساق مستقيمة 4–8 ساعات</text><text x="616" y="163.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >الجرح: نزف وعدوى، لا استحمام بالحوض</text><rect x="14" y="266" width="612" height="170" rx="10" fill="#fff" stroke="#334155" stroke-width="1.5"/><text x="320" y="292" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a" >مراقبة أنبوب الصدر بعد جراحة القلب (تحتاج بلاغاً)</text><rect x="30" y="306" width="270" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="165" y="328" text-anchor="middle" font-size="12" font-weight="800" fill="#7f1d1d" >خلال ساعة: أكثر من 5–10 مل/كجم</text><text x="165" y="350" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7f1d1d" >مثال طفل 6 كجم: أكثر من 30–60 مل</text><rect x="340" y="306" width="270" height="56" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="475" y="328" text-anchor="middle" font-size="12" font-weight="800" fill="#7f1d1d" >خلال 3 ساعات: أكثر من 3 مل/كجم/ساعة</text><text x="475" y="350" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7f1d1d" >مثال: 6 × 3 = 18 مل/ساعة (54 مل/3 ساعات)</text><text x="320" y="396" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a" >يدل على نزف شديد أو انحباس قلبي (Tamponade)</text><text x="320" y="420" text-anchor="middle" font-size="12" font-weight="600" fill="#475569" >بعد الجراحة: ارفع الرأس، لا حمل ثقيل 3–4 أسابيع</text>
</svg>
