<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 327" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="327" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">سكري الحمل (GDM)</text><rect x="326.0" y="50" width="294.0" height="133" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="326.0" y="50" width="294.0" height="28" rx="10" fill="#ea580c"/><text x="473.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">عوامل الخطر</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• عمر 35 فأكثر</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• BMI أكثر من 25</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• حمل متعدد</text><text x="610.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• سابقة طفل أكبر من 4.5 كجم تقريباً</text><rect x="20.0" y="50" width="294.0" height="133" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><rect x="20.0" y="50" width="294.0" height="28" rx="10" fill="#b91c1c"/><text x="167.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">مضاعفات المولود</text><text x="304.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• ماكروسوميا أكثر من 4000 جم</text><text x="304.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• هبوط سكر بعد الولادة (40-60)</text><text x="304.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• Polycythemia</text><text x="304.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• RDS وولادة مبكرة وPROM وولادة ميتة</text><text x="304.0" y="164" font-size="12.5" fill="#0f172a" text-anchor="end">• نقص مغنيسيوم</text><rect x="326.0" y="195" width="294.0" height="116" rx="10" fill="#fff" stroke="#1e3a8a" stroke-width="2"/><rect x="326.0" y="195" width="294.0" height="28" rx="10" fill="#1e3a8a"/><text x="473.0" y="20" dy="195" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التشخيص</text><text x="610.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="end">• GCT ساعة بدون صيام</text><text x="610.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">• أقل من 140 طبيعي</text><text x="610.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• أعلى من 140: اختبار 3 ساعات بصيام</text><rect x="20.0" y="195" width="294.0" height="116" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20.0" y="195" width="294.0" height="28" rx="10" fill="#16a34a"/><text x="167.0" y="20" dy="195" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج</text><text x="304.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="end">• وجبات كل 3-4 ساعات</text><text x="304.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">• استشارة تغذية ورياضة</text><text x="304.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• أقراص أو أنسولين</text><text x="304.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="end">• NST أسبوعي من 32 أسبوعاً</text></svg>