<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 604" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="604" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الالتهاب الرئوي: الرعاية والتثقيف عند الخروج</text><rect x="325" y="54" width="295" height="209.59999999999997" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="325" y="54" width="295" height="29" rx="10" fill="#ef4444"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">عوامل الخطر</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• الأول: التقدم بالعمر (فوق 65)</text><text x="612" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• VAP: تغيير الوضع جانبيًا كل ساعتين،</text><text x="612" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">عناية فموية وشفط كل ساعتين،</text><text x="612" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">chlorhexidine</text><text x="612" y="181.8" text-anchor="start" font-size="13" fill="#0f172a">• أفضل مؤشرات VAP: بلغم موجب الزرع،</text><text x="612" y="200" text-anchor="start" font-size="13" fill="#0f172a">حمى، ارتشاح جديد بالأشعة</text><text x="612" y="223.20000000000002" text-anchor="start" font-size="13" fill="#0f172a">• طول عدم الحركة (الإفرازات لا تتحرك)</text><text x="612" y="246.4" text-anchor="start" font-size="13" fill="#0f172a">• التخدير بعد الجراحة</text><rect x="20" y="54" width="295" height="209.59999999999997" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="20" y="54" width="295" height="29" rx="10" fill="#0ea5e9"/><text x="307" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الفحوصات</text><text x="307" y="99" text-anchor="start" font-size="13" fill="#0f172a">• ارتفاع WBC (أكثر من 10,000)</text><text x="307" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• مزرعة بلغم إيجابية</text><text x="307" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• المزرعة أولًا قبل المضاد الحيوي</text><text x="307" y="168.6" text-anchor="start" font-size="13" fill="#0f172a">• أفضل مؤشر مخبري لنجاح المضاد</text><text x="307" y="186.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">الوريدي: تحسن (انخفاض) تعداد WBC</text><rect x="426.66666666666663" y="273.59999999999997" width="193.33333333333334" height="315.59999999999997" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="426.66666666666663" y="273.59999999999997" width="193.33333333333334" height="48" rx="10" fill="#10b981"/><text x="612" y="291.59999999999997" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">حرّك الإفرازات ووسّع</text><text x="612" y="310.59999999999997" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الرئتين</text><text x="612" y="337.59999999999997" text-anchor="start" font-size="13" fill="#0f172a">• علاج طبيعي للصدر</text><text x="612" y="360.79999999999995" text-anchor="start" font-size="13" fill="#0f172a">• TCDB وسعال الهف</text><text x="612" y="383.99999999999994" text-anchor="start" font-size="13" fill="#0f172a">• لا مثبطات السعال</text><text x="612" y="407.19999999999993" text-anchor="start" font-size="13" fill="#0f172a">• سوائل 2–3 لتر/د</text><text x="612" y="430.3999999999999" text-anchor="start" font-size="13" fill="#0f172a">• رأس السرير مرتفع</text><text x="612" y="448.5999999999999" text-anchor="start" font-size="13" fill="#0f172a">(Fowler العالي)</text><text x="612" y="471.7999999999999" text-anchor="start" font-size="13" fill="#0f172a">• التهاب رئوي من جانب</text><text x="612" y="489.9999999999999" text-anchor="start" font-size="13" fill="#0f172a">واحد: الرئة السليمة</text><text x="612" y="508.1999999999999" text-anchor="start" font-size="13" fill="#0f172a">للأسفل</text><rect x="223.33333333333331" y="273.59999999999997" width="193.33333333333334" height="315.59999999999997" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="223.33333333333331" y="273.59999999999997" width="193.33333333333334" height="29" rx="10" fill="#f59e0b"/><text x="408.66666666666663" y="291.59999999999997" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">بعد الجراحة</text><text x="408.66666666666663" y="318.59999999999997" text-anchor="start" font-size="13" fill="#0f172a">• مشي مبكر خلال 8 ساعات</text><text x="408.66666666666663" y="341.79999999999995" text-anchor="start" font-size="13" fill="#0f172a">• السعال مع تثبيت الجرح</text><text x="408.66666666666663" y="364.99999999999994" text-anchor="start" font-size="13" fill="#0f172a">• غسل اليدين</text><text x="408.66666666666663" y="388.19999999999993" text-anchor="start" font-size="13" fill="#0f172a">• عناية فموية كل 12 س</text><text x="408.66666666666663" y="406.3999999999999" text-anchor="start" font-size="13" fill="#0f172a">(chlorhexidine)</text><text x="408.66666666666663" y="429.5999999999999" text-anchor="start" font-size="13" fill="#0f172a">• مقياس تنفس حافز كل</text><text x="408.66666666666663" y="447.7999999999999" text-anchor="start" font-size="13" fill="#0f172a">ساعة</text><text x="408.66666666666663" y="470.9999999999999" text-anchor="start" font-size="13" fill="#0f172a">• أعطِ مسكنات الألم</text><rect x="20" y="273.59999999999997" width="193.33333333333334" height="315.59999999999997" rx="10" fill="#14b8a6" fill-opacity="0.1" stroke="#14b8a6" stroke-width="1.5"/><rect x="20" y="273.59999999999997" width="193.33333333333334" height="29" rx="10" fill="#14b8a6"/><text x="205.33333333333334" y="291.59999999999997" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">عند الخروج</text><text x="205.33333333333334" y="318.59999999999997" text-anchor="start" font-size="13" fill="#0f172a">• تجنب مثبطات السعال</text><text x="205.33333333333334" y="336.79999999999995" text-anchor="start" font-size="13" fill="#0f172a">(مثل codeine)</text><text x="205.33333333333334" y="359.99999999999994" text-anchor="start" font-size="13" fill="#0f172a">• مرطب بارد ليلًا وزد</text><text x="205.33333333333334" y="378.19999999999993" text-anchor="start" font-size="13" fill="#0f172a">السوائل</text><text x="205.33333333333334" y="401.3999999999999" text-anchor="start" font-size="13" fill="#0f172a">• مقياس حافز بالمنزل</text><text x="205.33333333333334" y="424.5999999999999" text-anchor="start" font-size="13" fill="#0f172a">• أكمل المضاد الفموي</text><text x="205.33333333333334" y="447.7999999999999" text-anchor="start" font-size="13" fill="#0f172a">• لقاح الالتهاب الرئوي</text><text x="205.33333333333334" y="465.9999999999999" text-anchor="start" font-size="13" fill="#0f172a">(حسب الإرشادات)</text><text x="205.33333333333334" y="489.1999999999999" text-anchor="start" font-size="13" fill="#0f172a">• أقلع عن التدخين، اغسل</text><text x="205.33333333333334" y="507.39999999999986" text-anchor="start" font-size="13" fill="#0f172a">يديك</text><text x="205.33333333333334" y="530.5999999999999" text-anchor="start" font-size="13" fill="#0f172a">• متابعة وأشعة صدر</text><text x="205.33333333333334" y="553.8" text-anchor="start" font-size="13" fill="#0f172a">• أبلغ: حمى، تشوش، ضيق</text><text x="205.33333333333334" y="572" text-anchor="start" font-size="13" fill="#0f172a">نفس، سعال/بلغم متزايد</text></svg>
