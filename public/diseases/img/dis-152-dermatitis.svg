<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="210" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الأكزيما التأتبية مقابل التهاب الجلد التلامسي</text>
<rect x="20.0" y="48" width="295.0" height="140" rx="10" fill="#7c3aed"/>
<text x="167.5" y="93.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">التأتبية (Atopic)</text>
<text x="167.5" y="112.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">وراثية، شائعة بالرضّع</text>
<text x="167.5" y="131.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">التهاب مزمن، طفح أحمر بإفراز مصلي</text>
<text x="167.5" y="150.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تتفاقم بنوبات</text>
<rect x="325.0" y="48" width="295.0" height="140" rx="10" fill="#0f766e"/>
<text x="472.5" y="93.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">التلامسي (Contact)</text>
<text x="472.5" y="112.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">بعد التعرض لمهيّج أو مسبب حساسية</text>
<text x="472.5" y="131.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">طفح حاك خلال ساعات (مثل اللبلاب السام)</text>
<text x="472.5" y="150.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لا هجوم مناعي ذاتي</text>
</svg>
