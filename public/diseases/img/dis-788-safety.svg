<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 346" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="346" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">تقييم الخطر الانتحاري</text><rect x="40" y="48" width="560" height="50" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><circle cx="576" cy="73" r="14" fill="#2563eb"/><text x="576" y="78" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="552" y="69" text-anchor="start" font-size="14" font-weight="800" fill="#2563eb">اسأل مباشرة</text><text x="552" y="87" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">هل تفكر في إيذاء نفسك؟ هل فكرت في الموت؟</text><text x="320" y="114" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="120" width="560" height="50" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.8"/><circle cx="576" cy="145" r="14" fill="#ea580c"/><text x="576" y="150" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="552" y="141" text-anchor="start" font-size="14" font-weight="800" fill="#ea580c">هل عندك خطة؟</text><text x="552" y="159" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">ماذا؟ متى؟ أين؟ وسيلة متاحة؟ محاولات سابقة؟</text><text x="320" y="186" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="192" width="560" height="50" rx="12" fill="#fff" stroke="#dc2626" stroke-width="1.8"/><circle cx="576" cy="217" r="14" fill="#dc2626"/><text x="576" y="222" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="552" y="213" text-anchor="start" font-size="14" font-weight="800" fill="#dc2626">صنّف الخطر</text><text x="552" y="231" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">أفكار بلا خطة = متوسط؛ خطة + وسيلة + نية = عالٍ</text><text x="320" y="258" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="264" width="560" height="66" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><circle cx="576" cy="297" r="14" fill="#7c3aed"/><text x="576" y="302" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="552" y="285" text-anchor="start" font-size="14" font-weight="800" fill="#7c3aed">تصرّف</text><text x="552" y="303" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">عالٍ: مراقبة 1:1، إزالة الأدوات، إبلاغ الطبيب النفسي، ولا تترك المريض</text><text x="552" y="319" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">وحده</text></svg>