<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="290" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مراحل ارتفاع الضغط وعدد الأدوية المبدئي</text>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="20" y="50" width="140" height="130" rx="12" fill="#22c55e"/><text x="90" y="85" fill="#fff">طبيعي</text><text x="90" y="112" fill="#fff" direction="ltr">حتى 140 / 90</text><text x="90" y="150" font-size="12" fill="#dcfce7">بدون أدوية</text>
    <rect x="168" y="50" width="140" height="130" rx="12" fill="#eab308"/><text x="238" y="85" fill="#422006">مرحلة 1 (خفيف)</text><text x="238" y="112" fill="#422006" direction="ltr">140–160 / 90–100</text><text x="238" y="150" font-size="12" fill="#422006">مجموعة واحدة</text>
    <rect x="316" y="50" width="140" height="130" rx="12" fill="#f97316"/><text x="386" y="85" fill="#fff">مرحلة 2 (متوسط)</text><text x="386" y="112" fill="#fff" direction="ltr">160–180 / 100–110</text><text x="386" y="150" font-size="12" fill="#ffedd5">مجموعتان</text>
    <rect x="464" y="50" width="156" height="130" rx="12" fill="#dc2626"/><text x="542" y="85" fill="#fff">مرحلة 3 (شديد)</text><text x="542" y="112" fill="#fff" direction="ltr">&gt; 180 / &gt; 110</text><text x="542" y="150" font-size="12" fill="#fecaca">3 مجموعات أو أكتر</text>
  </g>
  <text x="320" y="215" text-anchor="middle" font-size="13" fill="#475569">القراءة الواحدة العالية لا تعني تشخيص المرض: لازم قياسين أو أكتر (صباحي ومسائي)</text>
  <text x="320" y="240" text-anchor="middle" font-size="12" fill="#64748b">الإرشادات الحديثة: 140/90 فأكتر = ارتفاع ضغط (ESC 2024)</text>
  <text x="320" y="265" text-anchor="middle" font-size="12" fill="#64748b">180/120 + أعراض = طارئ</text>
</svg>
