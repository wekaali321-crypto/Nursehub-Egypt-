<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="250" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مراحل ارتفاع الضغط (الانقباضي / الانبساطي)</text>
  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="30" y="55" width="130" height="120" rx="12" fill="#22c55e"/><text x="95" y="100" fill="#fff">طبيعي</text><text x="95" y="130" fill="#fff" direction="ltr">&lt; 140 / 90</text>
    <rect x="170" y="75" width="130" height="100" rx="12" fill="#eab308"/><text x="235" y="115" fill="#422006">مرحلة 1</text><text x="235" y="145" fill="#422006" direction="ltr">140–159 / 90–99</text>
    <rect x="310" y="95" width="130" height="80" rx="12" fill="#f97316"/><text x="375" y="130" fill="#fff">مرحلة 2</text><text x="375" y="155" fill="#fff" direction="ltr">160–179 / 100–109</text>
    <rect x="450" y="55" width="160" height="120" rx="12" fill="#dc2626"/><text x="530" y="95" fill="#fff">مرحلة 3 — شديد</text><text x="530" y="125" fill="#fff" direction="ltr">≥ 180 / 110</text><text x="530" y="152" font-size="12" fill="#fecaca">+ أعراض = طارئ</text>
  </g>
  <text x="320" y="215" text-anchor="middle" font-size="13" fill="#475569">القراءة الواحدة العالية لا تعني تشخيص المرض — لازم قراءتين أو أكتر في أوقات مختلفة</text>
</svg>
