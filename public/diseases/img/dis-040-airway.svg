<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="300" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مقطع في الشعبة الهوائية</text>
  <!-- normal -->
  <g transform="translate(160,150)">
    <circle r="80" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/>
    <circle r="66" fill="#fda4af"/>
    <circle r="52" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text y="6" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">ممر هوائي واسع</text>
  </g>
  <text x="160" y="258" text-anchor="middle" font-size="16" font-weight="800" fill="#15803d">طبيعي</text>
  <text x="160" y="278" text-anchor="middle" font-size="12" fill="#475569">عضلة مرتخية، بدون التهاب</text>
  <!-- asthma -->
  <g transform="translate(480,150)">
    <circle r="80" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/>
    <circle r="68" fill="#f87171"/>
    <circle r="40" fill="#fb923c"/>
    <path d="M-14,-10 Q0,-22 14,-10 Q22,6 8,16 Q-8,20 -16,6 Z" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <circle cx="-3" cy="2" r="5" fill="#fde68a"/>
  </g>
  <text x="480" y="258" text-anchor="middle" font-size="16" font-weight="800" fill="#b91c1c">نوبة ربو</text>
  <text x="480" y="278" text-anchor="middle" font-size="12" fill="#475569">عضلة مشدودة + جدار متورم + سدادة بلغم (النقطة الصفراء)</text>
</svg>
