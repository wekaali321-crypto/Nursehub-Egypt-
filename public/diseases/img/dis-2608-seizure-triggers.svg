<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="300" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">محفزات النوبة (S الخمسة) ومراحلها</text><rect x="500" y="50" width="112" height="64" rx="10" fill="#ec4899"/><text x="556.0" y="77.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Stress</text><text x="556.0" y="93.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">ضغط نفسي</text><rect x="380" y="50" width="112" height="64" rx="10" fill="#8b5cf6"/><text x="436.0" y="77.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Sleep loss</text><text x="436.0" y="93.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">قلة النوم</text><rect x="260" y="50" width="112" height="64" rx="10" fill="#f59e0b"/><text x="316.0" y="77.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Strobe lights</text><text x="316.0" y="93.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">أضواء وامضة</text><rect x="140" y="50" width="112" height="64" rx="10" fill="#0ea5e9"/><text x="196.0" y="77.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Stimulants</text><text x="196.0" y="93.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">منبهات/كحول</text><rect x="20" y="50" width="112" height="64" rx="10" fill="#ef4444"/><text x="76.0" y="77.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Sugar/Na low</text><text x="76.0" y="93.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">سكر &lt;70 وصوديوم &lt;135</text><rect x="480" y="150" width="145" height="60" rx="10" fill="#e2e8f0"/><text x="552.5" y="175.85" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">بادرة Prodromal</text><text x="552.5" y="191.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">إنذار مسبق</text><rect x="325" y="150" width="145" height="60" rx="10" fill="#e2e8f0"/><text x="397.5" y="175.85" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">أورا Aura</text><text x="397.5" y="191.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">إشارة حسية قبل النوبة</text><line x1="478" y1="180" x2="472" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="170" y="150" width="145" height="60" rx="10" fill="#e2e8f0"/><text x="242.5" y="175.85" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Ictal</text><text x="242.5" y="191.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">النوبة نفسها</text><line x1="323" y1="180" x2="317" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="15" y="150" width="145" height="60" rx="10" fill="#e2e8f0"/><text x="87.5" y="175.85" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Postictal</text><text x="87.5" y="191.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">ارتباك وصداع ونعاس</text><line x1="168" y1="180" x2="162" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><text x="320" y="250" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">التسلسل من اليمين لليسار: بادرة ← أورا ← نوبة ← ما بعد النوبة</text><text x="320" y="278" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">HESI: توتر الجسم 10-20 ث ثم رجفان الأطراف 30-40 ث ثم تعب ونعاس</text></svg>