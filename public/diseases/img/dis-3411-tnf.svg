<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" width="640" height="324" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="مثبطات عامل نخر الورم (TNF Inhibitors)"><rect width="640" height="324" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">مثبطات عامل نخر الورم (TNF Inhibitors)</text><rect x="326.0" y="46" width="302.0" height="170" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الأدوية</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• Etanercept</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• Infliximab</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• Adalimumab</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• وسيلة حفظ: -mab ← «غاضب» (MAD) مناعة</text><text x="616.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">   مثبّطة</text><text x="616.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">• Etanercept: يعترض (Intercept) الاستجابة</text><text x="616.0" y="202" text-anchor="start" font-size="12.5" fill="#1d2939">   المناعية</text><rect x="12.0" y="46" width="302.0" height="134" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="12.0" y="60" width="302.0" height="14" fill="#b42318"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">قبل البدء</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• فحص السل: يجب أن يكون سلبيًا (خطر إعادة</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   تنشيط TB)</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• لا تؤخذ مع عدوى مزمنة أو متكررة أو حديثة</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• لقاح إنفلونزا سنوي</text><text x="302.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• لا لقاحات حية (الحزام الناري)</text><rect x="12.0" y="192" width="302.0" height="80" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="12.0" y="192" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="12.0" y="206" width="302.0" height="14" fill="#a86a00"/><text x="163.0" y="211" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">أولوية الإبلاغ</text><text x="302.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• ارتفاع WBC</text><text x="302.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• حرارة فوق 38°م (100.3°ف)</text><rect x="326.0" y="228" width="302.0" height="80" rx="10" fill="#efe9fb" stroke="#6a4bb5" stroke-width="1.2"/><rect x="326.0" y="228" width="302.0" height="28" rx="10" fill="#6a4bb5"/><rect x="326.0" y="242" width="302.0" height="14" fill="#6a4bb5"/><text x="477.0" y="247" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">تحاليل</text><text x="616.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">• CRP مرتفع متوقع (التهاب)</text><text x="616.0" y="294" text-anchor="start" font-size="12.5" fill="#1d2939">• ليس «الأهم» في الامتحان</text></svg>