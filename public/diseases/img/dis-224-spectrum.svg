<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="300" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">طيف الجذام (Leprosy)</text>
  <g text-anchor="middle" font-size="13" font-weight="700">
    <rect x="452" y="46" width="170" height="40" rx="10" fill="#16a34a"/><text x="537" y="72" fill="#fff">درني (Tuberculoid)</text>
    <rect x="236" y="46" width="206" height="40" rx="10" fill="#eab308"/><text x="339" y="72" fill="#422006">وسطي (Borderline)</text>
    <rect x="18" y="46" width="208" height="40" rx="10" fill="#dc2626"/><text x="122" y="72" fill="#fff">ورمي (Lepromatous)</text>
  </g>
  <g font-size="12.5" fill="#0f172a" text-anchor="middle">
    <rect x="452" y="92" width="170" height="150" rx="10" fill="#dcfce7"/>
    <text x="537" y="116">بقع قليلة مفقودة الإحساس</text><text x="537" y="140">أعصاب سميكة</text><text x="537" y="164">قرح وتشوّه (يد مخلبية)</text><text x="537" y="188">مناعة جيدة، قليل العدوى</text><text x="537" y="212">فحص الأنف: سلبي غالباً</text>
    <rect x="236" y="92" width="206" height="150" rx="10" fill="#fef9c3"/>
    <text x="339" y="130">بين النوعين</text><text x="339" y="156">قد يتحول لأي اتجاه</text>
    <rect x="18" y="92" width="208" height="150" rx="10" fill="#fee2e2"/>
    <text x="122" y="116">عقد/لويحات بلا إحساس</text><text x="122" y="140">وجه أسدي، حواجب تسقط</text><text x="122" y="164">انسداد أنف ورعاف متكرر</text><text x="122" y="188">اختبار Lepromin سلبي</text><text x="122" y="212">معدي: علاج متعدد طويل</text>
  </g>
  <text x="320" y="272" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">العلاج: Rifampicin + Dapsone + Clofazimine (MDT)</text>
</svg>
