<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 377" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="377" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مراحل الزهري الثلاث</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="121.8" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#f59e0b"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">المرحلة 1</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• قرح غير مؤلمة في</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">الأعضاء التناسلية أو</text><text x="612" y="135.4" text-anchor="start" font-size="13" fill="#0f172a">الشرج أو الفم</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="121.8" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#6366f1"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">المرحلة 2</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• طفح جلدي بعد زوال</text><text x="408.66666666666663" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">القرح</text><text x="408.66666666666663" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• ثم تختبئ العدوى بلا</text><text x="408.66666666666663" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">أعراض</text><rect x="20" y="54" width="193.33333333333334" height="121.8" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">المرحلة 3</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• تلف خطير بالدماغ</text><text x="205.33333333333334" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">والأعصاب والعيون والقلب</text><rect x="20" y="185.8" width="600" height="93" rx="10" fill="#0ea5e9" fill-opacity="0.13" stroke="#0ea5e9" stroke-width="1.5"/><text x="610" y="205.8" text-anchor="start" font-size="13.5" font-weight="800" fill="#0ea5e9">الحمل</text><text x="610" y="225.8" text-anchor="start" font-size="13" fill="#0f172a">الزهري ينتقل عبر المشيمة ويؤذي الجنين أو يقتله. فحصه: أول زيارة قبل الولادة،</text><text x="610" y="244.8" text-anchor="start" font-size="13" fill="#0f172a">الثلث الثالث، وعند الولادة إن كانت الخطورة عالية. العلاج الوحيد للحامل:</text><text x="610" y="263.8" text-anchor="start" font-size="13" fill="#0f172a">البنسلين.</text><rect x="20" y="288.8" width="600" height="74" rx="10" fill="#ef4444" fill-opacity="0.13" stroke="#ef4444" stroke-width="1.5"/><text x="610" y="308.8" text-anchor="start" font-size="13.5" font-weight="800" fill="#ef4444">نقطة امتحان</text><text x="610" y="328.8" text-anchor="start" font-size="13" fill="#0f172a">إن كانت لدى الحامل حساسية من البنسلين: قيّم نوع الحساسية ثم أزل الحساسية</text><text x="610" y="347.8" text-anchor="start" font-size="13" fill="#0f172a">(penicillin desensitization). وعلّمها خطر ترك العلاج على الجنين.</text></svg>
