<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="330" rx="16" fill="#f8fafc"/>
<text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الجدري المائي: مراحل الحبة وتوزيع الطفح</text>
<circle cx="515" cy="98" r="26" fill="#fda4af" stroke="#475569" stroke-width="1.5"/>
<text x="515" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">بقعة/حبة</text>
<text x="515" y="170" text-anchor="middle" font-size="12.5" font-weight="600" fill="#64748b" direction="ltr">papule</text>
<line x1="452" y1="98" x2="412" y2="98" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<circle cx="365" cy="98" r="26" fill="#bae6fd" stroke="#475569" stroke-width="1.5"/>
<circle cx="365" cy="98" r="12" fill="#fff" stroke="#38bdf8" stroke-width="1"/>
<text x="365" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">حويصلة</text>
<text x="365" y="170" text-anchor="middle" font-size="12.5" font-weight="600" fill="#64748b" direction="ltr">vesicle</text>
<line x1="302" y1="98" x2="262" y2="98" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<circle cx="215" cy="98" r="26" fill="#fde68a" stroke="#475569" stroke-width="1.5"/>
<text x="215" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">بثرة</text>
<text x="215" y="170" text-anchor="middle" font-size="12.5" font-weight="600" fill="#64748b" direction="ltr">pustule</text>
<line x1="152" y1="98" x2="112" y2="98" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<circle cx="65" cy="98" r="26" fill="#a16207" stroke="#475569" stroke-width="1.5"/>
<text x="65" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">قشرة</text>
<text x="65" y="170" text-anchor="middle" font-size="12.5" font-weight="600" fill="#64748b" direction="ltr">crust</text>
<rect x="26" y="188" width="588" height="126" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/>
<text x="320" y="214" text-anchor="middle" font-size="15" font-weight="800" fill="#1d4ed8">ليه اسمه «متعدد الأشكال» (pleomorphic)؟</text>
<text x="320" y="240" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">كل المراحل موجودة معاً في نفس الوقت وفي نفس الطفل</text>
<text x="320" y="261" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">يبدأ في الوجه والجذع (مركزي) ثم الأطراف</text>
<text x="320" y="282" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">يعدي من يوم قبل الطفح لحد ما كل الحبوب تتقشّر</text>
<text x="320" y="303" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">الحكة شديدة: ممنوع الهرش (ندبات وعدوى بكتيرية)</text>
</svg>
