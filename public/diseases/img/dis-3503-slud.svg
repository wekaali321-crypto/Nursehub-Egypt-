<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="360" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أدوية الكولين: تحفيز الأستيل كولين وأزمة السُّمية</text><rect x="380" y="45" width="245" height="110" rx="10" fill="#dcfce7"/><text x="502.5" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">الآلية</text><text x="502.5" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">مباشرة: تعمل مثل ACh</text><text x="502.5" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">غير مباشرة: تمنع تكسيره (AChE)</text><text x="502.5" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">انقباض عضلات المثانة والأمعاء</text><rect x="15" y="45" width="345" height="110" rx="10" fill="#dbeafe"/><text x="187.5" y="87" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">الاستعمال</text><text x="187.5" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">احتباس البول (bethanechol)</text><text x="187.5" y="123" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">الوهن العضلي الوبيل (ambenonium)</text><rect x="15" y="180" width="610" height="40" rx="10" fill="#fee2e2"/><text x="320" y="205" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">أزمة كولينية (جرعة زائدة): SLUD + تقلصات وضعف وصلابة وتشنج الفك</text><circle cx="520" cy="265" r="24" fill="#ef4444"/><text x="520" y="273" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">S</text><text x="488" y="270" text-anchor="end" font-size="13" font-weight="600" fill="#0f172a">سيلان اللعاب</text><circle cx="365" cy="265" r="24" fill="#ef4444"/><text x="365" y="273" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">L</text><text x="333" y="270" text-anchor="end" font-size="13" font-weight="600" fill="#0f172a">دمع</text><circle cx="210" cy="265" r="24" fill="#ef4444"/><text x="210" y="273" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">U</text><text x="178" y="270" text-anchor="end" font-size="13" font-weight="600" fill="#0f172a">تبول</text><circle cx="55" cy="265" r="24" fill="#ef4444"/><text x="55" y="273" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">D</text><text x="23" y="270" text-anchor="end" font-size="13" font-weight="600" fill="#0f172a">إسهال</text><rect x="15" y="305" width="610" height="40" rx="10" fill="#fef9c3"/><text x="320" y="330" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">الترياق: atropine (0.4–0.6 ملجم وريديًا)؛ نقص الجرعة: ضعف عضلات وتدلّي الجفون وصعوبة تنفس</text></svg>