<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 363" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="363" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">اضطراب فرط الحركة وتشتت الانتباه (⁦ADHD⁩)</text><rect x="20" y="50" width="600" height="58" rx="10" fill="#e0f2fe" stroke="#0e7490" stroke-width="1.5"/><text x="320" y="74" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">نقص الدوبامين (⁦Dopamine⁩) والنورإبينفرين (⁦Norepinephrine⁩) في الدماغ</text><text x="320" y="94" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">يضعف التركيز وضبط الاندفاع والمزاج (قلق، إساءة مواد لاحقاً)</text><rect x="486.5" y="122" width="133.5" height="75.8" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M486.5 132a10 10 0 0 1 10-10h113.5a10 10 0 0 1 10 10v22h-133.5z" fill="#b91c1c"/><text x="553.25" y="143" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">فرط الحركة</text><text x="610" y="168" text-anchor="start" font-size="12" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="168" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">عدم استقرار</text><line x1="484.5" y1="159.9" x2="466.5" y2="159.9" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="331" y="122" width="133.5" height="75.8" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><path d="M331 132a10 10 0 0 1 10-10h113.5a10 10 0 0 1 10 10v22h-133.5z" fill="#c2410c"/><text x="397.75" y="143" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">عدم الانتباه</text><text x="454.5" y="168" text-anchor="start" font-size="12" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="442.5" y="168" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">ضعف التركيز</text><line x1="329" y1="159.9" x2="311" y2="159.9" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="175.5" y="122" width="133.5" height="75.8" rx="10" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><path d="M175.5 132a10 10 0 0 1 10-10h113.5a10 10 0 0 1 10 10v22h-133.5z" fill="#6d28d9"/><text x="242.25" y="143" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الاندفاع</text><text x="299" y="168" text-anchor="start" font-size="12" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="287" y="168" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">كلام زائد</text><line x1="173.5" y1="159.9" x2="155.5" y2="159.9" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="20" y="122" width="133.5" height="75.8" rx="10" fill="#fff" stroke="#475569" stroke-width="1.5"/><path d="M20 132a10 10 0 0 1 10-10h113.5a10 10 0 0 1 10 10v22h-133.5z" fill="#475569"/><text x="86.75" y="143" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">اجتماعي</text><text x="143.5" y="168" text-anchor="start" font-size="12" font-weight="700" fill="#475569">⁦•⁩</text><text x="131.5" y="168" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">تدني تقدير الذات</text><text x="131.5" y="185.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">وضعف المهارات</text><rect x="326" y="209.8" width="294" height="140.625" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><path d="M326 219.8a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#15803d"/><text x="473" y="230.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التواصل مع الطفل</text><text x="610" y="256.3" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="256.3" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">تواصل بصري أولاً ثم تكلم</text><text x="610" y="277.425" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="277.425" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لغة بسيطة</text><text x="610" y="298.55" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="298.55" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">اطلب منه أن يكرر ما قيل</text><text x="610" y="319.675" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="319.675" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">امدح عند إتمام المهمة</text><rect x="20" y="209.8" width="294" height="140.625" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/><path d="M20 219.8a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#0e7490"/><text x="167" y="230.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التمريض والمدرسة</text><text x="304" y="256.3" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="292" y="256.3" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">جدول مكتوب بالأنشطة اليومية</text><text x="304" y="277.425" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="292" y="277.425" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">العدوان: وجّهه لنفخ بالون</text><text x="304" y="298.55" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="292" y="298.55" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">خطر الإصابة (تشخيص تمريضي)</text><text x="304" y="319.675" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="292" y="319.675" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">فترات راحة، تعليمات لفظية مع إشارات بصرية،</text><text x="292" y="337.8" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">قواعد ثابتة، واجبات أقل</text></svg>