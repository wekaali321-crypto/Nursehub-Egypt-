<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 343" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="343" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">مضادات حيوية أحدث لعدوى مقاومة</text><rect x="489.9" y="44" width="130.1" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="554.9" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">الدواء</text><rect x="381.4" y="44" width="108.4" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="435.7" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">الفئة</text><rect x="200.7" y="44" width="180.7" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="291.1" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">الاستعمال</text><rect x="20.0" y="44" width="180.7" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="110.4" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">ملاحظة</text><rect x="489.9" y="74.5" width="130.1" height="63.5" fill="#fff" stroke="#cbd5e1"/><text x="554.9" y="101.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">daptomycin</text><text x="554.9" y="118.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">(Cubicin)</text><rect x="381.4" y="74.5" width="108.4" height="63.5" fill="#fff" stroke="#cbd5e1"/><text x="435.7" y="101.8" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">ليبوببتيد</text><text x="435.7" y="118.3" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">حلقي</text><rect x="200.7" y="74.5" width="180.7" height="63.5" fill="#fff" stroke="#cbd5e1"/><text x="291.1" y="101.8" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">عدوى جلد معقدة وعدوى</text><text x="291.1" y="118.3" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">دم بالمكورات العنقودية</text><rect x="20.0" y="74.5" width="180.7" height="63.5" fill="#fff" stroke="#cbd5e1"/><text x="110.4" y="93.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">4 مغ/كغ وريدي يوميًا</text><text x="110.4" y="110.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">7–14 يوم لعدوى الجلد</text><text x="110.4" y="126.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">(راجع النشرة)</text><rect x="489.9" y="138" width="130.1" height="63.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="554.9" y="165.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">linezolid</text><text x="554.9" y="181.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">(Zyvox)</text><rect x="381.4" y="138" width="108.4" height="63.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="435.7" y="173.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أوكسازوليدينون</text><rect x="200.7" y="138" width="180.7" height="63.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="291.1" y="165.3" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">VREF، التهاب رئوي</text><text x="291.1" y="181.8" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">بالمكورات، عدوى جلد</text><rect x="20.0" y="138" width="180.7" height="63.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="110.4" y="157.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">600 مغ فموي/وريدي كل</text><text x="110.4" y="173.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">12 س؛ مع MAOI وتيرامين</text><text x="110.4" y="190.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">يرفع الضغط</text><rect x="489.9" y="201.5" width="130.1" height="63.5" fill="#fff" stroke="#cbd5e1"/><text x="554.9" y="228.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">spectinomycin</text><text x="554.9" y="245.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">(Trobicin)</text><rect x="381.4" y="201.5" width="108.4" height="63.5" fill="#fff" stroke="#cbd5e1"/><text x="435.7" y="220.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">قريب</text><text x="435.7" y="237.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">كيميائيًا من</text><text x="435.7" y="253.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الأمينوجليكوزيدات</text><rect x="200.7" y="201.5" width="180.7" height="63.5" fill="#fff" stroke="#cbd5e1"/><text x="291.1" y="228.8" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">سيلان لمن لديه تحسس</text><text x="291.1" y="245.3" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">بنسلين/سيفالوسبورين/probenecid</text><rect x="20.0" y="201.5" width="180.7" height="63.5" fill="#fff" stroke="#cbd5e1"/><text x="110.4" y="228.8" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">لا في الحمل (راجع</text><text x="110.4" y="245.3" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">النشرة)</text><rect x="489.9" y="265" width="130.1" height="63.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="554.9" y="292.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">quinupristin/dalfopristin</text><text x="554.9" y="308.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">(Synercid)</text><rect x="381.4" y="265" width="108.4" height="63.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="435.7" y="300.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">ستربتوجرامين</text><rect x="200.7" y="265" width="180.7" height="63.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="291.1" y="284.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">VREF؛ مبيد للمكورات</text><text x="291.1" y="300.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">العنقودية المقاومة</text><text x="291.1" y="317.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">وغير المقاومة</text><rect x="20.0" y="265" width="180.7" height="63.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="110.4" y="284.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">7.5 مغ/كغ كل 8 س؛</text><text x="110.4" y="300.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">يهيّج الوريد: اغسل بـ</text><text x="110.4" y="317.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">D5W لا بالملح</text></svg>