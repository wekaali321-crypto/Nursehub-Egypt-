<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 278" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="278" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">أدوية الاضطراب ثنائي القطب ومراقبتها</text><rect x="12" y="44" width="616" height="30" rx="8" fill="#0f172a"/><text x="547.6521739130435" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">الدواء</text><text x="239.6521739130435" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">المراقبة / ملاحظات</text><rect x="12" y="74" width="616" height="44" fill="#fff"/><text x="547.6521739130435" y="92" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">Lithium</text><text x="239.6521739130435" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">مستوى الدم 0.6–1.2 ملي مكافئ/لتر؛ سمية فوق 1.5؛ سوائل وملح منتظم؛</text><text x="239.6521739130435" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">كلى وغدة؛ تجنب NSAIDs/ACEi/ثيازيد</text><rect x="12" y="118" width="616" height="28" fill="#f1f5f9"/><text x="547.6521739130435" y="136" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">Valproic acid</text><text x="239.6521739130435" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">مستوى الدم؛ وظائف الكبد؛ الصفائح؛ ممنوع بالحمل</text><rect x="12" y="146" width="616" height="28" fill="#fff"/><text x="547.6521739130435" y="164" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">Carbamazepine</text><text x="239.6521739130435" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">مستوى الدم؛ CBC (نقص خلايا)؛ صوديوم؛ طفح</text><rect x="12" y="174" width="616" height="28" fill="#f1f5f9"/><text x="547.6521739130435" y="192" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">Lamotrigine</text><text x="239.6521739130435" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">طفح جلدي: أوقفه وأبلغ (Stevens-Johnson)؛ زيادة تدريجية</text><rect x="12" y="202" width="616" height="60" fill="#fff"/><text x="547.6521739130435" y="220" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">Olanzapine /</text><text x="547.6521739130435" y="236" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">Risperidone /</text><text x="547.6521739130435" y="252" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">Aripiprazole</text><text x="239.6521739130435" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">وزن، سكر، دهون؛ حركات لا إرادية؛ نعاس</text></svg>