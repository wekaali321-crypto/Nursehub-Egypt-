<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="348" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الالتهاب الرئوي: تشخيص ورعاية وتثقيف الخروج</text><rect x="427" y="48" width="193" height="284" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="427" y="48" width="193" height="30" rx="12" fill="#2563eb"/><text x="523.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الخطر والتشخيص</text><text x="610" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">الأكبر خطرًا: عمر فوق 65</text><text x="610" y="120" text-anchor="end" font-size="12.5" fill="#1e293b">VAP (التهاب رئوي على التنفس</text><text x="610" y="140" text-anchor="end" font-size="12.5" fill="#1e293b">الصناعي): تغيير الوضع كل</text><text x="610" y="160" text-anchor="end" font-size="12.5" fill="#1e293b">ساعتين، عناية فم وشفط كل</text><text x="610" y="180" text-anchor="end" font-size="12.5" fill="#1e293b">ساعتين، كلورهيكسيدين</text><text x="610" y="200" text-anchor="end" font-size="12.5" fill="#1e293b">أفضل مؤشرات VAP: مزرعة بلغم</text><text x="610" y="220" text-anchor="end" font-size="12.5" fill="#1e293b">موجبة، حمى، ارتشاح جديد</text><text x="610" y="240" text-anchor="end" font-size="12.5" fill="#1e293b">بالأشعة</text><text x="610" y="260" text-anchor="end" font-size="12.5" fill="#1e293b">WBC أكثر من 10000؛ المزرعة</text><text x="610" y="280" text-anchor="end" font-size="12.5" fill="#1e293b">قبل المضاد الحيوي دائمًا</text><rect x="224" y="48" width="193" height="284" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="224" y="48" width="193" height="30" rx="12" fill="#16a34a"/><text x="320.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الرعاية</text><text x="407" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">علاج طبيعي صدري، سعال وتنفس</text><text x="407" y="120" text-anchor="end" font-size="12.5" fill="#1e293b">عميق (TCDB)، سعال Huff</text><text x="407" y="140" text-anchor="end" font-size="12.5" fill="#1e293b">تجنب مثبطات السعال</text><text x="407" y="160" text-anchor="end" font-size="12.5" fill="#1e293b">سوائل 2–3 لتر/يوم (للبالغ)</text><text x="407" y="180" text-anchor="end" font-size="12.5" fill="#1e293b">Fowler العالي؛ رئة سليمة</text><text x="407" y="200" text-anchor="end" font-size="12.5" fill="#1e293b">لأسفل في المصاب من جانب</text><text x="407" y="220" text-anchor="end" font-size="12.5" fill="#1e293b">واحد</text><text x="407" y="240" text-anchor="end" font-size="12.5" fill="#1e293b">مشي مبكر خلال 8 ساعات بعد</text><text x="407" y="260" text-anchor="end" font-size="12.5" fill="#1e293b">الجراحة، سعال مع تثبيت</text><text x="407" y="280" text-anchor="end" font-size="12.5" fill="#1e293b">الجرح</text><text x="407" y="300" text-anchor="end" font-size="12.5" fill="#1e293b">عناية فم كل 12 ساعة، مقياس</text><text x="407" y="320" text-anchor="end" font-size="12.5" fill="#1e293b">تحفيز تنفس كل ساعة، مسكنات</text><rect x="21" y="48" width="193" height="284" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="21" y="48" width="193" height="30" rx="12" fill="#ea580c"/><text x="117.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">تثقيف الخروج</text><text x="204" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">لا مثبطات سعال (كوديين)</text><text x="204" y="120" text-anchor="end" font-size="12.5" fill="#1e293b">مرطب بارد ليلًا</text><text x="204" y="140" text-anchor="end" font-size="12.5" fill="#1e293b">أكمل المضاد الحيوي</text><text x="204" y="160" text-anchor="end" font-size="12.5" fill="#1e293b">مقياس التنفس بالمنزل</text><text x="204" y="180" text-anchor="end" font-size="12.5" fill="#1e293b">لقاح الالتهاب الرئوي (حسب</text><text x="204" y="200" text-anchor="end" font-size="12.5" fill="#1e293b">توصية الطبيب)</text><text x="204" y="220" text-anchor="end" font-size="12.5" fill="#1e293b">أقلع عن التدخين، اغسل يديك</text><text x="204" y="240" text-anchor="end" font-size="12.5" fill="#1e293b">متابعة أشعة صدر</text><text x="204" y="260" text-anchor="end" font-size="12.5" fill="#1e293b">أبلغ عن حمى وارتباك وضيق</text><text x="204" y="280" text-anchor="end" font-size="12.5" fill="#1e293b">نفس وسعال وبلغم متزايد</text>
</svg>
