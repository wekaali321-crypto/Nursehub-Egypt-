<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="380" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">فينيل كيتون يوريا (PKU): ما الذي يحدث</text><rect x="20" y="48" width="600" height="58" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><circle cx="596" cy="68" r="13" fill="#2563eb"/><text x="596" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="570" y="73" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">نقص إنزيم Phenylalanine Hydroxylase</text><text x="570" y="94" text-anchor="end" font-size="12.5" fill="#334155">المسؤول عن تحويل الحمض الأميني فينيل ألانين إلى تيروزين</text><text x="320" y="120" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="126" width="600" height="58" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><circle cx="596" cy="146" r="13" fill="#16a34a"/><text x="596" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="570" y="151" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">تراكم فينيل ألانين في الجسم</text><text x="570" y="172" text-anchor="end" font-size="12.5" fill="#334155">من بروتينات الغذاء (لحوم، بيض، ألبان)</text><text x="320" y="198" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="204" width="600" height="58" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><circle cx="596" cy="224" r="13" fill="#ea580c"/><text x="596" y="229" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="570" y="229" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">تلف دائم بالدماغ والجهاز العصبي</text><text x="570" y="250" text-anchor="end" font-size="12.5" fill="#334155">أثناء الجنين والطفولة حتى 12 سنة</text><text x="320" y="276" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="282" width="600" height="58" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><circle cx="596" cy="302" r="13" fill="#9333ea"/><text x="596" y="307" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="570" y="307" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">الوقاية</text><text x="570" y="328" text-anchor="end" font-size="12.5" fill="#334155">حمية قليلة فينيل ألانين + لبن خاص للرضع؛ التيروزين في الغذاء مفيد</text><text x="320" y="362" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">وراثي: كلا الأبوين حاملان للجين</text>
</svg>
