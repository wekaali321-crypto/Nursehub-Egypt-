<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="196" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">العناية بالجبس وعلامات الخطر</text>
<rect x="489.5" y="48" width="130.5" height="90" rx="10" fill="#0369a1"/>
<text x="554.75" y="68.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">نظيف وجاف</text>
<text x="554.75" y="87.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">غطِّه بكيس عند</text>
<text x="554.75" y="106.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">الاستحمام</text>
<text x="554.75" y="125.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لا تبلله</text>
<line x1="489.5" y1="93.0" x2="463.5" y2="93.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
<polygon points="463.5,93.0 471.6,89.1 471.6,96.9" fill="#475569"/>
<rect x="333.0" y="48" width="130.5" height="90" rx="10" fill="#0f766e"/>
<text x="398.25" y="68.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">ارفعه</text>
<text x="398.25" y="87.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">فوق مستوى القلب</text>
<text x="398.25" y="106.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">أول 24–48 ساعة</text>
<text x="398.25" y="125.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لتقليل الورم</text>
<line x1="333.0" y1="93.0" x2="307.0" y2="93.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
<polygon points="307.0,93.0 315.1,89.1 315.1,96.9" fill="#475569"/>
<rect x="176.5" y="48" width="130.5" height="90" rx="10" fill="#7c3aed"/>
<text x="241.75" y="68.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الحكة</text>
<text x="241.75" y="87.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">مجفف شعر على هواء</text>
<text x="241.75" y="106.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">بارد</text>
<text x="241.75" y="125.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لا تُدخل شيئًا</text>
<line x1="176.5" y1="93.0" x2="150.5" y2="93.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
<polygon points="150.5,93.0 158.6,89.1 158.6,96.9" fill="#475569"/>
<rect x="20.0" y="48" width="130.5" height="90" rx="10" fill="#ca8a04"/>
<text x="85.25" y="68.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الراحة</text>
<text x="85.25" y="87.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لا تحميل على</text>
<text x="85.25" y="106.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">الجبس الرطب</text>
<text x="85.25" y="125.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لا ضغط بالأصابع</text>
<text x="320" y="188" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">خطوات العناية العملية بالجبس</text>
</svg>
