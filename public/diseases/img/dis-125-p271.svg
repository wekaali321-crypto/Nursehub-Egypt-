<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 495" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="495" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب الشغاف والتهاب التامور</text>
<rect x="346.0" y="52" width="320.0" height="190.0" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="346.0" y="52" width="320.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="506.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">التهاب الشغاف Endocarditis</text>
<text x="656.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• التهاب داخل القلب: جرثومي (infective) أو غير</text>
<text x="656.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">جرثومي؛ الصمامات لا تُغلق جيداً فيقل النتاج</text>
<text x="656.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• الأسباب: إبر ملوثة، زيارات الأسنان، جراحات</text>
<text x="656.0" y="149.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">القلب (تبديل صمام، CABG)، التهاب لوزتين</text>
<text x="656.0" y="167.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">بالمكورات العقدية غير المعالج</text>
<text x="656.0" y="186.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• العلاج: مضادات حيوية وإصلاح/تبديل الصمام</text>
<rect x="14.0" y="52" width="320.0" height="190.0" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="14.0" y="52" width="320.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="174.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">علاماته</text>
<text x="324.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• جلطات بالقلب والمخ: انتبه للهياج وتغير الوعي</text>
<text x="324.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">(خطر سكتة)</text>
<text x="324.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• نزف شظوي تحت الأظافر</text>
<text x="324.0" y="151.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• دم بالرئة: خراخر</text>
<text x="324.0" y="171.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• حرارة</text>
<text x="324.0" y="190.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قلة أكسجين: تعجّر الأصابع</text>
<text x="324.0" y="209.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لطخات Roth وعقد Osler وآفات Janeway من مناعة</text>
<text x="324.0" y="226.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الجسم</text>
<rect x="346.0" y="262.0" width="320.0" height="205.25" rx="10" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="1.2"/>
<rect x="346.0" y="262.0" width="320.0" height="26" rx="10" fill="#ec4899" fill-opacity="1" stroke="#ec4899" stroke-width="1.2"/>
<text x="506.0" y="280.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">التهاب التامور Pericarditis</text>
<text x="656.0" y="306.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• التهاب خارج القلب فيُضغط ويقل ضخه</text>
<text x="656.0" y="325.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ألم صدر أمام القلب، WBC فوق 10000، CRP مرتفع</text>
<text x="656.0" y="344.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قد يتطور لانحباس: JVD، أصوات مكتومة، نبض</text>
<text x="656.0" y="361.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">متناقض</text>
<text x="656.0" y="381.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• الأسباب: جلطة قلبية، أمراض مناعة (ذئبة، تصلب</text>
<text x="656.0" y="398.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">جلد، روماتويد)، عدوى (HIV، هربس، سل)، فشل كلوي</text>
<text x="656.0" y="415.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">(يوريميا)</text>
<text x="656.0" y="434.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• العلاج: NSAIDs (إندوميثاسين) وستيرويد</text>
<text x="656.0" y="452.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">(بريدنيزون)، وبزل التامور لسحب السائل</text>
<rect x="14.0" y="262.0" width="320.0" height="205.25" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="14.0" y="262.0" width="320.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="174.0" y="280.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">تثقيف الشغاف</text>
<text x="324.0" y="306.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• راقب علامات العدوى</text>
<text x="324.0" y="325.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• نظافة الفم: فرشاة مرتين يومياً بلا خيط أسنان</text>
<text x="324.0" y="344.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أخبر كل مقدم رعاية بتاريخ الالتهاب</text>
<text x="324.0" y="363.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• التزم بالمضاد الحيوي قبل إجراءات الأسنان</text>
<text x="324.0" y="381.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">والجراحة</text>
</svg>
