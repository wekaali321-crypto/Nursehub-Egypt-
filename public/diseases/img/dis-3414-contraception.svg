<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="وسائل منع الحمل الدوائية: خريطة التحذيرات"><rect width="640" height="360" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">وسائل منع الحمل الدوائية: خريطة التحذيرات</text><rect x="326.0" y="46" width="302.0" height="206" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="326.0" y="60" width="302.0" height="14" fill="#b42318"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">هرمونات (Estrogen + Progesterone)</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• أخطر أثر: زيادة خثرات الدم</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• لا تُعطى لمن لديه MI أو DVT أو PE أو CVA</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">   (سكتة)</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• لا تدخين (Estrogen + تدخين = خطر خثرات)</text><text x="616.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• Estrogen ممنوع مع التهاب الوريد الخثري</text><text x="616.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">• بلّغ: ألم/تورم شديد بالساق أو فقدان رؤية</text><text x="616.0" y="202" text-anchor="start" font-size="12.5" fill="#1d2939">• Carbamazepine يُبطل فعالية الأقراص</text><text x="616.0" y="220" text-anchor="start" font-size="12.5" fill="#1d2939">• Medroxyprogesterone: قد يتأخر عودة</text><text x="616.0" y="238" text-anchor="start" font-size="12.5" fill="#1d2939">   الإباضة أشهرًا</text><rect x="12.0" y="46" width="302.0" height="206" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="12.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">اللولب (IUD): نوعان</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• لولب نحاسي (Copper)</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• لولب levonorgestrel</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• النحاسي: ألم/تبقيع خفيف عند التركيب،</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">   ودورة أغزر وأكثر تقلصًا</text><text x="302.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• علّم: افحص الخيط شهريًا بعد الدورة</text><text x="302.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">• خيط أطول/أقصر/مفقود = بلّغ الطبيب</text><text x="302.0" y="202" text-anchor="start" font-size="12.5" fill="#1d2939">• لا يتأثر بالمزلقات ولا بزيادة/نقص الوزن</text><text x="302.0" y="220" text-anchor="start" font-size="12.5" fill="#1d2939">• تأخر دورة عشوائي ليس طبيعيًا: قد يعني</text><text x="302.0" y="238" text-anchor="start" font-size="12.5" fill="#1d2939">   حملًا</text><rect x="326.0" y="264" width="302.0" height="80" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="326.0" y="264" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="326.0" y="278" width="302.0" height="14" fill="#a86a00"/><text x="477.0" y="283" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">نقطة تقييم</text><text x="616.0" y="312" text-anchor="start" font-size="12.5" fill="#1d2939">• ألم بالساق اليسرى خلف الركبة: DVT محتمل</text><text x="616.0" y="330" text-anchor="start" font-size="12.5" fill="#1d2939">   (أولوية)</text></svg>