<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="400" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الأنبوب الصدري: المشاكل والممنوعات</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="140" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">انفصل عن المريض / خرج</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• اطلب منه السعال</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">والزفير فورًا</text><text x="612" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• غطِّ بغيار محكم</text><text x="612" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">(بترولاتوم) ملصق من 3</text><text x="612" y="176.8" text-anchor="start" font-size="13" fill="#0f172a">جهات</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="140" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="48" rx="10" fill="#f59e0b"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">انفصل عن حجرة التجميع /</text><text x="408.66666666666663" y="91" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">تلف الختم</text><text x="408.66666666666663" y="118" text-anchor="start" font-size="13" fill="#0f172a">• ضع الطرف البعيد في نحو</text><text x="408.66666666666663" y="136.2" text-anchor="start" font-size="13" fill="#0f172a">250 مل محلول ملحي معقم</text><text x="408.66666666666663" y="159.4" text-anchor="start" font-size="13" fill="#0f172a">• أو غيّر النظام التالف</text><rect x="20" y="54" width="193.33333333333334" height="140" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">أدوات بجانب السرير</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• رابط معقم</text><text x="205.33333333333334" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• شاش بترولاتوم معقم</text><text x="205.33333333333334" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• مشبك مبطّن</text><rect x="426.66666666666663" y="204" width="193.33333333333334" height="181.4" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="426.66666666666663" y="204" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="612" y="222" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">ممنوع</text><text x="612" y="249" text-anchor="start" font-size="13" fill="#0f172a">• «عصر» أو «تمرير»</text><text x="612" y="267.2" text-anchor="start" font-size="13" fill="#0f172a">الأنبوب</text><text x="612" y="285.4" text-anchor="start" font-size="13" fill="#0f172a">(milking/stripping)</text><text x="612" y="308.6" text-anchor="start" font-size="13" fill="#0f172a">• فقاعات مستمرة في الختم</text><text x="612" y="326.8" text-anchor="start" font-size="13" fill="#0f172a">المائي (تسرب هواء)</text><text x="612" y="350" text-anchor="start" font-size="13" fill="#0f172a">• تقييد/غلق الأنبوب</text><text x="612" y="368.2" text-anchor="start" font-size="13" fill="#0f172a">أثناء النقل</text><rect x="223.33333333333331" y="204" width="193.33333333333334" height="181.4" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="223.33333333333331" y="204" width="193.33333333333334" height="29" rx="10" fill="#0ea5e9"/><text x="408.66666666666663" y="222" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الإزالة</text><text x="408.66666666666663" y="249" text-anchor="start" font-size="13" fill="#0f172a">• يؤخذ نفس عميق ويُحبس</text><text x="408.66666666666663" y="267.2" text-anchor="start" font-size="13" fill="#0f172a">ويُدفع (مناورة فالسالفا)</text><rect x="20" y="204" width="193.33333333333334" height="181.4" rx="10" fill="#14b8a6" fill-opacity="0.1" stroke="#14b8a6" stroke-width="1.5"/><rect x="20" y="204" width="193.33333333333334" height="29" rx="10" fill="#14b8a6"/><text x="205.33333333333334" y="222" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">كل ساعتين</text><text x="205.33333333333334" y="249" text-anchor="start" font-size="13" fill="#0f172a">• أصوات الرئة</text><text x="205.33333333333334" y="272.2" text-anchor="start" font-size="13" fill="#0f172a">• الغيار حول الأنبوب: دم</text><text x="205.33333333333334" y="290.4" text-anchor="start" font-size="13" fill="#0f172a">أو قيح؟</text><text x="205.33333333333334" y="313.59999999999997" text-anchor="start" font-size="13" fill="#0f172a">• انتفاخ تحت الجلد</text><text x="205.33333333333334" y="331.79999999999995" text-anchor="start" font-size="13" fill="#0f172a">(كفرقعة الرز)</text></svg>
