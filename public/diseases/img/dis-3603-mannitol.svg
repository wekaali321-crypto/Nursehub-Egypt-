<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="290" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مانيتول: من الآلية للمتابعة</text><rect x="60" y="48" width="520" height="68" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><circle cx="580" cy="64" r="14" fill="#0e7490"/><text x="580" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="556" y="68" text-anchor="start" font-size="14" font-weight="800" fill="#0e7490">السحب الأسموزي</text><text x="570" y="88" text-anchor="start" font-size="13" fill="#0f172a">يسحب السوائل من خلايا المخ إلى الأوعية الدموية فيقل الوذمة المخية وضغط</text><text x="570" y="106" text-anchor="start" font-size="13" fill="#0f172a">الرأس</text><path d="M320 118 L320 132 M314 126 L320 133 L326 126" stroke="#64748b" stroke-width="2" fill="none"/><rect x="60" y="136" width="520" height="68" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><circle cx="580" cy="152" r="14" fill="#0e7490"/><text x="580" y="157" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="556" y="156" text-anchor="start" font-size="14" font-weight="800" fill="#0e7490">الخطر</text><text x="570" y="176" text-anchor="start" font-size="13" fill="#0f172a">زيادة حجم السوائل (HF = Heart Failure / Heavy Fluid): تكتكة قاعدية، وذمة</text><text x="570" y="194" text-anchor="start" font-size="13" fill="#0f172a">رئوية</text><path d="M320 206 L320 220 M314 214 L320 221 L326 214" stroke="#64748b" stroke-width="2" fill="none"/><rect x="60" y="224" width="520" height="50" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><circle cx="580" cy="240" r="14" fill="#0e7490"/><text x="580" y="245" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="556" y="244" text-anchor="start" font-size="14" font-weight="800" fill="#0e7490">المتابعة</text><text x="570" y="264" text-anchor="start" font-size="13" fill="#0f172a">مستوى الوعي كل ساعة، الرئتان، الإخراج البولي، وذمات الجسم</text></svg>