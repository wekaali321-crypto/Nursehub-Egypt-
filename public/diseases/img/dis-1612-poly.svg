<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="470" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">نقص الأكسجين المزمن وفرط كرات الدم الحمراء</text>
<rect x="14" y="44" width="300" height="170" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><rect x="14" y="44" width="300" height="26" rx="10" fill="#2563eb"/><text x="164.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >نقص أكسجين (Cyanotic): دم من اليمين لليسار</text><text x="304" y="89" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >TOF: رباعية فالو</text><text x="304" y="109.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >TGA: تبديل الشريانين</text><text x="304" y="130.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >Truncus: الجذع الشرياني</text><text x="304" y="150.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >Tricuspid atresia: انسداد الثلاثي</text><text x="304" y="171.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >(كلها تبدأ بـ T = Trouble)</text><rect x="326" y="44" width="300" height="170" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><rect x="326" y="44" width="300" height="26" rx="10" fill="#16a34a"/><text x="476.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >فشل قلب (Acyanotic): دم من اليسار لليمين</text><text x="616" y="89" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >ASD ثقب بين الأذينين</text><text x="616" y="109.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >VSD ثقب بين البطينين</text><text x="616" y="130.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >PDA قناة سالكة</text><text x="616" y="150.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >AVSD عيب بين الأذينين والبطينين</text><text x="616" y="171.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >زيادة تدفق الدم للرئة</text><rect x="120" y="232" width="400" height="40" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><text x="320" y="258" text-anchor="middle" font-size="12.5" font-weight="800" fill="#dc2626" >نقص أكسجين مزمن</text><line x1="320" y1="272" x2="320" y2="284" stroke="#64748b" stroke-width="2" /><path d="M320,284 L316.6,277.9 L323.4,277.9 Z" fill="#64748b"/><rect x="120" y="284" width="400" height="40" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><text x="320" y="310" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ea580c" >الجسم يصنع كرات حمراء أكثر</text><line x1="320" y1="324" x2="320" y2="336" stroke="#64748b" stroke-width="2" /><path d="M320,336 L316.6,329.9 L323.4,329.9 Z" fill="#64748b"/><rect x="120" y="336" width="400" height="40" rx="10" fill="#fff" stroke="#d97706" stroke-width="1.5"/><text x="320" y="362" text-anchor="middle" font-size="12.5" font-weight="800" fill="#d97706" >دم لزج: Hb فوق 22 g/dL (بلّغ)</text><line x1="320" y1="376" x2="320" y2="388" stroke="#64748b" stroke-width="2" /><path d="M320,388 L316.6,381.9 L323.4,381.9 Z" fill="#64748b"/><rect x="120" y="388" width="400" height="40" rx="10" fill="#fff" stroke="#7f1d1d" stroke-width="1.5"/><text x="320" y="414" text-anchor="middle" font-size="12.5" font-weight="800" fill="#7f1d1d" >خطر جلطات صغيرة وسكتة مخية متأخرة</text><text x="320" y="452" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f766e" >الأولوية: الترطيب (Hydration) | الأكسجين تحت أمر</text>
</svg>
