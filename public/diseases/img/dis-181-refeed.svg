<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 419" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="419" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">إعادة التغذية في الكواشيوركور (خطوات)</text><g text-anchor="middle"><rect x="80" y="46" width="480" height="57" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="320" y="68" font-size="14" font-weight="800" fill="#7f1d1d">صدمة؟ أنقذ الدورة الدموية أولاً</text><text x="320" y="86" font-size="12" font-weight="600" fill="#7f1d1d">استعادة حجم الدم وضبط الضغط</text><path d="M320 103 V119" stroke="#64748b" stroke-width="3"/><path d="M314 113 L320 120 L326 113" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="121" width="480" height="57" rx="10" fill="#fef9c3" stroke="#eab308"/><text x="320" y="143" font-size="14" font-weight="800" fill="#422006">سعرات أولاً: كربوهيدرات وسكريات بسيطة ودهون</text><text x="320" y="161" font-size="12" font-weight="600" fill="#422006">بتتولى الطاقة قبل البروتين</text><path d="M320 178 V194" stroke="#64748b" stroke-width="3"/><path d="M314 188 L320 195 L326 188" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="196" width="480" height="57" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="320" y="218" font-size="14" font-weight="800" fill="#1e3a8a">ابدأ التغذية الفموية ببطء وبكثافة سعرية منخفضة</text><text x="320" y="236" font-size="12" font-weight="600" fill="#1e3a8a">الجسم صايم من مدة طويلة</text><path d="M320 253 V269" stroke="#64748b" stroke-width="3"/><path d="M314 263 L320 270 L326 263" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="271" width="480" height="57" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="320" y="293" font-size="14" font-weight="800" fill="#14532d">ثم أضف البروتين تدريجياً</text><text x="320" y="311" font-size="12" font-weight="600" fill="#14532d">اللبن والبيض والدجاج والبقول والجبن القريش</text><path d="M320 328 V344" stroke="#64748b" stroke-width="3"/><path d="M314 338 L320 345 L326 338" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="346" width="480" height="57" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="320" y="368" font-size="14" font-weight="800" fill="#14532d">فيتامينات ومعادن + حديد</text><text x="320" y="386" font-size="12" font-weight="600" fill="#14532d">بعد استقرار الحالة</text></g></svg>