<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="236" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">انتفاخ الرئة مقابل التهاب القصبات المزمن</text><rect x="491" y="50" width="133" height="32" fill="#7c3aed"/><text x="558" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">النوع</text><rect x="303" y="50" width="188" height="32" fill="#7c3aed"/><text x="397" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الوصف</text><rect x="16" y="50" width="287" height="32" fill="#7c3aed"/><text x="160" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلامات</text><rect x="491" y="82" width="133" height="69" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="102" text-anchor="start" font-size="13" fill="#0f172a">انتفاخ الرئة (Pink</text><text x="616" y="121" text-anchor="start" font-size="13" fill="#0f172a">puffer)</text><rect x="303" y="82" width="188" height="69" fill="#ffffff" stroke="#cbd5e1"/><text x="483" y="102" text-anchor="start" font-size="13" fill="#0f172a">تلف الحويصلات وفقد المرونة</text><text x="483" y="121" text-anchor="start" font-size="13" fill="#0f172a">وحبس هواء</text><rect x="16" y="82" width="287" height="69" fill="#ffffff" stroke="#cbd5e1"/><text x="295" y="102" text-anchor="start" font-size="13" fill="#0f172a">جلد وردي وتنفس بشفاه منقبضة، صدر</text><text x="295" y="121" text-anchor="start" font-size="13" fill="#0f172a">برميلي، سعال بسيط أو لا سعال، وضعية</text><text x="295" y="140" text-anchor="start" font-size="13" fill="#0f172a">Tripod</text><rect x="491" y="151" width="133" height="69" fill="#ede9fe" stroke="#cbd5e1"/><text x="616" y="171" text-anchor="start" font-size="13" fill="#0f172a">التهاب القصبات</text><text x="616" y="190" text-anchor="start" font-size="13" fill="#0f172a">المزمن (Blue</text><text x="616" y="209" text-anchor="start" font-size="13" fill="#0f172a">bloater)</text><rect x="303" y="151" width="188" height="69" fill="#ede9fe" stroke="#cbd5e1"/><text x="483" y="171" text-anchor="start" font-size="13" fill="#0f172a">التهاب القصبات وتضخم</text><text x="483" y="190" text-anchor="start" font-size="13" fill="#0f172a">العضلات الملساء وكثرة مخاط</text><rect x="16" y="151" width="287" height="69" fill="#ede9fe" stroke="#cbd5e1"/><text x="295" y="171" text-anchor="start" font-size="13" fill="#0f172a">زرقة، سعال مزمن وبلغم، خرخرة وصفير،</text><text x="295" y="190" text-anchor="start" font-size="13" fill="#0f172a">وذمة طرفية (قلب رئوي)؛ سعال 3 أشهر أو</text><text x="295" y="209" text-anchor="start" font-size="13" fill="#0f172a">أكثر وأسوأ صباحًا</text></svg>