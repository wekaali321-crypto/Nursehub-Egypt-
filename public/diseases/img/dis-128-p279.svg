<text x="663.0" y="142.0" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">ARB (-sartan)</text>
<rect x="403.6842105263158" y="125.0" width="150.5263157894737" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="547.2105263157895" y="142.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">لوسارتان (ثانٍ)</text>
<rect x="9.999999999999943" y="125.0" width="393.68421052631584" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="396.6842105263158" y="142.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">مثل ACE بلا سعال</text>
<rect x="554.2105263157895" y="153.0" width="115.78947368421053" height="59.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="663.0" y="170.0" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">بيتا (-lol)</text>
<rect x="403.6842105263158" y="153.0" width="150.5263157894737" height="59.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="547.2105263157895" y="170.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">أتينولول</text>
<rect x="9.999999999999943" y="153.0" width="393.68421052631584" height="59.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="396.6842105263158" y="170.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">يخفض النبض والضغط؛ احجب عند: بطء &lt;60 أو ضغط 90/60 (إلا في</text>
<text x="396.6842105263158" y="186.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">زيادة حادة)، ضيق تنفس (ربو/COPD)، قصور قلب حاد، ويخفي أعراض</text>
<text x="396.6842105263158" y="203.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">هبوط السكر</text>
<rect x="554.2105263157895" y="212.5" width="115.78947368421053" height="43.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="663.0" y="229.5" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">CCB</text>
<rect x="403.6842105263158" y="212.5" width="150.5263157894737" height="43.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="547.2105263157895" y="229.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">نيفيديبين، ديلتيازيم،</text>
<text x="547.2105263157895" y="246.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">فيراباميل، أملوديبين</text>
<rect x="9.999999999999943" y="212.5" width="393.68421052631584" height="43.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="396.6842105263158" y="229.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">يهدئ الضغط والنبض (تجنب نبضاً/ضغطاً منخفضاً)</text>
<rect x="554.2105263157895" y="255.5" width="115.78947368421053" height="43.0" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="663.0" y="272.5" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">ديجوكسين</text>
<rect x="403.6842105263158" y="255.5" width="150.5263157894737" height="43.0" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="547.2105263157895" y="272.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">—</text>
<rect x="9.999999999999943" y="255.5" width="393.68421052631584" height="43.0" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="396.6842105263158" y="272.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">يقوي الانقباض؛ نبض قمي لدقيقة؛ تسمم فوق 2.0: غثيان وقيء وتغير</text>
<text x="396.6842105263158" y="289.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">رؤية؛ K ≤ 3.5 يزيد السمية</text>
<rect x="554.2105263157895" y="298.5" width="115.78947368421053" height="59.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="663.0" y="315.5" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">مدرات</text>
<rect x="403.6842105263158" y="298.5" width="150.5263157894737" height="59.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="547.2105263157895" y="315.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">فيوروسيمايد، HCTZ</text>
<text x="547.2105263157895" y="332.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">(مضيعة K)؛</text>
<text x="547.2105263157895" y="348.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">سبيرونولاكتون (حافظ K)</text>
<rect x="9.999999999999943" y="298.5" width="393.68421052631584" height="59.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="396.6842105263158" y="315.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">مضيعة: نقص K فأكل موز وبطيخ وخضرة؛ الحافظ: تجنب بدائل الملح</text>
<text x="396.6842105263158" y="332.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">والبطيخ والخضرة الورقية</text>
<rect x="554.2105263157895" y="358.0" width="115.78947368421053" height="43.0" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="663.0" y="375.0" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">موسّعات</text>
<rect x="403.6842105263158" y="358.0" width="150.5263157894737" height="43.0" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="547.2105263157895" y="375.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">نيتروغليسرين،</text>
<text x="547.2105263157895" y="391.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">أيزوسوربيد</text>
<rect x="9.999999999999943" y="358.0" width="393.68421052631584" height="43.0" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="396.6842105263158" y="375.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">ممنوع الفياجرا؛ وريدي: أوقف إن انخفض الانقباضي &lt;90 أو 30 مم؛</text>
<text x="396.6842105263158" y="391.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">الصداع طبيعي والهبوط ضار</text>
<rect x="554.2105263157895" y="401.0" width="115.78947368421053" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="663.0" y="418.0" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">ميلرينون</text>
<rect x="403.6842105263158" y="401.0" width="150.5263157894737" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="547.2105263157895" y="418.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">—</text>
<rect x="9.999999999999943" y="401.0" width="393.68421052631584" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="396.6842105263158" y="418.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">محفز انقباض وريدي، خيار أخير/تلطيفي</text>
<rect x="346.0" y="443.0" width="320.0" height="209.25" rx="10" fill="#0e7490" fill-opacity="0.1" stroke="#0e7490" stroke-width="1.2"/>
<rect x="346.0" y="443.0" width="320.0" height="26" rx="10" fill="#0e7490" fill-opacity="1" stroke="#0e7490" stroke-width="1.2"/>
<text x="506.0" y="461.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الرعاية التمريضية</text>
<text x="656.0" y="487.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• غذاء قليل الصوديوم والسوائل (2 لتر و2 غ أو</text>
<text x="656.0" y="504.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">أقل)</text>
<text x="656.0" y="523.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• خطر السقوط: غيّر الوضع ببطء</text>
<text x="656.0" y="542.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تابع الضغط وBNP (لا يجب أن يرتفعا)</text>
<text x="656.0" y="562.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ارفع الساقين على وسائد وضع فاولر عالٍ</text>
<text x="656.0" y="581.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• وزن يومي: زيادة 3 باوند (نحو 1.4 كغ) أو 5</text>
<text x="656.0" y="598.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">باوند (نحو 2.3 كغ) خلال أسبوع = تدهور</text>
<text x="656.0" y="617.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• الجنس مسموح إن صعد سلمين بلا ضيق نفس</text>
<text x="656.0" y="637.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• جوارب TED لتقليل تجمع الدم، تُخلع يومياً</text>
<rect x="14.0" y="443.0" width="320.0" height="209.25" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="14.0" y="443.0" width="320.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="174.0" y="461.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">تحذيرات</text>
<text x="324.0" y="487.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا أدوية بدون وصفة (سعال وإنفلونزا أو مضادات</text>
<text x="324.0" y="504.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">حموضة أو NSAIDs)</text>
<text x="324.0" y="523.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا أطعمة معلبة أو مصنعة (شيبس، صلصات، لحوم،</text>
<text x="324.0" y="540.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">جبن، نبيذ)</text>
<text x="324.0" y="560.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا تدلك الساقين أبداً</text>
</svg>
