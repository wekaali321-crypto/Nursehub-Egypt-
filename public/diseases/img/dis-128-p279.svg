<text x="663.0" y="99" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">ACE (-pril)</text>
<rect x="403.6842105263158" y="82" width="150.5263157894737" height="43.0" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="547.2105263157895" y="99" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">ليسينوبريل (خيار أول)</text>
<rect x="9.999999999999943" y="82" width="393.68421052631584" height="43.0" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="396.6842105263158" y="99" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">يخفض الضغط فقط؛ تجنب الحمل، وذمة وعائية، سعال، ارتفاع K</text>
<text x="396.6842105263158" y="115.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">(3.5–5.0)</text>
