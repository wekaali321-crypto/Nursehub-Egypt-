<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 466" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="466" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">إعطاء قرص هشاشة العظام الأسبوعي: الخطوات الصحيحة</text><rect x="50" y="52" width="540" height="54" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="320" y="74" text-anchor="middle" font-size="15" font-weight="800" fill="#1e40af">عند الاستيقاظ وعلى معدة فارغة</text><text x="320" y="94" text-anchor="middle" font-size="12.5" fill="#1e40af">قبل أي أكل أو شرب أو دواء آخر</text><text x="320" y="123" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="130" width="540" height="54" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="320" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#166534">اِبلع القرص كامل بكوب ماء كامل (200 مل أو أكثر)</text><text x="320" y="172" text-anchor="middle" font-size="12.5" fill="#166534">ماء عادي فقط: لا عصير ولا شاي ولا لبن</text><text x="320" y="201" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="208" width="540" height="54" rx="12" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="320" y="230" text-anchor="middle" font-size="15" font-weight="800" fill="#854d0e">ابق جالساً أو واقفاً 30 دقيقة على الأقل</text><text x="320" y="250" text-anchor="middle" font-size="12.5" fill="#854d0e">ممنوع النوم أو الانحناء: لحماية المريء</text><text x="320" y="279" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="286" width="540" height="54" rx="12" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="320" y="308" text-anchor="middle" font-size="15" font-weight="800" fill="#9a3412">انتظر 30 دقيقة قبل الأكل أو أي دواء</text><text x="320" y="328" text-anchor="middle" font-size="12.5" fill="#9a3412">والكالسيوم يؤخذ في وقت آخر من اليوم</text><text x="320" y="357" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="364" width="540" height="54" rx="12" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.5"/><text x="320" y="386" text-anchor="middle" font-size="15" font-weight="800" fill="#5b21b6">كرر مرة واحدة في الأسبوع في نفس اليوم</text><text x="320" y="406" text-anchor="middle" font-size="12.5" fill="#5b21b6">لو نسيت: صباح اليوم التالي، ولا تأخذ قرصين في يوم واحد</text><text x="320" y="446" text-anchor="middle" font-size="12.5" fill="#475569">الخطر: التهاب وقرحة المريء لو القرص وقف في البلعوم</text></svg>