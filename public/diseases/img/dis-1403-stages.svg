<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 245" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="245" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مراحل مرض ألزهايمر المبسطة</text><rect x="326" y="56" width="298" height="71" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><rect x="326" y="56" width="298" height="30" rx="12" fill="#16a34a"/><text x="475" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المرحلة 1</text><text x="614" y="108" text-anchor="start" font-size="13" fill="#14532d">لا اختلال واضح في الأداء</text><rect x="16" y="56" width="298" height="71" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><rect x="16" y="56" width="298" height="30" rx="12" fill="#d97706"/><text x="165" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المرحلة 2</text><text x="304" y="108" text-anchor="start" font-size="13" fill="#78350f">نسيان وفقدان الذاكرة القريبة</text><rect x="326" y="139" width="298" height="90" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><rect x="326" y="139" width="298" height="30" rx="12" fill="#ea580c"/><text x="475" y="160" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المرحلة 3</text><text x="614" y="191" text-anchor="start" font-size="13" fill="#7c2d12">فقدان الذاكرة البعيدة، لا يعرف الأسماء</text><text x="614" y="210" text-anchor="start" font-size="13" fill="#7c2d12">أو الأماكن</text><rect x="16" y="139" width="298" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><rect x="16" y="139" width="298" height="30" rx="12" fill="#dc2626"/><text x="165" y="160" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المرحلة 4</text><text x="304" y="191" text-anchor="start" font-size="13" fill="#7f1d1d">طريح الفراش ويحتاج رعاية كاملة</text></svg>