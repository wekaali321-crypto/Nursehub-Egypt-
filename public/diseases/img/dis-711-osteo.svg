<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب العظم والنخاع</text>
<rect x="20.0" y="48" width="295.0" height="110" rx="10" fill="#b91c1c"/>
<text x="167.5" y="78.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">المدخل</text>
<text x="167.5" y="97.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">كسر مفتوح، بعد جراحة</text>
<text x="167.5" y="116.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">جرح وخز (عضة كلب)</text>
<text x="167.5" y="135.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">إبر ملوثة</text>
<rect x="325.0" y="48" width="295.0" height="110" rx="10" fill="#ca8a04"/>
<text x="472.5" y="97.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">العلامات</text>
<text x="472.5" y="116.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">حمى عالية، ألم، صديد</text>
<rect x="20.0" y="168" width="295.0" height="110" rx="10" fill="#0f766e"/>
<text x="167.5" y="208.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">العلاج</text>
<text x="167.5" y="227.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">مضاد وريدي لأسابيع أو أشهر</text>
<text x="167.5" y="246.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">PICC وزيارة تمريض منزلية</text>
<rect x="325.0" y="168" width="295.0" height="110" rx="10" fill="#334155"/>
<text x="472.5" y="208.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الجراحة</text>
<text x="472.5" y="227.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تنضير لتصريف الخراج وإزالة العظم الميت</text>
<text x="472.5" y="246.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">بتر لو لا استجابة</text>
</svg>
