<text x="472.5" y="88.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">أدوية وأمراض</text>
<text x="472.5" y="107.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">كورتيزون، مضادات تشنج</text>
<text x="472.5" y="126.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">فرط جار الدرقية، كوشينج، سكر</text>
