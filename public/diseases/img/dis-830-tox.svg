<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 238" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="238" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">فحص السموم في البول</text><rect x="470" y="48" width="150" height="31" fill="#1e3a8a" stroke="#cbd5e1"/><text x="545" y="67.66666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">البند</text><rect x="20" y="48" width="450" height="31" fill="#1e3a8a" stroke="#cbd5e1"/><text x="245" y="67.66666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">التفاصيل</text><rect x="470" y="79" width="150" height="31" fill="#fff" stroke="#cbd5e1"/><text x="545" y="98.66666666666667" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">المزايا</text><rect x="20" y="79" width="450" height="31" fill="#fff" stroke="#cbd5e1"/><text x="245" y="98.66666666666667" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">البول يحتوي المادة لأيام، الدم لساعات</text><rect x="470" y="110" width="150" height="48" fill="#eef2ff" stroke="#cbd5e1"/><text x="545" y="138.16666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">يكشف</text><rect x="20" y="110" width="450" height="48" fill="#eef2ff" stroke="#cbd5e1"/><text x="245" y="129.91666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">كحول، منشطات، باربيتورات، بنزوديازبين، قنب، كوكايين، ميثامفيتامين،</text><text x="245" y="146.41666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أفيونات، PCP، بروبوكسيفين</text><rect x="470" y="158" width="150" height="31" fill="#fff" stroke="#cbd5e1"/><text x="545" y="177.66666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">قبل الفحص</text><rect x="20" y="158" width="450" height="31" fill="#fff" stroke="#cbd5e1"/><text x="245" y="177.6666666