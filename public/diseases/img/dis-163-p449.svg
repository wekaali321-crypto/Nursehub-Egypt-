<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 237" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="237" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب اللوزتين وخراجها واستئصالها</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="168.2" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#f59e0b"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">التهاب اللوزتين</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• التهاب نسيج اللوزتين</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">قرب الحلق؛ قد يسد المجرى</text><text x="612" y="135.4" text-anchor="start" font-size="13" fill="#0f172a">الهوائي</text><text x="612" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">• العلامة المفتاحية: ألم</text><text x="612" y="176.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">حلق مع صعوبة فتح الفم</text><text x="612" y="195" text-anchor="start" font-size="13" fill="#0f172a">والبلع — أولوية</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="168.2" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">استئصال اللوزتين</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• جراحة بسيطة لكن خطر</text><text x="408.66666666666663" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">النزف كبير</text><text x="408.66666666666663" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• أبلغ بعد الجراحة: بلع</text><text x="408.66666666666663" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">متكرر، قلق وتململ، سعال</text><text x="408.66666666666663" y="176.8" text-anchor="start" font-size="13" fill="#0f172a">مستمر (علامات نزف)</text><rect x="20" y="54" width="193.33333333333334" height="168.2" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">تثقيف بعد الجراحة</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• تجنب السعال ونفخ الأنف</text><text x="205.33333333333334" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• تجنب الأطعمة الحادة</text><text x="205.33333333333334" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">(شيبس، مكسرات)</text><text x="205.33333333333334" y="163.6" text-anchor="start" font-size="13" fill="#0f172a">• لا منتجات ألبان</text><text x="205.33333333333334" y="186.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">• لا تنظيف أسنان عنيف أو</text><text x="205.33333333333334" y="204.99999999999997" text-anchor="start" font-size="13" fill="#0f172a">غرغرة</text></svg>
