<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 418" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="700" height="418" rx="16" fill="#f8fafc"/>
<text x="350.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">خافضات السكر الفموية ومضاعفات السكري</text>
<rect x="499.6" y="52" width="190.39999999999998" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="594.8" y="72" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">الدواء</text>
<rect x="10.0" y="52" width="489.6" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="254.8" y="72" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">التحذير</text>
<rect x="499.6" y="82" width="190.39999999999998" height="28" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="683.0" y="99" text-anchor="start" font-size="11.5" font-weight="800" fill="#0f172a">أولاً</text>
<rect x="10.0" y="82" width="489.6" height="28" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="492.6" y="99" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الحمية والرياضة قبل أي دواء فموي أو إنسولين</text>
<rect x="499.6" y="110" width="190.39999999999998" height="44.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="683.0" y="127" text-anchor="start" font-size="11.5" font-weight="800" fill="#0f172a">ميتفورمين</text>
<rect x="10.0" y="110" width="489.6" height="44.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="492.6" y="127" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">قلة خطر نقص السكر وفقدان الوزن؛ حماض لاكتيكي: لا كحول، ويُوقف قبل وبعد</text>
<text x="492.6" y="144.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الصبغة بـ 48 ساعة (الصبغة تؤذي الكلى)</text>
<rect x="499.6" y="154.5" width="190.39999999999998" height="44.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="683.0" y="171.5" text-anchor="start" font-size="11.5" font-weight="800" fill="#0f172a">جليبيزايد/جليبيورايد</text>
<text x="683.0" y="188.75" text-anchor="start" font-size="11.5" font-weight="800" fill="#0f172a">(سلفونيل يوريا)</text>
<rect x="10.0" y="154.5" width="489.6" height="44.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="492.6" y="171.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">يخفض السكر ويضر الكحول فيه؛ سمية كلوية/كبدية وكبار السن؛ حروق شمس: واقي</text>
<text x="492.6" y="188.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">ولباس</text>
<rect x="499.6" y="199.0" width="190.39999999999998" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="683.0" y="216.0" text-anchor="start" font-size="11.5" font-weight="800" fill="#0f172a">بيوجليتازون (TZD)</text>
<rect x="10.0" y="199.0" width="489.6" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="492.6" y="216.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">لا لمرضى قصور القلب (وذمة وخراخر)، ولا للكبد (تشمع/فشل كبد)</text>
<rect x="356.0" y="241.0" width="330.0" height="149.5" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="356.0" y="241.0" width="330.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="521.0" y="259.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">المضاعفات</text>
<text x="676.0" y="285.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• كلى: اعتلال (كرياتينين فوق 1.3)</text>
<text x="676.0" y="304.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• عين: اعتلال الشبكية (عمى)</text>
<text x="676.0" y="323.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قلب: ضغط وتصلب شرايين</text>
<text x="676.0" y="342.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• مخ: سكتة</text>
<text x="676.0" y="362.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أعصاب: اعتلال (فقد الإحساس)</text>
<rect x="14.0" y="241.0" width="330.0" height="149.5" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="14.0" y="241.0" width="330.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="179.0" y="259.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الحمية</text>
<text x="334.0" y="285.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تجنب السكريات البسيطة: صودا وحلوى وخبز أبيض</text>
<text x="334.0" y="302.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">وعصير</text>
<text x="334.0" y="321.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• جيد: ألياف عالية بنية (فول، أرز بني، خبز وحبوب</text>
<text x="334.0" y="338.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">كاملة)</text>
<text x="334.0" y="358.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• سيئ: ألياف قليلة بيضاء (خبز أبيض، أرز أبيض،</text>
<text x="334.0" y="375.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">بطاطس مقلية، حليب قليل الدسم)</text>
</svg>
