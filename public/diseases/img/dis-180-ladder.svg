<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 378" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="378" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">سُلّم علاج التبول اللاإرادي بالليل (للطفل فوق 5 سنين)</text><g text-anchor="middle"><rect x="80" y="46" width="480" height="74" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="320" y="68" font-size="14" font-weight="800" fill="#14532d">1) طمأنة + تنظيم عادات</text><text x="320" y="86" font-size="12" font-weight="600" fill="#14532d">قلّل السوائل قبل النوم، تبوّل قبل النوم، روتين استيقاظ، مفيش</text><text x="320" y="103" font-size="12" font-weight="600" fill="#14532d">عقاب</text><path d="M320 120 V136" stroke="#64748b" stroke-width="3"/><path d="M314 130 L320 137 L326 130" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="138" width="480" height="57" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="320" y="160" font-size="14" font-weight="800" fill="#1e3a8a">2) استبعاد أسباب عضوية</text><text x="320" y="178" font-size="12" font-weight="600" fill="#1e3a8a">عدوى بولية؟ إمساك؟ سكر؟ جهاز عصبي؟</text><path d="M320 195 V211" stroke="#64748b" stroke-width="3"/><path d="M314 205 L320 212 L326 205" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="213" width="480" height="74" rx="10" fill="#fef9c3" stroke="#eab308"/><text x="320" y="235" font-size="14" font-weight="800" fill="#422006">3) جهاز إنذار البلل (Alarm) أو دواء بأمر الطبيب</text><text x="320" y="253" font-size="12" font-weight="600" fill="#422006">Desmopressin / Imipramine حسب المصدر / Oxybutynin للمثانة</text><text x="320" y="270" font-size="12" font-weight="600" fill="#422006">المفرطة النشاط</text><path d="M320 287 V303" stroke="#64748b" stroke-width="3"/><path d="M314 297 L320 304 L326 297" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="305" width="480" height="57" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="320" y="327" font-size="14" font-weight="800" fill="#7f1d1d">4) متابعة وتحويل للمتخصص لو مفيش استجابة</text><text x="320" y="345" font-size="12" font-weight="600" fill="#7f1d1d">طبيب أطفال / كلى وجهاز بولي</text></g></svg>