<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="320" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب اللوزتين وفغر القصبة عند الأطفال</text><rect x="330" y="50" width="290" height="90" rx="10" fill="#f59e0b"/><text x="475.0" y="71.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">التهاب اللوزتين</text><text x="475.0" y="89.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">فتح الفم بصعوبة (Trismus) = خراج لوزة</text><text x="475.0" y="107.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">صوت مكتوم وتجمع لعاب</text><text x="475.0" y="125.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">أبلغ الطبيب فورًا</text><rect x="20" y="50" width="300" height="90" rx="10" fill="#dc2626"/><text x="170.0" y="80.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">بعد الاستئصال</text><text x="170.0" y="98.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">بلع متكرر بعد استئصال اللوزتين = نزف</text><text x="170.0" y="116.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">الإجراء: وضع جانبي (Side-lying)</text><rect x="20" y="155" width="600" height="70" rx="10" fill="#6366f1"/><text x="320.0" y="184.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">فغر القصبة</text><text x="320.0" y="202.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">أهم تثقيف: انسلال الأنبوب (Decannulation) خطر قاتل لأنه يفقد المجرى الهوائي</text><rect x="20" y="240" width="600" height="70" rx="10" fill="#16a34a"/><text x="320.0" y="260.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">تثقيف الأهل</text><text x="320.0" y="278.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">السفر دائمًا مع أنبوبين احتياطيين: بنفس الحجم وبحجم أصغر</text><text x="320.0" y="296.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">أدوات الشفط خلف الكرسي المتحرك أثناء التنقل</text></svg>