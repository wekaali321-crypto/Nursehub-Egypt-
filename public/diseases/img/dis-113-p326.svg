<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 412" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="412" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التصلب الجلدي (Scleroderma) ومتلازمة CREST</text><rect x="10" y="52" width="620" height="53.5" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="320" y="71.75" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7f1d1d">الأولوية: ارتفاع الضغط المفاجئ + صداع قد يسبق جلطة دماغية. الاسم: Sclero = متصلب،</text><text x="320" y="90.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7f1d1d">Derma = جلد.</text><rect x="30" y="115.5" width="550" height="28.125" rx="0" fill="#0369a1" stroke="#cbd5e1" stroke-width="1"/><text x="545.0" y="134.875" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">الحرف</text><line x1="510" y1="115.5" x2="510" y2="143.625" stroke="#cbd5e1" stroke-width="1"/><text x="435.0" y="134.875" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">المعنى</text><line x1="360" y1="115.5" x2="360" y2="143.625" stroke="#cbd5e1" stroke-width="1"/><text x="195.0" y="134.875" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">الوصف</text><rect x="30" y="143.625" width="550" height="28.125" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="545.0" y="163.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">C</text><line x1="510" y1="143.625" x2="510" y2="171.75" stroke="#cbd5e1" stroke-width="1"/><text x="435.0" y="163.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">Calcinosis</text><line x1="360" y1="143.625" x2="360" y2="171.75" stroke="#cbd5e1" stroke-width="1"/><text x="195.0" y="163