<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="560" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">العناية بالفغرة الرغامية (Tracheostomy) والشفط</text>
  <rect x="330" y="50" width="290" height="170" rx="10" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">التقييم قبل العناية</text><text x="608" y="96" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• الرائحة ونوع القنية</text><text x="608" y="121" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• أصوات الرئة قبل وبعد</text><text x="608" y="146" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• الإفرازات وسلامة الجلد وعلامات العدوى</text><text x="608" y="171" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• نوع الفغرة والضمادة</text><rect x="20" y="50" width="290" height="170" rx="10" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">المخاطر والطوارئ</text><text x="298" y="96" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• عدوى، نقص أكسجة، إصابة</text><text x="298" y="121" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• جهّز أدوات الطوارئ دائمًا</text><text x="298" y="146" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• كيس إنعاش (Ambu) لمريض الجهاز</text><text x="298" y="171" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• في حال انزلاق الأنبوب</text><rect x="20" y="235" width="600" height="200" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="260" text-anchor="middle" font-size="14" font-weight="800" fill="#1e293b">خطوات التنظيف (مختصرة)</text><text x="610" y="288" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">1) غسل اليدين وشرح الإجراء وجهز الصينية (قفاز معقم + حوضان بملح)</text><text x="610" y="312" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">2) أزل القنية الداخلية (فك قفل ثم اسحبها)، انقعها ونظفها بالفرشاة بملح معقم</text><text x="610" y="336" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">3) جففها وأعدها وأقفلها (إدارة لليمين)</text><text x="610" y="360" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">4) نظف الجلد حول الفغرة بشاش من الحوض النظيف، بشاش مستقل للقنية الخارجية</text><text x="610" y="384" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">5) ضمادة جديدة مشقوقة غير متهرئة، بدّل الأربطة عند الحاجة</text><text x="610" y="408" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">6) اسأل المريض عن حاجته، اخفض السرير، وضع الجرس في المتناول</text><rect x="20" y="450" width="600" height="95" rx="10" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="472" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">التوثيق</text><text x="608" y="496" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• الوقت، الإفرازات (اللون والرائحة والكمية)، استجابة المريض، الوضع بعد الإجراء، الشفط ونوع الإفراز</text>
</svg>
