<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="340" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">فين بيشتغل كل دواء؟</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="440" y="50" width="180" height="70" rx="12" fill="#2563eb"/><text x="530" y="75" fill="#fff">البنكرياس</text><text x="530" y="96" font-size="12" font-weight="400" fill="#dbeafe">↑ إفراز الإنسولين</text><text x="530" y="112" font-size="11" font-weight="400" fill="#dbeafe">Sulphonylureas / Repaglinide</text>
    <rect x="230" y="50" width="180" height="70" rx="12" fill="#16a34a"/><text x="320" y="75" fill="#fff">الكبد</text><text x="320" y="96" font-size="12" font-weight="400" fill="#dcfce7">↓ تصنيع الجلوكوز</text><text x="320" y="112" font-size="11" font-weight="400" fill="#dcfce7">Metformin (+ Sulphonylureas)</text>
    <rect x="20" y="50" width="180" height="70" rx="12" fill="#d97706"/><text x="110" y="75" fill="#fff">العضلات والدهون</text><text x="110" y="96" font-size="12" font-weight="400" fill="#fef3c7">↓ مقاومة الإنسولين</text><text x="110" y="112" font-size="11" font-weight="400" fill="#fef3c7">Pioglitazone / Metformin</text>
    <rect x="440" y="150" width="180" height="70" rx="12" fill="#7c3aed"/><text x="530" y="175" fill="#fff">الأمعاء</text><text x="530" y="196" font-size="12" font-weight="400" fill="#ede9fe">↓ امتصاص النشويات</text><text x="530" y="212" font-size="11" font-weight="400" fill="#ede9fe">Acarbose (Glucobay)</text>
    <rect x="230" y="150" width="180" height="70" rx="12" fill="#0891b2"/><text x="320" y="175" fill="#fff">الشهية والخلايا</text><text x="320" y="196" font-size="12" font-weight="400" fill="#cffafe">↓ شهية، ↑ دخول الجلوكوز</text><text x="320" y="212" font-size="11" font-weight="400" fill="#cffafe">Metformin</text>
  </g>
  <rect x="20" y="245" width="600" height="75" rx="12" fill="#fef9c3"/>
  <text x="320" y="272" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">النحيف: ابدأ بـ Sulphonylurea (يزوّد الوزن) — السمين: ابدأ بـ Metformin (بينقّص الوزن)</text>
  <text x="320" y="298" text-anchor="middle" font-size="13" fill="#713f12">Metformin وحده لا يسبب هبوط سكر، أما Sulphonylureas فبتسببه</text>
</svg>
