<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="270" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">3 أنواع لالتهاب المعدة المزمن</text>
  <g text-anchor="middle">
    <rect x="440" y="50" width="180" height="170" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="530" y="78" font-size="15" font-weight="800" fill="#991b1b">1) نشط مزمن</text>
    <g fill="#16a34a"><ellipse cx="500" cy="115" rx="14" ry="6"/><ellipse cx="530" cy="130" rx="14" ry="6" transform="rotate(-20 530 130)"/><ellipse cx="560" cy="112" rx="14" ry="6" transform="rotate(25 560 112)"/></g>
    <text x="530" y="165" font-size="13" font-weight="700" fill="#0f172a">جرثومة H. pylori</text>
    <text x="530" y="188" font-size="12" fill="#475569">أشهرها وقابلة للعلاج</text>
    <rect x="230" y="50" width="190" height="170" rx="14" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="325" y="78" font-size="15" font-weight="800" fill="#3730a3">2) مناعي ذاتي</text>
    <circle cx="325" cy="120" r="24" fill="#c7d2fe" stroke="#4f46e5" stroke-width="2"/><path d="M300,95 L312,106 M350,95 L338,106" stroke="#4f46e5" stroke-width="3"/>
    <text x="325" y="165" font-size="13" font-weight="700" fill="#0f172a">الجسم يهاجم خلايا المعدة</text>
    <text x="325" y="188" font-size="12" fill="#475569">ليس بسبب جرثومة</text>
    <rect x="20" y="50" width="190" height="170" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="115" y="78" font-size="15" font-weight="800" fill="#854d0e">3) كيميائي</text>
    <rect x="95" y="100" width="40" height="22" rx="11" fill="#fff" stroke="#ca8a04" stroke-width="2"/><line x1="115" y1="100" x2="115" y2="122" stroke="#ca8a04" stroke-width="2"/>
    <text x="115" y="165" font-size="13" font-weight="700" fill="#0f172a">مسكنات NSAIDs مزمنة</text>
    <text x="115" y="188" font-size="12" fill="#475569">يُوقف السبب</text>
  </g>
  <text x="320" y="250" text-anchor="middle" font-size="12" fill="#475569">الأعراض متشابهة في الأنواع الثلاثة ويحدد النوع التشخيص</text>
</svg>
