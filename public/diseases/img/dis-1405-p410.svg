<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 417" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="417" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">إدارة السلس وأسئلة الامتحان</text><rect x="325" y="54" width="295" height="173.2" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="325" y="54" width="295" height="29" rx="10" fill="#10b981"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">التدبير</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• تدريب المثانة: التبول كل ساعتين</text><text x="612" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• تمارين كيجل 4 مرات يوميًا</text><text x="612" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• إنقاص الوزن</text><text x="612" y="168.6" text-anchor="start" font-size="13" fill="#0f172a">• تجنب الكافيين والكحول والتدخين</text><text x="612" y="191.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">• oxybutynin لتقليل تقلصات المثانة</text><text x="612" y="209.99999999999997" text-anchor="start" font-size="13" fill="#0f172a">(جفاف الفم)</text><rect x="20" y="54" width="295" height="173.2" rx="10" fill="#14b8a6" fill-opacity="0.1" stroke="#14b8a6" stroke-width="1.5"/><rect x="20" y="54" width="295" height="29" rx="10" fill="#14b8a6"/><text x="307" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">السلس الفيضي</text><text x="307" y="99" text-anchor="start" font-size="13" fill="#0f172a">• اضغط/ابذل جهدًا أثناء التبول</text><text x="307" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• انتظر 30 ثانية ثم حاول التبول مجددًا</text><text x="307" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• راقب تهتك الجلد</text><text x="307" y="168.6" text-anchor="start" font-size="13" fill="#0f172a">• سجّل الناتج</text><rect x="20" y="237.2" width="600" height="27.5" fill="#0ea5e9"/><text x="614" y="253.95" text-anchor="start" font-size="12.5" font-weight="700" fill="#fff">السؤال</text><text x="326" y="253.95" text-anchor="start" font-size="12.5" font-weight="700" fill="#fff">الجواب</text><rect x="20" y="264.7" width="600" height="27.5" fill="#0ea5e9" fill-opacity="0.07" stroke="#0ea5e9" stroke-opacity="0.3"/><text x="614" y="281.45" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">أول إجراء لتدريب العادة البولية</text><text x="326" y="281.45" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">تحديد نمط التبول للمريض</text><rect x="20" y="292.2" width="600" height="27.5" fill="#fff" fill-opacity="1" stroke="#0ea5e9" stroke-opacity="0.3"/><text x="614" y="308.95" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">مسنة 200 رطل مع سلس إجهادي</text><text x="326" y="308.95" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">نقاش إنقاص الوزن</text><rect x="20" y="319.7" width="600" height="27.5" fill="#0ea5e9" fill-opacity="0.07" stroke="#0ea5e9" stroke-opacity="0.3"/><text x="614" y="336.45" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">مؤشر كتلة 32 مع سلس إجهادي</text><text x="326" y="336.45" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">انقص الوزن</text><rect x="20" y="347.2" width="600" height="27.5" fill="#fff" fill-opacity="1" stroke="#0ea5e9" stroke-opacity="0.3"/><text x="614" y="363.95" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">بعد ولادة ثانية: سلس إجهادي</text><text x="326" y="363.95" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">تمارين كيجل 4 مرات يوميًا</text><rect x="20" y="374.7" width="600" height="27.5" fill="#0ea5e9" fill-opacity="0.07" stroke="#0ea5e9" stroke-opacity="0.3"/><text x="614" y="391.45" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">خطة: كيجل 4 مرات + مرحاض كل ساعتين</text><text x="326" y="391.45" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">سلس بولي</text></svg>
