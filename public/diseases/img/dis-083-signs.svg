<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 218" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="218" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">إشارات نقص الكالسيوم عند السرير</text><rect x="12" y="44" width="616" height="30" rx="8" fill="#0f172a"/><text x="557.4166666666667" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">العلامة</text><text x="345.66666666666674" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">طريقة الفحص</text><text x="108.25000000000007" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">الدلالة</text><rect x="12" y="74" width="616" height="28" fill="#fff"/><text x="557.4166666666667" y="92" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">Chvostek</text><text x="345.66666666666674" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">نقرة على العصب الوجهي أمام الأذن</text><text x="108.25000000000007" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">تشنج عضلات الوجه</text><rect x="12" y="102" width="616" height="28" fill="#f1f5f9"/><text x="557.4166666666667" y="120" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">Trousseau</text><text x="345.66666666666674" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">نفخ كفة الضغط فوق الضغط الانقباضي 3 دقائق</text><text x="108.25000000000007" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">تقلص اليد (Carpal spasm)</text><rect x="12" y="130" width="616" height="44" fill="#fff"/><text x="557.4166666666667" y="148" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">وخز حول الفم</text><text x="557.4166666666667" y="164" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">والأطراف</text><text x="345.66666666666674" y="148" text-anchor="mi