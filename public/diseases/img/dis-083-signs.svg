<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">علامتان لنقص الكالسيوم الكامن</text>
<g><rect x="340" y="48" width="280" height="200" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="2.5"/><text x="480" y="75" text-anchor="middle" font-size="15" font-weight="800" fill="#0369a1">علامة تروسو (Trousseau)</text><rect x="380" y="120" width="130" height="38" rx="14" fill="#fde68a" stroke="#b45309" stroke-width="2"/><rect x="430" y="112" width="26" height="54" rx="4" fill="#ef4444"/><text x="443" y="144" text-anchor="middle" font-size="10" fill="#fff" transform="rotate(-90 443 144)">الكفة</text><path d="M510 130 Q550 110 565 118 L560 128 Q548 124 515 142 Z" fill="#fcd34d" stroke="#b45309" stroke-width="2"/><text x="480" y="195" text-anchor="middle" font-size="12.5" fill="#334155">نفخ الكفة فوق الضغط الانقباضي 3 دقايق</text><text x="480" y="215" text-anchor="middle" font-size="12.5" fill="#334155">= تقلّص اليد (Carpal spasm)</text><text x="480" y="236" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="700">الإبهام للداخل والأصابع مضمومة</text></g><g><rect x="20" y="48" width="300" height="200" rx="12" fill="#fff" stroke="#8b5cf6" stroke-width="2.5"/><text x="170" y="75" text-anchor="middle" font-size="15" font-weight="800" fill="#6d28d9">علامة شفوستك (Chvostek)</text><ellipse cx="170" cy="140" rx="45" ry="55" fill="#fde68a" stroke="#b45309" stroke-width="2"/><circle cx="153" cy="130" r="4" fill="#0f172a"/><circle cx="187" cy="130" r="4" fill="#0f172a"/><path d="M155 165 Q170 175 185 165" fill="none" stroke="#0f172a" stroke-width="2"/><circle cx="205" cy="148" r="8" fill="#ef4444"/><path d="M216 145 L240 130" stroke="#ef4444" stroke-width="2"/><text x="248" y="128" font-size="11" fill="#b91c1c">النقر</text><text x="170" y="208" text-anchor="middle" font-size="12.5" fill="#334155">نقر العصب الوجهي أمام الأذن</text><text x="170" y="228" text-anchor="middle" font-size="12.5" fill="#334155">= ارتعاش عضلات الوجه والشفة</text></g><text x="320" y="285" text-anchor="middle" font-size="12" fill="#475569">العلامتان تدلّان على زيادة استثارة الأعصاب، لكن غيابهما لا يستبعد النقص</text></svg>
