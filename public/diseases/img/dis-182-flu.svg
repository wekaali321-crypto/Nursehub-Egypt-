<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="190" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الإنفلونزا: ما يجب أن تعرفه</text>
<rect x="20.0" y="48" width="193.33333333333334" height="120" rx="10" fill="#0369a1"/>
<text x="116.66666666666667" y="93.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">السبب</text>
<text x="116.66666666666667" y="112.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">فيروس (A, B, C)</text>
<text x="116.66666666666667" y="131.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ليس بكتيريا فلا مضاد حيوي</text>
<rect x="223.33333333333334" y="48" width="193.33333333333334" height="120" rx="10" fill="#ca8a04"/>
<text x="320.0" y="93.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الطفرات</text>
<text x="320.0" y="112.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">الفيروس يتحور باستمرار</text>
<text x="320.0" y="131.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تطعيم سنوي موصى به</text>
<rect x="426.6666666666667" y="48" width="193.33333333333334" height="120" rx="10" fill="#b91c1c"/>
<text x="523.3333333333334" y="102.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الأعراض</text>
<text x="523.3333333333334" y="121.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">حمى، تعب، آلام جسم</text>
</svg>
