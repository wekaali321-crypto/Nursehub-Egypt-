<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 274" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="274" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">الحمل خارج الرحم: متى تشك؟</text>
<rect x="20" y="44" width="600" height="46" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="44" width="160" height="46" rx="10" fill="#b91c1c"/><text x="540" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العرض الأشيع</text><text x="448" y="72" text-anchor="end" font-size="13" fill="#0f172a">ألم في البطن أكتر من النزيف</text><rect x="20" y="98" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="98" width="160" height="54" rx="10" fill="#d97706"/><text x="540" y="130" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">القاعدة</text><text x="448" y="121" text-anchor="end" font-size="13" fill="#0f172a">أي ألم بطن حاد عند سيدة في سن الإنجاب = حمل خارج الرحم</text><text x="448" y="139" text-anchor="end" font-size="13" fill="#0f172a">حتى يثبت العكس</text><rect x="20" y="160" width="600" height="46" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="160" width="160" height="46" rx="10" fill="#0369a1"/><text x="540" y="188" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">اللازم</text><text x="448" y="188" text-anchor="end" font-size="13" fill="#0f172a">اختبار حمل + سونار حوض وبطن</text><rect x="20" y="214" width="600" height="46" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="214" width="160" height="46" rx="10" fill="#7c3aed"/><text x="540" y="242" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">حتى لو...</text><text x="448" y="242" text-anchor="end" font-size="13" fill="#0f172a">الدورة لم تتأخر أو في لولب/حبوب منع الحمل</text>
</svg>
