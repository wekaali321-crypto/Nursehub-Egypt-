<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 334" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="334" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">حمل خارج الرحم: ملخص</text><rect x="470.0" y="50" width="150.0" height="31" fill="#1e3a8a" stroke="#cbd5e1"/><text x="545.0" y="70.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">العنصر</text><rect x="20.0" y="50" width="450.0" height="31" fill="#1e3a8a" stroke="#cbd5e1"/><text x="245.0" y="70.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">النقاط</text><rect x="470.0" y="81" width="150.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="545.0" y="101.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">الحدث</text><rect x="20.0" y="81" width="450.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="245.0" y="101.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">انغراس البويضة المخصبة خارج الرحم غالباً بالأنبوب</text><rect x="470.0" y="112" width="150.0" height="48" fill="#eef2ff" stroke="#cbd5e1"/><text x="545.0" y="140.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">عوامل الخطر</text><rect x="20.0" y="112" width="450.0" height="48" fill="#eef2ff" stroke="#cbd5e1"/><text x="245.0" y="132.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">عدوى كلاميديا متكررة، PID، جراحات الأنبوب وندباته، اللولب، أدوية</text><text x="245.0" y="149.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">الخصوبة</text><rect x="470.0" y="160" width="150.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="545.0" y="180.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">التشخيص</text><rect x="20.0" y="160" width="450.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="245.0" y="180.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">hCG إيجابي مع رحم فارغ بالسونار</text><rect x="470.0" y="191" width="150.0" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="545.0" y="211.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">العلامات</text><rect x="20.0" y="191" width="450.0" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="245.0" y="211.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">نزف أحمر قليل، ألم أسفل البطن من جانب</text><rect x="470.0" y="222" width="150.0" height="48" fill="#fff" stroke="#cbd5e1"/><text x="545.0" y="250.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">عند التمزق</text><rect x="20.0" y="222" width="450.0" height="48" fill="#fff" stroke="#cbd5e1"/><text x="245.0" y="242.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">هبوط ضغط وتسارع نبض &gt;100 ودوخة، ألم كتف مفاجئ شديد حاد، التهاب</text><text x="245.0" y="259.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">صفاق (بطن صلب وحمى 38)</text><rect x="470.0" y="270" width="150.0" height="48" fill="#eef2ff" stroke="#cbd5e1"/><text x="545.0" y="298.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">التدخل</text><rect x="20.0" y="270" width="450.0" height="48" fill="#eef2ff" stroke="#cbd5e1"/><text x="245.0" y="290.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">علامات حيوية، تجهيز نقل دم (فصيلة وتصالب)، خطان كبيران، تجهيز</text><text x="245.0" y="307.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">جراحة</text></svg>