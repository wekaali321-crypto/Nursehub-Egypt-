<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 213" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="213" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الكلاميديا: أهم النقاط</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="145" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#f59e0b"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الأعراض</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• معظمهم بلا أعراض أو</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">أعراض بسيطة</text><text x="612" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• الأشيع بين الشابات</text><text x="612" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">ومتعددات الشركاء</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="145" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">العلاج</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• azithromycin أو</text><text x="408.66666666666663" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">doxycycline</text><text x="408.66666666666663" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• لا جماع لمدة 7 أيام</text><text x="408.66666666666663" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">بعد بدء العلاج</text><text x="408.66666666666663" y="181.8" text-anchor="start" font-size="13" fill="#0f172a">• يجب علاج الشريك</text><rect x="20" y="54" width="193.33333333333334" height="145" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">المضاعفات والفحص</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• العقم والالتهاب الحوضي</text><text x="205.33333333333334" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">(PID) إن لم تُعالج</text><text x="205.33333333333334" y="135.4" text-anchor="start" font-size="13" fill="#0f172a">الكلاميديا والسيلان</text><text x="205.33333333333334" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">• فحص سنوي مع فحص الشريك</text><text x="205.33333333333334" y="181.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">• تنتقل حتى بلا أعراض</text></svg>
