<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="400" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">كيف تحدث الحموضة الكيتونية (DKA)؟</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="90" y="44" width="460" height="42" rx="10" fill="#dc2626"/><text x="320" y="70" fill="#fff">نقص شديد في الإنسولين (نسيان جرعة، عدوى، ضغط)</text>
    <rect x="30" y="118" width="270" height="58" rx="10" fill="#fef3c7"/><text x="165" y="142" fill="#78350f">الجلوكوز مش بيدخل الخلايا</text><text x="165" y="162" font-size="12" font-weight="400" fill="#78350f">سكر الدم يعلى (فرط سكر)</text>
    <rect x="340" y="118" width="270" height="58" rx="10" fill="#e0e7ff"/><text x="475" y="142" fill="#312e81">الجسم يحرق الدهون للطاقة</text><text x="475" y="162" font-size="12" font-weight="400" fill="#312e81">ينتج أجسام كيتونية (أسيتون)</text>
    <rect x="30" y="208" width="270" height="58" rx="10" fill="#fed7aa"/><text x="165" y="232" fill="#7c2d12">سكر بيخرج في البول ومعاه ميّة</text><text x="165" y="252" font-size="12" font-weight="400" fill="#7c2d12">تبول كتير ← جفاف ← هبوط ضغط</text>
    <rect x="340" y="208" width="270" height="58" rx="10" fill="#fecaca"/><text x="475" y="232" fill="#7f1d1d">حموضة في الدم (Acidosis)</text><text x="475" y="252" font-size="12" font-weight="400" fill="#7f1d1d">تنفس كوسماول + ريحة أسيتون + غثيان</text>
    <rect x="130" y="300" width="380" height="58" rx="10" fill="#0f172a"/><text x="320" y="324" fill="#fff">النتيجة: جفاف + حموضة + نقص بوتاسيوم + غيبوبة</text><text x="320" y="344" font-size="12" font-weight="400" fill="#cbd5e1">الجفاف هو الأخطر وأول ما يُعالج</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none"><path d="M260 86 L165 118"/><path d="M380 86 L475 118"/><path d="M165 176 L165 208"/><path d="M475 176 L475 208"/><path d="M165 266 L260 300"/><path d="M475 266 L380 300"/></g>
  <text x="320" y="385" text-anchor="middle" font-size="11" fill="#64748b">الصورة توضيحية مبسطة</text>
</svg>
