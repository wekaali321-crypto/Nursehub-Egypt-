<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="244" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">متلازمة الكحول الجنينية: ملامح الوجه</text><rect x="325" y="46" width="295" height="152" rx="12" fill="#bae6fd"/><text x="472.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">ملامح الوجه المميزة</text><text x="472.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">فلتروم غير واضح (Indistinct philtrum)</text><text x="472.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">شفة علوية رفيعة</text><text x="472.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">شقوق جفنية قصيرة</text><text x="472.5" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">ثنيات إبيكانثية</text><text x="472.5" y="176" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">منتصف وجه مسطح</text><rect x="20" y="46" width="295" height="152" rx="12" fill="#bbf7d0"/><text x="167.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">أعراض</text><text x="167.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">إعاقة ذهنية وتأخر نمو</text><text x="167.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">نقص توتر وضعف مص</text><text x="167.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">تجاعيد راحة غير طبيعية</text><text x="167.5" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">تهيّج واستجابة ضعيفة للمنبهات</text><text x="167.5" y="176" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">صغر الرأس (Microcephaly)</text><text x="320" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">لا مقدار آمن من الكحول أثناء الحمل</text>
</svg>
