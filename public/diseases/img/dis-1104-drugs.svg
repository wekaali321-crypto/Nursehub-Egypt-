<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 382" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="382" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >أدوية بنطاق علاجي ضيق: مستوى السمّية</text><rect x="20" y="48" width="600" height="52" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="510" y="48" width="110" height="52" rx="10" fill="#2563eb" stroke="none" stroke-width="1"/><text x="565" y="80" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >الليثيوم</text><text x="430" y="80" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a" direction="ltr">أكبر من 1.5</text><text x="240" y="80" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569" >عطش شديد، تبوّل كثير، قيء وإسهال</text><rect x="20" y="110" width="600" height="52" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/><rect x="510" y="110" width="110" height="52" rx="10" fill="#dc2626" stroke="none" stroke-width="1"/><text x="565" y="142" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >الديجوكسين</text><text x="430" y="142" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a" direction="ltr">أكبر من 2.0</text><text x="240" y="142" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569" >غثيان، تغيّر الرؤية، بطء نبض</text><rect x="20" y="172" width="600" height="52" rx="10" fill="#fff" stroke="#f97316" stroke-width="2"/><rect x="510" y="172" width="110" height="52" rx="10" fill="#f97316" stroke="none" stroke-width="1"/><text x="565" y="204" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >الثيوفيللين</text><text x="430" y="204" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a" direction="ltr">أكبر من 20</text><text x="240" y="204" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569" >غثيان، تسارع نبض، تشنجات</text><rect x="20" y="234" width="600" height="52" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="510" y="234" width="110" height="52" rx="10" fill="#16a34a" stroke="none" stroke-width="1"/><text x="565" y="266" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >الفينيتوين</text><text x="430" y="266" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a" direction="ltr">أكبر من 20</text><text x="240" y="266" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569" >ترنّح، رعشة، كلام متداخل</text><rect x="20" y="298" width="600" height="42" rx="10" fill="#fee2e2" stroke="none" stroke-width="1"/><text x="320" y="325" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626" >أكبر خطر عند ضعف الكلى أو كبار السن: راقب الكرياتينين (أكبر من 1.3)</text><text x="320" y="364" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >مضرّات للكلى: صبغة الأشعة، فانكوميسين، جنتاميسين</text>
</svg>
