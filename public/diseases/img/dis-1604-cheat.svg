<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 592" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="720" height="592" rx="16" fill="#f8fafc"/>
<text x="360.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ورقة غش السوائل والأملاح: الطبيعي والزيادة والنقص</text>
<text x="360.0" y="50" text-anchor="middle" font-size="12" font-weight="400" fill="#64748b">القيم حسب مرجع الامتحان وتختلف قليلاً بين المعامل</text>
<rect x="605.9459459459459" y="70" width="104.05405405405406" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="657.9729729729729" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">الملح والمدى</text>
<rect x="482.97297297297297" y="70" width="122.97297297297297" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="544.4594594594595" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">وظيفته</text>
<rect x="246.48648648648648" y="70" width="236.48648648648648" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="364.72972972972974" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">الزيادة (Hyper)</text>
<rect x="10.0" y="70" width="236.48648648648648" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="128.24324324324323" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">النقص (Hypo)</text>
<rect x="605.9459459459459" y="100" width="104.05405405405406" height="92.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="703.0" y="117" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">البوتاسيوم K⁺</text>
<text x="703.0" y="133.5" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">3.5–5.0</text>
<rect x="482.97297297297297" y="100" width="122.97297297297297" height="92.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="598.9459459459459" y="117" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">مضخة القلب</text>
<text x="598.9459459459459" y="133.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">والعضلات: أولوية</text>
<text x="598.9459459459459" y="150.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">دائماً</text>
<rect x="246.48648648648648" y="100" width="236.48648648648648" height="92.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="475.97297297297297" y="117" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">أكثر من 5.0: القلب منقبض (ST مرتفع</text>
<text x="475.97297297297297" y="133.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">وT مدببة، وفي الشديد VF/توقف).</text>
<text x="475.97297297297297" y="150.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">الأمعاء: إسهال وفرط صوت الأمعاء.</text>
<text x="475.97297297297297" y="166.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">عضلات: ضعف عام وشلل أطراف وزيادة</text>
<text x="475.97297297297297" y="183.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">المنعكسات</text>
<rect x="10.0" y="100" width="236.48648648648648" height="92.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="239.48648648648648" y="117" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">أقل من 3.5: القلب بطيء وضعيف (T</text>
<text x="239.48648648648648" y="133.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">مسطحة، ST منخفض، موجة U). عضلات:</text>
<text x="239.48648648648648" y="150.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">تقلصات وشلل رخو. أمعاء: إمساك وشلل</text>
<text x="239.48648648648648" y="166.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">معوي</text>
<rect x="605.9459459459459" y="192.5" width="104.05405405405406" height="59.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="703.0" y="209.5" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">الصوديوم Na⁺</text>
<text x="703.0" y="226.0" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">135–145</text>
<rect x="482.97297297297297" y="192.5" width="122.97297297297297" height="59.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="598.9459459459459" y="209.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">يحافظ على الضغط</text>
<text x="598.9459459459459" y="226.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">والحجم وتوازن pH</text>
<text x="598.9459459459459" y="242.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">ويحبس الماء</text>
<rect x="246.48648648648648" y="192.5" width="236.48648648648648" height="59.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="475.97297297297297" y="209.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">أكثر من 145: جلد محمر ووذمة وحمى</text>
<text x="475.97297297297297" y="226.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">خفيفة وعطش شديد ولسان جاف متورم</text>
<text x="475.97297297297297" y="242.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">وغثيان وقيء وزيادة توتر العضلات</text>
<rect x="10.0" y="192.5" width="236.48648648648648" height="59.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="239.48648648648648" y="209.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">أقل من 135: تشنجات وغيبوبة (عصبي)،</text>
<text x="239.48648648648648" y="226.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">نبض سريع وخيطي (قلب)، وقد يصل لتوقف</text>
<text x="239.48648648648648" y="242.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">التنفس</text>
<rect x="605.9459459459459" y="252.0" width="104.05405405405406" height="59.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="703.0" y="269.0" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">الكلوريد Cl⁻</text>
<text x="703.0" y="285.5" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">97–107</text>
<rect x="482.97297297297297" y="252.0" width="122.97297297297297" height="59.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="598.9459459459459" y="269.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">رفيق الصوديوم:</text>
<text x="598.9459459459459" y="285.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">الضغط والحجم وpH</text>
<rect x="246.48648648648648" y="252.0" width="236.48648648648648" height="59.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="475.97297297297297" y="269.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">أكثر من 107: مثل ارتفاع الصوديوم</text>
<text x="475.97297297297297" y="285.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">تقريباً: غثيان وقيء ولسان جاف متورم</text>
<text x="475.97297297297297" y="302.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">وتشوش</text>
<rect x="10.0" y="252.0" width="236.48648648648648" height="59.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="239.48648648648648" y="269.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">أقل من 97: مثل انخفاض الصوديوم:</text>
<text x="239.48648648648648" y="285.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">إسهال وقيء وتعرق غزير (والفرق الوحيد</text>
<text x="239.48648648648648" y="302.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">في الاختبار: الحمى)</text>
<rect x="605.9459459459459" y="311.5" width="104.05405405405406" height="59.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="703.0" y="328.5" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">المغنيسيوم</text>
<text x="703.0" y="345.0" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">Mg²⁺</text>
<text x="703.0" y="361.5" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">1.3–2.1</text>
<rect x="482.97297297297297" y="311.5" width="122.97297297297297" height="59.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="598.9459459459459" y="328.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">يهدّئ العضلات</text>
<text x="598.9459459459459" y="345.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">ويرخيها</text>
<rect x="246.48648648648648" y="311.5" width="236.48648648648648" height="59.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="475.97297297297297" y="328.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">أكثر من 2.1: كل شيء هادئ وبطيء: حصار</text>
<text x="475.97297297297297" y="345.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">قلب وPR طويل وبطء وهبوط ضغط، ضعف</text>
<text x="475.97297297297297" y="361.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">المنعكسات، تنفس ضحل، أمعاء خاملة</text>
<rect x="10.0" y="311.5" width="236.48648648648648" height="59.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="239.48648648648648" y="328.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">أقل من 1.3: كل شيء مفرط النشاط:</text>
<text x="239.48648648648648" y="345.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">تسارع قلب وانقلاب T وTorsades وVF،</text>
<text x="239.48648648648648" y="361.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">منعكسات زائدة ورأرأة، إسهال</text>
<rect x="605.9459459459459" y="371.0" width="104.05405405405406" height="59.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="703.0" y="388.0" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">الكالسيوم Ca²⁺</text>
<text x="703.0" y="404.5" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">9.0–10.5</text>
<rect x="482.97297297297297" y="371.0" width="122.97297297297297" height="59.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="598.9459459459459" y="388.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">قوة العظام والدم</text>
<text x="598.9459459459459" y="404.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">(التخثر) ونبض</text>
<text x="598.9459459459459" y="421.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">القلب</text>
<rect x="246.48648648648648" y="371.0" width="236.48648648648648" height="59.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="475.97297297297297" y="388.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">أكثر من 10.5: إمساك، ألم عظام، حصوات</text>
<text x="475.97297297297297" y="404.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">كلى، نقص المنعكسات وضعف عضلي شديد</text>
<rect x="10.0" y="371.0" width="236.48648648648648" height="59.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="239.48648648648648" y="388.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">أقل من 9.0: Trousseau وChvostek،</text>
<text x="239.48648648648648" y="404.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">إسهال، تنميل حول الفم، عظام ضعيفة</text>
<rect x="605.9459459459459" y="430.5" width="104.05405405405406" height="76.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="703.0" y="447.5" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">الفوسفات PO₄</text>
<text x="703.0" y="464.0" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">3.0–4.5</text>
<rect x="482.97297297297297" y="430.5" width="122.97297297297297" height="76.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="598.9459459459459" y="447.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">بناء العظم</text>
<text x="598.9459459459459" y="464.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">والأسنان؛ يعاكس</text>
<text x="598.9459459459459" y="480.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">الكالسيوم</text>
<rect x="246.48648648648648" y="430.5" width="236.48648648648648" height="76.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="475.97297297297297" y="447.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">أكثر من 4.5: يحاكي نقص الكالسيوم</text>
<text x="475.97297297297297" y="464.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">(Trousseau وChvostek وإسهال) مع ضعف</text>
<text x="475.97297297297297" y="480.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">عظام ودم وقلب (كسور ونزيف واضطراب</text>
<text x="475.97297297297297" y="497.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">نظم)</text>
<rect x="10.0" y="430.5" width="236.48648648648648" height="76.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="239.48648648648648" y="447.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">أقل من 3.0: يشبه فرط الكالسيوم:</text>
<text x="239.48648648648648" y="464.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">إمساك، ضعف عضلي شديد ونقص المنعكسات،</text>
<text x="239.48648648648648" y="480.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">بطء النبض والتنفس وارتفاع ضغط (حسب</text>
<text x="239.48648648648648" y="497.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">المرجع)</text>
<rect x="14" y="518.5" width="692" height="52.0" rx="10" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-width="1.4"/>
<text x="694" y="538.5" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">قاعدة تذكّر: الكالسيوم والفوسفات يتحركان عكس بعضهما (Ca↑ = PO₄↓ والعكس). الأولوية دائماً لعلامات</text>
<text x="694" y="556.5" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">القلب والتنفس.</text>
</svg>
