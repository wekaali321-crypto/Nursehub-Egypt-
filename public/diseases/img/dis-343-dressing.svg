<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="380" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">غيار القدم السكري وفحص القدم</text>
<rect x="370" y="60" width="150" height="150" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="445" cy="85" r="14" fill="#2563eb"/><text x="445" y="91" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">1</text><text x="445" y="125" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">نظّف</text><text x="445" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">محلول ملح ثم بيتادين</text><text x="445" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#475569"> ثم ملح</text><rect x="210" y="60" width="150" height="150" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="285" cy="85" r="14" fill="#2563eb"/><text x="285" y="91" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">2</text><text x="285" y="125" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">أزل الميت</text><text x="285" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">إزالة الأنسجة الميتة</text><text x="285" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#475569"></text><rect x="50" y="60" width="150" height="150" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="125" cy="85" r="14" fill="#2563eb"/><text x="125" y="91" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">3</text><text x="125" y="125" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">رشّ</text><text x="125" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">مضاد حيوي + مُحفّز ت</text><text x="125" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">ئام</text><rect x="-110" y="60" width="150" height="150" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="-35" cy="85" r="14" fill="#2563eb"/><text x="-35" y="91" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">4</text><text x="-35" y="125" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">غطِّ</text><text x="-35" y="150" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">شاش فازلين ثم شاش عا</text><text x="-35" y="168" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">دي ثم لاصق</text><rect x="24" y="230" width="592" height="130" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="320" y="256" text-anchor="middle" font-size="15" font-weight="800" fill="#92400e">فحص القدمين يومياً</text><text x="320" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">بين الأصابع - الكعب - الجلد المتشقق - أي تورم أو احمرار</text><text x="320" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">لا حفاء - لا حذاء ضيق - قص الأظافر مستقيماً</text><text x="320" y="330" text-anchor="middle" font-size="13" font-weight="800" fill="#dc2626">السكر المضبوط = أهم علاج</text>
</svg>