<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">غيار القدم السكري وفحص القدم</text>
<rect x="474" y="60" width="140" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="544" cy="86" r="14" fill="#2563eb"/><text x="544" y="92" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">1</text><text x="544" y="128" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">نظّف</text><text x="544" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">ملح ثم بيتادين</text><text x="544" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">ثم ملح</text><rect x="324" y="60" width="140" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="394" cy="86" r="14" fill="#2563eb"/><text x="394" y="92" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">2</text><text x="394" y="128" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">أزل الميت</text><text x="394" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">إزالة الأنسجة</text><text x="394" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">الميتة</text><rect x="174" y="60" width="140" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="244" cy="86" r="14" fill="#2563eb"/><text x="244" y="92" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">3</text><text x="244" y="128" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">رشّ</text><text x="244" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">مضاد حيوي</text><text x="244" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">+ مُحفّز تئام</text><rect x="24" y="60" width="140" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><circle cx="94" cy="86" r="14" fill="#2563eb"/><text x="94" y="92" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">4</text><text x="94" y="128" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">غطِّ</text><text x="94" y="156" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">شاش فازلين</text><text x="94" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">ثم شاش ولاصق</text><rect x="24" y="230" width="592" height="130" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="320" y="256" text-anchor="middle" font-size="15" font-weight="800" fill="#92400e">فحص القدمين يومياً</text><text x="320" y="282" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">بين الأصابع - الكعب - الجلد المتشقق - أي تورم أو احمرار</text><text x="320" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">لا حفاء - لا حذاء ضيق - قص الأظافر مستقيماً</text><text x="320" y="330" text-anchor="middle" font-size="13" font-weight="800" fill="#dc2626">السكر المضبوط = أهم علاج</text>
