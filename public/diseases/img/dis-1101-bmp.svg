<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >لوحة الكيمياء الأساسية BMP: سبع قراءات</text><rect x="20" y="48" width="142" height="116" rx="12" fill="#fff" stroke="#2563eb" stroke-width="3"/><rect x="20" y="48" width="142" height="34" rx="12" fill="#2563eb" stroke="none" stroke-width="1"/><text x="91" y="72" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" direction="ltr">Na⁺</text><text x="91" y="114" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >135 – 145</text><text x="91" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#475569" >يجمع الماء</text><rect x="172" y="48" width="142" height="116" rx="12" fill="#fff" stroke="#dc2626" stroke-width="3"/><rect x="172" y="48" width="142" height="34" rx="12" fill="#dc2626" stroke="none" stroke-width="1"/><text x="243" y="72" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" direction="ltr">K⁺</text><text x="243" y="114" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >3.5 – 5.0</text><text x="243" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#475569" >يحرك القلب</text><rect x="324" y="48" width="142" height="116" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="3"/><rect x="324" y="48" width="142" height="34" rx="12" fill="#0ea5e9" stroke="none" stroke-width="1"/><text x="395" y="72" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" direction="ltr">Cl⁻</text><text x="395" y="114" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >97 – 107</text><text x="395" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#475569" >رفيق الصوديوم</text><rect x="476" y="48" width="142" height="116" rx="12" fill="#fff" stroke="#a855f7" stroke-width="3"/><rect x="476" y="48" width="142" height="34" rx="12" fill="#a855f7" stroke="none" stroke-width="1"/><text x="547" y="72" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" direction="ltr">HCO₃</text><text x="547" y="114" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >22 – 26</text><text x="547" y="140" text-anchor="middle" font-size="12" font-weight="600" fill="#475569" >قاعدة الجسم</text><rect x="20" y="176" width="142" height="116" rx="12" fill="#fff" stroke="#f97316" stroke-width="3"/><rect x="20" y="176" width="142" height="34" rx="12" fill="#f97316" stroke="none" stroke-width="1"/><text x="91" y="200" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" direction="ltr">BUN</text><text x="91" y="242" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >10 – 20</text><text x="91" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#475569" >الكلى والسوائل</text><rect x="172" y="176" width="142" height="116" rx="12" fill="#fff" stroke="#b45309" stroke-width="3"/><rect x="172" y="176" width="142" height="34" rx="12" fill="#b45309" stroke="none" stroke-width="1"/><text x="243" y="200" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" direction="ltr">Cr</text><text x="243" y="242" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >أقل من 1.3 طبيعي</text><text x="243" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#475569" >فوق 1.3 = إصابة كلوية</text><rect x="324" y="176" width="142" height="116" rx="12" fill="#fff" stroke="#16a34a" stroke-width="3"/><rect x="324" y="176" width="142" height="34" rx="12" fill="#16a34a" stroke="none" stroke-width="1"/><text x="395" y="200" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" direction="ltr">Glucose</text><text x="395" y="242" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >70 – 110</text><text x="395" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#475569" >أقل من 70 خطر</text><rect x="468" y="176" width="152" height="116" rx="12" fill="#f1f5f9" stroke="none" stroke-width="1"/><text x="544" y="208" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >كل قيمة مرتبطة</text><text x="544" y="232" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >بخطر محدد:</text><text x="544" y="258" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626" >K⁺ يهدد القلب</text><text x="544" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a" >السكر يهدد المخ</text><text x="320" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >قيم المعامل تختلف قليلًا: اعتمد المدى المطبوع في نتيجتك</text>
