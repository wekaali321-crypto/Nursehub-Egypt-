<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="392" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الالتهاب: الأسباب والأعراض الموضعية والجهازية</text>
<rect x="14" y="44" width="612" height="120" rx="10" fill="#ecfccb" stroke="#84cc16" stroke-width="1.5"/><text x="320" y="68" text-anchor="middle" font-size="13" font-weight="800" fill="#365314" >الالتهاب رد فعل وقائي للجسم ضد إصابة أو مرض أو تهيج في الأنسجة، وليس هو العدوى نفسها</text><text x="320" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4d7c0f" >العدوى سبب من أسباب الالتهاب</text><rect x="24" y="104" width="140" height="48" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><text x="94" y="134" text-anchor="middle" font-size="12.5" font-weight="800" fill="#16a34a" >عدوى</text><rect x="174" y="104" width="140" height="48" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><text x="244" y="134" text-anchor="middle" font-size="12.5" font-weight="800" fill="#2563eb" >مرض مناعة ذاتية</text><rect x="324" y="104" width="140" height="48" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><text x="394" y="134" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ea580c" >تفاعل تحسسي</text><rect x="474" y="104" width="140" height="48" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><text x="544" y="134" text-anchor="middle" font-size="12.5" font-weight="800" fill="#dc2626" >إصابة (التواء/كسر)</text><rect x="14" y="176" width="300" height="200" rx="10" fill="#fff" stroke="#db2777" stroke-width="1.5"/><rect x="14" y="176" width="300" height="26" rx="10" fill="#db2777"/><text x="164.0" y="194" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >الأعراض الموضعية</text><text x="304" y="221" text-anchor="start" font-size="13" font-weight="600" fill="#0f172a" >احمرار وسخونة (Redness/Warmth)</text><text x="304" y="243" text-anchor="start" font-size="13" font-weight="600" fill="#0f172a" >تورم (Edema)</text><text x="304" y="265" text-anchor="start" font-size="13" font-weight="600" fill="#0f172a" >ألم (Pain)</text><text x="304" y="287" text-anchor="start" font-size="13" font-weight="600" fill="#0f172a" >فقدان الوظيفة (Loss of function)</text><text x="304" y="309" text-anchor="start" font-size="13" font-weight="600" fill="#0f172a" >إفرازات/نتح (Exudate)</text><rect x="326" y="176" width="300" height="200" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><rect x="326" y="176" width="300" height="26" rx="10" fill="#ea580c"/><text x="476.0" y="194" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >الأعراض الجهازية</text><text x="616" y="221" text-anchor="start" font-size="13" font-weight="600" fill="#0f172a" >حمى خفيفة</text><text x="616" y="243" text-anchor="start" font-size="13" font-weight="600" fill="#0f172a" >توعك (Malaise)</text><text x="616" y="265" text-anchor="start" font-size="13" font-weight="600" fill="#0f172a" >إرهاق</text><text x="616" y="287" text-anchor="start" font-size="13" font-weight="600" fill="#0f172a" >صداع</text><text x="616" y="309" text-anchor="start" font-size="13" font-weight="600" fill="#0f172a" >فقدان شهية (Anorexia)</text>
</svg>
