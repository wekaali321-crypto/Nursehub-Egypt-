<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="324" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الجنف (Scoliosis)</text><rect x="330" y="52" width="300" height="129.0" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الفكرة</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• انحناء جانبي للعمود الفقري على شكل S</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• يلاحَظ أول مرة في فترات النمو السريع،</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  خاصة الإناث المراهقات 10–12 سنة</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ألم خفيف إلى شديد وتيبس، وقد يشوه القفص</text><text x="620" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الصدري</text><rect x="10" y="52" width="310" height="76.8" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#7c3aed"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التشخيص</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قياس زاوية كوب (Cobb angle)</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أشعة سينية</text><rect x="330" y="189.0" width="300" height="111.6" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M330,199.0 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#16a34a"/><text x="480.0" y="208.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأسباب وعوامل الخطر</text><text x="620" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• يُعتقد خلل في الأقراص بين الفقرات</text><text x="620" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• شائع مع الشلل الدماغي والحثل العضلي</text><text x="620" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  ومتلازمة مارفان</text><text x="620" y="284.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مارفان: تجنب الرياضات الاحتكاكية</text><rect x="10" y="189.0" width="310" height="111.6" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,199.0 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="208.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج</text><text x="310" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• التفاعل الاجتماعي: زيارة الأصدقاء</text><text x="310" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• جبيرة بوسطن (Boston Brace)</text><text x="310" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ارتدِ قميصًا قطنيًا تحت الجبيرة في كل</text><text x="310" y="284.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الأوقات</text></svg>