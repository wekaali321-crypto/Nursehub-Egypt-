<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 303" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="303" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">TORCH: العدوى التي تعبر المشيمة</text><rect x="500.0" y="50" width="120.0" height="31" fill="#1e3a8a" stroke="#cbd5e1"/><text x="560.0" y="70.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">العدوى</text><rect x="260.0" y="50" width="240.0" height="31" fill="#1e3a8a" stroke="#cbd5e1"/><text x="380.0" y="70.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">المصدر/النقطة</text><rect x="20.0" y="50" width="240.0" height="31" fill="#1e3a8a" stroke="#cbd5e1"/><text x="140.0" y="70.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">التصرف</text><rect x="500.0" y="81" width="120.0" height="48" fill="#fff" stroke="#cbd5e1"/><text x="560.0" y="109.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">Toxoplasmosis</text><rect x="260.0" y="81" width="240.0" height="48" fill="#fff" stroke="#cbd5e1"/><text x="380.0" y="101.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">براز القطط، فواكه وخضار ملوثة</text><text x="380.0" y="118.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">بالتربة (البستنة)، لحوم نيئة</text><rect x="20.0" y="81" width="240.0" height="48" fill="#fff" stroke="#cbd5e1"/><text x="140.0" y="101.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">تجنب اللحم غير المطهو وتنظيف قطط</text><text x="140.0" y="118.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">الصندوق</text><rect x="500.0" y="129" width="120.0" height="65" fill="#eef2ff" stroke="#cbd5e1"/><text x="560.0" y="166.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">Syphilis (أخرى)</text><rect x="260.0" y="129" width="240.0" height="65" fill="#eef2ff" stroke="#cbd5e1"/><text x="380.0" y="166.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">عدوى منقولة جنسياً تسبب تشوهات</text><rect x="20.0" y="129" width="240.0" height="65" fill="#eef2ff" stroke="#cbd5e1"/><text x="140.0" y="149.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">فحص أول زيارة وإعادة بالثلث</text><text x="140.0" y="166.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">الثالث والطلق؛ بنسلين عضلي؛ مع</text><text x="140.0" y="183.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">الحساسية: إزالة حساسية</text><rect x="500.0" y="194" width="120.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="560.0" y="214.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">Rubella</text><rect x="260.0" y="194" width="240.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="380.0" y="214.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">لا تطعيم حتى بعد الولادة</text><rect x="20.0" y="194" width="240.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="140.0" y="214.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">فحص الأجسام المضادة عند التعرض</text><rect x="500.0" y="225" width="120.0" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="560.0" y="245.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">CMV</text><rect x="260.0" y="225" width="240.0" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="380.0" y="245.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">عدوى فيروسية</text><rect x="20.0" y="225" width="240.0" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="140.0" y="245.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">—</text><rect x="500.0" y="256" width="120.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="560.0" y="276.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">Herpes</text><rect x="260.0" y="256" width="240.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="380.0" y="276.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">آفات تناسلية مؤلمة</text><rect x="20.0" y="256" width="240.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="140.0" y="276.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">acyclovir وقيصرية عند آفات نشطة</text></svg>