<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="360" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">سلّم علاج العرق الزائد</text>
  <rect x="90" y="50" width="460" height="50" rx="10" fill="#22c55e"/>
  <text x="320" y="70.4" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1) مضاد تعرق موضعي</text>
  <text x="320" y="89.4" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" direction="ltr">Aluminum chloride 20%</text>
  <path d="M320 100 L320 106" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M314 104 L320 112 L326 104 Z" fill="#64748b"/>
  <rect x="90" y="112" width="460" height="50" rx="10" fill="#eab308"/>
  <text x="320" y="132.4" text-anchor="middle" font-size="14" font-weight="700" fill="#422006">2) جهاز الأيونتوفوريسيس / أدوية بالفم</text>
  <text x="320" y="151.4" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">للكفين والقدمين — بأمر الطبيب</text>
  <path d="M320 162 L320 168" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M314 166 L320 174 L326 166 Z" fill="#64748b"/>
  <rect x="90" y="174" width="460" height="50" rx="10" fill="#f97316"/>
  <text x="320" y="194.4" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3) حقن البوتولينيوم (Botulinum)</text>
  <text x="320" y="213.4" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">عند فشل الموضعي</text>
  <path d="M320 224 L320 230" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M314 228 L320 236 L326 228 Z" fill="#64748b"/>
  <rect x="90" y="236" width="460" height="50" rx="10" fill="#dc2626"/>
  <text x="320" y="256.4" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4) جراحة قطع العصب السمبثاوي</text>
  <text x="320" y="275.4" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Sympathectomy — غالباً بترجع</text>
  <rect x="40" y="305" width="560" height="38" rx="10" fill="#e0f2fe"/>
  <text x="320" y="328.55" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">قبل أي علاج: استبعد فرط الغدة الدرقية ومتلازمة هورنر والأدوية</text>
  <text x="320" y="346" text-anchor="middle" font-size="12" fill="#64748b">ابدأ بالأبسط وانتقل للأعلى لو ما نفعش</text>
</svg>
