<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 258" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="258" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">عدوى النفاس: مقارنة سريعة</text><rect x="500.0" y="50" width="120.0" height="31" fill="#1e3a8a" stroke="#cbd5e1"/><text x="560.0" y="70.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">العدوى</text><rect x="260.0" y="50" width="240.0" height="31" fill="#1e3a8a" stroke="#cbd5e1"/><text x="380.0" y="70.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">العلامات</text><rect x="20.0" y="50" width="240.0" height="31" fill="#1e3a8a" stroke="#cbd5e1"/><text x="140.0" y="70.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">العلاج والتمريض</text><rect x="500.0" y="81" width="120.0" height="65" fill="#fff" stroke="#cbd5e1"/><text x="560.0" y="109.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">التهاب بطانة</text><text x="560.0" y="126.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">الرحم</text><rect x="260.0" y="81" width="240.0" height="65" fill="#fff" stroke="#cbd5e1"/><text x="380.0" y="109.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">حمى، هلابة نتنة، ألم وحساسية رحم،</text><text x="380.0" y="126.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">تسارع نبض، WBC مرتفع</text><rect x="20.0" y="81" width="240.0" height="65" fill="#fff" stroke="#cbd5e1"/><text x="140.0" y="101.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">مزرعة دم أولاً ثم مضاد حيوي</text><text x="140.0" y="118.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">(clindamycin مع شريك)، نظافة</text><text x="140.0" y="135.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">اليدين، عناية بالعجان</text><rect x="500.0" y="146" width="120.0" height="48" fill="#eef2ff" stroke="#cbd5e1"/><text x="560.0" y="174.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">التهاب الثدي</text><rect x="260.0" y="146" width="240.0" height="48" fill="#eef2ff" stroke="#cbd5e1"/><text x="380.0" y="166.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">حمى، آلام جسم، تورم واحمرار</text><text x="380.0" y="183.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">وسخونة في ثدي واحد</text><rect x="20.0" y="146" width="240.0" height="48" fill="#eef2ff" stroke="#cbd5e1"/><text x="140.0" y="166.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">استمرار الرضاعة، كمادات دافئة،</text><text x="140.0" y="183.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">مضاد حيوي، مسكن</text><rect x="500.0" y="194" width="120.0" height="48" fill="#fff" stroke="#cbd5e1"/><text x="560.0" y="214.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">التهاب المسالك</text><text x="560.0" y="231.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">البولية</text><rect x="260.0" y="194" width="240.0" height="48" fill="#fff" stroke="#cbd5e1"/><text x="380.0" y="214.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">حرقان، إلحاح وتكرار، بول عكر</text><text x="380.0" y="231.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">كريه، حمى</text><rect x="20.0" y="194" width="240.0" height="48" fill="#fff" stroke="#cbd5e1"/><text x="140.0" y="214.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">مضاد حيوي حسب المزرعة، سوائل</text><text x="140.0" y="231.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">كثيرة، تجنب الفقاعات والمسح للخلف</text></svg>