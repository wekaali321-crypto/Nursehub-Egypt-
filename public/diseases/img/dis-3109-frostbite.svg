<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="500" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قضمة الصقيع (Frostbite): العلامات والعلاج</text>
  <rect x="330" y="50" width="290" height="130" rx="10" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">السطحية (Superficial)</text><text x="608" y="96" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• الجلد أزرق أو مبقع</text><text x="608" y="123" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• أو أصفر شمعي</text><rect x="20" y="50" width="290" height="130" rx="10" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">العميقة (Deep)</text><text x="298" y="96" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• الجلد أبيض وصلب</text><text x="298" y="123" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• قد تتطور إلى غنغرينا</text><rect x="20" y="195" width="600" height="60" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/><text x="320" y="222" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">السبب: تكوّن بلورات الثلج داخل الخلايا + تقلص الأوعية (توقف جريان الدم)</text><text x="320" y="244" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">تجمد النسيج كأن كل خلية كرة ثلج صغيرة</text><rect x="330" y="270" width="290" height="215" rx="10" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="292" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">افعل</text><text x="608" y="316" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• تدفئة بالنقع في ماء دافئ (دوامة)</text><text x="608" y="343" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• ارفع الطرف بعد التدفئة</text><text x="608" y="370" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• أعطِ مسكنًا للألم</text><rect x="20" y="270" width="290" height="215" rx="10" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="292" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">لا تفعل</text><text x="298" y="316" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• لا ضغط على الموضع</text><text x="298" y="343" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• لا ملابس ثقيلة أو بطانيات</text><text x="298" y="370" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• لا تدليك أو فرك</text><text x="298" y="397" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• لا ضمادات محكمة (occlusive)</text>
</svg>
