<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 234" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="234" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الغدة النخامية والنمو: نقص وزيادة هرمون النمو (GH)</text><rect x="325" y="48" width="295" height="144" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">نقص (Hypopituitarism)</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">طفل صغير ونحيل</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">قصر القامة (Short stature) أهم علامة</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">السبب: ورم بالنخامية</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">CT للكشف</text><rect x="20" y="48" width="295" height="144" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">زيادة (Hyperpituitarism)</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">طول زائد وتضخم الأطراف (Acromegaly)</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">تضخم الوجه والفك واليدين والقدمين</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">عظام طويلة زائدة النمو، جلد سميك مجعد، سوء</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">إطباق الأسنان</text><text x="305" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">السبب: أورام غير سرطانية</text><text x="320" y="216" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">GH = هرمون النمو (HGH)</text>
</svg>
