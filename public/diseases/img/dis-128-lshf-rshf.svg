<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a" >فشل القلب الأيسر مقابل الأيمن</text><rect x="20" y="50" width="300" height="50" rx="12" fill="#0ea5e9"/><text x="170.0" y="70.05" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" >فشل البطين الأيسر (LSHF)</text><text x="170.0" y="89.05" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >احتقان الرئتين</text><rect x="330" y="50" width="290" height="50" rx="12" fill="#f97316"/><text x="475.0" y="70.05" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" >فشل البطين الأيمن (RSHF)</text><text x="475.0" y="89.05" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >احتقان الجسم</text><rect x="20" y="110" width="300" height="34" rx="8" fill="#e0f2fe"/><text x="170" y="133" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e" >ضيق نفس (Dyspnea)</text><rect x="20" y="150" width="300" height="34" rx="8" fill="#e0f2fe"/><text x="170" y="173" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e" >كحة · بلغم وردي · نفث دم</text><rect x="20" y="190" width="300" height="34" rx="8" fill="#e0f2fe"/><text x="170" y="213" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e" >طقطقة أسفل الرئتين (Crepitations)</text><rect x="20" y="230" width="300" height="34" rx="8" fill="#e0f2fe"/><text x="170" y="253" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e" >انصباب جنبي · عدوى صدر متكررة</text><rect x="20" y="270" width="300" height="34" rx="8" fill="#e0f2fe"/><text x="170" y="293" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e" >إيقاع الحصان (Gallop) عند القمة</text><rect x="20" y="310" width="300" height="34" rx="8" fill="#e0f2fe"/><text x="170" y="333" text-anchor="middle" font-size="13" font-weight="600" fill="#0c4a6e" >نبض متبادل القوة (Pulsus alternans)</text><rect x="330" y="110" width="290" height="34" rx="8" fill="#ffedd5"/><text x="475" y="133" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12" >احتقان وانتفاخ أوردة الرقبة</text><rect x="330" y="150" width="290" height="34" rx="8" fill="#ffedd5"/><text x="475" y="173" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12" >ألم أيمن البطن (احتقان الكبد)</text><rect x="330" y="190" width="290" height="34" rx="8" fill="#ffedd5"/><text x="475" y="213" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12" >ورم القدمين أو أسفل الظهر (Sacrum)</text><rect x="330" y="230" width="290" height="34" rx="8" fill="#ffedd5"/><text x="475" y="253" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12" >ورم بطن (استسقاء)</text><rect x="330" y="270" width="290" height="34" rx="8" fill="#ffedd5"/><text x="475" y="293" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12" >إيقاع الحصان عند الصمام ثلاثي الشرف</text><rect x="330" y="310" width="290" height="34" rx="8" fill="#ffedd5"/><text x="475" y="333" text-anchor="middle" font-size="13" font-weight="600" fill="#7c2d12" >نبض سريع + ضغط انقباضي منخفض</text><rect x="20" y="355" width="600" height="45" rx="12" fill="#fde68a"/><text x="320.0" y="382.05" text-anchor="middle" font-size="13" font-weight="700" fill="#422006" >كلاهما: نتاج قلبي منخفض (تعب · دوخة · قلة بول · برودة وشحوب) — وغالباً يجتمعان</text>
