<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="330" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قرحة المعدة مقابل قرحة الإثنى عشر</text>
  <g text-anchor="middle" font-size="14" font-weight="700">
    <rect x="330" y="48" width="290" height="40" rx="10" fill="#f97316"/><text x="475" y="74" fill="#fff">قرحة المعدة (Gastric)</text>
    <rect x="20" y="48" width="290" height="40" rx="10" fill="#0ea5e9"/><text x="165" y="74" fill="#fff">قرحة الإثنى عشر (Duodenal)</text>
  </g>
  <g font-size="13" fill="#0f172a" text-anchor="start">
    <rect x="330" y="96" width="290" height="200" rx="10" fill="#ffedd5"/>
    <text x="610" y="122">الألم بعد الأكل بـ ¼ – 2 ساعة</text>
    <text x="610" y="148">الألم بيخف بالقيء أو مضاد الحموضة</text>
    <text x="610" y="174">نزول وزن (الأكل بيوجع)</text>
    <text x="610" y="200">حمض المعدة: طبيعي أو عالي + دم</text>
    <text x="610" y="226">الباريوم: فجوة وفتحة (niche &amp; notch)</text>
    <text x="610" y="252">لازم منظار + عينة (استبعاد سرطان)</text>
    <rect x="20" y="96" width="290" height="200" rx="10" fill="#e0f2fe"/>
    <text x="300" y="122">الألم بعد الأكل بـ 2 – 4 ساعات (جوع/ليل)</text>
    <text x="300" y="148">الألم بيخف بالأكل أو مضاد الحموضة</text>
    <text x="300" y="174">زيادة وزن (الأكل بيريّح)</text>
    <text x="300" y="200">حمض المعدة: عالي بدون دم</text>
    <text x="300" y="226">الباريوم: غطاء الإثنى عشر مشوّه ومؤلم</text>
    <text x="300" y="252">حرقان وتقلّص ماء الفم (waterbrash)</text>
  </g>
  <text x="320" y="318" text-anchor="middle" font-size="12" fill="#475569">الاثنين: ألم أعلى البطن + فحص H. pylori + تجنب NSAIDs</text>
</svg>
