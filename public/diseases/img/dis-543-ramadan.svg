<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" direction="rtl" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="350" rx="12" fill="#f7fafc"/><text x="320" y="30" font-size="16" fill="#1a202c" text-anchor="middle" font-weight="bold">جدول الأدوية والإنسولين في رمضان (حسب ما جاء في الدليل العملي)</text><rect x="20" y="45" width="600" height="32" rx="8" fill="#edf2f7" stroke="#718096" stroke-width="1.5"/><text x="520" y="66" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="bold">النظام</text><text x="330" y="66" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="bold">عند الإفطار</text><text x="130" y="66" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="bold">السحور</text><rect x="20" y="85" width="600" height="40" rx="8" fill="#fff" stroke="#718096" stroke-width="1.5"/><text x="560" y="110" font-size="13" fill="#1a202c" text-anchor="middle" font-weight="bold">أقراص مرة يومياً</text><text x="380" y="110" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="normal">قبل الفطار (المغرب)</text><text x="130" y="110" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="normal">—</text><rect x="20" y="129" width="600" height="40" rx="8" fill="#fff" stroke="#718096" stroke-width="1.5"/><text x="560" y="154" font-size="13" fill="#1a202c" text-anchor="middle" font-weight="bold">أقراص مرتين</text><text x="380" y="154" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="normal">جرعة الصباح قبل الفطار</text><text x="130" y="154" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="normal">جرعة الليل تقل للنص قبل السحور</text><rect x="20" y="173" width="600" height="40" rx="8" fill="#fff" stroke="#718096" stroke-width="1.5"/><text x="560" y="198" font-size="13" fill="#1a202c" text-anchor="middle" font-weight="bold">Mixtard</text><text x="380" y="198" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="normal">جرعة الصباح قبل الفطار</text><text x="130" y="198" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="normal">جرعة الليل تقل للنص قبل السحور</text><rect x="20" y="217" width="600" height="40" rx="8" fill="#fff" stroke="#718096" stroke-width="1.5"/><text x="560" y="242" font-size="13" fill="#1a202c" text-anchor="middle" font-weight="bold">N & R</text><text x="380" y="242" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="normal">N + R معاً قبل الفطار</text><text x="130" y="242" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="normal">R قبل السحور (للنص) · N قبل النوم (للنص)</text><rect x="20" y="261" width="600" height="40" rx="8" fill="#fff" stroke="#718096" stroke-width="1.5"/><text x="560" y="286" font-size="13" fill="#1a202c" text-anchor="middle" font-weight="bold">Lantus & R</text><text x="380" y="286" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="normal">Lantus قرب العصر · R قبل الفطار</text><text x="130" y="286" font-size="12" fill="#1a202c" text-anchor="middle" font-weight="normal">R قبل السحور (للنص)</text><text x="320" y="330" font-size="14" fill="#c53030" text-anchor="middle" font-weight="bold">قياس السكر صباحاً وعصراً · أي قراءة أقل من 70 أو أعراض هبوط = افطر فوراً</text></svg>