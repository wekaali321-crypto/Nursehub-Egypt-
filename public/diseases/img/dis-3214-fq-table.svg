anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">غثيان، إسهال، صداع، ألم بطن، دوخة، حساسية للضوء</text><rect x="448.6" y="182.5" width="171.4" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="534.3" y="209.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">موانع</text><rect x="20.0" y="182.5" width="428.6" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="234.3" y="201.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">فرط حساسية؛ أطفال أقل من 12؛ كبار فوق 60 على ستيرويد</text><text x="234.3" y="218.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">(خطر التهاب وتر أخيل)</text><rect x="448.6" y="229.5" width="171.4" height="30.5" fill="#fff" stroke="#cbd5e1"/><text x="534.3" y="248.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">theophylline</text><rect x="20.0" y="229.5" width="428.6" height="30.5" fill="#fff" stroke="#cbd5e1"/><text x="234.3" y="248.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">يرفع مستواه</text><rect x="448.6" y="260" width="171.4" height="30.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="534.3" y="279.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">cimetidine</text><rect x="20.0" y="260" width="428.6" height="30.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="234.3" y="279.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">يعيق إخراج المضاد</text><rect x="448.6" y="290.5" width="171.4" height="30.5" fill="#fff" stroke="#cbd5e1"/><text x="534.3" y="309.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">مضادات التخثر</text><rect x="20.0" y="290.5" width="428.6" height="30.5" fill="#fff" stroke="#cbd5e1"/><text x="234.3" y="309.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">خطر نزف</text><rect x="448.6" y="321" width="171.4" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="534.3" y="340.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">مضادات الحموضة،</text><text x="534.3" y="356.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">الحديد، الزنك</text><rect x="20.0" y="321" width="428.6" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="234.3" y="348.3" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تقلل الامتصاص</text><rect x="448.6" y="368" width="171.4" height="30.5" fill="#fff" stroke="#cbd5e1"/><text x="534.3" y="387.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">NSAIDs</text><rect x="20.0" y="368" width="428.6" height="30.5" fill="#fff" stroke="#cbd5e1"/><text x="234.3" y="387.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">خطر تشنج</text></svg>