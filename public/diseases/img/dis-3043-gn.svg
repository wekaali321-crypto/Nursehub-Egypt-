<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="400" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب الكبيبات الحاد مقابل المتلازمة الكلوية</text><rect x="330" y="50" width="290" height="100" rx="10" fill="#f59e0b"/><text x="475.0" y="77.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">الكبيبات (Nephritic)</text><text x="475.0" y="94.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">التهاب وتندب الكبيبات بعد عدوى عقدية</text><text x="475.0" y="111.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">يتحسن تلقائيًا خلال 14 يومًا</text><text x="475.0" y="128.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">بروتين أقل بالبول · كريات بيض مرتفعة</text><rect x="20" y="50" width="300" height="100" rx="10" fill="#6366f1"/><text x="170.0" y="77.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المتلازمة الكلوية (Nephrotic)</text><text x="170.0" y="94.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">مناعة ذاتية: ضغط، مرض، تدخين، شمس</text><text x="170.0" y="111.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">فقد بروتين أعلى: ألبومين منخفض</text><text x="170.0" y="128.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">كولسترول مرتفع</text><rect x="330" y="165" width="290" height="100" rx="10" fill="#16a34a"/><text x="475.0" y="192.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">تقييم تمريضي</text><text x="475.0" y="209.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">أولوية: ضغط الدم</text><text x="475.0" y="226.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">وزن يومي (زيادة الماء)</text><text x="475.0" y="243.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">وذمة وقلة بول وارتفاع الضغط</text><rect x="20" y="165" width="300" height="100" rx="10" fill="#ef4444"/><text x="170.0" y="192.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">أبلغ فورًا</text><text x="170.0" y="209.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">فشل كلوي وأزمة ارتفاع ضغط</text><text x="170.0" y="226.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">صداع وتغير وعي · غثيان وقيء</text><text x="170.0" y="243.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">قلة بول · زيادة وزن مفاجئة</text><rect x="20" y="280" width="600" height="80" rx="10" fill="#334155"/><text x="320.0" y="314.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تثقيف: قلّل الزوار ولا تنظم لقاءات لعب مع أطفال آخرين (خطر العدوى)</text><text x="320.0" y="332.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">كرياتينين 1.3 ملغ/دل: يُبلغ للطبيب</text></svg>