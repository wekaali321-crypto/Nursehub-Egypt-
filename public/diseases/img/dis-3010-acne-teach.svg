<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="330" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">حب الشباب: ما سبب الحبوب وماذا يفعل المراهق</text><rect x="20" y="50" width="190" height="70" rx="10" fill="#0ea5e9"/><text x="115.0" y="69.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الآلية</text><text x="115.0" y="88.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">غدد دهنية مسدودة</text><text x="115.0" y="107.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">رؤوس سوداء وبيضاء</text><rect x="225" y="50" width="190" height="70" rx="10" fill="#6366f1"/><text x="320.0" y="69.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">عند وجود بكتيريا</text><text x="320.0" y="88.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">التهاب ← حبوب ملتهبة</text><text x="320.0" y="107.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">(Papules / Pustules)</text><rect x="430" y="50" width="190" height="70" rx="10" fill="#ec4899"/><text x="525.0" y="69.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأسباب</text><text x="525.0" y="88.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">البلوغ والحمل (هرمونات)</text><text x="525.0" y="107.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">بكتيريا · وراثة · توتر</text><rect x="330" y="140" width="290" height="30" rx="8" fill="#16a34a"/><text x="475" y="160" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">افعل</text><rect x="20" y="140" width="290" height="30" rx="8" fill="#dc2626"/><text x="165" y="160" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">تجنّب</text><text x="615" y="192" text-anchor="start" font-size="13" fill="#0f172a">• غسل الشعر والبشرة بلطف باستمرار</text><text x="615" y="216" text-anchor="start" font-size="13" fill="#0f172a">• مرطّب ومنتجات «غير مُسِدّة للمسام»</text><text x="615" y="240" text-anchor="start" font-size="13" fill="#0f172a">• غذاء متوازن و8 أكواب ماء يوميًا</text><text x="615" y="264" text-anchor="start" font-size="13" fill="#0f172a">• الإقلاع عن التدخين</text><text x="305" y="192" text-anchor="start" font-size="13" fill="#0f172a">• فرك وغسل عنيف</text><text x="305" y="216" text-anchor="start" font-size="13" fill="#0f172a">• عصر الحبوب أو نكشها</text><text x="305" y="240" text-anchor="start" font-size="13" fill="#0f172a">• صابون مضاد للبكتيريا</text><text x="305" y="264" text-anchor="start" font-size="13" fill="#0f172a">• التدخين</text><rect x="20" y="295" width="600" height="28" rx="10" fill="#eab308"/><text x="320.0" y="312.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">العلاج الدوائي المذكور: تتراسيكلين (مضاد حيوي) وإيزوتريتينوين (مشتق فيتامين أ)</text></svg>