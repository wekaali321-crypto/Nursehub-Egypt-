<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="640" height="330" rx="16" fill="#f8fafc"/>
<text x="320.0" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مقارنة سريعة: فالسالفا العادية والمعدّلة</text>
<rect x="40" y="50" width="260" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="170.0" y="96.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">فالسالفا العادية</text>
<text x="170.0" y="114.33333333333333" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">نفخ 15 ث ثم رجوع للجلوس</text>
<text x="170.0" y="132.33333333333331" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">نجاح حوالي 17%  (REVERT)</text>
<rect x="340" y="50" width="260" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="470.0" y="96.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">فالسالفا المعدّلة</text>
<text x="470.0" y="114.33333333333333" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">نفخ 15 ث + نوم + رفع الرجلين 15 ث</text>
<text x="470.0" y="132.33333333333331" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">نجاح حوالي 43%  (REVERT)</text>
<text x="320" y="200" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">ليه المعدّلة أفضل؟ رفع الرجلين بعد النفخ يضخ دم للقلب فيزيد تنبيه العصب الحائر</text>
<text x="320" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">فينقطع الدوران الداخل للعقدة AV وتنتهي النوبة</text>
<text x="320" y="262" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">أمان: لم تظهر مضاعفات خطيرة في الدراسة لكن ممنوعة في موانع مذكورة بالأسفل</text>
<text x="320" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">لو ما نجحت (بعد محاولة أو اثنتين) ← أدينوسين بأمر الطبيب</text></svg>