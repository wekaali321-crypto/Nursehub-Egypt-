<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" width="640" height="250" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="مضادات الاكتئاب غير النمطية: Trazodone وBupropion"><rect width="640" height="250" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">مضادات الاكتئاب غير النمطية: Trazodone وBupropion</text><rect x="326.0" y="46" width="302.0" height="188" rx="10" fill="#efe9fb" stroke="#6a4bb5" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#6a4bb5"/><rect x="326.0" y="60" width="302.0" height="14" fill="#6a4bb5"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Trazodone</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• اكتئاب + مساعد على النوم</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• يسبب نعاسًا وتهدئة (TraZZZadone)</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• تجنب الكحول والمهدئات (benzos، مضادات</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">   الهستامين)</text><text x="616.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• يؤخذ ليلًا</text><text x="616.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">• انخفاض ضغط انتصابي: غيّر الوضع ببطء</text><text x="616.0" y="202" text-anchor="start" font-size="12.5" fill="#1d2939">• نادرًا Priapism: انتصاب لساعات = اذهب</text><text x="616.0" y="220" text-anchor="start" font-size="12.5" fill="#1d2939">   للمستشفى</text><rect x="12.0" y="46" width="302.0" height="134" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="12.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Bupropion SR / XL (Wellbutrin)</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• اكتئاب + مساعد للإقلاع عن التدخين</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• أرق، صداع، نقص وزن</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• لا تسحق ولا تمضغ ولا تقطع أقراص XL/SR</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• لا تضاعف الجرعة عند النسيان</text><text x="302.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• أقراص XR/SR ممدودة المفعول</text></svg>