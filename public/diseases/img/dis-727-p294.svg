<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 376" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="700" height="376" rx="16" fill="#f8fafc"/>
<text x="350.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">فرط الدرقية وقصورها: الأعراض والمضاعفات</text>
<rect x="592.8571428571429" y="52" width="97.14285714285715" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="641.4285714285714" y="72" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff"></text>
<rect x="301.42857142857144" y="52" width="291.42857142857144" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="447.14285714285717" y="72" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">فرط الدرقية (Graves)</text>
<rect x="10.0" y="52" width="291.42857142857144" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="155.71428571428572" y="72" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">قصور الدرقية (Hashimoto)</text>
<rect x="592.8571428571429" y="82" width="97.14285714285715" height="41.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="683.0" y="99" text-anchor="start" font-size="10.5" font-weight="800" fill="#0f172a">السبب</text>
<rect x="301.42857142857144" y="82" width="291.42857142857144" height="41.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="585.8571428571429" y="99" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">T3 وT4 عاليان: يود زائد، دواء درقي زائد</text>
<text x="585.8571428571429" y="114.75" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">(ليفوثيروكسين)، مناعة ذاتية (جريفز)</text>
<rect x="10.0" y="82" width="291.42857142857144" height="41.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="294.42857142857144" y="99" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">T3 وT4 منخفضان: نقص يود، علاج مضاد درقية، ورم</text>
<text x="294.42857142857144" y="114.75" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">نخامي، مناعة ذاتية (هاشيموتو)</text>
<rect x="592.8571428571429" y="123.5" width="97.14285714285715" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="683.0" y="140.5" text-anchor="start" font-size="10.5" font-weight="800" fill="#0f172a">المعمل</text>
<rect x="301.42857142857144" y="123.5" width="291.42857142857144" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="585.8571428571429" y="140.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">T3/T4 مرتفعان وTSH منخفض (انظر T3/T4 أولاً)</text>
<rect x="10.0" y="123.5" width="291.42857142857144" height="28" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="294.42857142857144" y="140.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">T3/T4 منخفضان وTSH مرتفع (عكس T3/T4 دائماً)</text>
<rect x="592.8571428571429" y="151.5" width="97.14285714285715" height="73.0" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="683.0" y="168.5" text-anchor="start" font-size="10.5" font-weight="800" fill="#0f172a">العلامات</text>
<rect x="301.42857142857144" y="151.5" width="291.42857142857144" height="73.0" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="585.8571428571429" y="168.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">"عالٍ وساخن": جحوظ (Exophthalmos) وتضخم درقية</text>
<text x="585.8571428571429" y="184.25" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">(Goiter)، ضغط مرتفع (أزمة 180/100+)، نبض فوق</text>
<text x="585.8571428571429" y="200.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">100، خفقان ورجفان أذيني، حرارة وجلد ساخن متعرق</text>
<text x="585.8571428571429" y="215.75" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">وعدم تحمل الحرارة، إسهال</text>
<rect x="10.0" y="151.5" width="291.42857142857144" height="73.0" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="294.42857142857144" y="168.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">"بطيء ومنخفض": خمول وضعف وآلام عضلية، زيادة وزن</text>
<text x="294.42857142857144" y="184.25" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">ووذمة، إمساك، تساقط شعر (لا شعرانية)، نسيان</text>
<text x="294.42857142857144" y="200.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">واكتئاب، قلة رغبة وعقم، جلد جاف، دورة غائبة أو</text>
<text x="294.42857142857144" y="215.75" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">غزيرة</text>
<rect x="592.8571428571429" y="224.5" width="97.14285714285715" height="73.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="683.0" y="241.5" text-anchor="start" font-size="10.5" font-weight="800" fill="#0f172a">المضاعفة</text>
<rect x="301.42857142857144" y="224.5" width="291.42857142857144" height="73.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="585.8571428571429" y="241.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">عاصفة درقية (Thyroid storm): هياج وارتباك</text>
<text x="585.8571428571429" y="257.25" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">مبكران وأزمة ضغط</text>
<rect x="10.0" y="224.5" width="291.42857142857144" height="73.0" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="294.42857142857144" y="241.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">غيبوبة وذمية (Myxedema coma): بطء تنفس وفشل</text>
<text x="294.42857142857144" y="257.25" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">تنفسي، ضغط ونبض منخفضان (&lt;60) وحرارة منخفضة؛</text>
<text x="294.42857142857144" y="273.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">جهّز طقم فغر القصبة/تنبيب (طوارئ)؛ لا بطانيات</text>
<text x="294.42857142857144" y="288.75" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">كهربائية</text>
<rect x="592.8571428571429" y="297.5" width="97.14285714285715" height="57.25" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="683.0" y="314.5" text-anchor="start" font-size="10.5" font-weight="800" fill="#0f172a">التغذية</text>
<rect x="301.42857142857144" y="297.5" width="291.42857142857144" height="57.25" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="585.8571428571429" y="314.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">أيض عالٍ: 4000–5000 سعر/يوم، بروتين وكربوهيدرات</text>
<text x="585.8571428571429" y="330.25" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">عالية، ألياف قليلة (إلا مع إمساك)، لا كافيين</text>
<text x="585.8571428571429" y="346.0" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">ولا توابل</text>
<rect x="10.0" y="297.5" width="291.42857142857144" height="57.25" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="294.42857142857144" y="314.5" text-anchor="start" font-size="10.5" font-weight="400" fill="#0f172a">أيض منخفض: سعرات أقل، فترات راحة متكررة</text>
</svg>
