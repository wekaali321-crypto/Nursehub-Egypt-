<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="280" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مثال: هل جرعة الميروبينيم ضمن النطاق الآمن؟</text>
  <rect x="30" y="50" width="580" height="40" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="320" y="76" text-anchor="middle" font-size="13" font-weight="500" fill="#1e293b">المطلوب 250 mg كل 8 ساعات | طفل 15.7 رطل | النطاق 75–150 mg/كجم/يوم</text><rect x="480" y="110" width="130" height="50" rx="10" fill="#dbeafe"/><text x="545" y="140" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e293b">15.7 ÷ 2.2 = 7.13 كجم</text><rect x="330" y="110" width="130" height="50" rx="10" fill="#dbeafe"/><text x="395" y="132" text-anchor="middle" font-size="12" font-weight="500" fill="#1e293b">الحد الأدنى: 534.75</text><text x="395" y="150" text-anchor="middle" font-size="11.5" font-weight="500" fill="#1e293b">(75 × 7.13)</text><rect x="180" y="110" width="130" height="50" rx="10" fill="#dbeafe"/><text x="245" y="132" text-anchor="middle" font-size="12" font-weight="500" fill="#1e293b">الحد الأعلى: 1069.5</text><text x="245" y="150" text-anchor="middle" font-size="11.5" font-weight="500" fill="#1e293b">(150 × 7.13)</text><rect x="30" y="110" width="130" height="50" rx="10" fill="#dcfce7"/><text x="95" y="132" text-anchor="middle" font-size="12" font-weight="500" fill="#1e293b">250 × 3 جرعات</text><text x="95" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">= 750 mg/يوم</text><line x1="545" y1="160" x2="545" y2="195" stroke="#475569" stroke-width="2.5" marker-end="url(#ar)"/><rect x="130" y="195" width="480" height="45" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="370" y="224" text-anchor="middle" font-size="14" font-weight="800" fill="#166534">750 تقع بين 534.75 و1069.5 → الجرعة ضمن النطاق الآمن ✓</text>
</svg>
