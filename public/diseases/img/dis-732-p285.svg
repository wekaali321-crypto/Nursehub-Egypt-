<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 278" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="700" height="278" rx="16" fill="#f8fafc"/>
<text x="350.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">SIADH: "ماء زائد داخل الجسم"</text>
<rect x="356.0" y="52" width="330.0" height="198.5" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="356.0" y="52" width="330.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="521.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الآلية والأعراض</text>
<text x="676.0" y="96" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• هرمون ADH يحتفظ بالماء؛ في SIADH يُفرز بلا حاجة</text>
<text x="676.0" y="112.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">فيحتبس الماء</text>
<text x="676.0" y="131.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• قلة البول وبول كثيف (وزن نوعي 1.030 فأكثر)</text>
<text x="676.0" y="149.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• نقص أسمولية الدم ونقص صوديوم أقل من 135 (الصداع</text>
<text x="676.0" y="166.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">علامة مبكرة)</text>
<text x="676.0" y="184.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• تشنجات وارتباك، ضغط مرتفع شديد</text>
<text x="676.0" y="203.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• التدخل: إيقاف السوائل (لا شرب ولا وريدي)، ملح،</text>
<text x="676.0" y="219.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">مدرات، وسوائل مالحة 3% وريدياً للشديد (بأمر</text>
<text x="676.0" y="236.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">الطبيب)</text>
<rect x="14.0" y="52" width="330.0" height="198.5" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.2"/>
<rect x="14.0" y="52" width="330.0" height="26" rx="10" fill="#6366f1" fill-opacity="1" stroke="#6366f1" stroke-width="1.2"/>
<text x="179.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأسباب والتمريض</text>
<text x="334.0" y="96" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• سرطان رئة صغير الخلايا (نقطة امتحان)</text>
<text x="334.0" y="114.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• إصابة دماغ شديدة (رضح/جراحة)</text>
<text x="334.0" y="133.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• عدوى دماغية: التهاب سحايا</text>
<text x="334.0" y="151.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• وزن يومي (لا أسبوعي): زيادة الوزن = ماء</text>
<text x="334.0" y="170.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• أسئلة: توقع نقص أسمولية وصوديوم ونقص بول؛ نفّذ</text>
<text x="334.0" y="186.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">تقييد السوائل واحتياطات التشنج ومراقبة الداخل</text>
<text x="334.0" y="203.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">والخارج؛ لا سوائل صيانة 0.9% ولا قياس أسبوعي</text>
</svg>
