<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="394" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">ملخص الرضاعة (2): التركيبة والاحتقان وفقد الوزن</text><rect x="330" y="44" width="300" height="200" rx="10" fill="#fff" stroke="#1d4ed8" stroke-width="2"/><rect x="330" y="44" width="300" height="30" rx="10" fill="#1d4ed8"/><rect x="330" y="62" width="300" height="12" fill="#1d4ed8"/><text x="480.0" y="65" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">قواعد التركيبة الصناعية</text><text x="620" y="94" text-anchor="start" font-size="12.5" fill="#0f172a">اغسلي غطاء العلبة قبل فتحها</text><text x="620" y="115" text-anchor="start" font-size="12.5" fill="#0f172a">التركيبة المفتوحة: ثلاجة وترمى بعد 48 ساعة</text><text x="620" y="136" text-anchor="start" font-size="12.5" fill="#0f172a">ارمي ما تبقى بعد الرضعة</text><text x="620" y="157" text-anchor="start" font-size="12.5" fill="#0f172a">اغلي أو اغسلي الزجاجات والحلمات والأغطية</text><text x="620" y="178" text-anchor="start" font-size="12.5" fill="#0f172a">سخّني وجرّبي على الرسغ: دافئة لا حارة</text><text x="620" y="199" text-anchor="start" font-size="12.5" fill="#0f172a">لا تخففي ولا تركّزي أكثر من اللازم</text><text x="620" y="220" text-anchor="start" font-size="12.5" fill="#0f172a">ممنوع التسخين بالميكروويف</text><rect x="10" y="44" width="310" height="200" rx="10" fill="#fff" stroke="#be185d" stroke-width="2"/><rect x="10" y="44" width="310" height="30" rx="10" fill="#be185d"/><rect x="10" y="62" width="310" height="12" fill="#be185d"/><text x="165.0" y="65" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">احتقان الثدي</text><text x="310" y="94" text-anchor="start" font-size="12.5" fill="#0f172a">أرضعي أو اعصري كل 1–3 ساعات</text><text x="310" y="115" text-anchor="start" font-size="12.5" fill="#0f172a">تعرّفي إشارات الجوع: بحث بالفم ومص</text><text x="310" y="136" text-anchor="start" font-size="12.5" fill="#0f172a">كمادات دافئة أو دش دافئ قبل الرضعة</text><text x="310" y="157" text-anchor="start" font-size="12.5" fill="#0f172a">كمادات باردة بعد الرضعة</text><text x="310" y="178" text-anchor="start" font-size="12.5" fill="#0f172a">أوراق كرنب باردة طازجة بين الرضعات</text><text x="310" y="199" text-anchor="start" font-size="12.5" fill="#0f172a">لبن الأم على الحلمة المتشققة وتهوية</text><rect x="10" y="258" width="620" height="120" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/><rect x="10" y="258" width="620" height="30" rx="10" fill="#0f766e"/><rect x="10" y="276" width="620" height="12" fill="#0f766e"/><text x="320.0" y="279" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">فقد وزن المولود وما يُجنَّب أثناء الرضاعة</text><text x="620" y="308" text-anchor="start" font-size="12.5" fill="#0f172a">الفقد الطبيعي 5–6% في أول 3–4 أيام؛ أكثر من 7% يُبلَّغ</text><text x="620" y="329" text-anchor="start" font-size="12.5" fill="#0f172a">دعم الرضاعة أو تكميل التركيبة بحسب التقييم</text><text x="620" y="350" text-anchor="start" font-size="12.5" fill="#0f172a">تجنبي التدخين والمخدرات، والكحول: انتظري ساعتين فأكثر</text><text x="620" y="371" text-anchor="start" font-size="12.5" fill="#0f172a">المسكن يؤخذ مباشرة بعد الرضعة لتقليل انتقاله للبن</text></svg>