<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="360" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع العزل: قطرات مقابل محمول بالهواء</text>
<rect x="20" y="48" width="290" height="42" rx="10" fill="#0369a1"/>
<text x="165.0" y="74.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">عزل القطرات (Droplet)</text>
<rect x="330" y="48" width="290" height="42" rx="10" fill="#0f766e"/>
<text x="475.0" y="74.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">عزل المحمول بالهواء (Airborne)</text>
<rect x="20" y="96" width="290" height="110" rx="10" fill="#e0f2fe"/>
<rect x="330" y="96" width="290" height="110" rx="10" fill="#ccfbf1"/>
<text x="165" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#0c4a6e">السعال الديكي (Pertussis)</text>
<text x="165" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#0c4a6e">الإنفلونزا (Influenza)</text>
<text x="165" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#0c4a6e">التهاب السحايا الجرثومي (Meningitis)</text>
<text x="165" y="194" text-anchor="middle" font-size="12" font-weight="600" fill="#0c4a6e">الالتهاب الرئوي بأنواع (Pneumonia)</text>
<text x="475" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#134e4a">الحصبة (Measles)</text>
<text x="475" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#134e4a">الدرن الرئوي (TB)</text>
<text x="475" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#134e4a">الجدري المائي (Varicella)</text>
<text x="475" y="194" text-anchor="middle" font-size="12" font-weight="600" fill="#134e4a">الحزام المنتشر (Zoster)</text>
<rect x="20" y="212" width="290" height="110" rx="10" fill="#fff" stroke="#0369a1" stroke-width="2"/>
<rect x="330" y="212" width="290" height="110" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/>
<text x="165" y="238" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">• كمامة جراحية ونظارات</text>
<text x="165" y="262" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">• غرفة خاصة</text>
<text x="165" y="286" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">• المسافة نحو متر إلى مترين</text>
<text x="165" y="310" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">• المريض يلبس كمامة عند النقل</text>
<text x="475" y="238" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">• كمامة N95 للعاملين</text>
<text x="475" y="262" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">• غرفة ضغط سالب والباب مغلق</text>
<text x="475" y="286" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">• المريض يلبس كمامة جراحية عند النقل</text>
<text x="475" y="310" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">• عدم دخول غير المحصّنين</text>
<text x="320" y="348" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">عزل التلامس (Contact): MRSA وC. diff وجرب وVRE — قفاز وروب وغسل أيدي</text>
</svg>
