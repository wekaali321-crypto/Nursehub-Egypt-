<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 434" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="434" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">الاكتئاب: أولوية خطر الانتحار</text><rect x="326" y="50" width="294" height="176.875" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M326 60a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#b91c1c"/><text x="473" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">علامات الخطر</text><text x="610" y="96.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="96.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">هدوء أو نشاط مفاجئ (تغير طاقة مفاجئ) = خطر</text><text x="598" y="114.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أعلى</text><text x="610" y="135.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="135.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">التخلي عن ممتلكات عزيزة</text><text x="610" y="156.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="156.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">عبارات: «لن أكون مشكلة قريباً»، «سينتهي كل</text><text x="598" y="175" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">شيء قريباً»، «لا أريد العيش»</text><text x="610" y="196.125" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="196.125" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ابتسام مفاجئ ويقول «انتهت الأزمة وشُفيت»:</text><text x="598" y="214.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ارفع احتياطات الانتحار</text><rect x="20" y="50" width="294" height="176.875" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/><path d="M20 60a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#0e7490"/><text x="167" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">اسأل مباشرة</text><text x="304" y="96.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="292" y="96.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">«هل راودتك أفكار إيذاء نفسك؟» (نقطة</text><text x="292" y="114.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">امتحان)</text><text x="304" y="135.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="292" y="135.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">«هل لديك خطة لقتل نفسك؟»</text><text x="304" y="156.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="292" y="156.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">«هل تريد أن تموت؟»</text><text x="304" y="178" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="292" y="178" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">اسأل عن خطة تنهي بها حياتك الآن أولاً</text><rect x="326" y="238.875" width="294" height="182.875" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><path d="M326 248.875a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#15803d"/><text x="473" y="259.875" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">نقاط امتحان</text><text x="610" y="285.375" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="285.375" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">مراقبة فردية مستمرة (⁦1⁩:⁦1⁩)</text><text x="610" y="306.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="306.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">غرفة شبه خاصة قرب محطة التمريض</text><text x="610" y="327.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="327.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أزل الأشياء الخطرة من الغرفة</text><text x="610" y="348.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="348.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أشرف أثناء الوجبات</text><text x="610" y="369.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="369.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أعد التقييم لتغير الأفكار</text><text x="610" y="391" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="391" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ركّز على خطط المستقبل: أهداف شخصية، أسرة،</text><text x="598" y="409.125" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أصدقاء</text><rect x="20" y="238.875" width="294" height="182.875" rx="10" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><path d="M20 248.875a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#6d28d9"/><text x="167" y="259.875" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التدخلات العامة</text><text x="304" y="285.375" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="285.375" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">شجّع ودعوة للمشاركة</text><text x="304" y="306.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="306.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ساعد في الأنشطة اليومية (تجهيز الاستعداد)</text><text x="304" y="327.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="327.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">اجلس مع المريض بلغة بسيطة ومباشرة</text><text x="304" y="348.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="348.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أعد التقييم</text><text x="304" y="369.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="369.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">«أود أن أقضي بعض الوقت معك»</text><text x="304" y="391" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="391" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">برنامج أنشطة منظم</text></svg>