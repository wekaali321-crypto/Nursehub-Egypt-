<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 415" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="415" rx="16" fill="#f8fafc"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">اختيار دواء الكحة: اسأل سؤالين</text><rect x="170" y="48" width="300" height="50" rx="10" fill="#334155" stroke="#334155" stroke-width="2"/><text x="320.0" y="77.9" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">١) السن كام؟  ٢) كحة جافة ولا ببلغم؟</text><line x1="320" y1="98" x2="525" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="440" y="128" width="180" height="40" rx="10" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/><text x="530.0" y="152.9" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">أقل من سنتين</text><rect x="440" y="176" width="180" height="92" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="530.0" y="208.2" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">نقط أو شراب أو لبوس</text><text x="530.0" y="226.2" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">أعشاب أو أدوية قليلة جداً</text><text x="530.0" y="244.2" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">وبأمر الطبيب فقط</text><line x1="320" y1="98" x2="320" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="235" y="128" width="180" height="40" rx="10" fill="#0ea5e9" stroke="#0ea5e9" stroke-width="2"/><text x="325.0" y="152.9" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">من 2 إلى 12 سنة</text><rect x="235" y="176" width="180" height="92" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/><text x="325.0" y="208.2" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">شراب غالباً</text><text x="325.0" y="226.2" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">ملعقة صغيرة (2–6 سنين)</text><text x="325.0" y="244.2" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">ملعقة كبيرة (6–12 سنة)</text><line x1="320" y1="98" x2="115" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="30" y="128" width="180" height="40" rx="10" fill="#22c55e" stroke="#22c55e" stroke-width="2"/><text x="120.0" y="152.9" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">أكبر من 12 سنة والكبار</text><rect x="30" y="176" width="180" height="92" rx="10" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/><text x="120.0" y="208.2" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">شراب أو أقراص</text><text x="120.0" y="226.2" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">أو كبسولات أو فوار</text><text x="120.0" y="244.2" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">أو أمبول في الشديد</text><rect x="30" y="285" width="285" height="60" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="172.5" y="310.1" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">كحة جافة</text><text x="172.5" y="329.1" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">مثبّط كحة أو أعشاب للجافة</text><rect x="325" y="285" width="285" height="60" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/><text x="467.5" y="310.1" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">كحة ببلغم</text><text x="467.5" y="329.1" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">مذيب/طارد بلغم (بدون مثبّط كحة)</text><rect x="30" y="358" width="580" height="44" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="320.0" y="384.6" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">قبل أي حاجة: دوّر على السبب (فلو، ACE inhibitor، ارتجاع)</text></svg>