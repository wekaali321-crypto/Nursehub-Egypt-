<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 395" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="395" rx="16" fill="#f8fafc"/><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">نزيف الأنف (الرعاف): خطوات الإسعاف</text><rect x="40" y="45" width="560" height="52" rx="12" fill="#0ea5e9"/><text x="320" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">المريض جالس + الرأس مائل للأمام شوية (ليس للخلف)</text><line x1="320" y1="97" x2="320" y2="111" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/><rect x="40" y="113" width="560" height="52" rx="12" fill="#f97316"/><text x="320" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">اضغط على الجزء الغضروفي اللين من الأنف بالإبهام والسبابة 5-10 دقائق بدون تحرير</text><line x1="320" y1="165" x2="320" y2="179" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/><rect x="40" y="181" width="560" height="52" rx="12" fill="#eab308"/><text x="320" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#422006">أثناء الضغط: Dicynone / Kapron + قياس الضغط</text><line x1="320" y1="233" x2="320" y2="247" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/><rect x="40" y="249" width="560" height="52" rx="12" fill="#dc2626"/><text x="320" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">لم يقف؟ شاش بالأدرينالين أو Afrin نقطتين/بخة</text><line x1="320" y1="301" x2="320" y2="315" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/><rect x="40" y="317" width="560" height="52" rx="12" fill="#16a34a"/><text x="320" y="348" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">لم يقف نصف ساعة أو شديد: تحويل ENT</text></svg>
