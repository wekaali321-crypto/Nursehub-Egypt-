<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 468" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="700" height="468" rx="16" fill="#f8fafc"/>
<text x="350.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">علاج فرط الدرقية: الأدوية واليود المشع والعين</text>
<rect x="14.0" y="52" width="672.0" height="117.0" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="14.0" y="52" width="672.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="350.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأدوية</text>
<text x="676.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• SSKI (يود البوتاسيوم): يقلص الدرقية ويصبغ الأسنان (استعمل قشة وعصيراً) وبعيداً ساعة عن الأدوية</text>
<text x="676.0" y="115.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ميثيمازول: غير آمن للحمل</text>
<text x="676.0" y="134.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• بروبيل ثيو يوراسيل PTU: آمن للحمل؛ أبلغ عن حمى والتهاب حلق</text>
<text x="676.0" y="153.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• بيتا (-lol) بروبرانولول: يخفض الضغط والنبض</text>
<rect x="14.0" y="181.0" width="672.0" height="113.0" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="14.0" y="181.0" width="672.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="350.0" y="199.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">اليود المشع RAIU (يدمر الدرقية)</text>
<text x="676.0" y="225.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قبل: اختبار حمل، إزالة حلي الرقبة وطقم الأسنان، إيقاف مضادات الدرقية 5–7 أيام، صيام 2–4 ساعات قبل</text>
<text x="676.0" y="242.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">و1–2 بعد</text>
<text x="676.0" y="261.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• بعد: تجنب الآخرين خاصة الحوامل: لا تجمعات ولا نفس الحمام (اسحب السيفون 3 مرات) ولا نفس أدوات الطعام</text>
<text x="676.0" y="278.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">ولا غسيل مع الأسرة</text>
<rect x="14.0" y="306.0" width="672.0" height="134.25" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.2"/>
<rect x="14.0" y="306.0" width="672.0" height="26" rx="10" fill="#6366f1" fill-opacity="1" stroke="#6366f1" stroke-width="1.2"/>
<text x="350.0" y="324.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">تثقيف العين والأزمة</text>
<text x="676.0" y="350.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• حركة العين (تمارين)، قطرات دموع صناعية، نظارات داكنة، لا تدليك</text>
<text x="676.0" y="369.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• شريط/غطاء للجفنين</text>
<text x="676.0" y="388.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تجنب محفزات العاصفة: لا ملح كثير (تورم العين) ورفع الرأس لتصريف العين، لا منبهات، لا تدخين ولا</text>
<text x="676.0" y="405.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">إجهاد ولا عدوى</text>
<text x="676.0" y="425.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا تلمس الرقبة لأنها تفرز هرمونات أكثر</text>
</svg>
