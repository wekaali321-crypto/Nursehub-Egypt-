<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 337" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="337" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الهربس البسيط: النوعان والآفات النشطة</text><rect x="325" y="54" width="295" height="126.8" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="325" y="54" width="295" height="29" rx="10" fill="#f59e0b"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">النوع 1 (قروح البرد)</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• يزول من تلقاء نفسه خلال 10–14 يومًا</text><rect x="20" y="54" width="295" height="126.8" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="20" y="54" width="295" height="29" rx="10" fill="#ef4444"/><text x="307" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">النوع 2 (تناسلي)</text><text x="307" y="99" text-anchor="start" font-size="13" fill="#0f172a">• غير قابل للشفاء</text><text x="307" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• تظهر الأعراض بعد نحو 14 يومًا من</text><text x="307" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">التعرض</text><text x="307" y="163.6" text-anchor="start" font-size="13" fill="#0f172a">• آفات مؤلمة بحرقة ولسع</text><rect x="325" y="190.8" width="295" height="131.8" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.5"/><rect x="325" y="190.8" width="295" height="29" rx="10" fill="#6366f1"/><text x="612" y="208.8" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">آفات نشطة (معدية)</text><text x="612" y="235.8" text-anchor="start" font-size="13" fill="#0f172a">• لا تلمس الآفات واغسل يديك</text><text x="612" y="259" text-anchor="start" font-size="13" fill="#0f172a">• تجنب الجماع (الواقي لا ينفع)</text><text x="612" y="282.2" text-anchor="start" font-size="13" fill="#0f172a">• تجنب الصابون المعطر</text><text x="612" y="305.4" text-anchor="start" font-size="13" fill="#0f172a">• الآفات نظيفة وجافة</text><rect x="20" y="190.8" width="295" height="131.8" rx="10" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="1.5"/><rect x="20" y="190.8" width="295" height="29" rx="10" fill="#ec4899"/><text x="307" y="208.8" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الحمل</text><text x="307" y="235.8" text-anchor="start" font-size="13" fill="#0f172a">• أبلغ الطبيب فورًا أثناء الحمل</text><text x="307" y="259" text-anchor="start" font-size="13" fill="#0f172a">• acyclovir مضاد فيروسي</text><text x="307" y="282.2" text-anchor="start" font-size="13" fill="#0f172a">• آفات نشطة عند الولادة: لا ولادة</text><text x="307" y="300.4" text-anchor="start" font-size="13" fill="#0f172a">مهبلية بل قيصرية</text></svg>
