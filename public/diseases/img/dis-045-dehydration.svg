<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="330" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">درجات الجفاف وخطة الإماهة</text>
  <g font-size="13" text-anchor="middle">
    <rect x="440" y="50" width="180" height="240" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="530" y="78" font-size="18" font-weight="800" fill="#166534">A: لا جفاف</text>
    <g fill="#14532d"><text x="530" y="108">يقظ</text><text x="530" y="130">عيون طبيعية</text><text x="530" y="152">دموع موجودة</text><text x="530" y="174">فم رطب</text><text x="530" y="196">شرب طبيعي</text></g>
    <rect x="460" y="220" width="140" height="56" rx="10" fill="#16a34a"/><text x="530" y="244" fill="#fff" font-weight="700">سوائل بحرية</text><text x="530" y="264" fill="#fff">+ تغذية عادية</text>

    <rect x="230" y="50" width="190" height="240" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="325" y="78" font-size="18" font-weight="800" fill="#854d0e">B: متوسط</text>
    <g fill="#713f12"><text x="325" y="108">قلق / متهيج</text><text x="325" y="130">عيون غائرة</text><text x="325" y="152">دموع غائبة</text><text x="325" y="174">فم جاف، عطشان</text><text x="325" y="196">يشرب بلهفة</text></g>
    <rect x="250" y="220" width="150" height="56" rx="10" fill="#ca8a04"/><text x="325" y="244" fill="#fff" font-weight="700">ORS 400 مل</text><text x="325" y="264" fill="#fff">بعد كل براز + ماء</text>

    <rect x="20" y="50" width="190" height="240" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="115" y="78" font-size="18" font-weight="800" fill="#991b1b">C: شديد</text>
    <g fill="#7f1d1d"><text x="115" y="108">خامل / فاقد وعي</text><text x="115" y="130">عيون غائرة جداً</text><text x="115" y="152">دموع غائبة</text><text x="115" y="174">فم جاف جداً</text><text x="115" y="196">لا يستطيع الشرب</text></g>
    <rect x="35" y="220" width="160" height="56" rx="10" fill="#dc2626"/><text x="115" y="244" fill="#fff" font-weight="700">محلول وريدي (رينجر / ملح)</text><text x="115" y="264" fill="#fff" font-size="12">30 مل/كجم ثم 70 مل/كجم</text>
  </g>
  <text x="320" y="316" text-anchor="middle" font-size="12" fill="#475569">تصنيف WHO للأطفال، وفي الكبار تُضاف قياسات الضغط والنبض (حجم السوائل بأمر الطبيب)</text>
</svg>
