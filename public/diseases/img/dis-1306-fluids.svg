<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="250" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">إنعاش السوائل في أول 24 ساعة (معادلة Parkland)</text>
<rect x="30" y="50" width="580" height="56" rx="10" fill="#1d4ed8"/>
<text x="320.0" y="83.33333333333333" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">السوائل (مل) = 4 × الوزن (كجم) × نسبة الحرق % (TBSA)</text>
<rect x="30" y="125" width="280" height="70" rx="10" fill="#0369a1"/>
<text x="170.0" y="154.33333333333334" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">النصف الأول</text>
<text x="170.0" y="174.33333333333334" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">خلال أول 8 ساعات من وقت الحرق</text>
<rect x="330" y="125" width="280" height="70" rx="10" fill="#0f766e"/>
<text x="470.0" y="154.33333333333334" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">النصف الثاني</text>
<text x="470.0" y="174.33333333333334" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">خلال 16 ساعة التالية</text>
<text x="320" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">مثال: 70 كجم و30% ← 4×70×30 = 8,400 مل (4,200 في أول 8 س)</text>
<text x="320" y="242" text-anchor="middle" font-size="12" font-weight="500" fill="#475569">محلول رينجر لاكتات (LR) هو المعتاد؛ والمؤشر الأهم الأداء: البول والضغط والنبض</text>
</svg>
