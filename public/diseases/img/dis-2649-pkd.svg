<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="420" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الكلى المتعددة الكيسات PKD</text><rect x="330" y="46" width="290" height="70" rx="10" fill="#7c3aed"/><text x="475.0" y="76.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">تكوّن أكياس وتضخم الكلى</text><text x="475.0" y="92.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">تمزق وعدوى وندب وتلف النيفرونات</text><rect x="20" y="46" width="300" height="70" rx="10" fill="#0891b2"/><text x="170.0" y="77.0" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">طفلي: وراثي متنحٍ، وفاة بعد أشهر</text><text x="170.0" y="92.0" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">بالغ: سائد، يظهر 30-40 سنة وينتهي بفشل كلوي</text><rect x="20" y="126" width="600" height="56" rx="10" fill="#fee2e2"/><text x="320.0" y="149.85" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">ألم خاصرة، حمى، UTI متكرر، بيلة دموية وبروتينية</text><text x="320.0" y="165.85" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">حصوات، ارتفاع ضغط، كتلة بطن وكلى متضخمة</text><rect x="20" y="192" width="600" height="52" rx="10" fill="#e0f2fe"/><text x="320.0" y="221.85" text-anchor="middle" font-size="11" font-weight="700" fill="#0c4a6e">تحاليل: كرياتينين، Hct، ألبومين، شوارد؛ سونار، تصوير ملوّن، MRI/CT</text><rect x="20" y="254" width="600" height="70" rx="10" fill="#dcfce7"/><text x="320.0" y="284.85" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">علاج: مسكنات (بدون NSAIDs)، مضادات حيوية، خافضات ضغط ACEi/ARB، Furosemide</text><text x="320.0" y="300.85" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">Tolvaptan يبطئ التقدم، تصريف الكيس، غسيل أو زراعة</text><rect x="20" y="334" width="600" height="76" rx="10" fill="#fef3c7"/><text x="320.0" y="367.85" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">تمريض: راقب بيلة دموية ظاهرة (تمزق كيس)، راحة، ابدأ تحضير الغسيل</text><text x="320.0" y="383.85" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">لا NSAIDs لسمية الكلى</text></svg>