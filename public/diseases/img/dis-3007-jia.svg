<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="360" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب المفاصل الشبابي (JIA) ومقارنته بالروماتويد</text><rect x="330" y="50" width="290" height="100" rx="10" fill="#6366f1"/><text x="475.0" y="76.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">JIA</text><text x="475.0" y="94.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">مناعة ذاتية تهاجم المفاصل</text><text x="475.0" y="112.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">أكثر أنواع التهاب المفاصل عند الأطفال والمراهقين</text><text x="475.0" y="130.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ألم أسوأ صباحًا · تورم وتيبس · حمى وطفح</text><rect x="20" y="50" width="300" height="100" rx="10" fill="#ec4899"/><text x="170.0" y="76.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الروماتويد (RA)</text><text x="170.0" y="94.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">مفاصل صغيرة متماثلة باليدين</text><text x="170.0" y="112.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تشوه رقبة البجعة/العروة</text><text x="170.0" y="130.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ألم يتحسن بالنشاط ويزيد بالراحة</text><rect x="330" y="165" width="290" height="110" rx="10" fill="#16a34a"/><text x="475.0" y="197.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التثقيف</text><text x="475.0" y="214.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">رياضة خفيفة التأثير: سباحة، يوغا، دراجة ثابتة</text><text x="475.0" y="231.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">دش أو حمام دافئ صباحًا</text><text x="475.0" y="248.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">كمادات باردة/ساخنة، مفاصل بوضع محايد</text><rect x="20" y="165" width="300" height="110" rx="10" fill="#f59e0b"/><text x="170.0" y="197.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">الدواء</text><text x="170.0" y="214.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">ستيرويدات (-sone) مثل بريدنيزون</text><text x="170.0" y="231.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">أعطه بالتبادل يومًا بعد يوم إن وصفه الطبيب</text><text x="170.0" y="248.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">خطة تعليمية فردية بالمدرسة</text><rect x="20" y="290" width="600" height="55" rx="10" fill="#334155"/><text x="320.0" y="320.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">وسيلة التشخيص الأنسب: التقييم السريري للأعراض والعلامات</text></svg>