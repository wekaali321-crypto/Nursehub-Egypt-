<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="360" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">متلازمة راي (Reye) المحفّزات والتمريض</text><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#475569"/></marker></defs><rect x="430" y="50" width="190" height="80" rx="10" fill="#ef4444"/><text x="525.0" y="66.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المحفّزات</text><text x="525.0" y="84.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">عدوى إنفلونزا حديثة</text><text x="525.0" y="102.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">الأسبرين (Aspirin)</text><text x="525.0" y="120.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لا أسبرين للأطفال</text><rect x="225" y="50" width="190" height="80" rx="10" fill="#f59e0b"/><text x="320.0" y="75.5" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">الآلية</text><text x="320.0" y="92.5" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">تورم دماغ: نوبات، انتفاخ اليافوخ</text><text x="320.0" y="109.5" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">تلف كبد: ارتفاع الأمونيا وAST/ALT وزمن التخثر</text><rect x="20" y="50" width="190" height="80" rx="10" fill="#7c3aed"/><text x="115.0" y="75.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المضاعفة</text><text x="115.0" y="93.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">اعتلال دماغي كبدي</text><text x="115.0" y="111.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ارتباك وتغير الحالة العقلية</text><line x1="425" y1="90" x2="415" y2="90" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/><line x1="220" y1="90" x2="210" y2="90" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/><rect x="330" y="150" width="290" height="110" rx="10" fill="#16a34a"/><text x="475.0" y="172.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">مراقبة وخفض ICP</text><text x="475.0" y="190.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">رفع رأس السرير فوق 30 درجة</text><text x="475.0" y="208.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">مانيتول (مدر أسموزي) لخفض ضغط الجمجمة</text><text x="475.0" y="226.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">احتياطات النوبات</text><text x="475.0" y="244.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">فيتامين K لوقف النزف</text><rect x="20" y="150" width="300" height="110" rx="10" fill="#0ea5e9"/><text x="170.0" y="181.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التشخيص</text><text x="170.0" y="199.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">إنزيمات الكبد</text><text x="170.0" y="217.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">خزعة الكبد</text><text x="170.0" y="235.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">الكبد التالف لا يحول الأمونيا إلى يوريا</text><rect x="20" y="275" width="600" height="70" rx="10" fill="#dc2626"/><text x="320.0" y="304.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">مصيدة اختبار</text><text x="320.0" y="323.0" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">سؤال اختبار: «أعطيت طفلي أسبرين لخفض الحرارة» = زيادة خطر راي</text></svg>