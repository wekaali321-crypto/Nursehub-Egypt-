<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="330" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قلق الانفصال: المراحل الثلاث وتدخلات التمريض</text><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#475569"/></marker></defs><rect x="430" y="50" width="190" height="80" rx="10" fill="#ef4444"/><text x="525.0" y="74.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1) الاحتجاج (Protest)</text><text x="525.0" y="93.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">يبكي ويصرخ ويتعلق بالوالد</text><text x="525.0" y="112.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">يهاجم الغرباء لفظيًا</text><rect x="225" y="50" width="190" height="80" rx="10" fill="#6366f1"/><text x="320.0" y="74.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2) اليأس (Despair)</text><text x="320.0" y="93.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">هادئ وانسحابي</text><text x="320.0" y="112.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">يفقد الأمل</text><rect x="20" y="50" width="190" height="80" rx="10" fill="#16a34a"/><text x="115.0" y="74.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3) الانفصال (Detachment)</text><text x="115.0" y="93.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">يبدو سعيدًا فجأة</text><text x="115.0" y="112.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">ليس تكيفًا حقيقيًا</text><line x1="425" y1="90" x2="415" y2="90" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/><line x1="220" y1="90" x2="210" y2="90" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/><rect x="330" y="145" width="290" height="70" rx="10" fill="#0ea5e9"/><text x="475.0" y="156.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">معلومات أساسية</text><text x="475.0" y="174.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">يبدأ في عمر 6 أشهر</text><text x="475.0" y="192.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ذروته 10-18 شهرًا</text><text x="475.0" y="210.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">يزول غالبًا بعد سن 3</text><rect x="20" y="145" width="300" height="70" rx="10" fill="#f59e0b"/><text x="170.0" y="165.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">فخ اختبار</text><text x="170.0" y="183.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">أقل من 6 أشهر: لا يظهر القلق بعد</text><text x="170.0" y="201.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">فلا تقل للأم إن الرضيع لن يبكي لصغر سنه</text><rect x="20" y="230" width="600" height="90" rx="10" fill="#16a34a"/><text x="320.0" y="251.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">تدخلات (6 أشهر فأكثر)</text><text x="320.0" y="269.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">بقاء الوالد ما أمكن · نفس الروتين اليومي (أكل ونوم) · بيئة نوم هادئة</text><text x="320.0" y="287.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">فرص للّعب والنشاط · إن انزعج الطفل ابقَ معه بهدوء</text><text x="320.0" y="305.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">أغراض مألوفة: بطانية، قميص الوالد، لعبة مفضلة، صورة العائلة</text></svg>