<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 261" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="261" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">علامات الحمى القرمزية</text><g text-anchor="middle"><rect x="330" y="46" width="290" height="57" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="475" y="68" font-size="14" font-weight="800" fill="#7f1d1d">حلق ملتهب + حرارة</text><text x="475" y="86" font-size="12" font-weight="600" fill="#7f1d1d">البداية</text><rect x="20" y="46" width="290" height="57" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="165" y="68" font-size="14" font-weight="800" fill="#7f1d1d">لسان الفراولة</text><text x="165" y="86" font-size="12" font-weight="600" fill="#7f1d1d">أحمر منتفخ</text><rect x="330" y="115" width="290" height="57" rx="10" fill="#fef9c3" stroke="#eab308"/><text x="475" y="137" font-size="14" font-weight="800" fill="#422006">طفح ورقي الملمس (Sandpaper)</text><text x="475" y="155" font-size="12" font-weight="600" fill="#422006">يبدأ الرقبة والصدر ويزول في 3 أيام</text><rect x="20" y="115" width="290" height="57" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="165" y="137" font-size="14" font-weight="800" fill="#1e3a8a">تقشر الأصابع والأقدام والفخذ</text><text x="165" y="155" font-size="12" font-weight="600" fill="#1e3a8a">بعد زوال الطفح</text><rect x="330" y="184" width="290" height="57" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><text x="475" y="206" font-size="14" font-weight="800" fill="#0f172a">قيء وقشعريرة وصداع</text><text x="475" y="224" font-size="12" font-weight="600" fill="#0f172a">أعراض عامة</text><rect x="20" y="184" width="290" height="57" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="165" y="206" font-size="14" font-weight="800" fill="#7f1d1d">مضاعفات متأخرة</text><text x="165" y="224" font-size="12" font-weight="600" fill="#7f1d1d">حمى روماتيزمية، التهاب كلى</text></g></svg>