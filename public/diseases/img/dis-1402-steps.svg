<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 423" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="423" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التعامل مع انعكاس الجهاز العصبي الذاتي (AD) خطوة بخطوة</text><rect x="20" y="54" width="600" height="53" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="590" cy="76" r="14" fill="#dc2626"/><text x="590" y="81" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="566" y="80" text-anchor="end" font-size="15" font-weight="800" fill="#7f1d1d">اجلس المريض وارفع الرأس</text><text x="566" y="100" text-anchor="end" font-size="13" fill="#7f1d1d">وضع جلوس أو رأس مرتفع فورًا لخفض الضغط، وأبلغ الطبيب.</text><text x="320" y="123" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="129" width="600" height="53" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="590" cy="151" r="14" fill="#dc2626"/><text x="590" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="566" y="155" text-anchor="end" font-size="15" font-weight="800" fill="#7f1d1d">فُكّ كل ما يضغط</text><text x="566" y="175" text-anchor="end" font-size="13" fill="#7f1d1d">ملابس ضيقة، حزام، جوارب، دعامات.</text><text x="320" y="198" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="204" width="600" height="53" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="590" cy="226" r="14" fill="#dc2626"/><text x="590" y="231" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="566" y="230" text-anchor="end" font-size="15" font-weight="800" fill="#7f1d1d">افحص المثانة أولًا</text><text x="566" y="250" text-anchor="end" font-size="13" fill="#7f1d1d">تحسّس البطن، تأكد أن القسطرة غير مطوية أو مسدودة وأن الكيس منخفض.</text><text x="320" y="273" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="279" width="600" height="53" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="590" cy="301" r="14" fill="#dc2626"/><text x="590" y="306" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="566" y="305" text-anchor="end" font-size="15" font-weight="800" fill="#7f1d1d">افحص الأمعاء</text><text x="566" y="325" text-anchor="end" font-size="13" fill="#7f1d1d">انحشار براز؟ أي تحسس شرجي يُجرى بمرهم مخدر موضعي بأمر الطبيب.</text><text x="320" y="348" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="354" width="600" height="53" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="590" cy="376" r="14" fill="#dc2626"/><text x="590" y="381" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text><text x="566" y="380" text-anchor="end" font-size="15" font-weight="800" fill="#7f1d1d">قِس الضغط كل 2–5 دقائق</text><text x="566" y="400" text-anchor="end" font-size="13" fill="#7f1d1d">ولا تعطِ دواء الضغط إلا بعد معالجة السبب وبأمر الطبيب إن استمر الارتفاع.</text></svg>