<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="640" height="420" rx="16" fill="#f8fafc"/>
<text x="320.0" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الجلطة السفلية واحتشاء البطين الأيمن (RVMI)</text>
<rect x="160" y="40" width="320" height="44" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="320.0" y="57.5" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">ارتفاع ST في II وIII وaVF</text>
<text x="320.0" y="74.5" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">(جلطة سفلية — الشريان التاجي الأيمن RCA)</text>
<line x1="240" y1="84" x2="130" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="400" y1="84" x2="510" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="20" y="112" width="220" height="76" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="130.0" y="129.08333333333334" text-anchor="middle" font-size="11.5" font-weight="600" fill="#78350f">مشاكل شائعة</text>
<text x="130.0" y="145.58333333333334" text-anchor="middle" font-size="11.5" font-weight="600" fill="#78350f">ألم بالمعدة (Epigastric)</text>
<text x="130.0" y="162.08333333333334" text-anchor="middle" font-size="11.5" font-weight="600" fill="#78350f">هبوط ضغط • بطء (غالباً مؤقت)</text>
<text x="130.0" y="178.58333333333334" text-anchor="middle" font-size="11.5" font-weight="600" fill="#78350f">حصار قلب (غالباً مؤقت)</text>
<rect x="400" y="112" width="220" height="76" rx="10" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
<text x="510.0" y="137.33333333333334" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7f1d1d">قد يصاحبه احتشاء البطين الأيمن</text>
<text x="510.0" y="153.83333333333334" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7f1d1d">الثلاثي: هبوط ضغط + ارتفاع JVP</text>
<text x="510.0" y="170.33333333333334" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7f1d1d">+ صدر نظيف (لا طقطقة)</text>
<line x1="510" y1="188" x2="510" y2="208" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="300" y="208" width="320" height="50" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="460.0" y="228.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">اطلب تخطيطاً جانبياً أيمن: V4R</text>
<text x="460.0" y="245.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">(ارتفاع ST في V4R)</text>
<line x1="460" y1="258" x2="460" y2="278" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="300" y="278" width="320" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="460.0" y="300.0" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">العلاج: سوائل وريدي (حتى لتر ملح)</text>
<text x="460.0" y="317.0" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">لو لم يرتفع الضغط: مقويات (Inotropes)</text>
<text x="460.0" y="334.0" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">تجنّب نيترات ومورفين</text>
<rect x="20" y="208" width="260" height="140" rx="10" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
<text x="150.0" y="248.83333333333334" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">ملاحظات</text>
<text x="150.0" y="265.33333333333337" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">البطين الأيمن يعتمد على ملء الدم (Preload)</text>
<text x="150.0" y="281.83333333333337" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">النيترات تقلل الملء فتهبط الضغط</text>
<text x="150.0" y="298.33333333333337" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">حتى لو الضغط والنبض طبيعيان</text>
<text x="150.0" y="314.83333333333337" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">راقب هبوط الضغط والبطء في أي لحظة</text>
<text x="320" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">ارتفاع ST في الاشتقاقات السفلية قد يكون أيضاً تسلخ أبهر (Dissecting aneurysm): انتبه قبل أي مُذيب</text>
<text x="320" y="402" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">الاشتقاقات اليمنى تحتاج تسجيلاً خاصاً: ضع V4 في الجهة اليمنى (V4R)</text></svg>