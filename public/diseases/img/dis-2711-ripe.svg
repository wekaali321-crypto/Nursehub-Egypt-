<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 454" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="454" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أدوية السل الأربعة (RIPE) وتنبيهات التمريض</text><rect x="477.5" y="54" width="142.5" height="282.4" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="477.5" y="54" width="142.5" height="29" rx="10" fill="#ef4444"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">Rifampin</text><text x="612" y="99" text-anchor="start" font-size="12" fill="#0f172a">• طبيعي: لون</text><text x="612" y="115.8" text-anchor="start" font-size="12" fill="#0f172a">أحمر/برتقالي</text><text x="612" y="132.6" text-anchor="start" font-size="12" fill="#0f172a">بالدموع والبول</text><text x="612" y="149.39999999999998" text-anchor="start" font-size="12" fill="#0f172a">والعرق</text><text x="612" y="171.2" text-anchor="start" font-size="12" fill="#0f172a">• يلوّن العدسات:</text><text x="612" y="188" text-anchor="start" font-size="12" fill="#0f172a">نظارات بدل العدسات</text><text x="612" y="209.79999999999998" text-anchor="start" font-size="12" fill="#0f172a">• يُبطل الحبوب</text><text x="612" y="226.59999999999997" text-anchor="start" font-size="12" fill="#0f172a">الهرمونية: استعمل</text><text x="612" y="243.39999999999998" text-anchor="start" font-size="12" fill="#0f172a">وسيلة غير هرمونية</text><text x="612" y="260.2" text-anchor="start" font-size="12" fill="#0f172a">احتياطية</text><text x="612" y="282" text-anchor="start" font-size="12" fill="#0f172a">• راقب اليرقان</text><rect x="325" y="54" width="142.5" height="282.4" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.5"/><rect x="325" y="54" width="142.5" height="29" rx="10" fill="#6366f1"/><text x="459.5" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">Isoniazid (INH)</text><text x="459.5" y="99" text-anchor="start" font-size="12" fill="#0f172a">• الأكثر اختبارًا</text><text x="459.5" y="120.8" text-anchor="start" font-size="12" fill="#0f172a">• يتداخل مع</text><text x="459.5" y="137.6" text-anchor="start" font-size="12" fill="#0f172a">فيتامين B6: نقصه =</text><text x="459.5" y="154.39999999999998" text-anchor="start" font-size="12" fill="#0f172a">اعتلال أعصاب؛ يؤخذ</text><text x="459.5" y="171.2" text-anchor="start" font-size="12" fill="#0f172a">B6 25–50 مغ/يوم</text><text x="459.5" y="193" text-anchor="start" font-size="12" fill="#0f172a">• أبلغ: تنميل وخدر</text><text x="459.5" y="209.8" text-anchor="start" font-size="12" fill="#0f172a">وترنح</text><text x="459.5" y="231.6" text-anchor="start" font-size="12" fill="#0f172a">• سمّية كبد:</text><text x="459.5" y="248.39999999999998" text-anchor="start" font-size="12" fill="#0f172a">يرقان، بول داكن،</text><text x="459.5" y="265.2" text-anchor="start" font-size="12" fill="#0f172a">تعب، ارتفاع</text><text x="459.5" y="282" text-anchor="start" font-size="12" fill="#0f172a">ALT/AST: أوقف</text><text x="459.5" y="298.79999999999995" text-anchor="start" font-size="12" fill="#0f172a">الدواء وأبلغ فورًا</text><text x="459.5" y="320.6" text-anchor="start" font-size="12" fill="#0f172a">• ممنوع الكحول</text><rect x="172.5" y="54" width="142.5" height="282.4" rx="10" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="1.5"/><rect x="172.5" y="54" width="142.5" height="29" rx="10" fill="#ec4899"/><text x="307" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">Ethambutol</text><text x="307" y="99" text-anchor="start" font-size="12" fill="#0f172a">• أبلغ: تشوش</text><text x="307" y="115.8" text-anchor="start" font-size="12" fill="#0f172a">الرؤية وتغير</text><text x="307" y="132.6" text-anchor="start" font-size="12" fill="#0f172a">الألوان</text><text x="307" y="154.4" text-anchor="start" font-size="12" fill="#0f172a">• فحص عيون أساسي</text><text x="307" y="171.2" text-anchor="start" font-size="12" fill="#0f172a">ودوري</text><rect x="20" y="54" width="142.5" height="282.4" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="20" y="54" width="142.5" height="29" rx="10" fill="#f59e0b"/><text x="154.5" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">Pyrazinamide</text><text x="154.5" y="99" text-anchor="start" font-size="12" fill="#0f172a">• نادرًا ما يُسأل</text><text x="154.5" y="115.8" text-anchor="start" font-size="12" fill="#0f172a">عنه</text><rect x="20" y="346.4" width="600" height="93" rx="10" fill="#0ea5e9" fill-opacity="0.13" stroke="#0ea5e9" stroke-width="1.5"/><text x="610" y="366.4" text-anchor="start" font-size="13.5" font-weight="800" fill="#0ea5e9">5 نقاط امتحان</text><text x="610" y="386.4" text-anchor="start" font-size="13" fill="#0f172a">كل أدوية السل سامة للكبد. نصائح: العلاج 6–12 شهرًا؛ قناع N95 للطاقم دائمًا؛</text><text x="610" y="405.4" text-anchor="start" font-size="13" fill="#0f172a">فحص الأسرة؛ عينات البلغم كل 2–4 أسابيع؛ 3 مزارع سلبية في 3 أيام مختلفة = لم</text><text x="610" y="424.4" text-anchor="start" font-size="13" fill="#0f172a">يعد معديًا.</text></svg>
