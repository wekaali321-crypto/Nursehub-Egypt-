<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="200" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قرحة المعدة مقابل الاثني عشر</text><rect x="324" y="48" width="296" height="132" rx="12" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1.5"/><rect x="324" y="48" width="296" height="34" rx="12" fill="#ef4444"/><text x="472" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المعدة (Gastric)</text><text x="472" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">ألم يزداد بالأكل بعد 30–60 دقيقة</text><text x="472" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">فقد وزن</text><text x="472" y="152" text-anchor="middle" font-size="12.5" fill="#0f172a">قيء دموي</text><rect x="20" y="48" width="296" height="132" rx="12" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/><rect x="20" y="48" width="296" height="34" rx="12" fill="#f59e0b"/><text x="168" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الاثني عشر (Duodenal)</text><text x="168" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">ألم يقل مع الأكل</text><text x="168" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">بعد 2–3 ساعات، ليلًا</text><text x="168" y="152" text-anchor="middle" font-size="12.5" fill="#0f172a">زيادة وزن وبراز أسود</text>
</svg>
