<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="394" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الخشونة (OA) واستبدال الركبة</text><rect x="330" y="52" width="300" height="163.79999999999998" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الخشونة</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تآكل تدريجي في الغضروف الواقي فاحتكاك</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  عظم بعظم</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• عوامل الخطر: سمنة، تدخين، إجهاد متكرر</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  على المفصل</text><text x="620" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• OA = ألم Ouch؛ RA = ألم Rude</text><text x="620" y="182.00000000000003" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• يصيب مفصلًا واحدًا (غالبًا كبيرًا)</text><text x="620" y="199.40000000000003" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• عقد هيبردن (Heberden) وبوشار (Bouchard)</text><rect x="10" y="52" width="310" height="111.6" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأعراض والدواء</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• طقطقة (Crepitus)</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الألم يزيد بالنشاط ويخف بالراحة (نقطة</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  امتحان)</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• NSAIDs، ستيرويدات (بريدنيزون)، جلوكوزامين</text><rect x="330" y="223.79999999999998" width="300" height="146.39999999999998" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M330,233.79999999999998 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#dc2626"/><text x="480.0" y="242.79999999999998" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">استبدال الركبة (TKA)</text><text x="620" y="266.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• جراحة شائعة لـ RA وOA</text><text x="620" y="284.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• لا تضع وسادة داعمة تحت الركبة المعمَلة</text><text x="620" y="301.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (نقطة امتحان)</text><text x="620" y="318.9999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• حمل الوزن مبكرًا وثني القدم كل ساعة</text><text x="620" y="336.39999999999986" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تعليم Kaplan: ثنّ القدم كل ساعة وأنت</text><text x="620" y="353.79999999999984" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  مستيقظ</text><rect x="10" y="223.79999999999998" width="310" height="94.19999999999999" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M10,233.79999999999998 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#16a34a"/><text x="165.0" y="242.79999999999998" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">منع الجلطات</text><text x="310" y="266.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• هيبارين ووارفارين لمنع الجلطات</text><text x="310" y="284.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• يبدآن معًا في المستشفى لأن الهيبارين سريع</text><text x="310" y="301.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  بينما وارفارين يحتاج أيامًا ليبدأ مفعوله</text></svg>