<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="388" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تفسير فحوصات التيفود</text><rect x="50" y="52" width="540" height="54" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="320" y="74" text-anchor="middle" font-size="15" font-weight="800" fill="#166534">مزرعة الدم (Blood culture)</text><text x="320" y="94" text-anchor="middle" font-size="12.5" fill="#166534">إيجابية في الأسبوع الأول: الأكثر دقة</text><text x="320" y="123" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="130" width="540" height="54" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="320" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#1e40af">صورة الدم (CBC)</text><text x="320" y="172" text-anchor="middle" font-size="12.5" fill="#1e40af">قلة كرات بيضاء نسبية (Relative leucopenia)</text><text x="320" y="201" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="208" width="540" height="54" rx="12" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="320" y="230" text-anchor="middle" font-size="15" font-weight="800" fill="#854d0e">اختبار Widal</text><text x="320" y="250" text-anchor="middle" font-size="12.5" fill="#854d0e">يظهر في الأسبوع الثاني والثالث: O مرتفع = عدوى نشطة • H مرتفع = عدوى سابقة أو تطعيم</text><text x="320" y="279" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="286" width="540" height="54" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/><text x="320" y="308" text-anchor="middle" font-size="15" font-weight="800" fill="#991b1b">تحذير</text><text x="320" y="328" text-anchor="middle" font-size="12.5" fill="#991b1b">Widal له نتائج إيجابية كاذبة وسلبية كاذبة: ما نعتمدش عليه وحده</text><text x="320" y="368" text-anchor="middle" font-size="12.5" fill="#475569">الأفضل مزرعة الدم/البراز، ولا تؤجل العلاج لو الأعراض شديدة</text></svg>