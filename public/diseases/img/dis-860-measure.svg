<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="380" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قياس القرحة: الطول × العرض × العمق + التقويض والأنفاق</text><rect x="332" y="46" width="300" height="320" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="482" y="72" text-anchor="middle" font-size="16" font-weight="800" fill="#0f766e">منظر علوي</text><path d="M430 170 C440 130 520 118 548 150 C575 182 545 240 495 250 C445 258 420 215 430 170Z" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/><path d="M455 180 C465 150 515 145 530 170 C545 195 520 225 490 228 C460 230 447 205 455 180Z" fill="#fef3c7"/><line x1="490" y1="108" x2="490" y2="262" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 3"/><line x1="410" y1="190" x2="566" y2="190" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="5 3"/><text x="490" y="98" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">الرأس (12)</text><text x="490" y="284" text-anchor="middle" font-size="13" font-weight="800" fill="#1d4ed8">القدم (6)</text><text x="600" y="184" text-anchor="middle" font-size="13" font-weight="800" fill="#15803d">العرض</text><text x="596" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">عمودي</text><text x="596" y="238" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">على الطول</text><text x="482" y="312" text-anchor="middle" font-size="13.5" font-weight="800" fill="#1d4ed8">الطول = أطول مسافة من الرأس للقدم</text><path d="M446 150 Q430 120 460 118" fill="none" stroke="#7c3aed" stroke-width="9" opacity=".35"/><text x="482" y="334" text-anchor="middle" font-size="13" font-weight="800" fill="#7c3aed">تقويض (الظل البنفسجي) من الساعة 10 للساعة 1</text><text x="482" y="354" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">سجّل الأنفاق بالساعة وبالسم</text><rect x="8" y="46" width="316" height="320" rx="12" fill="#fff" stroke="#cbd5e1"/><text x="166" y="72" text-anchor="middle" font-size="16" font-weight="800" fill="#0f766e">قطاع جانبي</text><rect x="24" y="130" width="284" height="12" fill="#e9c9a0"/><rect x="24" y="142" width="284" height="30" fill="#f9b4b4"/><rect x="24" y="172" width="284" height="50" fill="#fde68a"/><rect x="24" y="222" width="284" height="50" fill="#dc7a7a"/><polygon points="110,130 222,130 214,214 118,214" fill="#fff"/><path d="M118 214 L214 214" stroke="#dc2626" stroke-width="3"/><path d="M222 146 Q276 156 280 178 Q250 188 216 176Z" fill="#c4b5fd" opacity=".8"/><text x="262" y="206" text-anchor="middle" font-size="13" font-weight="800" fill="#6d28d9">تقويض</text><line x1="166" y1="96" x2="166" y2="214" stroke="#334155" stroke-width="2"/><rect x="161" y="96" width="10" height="24" rx="4" fill="#94a3b8"/><line x1="140" y1="130" x2="140" y2="214" stroke="#16a34a" stroke-width="2.5"/><polygon points="140,130 135,142 145,142" fill="#16a34a"/><polygon points="140,214 135,202 145,202" fill="#16a34a"/><text x="130" y="176" text-anchor="end" font-size="13" font-weight="800" fill="#15803d">العمق</text><text x="166" y="296" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">ضع عوداً معقماً بلا ضغط في أعمق نقطة</text><text x="166" y="316" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">وأمسك مستوى الجلد بإصبعك ثم قس</text><text x="166" y="340" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">قس التقويض بنفس العود جانبياً</text><text x="166" y="358" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">ولا تدفعه بقوة في الأنفاق</text></svg>