<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="380" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">خصية غير نازلة وفتحة بول غير طبيعية</text><rect x="330" y="50" width="290" height="100" rx="10" fill="#6366f1"/><text x="475.0" y="77.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الخصية المعلقة</text><text x="475.0" y="94.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">خصية لم تنزل للصفن قبل الولادة (شائع بالخدّج)</text><text x="475.0" y="111.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">ليست أولوية: معظمها ينزل تلقائيًا بعمر 6 أشهر</text><text x="475.0" y="128.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">إن لم تُصحَّح بعمر سنة: قد يحدث عقم؛ يُصحح جراحيًا</text><rect x="20" y="50" width="300" height="100" rx="10" fill="#0ea5e9"/><text x="170.0" y="85.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الإحليل الأعلى (Epispadias)</text><text x="170.0" y="103.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">فتحة البول بالسطح العلوي (الظهري) للقضيب</text><text x="170.0" y="121.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">عيب خلقي نادر</text><rect x="20" y="165" width="600" height="100" rx="10" fill="#f59e0b"/><text x="320.0" y="191.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">الإحليل السفلي (Hypospadias)</text><text x="320.0" y="209.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">فتحة البول بالسطح السفلي للقضيب · تصحيح جراحي قبل عمر 18 شهرًا</text><text x="320.0" y="227.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">بعد الجراحة: دعامة/قسطرة وتأخير الختان</text><text x="320.0" y="245.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">لا بول = أولوية! أبلغ الطبيب فورًا · تجنب حمام البانيو حتى إزالة الدعامة</text><rect x="20" y="280" width="600" height="80" rx="10" fill="#334155"/><text x="320.0" y="323.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لا ختان في الإحليل السفلي (يحتاج الجلد للإصلاح) · «الختان لن يُجرى قبل الخروج» = فهم صحيح</text></svg>