<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="388" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الارتباط بين العدوى والتهاب المفاصل التفاعلي</text><rect x="50" y="52" width="540" height="54" rx="12" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="320" y="74" text-anchor="middle" font-size="15" font-weight="800" fill="#854d0e">عدوى سابقة</text><text x="320" y="94" text-anchor="middle" font-size="12.5" fill="#854d0e">معوية (Salmonella, Shigella...) • بولية/تناسلية (Chlamydia) • صدرية</text><text x="320" y="123" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="130" width="540" height="54" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="320" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#1e40af">1 إلى 4 أسابيع بدون أعراض مفصلية</text><text x="320" y="172" text-anchor="middle" font-size="12.5" fill="#1e40af">الجسم يفرز استجابة مناعية</text><text x="320" y="201" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="208" width="540" height="54" rx="12" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="320" y="230" text-anchor="middle" font-size="15" font-weight="800" fill="#9a3412">التهاب مفصل تفاعلي</text><text x="320" y="250" text-anchor="middle" font-size="12.5" fill="#9a3412">غالباً مفاصل الساقين (ركبة، كاحل) • قد يصاحبه ألم عظمي ووتري</text><text x="320" y="279" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="286" width="540" height="54" rx="12" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.5"/><text x="320" y="308" text-anchor="middle" font-size="15" font-weight="800" fill="#5b21b6">أعراض مصاحبة محتملة</text><text x="320" y="328" text-anchor="middle" font-size="12.5" fill="#5b21b6">التهاب العين • التهاب مجرى البول • قرح فم • طفح</text><text x="320" y="368" text-anchor="middle" font-size="12.5" fill="#475569">الميكروب غالباً غير موجود داخل المفصل (السائل معقم)</text></svg>