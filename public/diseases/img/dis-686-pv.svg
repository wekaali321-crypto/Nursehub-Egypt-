<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">كثرة الحمر: الحقيقية والثانوية</text>
<rect x="20.0" y="48" width="295.0" height="110" rx="10" fill="#7c3aed"/>
<text x="167.5" y="88.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">حقيقية (Vera)</text>
<text x="167.5" y="107.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">زيادة RBC مع EPO منخفض</text>
<text x="167.5" y="126.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">سببها ورم نقوي</text>
<rect x="325.0" y="48" width="295.0" height="110" rx="10" fill="#0369a1"/>
<text x="472.5" y="88.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">ثانوية</text>
<text x="472.5" y="107.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">زيادة RBC بسبب نقص الأكسجين</text>
<text x="472.5" y="126.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">مثل أمراض رئة وارتفاعات</text>
<rect x="20.0" y="168" width="295.0" height="110" rx="10" fill="#b91c1c"/>
<text x="167.5" y="198.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">العلامات</text>
<text x="167.5" y="217.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ضغط مرتفع، كبد وطحال متضخمان</text>
<text x="167.5" y="236.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">صداع واضطراب رؤية</text>
<text x="167.5" y="255.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">قلب متضخم</text>
<rect x="325.0" y="168" width="295.0" height="110" rx="10" fill="#0f766e"/>
<text x="472.5" y="208.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الجلطات</text>
<text x="472.5" y="227.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">سكتة، احتشاء قلب</text>
<text x="472.5" y="246.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">صمة رئوية، DVT</text>
</svg>
