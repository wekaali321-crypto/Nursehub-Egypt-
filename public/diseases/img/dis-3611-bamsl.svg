<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 273" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="273" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أدوية الربو: موسعات وخافضات التهاب</text><rect x="326.0" y="48" width="294.0" height="96.5" rx="10" fill="#fff" stroke="#15803d" stroke-width="2"/><rect x="326.0" y="48" width="294.0" height="28" rx="10" fill="#15803d"/><text x="473.0" y="67" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">موسعات القصبات (BAM)</text><text x="610.0" y="96.5" text-anchor="start" font-size="12.5" fill="#0f172a">• B: بيتا 2 (albuterol)</text><text x="610.0" y="114.0" text-anchor="start" font-size="12.5" fill="#0f172a">• A: مضادات الكولين (ipratropium)</text><text x="610.0" y="131.5" text-anchor="start" font-size="12.5" fill="#0f172a">• M: methylxanthines (theophylline)</text><rect x="20.0" y="48" width="294.0" height="96.5" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><rect x="20.0" y="48" width="294.0" height="28" rx="10" fill="#b91c1c"/><text x="167.0" y="67" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">خافضات الالتهاب (SLM)</text><text x="304.0" y="96.5" text-anchor="start" font-size="12.5" fill="#0f172a">• S: ستيرويدات (beclomethasone)</text><text x="304.0" y="114.0" text-anchor="start" font-size="12.5" fill="#0f172a">• L: مثبطات leukotriene (montelukast)</text><text x="304.0" y="131.5" text-anchor="start" font-size="12.5" fill="#0f172a">• M: مثبتات الخلايا البدينة (cromolyn)</text><rect x="326.0" y="156.5" width="294.0" height="96.5" rx="10" fill="#fff" stroke="#1e3a8a" stroke-width="2"/><rect x="326.0" y="156.5" width="294.0" height="28" rx="10" fill="#1e3a8a"/><text x="473.0" y="175.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">هجمة الربو الحادة (AIM)</text><text x="610.0" y="205.0" text-anchor="start" font-size="12.5" fill="#0f172a">• A: albuterol أولًا</text><text x="610.0" y="222.5" text-anchor="start" font-size="12.5" fill="#0f172a">• I: ipratropium ثانيًا</text><text x="610.0" y="240.0" text-anchor="start" font-size="12.5" fill="#0f172a">• M: methylprednisolone ثالثًا</text><rect x="20.0" y="156.5" width="294.0" height="96.5" rx="10" fill="#fff" stroke="#b45309" stroke-width="2"/><rect x="20.0" y="156.5" width="294.0" height="28" rx="10" fill="#b45309"/><text x="167.0" y="175.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">لا تستعمل أول علامة هجمة</text><text x="304.0" y="205.0" text-anchor="start" font-size="12.5" fill="#0f172a">• fluticasone</text><text x="304.0" y="222.5" text-anchor="start" font-size="12.5" fill="#0f172a">• salmeterol (بطيئة)</text><text x="304.0" y="240.0" text-anchor="start" font-size="12.5" fill="#0f172a">• montelukast ليس إنقاذيًا</text></svg>