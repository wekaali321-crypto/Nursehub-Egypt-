<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">رينو مقابل بيرجر</text><rect x="324" y="48" width="296" height="132" rx="12" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-width="1.5"/><rect x="324" y="48" width="296" height="34" rx="12" fill="#8b5cf6"/><text x="472" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ظاهرة رينو</text><text x="472" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">تشنج أوعية الأصابع</text><text x="472" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">أبيض ثم أزرق ثم أحمر</text><text x="472" y="152" text-anchor="middle" font-size="12.5" fill="#0f172a">يتحفز بالبرد والتوتر</text><text x="472" y="176" text-anchor="middle" font-size="12.5" fill="#0f172a">عادة قابلة للتراجع</text><rect x="20" y="48" width="296" height="132" rx="12" fill="#0f172a" fill-opacity="0.12" stroke="#0f172a" stroke-width="1.5"/><rect x="20" y="48" width="296" height="34" rx="12" fill="#0f172a"/><text x="168" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">مرض بيرجر</text><text x="168" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">التهاب وانسداد أوعية</text><text x="168" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">سواد الأصابع والقدم</text><text x="168" y="152" text-anchor="middle" font-size="12.5" fill="#0f172a">ارتباط قوي بالتدخين</text><text x="168" y="176" text-anchor="middle" font-size="12.5" fill="#0f172a">خطر غرغرينا وبتر</text>
