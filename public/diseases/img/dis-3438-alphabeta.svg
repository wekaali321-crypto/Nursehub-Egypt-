<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" width="640" height="342" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="حاصرات ألفا/بيتا: Carvedilol وLabetalol"><rect width="640" height="342" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">حاصرات ألفا/بيتا: Carvedilol وLabetalol</text><rect x="326.0" y="46" width="302.0" height="80" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الآلية</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• تحجب مستقبلات ألفا وبيتا فيتسع الوعاء</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   الطرفي</text><rect x="12.0" y="46" width="302.0" height="116" rx="10" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#2e7d4f"/><rect x="12.0" y="60" width="302.0" height="14" fill="#2e7d4f"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الاستعمال</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• Carvedilol (Coreg): ضغط أساسي وفشل القلب</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   لإبطاء التطور</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• Labetalol (Trandate): ضغط وحده أو مع</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">   مدرّ</text><rect x="326.0" y="138" width="302.0" height="116" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="326.0" y="138" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="326.0" y="152" width="302.0" height="14" fill="#b42318"/><text x="477.0" y="157" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">موانع</text><text x="616.0" y="186" text-anchor="start" font-size="12.5" fill="#1d2939">• حساسية</text><text x="616.0" y="204" text-anchor="start" font-size="12.5" fill="#1d2939">• ربو قصبي</text><text x="616.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• فشل قلب غير معوّض</text><text x="616.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• بطء قلب شديد</text><rect x="12.0" y="174" width="302.0" height="152" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="12.0" y="174" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="12.0" y="188" width="302.0" height="14" fill="#a86a00"/><text x="163.0" y="193" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">تنبيه (قاعدة النبض)</text><text x="302.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• قبل الإعطاء خذ نبضًا قمّيًا وضغطًا</text><text x="302.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• احجب وأبلغ إذا: النبض أقل من 60، أو عدم</text><text x="302.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">   انتظام، أو الانقباضي أقل من 90</text><text x="302.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">• لا تتوقف فجأة</text><text x="302.0" y="294" text-anchor="start" font-size="12.5" fill="#1d2939">• أبلغ عن علامات فشل القلب: زيادة وزن، ضيق</text><text x="302.0" y="312" text-anchor="start" font-size="12.5" fill="#1d2939">   نفس، وذمة</text></svg>