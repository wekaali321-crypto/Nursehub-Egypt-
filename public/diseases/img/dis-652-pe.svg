<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 378" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="378" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الانسداد الرئوي: ملخص</text><rect x="326" y="56" width="298" height="166" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><rect x="326" y="56" width="298" height="30" rx="12" fill="#dc2626"/><text x="475" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الآلية</text><text x="614" y="108" text-anchor="start" font-size="13" fill="#7f1d1d">جلطة (غالبًا من DVT في الساق) تنتقل وتسد</text><text x="614" y="127" text-anchor="start" font-size="13" fill="#7f1d1d">شريانًا رئويًا فيتأثر التبادل: خلل</text><text x="614" y="146" text-anchor="start" font-size="13" fill="#7f1d1d">التهوية/التروية</text><rect x="16" y="56" width="298" height="166" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><rect x="16" y="56" width="298" height="30" rx="12" fill="#d97706"/><text x="165" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأعراض</text><text x="304" y="108" text-anchor="start" font-size="13" fill="#78350f">أول علامة: نقص أكسجة (قلق، هياج، تغير</text><text x="304" y="127" text-anchor="start" font-size="13" fill="#78350f">ذهني)</text><text x="304" y="146" text-anchor="start" font-size="13" fill="#78350f">ألم صدر، ضيق نفس، تسرع تنفس وقلب، قلق</text><text x="304" y="165" text-anchor="start" font-size="13" fill="#78350f">الشديد: ألم ساحق وهبوط ضغط وفقدان وعي</text><text x="304" y="184" text-anchor="start" font-size="13" fill="#78350f">قد يتقطع الألم أو يكون ثابتًا مع بصاق</text><text x="304" y="203" text-anchor="start" font-size="13" fill="#78350f">دموي</text><rect x="326" y="234" width="298" height="128" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><rect x="326" y="234" width="298" height="30" rx="12" fill="#7c3aed"/><text x="475" y="255" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">عوامل الخطر</text><text x="614" y="286" text-anchor="start" font-size="13" fill="#4c1d95">التدخين، السمنة، قلة الحركة، رجفان أذيني</text><text x="614" y="305" text-anchor="start" font-size="13" fill="#4c1d95">وأمراض الصمامات</text><text x="614" y="324" text-anchor="start" font-size="13" fill="#4c1d95">موانع حمل الإستروجين (الأكثر اختبارًا)</text><rect x="16" y="234" width="298" height="128" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><rect x="16" y="234" width="298" height="30" rx="12" fill="#16a34a"/><text x="165" y="255" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التشخيص والعلاج</text><text x="304" y="286" text-anchor="start" font-size="13" fill="#14532d">D-dimer مرتفع</text><text x="304" y="305" text-anchor="start" font-size="13" fill="#14532d">مضادات تخثر: heparin، warfarin</text><text x="304" y="324" text-anchor="start" font-size="13" fill="#14532d">مذيبات: tPA/alteplase، streptokinase</text><text x="304" y="343" text-anchor="start" font-size="13" fill="#14532d">جراحة: استئصال الصمة، فلتر الوريد الأجوف</text></svg>