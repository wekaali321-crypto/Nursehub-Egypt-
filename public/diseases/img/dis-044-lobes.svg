<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="300" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب فص رئوي والعلامات</text>
  <rect x="304" y="50" width="12" height="90" rx="6" fill="#38bdf8"/>
  <!-- right lung (viewer left): 3 lobes -->
  <g stroke="#334155" stroke-width="2">
    <path d="M300,110 Q250,100 200,130 Q170,170 180,230 Q220,260 300,250 Z" fill="#fbcfe8" opacity="0"/>
    <path d="M298,100 Q240,90 205,120 Q195,150 205,160 L298,160 Z" fill="#bfdbfe"/>
    <path d="M298,160 L205,160 Q190,195 205,210 L298,200 Z" fill="#bfdbfe"/>
    <path d="M298,200 L205,210 Q200,245 235,262 Q280,266 298,250 Z" fill="#dc2626" fill-opacity="0.75"/>
    <path d="M322,100 Q380,90 415,120 Q425,160 415,200 Q420,245 390,262 Q340,266 322,250 Z" fill="#bfdbfe"/>
    <path d="M322,175 L415,185" stroke="#334155"/>
  </g>
  <text x="250" y="150" text-anchor="middle" font-size="12" fill="#1e3a8a">علوي</text>
  <text x="250" y="192" text-anchor="middle" font-size="12" fill="#1e3a8a">أوسط</text>
  <text x="250" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">سفلي ملتهب</text>
  <text x="365" y="150" text-anchor="middle" font-size="12" fill="#1e3a8a">الرئة اليسرى سليمة</text>
  <g font-size="13" font-weight="700">
    <rect x="450" y="70" width="170" height="190" rx="12" fill="#fff" stroke="#e2e8f0"/>
    <text x="535" y="96" text-anchor="middle" fill="#b91c1c">علامات الفص الملتهب</text>
    <g font-weight="400" font-size="12" fill="#0f172a" text-anchor="middle">
      <text x="535" y="124">خرخرة (Crepitations)</text>
      <text x="535" y="152">نقص دخول الهواء</text>
      <text x="535" y="180">كتمة بالقرع (Dullness)</text>
      <text x="535" y="208">حرارة + بلغم صديدي</text>
      <text x="535" y="236">ألم جنبي ± نفث دم</text>
    </g>
  </g>
  <line x1="298" y1="235" x2="450" y2="215" stroke="#dc2626" stroke-dasharray="4 3"/>
  <text x="100" y="270" text-anchor="middle" font-size="12" fill="#475569">رسم توضيحي (الموضع مثال)</text>
</svg>
