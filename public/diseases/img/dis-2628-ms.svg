<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="400" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التصلب المتعدد MS</text><rect x="330" y="46" width="290" height="56" rx="10" fill="#7c3aed"/><text x="475.0" y="69.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">مناعة ذاتية تهاجم غمد المايلين</text><text x="475.0" y="85.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">انتشار أكثر لدى الإناث، نقص فيتامين D والعدوى</text><rect x="20" y="46" width="300" height="56" rx="10" fill="#0891b2"/><text x="170.0" y="69.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">MRI: لويحات متصلبة 3-4 مم</text><text x="170.0" y="85.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">CSF: غاما غلوبيولين مرتفع</text><rect x="20" y="112" width="600" height="64" rx="10" fill="#fee2e2"/><text x="320.0" y="131.2" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">أعراض: تشنج عضلي (Spasticity) ونوبات</text><text x="320.0" y="148.2" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">رنح، احتباس بول، فرط المنعكسات، ضعف التركيز</text><text x="320.0" y="165.2" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">إرهاق وشلل، ازدواج الرؤية أو ضبابية</text><rect x="20" y="186" width="300" height="70" rx="10" fill="#fef3c7"/><text x="170.0" y="216.85" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">تجنب (4 S)</text><text x="170.0" y="232.85" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">ضغط/جهد، مرض، تدخين، حرارة (سونا/ماء ساخن)</text><rect x="330" y="186" width="290" height="70" rx="10" fill="#dcfce7"/><text x="475.0" y="208.85" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">تثقيف</text><text x="475.0" y="224.85" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">تمرين توازن مع راحة</text><text x="475.0" y="240.85" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">رعاية ذاتية، تدريب مشي: عصا ثم مشاية ثم كرسي</text><rect x="20" y="266" width="600" height="60" rx="10" fill="#e0f2fe"/><text x="320.0" y="291.85" text-anchor="middle" font-size="11" font-weight="700" fill="#0c4a6e">أدوية: IVIG، Interferon، Prednisone، Baclofen (مرخي)</text><text x="320.0" y="307.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0c4a6e">Cyclosporine مثبط مناعة: أبلغ عن عدوى ونزف ولا يُعطى للحامل</text><rect x="20" y="336" width="600" height="52" rx="10" fill="#fee2e2"/><text x="320.0" y="365.85" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">يتطلب تدخلًا فورًا: تجهيز المريض لحمام بماء ساخن • الراحة في جو مكيف لتجنب الإرهاق</text></svg>