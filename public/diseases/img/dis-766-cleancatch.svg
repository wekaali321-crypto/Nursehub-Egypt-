<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 418" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="418" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">عينة بول منتصف التيار (Clean catch)</text><rect x="40" y="48" width="560" height="50" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><circle cx="576" cy="73" r="14" fill="#2563eb"/><text x="576" y="78" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="552" y="69" text-anchor="end" font-size="14" font-weight="800" fill="#2563eb">اغسل الإيدين</text><text x="552" y="87" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">اغسل يديك بالماء والصابون، وافتح العبوة المعقمة بدون لمس الداخل</text><text x="320" y="114" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="120" width="560" height="50" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.8"/><circle cx="576" cy="145" r="14" fill="#16a34a"/><text x="576" y="150" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="552" y="141" text-anchor="end" font-size="14" font-weight="800" fill="#16a34a">نظّف المنطقة</text><text x="552" y="159" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">نظّف فتحة الإحليل (والشفرات عند السيدات) بمسحة معقمة من الأمام للخلف</text><text x="320" y="186" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="192" width="560" height="50" rx="12" fill="#fff" stroke="#ca8a04" stroke-width="1.8"/><circle cx="576" cy="217" r="14" fill="#ca8a04"/><text x="576" y="222" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="552" y="213" text-anchor="end" font-size="14" font-weight="800" fill="#ca8a04">ابدأ التبول</text><text x="552" y="231" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">ابدأ في التواليت وتجاهل أول جزء من البول</text><text x="320" y="258" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="264" width="560" height="66" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.8"/><circle cx="576" cy="297" r="14" fill="#ea580c"/><text x="576" y="302" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="552" y="285" text-anchor="end" font-size="14" font-weight="800" fill="#ea580c">اجمع المنتصف</text><text x="552" y="303" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">بدون إيقاف التيار ضع العبوة. أوقف السحب لما تكون أكتر من نصف العبوة،</text><text x="552" y="319" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">وكمّل في التواليت</text><text x="320" y="346" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="352" width="560" height="50" rx="12" fill="#fff" stroke="#dc2626" stroke-width="1.8"/><circle cx="576" cy="377" r="14" fill="#dc2626"/><text x="576" y="382" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text><text x="552" y="373" text-anchor="end" font-size="14" font-weight="800" fill="#dc2626">اقفل وأرسل</text><text x="552" y="391" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">اقفل بإحكام، اكتب البيانات، أرسل للمعمل فوراً أو احفظه مبرداً</text></svg>