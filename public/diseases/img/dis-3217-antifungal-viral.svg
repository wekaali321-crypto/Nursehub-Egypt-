<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="352" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">مضادات الفطريات والفيروسات: خلاصة سريعة</text><rect x="325.0" y="44" width="299.0" height="141" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><path d="M325.0 54a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#0f766e"/><text x="474.5" y="66" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">مجموعة azole</text><text x="474.5" y="94" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">fluconazole وketoconazole</text><text x="474.5" y="110.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">لفطريات المبيضات والأظافر</text><text x="474.5" y="127" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تُؤخذ 2–6 أسابيع</text><text x="474.5" y="143.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">سامة للكبد كمعظم مضادات الفطريات</text><text x="474.5" y="160" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">لا تعالج C. difficile (ذاك</text><text direction="ltr" x="474.5" y="176.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">metronidazole)</text><rect x="16.0" y="44" width="299.0" height="141" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.5"/><path d="M16.0 54a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#be123c"/><text x="165.5" y="66" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">Amphotericin B</text><text x="165.5" y="94" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">لفطريات خطيرة جدًا</text><text x="165.5" y="110.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">آثار جانبية كثيرة</text><text x="165.5" y="127" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">سمّية كلوية: كرياتينين أعلى من 1.3،</text><text x="165.5" y="143.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">بول 30 مل/س أو أقل</text><rect x="325.0" y="195" width="299.0" height="141" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.5"/><path d="M325.0 205a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#b45309"/><text x="474.5" y="217" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">Nystatin</text><text x="474.5" y="245" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">مبيضات الفم والمعدة والجلد والمهبل</text><text x="474.5" y="261.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">رجّ المعلّق جيدًا</text><text x="474.5" y="278" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">افحص الغشاء المخاطي</text><text x="474.5" y="294.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">انقع طقم الأسنان</text><text x="474.5" y="311" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">اشطف عدة دقائق ثم ابلع، واستمر بعد</text><text x="474.5" y="327.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">زوال الأعراض</text><rect x="16.0" y="195" width="299.0" height="141" rx="10" fill="#fff" stroke="#1e3a8a" stroke-width="1.5"/><path d="M16.0 205a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#1e3a8a"/><text x="165.5" y="217" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">مجموعة cyclovir</text><text x="165.5" y="245" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">acyclovir وvalacyclovir</text><text x="165.5" y="261.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">هربس تناسلي/شفوي وحزام ناري</text><text x="165.5" y="278" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">لا يشفي، يبطئ الفيروس</text><text x="165.5" y="294.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">شرب سوائل إضافية</text><text x="165.5" y="311" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">لا علاقة جنسية مع وجود آفات</text></svg>