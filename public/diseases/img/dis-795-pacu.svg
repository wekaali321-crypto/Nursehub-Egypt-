<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="490" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">تقييم الإفاقة (PACU) بالترتيب</text><rect x="40" y="48" width="560" height="50" rx="12" fill="#fff" stroke="#dc2626" stroke-width="1.8"/><circle cx="576" cy="73" r="14" fill="#dc2626"/><text x="576" y="78" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="552" y="69" text-anchor="start" font-size="14" font-weight="800" fill="#dc2626">A — المجرى الهوائي</text><text x="552" y="87" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">استبعد الصرير والانسداد؛ شفط؛ ارفع الفك لو انسداد لسان</text><text x="320" y="114" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="120" width="560" height="50" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.8"/><circle cx="576" cy="145" r="14" fill="#ea580c"/><text x="576" y="150" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="552" y="141" text-anchor="start" font-size="14" font-weight="800" fill="#ea580c">B — التنفس</text><text x="552" y="159" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">معدل وعمق وتأكسج النبض وأصوات التنفس واستخدام عضلات إضافية؛ أكسجين</text><text x="320" y="186" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="192" width="560" height="66" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><circle cx="576" cy="225" r="14" fill="#2563eb"/><text x="576" y="230" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="552" y="213" text-anchor="start" font-size="14" font-weight="800" fill="#2563eb">C — الدورة</text><text x="552" y="231" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">نبض وضغط ونظم ومونيتور كل 15 دقيقة حتى الاستقرار؛ الجرح والمصارف</text><text x="552" y="247" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">والنزف</text><text x="320" y="274" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="280" width="560" height="50" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.8"/><circle cx="576" cy="305" r="14" fill="#16a34a"/><text x="576" y="310" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="552" y="301" text-anchor="start" font-size="14" font-weight="800" fill="#16a34a">الوعي والألم</text><text x="552" y="319" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">عودة الوعي المتوقعة؛ حدقة؛ استجابة للأمر؛ ألم بالمقياس</text><text x="320" y="346" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="352" width="560" height="50" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><circle cx="576" cy="377" r="14" fill="#7c3aed"/><text x="576" y="382" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text><text x="552" y="373" text-anchor="start" font-size="14" font-weight="800" fill="#7c3aed">غثيان/بطن/مختبر</text><text x="552" y="391" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">قيء، انتفاخ، أصوات أمعاء، Hb، أملاح، ABG عند الحاجة</text><text x="320" y="418" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="424" width="560" height="50" rx="12" fill="#fff" stroke="#475569" stroke-width="1.8"/><circle cx="576" cy="449" r="14" fill="#475569"/><text x="576" y="454" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">6</text><text x="552" y="445" text-anchor="start" font-size="14" font-weight="800" fill="#475569">جاهز للانتقال؟</text><text x="552" y="463" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">استقرار + ألم مسيطر + بول + وعي = إلى الجناح/العناية حسب الحالة</text></svg>