<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="430" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">SVT: ترتيب العلاج + الصدمة المتزامنة وغير المتزامنة</text><rect x="440" y="45" width="185" height="70" rx="10" fill="#dbeafe"/><text x="532.5" y="67" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">1: مناورة المبهم</text><text x="532.5" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">الأولى قبل adenosine</text><text x="532.5" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">(الضغط كما في التبرّز)</text><rect x="230" y="45" width="185" height="70" rx="10" fill="#dcfce7"/><text x="322.5" y="67" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">2: adenosine</text><text x="322.5" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">دفعة وريدية سريعة</text><text x="322.5" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">خلال 1–2 ثانية + غسيل</text><rect x="15" y="45" width="185" height="70" rx="10" fill="#fee2e2"/><text x="107.5" y="67" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">3: صدمة متزامنة</text><text x="107.5" y="85" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Synchronized</text><text x="107.5" y="103" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">إذا بقي SVT</text><line x1="440" y1="80" x2="415" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><line x1="230" y1="80" x2="200" y2="80" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="330" y="140" width="295" height="130" rx="10" fill="#ffedd5"/><text x="477.5" y="174" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">Cardioversion (C)</text><text x="477.5" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">C: Cardioversion، Count: يوجد نبض</text><text x="477.5" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">C: Controlled rhythms</text><text x="477.5" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Synchronized + تخدير</text><text x="477.5" y="246" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">للإيقاع المنظم مع وجود نبض</text><rect x="15" y="140" width="295" height="130" rx="10" fill="#ede9fe"/><text x="162.5" y="183" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">Defibrillation (D)</text><text x="162.5" y="201" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">D: لا يوجد نبض (Don’t have pulse)</text><text x="162.5" y="219" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">D: إيقاعات قاتلة VFib وVTach بلا نبض</text><text x="162.5" y="237" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">D: لا تضغط Sync (shock away)</text><text x="320" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">لا تُجرِ صدمة متزامنة على مريض بلا نبض، ولا غير متزامنة على مريض بنبض</text><text x="320" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">SVT = تسارع فوق بطيني (حوالي 150 نبضة/دقيقة وأكثر)</text></svg>