<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="250" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أدوية الخروج بعد الاحتشاء</text>
<rect x="14" y="44" width="612" height="190" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><rect x="14" y="44" width="612" height="26" rx="10" fill="#2563eb"/><text x="320.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >أدوية الخروج بعد الاحتشاء</text><text x="616" y="89" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >خط أول: مثبط ACE (-pril) مثل ليزينوبريل؛ بديل: ARBs (-sartan) مثل لوزارتان</text><text x="616" y="108.5" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >تجنب الحمل، وذمة وعائية (خطر مجرى هواء)، سعال (ACE فقط)، تابع الكرياتينين (0.9–1.2) والبوتاسيوم</text><text x="616" y="125.0" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >  (3.5–5.0)</text><text x="616" y="144.5" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >تجنب بدائل الملح، وراقب: ضعف عضلات، تقلصات، قمم T عالية</text><text x="616" y="164.0" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >مضادات الصفائح: أسبرين وكلوبيدوجريل؛ أوقفها وأبلغ عند صفائح أقل من 50 ألف</text><text x="616" y="183.5" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >ستاتين: لا جريب فروت، أبلغ عن براز طيني وألم عضلي (انحلال)، ويؤخذ ليلاً</text>
</svg>
