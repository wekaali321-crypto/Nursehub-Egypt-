<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="220" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أديسون مقابل كوشينج</text><rect x="324" y="48" width="296" height="152" rx="12" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-width="1.5"/><rect x="324" y="48" width="296" height="34" rx="12" fill="#0ea5e9"/><text x="472" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">أديسون (نقص الستيرويد)</text><text x="472" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">ضغط وسكر وصوديوم منخفض</text><text x="472" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">بوتاسيوم أكثر من 5.0</text><text x="472" y="152" text-anchor="middle" font-size="12.5" fill="#0f172a">تسمّر الجلد (برونزي)</text><text x="472" y="176" text-anchor="middle" font-size="12.5" fill="#0f172a">فقد وزن، تعب، حنين للملح</text><rect x="20" y="48" width="296" height="152" rx="12" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1.5"/><rect x="20" y="48" width="296" height="34" rx="12" fill="#ef4444"/><text x="168" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">كوشينج (زيادة الستيرويد)</text><text x="168" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">ضغط وسكر ووزن مرتفع</text><text x="168" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">سمنة جذعية ووجه قمري وسنام</text><text x="168" y="152" text-anchor="middle" font-size="12.5" fill="#0f172a">أشعار زائدة، خطوط بنفسجية</text><text x="168" y="176" text-anchor="middle" font-size="12.5" fill="#0f172a">هشاشة عظام وعدوى</text>
</svg>
