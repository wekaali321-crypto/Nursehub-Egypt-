<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="310" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >مسارا الإيقاف القلبي</text><rect x="20" y="50" width="600" height="50" rx="10" fill="#e2e8f0"/><text x="320" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" >لا استجابة + لا نبض: ابدأ CPR، وصّل الجهاز، فحص الإيقاع</text><rect x="20" y="125" width="290" height="130" rx="10" fill="#fee2e2"/><text x="165" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d" >قابل للصدمة: VF / VT</text><text x="165" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d" >صدمة كهربائية فورية</text><text x="165" y="198" text-anchor="middle" font-size="12" font-weight="500" fill="#7f1d1d" >CPR دقيقتين ثم أعد التقييم</text><text x="165" y="220" text-anchor="middle" font-size="12" font-weight="500" fill="#7f1d1d" >إبينفرين 1 مجم بعد الصدمة الثانية</text><text x="165" y="242" text-anchor="middle" font-size="12" font-weight="500" fill="#7f1d1d" >أميودارون بعد الثالثة</text><rect x="330" y="125" width="290" height="130" rx="10" fill="#e0f2fe"/><text x="475" y="150" text-anchor="middle" font-size="15" font-weight="800" fill="#075985" >غير قابل للصدمة: Asystole / PEA</text><text x="475" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#075985" >CPR فوراً بلا صدمة</text><text x="475" y="198" text-anchor="middle" font-size="12" font-weight="500" fill="#075985" >إبينفرين 1 مجم بأقرب وقت</text><text x="475" y="220" text-anchor="middle" font-size="12" font-weight="500" fill="#075985" >ابحث عن 5H &amp; 5T</text><text x="475" y="242" text-anchor="middle" font-size="12" font-weight="500" fill="#075985" >CPR دقيقتين ثم أعد التقييم</text><text x="320" y="285" text-anchor="middle" font-size="11" font-weight="400" fill="#94a3b8" >حسب ACLS — البروتوكول المحلي للمستشفى هو المعتمد</text></svg>