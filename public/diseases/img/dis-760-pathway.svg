<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="450" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">مسار التهاب الكبيبات الحاد بعد العدوى</text><rect x="40" y="48" width="560" height="66" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.8"/><circle cx="576" cy="81" r="14" fill="#ea580c"/><text x="576" y="86" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="552" y="69" text-anchor="end" font-size="14" font-weight="800" fill="#ea580c">عدوى سابقة</text><text x="552" y="87" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">التهاب حلق بالمكورات السبحية (من 1 إلى 3 أسابيع) أو عدوى جلد (3 إلى 6</text><text x="552" y="103" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">أسابيع) أو فيروسات أو أمراض مناعية</text><text x="320" y="130" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="136" width="560" height="66" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><circle cx="576" cy="169" r="14" fill="#7c3aed"/><text x="576" y="174" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="552" y="157" text-anchor="end" font-size="14" font-weight="800" fill="#7c3aed">مركبات مناعية</text><text x="552" y="175" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">مركبات مناعية (Immune complexes) تترسب في الكبيبات وتشغّل الالتهاب</text><text x="552" y="191" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">وتنشط المتمم (انخفاض C3)</text><text x="320" y="218" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="224" width="560" height="50" rx="12" fill="#fff" stroke="#dc2626" stroke-width="1.8"/><circle cx="576" cy="249" r="14" fill="#dc2626"/><text x="576" y="254" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="552" y="245" text-anchor="end" font-size="14" font-weight="800" fill="#dc2626">ضرر الكبيبة</text><text x="552" y="263" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">تسرب كرات دم حمراء وبروتين، ونقص معدل الترشيح (GFR)</text><text x="320" y="290" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="296" width="560" height="50" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><circle cx="576" cy="321" r="14" fill="#2563eb"/><text x="576" y="326" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="552" y="317" text-anchor="end" font-size="14" font-weight="800" fill="#2563eb">احتباس ماء وملح</text><text x="552" y="335" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">قلة بول (Oliguria) + ورم + ارتفاع ضغط + زيادة اليوريا والكرياتينين</text><text x="320" y="362" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="368" width="560" height="66" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.8"/><circle cx="576" cy="401" r="14" fill="#16a34a"/><text x="576" y="406" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text><text x="552" y="389" text-anchor="end" font-size="14" font-weight="800" fill="#16a34a">الشفاء أو المضاعفات</text><text x="552" y="407" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">غالباً شفاء كامل عند الأطفال، وقد يحدث فشل كلوي أو فشل قلب أو اعتلال</text><text x="552" y="423" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">مخي بالضغط</text></svg>