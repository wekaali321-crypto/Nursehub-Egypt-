<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 395" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="395" rx="16" fill="#f8fafc"/><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">التهاب الزائدة: التقييم والتصرف في الاستقبال</text><rect x="40" y="45" width="560" height="52" rx="12" fill="#dc2626"/><text x="320" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">ألم حول السرة ثم أسفل يمين البطن + قيء + فقدان شهية</text><line x1="320" y1="97" x2="320" y2="111" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/><rect x="40" y="113" width="560" height="52" rx="12" fill="#f97316"/><text x="320" y="144" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">فحص McBurney + ألم ارتداد + علامة Psoas</text><line x1="320" y1="165" x2="320" y2="179" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/><rect x="40" y="181" width="560" height="52" rx="12" fill="#eab308"/><text x="320" y="212" text-anchor="middle" font-size="14" font-weight="700" fill="#422006">CBC + تحليل بول + سونار حوض وبطن (وتحليل حمل للسيدات)</text><line x1="320" y1="233" x2="320" y2="247" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/><rect x="40" y="249" width="560" height="52" rx="12" fill="#0ea5e9"/><text x="320" y="280" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Alvarado: أقل من 4 ضعيف / 4-6 ملاحظة / أكثر من 6 استشارة جراحة</text><line x1="320" y1="301" x2="320" y2="315" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/><rect x="40" y="317" width="560" height="52" rx="12" fill="#16a34a"/><text x="320" y="348" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">لا مسكن ولا مضاد تشنج قبل التشخيص + نائب الجراحة</text></svg>
