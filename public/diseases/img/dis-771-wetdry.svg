<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 512" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="512" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">غيار الجرح المبلل ثم الجاف والتنضير</text>
<rect x="20" y="44" width="600" height="90" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="600" y="68" text-anchor="start" font-size="13" font-weight="800" fill="#0f172a">1 الإزالة</text><text x="600" y="92" text-anchor="start" font-size="12" font-weight="500" fill="#0f172a">نظافة اليدين، قفازات، نزع اللاصق، ترطيب الغيار الملتصق بماء دافئ، قياس الجرح</text><text x="600" y="108" text-anchor="start" font-size="12" font-weight="500" fill="#0f172a">وتوثيق الأنفاق</text><rect x="20" y="144" width="600" height="90" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/><text x="600" y="168" text-anchor="start" font-size="13" font-weight="800" fill="#0f172a">2 التنظيف والري</text><text x="600" y="192" text-anchor="start" font-size="12" font-weight="500" fill="#0f172a">قفازات جديدة، شاش معقم وماء دافئ وصابون من الأعلى للأسفل، ري، مراقبة الاحمرار</text><text x="600" y="208" text-anchor="start" font-size="12" font-weight="500" fill="#0f172a">والرائحة والإفراز</text><rect x="20" y="244" width="600" height="90" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="600" y="268" text-anchor="start" font-size="13" font-weight="800" fill="#0f172a">3 الغيار الجديد</text><text x="600" y="292" text-anchor="start" font-size="12" font-weight="500" fill="#0f172a">ملح معقم، عصر الشاش، كريم حاجز، ملء الجرح، غيار جاف كبير، تاريخ وتوقيع</text><rect x="20" y="350" width="600" height="150" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="320" y="372" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">أنواع التنضير</text><text x="600" y="388" text-anchor="start" font-size="12" font-weight="800" fill="#0f172a">ميكانيكي</text><text x="480" y="388" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">مائي أو إسفنج أو مبلل-جاف</text><text x="600" y="410" text-anchor="start" font-size="12" font-weight="800" fill="#0f172a">إنزيمي</text><text x="480" y="410" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">مرهم إنزيمي مثل collagenase</text><text x="600" y="432" text-anchor="start" font-size="12" font-weight="800" fill="#0f172a">جراحي</text><text x="480" y="432" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">استئصال في غرفة عمليات</text><text x="600" y="454" text-anchor="start" font-size="12" font-weight="800" fill="#0f172a">شرائحي</text><text x="480" y="454" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">طبقات رقيقة حتى النزف</text><text x="600" y="476" text-anchor="start" font-size="12" font-weight="800" fill="#0f172a">لفافي</text><text x="480" y="476" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">حتى اللفافة السطحية: حروق عميقة</text>
</svg>
