<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 517" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="517" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الغسيل البريتوني: مبدأ وخطوات</text><rect x="20" y="54" width="600" height="53" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><circle cx="590" cy="76" r="14" fill="#0d9488"/><text x="590" y="81" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="566" y="80" text-anchor="start" font-size="15" font-weight="800" fill="#134e4a">المبدأ</text><text x="566" y="100" text-anchor="start" font-size="13" fill="#134e4a">تملأ التجويف البريتوني بمحلول عالي التوتر يسحب المذابات.</text><text x="320" y="123" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="129" width="600" height="53" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><circle cx="590" cy="151" r="14" fill="#0d9488"/><text x="590" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="566" y="155" text-anchor="start" font-size="15" font-weight="800" fill="#134e4a">قبل البدء</text><text x="566" y="175" text-anchor="start" font-size="13" fill="#134e4a">1) وزن المريض 2) تدفئة المحلول.</text><text x="320" y="198" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="204" width="600" height="53" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><circle cx="590" cy="226" r="14" fill="#0d9488"/><text x="590" y="231" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="566" y="230" text-anchor="start" font-size="15" font-weight="800" fill="#134e4a">الأولوية</text><text x="566" y="250" text-anchor="start" font-size="13" fill="#134e4a">التعقيم الصارم (خطر العدوى).</text><text x="320" y="273" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="279" width="600" height="53" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><circle cx="590" cy="301" r="14" fill="#0d9488"/><text x="590" y="306" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="566" y="305" text-anchor="start" font-size="15" font-weight="800" fill="#134e4a">التهاب البريتون</text><text x="566" y="325" text-anchor="start" font-size="13" fill="#134e4a">حمى، تسرع قلب، تصريف عكر → بلّغ الطبيب.</text><text x="320" y="348" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="354" width="600" height="53" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><circle cx="590" cy="376" r="14" fill="#0d9488"/><text x="590" y="381" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text><text x="566" y="380" text-anchor="start" font-size="15" font-weight="800" fill="#134e4a">ضائقة تنفسية</text><text x="566" y="400" text-anchor="start" font-size="13" fill="#134e4a">خرخرة قاعدية، تنفس سريع، ضيق نفس: ارفع رأس السرير أولًا.</text><text x="320" y="423" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="429" width="600" height="72" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><circle cx="590" cy="451" r="14" fill="#0d9488"/><text x="590" y="456" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">6</text><text x="566" y="455" text-anchor="start" font-size="15" font-weight="800" fill="#134e4a">تصريف غير كافٍ</text><text x="566" y="475" text-anchor="start" font-size="13" fill="#134e4a">افحص انتفاخ البطن والإمساك، افحص الأنبوب (انحناء/انسداد)، غيّر الوضع</text><text x="566" y="494" text-anchor="start" font-size="13" fill="#134e4a">للجانب.</text></svg>