<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 496" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="496" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">DIC: نزف وجلطات في آن واحد</text><rect x="330" y="52" width="300" height="94.19999999999999" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#be123c"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الفكرة</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ليس مرضًا مستقلًا بل مضاعفة لمرض آخر</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تكوّن جلطات منتشرة تستهلك عوامل التجلط</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• فينزف المريض بلا وسيلة للإيقاف</text><rect x="10" y="52" width="310" height="111.6" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#0369a1"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأسباب</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• عدوى وإنتان</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• إصابات كبرى (Trauma)</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• صدمة، سرطان</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مضاعفات الولادة</text><rect x="330" y="171.6" width="300" height="111.6" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M330,181.6 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#dc2626"/><text x="480.0" y="190.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">نزف</text><text x="620" y="214.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• نمش وأرجوان على الجلد</text><text x="620" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• نزف العين واللثة والأنف (Epistaxis)</text><text x="620" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• دم في البول (Hematuria)</text><text x="620" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• براز أسود قطراني (Melena)</text><rect x="10" y="171.6" width="310" height="129.0" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M10,181.6 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#7c3aed"/><text x="165.0" y="190.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">جلطات</text><text x="310" y="214.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مخ: جلطة دماغية (ضعف شق، ثقل كلام، تدلي</text><text x="310" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  وجه)</text><text x="310" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قلب: ذبحة (ألم صدر وتعرق)</text><text x="310" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• رئة: انصمام (ضيق نفس)</text><text x="310" y="284.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ساق: DVT (تورم ساق واحدة)</text><rect x="330" y="308.6" width="300" height="94.19999999999999" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M330,318.6 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#16a34a"/><text x="480.0" y="327.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التحاليل</text><text x="620" y="351.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تطوّل PT وaPTT وINR</text><text x="620" y="369.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• انخفاض الصفائح (150–400 ألف)</text><text x="620" y="386.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ارتفاع D-dimer</text><rect x="10" y="308.6" width="310" height="163.79999999999998" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,318.6 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="327.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج والتثقيف</text><text x="310" y="351.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الأولوية: علاج السبب</text><text x="310" y="369.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• نقل: كرات حمراء، FFP، صفائح،</text><text x="310" y="386.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  كريوبريسيبيتات (فيبرينوجين)</text><text x="310" y="403.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• هيبارين لتقليل الجلطات</text><text x="310" y="421.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• لا تزيل الجلطات المتكونة</text><text x="310" y="438.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ماكينة كهربائية، فرشاة ناعمة، لا خيط</text><text x="310" y="455.9999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  أسنان</text></svg>