<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="300" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">حساب عدد أمبولات الحديد الوريدي</text>
  <rect x="20" y="45" width="600" height="70" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="320" y="75" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e" direction="ltr">N = [ (Wt × Hb deficit × 2.4) + 500 ] ÷ 100</text>
  <text x="320" y="100" text-anchor="middle" font-size="12" fill="#075985">عجز الهيموجلوبين = 12 − هيموجلوبين المريض الحالي</text>
  <text x="320" y="140" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">مثال: وزن 60 كجم، هيموجلوبين 9 جم%</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="20" y="155" width="190" height="50" rx="10" fill="#fef9c3"/><text x="115" y="176" fill="#422006">عجز Hb</text><text x="115" y="196" fill="#422006" direction="ltr">12 − 9 = 3</text>
    <rect x="225" y="155" width="190" height="50" rx="10" fill="#ffedd5"/><text x="320" y="176" fill="#7c2d12">الحديد اللازم (مجم)</text><text x="320" y="196" fill="#7c2d12" direction="ltr">60×3×2.4 + 500 = 932</text>
    <rect x="430" y="155" width="190" height="50" rx="10" fill="#dcfce7"/><text x="525" y="176" fill="#14532d">الأمبولات (100 مجم)</text><text x="525" y="196" fill="#14532d" direction="ltr">932 ÷ 100 ≈ 9</text>
  </g>
  <text x="320" y="240" text-anchor="middle" font-size="12" fill="#475569">الأمبول المعتاد من Iron sucrose = 100 مجم (راجع النشرة)</text>
  <text x="320" y="262" text-anchor="middle" font-size="12" fill="#475569">الجرعة الواحدة والزمن حسب المنتج وبروتوكول المستشفى</text>
</svg>
