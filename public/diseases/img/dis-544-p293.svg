<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 334" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="700" height="334" rx="16" fill="#f8fafc"/>
<text x="350.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">القدم السكرية: "العناية اليومية"</text>
<rect x="356.0" y="52" width="330.0" height="192.0" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="356.0" y="52" width="330.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="521.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الهدف: نظيفة، جافة، بلا إصابات</text>
<text x="676.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تجنب: شباشب إصبع، كعب عالٍ، نايلون</text>
<text x="676.0" y="115.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا إزالة مسامير/ثآليل بمنتجات بلا وصفة</text>
<text x="676.0" y="134.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا حرارة زائدة: حمام ساخن أو سخان</text>
<text x="676.0" y="153.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• احذر إصابات الأصابع: قص الأظافر بشكل مستقيم</text>
<rect x="14.0" y="52" width="330.0" height="192.0" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="14.0" y="52" width="330.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="179.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">كلمات مفتاحية للامتحان</text>
<text x="334.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• فحص يومي (لا أسبوعي)</text>
<text x="334.0" y="115.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• حذاء مناسب، لا صندل</text>
<text x="334.0" y="134.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• جوارب قطن ناعمة (لا نايلون)</text>
<text x="334.0" y="153.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قص أظافر مستقيم (لا منحنٍ)</text>
<text x="334.0" y="173.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أبلغ عن جروح لا تلتئم</text>
<text x="334.0" y="192.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا إزالة مسامير ولا بودرة ثقيلة (خفيفة فقط)</text>
<text x="334.0" y="211.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا دعك القدمين بعنف؛ الدفء مسموح لا الحرارة</text>
<text x="334.0" y="228.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الساخنة</text>
<rect x="14" y="262.0" width="672" height="50.5" rx="10" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-width="1.4"/>
<text x="674" y="282.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الجرعات للتعلّم، وتُراجع مع الطبيب/الصيدلي. القدم الحساسة لا تشعر بالإصابة لذلك الفحص اليومي والحذاء</text>
<text x="674" y="299.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الجيد وقص الأظافر المستقيم هي الأولوية.</text>
</svg>
