<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="394" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">التحكم الهرموني في السوائل والأملاح</text><rect x="40" y="48" width="560" height="66" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><circle cx="576" cy="81" r="14" fill="#2563eb"/><text x="576" y="86" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="552" y="69" text-anchor="end" font-size="14" font-weight="800" fill="#2563eb">الألدوستيرون (من قشرة الكظر)</text><text x="552" y="87" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">استجابة لتغير الصوديوم والرينين: تعيد الكلى امتصاص الصوديوم والماء</text><text x="552" y="103" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">وتطرح البوتاسيوم</text><text x="320" y="130" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="136" width="560" height="66" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><circle cx="576" cy="169" r="14" fill="#7c3aed"/><text x="576" y="174" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="552" y="157" text-anchor="end" font-size="14" font-weight="800" fill="#7c3aed">الرينين–أنجيوتنسين</text><text x="552" y="175" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">الرينين من الكلية ← أنجيوتنسينوجين → أنجيوتنسين I ← ACE بالرئة →</text><text x="552" y="191" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">أنجيوتنسين II: انقباض أوعية + تحفيز الألدوستيرون</text><text x="320" y="218" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="224" width="560" height="66" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.8"/><circle cx="576" cy="257" r="14" fill="#16a34a"/><text x="576" y="262" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="552" y="245" text-anchor="end" font-size="14" font-weight="800" fill="#16a34a">ADH (الهرمون المضاد لإدرار البول)</text><text x="552" y="263" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">يُصنع بالمخ ويُخزن بالفص الخلفي للنخامية؛ يزيد إعادة امتصاص الماء عند</text><text x="552" y="279" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">ارتفاع أسمولية الدم</text><text x="320" y="306" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="312" width="560" height="66" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.8"/><circle cx="576" cy="345" r="14" fill="#ea580c"/><text x="576" y="350" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="552" y="333" text-anchor="end" font-size="14" font-weight="800" fill="#ea580c">الببتيدات الناتريورية (ANP / BNP)</text><text x="552" y="351" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">ترتفع مع زيادة الحجم والضغط: تمنع امتصاص الصوديوم وتزيد الترشيح وإدرار</text><text x="552" y="367" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">البول</text></svg>