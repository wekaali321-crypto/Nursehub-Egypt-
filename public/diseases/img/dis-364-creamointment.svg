<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="310" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الكريم أم المرهم؟</text>
  <rect x="330" y="50" width="290" height="44" rx="10" fill="#0ea5e9"/>
  <text x="475" y="67.4" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الكريم (Cream)</text>
  <text x="475" y="86.4" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">50% زيت + 50% ماء</text>
  <rect x="20" y="50" width="290" height="44" rx="10" fill="#b45309"/>
  <text x="165" y="67.4" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">المرهم (Ointment)</text>
  <text x="165" y="86.4" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">80% زيت + 20% ماء</text>
  <rect x="330" y="104" width="290" height="34" rx="10" fill="#e0f2fe"/>
  <text x="475" y="125.55" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">يتشرّب بسرعة</text>
  <rect x="330" y="146" width="290" height="34" rx="10" fill="#e0f2fe"/>
  <text x="475" y="167.55" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">يعمل بسرعة وأثره أقل قوة</text>
  <rect x="330" y="188" width="290" height="34" rx="10" fill="#e0f2fe"/>
  <text x="475" y="209.55" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">أفضل للجلد الرطب أو العادي</text>
  <rect x="20" y="104" width="290" height="34" rx="10" fill="#fef3c7"/>
  <text x="165" y="125.55" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">يتشرّب ببطء</text>
  <rect x="20" y="146" width="290" height="34" rx="10" fill="#fef3c7"/>
  <text x="165" y="167.55" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">أثره أقوى وأطول</text>
  <rect x="20" y="188" width="290" height="34" rx="10" fill="#fef3c7"/>
  <text x="165" y="209.55" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">أفضل للجلد الجاف (دهون أكتر)</text>
  <rect x="40" y="238" width="560" height="34" rx="10" fill="#dcfce7"/>
  <text x="320" y="259.55" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">الجلد الرطب/المبلول: الكريم — الجلد الجاف المتشقق: المرهم</text>
  <text x="320" y="296" text-anchor="middle" font-size="12" fill="#64748b">المياه بتتبخر، وبيفضل على الجلد الزيت الحامل للدواء</text>
</svg>
