<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 307" width="640" height="307" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="307" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a" direction="rtl">فصوص المخ ووظائفها</text><rect x="514.7272727272727" y="50" width="111.27272727272727" height="31" fill="#0284c7" stroke="#cbd5e1"/><text x="618" y="72" text-anchor="end" direction="rtl" font-size="13.5" font-weight="700" fill="#fff">الفص</text><rect x="276.28571428571433" y="50" width="238.4415584415584" height="31" fill="#0284c7" stroke="#cbd5e1"/><text x="506.72727272727275" y="72" text-anchor="end" direction="rtl" font-size="13.5" font-weight="700" fill="#fff">الوظيفة</text><rect x="14.000000000000057" y="50" width="262.2857142857143" height="31" fill="#0284c7" stroke="#cbd5e1"/><text x="268.28571428571433" y="72" text-anchor="end" direction="rtl" font-size="13.5" font-weight="700" fill="#fff">عند تلفه</text><rect x="514.7272727272727" y="81" width="111.27272727272727" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="618" y="103" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">الجبهي</text><rect x="276.28571428571433" y="81" width="238.4415584415584" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="506.72727272727275" y="103" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">الحركة، الكلام (Broca)، السلوك</text><text x="506.72727272727275" y="122" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">والقرار</text><rect x="14.000000000000057" y="81" width="262.2857142857143" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="268.28571428571433" y="103" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">عدم القدرة على الكلام، تغيّر</text><text x="268.28571428571433" y="122" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">شخصية، فقدان الشم</text><rect x="514.7272727272727" y="131" width="111.27272727272727" height="31" fill="#f1f5f9" stroke="#cbd5e1"/><text x="618" y="153" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">الجداري</text><rect x="276.28571428571433" y="131" width="238.4415584415584" height="31" fill="#f1f5f9" stroke="#cbd5e1"/><text x="506.72727272727275" y="153" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">الإحساس واللمس والألم</text><rect x="14.000000000000057" y="131" width="262.2857142857143" height="31" fill="#f1f5f9" stroke="#cbd5e1"/><text x="268.28571428571433" y="153" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">فقدان الإحساس، مجال رؤية ناقص</text><rect x="514.7272727272727" y="162" width="111.27272727272727" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="618" y="184" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">الصدغي</text><rect x="276.28571428571433" y="162" width="238.4415584415584" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="506.72727272727275" y="184" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">السمع، فهم اللغة (Wernicke)،</text><text x="506.72727272727275" y="203" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">الذاكرة</text><rect x="14.000000000000057" y="162" width="262.2857142857143" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="268.28571428571433" y="184" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">هلاوس، تشنجات، فقدان فهم الكلام</text><rect x="514.7272727272727" y="212" width="111.27272727272727" height="50" fill="#f1f5f9" stroke="#cbd5e1"/><text x="618" y="234" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">القفوي</text><rect x="276.28571428571433" y="212" width="238.4415584415584" height="50" fill="#f1f5f9" stroke="#cbd5e1"/><text x="506.72727272727275" y="234" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">الرؤية</text><rect x="14.000000000000057" y="212" width="262.2857142857143" height="50" fill="#f1f5f9" stroke="#cbd5e1"/><text x="268.28571428571433" y="234" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">فقدان مجال رؤية، عدم التعرف على</text><text x="268.28571428571433" y="253" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">الوجوه</text><rect x="514.7272727272727" y="262" width="111.27272727272727" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="618" y="284" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">المخيخ</text><rect x="276.28571428571433" y="262" width="238.4415584415584" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="506.72727272727275" y="284" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">التوازن والتنسيق</text><rect x="14.000000000000057" y="262" width="262.2857142857143" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="268.28571428571433" y="284" text-anchor="end" direction="rtl" font-size="13.5" font-weight="400" fill="#0f172a">ترنح (Ataxia)</text></svg>