<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 217" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="217" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">علامات نقص الأكسجة</text><rect x="523" y="50" width="101" height="32" fill="#dc2626"/><text x="573" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المرحلة</text><rect x="16" y="50" width="507" height="32" fill="#dc2626"/><text x="269" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلامات</text><rect x="523" y="82" width="101" height="69" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="102" text-anchor="start" font-size="13" fill="#0f172a">مبكرة</text><rect x="16" y="82" width="507" height="69" fill="#ffffff" stroke="#cbd5e1"/><text x="515" y="102" text-anchor="start" font-size="13" fill="#0f172a">تغيّر ذهني: قلق وهياج وارتباك؛ تسرع تنفس (فوق 20) وتسرع قلب (فوق 100)</text><text x="515" y="121" text-anchor="start" font-size="13" fill="#0f172a">وضغط مرتفع (فوق 140)؛ استخدام عضلات التنفس المساعدة وتنفس تناقضي</text><text x="515" y="140" text-anchor="start" font-size="13" fill="#0f172a">ووضعية الحامل الثلاثي (Tripod)</text><rect x="523" y="151" width="101" height="50" fill="#fee2e2" stroke="#cbd5e1"/><text x="616" y="171" text-anchor="start" font-size="13" fill="#0f172a">متأخرة</text><rect x="16" y="151" width="507" height="50" fill="#fee2e2" stroke="#cbd5e1"/><text x="515" y="171" text-anchor="start" font-size="13" fill="#0f172a">بطء تنفس (أقل من 12) وبطء قلب (أقل من 60) وهبوط ضغط؛ زرقة؛ اضطراب نظم</text><text x="515" y="190" text-anchor="start" font-size="13" fill="#0f172a">القلب</text></svg>