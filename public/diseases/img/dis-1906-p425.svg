<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 476" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="476" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الفينيل كيتون يوريا (PKU)</text><rect x="30" y="54" width="580" height="40" rx="10" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="578" cy="74" r="14" fill="#0ea5e9"/><text x="578" y="79" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="554" y="79" text-anchor="start" font-size="13.5" fill="#0f172a">خلل وراثي متنحٍّ: يجب أن يكون الأبوان حاملين</text><text x="320" y="105" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="108" width="580" height="54" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.5"/><circle cx="578" cy="135" r="14" fill="#ef4444"/><text x="578" y="140" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="554" y="130" text-anchor="start" font-size="13.5" fill="#0f172a">غياب إنزيم phenylalanine hydroxylase فلا يتحول phenylalanine إلى</text><text x="554" y="149.575" text-anchor="start" font-size="13.5" fill="#0f172a">tyrosine</text><text x="320" y="173" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="176" width="580" height="40" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.5"/><circle cx="578" cy="196" r="14" fill="#f59e0b"/><text x="578" y="201" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="554" y="201" text-anchor="start" font-size="13.5" fill="#0f172a">تراكم phenylalanine يضر الدماغ نموًا وجنينًا ووليدًا</text><text x="320" y="227" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="230" width="580" height="40" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="1.5"/><circle cx="578" cy="250" r="14" fill="#10b981"/><text x="578" y="255" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="554" y="255" text-anchor="start" font-size="13.5" fill="#0f172a">الوقاية: حمية قليلة phenylalanine مدى الحياة، وحليب خاص للرضيع</text><rect x="426.66666666666663" y="280" width="193.33333333333334" height="181.39999999999998" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="426.66666666666663" y="280" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="612" y="298" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">تجنب</text><text x="612" y="325" text-anchor="start" font-size="13" fill="#0f172a">• اللحوم والأسماك والبيض</text><text x="612" y="348.2" text-anchor="start" font-size="13" fill="#0f172a">• الألبان</text><text x="612" y="371.4" text-anchor="start" font-size="13" fill="#0f172a">• زبدة الفول السوداني</text><text x="612" y="394.59999999999997" text-anchor="start" font-size="13" fill="#0f172a">• أطعمة بروتين عالٍ</text><rect x="223.33333333333331" y="280" width="193.33333333333334" height="181.39999999999998" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="223.33333333333331" y="280" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="408.66666666666663" y="298" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">مسموح/جيد</text><text x="408.66666666666663" y="325" text-anchor="start" font-size="13" fill="#0f172a">• الفواكه والخضر</text><text x="408.66666666666663" y="348.2" text-anchor="start" font-size="13" fill="#0f172a">• tyrosine مفيد</text><text x="408.66666666666663" y="371.4" text-anchor="start" font-size="13" fill="#0f172a">• تركيبة خاصة للرضيع</text><rect x="20" y="280" width="193.33333333333334" height="181.39999999999998" rx="10" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="1.5"/><rect x="20" y="280" width="193.33333333333334" height="29" rx="10" fill="#ec4899"/><text x="205.33333333333334" y="298" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الحمل</text><text x="205.33333333333334" y="325" text-anchor="start" font-size="13" fill="#0f172a">• استشارة وراثية قبل</text><text x="205.33333333333334" y="343.2" text-anchor="start" font-size="13" fill="#0f172a">الحمل (أولوية)</text><text x="205.33333333333334" y="366.4" text-anchor="start" font-size="13" fill="#0f172a">• تجنب البروتين العالي 3</text><text x="205.33333333333334" y="384.59999999999997" text-anchor="start" font-size="13" fill="#0f172a">أشهر على الأقل قبل الحمل</text><text x="205.33333333333334" y="407.79999999999995" text-anchor="start" font-size="13" fill="#0f172a">• يمنع عيوب القلب،</text><text x="205.33333333333334" y="425.99999999999994" text-anchor="start" font-size="13" fill="#0f172a">الإعاقة الذهنية وتأخر</text><text x="205.33333333333334" y="444.19999999999993" text-anchor="start" font-size="13" fill="#0f172a">نمو الجنين</text></svg>
