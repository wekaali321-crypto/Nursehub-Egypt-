<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="310" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">هرمونات الفص الأمامي للنخامية</text><rect x="420" y="46" width="200" height="32" fill="#6366f1"/><text x="520" y="67" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">الهرمون</text><rect x="220" y="46" width="200" height="32" fill="#6366f1"/><text x="320" y="67" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">التأثير</text><rect x="20" y="46" width="200" height="32" fill="#6366f1"/><text x="120" y="67" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">محفّز الإفراز</text><rect x="420" y="78" width="200" height="36" fill="#fff" stroke="#cbd5e1"/><text x="520" y="101" text-anchor="middle" font-size="12.5" fill="#0f172a">ACTH</text><rect x="220" y="78" width="200" height="36" fill="#fff" stroke="#cbd5e1"/><text x="320" y="101" text-anchor="middle" font-size="12.5" fill="#0f172a">ينبه الكظر لإفراز ألدوستيرون وكورتيزول</text><rect x="20" y="78" width="200" height="36" fill="#fff" stroke="#cbd5e1"/><text x="120" y="101" text-anchor="middle" font-size="12.5" fill="#0f172a">التوتر (Stress)</text><rect x="420" y="114" width="200" height="36" fill="#eef2f7" stroke="#cbd5e1"/><text x="520" y="137" text-anchor="middle" font-size="12.5" fill="#0f172a">FSH</text><rect x="220" y="114" width="200" height="36" fill="#eef2f7" stroke="#cbd5e1"/><text x="320" y="137" text-anchor="middle" font-size="12.5" fill="#0f172a">حيوانات منوية (رجل) / نمو حويصلات البويضة (امرأة)</text><rect x="20" y="114" width="200" height="36" fill="#eef2f7" stroke="#cbd5e1"/><text x="120" y="137" text-anchor="middle" font-size="12.5" fill="#0f172a">GnRH</text><rect x="420" y="150" width="200" height="36" fill="#fff" stroke="#cbd5e1"/><text x="520" y="173" text-anchor="middle" font-size="12.5" fill="#0f172a">LH</text><rect x="220" y="150" width="200" height="36" fill="#fff" stroke="#cbd5e1"/><text x="320" y="173" text-anchor="middle" font-size="12.5" fill="#0f172a">خصية (رجل) / الإباضة (امرأة)</text><rect x="20" y="150" width="200" height="36" fill="#fff" stroke="#cbd5e1"/><text x="120" y="173" text-anchor="middle" font-size="12.5" fill="#0f172a">GnRH</text><rect x="420" y="186" width="200" height="36" fill="#eef2f7" stroke="#cbd5e1"/><text x="520" y="209" text-anchor="middle" font-size="12.5" fill="#0f172a">GH</text><rect x="220" y="186" width="200" height="36" fill="#eef2f7" stroke="#cbd5e1"/><text x="320" y="209" text-anchor="middle" font-size="12.5" fill="#0f172a">بناء وأيض، نمو الغضاريف والعظام، يرفع السكر ويهدم الدهون</text><rect x="20" y="186" width="200" height="36" fill="#eef2f7" stroke="#cbd5e1"/><text x="120" y="209" text-anchor="middle" font-size="12.5" fill="#0f172a">النمو والتطور</text><rect x="420" y="222" width="200" height="36" fill="#fff" stroke="#cbd5e1"/><text x="520" y="245" text-anchor="middle" font-size="12.5" fill="#0f172a">PRL (برولاكتين)</text><rect x="220" y="222" width="200" height="36" fill="#fff" stroke="#cbd5e1"/><text x="320" y="245" text-anchor="middle" font-size="12.5" fill="#0f172a">إنتاج الحليب بالثدي</text><rect x="20" y="222" width="200" height="36" fill="#fff" stroke="#cbd5e1"/><text x="120" y="245" text-anchor="middle" font-size="12.5" fill="#0f172a">الإستروجين والحمل والرضاعة</text><rect x="420" y="258" width="200" height="36" fill="#eef2f7" stroke="#cbd5e1"/><text x="520" y="281" text-anchor="middle" font-size="12.5" fill="#0f172a">TSH</text><rect x="220" y="258" width="200" height="36" fill="#eef2f7" stroke="#cbd5e1"/><text x="320" y="281" text-anchor="middle" font-size="12.5" fill="#0f172a">ينبه الدرقية لإفراز T3 وT4</text><rect x="20" y="258" width="200" height="36" fill="#eef2f7" stroke="#cbd5e1"/><text x="120" y="281" text-anchor="middle" font-size="12.5" fill="#0f172a">حاجة الدرقية</text>
