<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="196" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ردود الفعل بعد التطعيم</text><rect x="325" y="48" width="295" height="132" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">طبيعية</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">حمى خفيفة</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">احمرار وتورم بموضع الحقن (كمادة باردة)</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">نزلة برد خفيفة = يُعطى اللقاح (نقطة</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">اختبار)</text><rect x="20" y="48" width="295" height="132" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">شديدة — اتصل</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">حرارة فوق 102°ف (38.9°م)</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">تشنج حمي</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">اسأل الأهل: "ما حرارته الآن؟" وأعطِ</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">أسيتامينوفين</text>
</svg>
