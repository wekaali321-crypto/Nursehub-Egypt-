h="300" height="120" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><rect x="326" y="206" width="300" height="26" rx="10" fill="#0f766e"/><text x="476.0" y="224" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >التشخيص والعوامل</text><text x="616" y="251" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >BNP فوق 900: شديد</text><text x="616" y="269" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >EF 40% أو أقل: سيئ</text><text x="616" y="287" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >قسطرة سوان-جانز: الارتفاع غير جيد</text><text x="616" y="305" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >الضغط الأعلى عامل الخطر الأول</text><rect x="14" y="338" width="612" height="150" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><rect x="14" y="338" width="612" height="26" rx="10" fill="#ea580c"/><text x="320.0" y="356" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >وذمة رئة: HOPE</text><text x="616" y="383" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >H: ارفع الرأس 45 درجة أو أكثر</text><text x="616" y="401.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >O: أكسجين</text><text x="616" y="420.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >P: فوروسيميد وريدياً + مورفين + مقويات</text><text x="616" y="438.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >E: أوقف الصوديوم والسوائل</text>
