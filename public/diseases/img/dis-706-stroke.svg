<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 482" width="640" height="482" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="482" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a" direction="rtl">السكتة الدماغية: ساعة الإنقاذ</text><rect x="20" y="56" width="600" height="74" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="606" y="80" text-anchor="end" direction="rtl" font-size="16" font-weight="700" fill="#0f172a" style="unicode-bidi:plaintext" transform="translate(0,0)">اكتشف (FAST)</text><text x="606" y="102" text-anchor="end" direction="rtl" font-size="14" fill="#334155">Face وجه متدلي · Arm ذراع ضعيفة · Speech كلام مضطرب</text><text x="606" y="122" text-anchor="end" direction="rtl" font-size="14" fill="#334155">· Time سجل الوقت</text><path d="M320 130 v14" stroke="#64748b" stroke-width="2"/><path d="M314 139 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="20" y="150" width="600" height="74" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="606" y="174" text-anchor="end" direction="rtl" font-size="16" font-weight="700" fill="#0f172a" style="unicode-bidi:plaintext" transform="translate(0,0)">اتصل بالإسعاف وجهّز</text><text x="606" y="196" text-anchor="end" direction="rtl" font-size="14" fill="#334155">سجل ساعة آخر مرة كان فيها طبيعياً (Last known well)،</text><text x="606" y="216" text-anchor="end" direction="rtl" font-size="14" fill="#334155">قس السكر</text><path d="M320 224 v14" stroke="#64748b" stroke-width="2"/><path d="M314 233 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="20" y="244" width="600" height="54" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="606" y="268" text-anchor="end" direction="rtl" font-size="16" font-weight="700" fill="#0f172a" style="unicode-bidi:plaintext" transform="translate(0,0)">CT مخ بدون صبغة فوراً</text><text x="606" y="290" text-anchor="end" direction="rtl" font-size="14" fill="#334155">نزفية أم إقفارية؟</text><path d="M320 298 v14" stroke="#64748b" stroke-width="2"/><path d="M314 307 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="20" y="318" width="600" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="606" y="342" text-anchor="end" direction="rtl" font-size="16" font-weight="700" fill="#0f172a" style="unicode-bidi:plaintext" transform="translate(0,0)">إقفارية</text><text x="606" y="364" text-anchor="end" direction="rtl" font-size="14" fill="#334155">إذابة الجلطة (Alteplase/Tenecteplase) حتى 4.5 ساعة</text><text x="606" y="384" text-anchor="end" direction="rtl" font-size="14" fill="#334155">من البداية، أو سحب جلطة بالقسطرة حتى 24 ساعة</text><path d="M320 392 v14" stroke="#64748b" stroke-width="2"/><path d="M314 401 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="20" y="412" width="600" height="54" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="606" y="436" text-anchor="end" direction="rtl" font-size="16" font-weight="700" fill="#0f172a" style="unicode-bidi:plaintext" transform="translate(0,0)">نزفية</text><text x="606" y="458" text-anchor="end" direction="rtl" font-size="14" fill="#334155">ضبط الضغط، عكس مميعات، جراحة عند اللزوم</text></svg>