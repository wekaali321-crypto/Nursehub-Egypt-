<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 433" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="433" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الربو: العلامات والغازات وأولويات الخطر</text><rect x="20" y="54" width="600" height="27.5" fill="#ef4444"/><text x="614" y="70.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#fff">الحرف</text><text x="542.5714285714286" y="70.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#fff">العلامة</text><text x="228.28571428571428" y="70.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#fff">العلامة الحرجة</text><rect x="20" y="81.5" width="600" height="27.5" fill="#ef4444" fill-opacity="0.07" stroke="#ef4444" stroke-opacity="0.3"/><text x="614" y="98.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">A</text><text x="542.5714285714286" y="98.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">استعمال عضلات التنفس المساعدة</text><text x="228.28571428571428" y="98.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">تنفس متناقض (Paradoxical)</text><rect x="20" y="109" width="600" height="27.5" fill="#fff" fill-opacity="1" stroke="#ef4444" stroke-opacity="0.3"/><text x="614" y="125.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">S</text><text x="542.5714285714286" y="125.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ضيق نفس ولهاث</text><text x="228.28571428571428" y="125.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">جملة بكلمة واحدة</text><rect x="20" y="136.5" width="600" height="27.5" fill="#ef4444" fill-opacity="0.07" stroke="#ef4444" stroke-opacity="0.3"/><text x="614" y="153.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">T</text><text x="542.5714285714286" y="153.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ضيق صدر وتسارع تنفس</text><rect x="20" y="164" width="600" height="27.5" fill="#fff" fill-opacity="1" stroke="#ef4444" stroke-opacity="0.3"/><text x="614" y="180.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">H</text><text x="542.5714285714286" y="180.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">صفير عالي النغمة (Wheezing)</text><rect x="20" y="191.5" width="600" height="27.5" fill="#ef4444" fill-opacity="0.07" stroke="#ef4444" stroke-opacity="0.3"/><text x="614" y="208.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">M</text><text x="542.5714285714286" y="208.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">انخفاض بسيط في أصوات التنفس</text><rect x="20" y="219" width="600" height="45" fill="#fff" fill-opacity="1" stroke="#ef4444" stroke-opacity="0.3"/><text x="614" y="235.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">A×3</text><text x="542.5714285714286" y="235.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">غياب أصوات التنفس (صدر صامت) — أولوية؛ حماض</text><text x="542.5714285714286" y="253.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">(احتباس CO₂)؛ احتباس هواء (زفير طويل)</text><text x="228.28571428571428" y="235.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الصدر الصامت خطير</text><rect x="426.66666666666663" y="274" width="193.33333333333334" height="145" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="426.66666666666663" y="274" width="193.33333333333334" height="29" rx="10" fill="#0ea5e9"/><text x="612" y="292" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">غازات الدم</text><text x="612" y="319" text-anchor="start" font-size="13" fill="#0f172a">• pH أقل من 7.35 = حماض</text><text x="612" y="342.2" text-anchor="start" font-size="13" fill="#0f172a">• PaCO₂ أكثر من 45 =</text><text x="612" y="360.4" text-anchor="start" font-size="13" fill="#0f172a">حماض</text><text x="612" y="383.59999999999997" text-anchor="start" font-size="13" fill="#0f172a">• PaO₂ أقل من 80 = نقص</text><text x="612" y="401.79999999999995" text-anchor="start" font-size="13" fill="#0f172a">أكسجة</text><rect x="223.33333333333331" y="274" width="193.33333333333334" height="145" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="223.33333333333331" y="274" width="193.33333333333334" height="29" rx="10" fill="#f59e0b"/><text x="408.66666666666663" y="292" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">أول علامة لنقص الأكسجة</text><text x="408.66666666666663" y="319" text-anchor="start" font-size="13" fill="#0f172a">• تغير الحالة العقلية:</text><text x="408.66666666666663" y="337.2" text-anchor="start" font-size="13" fill="#0f172a">تهيّج، قلق، نعاس</text><rect x="20" y="274" width="193.33333333333334" height="145" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="20" y="274" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="205.33333333333334" y="292" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">حالة asthmaticus</text><text x="205.33333333333334" y="319" text-anchor="start" font-size="13" fill="#0f172a">• التنبيب الرغامي هو</text><text x="205.33333333333334" y="337.2" text-anchor="start" font-size="13" fill="#0f172a">التدخل</text></svg>
