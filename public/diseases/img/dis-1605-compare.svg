<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 532" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="532" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مقارنة زيادة الحجم بنقصه حسب الأجهزة</text>
<rect x="10" y="44" width="620" height="32" rx="8" fill="#475569"/><text x="590" y="65" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >الجهاز</text><text x="420" y="65" text-anchor="middle" font-size="13" font-weight="800" fill="#fbcfe8" >زيادة الحجم</text><text x="160" y="65" text-anchor="middle" font-size="13" font-weight="800" fill="#fed7aa" >نقص الحجم</text><rect x="10" y="82" width="620" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="618" y="107" text-anchor="start" font-size="12.5" font-weight="800" fill="#0f172a" >الضغط</text><text x="540" y="107" text-anchor="start" font-size="10.5" font-weight="600" fill="#be185d" >ارتفاع، قد يصل 140+ (أزمة 180)</text><text x="250" y="107" text-anchor="start" font-size="10.5" font-weight="600" fill="#c2410c" >هبوط ضغط وانخفاض عند الوقوف</text><rect x="10" y="126" width="620" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="618" y="151" text-anchor="start" font-size="12.5" font-weight="800" fill="#0f172a" >النبض</text><text x="540" y="151" text-anchor="start" font-size="10.5" font-weight="600" fill="#be185d" >قوي متوثب</text><text x="250" y="151" text-anchor="start" font-size="10.5" font-weight="600" fill="#c2410c" >ضعيف خيطي، سريع فوق 100</text><rect x="10" y="170" width="620" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="618" y="195" text-anchor="start" font-size="12.5" font-weight="800" fill="#0f172a" >الأوردة</text><text x="540" y="195" text-anchor="start" font-size="10.5" font-weight="600" fill="#be185d" >أوردة رقبة منتفخة JVD، CVP مرتفع</text><text x="250" y="195" text-anchor="start" font-size="10.5" font-weight="600" fill="#c2410c" >أوردة الرقبة واليد مسطحة، CVP منخفض</text><rect x="10" y="214" width="620" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="618" y="239" text-anchor="start" font-size="12.5" font-weight="800" fill="#0f172a" >الجلد</text><text x="540" y="239" text-anchor="start" font-size="10.5" font-weight="600" fill="#be185d" >وذمة حول العين وانخماصية، شاحب بارد</text><text x="250" y="239" text-anchor="start" font-size="10.5" font-weight="600" fill="#c2410c" >جلد جاف مرن ضعيف، مخاطية جافة، حرارة أعلى</text><rect x="10" y="258" width="620" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="618" y="283" text-anchor="start" font-size="12.5" font-weight="800" fill="#0f172a" >الأعصاب</text><text x="540" y="283" text-anchor="start" font-size="10.5" font-weight="600" fill="#be185d" >تغير وعي، صداع، ضعف وتنميل</text><text x="250" y="283" text-anchor="start" font-size="10.5" font-weight="600" fill="#c2410c" >خمول حتى غيبوبة وضعف</text><rect x="10" y="302" width="620" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="618" y="327" text-anchor="start" font-size="12.5" font-weight="800" fill="#0f172a" >البول</text><text x="540" y="327" text-anchor="start" font-size="10.5" font-weight="600" fill="#be185d" >قلة بول، وزن نوعي منخفض (1.005)</text><text x="250" y="327" text-anchor="start" font-size="10.5" font-weight="600" fill="#c2410c" >بول مركز في البداية ثم قلة، وزن نوعي عالٍ </text><rect x="10" y="346" width="620" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="618" y="371" text-anchor="start" font-size="12.5" font-weight="800" fill="#0f172a" >الوزن</text><text x="540" y="371" text-anchor="start" font-size="10.5" font-weight="600" fill="#be185d" >زيادة 2–3 رطل/يوم أو 5 رطل/أسبوع</text><text x="250" y="371" text-anchor="start" font-size="10.5" font-weight="600" fill="#c2410c" >فقدان وزن</text><rect x="10" y="390" width="620" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="618" y="415" text-anchor="start" font-size="12.5" font-weight="800" fill="#0f172a" >التنفس</text><text x="540" y="415" text-anchor="start" font-size="10.5" font-weight="600" fill="#be185d" >سريع ضحل، رالات (وذمة رئة)</text><text x="250" y="415" text-anchor="start" font-size="10.5" font-weight="600" fill="#c2410c" >سريع عميق</text><rect x="10" y="434" width="620" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="618" y="459" text-anchor="start" font-size="12.5" font-weight="800" fill="#0f172a" >الهضم</text><text x="540" y="459" text-anchor="start" font-size="10.5" font-weight="600" fill="#be185d" >إسهال، تضخم كبد، استسقاء</text><text x="250" y="459" text-anchor="start" font-size="10.5" font-weight="600" fill="#c2410c" >إمساك وحركة ضعيفة</text><rect x="10" y="478" width="620" height="40" rx="6" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="618" y="503" text-anchor="start" font-size="12.5" font-weight="800" fill="#0f172a" >التحاليل</text><text x="540" y="503" text-anchor="start" font-size="10.5" font-weight="600" fill="#be185d" >ملح منخفض (Na أقل من 135)، Hct وBUN وأسم</text><text x="250" y="503" text-anchor="start" font-size="10.5" font-weight="600" fill="#c2410c" >Na فوق 145، Hct وBUN وأسمولالية أعلى</text>
</svg>
