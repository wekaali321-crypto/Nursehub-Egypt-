<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="600" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">نوبة الهوس الحادة: التدخلات والليثيوم</text><rect x="326" y="50" width="294" height="161.75" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><path d="M326 60a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#15803d"/><text x="473" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">تقليل التنبيه</text><text x="610" y="96.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="96.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">غرفة هادئة قرب محطة التمريض (نقطة امتحان)</text><text x="598" y="114.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أو أمام المحطة</text><text x="610" y="135.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="135.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">منطقة هادئة قليلة المنبهات</text><text x="610" y="156.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="156.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لا غرفة طعام جماعية ولا أنشطة جماعية؛ نشاط</text><text x="598" y="175" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">فردي واحد</text><rect x="20" y="50" width="294" height="161.75" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/><path d="M20 60a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#0e7490"/><text x="167" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">النشاط والحدود</text><text x="304" y="96.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="292" y="96.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">تمرين هوائي متناوب مع فترات راحة</text><text x="304" y="117.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="292" y="117.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">مساعدته في كنس أرضية الوحدة</text><text x="304" y="138.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="292" y="138.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">اختر له ملابسه (نقطة امتحان)</text><text x="304" y="159.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="292" y="159.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">حدود ثابتة وعواقب: «إن رميت المصباح ستبقى</text><text x="292" y="178" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">في غرفتك ساعة»</text><text x="304" y="199.125" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="292" y="199.125" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الشتم غير مقبول هنا</text><rect x="326" y="223.75" width="294" height="143.625" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><path d="M326 233.75a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#c2410c"/><text x="473" y="244.75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الغذاء</text><text x="610" y="270.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="598" y="270.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">سعرات وبروتين عاليان وسوائل كثيرة</text><text x="610" y="291.375" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="598" y="291.375" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أطعمة «أثناء الحركة»: همبرجر، ساندويتش،</text><text x="598" y="309.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">بوريتو، ميلك شيك، فاكهة وخضار باليد</text><text x="610" y="330.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="598" y="330.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">فخذ دجاج وأصابع جزر</text><text x="610" y="351.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="598" y="351.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لا كافيين</text><rect x="20" y="223.75" width="294" height="143.625" rx="10" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><path d="M20 233.75a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#6d28d9"/><text x="167" y="244.75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">سؤال: تدخلات التنويم للهوس (اختر الكل)</text><text x="304" y="270.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="270.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">✔ تشجيع التمرين مع الطاقم</text><text x="304" y="291.375" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="291.375" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">✔ غرفة خاصة قرب المحطة</text><text x="304" y="312.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="312.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">✔ اختيار الملابس له</text><text x="304" y="333.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="333.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">✔ تجنب الأنشطة الجماعية</text><text x="304" y="354.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="354.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">✘ الأكل في غرفة الطعام مع الآخرين</text><rect x="456.3636363636364" y="379.375" width="163.63636363636363" height="28.675" fill="#0e7490" stroke="#cbd5e1"/><text x="538.1818181818182" y="395.875" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">الدواء</text><rect x="20" y="379.375" width="436.3636363636364" height="28.675" fill="#0e7490" stroke="#cbd5e1"/><text x="238.1818181818182" y="395.875" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">النقاط المهمة</text><rect x="456.3636363636364" y="408.05" width="163.63636363636363" height="78.7" fill="#f8fafc" stroke="#cbd5e1"/><text x="538.1818181818182" y="424.55" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">ليثيوم (⁦Lithium⁩)</text><rect x="20" y="408.05" width="436.3636363636364" height="78.7" fill="#f8fafc" stroke="#cbd5e1"/><text x="238.1818181818182" y="424.55" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">سمي فوق ⁦1.5 mEq/L⁩؛ المستوى ⁦1.8⁩: احجب الجرعة وأبلغ الطبيب؛ اشرب سوائل وتناول</text><text x="238.1818181818182" y="441.225" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">الصوديوم ولا تقيدهما؛ تجنب مدرات البول و⁦NSAIDs⁩ (إيبوبروفين) لكن الأسبرين</text><text x="238.1818181818182" y="457.90000000000003" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">أفضل (حسب المرجع)؛ أبلغ عن إسهال شديد أو عطش وتبول مفرط؛ تجنب التمرين في</text><text x="238.1818181818182" y="474.575" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">الحر؛ تحاليل دورية للمستوى</text><rect x="456.3636363636364" y="486.75" width="163.63636363636363" height="45.35" fill="#fff" stroke="#cbd5e1"/><text x="538.1818181818182" y="503.25" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">حمض الفالبرويك (⁦Valproic⁩</text><text x="538.1818181818182" y="519.925" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">⁦acid)⁩</text><rect x="20" y="486.75" width="436.3636363636364" height="45.35" fill="#fff" stroke="#cbd5e1"/><text x="238.1818181818182" y="503.25" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">راقب وظائف الكبد</text><rect x="456.3636363636364" y="532.1" width="163.63636363636363" height="28.675" fill="#f8fafc" stroke="#cbd5e1"/><text x="538.1818181818182" y="548.6" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">هوس: بنزوديازيبينات</text><rect x="20" y="532.1" width="436.3636363636364" height="28.675" fill="#f8fafc" stroke="#cbd5e1"/><text x="238.1818181818182" y="548.6" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">⁦Clonazepam, Alprazolam⁩</text><rect x="456.3636363636364" y="560.775" width="163.63636363636363" height="28.675" fill="#fff" stroke="#cbd5e1"/><text x="538.1818181818182" y="577.275" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">اكتئاب ومثبتات مزاج</text><rect x="20" y="560.775" width="436.3636363636364" height="28.675" fill="#fff" stroke="#cbd5e1"/><text x="238.1818181818182" y="577.275" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">⁦Carbamazepine, Valproic acid, Lithium⁩</text></svg>