<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 402" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="402" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">متلازمة إعادة التغذية (Refeeding)</text><rect x="40" y="48" width="560" height="50" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.8"/><circle cx="576" cy="73" r="14" fill="#ea580c"/><text x="576" y="78" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="552" y="69" text-anchor="start" font-size="14" font-weight="800" fill="#ea580c">مريض جوع طويلاً</text><text x="552" y="87" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">مخزون فوسفات وبوتاسيوم ومغنيسيوم وثيامين منخفض</text><text x="320" y="114" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="120" width="560" height="50" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><circle cx="576" cy="145" r="14" fill="#2563eb"/><text x="576" y="150" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="552" y="141" text-anchor="start" font-size="14" font-weight="800" fill="#2563eb">بدء التغذية بسعرات عالية</text><text x="552" y="159" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">إفراز إنسولين → انتقال الفوسفات والبوتاسيوم والمغنيسيوم للخلايا</text><text x="320" y="186" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="192" width="560" height="50" rx="12" fill="#fff" stroke="#dc2626" stroke-width="1.8"/><circle cx="576" cy="217" r="14" fill="#dc2626"/><text x="576" y="222" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="552" y="213" text-anchor="start" font-size="14" font-weight="800" fill="#dc2626">اضطراب حاد</text><text x="552" y="231" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">نقص فوسفات/بوتاسيوم/مغنيسيوم + احتباس سوائل + نقص ثيامين</text><text x="320" y="258" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="264" width="560" height="50" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><circle cx="576" cy="289" r="14" fill="#7c3aed"/><text x="576" y="294" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="552" y="285" text-anchor="start" font-size="14" font-weight="800" fill="#7c3aed">مضاعفات</text><text x="552" y="303" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">اضطراب نظم، فشل قلب، فشل تنفس، تشنج، ويرنيكه</text><text x="320" y="330" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="336" width="560" height="50" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.8"/><circle cx="576" cy="361" r="14" fill="#16a34a"/><text x="576" y="366" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text><text x="552" y="357" text-anchor="start" font-size="14" font-weight="800" fill="#16a34a">الوقاية</text><text x="552" y="375" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">بدء تدريجي، ثيامين، تصحيح الأملاح، مونيتور وتحاليل يومية</text></svg>