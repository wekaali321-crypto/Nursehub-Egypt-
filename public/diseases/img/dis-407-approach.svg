<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="310" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">طنين الأذن: خطوات الفحص العملية</text>
  <rect x="200" y="46" width="240" height="36" rx="10" fill="#0ea5e9"/>
  <text x="320" y="68.9" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">وش / طنين / نبض في الأذن</text>
  <path d="M320 82 L320 96" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M314 94 L320 102 L326 94 Z" fill="#64748b"/>
  <rect x="40" y="102" width="560" height="36" rx="10" fill="#e0f2fe"/>
  <text x="320" y="124.55" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">اسأل: حرارة؟ ألم؟ إفراز؟ على ناحية واحدة ولا الاتنين؟</text>
  <path d="M320 138 L320 152" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M314 150 L320 158 L326 150 Z" fill="#64748b"/>
  <rect x="40" y="158" width="180" height="60" rx="10" fill="#dcfce7"/>
  <text x="130" y="183.7" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">١) افحص الأذن</text>
  <text x="130" y="200.7" text-anchor="middle" font-size="10" font-weight="500" fill="#14532d">تراكم شمع؟</text>
  <rect x="230" y="158" width="180" height="60" rx="10" fill="#dcfce7"/>
  <text x="320" y="183.7" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">٢) علامات التهاب</text>
  <text x="320" y="200.7" text-anchor="middle" font-size="10" font-weight="500" fill="#14532d">أذن خارجية/وسطى</text>
  <rect x="420" y="158" width="180" height="60" rx="10" fill="#dcfce7"/>
  <text x="510" y="183.7" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">٣) قِس الضغط</text>
  <text x="510" y="200.7" text-anchor="middle" font-size="10" font-weight="500" fill="#14532d">ارتفاع ضغط؟</text>
  <path d="M320 218 L320 234" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M314 232 L320 240 L326 232 Z" fill="#64748b"/>
  <rect x="40" y="240" width="560" height="48" rx="10" fill="#fee2e2"/>
  <text x="320" y="259.55" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">ناحية واحدة مستمرة + سن كبير = تحويل لأخصائي أنف وأذن</text>
  <text x="320" y="277.55" text-anchor="middle" font-size="11" font-weight="500" fill="#7f1d1d">لاستبعاد ورم العصب السمعي (Acoustic neuroma)</text>
