<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 564" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="564" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الانصباب الجنبي وبزل الصدر</text><rect x="325" y="54" width="295" height="131.8" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="325" y="54" width="295" height="29" rx="10" fill="#0ea5e9"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الآلية والأسباب</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• تجمع أكثر من 15 مل بالحيز الجنبي →</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">يمنع تمدد الرئة وانخماص</text><text x="612" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• الأسباب: التهاب رئوي، فشل قلب (وذمة</text><text x="612" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">رئوية)</text><rect x="20" y="54" width="295" height="131.8" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="20" y="54" width="295" height="29" rx="10" fill="#ef4444"/><text x="307" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">علامات مفتاحية</text><text x="307" y="99" text-anchor="start" font-size="13" fill="#0f172a">• ألم صدر عند الشهيق</text><text x="307" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• ضيق نفس</text><text x="307" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• نقص أصوات التنفس (الفص السفلي)</text><text x="307" y="168.6" text-anchor="start" font-size="13" fill="#0f172a">• رنين مكتوم بالقرع</text><rect x="30" y="195.8" width="580" height="54" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.5"/><circle cx="578" cy="222.8" r="14" fill="#f59e0b"/><text x="578" y="227.8" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="554" y="217.8" text-anchor="start" font-size="13.5" fill="#0f172a">قبل البزل: أوقف مميعات الدم: مضادات الصفائح (aspirin وclopidogrel)</text><text x="554" y="237.375" text-anchor="start" font-size="13.5" fill="#0f172a">ومضادات التخثر (warfarin وheparin/enoxaparin)</text><text x="320" y="260.8" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="263.8" width="580" height="40" rx="10" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="578" cy="283.8" r="14" fill="#0ea5e9"/><text x="578" y="288.8" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="554" y="288.8" text-anchor="start" font-size="13.5" fill="#0f172a">موافقة مكتوبة + أشعة صدر قبل وبعد</text><text x="320" y="314.8" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="317.8" width="580" height="40" rx="10" fill="#6366f1" fill-opacity="0.14" stroke="#6366f1" stroke-width="1.5"/><circle cx="578" cy="337.8" r="14" fill="#6366f1"/><text x="578" y="342.8" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="554" y="342.8" text-anchor="start" font-size="13.5" fill="#0f172a">الطبيب يُدخل إبرة بين الضلوع لسحب السائل</text><text x="320" y="368.8" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="371.8" width="580" height="40" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="1.5"/><circle cx="578" cy="391.8" r="14" fill="#10b981"/><text x="578" y="396.8" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="554" y="396.8" text-anchor="start" font-size="13.5" fill="#0f172a">بعد البزل: تنفس عميق لإعادة تمدد الرئة</text><text x="320" y="422.8" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="425.8" width="580" height="40" rx="10" fill="#ec4899" fill-opacity="0.14" stroke="#ec4899" stroke-width="1.5"/><circle cx="578" cy="445.8" r="14" fill="#ec4899"/><text x="578" y="450.8" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">5</text><text x="554" y="450.8" text-anchor="start" font-size="13.5" fill="#0f172a">استلقِ على الجنب السليم ("الرئة المريضة للأعلى")</text><rect x="20" y="475.8" width="600" height="74" rx="10" fill="#ef4444" fill-opacity="0.13" stroke="#ef4444" stroke-width="1.5"/><text x="610" y="495.8" text-anchor="start" font-size="13.5" font-weight="800" fill="#ef4444">أبلغ</text><text x="610" y="515.8" text-anchor="start" font-size="13" fill="#0f172a">مضاعفة البزل: استرواح الصدر: عدم تماثل حركة الصدر، نقص أصوات التنفس بالجانب</text><text x="610" y="534.8" text-anchor="start" font-size="13" fill="#0f172a">المصاب، رنين مفرط، انحراف الرغامى — أبلغ فورًا.</text></svg>
