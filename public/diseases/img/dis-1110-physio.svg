<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >كيف يضبط الجسم الحمض والقاعدة</text><rect x="20" y="48" width="190" height="70" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="115" y="76" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626" >إنتاج الحمض (H⁺)</text><text x="115" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >من الأيض في الخلايا</text><rect x="225" y="48" width="190" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="320" y="76" text-anchor="middle" font-size="15" font-weight="800" fill="#2563eb" >القاعدة (HCO₃⁻)</text><text x="320" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >تتعادل مع الحمض وتربطه</text><rect x="430" y="48" width="190" height="70" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/><text x="525" y="76" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a" >حمض الكربونيك H₂CO₃</text><text x="525" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >شكل النقل في الدم</text><path d="M210 83 L225 83 M415 83 L430 83" stroke="#64748b" stroke-width="3"/><path d="M525 120 L525 142 M525 142 L160 142 L160 168 M525 142 L480 168" stroke="#64748b" stroke-width="3" fill="none"/><rect x="20" y="170" width="290" height="90" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="3"/><text x="165" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#0ea5e9" >الرئتان</text><text x="165" y="222" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" >زفير CO₂ (سريع)</text><text x="165" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >تنفس بطيء ← CO₂ أعلى</text><rect x="330" y="170" width="290" height="90" rx="12" fill="#fff" stroke="#a855f7" stroke-width="3"/><text x="475" y="198" text-anchor="middle" font-size="16" font-weight="800" fill="#a855f7" >الكلى</text><text x="475" y="222" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a" >تطرح H⁺ وتعيد امتصاص HCO₃</text><text x="475" y="244" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >تعويض بطيء (أيام)</text><text x="320" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#475569" >شد الحبل: pH الطبيعي 7.35 – 7.45 بين الحمضي والقلوي</text><circle cx="320" cy="316" r="9" fill="#16a34a"/><path d="M120 316 H520" stroke="#64748b" stroke-width="3"/><rect x="100" y="304" width="40" height="24" rx="6" fill="#dc2626"/><rect x="500" y="304" width="40" height="24" rx="6" fill="#2563eb"/><text x="120" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626" >حمضي</text><text x="520" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb" >قلوي</text>
