<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="290" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">علامات الصدمة في النزيف (Hypovolemic shock)</text><rect x="20" y="55" width="116" height="150" rx="10" fill="#dc2626" stroke="none"/><text x="78" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الضغط</text><text x="78" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">هبوط</text><text x="78" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">(Hypotension)</text><rect x="144" y="55" width="116" height="150" rx="10" fill="#ea580c" stroke="none"/><text x="202" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">النبض</text><text x="202" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">سريع وضعيف</text><text x="202" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">(Tachycardia)</text><rect x="268" y="55" width="116" height="150" rx="10" fill="#ca8a04" stroke="none"/><text x="326" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الجلد</text><text x="326" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">بارد ورطب</text><text x="326" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">(Cold clammy)</text><rect x="392" y="55" width="116" height="150" rx="10" fill="#0d9488" stroke="none"/><text x="450" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">البول</text><text x="450" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">قلة</text><text x="450" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">(Oliguria)</text><rect x="516" y="55" width="116" height="150" rx="10" fill="#2563eb" stroke="none"/><text x="574" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Capillary refill</text><text x="574" y="135" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">متأخر أكتر من ثانيتين</text><text x="320" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">الأهم: قيس العلامات الحيوية الأول — الصدمة أخطر من كمية الدم المرئية</text><text x="320" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#64748b">مؤشر الصدمة = النبض ÷ الانقباضي (أكبر من 1 = علامة خطر)</text></svg>