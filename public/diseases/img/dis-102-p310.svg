<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="520" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">القولون التقرحي وكرون (2): التمريض والأدوية</text>
<rect x="346.0" y="52" width="320.0" height="153.5" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="346.0" y="52" width="320.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="506.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">السوائل والغذاء</text>
<text x="656.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• مراقبة صارمة للداخل والخارج</text>
<text x="656.0" y="115.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• 2 لتر ماء يومياً وأكثر مع الإسهال</text>
<text x="656.0" y="134.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• نقص البوتاسيوم (K ≤ 3.5)</text>
<text x="656.0" y="153.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• فيتامينات يومية بالكالسيوم</text>
<text x="656.0" y="173.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• غذاء عالٍ بالبروتين والسعرات، قليل الألياف،</text>
<text x="656.0" y="190.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">يوميات الأكل، وجبات صغيرة متكررة</text>
<rect x="14.0" y="52" width="320.0" height="153.5" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="14.0" y="52" width="320.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="174.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الألم والجانب النفسي</text>
<text x="324.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أعطِ المسكنات</text>
<text x="324.0" y="115.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تجنب الكحول وقلل الكافيين</text>
<text x="324.0" y="134.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تقليل التوتر وتشجيع التعبير عن المشاعر</text>
<rect x="346.0" y="217.5" width="320.0" height="132.25" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="346.0" y="217.5" width="320.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="506.0" y="235.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">المضاعفة: توسع القولون السام</text>
<text x="656.0" y="261.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تمزق الأمعاء من التوسع السام ثم التهاب</text>
<text x="656.0" y="278.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">البريتوان: حمى فوق 100.3ف، ألم ارتدادي، بطن</text>
<text x="656.0" y="296.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">صلب، ألم متزايد، قلق، تسرع قلب وتنفس</text>
<rect x="14.0" y="217.5" width="320.0" height="132.25" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.2"/>
<rect x="14.0" y="217.5" width="320.0" height="26" rx="10" fill="#6366f1" fill-opacity="1" stroke="#6366f1" stroke-width="1.2"/>
<text x="174.0" y="235.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الجراحة والأدوية</text>
<text x="324.0" y="261.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• استئصال جزء من الأمعاء مع فغر قولون أو</text>
<text x="324.0" y="278.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">لفائفي</text>
<text x="324.0" y="298.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• سلفاسالازين يوقف هجوم المناعة، وستيرويدات</text>
<text x="324.0" y="315.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">(بريدنيزون) لتخفيف التورم</text>
<text x="324.0" y="334.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• مضادات الإسهال: لوبراميد ودايسيكلومين</text>
<rect x="346.0" y="361.75" width="320.0" height="130.25" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="346.0" y="361.75" width="320.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="506.0" y="379.75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">أسئلة</text>
<text x="656.0" y="405.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• مريض UC: ناقش خفض التوتر، أعطِ المسكنات، زد</text>
<text x="656.0" y="423.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">أطعمة البروتين، راقب الداخل والخارج؛ لا تحدد</text>
<text x="656.0" y="440.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">500 مل ولا ألياف عالية وسعرات منخفضة</text>
<text x="656.0" y="459.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• مريض كرون: عبارة "سأزيد الألياف" تحتاج</text>
<text x="656.0" y="476.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">لتعليم إضافي أثناء النوبات</text>
</svg>
