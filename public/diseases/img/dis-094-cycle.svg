<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="450" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">انتقال الشيجيلا (الـ 5 F)</text>
<rect x="340" y="50" width="270" height="96" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="2.5"/><circle cx="592" cy="68" r="12" fill="#0ea5e9"/><text x="592" y="73" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="572" y="73" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">براز المصاب</text><text x="596" y="96" text-anchor="start" font-size="12.5" fill="#334155">يحتوي مليارات البكتيريا</text><text x="596" y="114" text-anchor="start" font-size="12.5" fill="#334155">عدوى بـ10–100 بكتيريا فقط</text><text x="320" y="104" text-anchor="middle" font-size="22" fill="#64748b">←</text>
<rect x="30" y="50" width="270" height="96" rx="12" fill="#fff" stroke="#22c55e" stroke-width="2.5"/><circle cx="282" cy="68" r="12" fill="#22c55e"/><text x="282" y="73" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="262" y="73" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">الأيدي (Fingers)</text><text x="286" y="96" text-anchor="start" font-size="12.5" fill="#334155">عدم غسل اليدين بعد الحمام</text><text x="286" y="114" text-anchor="start" font-size="12.5" fill="#334155">أهم وسيلة</text><text x="485" y="164" text-anchor="middle" font-size="18" fill="#64748b">↓</text>
<rect x="340" y="168" width="270" height="96" rx="12" fill="#fff" stroke="#eab308" stroke-width="2.5"/><circle cx="592" cy="186" r="12" fill="#eab308"/><text x="592" y="191" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="572" y="191" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">الأكل والماء (Food/Fluids)</text><text x="596" y="214" text-anchor="start" font-size="12.5" fill="#334155">تحضير أكل بأيدٍ ملوثة، ماء غير نقي</text><text x="596" y="232" text-anchor="start" font-size="12.5" fill="#334155">خضار نيئة</text><text x="320" y="222" text-anchor="middle" font-size="22" fill="#64748b">←</text>
<rect x="30" y="168" width="270" height="96" rx="12" fill="#fff" stroke="#f97316" stroke-width="2.5"/><circle cx="282" cy="186" r="12" fill="#f97316"/><text x="282" y="191" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="262" y="191" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">الذباب (Flies)</text><text x="286" y="214" text-anchor="start" font-size="12.5" fill="#334155">يحمل البراز للأكل</text><text x="286" y="232" text-anchor="start" font-size="12.5" fill="#334155">في الصيف والأحياء المزدحمة</text><text x="485" y="282" text-anchor="middle" font-size="18" fill="#64748b">↓</text>
<rect x="340" y="286" width="270" height="96" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2.5"/><circle cx="592" cy="304" r="12" fill="#dc2626"/><text x="592" y="309" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">5</text><text x="572" y="309" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">القولون</text><text x="596" y="332" text-anchor="start" font-size="12.5" fill="#334155">غزو الخلايا وسم يحدث التهاب</text><text x="596" y="350" text-anchor="start" font-size="12.5" fill="#334155">دم وصديد وزحير</text><text x="320" y="340" text-anchor="middle" font-size="22" fill="#64748b">←</text>
<rect x="30" y="286" width="270" height="96" rx="12" fill="#fff" stroke="#8b5cf6" stroke-width="2.5"/><circle cx="282" cy="304" r="12" fill="#8b5cf6"/><text x="282" y="309" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">6</text><text x="262" y="309" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">العدوى التالية</text><text x="286" y="332" text-anchor="start" font-size="12.5" fill="#334155">أسرة، حضانة، مدرسة، مستشفى</text><text x="286" y="350" text-anchor="start" font-size="12.5" fill="#334155">العزل والتطهير يقطعا السلسلة</text>
<text x="320" y="438" text-anchor="middle" font-size="12.5" fill="#475569">غسل اليدين + ماء نظيف + العزل بالتلامس</text></svg>