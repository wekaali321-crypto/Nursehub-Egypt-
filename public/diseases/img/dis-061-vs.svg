<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 291" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="291" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب المسالك البولية مقابل التهاب الحويضة</text><rect x="523" y="50" width="101" height="32" fill="#d97706"/><text x="573" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">البند</text><rect x="269" y="50" width="253" height="32" fill="#d97706"/><text x="396" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">UTI / التهاب المثانة</text><rect x="16" y="50" width="253" height="32" fill="#d97706"/><text x="143" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التهاب الحويضة والكلية</text><rect x="523" y="82" width="101" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="102" text-anchor="end" font-size="13" fill="#0f172a">الموقع</text><rect x="269" y="82" width="253" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="515" y="102" text-anchor="end" font-size="13" fill="#0f172a">الإحليل والمثانة</text><rect x="16" y="82" width="253" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="261" y="102" text-anchor="end" font-size="13" fill="#0f172a">الكلى (صعود عبر الحالبين)</text><rect x="523" y="113" width="101" height="31" fill="#fef3c7" stroke="#cbd5e1"/><text x="616" y="133" text-anchor="end" font-size="13" fill="#0f172a">الأعراض</text><rect x="269" y="113" width="253" height="31" fill="#fef3c7" stroke="#cbd5e1"/><text x="515" y="133" text-anchor="end" font-size="13" fill="#0f172a">حمى، حرقان بول (Dysuria)، تكرار</text><rect x="16" y="113" width="253" height="31" fill="#fef3c7" stroke="#cbd5e1"/><text x="261" y="133" text-anchor="end" font-size="13" fill="#0f172a">ألم خاصرة خفيف يمتد نحو السرة</text><rect x="523" y="144" width="101" height="69" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="164" text-anchor="end" font-size="13" fill="#0f172a">الأسباب</text><rect x="269" y="144" width="253" height="69" fill="#ffffff" stroke="#cbd5e1"/><text x="515" y="164" text-anchor="end" font-size="13" fill="#0f172a">E. coli: انتقال البكتيريا من</text><text x="515" y="183" text-anchor="end" font-size="13" fill="#0f172a">القولون للإحليل؛ مسح من الخلف</text><text x="515" y="202" text-anchor="end" font-size="13" fill="#0f172a">للأمام</text><rect x="16" y="144" width="253" height="69" fill="#ffffff" stroke="#cbd5e1"/><text x="261" y="164" text-anchor="end" font-size="13" fill="#0f172a">احتباس بول (BPH، حبس البول، حصوات)،</text><text x="261" y="183" text-anchor="end" font-size="13" fill="#0f172a">قسطرة فولي</text><rect x="523" y="213" width="101" height="31" fill="#fef3c7" stroke="#cbd5e1"/><text x="616" y="233" text-anchor="end" font-size="13" fill="#0f172a">المضاعفة</text><rect x="269" y="213" width="253" height="31" fill="#fef3c7" stroke="#cbd5e1"/><text x="515" y="233" text-anchor="end" font-size="13" fill="#0f172a">تسمم دم بولي Urosepsis مع ارتباك</text><rect x="16" y="213" width="253" height="31" fill="#fef3c7" stroke="#cbd5e1"/><text x="261" y="233" text-anchor="end" font-size="13" fill="#0f172a">نفس المضاعفة</text><rect x="523" y="244" width="101" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="264" text-anchor="end" font-size="13" fill="#0f172a">الدواء</text><rect x="269" y="244" width="253" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="515" y="264" text-anchor="end" font-size="13" fill="#0f172a">sulfonamides وlevofloxacin + مسكن</text><rect x="16" y="244" width="253" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="261" y="264" text-anchor="end" font-size="13" fill="#0f172a">نفس المضادات الحيوية</text></svg>