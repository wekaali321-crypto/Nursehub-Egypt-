<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="394" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الصدر الطافي (Flail Chest)</text><rect x="30" y="54" width="580" height="54" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.5"/><circle cx="578" cy="81" r="14" fill="#ef4444"/><text x="578" y="86" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="554" y="76" text-anchor="start" font-size="13.5" fill="#0f172a">كسر أضلاع بعد رضّ شديد (حادث، سقوط): قطعة من القفص الصدري تنفصل</text><text x="554" y="95.575" text-anchor="start" font-size="13.5" fill="#0f172a">تمامًا — طارئ يهدد الحياة</text><text x="320" y="119" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="122" width="580" height="54" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.5"/><circle cx="578" cy="149" r="14" fill="#f59e0b"/><text x="578" y="154" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="554" y="144" text-anchor="start" font-size="13.5" fill="#0f172a">الحركة المتناقضة: القطعة تُسحب للداخل في الشهيق وتنتفخ للخارج في</text><text x="554" y="163.575" text-anchor="start" font-size="13.5" fill="#0f172a">الزفير</text><text x="320" y="187" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="190" width="580" height="54" rx="10" fill="#ec4899" fill-opacity="0.14" stroke="#ec4899" stroke-width="1.5"/><circle cx="578" cy="217" r="14" fill="#ec4899"/><text x="578" y="222" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="554" y="212" text-anchor="start" font-size="13.5" fill="#0f172a">ألم صدري شديد وتنفس ضحل → التهاب رئوي وفشل تنفسي احتباسي (احتباس</text><text x="554" y="231.575" text-anchor="start" font-size="13.5" fill="#0f172a">CO₂ وحماض)</text><text x="320" y="255" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="258" width="580" height="54" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="1.5"/><circle cx="578" cy="285" r="14" fill="#10b981"/><text x="578" y="290" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="554" y="280" text-anchor="start" font-size="13.5" fill="#0f172a">الأولوية 1: التحكم بالألم بأفيونات موصوفة (morphine، hydromorphone،</text><text x="554" y="299.575" text-anchor="start" font-size="13.5" fill="#0f172a">hydrocodone)</text><text x="320" y="323" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="326" width="580" height="54" rx="10" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="578" cy="353" r="14" fill="#0ea5e9"/><text x="578" y="358" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">5</text><text x="554" y="348" text-anchor="start" font-size="13.5" fill="#0f172a">2: النظافة الرئوية بعد ضبط الألم فقط: TCDB ومقياس تنفس حافز لمنع</text><text x="554" y="367.575" text-anchor="start" font-size="13.5" fill="#0f172a">الانخماص</text></svg>
