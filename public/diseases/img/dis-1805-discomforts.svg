<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="344" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مضايقات الحمل ومعالجتها</text><rect x="326.0" y="50" width="294.0" height="133" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="326.0" y="50" width="294.0" height="28" rx="10" fill="#16a34a"/><text x="473.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الإمساك</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="start">• البروجسترون يبطئ الحركة والحديد يزيدها</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="start">• ألياف (فواكه وخضار)</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="start">• سوائل 10-12 كوباً</text><text x="610.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="start">• رياضة متوسطة</text><rect x="20.0" y="50" width="294.0" height="133" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><rect x="20.0" y="50" width="294.0" height="28" rx="10" fill="#b91c1c"/><text x="167.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ركود الصفراء داخل الكبد</text><text x="304.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="start">• حكة معممة باليدين والقدمين تزيد ليلاً</text><text x="304.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="start">دون طفح</text><text x="304.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="start">• خطر وفاة الجنين</text><text x="304.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="start">• تحليل أحماض صفراوية ومراقبة الجنين</text><text x="304.0" y="164" font-size="12.5" fill="#0f172a" text-anchor="start">• ursodeoxycholic acid</text><rect x="326.0" y="195" width="294.0" height="133" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="326.0" y="195" width="294.0" height="28" rx="10" fill="#7c3aed"/><text x="473.0" y="20" dy="195" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التهاب المسالك</text><text x="610.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="start">• تكرار وإلحاح وحرقان وبول كريه</text><text x="610.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="start">• حمى وألم خاصرة = التهاب كلية</text><text x="610.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="start">• خطر ولادة مبكرة</text><text x="610.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="start">• مضاد حيوي ومسكن</text><rect x="20.0" y="195" width="294.0" height="133" rx="10" fill="#fff" stroke="#c2410c" stroke-width="2"/><rect x="20.0" y="195" width="294.0" height="28" rx="10" fill="#c2410c"/><text x="167.0" y="20" dy="195" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الحموضة (Pyrosis)</text><text x="304.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="start">• 6 وجبات صغيرة</text><text x="304.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="start">• تجنب المقليات والكافيين والشوكولاتة</text><text x="304.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="start">والنعناع والتوابل</text><text x="304.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="start">• رأس مرتفع بالوسائد</text><text x="304.0" y="309" font-size="12.5" fill="#0f172a" text-anchor="start">• لا استلقاء بعد الأكل ولا ملابس ضيقة</text></svg>