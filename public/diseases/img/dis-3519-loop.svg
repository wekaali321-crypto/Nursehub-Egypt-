<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="340" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">المدرات العروية (Loop): furosemide وbumetanide وtorsemide</text><rect x="330" y="45" width="295" height="110" rx="10" fill="#dbeafe"/><text x="477.5" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">الآلية</text><text x="477.5" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تمنع إعادة امتصاص كلوريد الصوديوم</text><text x="477.5" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">في عروة هنلي والأنابيب الملتفة</text><text x="477.5" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">أقوى المدرات</text><rect x="15" y="45" width="305" height="110" rx="10" fill="#dcfce7"/><text x="167.5" y="87" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">الاستعمال</text><text x="167.5" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">ضغط الدم، الوذمة</text><text x="167.5" y="123" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">فشل القلب، أمراض الكلى</text><rect x="490" y="175" width="130" height="36" fill="#0e7490" stroke="#cbd5e1"/><text x="555" y="197" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">الدواء</text><rect x="370" y="175" width="120" height="36" fill="#0e7490" stroke="#cbd5e1"/><text x="430" y="197" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">التجاري</text><rect x="140" y="175" width="230" height="36" fill="#0e7490" stroke="#cbd5e1"/><text x="255" y="197" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">الجرعة الإرشادية