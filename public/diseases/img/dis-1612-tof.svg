<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 462" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="462" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">رباعية فالو ونوبات الزرقة</text>
<rect x="14" y="44" width="300" height="230" rx="10" fill="#fff" stroke="#334155" stroke-width="1.5"/><rect x="70" y="140" width="60" height="46" rx="14" fill="#93c5fd" stroke="#334155" stroke-width="1.3"/><text x="100.0" y="167.0" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a" direction="ltr">RA</text><rect x="136" y="140" width="60" height="46" rx="14" fill="#fca5a5" stroke="#334155" stroke-width="1.3"/><text x="166.0" y="167.0" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a" direction="ltr">LA</text><rect x="70" y="192" width="60" height="46" rx="14" fill="#60a5fa" stroke="#334155" stroke-width="1.3"/><text x="100.0" y="219.0" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a" direction="ltr">RV</text><rect x="136" y="192" width="60" height="46" rx="14" fill="#f87171" stroke="#334155" stroke-width="1.3"/><text x="166.0" y="219.0" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a" direction="ltr">LV</text><rect x="124" y="114" width="18" height="28" rx="6" fill="#fca5a5" stroke="#334155" stroke-width="1.2"/><text x="133" y="109" text-anchor="middle" font-size="9" font-weight="700" fill="#334155" >PA</text><rect x="160" y="106" width="22" height="36" rx="6" fill="#f87171" stroke="#334155" stroke-width="1.2"/><text x="171" y="101" text-anchor="middle" font-size="9" font-weight="700" fill="#334155" >Ao</text><line x1="146" y1="215.0" x2="122" y2="215.0" stroke="#dc2626" stroke-width="2" /><path d="M122,215.0 L128.1,211.6 L128.1,218.4 Z" fill="#dc2626"/><line x1="84" y1="196" x2="116" y2="174" stroke="#dc2626" stroke-width="2" /><path d="M116,174 L112.8,180.2 L109.0,174.7 Z" fill="#dc2626"/><text x="164" y="72" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a" >رباعية فالو (4 عيوب)</text><rect x="326" y="44" width="300" height="230" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><rect x="326" y="44" width="300" height="26" rx="10" fill="#2563eb"/><text x="476.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >العيوب الأربعة</text><text x="616" y="89" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >P: تضيق الصمام الرئوي</text><text x="616" y="110" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >R: تضخم البطين الأيمن</text><text x="616" y="131" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >O: أبهر راكب (Overriding aorta)</text><text x="616" y="152" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >V: ثقب بين البطينين (VSD)</text><rect x="14" y="286" width="300" height="160" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="14" y="286" width="300" height="26" rx="10" fill="#dc2626"/><text x="164.0" y="304" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >أثناء نوبة التيت (Tet spell)</text><text x="304" y="331" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >الرضع: ركبتان للصدر</text><text x="304" y="352" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >الأكبر: وضعية القرفصاء</text><text x="304" y="373" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >أكسجين وطبيب بأمر</text><rect x="326" y="286" width="300" height="160" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><rect x="326" y="286" width="300" height="26" rx="10" fill="#16a34a"/><text x="476.0" y="304" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >الوقاية من النوبات</text><text x="616" y="331" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >لا توقظ الطفل فجأة، بيئة هادئة عند الاستيقاظ</text><text x="616" y="351" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >عرض لهاية أثناء البكاء</text><text x="616" y="371" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >رضعات صغيرة متكررة</text><text x="616" y="391" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >لف الرضيع أو احتضانه أثناء الإجراءات</text>
</svg>
