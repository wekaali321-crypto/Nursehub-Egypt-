<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 462" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="462" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">رباعية فالو ونوبات الزرقة</text>
<rect x="14" y="44" width="300" height="230" rx="10" fill="#fff" stroke="#334155" stroke-width="1.5"/><rect x="60" y="100" width="60" height="46" rx="14" fill="#93c5fd" stroke="#334155" stroke-width="1.3"/><text x="90.0" y="127.0" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a" direction="ltr">RA</text><rect x="126" y="100" width="60" height="46" rx="14" fill="#fca5a5" stroke="#334155" stroke-width="1.3"/><text x="156.0" y="127.0" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a" direction="ltr">LA</text><rect x="60" y="152" width="60" height="46" rx="14" fill="#60a5fa" stroke="#334155" stroke-width="1.3"/><text x="90.0" y="179.0" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a" direction="ltr">RV</text><rect x="126" y="152" width="60" height="46" rx="14" fill="#f87171" stroke="#334155" stroke-width="1.3"/><text x="156.0" y="179.0" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a" direction="ltr">LV</text><rect x="114" y="74" width="18" height="28" rx="6" fill="#fca5a5" stroke="#334155" stroke-width="1.2"/><text x="123" y="69" text-anchor="middle" font-size="9" font-weight="700" fill="#334155" >PA</text><rect x="150" y="66" width="22" height="36" rx="6" fill="#f87171" stroke="#334155" stroke-width="1.2"/><text x="161" y="61" text-anchor="middle" font-size="9" font-weight="700" fill="#334155" >Ao</text><line x1="136" y1="175.0" x2="112" y2="175.0" stroke="#dc2626" stroke-width="2" /><path d="M112,175.0 L118.1,171.6 L118.1,178.4 Z" fill="#dc2626"/><line x1="74" y1="156" x2="106" y2="134" stroke="#dc2626" stroke-width="2" /><path d="M106,134 L102.8,140.2 L99.0,134.7 Z" fill="#dc2626"/><text x="164" y="72" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a" >رباعية فالو (4 عيوب)</text><rect x="326" y="44" width="300" height="230" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><rect x="326" y="44" width="300" height="26" rx="10" fill="#2563eb"/><text x="476.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >العيوب الأربعة</text><text x="616" y="89" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >P: تضيق الصمام الرئوي</text><text x="616" y="108" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >R: تضخم البطين الأيمن</text><text x="616" y="127" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >O: أبهر راكب (Overriding aorta)</text><text x="616" y="146" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >V: ثقب بين البطينين (VSD)</text><rect x="14" y="286" width="300" height="160" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="14" y="286" width="300" height="26" rx="10" fill="#dc2626"/><text x="164.0" y="304" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >أثناء نوبة التيت (Tet spell)</text><text x="304" y="331" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >الرضع: ركبتان للصدر</text><text x="304" y="350" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >الأكبر: وضعية القرفصاء</text><text x="304" y="369" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >أكسجين وطبيب بأمر</text><rect x="326" y="286" width="300" height="160" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><rect x="326" y="286" width="300" height="26" rx="10" fill="#16a34a"/><text x="476.0" y="304" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >الوقاية من النوبات</text><text x="616" y="331" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >لا توقظ الطفل فجأة، بيئة هادئة عند الاستيقاظ</text><text x="616" y="349" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >عرض لهاية أثناء البكاء</text><text x="616" y="367" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >رضعات صغيرة متكررة</text><text x="616" y="385" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >لف الرضيع أو احتضانه أثناء الإجراءات</text>
</svg>
