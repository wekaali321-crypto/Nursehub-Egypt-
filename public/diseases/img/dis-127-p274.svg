<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 629" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="700" height="629" rx="16" fill="#f8fafc"/>
<text x="350.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قسطرة القلب والنيتروغليسرين وأدوية الصدر</text>
<rect x="356.0" y="52" width="330.0" height="237.75" rx="10" fill="#0e7490" fill-opacity="0.1" stroke="#0e7490" stroke-width="1.2"/>
<rect x="356.0" y="52" width="330.0" height="26" rx="10" fill="#0e7490" fill-opacity="1" stroke="#0e7490" stroke-width="1.2"/>
<text x="521.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">قبل/أثناء/بعد القسطرة</text>
<text x="676.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• الصبغة (Contrast) قد تؤذي الكلى: اسأل عن</text>
<text x="676.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">حساسية اليود (احمرار وحرارة عابرة طبيعي)</text>
<text x="676.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• النزف: اضغط مباشرة فوق موضع الوخز؛ لا هيبارين</text>
<text x="676.0" y="149.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">ولا وارفارين ولا أسبرين ولا كلوبيدوجريل قبلها</text>
<text x="676.0" y="167.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">إلا بأمر</text>
<text x="676.0" y="186.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• الكرياتينين الطبيعي 0.9–1.2: أبلغ إن فوق 1.3</text>
<text x="676.0" y="203.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">أو البول أقل من 30 مل/ساعة؛ أوقف الميتفورمين 48</text>
<text x="676.0" y="220.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">ساعة قبل وبعد</text>
<text x="676.0" y="240.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• النبض الطرفي: قد يضعف 4–12 ساعة بعد الإجراء؛</text>
<text x="676.0" y="257.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">عدم جس نبض القدم بعدها = أبلغ الطبيب (ساق باردة</text>
<text x="676.0" y="274.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">ونبض لا يُجس إلا بالدوبلر)</text>
<rect x="14.0" y="52" width="330.0" height="237.75" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="14.0" y="52" width="330.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="179.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">مضاعفات بعد الجلطة</text>
<text x="334.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• حادة: صدمة قلبية (هبوط ضغط شديد)؛ VF/VT بلا</text>
<text x="334.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">نبض = إزالة الرجفان (Defibrillation)؛ أما إذا</text>
<text x="334.0" y="130.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">كان فيه نبض فيتم تزامن الصدمة Cardioversion</text>
<text x="334.0" y="149.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• مزمنة: قصور قلب: زيادة وزن سريعة، خراخر رئوية،</text>
<text x="334.0" y="167.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">وذمة (+1 pitting)</text>
<text x="334.0" y="186.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أولوية: مدرات وريدية فيوروسيمايد/بيوميتانيد</text>
<text x="334.0" y="203.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">(وليس أيزوسوربيد)</text>
<rect x="356.0" y="309.75" width="330.0" height="209.25" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.2"/>
<rect x="356.0" y="309.75" width="330.0" height="26" rx="10" fill="#6366f1" fill-opacity="1" stroke="#6366f1" stroke-width="1.2"/>
<text x="521.0" y="327.75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">النيتروغليسرين: أقراص أو بخاخ تحت اللسان</text>
<text x="676.0" y="353.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• للذبحة المستقرة؛ يُؤخذ قبل المجهود</text>
<text x="676.0" y="373.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• الهدف: نشاط يومي بلا ألم</text>
<text x="676.0" y="392.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• اتصل بالإسعاف إذا لم يزُل الألم 5 دقائق بعد</text>
<text x="676.0" y="409.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">أول جرعة</text>
<text x="676.0" y="428.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• حتى 3 جرعات، بينها 5 دقائق</text>
<text x="676.0" y="448.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا تُبلع بل تحت اللسان</text>
<text x="676.0" y="467.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• يحفظ بعيداً عن الضوء والحرارة، في عبوته</text>
<text x="676.0" y="484.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الزجاجية الغامقة (لا علبة حبوب ولا سيارة)</text>
<text x="676.0" y="503.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• يُستبدل كل 6 أشهر</text>
<rect x="14.0" y="309.75" width="330.0" height="209.25" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="14.0" y="309.75" width="330.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="179.0" y="327.75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">لصقة النيترو (جلدية)</text>
<text x="334.0" y="353.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• للذبحة غير المستقرة/غير الزائلة بالراحة</text>
<text x="334.0" y="373.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• مرة يومياً لا عند اللزوم، لصقة واحدة فقط</text>
<text x="334.0" y="392.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• الاستحمام مسموح</text>
<text x="334.0" y="411.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• جلد نظيف جاف خال من الشعر، أعلى الجسم، مع</text>
<text x="334.0" y="428.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">تبديل المكان يومياً</text>
<text x="334.0" y="448.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا على جلد مجروح أو متقشر</text>
<text x="334.0" y="467.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لو سقطت لأكثر من ساعة: ضع غيرها (مفعولها 40–60</text>
<text x="334.0" y="484.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">د)</text>
<text x="334.0" y="503.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• الممرض يلبس قفازاً حتى لا يصاب بالصداع</text>
<rect x="14" y="537.0" width="672" height="70.0" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.4"/>
<text x="674" y="557.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">الأثر الجانبي الطبيعي: صداع. الأثر الضار: هبوط ضغط (غيّر الوضعية ببطء). ممنوع مع سيلدينافيل</text>
<text x="674" y="575.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">(فياجرا) ومشابهاته (-afil): قد يؤدي للموت. أوقف النيترو إن هبط الانقباضي دون 90 أو انخفض 30</text>
<text x="674" y="593.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">mmHg.</text>
</svg>
