<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 338" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="338" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">احتباس البول: أسباب وتمريض</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="204.6" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الأسباب</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• بعد الجراحة</text><text x="612" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• بعد نزع القسطرة</text><text x="612" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">البولية</text><text x="612" y="163.6" text-anchor="start" font-size="13" fill="#0f172a">• تضخم البروستاتا الحميد</text><text x="612" y="181.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">(BPH) عند الرجال</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="204.6" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#f59e0b"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">أدوية تسبب احتباسًا</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• أفيونات: morphine،</text><text x="408.66666666666663" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">hydromorphone</text><text x="408.66666666666663" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• مضادات الكولين:</text><text x="408.66666666666663" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">ipratropium، atropine</text><text x="408.66666666666663" y="181.8" text-anchor="start" font-size="13" fill="#0f172a">• مضادات الاكتئاب ثلاثية</text><text x="408.66666666666663" y="200" text-anchor="start" font-size="13" fill="#0f172a">الحلقات</text><rect x="20" y="54" width="193.33333333333334" height="204.6" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">التمريض</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• افحص المثانة بالجس</text><text x="205.33333333333334" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">أولًا</text><text x="205.33333333333334" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• ساعد المريض للنهوض</text><text x="205.33333333333334" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">لوضع التبول الطبيعي</text><text x="205.33333333333334" y="181.8" text-anchor="start" font-size="13" fill="#0f172a">• جهاز المسح أكثر من 100 مل:</text><text x="205.33333333333334" y="200" text-anchor="start" font-size="13" fill="#0f172a">بلّغ</text><text x="205.33333333333334" y="223.20000000000002" text-anchor="start" font-size="13" fill="#0f172a">• قسطرة متقطعة عند</text><text x="205.33333333333334" y="241.4" text-anchor="start" font-size="13" fill="#0f172a">اللزوم</text><rect x="20" y="268.6" width="600" height="55" rx="10" fill="#0ea5e9" fill-opacity="0.13" stroke="#0ea5e9" stroke-width="1.5"/><text x="610" y="288.6" text-anchor="start" font-size="13.5" font-weight="800" fill="#0ea5e9">قسطرة فولي</text><text x="610" y="308.6" text-anchor="start" font-size="13" fill="#0f172a">الكيس دائمًا أسفل مستوى المثانة، ولا يُعلَّق خلف الكرسي المتحرك.</text></svg>
