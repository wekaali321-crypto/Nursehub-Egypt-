<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >الهيموجلوبين والهيماتوكريت: القراءة والتصرف</text><rect x="20" y="48" width="150" height="62" rx="10" fill="#dc2626" stroke="none" stroke-width="1"/><text x="95.0" y="76" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" direction="ltr">أقل من 7</text><text x="95.0" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" >نقل دم غالبًا</text><rect x="175" y="48" width="150" height="62" rx="10" fill="#f97316" stroke="none" stroke-width="1"/><text x="250.0" y="76" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" direction="ltr">7 – 11</text><text x="250.0" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" >بلّغ الطبيب</text><rect x="330" y="48" width="150" height="62" rx="10" fill="#16a34a" stroke="none" stroke-width="1"/><text x="405.0" y="76" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" direction="ltr">12 – 18</text><text x="405.0" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" >طبيعي</text><rect x="485" y="48" width="135" height="62" rx="10" fill="#7c3aed" stroke="none" stroke-width="1"/><text x="552.5" y="76" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" direction="ltr">أكبر من 18</text><text x="552.5" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" >تركيز دم/جفاف</text><text x="320" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >Hgb بالجم/ديسيلتر. الحدود تختلف بين الرجال والسيدات</text><rect x="20" y="150" width="290" height="130" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="3"/><text x="165" y="178" text-anchor="middle" font-size="16" font-weight="800" fill="#0ea5e9" >قاعدة الثلاثة</text><text x="165" y="206" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a" direction="ltr">Hct ≈ Hgb × 3</text><text x="165" y="234" text-anchor="middle" font-size="14" font-weight="700" fill="#475569" direction="ltr">Hgb 12 ← Hct 36</text><text x="165" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="#475569" direction="ltr">Hgb 18 ← Hct 54</text><rect x="330" y="150" width="290" height="130" rx="12" fill="#fff" stroke="#f97316" stroke-width="3"/><text x="475" y="178" text-anchor="middle" font-size="16" font-weight="800" fill="#f97316" >عند ارتفاع Hct</text><text x="475" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" >جفاف (تركيز الدم)</text><text x="475" y="230" text-anchor="middle" font-size="16" font-weight="800" fill="#f97316" >عند انخفاض Hct</text><text x="475" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" >نزيف، أنيميا، زيادة سوائل</text>
</svg>
