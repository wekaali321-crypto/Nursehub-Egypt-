<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="400" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">بعد استئصال الثدي</text><rect x="330" y="46" width="290" height="70" rx="10" fill="#dc2626"/><text x="475.0" y="68.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">مصرف Jackson-Pratt</text><text x="475.0" y="84.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">أبلغ الطبيب: أكثر من 100 مل أحمر قانٍ</text><text x="475.0" y="100.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">يُزال عند ≤25 مل خلال 24 ساعة</text><rect x="20" y="46" width="300" height="70" rx="10" fill="#ea580c"/><text x="170.0" y="68.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">خطر العدوى والتورم</text><text x="170.0" y="84.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">بعد 24 ساعة: راقب الصدمة والنزف</text><text x="170.0" y="100.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">إزالة الغدد الإبطية تزيد خطر الوذمة</text><rect x="20" y="126" width="300" height="110" rx="10" fill="#fee2e2"/><text x="170.0" y="168.2" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">تجنب في الذراع المصابة</text><text x="170.0" y="185.2" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">لا وريد ولا سحب دم</text><text x="170.0" y="202.2" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">لا لقاحات ولا قياس ضغط</text><rect x="330" y="126" width="290" height="110" rx="10" fill="#dcfce7"/><text x="475.0" y="159.7" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">منع التورم</text><text x="475.0" y="176.7" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">كم ضاغط (Compression sleeve)</text><text x="475.0" y="193.7" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">ارفع الذراع فوق القلب على وسادة</text><text x="475.0" y="210.7" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">تمارين</text><rect x="20" y="246" width="600" height="60" rx="10" fill="#e0f2fe"/><text x="320.0" y="271.85" text-anchor="middle" font-size="11" font-weight="700" fill="#0c4a6e">طبيعي ومتوقع: تنميل على الجهة الداخلية للذراع وتورم عقد لمفاوية</text><text x="320.0" y="287.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0c4a6e">يزول خلال أشهر وغالبًا يتحسن بعد سنة</text></svg>