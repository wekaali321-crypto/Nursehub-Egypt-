<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="420" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">علامات ارتفاع الضغط داخل الجمجمة</text><rect x="430" y="46" width="190" height="150" rx="10" fill="#16a34a"/><text x="525.0" y="92.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">مبكرة</text><text x="525.0" y="108.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">اهتياج وقلق وتهيج</text><text x="525.0" y="124.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">تغير الوعي ونعاس</text><text x="525.0" y="140.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">تدني الحالة العقلية</text><text x="525.0" y="156.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">وجه مسطح وعاطفة قليلة</text><rect x="225" y="46" width="190" height="150" rx="10" fill="#f59e0b"/><text x="320.0" y="100.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">متوسطة</text><text x="320.0" y="116.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">صداع مستمر</text><text x="320.0" y="132.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">قيء مفاجئ (Emesis) بدون غثيان</text><text x="320.0" y="148.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">أبلغ الطبيب</text><rect x="20" y="46" width="190" height="150" rx="10" fill="#dc2626"/><text x="115.0" y="100.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">متأخرة</text><text x="115.0" y="116.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">ثلاثية كوشنغ</text><text x="115.0" y="132.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">نوبات وغيبوبة</text><text x="115.0" y="148.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">وضعية تصلب</text><rect x="20" y="208" width="600" height="54" rx="10" fill="#fee2e2"/><text x="320.0" y="239.2" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">ثلاثية كوشنغ: ضغط عالٍ مع ضغط نبضي واسع + بطء قلب + بطء تنفس</text><rect x="20" y="272" width="600" height="60" rx="10" fill="#e0f2fe"/><text x="320.0" y="297.85" text-anchor="middle" font-size="11" font-weight="700" fill="#0c4a6e">رئة: تنفس غير منتظم/شاين ستوكس • رقبة: تيبس لا يثني الذقن للصدر</text><text x="320.0" y="313.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0c4a6e">حدقة ثابتة متسعة (8 مم؛ الطبيعي 2-6) أو غير متساوية</text><rect x="20" y="342" width="600" height="64" rx="10" fill="#fef3c7"/><text x="320.0" y="369.85" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">منعكس Babinski (أصابع القدم تتفرق) = فتق جذع دماغ عند البالغ</text><text x="320.0" y="385.85" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Decorticate: ثني الذراعين نحو الجذع • Decerebrate: بسط وأسوأ</text></svg>