<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 332" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="332" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ثلاث خطوات لقراءة ABG</text>
<rect x="30" y="50" width="580" height="70" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><circle cx="580" cy="85" r="18" fill="#dc2626"/><text x="580" y="91" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >1</text><text x="545" y="79" text-anchor="start" font-size="15" font-weight="800" fill="#0f172a" >pH أولاً</text><text x="545" y="103" text-anchor="start" font-size="12.5" font-weight="600" fill="#475569" >أقل من 7.35 = حماض | أكبر من 7.45 = قلاء</text><rect x="30" y="132" width="580" height="70" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><circle cx="580" cy="167" r="18" fill="#ea580c"/><text x="580" y="173" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >2</text><text x="545" y="161" text-anchor="start" font-size="15" font-weight="800" fill="#0f172a" >اعثر على الشريك المطابق</text><text x="545" y="185" text-anchor="start" font-size="12.5" font-weight="600" fill="#475569" >PaCO₂ (رئة) أو HCO₃ (كلى): أيهما يتحرك في نفس اتجاه pH؟</text><rect x="30" y="214" width="580" height="70" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><circle cx="580" cy="249" r="18" fill="#16a34a"/><text x="580" y="255" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >3</text><text x="545" y="243" text-anchor="start" font-size="15" font-weight="800" fill="#0f172a" >هل حصل تعويض؟</text><text x="545" y="267" text-anchor="start" font-size="12.5" font-weight="600" fill="#475569" >pH طبيعي تماماً = تعويض كامل | pH خارج الحدود = جزئي أو لا تعويض</text><text x="320" y="310" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a" >جدول الشريكين: CO₂ = تنفسي (حمض) | HCO₃ = أيضي (قاعدة)</text>
</svg>
