<rect x="520" y="136" width="100" height="44" fill="#f1f5f9" stroke="#cbd5e1"/><text x="570" y="155" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">B</text><text x="570" y="171" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">جفاف متوسط</text><rect x="300" y="136" width="220" height="44" fill="#f1f5f9" stroke="#cbd5e1"/><text x="410" y="155" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">عطش، عيون غائرة،</text><text x="410" y="171" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">جلد يرجع ببطء</text><rect x="20" y="136" width="280" height="44" fill="#f1f5f9" stroke="#cbd5e1"/><text x="160" y="155" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">ORS 75 مل/كجم خلال 4 ساعات</text><text x="160" y="171" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">وتقييم مستمر</text>
