<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 294" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="294" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">الأدوية: آمنة أم ممنوعة في الحمل والرضاعة</text>
<rect x="20" y="44" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="44" width="160" height="54" rx="10" fill="#15803d"/><text x="540" y="76" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">آمنة</text><text x="448" y="67" text-anchor="end" font-size="13" fill="#0f172a">Paracetamol · البنسلينات · السيفالوسبورينات</text><text x="448" y="85" text-anchor="end" font-size="13" fill="#0f172a">Erythromycin · Aldomet · كريمات الفطريات الموضعية</text><rect x="20" y="106" width="600" height="72" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="106" width="160" height="72" rx="10" fill="#d97706"/><text x="540" y="147" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">بحذر وبشروط</text><text x="448" y="129" text-anchor="end" font-size="13" fill="#0f172a">NSAIDs (Brufen, Cataflam): الثلث الثاني فقط</text><text x="448" y="147" text-anchor="end" font-size="13" fill="#0f172a">Nitrofurantoin: آمن في الحمل إلا آخر شهر</text><text x="448" y="165" text-anchor="end" font-size="13" fill="#0f172a">Primperan: Class B لكن يُفضَّل عدم وصفه</text><rect x="20" y="186" width="600" height="72" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="186" width="160" height="72" rx="10" fill="#b91c1c"/><text x="540" y="227" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ممنوعة</text><text x="448" y="209" text-anchor="end" font-size="13" fill="#0f172a">Tetracycline · Quinolones · Aminoglycosides · Chloramphenicol</text><text x="448" y="227" text-anchor="end" font-size="13" fill="#0f172a">أدوية الديدان · أدوية الصرع · أقراص السكر · Hydroquinone</text><text x="448" y="245" text-anchor="end" font-size="13" fill="#0f172a">المسهلات (ما عدا Lactulose / Picolax بأمر) · PPI (Omeprazole)</text><text x="320" y="278" text-anchor="middle" font-size="12" fill="#64748b">القاعدة: أقل جرعة، أقصر مدة، والموضعي قبل الجهازي</text>
</svg>
