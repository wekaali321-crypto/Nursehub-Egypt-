<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="330" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع فرط الحساسية الأربعة</text>
<rect x="20" y="50" width="150" height="58" rx="10" fill="#16a34a"/>
<text x="95.0" y="83.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">النوع I — فوري</text>
<rect x="176" y="50" width="444" height="58" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/>
<text x="398" y="74" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">IgE (حساسية، أنافيلاكسيس)</text>
<text x="398" y="96" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">أمثلة: طعام، لسعة، دواء، غبار طلع</text>
<rect x="20" y="118" width="150" height="58" rx="10" fill="#ea580c"/>
<text x="95.0" y="141.33333333333334" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">النوع II — سمّي</text>
<text x="95.0" y="161.33333333333334" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">للخلايا</text>
<rect x="176" y="118" width="444" height="58" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/>
<text x="398" y="142" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">أجسام مضادة IgG/IgM تهاجم الخلية</text>
<text x="398" y="164" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">أمثلة: عدم توافق نقل الدم، انحلال</text>
<rect x="20" y="186" width="150" height="58" rx="10" fill="#2563eb"/>
<text x="95.0" y="209.33333333333334" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">النوع III — معقدات</text>
<text x="95.0" y="229.33333333333334" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">مناعية</text>
<rect x="176" y="186" width="444" height="58" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/>
<text x="398" y="210" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">معقد مضاد+مستضد يترسب بالأنسجة</text>
<text x="398" y="232" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">أمثلة: الذئبة، التهاب كلى بعد المكورات</text>
<rect x="20" y="254" width="150" height="58" rx="10" fill="#7c3aed"/>
<text x="95.0" y="287.3333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">النوع IV — متأخر</text>
<rect x="176" y="254" width="444" height="58" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
<text x="398" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">خلايا T (بعد 24–72 ساعة)</text>
<text x="398" y="300" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">أمثلة: اختبار التيوبركولين، التهاب جلد تلامسي</text>
<text x="320" y="325" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">الأول والثاني والثالث بالأجسام المضادة؛ الرابع بالخلايا التائية</text>
</svg>
