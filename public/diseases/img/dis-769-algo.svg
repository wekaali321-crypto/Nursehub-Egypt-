<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 434" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="434" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">التعامل مع التهاب النسيج الخلوي</text><rect x="40" y="48" width="560" height="50" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.8"/><circle cx="576" cy="73" r="14" fill="#ea580c"/><text x="576" y="78" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="552" y="69" text-anchor="end" font-size="14" font-weight="800" fill="#ea580c">اشتبه</text><text x="552" y="87" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">جلد أحمر ساخن متورم مؤلم، غالباً بالساق، حدود غير واضحة، قد معها حمى</text><text x="320" y="114" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="120" width="560" height="66" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><circle cx="576" cy="153" r="14" fill="#2563eb"/><text x="576" y="158" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="552" y="141" text-anchor="end" font-size="14" font-weight="800" fill="#2563eb">علّم الحدود وقيّم</text><text x="552" y="159" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">ارسم بقلم حدود الاحمرار بالتاريخ والوقت. قس الحرارة. افحص</text><text x="552" y="175" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">الجروح/الشقوق بين الأصابع. اسأل عن السكر</text><text x="320" y="202" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="208" width="560" height="66" rx="12" fill="#fff" stroke="#dc2626" stroke-width="1.8"/><circle cx="576" cy="241" r="14" fill="#dc2626"/><text x="576" y="246" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="552" y="229" text-anchor="end" font-size="14" font-weight="800" fill="#dc2626">استبعد البدائل</text><text x="552" y="247" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">ساق واحدة؟ ألم شديد جداً؟ فكر في جلطة وريدية DVT (دوبلر) أو التهاب</text><text x="552" y="263" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">ناخر</text><text x="320" y="290" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="296" width="560" height="50" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.8"/><circle cx="576" cy="321" r="14" fill="#16a34a"/><text x="576" y="326" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="552" y="317" text-anchor="end" font-size="14" font-weight="800" fill="#16a34a">علاج</text><text x="552" y="335" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">مضاد حيوي (فموي أو وريدي) + رفع الطرف + مسكن + تتانوس عند اللزوم</text><text x="320" y="362" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="368" width="560" height="50" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><circle cx="576" cy="393" r="14" fill="#7c3aed"/><text x="576" y="398" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text><text x="552" y="389" text-anchor="end" font-size="14" font-weight="800" fill="#7c3aed">تابع خلال 24-48 ساعة</text><text x="552" y="407" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">تحسن؟ لو انتشر الاحمرار عن العلامة أو حرارة أو تدهور = تنويم/وريدي</text></svg>