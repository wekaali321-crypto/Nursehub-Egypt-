<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 326" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="326" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">أدوية السل الأربعة: أهم ما يُسأل عنه</text><rect x="516.0" y="44" width="104.0" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="568.0" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">الدواء</text><rect x="292.0" y="44" width="224.0" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="404.0" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">الأهم</text><rect x="20.0" y="44" width="272.0" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="156.0" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">أبلغ/علّم</text><rect x="516.0" y="74.5" width="104.0" height="63.5" fill="#fff" stroke="#cbd5e1"/><text direction="ltr" x="568.0" y="110.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Rifampin</text><rect x="292.0" y="74.5" width="224.0" height="63.5" fill="#fff" stroke="#cbd5e1"/><text x="404.0" y="101.8" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">بول ودموع وعرق وبلغم</text><text x="404.0" y="118.3" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">برتقالي/أحمر (طبيعي)</text><rect x="20.0" y="74.5" width="272.0" height="63.5" fill="#fff" stroke="#cbd5e1"/><text x="156.0" y="93.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">نظارة بدل العدسات؛ حبوب منع الحمل</text><text x="156.0" y="110.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تفشل فتحتاج وسيلة غير هرمونية؛</text><text x="156.0" y="126.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">راقب اليرقان</text><rect x="516.0" y="138" width="104.0" height="80.0" fill="#eef2ff" stroke="#cbd5e1"/><text direction="ltr" x="568.0" y="173.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Isoniazid</text><text direction="ltr" x="568.0" y="190.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">(INH)</text><rect x="292.0" y="138" width="224.0" height="80.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="404.0" y="165.3" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أكثر أدوية السل اختبارًا؛</text><text x="404.0" y="181.8" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">يعيق فيتامين B6 فيسبب اعتلال</text><text x="404.0" y="198.3" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أعصاب</text><rect x="20.0" y="138" width="272.0" height="80.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="156.0" y="157.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">فيتامين B6 25–50 مغ يوميًا؛ أبلغ</text><text x="156.0" y="173.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">عن خدر وتنميل وترنح؛ يرقان وبول</text><text x="156.0" y="190.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">داكن وتعب وارتفاع AST/ALT: احجب</text><text x="156.0" y="206.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الدواء وأبلغ؛ لا كحول</text><rect x="516.0" y="218" width="104.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text direction="ltr" x="568.0" y="245.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Pyrazinamide</text><rect x="292.0" y="218" width="224.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="404.0" y="237.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">سمّية كبد، ألم عضلات، طفح،</text><text x="404.0" y="253.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">ارتفاع حمض اليوريك</text><rect x="20.0" y="218" width="272.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="156.0" y="237.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">يُمنع مع النقرس والتلف الكبدي</text><text x="156.0" y="253.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الشديد؛ سؤاله نادر</text><rect x="516.0" y="265" width="104.0" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text direction="ltr" x="568.0" y="292.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Ethambutol</text><rect x="292.0" y="265" width="224.0" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="404.0" y="292.3" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">التهاب العصب البصري</text><rect x="20.0" y="265" width="272.0" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="156.0" y="284.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أبلغ عن تشوش الرؤية وتغير الألوان؛</text><text x="156.0" y="300.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">فحص عين أساسي ودوري</text></svg>