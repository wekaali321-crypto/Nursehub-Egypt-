<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 474" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="474" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الأنبوب الصدري: الحجرات الثلاث</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="182.2" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">1) حجرة التحكم بالشفط</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• فقاعات لطيفة مستمرة</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">ومنتظمة (كشفط مشروب</text><text x="612" y="135.4" text-anchor="start" font-size="13" fill="#0f172a">خفيف) وليست عنيفة</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="182.2" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="48" rx="10" fill="#0ea5e9"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">2) الختم المائي ومراقب</text><text x="408.66666666666663" y="91" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">تسرب الهواء</text><text x="408.66666666666663" y="118" text-anchor="start" font-size="13" fill="#0f172a">• تذبذب مع التنفس</text><text x="408.66666666666663" y="136.2" text-anchor="start" font-size="13" fill="#0f172a">(Tidaling) = جيد</text><text x="408.66666666666663" y="159.4" text-anchor="start" font-size="13" fill="#0f172a">• فقاعات مستمرة = سيئة</text><text x="408.66666666666663" y="177.6" text-anchor="start" font-size="13" fill="#0f172a">(تسرب هواء)</text><text x="408.66666666666663" y="200.8" text-anchor="start" font-size="13" fill="#0f172a">• توقف التذبذب قد يعني</text><text x="408.66666666666663" y="219" text-anchor="start" font-size="13" fill="#0f172a">إعادة تمدد الرئة</text><rect x="20" y="54" width="193.33333333333334" height="182.2" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">3) حجرة التجميع</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• أبلغ: دم أحمر فاتح أكثر من </text><text x="205.33333333333334" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">100 مل/س بعد أول ساعة</text><text x="205.33333333333334" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• دم داكن = طبيعي؛ وثّق</text><text x="205.33333333333334" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">وراقب</text><rect x="30" y="246.2" width="580" height="40" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.5"/><circle cx="578" cy="266.2" r="14" fill="#ef4444"/><text x="578" y="271.2" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="554" y="271.2" text-anchor="start" font-size="13.5" fill="#0f172a">إذا توقف أو قلّ التصريف: اسمع أصوات الرئة (نقص الأصوات = أولوية)</text><text x="320" y="297.2" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="300.2" width="580" height="40" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.5"/><circle cx="578" cy="320.2" r="14" fill="#f59e0b"/><text x="578" y="325.2" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="554" y="325.2" text-anchor="start" font-size="13.5" fill="#0f172a">اطلب من المريض السعال والتنفس العميق</text><text x="320" y="351.2" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="354.2" width="580" height="40" rx="10" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="578" cy="374.2" r="14" fill="#0ea5e9"/><text x="578" y="379.2" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="554" y="379.2" text-anchor="start" font-size="13.5" fill="#0f172a">غيّر وضع المريض</text><rect x="20" y="404.2" width="600" height="55" rx="10" fill="#6366f1" fill-opacity="0.13" stroke="#6366f1" stroke-width="1.5"/><text x="610" y="424.2" text-anchor="start" font-size="13.5" font-weight="800" fill="#6366f1">قاعدة</text><text x="610" y="444.2" text-anchor="start" font-size="13" fill="#0f172a">الأنظمة التي ليست متصلة بشفط: اجعل النظام أسفل مستوى الصدر دائمًا.</text></svg>
