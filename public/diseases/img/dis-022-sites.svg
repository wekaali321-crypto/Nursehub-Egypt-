<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="280" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أماكن حقن الإنسولين وتدوير المواضع</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="440" y="48" width="180" height="90" rx="12" fill="#dbeafe"/><text x="530" y="75" fill="#1e3a8a">البطن (الأسرع امتصاصاً)</text><text x="530" y="98" font-size="11" font-weight="400" fill="#1e3a8a">بعيداً عن السرة بـ 5 سم</text><text x="530" y="118" font-size="11" font-weight="400" fill="#1e3a8a">الأنسب قبل الوجبات</text>
    <rect x="230" y="48" width="180" height="90" rx="12" fill="#dcfce7"/><text x="320" y="75" fill="#14532d">الفخذ (الوجه الأمامي-الخارجي)</text><text x="320" y="98" font-size="11" font-weight="400" fill="#14532d">امتصاص أبطأ</text><text x="320" y="118" font-size="11" font-weight="400" fill="#14532d">للإنسولين المتوسط/الطويل</text>
    <rect x="20" y="48" width="180" height="90" rx="12" fill="#fef3c7"/><text x="110" y="75" fill="#78350f">الذراع (الخلفي-الخارجي)</text><text x="110" y="98" font-size="11" font-weight="400" fill="#78350f">امتصاص متوسط</text><text x="110" y="118" font-size="11" font-weight="400" fill="#78350f">صعب للحقن الذاتي</text>
  </g>
  <rect x="20" y="155" width="600" height="105" rx="12" fill="#fee2e2"/>
  <text x="610" y="182" text-anchor="start" font-size="14" font-weight="800" fill="#7f1d1d">قواعد التدوير:</text>
  <text x="610" y="206" text-anchor="start" font-size="13" fill="#7f1d1d">• غيّر الموضع كل مرة (ساعد ~2.5 سم عن الحقنة السابقة)</text>
  <text x="610" y="228" text-anchor="start" font-size="13" fill="#7f1d1d">• ما تحقنش في مكان متليف أو منتفخ (Lipodystrophy)</text>
  <text x="610" y="250" text-anchor="start" font-size="13" fill="#7f1d1d">• ما تدلكش مكان الحقن، وما تحقنش في مكان فيه كدمة أو التهاب</text>
</svg>
