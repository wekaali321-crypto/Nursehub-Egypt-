<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="356" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ليفوثيروكسين: LEVO وغيبوبة الوذمة المخاطية</text><rect x="325" y="48" width="295" height="84" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">L — مدى الحياة</text><text x="610" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">بدء بطيء 3–4 أسابيع حتى الراحة</text><rect x="20" y="48" width="295" height="84" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">E — الصباح الباكر</text><text x="305" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">معدة فارغة مرة يوميًا</text><text x="305" y="120" text-anchor="end" font-size="12.5" fill="#1e293b">ساعة قبل الفطور (ليس ليلًا)</text><rect x="325" y="142" width="295" height="64" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="142" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">V — فرط الدواء</text><text x="610" y="194" text-anchor="end" font-size="12.5" fill="#1e293b">أبلغ عن هياج وارتباك أو نبض/ضغط عالٍ</text><rect x="20" y="142" width="295" height="64" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><rect x="20" y="142" width="295" height="30" rx="12" fill="#9333ea"/><text x="167.5" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">O — آمن بالحمل</text><text x="305" y="194" text-anchor="end" font-size="12.5" fill="#1e293b">راجع الطبيب</text><rect x="325" y="216" width="295" height="124" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/><rect x="325" y="216" width="295" height="30" rx="12" fill="#dc2626"/><text x="472.5" y="237" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">محظور</text><text x="610" y="268" text-anchor="end" font-size="12.5" fill="#1e293b">لا يشفي بل يعوّض</text><text x="610" y="288" text-anchor="end" font-size="12.5" fill="#1e293b">لا تضاعف الجرعة الفائتة (خذها عند التذكر</text><text x="610" y="308" text-anchor="end" font-size="12.5" fill="#1e293b">فقط)</text><text x="610" y="328" text-anchor="end" font-size="12.5" fill="#1e293b">لا تتوقف فجأة: غيبوبة وذمة مخاطية</text>
</svg>
