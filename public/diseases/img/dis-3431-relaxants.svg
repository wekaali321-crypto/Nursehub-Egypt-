<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" width="640" height="342" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="مرخيات العضلات الهيكلية"><rect width="640" height="342" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">مرخيات العضلات الهيكلية</text><rect x="326.0" y="46" width="302.0" height="134" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الآلية والاستعمال</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• كثير منها لا يرخي العضلات مباشرة؛</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   تأثيرها قد يكون مهدئًا</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• Cyclobenzaprine: يؤثر على توتر العضلة</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">   ويقلل التشنج</text><text x="616.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• الشد العضلي وآلام الظهر الحادة</text><rect x="12.0" y="46" width="302.0" height="80" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="12.0" y="60" width="302.0" height="14" fill="#a86a00"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">آثار</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• نعاس، تهدئة، خمول، إمساك</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• إسهال، بطء/تسرع قلب، طفح</text><rect x="12.0" y="138" width="302.0" height="170" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="12.0" y="138" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="12.0" y="152" width="302.0" height="14" fill="#b42318"/><text x="163.0" y="157" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">موانع</text><text x="302.0" y="186" text-anchor="start" font-size="12.5" fill="#1d2939">• Baclofen: تشنج بسبب أمراض روماتيزمية</text><text x="302.0" y="204" text-anchor="start" font-size="12.5" fill="#1d2939">• Carisoprodol: حساسية meprobamate</text><text x="302.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• Cyclobenzaprine: احتشاء حديث، اضطراب</text><text x="302.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">   توصيل قلبي، فرط درقية، ومع MAOI خلال 14</text><text x="302.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">   يومًا</text><text x="302.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">• Dantrolene الفموي: الرضاعة، مرض كبد نشط،</text><text x="302.0" y="294" text-anchor="start" font-size="12.5" fill="#1d2939">   تشنج روماتيزمي</text><rect x="326.0" y="192" width="302.0" height="134" rx="10" fill="#efe9fb" stroke="#6a4bb5" stroke-width="1.2"/><rect x="326.0" y="192" width="302.0" height="28" rx="10" fill="#6a4bb5"/><rect x="326.0" y="206" width="302.0" height="14" fill="#6a4bb5"/><text x="477.0" y="211" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">تداخلات</text><text x="616.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• كحول/مهدئات/أفيونات: تثبيط أشد</text><text x="616.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• Cyclobenzaprine + MAOI: حمّى عالية</text><text x="616.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">   وتشنجات</text><text x="616.0" y="294" text-anchor="start" font-size="12.5" fill="#1d2939">• Orphenadrine + Haloperidol: ذهان أشد</text><text x="616.0" y="312" text-anchor="start" font-size="12.5" fill="#1d2939">• Tizanidine + خافضات الضغط: هبوط ضغط</text></svg>