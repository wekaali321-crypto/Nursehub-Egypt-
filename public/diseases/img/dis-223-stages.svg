<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="300" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مراحل الزهري عبر الزمن</text>
  <g text-anchor="middle" font-size="13" font-weight="700">
    <rect x="452" y="50" width="170" height="170" rx="12" fill="#ef4444"/><text x="537" y="78" fill="#fff" font-size="15">الأولية</text>
    <text x="537" y="104" fill="#fff" font-weight="400">قرحة صلبة بلا ألم (chancre)</text><text x="537" y="126" fill="#fff" font-weight="400">عدوى جداً</text><text x="537" y="150" fill="#fee2e2" font-weight="400">تظهر بعد عدوى 3 أسابيع تقريباً</text>
    <rect x="236" y="50" width="206" height="170" rx="12" fill="#f59e0b"/><text x="339" y="78" fill="#422006" font-size="15">الثانوية (بعد 4–8 أسابيع)</text>
    <text x="339" y="104" fill="#422006" font-weight="400">حمى، تضخم غدد، طفح</text><text x="339" y="126" fill="#422006" font-weight="400">الوجه والكفين والقدمين</text><text x="339" y="148" fill="#422006" font-weight="400">condylomata lata حول الشرج</text>
    <rect x="18" y="50" width="208" height="170" rx="12" fill="#7c3aed"/><text x="122" y="78" fill="#fff" font-size="15">الثالثية (بعد 2–20 سنة)</text>
    <text x="122" y="104" fill="#fff" font-weight="400">صمغ (gumma): جلد، عظام</text><text x="122" y="126" fill="#fff" font-weight="400">رئة وخصية (نادراً)</text><text x="122" y="148" fill="#fff" font-weight="400">جهاز عصبي وقلب بعد 10–20 سنة</text>
  </g>
  <text x="320" y="252" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">البنسلين (Benzathine penicillin) هو الدواء الأساسي في كل المراحل</text>
  <text x="320" y="276" text-anchor="middle" font-size="12" fill="#475569">الحمل: البنسلين فقط (لو حساسية: إزالة الحساسية ثم البنسلين)</text>
</svg>
