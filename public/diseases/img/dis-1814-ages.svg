<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="344" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">النمو والسلامة حسب الفئة العمرية</text><rect x="326.0" y="50" width="294.0" height="150" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="326.0" y="50" width="294.0" height="28" rx="10" fill="#ea580c"/><text x="473.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الدارج 1-3 سنوات</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• الطول 3 بوصات/سنة</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• الوزن +4-6 أرطال/سنة، ×4 عند 30 شهراً</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• الرأس +1 بوصة (2.5 سم) بالسنة الثانية</text><text x="610.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">ثم النصف حتى 5 سنوات</text><text x="610.0" y="164" font-size="12.5" fill="#0f172a" text-anchor="end">• الصدر أكبر من البطن عند سنتين</text><text x="610.0" y="181" font-size="12.5" fill="#0f172a" text-anchor="end">• حليب 16-24 أونصة وعصير 4-6 أونصة</text><rect x="20.0" y="50" width="294.0" height="150" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20.0" y="50" width="294.0" height="28" rx="10" fill="#16a34a"/><text x="167.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ما قبل المدرسة 3-6</text><text x="304.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• الطول 2-3 بوصات، الوزن +4.5-6.5 رطل</text><text x="304.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• نصف سعرات الكبار</text><text x="304.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• ساعة نشاط و12 ساعة نوم</text><text x="304.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• التفكير السحري</text><rect x="326.0" y="212" width="294.0" height="116" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="326.0" y="212" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="473.0" y="20" dy="212" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المدرسة 6-12</text><text x="610.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">• الطول 2 بوصة، الوزن +4.5-6.5 رطل</text><text x="610.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• لعب تنافسي وجماعي ونوم 9 ساعات</text><text x="610.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="end">• مقعد السيارة حتى 4 أقدام 9 بوصات</text><text x="610.0" y="309" font-size="12.5" fill="#0f172a" text-anchor="end">• لا سباحة وحيداً</text><rect x="20.0" y="212" width="294.0" height="116" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="20.0" y="212" width="294.0" height="28" rx="10" fill="#7c3aed"/><text x="167.0" y="20" dy="212" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المراهق 12-18</text><text x="304.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">• الأولاد يتوقفون 18-20 سنة</text><text x="304.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• البنات بعد الدورة بـ 2-2.5 سنة</text><text x="304.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="end">• بلوغ: البنات 10، الأولاد 12</text><text x="304.0" y="309" font-size="12.5" fill="#0f172a" text-anchor="end">• 16 سنة بلا دورة: إحالة</text></svg>