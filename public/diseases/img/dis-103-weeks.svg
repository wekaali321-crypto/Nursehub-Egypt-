<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="310" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مسار التيفود (الحمى المعوية) أسبوعاً بأسبوع</text><rect x="326" y="52" width="284" height="100" rx="12" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="468" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#854d0e">الأسبوع 1</text><text x="468" y="102" text-anchor="middle" font-size="12.5" fill="#854d0e">حرارة متصاعدة درجات</text><text x="468" y="119" text-anchor="middle" font-size="12.5" fill="#854d0e">صداع، تعب، فقدان شهية</text><text x="468" y="136" text-anchor="middle" font-size="12.5" fill="#854d0e">مزرعة الدم إيجابية</text><rect x="30" y="52" width="284" height="100" rx="12" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="172" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#9a3412">الأسبوع 2</text><text x="172" y="102" text-anchor="middle" font-size="12.5" fill="#9a3412">حرارة عالية ثابتة + نبض بطيء نسبياً</text><text x="172" y="119" text-anchor="middle" font-size="12.5" fill="#9a3412">طفح وردي (اليوم 5-7)</text><text x="172" y="136" text-anchor="middle" font-size="12.5" fill="#9a3412">Widal يبدأ يظهر</text><rect x="326" y="164" width="284" height="100" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/><text x="468" y="192" text-anchor="middle" font-size="14.5" font-weight="800" fill="#991b1b">الأسبوع 3</text><text x="468" y="214" text-anchor="middle" font-size="12.5" fill="#991b1b">خطر المضاعفات: نزيف معوي</text><text x="468" y="231" text-anchor="middle" font-size="12.5" fill="#991b1b">وثقب الأمعاء • هذيان</text><rect x="30" y="164" width="284" height="100" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="172" y="192" text-anchor="middle" font-size="14.5" font-weight="800" fill="#166534">الأسبوع 4</text><