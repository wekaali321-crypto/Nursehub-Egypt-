<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="290" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">إصابات العين: السائل الكيميائي مقابل الجسم الغارز</text><rect x="327" y="52" width="293" height="161.75" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M327 62a10 10 0 0 1 10-10h273a10 10 0 0 1 10 10v22h-293z" fill="#b91c1c"/><text x="473.5" y="73" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">جسم غارز (مثال: قلم في العين)</text><text x="610" y="98.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="98.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">غطِّ العينين كلتيهما بغطاء/كوبين واقيين</text><text x="610" y="119.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="119.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">العينان تتحركان معاً: تغطيتهما تمنع حركة</text><text x="598" y="137.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">العين المصابة</text><text x="610" y="158.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="158.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لا تغسل العين أبداً</text><text x="610" y="180" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="180" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لا تنزع الجسم أبداً: خطر نزف غزير</text><text x="610" y="201.125" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="201.125" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ثبّت الجسم، والجراح وحده ينزعه</text><rect x="20" y="52" width="293" height="161.75" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/><path d="M20 62a10 10 0 0 1 10-10h273a10 10 0 0 1 10 10v22h-293z" fill="#0e7490"/><text x="166.5" y="73" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">رذاذ/سائل كيميائي (منظف منزلي)</text><text x="303" y="98.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="291" y="98.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">غسل مستمر للعين بالماء/المحلول</text><text x="291" y="116.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">⁦(Continuous irrigation)⁩</text><text x="303" y="137.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="291" y="137.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ابدأ فوراً قبل أي شيء آخر</text><text x="303" y="158.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="291" y="158.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">سمّ الغسل مستمراً (⁦Chemical⁩ = ⁦Continuous⁩)</text><rect x="20" y="225.75" width="600" height="52" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="320" y="247.75" text-anchor="middle" font-size="14" font-weight="800" fill="#713f12">فخ الامتحان: لا تنزع ولا تغسل عند الجسم الغارز</text><text x="320" y="267.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#713f12">الإجراء الصحيح: تثبيت + تغطية العينين + تحويل للجراح</text></svg>