<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 382" width="640" height="382" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="مثبطات المناعة: Hydroxychloroquine وCyclosporine/Azathioprine"><rect width="640" height="382" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">مثبطات المناعة: Hydroxychloroquine وCyclosporine/Azathioprine</text><text x="320.0" y="54" text-anchor="middle" font-size="12.5" fill="#667085">الأثر المشترك: قلة البيض = عدوى، قلة الصفائح = نزف</text><rect x="326.0" y="68" width="302.0" height="152" rx="10" fill="#e0f5f3" stroke="#14756c" stroke-width="1.2"/><rect x="326.0" y="68" width="302.0" height="28" rx="10" fill="#14756c"/><rect x="326.0" y="82" width="302.0" height="14" fill="#14756c"/><text x="477.0" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Hydroxychloroquine</text><text x="616.0" y="116" text-anchor="start" font-size="12.5" fill="#1d2939">• أمراض المناعة الذاتية (مثل الذئبة)</text><text x="616.0" y="134" text-anchor="start" font-size="12.5" fill="#1d2939">• أخطر أثر: تلف الشبكية ومشاكل الرؤية</text><text x="616.0" y="152" text-anchor="start" font-size="12.5" fill="#1d2939">• فحص عيون منتظم كل 6–12 شهرًا</text><text x="616.0" y="170" text-anchor="start" font-size="12.5" fill="#1d2939">• تعليم: زيارة طبيب العيون مرة سنويًا على</text><text x="616.0" y="188" text-anchor="start" font-size="12.5" fill="#1d2939">   الأقل</text><text x="616.0" y="206" text-anchor="start" font-size="12.5" fill="#1d2939">• أبلغ عن أي تغير في الرؤية</text><rect x="12.0" y="68" width="302.0" height="134" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="12.0" y="68" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="12.0" y="82" width="302.0" height="14" fill="#2b6a9e"/><text x="163.0" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Cyclosporine / Azathioprine</text><text x="302.0" y="116" text-anchor="start" font-size="12.5" fill="#1d2939">• منع رفض الأعضاء المزروعة</text><text x="302.0" y="134" text-anchor="start" font-size="12.5" fill="#1d2939">• قبل الإعطاء: افحص WBC والصفائح</text><text x="302.0" y="152" text-anchor="start" font-size="12.5" fill="#1d2939">• بلّغ عن قلة البيض (أقل من 4000)</text><text x="302.0" y="170" text-anchor="start" font-size="12.5" fill="#1d2939">• راقب النزف</text><text x="302.0" y="188" text-anchor="start" font-size="12.5" fill="#1d2939">• لا حمل: وسيلة منع حمل</text><rect x="12.0" y="214" width="302.0" height="152" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="12.0" y="214" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="12.0" y="228" width="302.0" height="14" fill="#a86a00"/><text x="163.0" y="233" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">تثقيف المريض</text><text x="302.0" y="262" text-anchor="start" font-size="12.5" fill="#1d2939">• تجنّب الزحام</text><text x="302.0" y="280" text-anchor="start" font-size="12.5" fill="#1d2939">• لا لقاحات حية (الزوستر/الحزام الناري)</text><text x="302.0" y="298" text-anchor="start" font-size="12.5" fill="#1d2939">• فرشاة أسنان ناعمة</text><text x="302.0" y="316" text-anchor="start" font-size="12.5" fill="#1d2939">• لا تأخذ cyclosporine مع عصير الجريب فروت</text><text x="302.0" y="334" text-anchor="start" font-size="12.5" fill="#1d2939">• الدواء مدى الحياة، فحوص دم، نفس الوقت</text><text x="302.0" y="352" text-anchor="start" font-size="12.5" fill="#1d2939">   يوميًا</text><rect x="326.0" y="232" width="302.0" height="80" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="326.0" y="232" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="326.0" y="246" width="302.0" height="14" fill="#b42318"/><text x="477.0" y="251" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Cyclosporine: أثر جانبي مميز</text><text x="616.0" y="280" text-anchor="start" font-size="12.5" fill="#1d2939">• تضخم اللثة (Gingival hyperplasia)</text><text x="616.0" y="298" text-anchor="start" font-size="12.5" fill="#1d2939">• بلّغ عن أي علامة عدوى</text></svg>