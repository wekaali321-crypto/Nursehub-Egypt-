<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 429" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="429" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الرضيع 0-12 شهراً: النمو والفحص</text><rect x="326.0" y="50" width="294.0" height="184" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="326.0" y="50" width="294.0" height="28" rx="10" fill="#ea580c"/><text x="473.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">النمو</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="start">• الطول: بوصة (2.5 سم) شهرياً، +50% عند</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="start">12 شهراً</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="start">• الوزن يتضاعف عند 6 أشهر ويتضاعف 3 مرات</text><text x="610.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="start">عند 12 شهراً</text><text x="610.0" y="164" font-size="12.5" fill="#0f172a" text-anchor="start">• مثال: مولود 6 أرطال (2.7 كجم) ← 12</text><text x="610.0" y="181" font-size="12.5" fill="#0f172a" text-anchor="start">رطلاً (5.4 كجم) ← 18 رطلاً (8.2 كجم)</text><text x="610.0" y="198" font-size="12.5" fill="#0f172a" text-anchor="start">• أقل من ضعف الوزن عند 8 أشهر = تأخر نمو</text><text x="610.0" y="215" font-size="12.5" fill="#0f172a" text-anchor="start">(أبلغ)</text><rect x="20.0" y="50" width="294.0" height="184" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20.0" y="50" width="294.0" height="28" rx="10" fill="#16a34a"/><text x="167.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التغذية</text><text x="304.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="start">• حليب أم أو تركيبة مدعمة بالحديد (لا</text><text x="304.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="start">حليب بقر)</text><text x="304.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="start">• الأغذية الصلبة من 4-6 أشهر</text><text x="304.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="start">• طعام جديد واحد فقط أسبوعياً</text><rect x="326.0" y="246" width="294.0" height="167" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="326.0" y="246" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="473.0" y="20" dy="246" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الرأس والفونتانيل</text><text x="610.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="start">• منتفخ وهو ساكن: التهاب سحايا أو ارتفاع</text><text x="610.0" y="309" font-size="12.5" fill="#0f172a" text-anchor="start">ضغط الجمجمة</text><text x="610.0" y="326" font-size="12.5" fill="#0f172a" text-anchor="start">• غائر: جفاف</text><text x="610.0" y="343" font-size="12.5" fill="#0f172a" text-anchor="start">• الخلفي يُغلق بعمر شهرين، الأمامي 12-18</text><text x="610.0" y="360" font-size="12.5" fill="#0f172a" text-anchor="start">شهراً</text><text x="610.0" y="377" font-size="12.5" fill="#0f172a" text-anchor="start">• محيط الرأس أكبر قليلاً من الصدر</text><text x="610.0" y="394" font-size="12.5" fill="#0f172a" text-anchor="start">ويتساوى بعمر 12-18 شهراً</text><rect x="20.0" y="246" width="294.0" height="167" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="20.0" y="246" width="294.0" height="28" rx="10" fill="#7c3aed"/><text x="167.0" y="20" dy="246" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأسنان</text><text x="304.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="start">• أول سن 6-10 أشهر (القاطع الأوسط</text><text x="304.0" y="309" font-size="12.5" fill="#0f172a" text-anchor="start">السفلي)</text><text x="304.0" y="326" font-size="12.5" fill="#0f172a" text-anchor="start">• سيلان لعاب وانفعال</text><text x="304.0" y="343" font-size="12.5" fill="#0f172a" text-anchor="start">• تنظيف بقطعة قماش مبللة</text></svg>