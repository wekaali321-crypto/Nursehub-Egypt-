<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="330" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">مسار عدوى الـHIV بدون علاج: الفيروس (Viral load) وخلايا CD4</text>
  <line x1="60" y1="260" x2="600" y2="260" stroke="#64748b" stroke-width="2"/>
  <line x1="60" y1="50" x2="60" y2="260" stroke="#64748b" stroke-width="2"/>
  <line x1="60" y1="200" x2="600" y2="200" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="596" y="193" text-anchor="end" font-size="12" fill="#b91c1c" direction="ltr">CD4 = 200 / µL</text>
  <path d="M60 130 C 90 70, 110 70, 120 200 L 200 215 L 380 230 C 480 245, 540 255, 595 258" fill="none" stroke="#2563eb" stroke-width="3.5"/>
  <path d="M60 255 L 110 250 L 130 80 L 140 85 L 400 100 C 480 110,520 90,595 60" fill="none" stroke="#dc2626" stroke-width="3.5"/>
  <text x="170" y="228" font-size="13" font-weight="700" fill="#2563eb">خلايا CD4 (تنخفض)</text>
  <text x="430" y="82" font-size="13" font-weight="700" fill="#dc2626">كمية الفيروس (ترتفع في النهاية)</text>
  <g font-size="12" text-anchor="middle" fill="#0f172a">
   <rect x="64" y="272" width="100" height="40" rx="8" fill="#dbeafe"/><text x="114" y="289">عدوى أولية</text><text x="114" y="304" font-size="11">أسابيع</text>
   <rect x="170" y="272" width="230" height="40" rx="8" fill="#dcfce7"/><text x="285" y="289">مرحلة كامنة بلا أعراض (Asymptomatic)</text><text x="285" y="304" font-size="11">سنوات</text>
   <rect x="406" y="272" width="190" height="40" rx="8" fill="#fee2e2"/><text x="501" y="289">AIDS: عدوى انتهازية وأورام</text><text x="501" y="304" font-size="11">CD4 أقل من 200</text>
  </g>
</svg>
