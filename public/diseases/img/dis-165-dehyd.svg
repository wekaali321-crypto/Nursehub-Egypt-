<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="300" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">درجات الجفاف عند الطفل وخطة كل درجة</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="20" y="48" width="190" height="230" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="115" y="75" font-size="15" fill="#166534">لا جفاف (خطة A)</text>
    <rect x="225" y="48" width="190" height="230" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="320" y="75" font-size="15" fill="#854d0e">جفاف متوسط (خطة B)</text>
    <rect x="430" y="48" width="190" height="230" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="525" y="75" font-size="15" fill="#991b1b">جفاف شديد (خطة C)</text>
  </g>
  <g font-size="12.5" fill="#0f172a" text-anchor="middle">
    <text x="115" y="105">طفل نشيط، عيون عادية</text><text x="115" y="127">بيشرب عادي، دموع موجودة</text>
    <text x="115" y="149">قرصة الجلد ترجع فوراً</text>
    <text x="115" y="185" font-weight="700">العلاج في البيت</text><text x="115" y="207">سوائل أكتر + رضاعة + زنك</text><text x="115" y="229">+ أكل عادي + علامات الخطر</text>
    <text x="320" y="105">قلقان أو متضايق، عيون غايرة</text><text x="320" y="127">عطشان بيشرب بلهفة</text>
    <text x="320" y="149">قرصة الجلد ترجع ببطء</text>
    <text x="320" y="185" font-weight="700">ORS بإشراف تمريضي</text><text x="320" y="207">حوالي 75 مل/كجم على 4 ساعات</text><text x="320" y="229">ثم إعادة تقييم</text>
    <text x="525" y="105">خامل أو فاقد الوعي</text><text x="525" y="127">عيون غايرة جداً، مش قادر يشرب</text>
    <text x="525" y="149">قرصة الجلد ترجع ببطء شديد</text>
    <text x="525" y="185" font-weight="700">سوائل وريدية فوراً</text><text x="525" y="207">حسب أمر الطبيب وبروتوكول WHO</text><text x="525" y="229">ومراقبة لصيقة</text>
  </g>
  <text x="320" y="294" text-anchor="middle" font-size="11.5" fill="#475569">الأرقام للإرشاد حسب WHO/IMCI. القرار والجرعات بأمر الطبيب.</text>
</svg>
