<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 457" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="457" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الكسور: الأنواع والعلامات والأولويات</text><rect x="330" y="52" width="300" height="146.39999999999998" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">أنواع الكسور</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مغلق: الجلد سليم</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مفتوح (مركّب Compound): الجلد مكسور —</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  اسأل عن آخر تطعيم تيتانوس</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• كامل وغير كامل (الغصن الأخضر)</text><text x="620" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• حلزوني، مائل</text><text x="620" y="182.00000000000003" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• انضغاطي (Impact) وسحقي (Crush)</text><rect x="10" y="52" width="310" height="146.39999999999998" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأسباب وعوامل الخطر</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الراحة بالفراش الطويلة</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• هشاشة العظام</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الستيرويدات (-sone مثل بريدنيزون) — نقطة</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  امتحان</text><text x="310" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الإصابة (Trauma)</text><text x="310" y="182.00000000000003" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أثر الراحة: ضمور وفقد قوة العضلات</text><rect x="330" y="206.39999999999998" width="300" height="129.0" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M330,216.39999999999998 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#dc2626"/><text x="480.0" y="225.39999999999998" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلامات</text><text x="620" y="249.39999999999998" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ألم وتورم (كدمة)</text><text x="620" y="266.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• طقطقة عظمية (Crepitus)</text><text x="620" y="284.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تشنج عضلي</text><text x="620" y="301.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• نزيف داخلي (أولوية): هبوط ضغط، سرعة</text><text x="620" y="318.9999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  قلب، دم في البول</text><rect x="10" y="206.39999999999998" width="310" height="163.79999999999998" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M10,216.39999999999998 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#7c3aed"/><text x="165.0" y="225.39999999999998" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">أنواع خاصة</text><text x="310" y="249.39999999999998" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قاعدة الجمجمة: سائل مخي شوكي من الأنف</text><text x="310" y="266.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (Rhinorrhea) صافٍ</text><text x="310" y="284.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الفقرات T6 فأعلى: صدمة عصبية: هبوط ضغط،</text><text x="310" y="301.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  بطء قلب (أقل من 60)، جلد وردي وجاف</text><text x="310" y="318.9999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الفك: نزيف وسيلان لعاب، اشفط الفم</text><text x="310" y="336.39999999999986" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الورك: قِصر الساق، تشنج، كدمة بالفخذ، ألم</text><text x="310" y="353.79999999999984" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الأربية عند حمل الوزن</text><rect x="10" y="378.19999999999993" width="620" height="53.5" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="320" y="397.94999999999993" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7f1d1d">سؤال HESI: كسر الحوض — أخطر علامة تُبلَّغ هي هبوط الضغط مع سرعة القلب ودم في البول.</text></svg>