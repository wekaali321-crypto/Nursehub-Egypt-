<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="244" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">المراحل 2 و3 و4 من الولادة</text><rect x="426" y="46" width="193" height="152" rx="12" fill="#bae6fd"/><text x="522.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الثانية: الدفع</text><text x="522.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">محو 100% واتساع 10 سم</text><text x="522.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">رغبة قوية بالدفع وانعكاس فرجسون</text><text x="522.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">وضع: فاولر عالٍ، جانبي، قرفصاء</text><text x="522.5" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">لا حبس نفس: زفير ببطء</text><text x="522.5" y="176" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">نبض الجنين قبل وأثناء وبعد الانقباض</text><rect x="223" y="46" width="193" height="152" rx="12" fill="#bbf7d0"/><text x="319.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الثالثة: المشيمة</text><text x="319.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">لا تشدّي الحبل أبدًا</text><text x="319.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">خطر: عدوى، انقلاب رحم، نزف</text><text x="319.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">أوكسيتوسين بعد الولادة</text><text x="319.5" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">علامات النزف: ضغط يقل ونبض يزيد</text><rect x="20" y="46" width="193" height="152" rx="12" fill="#fde68a"/><text x="116.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الرابعة: التعافي 2–4 ساعات</text><text x="116.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">حرارة أكثر من 38 = عدوى</text><text x="116.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">فوطة مشبعة في أقل من ساعة</text><text x="116.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">الفندس أولًا ثم دلّكي الرخو</text><text x="116.5" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">تبوّل أو قسطرة، أوكسيتوسين</text><text x="116.5" y="176" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">فندس 3 مرات كل 5 د ثم كل 15 د</text><text x="320" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">الجلد للجلد والرضاعة يحفزان الأوكسيتوسين الطبيعي</text>
</svg>
