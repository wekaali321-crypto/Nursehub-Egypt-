<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 243" width="640" height="243" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="مثبطات المخاض: المقارنة"><rect width="640" height="243" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">مثبطات المخاض: المقارنة</text><rect x="10" y="48" width="620" height="28" rx="6" fill="#2b6a9e"/><text x="553.7704918032787" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الدواء</text><text x="375.90163934426226" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الاستعمال</text><text x="142.13114754098356" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ملاحظة</text><rect x="10" y="76" width="620" height="44" fill="#f4f8fc" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="95" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">Indomethacin</text><text x="623" y="112" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">(Indocin)</text><text x="470.54098360655735" y="95" text-anchor="start" font-size="12.5"  fill="#1d2939">ولادة مبكرة قبل 31 أسبوعًا</text><text x="267.2622950819672" y="95" text-anchor="start" font-size="12.5"  fill="#1d2939">NSAID يثبط البروستاجلاندينات؛</text><text x="267.2622950819672" y="112" text-anchor="start" font-size="12.5"  fill="#1d2939">الجرعات راجع البروتوكول</text><rect x="10" y="120" width="620" height="44" fill="#fff" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="139" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">Magnesium sulfate</text><text x="470.54098360655735" y="139" text-anchor="start" font-size="12.5"  fill="#1d2939">ولادة مبكرة + منع التشنج</text><text x="470.54098360655735" y="156" text-anchor="start" font-size="12.5"  fill="#1d2939">(إكلامبسيا)</text><text x="267.2622950819672" y="139" text-anchor="start" font-size="12.5"  fill="#1d2939">ضد الكالسيوم؛ جهّز كالسيوم جلوكونات</text><text x="267.2622950819672" y="156" text-anchor="start" font-size="12.5"  fill="#1d2939">ومطرقة منعكسات</text><rect x="10" y="164" width="620" height="44" fill="#f4f8fc" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="183" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">Terbutaline</text><text x="623" y="200" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">(Brethine)</text><text x="470.54098360655735" y="183" text-anchor="start" font-size="12.5"  fill="#1d2939">ولادة مبكرة</text><text x="267.2622950819672" y="183" text-anchor="start" font-size="12.5"  fill="#1d2939">ينشط بيتا 2؛ ينقص انقباض عضلة الرحم</text><rect x="10" y="208" width="620" height="27" fill="#fff" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="227" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">حاصرات الكالسيوم</text><text x="470.54098360655735" y="227" text-anchor="start" font-size="12.5"  fill="#1d2939">تأخير الولادة 24–48 ساعة</text><text x="267.2622950819672" y="227" text-anchor="start" font-size="12.5"  fill="#1d2939">تثبط عضلة الرحم الملساء</text></svg>