<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="260" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ليفوثيروكسين: قواعد الاستعمال</text>
<rect x="14.0" y="52" width="652.0" height="180.0" rx="10" fill="#0e7490" fill-opacity="0.1" stroke="#0e7490" stroke-width="1.2"/>
<rect x="14.0" y="52" width="652.0" height="26" rx="10" fill="#0e7490" fill-opacity="1" stroke="#0e7490" stroke-width="1.2"/>
<text x="340.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الدواء</text>
<text x="656.0" y="96" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• مدى الحياة وبداية تأثير بطيئة (3–4 أسابيع للراحة)</text>
<text x="656.0" y="116.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• صباحاً مبكراً على معدة فارغة مرة يومياً (ليس ليلاً)، قبل الفطور بساعة</text>
<text x="656.0" y="136.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• فرط الجرعة ("فرط درقي"): أبلغ عن هياج أو ارتباك أو نبض وضغط وحرارة مرتفعة</text>
<text x="656.0" y="156.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• آمن في الحمل</text>
<text x="656.0" y="176.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• لا يشفي المرض بل يعالجه</text>
<text x="656.0" y="196.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• لا مضاعفة الجرعة عند النسيان (خذها متى تذكرت، لا تضاعف)</text>
<text x="656.0" y="216.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• لا إيقاف مفاجئ: خطر غيبوبة وذمية</text>
</svg>
