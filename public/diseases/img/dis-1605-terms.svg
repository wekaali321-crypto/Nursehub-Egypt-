<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="336" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">عوامل توازن السوائل والمصطلحات الأساسية</text>
<rect x="14" y="44" width="612" height="80" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/><text x="320" y="68" text-anchor="middle" font-size="14" font-weight="800" fill="#713f12" >عوامل تؤثر على نسبة الماء بالجسم</text><rect x="24" y="80" width="142" height="34" rx="8" fill="#fff" stroke="#eab308" stroke-width="1.5"/><text x="95" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >العضلات (ماء أكثر)</text><rect x="174" y="80" width="142" height="34" rx="8" fill="#fff" stroke="#eab308" stroke-width="1.5"/><text x="245" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >الدهون (ماء أقل)</text><rect x="324" y="80" width="142" height="34" rx="8" fill="#fff" stroke="#eab308" stroke-width="1.5"/><text x="395" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >الجنس (الرجال أكثر)</text><rect x="474" y="80" width="142" height="34" rx="8" fill="#fff" stroke="#eab308" stroke-width="1.5"/><text x="545" y="102" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >العمر</text><rect x="14" y="134" width="148" height="122" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><rect x="14" y="134" width="148" height="28" rx="10" fill="#0369a1"/><text x="88" y="153" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >الأسموزية</text><text x="88" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" >انتقال الماء من التر</text><text x="88" y="200" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" >كيز الأقل للأعلى للم</text><text x="88" y="218" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" >ساواة</text><rect x="168" y="134" width="148" height="122" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><rect x="168" y="134" width="148" height="28" rx="10" fill="#16a34a"/><text x="242" y="153" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >الانتشار</text><text x="242" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" >انتقال المذاب من الأ</text><text x="242" y="200" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" >على للأقل</text><rect x="322" y="134" width="148" height="122" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><rect x="322" y="134" width="148" height="28" rx="10" fill="#ea580c"/><text x="396" y="153" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >الترشيح</text><text x="396" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" >انتقال ماء ومذاب من </text><text x="396" y="200" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" >ضغط عالٍ لمنخفض (الك</text><text x="396" y="218" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" >لى)</text><rect x="476" y="134" width="148" height="122" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><rect x="476" y="134" width="148" height="28" rx="10" fill="#7c3aed"/><text x="550" y="153" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >الأسمولالية</text><text x="550" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" >تركيز المحلول: أعلى </text><text x="550" y="200" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" >= أثقل وأكثر مذاب</text><rect x="14" y="266" width="612" height="56" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/><text x="320" y="288" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a" >أسمولالية الدم 270–300 mOsm/kg: متساوي التوتر (Isotonic)</text><text x="320" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="#475569" >أكبر من 300 = مرتفع التوتر | أقل من 270–300 = منخفض التوتر</text>
</svg>
