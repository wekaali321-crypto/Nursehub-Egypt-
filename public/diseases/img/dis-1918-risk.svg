<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="322" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">RSV: من هم الأكثر عرضة؟ وما أولوية التمريض</text><rect x="325" y="48" width="295" height="124" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">عوامل الخطر</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">خدّج (ولادة مبكرة)</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">رضع أقل من 6 أشهر</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">عيوب قلب خلقية</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">أمراض تنفسية أو عصبية عضلية</text><rect x="20" y="48" width="295" height="124" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الأعراض</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">رشح وسعال جاف والتهاب حلق</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">حمى خفيفة أقل من 100.4°ف (38°م)</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">صفير وخفقان أنف وتنفس قصير سريع</text><rect x="325" y="182" width="295" height="124" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="182" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="203" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">أولوية التمريض</text><text x="610" y="234" text-anchor="start" font-size="12.5" fill="#1e293b">المجرى الهوائي أولًا (#1)</text><text x="610" y="254" text-anchor="start" font-size="12.5" fill="#1e293b">قطرات ملح + سرنجة شفط الأنف قبل النوم</text><text x="610" y="274" text-anchor="start" font-size="12.5" fill="#1e293b">والرضاعة</text><text x="610" y="294" text-anchor="start" font-size="12.5" fill="#1e293b">لا توقف الرضاعة الطبيعية (السوائل ضرورية)</text><rect x="20" y="182" width="295" height="124" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><rect x="20" y="182" width="295" height="30" rx="12" fill="#9333ea"/><text x="167.5" y="203" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الوقاية</text><text x="305" y="234" text-anchor="start" font-size="12.5" fill="#1e293b">باليفيزوماب (Palivizumab) يمنع عدوى RSV</text><text x="305" y="254" text-anchor="start" font-size="12.5" fill="#1e293b">غسل الأيدي: ينتقل بالتلامس المباشر وغير</text><text x="305" y="274" text-anchor="start" font-size="12.5" fill="#1e293b">المباشر</text>
</svg>
