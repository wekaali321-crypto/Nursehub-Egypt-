<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="300" rx="16" fill="#f8fafc"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="320" y="26" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">خريطة أسباب الإغماء حسب النبض (Syncope)</text><rect x="240" y="40" width="160" height="34" rx="10" fill="#0f172a" stroke="none"/><text x="320" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">افحص النبض أولاً</text><rect x="20" y="100" width="170" height="60" rx="10" fill="#dc2626" stroke="none"/><text x="105" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">بطء (أقل من 60)</text><text x="105" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">غالباً Vasovagal / حصار قلب</text><rect x="235" y="100" width="170" height="60" rx="10" fill="#16a34a" stroke="none"/><text x="320" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">طبيعي (60–100)</text><text x="320" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">اسمع القلب</text><rect x="450" y="100" width="170" height="60" rx="10" fill="#ea580c" stroke="none"/><text x="535" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">سريع (أكتر من 100)</text><text x="535" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">منتظم أو غير منتظم</text><line x1="320" y1="74" x2="105" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><line x1="320" y1="74" x2="320" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><line x1="320" y1="74" x2="535" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="20" y="180" width="170" height="95" rx="10" fill="#fee2e2" stroke="none"/><text x="105" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">45–60: Vasovagal (الأشهر)</text><text x="105" y="220" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">أقل من 45: حصار قلب</text><text x="105" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">لا نبض = ابدأ CPR</text><rect x="235" y="180" width="170" height="95" rx="10" fill="#dcfce7" stroke="none"/><text x="320" y="198" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">لغط: تضيق/قصور أبهر،</text><text x="320" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">عيوب خلقية زرقاء</text><text x="320" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">شحوب: أنيميا/نزيف</text><text x="320" y="250" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">عصبي بؤري: TIA/هبوط سكر</text><text x="320" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">غير ذلك: هستيريا، وضعي...</text><rect x="450" y="180" width="170" height="95" rx="10" fill="#ffedd5" stroke="none"/><text x="535" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">منتظم: SVT، VT،</text><text x="535" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">إجهاد/ضربة شمس</text><text x="535" y="243" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">غير منتظم: رجفان أذيني</text></svg>