<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">عائلة البنسلينات: 4 مجموعات</text>
<g font-size="13" text-anchor="middle">
<rect x="450" y="48" width="170" height="100" rx="10" fill="#dbeafe"/><text x="535" y="72" font-weight="800" fill="#0f172a">1) طبيعية</text><text x="535" y="94" fill="#334155">Benzyl PG · Benzathine</text><text x="535" y="112" fill="#334155">Penicillin V</text><text x="535" y="134" fill="#1d4ed8" font-size="11">Gram+ فقط · لا تقتل Staph</text>
<rect x="240" y="48" width="200" height="100" rx="10" fill="#dcfce7"/><text x="340" y="72" font-weight="800" fill="#0f172a">2) مقاومة للـ penicillinase</text><text x="340" y="94" fill="#334155">Cloxacillin · Dicloxacillin</text><text x="340" y="112" fill="#334155">Flucloxacillin · Methicillin</text><text x="340" y="134" fill="#15803d" font-size="11">Anti-Staph (تُباع في تراكيب)</text>
<rect x="20" y="48" width="210" height="100" rx="10" fill="#fef9c3"/><text x="125" y="72" font-weight="800" fill="#0f172a">3) واسعة الطيف</text><text x="125" y="94" fill="#334155">Ampicillin · Amoxicillin</text><text x="125" y="134" fill="#a16207" font-size="11">Gram+ و Gram- (لم تعد تُستخدم لوحدها)</text>
<rect x="20" y="168" width="600" height="100" rx="10" fill="#fee2e2"/><text x="320" y="192" font-weight="800" fill="#0f172a">4) ممتدة الطيف = واسعة + مثبط البنسلينيز (الأشهر في الممارسة)</text>
<text x="320" y="216" fill="#334155">Ampicillin + Sulbactam (Unasyn) · Amoxicillin + Clavulanic (Augmentin)</text><text x="320" y="238" fill="#334155">Piperacillin + Tazobactam (Tazocin) · + تراكيب Flucloxacillin / Cloxacillin / Dicloxacillin</text><text x="320" y="258" fill="#b91c1c" font-size="11">ممتازة للتنفس العلوي والأذن والجيوب</text></g></svg>