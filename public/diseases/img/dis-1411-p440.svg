<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 364" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="364" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">انقطاع التنفس الانسدادي أثناء النوم (OSA)</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="173.2" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#f59e0b"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الأعراض</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• نهارًا: صداع صباحي،</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">نعاس نهاري، إرهاق مزمن،</text><text x="612" y="135.4" text-anchor="start" font-size="13" fill="#0f172a">تهيّج وتقلب المزاج</text><text x="612" y="153.6" text-anchor="start" font-size="13" fill="#0f172a">واكتئاب</text><text x="612" y="176.8" text-anchor="start" font-size="13" fill="#0f172a">• ليلًا: شخير ونوبات</text><text x="612" y="195" text-anchor="start" font-size="13" fill="#0f172a">انقطاع تنفس</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="173.2" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الأسباب</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• سمنة</text><text x="408.66666666666663" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• مهدئات قبل النوم</text><text x="408.66666666666663" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">(بنزوديازيبينات،</text><text x="408.66666666666663" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">أفيونات)</text><text x="408.66666666666663" y="181.8" text-anchor="start" font-size="13" fill="#0f172a">• كحول</text><rect x="20" y="54" width="193.33333333333334" height="173.2" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">التثقيف</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• إنقاص الوزن والتمارين</text><text x="205.33333333333334" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• قلل الكحول</text><text x="205.33333333333334" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• لا قيلولة نهارًا</text><text x="205.33333333333334" y="168.6" text-anchor="start" font-size="13" fill="#0f172a">• لا مهدئات عند النوم</text><text x="205.33333333333334" y="191.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">• لا وجبات خفيفة قبل</text><text x="205.33333333333334" y="209.99999999999997" text-anchor="start" font-size="13" fill="#0f172a">النوم</text><rect x="20" y="237.2" width="600" height="112" rx="10" fill="#0ea5e9" fill-opacity="0.13" stroke="#0ea5e9" stroke-width="1.5"/><text x="610" y="257.2" text-anchor="start" font-size="13.5" font-weight="800" fill="#0ea5e9">CPAP</text><text x="610" y="277.2" text-anchor="start" font-size="13" fill="#0f172a">الجهاز CPAP يدفع هواءً بضغط مستمر عبر قناع إلى الأنف والفم ليمنع انهيار</text><text x="610" y="296.2" text-anchor="start" font-size="13" fill="#0f172a">البلعوم واللسان. إن انخفض تأكسج مريض على CPAP: أول إجراء افحص إحكام الأحزمة</text><text x="610" y="315.2" text-anchor="start" font-size="13" fill="#0f172a">والقناع. عدم الالتزام بـCPAP: انتقل إلى BiPAP (أكثر راحة لأنه يوافق ضغط</text><text x="610" y="334.2" text-anchor="start" font-size="13" fill="#0f172a">الزفير).</text></svg>
