<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">نوبة التيتراد (Tet spell): الترتيب</text><rect x="20" y="48" width="600" height="58" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><circle cx="596" cy="68" r="13" fill="#2563eb"/><text x="596" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="570" y="73" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">وضع الركبتين على الصدر</text><text x="570" y="94" text-anchor="end" font-size="12.5" fill="#334155">الرضيع: ركب للصدر، الأكبر: وضع القرفصاء</text><text x="320" y="120" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="126" width="600" height="58" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><circle cx="596" cy="146" r="13" fill="#16a34a"/><text x="596" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="570" y="151" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">هدّئ الطفل وبيئة هادئة</text><text x="570" y="172" text-anchor="end" font-size="12.5" fill="#334155">بكاؤه يزيد النوبة</text><text x="320" y="198" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="204" width="600" height="58" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><circle cx="596" cy="224" r="13" fill="#ea580c"/><text x="596" y="229" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="570" y="229" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">أكسجين 100%</text><text x="570" y="250" text-anchor="end" font-size="12.5" fill="#334155">بحسب الأمر/البروتوكول</text><text x="320" y="276" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="282" width="600" height="58" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><circle cx="596" cy="302" r="13" fill="#9333ea"/><text x="596" y="307" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="570" y="307" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">سوائل وريدية</text><text x="570" y="328" text-anchor="end" font-size="12.5" fill="#334155">تزيد الحجم الدموي</text><text x="320" y="354" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="360" width="600" height="58" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/><circle cx="596" cy="380" r="13" fill="#dc2626"/><text x="596" y="385" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="570" y="385" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">مورفين بأمر الطبيب</text><text x="570" y="406" text-anchor="end" font-size="12.5" fill="#334155">يهدئ ويخفف التنفس السريع</text><text x="320" y="432" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="438" width="600" height="58" rx="12" fill="#fff" stroke="#0891b2" stroke-width="2"/><circle cx="596" cy="458" r="13" fill="#0891b2"/><text x="596" y="463" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6</text><text x="570" y="463" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">وثّق وأبلغ</text><text x="570" y="484" text-anchor="end" font-size="12.5" fill="#334155">ثم قيّم الاستجابة</text>
</svg>
