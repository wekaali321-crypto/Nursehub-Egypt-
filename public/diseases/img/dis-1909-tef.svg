<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 208" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="208" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ناسور القصبة والمريء (TEF) ورتق المريء (EA)</text><rect x="325" y="48" width="295" height="144" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الفكرة</text><text x="610" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">TEF: اتصال غير طبيعي بين المريء والقصبة</text><text x="610" y="120" text-anchor="end" font-size="12.5" fill="#1e293b">الهوائية فخطر الاستنشاق</text><text x="610" y="140" text-anchor="end" font-size="12.5" fill="#1e293b">EA: انقسام المريء لجزئين غير متصلين</text><text x="610" y="160" text-anchor="end" font-size="12.5" fill="#1e293b">غالبًا يحدثان معًا</text><rect x="20" y="48" width="295" height="144" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">العلامات والتدخل</text><text x="305" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">اختناق وسعال وزرقة أثناء الرضاعة</text><text x="305" y="120" text-anchor="end" font-size="12.5" fill="#1e293b">إفرازات فموية غزيرة بعد الولادة</text><text x="305" y="140" text-anchor="end" font-size="12.5" fill="#1e293b">أوقف الرضاعة ثم اشفط الفم</text><text x="305" y="160" text-anchor="end" font-size="12.5" fill="#1e293b">الجزء العلوي ينتهي أعمى والسفلي متصل</text><text x="305" y="180" text-anchor="end" font-size="12.5" fill="#1e293b">بالقصبة</text>
</svg>
