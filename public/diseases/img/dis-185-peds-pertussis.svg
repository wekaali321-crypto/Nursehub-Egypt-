dth="295" height="30" rx="12" fill="#9333ea"/><text x="167.5" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">العلاج</text><text x="305" y="242" text-anchor="start" font-size="12.5" fill="#1e293b">احتياطات رذاذية: كمامة ونظارة، غرفة خاصة</text><text x="305" y="262" text-anchor="start" font-size="12.5" fill="#1e293b">(وليس ضغط سالب)</text><text x="305" y="282" text-anchor="start" font-size="12.5" fill="#1e293b">راقب انسداد المجرى</text><text x="305" y="302" text-anchor="start" font-size="12.5" fill="#1e293b">أزيثرومايسين</text><text x="305" y="322" text-anchor="start" font-size="12.5" fill="#1e293b">أكسجين رطب وشفط وسوائل صغيرة متكررة</text><text x="305" y="342" text-anchor="start" font-size="12.5" fill="#1e293b">تشخيص: مسحة أنف/حلق ودم</text>
