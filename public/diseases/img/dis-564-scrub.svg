<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="285" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">خطوات التعقيم الجراحي لليدين (Surgical scrub)</text><rect x="430" y="50" width="190" height="105" rx="12" fill="#fff" stroke="#cbd5e1"/><circle cx="598" cy="72" r="14" fill="#0ea5e9"/><text x="598" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="578" y="78" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">جهّز نفسك</text><text x="578" y="100" text-anchor="end" font-size="12" font-weight="400" fill="#475569">يدين وساعدين مكشوفة</text><text x="578" y="122" text-anchor="end" font-size="12" font-weight="400" fill="#475569">فوق الكوع تماماً</text><rect x="230" y="50" width="190" height="105" rx="12" fill="#fff" stroke="#cbd5e1"/><circle cx="398" cy="72" r="14" fill="#0ea5e9"/><text x="398" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="378" y="78" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">اقف بعيداً قليلاً</text><text x="378" y="100" text-anchor="end" font-size="12" font-weight="400" fill="#475569">عن الحوض، اليدين</text><text x="378" y="122" text-anchor="end" font-size="12" font-weight="400" fill="#475569">فوق مستوى الكوع</text><rect x="30" y="50" width="190" height="105" rx="12" fill="#fff" stroke="#cbd5e1"/><circle cx="198" cy="72" r="14" fill="#0ea5e9"/><text x="198" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="178" y="78" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">افتح الماء الدافئ</text><text x="178" y="100" text-anchor="end" font-size="12" font-weight="400" fill="#475569">ودعه ينساب من اليد</text><text x="178" y="122" text-anchor="end" font-size="12" font-weight="400" fill="#475569">إلى الكوع</text><rect x="430" y="165" width="190" height="105" rx="12" fill="#fff" stroke="#cbd5e1"/><circle cx="598" cy="187" r="14" fill="#0ea5e9"/><text x="598" y="192" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="578" y="193" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">فرشة الأظافر</text><text x="578" y="215" text-anchor="end" font-size="12" font-weight="400" fill="#475569">نظّف تحت الأظافر</text><rect x="230" y="165" width="190" height="105" rx="12" fill="#fff" stroke="#cbd5e1"/><circle cx="398" cy="187" r="14" fill="#0ea5e9"/><text x="398" y="192" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text><text x="378" y="193" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">محلول معقم</text><text x="378" y="215" text-anchor="end" font-size="12" font-weight="400" fill="#475569">(غالباً بيتادين)</text><text x="378" y="237" text-anchor="end" font-size="12" font-weight="400" fill="#475569">بالضغط بالكوع</text><rect x="30" y="165" width="190" height="105" rx="12" fill="#fff" stroke="#cbd5e1"/><circle cx="198" cy="187" r="14" fill="#0ea5e9"/><text x="198" y="192" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">6</text><text x="178" y="193" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">افرك 2 دقيقة</text><text x="178" y="215" text-anchor="end" font-size="12" font-weight="400" fill="#475569">من اليد للكوع</text><text x="178" y="237" text-anchor="end" font-size="12" font-weight="400" fill="#475569">وكرر العملية</text></svg>