<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="260" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">فحص الحدقة في أي نزلة معوية</text>
<g text-anchor="middle" font-size="13">
<circle cx="500" cy="115" r="55" fill="#fff" stroke="#475569" stroke-width="3"/><circle cx="500" cy="115" r="38" fill="#0f172a"/><text x="500" y="195" font-weight="800" fill="#991b1b">متوسعة ثابتة</text><text x="500" y="217" fill="#334155">فسيخ (Botulism)</text><text x="500" y="237" fill="#334155">Ptosis + ضعف + No gag</text>
<circle cx="320" cy="115" r="55" fill="#fff" stroke="#475569" stroke-width="3"/><circle cx="320" cy="115" r="9" fill="#0f172a"/><text x="320" y="195" font-weight="800" fill="#991b1b">ضيقة (Pinpoint)</text><text x="320" y="217" fill="#334155">مبيدات فوسفورية</text><text x="320" y="237" fill="#334155">لعاب ودموع وتبول</text>
<circle cx="140" cy="115" r="55" fill="#fff" stroke="#475569" stroke-width="3"/><circle cx="140" cy="115" r="22" fill="#0f172a"/><text x="140" y="195" font-weight="800" fill="#166534">طبيعية</text><text x="140" y="217" fill="#334155">نزلة أولية غالباً</text><text x="140" y="237" fill="#334155">(قرص الغلة: اسأل التاريخ)</text>
</g></svg>
