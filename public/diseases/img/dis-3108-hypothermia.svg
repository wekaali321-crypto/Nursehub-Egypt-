<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="520" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">انخفاض حرارة الجسم: الأولويات والتدفئة</text>
  <rect x="20" y="50" width="600" height="70" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="320" y="80" text-anchor="middle" font-size="16" font-weight="800" fill="#1e3a8a">الحرارة المركزية أقل من 35°م (95°ف)</text><text x="320" y="104" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">تتباطأ الأعضاء وينهك عضل القلب فيحدث رجفان بطيني (VF)</text><rect x="330" y="135" width="290" height="170" rx="10" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="157" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">الأولوية الأولى (A-B-C)</text><text x="608" y="181" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• المجرى الهوائي: توقع التهوية الميكانيكية</text><text x="608" y="207" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• الدورة: صل جهاز مراقبة القلب</text><text x="608" y="233" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• توقع الحاجة لإزالة الرجفان</text><rect x="20" y="135" width="290" height="170" rx="10" fill="#fef9c3" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="157" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">العلامات</text><text x="298" y="181" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• نبض ضعيف خيطي</text><text x="298" y="207" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• أزيز (تشنج قصبي)</text><text x="298" y="233" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• خراخر بقاعدة الرئتين (وذمة رئة)</text><text x="298" y="259" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• جلد شديد البرودة</text><rect x="20" y="320" width="290" height="185" rx="10" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="342" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">التدفئة السلبية (2)</text><text x="298" y="366" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• انزع الملابس المبللة</text><text x="298" y="392" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• بطانيات دافئة جافة ومصدر حرارة خارجي</text><text x="298" y="418" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• غطِّ الرأس والجذع</text><rect x="330" y="320" width="290" height="185" rx="10" fill="#ede9fe" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="342" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">التدفئة الداخلية الفعالة</text><text x="608" y="366" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• سوائل وريدية دافئة عبر خطين كبيرين</text><text x="608" y="392" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• أدفئ الجذع قبل الأطراف</text><text x="608" y="418" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• تعامل برفق (خطر VF)</text>
</svg>
