<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 576" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="576" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الشفط وVAP لمريض التنفس الصناعي</text><rect x="30" y="54" width="580" height="40" rx="10" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="578" cy="74" r="14" fill="#0ea5e9"/><text x="578" y="79" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="554" y="79" text-anchor="start" font-size="13.5" fill="#0f172a">الشفط يكون أثناء السحب فقط: لا تطبق الشفط أثناء إدخال القسطرة</text><text x="320" y="105" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="108" width="580" height="40" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.5"/><circle cx="578" cy="128" r="14" fill="#f59e0b"/><text x="578" y="133" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="554" y="133" text-anchor="start" font-size="13.5" fill="#0f172a">لا يزيد الشفط عن 10 ثوان</text><text x="320" y="159" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="162" width="580" height="40" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="1.5"/><circle cx="578" cy="182" r="14" fill="#10b981"/><text x="578" y="187" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="554" y="187" text-anchor="start" font-size="13.5" fill="#0f172a">أكسجين 100% قبل الشفط بـ30 ثانية</text><text x="320" y="213" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="216" width="580" height="40" rx="10" fill="#6366f1" fill-opacity="0.14" stroke="#6366f1" stroke-width="1.5"/><circle cx="578" cy="236" r="14" fill="#6366f1"/><text x="578" y="241" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="554" y="241" text-anchor="start" font-size="13.5" fill="#0f172a">لا تشفط قبل سحب غازات الدم (ABG) بنحو 20 دقيقة</text><text x="320" y="267" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="270" width="580" height="54" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.5"/><circle cx="578" cy="297" r="14" fill="#ef4444"/><text x="578" y="302" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">5</text><text x="554" y="292" text-anchor="start" font-size="13.5" fill="#0f172a">لا تشفط روتينيًا (إصابة رئة)؛ فقط عند الحاجة (مثلًا هبوط الأكسجة</text><text x="554" y="311.575" text-anchor="start" font-size="13.5" fill="#0f172a">بسبب زيادة الإفرازات)</text><rect x="426.66666666666663" y="334" width="193.33333333333334" height="227.79999999999998" rx="10" fill="#14b8a6" fill-opacity="0.1" stroke="#14b8a6" stroke-width="1.5"/><rect x="426.66666666666663" y="334" width="193.33333333333334" height="29" rx="10" fill="#14b8a6"/><text x="612" y="352" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الوقاية من VAP</text><text x="612" y="379" text-anchor="start" font-size="13" fill="#0f172a">• إيقاف المهدئ يوميًا</text><text x="612" y="397.2" text-anchor="start" font-size="13" fill="#0f172a">وبروتوكول الفطام</text><text x="612" y="420.4" text-anchor="start" font-size="13" fill="#0f172a">• رفع الرأس 30–45°</text><text x="612" y="443.59999999999997" text-anchor="start" font-size="13" fill="#0f172a">• عناية فموية</text><text x="612" y="461.79999999999995" text-anchor="start" font-size="13" fill="#0f172a">بـchlorhexidine كل</text><text x="612" y="479.99999999999994" text-anchor="start" font-size="13" fill="#0f172a">ساعتين</text><text x="612" y="503.19999999999993" text-anchor="start" font-size="13" fill="#0f172a">• تغيير الوضع جانبيًا كل</text><text x="612" y="521.4" text-anchor="start" font-size="13" fill="#0f172a">ساعتين</text><text x="612" y="544.5999999999999" text-anchor="start" font-size="13" fill="#0f172a">• غسل اليدين</text><rect x="223.33333333333331" y="334" width="193.33333333333334" height="227.79999999999998" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="223.33333333333331" y="334" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="408.66666666666663" y="352" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">مؤشرات VAP</text><text x="408.66666666666663" y="379" text-anchor="start" font-size="13" fill="#0f172a">• بلغم موجب الزرع</text><text x="408.66666666666663" y="402.2" text-anchor="start" font-size="13" fill="#0f172a">• حمى أكثر من 38°م</text><text x="408.66666666666663" y="425.4" text-anchor="start" font-size="13" fill="#0f172a">• ارتشاح جديد بالأشعة</text><rect x="20" y="334" width="193.33333333333334" height="227.79999999999998" rx="10" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="1.5"/><rect x="20" y="334" width="193.33333333333334" height="29" rx="10" fill="#ec4899"/><text x="205.33333333333334" y="352" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">التغذية</text><text x="205.33333333333334" y="379" text-anchor="start" font-size="13" fill="#0f172a">• أنبوب أنفي معدي: لا</text><text x="205.33333333333334" y="397.2" text-anchor="start" font-size="13" fill="#0f172a">وجبات دفعة واحدة (bolus)</text><text x="205.33333333333334" y="420.4" text-anchor="start" font-size="13" fill="#0f172a">• قرحة الإجهاد المعدية</text><text x="205.33333333333334" y="438.59999999999997" text-anchor="start" font-size="13" fill="#0f172a">مضاعفة للتنفس الطويل</text></svg>
