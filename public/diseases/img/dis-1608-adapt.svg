<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="420" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تكيفات الخلية: ضمور، تضخم، فرط تنسج، استحالة، خلل تنسج، ورم</text>
<rect x="14" y="44" width="148" height="200" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="1.5"/><rect x="14" y="44" width="148" height="32" rx="10" fill="#0ea5e9"/><text x="88" y="65" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" >ضمور Atrophy</text><text x="88" y="100" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a" >نقص حجم الخلايا/العضو</text><text x="88" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b" >مثال:</text><text x="88" y="170" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" >مريض طريح الفراش: </text><text x="88" y="188" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" >ضمور عضلات</text><rect x="168" y="44" width="148" height="200" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><rect x="168" y="44" width="148" height="32" rx="10" fill="#16a34a"/><text x="242" y="65" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" >تضخم Hypertrophy</text><text x="242" y="100" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a" >زيادة حجم الخلايا</text><text x="242" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b" >مثال:</text><text x="242" y="170" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" >تضخم البطين الأيسر</text><text x="242" y="188" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" > في فشل القلب</text><rect x="322" y="44" width="148" height="200" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/><rect x="322" y="44" width="148" height="32" rx="10" fill="#f59e0b"/><text x="396" y="65" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" >فرط تنسج Hyperplasia</text><text x="396" y="100" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a" >زيادة عدد الخلايا</text><text x="396" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b" >مثال:</text><text x="396" y="170" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" >تضخم البروستاتا ال</text><text x="396" y="188" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" >حميد BPH</text><rect x="476" y="44" width="148" height="200" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><rect x="476" y="44" width="148" height="32" rx="10" fill="#7c3aed"/><text x="550" y="65" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" >استحالة Metaplasia</text><text x="550" y="100" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a" >خلية تتحول لنوع آخر</text><text x="550" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b" >مثال:</text><text x="550" y="170" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" >تغير مجرى الهواء م</text><text x="550" y="188" text-anchor="middle" font-size="11" font-weight="600" fill="#334155" >ع التدخين</text><rect x="14" y="256" width="300" height="150" rx="10" fill="#fff" stroke="#be185d" stroke-width="1.5"/><rect x="14" y="256" width="300" height="26" rx="10" fill="#be185d"/><text x="164.0" y="274" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >خلل التنسج Dysplasia / ورم Neoplasia</text><text x="304" y="301" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >Dysplasia: خلايا طبيعية تتغير بشكل شاذ</text><text x="304" y="321.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >غالباً حالة قبل سرطانية (مثل عنق الرحم)</text><text x="304" y="342.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >Neoplasia: نمو جديد شاذ (أورام)</text><text x="304" y="362.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >مثال: ورم ميلانيني خبيث</text><rect x="326" y="256" width="300" height="150" rx="10" fill="#fff" stroke="#0891b2" stroke-width="1.5"/><rect x="326" y="256" width="300" height="26" rx="10" fill="#0891b2"/><text x="476.0" y="274" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >الاتزان الداخلي Homeostasis</text><text x="616" y="301" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >استقرار الأنظمة الحيوية اللازمة للبقاء</text><text x="616" y="321.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >مثال: حرارة الجسم وتوازن السوائل</text><text x="616" y="342.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >البيت مستقر = Homeostasis</text>
</svg>
