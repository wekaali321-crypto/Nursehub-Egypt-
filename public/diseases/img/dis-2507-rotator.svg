<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="324" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">إصابة الكفة المدورة (Rotator Cuff)</text><rect x="330" y="52" width="300" height="111.6" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الفكرة</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الكفة تساعد الذراع على الحركة والدوران</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• شد عنيف أو تمزق أحد أوتارها الأربعة</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ألم بالكتف مع إبعاد أو تدوير الذراع</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (نقطة امتحان)</text><rect x="10" y="52" width="310" height="94.19999999999999" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#7c3aed"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التشخيص</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أشعة سينية أو رنين مغناطيسي</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• عظمية نابتة أو ضيق بين عظم العضد والأخرم</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (Acromion)</text><rect x="330" y="171.6" width="300" height="111.6" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M330,181.6 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#16a34a"/><text x="480.0" y="190.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأسباب</text><text x="620" y="214.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• شديدة: حمل شيء ثقيل أو سقوط على ذراع</text><text x="620" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  ممدودة</text><text x="620" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• خفيفة: تمزقات مزمنة بتكرار نفس الحركة</text><text x="620" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  كلاعبي البيسبول والتنس والسباحين</text><rect x="10" y="171.6" width="310" height="129.0" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,181.6 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="190.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج (RICE معدّلة)</text><text x="310" y="214.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• R: راحة</text><text x="310" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• I: ثلج</text><text x="310" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• C: ضغط (Compression)</text><text x="310" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• E: رفع؟ استخدم حمالة (Sling) بدلًا من</text><text x="310" y="284.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الرفع</text></svg>