<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 547" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="700" height="547" rx="16" fill="#f8fafc"/>
<text x="350.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">DKA مقابل HHNS</text>
<rect x="582.6315789473684" y="52" width="107.36842105263159" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="636.3157894736843" y="72" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff"></text>
<rect x="296.3157894736842" y="52" width="286.3157894736842" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="439.47368421052636" y="72" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">DKA</text>
<rect x="10.0" y="52" width="286.3157894736842" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="153.1578947368421" y="72" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">HHNS</text>
<rect x="582.6315789473684" y="82" width="107.36842105263159" height="59.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="683.0" y="99" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">النوع والأسباب</text>
<rect x="296.3157894736842" y="82" width="286.3157894736842" height="59.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="575.6315789473684" y="99" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">سكر النوع 1 غالباً (أصغر سناً): عدوى</text>
<text x="575.6315789473684" y="115.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">(الأشيع)، مرض كإنفلونزا ومعدة، إجهاد/جراحة،</text>
<text x="575.6315789473684" y="132.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">ترك الإنسولين</text>
<rect x="10.0" y="82" width="286.3157894736842" height="59.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="289.3157894736842" y="99" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">النوع 2 (أكبر سناً): مرض، عدوى، يصعب إصلاحه</text>
<text x="289.3157894736842" y="115.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">عند كبار السن</text>
<rect x="582.6315789473684" y="141.5" width="107.36842105263159" height="59.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="683.0" y="158.5" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">العلامات</text>
<rect x="296.3157894736842" y="141.5" width="286.3157894736842" height="59.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="575.6315789473684" y="158.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">جفاف وسكر 250–500+، كيتونات وتنفس كوسماول</text>
<text x="575.6315789473684" y="175.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">(عميق سريع، رائحة فاكهية)، ألم بطن، حماض pH</text>
<text x="575.6315789473684" y="191.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">أقل من 7.35، وبوتاسيوم قد يرتفع</text>
<rect x="10.0" y="141.5" width="286.3157894736842" height="59.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="289.3157894736842" y="158.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">سكر أعلى من 600، جفاف شديد، تغير الوعي/تشوش،</text>
<text x="289.3157894736842" y="175.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">لا كيتونات ولا حماض (لا رائحة فاكهية ولا ألم</text>
<text x="289.3157894736842" y="191.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">بطن)، بداية أبطأ وبوتاسيوم مستقر</text>
<rect x="582.6315789473684" y="201.0" width="107.36842105263159" height="92.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="683.0" y="218.0" text-anchor="start" font-size="11" font-weight="800" fill="#0f172a">العلاج</text>
<rect x="296.3157894736842" y="201.0" width="286.3157894736842" height="92.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="575.6315789473684" y="218.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">① سوائل 0.9% أولاً ② إنسولين ريجولار وريدي</text>
<text x="575.6315789473684" y="234.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">فقط (جرعة بولس أولاً) إذا السكر فوق 250؛ فحص</text>
<text x="575.6315789473684" y="251.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">سكر كل ساعة ③ إضافة بوتاسيوم (حتى لو طبيعي)</text>
<text x="575.6315789473684" y="267.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">أثناء الإنسولين؛ ينقل الإنسولين K والسكر</text>
<text x="575.6315789473684" y="284.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">للخلايا</text>
<rect x="10.0" y="201.0" width="286.3157894736842" height="92.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="289.3157894736842" y="218.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">ترطيب: 0.9% أولاً ثم محلول منخفض التوتر؛</text>
<text x="289.3157894736842" y="234.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">إنسولين ريجولار وريدي فقط (بولس، معايرة)؛</text>
<text x="289.3157894736842" y="251.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">بعد استقرار السكر تحت الجلد</text>
<rect x="356.0" y="307.5" width="330.0" height="149.0" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="356.0" y="307.5" width="330.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="521.0" y="325.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">إعادة التقييم كل ساعة</text>
<text x="676.0" y="351.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• سكر الدم</text>
<text x="676.0" y="370.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• ضغط مستقر وعودة امتلاء الشعيرات خلال 3 ثوانٍ</text>
<text x="676.0" y="388.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• لون الجلد دافئ (لا بارد وشاحب)</text>
<text x="676.0" y="407.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• بول 30 مل/ساعة أو أكثر</text>
<text x="676.0" y="425.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• وزن نوعي 1.005–1.030</text>
<rect x="14.0" y="307.5" width="330.0" height="149.0" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="14.0" y="307.5" width="330.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="179.0" y="325.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">البوتاسيوم الوريدي</text>
<text x="334.0" y="351.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• أول إجراء: مراقب قلب</text>
<text x="334.0" y="370.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• لا يُدفع (Push) أبداً: يقتل</text>
<text x="334.0" y="388.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• بمضخة وبسرعة حتى 10–20 mEq/ساعة بحد أقصى</text>
<text x="334.0" y="407.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• من وريد مركزي ببطء</text>
<text x="334.0" y="425.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• ارتفاع: T مدببة وST مرتفع؛ نقص: T مسطحة وST</text>
<text x="334.0" y="442.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">منخفض وU</text>
<rect x="14" y="474.5" width="672" height="50.5" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.4"/>
<text x="674" y="494.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">DKA يموت منها بالنقص بوتاسيوم، وHHNS يموت منها بنقص الحجم. مريض سكر النوع 1 يتقيأ ولا يأكل ما زال</text>
<text x="674" y="511.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">يحتاج إنسولين مرض (Sick-day) لأن الجلوكوز يرتفع وقت المرض.</text>
</svg>
