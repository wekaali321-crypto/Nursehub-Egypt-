<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 327" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="327" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع الأنيميا: نظرة سريعة</text><rect x="326.0" y="50" width="294.0" height="116" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><rect x="326.0" y="50" width="294.0" height="28" rx="10" fill="#b91c1c"/><text x="473.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">نقص الحديد</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• غذاء فقير أو جراحة تحويل المعدة</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• الحمل: الجنين يخزن الحديد</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• البيكا (Pica)</text><text x="610.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• حليب مفرط عند الأطفال</text><rect x="20.0" y="50" width="294.0" height="116" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="20.0" y="50" width="294.0" height="28" rx="10" fill="#7c3aed"/><text x="167.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المنجلية</text><text x="304.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• كريات منجلية تسد الأوعية</text><text x="304.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• أزمة انسداد وألم شديد</text><text x="304.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• سكتة وتضخم الطحال (حجز طحالي)</text><text x="304.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• سوائل وريدية وراحة ومسكنات</text><rect x="326.0" y="178" width="294.0" height="133" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="326.0" y="178" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="473.0" y="20" dy="178" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الخبيثة</text><text x="610.0" y="224" font-size="12.5" fill="#0f172a" text-anchor="end">• لا يُمتص B12 لغياب العامل الداخلي</text><text x="610.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="end">• التهاب لسان أحمر أملس</text><text x="610.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">• ضعف شديد ويرقان</text><text x="610.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• B12 حقن عضلي لا فموي</text><rect x="20.0" y="178" width="294.0" height="133" rx="10" fill="#fff" stroke="#c2410c" stroke-width="2"/><rect x="20.0" y="178" width="294.0" height="28" rx="10" fill="#c2410c"/><text x="167.0" y="20" dy="178" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">اللاتنسجية والانحلالية</text><text x="304.0" y="224" font-size="12.5" fill="#0f172a" text-anchor="end">• لاتنسجية: فشل النخاع وPancytopenia</text><text x="304.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="end">• انحلالية: تحطم كريات (نقل دم غير</text><text x="304.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">متوافق)</text><text x="304.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• Hb الطبيعي 12 فأكثر</text><text x="304.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="end">• أقل من 7 خطر</text></svg>