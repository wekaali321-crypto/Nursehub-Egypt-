<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 255" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="255" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أدوية تضخم البروستاتا (BPH)</text><rect x="326.0" y="48" width="294.0" height="96.5" rx="10" fill="#fff" stroke="#1e3a8a" stroke-width="2"/><rect x="326.0" y="48" width="294.0" height="28" rx="10" fill="#1e3a8a"/><text x="473.0" y="67" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">حاصرات ألفا 1 (tamsulosin, terazosin, doxazosin)</text><text x="610.0" y="96.5" text-anchor="start" font-size="12.5" fill="#0f172a">• ترخي عضلات المثانة والبروستاتا فيخرج</text><text x="610.0" y="114.0" text-anchor="start" font-size="12.5" fill="#0f172a">البول</text><text x="610.0" y="131.5" text-anchor="start" font-size="12.5" fill="#0f172a">• هبوط ضغط انتصابي: قم ببطء</text><rect x="20.0" y="48" width="294.0" height="96.5" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="20.0" y="48" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="167.0" y="67" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">مثبطات الأندروجين (finasteride)</text><text x="304.0" y="96.5" text-anchor="start" font-size="12.5" fill="#0f172a">• يمنع تحول التستوستيرون إلى DHT</text><text x="304.0" y="114.0" text-anchor="start" font-size="12.5" fill="#0f172a">• يقلص البروستاتا بمرور الوقت</text><text x="304.0" y="131.5" text-anchor="start" font-size="12.5" fill="#0f172a">• عجز جنسي ونقص رغبة</text><rect x="326.0" y="156.5" width="294.0" height="79.0" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><rect x="326.0" y="156.5" width="294.0" height="28" rx="10" fill="#b91c1c"/><text x="473.0" y="175.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">ما يتجنب</text><text x="610.0" y="205.0" text-anchor="start" font-size="12.5" fill="#0f172a">• sildenafil مع حاصرات ألفا</text><text x="610.0" y="222.5" text-anchor="start" font-size="12.5" fill="#0f172a">• أدوية خفض الضغط الإضافية</text><rect x="20.0" y="156.5" width="294.0" height="79.0" rx="10" fill="#fff" stroke="#15803d" stroke-width="2"/><rect x="20.0" y="156.5" width="294.0" height="28" rx="10" fill="#15803d"/><text x="167.0" y="175.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">عشبي</text><text x="304.0" y="205.0" text-anchor="start" font-size="12.5" fill="#0f172a">• saw palmetto: 160 مجم مرتين، 1–3 أشهر،</text><text x="304.0" y="222.5" text-anchor="start" font-size="12.5" fill="#0f172a">يستمر 6 أشهر</text></svg>