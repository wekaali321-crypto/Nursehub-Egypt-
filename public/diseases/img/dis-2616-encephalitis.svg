<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="330" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب المخ: العدوى والفحوص والعلاج</text><rect x="330" y="48" width="290" height="80" rx="10" fill="#dc2626"/><text x="475.0" y="75.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">فيروس الهربس HSV وفيروسات</text><text x="475.0" y="91.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">بعوض/قراد: West Nile, St. Louis, Eastern/Western equine</text><text x="475.0" y="107.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">جدري، فطريات (مناعة ضعيفة)</text><rect x="20" y="48" width="300" height="80" rx="10" fill="#2563eb"/><text x="170.0" y="75.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">الفحوص</text><text x="170.0" y="91.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">EEG بطء بؤري صدغي • بزل قطني: ضغط عالٍ وبروتين</text><text x="170.0" y="107.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">PCR للهربس • MRI</text><rect x="330" y="140" width="290" height="86" rx="10" fill="#16a34a"/><text x="475.0" y="170.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">العلاج</text><text x="475.0" y="186.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Acyclovir وريدي على ساعة (ويُعدَّل للكلى) حتى 3 أسابيع</text><text x="475.0" y="202.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Ganciclovir • Interferon (St. Louis)</text><rect x="20" y="140" width="300" height="86" rx="10" fill="#7c3aed"/><text x="170.0" y="170.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">فطري</text><text x="170.0" y="186.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Amphotericin B (قد يضر الكلى)</text><text x="170.0" y="202.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Fluconazole (قد يثبط النقي) + تحويلة</text><rect x="20" y="238" width="600" height="80" rx="10" fill="#fef3c7"/><text x="320.0" y="273.7" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">التمريض: فحص عصبي وعلامات ICP، رفع الرأس 30-45°</text><text x="320.0" y="290.7" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">مسكنات بحذر (الأفيونات تخفي الأعراض)، احتياطات نوبات، سوائل وتسجيل مدخل/مخرج</text></svg>