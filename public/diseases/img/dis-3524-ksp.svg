<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="360" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">المدر الحافظ للبوتاسيوم: spironolactone</text><rect x="330" y="45" width="295" height="90" rx="10" fill="#dbeafe"/><text x="477.5" y="68" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">الآلية</text><text x="477.5" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">يقلل إخراج البوتاسيوم</text><text x="477.5" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">يحجب إعادة امتصاص الصوديوم</text><text x="477.5" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">فيزيد الصوديوم والماء في البول</text><rect x="15" y="45" width="305" height="90" rx="10" fill="#dcfce7"/><text x="167.5" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">الاستعمال</text><text x="167.5" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">الضغط، الوذمة</text><text x="167.5" y="113" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">فشل القلب</text><rect x="15" y="155" width="610" height="60" rx="10" fill="#fee2e2"/><text x="320" y="190" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الخطر: ارتفاع البوتاسيوم (hyperkalemia)</text><rect x="15" y="230" width="610" height="110" rx="10" fill="#fef9c3"/><text x="320" y="272" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">تجنب أطعمة غنية بالبوتاسيوم:</text><text x="320" y="290" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">أفوكادو، سبانخ، بطاطا حلوة، مشمش مجفف</text><text x="320" y="308" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">رمان، ماء جوز الهند، فاصوليا بيضاء، موز، سلمون بري، قرع</text></svg>