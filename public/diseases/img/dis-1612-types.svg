<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 362" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="362" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">العيوب الخلقية بالقلب: الأسباب والأنواع</text>
<rect x="14" y="44" width="300" height="140" rx="10" fill="#fff" stroke="#be185d" stroke-width="1.5"/><rect x="14" y="44" width="300" height="26" rx="10" fill="#be185d"/><text x="164.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >الأسباب</text><text x="304" y="89" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >وراثية: تاريخ عائلي، متلازمة داون</text><text x="304" y="107.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >أثناء الحمل: عدوى (الحصبة الألمانية)، كحول وأدوية، سكر الأم</text><rect x="326" y="44" width="300" height="140" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="326" y="44" width="300" height="26" rx="10" fill="#dc2626"/><text x="476.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >النتيجة</text><text x="616" y="89" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >عيب بنيوي يغير مجرى الدم</text><text x="616" y="107.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >ينقص النتاج القلبي (OUTput)</text><text x="616" y="126.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >أقل دم مؤكسج للجسم</text><text x="616" y="144.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >مضاعفات: اضطراب نظم، نفخات، فشل قلب، نقص أكسجين</text><rect x="14" y="196" width="612" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="218" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0f172a" >أنواع العيوب الخلقية</text><rect x="20" y="228" width="146" height="32" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1"/><text x="93" y="249" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a" >تضيق الصمام الأبهري</text><rect x="172" y="228" width="146" height="32" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1"/><text x="245" y="249" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a" >تضيق برزخ الأبهر (COA)</text><rect x="324" y="228" width="146" height="32" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1"/><text x="397" y="249" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a" >شذوذ إبشتاين</text><rect x="476" y="228" width="146" height="32" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1"/><text x="549" y="249" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a" >القناة الشريانية السالكة PDA</text><rect x="20" y="266" width="146" height="32" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1"/><text x="93" y="287" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a" >تضيق الصمام الرئوي</text><rect x="172" y="266" width="146" height="32" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1"/><text x="245" y="287" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a" >عيوب الحاجز (ASD/VSD)</text><rect x="324" y="266" width="146" height="32" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1"/><text x="397" y="287" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a" >عيوب البطين الواحد</text><rect x="476" y="266" width="146" height="32" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1"/><text x="549" y="287" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a" >رباعية فالو TOF</text><rect x="20" y="304" width="146" height="32" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1"/><text x="93" y="325" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a" >عودة وريدية رئوية شاذة كلياً</text><rect x="172" y="304" width="146" height="32" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1"/><text x="245" y="325" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a" >تبديل الشريانين الكبيرين TGA</text><rect x="324" y="304" width="146" height="32" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="1"/><text x="397" y="325" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a" >الجذع الشرياني الواحد</text>
</svg>
