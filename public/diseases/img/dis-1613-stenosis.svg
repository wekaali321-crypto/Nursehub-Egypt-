<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="270" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التضيقات: رئوي وأبهري وبرزخ الأبهر</text>
<rect x="14" y="44" width="200" height="210" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><rect x="14" y="44" width="200" height="26" rx="10" fill="#2563eb"/><text x="114.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >تضيق الصمام الرئوي</text><text x="204" y="89" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >صمام جامد صغير</text><text x="204" y="107" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >تضخم بطين أيمن</text><text x="204" y="125" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >نفخة قذف انقباضية عالية</text><text x="204" y="143" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >بالون أو جراحة (Valvotomy)</text><rect x="224" y="44" width="200" height="210" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="224" y="44" width="200" height="26" rx="10" fill="#dc2626"/><text x="324.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >تضيق الأبهري</text><text x="414" y="89" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >نتاج قلبي منخفض</text><text x="414" y="107" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >عدم تحمل مجهود</text><text x="414" y="125" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >ضغط منخفض وتسرع</text><text x="414" y="143" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >تضخم بطين أيسر واحتقان رئوي</text><text x="414" y="161" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >بالون أو جراحة</text><rect x="434" y="44" width="192" height="210" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><rect x="434" y="44" width="192" height="26" rx="10" fill="#7c3aed"/><text x="530.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >تضيق برزخ الأبهر COA</text><text x="616" y="89" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >أطراف