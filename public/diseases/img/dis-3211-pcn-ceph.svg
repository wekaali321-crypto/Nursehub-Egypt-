<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 343" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="343" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">البنسلينات والسيفالوسبورينات: التسمية والتحسس والتصرف عند التفاعل</text><rect x="325.0" y="44" width="299.0" height="108" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.5"/><path d="M325.0 54a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#b45309"/><text x="474.5" y="66" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">البنسلينات (-cillin)</text><text x="474.5" y="94" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">amoxicillin, ampicillin, piperacillin</text><text x="474.5" y="110.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تُضعف جدار البكتيريا</text><text x="474.5" y="127" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أثر جانبي مميز: نزف (راقب الصفيحات)</text><rect x="16.0" y="44" width="299.0" height="108" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><path d="M16.0 54a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#0f766e"/><text x="165.5" y="66" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">السيفالوسبورينات (ceph/cef)</text><text x="165.5" y="94" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">cephalexin (Keflex), cefazolin,</text><text x="165.5" y="110.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">ceftriaxone (Rocephin)</text><text x="165.5" y="127" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تُضعف جدار البكتيريا</text><text x="165.5" y="143.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أثر جانبي مميز: إسهال</text><rect x="325.0" y="162" width="299.0" height="108" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.5"/><path d="M325.0 172a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#be123c"/><text x="474.5" y="184" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">تحسس متصالب</text><text x="474.5" y="212" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">من تحسس لأحد العائلتين قد يتحسس</text><text x="474.5" y="228.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">للأخرى</text><text x="474.5" y="245" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">اسأل عن نوع التفاعل السابق قبل</text><text x="474.5" y="261.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الإعطاء</text><rect x="16.0" y="162" width="299.0" height="108" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M16.0 172a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#7c3aed"/><text x="165.5" y="184" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">عند حدوث تفاعل</text><text x="165.5" y="212" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">1) أوقف الدواء</text><text x="165.5" y="228.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">2) قيّم نوع التفاعل واسمع الرئتين</text><text x="165.5" y="245" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">3) جهّز adrenaline</text><rect x="16" y="280" width="608" height="47" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="320" y="300" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">سؤال شائع: قبل إعطاء مضاد لمريض لديه تحسس، الأفضل أن تسأل المريض عن نوع</text><text x="320" y="316.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">التفاعل الذي حدث له، ثم تراجع الصيدلي/الطبيب.</text></svg>