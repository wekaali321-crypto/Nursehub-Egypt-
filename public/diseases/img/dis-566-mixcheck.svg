<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="520" fill="#f7f9fc"/>
<text x="320" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1f3a5f">قبل خلط أمبولتين في سرنجة واحدة</text>
<g font-size="16" text-anchor="middle">
<rect x="120" y="55" width="400" height="56" rx="12" fill="#e3edfb" stroke="#2f6fbd"/>
<text x="320" y="89" fill="#1f3a5f">1) هل الدوائين في جدول التوافق / نشرة الصيدلي؟</text>
<text x="320" y="132" font-size="22" fill="#2f6fbd">↓</text>
<rect x="120" y="140" width="400" height="56" rx="12" fill="#e3edfb" stroke="#2f6fbd"/>
<text x="320" y="174" fill="#1f3a5f">2) نفس الوقت، نفس الطريق (عضل/وريد)؟</text>
<text x="320" y="217" font-size="22" fill="#2f6fbd">↓</text>
<rect x="120" y="225" width="400" height="56" rx="12" fill="#e3edfb" stroke="#2f6fbd"/>
<text x="320" y="259" fill="#1f3a5f">3) اسحب الدوائين وراقب: لون؟ عكارة؟ ترسيب؟</text>
<text x="320" y="302" font-size="22" fill="#2f6fbd">↓</text>
<rect x="30" y="312" width="270" height="86" rx="12" fill="#fdeaea" stroke="#c0392b"/>
<text x="165" y="345" fill="#a12a1f" font-weight="700">أي تغيّر ظاهر</text>
<text x="165" y="373" fill="#a12a1f">ارمِ السرنجة وأعد بسرنجتين</text>
<rect x="340" y="312" width="270" height="86" rx="12" fill="#e6f6ea" stroke="#2e8b57"/>
<text x="475" y="345" fill="#1e6b3e" font-weight="700">لا تغيّر ظاهر</text>
<text x="475" y="373" fill="#1e6b3e">أعطِ فوراً (لا تخزّن الخليط)</text>
<rect x="60" y="425" width="520" height="70" rx="12" fill="#fff6dc" stroke="#d9a400"/>
<text x="320" y="453" fill="#7a5a00" font-weight="700">انتبه: غياب التغيّر المرئي لا يعني التوافق</text>
<text x="320" y="478" fill="#7a5a00">قد يحصل تحلل للدواء بدون أي علامة. الأصل: سرنجة لكل دواء.</text>
</g></svg>
