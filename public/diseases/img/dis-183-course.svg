<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="344" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">مسار الحصبة</text><g text-anchor="middle"><rect x="80" y="46" width="480" height="57" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><text x="320" y="68" font-size="14" font-weight="800" fill="#0f172a">حضانة 10–14 يوم</text><text x="320" y="86" font-size="12" font-weight="600" fill="#0f172a">بعد التعرض لمريض غير محصّن</text><path d="M320 103 V119" stroke="#64748b" stroke-width="3"/><path d="M314 113 L320 120 L326 113" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="121" width="480" height="57" rx="10" fill="#fef9c3" stroke="#eab308"/><text x="320" y="143" font-size="14" font-weight="800" fill="#422006">مرحلة قبل الطفح (3–4 أيام)</text><text x="320" y="161" font-size="12" font-weight="600" fill="#422006">حمى، رشح، كحة، التهاب ملتحمة، بقع كوبليك داخل الخد</text><path d="M320 178 V194" stroke="#64748b" stroke-width="3"/><path d="M314 188 L320 195 L326 188" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="196" width="480" height="57" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="320" y="218" font-size="14" font-weight="800" fill="#7f1d1d">الطفح الأحمر (3–4 أيام)</text><text x="320" y="236" font-size="12" font-weight="600" fill="#7f1d1d">يبدأ على الوجه ثم يعم الجسم</text><path d="M320 253 V269" stroke="#64748b" stroke-width="3"/><path d="M314 263 L320 270 L326 263" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="271" width="480" height="57" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="320" y="293" font-size="14" font-weight="800" fill="#14532d">الطفح يتلاشى بعد 3 أيام</text><text x="320" y="311" font-size="12" font-weight="600" fill="#14532d">تقشير ولون بني خفيف، المناعة مدى الحياة</text></g></svg>