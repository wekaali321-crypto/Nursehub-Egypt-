-weight="800" fill="#fff" >RL</text><circle cx="405" cy="320" r="13" fill="#16a34a"/><text x="405" y="325" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" >LL</text></g><text x="630" y="90" text-anchor="start" font-size="12" font-weight="700" fill="#334155" >V1: الفراغ الوربي 4 يمين القص</text><text x="630" y="120" text-anchor="start" font-size="12" font-weight="700" fill="#334155" >V2: الفراغ الوربي 4 يسار القص</text><text x="630" y="150" text-anchor="start" font-size="12" font-weight="700" fill="#334155" >V3: بين V2 وV4</text><text x="630" y="180" text-anchor="start" font-size="12" font-weight="700" fill="#334155" >V4: الفراغ الوربي 5 — منتصف الترقوة</text><text x="630" y="210" text-anchor="start" font-size="12" font-weight="700" fill="#334155" >V5: مستوى V4 — الإبطي الأمامي</text><text x="630" y="240" text-anchor="start" font-size="12" font-weight="700" fill="#334155" >V6: مستوى V4 — الإبطي الأوسط</text><text x="630" y="270" text-anchor="start" font-size="12" font-weight="700" fill="#334155" >RA/LA: الذراعين  |  RL/LL: الرجلين</text>
