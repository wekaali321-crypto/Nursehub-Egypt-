<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="300" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">حاصرات ألفا (phentolamine)</text><rect x="330" y="45" width="295" height="90" rx="10" fill="#dbeafe"/><text x="477.5" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">الآلية</text><text x="477.5" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">تحجب ألفا فتوسّع الأوعية</text><text x="477.5" y="113" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">(قطرة العين: تضيّق الحدقة)</text><rect x="15" y="45" width="305" height="90" rx="10" fill="#dcfce7"/><text x="167.5" y="68" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">الاستعمال</text><text x="167.5" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">ضغط ورم القواتم</text><text x="167.5" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تحضير ما قبل الجراحة</text><text x="167.5" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تلف نسيجي من تسرب dopamine</text><rect x="15" y="155" width="610" height="75" rx="10" fill="#fef9c3"/><text x="320" y="179.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">الجرعة الإرشادية: 5 ملجم قبل الجراحة بـ 1–2 ساعة ويُكرَّر عند اللزوم</text><text x="320" y="197.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">وقد يُسرَّب أثناء الجراحة بمعدل 0.5–1 ملجم/دقيقة</text><text x="320" y="215.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">الطريق: عضلي، وريدي، موضعي</text><rect x="15" y="245" width="610" height="45" rx="10" fill="#fee2e2"/><text x="320" y="272.5" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">ممنوع: مرض الشريان التاجي | راقب الضغط والنبض وECG كل دقيقتين أثناء الوريدي</text></svg>