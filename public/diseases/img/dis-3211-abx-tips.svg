<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 428" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="428" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">ست نصائح عملية لاختبار المضادات الحيوية</text><rect x="325.0" y="44" width="299.0" height="75" rx="10" fill="#fff" stroke="#1e3a8a" stroke-width="1.5"/><path d="M325.0 54a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#1e3a8a"/><text x="474.5" y="66" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">1 أكمل الدواء</text><text x="474.5" y="94" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">لا توقفه عند التحسن لتفادي العدوى</text><text x="474.5" y="110.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">المقاومة (superinfection)</text><rect x="16.0" y="44" width="299.0" height="75" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.5"/><path d="M16.0 54a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#be123c"/><text x="165.5" y="66" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">2 حمل غير مقصود</text><text x="165.5" y="94" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">حبوب منع الحمل قد تقلّ فعاليتها</text><text x="165.5" y="110.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">استعمل وسيلة إضافية (مثل اللولب)</text><rect x="325.0" y="129" width="299.0" height="108" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.5"/><path d="M325.0 139a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#b45309"/><text x="474.5" y="151" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">3 لا كحول</text><text x="474.5" y="179" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">المضادات تُجهد الكبد</text><rect x="16.0" y="129" width="299.0" height="108" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><path d="M16.0 139a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#0f766e"/><text x="165.5" y="151" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">4 على معدة فارغة</text><text x="165.5" y="179" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الماكروليدات (azithromycin)،</text><text x="165.5" y="195.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">التتراسيكلينات (doxycycline)،</text><text x="165.5" y="212" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الفلوروكينولونات (levofloxacin) مع</text><text x="165.5" y="228.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">كوب ماء كامل</text><rect x="325.0" y="247" width="299.0" height="108" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M325.0 257a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#7c3aed"/><text x="474.5" y="269" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">5 تجنّب الشمس</text><text x="474.5" y="297" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">fluoroquinolones, tetracyclines,</text><text x="474.5" y="313.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">sulfonamides</text><text x="474.5" y="330" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">وأيضًا glyburide ومدرات</text><text x="474.5" y="346.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الثيازيد/الحلقية</text><rect x="16.0" y="247" width="299.0" height="108" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M16.0 257a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#0369a1"/><text x="165.5" y="269" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">6 سمّية الكلى والأذن</text><text x="165.5" y="297" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">vancomycin, gentamicin, neomycin</text><text x="165.5" y="313.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">راقب الذروة والقاع، دوار، طنين،</text><text x="165.5" y="330" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">كرياتينين، بول</text><rect x="16" y="365" width="608" height="47" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="320" y="385" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">حيلة تفريق: azithromycin وerythromycin ينتهيان بـ -thromycin (ماكروليد)، وهي</text><text x="320" y="401.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">غير gentamicin/vancomycin. وcipro ينتهي بـ -floxacin وليس -mycin.</text></svg>