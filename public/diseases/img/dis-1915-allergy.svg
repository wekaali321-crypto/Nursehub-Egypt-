<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="248" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الحساسية والآثار الجانبية للقاحات</text><rect x="325" y="48" width="295" height="84" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">إنفلونزا</text><text x="610" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">حساسية من البيض (يُسأل عنها)</text><rect x="20" y="48" width="295" height="84" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">MMR</text><text x="305" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">حساسية سابقة من نيومايسين</text><text x="305" y="120" text-anchor="end" font-size="12.5" fill="#1e293b">أثر جانبي: التهاب مفاصل (Arthritis)</text><rect x="325" y="142" width="295" height="64" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="142" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">HepB</text><text x="610" y="194" text-anchor="end" font-size="12.5" fill="#1e293b">رد فعل تأقي سابق من الخميرة (Yeast)</text><rect x="20" y="142" width="295" height="64" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><rect x="20" y="142" width="295" height="30" rx="12" fill="#9333ea"/><text x="167.5" y="163" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">IPV</text><text x="305" y="194" text-anchor="end" font-size="12.5" fill="#1e293b">حساسية سابقة من نيومايسين</text><text x="320" y="230" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">من تحسس من نيومايسين قد يتفاعل مع MMR وشلل الأطفال</text>
</svg>
