<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="388" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >الاضطرابات الأربعة جنبًا إلى جنب</text><rect x="330" y="46" width="290" height="140" rx="12" fill="#fff" stroke="#dc2626" stroke-width="3"/><rect x="330" y="46" width="290" height="38" rx="12" fill="#dc2626" stroke="none" stroke-width="1"/><text x="475" y="72" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" >حماض تنفسي</text><text x="475" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a" >pH ↓  PaCO₂ ↑</text><text x="475" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >تنفس بطيء ضحل، نعاس</text><text x="475" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626" >COPD، مهدئات، انسداد مجرى</text><rect x="20" y="46" width="290" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="3"/><rect x="20" y="46" width="290" height="38" rx="12" fill="#2563eb" stroke="none" stroke-width="1"/><text x="165" y="72" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" >قلاء تنفسي</text><text x="165" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a" >pH ↑  PaCO₂ ↓</text><text x="165" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >تنفس سريع، تنميل، قلق</text><text x="165" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb" >ألم، حرارة، قلق، تهوية زائدة</text><rect x="330" y="198" width="290" height="140" rx="12" fill="#fff" stroke="#dc2626" stroke-width="3"/><rect x="330" y="198" width="290" height="38" rx="12" fill="#dc2626" stroke="none" stroke-width="1"/><text x="475" y="224" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" >حماض أيضي</text><text x="475" y="264" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a" >pH ↓  HCO₃ ↓</text><text x="475" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >تنفس عميق سريع (Kussmaul)</text><text x="475" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626" >DKA، إسهال، فشل كلوي، صدمة</text><rect x="20" y="198" width="290" height="140" rx="12" fill="#fff" stroke="#2563eb" stroke-width="3"/><rect x="20" y="198" width="290" height="38" rx="12" fill="#2563eb" stroke="none" stroke-width="1"/><text x="165" y="224" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" >قلاء أيضي</text><text x="165" y="264" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a" >pH ↑  HCO₃ ↑</text><text x="165" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >تنفس بطيء ضحل، تشنج</text><text x="165" y="318" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb" >قيء، شفط معدي، مدرّات</text><text x="320" y="370" text-anchor="middle" font-size="14" font-weight="700" fill="#475569" >التنفسي: pH وCO₂ عكس بعض. الأيضي: pH وHCO₃ نفس الاتجاه</text>
</svg>
