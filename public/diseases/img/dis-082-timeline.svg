<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 448" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="448" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التشنج: الخطة حسب الزمن</text>
<rect x="340.0" y="50" width="270" height="92" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="2.5"/><circle cx="592.0" cy="68" r="12" fill="#0ea5e9"/><text x="592.0" y="73" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="572.0" y="73" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">0–5 دقايق</text><text x="596.0" y="96" text-anchor="start" font-size="12.5" fill="#334155">حماية المصاب وقت التشنج</text><text x="596.0" y="114" text-anchor="start" font-size="12.5" fill="#334155">وضع جانبي، أكسجين، قِس السكر</text><text x="320.0" y="102" text-anchor="middle" font-size="22" fill="#64748b">←</text><rect x="30.0" y="50" width="270" height="92" rx="12" fill="#fff" stroke="#22c55e" stroke-width="2.5"/><circle cx="282.0" cy="68" r="12" fill="#22c55e"/><text x="282.0" y="73" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="262.0" y="73" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">بعد 5 دقايق</text><text x="286.0" y="96" text-anchor="start" font-size="12.5" fill="#334155">شخّص: حالة صرع متصلة</text><text x="286.0" y="114" text-anchor="start" font-size="12.5" fill="#334155">كانيولا + أول جرعة بنزوديازيبين</text><text x="320.0" y="166" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="340.0" y="168" width="270" height="92" rx="12" fill="#fff" stroke="#eab308" stroke-width="2.5"/><circle cx="592.0" cy="186" r="12" fill="#eab308"/><text x="592.0" y="191" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="572.0" y="191" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">بعد 10 دقايق</text><text x="596.0" y="214" text-anchor="start" font-size="12.5" fill="#334155">جرعة تانية بأمر الطبيب</text><text x="596.0" y="232" text-anchor="start" font-size="12.5" fill="#334155">لو ما اتحسنش</text><text x="320.0" y="220" text-anchor="middle" font-size="22" fill="#64748b">←</text><rect x="30.0" y="168" width="270" height="92" rx="12" fill="#fff" stroke="#f97316" stroke-width="2.5"/><circle cx="282.0" cy="186" r="12" fill="#f97316"/><text x="282.0" y="191" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="262.0" y="191" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">لو مستمر</text><text x="286.0" y="214" text-anchor="start" font-size="12.5" fill="#334155">أدوية الخط التاني وريدي</text><text x="286.0" y="232" text-anchor="start" font-size="12.5" fill="#334155">(فينيتوين / فالبروات / ليفيتيراسيتام)</text><text x="286.0" y="250" text-anchor="start" font-size="12.5" fill="#334155">نقل للعناية</text><text x="320.0" y="284" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="340.0" y="286" width="270" height="92" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2.5"/><circle cx="592.0" cy="304" r="12" fill="#dc2626"/><text x="592.0" y="309" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">5</text><text x="572.0" y="309" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">بعد الإيقاف</text><text x="596.0" y="332" text-anchor="start" font-size="12.5" fill="#334155">حرارة، سكر، كالسيوم</text><text x="596.0" y="350" text-anchor="start" font-size="12.5" fill="#334155">مستوى الوعي والإصابات</text><text x="320" y="436" text-anchor="middle" font-size="12.5" fill="#475569">ابدأ العدّ من لحظة بداية التشنج واكتب الوقت</text></svg>
