<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="376" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب المثانة مقابل التهاب الحويضة</text><rect x="325" y="54" width="295" height="150" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="325" y="54" width="295" height="29" rx="10" fill="#0ea5e9"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">التهاب المسالك البولية (UTI)</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• إصابة الإحليل والمثانة</text><text x="612" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• حمى، حرقة بول، تكرار</text><text x="612" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• بول عكر نتن، كريات بيضاء، نيتريت</text><text x="612" y="168.6" text-anchor="start" font-size="13" fill="#0f172a">• مزرعة وحساسية — المزرعة أولًا ثم</text><text x="612" y="186.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">المضاد</text><rect x="20" y="54" width="295" height="150" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="20" y="54" width="295" height="29" rx="10" fill="#ef4444"/><text x="307" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">التهاب الحويضة والكلية</text><text x="307" y="99" text-anchor="start" font-size="13" fill="#0f172a">• عدوى كلوية أخطر؛ تصعد عبر الحالب</text><text x="307" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• ألم خاصرة مكتوم يمتد نحو السرة +</text><text x="307" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">إيلام الزاوية الضلعية الفقرية (CVA)</text><text x="307" y="163.6" text-anchor="start" font-size="13" fill="#0f172a">• حمى 39°م وبول مركز عكر</text><rect x="30" y="214" width="580" height="40" rx="10" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="578" cy="234" r="14" fill="#0ea5e9"/><text x="578" y="239" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="554" y="239" text-anchor="start" font-size="13.5" fill="#0f172a">قيّم أولًا ثم تدخّل</text><text x="320" y="265" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="268" width="580" height="40" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="1.5"/><circle cx="578" cy="288" r="14" fill="#10b981"/><text x="578" y="293" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="554" y="293" text-anchor="start" font-size="13.5" fill="#0f172a">خذ المزرعة ثم ابدأ المضاد الحيوي</text><text x="320" y="319" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="322" width="580" height="40" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.5"/><circle cx="578" cy="342" r="14" fill="#f59e0b"/><text x="578" y="347" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="554" y="347" text-anchor="start" font-size="13.5" fill="#0f172a">عيّنة منتصف البول التي تُركت ساعتين: تُرمى ويؤخذ غيرها</text></svg>
