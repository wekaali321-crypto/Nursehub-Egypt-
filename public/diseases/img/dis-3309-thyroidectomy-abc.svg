<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
<rect width="640" height="420" rx="16" fill="#f8fafc"/>
<text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >بعد استئصال الدرقية: ABC ثم الكالسيوم</text>
<rect x="10" y="50" width="620" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="500" y="50" width="130" height="75" rx="10" fill="#b91c1c"/>
<text x="565" y="93" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >A: مجرى الهواء</text>
<text x="250" y="80" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b" >جهاز التنبيب/فتح القصبة بجانب السرير</text>
<text x="250" y="105" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >أولوية أولى</text>
<rect x="10" y="135" width="620" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="500" y="135" width="130" height="75" rx="10" fill="#c2410c"/>
<text x="565" y="178" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >B: التنفس</text>
<text x="250" y="165" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b" >صرير (Stridor) وتنفس مزعج</text>
<text x="250" y="190" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >راقب قوة وجودة الصوت</text>
<rect x="10" y="220" width="620" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="500" y="220" width="130" height="75" rx="10" fill="#0369a1"/>
<text x="565" y="263" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >C: الدورة</text>
<text x="250" y="250" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b" >نزيف حول الوسادة وموضع الجرح</text>
<text x="250" y="275" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >رأس وعنق بمحاذاة، رأس السرير 30–45°، لا ثني للرقبة</text>
<rect x="10" y="305" width="620" height="75" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="500" y="305" width="130" height="75" rx="10" fill="#7c3aed"/>
<text x="565" y="348" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >C: كالسيوم</text>
<text x="250" y="335" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e293b" >أقل من 8.6 (الطبيعي 8.6–10.2)</text>
<text x="250" y="360" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >Chvostek وTrousseau وتنميل حول الفم</text>
<text x="320" y="405" text-anchor="middle" font-size="13" font-weight="800" fill="#0f766e" >الحيلة: انزع الغدة (T) افحص الكالسيوم (C)</text>
</svg>