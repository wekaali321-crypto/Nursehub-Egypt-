<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 314" width="640" height="314" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="أنواع الملينات: الآلية والمثال"><rect width="640" height="314" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">أنواع الملينات: الآلية والمثال</text><rect x="10" y="48" width="620" height="28" rx="6" fill="#2b6a9e"/><text x="553.9622641509434" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">النوع</text><text x="325.84905660377365" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الآلية</text><text x="91.88679245283029" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">مثال</text><rect x="10" y="76" width="620" height="44" fill="#f4f8fc" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="95" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">مكتلة (Bulk)</text><text x="470.9245283018868" y="95" text-anchor="start" font-size="12.5"  fill="#1d2939">تضيف حجمًا وماءً فتنبّه الحركة؛ تُشرب بماء</text><text x="470.9245283018868" y="112" text-anchor="start" font-size="12.5"  fill="#1d2939">كثير</text><text x="166.77358490566047" y="95" text-anchor="start" font-size="12.5"  fill="#1d2939">Psyllium</text><rect x="10" y="120" width="620" height="44" fill="#fff" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="139" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">مطرّية (Emollient)</text><text x="470.9245283018868" y="139" text-anchor="start" font-size="12.5"  fill="#1d2939">تزلّق جدار الأمعاء وتلين البراز بلا احتباس</text><text x="470.9245283018868" y="156" text-anchor="start" font-size="12.5"  fill="#1d2939">ماء</text><text x="166.77358490566047" y="139" text-anchor="start" font-size="12.5"  fill="#1d2939">Mineral oil</text><rect x="10" y="164" width="620" height="44" fill="#f4f8fc" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="183" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">ملينات البراز</text><text x="623" y="200" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">(Softener)</text><text x="470.9245283018868" y="183" text-anchor="start" font-size="12.5"  fill="#1d2939">تجعل الماء يبقى في البراز</text><text x="166.77358490566047" y="183" text-anchor="start" font-size="12.5"  fill="#1d2939">Docusate</text><rect x="10" y="208" width="620" height="44" fill="#fff" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="227" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">أسموزية</text><text x="623" y="244" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">(Hyperosmolar)</text><text x="470.9245283018868" y="227" text-anchor="start" font-size="12.5"  fill="#1d2939">تسحب الماء للأمعاء فتزيد الحركة</text><text x="166.77358490566047" y="227" text-anchor="start" font-size="12.5"  fill="#1d2939">Lactulose، Glycerin</text><rect x="10" y="252" width="620" height="27" fill="#f4f8fc" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="271" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">منبّهة (Stimulant)</text><text x="470.9245283018868" y="271" text-anchor="start" font-size="12.5"  fill="#1d2939">تنبّه الحركة مباشرة على الأمعاء</text><text x="166.77358490566047" y="271" text-anchor="start" font-size="12.5"  fill="#1d2939">Bisacodyl، Senna</text><rect x="10" y="279" width="620" height="27" fill="#fff" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="298" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">ملحية (Saline)</text><text x="470.9245283018868" y="298" text-anchor="start" font-size="12.5"  fill="#1d2939">تجذب الماء وتزيد الضغط فتزيد الحركة</text><text x="166.77358490566047" y="298" text-anchor="start" font-size="12.5"  fill="#1d2939">أملاح المغنيسيوم</text></svg>