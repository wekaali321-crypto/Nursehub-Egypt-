<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
<rect width="640" height="380" rx="16" fill="#f8fafc"/>
<text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >هرمونات الفص الخلفي للنخامية وهرمون النمو</text>
<rect x="330" y="50" width="300" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="330" y="50" width="300" height="28" rx="10" fill="#0369a1"/>
<text x="480.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >فازوبريسين وديزموبريسين (DDAVP)</text>
<text x="480.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >يزيدان امتصاص الماء في الكلى</text>
<text x="480.0" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >يعالجان السكر الكاذب DI</text>
<text x="480.0" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >خطر: تسمم مائي (صداع، نعاس، تخليط)</text>
<text x="480.0" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >راقب السوائل والوزن والداخل والخارج</text>
<rect x="10" y="50" width="310" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="50" width="310" height="28" rx="10" fill="#0f766e"/>
<text x="165.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >سوماتوتروبين (هرمون النمو)</text>
<text x="165.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >لأطفال نقص GH قبل إغلاق مشاشات العظم</text>
<text x="165.0" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >تورم اليدين والقدمين، ارتفاع سكر، التهاب بنكرياس</text>
<text x="165.0" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >ألم بطني شديد مستمر: بلّغ</text>
<text x="165.0" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >متابعة طبيب الغدد وعمر العظم</text>
<rect x="10" y="215" width="620" height="155" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="215" width="620" height="28" rx="10" fill="#7c3aed"/>
<text x="320.0" y="234" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >أوكتريوتيد (Octreotide)</text>
<text x="320.0" y="265" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >مثبط هرمون النمو: يُقلل GH في ضخامة الأطراف (Acromegaly) وبعض الأورام</text>
<text x="320.0" y="293" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >يُعطى تحت الجلد أو وريدياً حسب الطبيب (راجع النشرة)</text>
</svg>