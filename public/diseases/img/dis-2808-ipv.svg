<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 425" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="425" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">العنف من الشريك (⁦IPV⁩): الوعي والتدخل</text><rect x="20" y="50" width="600" height="40" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="320" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">جسدي، عاطفي، لفظي، جنسي، ومالي</text><rect x="326" y="104" width="294" height="176.875" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M326 114a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#b91c1c"/><text x="473" y="125" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">علامات تنبيه</text><text x="610" y="150.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="150.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">شريك مسيء شديد الغيرة والتملك (نقطة</text><text x="598" y="168.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">امتحان)</text><text x="610" y="189.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="189.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">يزداد العنف أثناء الحمل</text><text x="610" y="210.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="210.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">تتحمل الضحية: مالياً أو خوفاً من الأذى أو</text><text x="598" y="229" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">حضانة الأطفال أو دينياً</text><text x="610" y="250.125" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="250.125" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">يشتد العنف حين تتجه الضحية للاستقلال</text><rect x="20" y="104" width="294" height="176.875" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><path d="M20 114a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#15803d"/><text x="167" y="125" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الأولوية التمريضية</text><text x="304" y="150.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="150.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">اطلب من الشريك مغادرة الغرفة لتحدث المريض</text><text x="292" y="168.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">وتفحصه على انفراد</text><text x="304" y="189.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="189.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">اسأل: هل يؤذيك أحد؟ ماذا يحدث عند الخلاف؟</text><text x="292" y="207.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">هل هددك؟</text><text x="304" y="229" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="229" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">طمئنها أنها ليست وحدها، واحفظ الأدلة</text><text x="292" y="247.125" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">المادية</text><text x="304" y="268.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="268.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أبدِ اهتماماً واحتراماً</text><rect x="326" y="292.875" width="294" height="119.5" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/><path d="M326 302.875a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#0e7490"/><text x="473" y="313.875" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">علاج الضحية</text><text x="610" y="339.375" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="339.375" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أكّد لها أنها لا تستحق ولا تسبب الإساءة</text><text x="610" y="360.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="360.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ضع خطة أمان: ملجأ محلي (⁦Local shelter⁩)</text><text x="610" y="381.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="381.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أعطها معلومات الاتصال بالملجأ إن قررت</text><text x="598" y="399.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">العودة</text><rect x="20" y="292.875" width="294" height="119.5" rx="10" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><path d="M20 302.875a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#6d28d9"/><text x="167" y="313.875" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">العلاج النفسي (⁦Talk therapy⁩)</text><text x="304" y="339.375" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="339.375" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">تحديد المثيرات (⁦Triggers⁩)</text><text x="304" y="360.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="360.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">التعرف على أنماط السلوك الهدامة وتعلم</text><text x="292" y="378.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">استجابات بديلة</text></svg>