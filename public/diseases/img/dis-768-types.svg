<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 182" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="182" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">أنواع سرطان الجلد</text><rect x="427.33333333333337" y="50" width="198.66666666666666" height="116" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><rect x="427.33333333333337" y="50" width="198.66666666666666" height="28" rx="12" fill="#16a34a"/><text x="526.6666666666667" y="69" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">الخلايا القاعدية (BCC)</text><text x="526.6666666666667" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">الأشهر</text><text x="526.6666666666667" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">حطاطة لؤلؤية شمعية أو بقعة</text><text x="526.6666666666667" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">بنية مسطحة</text><text x="526.6666666666667" y="144" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">نادراً ينتشر، يعود موضعياً</text><rect x="220.6666666666667" y="50" width="198.66666666666666" height="116" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><rect x="220.6666666666667" y="50" width="198.66666666666666" height="28" rx="12" fill="#ea580c"/><text x="320.00000000000006" y="69" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">الخلايا الحرشفية (SCC)</text><text x="320.00000000000006" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">الثاني</text><text x="320.00000000000006" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">عقدة حمراء صلبة، آفة</text><text x="320.00000000000006" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">متقشرة، تغيّر ندبة</text><text x="320.00000000000006" y="144" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">ينتشر أسهل</text><rect x="14.000000000000057" y="50" width="198.66666666666666" height="116" rx="12" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="14.000000000000057" y="50" width="198.66666666666666" height="28" rx="12" fill="#dc2626"/><text x="113.33333333333339" y="69" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">الميلانوما</text><text x="113.33333333333339" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">الأخطر</text><text x="113.33333333333339" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">وجه وأعلى الظهر غالباً</text><text x="113.33333333333339" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">أي شامة جديدة أو متغيرة</text></svg>