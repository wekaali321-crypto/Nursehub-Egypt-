<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 619" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="619" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قرحة الضغط: 6 مراحل</text><text x="320" y="50" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">Pressure Injury Stages</text><rect x="10" y="70" width="620" height="28.125" rx="0" fill="#0369a1" stroke="#cbd5e1" stroke-width="1"/><text x="575.0" y="89.375" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">المرحلة</text><line x1="520" y1="70" x2="520" y2="98.125" stroke="#cbd5e1" stroke-width="1"/><text x="265.0" y="89.375" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">الوصف</text><rect x="10" y="98.125" width="620" height="28.125" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="575.0" y="117.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">1</text><line x1="520" y1="98.125" x2="520" y2="126.25" stroke="#cbd5e1" stroke-width="1"/><text x="265.0" y="117.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">طبقة واحدة (بشرة): جلد أحمر لا يبيض ولا مجروح</text><rect x="10" y="126.25" width="620" height="28.125" rx="0" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="575.0" y="145.625" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">2</text><line x1="520" y1="126.25" x2="520" y2="154.375" stroke="#cbd5e1" stroke-width="1"/><text x="265.0" y="145.625" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">طبقتان: جرح مفتوح بالبشرة والأدمة، قاع أحمر/وردي لامع أو جاف</text><rect x="10" y="154.375" width="620" height="46.25" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="575.0" y="173.75" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">3</text><line x1="520" y1="154.375" x2="520" y2="200.625" stroke="#cbd5e1" stroke-width="1"/><text x="265.0" y="173.75" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">3 طبقات (بشرة وأدمة وتحت الجلد): فقد كامل لسمك الجلد في الدهون، وقد</text><text x="265.0" y="191.875" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">يتكون نفق تحت الحواف</text><rect x="10" y="200.625" width="620" height="28.125" rx="0" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="575.0" y="220.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">4</text><line x1="520" y1="200.625" x2="520" y2="228.75" stroke="#cbd5e1" stroke-width="1"/><text x="265.0" y="220.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">4 طبقات: يمتد حتى العضلة أو العظم أو الوتر</text><rect x="10" y="228.75" width="620" height="46.25" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="575.0" y="248.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">غير قابلة</text><text x="575.0" y="266.25" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">للتصنيف</text><line x1="520" y1="228.75" x2="520" y2="275.0" stroke="#cbd5e1" stroke-width="1"/><text x="265.0" y="248.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">قشرة سوداء/بنية (Eschar) أو جلد أصفر خيطي (Slough): تحتاج تنضيرًا قبل</text><text x="265.0" y="266.25" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">التصنيف</text><rect x="10" y="275.0" width="620" height="46.25" rx="0" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="575.0" y="294.375" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">إصابة الأنسجة</text><text x="575.0" y="312.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">العميقة</text><line x1="520" y1="275.0" x2="520" y2="321.25" stroke="#cbd5e1" stroke-width="1"/><text x="265.0" y="294.375" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">دهون تحت الجلد تالفة: لون بنفسجي داكن، وأحيانًا جرح مفتوح</text><rect x="330" y="329.25" width="300" height="111.6" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,339.25 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="348.25" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأماكن الأشيع</text><text x="620" y="372.25" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أسفل الظهر والأرداف (العجز والعصعص)</text><text x="620" y="389.65" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الكعبان والكاحلان</text><text x="620" y="407.04999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• عظام الورك</text><text x="620" y="424.44999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الكتف والكوعان</text><rect x="10" y="329.25" width="310" height="129.0" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M10,339.25 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#dc2626"/><text x="165.0" y="348.25" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأسباب وعوامل الخطر</text><text x="310" y="372.25" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• طريح الفراش</text><text x="310" y="389.65" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• سلس</text><text x="310" y="407.04999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• سوء تغذية</text><text x="310" y="424.44999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• اعتلال أعصاب السكري</text><text x="310" y="441.8499999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تليف الكبد = ألبومين منخفض</text><rect x="330" y="466.25" width="300" height="129.0" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M330,476.25 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#16a34a"/><text x="480.0" y="485.25" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج والتمريض</text><text x="620" y="509.25" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قيّم الجلد ووثّق (أول 24 ساعة)</text><text x="620" y="526.65" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• غيّر الوضع كل 1–2 ساعة</text><text x="620" y="544.05" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• بروتين وسوائل (2–3 لتر/يوم)</text><text x="620" y="561.4499999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• بول 30 مل/ساعة أو أقل = ضائقة كلوية</text><text x="620" y="578.8499999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ألبومين طبيعي 3.5–5.0</text><rect x="10" y="466.25" width="310" height="129.0" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M10,476.25 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#7c3aed"/><text x="165.0" y="485.25" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المتابعة</text><text x="310" y="509.25" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قس المرحلة والحجم واللون</text><text x="310" y="526.65" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مقياس برادن (Braden) لعوامل الخطر</text><text x="310" y="544.05" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• حفظ: Braden Scale يرصد الخطر</text><text x="310" y="561.4499999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• سؤال: بول 25 مل/ساعة يؤخر الالتئام (مرحلة</text><text x="310" y="578.8499999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  3)</text></svg>