<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="440" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ضعف السمع وفحص النظر عند الأطفال</text><rect x="330" y="50" width="290" height="80" rx="10" fill="#6366f1"/><text x="475.0" y="67.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ضعف السمع</text><text x="475.0" y="84.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">انسداد بالأذن الوسطى يمنع وصول الصوت</text><text x="475.0" y="101.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">فقدان توصيلي (Conductive) يسبب كتم الصوت</text><text x="475.0" y="118.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">تأخر الكلام إن لم يعالج</text><rect x="20" y="50" width="300" height="80" rx="10" fill="#f59e0b"/><text x="170.0" y="75.5" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">العلامات</text><text x="170.0" y="92.5" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">رضيع: لا مناغاة (ماما، دادا)</text><text x="170.0" y="109.5" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">دارج: كلام رتيب وصوت عالٍ وانسحاب وقلة انتباه</text><rect x="20" y="145" width="600" height="50" rx="10" fill="#16a34a"/><text x="320.0" y="164.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التدخلات</text><text x="320.0" y="182.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لغة الإشارة والمعينات السمعية</text><rect x="330" y="210" width="290" height="100" rx="10" fill="#0ea5e9"/><text x="475.0" y="246.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">فحص حدة الإبصار</text><text x="475.0" y="262.0" text-anchor="middle" font-size="10" font-weight="500" fill="#fff">لوحة سنلن أو حرف E: الطفل 3 م (10 قدم)، البالغ 6 م (20 قدم)</text><text x="475.0" y="278.0" text-anchor="middle" font-size="10" font-weight="500" fill="#fff">إحالة إن لم يتعرف 4 أحرف على سطر 10/15 (20/30)</text><rect x="20" y="210" width="300" height="100" rx="10" fill="#7c3aed"/><text x="170.0" y="245.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الرضع</text><text x="170.0" y="262.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">اختبارات منعكس الضوء: الرمش والانتباه ومتابعة الضوء</text><text x="170.0" y="279.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">عدم الاستجابة للضوء = ضعف رؤية</text><rect x="20" y="325" width="600" height="100" rx="10" fill="#334155"/><text x="320.0" y="360.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">الأعمار 3-5 سنوات: لوحة E أو سنلن</text><text x="320.0" y="377.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">التهابات أذن متكررة وبعض الأدوية والعيوب الخلقية من الأسباب</text><text x="320.0" y="394.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">مضاعفة اضطرابات الأذن الوسطى الطويلة: فقدان السمع</text></svg>