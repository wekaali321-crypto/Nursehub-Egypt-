<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 464" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="464" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع الذبحة وتثقيف النيتروجليسرين</text>
<rect x="14" y="44" width="300" height="110" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><rect x="14" y="44" width="300" height="26" rx="10" fill="#16a34a"/><text x="164.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >ذبحة مستقرة (Stable)</text><text x="304" y="89" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >ألم صدر بالمجهود: صعود سلالم، جماع</text><text x="304" y="110" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >يزول بالراحة (S = Stops with rest)</text><rect x="326" y="44" width="300" height="110" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="326" y="44" width="300" height="26" rx="10" fill="#dc2626"/><text x="476.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >ذبحة غير مستقرة (Unstable)</text><text x="616" y="89" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >ألم أثناء الراحة: إنذار جلطة</text><text x="616" y="110" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >تضيق أشد (U = Unrelieved at rest)</text><rect x="14" y="166" width="612" height="70" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><rect x="14" y="166" width="612" height="26" rx="10" fill="#7c3aed"/><text x="320.0" y="184" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >ذبحة متغايرة (Prinzmetal)</text><text x="616" y="211" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >تشنج مفاجئ في شريان تاجي؛ ليس من لويحة: توتر، منبهات (كافيين، ميث، كوكايين)، تدخين، برد</text><rect x="14" y="248" width="300" height="200" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><rect x="14" y="248" width="300" height="26" rx="10" fill="#2563eb"/><text x="164.0" y="266" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >النيتروجليسرين تحت اللسان</text><text x="304" y="293" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >قبل مجهود شديد</text><text x="304" y="312.5" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >هدف: بلا ألم بأنشطة اليوم</text><text x="304" y="332.0" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >اتصل بالإسعاف: ألم 5 دقائق بعد أول جرعة</text><text x="304" y="351.5" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >3 جرعات كحد أقصى بينها 5 دقائق</text><text x="304" y="371.0" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >لا تبلع، تحت اللسان</text><text x="304" y="390.5" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >زجاجة داكنة: ليس علبة أقراص أو سيارة أو كيس</text><text x="304" y="407.0" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >  بلاستيك</text><text x="304" y="426.5" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >بدّل حسب التاريخ (6 أشهر بعد الفتح عند بعض</text><text x="304" y="443.0" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >  الإرشادات)</text><rect x="326" y="248" width="300" height="200" rx="10" fill="#fff" stroke="#0891b2" stroke-width="1.5"/><rect x="326" y="248" width="300" height="26" rx="10" fill="#0891b2"/><text x="476.0" y="266" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >لصقة النيتروجليسرين</text><text x="616" y="293" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >مرة يومياً وليست عند اللزوم</text><text x="616" y="312.5" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >لصقة واحدة فقط</text><text x="616" y="332.0" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >الاستحمام مسموح</text><text x="616" y="351.5" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >مكان نظيف جاف محلوق، بدّل الموضع يومياً</text><text x="616" y="371.0" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >ليس على جلد مشعر/متندب/محروق/مجروح</text><text x="616" y="390.5" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >سقطت منذ أكثر من ساعة: خذ قرصاً أو بخاخاً،</text><text x="616" y="407.0" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >  واللصقة الجديدة تعمل بعد 40–60 دقيقة</text><text x="616" y="426.5" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >الممرض يلبس قفازات</text><text x="616" y="446.0" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >لا سيلدينافيل أبداً</text>
</svg>
