<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 696" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="700" height="696" rx="16" fill="#f8fafc"/>
<text x="350.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مضادات التخثر والجلطة: العلاج والاختبارات</text>
<rect x="522.9824561403509" y="52" width="167.01754385964912" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="606.4912280701755" y="72" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">الفئة</text>
<rect x="379.8245614035088" y="52" width="143.1578947368421" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="451.40350877192986" y="72" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">أمثلة</text>
<rect x="10.0" y="52" width="369.8245614035088" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="194.9122807017544" y="72" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">المراقبة</text>
<rect x="522.9824561403509" y="82" width="167.01754385964912" height="44.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="683.0" y="99" text-anchor="start" font-size="11.5" font-weight="800" fill="#0f172a">مضادات الصفائح (أقل</text>
<text x="683.0" y="116.25" text-anchor="start" font-size="11.5" font-weight="800" fill="#0f172a">قوة)</text>
<rect x="379.8245614035088" y="82" width="143.1578947368421" height="44.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="515.9824561403509" y="99" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">أسبرين، كلوبيدوجريل</text>
<rect x="10.0" y="82" width="369.8245614035088" height="44.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="372.8245614035088" y="99" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الصفائح (150–400 ألف طبيعي)؛ أقل من 50 ألف = خطر؛ لا</text>
<text x="372.8245614035088" y="116.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">تتأثر INR أو PTT</text>
<rect x="522.9824561403509" y="126.5" width="167.01754385964912" height="44.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="683.0" y="143.5" text-anchor="start" font-size="11.5" font-weight="800" fill="#0f172a">وارفارين (الأقوى)</text>
<rect x="379.8245614035088" y="126.5" width="143.1578947368421" height="44.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="515.9824561403509" y="143.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">وارفارين</text>
<rect x="10.0" y="126.5" width="369.8245614035088" height="44.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="372.8245614035088" y="143.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">INR؛ الهدف الشائع 2–3 (المرجع المستعمل 2.5–3.5)؛ ترياق:</text>
<text x="372.8245614035088" y="160.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">فيتامين K (تجنب الورقيات الخضراء الكثيرة)</text>
<rect x="522.9824561403509" y="171.0" width="167.01754385964912" height="44.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="683.0" y="188.0" text-anchor="start" font-size="11.5" font-weight="800" fill="#0f172a">هيبارين/إينوكسابارين</text>
<rect x="379.8245614035088" y="171.0" width="143.1578947368421" height="44.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="515.9824561403509" y="188.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">هيبارين</text>
<rect x="10.0" y="171.0" width="369.8245614035088" height="44.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="372.8245614035088" y="188.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">aPTT حوالي 46–70 ثانية (1.5–2.5 ضعف)؛ ترياق: بروتامين</text>
<text x="372.8245614035088" y="205.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">سلفات</text>
<rect x="14.0" y="229.5" width="672.0" height="136.25" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="14.0" y="229.5" width="672.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="350.0" y="247.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">خطر النزف وتثقيف</text>
<text x="676.0" y="273.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا قرحة هضمية أو نزف نشط</text>
<text x="676.0" y="292.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا سجاد أو ممرات مظلمة (خطر السقوط)</text>
<text x="676.0" y="312.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا موسى حلاقة ولا فرشاة قاسية ولا إمساك شديد</text>
<text x="676.0" y="331.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا NSAIDs</text>
<text x="676.0" y="350.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تجنب الأعشاب الزائدة التي ترفع النزف: إكيناسيا، فيتامين A، جنكو، ثوم، جينسنغ، أوميغا 3</text>
<rect x="356.0" y="385.75" width="330.0" height="166.75" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="356.0" y="385.75" width="330.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="521.0" y="403.75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الجلطة (MI): الأولوية إزالة الخثرة</text>
<text x="676.0" y="429.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تروبونين إيجابي = جلطة</text>
<text x="676.0" y="449.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تدخل: قسطرة PCI (-graphy,-plasty) أو جراحة</text>
<text x="676.0" y="466.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">CABG</text>
<text x="676.0" y="485.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قبل: صيام 6–12 ساعة</text>
<text x="676.0" y="504.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• بعد: لا رفع ثقيل، استلقاء، دش مسموح بلا نقع،</text>
<text x="676.0" y="522.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">وراقب عدوى الجرح (احمرار ودفء وإفراز)</text>
<rect x="14.0" y="385.75" width="330.0" height="166.75" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.2"/>
<rect x="14.0" y="385.75" width="330.0" height="26" rx="10" fill="#6366f1" fill-opacity="1" stroke="#6366f1" stroke-width="1.2"/>
<text x="179.0" y="403.75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">حالّات الخثرة t-PA، ستربتوكيناز</text>
<text x="334.0" y="429.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تذيب الخثرة فقط (الهيبارين لا يذيبها)</text>
<text x="334.0" y="449.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• خطر نزف خلال نحو 8 ساعات: لا حقن (وريد، تحت</text>
<text x="334.0" y="466.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">جلد، عضل، شريان غازات)، لا قسطرة وريد مركزي، فقط</text>
<text x="334.0" y="483.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">أماكن قابلة للضغط</text>
<text x="334.0" y="502.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• موانع: نزف نشط، قرحة هضمية (الحيض آمن)، تشوه</text>
<text x="334.0" y="520.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">شرياني وريدي، نزف دماغي، نقص سكر نسبي، ضغط فوق</text>
<text x="334.0" y="537.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">180/110</text>
<rect x="14.0" y="572.5" width="672.0" height="95.75" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="14.0" y="572.5" width="672.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="350.0" y="590.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">اختبار الجهد (ليس لمريض MI الحاد)</text>
<text x="676.0" y="616.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• الجهاز المتحرك: توقف الاختبار عند ألم صدر أو ارتفاع ST</text>
<text x="676.0" y="635.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• الكيماوي النووي: قبل 24–48 ساعة لا سجائر ولا كافيين (حتى منزوع الكافيين) ولا أدوية نيترو أو بيتا أو</text>
<text x="676.0" y="653.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">ثيوفيلين، صيام 4 ساعات قبل وبعد</text>
</svg>
