<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="322" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">Sulfonamides (SMZ-TMP): الآلية والتثقيف</text><rect x="325.0" y="44" width="299.0" height="91.5" rx="10" fill="#fff" stroke="#1e3a8a" stroke-width="1.5"/><path d="M325.0 54a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#1e3a8a"/><text x="474.5" y="66" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الآلية</text><text x="474.5" y="94" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">trimethoprim-sulfamethoxazole</text><text x="474.5" y="110.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">(Bactrim)</text><text x="474.5" y="127" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">يوقف تصنيع حمض الفوليك في البكتيريا</text><rect x="16.0" y="44" width="299.0" height="91.5" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.5"/><path d="M16.0 54a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#be123c"/><text x="165.5" y="66" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">احذر</text><text x="165.5" y="94" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">غير آمن في الحمل</text><text x="165.5" y="110.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تحسس سلفا: طفح؛ تحسس السلفونيل يوريا</text><text x="165.5" y="127" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">مثل glyburide يستدعي الحذر</text><rect x="325.0" y="145.5" width="299.0" height="75" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.5"/><path d="M325.0 155.5a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#b45309"/><text x="474.5" y="167.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الشمس</text><text x="474.5" y="195.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">حروق شمس: واقي شمس وتجنب الشمس</text><rect x="16.0" y="145.5" width="299.0" height="75" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><path d="M16.0 155.5a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#0f766e"/><text x="165.5" y="167.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">البول والسوائل</text><text x="165.5" y="195.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">اشرب 2–3 لتر/يوم لتفادي بلورات البول</text><text x="165.5" y="212" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">البول المركّز كثافته عالية = جفاف</text><rect x="325.0" y="230.5" width="299.0" height="75" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M325.0 240.5a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#7c3aed"/><text x="474.5" y="252.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">حمض الفوليك</text><text x="474.5" y="280.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">قد يوصي الطبيب بحمض الفوليك؛ لا تبدأه</text><text x="474.5" y="297" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">من تلقاء نفسك</text></svg>