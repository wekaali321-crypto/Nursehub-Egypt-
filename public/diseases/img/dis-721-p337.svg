<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 458" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="458" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تليف الكبد (1): الفكرة ووظائف الكبد والألبومين</text><rect x="330" y="52" width="300" height="94.19999999999999" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الفكرة</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تليّف = تندّب الكبد: الأنسجة السليمة</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  تُستبدل بنسيج ندبي فيصبح الكبد صلبًا</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  كالصخر</text><rect x="10" y="52" width="310" height="111.6" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأسباب</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أي شيء يسبب التهابًا وتندبًا: إدمان</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الكحول</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• التهاب كبدي مزمن</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• التليف الكيسي (مخاط يسد الجسم والكبد)</text><text x="320" y="185.6" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الكبد: 4 وظائف كبرى</text><rect x="490" y="195.6" width="140" height="98" rx="8" fill="#fff" stroke="#ec4899" stroke-width="1.5"/><rect x="490" y="195.6" width="140" height="24" rx="8" fill="#ec4899"/><text x="560" y="212.6" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">الإنتاج</text><text x="560" y="239.6" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">ألبومين، صفراء</text><text x="560" y="257.6" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">(Bile)، عوامل</text><text x="560" y="275.6" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">التجلط</text><rect x="335" y="195.6" width="140" height="98" rx="8" fill="#fff" stroke="#ec4899" stroke-width="1.5"/><rect x="335" y="195.6" width="140" height="24" rx="8" fill="#ec4899"/><text x="405" y="212.6" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">إزالة السمية</text><text x="405" y="239.6" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تحويل الأمونيا</text><rect x="180" y="195.6" width="140" height="98" rx="8" fill="#fff" stroke="#ec4899" stroke-width="1.5"/><rect x="180" y="195.6" width="140" height="24" rx="8" fill="#ec4899"/><text x="250" y="212.6" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">أيض الأدوية</text><text x="250" y="239.6" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">معالجة الأدوية</text><rect x="25" y="195.6" width="140" height="98" rx="8" fill="#fff" stroke="#ec4899" stroke-width="1.5"/><rect x="25" y="195.6" width="140" height="24" rx="8" fill="#ec4899"/><text x="95" y="212.6" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">تخزين الجلايكوجين</text><text x="95" y="239.6" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">مخزن سكر</text><rect x="330" y="305.6" width="300" height="94.19999999999999" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M330,315.6 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#7c3aed"/><text x="480.0" y="324.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الألبومين (A)</text><text x="620" y="348.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ينقل الأدوية في الجسم</text><text x="620" y="366.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• يجذب الماء (Attracts water)</text><text x="620" y="383.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• يرتبط بالكالسيوم</text><rect x="10" y="305.6" width="310" height="129.0" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.5"/><path d="M10,315.6 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#be123c"/><text x="165.0" y="324.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الصفراء والتجلط</text><text x="310" y="348.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الصفراء تحمل الكوليسترول والبيليروبين</text><text x="310" y="366.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  خارج الجسم عبر الأمعاء</text><text x="310" y="383.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• فشل الكبد: بيليروبين عالٍ = يرقان (اصفرار</text><text x="310" y="400.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  العين والجلد، الصلبة)</text><text x="310" y="418.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• نقص عوامل التجلط: الخطر الأكبر = النزف</text></svg>