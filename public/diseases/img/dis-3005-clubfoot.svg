<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="330" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">القدم الحنفاء (Talipes Equinovarus): العلاج والتثقيف</text><rect x="330" y="50" width="290" height="80" rx="10" fill="#f59e0b"/><text x="475.0" y="66.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">الوصف</text><text x="475.0" y="84.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">تشوه عظمي: قدم أو قدمان ملتويتان</text><text x="475.0" y="102.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">القدم تتجه للأسفل والداخل</text><text x="475.0" y="120.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">وأخمصا القدمين متقابلان</text><rect x="20" y="50" width="300" height="80" rx="10" fill="#0ea5e9"/><text x="170.0" y="66.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج</text><text x="170.0" y="84.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">جبس طويل للساق مع تغيير أسبوعي (5-8 أسابيع)</text><text x="170.0" y="102.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">بعده جبيرة/دعامة (Denis Browne)</text><text x="170.0" y="120.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">الجراحة قد تلزم لبعض الحالات</text><rect x="330" y="145" width="290" height="130" rx="10" fill="#16a34a"/><text x="475.0" y="178.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">تثقيف الأهل</text><text x="475.0" y="195.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">جبس جديد كل أسبوع لمدة 5-8 أسابيع</text><text x="475.0" y="212.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">افحص أصابع القدم عدة مرات يوميًا (وردية ودافئة)</text><text x="475.0" y="229.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">حافظ على الجبس جافًا أثناء الاستحمام وتغيير الحفاضات</text><text x="475.0" y="246.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">تمارين مع كل تغيير حفاضة</text><rect x="20" y="145" width="300" height="130" rx="10" fill="#dc2626"/><text x="170.0" y="178.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ممنوع</text><text x="170.0" y="195.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">لا ترفع القدم بمخدة أثناء النوم</text><text x="170.0" y="212.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">لا ينام على بطنه أبدًا</text><text x="170.0" y="229.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">خطر الموت المفاجئ للرضيع (SIDS)</text><text x="170.0" y="246.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">الجراحة والجبس تصحح التشوه؛ التشوه الوضعي يمكن تصحيحه سلبيًا</text><rect x="20" y="288" width="600" height="30" rx="10" fill="#334155"/><text x="320.0" y="306.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">هدف العلاج: تصحيح التشوه</text></svg>