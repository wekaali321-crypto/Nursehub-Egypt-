<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="320" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أخذ عينة بول معقمة من كيس القسطرة</text><rect x="330" y="50" width="290" height="88" rx="10" fill="#2563eb"/><text x="475.0" y="89.55" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1</text><text x="475.0" y="107.55" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">اربط/اغلق الأنبوب أسفل المنفذ</text><rect x="20" y="50" width="290" height="88" rx="10" fill="#0891b2"/><text x="165.0" y="89.55" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2</text><text x="165.0" y="107.55" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">انتظر 15-30 دقيقة</text><rect x="330" y="150" width="290" height="88" rx="10" fill="#16a34a"/><text x="475.0" y="189.55" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">3</text><text x="475.0" y="207.55" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">امسح المنفذ بمسحة مطهرة</text><rect x="20" y="150" width="290" height="88" rx="10" fill="#ea580c"/><text x="165.0" y="189.55" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4</text><text x="165.0" y="207.55" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">أدخل أداة معقمة بلا إبرة واسحب العينة عبر المنفذ</text><text x="320" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">لا تسحب من الكيس نفسه ولا تفصل نظام القسطرة</text></svg>