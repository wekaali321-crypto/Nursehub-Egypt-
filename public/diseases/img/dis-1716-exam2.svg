<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="366" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">فحص المولود (2): بطن وأطراف وظهر ووركان</text><rect x="426" y="46" width="193" height="132" rx="12" fill="#bae6fd"/><text x="522.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">البطن</text><text x="522.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">أصوات الأمعاء قد تغيب أو تقل</text><text x="522.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">تبول وعقي خلال 24 ساعة</text><text x="522.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">غير طبيعي: لا تبول 24 ساعة،</text><text x="522.5" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">انتفاخ، كتلة زيتونية (تضيق بواب)</text><rect x="223" y="46" width="193" height="132" rx="12" fill="#bbf7d0"/><text x="319.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">اليد والقدم</text><text x="319.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">خطوط أخمص القدم كاملة</text><text x="319.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">ازرقاق الأطراف طبيعي</text><text x="319.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">غير طبيعي: أخمص أملس (خديج)،</text><text x="319.5" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">قدم رحى (Clubfoot)، التصاق أصابع</text><rect x="20" y="46" width="193" height="132" rx="12" fill="#fde68a"/><text x="116.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">المنعكسات والتوتر</text><text x="116.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">توتر عضلي جيد</text><text x="116.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">غير طبيعي: ضعف توتر (تأخر الرأس)</text><rect x="426" y="188" width="193" height="132" rx="12" fill="#fecaca"/><text x="522.5" y="214" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الظهر والعمود</text><text x="522.5" y="238" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">وحمات وبقع منغولية</text><text x="522.5" y="258" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">غير طبيعي: نقرة عجزية (Spina bifida occulta)</text><text x="522.5" y="278" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">قيلة سحائية</text><rect x="223" y="188" width="193" height="132" rx="12" fill="#ddd6fe"/><text x="319.5" y="214" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الوركان</text><text x="319.5" y="238" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">DDH: خلل نمو الورك</text><rect x="20" y="188" width="193" height="132" rx="12" fill="#fed7aa"/><text x="116.5" y="214" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الأعضاء التناسلية والشرج</text><text x="116.5" y="238" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">أنثى: إفراز دموي أو مخاطي</text><text x="116.5" y="258" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">ذكر: خصيتان نازلتان</text><text x="116.5" y="278" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">شذوذ: شرج مسدود، قيلة مائية،</text><text x="116.5" y="298" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">إحليل سفلي، خصية معلقة</text><text x="320" y="354" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">شراين السرة: واحد = بلّغ</text>
</svg>
