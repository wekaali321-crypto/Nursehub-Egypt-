<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 551" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="551" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الفشل التنفسي وARDS</text><rect x="325" y="54" width="295" height="186.39999999999998" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="325" y="54" width="295" height="29" rx="10" fill="#0ea5e9"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الفشل التنفسي الحاد</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• الشعيرات لا تتبادل CO₂ والأكسجين</text><text x="612" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• نوعان: نقص أكسجة PaO₂ ≤ 60 / احتباس</text><text x="612" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">CO₂ PaCO₂ &gt; 50</text><text x="612" y="163.6" text-anchor="start" font-size="13" fill="#0f172a">• أول علامة: تغير الحالة العقلية</text><text x="612" y="181.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">(تهيّج، قلق، تشوش)</text><rect x="20" y="54" width="295" height="186.39999999999998" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="20" y="54" width="295" height="29" rx="10" fill="#ef4444"/><text x="307" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">ARDS</text><text x="307" y="99" text-anchor="start" font-size="13" fill="#0f172a">• نقص أكسجة عنيد: PaO₂ منخفض رغم</text><text x="307" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">الأكسجين</text><text x="307" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• الحويصلات تتصلب وتمتلئ بسوائل (حاجز</text><text x="307" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">متسرب)</text><text x="307" y="181.8" text-anchor="start" font-size="13" fill="#0f172a">• أسباب: إنتان، التهاب رئوي، استنشاق</text><text x="307" y="200" text-anchor="start" font-size="13" fill="#0f172a">سام، استنشاق قيء، التهاب بنكرياس حاد</text><text x="307" y="223.20000000000002" text-anchor="start" font-size="13" fill="#0f172a">• تشخيص تمريضي: ضعف تبادل الغازات</text><rect x="30" y="250.39999999999998" width="580" height="40" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="1.5"/><circle cx="578" cy="270.4" r="14" fill="#10b981"/><text x="578" y="275.4" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="554" y="275.4" text-anchor="start" font-size="13.5" fill="#0f172a">ارفع رأس السرير (Fowler العالي)</text><text x="320" y="301.4" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="304.4" width="580" height="40" rx="10" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="578" cy="324.4" r="14" fill="#0ea5e9"/><text x="578" y="329.4" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="554" y="329.4" text-anchor="start" font-size="13.5" fill="#0f172a">شفط فموي + أكسجين</text><text x="320" y="355.4" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="358.4" width="580" height="40" rx="10" fill="#6366f1" fill-opacity="0.14" stroke="#6366f1" stroke-width="1.5"/><circle cx="578" cy="378.4" r="14" fill="#6366f1"/><text x="578" y="383.4" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="554" y="383.4" text-anchor="start" font-size="13.5" fill="#0f172a">استمع لأصوات الرئة</text><text x="320" y="409.4" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="412.4" width="580" height="40" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.5"/><circle cx="578" cy="432.4" r="14" fill="#ef4444"/><text x="578" y="437.4" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="554" y="437.4" text-anchor="start" font-size="13.5" fill="#0f172a">أبلغ مقدم الرعاية — والتهوية الميكانيكية مع PEEP هي التدخل الأساسي</text><rect x="20" y="462.4" width="600" height="74" rx="10" fill="#f59e0b" fill-opacity="0.13" stroke="#f59e0b" stroke-width="1.5"/><text x="610" y="482.4" text-anchor="start" font-size="13.5" font-weight="800" fill="#f59e0b">نقطة امتحان</text><text x="610" y="502.4" text-anchor="start" font-size="13" fill="#0f172a">في الامتحان: غازات دم تدعم الفشل التنفسي الحاد = PaO₂ 47 مم زئبق مع PaCO₂ 63</text><text x="610" y="521.4" text-anchor="start" font-size="13" fill="#0f172a">مم زئبق.</text></svg>
