<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 541" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="541" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">نزيف الجهاز الهضمي</text>
<rect x="346.0" y="52" width="320.0" height="113.0" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="346.0" y="52" width="320.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="506.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأعلى (Upper)</text>
<text x="656.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أسبابه: التهاب المعدة، الارتجاع، قرحة هضمية،</text>
<text x="656.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">دوالي المريء</text>
<text x="656.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قيء دموي (Hematemesis) "كتفل القهوة"، وبراز</text>
<text x="656.0" y="149.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">أسود قطراني (Melena)</text>
<rect x="14.0" y="52" width="320.0" height="113.0" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="14.0" y="52" width="320.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="174.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأسفل (Lower)</text>
<text x="324.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أسبابه: بواسير، سرطان القولون والمستقيم،</text>
<text x="324.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">رتوج، قولون تقرحي</text>
<text x="324.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• نزف أحمر زاهٍ</text>
<rect x="346.0" y="177.0" width="320.0" height="170.75" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="346.0" y="177.0" width="320.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="506.0" y="195.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">اختبار الدم الخفي (Guaiac)</text>
<text x="656.0" y="221.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ① اجمع الأدوات واغسل يديك والبس قفازاً غير</text>
<text x="656.0" y="238.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">معقم</text>
<text x="656.0" y="257.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ② ضع عينات البراز في المربعات على الشريحة</text>
<text x="656.0" y="276.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ③ افتح الشريحة من الخلف وضع قطرتين من</text>
<text x="656.0" y="294.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">المحلول</text>
<text x="656.0" y="313.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ④ انتظر 30–60 ثانية (الأزرق = إيجابي)</text>
<text x="656.0" y="332.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ⑤ دوّن النتيجة</text>
<rect x="14.0" y="177.0" width="320.0" height="170.75" rx="10" fill="#7f1d1d" fill-opacity="0.1" stroke="#7f1d1d" stroke-width="1.2"/>
<rect x="14.0" y="177.0" width="320.0" height="26" rx="10" fill="#7f1d1d" fill-opacity="1" stroke="#7f1d1d" stroke-width="1.2"/>
<text x="174.0" y="195.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">المضاعفات: صدمة نقص الحجم</text>
<text x="324.0" y="221.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• هبوط ضغط وتسارع نبض (&gt;100)</text>
<text x="324.0" y="240.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• جلد شاحب بارد رطب ورطوبة</text>
<text x="324.0" y="259.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• إرهاق ودوخة</text>
<text x="324.0" y="278.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• هيموجلوبين أقل من 7</text>
<rect x="346.0" y="359.75" width="320.0" height="153.5" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="346.0" y="359.75" width="320.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="506.0" y="377.75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأولويات</text>
<text x="656.0" y="403.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• اخفض رأس السرير (وضع تسلسل)</text>
<text x="656.0" y="423.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• سوائل 0.9% لتثبيت الضغط</text>
<text x="656.0" y="442.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أكسجين</text>
<text x="656.0" y="461.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• نقل دم عند هيموجلوبين أقل من 7</text>
<text x="656.0" y="480.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• العلوي: غسيل معدة بأنبوب أنفي معدي (إلا مع</text>
<text x="656.0" y="498.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">دوالي المريء فلا أنبوب)</text>
<rect x="14.0" y="359.75" width="320.0" height="153.5" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.2"/>
<rect x="14.0" y="359.75" width="320.0" height="26" rx="10" fill="#6366f1" fill-opacity="1" stroke="#6366f1" stroke-width="1.2"/>
<text x="174.0" y="377.75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">المناظير</text>
<text x="324.0" y="403.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• Endoscopy للعلوي، وColonoscopy للسفلي</text>
<text x="324.0" y="423.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• بعد المنظار: سوائل صافية (عصير تفاح، مرق،</text>
<text x="324.0" y="440.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">شاي بلا سكر، جيلي)</text>
</svg>
