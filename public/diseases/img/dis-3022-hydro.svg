<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="330" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">استسقاء الدماغ (Hydrocephalus)</text><rect x="430" y="50" width="190" height="90" rx="10" fill="#6366f1"/><text x="525.0" y="72.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الآلية</text><text x="525.0" y="89.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">تجمع زائد للسائل الدماغي الشوكي</text><text x="525.0" y="106.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">يرفع الضغط داخل الجمجمة</text><text x="525.0" y="123.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">تلف الدماغ والموت</text><rect x="225" y="50" width="190" height="90" rx="10" fill="#ef4444"/><text x="320.0" y="80.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأسباب</text><text x="320.0" y="98.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">التهاب سحايا · أورام</text><text x="320.0" y="116.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">نزيف داخل الدماغ</text><rect x="20" y="50" width="190" height="90" rx="10" fill="#0ea5e9"/><text x="115.0" y="89.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التشخيص</text><text x="115.0" y="107.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">موجات فوق صوتية · رنين · أشعة مقطعية</text><rect x="330" y="155" width="290" height="110" rx="10" fill="#f59e0b"/><text x="475.0" y="187.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">العلامات (أقل من سنتين)</text><text x="475.0" y="204.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">بكاء حاد النبرة · يافوخ منتفخ</text><text x="475.0" y="221.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">تهيج وتغير الوعي · قيء وضعف مص</text><text x="475.0" y="238.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">نوبات · عين الشمس الغاربة · محيط رأس أكبر من الصدر</text><rect x="20" y="155" width="300" height="110" rx="10" fill="#16a34a"/><text x="170.0" y="178.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج والتمريض</text><text x="170.0" y="195.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">تحويلة بطينية بريتونية (VP shunt)</text><text x="170.0" y="212.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">بعد العملية: قياس محيط الرأس</text><text x="170.0" y="229.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">وضع نصف جالس</text><text x="170.0" y="246.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">تهيج وقيء بعد القيلولة = اتصل بالطبيب</text><rect x="20" y="280" width="600" height="40" rx="10" fill="#334155"/><text x="320.0" y="303.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تقييم اليافوخ أولًا</text></svg>