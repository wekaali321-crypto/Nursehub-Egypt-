<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 357" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="357" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">مضادات الطفيليات الأوالية والملاريا</text><rect x="506.1" y="44" width="113.9" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="563.0" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">الدواء</text><rect x="323.8" y="44" width="182.3" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="414.9" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">الاستعمال</text><rect x="20.0" y="44" width="303.8" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="171.9" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">نقاط</text><rect x="506.1" y="74.5" width="113.9" height="80.0" fill="#fff" stroke="#cbd5e1"/><text x="563.0" y="118.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">chloroquine</text><rect x="323.8" y="74.5" width="182.3" height="80.0" fill="#fff" stroke="#cbd5e1"/><text x="414.9" y="110.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">علاج ووقاية الملاريا،</text><text x="414.9" y="126.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أميبا خارج الأمعاء</text><rect x="20.0" y="74.5" width="303.8" height="80.0" fill="#fff" stroke="#cbd5e1"/><text x="171.9" y="93.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تغيرات ECG وهبوط ضغط؛ وقاية 300 مغ</text><text x="171.9" y="110.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أسبوعيًا قبل السفر بأسبوع أو أسبوعين</text><text x="171.9" y="126.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">وتستمر 4 أسابيع بعد العودة (راجع</text><text x="171.9" y="143.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">النشرة)</text><rect x="506.1" y="154.5" width="113.9" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="563.0" y="181.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">doxycycline</text><rect x="323.8" y="154.5" width="182.3" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="414.9" y="173.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">وقاية قصيرة من</text><text x="414.9" y="190.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الملاريا</text><rect x="20.0" y="154.5" width="303.8" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="171.9" y="173.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">100 مغ يوميًا من يوم أو يومين قبل السفر</text><text x="171.9" y="190.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">ولمدة 4 أسابيع بعد العودة (راجع النشرة)</text><rect x="506.1" y="201.5" width="113.9" height="63.5" fill="#fff" stroke="#cbd5e1"/><text x="563.0" y="237.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">quinine</text><rect x="323.8" y="201.5" width="182.3" height="63.5" fill="#fff" stroke="#cbd5e1"/><text x="414.9" y="237.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">علاج الملاريا</text><rect x="20.0" y="201.5" width="303.8" height="63.5" fill="#fff" stroke="#cbd5e1"/><text x="171.9" y="220.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">cinchonism: طنين، دوار، صداع، اضطراب</text><text x="171.9" y="237.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">بصري وهضمي؛ مضاد استطباب في الوهن</text><text x="171.9" y="253.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">العضلي الوبيل</text><rect x="506.1" y="265" width="113.9" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="563.0" y="292.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">metronidazole</text><rect x="323.8" y="265" width="182.3" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="414.9" y="284.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تريكوموناس، أميبا</text><text x="414.9" y="300.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">معوية، جيارديا</text><rect x="20.0" y="265" width="303.8" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="171.9" y="292.3" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">اعتلال أعصاب طرفي؛ لا كحول</text><rect x="506.1" y="312" width="113.9" height="30.5" fill="#fff" stroke="#cbd5e1"/><text x="563.0" y="331.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">paromomycin</text><rect x="323.8" y="312" width="182.3" height="30.5" fill="#fff" stroke="#cbd5e1"/><text x="414.9" y="331.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أميبا معوية</text><rect x="20.0" y="312" width="303.8" height="30.5" fill="#fff" stroke="#cbd5e1"/><text x="171.9" y="331.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">سمّية كلى وأذن</text></svg>