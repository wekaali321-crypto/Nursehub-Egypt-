<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 378" width="640" height="378" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="أدوية النقرس: Allopurinol مقابل Colchicine"><rect width="640" height="378" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">أدوية النقرس: Allopurinol مقابل Colchicine</text><rect x="326.0" y="46" width="302.0" height="170" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Allopurinol</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• يمنع النوبات (الوقاية): P = Prevents</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• يخفض حمض اليوريك (لا يسكّن الألم)</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• أوقف عند أول طفح وأبلغ (ALLopurinol =</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">   طفح ALL over)</text><text x="616.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• أكثر السوائل</text><text x="616.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">• مع كوب ماء كامل</text><text x="616.0" y="202" text-anchor="start" font-size="12.5" fill="#1d2939">• تقييم الفعالية: حمض يوريك طبيعي</text><rect x="12.0" y="46" width="302.0" height="152" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="12.0" y="60" width="302.0" height="14" fill="#b42318"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Colchicine</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• للنوبة الحادة (C = aCute)</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• لا يسكّن الألم مباشرة</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• للألم: Naproxen (NSAID)</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• غثيان وقيء وتثبيط نقي: خط ثانٍ</text><text x="302.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• مانع: اضطرابات الجهاز</text><text x="302.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">   الهضمي/الكلى/الكبد/القلب الشديدة</text><rect x="12.0" y="210" width="302.0" height="152" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="12.0" y="210" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="12.0" y="224" width="302.0" height="14" fill="#a86a00"/><text x="163.0" y="229" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">تثقيف</text><text x="302.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• سوائل كثيرة (10 أكواب يوميًا حتى زوال</text><text x="302.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">   النوبة)</text><text x="302.0" y="294" text-anchor="start" font-size="12.5" fill="#1d2939">• مع الطعام لتخفيف المعدة</text><text x="302.0" y="312" text-anchor="start" font-size="12.5" fill="#1d2939">• تجنب مرضى الكلى والكبد (بحذر)</text><text x="302.0" y="330" text-anchor="start" font-size="12.5" fill="#1d2939">• «سأحد من السوائل» = يحتاج تعليمًا</text><text x="302.0" y="348" text-anchor="start" font-size="12.5" fill="#1d2939">   إضافيًا</text></svg>