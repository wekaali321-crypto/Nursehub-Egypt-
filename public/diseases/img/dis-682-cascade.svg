<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 442" width="640" height="442" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="442" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a" direction="rtl">تسلسل التجلط المنتشر (DIC)</text><rect x="20" y="56" width="600" height="54" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="606" y="80" text-anchor="end" font-size="16" font-weight="700" fill="#0f172a">محفّز شديد</text><text x="606" y="102" text-anchor="end" font-size="14" fill="#334155">إنتان (Sepsis)، صدمة، ولادة/مضاعفات حمل، رضوح، سرطان</text><path d="M320 110 v14" stroke="#64748b" stroke-width="2"/><path d="M314 119 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="20" y="130" width="600" height="54" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="606" y="154" text-anchor="end" font-size="16" font-weight="700" fill="#0f172a">تنشيط التجلط في كل الجسم</text><text x="606" y="176" text-anchor="end" font-size="14" fill="#334155">جلطات صغيرة في الأوعية الدقيقة (Microthrombi)</text><path d="M320 184 v14" stroke="#64748b" stroke-width="2"/><path d="M314 193 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="20" y="204" width="600" height="54" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="606" y="228" text-anchor="end" font-size="16" font-weight="700" fill="#0f172a">استهلاك العوامل والصفائح</text><text x="606" y="250" text-anchor="end" font-size="14" fill="#334155">تنفد الصفائح وعوامل التجلط والفيبرينوجين</text><path d="M320 258 v14" stroke="#64748b" stroke-width="2"/><path d="M314 267 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="20" y="278" width="600" height="54" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="606" y="302" text-anchor="end" font-size="16" font-weight="700" fill="#0f172a">نزف + نقص أكسجة الأعضاء</text><text x="606" y="324" text-anchor="