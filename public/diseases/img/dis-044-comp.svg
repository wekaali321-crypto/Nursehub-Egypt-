<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 442" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="442" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مضاعفات الالتهاب الرئوي الحرجة</text><rect x="16" y="56" width="608" height="128" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><rect x="16" y="56" width="608" height="30" rx="12" fill="#2563eb"/><text x="320" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الانصباب الجنبي</text><text x="614" y="108" text-anchor="end" font-size="13" fill="#1e3a8a">علامات D: ألم عند الشهيق، ضيق نفس، نقص أصوات التنفس، كتامة عند القرع</text><text x="614" y="127" text-anchor="end" font-size="13" fill="#1e3a8a">العلاج: بزل الصدر (Thoracentesis)</text><text x="614" y="146" text-anchor="end" font-size="13" fill="#1e3a8a">مضاعفتان: استرواح وهيموثوراكس</text><text x="614" y="165" text-anchor="end" font-size="13" fill="#1e3a8a">بلّغ: عدم تماثل توسع الصدر ونقص أصوات التنفس</text><rect x="16" y="196" width="608" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><rect x="16" y="196" width="608" height="30" rx="12" fill="#7c3aed"/><text x="320" y="217" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ARDS</text><text x="614" y="248" text-anchor="end" font-size="13" fill="#4c1d95">نقص أكسجة مقاوم للأكسجين</text><text x="614" y="267" text-anchor="end" font-size="13" fill="#4c1d95">أول علامة: تغير الحالة الذهنية</text><rect x="16" y="298" width="608" height="128" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><rect x="16" y="298" width="608" height="30" rx="12" fill="#dc2626"/><text x="320" y="319" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الصدمة الإنتانية</text><text x="614" y="350" text-anchor="end" font-size="13" fill="#7f1d1d">ضغط انقباضي أقل من 90، MAP أقل من 65، امتلاء شعري أكثر من 3–4 ثوانٍ، تسرع قلب</text><text x="614" y="369" text-anchor="end" font-size="13" fill="#7f1d1d">حمى مبكرًا ثم انخفاض حرارة (أقل من 36°م / 96.8°F) متأخرًا</text><text x="614" y="388" text-anchor="end" font-size="13" fill="#7f1d1d">WBC مرتفع، بول 30 mL/ساعة أو أقل</text><text x="614" y="407" text-anchor="end" font-size="13" fill="#7f1d1d">قد تؤدي إلى فشل أعضاء متعدد MODS</text></svg>