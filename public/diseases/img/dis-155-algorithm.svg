<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="350" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >عين حمرا: ابدأ بالأعراض</text><rect x="190" y="44" width="260" height="40" rx="12" fill="#1e293b"/><text x="320" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff" >عين حمرا — ألم؟ رؤية؟ رهاب ضوء؟</text><line x1="320" y1="84" x2="115" y2="120" stroke="#475569" stroke-width="2"/><rect x="20" y="120" width="190" height="150" rx="14" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><text x="115" y="148" text-anchor="middle" font-size="13.5" font-weight="800" fill="#16a34a" >انزعاج فقط</text><text x="115" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" >ملتحمة</text><text x="115" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" >فيروسي أو بكتيري</text><text x="115" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" >حساسية أو جفاف</text><text x="115" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" >episcleritis</text><line x1="320" y1="84" x2="320" y2="120" stroke="#475569" stroke-width="2"/><rect x="225" y="120" width="190" height="150" rx="14" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><text x="320" y="148" text-anchor="middle" font-size="13.5" font-weight="800" fill="#dc2626" >ألم + رهاب ضوء + تشنج جفن</text><text x="320" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" >قرنية (قرحة/جسم غريب)</text><text x="320" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" >uveitis</text><text x="320" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" >جلوكوما حادة</text><line x1="320" y1="84" x2="525" y2="120" stroke="#475569" stroke-width="2"/><rect x="430" y="120" width="190" height="150" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="525" y="148" text-anchor="middle" font-size="13.5" font-weight="800" fill="#7c3aed" >جحوظ / حركة العين محدودة</text><text x="525" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" >ورم الحجاج</text><text x="525" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" >فرط الدرقية</text><text x="525" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" >(مع ألم) cellulitis أو CST</text><rect x="20" y="286" width="600" height="48" rx="12" fill="#fef3c7"/><text x="320" y="316" text-anchor="middle" font-size="13.5" font-weight="800" fill="#92400e" >ألم + نقص رؤية + حدقة غير متفاعلة أو قرنية معتمة = طبيب عيون فوراً</text>
</svg>
