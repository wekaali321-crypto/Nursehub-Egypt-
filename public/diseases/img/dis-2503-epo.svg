<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 371" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="371" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">إريثروبويتين (Epoetin alfa)</text><text x="320" y="50" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">هرمون يصنعه الكلى ويحفّز النخاع لإنتاج الكرات الحمراء</text><rect x="330" y="70" width="300" height="111.6" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,80 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="89" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الاستطباب</text><text x="620" y="113" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أنيميا (Hgb أقل من 10 جم/دل غالبًا)</text><text x="620" y="130.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الفشل الكلوي المزمن: الكلى لا تفرز</text><text x="620" y="147.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الهرمون</text><text x="620" y="165.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• النتيجة: طاقة أكثر وتخفيف الأعراض</text><rect x="10" y="70" width="310" height="76.8" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M10,80 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#dc2626"/><text x="165.0" y="89" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ممنوع/تحذير</text><text x="310" y="113" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ضغط دم غير منضبط: قِس الضغط قبل كل جرعة</text><text x="310" y="130.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الدواء يزيد الكرات فيرفع الضغط</text><rect x="330" y="189.6" width="300" height="94.19999999999999" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M330,199.6 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#7c3aed"/><text x="480.0" y="208.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">طريقة الإعطاء</text><text x="620" y="232.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• وريدي (IV) أو تحت الجلد (SQ)</text><text x="620" y="250.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ليس عضليًا IM: لا ألية ولا دالية ولا</text><text x="620" y="267.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  فخذ</text><rect x="10" y="189.6" width="310" height="94.19999999999999" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M10,199.6 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#16a34a"/><text x="165.0" y="208.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الاستجابة المطلوبة</text><text x="310" y="232.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ارتفاع الهيموجلوبين والهيماتوكريت</text><text x="310" y="250.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• طاقة أكثر</text><text x="310" y="267.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• راقب ضغط الدم طوال العلاج</text><rect x="10" y="293.79999999999995" width="620" height="50" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/><text x="320" y="315.79999999999995" text-anchor="middle" font-size="12.5" font-weight="600" fill="#713f12">سؤال اختبار: الملاحظة التي تدل على فعالية الدواء هي ارتفاع الهيموجلوبين (مثلًا 15</text><text x="320" y="334.54999999999995" text-anchor="middle" font-size="12.5" font-weight="600" fill="#713f12">جم/دل في السؤال).</text></svg>