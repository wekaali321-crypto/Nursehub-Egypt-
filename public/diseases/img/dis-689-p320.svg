<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 514" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="514" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">نقص الصفائح (Thrombocytopenia)</text><rect x="60" y="52" width="500" height="28.849999999999998" rx="0" fill="#0369a1" stroke="#cbd5e1" stroke-width="1"/><text x="450.0" y="71.95" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">عدد الصفائح</text><line x1="340" y1="52" x2="340" y2="80.85" stroke="#cbd5e1" stroke-width="1"/><text x="200.0" y="71.95" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">المعنى</text><rect x="60" y="80.85" width="500" height="28.849999999999998" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="450.0" y="100.8" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">150,000 – 400,000</text><line x1="340" y1="80.85" x2="340" y2="109.69999999999999" stroke="#cbd5e1" stroke-width="1"/><text x="200.0" y="100.8" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">الطبيعي</text><rect x="60" y="109.69999999999999" width="500" height="28.849999999999998" rx="0" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="450.0" y="129.64999999999998" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">150,000 أو أقل</text><line x1="340" y1="109.69999999999999" x2="340" y2="138.54999999999998" stroke="#cbd5e1" stroke-width="1"/><text x="200.0" y="129.64999999999998" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">قلة صفائح</text><rect x="60" y="138.54999999999998" width="500" height="28.849999999999998" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="450.0" y="158.49999999999997" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">100,000</text><line x1="340" y1="138.54999999999998" x2="340" y2="167.39999999999998" stroke="#cbd5e1" stroke-width="1"/><text x="200.0" y="158.49999999999997" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">خطر كبير</text><rect x="60" y="167.39999999999998" width="500" height="28.849999999999998" rx="0" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="450.0" y="187.34999999999997" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">50,000 أو أقل</text><line x1="340" y1="167.39999999999998" x2="340" y2="196.24999999999997" stroke="#cbd5e1" stroke-width="1"/><text x="200.0" y="187.34999999999997" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">قاتل: نزف عفوي</text><rect x="330" y="206.24999999999997" width="300" height="94.19999999999999" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M330,216.24999999999997 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#7c3aed"/><text x="480.0" y="225.24999999999997" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأعراض</text><text x="620" y="249.24999999999997" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• خطر نزف كبير: أي صدمة بسيطة</text><text x="620" y="266.65" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• لثة تنزف، سرعة قلب</text><text x="620" y="284.04999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• نمش دموي (Petechiae)</text><rect x="10" y="206.24999999999997" width="310" height="94.19999999999999" rx="10" fill="#fff" stroke="#0891b2" stroke-width="1.5"/><path d="M10,216.24999999999997 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#0891b2"/><text x="165.0" y="225.24999999999997" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأسباب</text><text x="310" y="249.24999999999997" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• كابتات المناعة</text><text x="310" y="266.65" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أمراض الكبد (التهاب/تليف)</text><text x="310" y="284.04999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ITP (نقص الصفائح المناعي)</text><rect x="10" y="308.44999999999993" width="620" height="96" rx="10" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/><text x="320" y="330.44999999999993" text-anchor="middle" font-size="14" font-weight="800" fill="#6b21a8">الصفائح أقل من 100 ألف: احبس الـ «P» الأربعة</text><rect x="500" y="342.44999999999993" width="130" height="50" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="565" y="362.44999999999993" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">هيبارين</text><text x="565" y="382.44999999999993" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c3aed" direction="ltr">HeParin</text><rect x="350" y="342.44999999999993" width="130" height="50" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="415" y="362.44999999999993" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">أسبرين</text><text x="415" y="382.44999999999993" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c3aed" direction="ltr">AsPirin</text><rect x="200" y="342.44999999999993" width="130" height="50" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="265" y="362.44999999999993" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">كلوبيدوجريل</text><text x="265" y="382.44999999999993" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c3aed" direction="ltr">CloPidogrel</text><rect x="50" y="342.44999999999993" width="130" height="50" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="115" y="362.44999999999993" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">إينوكسابارين</text><text x="115" y="382.44999999999993" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7c3aed" direction="ltr">EnoxaParin</text><rect x="10" y="416.44999999999993" width="620" height="72.25" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/><text x="320" y="436.19999999999993" text-anchor="middle" font-size="12.5" font-weight="600" fill="#713f12">ثم: أبلغ الطبيب وخذ العلامات الحيوية. في أسئلة الأولويات اختر الحالة الأخطر قيمةً؛</text><text x="320" y="454.94999999999993" text-anchor="middle" font-size="12.5" font-weight="600" fill="#713f12">التليف (أقل من 50 ألف) أخطر من 68 ألف أو 75 ألف. التثقيف: لا شفرات ولا NSAIDs.</text></svg>