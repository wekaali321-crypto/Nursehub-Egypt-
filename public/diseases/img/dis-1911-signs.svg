<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="256" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">انغلاف الأمعاء: العلامات والعلاج</text><rect x="325" y="48" width="295" height="192" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">العلامات</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">براز مخلوط بدم ومخاط (Currant jelly)</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">كتلة بطنية بشكل النقانق (Sausage)</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">قيء غير قذفي</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">ألم متقطع: بكاء وسحب الركبتين للصدر وحماية</text><text x="610" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">البطن</text><text x="610" y="200" text-anchor="start" font-size="12.5" fill="#1e293b">التهاب بريتون: حمى، تصلب بطن، ألم عند</text><text x="610" y="220" text-anchor="start" font-size="12.5" fill="#1e293b">الارتداد</text><rect x="20" y="48" width="295" height="192" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">العلاج</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">حقنة هوائية (Pneumatic) — التدخل الأول</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">حقنة ملحية</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">حقنة باريوم: غذاء سائل صافٍ قبل الإجراء</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">الهدف: براز بني طبيعي (أبلغ الطبيب)</text>
</svg>
