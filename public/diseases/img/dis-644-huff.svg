<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 423" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="423" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تقنية السعال المتنفس (Huff coughing)</text><rect x="20" y="54" width="600" height="53" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><circle cx="590" cy="76" r="14" fill="#0d9488"/><text x="590" y="81" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="566" y="80" text-anchor="end" font-size="15" font-weight="800" fill="#134e4a">1</text><text x="566" y="100" text-anchor="end" font-size="13" fill="#134e4a">اجلس على كرسي وقدماك بعرض الكتفين وانحنِ للأمام.</text><text x="320" y="123" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="129" width="600" height="53" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><circle cx="590" cy="151" r="14" fill="#0d9488"/><text x="590" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="566" y="155" text-anchor="end" font-size="15" font-weight="800" fill="#134e4a">2</text><text x="566" y="175" text-anchor="end" font-size="13" fill="#134e4a">شهيق عميق بطيء من الفم باستخدام الحجاب الحاجز.</text><text x="320" y="198" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="204" width="600" height="53" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><circle cx="590" cy="226" r="14" fill="#0d9488"/><text x="590" y="231" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="566" y="230" text-anchor="end" font-size="15" font-weight="800" fill="#134e4a">3</text><text x="566" y="250" text-anchor="end" font-size="13" fill="#134e4a">احبس النفس 2–3 ثوانٍ ثم ازفر بقوة.</text><text x="320" y="273" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="279" width="600" height="53" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><circle cx="590" cy="301" r="14" fill="#0d9488"/><text x="590" y="306" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="566" y="305" text-anchor="end" font-size="15" font-weight="800" fill="#134e4a">4</text><text x="566" y="325" text-anchor="end" font-size="13" fill="#134e4a">كرّر Huff مرة أو مرتين مع تجنب السعال العادي.</text><text x="320" y="348" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="354" width="600" height="53" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><circle cx="590" cy="376" r="14" fill="#0d9488"/><text x="590" y="381" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text><text x="566" y="380" text-anchor="end" font-size="15" font-weight="800" fill="#134e4a">5</text><text x="566" y="400" text-anchor="end" font-size="13" fill="#134e4a">استرح 5–10 أنفاس عادية وكرر حتى تنظف الإفرازات.</text></svg>