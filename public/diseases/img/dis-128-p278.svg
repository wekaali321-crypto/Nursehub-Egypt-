<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 627" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="627" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قصور القلب: الأعراض والأسباب والأولويات</text>
<rect x="14.0" y="52" width="652.0" height="60.0" rx="10" fill="#0e7490" fill-opacity="0.1" stroke="#0e7490" stroke-width="1.2"/>
<rect x="14.0" y="52" width="652.0" height="26" rx="10" fill="#0e7490" fill-opacity="1" stroke="#0e7490" stroke-width="1.2"/>
<text x="340.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الفكرة</text>
<text x="656.0" y="96" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• القلب لا يحافظ على نتاج كافٍ فيتراكم السائل (Heavy fluid)؛ زيادة الوزن = زيادة الماء</text>
<rect x="571.7021276595744" y="132.0" width="98.29787234042551" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="620.8510638297872" y="152.0" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff"></text>
<rect x="290.8510638297872" y="132.0" width="280.8510638297872" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="431.27659574468083" y="152.0" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">قصور أيمن (ينقل الجسم)</text>
<rect x="10.0" y="132.0" width="280.8510638297872" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="150.4255319148936" y="152.0" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">قصور أيسر (الرئتان)</text>
<rect x="571.7021276595744" y="162.0" width="98.29787234042551" height="61.75" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="663.0" y="179.0" text-anchor="start" font-size="11.5" font-weight="800" fill="#0f172a">العلامات</text>
<rect x="290.8510638297872" y="162.0" width="280.8510638297872" height="61.75" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="564.7021276595744" y="179.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">وذمة طرفية، زيادة وزن، انتفاخ JVD، تضخم</text>
<text x="564.7021276595744" y="196.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">البطن: استسقاء وكبد وطحال كبيران</text>
<rect x="10.0" y="162.0" width="280.8510638297872" height="61.75" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="283.8510638297872" y="179.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">وذمة رئوية، خراخر لا تزول بالكحة، بلغم</text>
<text x="283.8510638297872" y="196.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">وردي رغوي، ضيق نفس عند الاستلقاء</text>
<text x="283.8510638297872" y="213.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">(Orthopnea)</text>
<rect x="571.7021276595744" y="223.75" width="98.29787234042551" height="44.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="663.0" y="240.75" text-anchor="start" font-size="11.5" font-weight="800" fill="#0f172a">الأسباب</text>
<rect x="290.8510638297872" y="223.75" width="280.8510638297872" height="44.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="564.7021276595744" y="240.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">ارتفاع ضغط، ارتفاع ضغط رئوي، رئتان</text>
<text x="564.7021276595744" y="258.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">متليفتان، قد يسببه القصور الأيسر</text>
<rect x="10.0" y="223.75" width="280.8510638297872" height="44.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="283.8510638297872" y="240.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">قلب ضعيف بعد الجلطة (MI)، مرض شرايين</text>
<text x="283.8510638297872" y="258.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">تاجية (CAD/ACS)</text>
<rect x="346.0" y="282.25" width="320.0" height="117.0" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="346.0" y="282.25" width="320.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="506.0" y="300.25" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">عوامل الخطر</text>
<text x="656.0" y="326.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ارتفاع الضغط (الأول)</text>
<text x="656.0" y="345.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• رجفان أذيني وعدم انتظام</text>
<text x="656.0" y="364.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ارتجاع تاجي</text>
<text x="656.0" y="384.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• اعتلال عضلة</text>
<rect x="14.0" y="282.25" width="320.0" height="117.0" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="14.0" y="282.25" width="320.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="174.0" y="300.25" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الفحوص</text>
<text x="324.0" y="326.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• BNP: فوق 900 قصور شديد</text>
<text x="324.0" y="345.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• إيكو: EF 55–70% طبيعي، 40% أو أقل قصور</text>
<text x="324.0" y="364.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قسطرة سوان-غانز (الضغط الرئوي): فوق 8 غير</text>
<text x="324.0" y="382.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">جيد (الطبيعي 2–8 مم زئبق حسب المرجع)</text>
<rect x="14" y="417.25" width="652" height="70.0" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.4"/>
<text x="654" y="437.25" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">وذمة رئوية حادة: كلمات الأولوية "جديد، مفاجئ، متفاقم، سريع". التدخل الأول: فيوروسيمايد وريدي.</text>
<text x="654" y="455.25" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">الخطوات: رفع رأس السرير 45 درجة أو أكثر (فاولر) • أكسجين • فيوروسيمايد + مورفين + محفزات</text>
<text x="654" y="473.25" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">انقباض إيجابية • وقف الملح والسوائل (لا شرب ولا سوائل وريدية).</text>
<rect x="14.0" y="501.25" width="652.0" height="97.75" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="14.0" y="501.25" width="652.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="340.0" y="519.25" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">3 أسئلة امتحان شائعة</text>
<text x="656.0" y="545.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• إمساك مريض القلب: مشي، ألياف، ملينات (لا زيادة ماء)</text>
<text x="656.0" y="564.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أطعمة يتجنبها: رقائق (شيبس)، دجاج مشوي وبطاطس مقلية، فاصوليا معلبة (كلها صوديوم)</text>
<text x="656.0" y="583.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• مريض قصور مزمن مع بلغم وردي رغوي وخراخر متفاقمة: بيوميتانيد وريدي أولاً</text>
</svg>
