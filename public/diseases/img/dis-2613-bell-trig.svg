<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="420" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">شلل بيل مقابل ألم العصب الثلاثي التوائم</text><rect x="290" y="48" width="330" height="40" fill="#0f766e" stroke="#cbd5e1"/><text x="455.0" y="71.85" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">العنصر</text><rect x="150" y="48" width="140" height="40" fill="#0f766e" stroke="#cbd5e1"/><text x="220.0" y="71.85" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">شلل بيل (Bell)</text><rect x="20" y="48" width="130" height="40" fill="#0f766e" stroke="#cbd5e1"/><text x="85.0" y="71.85" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">العصب الثلاثي</text><rect x="290" y="88" width="330" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="455.0" y="111.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">العصب</text><rect x="150" y="88" width="140" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="220.0" y="111.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">السابع (الوجهي) CN VII</text><rect x="20" y="88" width="130" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="85.0" y="111.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">الخامس CN V</text><rect x="290" y="128" width="330" height="40" fill="#f1f5f9" stroke="#cbd5e1"/><text x="455.0" y="151.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">الطبيعة</text><rect x="150" y="128" width="140" height="40" fill="#f1f5f9" stroke="#cbd5e1"/><text x="220.0" y="151.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">ضعف مفاجئ نصف الوجه، يزول غالبًا</text><rect x="20" y="128" width="130" height="40" fill="#f1f5f9" stroke="#cbd5e1"/><text x="85.0" y="151.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">صدمات كهربائية حادة في جانب</text><rect x="290" y="168" width="330" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="455.0" y="191.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">السبب</text><rect x="150" y="168" width="140" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="220.0" y="191.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">مجهول؛ هربس/جدري/حزام</text><rect x="20" y="168" width="130" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="85.0" y="191.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">تصلب متعدد، ورم، ضغط وعائي</text><rect x="290" y="208" width="330" height="40" fill="#f1f5f9" stroke="#cbd5e1"/><text x="455.0" y="231.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">الأعراض</text><rect x="150" y="208" width="140" height="40" fill="#f1f5f9" stroke="#cbd5e1"/><text x="220.0" y="231.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">تدلي جفن وفم، لا يغلق العين، جفاف عين، تسطح الثلم</text><rect x="20" y="208" width="130" height="40" fill="#f1f5f9" stroke="#cbd5e1"/><text x="85.0" y="231.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">ألم كالكهرباء بالشفة واللثة والخد، يشبه ألم الأسنان بمحفز ساخن/كافيين</text><rect x="290" y="248" width="330" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="455.0" y="271.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">الفحص</text><rect x="150" y="248" width="140" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="220.0" y="271.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">إغلاق العين ورفع الحاجب وإظهار الأسنان (لنفي السكتة)</text><rect x="20" y="248" width="130" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="85.0" y="271.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">MRI لنفي التصلب/ورم</text><rect x="290" y="288" width="330" height="40" fill="#f1f5f9" stroke="#cbd5e1"/><text x="455.0" y="311.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">العلاج</text><rect x="150" y="288" width="140" height="40" fill="#f1f5f9" stroke="#cbd5e1"/><text x="220.0" y="311.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">كورتيكوستيرويد، قطرة دمع، غطاء عين ليلًا</text><rect x="20" y="288" width="130" height="40" fill="#f1f5f9" stroke="#cbd5e1"/><text x="85.0" y="311.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">Carbamazepine، جراحة، تجنب المحفزات</text></svg>