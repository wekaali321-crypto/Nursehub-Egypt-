<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="320" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مرض ليغ-كالفي-بيرثز (Legg-Calve-Perthes)</text><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#475569"/></marker></defs><rect x="430" y="50" width="190" height="70" rx="10" fill="#ef4444"/><text x="525.0" y="70.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الآلية</text><text x="525.0" y="88.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">نقص تروية رأس عظم الفخذ</text><text x="525.0" y="106.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">موت العظم لنقص الأكسجين</text><rect x="225" y="50" width="190" height="70" rx="10" fill="#f59e0b"/><text x="320.0" y="70.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">الأعراض</text><text x="320.0" y="88.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">حركة محدودة · ألم وتيبس بالورك</text><text x="320.0" y="106.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">عرج عند المشي</text><rect x="20" y="50" width="190" height="70" rx="10" fill="#0ea5e9"/><text x="115.0" y="70.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التشخيص</text><text x="115.0" y="87.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">أشعة سينية للورك</text><text x="115.0" y="104.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">رنين مغناطيسي: شكل العظم والأوعية</text><line x1="425" y1="85" x2="415" y2="85" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/><line x1="220" y1="85" x2="210" y2="85" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/><rect x="20" y="140" width="600" height="150" rx="10" fill="#16a34a"/><text x="320.0" y="182.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج</text><text x="320.0" y="200.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">غالبًا يشفى ذاتيًا مع الوقت، فالعلاج يدور حول الراحة وضبط الألم والعلاج الطبيعي</text><text x="320.0" y="218.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">جبيرة لإبقاء الساقين مبعدتين وتوجيه رأس الفخذ داخل الحق</text><text x="320.0" y="236.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">الجراحة إن كان رأس الفخذ مخلوعًا لإعادة وضعه بشكل ثابت</text><text x="320.0" y="254.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تثقيف: الراحة، تجنب الأحمال، العلاج الطبيعي</text></svg>