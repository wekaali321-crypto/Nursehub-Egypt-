<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="320" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الإنتان البولي والتهاب الإحليل والتهاب الحالب</text><rect x="20" y="54" width="600" height="26.799999999999997" fill="#6366f1"/><text x="516.3255813953489" y="70.2" text-anchor="start" font-size="12" font-weight="700" fill="#fff">الإنتان البولي</text><text x="348.8837209302326" y="70.2" text-anchor="start" font-size="12" font-weight="700" fill="#fff">التهاب الإحليل</text><text x="167.48837209302332" y="70.2" text-anchor="start" font-size="12" font-weight="700" fill="#fff">التهاب الحالب</text><rect x="20" y="80.8" width="600" height="60.4" fill="#6366f1" fill-opacity="0.07" stroke="#6366f1" stroke-opacity="0.3"/><text x="614" y="97" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">التعريف</text><text x="516.3255813953489" y="97" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">بكتيريا سالبة الجرام</text><text x="516.3255813953489" y="113.8" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">تنشأ من المسالك البولية</text><text x="348.8837209302326" y="97" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">التهاب الإحليل، غالبًا من</text><text x="348.8837209302326" y="113.8" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">عدوى منقولة جنسيًا</text><text x="167.48837209302332" y="97" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">التهاب الحالب، مع</text><text x="167.48837209302332" y="113.8" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">عدوى بكتيرية أو</text><text x="167.48837209302332" y="130.6" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">فيروسية</text><rect x="20" y="141.2" width="600" height="77.19999999999999" fill="#fff" fill-opacity="1" stroke="#6366f1" stroke-opacity="0.3"/><text x="614" y="157.39999999999998" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">السبب</text><text x="516.3255813953489" y="157.39999999999998" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">E. coli؛ قسطرة بولية أو</text><text x="516.3255813953489" y="174.2" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">عدوى غير معالجة</text><text x="348.8837209302326" y="157.39999999999998" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">سيلان/كلاميديا، منتجات</text><text x="348.8837209302326" y="174.2" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">نسائية معطرة، مبيدات</text><text x="348.8837209302326" y="190.99999999999997" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">حيوانات منوية، التهاب</text><text x="348.8837209302326" y="207.79999999999995" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">مسالك</text><text x="167.48837209302332" y="157.39999999999998" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">عدوى أو التهاب حويضة</text><rect x="20" y="218.39999999999998" width="600" height="60.4" fill="#6366f1" fill-opacity="0.07" stroke="#6366f1" stroke-opacity="0.3"/><text x="614" y="234.59999999999997" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">الأعراض</text><text x="516.3255813953489" y="234.59999999999997" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">الحمى أولًا</text><text x="348.8837209302326" y="234.59999999999997" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">حرقة، تكرار، إلحاح،</text><text x="348.8837209302326" y="251.39999999999998" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">ليلًا؛ رجل: إفراز؛ امرأة:</text><text x="348.8837209302326" y="268.19999999999993" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">ألم أسفل البطن</text><text x="167.48837209302332" y="234.59999999999997" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">حرقة وتكرار وإفراز</text><rect x="20" y="278.79999999999995" width="600" height="26.799999999999997" fill="#fff" fill-opacity="1" stroke="#6366f1" stroke-opacity="0.3"/><text x="614" y="294.99999999999994" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">العلاج</text><text x="516.3255813953489" y="294.99999999999994" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">مضاد حيوي وريدي ثم فموي</text><text x="348.8837209302326" y="294.99999999999994" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">مضاد حيوي ± توسيع الإحليل</text><text x="167.48837209302332" y="294.99999999999994" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">حسب السبب</text></svg>
