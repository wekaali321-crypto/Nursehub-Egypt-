<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="380" rx="16" fill="#f8fafc"/>
<text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">حروق الشمس: الدرجات والوقاية</text>
<rect x="26" y="52" width="284" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
<text x="168.0" y="76" text-anchor="middle" font-size="15" font-weight="800" fill="#ea580c">درجة أولى (الأشهر)</text>
<text x="168.0" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">احمرار + سخونة</text>
<text x="168.0" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">ألم وحساسية للمس</text>
<text x="168.0" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">بدون فقاعات غالباً</text>
<text x="168.0" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">مهدّئات وترطيب ومسكن</text>
<rect x="330" y="52" width="284" height="150" rx="12" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.8"/>
<text x="472.0" y="76" text-anchor="middle" font-size="15" font-weight="800" fill="#b91c1c">درجة ثانية سطحية</text>
<text x="472.0" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">ظهور فقاعات (فقاقيع)</text>
<text x="472.0" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">ألم أشد وتورم</text>
<text x="472.0" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">لا تفقع الفقاعات</text>
<text x="472.0" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">تغطية نظيفة وراجع الطبيب</text>
<rect x="26" y="220" width="588" height="140" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="320" y="246" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">الوقاية: واقي الشمس (Sun Block)</text>
<text x="320" y="272" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">اختار SPF 30 أو أكتر ويحمي من UVA وUVB (واسع الطيف)</text>
<text x="320" y="291" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">ضعه قبل الخروج بـ 15–30 دقيقة</text>
<text x="320" y="310" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">الكريم بيشتغل نحو ساعتين فقط: جدّده كل ساعتين</text>
<text x="320" y="329" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">وبعد السباحة أو العرق الكتير</text>
<text x="320" y="348" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1e293b">وتجنّب شمس الظهيرة (10 ص – 4 م) + قبعة وملابس</text>
</svg>
