<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="342" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">العلاج بالصدمات الكهربائية (⁦ECT⁩) وإجراءات تحفيز الدماغ</text><text x="320" y="52" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b">⁦ECT⁩ الأكثر اختباراً، ثم ⁦TMS⁩ وتحفيز العصب المبهم</text><rect x="326" y="62" width="294" height="204" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><path d="M326 72a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#c2410c"/><text x="473" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">قبل ⁦ECT⁩</text><text x="610" y="108.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="598" y="108.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">قيّم التاريخ الطبي وأبلغ الطبيب: احتشاء</text><text x="598" y="126.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">حديث، ورم دماغي</text><text x="610" y="147.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="598" y="147.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">اسأل عن مخاوفه من ⁦ECT⁩ (نقطة امتحان)</text><text x="610" y="168.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="598" y="168.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">صائم ⁦6-8⁩ ساعات (⁦NPO⁩)</text><text x="610" y="190" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="598" y="190" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لا مضادات تشنج (فالبرويك، كاربامازيبين)</text><text x="610" y="211.125" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="598" y="211.125" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">انزع الأسنان الصناعية والعدسات</text><text x="610" y="232.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="598" y="232.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">فرّغ المثانة، موافقة مستنيرة موقعة</text><text x="610" y="253.375" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="598" y="253.375" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أجهزة: مراقب قلب، أكسجين، شفط، عربة طوارئ</text><rect x="20" y="62" width="294" height="204" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><path d="M20 72a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#15803d"/><text x="167" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">بعد ⁦ECT⁩</text><text x="304" y="108.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="108.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لا قيادة أثناء فترة العلاج (نقطة امتحان)</text><text x="304" y="129.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="129.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ارتباك وفقدان ذاكرة مؤقتان شائعان</text><text x="304" y="150.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="150.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">طمئنه أن فقد الذاكرة مؤقت</text><text x="304" y="171.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="171.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الآثار: فقد الذاكرة</text><rect x="20" y="278" width="600" height="52" rx="10" fill="#e0f2fe" stroke="#0e7490" stroke-width="1.5"/><text x="320" y="300" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">⁦ECT⁩: تيار كهربائي عبر فروة الرأس يحدث نوبة تشنج معممة (مثل إعادة ضبط الدماغ)</text><text x="320" y="320" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">نحو ⁦2-3⁩ مرات أسبوعياً لمجموع ⁦6-12⁩ جلسة</text></svg>