<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="360" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">الصداع: الأسباب وخطوات التقييم</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="20" y="45" width="190" height="30" rx="8" fill="#dbeafe"/><text x="115" y="65" fill="#1e3a8a">أسباب عامة</text>
    <text x="115" y="95" font-size="12" fill="#334155" font-weight="600">ضغط عالٍ / واطي</text>
    <text x="115" y="115" font-size="12" fill="#334155" font-weight="600">هبوط سكر</text>
    <text x="115" y="135" font-size="12" fill="#334155" font-weight="600">أنيميا • عدوى</text>
    <rect x="225" y="45" width="190" height="30" rx="8" fill="#fef9c3"/><text x="320" y="65" fill="#422006">أسباب موضعية</text>
    <text x="320" y="95" font-size="12" fill="#334155" font-weight="600">عين (انكسار) • جيوب</text>
    <text x="320" y="115" font-size="12" fill="#334155" font-weight="600">إصابة • ورم داخل الجمجمة</text>
    <text x="320" y="135" font-size="12" fill="#334155" font-weight="600">سحايا/التهاب مخ • نزيف • صداع نصفي</text>
    <rect x="430" y="45" width="190" height="30" rx="8" fill="#dcfce7"/><text x="525" y="65" fill="#14532d">نفسي وتوتر</text>
    <text x="525" y="95" font-size="12" fill="#334155" font-weight="600">صداع التوتر</text>
    <text x="525" y="115" font-size="12" fill="#334155" font-weight="600">قلق وإجهاد</text>
    <rect x="20" y="160" width="600" height="32" rx="8" fill="#0f172a"/><text x="320" y="181" fill="#fff">5 خطوات تقييم قبل أي دواء</text>
    <rect x="20" y="200" width="112" height="60" rx="8" fill="#e0f2fe"/><text x="76" y="224" fill="#0c4a6e">قيس الضغط</text><text x="76" y="244" font-size="11" fill="#0c4a6e">1</text>
    <rect x="144" y="200" width="112" height="60" rx="8" fill="#e0f2fe"/><text x="200" y="224" fill="#0c4a6e">قيس الحرارة</text><text x="200" y="244" font-size="11" fill="#0c4a6e">2</text>
    <rect x="268" y="200" width="112" height="60" rx="8" fill="#e0f2fe"/><text x="324" y="224" fill="#0c4a6e">ابحث عن شحوب</text><text x="324" y="244" font-size="11" fill="#0c4a6e">3</text>
    <rect x="392" y="200" width="112" height="60" rx="8" fill="#e0f2fe"/><text x="448" y="224" fill="#0c4a6e">اسأل عن إمساك</text><text x="448" y="244" font-size="11" fill="#0c4a6e">4</text>
    <rect x="516" y="200" width="104" height="60" rx="8" fill="#e0f2fe"/><text x="568" y="220" font-size="11" fill="#0c4a6e">عين/أنف/أذن/</text><text x="568" y="236" font-size="11" fill="#0c4a6e">أسنان/عصبي</text><text x="568" y="252" font-size="11" fill="#0c4a6e">5</text>
    <rect x="20" y="280" width="600" height="60" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="320" y="304" fill="#7f1d1d">علامات الخطر: مفاجئ جداً • حرارة وتيبّس رقبة • ضعف أو تشنج • بعد إصابة</text><text x="320" y="326" fill="#7f1d1d">= بلّغ فوراً</text>
  </g>
</svg>
