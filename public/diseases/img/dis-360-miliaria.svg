<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="250" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">حمو النيل: إزاي بيحصل وإزاي نمنعه</text>
<g font-size="14" font-weight="700" text-anchor="middle">
<rect x="20" y="55" width="130" height="90" rx="12" fill="#f97316"/><text x="85" y="90" fill="#fff">حر ورطوبة</text><text x="85" y="115" font-size="12" fill="#ffedd5">عرق كتير</text>
<text x="165" y="105" font-size="22" fill="#475569">←</text>
<rect x="180" y="55" width="130" height="90" rx="12" fill="#eab308"/><text x="245" y="90" fill="#422006">انسداد قنوات</text><text x="245" y="115" font-size="12" fill="#422006">الغدد العرقية</text>
<text x="325" y="105" font-size="22" fill="#475569">←</text>
<rect x="340" y="55" width="130" height="90" rx="12" fill="#dc2626"/><text x="405" y="90" fill="#fff">حبوب حمراء</text><text x="405" y="115" font-size="12" fill="#fee2e2">± هرش</text>
<text x="485" y="105" font-size="22" fill="#475569">←</text>
<rect x="500" y="55" width="125" height="90" rx="12" fill="#16a34a"/><text x="562" y="90" fill="#fff">تبريد وتهوية</text><text x="562" y="115" font-size="12" fill="#dcfce7">الحل الجذري</text></g>
<text x="320" y="190" text-anchor="middle" font-size="14" fill="#334155">الأماكن الأشهر: الرقبة والصدر والظهر والثنيات (تحت الإبط والأربية) وتحت الحفاض</text>
<text x="320" y="220" text-anchor="middle" font-size="13" fill="#64748b">أخف حل: استحمام بماء بارد + مكان مكيّف + ملابس قطنية خفيفة</text></svg>