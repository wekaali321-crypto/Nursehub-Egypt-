<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 473" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="473" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">إنذارات جهاز التنفس الصناعي</text><text x="320" y="52" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b">الإنذار يعني مشكلة: افحص المريض أولاً ثم الجهاز</text><rect x="327" y="64" width="293" height="207" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M327 74a10 10 0 0 1 10-10h273a10 10 0 0 1 10 10v22h-293z" fill="#b91c1c"/><text x="473.5" y="85" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">ضغط مرتفع (⁦High pressure⁩)</text><text x="610" y="110.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="110.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">انسداد أو مقاومة للهواء داخل الدورة</text><text x="610" y="131.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="131.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">عض المريض على الأنبوب (⁦Biting⁩)</text><text x="610" y="152.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="152.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">التواء أو انثناء الأنبوب (⁦Kinks⁩)</text><text x="610" y="173.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="173.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">إفرازات زائدة في المجرى الهوائي</text><text x="610" y="195" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="195" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">سدادة مخاط (⁦Mucus plug⁩)</text><text x="610" y="216.125" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="216.125" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">السعال أو مقاومة المريض للجهاز</text><text x="610" y="237.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="237.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">وذمة رئوية (⁦Pulmonary edema⁩)</text><text x="610" y="258.375" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="258.375" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">استرواح الصدر (⁦Pneumothorax⁩)</text><rect x="20" y="64" width="293" height="207" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/><path d="M20 74a10 10 0 0 1 10-10h273a10 10 0 0 1 10 10v22h-293z" fill="#0e7490"/><text x="166.5" y="85" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">ضغط منخفض (⁦Low pressure⁩)</text><text x="303" y="110.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="291" y="110.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">فقدان التوصيل أو تسرب هواء</text><text x="303" y="131.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="291" y="131.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">تسرب من بالون الأنبوب (⁦Cuff leak⁩)</text><text x="303" y="152.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="291" y="152.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">انزياح الأنبوب الرغامي (⁦ET displacement⁩)</text><text x="303" y="173.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="291" y="173.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">انفصال الدائرة عن المريض (⁦Disconnection⁩)</text><rect x="20" y="283" width="600" height="62" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="320" y="307" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">القاعدة: ضغط مرتفع = انسداد  |  ضغط منخفض = هروب هواء</text><text x="320" y="329" text-anchor="middle" font-size="12" font-weight="400" fill="#713f12">ضغط الجهاز يرتفع حين يصعب دخول الهواء، وينخفض حين يتسرب</text><rect x="20" y="359" width="600" height="100" rx="10" fill="#fff" stroke="#475569" stroke-width="1.5"/><text x="610" y="381" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">سؤال امتحاني نموذجي: ما الذي تفحصه عند إنذار الضغط المرتفع؟ (اختر الكل)</text><text x="610" y="403" text-anchor="start" font-size="12.5" font-weight="400" fill="#15803d">✔ سماع الرئتين بحثاً عن وذمة رئوية     ✔ عض المريض للأنبوب</text><text x="610" y="423" text-anchor="start" font-size="12.5" font-weight="400" fill="#15803d">✔ إفرازات زائدة     ✔ التواء أنبوب الجهاز</text><text x="610" y="443" text-anchor="start" font-size="12.5" font-weight="400" fill="#b91c1c">✘ إزاحة الأنبوب وانفصال الدائرة (هذه أسباب الضغط المنخفض)</text></svg>