<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 435" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="435" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب الحوض (PID): من العدوى إلى المضاعفات</text><rect x="30" y="54" width="580" height="40" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.5"/><circle cx="578" cy="74" r="14" fill="#f59e0b"/><text x="578" y="79" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="554" y="79" text-anchor="start" font-size="13.5" fill="#0f172a">سيلان أو كلاميديا غير معالجين (لعدم وجود أعراض)</text><text x="320" y="105" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="108" width="580" height="40" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.5"/><circle cx="578" cy="128" r="14" fill="#ef4444"/><text x="578" y="133" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="554" y="133" text-anchor="start" font-size="13.5" fill="#0f172a">العدوى تصعد من عنق الرحم إلى الأعضاء الحوضية</text><text x="320" y="159" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="162" width="580" height="40" rx="10" fill="#ec4899" fill-opacity="0.14" stroke="#ec4899" stroke-width="1.5"/><circle cx="578" cy="182" r="14" fill="#ec4899"/><text x="578" y="187" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="554" y="187" text-anchor="start" font-size="13.5" fill="#0f172a">التهاب واسع: حمى + ألم حوضي + ألم أثناء الجماع</text><text x="320" y="213" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="216" width="580" height="40" rx="10" fill="#6366f1" fill-opacity="0.14" stroke="#6366f1" stroke-width="1.5"/><circle cx="578" cy="236" r="14" fill="#6366f1"/><text x="578" y="241" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="554" y="241" text-anchor="start" font-size="13.5" fill="#0f172a">المضاعفات: عقم + خطر الحمل خارج الرحم</text><rect x="325" y="266" width="295" height="155" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="325" y="266" width="295" height="29" rx="10" fill="#ef4444"/><text x="612" y="284" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">عوامل الخطر</text><text x="612" y="311" text-anchor="start" font-size="13" fill="#0f172a">• جماع مع شركاء متعددين</text><text x="612" y="334.2" text-anchor="start" font-size="13" fill="#0f172a">• جماع بلا واقٍ</text><text x="612" y="357.4" text-anchor="start" font-size="13" fill="#0f172a">• تاريخ عدوى منقولة جنسيًا</text><text x="612" y="380.59999999999997" text-anchor="start" font-size="13" fill="#0f172a">• جراحة حوضية/إجهاض حديث</text><text x="612" y="403.79999999999995" text-anchor="start" font-size="13" fill="#0f172a">• تركيب لولب خلال 3 أسابيع</text><rect x="20" y="266" width="295" height="155" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="20" y="266" width="295" height="29" rx="10" fill="#10b981"/><text x="307" y="284" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">العلاج</text><text x="307" y="311" text-anchor="start" font-size="13" fill="#0f172a">• مضادات حيوية متعددة</text><text x="307" y="334.2" text-anchor="start" font-size="13" fill="#0f172a">• جراحة لإزالة الندبات والالتصاقات</text><text x="307" y="352.4" text-anchor="start" font-size="13" fill="#0f172a">بالأعضاء التناسلية</text></svg>
