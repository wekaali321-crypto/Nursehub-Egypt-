<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="470" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">إزالة الجلطة: رأب الشريان والمجازة واختبار الجهد</text>
<!-- PCI panel (right) -->
<rect x="340" y="46" width="280" height="200" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="480" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#b91c1c">A: رأب الشريان بالقسطرة (PCI)</text>
<rect x="360" y="95" width="240" height="46" rx="8" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
<path d="M440 95 Q480 118 520 95 L520 141 Q480 118 440 141 Z" fill="#a16207"/>
<text x="480" y="165" text-anchor="middle" font-size="12" fill="#7f1d1d">لويحة تسد الشريان التاجي</text>
<rect x="360" y="178" width="240" height="26" rx="13" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/>
<g stroke="#334155" stroke-width="2" fill="none"><path d="M440 184 L440 198 M455 184 L455 198 M470 184 L470 198 M485 184 L485 198 M500 184 L500 198 M515 184 L515 198 M440 184 L515 198 M440 198 L515 184"/></g>
<text x="480" y="222" text-anchor="middle" font-size="12" fill="#334155">بعد البالون والدعامة: الشريان مفتوح</text>
<text x="480" y="238" text-anchor="middle" font-size="11.5" fill="#64748b">قبل: صيام 6–12 ساعة</text>
<!-- CABG panel (left) -->
<rect x="20" y="46" width="300" height="200" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="170" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">B: جراحة المجازة (CABG)</text>
<path d="M170 90 C120 90 90 130 100 175 C110 215 160 225 185 220 C225 215 250 170 240 130 C230 95 200 90 170 90Z" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
<path d="M130 120 Q150 150 140 205" fill="none" stroke="#7f1d1d" stroke-width="5"/>
<path d="M120 150 L150 150" stroke="#facc15" stroke-width="9"/>
<path d="M130 120 C100 105 85 140 110 160" fill="none" stroke="#1d4ed8" stroke-width="3.5" stroke-dasharray="6 3"/>
<text x="165" y="238" text-anchor="middle" font-size="12" fill="#1e3a8a">وصلة (طُعم) تتجاوز موضع الانسداد</text>
<text x="75" y="100" font-size="11" fill="#a16207" text-anchor="middle">الانسداد</text>
<!-- clot busters -->
<rect x="20" y="258" width="600" height="50" rx="10" fill="#fef3c7" stroke="#b45309"/>
<text x="320" y="279" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">مُذيبات الجلطة: alteplase / streptokinase — تذيب الجلطة، وheparin لا يذيبها</text>
<text x="320" y="298" text-anchor="middle" font-size="12" fill="#78350f">خطر النزيف نحو 8 ساعات: لا حقن إضافية، ومواضع قابلة للضغط فقط</text>
<!-- stress tests -->
<rect x="20" y="320" width="295" height="130" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="167" y="341" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">اختبار جهد المشي (Treadmill)</text>
<rect x="60" y="415" width="200" height="8" rx="4" fill="#64748b"/>
<circle cx="150" cy="365" r="9" fill="#fde68a" stroke="#92400e"/><path d="M150 374 L150 398 M150 382 L135 392 M150 382 L168 388 M150 398 L138 413 M150 398 L165 413" stroke="#92400e" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="167" y="438" text-anchor="middle" font-size="11.5" fill="#b91c1c">يُوقف عند ألم الصدر أو ارتفاع ST</text>
<rect x="325" y="320" width="295" height="130" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="472" y="341" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">اختبار كيميائي/نووي</text>
<rect x="385" y="385" width="160" height="12" rx="6" fill="#94a3b8"/>
<circle cx="400" cy="372" r="9" fill="#fde68a" stroke="#92400e"/><path d="M409 374 L520 380" stroke="#92400e" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="M560 355 L560 380 L545 392" stroke="#0e7490" stroke-width="2" fill="none"/><rect x="552" y="345" width="16" height="12" fill="#bae6fd" stroke="#0e7490"/>
<text x="472" y="415" text-anchor="middle" font-size="11.5" fill="#334155">قبله 24–48 ساعة: لا كافيين (حتى decaf) ولا تدخين</text>
<text x="472" y="432" text-anchor="middle" font-size="11.5" fill="#334155">لا نترات ولا حاصر بيتا ولا theophylline؛ صيام 4 ساعات</text>
</svg>
