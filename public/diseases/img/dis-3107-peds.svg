<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="430" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الإنعاش للرضيع والطفل ولصقات AED للأطفال</text>
  <rect x="330" y="50" width="290" height="170" rx="10" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">إنعاش الرضيع</text><text x="608" y="96" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• نبض العضد (Brachial) خلال 10 ثوانٍ أو أقل</text><text x="608" y="121" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• فعّل الاستغاثة الطارئة</text><text x="608" y="146" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• 100–120 ضغطة/دقيقة؛ دورات 2 دقيقة</text><text x="608" y="171" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• منقذ واحد 30:2 — منقذان 15:2</text><text x="608" y="196" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• أحضر AED بعد دقيقتين (منقذ واحد)</text><rect x="20" y="50" width="290" height="170" rx="10" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">وضع الرضيع</text><text x="298" y="96" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• لفافة تحت الكتفين</text><text x="298" y="121" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• رقبة ممدودة قليلًا</text><text x="298" y="146" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• طريقة 1: إبهامان مع لف الصدر</text><text x="298" y="171" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• طريقة 2: إصبعان على القص</text><rect x="20" y="235" width="290" height="170" rx="10" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="257" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">AED للطفل (أقل من 8 سنوات)</text><text x="298" y="281" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• لصقة على الصدر وأخرى على الظهر</text><text x="298" y="306" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• ممنوع تداخل اللصقات أو تلامسها</text><rect x="330" y="235" width="290" height="170" rx="10" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5"/><text x="475" y="262" text-anchor="middle" font-size="13" font-weight="800" fill="#1e293b">سؤال: أي شريان يُفحص نبضه عند الرضيع؟</text><text x="475" y="300" text-anchor="middle" font-size="16" font-weight="800" fill="#be185d">الشريان العضدي (Brachial)</text><rect x="400" y="325" width="150" height="40" rx="10" fill="#fbcfe8"/><text x="475" y="351" text-anchor="middle" font-size="13" font-weight="500" fill="#1e293b">نبض داخل العضد</text>
</svg>
