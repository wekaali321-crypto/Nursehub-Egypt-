<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="272" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">هجمة ربو حادة شديدة: ماذا تعطي؟</text><rect x="60" y="48" width="520" height="68" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><circle cx="580" cy="64" r="14" fill="#b91c1c"/><text x="580" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="556" y="68" text-anchor="start" font-size="14" font-weight="800" fill="#b91c1c">العلامات</text><text x="570" y="88" text-anchor="start" font-size="13" fill="#0f172a">نبض فوق 120، تنفس فوق 30، O2 أقل من 90% على الهواء، peak flow أقل من 40%</text><text x="570" y="106" text-anchor="start" font-size="13" fill="#0f172a">من المتوقع أو أقل من 150 لتر/د</text><path d="M320 118 L320 132 M314 126 L320 133 L326 126" stroke="#64748b" stroke-width="2" fill="none"/><rect x="60" y="136" width="520" height="50" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><circle cx="580" cy="152" r="14" fill="#b91c1c"/><text x="580" y="157" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="556" y="156" text-anchor="start" font-size="14" font-weight="800" fill="#b91c1c">الاختيار الصحيح</text><text x="570" y="176" text-anchor="start" font-size="13" fill="#0f172a">albuterol استنشاق + ipratropium بخاخ + methylprednisolone وريدي</text><path d="M320 188 L320 202 M314 196 L320 203 L326 196" stroke="#64748b" stroke-width="2" fill="none"/><rect x="60" y="206" width="520" height="50" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><circle cx="580" cy="222" r="14" fill="#b91c1c"/><text x="580" y="227" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="556" y="226" text-anchor="start" font-size="14" font-weight="800" fill="#b91c1c">الخطأ</text><text x="570" y="246" text-anchor="start" font-size="13" fill="#0f172a">salmeterol (طويل المفعول) و IV methamphetamines</text></svg>