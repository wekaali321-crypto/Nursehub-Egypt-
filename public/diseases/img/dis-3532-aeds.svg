<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="430" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مضادات الصرع: مقارنة الفئات</text><rect x="520" y="45" width="100" height="34" fill="#0e7490" stroke="#cbd5e1"/><text x="570" y="66" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">الفئة</text><rect x="385" y="45" width="135" height="34" fill="#0e7490" stroke="#cbd5e1"/><text x="452.5" y="66" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">المثال</text><rect x="210" y="45" width="175" height="34" fill="#0e7490" stroke="#cbd5e1"/><text x="297.5" y="66" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">الاستعمال</text><rect x="10" y="45" width="200" height="34" fill="#0e7490" stroke="#cbd5e1"/><text x="110" y="66" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">أهم تنبيه</text><rect x="520" y="79" width="100" height="56" fill="#e0f2fe" stroke="#cbd5e1"/><text x="570" y="111" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">benzodiazepines</text><rect x="385" y="79" width="135" height="56" fill="#ffffff" stroke="#cbd5e1"/><text x="452.5" y="111" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">diazepam (Valium)</text><rect x="210" y="79" width="175" height="56" fill="#ffffff" stroke="#cbd5e1"/><text x="297.5" y="111" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">نوبات، حالة صرعية، قلق، انسحاب كحول</text><rect x="10" y="79" width="200" height="56" fill="#ffffff" stroke="#cbd5e1"/><text x="110" y="111" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">حذر في الحمل والجلوكوما والمسنين</text><rect x="520" y="135" width="100" height="56" fill="#e0f2fe" stroke="#cbd5e1"/><text x="570" y="167" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">متنوعة</text><rect x="385" y="135" width="135" height="56" fill="#f1f5f9" stroke="#cbd5e1"/><text x="452.5" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">carbamazepine (Tegretol)</text><rect x="210" y="135" width="175" height="56" fill="#f1f5f9" stroke="#cbd5e1"/><text x="297.5" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">صرع، ثنائي القطب، ألم العصب الثلاثي</text><rect x="10" y="135" width="200" height="56" fill="#f1f5f9" stroke="#cbd5e1"/><text x="110" y="167" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">لا مع MAOI خلال 14 يومًا؛ الحمل</text><rect x="520" y="191" width="100" height="56" fill="#e0f2fe" stroke="#cbd5e1"/><text x="570" y="223" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">حمض كربوكسيلي</text><rect x="385" y="191" width="135" height="56" fill="#ffffff" stroke="#cbd5e1"/><text x="452.5" y="223" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">valproic acid (Depakote)</text><rect x="210" y="191" width="175" height="56" fill="#ffffff" stroke="#cbd5e1"/><text x="297.5" y="223" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">صرع، صداع نصفي، هوس</text><rect x="10" y="191" width="200" height="56" fill="#ffffff" stroke="#cbd5e1"/><text x="110" y="223" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">الحمل؛ الكبد؛ راجع النشرة</text><rect x="520" y="247" width="100" height="56" fill="#e0f2fe" stroke="#cbd5e1"/><text x="570" y="279" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">oxazolidinedione</text><rect x="385" y="247" width="135" height="56" fill="#f1f5f9" stroke="#cbd5e1"/><text x="452.5" y="279" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">trimethadione (Tridione)</text><rect x="210" y="247" width="175" height="56" fill="#f1f5f9" stroke="#cbd5e1"/><text x="297.5" y="279" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">صرع</text><rect x="10" y="247" width="200" height="56" fill="#f1f5f9" stroke="#cbd5e1"/><text x="110" y="279" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">تشوهات الجنين؛ حساسية الضوء</text><rect x="520" y="303" width="100" height="56" fill="#e0f2fe" stroke="#cbd5e1"/><text x="570" y="335" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">حديث</text><rect x="385" y="303" width="135" height="56" fill="#ffffff" stroke="#cbd5e1"/><text x="452.5" y="335" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">levetiracetam</text><rect x="210" y="303" width="175" height="56" fill="#ffffff" stroke="#cbd5e1"/><text x="297.5" y="335" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">وقاية وعلاج النوبات</text><rect x="10" y="303" width="200" height="56" fill="#ffffff" stroke="#cbd5e1"/><text x="110" y="335" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">أفكار انتحارية وستيفنز-جونسون</text><text x="320" y="410" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">الجرعات للتعلّم وتُراجع مع الطبيب/الصيدلي</text></svg>