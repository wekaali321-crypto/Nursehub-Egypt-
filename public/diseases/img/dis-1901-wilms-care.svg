<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="350" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">سلامة طفل ورم ويلمز</text><rect x="20" y="48" width="600" height="58" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><circle cx="596" cy="68" r="13" fill="#2563eb"/><text x="596" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="570" y="73" text-anchor="start" font-size="14" font-weight="700" fill="#0f172a">لافتة فوق السرير</text><text x="570" y="94" text-anchor="start" font-size="12.5" fill="#334155">"ممنوع جس البطن" بخط كبير وتعليق الأمر في الملف</text><text x="320" y="120" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="126" width="600" height="58" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><circle cx="596" cy="146" r="13" fill="#16a34a"/><text x="596" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="570" y="151" text-anchor="start" font-size="14" font-weight="700" fill="#0f172a">لماذا؟</text><text x="570" y="172" text-anchor="start" font-size="12.5" fill="#334155">الجس قد يمزق كبسولة الورم وينشر الخلايا السرطانية</text><text x="320" y="198" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="204" width="600" height="58" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><circle cx="596" cy="224" r="13" fill="#ea580c"/><text x="596" y="229" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="570" y="229" text-anchor="start" font-size="14" font-weight="700" fill="#0f172a">الحمل والتحريك</text><text x="570" y="250" text-anchor="start" font-size="12.5" fill="#334155">رفع الطفل بحذر من الجنبين مع تجنب ضغط البطن عند الاستحمام</text><text x="320" y="276" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="282" width="600" height="58" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><circle cx="596" cy="302" r="13" fill="#9333ea"/><text x="596" y="307" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="570" y="307" text-anchor="start" font-size="14" font-weight="700" fill="#0f172a">العلاج</text><text x="570" y="328" text-anchor="start" font-size="12.5" fill="#334155">استئصال الكلية كلها أو جزء منها، ثم كيماوي مع/بدون إشعاع</text>
</svg>
