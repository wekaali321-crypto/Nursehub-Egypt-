<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 328" width="640" height="328" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="مضادات الاكتئاب: أربع قواعد"><rect width="640" height="328" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">مضادات الاكتئاب: أربع قواعد</text><text x="320.0" y="54" text-anchor="middle" font-size="12.5" fill="#667085">SSRI • SNRI • TCA • MAOI</text><rect x="326.0" y="68" width="302.0" height="152" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="326.0" y="68" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="326.0" y="82" width="302.0" height="14" fill="#b42318"/><text x="477.0" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">1) خطر الانتحار</text><text x="616.0" y="116" text-anchor="start" font-size="12.5" fill="#1d2939">• قد تزيد الأفكار الانتحارية في الأسابيع</text><text x="616.0" y="134" text-anchor="start" font-size="12.5" fill="#1d2939">   الأولى</text><text x="616.0" y="152" text-anchor="start" font-size="12.5" fill="#1d2939">• بلّغ عن أي أفكار انتحارية</text><text x="616.0" y="170" text-anchor="start" font-size="12.5" fill="#1d2939">• راقب: أفكار جديدة، سلوك غير معتاد، تدهور</text><text x="616.0" y="188" text-anchor="start" font-size="12.5" fill="#1d2939">   الاكتئاب</text><text x="616.0" y="206" text-anchor="start" font-size="12.5" fill="#1d2939">• اسأل عن أي وصفة جديدة</text><rect x="12.0" y="68" width="302.0" height="62" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="12.0" y="68" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="12.0" y="82" width="302.0" height="14" fill="#a86a00"/><text x="163.0" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">2) بدء بطيء وإيقاف تدريجي</text><text x="302.0" y="116" text-anchor="start" font-size="12.5" fill="#1d2939">• لا توقف الدواء فجأة أبدًا</text><rect x="12.0" y="142" width="302.0" height="80" rx="10" fill="#efe9fb" stroke="#6a4bb5" stroke-width="1.2"/><rect x="12.0" y="142" width="302.0" height="28" rx="10" fill="#6a4bb5"/><rect x="12.0" y="156" width="302.0" height="14" fill="#6a4bb5"/><text x="163.0" y="161" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">3) لا تخلط</text><text x="302.0" y="190" text-anchor="start" font-size="12.5" fill="#1d2939">• SSRI + St. John wort</text><text x="302.0" y="208" text-anchor="start" font-size="12.5" fill="#1d2939">• MAOI + أي مضاد اكتئاب (TCA، SSRI، SNRI)</text><rect x="326.0" y="232" width="302.0" height="80" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="232" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="246" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="251" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">4) كل الأدوية النفسية</text><text x="616.0" y="280" text-anchor="start" font-size="12.5" fill="#1d2939">• تخفض الضغط (غيّر الوضع ببطء)</text><text x="616.0" y="298" text-anchor="start" font-size="12.5" fill="#1d2939">• تسبب تغير الوزن</text></svg>