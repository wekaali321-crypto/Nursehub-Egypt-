<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="292" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">احتباس البول: التقييم والتدخل</text><rect x="20" y="54" width="600" height="53" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><circle cx="590" cy="76" r="14" fill="#2563eb"/><text x="590" y="81" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="566" y="80" text-anchor="start" font-size="15" font-weight="800" fill="#1e3a8a">قيّم أولًا</text><text x="566" y="100" text-anchor="start" font-size="13" fill="#1e3a8a">فحص البطن: انظر، استمع، تحسّس فوق العانة.</text><text x="320" y="123" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="129" width="600" height="72" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><circle cx="590" cy="151" r="14" fill="#2563eb"/><text x="590" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="566" y="155" text-anchor="start" font-size="15" font-weight="800" fill="#1e3a8a">تدخلات</text><text x="566" y="175" text-anchor="start" font-size="13" fill="#1e3a8a">وضع طبيعي (ساعد المريض للنهوض من السرير) → جهاز مسح المثانة: أكثر من 100</text><text x="566" y="194" text-anchor="start" font-size="13" fill="#1e3a8a">mL = بلّغ الطبيب → قسطرة متقطعة.</text><text x="320" y="217" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="223" width="600" height="53" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><circle cx="590" cy="245" r="14" fill="#2563eb"/><text x="590" y="250" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="566" y="249" text-anchor="start" font-size="15" font-weight="800" fill="#1e3a8a">أثناء إفراغ المثانة بالقسطرة</text><text x="566" y="269" text-anchor="start" font-size="13" fill="#1e3a8a">راقب هبوط الضغط وبطء القلب.</text></svg>