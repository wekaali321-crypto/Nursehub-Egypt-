<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 557" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="557" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">الجلوكوما (⁦Glaucoma⁩): ارتفاع ضغط العين</text><text x="320" y="52" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b">تلف العصب البصري (العصب القحفي الثاني) من ضغط داخل العين</text><path d="M40 132 Q160 52 280 132" fill="none" stroke="#0e7490" stroke-width="4"/><path d="M40 132 Q160 212 280 132" fill="none" stroke="#0e7490" stroke-width="4"/><circle cx="160" cy="132" r="28" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/><circle cx="160" cy="132" r="11" fill="#0f172a" stroke="none" stroke-width="1.5"/><path d="M65 122 L126 122" fill="none" stroke="#a16207" stroke-width="6"/><path d="M194 122 L255 122" fill="none" stroke="#a16207" stroke-width="6"/><path d="M65 122 L65 102" fill="none" stroke="#dc2626" stroke-width="6"/><text x="160" y="237" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">الزاوية مغلقة: الحجاب القزحي يسد التصريف</text><path d="M360 132 Q480 52 600 132" fill="none" stroke="#0e7490" stroke-width="4"/><path d="M360 132 Q480 212 600 132" fill="none" stroke="#0e7490" stroke-width="4"/><circle cx="480" cy="132" r="28" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/><circle cx="480" cy="132" r="11" fill="#0f172a" stroke="none" stroke-width="1.5"/><path d="M385 122 L446 122" fill="none" stroke="#a16207" stroke-width="6"/><path d="M514 122 L575 122" fill="none" stroke="#a16207" stroke-width="6"/><text x="480" y="237" text-anchor="middle" font-size="12" font-weight="700" fill="#15803d">الزاوية مفتوحة: تصريف بطيء المفعول مع الزمن</text><text x="160" y="258" text-anchor="middle" font-size="13" font-weight="800" fil