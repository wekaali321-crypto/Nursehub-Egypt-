.5999999999999" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">بعد الجراحة: تجنب</text><text x="303" y="450.0999999999999" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="291" y="450.0999999999999" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">السعال والعطس، الانحناء من الخصر</text><text x="303" y="471.2249999999999" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="291" y="471.2249999999999" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">حمل الأشياء الثقيلة، الغثيان والقيء</text><text x="303" y="492.3499999999999" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="291" y="492.3499999999999" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">مناورة فالسالفا وإجهاد الإمساك</text><text x="303" y="513.4749999999999" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="291" y="513.4749999999999" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الأدوية المضادة للكولين (أتروبين،</text><text x="291" y="531.5999999999999" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">إبراتروبيوم) ودايفينهيدرامين</text></svg>