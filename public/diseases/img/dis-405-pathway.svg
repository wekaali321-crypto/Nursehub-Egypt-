<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="300" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">حساسية الأنف الموسمية: من السبب للعلاج</text>
  <rect x="20" y="50" width="600" height="36" rx="10" fill="#fde68a"/>
  <text x="320" y="72.55" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">المحفز: تراب، حبوب لقاح (الربيع: مايو-يونيو)، شعر الحيوانات</text>
  <path d="M320 86 L320 100" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M314 98 L320 106 L326 98 Z" fill="#64748b"/>
  <rect x="20" y="106" width="600" height="36" rx="10" fill="#fecaca"/>
  <text x="320" y="128.55" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">عطس + رشح مائي + هرش (أنف/عين/حلق) + احتقان</text>
  <path d="M320 142 L320 156" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M314 154 L320 162 L326 154 Z" fill="#64748b"/>
  <rect x="20" y="162" width="190" height="56" rx="10" fill="#bbf7d0"/>
  <text x="115" y="185.7" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">١) تجنب المحفز</text>
  <text x="115" y="202.7" text-anchor="middle" font-size="10" font-weight="500" fill="#14532d">٢) غسيل أنف قلوي</text>
  <rect x="225" y="162" width="190" height="56" rx="10" fill="#bfdbfe"/>
  <text x="320" y="185.7" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">مضاد هيستامين فموي</text>
  <text x="320" y="202.7" text-anchor="middle" font-size="10" font-weight="500" fill="#1e3a8a" direction="ltr">Loratadine / Cetirizine</text>
  <rect x="430" y="162" width="190" height="56" rx="10" fill="#ddd6fe"/>
  <text x="525" y="185.7" text-anchor="middle" font-size="12" font-weight="700" fill="#4c1d95">بخاخ كورتيزون أنفي</text>
  <text x="525" y="202.7" text-anchor="middle" font-size="10" font-weight="500" fill="#4c1d95" direction="ltr">Beclomethasone (Beclo)</text>
  <path d="M320 218 L320 232" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M314 230 L320 238 L326 230 Z" fill="#64748b"/>
  <rect x="20" y="238" width="600" height="36" rx="10" fill="#e0f2fe"/>
  <text x="320" y="260.55" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">وقاية: Nasotal (مثبّت للخلايا البدينة) قبل وأثناء الموسم</text>
  <text x="320" y="286" text-anchor="middle" font-size="12" fill="#64748b">غالباً معها حساسية صدر أو عين أو جلد (Atopy)</text>
</svg>
