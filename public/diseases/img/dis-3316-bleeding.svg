<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
<rect width="640" height="380" rx="16" fill="#f8fafc"/>
<text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >تثقيف مريض مضادات التخثر: النزيف والوقاية من الرضوض</text>
<rect x="330" y="50" width="300" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="330" y="50" width="300" height="28" rx="10" fill="#b91c1c"/>
<text x="480.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >احتياطات النزيف: ممنوعات</text>
<text x="480.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >لا نزيف نشط ولا قرحة معدة (Peptic ulcer)</text>
<text x="480.0" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >CHANT: تليف كبد، التهاب كبد، كحول،</text>
<text x="480.0" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >NSAIDs، جرعة زائدة من الباراسيتامول</text>
<text x="480.0" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >لا Vit E, ginseng, ginkgo, garlic, omega 3</text>
<text x="480.0" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >ولا St John’s Wort</text>
<rect x="10" y="50" width="310" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="50" width="310" height="28" rx="10" fill="#0369a1"/>
<text x="165.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >تجنب الرضوض</text>
<text x="165.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >سجاد صغير وإضاءة ضعيفة: أضئ الممرات</text>
<text x="165.0" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >فرشاة ناعمة، لا خيط أسنان قاسٍ ولا غسول كحولي</text>
<text x="165.0" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >ماكينة كهربائية بدل الشفرة</text>
<text x="165.0" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >تجنب الإمساك: ألياف وسوائل</text>
<text x="165.0" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >لا رياضة احتكاكية وسوار تنبيه طبي</text>
<rect x="10" y="215" width="620" height="155" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="215" width="620" height="28" rx="10" fill="#7c3aed"/>
<text x="320.0" y="234" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >علامات النزيف: بلّغ الطبيب فوراً</text>
<text x="320.0" y="265" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >براز أسود قطراني (نزيف هضمي)</text>
<text x="320.0" y="289" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >دم في البول (Hematuria)</text>
<text x="320.0" y="313" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >رعاف (Epistaxis)</text>
<text x="320.0" y="337" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >نمشات على الصدر (Petechiae) وكدمات بسهولة</text>
</svg>