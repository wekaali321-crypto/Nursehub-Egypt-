<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 435" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="435" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">فتق الحجاب الحاجز</text>
<rect x="14.0" y="52" width="652.0" height="97.75" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="14.0" y="52" width="652.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="340.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الآلية والأعراض</text>
<text x="656.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• بروز جزء من المعدة عبر الحجاب الحاجز فيعلق في المريء أو بجانبه</text>
<text x="656.0" y="115.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• عسر البلع (Dysphagia)</text>
<text x="656.0" y="134.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ارتجاع حرقة (ألم شرسوفي)، ألم صدر وضيق نفس</text>
<rect x="14.0" y="161.75" width="652.0" height="78.5" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="14.0" y="161.75" width="652.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="340.0" y="179.75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأسباب</text>
<text x="656.0" y="205.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• زيادة الضغط داخل البطن: الشد ورفع الأوزان وتمارين الأثقال</text>
<text x="656.0" y="225.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• سمنة</text>
<rect x="14.0" y="252.25" width="652.0" height="155.5" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="14.0" y="252.25" width="652.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="340.0" y="270.25" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">التمريض والحمية</text>
<text x="656.0" y="296.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تجنب الرفع والشد</text>
<text x="656.0" y="315.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا ملابس ضيقة أو مشدات (Girdle)</text>
<text x="656.0" y="334.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تجنب الأطعمة الدهنية والكحول</text>
<text x="656.0" y="354.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا تبغ ولا كافيين ولا شوكولاتة ولا نعناع</text>
<text x="656.0" y="373.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• وجبات صغيرة متكررة قليلة الدهن</text>
<text x="656.0" y="392.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• اجلس/ارفع رأس السرير بعد الأكل وفي الليل</text>
</svg>
