<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="286" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">التمريض في علاج الديدان: كسر دائرة العدوى</text><rect x="325.0" y="44" width="299.0" height="108" rx="10" fill="#fff" stroke="#1e3a8a" stroke-width="1.5"/><path d="M325.0 54a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#1e3a8a"/><text x="474.5" y="66" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">للمريض والأسرة</text><text x="474.5" y="94" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">اتباع الجدول كما في الوصفة</text><text x="474.5" y="110.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">فحص براز متابعة لتأكيد النجاح</text><text x="474.5" y="127" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">قد تحتاج الأسرة والأطفال المخالطون</text><text x="474.5" y="143.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">للعلاج</text><rect x="16.0" y="44" width="299.0" height="108" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><path d="M16.0 54a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#0f766e"/><text x="165.5" y="66" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">البيئة</text><text x="165.5" y="94" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">غسل الفراش والملابس بعد بدء العلاج</text><text x="165.5" y="110.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">استحمام يومي (دش أفضل)</text><text x="165.5" y="127" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تطهير الحمام والمرحاض يوميًا بالكلور</text><text x="165.5" y="143.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أو المطهر الموصى به</text><rect x="325.0" y="162" width="299.0" height="108" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.5"/><path d="M325.0 172a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#b45309"/><text x="474.5" y="184" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">النظافة</text><text x="474.5" y="212" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">غسل اليدين بعد الحمام وقبل الطعام</text><text x="474.5" y="228.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تقليم الأظافر وعدم وضع الأصابع بالفم</text><text x="474.5" y="245" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">مناشف وقفازات استحمام منفصلة في</text><text x="474.5" y="261.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">فطريات الجلد</text><rect x="16.0" y="162" width="299.0" height="108" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.5"/><path d="M16.0 172a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#be123c"/><text x="165.5" y="184" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">العاملون</text><text x="165.5" y="212" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">مناولو الغذاء لا يعودون قبل اكتمال</text><text x="165.5" y="228.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">العلاج وبراز خالٍ</text><text x="165.5" y="245" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">عاملو الحضانة يشدّدون على نظافة</text><text x="165.5" y="261.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الحفاض</text></svg>