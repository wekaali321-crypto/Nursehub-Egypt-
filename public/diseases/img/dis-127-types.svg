<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a" >أنواع الذبحة الصدرية</text><rect x="20" y="50" width="190" height="180" rx="12" fill="#16a34a"/><text x="115.0" y="116.05" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" >مستقرة (Stable)</text><text x="115.0" y="135.05" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >تظهر بالمجهود</text><text x="115.0" y="154.05" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >نفس الشدة كل مرة</text><text x="115.0" y="173.05" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >تروح بالراحة أو النيترات</text><rect x="225" y="50" width="190" height="180" rx="12" fill="#dc2626"/><text x="320.0" y="106.55" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" >غير مستقرة (Unstable)</text><text x="320.0" y="125.55" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >تزداد تكراراً/شدة/مدة</text><text x="320.0" y="144.55" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >أو ألم أثناء الراحة</text><text x="320.0" y="163.55" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >أو لا تستجيب للعلاج</text><text x="320.0" y="182.55" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >= طوارئ (ACS)</text><rect x="430" y="50" width="190" height="180" rx="12" fill="#7c3aed"/><text x="525.0" y="106.55" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" >برنزميتال (Prinzmetal)</text><text x="525.0" y="125.55" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >ألم أثناء الراحة</text><text x="525.0" y="144.55" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >سببه تشنج الشريان التاجي</text><text x="525.0" y="163.55" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >ارتفاع ST أثناء النوبة</text><text x="525.0" y="182.55" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >تشخيص جيد غالباً</text>
