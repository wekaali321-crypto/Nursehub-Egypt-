<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="372" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الليمفوما: ملخص</text>
<rect x="14" y="44" width="612" height="100" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><rect x="14" y="44" width="612" height="26" rx="10" fill="#0369a1"/><text x="320.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >الليمفوما: سرطان الجهاز الليمفاوي</text><text x="616" y="89" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >العقد الليمفاوية، الطحال، الغدة الصعترية والنخاع</text><text x="616" y="110.5" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >هودجكين: خلايا Reed-Sternberg | غير هودجكين: بدونها</text><rect x="14" y="156" width="300" height="120" rx="10" fill="#fff" stroke="#be185d" stroke-width="1.5"/><rect x="14" y="156" width="300" height="26" rx="10" fill="#be185d"/><text x="164.0" y="174" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >السبب</text><text x="304" y="201" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >فيروس إبشتاين-بار (EBV)</text><text x="304" y="222.5" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >حوالي 50% من الحالات</text><rect x="326" y="156" width="300" height="200" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><rect x="326" y="156" width="300" height="26" rx="10" fill="#ea580c"/><text x="476.0" y="174" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >الأعراض</text><text x="616" y="201" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >كتل غير مؤلمة (تحت الإبط)</text><text x="616" y="221.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >تضخم الغدد الليمفاوية</text><text x="616" y="242.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >حمى (بلا قشعريرة) وتوعك</text><text x="616" y="262.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >فقدان وزن</text><text x="616" y="283.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >تعرق ليلي (تغيير الأغطية)</text><text x="616" y="303.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >عدوى متكررة</text><rect x="14" y="288" width="300" height="68" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><rect x="14" y="288" width="300" height="26" rx="10" fill="#0f766e"/><text x="164.0" y="306" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >العلاج</text><text x="304" y="333" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >كيماوي و/أو إشعاع</text>
</svg>
