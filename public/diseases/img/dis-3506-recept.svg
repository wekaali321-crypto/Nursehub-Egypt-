ير</text><rect x="130" y="273" width="100" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="180" y="297" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">كبير</text><rect x="20" y="273" width="110" height="40" fill="#ffffff" stroke="#cbd5e1"/><text x="75" y="297" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">متوسط</text><rect x="20" y="320" width="600" height="95" rx="10" fill="#fef9c3"/><text x="320" y="363.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">ألفا 1 = انقباض الأوعية (رفع الضغط) | بيتا 1 = القلب (معدل وقوة) | بيتا 2 = الرئتان (توسّع القصبات والأوعية)</text><text x="320" y="381.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">العامل المنبه (agonist) يزيد ويرفع الضغط، والمضاد (antagonist) يخفض الضغط</text></svg>