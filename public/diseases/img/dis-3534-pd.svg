ze="12" font-weight="600" fill="#0f172a">تثقيف levodopa: بدء الأثر 2–6 أسابيع | بول/عرق/لعاب أحمر-بني طبيعي | لا يزيل الرعاش بل يخففه | لا توقف فجأة</text></svg>