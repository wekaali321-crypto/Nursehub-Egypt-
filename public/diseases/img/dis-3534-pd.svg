<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="500" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أدوية باركنسون: رفع الدوبامين وخفض الأستيل كولين</text><rect x="330" y="45" width="295" height="80" rx="10" fill="#fee2e2"/><text x="477.5" y="81" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">باركنسون</text><text x="477.5" y="99" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">دوبامين منخفض + أستيل كولين مرتفع</text><rect x="15" y="45" width="305" height="80" rx="10" fill="#dcfce7"/><text x="167.5" y="81" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">levodopa: يترك دوبامين أكثر</text><text x="167.5" y="99" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">carbidopa: يحافظ عليه (لا يتكسر محيطيًا)</text><rect x="505" y="145" width="120" height="32" fill="#0e7490" stroke="#cbd5e1"/><text x="565" y="165" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">الفئة</text><rect x="315" y="145" width="190" height="32" fill="#0e7490" stroke="#cbd5e1"/><text x="410" y="165" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">أمثلة</text><rect x="155" y="145" width="160" height="32" fill="#0e7490" stroke="#cbd5e1"/><text x="235" y="165" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">آلية</text><rect x="15" y="145" width="140" height="32" fill="#0e7490" stroke="#cbd5e1"/><text x="85" y="165" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">تنبيه</text><rect x="505" y="177" width="120" height="44" fill="#e0f2fe" stroke="#cbd5e1"/><text x="565" y="203" text-anchor="middle" font-size="11" font-weight="800" fill="#0