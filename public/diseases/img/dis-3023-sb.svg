<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="360" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">السنسنة المشقوقة (Spina Bifida)</text><rect x="330" y="50" width="290" height="100" rx="10" fill="#f59e0b"/><text x="475.0" y="76.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">المستورة (Occulta)</text><text x="475.0" y="94.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">خصلة شعر صغيرة عند قاعدة العمود</text><text x="475.0" y="112.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">نقرة صغيرة أو وحمة جلدية</text><text x="475.0" y="130.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">عيب غير مرئي خارجيًا</text><rect x="20" y="50" width="300" height="100" rx="10" fill="#ef4444"/><text x="170.0" y="76.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الكيس النخاعي السحائي</text><text x="170.0" y="94.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">كيس بارز من الظهر (Myelomeningocele)</text><text x="170.0" y="112.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">غطه بضمادة معقمة رطبة</text><text x="170.0" y="130.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">التعقيم أهم شيء · وضع الانبطاح</text><rect x="330" y="165" width="290" height="90" rx="10" fill="#16a34a"/><text x="475.0" y="187.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الوقاية</text><text x="475.0" y="204.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">400 ميكروغرام حمض فوليك يوميًا للحامل</text><text x="475.0" y="221.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">خضراوات ورقية، فاصوليا وأرز، حبوب مدعمة</text><text x="475.0" y="238.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">فول سوداني وخبز مدعم</text><rect x="20" y="165" width="300" height="90" rx="10" fill="#0ea5e9"/><text x="170.0" y="195.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التشخيص</text><text x="170.0" y="213.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">فحص ألفا فيتوبروتين (AFP) عبر بزل السائل الأمينوسي</text><text x="170.0" y="231.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">رنين أو سونار العمود</text><rect x="20" y="270" width="600" height="75" rx="10" fill="#7c3aed"/><text x="320.0" y="292.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">عوامل الخطر</text><text x="320.0" y="310.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">نقص حمض الفوليك (B9) · أدوية الصرع: فالبروات وكاربامازيبين</text><text x="320.0" y="328.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">الغاية من التغطية: منع العدوى وتسريب السائل وتحسين المشي</text></svg>