<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 268" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="268" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >من يضبط الميزان: الرئة والكلى</text><rect x="20" y="46" width="290" height="170" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="3"/><rect x="20" y="46" width="290" height="40" rx="12" fill="#0ea5e9" stroke="none" stroke-width="1"/><text x="165" y="73" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" >الرئتان: تتحكمان في CO₂</text><text x="165" y="110" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a" >سريعة (دقائق)</text><text x="165" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >تنفس بطيء ← CO₂ يرتفع ← حماض</text><text x="165" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >تنفس سريع ← CO₂ ينخفض ← قلاء</text><text x="165" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626" >CO₂ يُعامَل كحمض</text><rect x="330" y="46" width="290" height="170" rx="12" fill="#fff" stroke="#a855f7" stroke-width="3"/><rect x="330" y="46" width="290" height="40" rx="12" fill="#a855f7" stroke="none" stroke-width="1"/><text x="475" y="73" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" >الكلى: تتحكم في H⁺ وHCO₃</text><text x="475" y="110" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a" >بطيئة (ساعات إلى أيام)</text><text x="475" y="138" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >تطرح H⁺ في البول</text><text x="475" y="164" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >تعيد امتصاص HCO₃</text><text x="475" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#2563eb" >HCO₃ يُعامَل كقاعدة</text><text x="320" y="248" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >pH الطبيعي 7.35 – 7.45: أي خلل في أحد العضوين يستدعي تعويضًا من الآخر</text>
</svg>
