<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 214" width="640" height="214" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="واقيات الغشاء المخاطي: Sucralfate مقابل Misoprostol"><rect width="640" height="214" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">واقيات الغشاء المخاطي: Sucralfate مقابل Misoprostol</text><rect x="326.0" y="46" width="302.0" height="152" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Sucralfate (Carafate / Antepsin)</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• علاج ووقاية قرحة المعدة والإثنى عشر</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• يكوّن طبقة واقية سميكة فوق القرحة</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• تجنّب الطعام والأدوية 1–2 ساعة قبله</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">   وبعده</text><text x="616.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• لا تأخذه مع أدوية أخرى</text><text x="616.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">• يُؤخذ قبل الأكل (2 ساعة قبل: ATE)</text><rect x="12.0" y="46" width="302.0" height="152" rx="10" fill="#efe9fb" stroke="#6a4bb5" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#6a4bb5"/><rect x="12.0" y="60" width="302.0" height="14" fill="#6a4bb5"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Misoprostol (Cytotec)</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• بروستاجلاندين اصطناعي يزيد مخاط المعدة</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   الواقي</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• يحمي من قرحة المعدة (مثلاً مع NSAIDs)</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• خطر الإجهاض (تليين عنق الرحم)</text><text x="302.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• لا مع الحمل: وسيلة منع حمل موثوقة</text><text x="302.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">• لا مع مضادات الحموضة</text></svg>