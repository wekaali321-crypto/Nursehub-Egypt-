<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 283" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="283" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مراحل النوبة التشنجية الأربع</text><rect x="326" y="56" width="298" height="109" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><rect x="326" y="56" width="298" height="30" rx="12" fill="#2563eb"/><text x="475" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1) البادرة Prodromal</text><text x="614" y="108" text-anchor="start" font-size="13" fill="#1e3a8a">علامات تحذير قبل النوبة بساعات أو أيام</text><text x="614" y="127" text-anchor="start" font-size="13" fill="#1e3a8a">تغيّر مزاج أو عصبية</text><rect x="16" y="56" width="298" height="109" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><rect x="16" y="56" width="298" height="30" rx="12" fill="#d97706"/><text x="165" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2) الأورا Aura</text><text x="304" y="108" text-anchor="start" font-size="13" fill="#78350f">إحساس بصري أو سمعي أو شمّي قبل النوبة</text><text x="304" y="127" text-anchor="start" font-size="13" fill="#78350f">مباشرة</text><text x="304" y="146" text-anchor="start" font-size="13" fill="#78350f">دليل مهم: المريض يعرف أن النوبة قادمة</text><rect x="326" y="177" width="298" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><rect x="326" y="177" width="298" height="30" rx="12" fill="#dc2626"/><text x="475" y="198" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3) النوبة Ictal</text><text x="614" y="229" text-anchor="start" font-size="13" fill="#7f1d1d">وقت النشاط الكهربائي الفعلي</text><text x="614" y="248" text-anchor="start" font-size="13" fill="#7f1d1d">تشنج أو فقدان وعي أو سلوك آلي</text><rect x="16" y="177" width="298" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><rect x="16" y="177" width="298" height="30" rx="12" fill="#7c3aed"/><text x="165" y="198" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4) ما بعد النوبة Postictal</text><text x="304" y="229" text-anchor="start" font-size="13" fill="#4c1d95">ارتباك وصداع ونعاس وإرهاق</text><text x="304" y="248" text-anchor="start" font-size="13" fill="#4c1d95">قد يستمر دقائق إلى ساعات</text></svg>