<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="286" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مضاعفات التنفس الصناعي وإزالة الأنبوب والفغرة الرغامية</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="217.79999999999998" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">المضاعفات</text><text x="612" y="99" text-anchor="start" font-size="12" fill="#0f172a">• هبوط التشبع: اسمع</text><text x="612" y="117.2" text-anchor="start" font-size="12" fill="#0f172a">الرئة، اشفط الإفرازات،</text><text x="612" y="135.4" text-anchor="start" font-size="12" fill="#0f172a">تهوية يدوية بكيس</text><text x="612" y="153.6" text-anchor="start" font-size="12" fill="#0f172a">الإنعاش، جهز تنبيبًا</text><text x="612" y="171.8" text-anchor="start" font-size="12" fill="#0f172a">إضافيًا وقناع صمام</text><text x="612" y="195" text-anchor="start" font-size="12" fill="#0f172a">• استرواح صدر</text><text x="612" y="213.2" text-anchor="start" font-size="12" fill="#0f172a">(Barotrauma) من PEEP</text><text x="612" y="231.4" text-anchor="start" font-size="12" fill="#0f172a">العالي: نقطة امتحان</text><text x="612" y="254.6" text-anchor="start" font-size="12" fill="#0f172a">• هبوط الضغط</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="217.79999999999998" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">بعد إزالة الأنبوب</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="12" fill="#0f172a">• أكسجين رطب دافئ بقناع</text><text x="408.66666666666663" y="122.2" text-anchor="start" font-size="12" fill="#0f172a">• عناية فموية (إسفنج)</text><text x="408.66666666666663" y="145.4" text-anchor="start" font-size="12" fill="#0f172a">• NPO</text><text x="408.66666666666663" y="168.6" text-anchor="start" font-size="12" fill="#0f172a">• Fowler العالي</text><text x="408.66666666666663" y="191.79999999999998" text-anchor="start" font-size="12" fill="#0f172a">• خطران: انخماص والتهاب</text><text x="408.66666666666663" y="209.99999999999997" text-anchor="start" font-size="12" fill="#0f172a">رئوي (مقياس حافز كل ساعة</text><text x="408.66666666666663" y="228.2" text-anchor="start" font-size="12" fill="#0f172a">وTCDB)، وصرير (squeaky)</text><text x="408.66666666666663" y="246.39999999999998" text-anchor="start" font-size="12" fill="#0f172a">→ أبلغ فورًا</text><rect x="20" y="54" width="193.33333333333334" height="217.79999999999998" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#0ea5e9"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الفغرة الرغامية</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="12" fill="#0f172a">• أولوية الجديدة: إحكام</text><text x="205.33333333333334" y="117.2" text-anchor="start" font-size="12" fill="#0f172a">الأربطة (إصبع واحد</text><text x="205.33333333333334" y="135.4" text-anchor="start" font-size="12" fill="#0f172a">تحتها)</text><text x="205.33333333333334" y="158.6" text-anchor="start" font-size="12" fill="#0f172a">• ناضجة (7 أيام فأكثر)</text><text x="205.33333333333334" y="176.79999999999998" text-anchor="start" font-size="12" fill="#0f172a">إن خرجت: أدخل أنبوبًا</text><text x="205.33333333333334" y="195" text-anchor="start" font-size="12" fill="#0f172a">جديدًا بملقط منحنٍ، أو</text><text x="205.33333333333334" y="213.2" text-anchor="start" font-size="12" fill="#0f172a">غطِّ الفتحة بضماد معقم</text><text x="205.33333333333334" y="231.39999999999998" text-anchor="start" font-size="12" fill="#0f172a">وهوِّ بكيس-قناع على</text><text x="205.33333333333334" y="249.6" text-anchor="start" font-size="12" fill="#0f172a">الأنف/الفم</text></svg>
