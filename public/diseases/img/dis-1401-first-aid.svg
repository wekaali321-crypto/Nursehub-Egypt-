<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 498" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="498" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التعامل أثناء النوبة التشنجية</text><rect x="20" y="54" width="600" height="53" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="590" cy="76" r="14" fill="#dc2626"/><text x="590" y="81" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="566" y="80" text-anchor="start" font-size="15" font-weight="800" fill="#7f1d1d">المجرى الهوائي</text><text x="566" y="100" text-anchor="start" font-size="13" fill="#7f1d1d">اقلب على الجنب وجهّز الشفط. لا شيء في الفم ولا تقييد.</text><text x="320" y="123" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="129" width="600" height="53" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="590" cy="151" r="14" fill="#dc2626"/><text x="590" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="566" y="155" text-anchor="start" font-size="15" font-weight="800" fill="#7f1d1d">نادِ المساعدة</text><text x="566" y="175" text-anchor="start" font-size="13" fill="#7f1d1d">وابقَ مع المريض وسجّل الوقت.</text><text x="320" y="198" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="204" width="600" height="53" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="590" cy="226" r="14" fill="#dc2626"/><text x="590" y="231" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="566" y="230" text-anchor="start" font-size="15" font-weight="800" fill="#7f1d1d">فُكّ الملابس</text><text x="566" y="250" text-anchor="start" font-size="13" fill="#7f1d1d">حول الرقبة والصدر.</text><text x="320" y="273" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="279" width="600" height="53" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="590" cy="301" r="14" fill="#dc2626"/><text x="590" y="306" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="566" y="305" text-anchor="start" font-size="15" font-weight="800" fill="#7f1d1d">الأمان</text><text x="566" y="325" text-anchor="start" font-size="13" fill="#7f1d1d">أبعد الأشياء الحادة وبطّن الحواف.</text><text x="320" y="348" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="354" width="600" height="53" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="590" cy="376" r="14" fill="#dc2626"/><text x="590" y="381" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text><text x="566" y="380" text-anchor="start" font-size="15" font-weight="800" fill="#7f1d1d">بعد النوبة</text><text x="566" y="400" text-anchor="start" font-size="13" fill="#7f1d1d">سجّل الوقت، قيّم الوعي والعصبي والعلامات، جهّز الشفط.</text><text x="320" y="423" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="429" width="600" height="53" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="590" cy="451" r="14" fill="#dc2626"/><text x="590" y="456" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">6</text><text x="566" y="455" text-anchor="start" font-size="15" font-weight="800" fill="#7f1d1d">إن استمرت 5 دقائق</text><text x="566" y="475" text-anchor="start" font-size="13" fill="#7f1d1d">بنزوديازيبين وريدي أو شرجي (lorazepam/diazepam) بأمر الطبيب.</text></svg>