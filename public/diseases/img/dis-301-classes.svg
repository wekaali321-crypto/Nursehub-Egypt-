<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="420" rx="16" fill="#f8fafc"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مجموعات أدوية الكحة وبتعمل إيه</text><rect x="400" y="48" width="210" height="62" rx="10" fill="#7c3aed" stroke="#7c3aed" stroke-width="2"/><text x="505.0" y="74.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">مثبّط كحة (Suppressant)</text><text x="505.0" y="92.2" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">مثال: dextromethorphan</text><rect x="30" y="48" width="360" height="62" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="210.0" y="83.5" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">بيهدّي مركز الكحة في المخ — للجافة فقط</text><rect x="400" y="120" width="210" height="62" rx="10" fill="#0ea5e9" stroke="#0ea5e9" stroke-width="2"/><text x="505.0" y="146.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">مذيب بلغم (Mucolytic)</text><text x="505.0" y="164.2" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">مثال: bromhexine, ambroxol</text><rect x="30" y="120" width="360" height="62" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><text x="210.0" y="155.6" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">بيخلّي البلغم أرق وأسهل في الطرد</text><rect x="400" y="192" width="210" height="62" rx="10" fill="#22c55e" stroke="#22c55e" stroke-width="2"/><text x="505.0" y="218.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">طارد بلغم (Expectorant)</text><text x="505.0" y="236.2" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">مثال: guaifenesin</text><rect x="30" y="192" width="360" height="62" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/><text x="210.0" y="227.6" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">بيساعد على إخراج البلغم</text><rect x="400" y="264" width="210" height="62" rx="10" fill="#f59e0b" stroke="#f59e0b" stroke-width="2"/><text x="505.0" y="290.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">موسّع شعب (Bronchodilator)</text><text x="505.0" y="308.2" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">مثال: aminophylline, terbutaline</text><rect x="30" y="264" width="360" height="62" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/><text x="210.0" y="299.6" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">مفيد لو في حساسية صدر أو أزيز</text><rect x="400" y="336" width="210" height="62" rx="10" fill="#ec4899" stroke="#ec4899" stroke-width="2"/><text x="505.0" y="362.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">مضاد هيستامين (Antihistamine)</text><text x="505.0" y="380.2" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">مثال: chlorpheniramine, oxomemazine</text><rect x="30" y="336" width="360" height="62" rx="10" fill="#fff" stroke="#ec4899" stroke-width="2"/><text x="210.0" y="371.6" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">للرشح والعطس مع دور البرد (بيعمل نعاس)</text></svg>