<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 243" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="700" height="243" rx="16" fill="#f8fafc"/>
<text x="350.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الجاراتيرويد: الفرط والنقص</text>
<rect x="356.0" y="52" width="330.0" height="163.5" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="356.0" y="52" width="330.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="521.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">فرط الجارات (كالسيوم عالٍ &gt;10.5)</text>
<text x="676.0" y="96" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• PTH يرفع الكالسيوم عند نقصه ويخفضه عند ارتفاعه</text>
<text x="676.0" y="112.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">(طبيعي 9–10.5)</text>
<text x="676.0" y="131.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• يضعف العظام: كسور وألم عظام، حصوات كلوية، إمساك</text>
<text x="676.0" y="149.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• أسباب: ورم (ورم حميد adenoma أو خبيث)، نقص</text>
<text x="676.0" y="166.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">فيتامين D، سوء امتصاص، فشل كلوي</text>
<text x="676.0" y="184.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• علاج: خفض الكالسيوم بسوائل فوروسيمايد ومحلول</text>
<text x="676.0" y="201.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">ملحي، وفوسفات وريدي بأمر الطبيب، واستئصال الجارات</text>
<rect x="14.0" y="52" width="330.0" height="163.5" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="14.0" y="52" width="330.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="179.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">قصور الجارات (كالسيوم منخفض &lt;9.0)</text>
<text x="334.0" y="96" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• علامة Trousseau (تشنج اليد بكفة الضغط) وChvostek</text>
<text x="334.0" y="112.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">(انقباض الوجه عند نقر الخد)، إسهال</text>
<text x="334.0" y="131.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• أسباب: استئصال الدرقية (نقطة امتحان)، نقص</text>
<text x="334.0" y="147.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">مغنيسيوم، مناعة ذاتية، إشعاع</text>
<text x="334.0" y="166.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• علاج: جلوكونات كالسيوم وريدي، فيتامين D لامتصاص</text>
<text x="334.0" y="182.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">الكالسيوم، احتياطات التشنج وفينوباربيتال</text>
</svg>
