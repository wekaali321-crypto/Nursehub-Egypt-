<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="318" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >الهربس: ثلاثة وجوه لنفس العائلة</text><rect x="24" y="46" width="592" height="58" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="470" y="46" width="146" height="58" rx="12" fill="#2563eb"/><text x="543" y="80.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff" >الهربس البسيط</text><text x="460" y="80.0" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a" >حويصلات حوالين الفم/اللسان (أو تناسلي)</text><rect x="24" y="112" width="592" height="58" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="470" y="112" width="146" height="58" rx="12" fill="#16a34a"/><text x="543" y="146.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff" >الجدري المائي</text><text x="460" y="146.0" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a" >حويصلات متعددة الأشكال، أكتر على الجذع (centripetal)</text><rect x="24" y="178" width="592" height="58" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="470" y="178" width="146" height="58" rx="12" fill="#dc2626"/><text x="543" y="212.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff" >الحزام الناري</text><text x="460" y="212.0" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a" >حويصلات على جانب واحد في توزيع عصب + ألم شديد</text><rect x="24" y="244" width="592" height="58" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="470" y="244" width="146" height="58" rx="12" fill="#7c3aed"/><text x="543" y="278.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff" >الجدري ← الحزام</text><text x="460" y="278.0" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a" >أول هجمة جدري، والهجمة الثانية حزام</text>
</svg>
