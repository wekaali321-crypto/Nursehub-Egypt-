38">متصل من المستقيم لأعلى</text><rect x="500" y="165" width="120" height="35" fill="#f1f8ff" stroke="#90a4ae"/><text x="560" y="189" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">العمق</text><rect x="240" y="165" width="260" height="35" fill="#f1f8ff" stroke="#90a4ae"/><text x="370" y="189" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">كل طبقات الجدار (Transmural)</text><rect x="20" y="165" width="220" height="35" fill="#f1f8ff" stroke="#90a4ae"/><text x="130" y="189" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">الغشاء المخاطي</text><rect x="500" y="200" width="120" height="35" fill="#ffffff" stroke="#90a4ae"/><text x="560" y="224" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">الإسهال</text><rect x="240" y="200" width="260" height="35" fill="#ffffff" stroke="#90a4ae"/><text x="370" y="224" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">غالباً بدون دم</text><rect x="20" y="200" width="220" height="35" fill="#ffffff" stroke="#90a4ae"/><text x="130" y="224" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">دم + مخاط + زحير</text><rect x="500" y="235" width="120" height="35" fill="#f1f8ff" stroke="#90a4ae"/><text x="560" y="259" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">المضاعفات</text><rect x="240" y="235" width="260" height="35" fill="#f1f8ff" stroke="#90a4ae"/><text x="370" y="259" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">ناسور، تضيق، خراج</text><rect x="20" y="235" width="220" height="35" fill="#f1f8ff" stroke="#90a4ae"/><text x="130" y="259" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">تضخم قولون سام، سرطان</text><rect x="500" y="270" width="120" height="35" fill="#ffffff" stroke="#90a4ae"/><text x="560" y="294" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">الجراحة</text><rect x="240" y="270" width="260" height="