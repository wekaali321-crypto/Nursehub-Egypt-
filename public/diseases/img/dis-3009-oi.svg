<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="320" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تكوّن العظم الناقص (عظام الزجاج)</text><rect x="330" y="50" width="290" height="90" rx="10" fill="#6366f1"/><text x="475.0" y="71.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الآلية</text><text x="475.0" y="89.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">وراثي: خلل بإنتاج الكولاجين</text><text x="475.0" y="107.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">عظام هشة كالجبن السويسري</text><text x="475.0" y="125.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">كسور من ضغط خفيف</text><rect x="20" y="50" width="300" height="90" rx="10" fill="#ef4444"/><text x="170.0" y="80.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ما يميزه</text><text x="170.0" y="98.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">أكثر الأمراض المسببة لهشاشة العظام عند الأطفال</text><text x="170.0" y="116.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">كسور متكررة (مثلا 5 مرات)</text><rect x="20" y="155" width="600" height="125" rx="10" fill="#16a34a"/><text x="320.0" y="192.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التمريض</text><text x="320.0" y="211.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">قياس ضغط الدم يدويًا لتجنب شد الكفة</text><text x="320.0" y="230.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">تغيير الوضع كثيرًا بأجهزة داعمة</text><text x="320.0" y="249.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">الرفع من أوسع أجزاء الجسم</text></svg>