<text x="179.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">نوع 2</text>
<text x="334.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• مستقبلات الأنسولين قليلة العمل (مقاومة)؛ بسبب</text>
<text x="334.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الغذاء (سكريات) وقلة الحركة</text>
