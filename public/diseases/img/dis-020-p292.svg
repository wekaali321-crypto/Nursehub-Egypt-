<text x="676.0" y="511.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• دهون: كولسترول 200، ثلاثية 150، LDL 100، HDL أقل</text>
<text x="676.0" y="527.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">من 40</text>
