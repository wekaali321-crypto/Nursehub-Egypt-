<text x="676.0" y="192.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• جلد ساخن وجاف، بوال وعطش وجوع (3 P)</text>
<text x="676.0" y="211.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• الأسباب: عدوى (الأولى)، إجهاد وجراحة، ترك</text>
<text x="676.0" y="229.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الإنسولين، ستيرويدات</text>
<text x="676.0" y="248.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• العلاج: أنسولين</text>
<rect x="14.0" y="148.5" width="330.0" height="115.0" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="14.0" y="148.5" width="330.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="179.0" y="166.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">انخفاض السكر (70 أو أقل)</text>
<text x="334.0" y="192.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• برد وزرقة وعرق وارتعاش وقلق وجوع وضعف</text>
<text x="334.0" y="211.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قاتل للدماغ: واعٍ → عصير أو صودا أو بسكويت أو</text>
<text x="334.0" y="229.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">حليب قليل الدسم (لا حليب كامل الدسم ولا زبدة فول</text>
<text x="334.0" y="246.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">سوداني)؛ نائم → دكستروز وريدي D50</text>
