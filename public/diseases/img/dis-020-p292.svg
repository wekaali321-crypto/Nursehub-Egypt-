<text x="676.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا يُنتج الأنسولين (مناعة ذاتية تهاجم</text>
<text x="676.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">البنكرياس) ووراثة</text>
