<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="290" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قمل الرأس: العلاج وإجراءات الأسرة</text><rect x="430" y="50" width="190" height="70" rx="10" fill="#6366f1"/><text x="525.0" y="69.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ما هو؟</text><text x="525.0" y="88.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">حشرة بلا أجنحة تعيش على</text><text x="525.0" y="107.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">فروة الرأس وتتغذى على الدم</text><rect x="225" y="50" width="190" height="70" rx="10" fill="#0ea5e9"/><text x="320.0" y="69.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأعراض</text><text x="320.0" y="88.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">هرش وقروح بالرأس</text><text x="320.0" y="107.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">والرقبة والكتفين</text><rect x="20" y="50" width="190" height="70" rx="10" fill="#14b8a6"/><text x="115.0" y="69.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التشخيص</text><text x="115.0" y="88.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">فحص مدرسي: بيض القمل</text><text x="115.0" y="107.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">(Nits) أو قمل بالغ</text><rect x="330" y="140" width="290" height="66" rx="10" fill="#16a34a"/><text x="475.0" y="167.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الدواء</text><text x="475.0" y="186.0" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">Permethrin 1% (شطف كريمي)</text><rect x="20" y="140" width="300" height="66" rx="10" fill="#f59e0b"/><text x="170.0" y="158.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">البيئة</text><text x="170.0" y="176.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">غسل الملابس والملاءات والمناشف بالماء الساخن</text><text x="170.0" y="194.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">أغراض لا تُغسل: أكياس بلاستيك محكمة</text><rect x="20" y="220" width="600" height="50" rx="10" fill="#dc2626"/><text x="320.0" y="239.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الوقاية</text><text x="320.0" y="258.0" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">لا تتشارك القبعات والأوشحة والفرش</text></svg>