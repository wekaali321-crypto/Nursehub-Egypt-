<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >الأملاح: المدى وما يميّز النقص والزيادة</text><rect x="20" y="44" width="600" height="30" rx="8" fill="#0f172a" stroke="none" stroke-width="1"/><text x="560" y="64" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >الملح</text><text x="470" y="64" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >المدى</text><text x="320" y="64" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >عند النقص</text><text x="130" y="64" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >عند الزيادة</text><rect x="20" y="80" width="600" height="46" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="540" y="80" width="80" height="46" rx="8" fill="#2563eb" stroke="none" stroke-width="1"/><text x="580" y="110" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" direction="ltr">Na⁺</text><text x="470" y="110" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" direction="ltr">135 – 145</text><text x="320" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569" >ارتباك، تشنج</text><text x="130" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569" >ورم وجلد محمر</text><rect x="20" y="132" width="600" height="46" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2"/><rect x="540" y="132" width="80" height="46" rx="8" fill="#dc2626" stroke="none" stroke-width="1"/><text x="580" y="162" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" direction="ltr">K⁺</text><text x="470" y="162" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" direction="ltr">3.5 – 5.0</text><text x="320" y="161" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569" >ضعف، شلل معوي</text><text x="130" y="161" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569" >T مدبّبة، QRS عريض</text><rect x="20" y="184" width="600" height="46" rx="8" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><rect x="540" y="184" width="80" height="46" rx="8" fill="#0ea5e9" stroke="none" stroke-width="1"/><text x="580" y="214" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" direction="ltr">Cl⁻</text><text x="470" y="214" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" direction="ltr">97 – 107</text><text x="320" y="213" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569" >يتبع الصوديوم</text><text x="130" y="213" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569" >يتبع الصوديوم</text><rect x="20" y="236" width="600" height="46" rx="8" fill="#fff" stroke="#f97316" stroke-width="2"/><rect x="540" y="236" width="80" height="46" rx="8" fill="#f97316" stroke="none" stroke-width="1"/><text x="580" y="266" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" direction="ltr">Ca</text><text x="470" y="266" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" direction="ltr">9.0 – 10.5</text><text x="320" y="265" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569" >تيتانوس، تشنج</text><text x="130" y="265" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569" >حصى وإمساك</text><rect x="20" y="288" width="600" height="46" rx="8" fill="#fff" stroke="#a855f7" stroke-width="2"/><rect x="540" y="288" width="80" height="46" rx="8" fill="#a855f7" stroke="none" stroke-width="1"/><text x="580" y="318" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" direction="ltr">Mg</text><text x="470" y="318" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" direction="ltr">1.3 – 2.1</text><text x="320" y="317" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569" >اهتياج، رجفان</text><text x="130" y="317" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569" >نبض بطيء، منعكسات ↓</text><rect x="20" y="340" width="600" height="46" rx="8" fill="#fff" stroke="#b45309" stroke-width="2"/><rect x="540" y="340" width="80" height="46" rx="8" fill="#b45309" stroke="none" stroke-width="1"/><text x="580" y="370" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" direction="ltr">PO₄</text><text x="470" y="370" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" direction="ltr">3.0 – 4.5</text><text x="320" y="369" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569" >ضعف عضلات</text><text x="130" y="369" text-anchor="middle" font-size="13.5" font-weight="700" fill="#475569" >عكس الكالسيوم</text><text x="320" y="410" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >المدى بالوحدة المعتادة في المعمل. تحقق من النشرة المطبوعة</text>
</svg>
