<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="330" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع الإنسولين: متى يبدأ ومتى يبلغ ذروته وكم يدوم</text>
<text x="610" y="60" text-anchor="start" font-size="13" font-weight="800" fill="#0f172a">إنسولين قصير المفعول (Actrapid / Humulin R)</text>
<g direction="ltr"><rect x="30" y="68" width="580" height="16" rx="4" fill="#e2e8f0"/><rect x="37" y="68" width="80" height="16" rx="4" fill="#bfdbfe"/><rect x="62" y="68" width="24" height="16" rx="4" fill="#2563eb"/></g>
<text x="610" y="102" text-anchor="start" font-size="12" fill="#475569">بداية 30 دقيقة ← ذروة 3 ساعات ← مدة 6 ساعات</text>
<text x="610" y="140" text-anchor="start" font-size="13" font-weight="800" fill="#0f172a">متوسط (Monotard / Humulin N)</text>
<g direction="ltr"><rect x="30" y="148" width="580" height="16" rx="4" fill="#e2e8f0"/><rect x="74" y="148" width="304" height="16" rx="4" fill="#fde68a"/><rect x="134" y="148" width="24" height="16" rx="4" fill="#d97706"/></g>
<text x="610" y="182" text-anchor="start" font-size="12" fill="#475569">بداية 3 ساعات ← ذروة 8 ساعات ← مدة 24 ساعة</text>
<text x="610" y="220" text-anchor="start" font-size="13" font-weight="800" fill="#0f172a">طويل (Detemir) كما في المنهج</text>
<g direction="ltr"><rect x="30" y="228" width="580" height="16" rx="4" fill="#e2e8f0"/><rect x="88" y="228" width="464" height="16" rx="4" fill="#bbf7d0"/><rect x="250" y="228" width="24" height="16" rx="4" fill="#16a34a"/></g>
<text x="610" y="262" text-anchor="start" font-size="12" fill="#475569">بداية 4 ساعات ← ذروة 16 ساعة ← مدة 36 ساعة</text>
<g direction="ltr" font-size="10" fill="#64748b" text-anchor="middle"><text x="30" y="300">0 h</text><text x="175" y="300">10 h</text><text x="320" y="300">20 h</text><text x="465" y="300">30 h</text><text x="610" y="300">40 h</text></g>
<text x="610" y="320" text-anchor="start" font-size="11" fill="#64748b">المربع الغامق = الذروة. أنواع Mixtard = خليط 30% قصير + 70% متوسط.</text>
</svg>
