<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 253" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="253" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">Metronidazole: ما الطبيعي وما الذي يُبلَّغ عنه</text><rect x="325.0" y="44" width="299.0" height="91.5" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><path d="M325.0 54a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#0f766e"/><text x="474.5" y="66" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">طبيعي: لا حاجة للإبلاغ</text><text x="474.5" y="94" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">بول داكن/بني صدئ</text><text x="474.5" y="110.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">طعم معدني بالفم</text><rect x="16.0" y="44" width="299.0" height="91.5" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.5"/><path d="M16.0 54a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#b45309"/><text x="165.5" y="66" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">ممنوع</text><text x="165.5" y="94" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الكحول أثناء العلاج و3 أيام بعده</text><text x="165.5" y="110.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">ويشمل غسول الفم وبعض المستحضرات</text><text x="165.5" y="127" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">قيء وتقلصات شديدة إن حدث</text><rect x="325.0" y="145.5" width="299.0" height="91.5" rx="10" fill="#fff" stroke="#1e3a8a" stroke-width="1.5"/><path d="M325.0 155.5a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#1e3a8a"/><text x="474.5" y="167.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">يعالج</text><text x="474.5" y="195.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">عدوى C. difficile (مرجع تعليمي)</text><text x="474.5" y="212" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الترايكوموناس (مرض منقول جنسيًا)</text><rect x="16.0" y="145.5" width="299.0" height="91.5" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.5"/><path d="M16.0 155.5a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#be123c"/><text x="165.5" y="167.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">خطير: أبلغ فورًا</text><text x="165.5" y="195.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أي طفح جديد أو تقشّر جلدي</text><text x="165.5" y="212" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">متلازمة Stevens-Johnson: تنخر جلدي</text><text x="165.5" y="228.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">وأغشية مخاطية</text></svg>