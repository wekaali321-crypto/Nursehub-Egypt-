<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="310" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الخثار الوريدي العميق بعد الولادة</text><rect x="326.0" y="50" width="294.0" height="116" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><rect x="326.0" y="50" width="294.0" height="28" rx="10" fill="#b91c1c"/><text x="473.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلامات</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• ألم وتقلصات في الربلة</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• تورم ساق واحدة فقط</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• ساق حمراء دافئة</text><text x="610.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• ضيق نفس وألم صدر = انصمام رئوي</text><rect x="20.0" y="50" width="294.0" height="116" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="20.0" y="50" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="167.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الوقاية</text><text x="304.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• حركة مبكرة ومتكررة</text><text x="304.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• تجنب تقاطع الساقين والجلوس الطويل</text><text x="304.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• جوارب ضاغطة أو أجهزة ضغط متقطع</text><text x="304.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• سوائل كافية وتجنب التدخين</text><rect x="326.0" y="178" width="294.0" height="116" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="326.0" y="178" width="294.0" height="28" rx="10" fill="#7c3aed"/><text x="473.0" y="20" dy="178" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">عند الاشتباه</text><text x="610.0" y="224" font-size="12.5" fill="#0f172a" text-anchor="end">• لا تمشِّي المريضة ولا تدلك الساق</text><text x="610.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="end">• ارفع الساق فوق مستوى القلب</text><text x="610.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">• بلّغ الطبيب وابدأ مضاد التخثر بأمر</text><text x="610.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• راقب التنفس والأكسجين</text><rect x="20.0" y="178" width="294.0" height="116" rx="10" fill="#fff" stroke="#c2410c" stroke-width="2"/><rect x="20.0" y="178" width="294.0" height="28" rx="10" fill="#c2410c"/><text x="167.0" y="20" dy="178" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">إذا حدث انصمام رئوي</text><text x="304.0" y="224" font-size="12.5" fill="#0f172a" text-anchor="end">• قياس الأكسجين أولاً</text><text x="304.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="end">• أكسجين وإبلاغ الطبيب</text><text x="304.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">• هيبارين ثم مضاد تخثر</text><text x="304.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• حالّات الخثرة في الحالات الشديدة</text></svg>