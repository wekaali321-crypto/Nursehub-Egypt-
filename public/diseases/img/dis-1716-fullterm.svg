<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="244" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">المولود: كامل المدة أم خديج أم متأخر؟</text><rect x="426" y="46" width="193" height="152" rx="12" fill="#bae6fd"/><text x="522.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">مبتسر (20–37 أسبوعًا)</text><text x="522.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">جلد أملس لامع شفاف</text><text x="522.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">وريدي ظاهر وهش جدًا</text><text x="522.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">كثير من الـ vernix</text><text x="522.5" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">زغب (Lanugo) كثير</text><text x="522.5" y="176" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">حلمات مسطحة بلا نسيج ثدي</text><rect x="223" y="46" width="193" height="152" rx="12" fill="#bbf7d0"/><text x="319.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">كامل المدة (37–40)</text><text x="319.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">جلد معتم</text><text x="319.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">Vernix في ثنايا الجلد</text><text x="319.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">جسم متوازن النمو</text><text x="319.5" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">خطوط كف مكتملة</text><rect x="20" y="46" width="193" height="152" rx="12" fill="#fde68a"/><text x="116.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">متأخر (أكثر من 40)</text><text x="116.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">جلد جاف متشقق يتقشر</text><text x="116.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">حجم أكبر وأقل مرونة</text><text x="116.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">تجاعيد عميقة بالكفين والقدمين</text><text x="116.5" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">فيرنكس قليل</text><text x="320" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">الفحص من الرأس للقدم يهدف لتقدير النضج وتوجيه الرعاية</text>
</svg>
