  <rect x="40" y="60" width="200" height="300" rx="60" fill="#fde7d3" stroke="#d6a77a" stroke-width="1.5"/><circle cx="140" cy="110" r="34" fill="#fde7d3" stroke="#d6a77a" stroke-width="1.5"/><rect x="95" y="180" width="90" height="170" rx="30" fill="#fecaca" stroke="#ef4444" stroke-width="1.5"/><path d="M118 100 L118 150 L160 200 L160 300" fill="none" stroke="#0ea5e9" stroke-width="5"/><text x="140" y="320" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">المعدة</text><rect x="270" y="55" width="350" height="90" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/><text x="445" y="80" text-anchor="middle" font-size="14" font-weight="800" fill="#1e293b">قياس الطول (NEX)</text><text x="445" y="105" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">من جسر الأنف → شحمة الأذن → الناتئ الخنجري</text><text x="445" y="125" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">علّم المكان بقلم أو شريط</text><rect x="270" y="160" width="350" height="200" rx="10" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="445" y="182" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">التأكد من الموضع</text><text x="608" y="206" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• الأشعة X-ray هي المرجع قبل أي تغذية</text><text x="608" y="225" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• اسحب محتويات المعدة وافحص pH (حوالي 4 أو أقل)</text><text x="608" y="244" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• وقف فوري لو نزلت تشبع الأكسجين</text>
