<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 258" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="258" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">خطوات علاج جفاف المهبل بعد سن اليأس</text>
<rect x="20" y="44" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="44" width="160" height="54" rx="10" fill="#be185d"/><text x="540" y="76" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1. إستروجين موضعي</text><text x="448" y="67" text-anchor="end" font-size="13" fill="#0f172a">Premarin vaginal cream مرة يومياً 21 يوم</text><text x="448" y="85" text-anchor="end" font-size="13" fill="#0f172a">ثم وقف 7 أيام ولا يتكرر إلا عند اللزوم</text><rect x="20" y="106" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="106" width="160" height="54" rx="10" fill="#0369a1"/><text x="540" y="138" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2. جل مرطب</text><text x="448" y="129" text-anchor="end" font-size="13" fill="#0f172a">K-Y gel أو Free step gel</text><text x="448" y="147" text-anchor="end" font-size="13" fill="#0f172a">يُستعمل قبل الجماع مباشرة لتقليل الجفاف</text><rect x="20" y="168" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="168" width="160" height="54" rx="10" fill="#0f766e"/><text x="540" y="200" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3. غسول مهبلي مطهر</text><text x="448" y="191" text-anchor="end" font-size="13" fill="#0f172a">Tantum rosa كيس على لتر ماء دافئ</text><text x="448" y="209" text-anchor="end" font-size="13" fill="#0f172a">مرة واحدة يومياً لتنشيف وتنظيف المهبل</text><text x="320" y="242" text-anchor="middle" font-size="12" fill="#64748b">التطبيق بأمر الطبيب فقط</text>
</svg>
