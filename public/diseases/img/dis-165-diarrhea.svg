<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">إسهال وجفاف الأطفال: ملخص تمريضي</text><rect x="325" y="48" width="295" height="144" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الأسباب</text><text x="610" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">فيروسات (الأشهر تحت 5 سنوات: روتا)</text><text x="610" y="120" text-anchor="end" font-size="12.5" fill="#1e293b">بكتيريا وطفيليات: لحم غير مطهي وسوء الصرف</text><text x="610" y="140" text-anchor="end" font-size="12.5" fill="#1e293b">أدوية: مضادات حيوية ومسهلات</text><text x="610" y="160" text-anchor="end" font-size="12.5" fill="#1e293b">عدم تحمل اللاكتوز</text><rect x="20" y="48" width="295" height="144" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">العلامات</text><text x="305" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">غور اليافوخ والعينين</text><text x="305" y="120" text-anchor="end" font-size="12.5" fill="#1e293b">جفاف الأغشية، قلة الدموع</text><text x="305" y="140" text-anchor="end" font-size="12.5" fill="#1e293b">فقد وزن، خمول</text><text x="305" y="160" text-anchor="end" font-size="12.5" fill="#1e293b">قلة مرونة الجلد</text><text x="305" y="180" text-anchor="end" font-size="12.5" fill="#1e293b">كثافة بول نوعية 1.035</text><rect x="325" y="202" width="295" height="124" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="202" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="223" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الإماهة</text><text x="610" y="254" text-anchor="end" font-size="12.5" fill="#1e293b">ORS أولًا</text><text x="610" y="274" text-anchor="end" font-size="12.5" fill="#1e293b">IV: 20 مل/كجم محلول ملحي 0.9% بلعة بعد</text><text x="610" y="294" text-anchor="end" font-size="12.5" fill="#1e293b">الفشل/شدة الجفاف</text><text x="610" y="314" text-anchor="end" font-size="12.5" fill="#1e293b">لا مشروبات رياضية للإماهة</text><rect x="20" y="202" width="295" height="124" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><rect x="20" y="202" width="295" height="30" rx="12" fill="#9333ea"/><text x="167.5" y="223" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الغذاء والأدوية</text><text x="305" y="254" text-anchor="end" font-size="12.5" fill="#1e293b">استمر بالأكل الطبيعي (صلب)</text><text x="305" y="274" text-anchor="end" font-size="12.5" fill="#1e293b">لا حمية BRAT فقط</text><text x="305" y="294" text-anchor="end" font-size="12.5" fill="#1e293b">تجنب مضادات الإسهال مثل لوبراميد</text>
</svg>
