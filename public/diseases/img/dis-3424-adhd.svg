<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" width="640" height="306" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="أدوية فرط الحركة وتشتت الانتباه (ADHD)"><rect width="640" height="306" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">أدوية فرط الحركة وتشتت الانتباه (ADHD)</text><rect x="326.0" y="46" width="302.0" height="116" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الأدوية</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• Methylphenidate (Ritalin)</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• Amphetamine mixture (Adderall)</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• Dextroamphetamine</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• منبّهات (Stimulants)</text><rect x="12.0" y="46" width="302.0" height="116" rx="10" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#2e7d4f"/><rect x="12.0" y="60" width="302.0" height="14" fill="#2e7d4f"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الاستعمال والآلية</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• ADHD عند الأطفال والمراهقين، والنوم</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   القهري (Narcolepsy)</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• تعزز الدوبامين والنورإبينفرين بالدماغ</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• تحسن الأداء المدرسي</text><rect x="326.0" y="174" width="302.0" height="116" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="326.0" y="174" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="326.0" y="188" width="302.0" height="14" fill="#a86a00"/><text x="477.0" y="193" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">آثار وتمريض</text><text x="616.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• فقدان شهية ووزن</text><text x="616.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• أرق وتململ: آخر جرعة قبل 6 مساءً</text><text x="616.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• أولوية: مراقبة الضغط</text><text x="616.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">• تابع الطول والوزن وبلّغ الاتجاهات</text></svg>