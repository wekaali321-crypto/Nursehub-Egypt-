<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 395" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="395" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">معالم تطور الرضيع</text><rect x="326.0" y="50" width="294.0" height="184" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="326.0" y="50" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="473.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">جسدية</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• حركات ذراع متشنجة مرتعشة</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• يضع يديه بفمه ويقبض</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• الرأس يتدلى إن لم يُسند</text><text x="610.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• منعكسات قوية</text><text x="610.0" y="164" font-size="12.5" fill="#0f172a" text-anchor="end">• 5-8 رضعات يومياً (3 وجبات و2 سناك)</text><text x="610.0" y="181" font-size="12.5" fill="#0f172a" text-anchor="end">• من نوم 20 ساعة إلى 10-12 ليلاً</text><text x="610.0" y="198" font-size="12.5" fill="#0f172a" text-anchor="end">وقيلولتين عند 12 شهراً؛ ضعه مستيقظاً</text><text x="610.0" y="215" font-size="12.5" fill="#0f172a" text-anchor="end">بالسرير</text><rect x="20.0" y="50" width="294.0" height="184" rx="10" fill="#fff" stroke="#be185d" stroke-width="2"/><rect x="20.0" y="50" width="294.0" height="28" rx="10" fill="#be185d"/><text x="167.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">نفسية</text><text x="304.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• يركز على مسافة 8-12 بوصة</text><text x="304.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• العينان تتجولان وتتقاطعان</text><text x="304.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• يحب الأنماط عالية التباين وجه الإنسان</text><text x="304.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• السمع ناضج ويلتفت للصوت</text><text x="304.0" y="164" font-size="12.5" fill="#0f172a" text-anchor="end">• يحب الروائح الحلوة واللمس اللطيف</text><rect x="326.0" y="246" width="294.0" height="133" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="326.0" y="246" width="294.0" height="28" rx="10" fill="#ea580c"/><text x="473.0" y="20" dy="246" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">اجتماعية وانفعالية</text><text x="610.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="end">• 0-1 شهر: نوم كثير واعتماد وتواصل بصري</text><text x="610.0" y="309" font-size="12.5" fill="#0f172a" text-anchor="end">• 0-3: ابتسامة وتثبيت على الوجوه</text><text x="610.0" y="326" font-size="12.5" fill="#0f172a" text-anchor="end">• 3-6: لعبة peekaboo</text><text x="610.0" y="343" font-size="12.5" fill="#0f172a" text-anchor="end">• 6-12: يعرف اسمه ويفهم أوامر بسيطة</text><text x="610.0" y="360" font-size="12.5" fill="#0f172a" text-anchor="end">• قلق الانفصال 6 أشهر وقلق الغرباء 6-12</text><rect x="20.0" y="246" width="294.0" height="133" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="20.0" y="246" width="294.0" height="28" rx="10" fill="#7c3aed"/><text x="167.0" y="20" dy="246" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">اللغة</text><text x="304.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="end">• 0-3 أشهر: بكاء وهمهمة</text><text x="304.0" y="309" font-size="12.5" fill="#0f172a" text-anchor="end">• 0-6: مناغاة وحروف علة وأنصاف ساكنة</text><text x="304.0" y="326" font-size="12.5" fill="#0f172a" text-anchor="end">• 12: كلمة أو اثنتان ومحاكاة واستجابة</text><text x="304.0" y="343" font-size="12.5" fill="#0f172a" text-anchor="end">لأوامر بسيطة</text></svg>