<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="296" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">TNM والمراحل والخبيث/الحميد</text>
<rect x="14" y="44" width="300" height="120" rx="10" fill="#fff" stroke="#6366f1" stroke-width="1.5"/><rect x="14" y="44" width="300" height="26" rx="10" fill="#6366f1"/><text x="164.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >TNM: ثلاثة مؤشرات</text><text x="304" y="89" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >T: حجم الورم الأساسي</text><text x="304" y="108.5" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >N: مشاركة العقد الليمفاوية (انتشار سريع)</text><text x="304" y="128.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >M: انتشار لأعضاء أخرى (Metastasis)</text><rect x="326" y="44" width="300" height="150" rx="10" fill="#fff" stroke="#be185d" stroke-width="1.5"/><rect x="326" y="44" width="300" height="26" rx="10" fill="#be185d"/><text x="476.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >مراحل السرطان الأربع</text><text x="616" y="89" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >0: لا سرطان (في موضعه)</text><text x="616" y="108" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >I: صغير في منطقة واحدة</text><text x="616" y="127" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >II وIII: أكبر وامتد لأنسجة/عقد قريبة</text><text x="616" y="146" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >IV: انتشر لأعضاء أخرى</text><rect x="14" y="176" width="300" height="100" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/><text x="164" y="198" text-anchor="middle" font-size="12.5" font-weight="800" fill="#713f12" >خبيث (Malignant) مقابل حميد (Benign)</text><text x="304" y="222" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >خبيث: ينمو بسرعة، بلا شكل محدد، ينتشر</text><text x="304" y="244" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >حميد: أبطأ، محاط بغلاف، لا ينتشر</text><text x="304" y="266" text-anchor="start" font-size="10.5" font-weight="600" fill="#64748b" >(خبيث = سيئ ونواياه خبيثة، حميد = لطيف)</text><rect x="326" y="206" width="300" height="70" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/><text x="476" y="228" text-anchor="middle" font-size="12.5" font-weight="800" fill="#164e63" >التشخيص</text><text x="616" y="248" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >تحاليل: علامات الورم (PSA للبروستاتا) | تصوير | خزعة (الأدق)</text>
</svg>
