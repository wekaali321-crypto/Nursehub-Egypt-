<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="262" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">فشل القلب: يمين مقابل يسار</text><rect x="20" y="46" width="600" height="30" rx="8" fill="#1e3a8a"/><text x="570.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الجانب</text><text x="355.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الأعراض</text><text x="105.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">حيلة</text><rect x="20" y="76" width="600" height="48" fill="#e0e7ff"/><text x="570.0" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">فشل أيمن</text><text x="355.0" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">وذمة طرفية، وزن زائد، احتقان وريدي رقبة، تضخم كبد</text><text x="355.0" y="114" text-anchor="middle" font-size="12.5"  fill="#0f172a">وطحال، استسقاء</text><text x="105.0" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">R: جسم مليان سوائل</text><rect x="20" y="124" width="600" height="48" fill="#fff"/><text x="570.0" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">فشل أيسر</text><text x="355.0" y="144" text-anchor="middle" font-size="12.5"  fill="#0f172a">وذمة رئوية، خراخر، بلغم وردي رغوي، انتصاب التنفس</text><text x="355.0" y="162" text-anchor="middle" font-size="12.5"  fill="#0f172a">(Orthopnea)</text><text x="105.0" y="144" text-anchor="middle" font-size="12.5"  fill="#0f172a">L: الرئة</text><rect x="20" y="172" width="600" height="48" fill="#e0e7ff"/><text x="570.0" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">علامات مبكرة</text><text x="570.0" y="210" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">بالرضيع</text><text x="355.0" y="192" text-anchor="middle" font-size="12.5"  fill="#0f172a">تسرع قلب، تسرع تنفس، تعرق أثناء الرضاعة، زيادة وزن</text><text x="355.0" y="210" text-anchor="middle" font-size="12.5"  fill="#0f172a">مفاجئة</text><text x="105.0" y="192" text-anchor="middle" font-size="12.5"  fill="#0f172a">HF = Heavy Fluid</text><text x="320" y="242" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">زيادة الوزن = ماء مخزّن</text>
</svg>
