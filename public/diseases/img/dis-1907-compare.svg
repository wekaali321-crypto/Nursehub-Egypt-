<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 268" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="268" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ارتجاع الرضع (Achalasia) مقابل تضيق البواب (HPS)</text><rect x="325" y="48" width="295" height="204" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Achalasia (عسر ارتخاء)</text><text x="610" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">اضطراب حركة: تقل حركة المريء ولا يرتخي</text><text x="610" y="120" text-anchor="end" font-size="12.5" fill="#1e293b">العضلة السفلية LES</text><text x="610" y="140" text-anchor="end" font-size="12.5" fill="#1e293b">الرضيع يتقيأ الحليب بعد الرضاعة</text><text x="610" y="160" text-anchor="end" font-size="12.5" fill="#1e293b">أعراض: مغص وبكاء، قيء متكرر، رفض الأكل أو</text><text x="610" y="180" text-anchor="end" font-size="12.5" fill="#1e293b">اختناق/تهوع</text><text x="610" y="200" text-anchor="end" font-size="12.5" fill="#1e293b">بعد الرضاعة: وضع منتصب 30 دقيقة، ارفع</text><text x="610" y="220" text-anchor="end" font-size="12.5" fill="#1e293b">الرأس، رضعات صغيرة متكررة</text><rect x="20" y="48" width="295" height="204" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Pyloric stenosis</text><text x="305" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">تضخم العضلة البوابية فتمنع مرور الطعام</text><text x="305" y="120" text-anchor="end" font-size="12.5" fill="#1e293b">للأمعاء</text><text x="305" y="140" text-anchor="end" font-size="12.5" fill="#1e293b">قيء قذفي (Projectile) فور الرضاعة وجوع</text><text x="305" y="160" text-anchor="end" font-size="12.5" fill="#1e293b">دائم</text><text x="305" y="180" text-anchor="end" font-size="12.5" fill="#1e293b">جفاف وقلة وزن</text><text x="305" y="200" text-anchor="end" font-size="12.5" fill="#1e293b">كتلة بحجم الزيتونة</text><text x="305" y="220" text-anchor="end" font-size="12.5" fill="#1e293b">هيماتوكريت مرتفع، قلاء أيضي pH أعلى من</text><text x="305" y="240" text-anchor="end" font-size="12.5" fill="#1e293b">7.45، بوتاسيوم 3.5 أو أقل</text>
</svg>
