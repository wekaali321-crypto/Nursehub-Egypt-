<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 212" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="212" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">طبقات الجلد ووظائفها</text><text x="320" y="50" text-anchor="middle" font-size="12" fill="#475569">ثلاث وظائف كبرى: منع الجفاف، تنظيم الحرارة، الدفاع ضد العدوى</text><rect x="427.33333333333337" y="64" width="198.66666666666666" height="132" rx="12" fill="#fff" stroke="#ca8a04" stroke-width="1.5"/><rect x="427.33333333333337" y="64" width="198.66666666666666" height="28" rx="12" fill="#ca8a04"/><text x="526.6666666666667" y="83" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">البشرة (Epidermis)</text><text x="526.6666666666667" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">الطبقة الخارجية</text><text x="526.6666666666667" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">حاجز ضد الماء والعدوى</text><text x="526.6666666666667" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">خلايا جديدة تدفع القديمة</text><text x="526.6666666666667" y="158" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">للسطح</text><text x="526.6666666666667" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">الميلانين</text><rect x="220.6666666666667" y="64" width="198.66666666666666" height="132" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><rect x="220.6666666666667" y="64" width="198.66666666666666" height="28" rx="12" fill="#ea580c"/><text x="320.00000000000006" y="83" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">الأدمة (Dermis)</text><text x="320.00000000000006" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">أوعية وأعصاب</text><text x="320.00000000000006" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">غدد عرق وبصيلات</text><text x="320.00000000000006" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">كولاجين ومرونة</text><rect x="14.000000000000057" y="64" width="198.66666666666666" height="132" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><rect x="14.000000000000057" y="64" width="198.66666666666666" height="28" rx="12" fill="#7c3aed"/><text x="113.33333333333339" y="83" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">النسيج تحت الجلد</text><text x="113.33333333333339" y="110" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">دهون وعزل</text><text x="113.33333333333339" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">حماية من الصدمات</text><text x="113.33333333333339" y="142" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">ثبات الجلد</text></svg>