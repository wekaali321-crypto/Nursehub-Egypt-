<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 378" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="378" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">نوبة الهلع: ماذا يحدث وماذا تفعل؟</text><rect x="40" y="48" width="560" height="66" rx="12" fill="#fff" stroke="#dc2626" stroke-width="1.8"/><circle cx="576" cy="81" r="14" fill="#dc2626"/><text x="576" y="86" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="552" y="69" text-anchor="start" font-size="14" font-weight="800" fill="#dc2626">بداية مفاجئة</text><text x="552" y="87" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">خفقان، ضيق نفس، ألم صدر، دوخة، تعرق، غثيان، خدر، إحساس بالاختناق (يبلغ</text><text x="552" y="103" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">الذروة خلال دقائق)</text><text x="320" y="130" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="136" width="560" height="50" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.8"/><circle cx="576" cy="161" r="14" fill="#ea580c"/><text x="576" y="166" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="552" y="157" text-anchor="start" font-size="14" font-weight="800" fill="#ea580c">أفكار كارثية</text><text x="552" y="175" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">«سأموت» أو «أفقد السيطرة» + انفصال عن الواقع (Depersonalization)</text><text x="320" y="202" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="208" width="560" height="66" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><circle cx="576" cy="241" r="14" fill="#2563eb"/><text x="576" y="246" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="552" y="229" text-anchor="start" font-size="14" font-weight="800" fill="#2563eb">استبعد الجسدي</text><text x="552" y="247" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">ECG، أكسجين، سكر: إن كانت طبيعية يرجح الهلع، لكن لا تفترض ذلك قبل</text><text x="552" y="263" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">الفحص</text><text x="320" y="290" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="296" width="560" height="66" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.8"/><circle cx="576" cy="329" r="14" fill="#16a34a"/><text x="576" y="334" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="552" y="317" text-anchor="start" font-size="14" font-weight="800" fill="#16a34a">ادعم وهدّئ</text><text x="552" y="335" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">ابقَ مع المريض، صوت هادئ، تنفس بطيء، بيئة هادئة. النوبة عادة تنتهي في</text><text x="552" y="351" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">10–20 دقيقة</text></svg>