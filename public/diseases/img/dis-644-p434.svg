<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 436" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="436" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">COPD: الانتفاخ الرئوي مقابل التهاب الشعب المزمن</text><rect x="325" y="54" width="295" height="192.2" rx="10" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="1.5"/><rect x="325" y="54" width="295" height="29" rx="10" fill="#ec4899"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الانتفاخ الرئوي («النافخ الوردي»)</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• جلد وردي وتنفس بشفاه مزمومة</text><text x="612" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• صدر برميلي</text><text x="612" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• سعال مزمن قليل أو معدوم</text><text x="612" y="168.6" text-anchor="start" font-size="13" fill="#0f172a">• وضع الحامل الثلاثي (tripod)</text><text x="612" y="191.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">• تلف الحويصلات: فقد مرونة الرئة</text><text x="612" y="209.99999999999997" text-anchor="start" font-size="13" fill="#0f172a">وارتدادها واحتباس هواء</text><rect x="20" y="54" width="295" height="192.2" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="20" y="54" width="295" height="48" rx="10" fill="#0ea5e9"/><text x="307" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">التهاب الشعب المزمن («الأزرق</text><text x="307" y="91" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">المنتفخ»)</text><text x="307" y="118" text-anchor="start" font-size="13" fill="#0f172a">• زرقة (نقص أكسجة)</text><text x="307" y="141.2" text-anchor="start" font-size="13" fill="#0f172a">• سعال مزمن وبلغم</text><text x="307" y="164.39999999999998" text-anchor="start" font-size="13" fill="#0f172a">• أصوات غير طبيعية: خراخر وصفير</text><text x="307" y="187.59999999999997" text-anchor="start" font-size="13" fill="#0f172a">• وذمة محيطية (قلب رئوي)</text><text x="307" y="210.79999999999995" text-anchor="start" font-size="13" fill="#0f172a">• التهاب الشعب وإفراز مخاط زائد → سعال</text><text x="307" y="228.99999999999994" text-anchor="start" font-size="13" fill="#0f172a">مزمن وعدوى متكررة</text><rect x="20" y="256.2" width="600" height="27.5" fill="#f59e0b"/><text x="614" y="272.95" text-anchor="start" font-size="12.5" font-weight="700" fill="#fff">القياس</text><text x="345.0344827586207" y="272.95" text-anchor="start" font-size="12.5" font-weight="700" fill="#fff">القيمة</text><rect x="20" y="283.7" width="600" height="27.5" fill="#f59e0b" fill-opacity="0.07" stroke="#f59e0b" stroke-opacity="0.3"/><text x="614" y="300.45" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">SpO₂ المقبول في COPD</text><text x="345.0344827586207" y="300.45" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">88–93%</text><rect x="20" y="311.2" width="600" height="27.5" fill="#fff" fill-opacity="1" stroke="#f59e0b" stroke-opacity="0.3"/><text x="614" y="327.95" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">PaO₂</text><text x="345.0344827586207" y="327.95" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">منخفض (نقص أكسجة): أقل من 80</text><rect x="20" y="338.7" width="600" height="27.5" fill="#f59e0b" fill-opacity="0.07" stroke="#f59e0b" stroke-opacity="0.3"/><text x="614" y="355.45" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">PaCO₂</text><text x="345.0344827586207" y="355.45" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أكثر من 45 (احتباس CO₂)</text><rect x="20" y="366.2" width="600" height="27.5" fill="#fff" fill-opacity="1" stroke="#f59e0b" stroke-opacity="0.3"/><text x="614" y="382.95" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">pH</text><text x="345.0344827586207" y="382.95" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أقل من 7.35 (حماض)</text><rect x="20" y="393.7" width="600" height="27.5" fill="#f59e0b" fill-opacity="0.07" stroke="#f59e0b" stroke-opacity="0.3"/><text x="614" y="410.45" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">مضاعفة قاتلة</text><text x="345.0344827586207" y="410.45" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">فشل تنفسي: احتباسي → BiPAP أولوية</text></svg>
