<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >علامتا نقص الكالسيوم والاضطرابات الخطرة</text><rect x="20" y="46" width="290" height="170" rx="12" fill="#fff" stroke="#f97316" stroke-width="3"/><text x="165" y="72" text-anchor="middle" font-size="16" font-weight="800" fill="#f97316" >تروسو (Trousseau)</text><rect x="60" y="100" width="120" height="34" rx="17" fill="#fde68a" stroke="#b45309" stroke-width="2"/><rect x="110" y="94" width="26" height="46" rx="6" fill="#2563eb"/><path d="M180 117 q30 -6 40 -30 l14 6 q-8 36 -54 40 z" fill="#fde68a" stroke="#b45309" stroke-width="2"/><text x="165" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >نفخ جهاز الضغط فوق الضغط الانقباضي</text><text x="165" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" >← تقلص اليد (Carpopedal spasm)</text><rect x="330" y="46" width="290" height="170" rx="12" fill="#fff" stroke="#a855f7" stroke-width="3"/><text x="475" y="72" text-anchor="middle" font-size="16" font-weight="800" fill="#a855f7" >شفوستك (Chvostek)</text><circle cx="430" cy="130" r="38" fill="#fde68a" stroke="#b45309" stroke-width="2"/><circle cx="418" cy="122" r="4" fill="#0f172a"/><circle cx="442" cy="122" r="4" fill="#0f172a"/><path d="M416 144 q14 12 28 0" stroke="#0f172a" stroke-width="2.5" fill="none"/><path d="M470 130 l22 -14" stroke="#64748b" stroke-width="4"/><circle cx="470" cy="131" r="5" fill="#dc2626"/><text x="540" y="120" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >نقر العصب الوجهي</text><text x="540" y="142" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >أمام الأذن</text><text x="475" y="194" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" >← انقباض عضلات نصف الوجه</text><rect x="20" y="232" width="290" height="110" rx="12" fill="#fff" stroke="#dc2626" stroke-width="3"/><text x="165" y="258" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626" >تورسادس دي بوان (Torsades)</text><path d="M40 304 q10 -34 20 0 t20 0 q12 -44 24 0 t24 0 q14 -48 28 0 t28 0 q10 -30 20 0 t20 0 q8 -22 16 0" stroke="#0f172a" stroke-width="2.2" fill="none"/><text x="165" y="332" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >مع نقص المغنيسيوم أو الكالسيوم</text><rect x="330" y="232" width="290" height="110" rx="12" fill="#fff" stroke="#dc2626" stroke-width="3"/><text x="475" y="258" text-anchor="middle" font-size="15" font-weight="800" fill="#dc2626" >رجفان بطيني (VF)</text><path d="M350 304 l10 -20 l8 34 l8 -40 l10 44 l8 -30 l10 30 l8 -44 l10 40 l8 -26 l10 30 l8 -32 l10 28 l8 -20 l10 14 l8 -10 l8 8" stroke="#0f172a" stroke-width="2.2" fill="none"/><text x="475" y="332" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >يوقف القلب: إنعاش فوري وصدمة</text>
