<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 346" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="346" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">فرط الدرقية مقابل قصورها (مراجعة)</text><rect x="20" y="46" width="600" height="30" rx="8" fill="#1e3a8a"/><text x="575.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">البند</text><text x="402.5" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">فرط (جريفز)</text><text x="147.5" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">قصور (هاشيموتو)</text><rect x="20" y="76" width="600" height="48" fill="#e0e7ff"/><text x="575.0" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">السبب</text><text x="402.5" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">يود زائد، أدوية درقية زائدة، جريفز</text><text x="402.5" y="114" text-anchor="middle" font-size="12.5"  fill="#0f172a">مناعي</text><text x="147.5" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">نقص يود، علاج مضاد درقية، ورم نخامية،</text><text x="147.5" y="114" text-anchor="middle" font-size="12.5"  fill="#0f172a">هاشيموتو</text><rect x="20" y="124" width="600" height="30" fill="#fff"/><text x="575.0" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">المخبر</text><text x="402.5" y="144" text-anchor="middle" font-size="12.5"  fill="#0f172a">T3 وT4 مرتفع، TSH منخفض</text><text x="147.5" y="144" text-anchor="middle" font-size="12.5"  fill="#0f172a">T3 وT4 منخفض، TSH مرتفع</text><rect x="20" y="154" width="600" height="66" fill="#e0e7ff"/><text x="575.0" y="174" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">أبرز العلامات</text><text x="402.5" y="174" text-anchor="middle" font-size="12.5"  fill="#0f172a">جحوظ، تضخم (Goiter)، ضغط 180/100+، نبض</text><text x="402.5" y="192" text-anchor="middle" font-size="12.5"  fill="#0f172a">أكثر من 100، خفقان/رجفان أذيني، حرارة</text><text x="402.5" y="210" text-anchor="middle" font-size="12.5"  fill="#0f172a">وتعرق، إسهال</text><text x="147.5" y="174" text-anchor="middle" font-size="12.5"  fill="#0f172a">تعب، زيادة وزن وانتفاخ، إمساك، تساقط</text><text x="147.5" y="192" text-anchor="middle" font-size="12.5"  fill="#0f172a">شعر، نسيان، اكتئاب، جفاف الجلد، ضعف</text><text x="147.5" y="210" text-anchor="middle" font-size="12.5"  fill="#0f172a">رغبة</text><rect x="20" y="220" width="600" height="48" fill="#fff"/><text x="575.0" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">الطارئ</text><text x="402.5" y="240" text-anchor="middle" font-size="12.5"  fill="#0f172a">عاصفة درقية: هياج وارتباك + أزمة ضغط</text><text x="147.5" y="240" text-anchor="middle" font-size="12.5"  fill="#0f172a">غيبوبة وذمة مخاطية: تنفس منخفض، ضغط</text><text x="147.5" y="258" text-anchor="middle" font-size="12.5"  fill="#0f172a">ونبض أقل من 60، حرارة منخفضة</text><rect x="20" y="268" width="600" height="66" fill="#e0e7ff"/><text x="575.0" y="288" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">الغذاء</text><text x="402.5" y="288" text-anchor="middle" font-size="12.5"  fill="#0f172a">سعرات 4000–5000/يوم، بروتين</text><text x="402.5" y="306" text-anchor="middle" font-size="12.5"  fill="#0f172a">وكربوهيدرات عالٍ، ألياف قليلة، بلا</text><text x="402.5" y="324" text-anchor="middle" font-size="12.5"  fill="#0f172a">كافيين وتوابل</text><text x="147.5" y="288" text-anchor="middle" font-size="12.5"  fill="#0f172a">سعرات منخفضة، راحة متكررة</text>
</svg>
