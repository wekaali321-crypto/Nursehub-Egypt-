<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="إنزيمات البنكرياس (Pancrelipase)"><rect width="640" height="310" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">إنزيمات البنكرياس (Pancrelipase)</text><text x="320.0" y="54" text-anchor="middle" font-size="12.5" fill="#667085">دليل سريع</text><rect x="326.0" y="68" width="302.0" height="152" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="68" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="82" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الاستعمال والآلية</text><text x="616.0" y="116" text-anchor="start" font-size="12.5" fill="#1d2939">• تعويض الإنزيمات الهاضمة (التليف الكيسي</text><text x="616.0" y="134" text-anchor="start" font-size="12.5" fill="#1d2939">   CF)</text><text x="616.0" y="152" text-anchor="start" font-size="12.5" fill="#1d2939">• الإنزيمات تنتهي بـ -ase</text><text x="616.0" y="170" text-anchor="start" font-size="12.5" fill="#1d2939">• Lipase ← الدهون</text><text x="616.0" y="188" text-anchor="start" font-size="12.5" fill="#1d2939">• Protease ← البروتين</text><text x="616.0" y="206" text-anchor="start" font-size="12.5" fill="#1d2939">• Amylase ← الكربوهيدرات</text><rect x="12.0" y="68" width="302.0" height="98" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="12.0" y="68" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="12.0" y="82" width="302.0" height="14" fill="#a86a00"/><text x="163.0" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التوقيت (نقطة امتحان)</text><text x="302.0" y="116" text-anchor="start" font-size="12.5" fill="#1d2939">• مع كل وجبة ووجبة خفيفة</text><text x="302.0" y="134" text-anchor="start" font-size="12.5" fill="#1d2939">• ليس قبلها ولا بعدها</text><text x="302.0" y="152" text-anchor="start" font-size="12.5" fill="#1d2939">• وإلا لا يعمل الدواء</text><rect x="12.0" y="178" width="302.0" height="98" rx="10" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.2"/><rect x="12.0" y="178" width="302.0" height="28" rx="10" fill="#2e7d4f"/><rect x="12.0" y="192" width="302.0" height="14" fill="#2e7d4f"/><text x="163.0" y="197" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">طريقة الإعطاء</text><text x="302.0" y="226" text-anchor="start" font-size="12.5" fill="#1d2939">• افتح الكبسولة</text><text x="302.0" y="244" text-anchor="start" font-size="12.5" fill="#1d2939">• رشّ المحتوى على طعام</text><text x="302.0" y="262" text-anchor="start" font-size="12.5" fill="#1d2939">• بلا مضغ للحبيبات</text><rect x="326.0" y="232" width="302.0" height="62" rx="10" fill="#e0f5f3" stroke="#14756c" stroke-width="1.2"/><rect x="326.0" y="232" width="302.0" height="28" rx="10" fill="#14756c"/><rect x="326.0" y="246" width="302.0" height="14" fill="#14756c"/><text x="477.0" y="251" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">النتيجة المتوقعة</text><text x="616.0" y="280" text-anchor="start" font-size="12.5" fill="#1d2939">• نقص البراز الدهني (Steatorrhea)</text></svg>