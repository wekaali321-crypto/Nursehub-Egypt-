<rect x="20" y="44" width="600" height="330" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="250" y="60" width="350" height="40" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="582" cy="80" r="13" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="582" y="85" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="560" y="85" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">إشارة عصبية ← جهد فعل ينبه العضلة</text><text x="425" y="112" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">↓</text><rect x="250" y="110" width="350" height="40" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="582" cy="130" r="13" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="582" y="135" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="560" y="135" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">تحرر أيونات الكالسيوم من الشبكة الساركوبلازمية</text><text x="425" y="162" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">↓</text><rect x="250" y="160" width="350" height="40" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="582" cy="180" r="13" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="582" y="185" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="560" y="185" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">الكالسيوم يرتبط بالتروبونين فيكشف مواقع الأكتين النشطة</text><text x="425" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">↓</text><rect x="250" y="210" width="350" height="40" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="582" cy="230" r="13" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="582" y="235" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="560" y="235" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">الميوسين يرتبط بالأكتين (يحتاج ATP)</text><text x="425" y="262" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">↓</text><rect x="250" y="260" width="350" height="40" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="582" cy="280" r="13" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="582" y="285" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">5</text><text x="560" y="285" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">تحلل ATP: يجرّ الميوسين الأكتين</text><text x="425" y="312" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">↓</text><rect x="250" y="310" width="350" height="40" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="582" cy="330" r="13" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="582" y="335" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">6</text><text x="560" y="335" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">انقباض العضلة (قصر الساركوميير)</text><path d="M40,100 C70,80 100,120 130,100 S190,80 220,100" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M40,112 C70,92 100,132 130,112 S190,92 220,112" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><text x="130" y="70" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">أكتين (رفيع) + تروبوميوسين</text><rect x="40" y="150" width="180" height="14" rx="3" fill="#dc2626" stroke="none" stroke-width="1.5"/><text x="130" y="185" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">ميوسين (سميك) + رأس الجسر</text><path d="M90,150 L110,125" fill="none" stroke="#7f1d1d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><text x="130" y="230" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">قبل: ATP يلتصق ← يتحرر الرأس</text><text x="130" y="252" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">بعد: تحلل ATP ← ضربة القوة</text><defs><marker id="a920" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><line x1="130" y1="265" x2="130" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#a920)"/><rect x="40" y="305" width="180" height="12" rx="3" fill="#dc2626" stroke="none" stroke-width="1.5"/><path d="M20,300 L220,300" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
