<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="640" height="380" rx="16" fill="#f8fafc"/>
<text x="320.0" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">معايير Sgarbossa للجلطة عند وجود LBBB</text>
<rect x="20" y="48" width="190" height="150" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="115.0" y="100.91666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">ارتفاع ST ≥ 1 مم</text>
<text x="115.0" y="118.41666666666667" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7f1d1d">في اشتقاق QRS موجب فيه</text>
<text x="115.0" y="135.91666666666669" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7f1d1d">(توافق Concordant)</text>
<text x="115.0" y="153.41666666666669" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7f1d1d">5 نقاط</text>
<rect x="225" y="48" width="190" height="150" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="320.0" y="100.91666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">هبوط ST ≥ 1 مم</text>
<text x="320.0" y="118.41666666666667" text-anchor="middle" font-size="12.5" font-weight="600" fill="#78350f">في V1 أو V2 أو V3</text>
<text x="320.0" y="135.91666666666669" text-anchor="middle" font-size="12.5" font-weight="600" fill="#78350f">(توافق)</text>
<text x="320.0" y="153.41666666666669" text-anchor="middle" font-size="12.5" font-weight="600" fill="#78350f">3 نقاط</text>
<rect x="430" y="48" width="190" height="150" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="525.0" y="100.91666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">ارتفاع ST ≥ 5 مم</text>
<text x="525.0" y="118.41666666666667" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">في اشتقاق QRS سالب فيه</text>
<text x="525.0" y="135.91666666666669" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">(عكسي مبالغ فيه)</text>
<text x="525.0" y="153.41666666666669" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">2 نقطة</text>
<rect x="120" y="216" width="400" height="56" rx="10" fill="#fff" stroke="#0f172a" stroke-width="1.5"/>
<text x="320.0" y="239.25" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">المجموع 3 نقاط أو أكثر</text>
<text x="320.0" y="257.75" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">⟵ احتمال STEMI بنوعية 90% (حساسية ~36%)</text>
<text x="320" y="300" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">معدّل Smith: بدل 5 مم يُقاس ST ÷ عمق S في نفس الاشتقاق ≥ 0.25 (ربع)</text>
<text x="320" y="322" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">ويُحسب أي معيار واحد إيجابي كافٍ (حساسية أعلى ~ 80–90%)</text>
<text x="320" y="350" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">المعايير بتساعد؛ القرار للطبيب مع الأعراض والتروبونين</text></svg>