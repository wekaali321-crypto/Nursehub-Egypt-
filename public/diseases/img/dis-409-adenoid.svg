<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="320" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">اللحمية عند الأطفال: التوقيت</text>
  <line x1="60" y1="120" x2="580" y2="120" stroke="#64748b" stroke-width="4"/>
  <circle cx="100" cy="120" r="12" fill="#dc2626"/>
  <text x="100" y="95" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">سنة</text>
  <text x="100" y="158" text-anchor="middle" font-size="12" fill="#334155">شديدة: استئصال</text>
  <circle cx="240" cy="120" r="12" fill="#f97316"/>
  <text x="240" y="95" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">٢–٣ سنين</text>
  <text x="240" y="158" text-anchor="middle" font-size="12" fill="#334155">خفيفة–متوسطة: استئصال</text>
  <circle cx="470" cy="120" r="12" fill="#0ea5e9"/>
  <text x="470" y="95" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">٤ سنين</text>
  <text x="470" y="158" text-anchor="middle" font-size="12" fill="#334155">أقصى حد للتأخير</text>
  <rect x="30" y="190" width="580" height="44" rx="10" fill="#fef3c7"/>
  <text x="320" y="216.55" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">شخير + انسداد أنف + تنفس من الفم + نوم قلق ← أشعة جانبية على البلعوم الأنفي</text>
  <rect x="30" y="246" width="580" height="40" rx="10" fill="#fee2e2"/>
  <text x="320" y="270.55" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">التأخير بعد ٤ سنين قد يسبب «وجه اللحمية» (Adenoid facies)</text>
</svg>
