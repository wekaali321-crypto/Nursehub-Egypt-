<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 361" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="361" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">معالم سن المدرسة</text><rect x="326.0" y="50" width="294.0" height="150" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="326.0" y="50" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="473.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">جسدية</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• نمو بطيء ورشيق</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• القوة تتضاعف</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• سقوط الأسنان اللبنية</text><text x="610.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• تغيرات هيكلية</text><text x="610.0" y="164" font-size="12.5" fill="#0f172a" text-anchor="end">• البنات: بداية صفات جنسية ثانوية</text><rect x="20.0" y="50" width="294.0" height="150" rx="10" fill="#fff" stroke="#be185d" stroke-width="2"/><rect x="20.0" y="50" width="294.0" height="28" rx="10" fill="#be185d"/><text x="167.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">نفسية</text><text x="304.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• إحساس بالواجب والإنجاز</text><text x="304.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• يحول طاقة اللعب لإنجاز مهام</text><text x="304.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• تفكير سحري وجلوس قصير</text><text x="304.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• يفهم التناوب ويحب الجماعات والأنشطة</text><text x="304.0" y="164" font-size="12.5" fill="#0f172a" text-anchor="end">الواقعية</text><text x="304.0" y="181" font-size="12.5" fill="#0f172a" text-anchor="end">• قواعد ثابتة واهتمام إيجابي</text><rect x="326.0" y="212" width="294.0" height="133" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="326.0" y="212" width="294.0" height="28" rx="10" fill="#ea580c"/><text x="473.0" y="20" dy="212" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">اجتماعية وانفعالية</text><text x="610.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">• ثقة بالأسرة واستكشاف علاقات خارجها</text><text x="610.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• الأقران مهمون</text><text x="610.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="end">• دافع الإنجاز، النجاح والفشل يؤثران</text><text x="610.0" y="309" font-size="12.5" fill="#0f172a" text-anchor="end">بقوة</text><text x="610.0" y="326" font-size="12.5" fill="#0f172a" text-anchor="end">• فهم مشاعر معقدة وتحكم أكبر</text><rect x="20.0" y="212" width="294.0" height="133" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="20.0" y="212" width="294.0" height="28" rx="10" fill="#7c3aed"/><text x="167.0" y="20" dy="212" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">اللغة والتغذية</text><text x="304.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">• لغة أنضج ونحو</text><text x="304.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• سرد أفضل واستنتاج وتقييم رسائل</text><text x="304.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="end">• طاقة أعلى: كل المجموعات الغذائية</text><text x="304.0" y="309" font-size="12.5" fill="#0f172a" text-anchor="end">• شهية متقلبة طبيعية، حد الدهون وقدم</text><text x="304.0" y="326" font-size="12.5" fill="#0f172a" text-anchor="end">خيارات</text></svg>