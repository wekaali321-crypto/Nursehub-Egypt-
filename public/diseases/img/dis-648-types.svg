<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">أنواع الاسترواح</text>
<rect x="428" y="46" width="192" height="93" rx="12" fill="#dbeafe" stroke="#3b82f6"/><rect x="428" y="46" width="192" height="28" rx="12" fill="#3b82f6"/><text x="524" y="65" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">مفتوح</text><text x="612" y="94" text-anchor="start" font-size="12" fill="#1e3a8a">• جرح نافذ</text><text x="612" y="111" text-anchor="start" font-size="12" fill="#1e3a8a">• ضمادة 3 جوانب</text><rect x="224" y="46" width="192" height="93" rx="12" fill="#dcfce7" stroke="#16a34a"/><rect x="224" y="46" width="192" height="28" rx="12" fill="#16a34a"/><text x="320" y="65" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">مغلق / تلقائي</text><text x="408" y="94" text-anchor="start" font-size="12" fill="#14532d">• رض أو إجراء أو تلقائي</text><text x="408" y="111" text-anchor="start" font-size="12" fill="#14532d">• أنبوب أو مراقبة</text><rect x="20" y="46" width="192" height="93" rx="12" fill="#fef9c3" stroke="#eab308"/><rect x="20" y="46" width="192" height="28" rx="12" fill="#eab308"/><text x="116" y="65" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">توتري</text><text x="204" y="94" text-anchor="start" font-size="12" fill="#422006">• صمام أحادي</text><text x="204" y="111" text-anchor="start" font-size="12" fill="#422006">• انحراف القصبة وهبوط ضغط</text><text x="204" y="128" text-anchor="start" font-size="12" fill="#422006">• إبرة فوراً</text><text x="320" y="167" text-anchor="middle" font-size="12" fill="#475569">التوتري تشخيصه سريري، لا تنتظر الأشعة</text>
