<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 267" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="267" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الدم والهواء والتوتر في الجنب</text><rect x="484" y="50" width="140" height="32" fill="#2563eb"/><text x="554" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الحالة</text><rect x="250" y="50" width="234" height="32" fill="#2563eb"/><text x="367" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المحتوى</text><rect x="16" y="50" width="234" height="32" fill="#2563eb"/><text x="133" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">أبرز العلامات</text><rect x="484" y="82" width="140" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="102" text-anchor="end" font-size="13" fill="#0f172a">Hemothorax</text><rect x="250" y="82" width="234" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="476" y="102" text-anchor="end" font-size="13" fill="#0f172a">دم في الحيز الجنبي (hemo = دم)</text><text x="476" y="121" text-anchor="end" font-size="13" fill="#0f172a">فتنهار الرئة</text><rect x="16" y="82" width="234" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="242" y="102" text-anchor="end" font-size="13" fill="#0f172a">كتامة عند القرع (Dull) وسائل في</text><text x="242" y="121" text-anchor="end" font-size="13" fill="#0f172a">الرئة</text><rect x="484" y="132" width="140" height="50" fill="#dbeafe" stroke="#cbd5e1"/><text x="616" y="152" text-anchor="end" font-size="13" fill="#0f172a">Pneumothorax</text><rect x="250" y="132" width="234" height="50" fill="#dbeafe" stroke="#cbd5e1"/><text x="476" y="152" text-anchor="end" font-size="13" fill="#0f172a">هواء في الحيز الجنبي فتنهار</text><text x="476" y="171" text-anchor="end" font-size="13" fill="#0f172a">الرئة</text><rect x="16" y="132" width="234" height="50" fill="#dbeafe" stroke="#cbd5e1"/><text x="242" y="152" text-anchor="end" font-size="13" fill="#0f172a">رنين مفرط Hyperresonance (كالطبل</text><text x="242" y="171" text-anchor="end" font-size="13" fill="#0f172a">المجوف) وهواء عالٍ</text><rect x="484" y="182" width="140" height="69" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="202" text-anchor="end" font-size="13" fill="#0f172a">Tension</text><text x="616" y="221" text-anchor="end" font-size="13" fill="#0f172a">pneumothorax</text><rect x="250" y="182" width="234" height="69" fill="#ffffff" stroke="#cbd5e1"/><text x="476" y="202" text-anchor="end" font-size="13" fill="#0f172a">قد تنتج من استرواح مفتوح (جرح</text><text x="476" y="221" text-anchor="end" font-size="13" fill="#0f172a">ماص) يدخل الهواء ولا يخرج</text><rect x="16" y="182" width="234" height="69" fill="#ffffff" stroke="#cbd5e1"/><text x="242" y="202" text-anchor="end" font-size="13" fill="#0f172a">انحراف القصبة الهوائية Tracheal</text><text x="242" y="221" text-anchor="end" font-size="13" fill="#0f172a">deviation، ضيق نفس، تسرع قلب</text><text x="242" y="240" text-anchor="end" font-size="13" fill="#0f172a">وتنفس</text></svg>