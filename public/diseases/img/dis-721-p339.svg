<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 479" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="479" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تليف الكبد (3): التدخلات والتمريض والأدوية</text><rect x="330" y="52" width="300" height="111.6" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">البزل (Paracentesis)</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أفرغ المثانة أولًا (نقطة امتحان)</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• العلامات الحيوية</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قياس محيط البطن والوزن</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• رأس السرير مرتفع (Fowler العالي)</text><rect x="10" y="52" width="310" height="111.6" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#16a34a"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الألبومين الوريدي</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قد يرفع الضغط وتصبح النبضات مرتفعة قوية</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قيّم العلامات الحيوية</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• يجب أن تبقى ضمن الحدود الطبيعية = فعالية</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الألبومين</text><rect x="330" y="171.6" width="300" height="111.6" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M330,181.6 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#7c3aed"/><text x="480.0" y="190.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الحكة (Pruritus)</text><text x="620" y="214.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• كمادات رطبة باردة</text><text x="620" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• كريم مرطب على جلد سليم</text><text x="620" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ملابس طويلة وقفازات قطنية</text><text x="620" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قصّ الأظافر</text><rect x="10" y="171.6" width="310" height="163.79999999999998" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,181.6 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="190.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الخزعة والغذاء</text><text x="310" y="214.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• بعد خزعة الكبد: استلقِ على الجانب الأيمن</text><text x="310" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  لمنع النزف</text><text x="310" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• بروتين منخفض = أمونيا أقل</text><text x="310" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• صوديوم وسوائل منخفضة = استسقاء أقل</text><text x="310" y="284.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ممنوع الكحول</text><text x="310" y="301.59999999999997" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• العناية بالفم قبل الوجبات تمنع سوء</text><text x="310" y="318.99999999999994" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  التغذية</text><rect x="330" y="343.4" width="300" height="94.19999999999999" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M330,353.4 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#dc2626"/><text x="480.0" y="362.4" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">خطر النزف</text><text x="620" y="386.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• فرشاة أسنان ناعمة</text><text x="620" y="403.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ماكينة حلاقة كهربائية</text><text x="620" y="421.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• راقب الدم في البراز</text><rect x="10" y="343.4" width="310" height="111.6" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M10,353.4 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#16a34a"/><text x="165.0" y="362.4" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأدوية</text><text x="310" y="386.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• نيومايسين (Neomycin)</text><text x="310" y="403.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• لاكتولوز: يُفقد الأمونيا عبر الأمعاء،</text><text x="310" y="421.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  براز لين، ويفقد البوتاسيوم</text><text x="310" y="438.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• راقب نقص البوتاسيوم (سؤال Kaplan)</text></svg>