<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 346" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="700" height="346" rx="16" fill="#f8fafc"/>
<text x="350.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أمراض النخامية: الفرط والقصور</text>
<rect x="356.0" y="52" width="330.0" height="266.5" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="356.0" y="52" width="330.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="521.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">فرط النخامية (GH زائد)</text>
<text x="676.0" y="96" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• عادة من ورم بالنخامية الأمامية</text>
<text x="676.0" y="114.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• بعد البلوغ: تضخم الأطراف؛ قبله: عملقة (البلوغ</text>
<text x="676.0" y="131.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">8–14 سنة)</text>
<text x="676.0" y="149.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• ضغط مرتفع، طول وأطراف كبيرة، أعضاء متضخمة، ألم</text>
<text x="676.0" y="166.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">مفاصل وعرق وجلد دهني، فك بارز</text>
<text x="676.0" y="184.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• أدوية: NSAIDs للألم، مضادات مستقبلات GH، ناهضات</text>
<text x="676.0" y="201.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">الدوبامين</text>
<text x="676.0" y="219.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• جراحة (خط أول): استئصال النخامية؛ مضاعفاتها:</text>
<text x="676.0" y="236.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">ارتفاع ضغط داخل الجمجمة، التهاب سحايا، قصور نخامي،</text>
<text x="676.0" y="252.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">تسرب CSF</text>
<text x="676.0" y="271.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• بعد الجراحة: مراقبة ICP والعلامات العصبية، رفع</text>
<text x="676.0" y="287.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">الرأس، لا عطس ولا سعال ولا نفخ أنف، وراقب DI (تبول</text>
<text x="676.0" y="304.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">زائد)</text>
<rect x="14.0" y="52" width="330.0" height="266.5" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="14.0" y="52" width="330.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="179.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">قصور النخامية</text>
<text x="334.0" y="96" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• نقص الإفراز بسبب ورم أو إصابة أو سكتة</text>
<text x="334.0" y="114.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• ضغط منخفض ونتاج قلبي منخفض</text>
<text x="334.0" y="133.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• قصر قامة وخمول، قلة الرغبة وعقم</text>
<text x="334.0" y="151.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• سمنة (أيض منخفض)، صداع</text>
<text x="334.0" y="170.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• علاج: ستيرويد (-sone) وليفوثيروكسين وهرمون النمو</text>
</svg>
