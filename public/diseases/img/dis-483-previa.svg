<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 182" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="182" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">المشيمة المنزاحة مقابل الانفصال المشيمي</text><rect x="326.0" y="50" width="294.0" height="116" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="326.0" y="50" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="473.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المشيمة المنزاحة (Previa)</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• نزيف أحمر ساطع بلا ألم</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• لا فحص مهبلي</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• قيصرية قبل الطلق</text><text x="610.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• betamethasone لنضج الرئة</text><rect x="20.0" y="50" width="294.0" height="116" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><rect x="20.0" y="50" width="294.0" height="28" rx="10" fill="#b91c1c"/><text x="167.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الانفصال المشيمي (Abruption)</text><text x="304.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• نزيف داكن مع ألم مستمر شديد</text><text x="304.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• رحم صلب مؤلم</text><text x="304.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• صدمة نزفية</text><text x="304.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• قيصرية طارئة وإنعاش</text></svg>