<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 317" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="317" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">فقدان الشهية العصبي (⁦Anorexia Nervosa⁩): الحالات الشديدة والتمريض</text><rect x="326" y="50" width="294" height="182.875" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M326 60a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#b91c1c"/><text x="473" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">علامات شديدة (⁦6⁩)</text><text x="610" y="96.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="96.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">وزن أقل من ⁦75%⁩ من المتوقع (أقل بـ ⁦25%⁩)</text><text x="610" y="117.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="117.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">خلل سوائل وأملاح: بوتاسيوم أقل من ⁦3.5⁩</text><text x="598" y="135.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">(اضطراب نظم)</text><text x="610" y="156.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="156.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">زغب (⁦Lanugo⁩)</text><text x="610" y="178" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="178" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">انقطاع الطمث</text><text x="610" y="199.125" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="199.125" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">عدم تحمل البرد</text><text x="610" y="220.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="220.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">حرارة وضغط منخفضان، نبض أقل من ⁦60⁩</text><rect x="20" y="50" width="294" height="182.875" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><path d="M20 60a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#15803d"/><text x="167" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">عند التنويم (⁦5⁩)</text><text x="304" y="96.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="96.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">سجل صارم للبروتين والسعرات</text><text x="304" y="117.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="117.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ابقَ مع المريض أثناء كل وجبة وساعة بعدها</text><text x="304" y="138.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="138.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">وزن صباحي قبل الأكل</text><text x="304" y="159.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="159.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ساعده على تحديد المثيرات</text><text x="304" y="181" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="181" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لا رياضة إطلاقاً</text><rect x="20" y="244.875" width="600" height="60" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="320" y="268.875" text-anchor="middle" font-size="12.5" font-weight="700" fill="#713f12">الهدف القصير الأول: زيادة السعرات لرفع الوزن تدريجياً + إشراف فردي أثناء التغذية</text><text x="320" y="290.875" text-anchor="middle" font-size="12" font-weight="400" fill="#713f12">تنويم عند الوزن أقل من ⁦75%⁩ من المثالي أو جفاف شديد أو بوتاسيوم ⁦2.6⁩</text></svg>