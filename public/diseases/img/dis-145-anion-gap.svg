<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 368" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="368" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >الفجوة الأنيونية (Anion Gap): الفرق بين الشحنات المقاسة</text><rect x="60" y="60" width="150" height="200" rx="10" fill="#bfdbfe"/><text x="135" y="90" text-anchor="middle" font-size="15" font-weight="800" fill="#1e3a8a" >Na⁺ + K⁺</text><text x="135" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a" >الكاتيونات</text><rect x="240" y="60" width="150" height="110" rx="10" fill="#fde68a"/><text x="315" y="92" text-anchor="middle" font-size="15" font-weight="800" fill="#78350f" >Cl⁻ + HCO₃⁻</text><text x="315" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f" >المقاسة</text><rect x="240" y="170" width="150" height="90" rx="10" fill="#fecaca"/><text x="315" y="205" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d" >الفجوة</text><text x="315" y="228" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d" >أنيونات غير مقاسة</text><rect x="60" y="280" width="560" height="70" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="340" y="303" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" direction="ltr">AG = (Na + K) − (Cl + HCO₃) = 10–18 mmol/L</text><text x="340" y="330" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155" >أنيونات غير مقاسة: فوسفات، كبريتات، بروتينات سالبة الشحنة (ألبومين)</text><rect x="430" y="60" width="190" height="200" rx="10" fill="#fee2e2"/><text x="525" y="90" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d" >أكبر من 18 = ارتفاع</text><text x="525" y="114" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d" >أنيونات مضافة</text><text x="525" y="150" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a" >لاكتات • أجسام كيتونية</text><text x="525" y="172" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a" >ساليسيلات • فشل كلوي نهائي</text><text x="525" y="194" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a" >ميثانول • (إيثيلين جليكول)</text>
</svg>
