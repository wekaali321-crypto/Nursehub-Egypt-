<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 326" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="326" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">قراءة ABG في 4 خطوات</text>
<rect x="30" y="44" width="580" height="47" rx="10" fill="#dbeafe" stroke="#3b82f6"/><text x="320" y="65" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">1) pH</text><text x="320" y="83" text-anchor="middle" font-size="12" fill="#1e3a8a">أقل من 7.35 حماض • أكثر من 7.45 قلاء</text><path d="M320 93 L320 107 M313 101 L320 108 L327 101" stroke="#64748b" stroke-width="2" fill="none"/><rect x="30" y="111" width="580" height="47" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="320" y="132" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">2) PaCO₂</text><text x="320" y="150" text-anchor="middle" font-size="12" fill="#7f1d1d">مرتفع (&gt;45) = السبب تنفسي</text><path d="M320 160 L320 174 M313 168 L320 175 L327 168" stroke="#64748b" stroke-width="2" fill="none"/><rect x="30" y="178" width="580" height="47" rx="10" fill="#fef9c3" stroke="#eab308"/><text x="320" y="199" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">3) HCO₃</text><text x="320" y="217" text-anchor="middle" font-size="12" fill="#422006">منخفض = السبب أيضي (22–26 طبيعي)</text><path d="M320 227 L320 241 M313 235 L320 242 L327 235" stroke="#64748b" stroke-width="2" fill="none"/><rect x="30" y="245" width="580" height="47" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="320" y="266" text-anchor="middle" font-size="14" font-weight="800" fill="#14532d">4) هل في تعويض؟</text><text x="320" y="284" text-anchor="middle" font-size="12" fill="#14532d">pH قريب من الطبيعي مع HCO₃ مرتفع = مزمن معوّض</text><text x="320" y="314" text-anchor="middle" font-size="12" fill="#475569">حماض تنفسي: pH↓ + CO₂↑</text>
</svg>
