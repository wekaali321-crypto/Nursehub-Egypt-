<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="320" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الجنف (Scoliosis): ما يُعرف وما يُعلَّم</text><rect x="330" y="50" width="290" height="80" rx="10" fill="#6366f1"/><text x="475.0" y="66.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الوصف</text><text x="475.0" y="84.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">انحناء جانبي بشكل حرف S للعمود</text><text x="475.0" y="102.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">يُلاحظ في فترات النمو السريع</text><text x="475.0" y="120.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">أكثر عند الإناث المراهقات 10-12 سنة</text><rect x="20" y="50" width="300" height="80" rx="10" fill="#f59e0b"/><text x="170.0" y="66.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">الأعراض والتشخيص</text><text x="170.0" y="84.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">ألم وتيبس بالظهر</text><text x="170.0" y="102.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">وفي الحالات الشديدة تشوه بالقفص الصدري</text><text x="170.0" y="120.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">قياس زاوية كوب (Cobb) + أشعة</text><rect x="20" y="145" width="600" height="160" rx="10" fill="#16a34a"/><text x="320.0" y="190.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التمريض والتثقيف</text><text x="320.0" y="209.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">تواصل اجتماعي: تشجيعه على زيارة الأصدقاء</text><text x="320.0" y="228.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">دعامة بوسطن (Boston brace) للتصحيح</text><text x="320.0" y="247.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">يلبس قميصًا قطنيًا تحت الدعامة دائمًا</text><text x="320.0" y="266.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">يلبس الدعامة نحو 23 ساعة يوميًا ويخلعها ساعة واحدة للاستحمام فقط</text></svg>