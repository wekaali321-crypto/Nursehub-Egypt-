<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 375" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="375" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الرتوج: Diverticulosis مقابل Diverticulitis</text>
<rect x="346.0" y="52" width="320.0" height="132.25" rx="10" fill="#0e7490" fill-opacity="0.1" stroke="#0e7490" stroke-width="1.2"/>
<rect x="346.0" y="52" width="320.0" height="26" rx="10" fill="#0e7490" fill-opacity="1" stroke="#0e7490" stroke-width="1.2"/>
<text x="506.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">التعريف</text>
<text x="656.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• Diverticulosis: جيوب صغيرة في جدار القولون</text>
<text x="656.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">بسبب غذاء قليل الألياف (إمساك وزيادة ضغط)</text>
<text x="656.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• Diverticulitis: التهاب هذه الجيوب مع عدوى</text>
<text x="656.0" y="149.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">وتورم</text>
<rect x="14.0" y="52" width="320.0" height="132.25" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="14.0" y="52" width="320.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="174.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأسباب والأعراض</text>
<text x="324.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قلة الألياف (إمساك)، والفشار والبذور</text>
<text x="324.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">والمكسرات (حسب المرجع)</text>
<text x="324.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• حمى وقشعريرة وألم الربع السفلي الأيسر</text>
<text x="324.0" y="149.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">(النازل والسيني)</text>
<text x="324.0" y="169.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• المعمل: انخفاض H/H وارتفاع WBC</text>
<rect x="346.0" y="196.25" width="320.0" height="151.5" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="346.0" y="196.25" width="320.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="506.0" y="214.25" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">المضاعفات</text>
<text x="656.0" y="240.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• التهاب بريتوان: ألم بطني منتشر (يبدأ أسفل اليسار) وبطن صلب</text>
<text x="656.0" y="257.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">كاللوح (أبلغ فوراً)</text>
<text x="656.0" y="276.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ممنوع: حقنة الباريوم وتنظير القولون لأنها</text>
<text x="656.0" y="294.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">ترفع الضغط</text>
<rect x="14.0" y="196.25" width="320.0" height="151.5" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="14.0" y="196.25" width="320.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="174.0" y="214.25" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">التمريض والحمية</text>
<text x="324.0" y="240.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تجنب الإمساك والشد</text>
<text x="324.0" y="259.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• صيام NPO ومسكنات (مورفين/هيدرومورفون) وسوائل</text>
<text x="324.0" y="276.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">وريدية 0.9%</text>
<text x="324.0" y="296.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أثناء النوبة: NPO ثم سوائل صافية (جيلي، مرق،</text>
<text x="324.0" y="313.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">عصير) ثم قليل الألياف ثم عالي الألياف</text>
<text x="324.0" y="332.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• Diverticulosis: ألياف عالية وتجنب الإمساك</text>
</svg>
