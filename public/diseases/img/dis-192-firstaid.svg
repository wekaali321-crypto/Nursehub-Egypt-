<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 327" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="327" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">أول 15 دقيقة بعد عضة الحيوان</text><g text-anchor="middle"><rect x="80" y="46" width="480" height="57" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="320" y="68" font-size="14" font-weight="800" fill="#7f1d1d">اغسل الجرح بالماء والصابون 15 دقيقة</text><text x="320" y="86" font-size="12" font-weight="600" fill="#7f1d1d">أو أكسجين/كحول بعدها (حسب المصدر)</text><path d="M320 103 V119" stroke="#64748b" stroke-width="3"/><path d="M314 113 L320 120 L326 113" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="121" width="480" height="57" rx="10" fill="#fef9c3" stroke="#eab308"/><text x="320" y="143" font-size="14" font-weight="800" fill="#422006">لا تخيّط الجرح</text><text x="320" y="161" font-size="12" font-weight="600" fill="#422006">واستمر في التنظيف</text><path d="M320 178 V194" stroke="#64748b" stroke-width="3"/><path d="M314 188 L320 195 L326 188" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="196" width="480" height="40" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="320" y="218" font-size="14" font-weight="800" fill="#1e3a8a">اذهب لمركز الطوارئ/السعار فوراً</text><path d="M320 236 V252" stroke="#64748b" stroke-width="3"/><path d="M314 246 L320 253 L326 246" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="254" width="480" height="57" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="320" y="276" font-size="14" font-weight="800" fill="#14532d">تطعيم + جلوبيولين (حسب التعرّض)</text><text x="320" y="294" font-size="12" font-weight="600" fill="#14532d">لا تؤجّل</text></g></svg>