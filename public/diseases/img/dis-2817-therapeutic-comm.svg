<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="396" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">التواصل العلاجي: افعل ولا تفعل</text><rect x="326" y="48" width="294" height="179.875" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><path d="M326 58a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#15803d"/><text x="473" y="69" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">ابنِ الثقة</text><text x="610" y="94.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="94.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">اسأل أسئلة مفتوحة تتطلب إجابة معمقة</text><text x="610" y="115.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="115.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">اسأل عن المشاعر: «ماذا تشعر الآن؟»</text><text x="610" y="136.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="136.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">قرر حقائق: «تبدو غاضباً، والغضب شعور طبيعي</text><text x="598" y="154.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">مع الفقد»</text><text x="610" y="176" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="176" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أعد الصياغة (⁦Restating⁩) وعكس المشاعر</text><text x="598" y="194.125" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">⁦(Reflecting)⁩</text><text x="610" y="215.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="215.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">اقترح مصادر واستراتيجيات</text><rect x="20" y="48" width="294" height="179.875" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M20 58a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#b91c1c"/><text x="167" y="69" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">تجنب (⁦Non-therapeutic⁩)</text><text x="304" y="94.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="292" y="94.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">إبداء الرأي أو النصيحة أو خبرتك الشخصية</text><text x="304" y="115.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="292" y="115.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">التقليل من مشاعر المريض</text><text x="304" y="136.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="292" y="136.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">التطمين الكاذب: «كل شيء سيكون بخير»</text><text x="304" y="157.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="292" y="157.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">سؤال «لماذا؟» (⁦Why⁩)</text><text x="304" y="179" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="292" y="179" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ترك الغرفة وتجنب الموضوع</text><rect x="329.6774193548387" y="239.875" width="290.3225806451613" height="28.675" fill="#0e7490" stroke="#cbd5e1"/><text x="474.8387096774194" y="256.375" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">موقف</text><rect x="20" y="239.875" width="309.6774193548387" height="28.675" fill="#0e7490" stroke="#cbd5e1"/><text x="174.83870967741936" y="256.375" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">استجابة علاجية</text><rect x="329.6774193548387" y="268.55" width="290.3225806451613" height="28.675" fill="#f8fafc" stroke="#cbd5e1"/><text x="474.8387096774194" y="285.05" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">زوجة المتوفى بسرطان</text><rect x="20" y="268.55" width="309.6774193548387" height="28.675" fill="#f8fafc" stroke="#cbd5e1"/><text x="174.83870967741936" y="285.05" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">«أعلم أنها فترة صعبة. أخبرني كيف تتعامل مع هذا الفقد»</text><rect x="329.6774193548387" y="297.225" width="290.3225806451613" height="28.675" fill="#fff" stroke="#cbd5e1"/><text x="474.8387096774194" y="313.725" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">«لماذا لا ينتهي هذا؟» (قصور قلب)</text><rect x="20" y="297.225" width="309.6774193548387" height="28.675" fill="#fff" stroke="#cbd5e1"/><text x="174.83870967741936" y="313.725" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">«هذا صعب. أخبرني بمشاعرك»</text><rect x="329.6774193548387" y="325.90000000000003" width="290.3225806451613" height="28.675" fill="#f8fafc" stroke="#cbd5e1"/><text x="474.8387096774194" y="342.40000000000003" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">يبكي ويصرخ «اذهب»</text><rect x="20" y="325.90000000000003" width="309.6774193548387" height="28.675" fill="#f8fafc" stroke="#cbd5e1"/><text x="174.83870967741936" y="342.40000000000003" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">«يبدو أنك تتألم؛ سأبقى معك قليلاً»</text><rect x="329.6774193548387" y="354.57500000000005" width="290.3225806451613" height="28.675" fill="#fff" stroke="#cbd5e1"/><text x="474.8387096774194" y="371.07500000000005" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">زوج عاطل وخائف من الإيجار</text><rect x="20" y="354.57500000000005" width="309.6774193548387" height="28.675" fill="#fff" stroke="#cbd5e1"/><text x="174.83870967741936" y="371.07500000000005" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">«أنت قلق من ألا تتمكن من دفع الإيجار؟»</text></svg>