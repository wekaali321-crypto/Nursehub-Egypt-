 fill="#0f172a">الغدد اللعابية</text><line x1="300" y1="98" x2="169" y2="96" stroke="#64748b" stroke-width="1"/><text x="165" y="100" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">الأسنان واللسان</text><line x1="322" y1="150" x2="471" y2="146" stroke="#64748b" stroke-width="1"/><text x="475" y="150" text-anchor="end" font-size="12" font-weight="600" fill="#0f172a">لسان المزمار (Epiglottis)</text><line x1="320" y1="200" x2="169" y2="196" stroke="#64748b" stroke-width="1"/><text x="165" y="200" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">المريء (Esophagus)</text><line x1="232" y1="262" x2="169" y2="251" stroke="#64748b" stroke-width="1"/><text x="165" y="255" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">الكبد (Liver)</text><line x1="268" y1="300" x2="169" y2="301" stroke="#64748b" stroke-width="1"/><text x="165" y="305" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">المرارة (Gallbladder)</text><line x1="385" y1="280" x2="471" y2="276" stroke="#64748b" stroke-width="1"/><text x="475" y="280" text-anchor="end" font-size="12" font-weight="600" fill="#0f172a">المعدة (Stomach)</text><line x1="372" y1="313" x2="471" y2="326" stroke="#64748b" stroke-width="1"/><text x="475" y="330" text-anchor="end" font-size="12" font-weight="600" fill="#0f172a">البنكرياس (Pancreas)</text><line x1="300" y1="352" x2="169" y2="351" stroke="#64748b" stroke-width="1"/><text x="165" y="355" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">الاثنا عشري (Duodenum)</text><line x1="305" y1="395" x2="169" y2="416" stroke="#64748b" stroke-width="1"/><text x="165" y="420" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">اللفائفي (Ileum)</text><line x1="385" y1="400" x2="471" y2="391" stroke="#64748b" stroke-width="1"/><text x="475" y="395" text-anchor="end" font-size="12" font-weight="600" fill="#0f172a">القولون العرضي والنازل</text><line x1="262" y1="470" x2="471" y2="466" stroke="#64748b" stroke-width="1"/><text x="475" y="470" text-anchor="end" font-size="12" font-weight="600" fill="#0f172a">الأعور (Cecum)</text><line x1="255" y1="420" x2="169" y2="451" stroke="#64748b" stroke-width="1"/><text x="165" y="455" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">القولون الصاعد</text><line x1="255" y1="490" x2="169" y2="501" stroke="#64748b" stroke-width="1"/><text x="165" y="505" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">الزائدة الدودية (Appendix)</text><line x1="335" y1="520" x2="471" y2="521" stroke="#64748b" stroke-width="1"/><text x="475" y="525" text-anchor="end" font-size="12" font-weight="600" fill="#0f172a">المستقيم والشرج</text><rect x="20" y="574" width="600" height="70" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="320" y="598" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">القناة الهضمية: الفم ← المريء ← المعدة ← الأمعاء الدقيقة ← الغليظة ← الشرج</text><text x="320" y="624" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">الأعضاء الملحقة: الغدد اللعابية، المرارة، البنكرياس، الكبد</text>
