<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 216" width="640" height="216" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="Carbamazepine مقابل Valproic acid"><rect width="640" height="216" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">Carbamazepine مقابل Valproic acid</text><rect x="10" y="48" width="620" height="28" rx="6" fill="#2b6a9e"/><text x="578.3333333333334" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff"></text><text x="397.5" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Carbamazepine</text><text x="139.16666666666666" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Valproic acid</text><rect x="10" y="76" width="620" height="44" fill="#f4f8fc" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="95" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">الاستعمال</text><text x="519.6666666666666" y="95" text-anchor="start" font-size="12.5"  fill="#1d2939">ثنائي القطب، نوبات صرع، ألم العصب</text><text x="519.6666666666666" y="112" text-anchor="start" font-size="12.5"  fill="#1d2939">الثلاثي التوأمي</text><text x="261.3333333333333" y="95" text-anchor="start" font-size="12.5"  fill="#1d2939">ثنائي القطب (ومضاد صرع)</text><rect x="10" y="120" width="620" height="44" fill="#fff" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="139" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">أخطر</text><text x="519.6666666666666" y="139" text-anchor="start" font-size="12.5"  fill="#1d2939">نقص عدلات (Leukopenia) وخطر عدوى</text><text x="519.6666666666666" y="156" text-anchor="start" font-size="12.5"  fill="#1d2939">كبير: أبلغ عن حمّى/التهاب حلق</text><text x="261.3333333333333" y="139" text-anchor="start" font-size="12.5"  fill="#1d2939">L: Liver سمية الكبد (ALT/AST،</text><text x="261.3333333333333" y="156" text-anchor="start" font-size="12.5"  fill="#1d2939">يرقان). L: Low platelets: نزف كبير</text><rect x="10" y="164" width="620" height="44" fill="#f4f8fc" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="183" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">الحمل/منع</text><text x="623" y="200" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">الحمل</text><text x="519.6666666666666" y="183" text-anchor="start" font-size="12.5"  fill="#1d2939">حمل غير مقصود: أقراص منع الحمل لا</text><text x="519.6666666666666" y="200" text-anchor="start" font-size="12.5"  fill="#1d2939">تعمل؛ استعمل وسيلة بديلة</text><text x="261.3333333333333" y="183" text-anchor="start" font-size="12.5"  fill="#1d2939">غير آمن بالحمل؛ لا توقفه فجأة</text></svg>