<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="342" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أوكسيتوسين: متى توقفه؟</text><rect x="60" y="48" width="520" height="50" rx="10" fill="#fff" stroke="#b45309" stroke-width="2"/><circle cx="580" cy="64" r="14" fill="#b45309"/><text x="580" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="556" y="68" text-anchor="start" font-size="14" font-weight="800" fill="#b45309">قبل البدء</text><text x="570" y="88" text-anchor="start" font-size="13" fill="#0f172a">يُعطى بعد 6–12 ساعة من آخر جرعة dinoprostone</text><path d="M320 100 L320 114 M314 108 L320 115 L326 108" stroke="#64748b" stroke-width="2" fill="none"/><rect x="60" y="118" width="520" height="50" rx="10" fill="#fff" stroke="#b45309" stroke-width="2"/><circle cx="580" cy="134" r="14" fill="#b45309"/><text x="580" y="139" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="556" y="138" text-anchor="start" font-size="14" font-weight="800" fill="#b45309">أثناء التسريب</text><text x="570" y="158" text-anchor="start" font-size="13" fill="#0f172a">مرافقة مستمرة 1:1، وصله piggyback على المحلول الرئيسي</text><path d="M320 170 L320 184 M314 178 L320 185 L326 178" stroke="#64748b" stroke-width="2" fill="none"/><rect x="60" y="188" width="520" height="68" rx="10" fill="#fff" stroke="#b45309" stroke-width="2"/><circle cx="580" cy="204" r="14" fill="#b45309"/><text x="580" y="209" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="556" y="208" text-anchor="start" font-size="14" font-weight="800" fill="#b45309">أوقف</text><text x="570" y="228" text-anchor="start" font-size="13" fill="#0f172a">تقلصات أطول من 60 ثانية أو تباطؤ متأخر (late deceleration) ×3، أو تقلصات</text><text x="570" y="246" text-anchor="start" font-size="13" fill="#0f172a">متواصلة فوق دقيقتين</text><path d="M320 258 L320 272 M314 266 L320 273 L326 266" stroke="#64748b" stroke-width="2" fill="none"/><rect x="60" y="276" width="520" height="50" rx="10" fill="#fff" stroke="#b45309" stroke-width="2"/><circle cx="580" cy="292" r="14" fill="#b45309"/><text x="580" y="297" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="556" y="296" text-anchor="start" font-size="14" font-weight="800" fill="#b45309">اجراءات</text><text x="570" y="316" text-anchor="start" font-size="13" fill="#0f172a">اقلبي الأم على جنبها وأبلغي</text></svg>