<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="322" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">مراحل نشاط الدواء في الجسم</text><rect x="30" y="44" width="580" height="85.5" rx="10" fill="#fff" stroke="#1e3a8a" stroke-width="1.5"/><rect x="540" y="44" width="70" height="85.5" rx="10" fill="#1e3a8a"/><text x="575" y="91.75" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">1</text><text x="525" y="74" text-anchor="start" font-size="12.5" font-weight="500" fill="#0f172a">الطور الدوائي Pharmaceutic: ذوبان الدواء. السوائل والوريدي</text><text x="525" y="90.5" text-anchor="start" font-size="12.5" font-weight="500" fill="#0f172a">جاهزة للامتصاص؛ الأقراص تحتاج تذوب؛ المغلّفة معويًا تذوب في</text><text x="525" y="107" text-anchor="start" font-size="12.5" font-weight="500" fill="#0f172a">قلوية الأمعاء الدقيقة.</text><path d="M320 131.5v14m-6 -6l6 7l6 -7" stroke="#64748b" stroke-width="2" fill="none"/><rect x="30" y="149.5" width="580" height="69" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><rect x="540" y="149.5" width="70" height="69" rx="10" fill="#0f766e"/><text x="575" y="189" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">2</text><text x="525" y="179.5" text-anchor="start" font-size="12.5" font-weight="500" fill="#0f172a">الطور الحركي Pharmacokinetic: امتصاص ثم توزيع ثم أيض (الكبد</text><text x="525" y="196" text-anchor="start" font-size="12.5" font-weight="500" fill="#0f172a">غالبًا) ثم إخراج (الكلى غالبًا).</text><path d="M320 220.5v14m-6 -6l6 7l6 -7" stroke="#64748b" stroke-width="2" fill="none"/><rect x="30" y="238.5" width="580" height="69" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.5"/><rect x="540" y="238.5" width="70" height="69" rx="10" fill="#b45309"/><text x="575" y="278" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">