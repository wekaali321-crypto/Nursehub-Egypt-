<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="270" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ثالوث الصمة الدهنية بعد كسور العظام الطويلة</text>
<rect x="20" y="50" width="190" height="110" rx="10" fill="#b91c1c"/>
<text x="115.0" y="89.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">تنفس</text>
<text x="115.0" y="109.33333333333333" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">ضيق نفس وألم صدر</text>
<text x="115.0" y="129.33333333333331" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">SpO2 منخفض</text>
<rect x="225" y="50" width="190" height="110" rx="10" fill="#7c3aed"/>
<text x="320.0" y="89.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">عصبي</text>
<text x="320.0" y="109.33333333333333" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">ارتباك وقلق</text>
<text x="320.0" y="129.33333333333331" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">نعاس وتغير وعي</text>
<rect x="430" y="50" width="190" height="110" rx="10" fill="#0369a1"/>
<text x="525.0" y="89.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">جلد</text>
<text x="525.0" y="109.33333333333333" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">نمش نزفي (Petechiae)</text>
<text x="525.0" y="129.33333333333331" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">الصدر والرقبة والإبط</text>
<rect x="20" y="180" width="600" height="56" rx="10" fill="#0f766e"/>
<text x="320.0" y="212.66666666666666" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الوقاية الأهم: تثبيت الكسر وتقليل تحريكه (Immobilization)</text>
<text x="320" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">تظهر غالبًا خلال 24–72 ساعة من كسر الفخذ أو الحوض</text>
</svg>
