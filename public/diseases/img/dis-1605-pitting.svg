f" stroke="#eab308" stroke-width="1.3"/><text x="366" y="185" text-anchor="start" font-size="13" font-weight="800" fill="#0f172a" >3–4 مم</text><text x="366" y="203" text-anchor="start" font-size="11.5" font-weight="600" fill="#475569" >متوسط، يرتد خلال 15 ثانية</text><rect x="480" y="170" width="110" height="36" rx="10" fill="#fde8e0" stroke="#f1b8a8" stroke-width="1.5"/><rect x="500" y="170" width="0" height="0" rx="10" fill="#fff"/><path d="M510,172 q20,12 40,0" stroke="#b91c1c" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="550" cy="188" rx="14" ry="8.0" fill="#f1b8a8" stroke="#b91c1c" stroke-width="1"/><rect x="14" y="222" width="60" height="48" rx="8" fill="#f97316"/><text x="44" y="253" text-anchor="middle" font-size="18" font-weight="800" fill="#fff" direction="ltr">3+</text><rect x="80" y="222" width="300" height="48" rx="8" fill="#fff" stroke="#f97316" stroke-width="1.3"/><text x="366" y="243" text-anchor="start" font-size="13" font-weight="800" fill="#0f172a" >5–6 مم</text><text x="366" y="261" text-anchor="start" font-size="11.5" font-weight="600" fill="#475569" >متوسط إلى شديد، 30 ثانية</text><rect x="480" y="228" width="110" height="36" rx="10" fill="#fde8e0" stroke="#f1b8a8" stroke-width="1.5"/><rect x="500" y="228" width="0" height="0" rx="10" fill="#fff"/><path d="M510,230 q20,16 40,0" stroke="#b91c1c" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="550" cy="246" rx="17" ry="10.5" fill="#f1b8a8" stroke="#b91c1c" stroke-width="1"/><rect x="14" y="280" width="60" height="48" rx="8" fill="#dc2626"/><text x="44" y="311" text-anchor="middle" font-size="18" font-weight="800" fill="#fff" direction="ltr">4+</text><rect x="80" y="280" width="300" height="48" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.3"/><text x="366" y="301" text-anchor="start" font-size="13" font-weight="800" fill="#0f172a" >8 مم أو أعمق</text><text x="366" y="319" text-anchor="start" font-siz