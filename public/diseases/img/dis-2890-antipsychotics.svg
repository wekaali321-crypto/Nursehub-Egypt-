<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 398" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="398" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">مضادات الذهان: ⁦NMS⁩ والكلوزابين</text><rect x="326" y="50" width="294" height="176.875" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M326 60a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#b91c1c"/><text x="473" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">متلازمة الخباثة العصبية (⁦NMS⁩)</text><text x="610" y="96.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="96.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">رد فعل مهدد للحياة لمضادات الذهان</text><text x="610" y="117.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="117.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">حمى (⁦Hyperpyrexia⁩) وتغير الحالة العقلية</text><text x="598" y="135.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">وصلابة العضلات وتعرق ودوخة وارتفاع الضغط</text><text x="610" y="156.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="156.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الإجراء: قيّم العلامات الحيوية وأبلغ</text><text x="598" y="175" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الطبيب فوراً</text><text x="610" y="196.125" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="196.125" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ممنوع الاطمئنان: «لا داعي للقلق من الحمى</text><text x="598" y="214.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">وتيبس العضلات» = تعليم خاطئ</text><rect x="20" y="50" width="294" height="176.875" rx="10" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><path d="M20 60a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#6d28d9"/><text x="167" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الكلوزابين (⁦Clozapine⁩)</text><text x="304" y="96.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="96.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الأولوية: تعداد الدم الكامل وتعداد العدلات</text><text x="292" y="114.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">المطلق</text><text x="304" y="135.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="135.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أبلغ عن ⁦WBC 2,900/mm⁩³</text><text x="304" y="156.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="156.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">⁦WBC⁩: أهم تحليل متابعة</text><text x="304" y="178" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="178" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">خطر نقص العدلات</text><rect x="443.52941176470586" y="238.875" width="176.47058823529412" height="29.4" fill="#0e7490" stroke="#cbd5e1"/><text x="531.7647058823529" y="255.875" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الدواء</text><rect x="19.999999999999943" y="238.875" width="423.5294117647059" height="29.4" fill="#0e7490" stroke="#cbd5e1"/><text x="231.7647058823529" y="255.875" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">ملاحظة</text><rect x="443.52941176470586" y="268.275" width="176.47058823529412" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="531.7647058823529" y="285.275" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">⁦Haloperidol (Haldol)⁩</text><rect x="19.999999999999943" y="268.275" width="423.5294117647059" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="231.7647058823529" y="285.275" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">دوخة وخفة رأس وتشنج وتيبس عضلي (أعراض هرمية)</text><rect x="443.52941176470586" y="297.67499999999995" width="176.47058823529412" height="29.4" fill="#fff" stroke="#cbd5e1"/><text x="531.7647058823529" y="314.67499999999995" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">⁦Clozapine⁩</text><rect x="19.999999999999943" y="297.67499999999995" width="423.5294117647059" height="29.4" fill="#fff" stroke="#cbd5e1"/><text x="231.7647058823529" y="314.67499999999995" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">مراقبة العدلات</text><rect x="443.52941176470586" y="327.07499999999993" width="176.47058823529412" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="531.7647058823529" y="344.07499999999993" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">⁦Risperidone⁩</text><rect x="19.999999999999943" y="327.07499999999993" width="423.5294117647059" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="231.7647058823529" y="344.07499999999993" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">مضاد ذهان</text><rect x="443.52941176470586" y="356.4749999999999" width="176.47058823529412" height="29.4" fill="#fff" stroke="#cbd5e1"/><text x="531.7647058823529" y="373.4749999999999" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">⁦Ziprasidone (Geodon)⁩</text><rect x="19.999999999999943" y="356.4749999999999" width="423.5294117647059" height="29.4" fill="#fff" stroke="#cbd5e1"/><text x="231.7647058823529" y="373.4749999999999" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">مضاد ذهان</text></svg>