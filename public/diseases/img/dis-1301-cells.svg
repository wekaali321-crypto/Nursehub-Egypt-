<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">خلايا الدم الثلاث وآلية التجلط</text>
<rect x="20" y="50" width="190" height="120" rx="10" fill="#dc2626"/>
<text x="115.0" y="66.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">كرات الدم الحمراء RBC</text>
<text x="115.0" y="85.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تحمل الأكسجين</text>
<text x="115.0" y="104.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">(الهيموجلوبين)</text>
<text x="115.0" y="123.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">4.2–6.1 مليون/µL تقريبًا</text>
<text x="115.0" y="142.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">يحفّزها الإريثروبويتين</text>
<text x="115.0" y="161.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">EPO</text>
<rect x="225" y="50" width="190" height="120" rx="10" fill="#2563eb"/>
<text x="320.0" y="85.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">كرات الدم البيضاء WBC</text>
<text x="320.0" y="104.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">مناعة ومقاومة عدوى</text>
<text x="320.0" y="123.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">5,000–10,000/µL</text>
<text x="320.0" y="142.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">أقل من 4,000 = قلة بيضاء</text>
<rect x="430" y="50" width="190" height="120" rx="10" fill="#7c3aed"/>
<text x="525.0" y="85.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الصفائح Platelets</text>
<text x="525.0" y="104.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">سدادة أولية توقف النزف</text>
<text x="525.0" y="123.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">150,000–400,000/µL</text>
<text x="525.0" y="142.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">أقل من 50,000 = خطر نزف</text>
<text x="320" y="200" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">خطوات تكوّن الجلطة</text>
<rect x="20" y="215" width="112" height="80" rx="10" fill="#0f766e"/>
<text x="76.0" y="249.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
<text x="76.0" y="268.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تضيّق الوعاء</text>
<rect x="142" y="215" width="112" height="80" rx="10" fill="#0f766e"/>
<text x="198.0" y="249.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
<text x="198.0" y="268.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">سدادة الصفائح</text>
<rect x="264" y="215" width="112" height="80" rx="10" fill="#0f766e"/>
<text x="320.0" y="240.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
<text x="320.0" y="259.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">بروثرومبين</text>
<text x="320.0" y="278.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">← ثرومبين</text>
<rect x="386" y="215" width="112" height="80" rx="10" fill="#0f766e"/>
<text x="442.0" y="240.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
<text x="442.0" y="259.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">فيبرينوجين</text>
<text x="442.0" y="278.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">← شبكة فيبرين</text>
<rect x="508" y="215" width="112" height="80" rx="10" fill="#0f766e"/>
<text x="564.0" y="230.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text>
<text x="564.0" y="249.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">انكماش ثم</text>
<text x="564.0" y="268.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تحلل</text>
<text x="564.0" y="287.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">بالبلازمين</text>
</svg>
