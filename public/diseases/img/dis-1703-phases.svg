<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">المرحلة الأولى: ثلاثة أطوار حتى اتساع 10 سم</text><rect x="20" y="55" width="190" height="150" rx="12" fill="#bae6fd"/><text x="115" y="82" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">كامن (مبكر)</text><text x="115" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">اتساع 0–3 سم</text><text x="115" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">محو 0–30%</text><text x="115" y="154" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">انقباضات خفيفة كل 5–30 د</text><text x="115" y="176" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">تستغرق نحو 30 ثانية</text><rect x="225" y="55" width="190" height="150" rx="12" fill="#fde68a"/><text x="320" y="82" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">نشط</text><text x="320" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">اتساع 4–7 سم</text><text x="320" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">محو حتى 100%</text><text x="320" y="154" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">انقباضات أقوى وأطول</text><text x="320" y="176" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">تنفس وإدارة ألم، التخدير</text><rect x="430" y="55" width="190" height="150" rx="12" fill="#fecaca"/><text x="525" y="82" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">انتقالي</text><text x="525" y="110" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">اتساع 8–10 سم</text><text x="525" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">محو 100%</text><text x="525" y="154" text-anchor="middle" font-size="11" font-weight="500" fill="#334155">قيء، رغبة بالتبرز، قلق</text><text x="525" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">لا دفع قبل 10 سم</text><text x="320" y="235" text-anchor="middle" font-size="12" font-weight="500" fill="#475569">المحو (Effacement): نسبة ترقق العنق من 0% إلى 100% (رقيق كالورق)</text><text x="320" y="260" text-anchor="middle" font-size="12" font-weight="500" fill="#475569">الاتساع (Dilation): فتحة العنق بالسنتيمتر من 0 إلى 10</text>
</svg>
