<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="320" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ورم ويلمز (Nephroblastoma)</text><rect x="330" y="50" width="290" height="90" rx="10" fill="#6366f1"/><text x="475.0" y="80.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الآلية</text><text x="475.0" y="97.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">أشيع سرطانات الكلى بالأطفال</text><text x="475.0" y="114.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">خلايا الكلية لا تنضج كاملًا ثم تتكاثر</text><rect x="20" y="50" width="300" height="90" rx="10" fill="#f59e0b"/><text x="170.0" y="80.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">العلامات</text><text x="170.0" y="98.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">كتلة بطنية بجانب واحد (بروز)</text><text x="170.0" y="116.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">حمى · إرهاق · دم بالبول</text><rect x="20" y="155" width="300" height="100" rx="10" fill="#dc2626"/><text x="170.0" y="190.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">أهم سلامة</text><text x="170.0" y="208.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لافتة كبيرة: لا تجس البطن</text><text x="170.0" y="226.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">الجس قد يمزق الورم وينشر الخلايا</text><rect x="330" y="155" width="290" height="100" rx="10" fill="#16a34a"/><text x="475.0" y="190.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج</text><text x="475.0" y="208.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">استئصال الكلية (جزئي أو كلي)</text><text x="475.0" y="226.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ثم علاج كيماوي ± إشعاعي</text></svg>