<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 501" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="501" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">العقم: الأسباب والإباضة والتواصل</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="232.79999999999998" rx="10" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#ec4899"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">أسباب أنثوية</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• عمر أكثر من 35</text><text x="612" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• تليف كيسي</text><text x="612" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• انتباذ بطاني</text><text x="612" y="168.6" text-anchor="start" font-size="13" fill="#0f172a">• المبيض: دورات بلا</text><text x="612" y="186.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">إباضة، تكيس المبايض</text><text x="612" y="210" text-anchor="start" font-size="13" fill="#0f172a">• عدوى منقولة جنسيًا</text><text x="612" y="228.2" text-anchor="start" font-size="13" fill="#0f172a">طويلة غير معالجة:</text><text x="612" y="246.4" text-anchor="start" font-size="13" fill="#0f172a">كلاميديا وسيلان</text><text x="612" y="269.6" text-anchor="start" font-size="13" fill="#0f172a">• التهاب الحوض PID</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="232.79999999999998" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#0ea5e9"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">أسباب ذكرية</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• قلة النطاف</text><text x="408.66666666666663" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• ضعف الانتصاب</text><rect x="20" y="54" width="193.33333333333334" height="232.79999999999998" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">علاج وإجراءات</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• clomiphene: الجماع بعد</text><text x="205.33333333333334" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">5 أيام من إكمال الدواء،</text><text x="205.33333333333334" y="135.4" text-anchor="start" font-size="13" fill="#0f172a">لأنه يعالج خلل الإباضة</text><text x="205.33333333333334" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">• IVF: لانسداد القناتين</text><text x="205.33333333333334" y="176.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">أو قلة النطاف؛ يتكوّن</text><text x="205.33333333333334" y="195" text-anchor="start" font-size="13" fill="#0f172a">الجنين خارج الجسم ثم</text><text x="205.33333333333334" y="213.2" text-anchor="start" font-size="13" fill="#0f172a">يُزرع بالرحم</text><g transform="translate(0 296.79999999999995)"><text x="60" y="18" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">جريب أولي</text><text x="146" y="18" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">جريب ثانوي</text><text x="232" y="18" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">جريب حويصلي</text><text x="318" y="18" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0f172a">إباضة</text><text x="404" y="18" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">جسم أصفر</text><text x="490" y="18" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">تراجع</text><text x="576" y="18" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0f172a">جسم أبيض</text><path d="M40 150 C140 130 190 140 250 115 S300 20 340 15 S380 140 430 150 S560 165 610 150" fill="none" stroke="#ef4444" stroke-width="3"/><path d="M40 160 C140 150 190 150 260 140 S300 100 340 80 S380 150 440 158 S560 168 610 160" fill="none" stroke="#0ea5e9" stroke-width="3"/><line x1="340" y1="28" x2="340" y2="172" stroke="#64748b" stroke-dasharray="4 4"/><text x="334" y="186" text-anchor="end" font-size="11" fill="#0f172a">اليوم 14 تقريبًا: ذروة LH وFSH تسبق الإباضة</text><text x="560" y="45" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ef4444">FSH</text><text x="560" y="120" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0ea5e9">LH</text></g></svg>
