<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="450" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">علاج زيادة البوتاسيوم الحادة (حسب أمر الطبيب)</text><rect x="40" y="48" width="560" height="50" rx="12" fill="#fff" stroke="#dc2626" stroke-width="1.8"/><circle cx="576" cy="73" r="14" fill="#dc2626"/><text x="576" y="78" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="552" y="69" text-anchor="end" font-size="14" font-weight="800" fill="#dc2626">ECG + مونيتور + خط وريدي</text><text x="552" y="87" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">T مدببة؟ QRS عريض؟ نبض بطيء؟ اطلب الطبيب فوراً</text><text x="320" y="114" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="120" width="560" height="66" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.8"/><circle cx="576" cy="153" r="14" fill="#ea580c"/><text x="576" y="158" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="552" y="141" text-anchor="end" font-size="14" font-weight="800" fill="#ea580c">حماية القلب</text><text x="552" y="159" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">Calcium gluconate 10% وريدي ببطء 5–10 دقائق (الجرعة حسب البروتوكول: 10</text><text x="552" y="175" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">مل في بعضها وحتى 30 مل في بروتوكول UKKA) مع ECG. يُكرر لو استمر التغير</text><text x="320" y="202" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="208" width="560" height="66" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><circle cx="576" cy="241" r="14" fill="#2563eb"/><text x="576" y="246" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="552" y="229" text-anchor="end" font-size="14" font-weight="800" fill="#2563eb">إدخال البوتاسيوم للخلايا</text><text x="552" y="247" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">Insulin سريع 10 وحدات + جلوكوز 25 جم (50 مل 50%) خلال 15–30 دقيقة، ±</text><text x="552" y="263" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">Salbutamol 10–20 مجم نيبولايزر، ± Bicarbonate لو حماض</text><text x="320" y="290" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="296" width="560" height="66" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.8"/><circle cx="576" cy="329" r="14" fill="#16a34a"/><text x="576" y="334" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="552" y="317" text-anchor="end" font-size="14" font-weight="800" fill="#16a34a">إخراج البوتاسيوم</text><text x="552" y="335" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">Furosemide (إن كان يبول)، رابطات (Patiromer / SZC / Kayexalate)، غسيل</text><text x="552" y="351" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">كلوي</text><text x="320" y="378" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="384" width="560" height="50" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><circle cx="576" cy="409" r="14" fill="#7c3aed"/><text x="576" y="414" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text><text x="552" y="405" text-anchor="end" font-size="14" font-weight="800" fill="#7c3aed">تابع</text><text x="552" y="423" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">سكر الدم كل ساعة لـ6 ساعات (هبوط)، بوتاسيوم كل 1–2 ساعة، ECG</text></svg>