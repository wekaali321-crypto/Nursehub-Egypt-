<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 288" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="288" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التواصل مع الطفل أثناء الحقن</text><rect x="325" y="48" width="295" height="224" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4 نقاط</text><text x="610" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">لغة بسيطة مناسبة للعمر وقل الحقيقة: "هذا</text><text x="610" y="120" text-anchor="end" font-size="12.5" fill="#1e293b">الدواء يدخل تحت الجلد" و"قد يلسع الجلد</text><text x="610" y="140" text-anchor="end" font-size="12.5" fill="#1e293b">دقائق"</text><text x="610" y="160" text-anchor="end" font-size="12.5" fill="#1e293b">سن المدرسة 6–12: يخافون فقدان السيطرة،</text><text x="610" y="180" text-anchor="end" font-size="12.5" fill="#1e293b">اطلب منهم العدّ بصوت عالٍ</text><text x="610" y="200" text-anchor="end" font-size="12.5" fill="#1e293b">شجّع مقدم الرعاية على حمل الطفل</text><text x="610" y="220" text-anchor="end" font-size="12.5" fill="#1e293b">(حضن/ذراعين)</text><text x="610" y="240" text-anchor="end" font-size="12.5" fill="#1e293b">إخفاء الأدوات مناسب للدارج (1–3 سنين) وغير</text><text x="610" y="260" text-anchor="end" font-size="12.5" fill="#1e293b">مناسب لسن المدرسة</text>
</svg>
