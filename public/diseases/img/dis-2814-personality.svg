<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 364" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="364" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">اضطرابات الشخصية: جدول سريع</text><rect x="522.7027027027027" y="48" width="97.2972972972973" height="27.95" fill="#6d28d9" stroke="#cbd5e1"/><text x="571.3513513513514" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">الاضطراب</text><rect x="247.02702702702703" y="48" width="275.6756756756757" height="27.95" fill="#6d28d9" stroke="#cbd5e1"/><text x="384.8648648648649" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">الخصائص</text><rect x="20" y="48" width="227.02702702702703" height="27.95" fill="#6d28d9" stroke="#cbd5e1"/><text x="133.51351351351352" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">نقطة تمريضية/امتحانية</text><rect x="522.7027027027027" y="75.95" width="97.2972972972973" height="43.9" fill="#f8fafc" stroke="#cbd5e1"/><text x="571.3513513513514" y="91.95" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">نرجسي</text><rect x="247.02702702702703" y="75.95" width="275.6756756756757" height="43.9" fill="#f8fafc" stroke="#cbd5e1"/><text x="384.8648648648649" y="91.95" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">يرى نفسه كاملاً، متعالٍ ومتعجرف، يحتاج الإعجاب</text><text x="384.8648648648649" y="107.9" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">لحفظ تقديره لذاته</text><rect x="20" y="75.95" width="227.02702702702703" height="43.9" fill="#f8fafc" stroke="#cbd5e1"/><text x="133.51351351351352" y="91.95" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">ينقصه التعاطف، شعور بالاستحقاق، استغلال</text><text x="133.51351351351352" y="107.9" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">الآخرين</text><rect x="522.7027027027027" y="119.85" width="97.2972972972973" height="43.9" fill="#fff" stroke="#cbd5e1"/><text x="571.3513513513514" y="135.85" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">بارانويدي</text><rect x="247.02702702702703" y="119.85" width="275.6756756756757" height="43.9" fill="#fff" stroke="#cbd5e1"/><text x="384.8648648648649" y="135.85" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">ارتياب وشك، حاجة شديدة للسيطرة على البيئة</text><rect x="20" y="119.85" width="227.02702702702703" height="43.9" fill="#fff" stroke="#cbd5e1"/><text x="133.51351351351352" y="135.85" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">تحسنه: يناقش قلقه معك. أخبره بحقيقة</text><text x="133.51351351351352" y="151.79999999999998" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">الموقف: «لا يضحكون عليك»</text><rect x="522.7027027027027" y="163.75" width="97.2972972972973" height="43.9" fill="#f8fafc" stroke="#cbd5e1"/><text x="571.3513513513514" y="179.75" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">هستيري</text><rect x="247.02702702702703" y="163.75" width="275.6756756756757" height="43.9" fill="#f8fafc" stroke="#cbd5e1"/><text x="384.8648648648649" y="179.75" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">مركز الاهتمام، عواطف مبالغة وسطحية، قليل التحمل</text><text x="384.8648648648649" y="195.7" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">للإحباط، ودود جداً ومغازل</text><rect x="20" y="163.75" width="227.02702702702703" height="43.9" fill="#f8fafc" stroke="#cbd5e1"/><text x="133.51351351351352" y="179.75" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">قلة البصيرة</text><rect x="522.7027027027027" y="207.65" width="97.2972972972973" height="27.95" fill="#fff" stroke="#cbd5e1"/><text x="571.3513513513514" y="223.65" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">اعتمادي</text><rect x="247.02702702702703" y="207.65" width="275.6756756756757" height="27.95" fill="#fff" stroke="#cbd5e1"/><text x="384.8648648648649" y="223.65" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">اعتماد مفرط وخوف من الانفصال</text><rect x="20" y="207.65" width="227.02702702702703" height="27.95" fill="#fff" stroke="#cbd5e1"/><text x="133.51351351351352" y="223.65" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">تقدمه: «ركبت الحافلة»؛ امدح حزمه</text><rect x="522.7027027027027" y="235.6" width="97.2972972972973" height="59.85" fill="#f8fafc" stroke="#cbd5e1"/><text x="571.3513513513514" y="251.6" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">حدّي</text><text x="571.3513513513514" y="267.55" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">⁦(Borderline)⁩</text><rect x="247.02702702702703" y="235.6" width="275.6756756756757" height="59.85" fill="#f8fafc" stroke="#cbd5e1"/><text x="384.8648648648649" y="251.6" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">خوف من الهجر ومناورة، تعلق بموظف واحد، إيذاء ذات</text><text x="384.8648648648649" y="267.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">لجذب الانتباه</text><rect x="20" y="235.6" width="227.02702702702703" height="59.85" fill="#f8fafc" stroke="#cbd5e1"/><text x="133.51351351351352" y="251.6" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">أولوية: قيّم الإيذاء فوراً، وكّل ممرضاً</text><text x="133.51351351351352" y="267.55" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">مختلفاً كل يوم؛ أعلى خطر انتحار؛</text><text x="133.51351351351352" y="283.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">الانقسام (⁦Splitting⁩)</text><rect x="522.7027027027027" y="295.45" width="97.2972972972973" height="27.95" fill="#fff" stroke="#cbd5e1"/><text x="571.3513513513514" y="311.45" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">معادٍ للمجتمع</text><rect x="247.02702702702703" y="295.45" width="275.6756756756757" height="27.95" fill="#fff" stroke="#cbd5e1"/><text x="384.8648648648649" y="311.45" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">اندفاعي، يتلاعب للمكسب الشخصي، بلا تعاطف</text><rect x="20" y="295.45" width="227.02702702702703" height="27.95" fill="#fff" stroke="#cbd5e1"/><text x="133.51351351351352" y="311.45" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">انعدام الندم؛ واجهه بهدوء بالعواقب</text><rect x="522.7027027027027" y="323.4" width="97.2972972972973" height="27.95" fill="#f8fafc" stroke="#cbd5e1"/><text x="571.3513513513514" y="339.4" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">فصامي النمط</text><rect x="247.02702702702703" y="323.4" width="275.6756756756757" height="27.95" fill="#f8fafc" stroke="#cbd5e1"/><text x="384.8648648648649" y="339.4" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">انسحاب وعزلة، «قوى خاصة» وتفكير سحري</text><rect x="20" y="323.4" width="227.02702702702703" height="27.95" fill="#f8fafc" stroke="#cbd5e1"/><text x="133.51351351351352" y="339.4" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">يظن أن الجميع يقرأ الأفكار</text></svg>