<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 338" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="338" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ديجوكسين للأطفال: ثلاث أولويات</text><rect x="325" y="48" width="295" height="132" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">A — النبض القمي</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">استمع دقيقة كاملة قبل الإعطاء</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">رضيع (0–12 شهر) 100–160/د: أعطِ</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">أقل من 100 للرضيع: احجز وأبلغ</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">طفل أقل من 70/د: احجز وأبلغ</text><rect x="20" y="48" width="295" height="132" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">T — السمية</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">المستوى أعلى من 2.0 نانوجرام/مل</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">قيء وضعف رضاعة</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">أي رضيع بنبض أقل من 90 مع قيء: احجز وأبلغ</text><rect x="325" y="190" width="295" height="132" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="190" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">P — البوتاسيوم</text><text x="610" y="242" text-anchor="start" font-size="12.5" fill="#1e293b">أقل من 3.5 يزيد السمية</text><text x="610" y="262" text-anchor="start" font-size="12.5" fill="#1e293b">تحقق من البوتاسيوم قبل الإعطاء</text><rect x="20" y="190" width="295" height="132" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><rect x="20" y="190" width="295" height="30" rx="12" fill="#9333ea"/><text x="167.5" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">مدرات البول</text><text x="305" y="242" text-anchor="start" font-size="12.5" fill="#1e293b">فوروسيميد وهيدروكلوروثيازيد (يهدران K)</text><text x="305" y="262" text-anchor="start" font-size="12.5" fill="#1e293b">سبيرونولاكتون (يوفّر K)</text><text x="305" y="282" text-anchor="start" font-size="12.5" fill="#1e293b">الطفل يحتاج بوتاسيوم من الغذاء (موز،</text><text x="305" y="302" text-anchor="start" font-size="12.5" fill="#1e293b">برتقال، توت) مع المدرات الهادرة</text>
</svg>
