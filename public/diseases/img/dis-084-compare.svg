<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 364" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="364" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">غيبوبة حقيقية أم وظيفية؟</text>
<rect x="510" y="48" width="110" height="44" fill="#0ea5e9" stroke="#cbd5e1"/><text x="565" y="75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">العلامة</text><rect x="280" y="48" width="230" height="44" fill="#0ea5e9" stroke="#cbd5e1"/><text x="395" y="75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">غيبوبة حقيقية</text><rect x="20" y="48" width="260" height="44" fill="#0ea5e9" stroke="#cbd5e1"/><text x="150" y="75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">غيبوبة وظيفية (هستيرية)</text>
<rect x="510" y="92" width="110" height="44" fill="#fff" stroke="#cbd5e1"/><text x="565" y="119" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">الجفون</text><rect x="280" y="92" width="230" height="44" fill="#fff" stroke="#cbd5e1"/><text x="395" y="119" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">مرتخية، تقفل ببطء</text><rect x="20" y="92" width="260" height="44" fill="#fff" stroke="#cbd5e1"/><text x="150" y="119" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تقاوم الفتح وترمش</text>
<rect x="510" y="136" width="110" height="44" fill="#f1f5f9" stroke="#cbd5e1"/><text x="565" y="163" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">الحدقتان</text><rect x="280" y="136" width="230" height="44" fill="#f1f5f9" stroke="#cbd5e1"/><text x="395" y="163" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">حسب السبب، قد تثبت</text><rect x="20" y="136" width="260" height="44" fill="#f1f5f9" stroke="#cbd5e1"/><text x="150" y="163" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">طبيعيتان وتتفاعل</text>
<rect x="510" y="180" width="110" height="44" fill="#fff" stroke="#cbd5e1"/><text x="565" y="207" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">العلامات الحيوية</text><rect x="280" y="180" width="230" height="44" fill="#fff" stroke="#cbd5e1"/><text x="395" y="207" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">غالباً متغيرة</text><rect x="20" y="180" width="260" height="44" fill="#fff" stroke="#cbd5e1"/><text x="150" y="207" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">طبيعية</text>
<rect x="510" y="224" width="110" height="44" fill="#f1f5f9" stroke="#cbd5e1"/><text x="565" y="251" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">سقوط اليد</text><rect x="280" y="224" width="230" height="44" fill="#f1f5f9" stroke="#cbd5e1"/><text x="395" y="251" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تقع على الوجه</text><rect x="20" y="224" width="260" height="44" fill="#f1f5f9" stroke="#cbd5e1"/><text x="150" y="251" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تنحرف عنه</text>
<rect x="510" y="268" width="110" height="44" fill="#fff" stroke="#cbd5e1"/><text x="565" y="295" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">الاستجابة للتحدث</text><rect x="280" y="268" width="230" height="44" fill="#fff" stroke="#cbd5e1"/><text x="395" y="295" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">لا شيء</text><rect x="20" y="268" width="260" height="44" fill="#fff" stroke="#cbd5e1"/><text x="150" y="295" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">قد يظهر ارتعاش أو تغيير تنفس</text>
<text x="320" y="352" text-anchor="middle" font-size="12.5" fill="#475569">العلامات إرشادية فقط ولا تغني عن فحص الطبيب</text></svg>