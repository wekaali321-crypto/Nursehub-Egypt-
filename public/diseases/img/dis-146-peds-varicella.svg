<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 358" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="358" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الجدري المائي (Varicella): مراجعة NCLEX</text><rect x="325" y="48" width="295" height="172" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الوصف</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">هوائي: N95 وقفازات ورداء وغرفة ضغط سالب</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">طفح حاك: حطاطات وحويصلات ورشح ثم قشور خلال</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">7 أيام</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">حمى وتوعك</text><text x="610" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">معدٍ من 1–2 يوم قبل الطفح حتى نحو 5 أيام</text><text x="610" y="200" text-anchor="start" font-size="12.5" fill="#1e293b">بعد بدئه واكتمال القشرة</text><rect x="20" y="48" width="295" height="172" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">العلاج</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">ديفينهيدرامين (كريم بعد الاستحمام) وقفازات</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">قطنية للأطفال</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">باراسيتامول — لا أسبرين (متلازمة راي)</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">ضعيفو المناعة: أسيكلوفير؛ لا لقاحات حية</text><text x="305" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">العودة للمدرسة بعد تقشر الحويصلات</text><rect x="325" y="230" width="295" height="112" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="230" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">بعد اللقاح</text><text x="610" y="282" text-anchor="start" font-size="12.5" fill="#1e293b">غطّ الحويصلات بضمادة صغيرة حتى تجف تمامًا</text><text x="610" y="302" text-anchor="start" font-size="12.5" fill="#1e293b">انزعاج واحمرار وبضع حويصلات بمكان الحقن</text><text x="610" y="322" text-anchor="start" font-size="12.5" fill="#1e293b">أمر طبيعي ولا يُبلَّغ</text>
</svg>
