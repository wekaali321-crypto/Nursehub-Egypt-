<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 505" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="505" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">الإنفلونزا (⁦Influenza⁩): من العدوى إلى المضاعفات</text><rect x="434.66666666666663" y="50" width="185.33333333333334" height="96.19999999999999" rx="10" fill="#fff" stroke="#475569" stroke-width="1.5"/><path d="M434.66666666666663 60a10 10 0 0 1 10-10h165.33333333333334a10 10 0 0 1 10 10v22h-185.33333333333334z" fill="#475569"/><text x="527.3333333333333" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">العدوى</text><text x="610" y="96" text-anchor="start" font-size="12" font-weight="700" fill="#475569">⁦•⁩</text><text x="598" y="96" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">فيروس أورثوميكسو</text><text x="610" y="116.4" text-anchor="start" font-size="12" font-weight="700" fill="#475569">⁦•⁩</text><text x="598" y="116.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">رذاذ تنفسي أو لمس ملوث</text><line x1="432.66666666666663" y1="98.1" x2="414.66666666666663" y2="98.1" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="227.3333333333333" y="50" width="185.33333333333334" height="96.19999999999999" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><path d="M227.3333333333333 60a10 10 0 0 1 10-10h165.33333333333334a10 10 0 0 1 10 10v22h-185.33333333333334z" fill="#c2410c"/><text x="319.99999999999994" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التكاثر</text><text x="402.66666666666663" y="96" text-anchor="start" font-size="12" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="390.66666666666663" y="96" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">غزو ظهارة الجهاز التنفسي</text><text x="390.66666666666663" y="113.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">والتهاب وتقشر</text><text x="402.66666666666663" y="133.8" text-anchor="start" font-size="12" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="390.66666666666663" y="133.8" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">ضعف الدفاع المخاطي الهدبي</text><line x1="225.3333333333333" y1="98.1" x2="207.3333333333333" y2="98.1" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="19.999999999999943" y="50" width="185.33333333333334" height="96.19999999999999" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M19.999999999999943 60a10 10 0 0 1 10-10h165.33333333333334a10 10 0 0 1 10 10v22h-185.33333333333334z" fill="#b91c1c"/><text x="112.66666666666661" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">عدوى ثانوية</text><text x="195.3333333333333" y="96" text-anchor="start" font-size="12" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="183.3333333333333" y="96" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">التهاب رئوي بكتيري</text><text x="195.3333333333333" y="116.4" text-anchor="start" font-size="12" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="183.3333333333333" y="116.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">التهاب أذن/جيوب</text><rect x="327" y="160.2" width="293" height="161.75" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M327 170.2a10 10 0 0 1 10-10h273a10 10 0 0 1 10 10v22h-293z" fill="#b91c1c"/><text x="473.5" y="181.2" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">مضاعفات</text><text x="610" y="206.7" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="206.7" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">التهاب رئوي، خانوق (⁦Croup⁩)، التهاب أذن</text><text x="610" y="227.825" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="227.825" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">التهاب عضلات وانحلال الربيدات</text><text x="610" y="248.95" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="248.95" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">تفاقم ⁦COPD⁩، متلازمة راي</text><text x="610" y="270.075" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="270.075" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">التهاب عضلة القلب والتامور، التهاب نخاع</text><text x="598" y="288.2" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">مستعرض ودماغ</text><text x="610" y="309.325" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="309.325" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">صدمة سمية، ⁦ARDS⁩، وفاة</text><rect x="20" y="160.2" width="293" height="161.75" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><path d="M20 170.2a10 10 0 0 1 10-10h273a10 10 0 0 1 10 10v22h-293z" fill="#c2410c"/><text x="166.5" y="181.2" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">عوامل الخطر</text><text x="303" y="206.7" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="291" y="206.7" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ضعف المناعة</text><text x="303" y="227.825" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="291" y="227.825" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">العمر (صغار جداً أو كبار)</text><text x="303" y="248.95" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="291" y="248.95" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">العاملون الصحيون والحضانات</text><text x="303" y="270.075" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="291" y="270.075" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أمراض مزمنة، الحمل</text><text x="303" y="291.2" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="291" y="291.2" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الازدحام والعيش مع مصاب</text><rect x="327" y="333.95" width="293" height="158.75" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/><path d="M327 343.95a10 10 0 0 1 10-10h273a10 10 0 0 1 10 10v22h-293z" fill="#0e7490"/><text x="473.5" y="354.95" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">العلاج</text><text x="610" y="380.45" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="380.45" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">خافض حرارة (باراسيتامول أو إيبوبروفين)</text><text x="598" y="398.575" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ومقشع</text><text x="610" y="419.7" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="419.7" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أوسيلتاميفير/زاناميفير وقاية للمخالطين</text><text x="598" y="437.825" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">غير المطعمين</text><text x="610" y="458.95" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="458.95" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">مضاد حيوي فقط للعدوى البكتيرية الثانوية</text><text x="610" y="480.075" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="480.075" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">اللقاح للوقاية</text><rect x="