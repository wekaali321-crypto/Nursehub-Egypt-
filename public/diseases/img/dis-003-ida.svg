<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="340" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">فقر الحديد: الأسباب والعلاج</text>
<rect x="20.0" y="48" width="295.0" height="120" rx="10" fill="#b91c1c"/>
<text x="167.5" y="83.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الأسباب</text>
<text x="167.5" y="102.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">غذاء فقير باللحوم والأسماك والدواجن</text>
<text x="167.5" y="121.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">جراحة تحويل المعدة، الحمل</text>
<text x="167.5" y="140.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">نقص حموضة المعدة والتهاب ضموري</text>
<rect x="325.0" y="48" width="295.0" height="120" rx="10" fill="#ca8a04"/>
<text x="472.5" y="93.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الرضع والأطفال</text>
<text x="472.5" y="112.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ولادة مبكرة، لبن أبقار كثير</text>
<text x="472.5" y="131.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">رضاعة صناعية للخدّج، غذاء نباتي</text>
<rect x="20.0" y="178" width="295.0" height="120" rx="10" fill="#7c3aed"/>
<text x="167.5" y="213.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">أعراض هضمية</text>
<text x="167.5" y="232.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">التهاب الفم والشفاه</text>
<text x="167.5" y="251.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">التهاب اللسان (Glossitis)</text>
<text x="167.5" y="270.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">البيكا (أكل مواد غريبة)</text>
<rect x="325.0" y="178" width="295.0" height="120" rx="10" fill="#0f766e"/>
<text x="472.5" y="213.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">العلاج</text>
<text x="472.5" y="232.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لحوم، أسماك، دواجن</text>
<text x="472.5" y="251.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">سبانخ وحبوب كاملة مع فيتامين C</text>
<text x="472.5" y="270.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">حديد فموي (Ferrous sulfate)</text>
<text x="320" y="330" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">براز داكن مع الحديد متوقع؛ الحديد على معدة فارغة (قبل الأدوية بساعة)</text>
</svg>
