<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 479" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="479" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنيميا نقص الحديد: الأسباب والعلاج والتثقيف</text><rect x="330" y="52" width="300" height="146.39999999999998" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#dc2626"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأسباب</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• نظام غذائي فقير بالحديد: لحوم وسمك</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  ودواجن</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• جراحة تحويل المعدة (Gastric bypass)</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الحمل: الجنين يخزن الحديد</text><text x="620" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• البيكا (Pica): أكل مواد غير غذائية</text><text x="620" y="182.00000000000003" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• Hct وHgb منخفضان</text><rect x="10" y="52" width="310" height="129.0" rx="10" fill="#fff" stroke="#0891b2" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#0891b2"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأطفال والرضع</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ولادة مبكرة</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قلة الغذاء الفموي</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الإفراط في شرب اللبن (نقطة امتحان)</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الخدّج على لبن الأم فقط بدون مكمل</text><text x="310" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الحل: حبوب وخبز مدعم + فيتامين C</text><rect x="330" y="206.39999999999998" width="300" height="111.6" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M330,216.39999999999998 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#16a34a"/><text x="480.0" y="225.39999999999998" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج والغذاء</text><text x="620" y="249.39999999999998" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• لحوم وسمك ودواجن</text><text x="620" y="266.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• سبانخ وخضار ورقية وحبوب كاملة</text><text x="620" y="284.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• حديد + فيتامين C معًا (عصير برتقال)</text><text x="620" y="301.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الأطفال: قلل اللبن الزائد</text><rect x="10" y="206.39999999999998" width="310" height="129.0" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M10,216.39999999999998 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#7c3aed"/><text x="165.0" y="225.39999999999998" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأدوية</text><text x="310" y="249.39999999999998" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• كبريتات الحديدوز (فموي)</text><text x="310" y="266.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• حديد دكستران (وريدي/عضلي)</text><text x="310" y="284.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• براز أسود/داكن = متوقع، ليس نزيفًا</text><text x="310" y="301.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• يُفضَّل على معدة فاضية (قبل الأكل بساعة)</text><text x="310" y="318.9999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  إن تحمّله المريض</text><rect x="330" y="343.4" width="300" height="94.19999999999999" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M330,353.4 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#ea580c"/><text x="480.0" y="362.4" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأعراض</text><text x="620" y="386.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ضيق نفس (Dyspnea)</text><text x="620" y="403.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• شحوب الجلد (Pallor) — علامة جلدية بارزة</text><text x="620" y="421.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• سرعة ضربات القلب</text><rect x="10" y="343.4" width="310" height="111.6" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M10,353.4 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#0369a1"/><text x="165.0" y="362.4" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">إجابات اختبارات</text><text x="310" y="386.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• وجبة الحديد: دجاج مشوي + سبانخ + خبز حبوب</text><text x="310" y="403.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  كاملة</text><text x="310" y="421.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ستيك + خضار ورقية + كبدة وبصل</text><text x="310" y="438.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أهم نصيحة لزيادة الامتصاص: عصير برتقال</text></svg>