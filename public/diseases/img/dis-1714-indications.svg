<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="290" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">الولادة القيصرية: الأسباب والمضاعفات</text><rect x="20" y="50" width="290" height="190" rx="12" fill="#e0f2fe"/><text x="165" y="78" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">مخططة (Planned)</text><text x="165" y="110" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">قيصرية سابقة</text><text x="165" y="132" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">جنين كبير أو توائم</text><text x="165" y="154" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">هربس تناسلي/عدوى للأم</text><text x="165" y="176" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">مشيمة منزاحة (Previa)</text><rect x="330" y="50" width="290" height="190" rx="12" fill="#fee2e2"/><text x="475" y="78" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">طارئة (Emergency)</text><text x="475" y="106" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">ضائقة جنين</text><text x="475" y="126" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">انفصال مشيمة، تدلّي حبل</text><text x="475" y="146" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">طلق طويل أو انقباضات ضعيفة</text><text x="475" y="166" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">عرض مقعدي أو وضع مستعرض/مائل</text><text x="320" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">تُجرى بعد 28 أسبوعًا من الحمل</text>
</svg>
