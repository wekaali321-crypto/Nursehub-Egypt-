<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="380" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">غسل المثانة المستمر بعد TURP</text><rect x="20" y="46" width="600" height="48" rx="10" fill="#2563eb"/><text x="320.0" y="74.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">قسطرة ثلاثية المسارات (3-way Foley) للغسل المستمر: ضغط على الأنسجة النازفة وتصريف</text><rect x="430" y="106" width="190" height="70" rx="10" fill="#dc2626"/><text x="525.0" y="136.7" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">فورًا</text><text x="525.0" y="153.7" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">بول دموي (طبيعي)</text><rect x="225" y="106" width="190" height="70" rx="10" fill="#f97316"/><text x="320.0" y="136.7" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">بعد 24 س</text><text x="320.0" y="153.7" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">أحمر فاتح/وردي</text><rect x="20" y="106" width="190" height="70" rx="10" fill="#f59e0b"/><text x="115.0" y="136.7" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">حتى 36 س</text><text x="115.0" y="153.7" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">جلطات صغيرة (حد أقصى)</text><rect x="20" y="186" width="600" height="50" rx="10" fill="#fee2e2"/><text x="320.0" y="214.85" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">بول أحمر قانٍ بعد 24 ساعة → أبلغ الطبيب فورًا • جلطات صغيرة بعد 5 أيام من الاستئصال → راجع الطبيب فورًا</text><rect x="20" y="244" width="600" height="50" rx="10" fill="#fef3c7"/><text x="320.0" y="273.2" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">ألم شديد مع الغسل: قيّم الكمية والبول (وردي فاتح الأفضل)</text><rect x="20" y="302" width="600" height="66" rx="10" fill="#dcfce7"/><text x="320.0" y="330.7" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">المخرج أكبر من المدخل (ليس مساويًا ولا أقل)</text><text x="320.0" y="347.7" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">سلس مؤقت متوقع بعد إزالة القسطرة</text></svg>