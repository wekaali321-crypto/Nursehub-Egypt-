<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="310" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >أنواع الصدمة: كيف تفرّق بسرعة؟</text><text x="590" y="48" text-anchor="start" font-size="13" font-weight="800" fill="#64748b" >النوع</text><text x="420" y="48" text-anchor="start" font-size="13" font-weight="800" fill="#64748b" >أوردة الرقبة</text><text x="290" y="48" text-anchor="start" font-size="13" font-weight="800" fill="#64748b" >الجلد</text><text x="150" y="48" text-anchor="start" font-size="13" font-weight="800" fill="#64748b" >أمثلة</text><rect x="24" y="60" width="592" height="46" rx="10" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/><text x="590" y="89" text-anchor="start" font-size="13" font-weight="800" fill="#b91c1c" >قلبية</text><text x="420" y="89" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >منتفخة</text><text x="290" y="89" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >بارد ورطب/متبقع</text><text x="150" y="89" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >جلطة، اضطراب نظم</text><rect x="24" y="114" width="592" height="46" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="590" y="143" text-anchor="start" font-size="13" font-weight="800" fill="#b91c1c" >نقص حجم</text><text x="420" y="143" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >مسطحة</text><text x="290" y="143" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >بارد وجاف</text><text x="150" y="143" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >نزيف، جفاف</text><rect x="24" y="168" width="592" height="46" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="590" y="197" text-anchor="start" font-size="13" font-weight="800" fill="#b91c1c" >إنتانية</text><text x="420" y="197" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >مسطحة</text><text x="290" y="197" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >دافئ (مبكر)</text><text x="150" y="197" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >عدوى شديدة</text><rect x="24" y="222" width="592" height="46" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="590" y="251" text-anchor="start" font-size="13" font-weight="800" fill="#b91c1c" >انسدادية</text><text x="420" y="251" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >منتفخة</text><text x="290" y="251" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >بارد</text><text x="150" y="251" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >جلطة رئوية، ضغط التامور</text><text x="320" y="290" text-anchor="middle" font-size="12.5" font-weight="800" fill="#b91c1c" >الصدمة القلبية: ضغط منخفض + أوردة رقبة منتفخة + رئة محتقنة غالباً + أطراف باردة</text>
</svg>
