<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="330" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التينيا (فطريات الجلد): الأنواع والعلاج</text><rect x="20" y="50" width="290" height="40" rx="10" fill="#7c3aed"/><text x="165.0" y="73.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">فطريات سطحية شديدة العدوى تعيش على سطح الجلد</text><rect x="330" y="50" width="290" height="40" rx="10" fill="#0ea5e9"/><text x="475.0" y="73.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تينيا كابيتيس: فروة الرأس · تينيا بيديس: قدم الرياضي</text><rect x="330" y="105" width="290" height="70" rx="10" fill="#f59e0b"/><text x="475.0" y="125.0" text-anchor="middle" font-size="13" font-weight="800" fill="#422006">تينيا كوربوريس (القوباء الحلقية)</text><text x="475.0" y="143.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">طفح دائري، حرشفي، حاكّ</text><text x="475.0" y="161.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">حافة حمراء محددة ومركز صافٍ</text><rect x="20" y="105" width="290" height="70" rx="10" fill="#14b8a6"/><text x="165.0" y="125.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">تينيا بيديس</text><text x="165.0" y="143.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">رطوبة وهرش حول أصابع القدم</text><text x="165.0" y="161.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">جوارب قطنية · نقع دافئ · محلول بورو</text><rect x="330" y="190" width="290" height="92" rx="10" fill="#16a34a"/><text x="475.0" y="212.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">Griseofulvin</text><text x="475.0" y="230.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">يؤخذ أسابيع إلى شهور</text><text x="475.0" y="248.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لا يُوقف عند زوال الهرش</text><text x="475.0" y="266.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">يُمتص أفضل مع وجبة غنية بالدهون</text><rect x="20" y="190" width="290" height="92" rx="10" fill="#dc2626"/><text x="165.0" y="212.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">أولوية التمريض</text><text x="165.0" y="230.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لا تتشارك الفرش والمناشف</text><text x="165.0" y="248.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">والقبعات والملابس وغيرها</text><text x="165.0" y="266.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">أهم تثقيف: منع انتشار العدوى</text><rect x="20" y="295" width="600" height="26" rx="10" fill="#334155"/><text x="320.0" y="311.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تراجع الجرعة والمدة مع الطبيب/الصيدلي</text></svg>