<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 332" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="332" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">الوسواس القهري (⁦OCD⁩) واضطراب الشخصية الوسواسي (⁦OCPD⁩)</text><rect x="326" y="50" width="294" height="59.125" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M326 60a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#b91c1c"/><text x="473" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الأفكار الوسواسية (⁦Obsessions⁩)</text><text x="610" y="96.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="96.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أفكار ودوافع مفرطة</text><rect x="20" y="50" width="294" height="59.125" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><path d="M20 60a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#c2410c"/><text x="167" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الأفعال القهرية (⁦Compulsions⁩)</text><text x="304" y="96.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="292" y="96.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">سلوكيات طقسية متكررة لتخفيف القلق</text><rect x="326" y="121.125" width="294" height="198" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><path d="M326 131.125a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#15803d"/><text x="473" y="142.125" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">خطة الرعاية الأولية (⁦5⁩)</text><text x="610" y="167.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="167.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">قلل وقت الطقوس تدريجياً (لا تمنعها فجأة في</text><text x="598" y="185.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">البداية)</text><text x="610" y="206.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="206.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">حدد المثيرات التي ترفع القلق</text><text x="610" y="228" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="228" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">⁦CBT⁩ وإيقاف الأفكار (⁦Thought stopping⁩)</text><text x="610" y="249.125" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="249.125" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">استرخاء وتحويل الانتباه: تنفس عميق ومشي</text><text x="598" y="267.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">قصير</text><text x="610" y="288.375" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="288.375" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">تواصل: لا تعليقات حكمية، وامدح السلوك غير</text><text x="598" y="306.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الطقسي</text><rect x="20" y="121.125" width="294" height="198" rx="10" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><path d="M20 131.125a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#6d28d9"/><text x="167" y="142.125" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">مقارنة ⁦OCPD⁩</text><text x="304" y="167.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="167.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">يخطط يومه كله</text><text x="304" y="188.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="188.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">كمال وتشدد في المهام</text><text x="304" y="209.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="209.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">عدم مرونة وحاجة للتحكم</text><text x="304" y="231" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="231" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">على عكس ⁦OCD⁩: لا يرى مشكلة غالباً</text></svg>