<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 522" width="640" height="522" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="522" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a" direction="rtl">الأنيميا اللاتنسجية: من السبب للمضاعفات</text><rect x="20" y="56" width="600" height="74" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="606" y="80" text-anchor="end" direction="rtl" font-size="16" font-weight="700" fill="#0f172a" style="unicode-bidi:plaintext" transform="translate(0,0)">السبب</text><text x="606" y="102" text-anchor="end" direction="rtl" font-size="14" fill="#334155">إشعاع، سموم/بنزين، أدوية (كلورامفينيكول،</text><text x="606" y="122" text-anchor="end" direction="rtl" font-size="14" fill="#334155">سيتوتوكسيك)، فيروسات، مناعة ذاتية، أو مجهول السبب</text><path d="M320 130 v14" stroke="#64748b" stroke-width="2"/><path d="M314 139 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="20" y="150" width="600" height="74" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="606" y="174" text-anchor="end" direction="rtl" font-size="16" font-weight="700" fill="#0f172a" style="unicode-bidi:plaintext" transform="translate(0,0)">فشل النخاع العظمي</text><text x="606" y="196" text-anchor="end" direction="rtl" font-size="14" fill="#334155">النخاع مش بيصنّع كفاية كرات حمراء وبيضاء وصفائح</text><text x="606" y="216" text-anchor="end" direction="rtl" font-size="14" fill="#334155">(Pancytopenia)</text><path d="M320 224 v14" stroke="#64748b" stroke-width="2"/><path d="M314 233 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="20" y="244" width="600" height="74" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="606" y="268" text-anchor="end" direction="rtl" font-size="16" font-weight="700" fill="#0f172a" style="unicode-bidi:plaintext" transform="translate(0,0)">النتيجة في الدم</text><text x="606" y="290" text-anchor="end" direction="rtl" font-size="14" fill="#334155">أنيميا (شحوب/تعب) + نقص كرات بيضاء (عدوى) + نقص</text><text x="606" y="310" text-anchor="end" direction="rtl" font-size="14" fill="#334155">صفائح (نزف وكدمات)</text><path d="M320 318 v14" stroke="#64748b" stroke-width="2"/><path d="M314 327 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="20" y="338" width="600" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="606" y="362" text-anchor="end" direction="rtl" font-size="16" font-weight="700" fill="#0f172a" style="unicode-bidi:plaintext" transform="translate(0,0)">الخطر الأكبر</text><text x="606" y="384" text-anchor="end" direction="rtl" font-size="14" fill="#334155">عدوى شديدة مع نقص المناعة + نزف تلقائي: دا اللي</text><text x="606" y="404" text-anchor="end" direction="rtl" font-size="14" fill="#334155">بيحدد التمريض والعزل</text><path d="M320 412 v14" stroke="#64748b" stroke-width="2"/><path d="M314 421 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="20" y="432" width="600" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="606" y="456" text-anchor="end" direction="rtl" font-size="16" font-weight="700" fill="#0f172a" style="unicode-bidi:plaintext" transform="translate(0,0)">العلاج</text><text x="606" y="478" text-anchor="end" direction="rtl" font-size="14" fill="#334155">إيقاف السبب، دعم بالدم والصفائح، كبت المناعة (ATG +</text><text x="606" y="498" text-anchor="end" direction="rtl" font-size="14" fill="#334155">سيكلوسبورين)، أو زرع نخاع</text></svg>