<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="310" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >بعد قسطرة القلب: خط زمني للمراقبة</text><rect x="20" y="50" width="600" height="46" rx="10" fill="#dc2626"/><text x="560" y="80" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >أول ساعة</text><text x="260" y="80" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >نبض وضغط وموضع القسطرة كل 15 دقيقة</text><rect x="20" y="105" width="600" height="46" rx="10" fill="#f97316"/><text x="560" y="135" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >3 ساعات</text><text x="260" y="135" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >ذراع مفرودة لو من الذراع</text><rect x="20" y="160" width="600" height="46" rx="10" fill="#eab308"/><text x="560" y="190" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >8 ساعات</text><text x="260" y="190" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >راحة تامة والرجل مفرودة لو فخذية + ضغط الموضع</text><rect x="20" y="215" width="600" height="46" rx="10" fill="#22c55e"/><text x="560" y="245" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >طول اليوم</text><text x="260" y="245" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >سوائل كتير لتفريغ الصبغة</text><text x="320" y="290" text-anchor="middle" font-size="11" font-weight="400" fill="#94a3b8" >الأرقام مأخوذة من الممارسة الشائعة؛ بروتوكول المستشفى هو المعتمد</text></svg>