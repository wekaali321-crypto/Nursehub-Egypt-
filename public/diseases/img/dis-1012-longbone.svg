="30" fill="#e0f2fe" stroke="#cbd5e1"/><text x="535.0" y="217.0" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">Medullary cavity</text><rect x="20" y="198" width="430" height="30" fill="#e0f2fe" stroke="#cbd5e1"/><text x="235.0" y="217.0" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">التجويف الداخلي للنخاع الأحمر والأصفر</text><rect x="450" y="228" width="170" height="30" fill="#fff" stroke="#cbd5e1"/><text x="535.0" y="247.0" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">Haversian / Volkmann</text><rect x="20" y="228" width="430" height="30" fill="#fff" stroke="#cbd5e1"/><text x="235.0" y="247.0" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">قنوات الأوعية الدموية والأعصاب</text>
