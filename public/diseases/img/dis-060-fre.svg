<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 404" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="404" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">وظائف الكلى الثلاث: الترشيح، إعادة الامتصاص، الإريثروبويتين</text><rect x="16" y="56" width="608" height="128" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><rect x="16" y="56" width="608" height="30" rx="12" fill="#dc2626"/><text x="320" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">F الترشيح Filtration</text><text x="614" y="108" text-anchor="end" font-size="13" fill="#7f1d1d">تخلّص الدم من الأدوية والفضلات</text><text x="614" y="127" text-anchor="end" font-size="13" fill="#7f1d1d">أيونات الهيدروجين H+ (زيادتها = حموضة)</text><text x="614" y="146" text-anchor="end" font-size="13" fill="#7f1d1d">اليوريا (BUN)</text><text x="614" y="165" text-anchor="end" font-size="13" fill="#7f1d1d">الكرياتينين (فوق 1.3 = خلل كلوي)</text><rect x="16" y="196" width="608" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><rect x="16" y="196" width="608" height="30" rx="12" fill="#2563eb"/><text x="320" y="217" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">R إعادة الامتصاص Reabsorption</text><text x="614" y="248" text-anchor="end" font-size="13" fill="#1e3a8a">تنظيم حجم السوائل</text><text x="614" y="267" text-anchor="end" font-size="13" fill="#1e3a8a">الهرمون المضاد لإدرار البول ADH يعيد الماء للجسم</text><rect x="16" y="298" width="608" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><rect x="16" y="298" width="608" height="30" rx="12" fill="#16a34a"/><text x="320" y="319" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">E الإريثروبويتين EPO</text><text x="614" y="350" text-anchor="end" font-size="13" fill="#14532d">هرمون تفرزه الكلى</text><text x="614" y="369" text-anchor="end" font-size="13" fill="#14532d">ينشّط نخاع العظم لإنتاج كرات الدم الحمراء</text></svg>