<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 429" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="429" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">خطوات الرضاعة الطبيعية الصحيحة</text><rect x="20" y="52" width="600" height="51" rx="10" fill="#fff" stroke="#be185d" stroke-width="1.5"/><circle cx="592" cy="77.5" r="14" fill="#be185d"/><text x="592" y="82.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="566" y="72" text-anchor="end" font-size="14" font-weight="800" fill="#be185d">قبل الرضاعة</text><text x="566" y="91" text-anchor="end" font-size="12.5" fill="#0f172a">اغسلي اليدين وخذي وضعية مريحة.</text><text x="320" y="117" text-anchor="middle" font-size="14" fill="#be185d">↓</text><rect x="20" y="121" width="600" height="68" rx="10" fill="#fff" stroke="#be185d" stroke-width="1.5"/><circle cx="592" cy="155.0" r="14" fill="#be185d"/><text x="592" y="160.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="566" y="141" text-anchor="end" font-size="14" font-weight="800" fill="#be185d">الالتقام</text><text x="566" y="160" text-anchor="end" font-size="12.5" fill="#0f172a">فم الطفل واسع يغطي الحلمة وجزءاً من الهالة، والحلمة نحو سقف</text><text x="566" y="177" text-anchor="end" font-size="12.5" fill="#0f172a">الفم.</text><text x="320" y="203" text-anchor="middle" font-size="14" fill="#be185d">↓</text><rect x="20" y="207" width="600" height="68" rx="10" fill="#fff" stroke="#be185d" stroke-width="1.5"/><circle cx="592" cy="241.0" r="14" fill="#be185d"/><text x="592" y="246.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="566" y="227" text-anchor="end" font-size="14" font-weight="800" fill="#be185d">أثناء الرضاعة</text><text x="566" y="246" text-anchor="end" font-size="12.5" fill="#0f172a">اسمعي البلع وراقبي راحة الطفل؛ لفك الشفط ضعي إصبعاً بجانب الفم</text><text x="566" y="263" text-anchor="end" font-size="12.5" fill="#0f172a">أولاً.</text><text x="320" y="289" text-anchor="middle" font-size="14" fill="#be185d">↓</text><rect x="20" y="293" width="600" height="51" rx="10" fill="#fff" stroke="#be185d" stroke-width="1.5"/><circle cx="592" cy="318.5" r="14" fill="#be185d"/><text x="592" y="323.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="566" y="313" text-anchor="end" font-size="14" font-weight="800" fill="#be185d">بعد الرضاعة</text><text x="566" y="332" text-anchor="end" font-size="12.5" fill="#0f172a">أفرغي الثدي جيداً، ضعي قطرات من اللبن على الحلمة واتركيها تجف.</text><text x="320" y="358" text-anchor="middle" font-size="14" fill="#be185d">↓</text><rect x="20" y="362" width="600" height="51" rx="10" fill="#fff" stroke="#be185d" stroke-width="1.5"/><circle cx="592" cy="387.5" r="14" fill="#be185d"/><text x="592" y="392.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text><text x="566" y="382" text-anchor="end" font-size="14" font-weight="800" fill="#be185d">الجدول</text><text x="566" y="401" text-anchor="end" font-size="12.5" fill="#0f172a">كل 1-3 ساعات، 8-12 رضعة يومياً في البداية.</text></svg>