<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="440" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الروماتويد (RA)</text><rect x="330" y="52" width="300" height="111.6" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الفكرة</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مناعة ذاتية تهاجم المفاصل: التهاب وتشوه</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مفاصل اليد أكثر، وقد يشمل الجلد والعين</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  والرئة</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مرض جهازي (على عكس الخشونة)</text><rect x="10" y="52" width="310" height="94.19999999999999" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#7c3aed"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التشخيص</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• شفط السائل الزلالي</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تنظير المفصل (Arthroscopy)</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تحاليل: RF وESR وCRP</text><rect x="330" y="171.6" width="300" height="181.2" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M330,181.6 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#dc2626"/><text x="480.0" y="190.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأعراض</text><text x="620" y="214.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مبكرًا: إعياء، فقد شهية ووزن، تيبس</text><text x="620" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  صباحي</text><text x="620" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ألم وتورم متناظر بالمفاصل الصغيرة</text><text x="620" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  لليدين</text><text x="620" y="284.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تشوه عنق البجعة (Swan-neck) وبوتونيير</text><text x="620" y="301.59999999999997" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (Boutonniere)</text><text x="620" y="318.99999999999994" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تقلصات المفاصل = أولوية</text><text x="620" y="336.3999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الألم يخف بالنشاط ويزيد بالراحة</text><rect x="10" y="171.6" width="310" height="94.19999999999999" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M10,181.6 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#16a34a"/><text x="165.0" y="190.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأدوية</text><text x="310" y="214.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مضادات الالتهاب غير الستيرويدية NSAIDs</text><text x="310" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ستيرويدات (بريدنيزون)</text><text x="310" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ميثوتريكسات</text><rect x="10" y="360.79999999999995" width="620" height="53.5" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/><text x="320" y="380.54999999999995" text-anchor="middle" font-size="12.5" font-weight="600" fill="#713f12">التمريض: قيّم الألم، لا ترفع الركبتين بوسادة ليلًا، تمارين خفيفة (سباحة)، حرارة</text><text x="320" y="399.29999999999995" text-anchor="middle" font-size="12.5" font-weight="600" fill="#713f12">وبرودة بالتناوب، دش أو حمام دافئ قبل النوم؛ حرارة وتمارين مدى الحركة.</text></svg>