<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="430" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التليف الكيسي: ماذا يُختبر</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="277.4" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#0ea5e9"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الآلية والأعراض</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• اضطراب وراثي: مخاط</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">أسمك وألزج</text><text x="612" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• تراكم بالرئتين → عدوى</text><text x="612" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">تنفسية متكررة؛ وبالجهاز</text><text x="612" y="176.8" text-anchor="start" font-size="13" fill="#0f172a">الهضمي → ضعف نمو وزيادة</text><text x="612" y="195" text-anchor="start" font-size="13" fill="#0f172a">وزن</text><text x="612" y="218.2" text-anchor="start" font-size="13" fill="#0f172a">• انخفاض تأكسج النبض</text><text x="612" y="236.39999999999998" text-anchor="start" font-size="13" fill="#0f172a">(العادي 95–100%) وهبوط</text><text x="612" y="254.6" text-anchor="start" font-size="13" fill="#0f172a">مفاجئ</text><text x="612" y="277.79999999999995" text-anchor="start" font-size="13" fill="#0f172a">• بلغم مدمّم، فقد وزن</text><text x="612" y="295.99999999999994" text-anchor="start" font-size="13" fill="#0f172a">وشهية، إمساك وبراز دهني</text><text x="612" y="314.19999999999993" text-anchor="start" font-size="13" fill="#0f172a">(steatorrhea)</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="277.4" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#f59e0b"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الفحوصات</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• اختبار كلوريد العرق</text><text x="408.66666666666663" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• اختبار DNA وبراز</text><text x="408.66666666666663" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• (نادرًا ما تُختبر)</text><rect x="20" y="54" width="193.33333333333334" height="277.4" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">التمريض الأكثر اختبارًا</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• غذاء عالي السعرات</text><text x="205.33333333333334" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">وإنزيمات مع الوجبات</text><text x="205.33333333333334" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• سوائل أكثر وتمارين</text><text x="205.33333333333334" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">وعلاج صدري وتصريف وضعي</text><text x="205.33333333333334" y="181.8" text-anchor="start" font-size="13" fill="#0f172a">• استشارة مالية</text><rect x="20" y="341.4" width="600" height="74" rx="10" fill="#ef4444" fill-opacity="0.13" stroke="#ef4444" stroke-width="1.5"/><text x="610" y="361.4" text-anchor="start" font-size="13.5" font-weight="800" fill="#ef4444">الأدوية</text><text x="610" y="381.4" text-anchor="start" font-size="13" fill="#0f172a">acetylcysteine (Mucomyst): مُذيب للمخاط وهو ترياق لتسمم الباراسيتامول. قد</text><text x="610" y="400.4" text-anchor="start" font-size="13" fill="#0f172a">يزيد تشنج القصبات، فاستعمله بحذر.</text></svg>
