<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="640" height="360" rx="16" fill="#f8fafc"/>
<text x="320.0" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">متى متزامنة (SYNC) ومتى غير متزامنة؟</text>
<rect x="200" y="40" width="240" height="44" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="320.0" y="66.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">مريض بتسرع / توقف قلب</text>
<line x1="320" y1="84" x2="320" y2="104" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="200" y="104" width="240" height="44" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="320.0" y="121.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="12.5">فيه نبض؟</text>
<text x="320.0" y="139.33333333333331" text-anchor="middle" font-size="13" font-weight="600" fill="12.5" direction="ltr">(جس السباتي ≤ 10 ث)</text>
<line x1="250" y1="148" x2="150" y2="176" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="390" y1="148" x2="490" y2="176" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="180" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#b91c1c">لا</text>
<text x="460" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">نعم</text>
<rect x="20" y="176" width="260" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="150.0" y="201.33333333333334" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">VF أو VT بدون نبض</text>
<text x="150.0" y="219.33333333333334" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">صدمة غير متزامنة (Defibrillation)</text>
<line x1="150" y1="236" x2="150" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="20" y="256" width="260" height="56" rx="10" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
<text x="150.0" y="279.4166666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">120–200 J ثنائي الطور</text>
<text x="150.0" y="296.9166666666667" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7f1d1d">+ CPR مباشرة بعد الصدمة</text>
<rect x="360" y="176" width="260" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="490.0" y="201.33333333333334" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">تسرع بنبض + غير مستقر</text>
<text x="490.0" y="219.33333333333334" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">صدمة متزامنة (Cardioversion)</text>
<line x1="490" y1="236" x2="490" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="360" y="256" width="260" height="56" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
<text x="490.0" y="279.5833333333333" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14532d">اضغط SYNC وتأكد من العلامة على R</text>
<text x="490.0" y="296.0833333333333" text-anchor="middle" font-size="11.5" font-weight="600" fill="#14532d">50–100 J (SVT) • 120–200 J (AF) • 100 J (VT)</text>
<text x="320" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">القاعدة: كل اضطراب نظم يُعطى متزامن ماعدا VF (وVT بدون نبض) فيُعطى غير متزامن</text></svg>