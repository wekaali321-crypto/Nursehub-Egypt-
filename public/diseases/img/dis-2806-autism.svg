<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 353" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="353" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">اضطراب طيف التوحد (⁦ASD⁩)</text><text x="320" y="52" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b">اضطراب نمائي يؤثر على التواصل والتفاعل: السبب غير معروف</text><rect x="326" y="62" width="294" height="143.625" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/><path d="M326 72a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#0e7490"/><text x="473" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التفاعل والتواصل</text><text x="610" y="108.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="108.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لا يحافظ على التواصل البصري</text><text x="610" y="129.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="129.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لا يتفاعل بالإيماءات</text><text x="610" y="150.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="150.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لا يحب العناق ويلعب وحده</text><text x="610" y="171.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="171.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لا يستجيب للأسئلة</text><text x="610" y="193" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="193" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f