<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="450" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">خطوات التعامل مع نقص الصوديوم</text><rect x="40" y="48" width="560" height="66" rx="12" fill="#fff" stroke="#dc2626" stroke-width="1.8"/><circle cx="576" cy="81" r="14" fill="#dc2626"/><text x="576" y="86" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="552" y="69" text-anchor="end" font-size="14" font-weight="800" fill="#dc2626">قيّم الأعراض</text><text x="552" y="87" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">تشنج/غيبوبة/قيء شديد = طوارئ: 3% ملحي 100–150 مل خلال 10 دقائق حسب</text><text x="552" y="103" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">الأمر</text><text x="320" y="130" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="136" width="560" height="66" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><circle cx="576" cy="169" r="14" fill="#2563eb"/><text x="576" y="174" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="552" y="157" text-anchor="end" font-size="14" font-weight="800" fill="#2563eb">قيّم الحجم</text><text x="552" y="175" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">جاف (Hypovolemic) → محلول ملحي 0.9%؛ طبيعي (SIADH) → تقييد سوائل؛ زائد</text><text x="552" y="191" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">(قلب/كبد/كلى) → تقييد + مدر</text><text x="320" y="218" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="224" width="560" height="50" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.8"/><circle cx="576" cy="249" r="14" fill="#16a34a"/><text x="576" y="254" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="552" y="245" text-anchor="end" font-size="14" font-weight="800" fill="#16a34a">عالج السبب</text><text x="552" y="263" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">أوقف المسبب (مدرّات ثيازيد، أدوية)، علاج الغدة/الكلى/ADH</text><text x="320" y="290" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="296" width="560" height="66" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.8"/><circle cx="576" cy="329" r="14" fill="#ea580c"/><text x="576" y="334" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="552" y="317" text-anchor="end" font-size="14" font-weight="800" fill="#ea580c">راقب سرعة التصحيح</text><text x="552" y="335" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">لا ترفع الصوديوم أكثر من 8–10 ملي مول/لتر في 24 ساعة (8 للأكثر خطراً)</text><text x="552" y="351" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">— خطر Osmotic demyelination</text><text x="320" y="378" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="384" width="560" height="50" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><circle cx="576" cy="409" r="14" fill="#7c3aed"/><text x="576" y="414" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text><text x="552" y="405" text-anchor="end" font-size="14" font-weight="800" fill="#7c3aed">تحاليل متكررة</text><text x="552" y="423" text-anchor="end" font-size="12" font-weight="600" fill="#1e293b">كل 2–4 ساعات في الشديد، وحسب الأمر في الباقي</text></svg>