<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 499" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="499" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تنظير القصبات الهوائية: قبل وبعد</text><rect x="20" y="54" width="600" height="91" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><circle cx="590" cy="76" r="14" fill="#7c3aed"/><text x="590" y="81" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="566" y="80" text-anchor="start" font-size="15" font-weight="800" fill="#4c1d95">الهدف</text><text x="566" y="100" text-anchor="start" font-size="13" fill="#4c1d95">رؤية الحنجرة والرغامى والقصبات والرئة العميقة بمنظار مرن يدخل عبر الأنف</text><text x="566" y="119" text-anchor="start" font-size="13" fill="#4c1d95">أو الفم أو الأنبوب الرغامي؛ يُجرى لخزعة (فحص سرطان) أو غسيل (Lavage) أو</text><text x="566" y="138" text-anchor="start" font-size="13" fill="#4c1d95">شفط بلغم عميق أو جسم غريب.</text><text x="320" y="161" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="167" width="600" height="72" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><circle cx="590" cy="189" r="14" fill="#7c3aed"/><text x="590" y="194" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="566" y="193" text-anchor="start" font-size="15" font-weight="800" fill="#4c1d95">قبل الإجراء</text><text x="566" y="213" text-anchor="start" font-size="13" fill="#4c1d95">تهدئة خفيفة (تخفض العلامات الحيوية) ومخدر موضعي مثل lidocaine على الحلق</text><text x="566" y="232" text-anchor="start" font-size="13" fill="#4c1d95">لمنع منعكس التهوع.</text><text x="320" y="255" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="261" width="600" height="72" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><circle cx="590" cy="283" r="14" fill="#7c3aed"/><text x="590" y="288" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="566" y="287" text-anchor="start" font-size="15" font-weight="800" fill="#4c1d95">طبيعي بعد الإجراء</text><text x="566" y="307" text-anchor="start" font-size="13" fill="#4c1d95">انخفاض معدل التنفس والتشبع بسبب التهدئة، وغياب منعكس التهوع بسبب المخدر</text><text x="566" y="326" text-anchor="start" font-size="13" fill="#4c1d95">الموضعي.</text><text x="320" y="349" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="355" width="600" height="53" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><circle cx="590" cy="377" r="14" fill="#7c3aed"/><text x="590" y="382" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="566" y="381" text-anchor="start" font-size="15" font-weight="800" fill="#4c1d95">بلّغ فورًا</text><text x="566" y="401" text-anchor="start" font-size="13" fill="#4c1d95">تشنج الحنجرة (Stridor) والبصاق الدموي الأحمر الفاتح (Hemoptysis).</text><text x="320" y="424" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="430" width="600" height="53" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><circle cx="590" cy="452" r="14" fill="#7c3aed"/><text x="590" y="457" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text><text x="566" y="456" text-anchor="start" font-size="15" font-weight="800" fill="#4c1d95">الرعاية</text><text x="566" y="476" text-anchor="start" font-size="13" fill="#4c1d95">صيام NPO حتى يستفيق المريض ويعود منعكس التهوع.</text></svg>