<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="324" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">جرعة زائدة من الأفيون: ترتيب التصرف</text><rect x="60" y="48" width="520" height="50" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><circle cx="580" cy="64" r="14" fill="#b91c1c"/><text x="580" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="556" y="68" text-anchor="start" font-size="14" font-weight="800" fill="#b91c1c">تقييم (Assess)</text><text x="570" y="88" text-anchor="start" font-size="13" fill="#0f172a">مجرى الهواء والتنفس والدورة (ABC) أولًا</text><path d="M320 100 L320 114 M314 108 L320 115 L326 108" stroke="#64748b" stroke-width="2" fill="none"/><rect x="60" y="118" width="520" height="50" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><circle cx="580" cy="134" r="14" fill="#b91c1c"/><text x="580" y="139" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="556" y="138" text-anchor="start" font-size="14" font-weight="800" fill="#b91c1c">تدخل (Intervene)</text><text x="570" y="158" text-anchor="start" font-size="13" fill="#0f172a">أعطِ أكسجين</text><path d="M320 170 L320 184 M314 178 L320 185 L326 178" stroke="#64748b" stroke-width="2" fill="none"/><rect x="60" y="188" width="520" height="50" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><circle cx="580" cy="204" r="14" fill="#b91c1c"/><text x="580" y="209" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="556" y="208" text-anchor="start" font-size="14" font-weight="800" fill="#b91c1c">أبلغ (Make aware)</text><text x="570" y="228" text-anchor="start" font-size="13" fill="#0f172a">أخبر الطبيب</text><path d="M320 240 L320 254 M314 248 L320 255 L326 248" stroke="#64748b" stroke-width="2" fill="none"/><rect x="60" y="258" width="520" height="50" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><circle cx="580" cy="274" r="14" fill="#b91c1c"/><text x="580" y="279" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="556" y="278" text-anchor="start" font-size="14" font-weight="800" fill="#b91c1c">naloxone (Narcan)</text><text x="570" y="298" text-anchor="start" font-size="13" fill="#0f172a">جرعة أخرى عند الحاجة؛ نصف عمره قصير (1–2 ساعة) فأعد التقييم كل 60 دقيقة</text></svg>