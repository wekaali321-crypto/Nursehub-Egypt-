<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 278" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="278" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع القولون العصبي (IBS) حسب شكل البراز</text><rect x="326" y="52" width="284" height="84" rx="12" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="468" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#9a3412">IBS-C: إمساك</text><text x="468" y="102" text-anchor="middle" font-size="12.5" fill="#9a3412">براز صلب (نوع 1-2) في أكثر من</text><text x="468" y="119" text-anchor="middle" font-size="12.5" fill="#9a3412">ربع الأيام</text><rect x="30" y="52" width="284" height="84" rx="12" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="172" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#854d0e">IBS-D: إسهال</text><text x="172" y="102" text-anchor="middle" font-size="12.5" fill="#854d0e">براز سائل/رخو (نوع 6-7) في أكثر من</text><text x="172" y="119" text-anchor="middle" font-size="12.5" fill="#854d0e">ربع الأيام</text><rect x="326" y="148" width="284" height="84" rx="12" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.5"/><text x="468" y="176" text-anchor="middle" font-size="14.5" font-weight="800" fill="#5b21b6">IBS-M: مختلط</text><text x="468" y="198" text-anchor="middle" font-size="12.5" fill="#5b21b6">الاتنين بالتبادل</text><rect x="30" y="148" width="284" height="84" rx="12" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="172" y="176" text-anchor="middle" font-size="14.5" font-weight="800" fill="#334155">غير مصنّف</text><text x="172" y="198" text-anchor="middle" font-size="12.5" fill="#334155">لا ينطبق عليه أي نوع</text><text x="320" y="266" text-anchor="middle" font-size="12.5" fill="#475569">التشخيص: ألم بطن متكرر مرتبط بالتبرز + تغير في عدد المرات أو الشكل لمدة 3 شهور</text></svg>