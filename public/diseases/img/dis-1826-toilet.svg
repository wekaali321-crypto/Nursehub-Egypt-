<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 343" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="343" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التدريب على الحمام: الاستعداد والقواعد</text><rect x="20" y="52" width="600" height="51" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/><circle cx="592" cy="77.5" r="14" fill="#0e7490"/><text x="592" y="82.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="566" y="72" text-anchor="start" font-size="14" font-weight="800" fill="#0e7490">العمر</text><text x="566" y="91" text-anchor="start" font-size="12.5" fill="#0f172a">يبدأ بين 18 و24 شهراً (ليس قبل 18 شهراً ولا 15 شهراً)</text><text x="320" y="117" text-anchor="middle" font-size="14" fill="#0e7490">↓</text><rect x="20" y="121" width="600" height="68" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/><circle cx="592" cy="155.0" r="14" fill="#0e7490"/><text x="592" y="160.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="566" y="141" text-anchor="start" font-size="14" font-weight="800" fill="#0e7490">الاستعداد</text><text x="566" y="160" text-anchor="start" font-size="12.5" fill="#0f172a">يتبع أوامر بسيطة، يمشي ويجلس على المرحاض، يبقى 5-8 دقائق، يرفع</text><text x="566" y="177" text-anchor="start" font-size="12.5" fill="#0f172a">ويخلع ملابسه</text><text x="320" y="203" text-anchor="middle" font-size="14" fill="#0e7490">↓</text><rect x="20" y="207" width="600" height="51" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/><circle cx="592" cy="232.5" r="14" fill="#0e7490"/><text x="592" y="237.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="566" y="227" text-anchor="start" font-size="14" font-weight="800" fill="#0e7490">الترتيب</text><text x="566" y="246" text-anchor="start" font-size="12.5" fill="#0f172a">التحكم بالأمعاء أولاً ثم المثانة (حوالي 24 شهراً)</text><text x="320" y="272" text-anchor="middle" font-size="14" fill="#0e7490">↓</text><rect x="20" y="276" width="600" height="51" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/><circle cx="592" cy="301.5" r="14" fill="#0e7490"/><text x="592" y="306.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="566" y="296" text-anchor="start" font-size="14" font-weight="800" fill="#0e7490">المبدأ</text><text x="566" y="315" text-anchor="start" font-size="12.5" fill="#0f172a">لا تعاقب عند الخطأ: نظف واستمر</text></svg>