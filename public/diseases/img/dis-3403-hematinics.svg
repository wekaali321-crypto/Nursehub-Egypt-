<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 328" width="640" height="328" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="مكمّلات الأنيميا: حديد وB12 وحمض الفوليك"><rect width="640" height="328" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">مكمّلات الأنيميا: حديد وB12 وحمض الفوليك</text><text x="320.0" y="54" text-anchor="middle" font-size="12.5" fill="#667085">دليل سريع</text><rect x="326.0" y="68" width="302.0" height="188" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="326.0" y="68" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="326.0" y="82" width="302.0" height="14" fill="#b42318"/><text x="477.0" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الحديد (Ferrous sulfate / Iron dextran)</text><text x="616.0" y="116" text-anchor="start" font-size="12.5" fill="#1d2939">• لعلاج أنيميا نقص الحديد</text><text x="616.0" y="134" text-anchor="start" font-size="12.5" fill="#1d2939">• براز داكن/أسود = طبيعي ومتوقع (ليس</text><text x="616.0" y="152" text-anchor="start" font-size="12.5" fill="#1d2939">   نزيفًا)</text><text x="616.0" y="170" text-anchor="start" font-size="12.5" fill="#1d2939">• على معدة فارغة قبل الأدوية بساعة</text><text x="616.0" y="188" text-anchor="start" font-size="12.5" fill="#1d2939">• الكالسيوم يمنع الامتصاص</text><text x="616.0" y="206" text-anchor="start" font-size="12.5" fill="#1d2939">• عصير البرتقال يزيد الامتصاص</text><text x="616.0" y="224" text-anchor="start" font-size="12.5" fill="#1d2939">• التثقيف الصحيح: فواكه طازجة وخبز حبوب</text><text x="616.0" y="242" text-anchor="start" font-size="12.5" fill="#1d2939">   كاملة</text><rect x="12.0" y="68" width="302.0" height="98" rx="10" fill="#efe9fb" stroke="#6a4bb5" stroke-width="1.2"/><rect x="12.0" y="68" width="302.0" height="28" rx="10" fill="#6a4bb5"/><rect x="12.0" y="82" width="302.0" height="14" fill="#6a4bb5"/><text x="163.0" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">فيتامين B12 (Cyanocobalamin)</text><text x="302.0" y="116" text-anchor="start" font-size="12.5" fill="#1d2939">• لأنيميا الخبيثة (Pernicious)</text><text x="302.0" y="134" text-anchor="start" font-size="12.5" fill="#1d2939">• الجسم يفتقد العامل الداخلي فلا يمتص B12</text><text x="302.0" y="152" text-anchor="start" font-size="12.5" fill="#1d2939">• بلا امتصاص لا تتكوّن كريات الدم الحمراء</text><rect x="12.0" y="178" width="302.0" height="134" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="12.0" y="178" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="12.0" y="192" width="302.0" height="14" fill="#a86a00"/><text x="163.0" y="197" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">حمض الفوليك (Folic acid)</text><text x="302.0" y="226" text-anchor="start" font-size="12.5" fill="#1d2939">• أنيميا نقص الفوليك</text><text x="302.0" y="244" text-anchor="start" font-size="12.5" fill="#1d2939">• أدوية السلفا تقلل امتصاصه</text><text x="302.0" y="262" text-anchor="start" font-size="12.5" fill="#1d2939">• مع السلفا: مكمل 1 ملغ/يوم</text><text x="302.0" y="280" text-anchor="start" font-size="12.5" fill="#1d2939">• الحامل: يمنع عيوب الأنبوب العصبي</text><text x="302.0" y="298" text-anchor="start" font-size="12.5" fill="#1d2939">• يؤخذ قبل الحمل</text></svg>