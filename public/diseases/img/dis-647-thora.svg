<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 386" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="386" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">البزل الجنبي (Thoracentesis)</text><rect x="20" y="54" width="600" height="72" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><circle cx="590" cy="76" r="14" fill="#0d9488"/><text x="590" y="81" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="566" y="80" text-anchor="end" font-size="15" font-weight="800" fill="#134e4a">قبل</text><text x="566" y="100" text-anchor="end" font-size="13" fill="#134e4a">أوقف مضادات التجلط والصفيحات (aspirin، clopidogrel، warfarin،</text><text x="566" y="119" text-anchor="end" font-size="13" fill="#134e4a">heparin/enoxaparin) بأمر الطبيب، وقّع الموافقة، أشعة صدر قبل وبعد.</text><text x="320" y="142" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="148" width="600" height="53" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><circle cx="590" cy="170" r="14" fill="#0d9488"/><text x="590" y="175" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="566" y="174" text-anchor="end" font-size="15" font-weight="800" fill="#134e4a">الإجراء</text><text x="566" y="194" text-anchor="end" font-size="13" fill="#134e4a">يضع الطبيب إبرة بين الأضلاع ويسحب السائل.</text><text x="320" y="217" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="223" width="600" height="72" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><circle cx="590" cy="245" r="14" fill="#0d9488"/><text x="590" y="250" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="566" y="249" text-anchor="end" font-size="15" font-weight="800" fill="#134e4a">بعد</text><text x="566" y="269" text-anchor="end" font-size="13" fill="#134e4a">تنفس عميق لإعادة تمدد الرئة؛ استلقِ على الجانب السليم ليبقى المصاب</text><text x="566" y="288" text-anchor="end" font-size="13" fill="#134e4a">لأعلى.</text><text x="320" y="311" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="317" width="600" height="53" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><circle cx="590" cy="339" r="14" fill="#0d9488"/><text x="590" y="344" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="566" y="343" text-anchor="end" font-size="15" font-weight="800" fill="#134e4a">مضاعفة: استرواح</text><text x="566" y="363" text-anchor="end" font-size="13" fill="#134e4a">عدم تماثل الحركة ونقص أصوات التنفس، رنين مفرط، انحراف القصبة — بلّغ.</text></svg>