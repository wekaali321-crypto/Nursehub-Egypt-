<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 382" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="382" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">السل: العلامات والتشخيص ونقاط تمريضية</text><rect x="325" y="48" width="295" height="164" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">العلامات</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">تعرق ليلي</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">فقدان شهية ووزن</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">سعال مع نفث دم</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">ضيق نفس</text><text x="610" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">حمى وقشعريرة</text><rect x="20" y="48" width="295" height="164" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">التشخيص</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">اختبار الجلد (ماントو) داخل الأدمة: قراءة</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">بعد 48–72 ساعة</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">تصلب 15 مم فأكثر = إيجابي (الحد يختلف حسب</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">الخطورة)</text><text x="305" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">أشعة صدر ومزرعة بلغم للنشط</text><text x="305" y="200" text-anchor="start" font-size="12.5" fill="#1e293b">بلغم صباحي معقم 3 أيام متتالية</text><rect x="325" y="222" width="295" height="144" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="222" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5 نقاط</text><text x="610" y="274" text-anchor="start" font-size="12.5" fill="#1e293b">الأدوية 6–12 شهرًا</text><text x="610" y="294" text-anchor="start" font-size="12.5" fill="#1e293b">N95 دائمًا للطاقم</text><text x="610" y="314" text-anchor="start" font-size="12.5" fill="#1e293b">فحص الأسرة</text><text x="610" y="334" text-anchor="start" font-size="12.5" fill="#1e293b">عينات كل 2–4 أسابيع</text><text x="610" y="354" text-anchor="start" font-size="12.5" fill="#1e293b">3 مزارع سلبية في 3 أيام مختلفة = غير معدي</text><rect x="20" y="222" width="295" height="144" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><rect x="20" y="222" width="295" height="30" rx="12" fill="#9333ea"/><text x="167.5" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">احتياطات</text><text x="305" y="274" text-anchor="start" font-size="12.5" fill="#1e293b">هوائية: غرفة ضغط سالب</text><text x="305" y="294" text-anchor="start" font-size="12.5" fill="#1e293b">معظم المصابين لا يتطور لديهم مرض نشط</text>
</svg>
