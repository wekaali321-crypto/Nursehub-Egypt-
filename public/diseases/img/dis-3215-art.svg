<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 291" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="291" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">مضادات الفيروسات القهقرية: فئات الآلية</text><rect x="383.6" y="44" width="236.4" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="501.8" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">الفئة</text><rect x="20.0" y="44" width="363.6" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="201.8" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">ما تفعله</text><rect x="383.6" y="74.5" width="236.4" height="30.5" fill="#fff" stroke="#cbd5e1"/><text x="501.8" y="93.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">مثبطات البروتياز (-navir)</text><rect x="20.0" y="74.5" width="363.6" height="30.5" fill="#fff" stroke="#cbd5e1"/><text x="201.8" y="93.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تمنع إنزيم البروتياز فلا تنضج الفيروسات الجديدة</text><rect x="383.6" y="105" width="236.4" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="501.8" y="124.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">مثبطات النسخ العكسي</text><text x="501.8" y="140.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">النوكليوزيدية (NRTI)</text><rect x="20.0" y="105" width="363.6" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="201.8" y="124.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تمنع تحوّل مادة HIV إلى DNA في الخلية الجديدة</text><text x="201.8" y="140.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">فلا تتكوّن نسخ جديدة</text><rect x="383.6" y="152" width="236.4" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="501.8" y="171.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">مثبطات النسخ العكسي غير</text><text x="501.8" y="187.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">النوكليوزيدية (NNRTI)</text><rect x="20.0" y="152" width="363.6" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="201.8" y="171.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">ترتبط بالإنزيم نفسه وتعطّل تحويله للـDNA</text><text x="201.8" y="187.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الفيروسي</text><rect x="383.6" y="199" width="236.4" height="30.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="501.8" y="218.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">مثبطات الدخول</text><rect x="20.0" y="199" width="363.6" height="30.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="201.8" y="218.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تمنع التصاق/اندماج الفيروس بالخلية المضيفة</text><rect x="383.6" y="229.5" width="236.4" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="501.8" y="256.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">مثبطات الإنتغراز (Integrase)</text><rect x="20.0" y="229.5" width="363.6" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="201.8" y="248.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تمنع إدخال المادة الوراثية للفيروس في DNA</text><text x="201.8" y="265.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الخلية</text></svg>