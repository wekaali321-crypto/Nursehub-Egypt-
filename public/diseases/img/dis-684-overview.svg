<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="452" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">اللوكيميا: ملخص</text>
<rect x="14" y="44" width="300" height="120" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><rect x="14" y="44" width="300" height="26" rx="10" fill="#0369a1"/><text x="164.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >اللوكيميا</text><text x="304" y="89" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >Leuk = كرات بيضاء، emia = دم</text><text x="304" y="110" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >فرط إنتاج كرات بيضاء يزاحم RBC والصفائح</text><rect x="326" y="44" width="300" height="120" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><rect x="326" y="44" width="300" height="26" rx="10" fill="#16a34a"/><text x="476.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >التحاليل</text><text x="616" y="89" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >WBC مرتفعة</text><text x="616" y="110.5" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >Hb وHct منخفضان</text><text x="616" y="132.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >الصفائح منخفضة</text><rect x="14" y="176" width="300" height="150" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><rect x="14" y="176" width="300" height="26" rx="10" fill="#7c3aed"/><text x="164.0" y="194" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >الأنواع</text><text x="304" y="221" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >AML: نخاعي حاد (أكثر عند الأطفال)</text><text x="304" y="242" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >CML: نخاعي مزمن</text><text x="304" y="263" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >ALL: لمفاوي حاد</text><text x="304" y="284" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >CLL: لمفاوي مزمن</text><rect x="326" y="176" width="300" height="150" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><rect x="326" y="176" width="300" height="26" rx="10" fill="#ea580c"/><text x="476.0" y="194" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >حاد مقابل مزمن</text><text x="616" y="221" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >حاد (AML, ALL): خلايا غير ناضجة، بداية</text><text x="616" y="238" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >  مفاجئة، شائع بالأطفال</text><text x="616" y="258" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >مزمن (CML, CLL): خلايا ناضجة ضعيفة الوظيفة،</text><text x="616" y="275" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >  تدريجي، كبار السن</text><rect x="14" y="338" width="612" height="100" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><rect x="14" y="338" width="612" height="26" rx="10" fill="#0f766e"/><text x="320.0" y="356" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >التشخيص والعلاج</text><text x="616" y="383" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >التشخيص: خزعة نخاع العظم من الشوكة الحرقفية الخلفية</text><text x="616" y="404.5" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >العلاج: إشعاع وكيماوي، وأحياناً زرع خلايا جذعية</text>
</svg>
