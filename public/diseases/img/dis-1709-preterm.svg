<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 285" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="285" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">الولادة المبكرة: الأسباب (DIPS) والعلاج</text><rect x="20" y="50" width="142" height="150" rx="12" fill="#fecaca"/><text x="91" y="90" text-anchor="middle" font-size="34" font-weight="800" fill="#0f172a">D</text><text x="91" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">رحم متمدد</text><text x="91" y="150" text-anchor="middle" font-size="10" font-weight="500" fill="#334155">جنين كبير، سائل أمنيوس</text><text x="91" y="166" text-anchor="middle" font-size="10" font-weight="500" fill="#334155">ي زائد، توأم، سكري، تسمم</text><text x="91" y="182" text-anchor="middle" font-size="10" font-weight="500" fill="#334155">، قلب، أنيميا</text><rect x="172" y="50" width="142" height="150" rx="12" fill="#fed7aa"/><text x="243" y="90" text-anchor="middle" font-size="34" font-weight="800" fill="#0f172a">I</text><text x="243" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">عدوى</text><text x="243" y="150" text-anchor="middle" font-size="10" font-weight="500" fill="#334155">بول، تناسلية، التهاب ا</text><text x="243" y="166" text-anchor="middle" font-size="10" font-weight="500" fill="#334155">للثة</text><text x="243" y="182" text-anchor="middle" font-size="10" font-weight="500" fill="#334155"></text><rect x="324" y="50" width="142" height="150" rx="12" fill="#fde68a"/><text x="395" y="90" text-anchor="middle" font-size="34" font-weight="800" fill="#0f172a">P</text><text x="395" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">انفصال المشيمة</text><text x="395" y="150" text-anchor="middle" font-size="10" font-weight="500" fill="#334155">Placental abruption</text><text x="395" y="166" text-anchor="middle" font-size="10" font-weight="500" fill="#334155"></text><text x="395" y="182" text-anchor="middle" font-size="10" font-weight="500" fill="#334155"></text><rect x="476" y="50" width="142" height="150" rx="12" fill="#bbf7d0"/><text x="547" y="90" text-anchor="middle" font-size="34" font-weight="800" fill="#0f172a">S</text><text x="547" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">إجهاد/عوامل جسدية</text><text x="547" y="150" text-anchor="middle" font-size="10" font-weight="500" fill="#334155">قصر عنق الرحم، تدخين، </text><text x="547" y="166" text-anchor="middle" font-size="10" font-weight="500" fill="#334155">منشطات، سوابق ولادة مبكر</text><text x="547" y="182" text-anchor="middle" font-size="10" font-weight="500" fill="#334155">ة</text><text x="320" y="235" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">الدواء: مضاد حيوي (بنسلين) + ستيرويد (betamethasone) + موسّع رحم (Tocolytic) + كبريتات مغنيسيوم</text><text x="320" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">20 إلى 37 أسبوعًا = ولادة مبكرة، وقبل 20 أسبوعًا = إجهاض تلقائي</text>
</svg>
