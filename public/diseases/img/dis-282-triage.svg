<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="300" rx="16" fill="#f8fafc"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="320" y="26" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">طوارئ ارتفاع الضغط: Urgency ولا Emergency؟</text><rect x="190" y="42" width="260" height="44" rx="10" fill="#0f172a" stroke="none"/><text x="320" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">قيس الضغط: 180/110 أو أكتر</text><rect x="40" y="125" width="260" height="45" rx="10" fill="#eab308" stroke="none"/><text x="170" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#422006">أعراض تلف أعضاء (EOD)؟</text><text x="170" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#422006">لا</text><rect x="340" y="125" width="260" height="45" rx="10" fill="#dc2626" stroke="none"/><text x="470" y="145" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">أعراض تلف أعضاء (EOD)؟</text><text x="470" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">نعم</text><line x1="270" y1="86" x2="170" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><line x1="370" y1="86" x2="470" y2="125" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="40" y="195" width="260" height="85" rx="10" fill="#fef9c3" stroke="none"/><text x="170" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">Urgency</text><text x="170" y="237" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">خفض تدريجي خلال 24–48 ساعة</text><text x="170" y="255" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">دواء فموي + عيادة باطنة</text><text x="170" y="272" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">الخروج بعد أقل من 160/100 (المصدر)</text><rect x="340" y="195" width="260" height="85" rx="10" fill="#fee2e2" stroke="none"/><text x="470" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Emergency</text><text x="470" y="237" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">خفض عاجل بالمستشفى (IV)</text><text x="470" y="255" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">مراقبة + نائب القلب</text><text x="470" y="272" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">EOD: صداع+تشوش، تشنج، ألم صدر، وذمة رئة</text><line x1="170" y1="170" x2="170" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><line x1="470" y1="170" x2="470" y2="195" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/></svg>