<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="380" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">ضغط عالي جداً (180/120 فأكتر): ماذا تفعل؟</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="170" y="45" width="300" height="40" rx="10" fill="#0f172a"/><text x="320" y="70" fill="#fff">أعد القياس بالطريقة الصحيحة + بلّغ الطبيب</text>
    <path d="M320 85 V105" stroke="#64748b" stroke-width="3"/>
    <rect x="170" y="105" width="300" height="46" rx="10" fill="#fef9c3" stroke="#eab308"/><text x="320" y="126" fill="#422006">هل في تلف عضو؟</text><text x="320" y="143" font-size="11" fill="#422006">ألم صدر، ضعف، تشوش نظر، ضيق نفس، تشنج، تغير وعي</text>
    <path d="M250 151 L130 185 M390 151 L510 185" stroke="#64748b" stroke-width="3"/>
    <rect x="25" y="185" width="290" height="130" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="170" y="208" fill="#7f1d1d">نعم: طارئ (Emergency)</text>
    <text x="170" y="232" font-size="12" fill="#450a0a" font-weight="600">رعاية مركزة ومونيتور وخط وريدي</text>
    <text x="170" y="252" font-size="12" fill="#450a0a" font-weight="600">أدوية وريدية بأمر الطبيب</text>
    <text x="170" y="272" font-size="12" fill="#450a0a" font-weight="600">خفض MAP بحد أقصى 25% في أول ساعة</text>
    <text x="170" y="292" font-size="12" fill="#450a0a" font-weight="600">قياس كل 30 دقيقة أو أقل</text>
    <rect x="325" y="185" width="290" height="130" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="470" y="208" fill="#14532d">لا: Urgency</text>
    <text x="470" y="232" font-size="12" fill="#14532d" font-weight="600">راحة 5–30 دقيقة وأعد القياس</text>
    <text x="470" y="252" font-size="12" fill="#14532d" font-weight="600">أدوية فموية بأمر الطبيب</text>
    <text x="470" y="272" font-size="12" fill="#14532d" font-weight="600">لا داعي لخفض سريع</text>
    <text x="470" y="292" font-size="12" fill="#14532d" font-weight="600">متابعة وتعديل العلاج</text>
    <rect x="25" y="326" width="590" height="42" rx="10" fill="#fff7ed" stroke="#f97316"/><text x="320" y="352" font-size="12" fill="#7c2d12">تجنّب Nifedipine تحت اللسان؛ الخفض السريع المفاجئ نفسه خطر</text>
  </g>
</svg>
