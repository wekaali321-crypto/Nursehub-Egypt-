<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 403" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="403" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">انفصال الشبكية (Retinal Detachment)</text><text x="320" y="52" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b">انفصال الشبكية عن جدار العين الخلفي = فقد الرؤية</text><path d="M180 70 A95 95 0 1 0 180 230" fill="none" stroke="#0e7490" stroke-width="5"/><circle cx="250" cy="150" r="80" fill="#fef3c7" stroke="#0e7490" stroke-width="4"/><path d="M215 90 Q300 120 255 180" fill="none" stroke="#dc2626" stroke-width="5"/><text x="250" y="150" text-anchor="middle" font-size="12" font-weight="400" fill="#475569">فراغ زجاجي</text><line x1="330" y1="120" x2="290" y2="135" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/><text x="440" y="120" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">الشبكية منفصلة عن الخلف</text><text x="500" y="170" text-anchor="middle" font-size="12.5" font-weight="400" fill="#475569">السبب: رضح الرأس (ضربة، حادث سيارة)</text><rect x="327" y="250" width="293" height="140.625" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M327 260a10 10 0 0 1 10-10h273a10 10 0 0 1 10 10v22h-293z" fill="#b91c1c"/><text x="473.5" y="271" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الأعراض (الأكثر اختباراً)</text><text x="610" y="296.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">•</text><text x="598" y="296.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">رؤية كشبكة الشعر / ستارة تغطي نصف الرؤية</text><text x="610" y="317.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">•</text><text x="598" y="317.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">عوائم وخيوط عنكبوت (Floaters)</text><text x="610" y="338.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">•</text><text x="598" y="338.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ومضات ضوئية (Flashes)</text><rect x="20" y="250" width="293" height="140.625" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><path d="M20 260a10 10 0 0 1 10-10h273a10 10 0 0 1 10 10v22h-293z" fill="#c2410c"/><text x="166.5" y="271" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">بعد الإصلاح الجراحي: تجنب</text><text x="303" y="296.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">•</text><text x="291" y="296.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الإجهاد على المرحاض (لا للإمساك)</text><text x="303" y="317.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">•</text><text x="291" y="317.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">فرك العين وحكها</text><text x="303" y="338.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">•</text><text x="291" y="338.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أنشطة تجهد العين: قراءة، تلفاز، حاسوب</text><text x="303" y="359.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">•</text><text x="291" y="359.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الإبلاغ فوراً عن فقد رؤية جديد/مفاجئ، ألم،</text><text x="291" y="378" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ومضات</text></svg>