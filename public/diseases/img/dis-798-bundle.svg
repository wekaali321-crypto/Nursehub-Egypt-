<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 394" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="394" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">حزمة منع عدوى موضع الجراحة (SSI)</text><rect x="40" y="48" width="560" height="66" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><circle cx="576" cy="81" r="14" fill="#2563eb"/><text x="576" y="86" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="552" y="69" text-anchor="start" font-size="14" font-weight="800" fill="#2563eb">قبل</text><text x="552" y="87" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">استحمام، علاج عدوى بعيدة، توقف التدخين، ضبط السكر، لا حلاقة بالشفرة</text><text x="552" y="103" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">(مقص كهربائي إن لزم)</text><text x="320" y="130" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="136" width="560" height="66" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.8"/><circle cx="576" cy="169" r="14" fill="#16a34a"/><text x="576" y="174" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="552" y="157" text-anchor="start" font-size="14" font-weight="800" fill="#16a34a">مضاد وقائي</text><text x="552" y="175" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">جرعة مناسبة خلال 60 دقيقة قبل الشق (حتى 120 للفانكو والفلوروكينولون)</text><text x="552" y="191" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">وليس بعد الجراحة روتينياً</text><text x="320" y="218" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="224" width="560" height="66" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.8"/><circle cx="576" cy="257" r="14" fill="#ea580c"/><text x="576" y="262" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="552" y="245" text-anchor="start" font-size="14" font-weight="800" fill="#ea580c">أثناء</text><text x="552" y="263" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">مطهر جلدي (كحول + كلورهيكسيدين)، تعقيم وأسيبسيس، حرارة مناسبة، أكسجين،</text><text x="552" y="279" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">حد من الحركة بالغرفة</text><text x="320" y="306" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="312" width="560" height="66" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><circle cx="576" cy="345" r="14" fill="#7c3aed"/><text x="576" y="350" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="552" y="333" text-anchor="start" font-size="14" font-weight="800" fill="#7c3aed">بعد</text><text x="552" y="351" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">غيار معقم 24–48 ساعة، غسيل اليدين، مراقبة الجرح، تحكم بالسكر، إزالة</text><text x="552" y="367" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">القسطرة مبكراً</text></svg>