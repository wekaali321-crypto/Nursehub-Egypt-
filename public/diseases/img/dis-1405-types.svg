<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="366" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع سلس البول</text><rect x="16" y="56" width="608" height="90" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><rect x="16" y="56" width="608" height="30" rx="12" fill="#ea580c"/><text x="320" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">U إلحاحي Urge</text><text x="614" y="108" text-anchor="end" font-size="13" fill="#7c2d12">رغبة مفاجئة قوية في التبول</text><text x="614" y="127" text-anchor="end" font-size="13" fill="#7c2d12">يُعرف بالمثانة العصبية (فقدان تحكم)</text><rect x="16" y="158" width="608" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><rect x="16" y="158" width="608" height="30" rx="12" fill="#7c3aed"/><text x="320" y="179" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">S إجهادي Stress</text><text x="614" y="210" text-anchor="end" font-size="13" fill="#4c1d95">ضغط يسبب تسرب البول</text><text x="614" y="229" text-anchor="end" font-size="13" fill="#4c1d95">سعال، ضحك، عطس، جري، قفز</text><rect x="16" y="260" width="608" height="90" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><rect x="16" y="260" width="608" height="30" rx="12" fill="#0d9488"/><text x="320" y="281" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">O فيضي Overflow</text><text x="614" y="312" text-anchor="end" font-size="13" fill="#134e4a">تنقيط مستمر</text><text x="614" y="331" text-anchor="end" font-size="13" fill="#134e4a">إفراغ غير كامل</text></svg>