<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="400" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">نسيان أقراص COC: التصرف</text>
<rect x="20" y="44" width="600" height="72" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="44" width="160" height="72" rx="10" fill="#15803d"/><text x="540" y="85" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">نسيت قرص واحد</text><text x="448" y="67" text-anchor="end" font-size="13" fill="#0f172a">خديه فور ما تفتكري وكملي اللي بعده عادي</text><text x="448" y="85" text-anchor="end" font-size="13" fill="#0f172a">لو افتكرتي وقت القرص الجديد: خدي الاثنين معاً</text><text x="448" y="103" text-anchor="end" font-size="13" fill="#0f172a">لا حاجة لوسيلة إضافية</text><rect x="20" y="124" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="124" width="160" height="54" rx="10" fill="#d97706"/><text x="540" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">نسيت قرصين أو أكتر</text><text x="448" y="147" text-anchor="end" font-size="13" fill="#0f172a">اتركي الفائت وخدي آخر قرص فاتك وكملي</text><text x="448" y="165" text-anchor="end" font-size="13" fill="#0f172a">أوقفي العلاقة أو استخدمي وسيلة إضافية 7 أيام</text><rect x="20" y="186" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="186" width="160" height="54" rx="10" fill="#0369a1"/><text x="540" y="218" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">متبقي في الشريط أقل من 7</text><text x="448" y="209" text-anchor="end" font-size="13" fill="#0f172a">أنهي الأقراص المنسية ثم ابدئي الشريط التالي</text><text x="448" y="227" text-anchor="end" font-size="13" fill="#0f172a">فوراً بدون راحة 7 أيام</text><rect x="20" y="248" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="248" width="160" height="54" rx="10" fill="#7c3aed"/><text x="540" y="280" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">متبقي 7 أو أكتر</text><text x="448" y="271" text-anchor="end" font-size="13" fill="#0f172a">أنهي الأقراص ثم توقف 7 أيام</text><text x="448" y="289" text-anchor="end" font-size="13" fill="#0f172a">وبعدها الشريط الجديد</text><rect x="20" y="310" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="310" width="160" height="54" rx="10" fill="#b91c1c"/><text x="540" y="342" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">علاقة خلال 7 أيام</text><text x="448" y="333" text-anchor="end" font-size="13" fill="#0f172a">علاقة قبل بدء الحبوب بأقل من 7 أيام</text><text x="448" y="351" text-anchor="end" font-size="13" fill="#0f172a">تحتاج وسيلة طوارئ فورية مثل Contraplan II</text><text x="320" y="384" text-anchor="middle" font-size="12" fill="#64748b">راجع التحديث في الدليل للتوصيات الحالية</text>
</svg>
