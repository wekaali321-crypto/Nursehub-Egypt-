<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="360" rx="14" fill="#f7fafc" stroke="#cbd5e0"/>
<text x="320" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1a365d">أنواع الغرز الأساسية (منظر علوي)</text>
<g stroke-width="2.5" fill="none">
<g transform="translate(20,50)"><rect width="140" height="210" rx="8" fill="#fde8d8" stroke="#c05621"/><line x1="70" y1="15" x2="70" y2="195" stroke="#c53030" stroke-width="4"/>
<path d="M45 40H95M45 90H95M45 140H95" stroke="#2b6cb0"/><text x="70" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3748" stroke="none">بسيطة منفصلة</text><text x="70" y="254" text-anchor="middle" font-size="12" fill="#4a5568" stroke="none">الأجمل شكلاً</text></g>
<g transform="translate(180,50)"><rect width="140" height="210" rx="8" fill="#fde8d8" stroke="#c05621"/><line x1="70" y1="15" x2="70" y2="195" stroke="#c53030" stroke-width="4"/>
<path d="M30 50H110M52 50H88M30 130H110M52 130H88" stroke="#2b6cb0"/><path d="M30 50V58M110 50V58M30 130V138M110 130V138" stroke="#2b6cb0"/><text x="70" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3748" stroke="none">مرتبة رأسية</text><text x="70" y="254" text-anchor="middle" font-size="12" fill="#4a5568" stroke="none">جرح مفتوح/ينزف/مفصل</text></g>
<g transform="translate(340,50)"><rect width="140" height="210" rx="8" fill="#fde8d8" stroke="#c05621"/><line x1="70" y1="15" x2="70" y2="195" stroke="#c53030" stroke-width="4"/>
<path d="M40 40H100V80H40Z M40 120H100V160H40Z" stroke="#2b6cb0"/><text x="70" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3748" stroke="none">مرتبة أفقية</text><text x="70" y="254" text-anchor="middle" font-size="12" fill="#4a5568" stroke="none">كف/باطن قدم/عضلة</text></g>
<g transform="translate(500,50)"><rect width="120" height="210" rx="8" fill="#fde8d8" stroke="#c05621"/><path d="M60 20L20 150H100Z" stroke="#c53030" stroke-width="4"/>
<path d="M60 150V70H48" stroke="#2b6cb0"/><circle cx="60" cy="70" r="3" fill="#2b6cb0"/><text x="60" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#2d3748" stroke="none">نصف مدفونة</text><text x="60" y="254" text-anchor="middle" font-size="12" fill="#4a5568" stroke="none">رفرف مثلث</text></g></g>
<text x="320" y="300" text-anchor="middle" font-size="14" fill="#2d3748">الخط الأحمر = الجرح، الأزرق = الخيط. تحت الجلد المستمرة (Subcuticular) للجرح النظيف بدون علامات.</text>
<text x="320" y="326" text-anchor="middle" font-size="13" fill="#4a5568">الجرح العميق: عضلة ثم تحت الجلد (فيكريل 3/0 مستدير) ثم الجلد (بروبلين 4/0 قاطع)</text></svg>
