  <rect x="20" y="50" width="600" height="60" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/><text x="320" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">تبدأ بعد التئام الجروح تمامًا وتستمر نحو 12 شهرًا؛ الخطر الأساسي ليس العدوى</text><rect x="430" y="125" width="190" height="180" rx="10" fill="#fce7f3" stroke="#cbd5e1" stroke-width="1.5"/><text x="525" y="147" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">W: مرطب مائي</text><text x="608" y="171" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• Water-based lotion</text><text x="608" y="196" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• يخفف الشد والجفاف</text><rect x="225" y="125" width="190" height="180" rx="10" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="147" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">W: ملابس ضاغطة</text><text x="403" y="171" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• Wear pressure garments</text><text x="403" y="196" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• تقلل التليف</text><rect x="20" y="125" width="190" height="180" rx="10" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="115" y="147" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">E: تمارين يوميًا</text><text x="198" y="171" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• Exercise: مدى الحركة</text><text x="198" y="196" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• وحماية الجلد الجديد من الشمس</text>
