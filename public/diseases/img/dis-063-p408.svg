<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 357" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="357" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">المتلازمة اليوريمية: ماذا يحدث وماذا نفعل</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="204.59999999999997" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#0ea5e9"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">السبب والفيزيولوجيا</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• الكلى لا تفلتر</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">النفايات النيتروجينية</text><text x="612" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• تراكم الفضلات + اختلال</text><text x="612" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">الكهارل + تغير الوعي +</text><text x="612" y="176.8" text-anchor="start" font-size="13" fill="#0f172a">قلة البول</text><text x="612" y="200" text-anchor="start" font-size="13" fill="#0f172a">• الأسباب: CKD، AKI،</text><text x="612" y="218.2" text-anchor="start" font-size="13" fill="#0f172a">السكري، رضوض الكلى</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="204.59999999999997" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#f59e0b"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الفحص</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• هضمي/بولي: قلة البول،</text><text x="408.66666666666663" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">دم بالبول، غثيان وقيء،</text><text x="408.66666666666663" y="135.4" text-anchor="start" font-size="13" fill="#0f172a">التهاب فم، إسهال أو</text><text x="408.66666666666663" y="153.6" text-anchor="start" font-size="13" fill="#0f172a">إمساك</text><text x="408.66666666666663" y="176.8" text-anchor="start" font-size="13" fill="#0f172a">• قلب: ضغط منخفض أو</text><text x="408.66666666666663" y="195" text-anchor="start" font-size="13" fill="#0f172a">مرتفع، اضطراب نظم</text><text x="408.66666666666663" y="218.20000000000002" text-anchor="start" font-size="13" fill="#0f172a">• عصبي: تغير الوعي</text><text x="408.66666666666663" y="241.4" text-anchor="start" font-size="13" fill="#0f172a">• دم: أنيميا Hb &lt; 8</text><rect x="20" y="54" width="193.33333333333334" height="204.59999999999997" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">التدبير</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• غسيل</text><text x="205.33333333333334" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">دموي/بريتوني/ترشيح مستمر</text><text x="205.33333333333334" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• calcitriol وخافضات</text><text x="205.33333333333334" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">الفوسفات وEPO</text><text x="205.33333333333334" y="181.8" text-anchor="start" font-size="13" fill="#0f172a">• زرع كلية</text><text x="205.33333333333334" y="205" text-anchor="start" font-size="13" fill="#0f172a">• حمية: ملح وفوسفات</text><text x="205.33333333333334" y="223.2" text-anchor="start" font-size="13" fill="#0f172a">وبوتاسيوم قليلة</text><rect x="20" y="268.59999999999997" width="600" height="74" rx="10" fill="#6366f1" fill-opacity="0.13" stroke="#6366f1" stroke-width="1.5"/><text x="610" y="288.59999999999997" text-anchor="start" font-size="13.5" font-weight="800" fill="#6366f1">وسيلة حفظ</text><text x="610" y="308.59999999999997" text-anchor="start" font-size="13" fill="#0f172a">تذكّر بكلمة (فضلات): ف=فيء/قيء وغثيان، ض=ضغط متقلب، ل=لخبطة وعي، ا=أنيميا،</text><text x="610" y="327.59999999999997" text-anchor="start" font-size="13" fill="#0f172a">ت=تغير نظم القلب.</text></svg>
