<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="270" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مؤشرات عضلة القلب: متى ترتفع ومتى ترجع</text>
<g font-size="13" font-weight="700">
<text x="620" y="75" text-anchor="end" fill="#0f172a">ميوجلوبين (الأبكر)</text>
<rect x="400" y="60" width="40" height="20" rx="4" fill="#fb923c"/><text x="330" y="75" fill="#475569" font-size="12">يرتفع 1–2 س → يرجع خلال يوم</text>
<text x="620" y="125" text-anchor="end" fill="#0f172a">CK / CK-MB</text>
<rect x="390" y="110" width="60" height="20" rx="4" fill="#f59e0b"/><text x="320" y="125" fill="#475569" font-size="12">يرتفع 2–4 س → يرجع خلال ~3 أيام</text>
<text x="620" y="175" text-anchor="end" fill="#0f172a">تروبونين I / T (الأدق)</text>
<rect x="380" y="160" width="180" height="20" rx="4" fill="#dc2626"/><text x="260" y="175" fill="#475569" font-size="12">يرتفع 2–4 س → يفضل مرتفعاً حتى ~أسبوع</text>
</g>
<text x="320" y="225" text-anchor="middle" font-size="13" fill="#334155">القراءة الأولى المبكرة ممكن تطلع طبيعية: تتكرر حسب بروتوكول الألم الصدري</text>
<text x="320" y="248" text-anchor="middle" font-size="12" fill="#64748b">أرقام الحدود تختلف حسب جهاز المعمل (hs-Troponin بوحدات ng/L)</text>
</svg>