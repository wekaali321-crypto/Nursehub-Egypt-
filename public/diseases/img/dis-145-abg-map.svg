<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="360" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >خريطة اضطرابات الحموضة (pH / PaCO₂ / HCO₃)</text><text x="600" y="50" text-anchor="start" font-size="13" font-weight="800" fill="#64748b" >الاضطراب</text><text x="480" y="50" text-anchor="middle" font-size="13" font-weight="800" fill="#64748b" >pH</text><text x="395" y="50" text-anchor="middle" font-size="13" font-weight="800" fill="#64748b" >PaCO₂</text><text x="300" y="50" text-anchor="middle" font-size="13" font-weight="800" fill="#64748b" >HCO₃</text><text x="135" y="50" text-anchor="middle" font-size="13" font-weight="800" fill="#64748b" >المصدر</text><rect x="20" y="60" width="600" height="58" rx="12" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/><text x="600" y="94" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a" >حماض تنفسي</text><text x="480" y="94" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >↓</text><text x="395" y="94" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >↑</text><text x="300" y="94" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >↑ تعويض</text><text x="147" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#334155" >حبس CO₂ (COPD، قمع التنفس)</text><rect x="20" y="126" width="600" height="58" rx="12" fill="#ffedd5" stroke="#cbd5e1" stroke-width="1.5"/><text x="600" y="160" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a" >حماض أيضي</text><text x="480" y="160" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >↓</text><text x="395" y="160" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >↓ تعويض</text><text x="300" y="160" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >↓</text><text x="147" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#334155" >خسارة قلوي أو زيادة حمض</text><rect x="20" y="192" width="600" height="58" rx="12" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.5"/><text x="600" y="226" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a" >قلاء تنفسي</text><text x="480" y="226" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >↑</text><text x="395" y="226" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >↓</text><text x="300" y="226" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >↓ تعويض</text><text x="147" y="226" text-anchor="middle" font-size="11" font-weight="700" fill="#334155" >فرط تهوية: قلق، ألم، ارتفاع</text><rect x="20" y="258" width="600" height="58" rx="12" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="600" y="292" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a" >قلاء أيضي</text><text x="480" y="292" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >↑</text><text x="395" y="292" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >↑ تعويض</text><text x="300" y="292" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >↑</text><text x="147" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#334155" >قيء، مدرّات، فقد حمض</text><text x="320" y="336" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569" >القاعدة: لو pH ↓ والـ CO₂ ↑ = تنفسي. لو pH ↓ والـ HCO₃ ↓ = أيضي. والعضو الآخر يحاول التعويض.</text>
</svg>
