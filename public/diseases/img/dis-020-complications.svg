<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="330" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مضاعفات السكر على أعضاء الجسم</text>
  <g font-size="13" text-anchor="middle" font-weight="700">
    <rect x="240" y="50" width="160" height="40" rx="10" fill="#0f172a"/><text x="320" y="75" fill="#fff">ارتفاع السكر المزمن</text>
    <rect x="460" y="60" width="160" height="56" rx="10" fill="#fee2e2"/><text x="540" y="82" fill="#991b1b">العين</text><text x="540" y="102" font-size="11" font-weight="400" fill="#7f1d1d">اعتلال شبكية، مياه بيضا/زرقا</text>
    <rect x="20" y="60" width="160" height="56" rx="10" fill="#e0e7ff"/><text x="100" y="82" fill="#3730a3">الأعصاب</text><text x="100" y="102" font-size="11" font-weight="400" fill="#312e81">تنميل، حرقان، سكتة</text>
    <rect x="460" y="130" width="160" height="56" rx="10" fill="#fef3c7"/><text x="540" y="152" fill="#92400e">القلب والشرايين</text><text x="540" y="172" font-size="11" font-weight="400" fill="#78350f">ذبحة، جلطة، فشل قلب</text>
    <rect x="20" y="130" width="160" height="56" rx="10" fill="#dcfce7"/><text x="100" y="152" fill="#166534">الكلى</text><text x="100" y="172" font-size="11" font-weight="400" fill="#14532d">اعتلال كلوي، التهاب بول</text>
    <rect x="460" y="200" width="160" height="56" rx="10" fill="#fce7f3"/><text x="540" y="222" fill="#9d174d">الجلد والقدم</text><text x="540" y="242" font-size="11" font-weight="400" fill="#831843">التئام بطيء، قدم سكري</text>
    <rect x="20" y="200" width="160" height="56" rx="10" fill="#cffafe"/><text x="100" y="222" fill="#155e75">الهضمي</text><text x="100" y="242" font-size="11" font-weight="400" fill="#164e63">شلل المعدة، كبد دهني</text>
    <rect x="240" y="270" width="160" height="44" rx="10" fill="#ede9fe"/><text x="320" y="290" fill="#5b21b6">الأعضاء التناسلية</text><text x="320" y="306" font-size="11" font-weight="400" fill="#4c1d95">ضعف، حكة، فطريات</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2"><line x1="400" y1="70" x2="460" y2="88"/><line x1="240" y1="70" x2="180" y2="88"/><line x1="320" y1="90" x2="320" y2="270" stroke-dasharray="4 4"/><line x1="400" y1="80" x2="460" y2="158"/><line x1="240" y1="80" x2="180" y2="158"/><line x1="320" y1="150" x2="460" y2="228"/><line x1="320" y1="150" x2="180" y2="228"/></g>
</svg>
