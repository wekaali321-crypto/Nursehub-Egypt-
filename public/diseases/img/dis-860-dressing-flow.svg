<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 656" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="656" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">اختيار الغيار: ابدأ بقاع الجرح وليس بالمرحلة فقط</text><rect x="170" y="44" width="300" height="38" rx="10" fill="#0f172a"/><text x="320" y="69" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">نظّف ← قيّم القاع والإفراز والحواف</text><line x1="320" y1="82" x2="320" y2="98" stroke="#64748b" stroke-width="2"/><rect x="344" y="100" width="288" height="50" rx="10" fill="#fff" stroke="#ca8a04" stroke-width="2"/><rect x="624" y="100" width="8" height="50" rx="3" fill="#ca8a04"/><text x="616" y="121" text-anchor="end" font-size="13.5" font-weight="700" fill="#1e293b">جلد سليم: احمرار لا يبيض أو</text><text x="616" y="139" text-anchor="end" font-size="13.5" font-weight="700" fill="#1e293b">بنفسجي</text><polygon points="340,125 316,114 316,136" fill="#ca8a04"/><rect x="8" y="100" width="302" height="50" rx="10" fill="#ca8a04" opacity=".12" stroke="#ca8a04"/><text x="300" y="121" text-anchor="end" font-size="13.5" font-weight="800" fill="#ca8a04">فيلم أو فوم سيليكون مع إعفاء</text><text x="300" y="139" text-anchor="end" font-size="13.5" font-weight="800" fill="#ca8a04">الضغط</text><rect x="344" y="162" width="288" height="50" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="624" y="162" width="8" height="50" rx="3" fill="#ea580c"/><text x="616" y="183" text-anchor="end" font-size="13.5" font-weight="700" fill="#1e293b">سطحية رطبة قليلة الإفراز</text><text x="616" y="201" text-anchor="end" font-size="13.5" font-weight="700" fill="#1e293b">(مرحلة 2)</text><polygon points="340,187 316,176 316,198" fill="#ea580c"/><rect x="8" y="162" width="302" height="50" rx="10" fill="#ea580c" opacity=".12" stroke="#ea580c"/><text x="300" y="192" text-anchor="end" font-size="13.5" font-weight="800" fill="#ea580c">هيدروكولويد أو فوم رقيق</text><rect x="344" y="224" width="288" height="50" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="624" y="224" width="8" height="50" rx="3" fill="#2563eb"/><text x="616" y="245" text-anchor="end" font-size="13.5" font-weight="700" fill="#1e293b">قاع جاف أو قليل الإفراز</text><text x="616" y="263" text-anchor="end" font-size="13.5" font-weight="700" fill="#1e293b">(مرحلة 3 و4)</text><polygon points="340,249 316,238 316,260" fill="#2563eb"/><rect x="8" y="224" width="302" height="50" rx="10" fill="#2563eb" opacity=".12" stroke="#2563eb"/><text x="300" y="254" text-anchor="end" font-size="13.5" font-weight="800" fill="#2563eb">هيدروجل مع غطاء ثانوي من الفوم</text><rect x="344" y="286" width="288" height="50" rx="10" fill="#fff" stroke="#0d9488" stroke-width="2"/><rect x="624" y="286" width="8" height="50" rx="3" fill="#0d9488"/><text x="616" y="316" text-anchor="end" font-size="13.5" font-weight="700" fill="#1e293b">إفراز متوسط إلى غزير</text><polygon points="340,311 316,300 316,322" fill="#0d9488"/><rect x="8" y="286" width="302" height="50" rx="10" fill="#0d9488" opacity=".12" stroke="#0d9488"/><text x="300" y="316" text-anchor="end" font-size="13.5" font-weight="800" fill="#0d9488">فوم أو هيدروفايبر أو ألجينات</text><rect x="344" y="348" width="288" height="50" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="624" y="348" width="8" height="50" rx="3" fill="#7c3aed"/><text x="616" y="378" text-anchor="end" font-size="13.5" font-weight="700" fill="#1e293b">جيب أو تجويف عميق</text><polygon points="340,373 316,362 316,384" fill="#7c3aed"/><rect x="8" y="348" width="302" height="50" rx="10" fill="#7c3aed" opacity=".12" stroke="#7c3aed"/><text x="300" y="369" text-anchor="end" font-size="13.5" font-weight="800" fill="#7c3aed">حشو خفيف بشريط ألجينات أو</text><text x="300" y="387" text-anchor="end" font-size="13.5" font-weight="800" fill="#7c3aed">هيدروفايبر</text><rect x="344" y="410" width="288" height="50" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/><rect x="624" y="410" width="8" height="50" rx="3" fill="#dc2626"/><text x="616" y="440" text-anchor="end" font-size="13.5" font-weight="700" fill="#1e293b">علامات عدوى موضعية</text><polygon points="340,435 316,424 316,446" fill="#dc2626"/><rect x="8" y="410" width="302" height="50" rx="10" fill="#dc2626" opacity=".12" stroke="#dc2626"/><text x="300" y="431" text-anchor="end" font-size="13.5" font-weight="800" fill="#dc2626">غيار مضاد للميكروبات بأمر</text><text x="300" y="449" text-anchor="end" font-size="13.5" font-weight="800" fill="#dc2626">الطبيب</text><rect x="344" y="472" width="288" height="50" rx="10" fill="#fff" stroke="#b45309" stroke-width="2"/><rect x="624" y="472" width="8" height="50" rx="3" fill="#b45309"/><text x="616" y="502" text-anchor="end" font-size="13.5" font-weight="700" fill="#1e293b">سلخ أصفر رخو أو نسيج ميت</text><polygon points="340,497 316,486 316,508" fill="#b45309"/><rect x="8" y="472" width="302" height="50" rx="10" fill="#b45309" opacity=".12" stroke="#b45309"/><text x="300" y="493" text-anchor="end" font-size="13.5" font-weight="800" fill="#b45309">تنضير بأمر الطبيب أو متخصص</text><text x="300" y="511" text-anchor="end" font-size="13.5" font-weight="800" fill="#b45309">الجروح</text><rect x="344" y="534" width="288" height="50" rx="10" fill="#fff" stroke="#57534e" stroke-width="2"/><rect x="624" y="534" width="8" height="50" rx="3" fill="#57534e"/><text x="616" y="564" text-anchor="end" font-size="13.5" font-weight="700" fill="#1e293b">قشرة جافة ثابتة على الكعب</text><polygon points="340,559 316,548 316,570" fill="#57534e"/><rect x="8" y="534" width="302" height="50" rx="10" fill="#57534e" opacity=".12" stroke="#57534e"/><text x="300" y="555" text-anchor="end" font-size="13.5" font-weight="800" fill="#57534e">لا تنضّر: غطاء واقي وإعفاء</text><text x="300" y="573" text-anchor="end" font-size="13.5" font-weight="800" fill="#57534e">ومراقبة</text><text x="320" y="612" text-anchor="middle" font-size="13" font-weight="700" fill="#475569">أعد التقييم عند كل غيار: لو لم يتحسن خلال أسبوعين رغم العناية، أعد تقييم الحالة كلها</text><text x="320" y="634" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">الشفط السالب وأي مضاد ميكروبات: بأمر الطبيب فقط</text></svg>