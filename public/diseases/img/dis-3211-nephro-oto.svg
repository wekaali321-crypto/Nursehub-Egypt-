<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 246" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="246" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">علامات سمّية الأمينوجليكوزيدات والفانكومايسين</text><rect x="470.0" y="44" width="150.0" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="545.0" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">العضو</text><rect x="245.0" y="44" width="225.0" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="357.5" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">العلامة</text><rect x="20.0" y="44" width="225.0" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="132.5" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">متى تبلّغ</text><rect x="470.0" y="74.5" width="150.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="545.0" y="93.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">الأذن</text><text direction="ltr" x="545.0" y="110.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">(Ototoxicity)</text><rect x="245.0" y="74.5" width="225.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="357.5" y="101.8" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">دوار (فقدان توازن) وطنين</text><rect x="20.0" y="74.5" width="225.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="132.5" y="101.8" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">فورًا عند ظهور أي منهما</text><rect x="470.0" y="121.5" width="150.0" height="63.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="545.0" y="148.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">الكلى</text><text direction="ltr" x="545.0" y="165.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">(Nephrotoxicity)</text><rect x="245.0" y="121.5" width="225.0" height="63.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="357.5" y="148.8" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">كرياتينين مرتفع، BUN مرتفع،</text><text x="357.5" y="165.3" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">بول قليل</text><rect x="20.0" y="121.5" width="225.0" height="63.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="132.5" y="140.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">كرياتينين أعلى من 1.3، BUN</text><text x="132.5" y="157.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أعلى من 20، بول 30 مل/س أو</text><text x="132.5" y="173.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أقل</text><rect x="470.0" y="185" width="150.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="545.0" y="212.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">مستوى الدواء</text><rect x="245.0" y="185" width="225.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="357.5" y="204.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">مرتفع = سمّية كلوية؛ منخفض =</text><text x="357.5" y="220.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">العدوى تستمر</text><rect x="20.0" y="185" width="225.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="132.5" y="204.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">قاع (Trough) قبل الجرعة</text><text x="132.5" y="220.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">التالية بـ 15–30 دقيقة</text></svg>