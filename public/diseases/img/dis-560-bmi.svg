<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="250" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مؤشر كتلة الجسم BMI = الوزن (كجم) ÷ الطول² (متر)</text>
<g font-size="13" font-weight="700" text-anchor="middle">
<rect x="20" y="55" width="95" height="90" fill="#60a5fa"/><text x="67" y="95" fill="#fff">نحافة</text><text x="67" y="120" fill="#fff" direction="ltr">&lt; 18.5</text>
<rect x="115" y="55" width="105" height="90" fill="#22c55e"/><text x="167" y="95" fill="#fff">طبيعي</text><text x="167" y="120" fill="#fff" direction="ltr">18.5 – 25</text>
<rect x="220" y="55" width="105" height="90" fill="#eab308"/><text x="272" y="95" fill="#422006">وزن زائد</text><text x="272" y="120" fill="#422006" direction="ltr">25 – 30</text>
<rect x="325" y="55" width="100" height="90" fill="#f97316"/><text x="375" y="95" fill="#fff">سمنة 1</text><text x="375" y="120" fill="#fff" direction="ltr">30 – 35</text>
<rect x="425" y="55" width="100" height="90" fill="#ef4444"/><text x="475" y="95" fill="#fff">سمنة 2</text><text x="475" y="120" fill="#fff" direction="ltr">35 – 40</text>
<rect x="525" y="55" width="95" height="90" fill="#991b1b"/><text x="572" y="95" fill="#fff">سمنة 3</text><text x="572" y="120" fill="#fff">(مفرطة)</text><text x="572" y="138" fill="#fff" direction="ltr">&gt; 40</text>
</g>
<text x="320" y="185" text-anchor="middle" font-size="14" fill="#334155">مثال: 80 كجم وطول 1.70 م  →  80 ÷ 2.89 = 27.7 (وزن زائد)</text>
<text x="320" y="215" text-anchor="middle" font-size="12" fill="#64748b">BMI مؤشر تقريبي: لا يفرّق بين العضل والدهون، ويُقرأ مع محيط الوسط</text>
</svg>