<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قطاع في خراج: أين نشق وماذا نكسر</text>
<rect x="24" y="48" width="592" height="300" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="40" y="90" width="560" height="40" fill="#fde68a"/><rect x="40" y="130" width="560" height="150" fill="#fecdd3"/><text x="70" y="115" text-anchor="start" font-size="13" font-weight="800" fill="#92400e">الجلد</text><text x="70" y="160" text-anchor="start" font-size="13" font-weight="800" fill="#9f1239">نسيج تحت الجلد</text><ellipse cx="320" cy="190" rx="110" ry="60" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/><path d="M270 160 L270 220 M320 150 L320 230 M370 160 L370 220" stroke="#ca8a04" stroke-width="2" stroke-dasharray="4 3"/><text x="320" y="195" text-anchor="middle" font-size="13" font-weight="800" fill="#713f12">صديد + حواجز (loculi)</text><path d="M290 90 L320 130" stroke="#0f172a" stroke-width="4"/><text x="320" y="76" text-anchor="middle" font-size="12" font-weight="800" fill="#dc2626">شق صغير موازٍ لثنية الجلد في أبرز نقطة</text><path d="M200 140 L240 150 M440 140 L400 150" stroke="#2563eb" stroke-width="3"/><text x="120" y="330" text-anchor="start" font-size="12" font-weight="800" fill="#2563eb">بنج موضعي حول الحواف</text><path d="M150 230 L215 210 M490 230 L425 210" stroke="#16a34a" stroke-width="3"/><text x="520" y="322" text-anchor="end" font-size="12" font-weight="800" fill="#16a34a">ضغط من الجانبين لإخراج الصديد</text><text x="320" y="305" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">بعد كسر الحواجز بالموسكيتو: غسيل ثم فتيلة شاش (24 ساعة)</text>
</svg>