<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 454" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="454" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">رعاية مريض COPD: الغذاء والسوائل والوقاية</text><rect x="326" y="56" width="298" height="223" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><rect x="326" y="56" width="298" height="30" rx="12" fill="#16a34a"/><text x="475" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الغذاء</text><text x="614" y="108" text-anchor="end" font-size="13" fill="#14532d">نظافة الفم قبل الوجبات لتنشيط التذوق</text><text x="614" y="127" text-anchor="end" font-size="13" fill="#14532d">وجبات صغيرة متكررة (تقلل انتفاخ المعدة)</text><text x="614" y="146" text-anchor="end" font-size="13" fill="#14532d">سعرات وبروتين عالٍ</text><text x="614" y="165" text-anchor="end" font-size="13" fill="#14532d">تجنب الإفراط في الكربوهيدرات (تزيد CO2)</text><text x="614" y="184" text-anchor="end" font-size="13" fill="#14532d">لا تمارين قبل الوجبة أو بعدها بساعة</text><text x="614" y="203" text-anchor="end" font-size="13" fill="#14532d">(حفظًا للأكسجين أثناء المضغ والبلع)</text><text x="614" y="222" text-anchor="end" font-size="13" fill="#14532d">لا أطعمة منتفخة بالغازات ولا مشروبات</text><text x="614" y="241" text-anchor="end" font-size="13" fill="#14532d">غازية ولا ألياف عالية كالبروكلي</text><text x="614" y="260" text-anchor="end" font-size="13" fill="#14532d">والفاصوليا</text><rect x="16" y="56" width="298" height="223" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><rect x="16" y="56" width="298" height="30" rx="12" fill="#2563eb"/><text x="165" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">السوائل</text><text x="304" y="108" text-anchor="end" font-size="13" fill="#1e3a8a">8 أكواب (2–3 لتر) يوميًا لتخفيف المخاط</text><text x="304" y="127" text-anchor="end" font-size="13" fill="#1e3a8a">لا تشرب أثناء الأكل</text><rect x="326" y="291" width="298" height="147" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><rect x="326" y="291" width="298" height="30" rx="12" fill="#d97706"/><text x="475" y="312" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العدوى واللقاحات</text><text x="614" y="343" text-anchor="end" font-size="13" fill="#78350f">بلّغ عن زيادة البلغم، الحمى، ضيق نفس</text><text x="614" y="362" text-anchor="end" font-size="13" fill="#78350f">متزايد</text><text x="614" y="381" text-anchor="end" font-size="13" fill="#78350f">لقاح المكورات الرئوية (كل 5 سنوات وفق</text><text x="614" y="400" text-anchor="end" font-size="13" fill="#78350f">الكتاب، ويُراجع بالجدول الطبي)</text><text x="614" y="419" text-anchor="end" font-size="13" fill="#78350f">لقاح الإنفلونزا سنويًا</text><rect x="16" y="291" width="298" height="147" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><rect x="16" y="291" width="298" height="30" rx="12" fill="#7c3aed"/><text x="165" y="312" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الدواء</text><text x="304" y="343" text-anchor="end" font-size="13" fill="#4c1d95">albuterol عند ضيق النفس لتوسيع الشعب</text></svg>