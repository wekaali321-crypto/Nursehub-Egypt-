<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 214" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="214" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">الفرق بين التهاب المثانة والتهاب الحويضة والكلى</text><rect x="427.33333333333337" y="50" width="198.66666666666666" height="148" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><rect x="427.33333333333337" y="50" width="198.66666666666666" height="28" rx="12" fill="#16a34a"/><text x="526.6666666666667" y="69" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">التهاب المثانة (سفلي)</text><text x="526.6666666666667" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">حرقان وتكرار وإلحاح</text><text x="526.6666666666667" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">لا حرارة غالباً</text><text x="526.6666666666667" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">علاج فموي قصير</text><rect x="220.6666666666667" y="50" width="198.66666666666666" height="148" rx="12" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="220.6666666666667" y="50" width="198.66666666666666" height="44" rx="12" fill="#dc2626"/><text x="320.00000000000006" y="69" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">التهاب الحويضة والكلية</text><text x="320.00000000000006" y="85" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">(علوي)</text><text x="320.00000000000006" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">حرارة وقشعريرة</text><text x="320.00000000000006" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">ألم الخاصرة CVA</text><text x="320.00000000000006" y="144" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">قيء ولا تحمل الفم أحياناً</text><text x="320.00000000000006" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">علاج 5–14 يوم + احتمال</text><text x="320.00000000000006" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">تنويم</text><rect x="14.000000000000057" y="50" width="198.66666666666666" height="148" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><rect x="14.000000000000057" y="50" width="198.66666666666666" height="28" rx="12" fill="#7c3aed"/><text x="113.33333333333339" y="69" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">تسمم دم بولي</text><text x="113.33333333333339" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">هبوط ضغط وتسارع نبض</text><text x="113.33333333333339" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">تخليط ذهني</text><text x="113.33333333333339" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">طوارئ فورية</text></svg>