<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="330" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">خراج المخ: الموضع والأعراض</text><rect x="480" y="48" width="140" height="44" fill="#0f766e" stroke="#cbd5e1"/><text x="550.0" y="74.2" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">الفص</text><rect x="20" y="48" width="460" height="44" fill="#0f766e" stroke="#cbd5e1"/><text x="250.0" y="74.2" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">الأعراض</text><rect x="480" y="92" width="140" height="44" fill="#ffffff" stroke="#cbd5e1"/><text x="550.0" y="118.2" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">الجبهي</text><rect x="20" y="92" width="460" height="44" fill="#ffffff" stroke="#cbd5e1"/><text x="250.0" y="118.2" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">شلل نصفي، حبسة تعبيرية، نوبات، صداع جبهي</text><rect x="480" y="136" width="140" height="44" fill="#f1f5f9" stroke="#cbd5e1"/><text x="550.0" y="162.2" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">الصدغي</text><rect x="20" y="136" width="460" height="44" fill="#f1f5f9" stroke="#cbd5e1"/><text x="250.0" y="162.2" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">صداع موضعي، تغير الرؤية، ضعف الوجه، حبسة استقبالية</text><rect x="480" y="180" width="140" height="44" fill="#ffffff" stroke="#cbd5e1"/><text x="550.0" y="206.2" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">المخيخ</text><rect x="20" y="180" width="460" height="44" fill="#ffffff" stroke="#cbd5e1"/><text x="250.0" y="206.2" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">صداع خلفي، رنح (Ataxia)، رأرأة (Nystagmus)</text><rect x="20" y="210" width="600" height="50" rx="10" fill="#e0f2fe"/><text x="320.0" y="239.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">أسباب: التهاب أذن وسطى، جيوب، التهاب خشاء، لثة وفم، ثقب اللسان، القلب والرئة</text><rect x="20" y="268" width="600" height="50" rx="10" fill="#dcfce7"/><text x="320.0" y="297.2" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">علاج: Ceftriaxone مضاد أول، سحب بالتصوير، ستيرويد للوذمة، مضاد نوبات</text></svg>