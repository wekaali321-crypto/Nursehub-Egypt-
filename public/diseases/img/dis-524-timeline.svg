<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="260" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">مراحل تسمم الباراسيتامول</text>
<g font-size="13" text-anchor="middle">
<rect x="430" y="50" width="190" height="110" rx="10" fill="#dcfce7"/><text x="525" y="74" font-weight="800" fill="#14532d">أول 24 ساعة</text><text x="525" y="100" fill="#14532d">غالباً بدون أعراض</text><text x="525" y="122" fill="#14532d">غثيان وقيء ومغص</text><text x="525" y="144" fill="#14532d">INR يطول (أدق اختبار)</text>
<rect x="225" y="50" width="190" height="110" rx="10" fill="#fef9c3"/><text x="320" y="74" font-weight="800" fill="#713f12">24–72 ساعة</text><text x="320" y="100" fill="#713f12">ألم منطقة الكبد</text><text x="320" y="122" fill="#713f12">ارتفاع إنزيمات الكبد</text><text x="320" y="144" fill="#713f12">قلة بول</text>
<rect x="20" y="50" width="190" height="110" rx="10" fill="#fee2e2"/><text x="115" y="74" font-weight="800" fill="#7f1d1d">2–4 أيام</text><text x="115" y="100" fill="#7f1d1d">صفراء</text><text x="115" y="122" fill="#7f1d1d">غيبوبة كبدية</text><text x="115" y="144" fill="#7f1d1d">فشل كبد</text></g>
<rect x="20" y="180" width="600" height="60" rx="10" fill="#e0e7ff"/>
<text x="320" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#312e81">أسيتيل سيستين خلال 24 ساعة (الأفضل خلال 8 ساعات)</text>
<text x="320" y="226" text-anchor="middle" font-size="12" fill="#312e81">فموي: 140 مجم/كجم أول جرعة ثم 70 مجم/كجم كل 4 ساعات (17 جرعة)</text>
</svg>
