<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 407" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="407" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">العلاج النفسي: ⁦CBT⁩ والتخيل الموجه والتغذية الراجعة</text><rect x="326" y="50" width="294" height="179.875" rx="10" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><path d="M326 60a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#6d28d9"/><text x="473" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">استراتيجيات ⁦CBT⁩ الخمس</text><text x="610" y="96.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="598" y="96.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">⁦1⁩) تعلم عن الاضطراب</text><text x="610" y="117.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="598" y="117.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">⁦2⁩) التعرض وإزالة الحساسية</text><text x="598" y="135.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">⁦(Desensitization)⁩</text><text x="610" y="156.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="598" y="156.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">⁦3⁩) الملاحظة الذاتية والمتابعة</text><text x="610" y="178" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="598" y="178" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">⁦4⁩) تقنيات الاسترخاء</text><text x="610" y="199.125" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="598" y="199.125" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">⁦5⁩) مهارات تكيف جديدة وإعادة صياغة التفكير</text><text x="598" y="217.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">⁦(Cognitive restructuring)⁩</text><rect x="20" y="50" width="294" height="179.875" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><path d="M20 60a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#c2410c"/><text x="167" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">إزالة الحساسية المنتظمة</text><text x="304" y="96.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="292" y="96.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">تعرض تدريجي للمخيف (فوبيا أو صدمة) مع</text><text x="292" y="114.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الاسترخاء</text><text x="304" y="135.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="292" y="135.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">مثال: خوف الطيران ← صور ثم مطار ثم طائرة</text><text x="304" y="156.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="292" y="156.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لعلاج الفوبيا و⁦PTSD⁩ و⁦OCD⁩</text><rect x="443.52941176470586" y="241.875" width="176.47058823529412" height="29.4" fill="#0e7490" stroke="#cbd5e1"/><text x="531.7647058823529" y="258.875" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الأسلوب</text><rect x="19.999999999999943" y="241.875" width="423.5294117647059" height="29.4" fill="#0e7490" stroke="#cbd5e1"/><text x="231.7647058823529" y="258.875" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">المعنى</text><rect x="443.52941176470586" y="271.275" width="176.47058823529412" height="46.8" fill="#f8fafc" stroke="#cbd5e1"/><text x="531.7647058823529" y="288.275" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">التخيل الموجه (⁦Guided⁩</text><text x="531.7647058823529" y="305.67499999999995" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">⁦imagery)⁩</text><rect x="19.999999999999943" y="271.275" width="423.5294117647059" height="46.8" fill="#f8fafc" stroke="#cbd5e1"/><text x="231.7647058823529" y="288.275" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">تركيز على صور ذهنية لتخفيف التوتر والقلق وتحسين التركيز؛ فوائده:</text><text x="231.7647058823529" y="305.67499999999995" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">استرخاء وسلام داخلي، حل المشكلات المعقدة، تحسين التركيز</text><rect x="443.52941176470586" y="318.075" width="176.47058823529412" height="46.8" fill="#fff" stroke="#cbd5e1"/><text x="531.7647058823529" y="335.075" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">التغذية الراجعة الحيوية</text><text x="531.7647058823529" y="352.47499999999997" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">⁦(Biofeedback)⁩</text><rect x="19.999999999999943" y="318.075" width="423.5294117647059" height="46.8" fill="#fff" stroke="#cbd5e1"/><text x="231.7647058823529" y="335.075" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">مثل التخيل لكن بأجهزة تساعد على التركيز؛ تعلّم الجسم الاستجابة بشكل</text><text x="231.7647058823529" y="352.47499999999997" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">مختلف للضغط</text><rect x="443.52941176470586" y="364.875" width="176.47058823529412" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="531.7647058823529" y="381.875" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">إعادة الصياغة المعرفية</text><rect x="19.999999999999943" y="364.875" width="423.5294117647059" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="231.7647058823529" y="381.875" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">فحص الأفكار السلبية وإعادة صياغتها بإيجابية</text></svg>