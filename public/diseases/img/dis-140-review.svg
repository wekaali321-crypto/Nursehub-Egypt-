<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 634" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="634" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الجلطة القلبية: مراجعة سريعة</text>
<rect x="14" y="44" width="300" height="170" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="14" y="44" width="300" height="26" rx="10" fill="#dc2626"/><text x="164.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >العلامات</text><text x="304" y="89" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >ألم فك/ظهر/كتف/خلف القص: مفاجئ، ساحق،</text><text x="304" y="106.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >  منتشر</text><text x="304" y="127.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >ضيق نفس، غثيان وقيء</text><text x="304" y="147.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >تعرق، جلد شاحب بارد</text><text x="304" y="168.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >قلق</text><rect x="326" y="44" width="300" height="170" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><rect x="326" y="44" width="300" height="26" rx="10" fill="#2563eb"/><text x="476.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >التشخيص</text><text x="616" y="89" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >1) ECG (ST مرتفع أو منخفض)</text><text x="616" y="109.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >2) تروبونين فوق 0.5 ng/mL</text><text x="616" y="130.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >CRP وCK-MB وميوجلوبين مساعدة</text><rect x="14" y="226" width="300" height="230" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><rect x="14" y="226" width="300" height="26" rx="10" fill="#16a34a"/><text x="164.0" y="244" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >أثناء ألم الصدر: MONA</text><text x="304" y="271" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >O: أكسجين</text><text x="304" y="291.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >A: أسبرين</text><text x="304" y="312.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >N: نيترو تحت اللسان 3 مرات حداً أقصى</text><text x="304" y="332.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >M: مورفين لأي ألم بعد الاحتشاء</text><rect x="326" y="226" width="300" height="230" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><rect x="326" y="226" width="300" height="26" rx="10" fill="#7c3aed"/><text x="476.0" y="244" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >بعد الجلطة</text><text x="616" y="271" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >هيبارين: PTT يستهدف 46–70؛ الترياق بروتامين</text><text x="616" y="290.5" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >حاصرات بيتا (-lol): لا تعطى لو نبض أقل من 60</text><text x="616" y="307.0" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >  أو ضغط منخفض أو ضيق شعب أو سكر</text><text x="616" y="326.5" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >حاصرات الكالسيوم (-dipine,-zem,-amil)</text><text x="616" y="346.0" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >النيترات: أوقف تسريب نيترو لو الانقباضي أقل من</text><text x="616" y="362.5" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >  90 أو هبط 30</text><rect x="14" y="468" width="300" height="150" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><rect x="14" y="468" width="300" height="26" rx="10" fill="#0f766e"/><text x="164.0" y="486" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >وقاية وتغذية</text><text x="304" y="513" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >صوديوم 2 جم وسوائل 2 لتر</text><text x="304" y="533" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >بلّغ زيادة وزن سريعة</text><text x="304" y="553" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >تمارين 30 دقيقة × 5 أيام</text><text x="304" y="573" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >سلمان بلا ضيق نفس</text><text x="304" y="593" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >تجنب NSAIDs: تزيد التجلط</text><rect x="326" y="468" width="300" height="150" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><rect x="326" y="468" width="300" height="26" rx="10" fill="#ea580c"/><text x="476.0" y="486" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >لوحة الدهون المستهدفة</text><text x="616" y="513" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >الكوليسترول الكلي: 200 أو أقل</text><text x="616" y="533.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >الدهون الثلاثية: 150 أو أقل</text><text x="616" y="554.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >LDL: 100 أو أقل</text><text x="616" y="574.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >HDL: 40 أو أكثر</text>
</svg>
