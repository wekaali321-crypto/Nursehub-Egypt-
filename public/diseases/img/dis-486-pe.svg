<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 354" font-family="Cairo, Tahoma, sans-serif">
<rect width="640" height="354" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">تسمم الحمل: التعريف والأعراض</text>
<rect x="20" y="44" width="600" height="72" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="44" width="160" height="72" rx="10" fill="#0369a1"/><text x="540" y="85" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التعريف</text><text x="448" y="67" text-anchor="end" font-size="12" fill="#0f172a">بعد الأسبوع 20 من الحمل</text><text x="448" y="85" text-anchor="end" font-size="12" fill="#0f172a">ضغط 140/90 أو أكثر في قراءتين منفصلتين</text><text x="448" y="103" text-anchor="end" font-size="12" fill="#0f172a">+ بروتين في البول ± وذمة</text><rect x="20" y="124" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="124" width="160" height="54" rx="10" fill="#d97706"/><text x="540" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">أعراض الخطورة</text><text x="448" y="147" text-anchor="end" font-size="12" fill="#0f172a">صداع · زغللة · ألم أعلى البطن</text><text x="448" y="165" text-anchor="end" font-size="12" fill="#0f172a">قيء مستمر · قلة البول</text><rect x="20" y="186" width="600" height="46" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="186" width="160" height="46" rx="10" fill="#7c3aed"/><text x="540" y="214" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ارتفاع ضغط الحمل</text><text x="448" y="214" text-anchor="end" font-size="12" fill="#0f172a">ضغط عالٍ بعد 20 أسبوع بدون بروتين في البول</text><rect x="20" y="240" width="600" height="46" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="240" width="160" height="46" rx="10" fill="#b91c1c"/><text x="540" y="268" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الارتجاج (Eclampsia)</text><text x="448" y="268" text-anchor="end" font-size="12" fill="#0f172a">تشنجات مهددة للحياة فوق تسمم الحمل</text><rect x="20" y="294" width="600" height="46" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="294" width="160" height="46" rx="10" fill="#15803d"/><text x="540" y="322" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج النهائي</text><text x="448" y="322" text-anchor="end" font-size="12" fill="#0f172a">إنهاء الحمل</text>
</svg>
