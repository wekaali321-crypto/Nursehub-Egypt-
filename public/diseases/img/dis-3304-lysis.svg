<text x="480.0" y="174" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >موانع مهمة (أي حالة نزف محتمل)</text>
<text x="480.0" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >نزيف نشط وقرحة هضمية</text>
<text x="480.0" y="226" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >ضغط 180/110 أو أعلى غير مضبوط</text>
<text x="480.0" y="247" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >جراحة خلال أسبوعين</text>
<text x="480.0" y="268" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >سكتة نزفية سابقة، أنيورزم، تشوه وعائي، رضوض حديثة</text>
<rect x="10" y="155" width="310" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="155" width="310" height="28" rx="10" fill="#0f766e"/>
<text x="165.0" y="174" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >التوقيت والمراقبة</text>
<text x="165.0" y="205" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >من 3 إلى 4.5 ساعة من بدء الأعراض</text>
<text x="165.0" y="229" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >قيّم النزيف كل 15 دقيقة أول ساعة</text>
<text x="165.0" y="253" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >ثم حسب البروتوكول لحين نهاية العلاج</text>
