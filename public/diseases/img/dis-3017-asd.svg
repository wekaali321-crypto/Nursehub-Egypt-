<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="340" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">اضطراب طيف التوحد: العلامات والتمريض</text><rect x="330" y="50" width="290" height="100" rx="10" fill="#f59e0b"/><text x="475.0" y="67.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">العلامات</text><text x="475.0" y="85.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">لا يحافظ على التواصل بالعين</text><text x="475.0" y="103.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">لا يتفاعل بالإيماءات · يلعب منفردًا</text><text x="475.0" y="121.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">لا يستجيب للأسئلة · تأخر لغوي</text><text x="475.0" y="139.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">حركات وكلام متكرر (Echolalia)</text><rect x="20" y="50" width="300" height="100" rx="10" fill="#ef4444"/><text x="170.0" y="85.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الخطر</text><text x="170.0" y="103.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">أعلى عامل خطر: وجود أخ مصاب</text><text x="170.0" y="121.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ليس سببه: التطعيم المبكر ولا عمر الوالدين</text><rect x="330" y="165" width="290" height="110" rx="10" fill="#16a34a"/><text x="475.0" y="205.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الروتين والثبات</text><text x="475.0" y="223.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">جدول ثابت للأنشطة وروتين يومي</text><text x="475.0" y="241.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تجنب أي تغييرات حادة بالبيئة</text><rect x="20" y="165" width="300" height="110" rx="10" fill="#0ea5e9"/><text x="170.0" y="205.0" text-anchor="m