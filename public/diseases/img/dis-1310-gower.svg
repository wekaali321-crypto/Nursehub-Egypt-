<text x="241.75" y="97.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">يضع يديه على</text>
<text x="241.75" y="116.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">فخذيه</text>
<line x1="176.5" y1="93.0" x2="150.5" y2="93.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
