<text x="398.25" y="97.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">يرفع الحوض ويمدّ</text>
<text x="398.25" y="116.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ركبتيه</text>
<line x1="333.0" y1="93.0" x2="307.0" y2="93.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
