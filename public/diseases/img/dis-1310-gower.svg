<text x="85.25" y="78.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
<text x="85.25" y="97.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">يدفع جسمه لأعلى</text>
<text x="85.25" y="116.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">للوقوف</text>
<text x="320" y="188" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">ضعف عضلات الحوض يجبره على «تسلّق» جسمه بيديه</text>
