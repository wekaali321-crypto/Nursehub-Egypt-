<text x="554.75" y="78.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
<text x="554.75" y="97.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">يرتكز الطفل على</text>
<text x="554.75" y="116.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">يديه وركبتيه</text>
<line x1="489.5" y1="93.0" x2="463.5" y2="93.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
<polygon points="463.5,93.0 471.6,89.1 471.6,96.9" fill="#475569"/>
