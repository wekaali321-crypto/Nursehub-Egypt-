<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="322" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">اضطراب الأعراض الجسدية (⁦Somatic System Disorder⁩)</text><text x="320" y="52" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b">أعراض جسدية حقيقية بلا سبب طبي؛ كل الفحوصات سلبية</text><rect x="434.66666666666663" y="62" width="185.33333333333334" height="96.19999999999999" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><path d="M434.66666666666663 72a10 10 0 0 1 10-10h165.33333333333334a10 10 0 0 1 10 10v22h-185.33333333333334z" fill="#c2410c"/><text x="527.3333333333333" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">أعراض جسدية</text><text x="610" y="108" text-anchor="start" font-size="12" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="598" y="108" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">ألم بطن، ضعف، ألم صدر، ضيق</text><text x="598" y="125.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">نفس</text><line x1="432.66666666666663" y1="110.1" x2="414.66666666666663" y2="110.1" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="227.3333333333333" y="62" width="185.33333333333334" height="96.19999999999999" rx="10" fill="#fff" stroke="#475569" stroke-width="1.5"/><path d="M227.3333333333333 72a10 10 0 0 1 10-10h165.33333333333334a10 10 0 0 1 10 10v22h-185.33333333333334z" fill="#475569"/><text x="319.99999999999994" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">فحوصات سلبية</text><text x="402.66666666666663" y="108" text-anchor="start" font-size="12" font-weight="700" fill="#475569">⁦•⁩</text><text x="390.66666666666663" y="108" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">لا يوجد سبب طبي</text><line x1="225.3333333333333" y1="110.1" x2="207.3333333333333" y2="110.1" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="19.999999999999943" y="62" width="185.33333333333334" height="96.19999999999999" rx="10" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><path d="M19.999999999999943 72a10 10 0 0 1 10-10h165.33333333333334a10 10 0 0 1 10 10v22h-185.33333333333334z" fill="#6d28d9"/><text x="112.66666666666661" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">السبب</text><text x="195.3333333333333" y="108" text-anchor="start" font-size="12" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="183.3333333333333" y="108" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">الضغط النفسي (⁦Stress⁩)</text><text x="195.3333333333333" y="128.4" text-anchor="start" font-size="12" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="183.3333333333333" y="128.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">انشغال هوسي بالأعراض</text><text x="183.3333333333333" y="145.8" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">وتنقل بين الأطباء</text><rect x="326" y="172.2" width="294" height="137.625" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><path d="M326 182.2a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#15803d"/><text x="473" y="193.2" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التدخل</text><text x="610" y="218.7" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="218.7" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">حدّد وقت الحديث عن الأعراض الجسدية (نقطة</text><text x="598" y="236.825" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">امتحان)</text><text x="610" y="257.95" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="257.95" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ساعده على البصيرة: حدد الضغوط التي تزيد</text><text x="598" y="276.075" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الأعراض</text><text x="610" y="297.2" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="297.2" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أساليب تكيف: تنفس عميق، تأمل، رياضة</text><rect x="20" y="172.2" width="294" height="137.625" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M20 182.2a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#b91c1c"/><text x="167" y="193.2" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">لا تنخدع في الامتحان</text><text x="304" y="218.7" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="292" y="218.7" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لا تعزز نتائج الفحص السلبية حين يطلب مسكنات</text><text x="304" y="239.825" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="292" y="239.825" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لا تدحض الأعراض ولا تقل إنها غير حقيقية</text><text x="304" y="260.95" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="292" y="260.95" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لا تدعُ لمزيد من الفحوصات أو حمية جديدة</text></svg>