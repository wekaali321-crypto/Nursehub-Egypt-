<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 304" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="304" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">القولون العصبي IBS</text>
<rect x="346.0" y="52" width="320.0" height="117.0" rx="10" fill="#0e7490" fill-opacity="0.1" stroke="#0e7490" stroke-width="1.2"/>
<rect x="346.0" y="52" width="320.0" height="26" rx="10" fill="#0e7490" fill-opacity="1" stroke="#0e7490" stroke-width="1.2"/>
<text x="506.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الفكرة</text>
<text x="656.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• اضطراب بالأمعاء الغليظة: مغص وألم وانتفاخ مع</text>
<text x="656.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">إسهال أو إمساك</text>
<text x="656.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ليس مرض التهاب الأمعاء IBD (قولون تقرحي</text>
<text x="656.0" y="149.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">وكرون)</text>
<rect x="14.0" y="52" width="320.0" height="117.0" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="14.0" y="52" width="320.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="174.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">التثقيف</text>
<text x="324.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• دوّن يوميات الأعراض والطعام والتوتر</text>
<text x="324.0" y="115.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تمارين 3 مرات أسبوعياً</text>
<text x="324.0" y="134.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• زد الألياف إلى 30 غ يومياً على الأقل</text>
<text x="324.0" y="153.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• زد السوائل</text>
<rect x="346.0" y="181.0" width="320.0" height="95.75" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="346.0" y="181.0" width="320.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="506.0" y="199.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">تحديد الطعام</text>
<text x="656.0" y="225.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قلل الأطعمة المنتجة للغازات: بقوليات، بيض،</text>
<text x="656.0" y="242.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">ألبان (زبادي)، فواكه</text>
<text x="656.0" y="261.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قلل الكحول والكافيين</text>
<rect x="14.0" y="181.0" width="320.0" height="95.75" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.2"/>
<rect x="14.0" y="181.0" width="320.0" height="26" rx="10" fill="#6366f1" fill-opacity="1" stroke="#6366f1" stroke-width="1.2"/>
<text x="174.0" y="199.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">سؤال شائع</text>
<text x="324.0" y="225.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• وجبات تدل على فهم صحيح: خبز ذرة، ستيك، شوربة</text>
<text x="324.0" y="242.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">طماطم وريحان</text>
<text x="324.0" y="261.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ليس: فاصوليا، سلطة فواكه، زبادي مع جرانولا</text>
</svg>
