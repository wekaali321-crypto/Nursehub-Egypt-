<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="240" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >ألوان نوبة رينو</text><rect x="30" y="60" width="180" height="100" rx="10" fill="#f1f5f9"/><text x="120" y="95" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a" >1) شحوب</text><text x="120" y="125" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a" >تقلص الأوعية</text><rect x="230" y="60" width="180" height="100" rx="10" fill="#bfdbfe"/><text x="320" y="95" text-anchor="middle" font-size="16" font-weight="800" fill="#1e3a8a" >2) أزرق</text><text x="320" y="125" text-anchor="middle" font-size="12" font-weight="500" fill="#1e3a8a" >قلة أكسجين</text><rect x="430" y="60" width="180" height="100" rx="10" fill="#fecaca"/><text x="520" y="95" text-anchor="middle" font-size="16" font-weight="800" fill="#7f1d1d" >3) احمرار</text><text x="520" y="125" text-anchor="middle" font-size="12" font-weight="500" fill="#7f1d1d" >عودة التدفق مع الدفء</text><text x="320" y="205" text-anchor="middle" font-size="12" font-weight="600" fill="#475569" >تسلسل اللون عند البرد أو التوتر، وغالباً يستثني الإبهام</text></svg>