<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 633" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="633" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">اعتلال عضلة القلب: ثلاثة أنواع وأدويتها</text>
<rect x="456.66666666666663" y="52" width="209.33333333333334" height="203.25" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="456.66666666666663" y="52" width="209.33333333333334" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="561.3333333333333" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">متوسع Dilated</text>
<text x="656.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• عضلة منتفخة وحجرات متسعة مع</text>
<text x="656.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">تليّف</text>
<text x="656.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• يصعب ضخ الدم المؤكسج</text>
<text x="656.0" y="151.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• S3 وتضخم القلب</text>
<text x="656.0" y="171.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أسبابه: وراثة أو تلف بالقلب</text>
<text x="656.0" y="188.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">(مثل الإشعاع)</text>
<rect x="235.3333333333333" y="52" width="209.33333333333334" height="203.25" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.2"/>
<rect x="235.3333333333333" y="52" width="209.33333333333334" height="26" rx="10" fill="#6366f1" fill-opacity="1" stroke="#6366f1" stroke-width="1.2"/>
<text x="339.99999999999994" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">مقيَّد Restrictive</text>
<text x="434.66666666666663" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• عضلة متصلبة "كالصخر" لا</text>
<text x="434.66666666666663" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">تمتلئ جيداً</text>
<text x="434.66666666666663" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تتكوّن الجلطات (الصمامات)</text>
<text x="434.66666666666663" y="149.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">بسهولة</text>
<text x="434.66666666666663" y="169.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أسبابه: وراثة أو تلف بالقلب</text>
<rect x="13.999999999999943" y="52" width="209.33333333333334" height="203.25" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="13.999999999999943" y="52" width="209.33333333333334" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="118.66666666666661" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">متضخم Hypertrophic</text>
<text x="213.3333333333333" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تضخم هائل بالحاجز بين</text>
<text x="213.3333333333333" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">البطينين قد يسد خروج الدم من</text>
<text x="213.3333333333333" y="130.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الأورطي</text>
<text x="213.3333333333333" y="149.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• انسدادي (يسد الصمام) أو غير</text>
<text x="213.3333333333333" y="167.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">انسدادي</text>
<text x="213.3333333333333" y="186.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• وراثي فقط</text>
<text x="213.3333333333333" y="205.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قد يخلو من الأعراض حتى</text>
<text x="213.3333333333333" y="222.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">مجهود شديد ثم موت مفاجئ (خاصة</text>
<text x="213.3333333333333" y="240.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الشباب)</text>
<rect x="346.0" y="275.25" width="320.0" height="134.25" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="346.0" y="275.25" width="320.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="506.0" y="293.25" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأعراض</text>
<text x="656.0" y="319.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• نقص أكسجة: قلق وهياج وتغير الوعي، إغماء</text>
<text x="656.0" y="336.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">ودوخة وإرهاق</text>
<text x="656.0" y="355.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قصور أيسر: سوائل بالرئة</text>
<text x="656.0" y="375.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قصور أيمن: وذمة واستسقاء وانتفاخ JVD</text>
<rect x="14.0" y="275.25" width="320.0" height="134.25" rx="10" fill="#0e7490" fill-opacity="0.1" stroke="#0e7490" stroke-width="1.2"/>
<rect x="14.0" y="275.25" width="320.0" height="26" rx="10" fill="#0e7490" fill-opacity="1" stroke="#0e7490" stroke-width="1.2"/>
<text x="174.0" y="293.25" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الفحوص</text>
<text x="324.0" y="319.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أشعة صدر وMRI</text>
<text x="324.0" y="338.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• إيكو: EF طبيعي 55–70% وأقل من 40% = قصور قلب</text>
<text x="324.0" y="357.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قسطرة تصوير الشرايين لاستبعاد نقص التروية</text>
<text x="324.0" y="377.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• BNP: ≤100 طبيعي، 101–299 ارتفاع خفيف، 300+</text>
<text x="324.0" y="394.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">خفيف قصور، 600+ متوسط، 900+ شديد</text>
<rect x="14" y="421.5" width="652" height="40" rx="10" fill="#fff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="340" y="446.5" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">الأدوية: مثبطات ACE (-pril) • حاصرات بيتا (-lol) • حاصرات قنوات الكالسيوم (-dipine/-zem/-amil) • ديجوكسين • مدرات</text>
<rect x="14" y="477.5" width="652" height="52.0" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.4"/>
<text x="654" y="497.5" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">أوقف الديجوكسين وأبلغ إذا: النبض القمي أقل من 60، أو K أقل من 3.5 (يزيد خطر التسمم)، أو مستوى</text>
<text x="654" y="515.5" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">الدواء فوق 2.0، أو ظهرت علامات تسمم: غثيان وقيء ورؤية ضبابية/هالات وإرهاق.</text>
<rect x="14" y="541.5" width="652" height="70.0" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="1.4"/>
<text x="654" y="561.5" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">المتضخم الانسدادي: بيتا وحاصرات الكالسيوم نعم؛ والمدرات والموسّعات والديجوكسين لا (تقلل الحجم</text>
<text x="654" y="579.5" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">وتزيد الانسداد)، ولا مجهود شاقاً. التثقيف: نظام قليل الملح والدهون، فترات راحة، تمارين</text>
<text x="654" y="597.5" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">مناسبة، ترك التدخين والكحول، تقليل التوتر.</text>
</svg>
