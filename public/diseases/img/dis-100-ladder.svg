<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 466" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="466" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">سلّم علاج الإمساك (بأمر الطبيب)</text><rect x="50" y="52" width="540" height="54" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="320" y="74" text-anchor="middle" font-size="15" font-weight="800" fill="#1e40af">1) علاج السبب + مراجعة الأدوية</text><text x="320" y="94" text-anchor="middle" font-size="12.5" fill="#1e40af">أفيونات/مضادات الكولين/نقص بوتاسيوم/خمول الغدة</text><text x="320" y="123" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="130" width="540" height="54" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="320" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#166534">2) أكل ألياف + سوائل + حركة + عادة الحمّام</text><text x="320" y="172" text-anchor="middle" font-size="12.5" fill="#166534">ردة، خضار وفاكهة، زبادي، لتران سوائل</text><text x="320" y="201" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="208" width="540" height="54" rx="12" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="320" y="230" text-anchor="middle" font-size="15" font-weight="800" fill="#854d0e">3) ملين مُحجِّم أو أسموزي</text><text x="320" y="250" text-anchor="middle" font-size="12.5" fill="#854d0e">Evaculax / Agiolax / Lactulose</text><text x="320" y="279" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="286" width="540" height="54" rx="12" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="320" y="308" text-anchor="middle" font-size="15" font-weight="800" fill="#9a3412">4) ملين منبّه (قصير المدة)</text><text x="320" y="328" text-anchor="middle" font-size="12.5" fill="#9a3412">Purgaton / Picolax</text><text x="320" y="357" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="364" width="540" height="54" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/><text x="320" y="386" text-anchor="middle" font-size="15" font-weight="800" fill="#991b1b">5) تحاميل أو حقنة شرجية</text><text x="320" y="406" text-anchor="middle" font-size="12.5" fill="#991b1b">Glycerin / Enema / Enemax عند الفشل</text><text x="320" y="446" text-anchor="middle" font-size="12.5" fill="#475569">ابدأ من الخطوة الأولى. الحقنة الشرجية للحالات اللي ما استجابتش</text></svg>