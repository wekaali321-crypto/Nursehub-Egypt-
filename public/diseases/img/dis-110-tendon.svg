<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="330" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">وتر أخيل (Achilles tendon) وأين يظهر الألم</text><ellipse cx="200" cy="120" rx="52" ry="62" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><text x="200" y="118" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">عضلة السمانة</text><text x="200" y="138" text-anchor="middle" font-size="12" fill="#7f1d1d">(Calf muscle)</text><rect x="185" y="180" width="30" height="85" rx="8" fill="#fde68a" stroke="#a16207" stroke-width="2"/><ellipse cx="200" cy="285" rx="36" ry="22" fill="#e2e8f0" stroke="#475569" stroke-width="2"/><text x="200" y="290" text-anchor="middle" font-size="12" fill="#334155">عظمة الكعب</text><line x1="215" y1="225" x2="340" y2="225" stroke="#a16207" stroke-width="2"/><text x="440" y="222" text-anchor="middle" font-size="14" font-weight="800" fill="#854d0e">وتر أخيل</text><text x="440" y="242" text-anchor="middle" font-size="12.5" fill="#854d0e">أكثر مكان للالتهاب: 2-6 سم فوق الكعب</text><line x1="240" y1="120" x2="340" y2="120" stroke="#b91c1c" stroke-width="2"/><text x="450" y="116" text-anchor="middle" font-size="14" font-weight="800" fill="#991b1b">ألم السمانة</text><text x="450" y="136" text-anchor="middle" font-size="12.5" fill="#991b1b">ويزيد بثني القدم لأعلى (Dorsiflexion)</text><text x="320" y="320" text-anchor="middle" font-size="12.5" fill="#475569">ألم السمانة مع تورم الساق قد يكون جلطة وريدية: يستبعدها الطبيب</text></svg>