<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="348" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أولويات علاج فرط البوتاسيوم</text><rect x="20" y="54" width="600" height="53" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="590" cy="76" r="14" fill="#dc2626"/><text x="590" y="81" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="566" y="80" text-anchor="start" font-size="15" font-weight="800" fill="#7f1d1d">كالسيوم جلوكونات وريدي</text><text x="566" y="100" text-anchor="start" font-size="13" fill="#7f1d1d">يحمي القلب من اضطراب النظم (لا يخفض K).</text><text x="320" y="123" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="129" width="600" height="53" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="590" cy="151" r="14" fill="#dc2626"/><text x="590" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="566" y="155" text-anchor="start" font-size="15" font-weight="800" fill="#7f1d1d">50% ديكستروز + إنسولين عادي وريدي</text><text x="566" y="175" text-anchor="start" font-size="13" fill="#7f1d1d">يُدخل البوتاسيوم إلى الخلايا.</text><text x="320" y="198" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="204" width="600" height="53" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="590" cy="226" r="14" fill="#dc2626"/><text x="590" y="231" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="566" y="230" text-anchor="start" font-size="15" font-weight="800" fill="#7f1d1d">Kayexalate (polystyrene sulfonate)</text><text x="566" y="250" text-anchor="start" font-size="13" fill="#7f1d1d">يزيل البوتاسيوم عبر الأمعاء.</text><text x="320" y="273" text-anchor="middle" font-size="16" fill="#64748b">▼</text><