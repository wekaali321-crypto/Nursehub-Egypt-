<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 298" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="298" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قطع الأسهر: ما بعد العملية</text><rect x="30" y="54" width="580" height="54" rx="10" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="578" cy="81" r="14" fill="#0ea5e9"/><text x="578" y="86" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="554" y="76" text-anchor="start" font-size="13.5" fill="#0f172a">قطع الأسهر (Vas deferens) وسيلة منع حمل دائمة للرجل؛ لا تخرج النطاف</text><text x="554" y="95.575" text-anchor="start" font-size="13.5" fill="#0f172a">مع القذف بل يمتصها الجسم</text><text x="320" y="119" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="122" width="580" height="40" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.5"/><circle cx="578" cy="142" r="14" fill="#f59e0b"/><text x="578" y="147" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="554" y="147" text-anchor="start" font-size="13.5" fill="#0f172a">يلزم استعمال وسيلة بديلة بعد العملية</text><text x="320" y="173" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="176" width="580" height="40" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.5"/><circle cx="578" cy="196" r="14" fill="#ef4444"/><text x="578" y="201" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="554" y="201" text-anchor="start" font-size="13.5" fill="#0f172a">لا تعتمد على «3 أشهر» أو «10 قذفات»</text><text x="320" y="227" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="230" width="580" height="54" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="1.5"/><circle cx="578" cy="257" r="14" fill="#10b981"/><text x="578" y="262" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="554" y="252" text-anchor="start" font-size="13.5" fill="#0f172a">الإذن بالجماع غير المحمي فقط حين يعلن الطبيب خلو السائل المنوي من</text><text x="554" y="271.575" text-anchor="start" font-size="13.5" fill="#0f172a">النطاف</text></svg>
