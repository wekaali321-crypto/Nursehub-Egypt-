<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="640" height="420" rx="16" fill="#f8fafc"/>
<text x="320.0" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">بطء القلب على الـECG: ابحث عن P وPR</text>
<rect x="210" y="40" width="220" height="40" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="320.0" y="64.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">نبض أقل من 60 على التخطيط</text>
<line x1="320" y1="80" x2="320" y2="100" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="180" y="100" width="280" height="40" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="320.0" y="124.33333333333333" text-anchor="middle" font-size="13" font-weight="700" fill="12.5">كم موجة P لكل QRS؟  وهل PR طبيعي؟</text>
<line x1="210" y1="140" x2="100" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="320" y1="140" x2="320" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="430" y1="140" x2="540" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="10" y="170" width="200" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="110.0" y="193.5" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">P واحدة لكل QRS</text>
<text x="110.0" y="210.5" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">+ PR طبيعي</text>
<text x="110.0" y="227.5" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">⟵ بطء جيبي</text>
<text x="110.0" y="244.5" text-anchor="middle" font-size="12" font-weight="600" fill="#14532d">Sinus bradycardia</text>
<rect x="220" y="170" width="200" height="90" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="320.0" y="193.5" text-anchor="middle" font-size="12" font-weight="700" fill="#78350f">2 أو 3 P لكل QRS</text>
<text x="320.0" y="210.5" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">PR ثابت في النبضات الموصلة</text>
<text x="320.0" y="227.5" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">⟵ Mobitz II</text>
<text x="320.0" y="244.5" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">(حصار درجة ثانية)</text>
<rect x="430" y="170" width="200" height="90" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="530.0" y="193.5" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">PR متغير + P مستقلة</text>
<text x="530.0" y="210.5" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">انفصال AV</text>
<text x="530.0" y="227.5" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">⟵ حصار كامل</text>
<text x="530.0" y="244.5" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">(Complete heart block)</text>
<rect x="430" y="276" width="200" height="54" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="530.0" y="298.5833333333333" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7f1d1d">حصار عالٍ: QRS ضيق</text>
<text x="530.0" y="315.0833333333333" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7f1d1d">حصار سفلي: QRS عريض (أخطر)</text>
<line x1="530" y1="260" x2="530" y2="276" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="220" y="276" width="200" height="54" rx="10" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
<text x="320.0" y="298.5833333333333" text-anchor="middle" font-size="11.5" font-weight="700" fill="#78350f">أخطر من Mobitz I</text>
<text x="320.0" y="315.0833333333333" text-anchor="middle" font-size="11.5" font-weight="600" fill="#78350f">جهّز باسر (Pacing)</text>
<line x1="320" y1="260" x2="320" y2="276" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="320" y="360" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">غير مستقر (دوخة، إغماء، ضغط منخفض، ألم صدر): أتروبين ← باسر ← دوبامين/أدرينالين</text>
<text x="320" y="384" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">تذكّر: ECG + أعراض المريض + الضغط — مش الورقة وحدها</text></svg>