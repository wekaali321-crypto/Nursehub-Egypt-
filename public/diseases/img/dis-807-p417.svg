<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="330" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الحمل وhCG ووسائل منع الحمل</text><rect x="30" y="54" width="580" height="40" rx="10" fill="#ec4899" fill-opacity="0.14" stroke="#ec4899" stroke-width="1.5"/><circle cx="578" cy="74" r="14" fill="#ec4899"/><text x="578" y="79" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="554" y="79" text-anchor="start" font-size="13.5" fill="#0f172a">عند الإخصاب تتوقف الدورة لأن الجنين يلتصق بجدار الرحم</text><text x="320" y="105" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="108" width="580" height="40" rx="10" fill="#6366f1" fill-opacity="0.14" stroke="#6366f1" stroke-width="1.5"/><circle cx="578" cy="128" r="14" fill="#6366f1"/><text x="578" y="133" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="554" y="133" text-anchor="start" font-size="13.5" fill="#0f172a">الجنين يفرز hCG (الهرمون الذي يكشفه اختبار الحمل)</text><text x="320" y="159" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="162" width="580" height="40" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="1.5"/><circle cx="578" cy="182" r="14" fill="#10b981"/><text x="578" y="187" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="554" y="187" text-anchor="start" font-size="13.5" fill="#0f172a">hCG يُبقي الجسم الأصفر نشطًا فيبقى الاستروجين والبروجسترون مرتفعين</text><rect x="325" y="212" width="295" height="103.6" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="325" y="212" width="295" height="29" rx="10" fill="#f59e0b"/><text x="612" y="230" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">حبوب/حلقة منع الحمل</text><text x="612" y="257" text-anchor="start" font-size="13" fill="#0f172a">• تُبقي الاستروجين والبروجسترون</text><text x="612" y="275.2" text-anchor="start" font-size="13" fill="#0f172a">مرتفعين</text><text x="612" y="298.4" text-anchor="start" font-size="13" fill="#0f172a">• تضبط الإباضة وتمنع الإخصاب</text><rect x="20" y="212" width="295" height="103.6" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="20" y="212" width="295" height="29" rx="10" fill="#ef4444"/><text x="307" y="230" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">حبة اليوم التالي</text><text x="307" y="257" text-anchor="start" font-size="13" fill="#0f172a">• منع حمل طارئ (مثل Plan B)</text><text x="307" y="280.2" text-anchor="start" font-size="13" fill="#0f172a">• تعمل أساسًا بتأخير/منع الإباضة، ولا</text><text x="307" y="298.4" text-anchor="start" font-size="13" fill="#0f172a">تُنهي حملًا قائمًا</text></svg>
