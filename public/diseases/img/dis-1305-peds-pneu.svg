<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 418" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="418" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الالتهاب الرئوي: علامات ومضاعفات (مراجعة امتحانات)</text><rect x="325" y="48" width="295" height="172" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">العلامات</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">تغير الحالة الذهنية: عدم راحة، هياج،</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">ارتباك</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">حمى فوق 100.4°ف (38°م)</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">سعال منتج وخراخر ناعمة/خشنة</text><text x="610" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">ضيق نفس</text><text x="610" y="200" text-anchor="start" font-size="12.5" fill="#1e293b">ألم صدر جنبي واحتكاك جنبي: أبلغ الطبيب</text><rect x="20" y="48" width="295" height="172" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الانصباب الجنبي</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">DDDD: ألم عند الشهيق، ضيق نفس، أصوات تنفس</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">منخفضة، رنين مكتوم (Dull)</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">أبلغ: عدم تماثل حركة الصدر وانخفاض أصوات</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">التنفس</text><rect x="325" y="230" width="295" height="172" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="230" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">ARDS</text><text x="610" y="282" text-anchor="start" font-size="12.5" fill="#1e293b">رئتان متيبستان</text><text x="610" y="302" text-anchor="start" font-size="12.5" fill="#1e293b">نقص أكسجة عنيد (Refractory hypoxemia) لا</text><text x="610" y="322" text-anchor="start" font-size="12.5" fill="#1e293b">يستجيب للأكسجين</text><text x="610" y="342" text-anchor="start" font-size="12.5" fill="#1e293b">أول علامة نقص أكسجين: تغير ذهني (ارتباك،</text><text x="610" y="362" text-anchor="start" font-size="12.5" fill="#1e293b">هياج، عدم راحة)</text><rect x="20" y="230" width="295" height="172" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><rect x="20" y="230" width="295" height="30" rx="12" fill="#9333ea"/><text x="167.5" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الصدمة الإنتانية</text><text x="305" y="282" text-anchor="start" font-size="12.5" fill="#1e293b">SBP أقل من 90، MAP أقل من 65</text><text x="305" y="302" text-anchor="start" font-size="12.5" fill="#1e293b">تعبئة شعرية أكثر من 3–4 ثوانٍ، تسرع قلب</text><text x="305" y="322" text-anchor="start" font-size="12.5" fill="#1e293b">مبكرًا حمى؛ متأخرًا انخفاض حرارة تحت</text><text x="305" y="342" text-anchor="start" font-size="12.5" fill="#1e293b">96.8°ف</text><text x="305" y="362" text-anchor="start" font-size="12.5" fill="#1e293b">WBC مرتفع (الطبيعي حتى 10000)</text><text x="305" y="382" text-anchor="start" font-size="12.5" fill="#1e293b">بول 30 مل/ساعة أو أقل = قصور كلوي</text>
</svg>
