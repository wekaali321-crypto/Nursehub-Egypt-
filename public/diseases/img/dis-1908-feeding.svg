<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="256" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التغذية قبل الجراحة وبعدها</text><rect x="325" y="48" width="295" height="192" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">قبل الجراحة (5 نقاط)</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">زجاجات أو حلمات خاصة</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">تجشؤ متكرر</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">وضع منتصب أثناء الرضاعة</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">وجّه الزجاجة للأسفل وبعيدًا عن الشق</text><text x="610" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">أطل الرضاعة إلى 20–30 دقيقة</text><rect x="20" y="48" width="295" height="192" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">بعد الجراحة (4 نقاط)</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">لا شيء بالفم: لهّاية ولا شفاطة ولا خافض</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">لسان</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">بعد الرضاعة: منتصب أو مستلقٍ بظهره ورأس</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">مرتفع</text><text x="305" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">الأهل يحتضنون ويطمئنون الطفل</text><text x="305" y="200" text-anchor="start" font-size="12.5" fill="#1e293b">أزل مثبتات الكوع حسب السياسة وقيّم الجلد</text><text x="305" y="220" text-anchor="start" font-size="12.5" fill="#1e293b">والدورة (طبّق وحرّر كل ساعة)</text>
</svg>
