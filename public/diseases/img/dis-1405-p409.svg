<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 316" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="316" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع سلس البول الثلاثة</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="163.2" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#f59e0b"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">إلحاحي (Urge)</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• رغبة مفاجئة قوية</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">بالتبول</text><text x="612" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• يُعرف بالمثانة العصبية</text><text x="612" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">(فقد السيطرة)</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="163.2" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#6366f1"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">إجهادي (Stress)</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• ضغط بطني: سعال، ضحك،</text><text x="408.66666666666663" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">عطس، جري، قفز</text><text x="408.66666666666663" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• سببه ضعف العضلات حول</text><text x="408.66666666666663" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">الإحليل، ويحدث حين</text><text x="408.66666666666663" y="176.8" text-anchor="start" font-size="13" fill="#0f172a">يتجاوز ضغط البطن مقاومة</text><text x="408.66666666666663" y="195" text-anchor="start" font-size="13" fill="#0f172a">الإحليل</text><rect x="20" y="54" width="193.33333333333334" height="163.2" rx="10" fill="#14b8a6" fill-opacity="0.1" stroke="#14b8a6" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#14b8a6"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">فيضي (Overflow)</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• تنقيط/تسريب مستمر</text><text x="205.33333333333334" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• تفريغ غير كامل للمثانة</text><text x="205.33333333333334" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• أسباب: تضخم</text><text x="205.33333333333334" y="163.6" text-anchor="start" font-size="13" fill="#0f172a">البروستاتا، اعتلال أعصاب</text><text x="205.33333333333334" y="181.8" text-anchor="start" font-size="13" fill="#0f172a">السكري، إصابة النخاع،</text><text x="205.33333333333334" y="200" text-anchor="start" font-size="13" fill="#0f172a">هبوط الإحليل</text><rect x="20" y="227.2" width="600" height="74" rx="10" fill="#0ea5e9" fill-opacity="0.13" stroke="#0ea5e9" stroke-width="1.5"/><text x="610" y="247.2" text-anchor="start" font-size="13.5" font-weight="800" fill="#0ea5e9">أسئلة تدريبية</text><text x="610" y="267.2" text-anchor="start" font-size="13" fill="#0f172a">الرجل الذي يشكو من سلس: تأكد من فحص البروستاتا. وعند المسنة: المتوقع انخفاض</text><text x="610" y="286.2" text-anchor="start" font-size="13" fill="#0f172a">قوة العضلات بالتقدم في العمر.</text></svg>
