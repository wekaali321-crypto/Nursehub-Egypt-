<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="470" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الإنعاش القلبي الرئوي للبالغ: الأرقام الأساسية ومواضع لصقات AED</text>
  <rect x="330" y="50" width="290" height="200" rx="10" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">الأرقام المفتاحية</text><text x="608" y="96" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• المعدل 100–120 ضغطة/دقيقة</text><text x="608" y="123" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• العمق على الأقل 5–6 سم (2–2.4 بوصة)</text><text x="608" y="150" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• اليدان في منتصف الصدر: النصف السفلي من القص</text><text x="608" y="177" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• يدوي: 30 ضغطة : نفسان إنقاذيان</text><text x="608" y="204" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• بعد التنبيب: نفس كل 6 ثوانٍ دون توقف</text><text x="608" y="231" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• كل دقيقتين: توقف ≤10 ثوانٍ لفحص النبض</text><rect x="20" y="50" width="290" height="200" rx="10" fill="#ffedd5" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">صدمة البالغ (AED)</text><text x="298" y="96" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• 1) ضع اللصقات</text><text x="298" y="123" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• 2) نادِ «ابتعدوا» وتأكد أن لا أحد يلمس</text><text x="298" y="150" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• 3) استأنف الضغطات فورًا بعد الصدمة</text><text x="298" y="177" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• بلا تخدير وريدي</text><text x="298" y="204" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• لا زر Synchronize (هذا للتحويل الكهربائي)</text><rect x="250" y="270" width="140" height="170" rx="30" fill="#fde7d3" stroke="#d6a77a" stroke-width="1.5"/><rect x="285" y="300" width="70" height="12" rx="6" fill="#e2e8f0"/><rect x="260" y="285" width="40" height="28" rx="6" fill="#a78bfa"/><rect x="335" y="350" width="40" height="28" rx="6" fill="#a78bfa"/><text x="160" y="296" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">لصقة أعلى يمين الصدر قرب الكتف</text><line x1="255" y1="299" x2="215" y2="299" stroke="#a78bfa" stroke-width="2" /><text x="480" y="365" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">لصقة جانبية يسار الصدر</text><text x="480" y="383" text-anchor="middle" font-size="12" font-weight="500" fill="#1e293b">(الإبط الأمامي أسفل الحلمة)</text><line x1="380" y1="364" x2="420" y2="364" stroke="#a78bfa" stroke-width="2" /><text x="320" y="460" text-anchor="middle" font-size="12.5" font-weight="500" fill="#475569">AED للعمر 8 سنوات فأكثر: لصقتان على الصدر</text>
</svg>
