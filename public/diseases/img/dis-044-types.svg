<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 217" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="217" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">نوعا الالتهاب الرئوي</text><rect x="497" y="50" width="127" height="32" fill="#2563eb"/><text x="561" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">النوع</text><rect x="333" y="50" width="165" height="32" fill="#2563eb"/><text x="415" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التعريف</text><rect x="16" y="50" width="317" height="32" fill="#2563eb"/><text x="174" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">السبب والعلامات</text><rect x="497" y="82" width="127" height="69" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="102" text-anchor="start" font-size="13" fill="#0f172a">الفصي Lobar</text><rect x="333" y="82" width="165" height="69" fill="#ffffff" stroke="#cbd5e1"/><text x="489" y="102" text-anchor="start" font-size="13" fill="#0f172a">عدوى في فص أو أكثر</text><rect x="16" y="82" width="317" height="69" fill="#ffffff" stroke="#cbd5e1"/><text x="325" y="102" text-anchor="start" font-size="13" fill="#0f172a">المكورات الرئوية Streptococcus pneumoniae؛</text><text x="325" y="121" text-anchor="start" font-size="13" fill="#0f172a">بداية مفاجئة، خرخرة، بلغم صدئي؛ مضاعفة:</text><text x="325" y="140" text-anchor="start" font-size="13" fill="#0f172a">دبيلة جنبية (Pleural empyema: تجمع صديد)</text><rect x="497" y="151" width="127" height="50" fill="#dbeafe" stroke="#cbd5e1"/><text x="616" y="171" text-anchor="start" font-size="13" fill="#0f172a">القصبي الرئوي</text><text x="616" y="190" text-anchor="start" font-size="13" fill="#0f172a">Bronchopneumonia</text><rect x="333" y="151" width="165" height="50" fill="#dbeafe" stroke="#cbd5e1"/><text x="489" y="171" text-anchor="start" font-size="13" fill="#0f172a">عدوى منتشرة في الرئتين</text><text x="489" y="190" text-anchor="start" font-size="13" fill="#0f172a">معًا</text><rect x="16" y="151" width="317" height="50" fill="#dbeafe" stroke="#cbd5e1"/><text x="325" y="171" text-anchor="start" font-size="13" fill="#0f172a">عدة كائنات؛ بلغم أصفر أو أخضر وسعال منتج</text></svg>