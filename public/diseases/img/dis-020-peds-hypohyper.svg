<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 234" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="234" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ارتفاع وانخفاض السكر: الفرق السريع</text><rect x="325" y="48" width="295" height="144" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">ارتفاع السكر (Hyperglycemia)</text><text x="610" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">"ساخن وجاف": جلد جاف وسكر عالٍ</text><text x="610" y="120" text-anchor="end" font-size="12.5" fill="#1e293b">3 P: بوال (Polyuria)، عطش (Polydipsia)،</text><text x="610" y="140" text-anchor="end" font-size="12.5" fill="#1e293b">شراهة (Polyphagia)</text><text x="610" y="160" text-anchor="end" font-size="12.5" fill="#1e293b">بول أصفر داكن</text><rect x="20" y="48" width="295" height="144" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">انخفاض السكر (70 فأقل)</text><text x="305" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">"بارد ولزج": شحوب وتعرق</text><text x="305" y="120" text-anchor="end" font-size="12.5" fill="#1e293b">رعشة وعصبية وقلق</text><text x="305" y="140" text-anchor="end" font-size="12.5" fill="#1e293b">HIWASH: صداع، عصبية، ضعف، قلق، تعرق، رعشة،</text><text x="305" y="160" text-anchor="end" font-size="12.5" fill="#1e293b">جوع</text><text x="305" y="180" text-anchor="end" font-size="12.5" fill="#1e293b">أخطر: الدماغ يتضرر</text><text x="320" y="216" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">الطفل المولود: رعشة، عصبية، دحرجة العين، بكاء حاد</text>
</svg>
