<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="330" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">انتشار الصفرة في الجسم (تقدير بالعين)</text>
  <!-- baby silhouette zones -->
  <g stroke="#64748b" stroke-width="1.5">
    <circle cx="150" cy="75" r="30" fill="#fef9c3"/>
    <rect x="115" y="105" width="70" height="55" rx="10" fill="#fde68a"/>
    <rect x="115" y="160" width="70" height="55" rx="10" fill="#fcd34d"/>
    <rect x="100" y="215" width="38" height="60" rx="10" fill="#fbbf24"/>
    <rect x="162" y="215" width="38" height="60" rx="10" fill="#fbbf24"/>
    <rect x="95" y="275" width="45" height="18" rx="8" fill="#f59e0b"/>
    <rect x="160" y="275" width="45" height="18" rx="8" fill="#f59e0b"/>
  </g>
  <g font-size="14" text-anchor="middle" fill="#0f172a">
    <text x="440" y="75"><tspan font-weight="700">الوجه والرقبة فقط</tspan> ← تقريباً 5 مجم/دل</text>
    <text x="440" y="130"><tspan font-weight="700">لحد السرة</tspan> ← تقريباً 10 مجم/دل</text>
    <text x="440" y="187"><tspan font-weight="700">لحد الركبة</tspan> ← تقريباً 12 مجم/دل</text>
    <text x="440" y="245"><tspan font-weight="700">لحد الكاحل</tspan> ← تقريباً 15 مجم/دل</text>
    <text x="440" y="285"><tspan font-weight="700">كف اليد والقدم</tspan> ← أكتر من 15 مجم/دل</text>
  </g>
  <text x="320" y="318" text-anchor="middle" font-size="12" fill="#475569">الصفرة بتنزل من الراس للرجل. التقدير بالعين تقريبي فقط: القرار بتحليل البيليروبين (TSB) أو جهاز القياس الجلدي.</text>
</svg>
