<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="420" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مضاعفات القنية الوريدية الطرفية</text>
  <rect x="330" y="50" width="290" height="160" rx="10" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">التهاب الوريد (Phlebitis)</text><text x="608" y="96" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• ألم واحمرار ودفء بموضع الإدخال</text><text x="608" y="115" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• انزع القنية فورًا وأعد في الطرف الآخر</text><text x="608" y="134" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• كمادة دافئة رطبة وبلّغ الطبيب</text><rect x="20" y="50" width="290" height="160" rx="10" fill="#e0f2fe" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">تسرب السوائل (Infiltration)</text><text x="298" y="96" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• الموضع بارد وشاحب ومنتفخ</text><text x="298" y="115" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• انزع القنية وكمادة دافئة/باردة</text><text x="298" y="134" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• ارفع الطرف ولا تدلك</text><rect x="330" y="225" width="290" height="180" rx="10" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="247" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">انصمام هوائي (Air embolism)</text><text x="608" y="271" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• تسرع قلب، ألم صدر، ضيق نفس، هبوط ضغط، ازرقاق</text><text x="608" y="290" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• اغلق الأنبوب وضع المريض على الجنب الأيسر</text><text x="608" y="309" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• وضع Trendelenburg المعكوس وبلّغ</text><rect x="20" y="225" width="290" height="180" rx="10" fill="#fce7f3" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="247" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">تسرب دواء مؤذٍ (Extravasation)</text><text x="298" y="271" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• تلف أنسجة من أدوية مثل الدوبامين</text><text x="298" y="290" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• تغيّر لون وتقشر الجلد</text><text x="298" y="309" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• أوقف التسريب وبلّغ الطبيب</text>
</svg>
