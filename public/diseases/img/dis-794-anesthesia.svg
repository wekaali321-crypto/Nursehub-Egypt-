<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 198" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="198" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">أنواع التخدير</text><rect x="427.33333333333337" y="50" width="198.66666666666666" height="132" rx="12" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="427.33333333333337" y="50" width="198.66666666666666" height="28" rx="12" fill="#dc2626"/><text x="526.6666666666667" y="69" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">عام</text><text x="526.6666666666667" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">فاقد الوعي ولا يتنفس</text><text x="526.6666666666667" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">تلقائياً</text><text x="526.6666666666667" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">تنبيب وتنفس صناعي</text><text x="526.6666666666667" y="144" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">الألم محجوب</text><rect x="220.6666666666667" y="50" width="198.66666666666666" height="132" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><rect x="220.6666666666667" y="50" width="198.66666666666666" height="28" rx="12" fill="#2563eb"/><text x="320.00000000000006" y="69" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">موضعي/ناحي</text><text x="320.00000000000006" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">عصب (Nerve block)</text><text x="320.00000000000006" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">فوق الجافية (Epidural)</text><text x="320.00000000000006" y="128" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">نخاعي (Spinal): في السائل</text><text x="320.00000000000006" y="144" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">الشوكي؛ يبقى المريض مسطحاً</text><text x="320.00000000000006" y="160" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">لمنع الصداع</text><rect x="14.000000000000057" y="50" width="198.66666666666666" height="132" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><rect x="14.000000000000057" y="50" width="198.66666666666666" height="28" rx="12" fill="#16a34a"/><text x="113.33333333333339" y="69" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">تهدئة واعية</text><text x="113.33333333333339" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">للإجراءات الصغيرة</text><text x="113.33333333333339" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">يبقى المريض واعياً ومرتاحاً</text></svg>