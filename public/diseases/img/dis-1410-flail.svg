<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 386" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="386" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الصدر الطافي: الآلية والأولويات</text><rect x="20" y="54" width="600" height="53" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="590" cy="76" r="14" fill="#dc2626"/><text x="590" y="81" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="566" y="80" text-anchor="start" font-size="15" font-weight="800" fill="#7f1d1d">كسر الأضلاع</text><text x="566" y="100" text-anchor="start" font-size="13" fill="#7f1d1d">بعد رضوض كبرى: حادث سيارة، سقوط.</text><text x="320" y="123" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="129" width="600" height="72" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="590" cy="151" r="14" fill="#dc2626"/><text x="590" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="566" y="155" text-anchor="start" font-size="15" font-weight="800" fill="#7f1d1d">الصدر الطافي Flail chest</text><text x="566" y="175" text-anchor="start" font-size="13" fill="#7f1d1d">جزء من القفص الصدري ينفصل كليًا فيتحرك عكسيًا: يُسحب للداخل عند الشهيق</text><text x="566" y="194" text-anchor="start" font-size="13" fill="#7f1d1d">ويبرز عند الزفير (حركة متناقضة Paradoxical) — طارئ مهدد للحياة.</text><text x="320" y="217" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="223" width="600" height="72" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="590" cy="245" r="14" fill="#dc2626"/><text x="590" y="250" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="566" y="249" text-anchor="start" font-size="15" font-weight="800" fill="#7f1d1d">الأولوية الأولى</text><text x="566" y="269" text-anchor="start" font-size="13" fill="#7f1d1d">تسكين الألم بالأفيونات بأمر الطبيب (morphine، hydromorphone،</text><text x="566" y="288" text-anchor="start" font-size="13" fill="#7f1d1d">hydrocodone).</text><text x="320" y="311" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="317" width="600" height="53" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><circle cx="590" cy="339" r="14" fill="#dc2626"/><text x="590" y="344" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="566" y="343" text-anchor="start" font-size="15" font-weight="800" fill="#7f1d1d">بعد ضبط الألم</text><text x="566" y="363" text-anchor="start" font-size="13" fill="#7f1d1d">نظافة رئوية: TCDB (قلب، سعال، تنفس عميق) + مقياس التحفيز لمنع الانخماص.</text></svg>