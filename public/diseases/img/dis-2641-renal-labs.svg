<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="400" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قيم الكلى: H+ و Urea و Creatinine</text><rect x="430" y="46" width="190" height="100" rx="10" fill="#06b6d4"/><text x="525.0" y="83.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">H+</text><text x="525.0" y="99.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">أحماض: pH أقل من 7.35</text><text x="525.0" y="115.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">فشل الكلى والعدوى يحبسانه</text><rect x="225" y="46" width="190" height="100" rx="10" fill="#f97316"/><text x="320.0" y="83.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">BUN (يوريا)</text><text x="320.0" y="99.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">10-20 كحد أقصى</text><text x="320.0" y="115.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">ناتج هدم البروتين</text><rect x="20" y="46" width="190" height="100" rx="10" fill="#6366f1"/><text x="115.0" y="83.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Creatinine</text><text x="115.0" y="99.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">أكبر من 1.3 = كلى سيئة</text><text x="115.0" y="115.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">البول ≤30 مل/س = ضائقة</text><rect x="20" y="156" width="600" height="50" rx="10" fill="#fee2e2"/><text x="320.0" y="184.85" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">الأكثر عرضة للحماض الأيضي: فشل كلوي، التهاب حويضة، منتظر غسيل، طفل بإسهال يومين</text><rect x="20" y="214" width="600" height="44" rx="10" fill="#e2e8f0"/><text x="320.0" y="240.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">ليس: فرط التهوية من نوبة هلع</text><rect x="20" y="266" width="600" height="60" rx="10" fill="#fef3c7"/><text x="320.0" y="291.85" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">قبل قسطرة قلبية بصبغة لقدم سكري: أبلغ كرياتينين 1.9</text><text x="320.0" y="307.85" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">(وليس BUN 19 أو سكر 155 أو WBC 14500 الذي يقابل التهاب القدم)</text><rect x="20" y="336" width="600" height="56" rx="10" fill="#e0f2fe"/><text x="320.0" y="368.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">كلما ارتفع الكرياتينين ازداد القصور الكلوي</text></svg>