<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="460" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الربو عند الأطفال: الصورة الكاملة</text><rect x="330" y="50" width="290" height="90" rx="10" fill="#6366f1"/><text x="475.0" y="72.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الآلية</text><text x="475.0" y="89.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">التهاب مزمن بالشعب والقصيبات؛ نوبات عكوسة</text><text x="475.0" y="106.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">1) تضيق قصبي  2) مخاط وإفرازات</text><text x="475.0" y="123.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">الأكسجين لا يدخل وCO2 لا يخرج ← احتباس هواء</text><rect x="20" y="50" width="300" height="90" rx="10" fill="#f59e0b"/><text x="170.0" y="72.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">العلامات</text><text x="170.0" y="89.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">A استعمال العضلات المساعدة (تنفس متناقض)</text><text x="170.0" y="106.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">S ضيق نفس وجمل متقطعة · T ضيق وسرعة نفس</text><text x="170.0" y="123.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">H صفير عالٍ · M انخفاض الأصوات · A الصمت = خطر</text><rect x="330" y="155" width="290" height="100" rx="10" fill="#16a34a"/><text x="475.0" y="182.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">مقياس ذروة الزفير</text><text x="475.0" y="199.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">أخضر: 80-100% (تحت السيطرة)</text><text x="475.0" y="216.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">أصفر: غير مضبوط · دواء الإسعاف كل 4 ساعات 1-2 يوم وإبلاغ الطبيب</text><text x="475.0" y="233.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">أحمر: طوارئ إن لم يعد للأصفر بعد الدواء</text><rect x="20" y="155" width="300" height="100" rx="10" fill="#0ea5e9"/><text x="170.0" y="182.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">طريقة الاستعمال</text><text x="170.0" y="199.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">اجلس منتصبًا · اضبط المؤشر على الصفر</text><text x="170.0" y="216.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">شهيق عميق · ختم الشفتين · زفير سريع وقوي</text><text x="170.0" y="233.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">3 محاولات بين كل منها 5-10 ثوانٍ والأعلى هي الأخذ</text><rect x="330" y="270" width="290" height="90" rx="10" fill="#dc2626"/><text x="475.0" y="292.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">غازات الدم</text><text x="475.0" y="309.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">حمض: pH أقل من 7.35 وPaCO2 فوق 45</text><text x="475.0" y="326.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">نقص أكسجة: PaO2 دون 80</text><text x="475.0" y="343.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">أول علامة: تغير الحالة العقلية (تهيج، نعاس)</text><rect x="20" y="270" width="300" height="90" rx="10" fill="#7c3aed"/><text x="170.0" y="300.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">النبض المتناقض</text><text x="170.0" y="317.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">انخفاض الضغط الانقباضي أكثر من 10 ملم زئبق</text><text x="170.0" y="334.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">علامة الحالة الربوية؛ بعدها تنبيب</text><rect x="20" y="375" width="600" height="70" rx="10" fill="#334155"/><text x="320.0" y="412.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">المحفزات: رياضة، تدخين، تلوث، حساسية، عدوى، برد، توتر · تجنب: NSAIDs وحاصرات بيتا غير الانتقائية (بروبرانولول)</text></svg>