<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 375" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="375" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">زرع الكلية وخزعة الكلية</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="222.79999999999998" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">بعد الزرع</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• الناتج ≤ 30 مل/س =</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">الكلية في ضائقة</text><text x="612" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• حمى خفيفة = أول علامة</text><text x="612" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">عدوى</text><text x="612" y="181.8" text-anchor="start" font-size="13" fill="#0f172a">• ارتفاع الضغط + ألم</text><text x="612" y="200" text-anchor="start" font-size="13" fill="#0f172a">بموضع الكلية = رفض</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="222.79999999999998" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">قبل الخزعة: أوقف</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• مميعات الدم: heparin،</text><text x="408.66666666666663" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">warfarin</text><text x="408.66666666666663" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• مضادات الصفائح:</text><text x="408.66666666666663" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">aspirin، clopidogrel</text><text x="408.66666666666663" y="181.8" text-anchor="start" font-size="13" fill="#0f172a">• NSAIDs: ibuprofen،</text><text x="408.66666666666663" y="200" text-anchor="start" font-size="13" fill="#0f172a">naproxen</text><text x="408.66666666666663" y="223.20000000000002" text-anchor="start" font-size="13" fill="#0f172a">• مكملات: E،</text><text x="408.66666666666663" y="241.4" text-anchor="start" font-size="13" fill="#0f172a">جنكو/جينسنغ/ثوم، أوميغا</text><text x="408.66666666666663" y="259.6" text-anchor="start" font-size="13" fill="#0f172a">3، St John</text><rect x="20" y="54" width="193.33333333333334" height="222.79999999999998" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#0ea5e9"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">بعد الخزعة</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• علامات حيوية كل 15 د</text><text x="205.33333333333334" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">في الساعة الأولى</text><text x="205.33333333333334" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• رقود على الظهر مع ضغط</text><text x="205.33333333333334" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">على جهة الخزعة</text><text x="205.33333333333334" y="181.8" text-anchor="start" font-size="13" fill="#0f172a">• راقب النزف: بول دموي،</text><text x="205.33333333333334" y="200" text-anchor="start" font-size="13" fill="#0f172a">ألم خاصرة، هبوط ضغط</text><rect x="20" y="286.79999999999995" width="600" height="74" rx="10" fill="#6366f1" fill-opacity="0.13" stroke="#6366f1" stroke-width="1.5"/><text x="610" y="306.79999999999995" text-anchor="start" font-size="13.5" font-weight="800" fill="#6366f1">نقطة امتحان</text><text x="610" y="326.79999999999995" text-anchor="start" font-size="13" fill="#0f172a">بعد الزرع قد يحتاج المريض إلى غسيل دموي مؤقتًا حتى تبدأ الكلية الجديدة العمل</text><text x="610" y="345.79999999999995" text-anchor="start" font-size="13" fill="#0f172a">— هذا طبيعي ويُشرح للمريض قبل العملية.</text></svg>
