<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="340" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قبل الغسيل الدموي</text><rect x="326" y="56" width="298" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><rect x="326" y="56" width="298" height="30" rx="12" fill="#2563eb"/><text x="475" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">قيّم السوائل</text><text x="614" y="108" text-anchor="start" font-size="13" fill="#1e3a8a">الوزن الحالي والسابق</text><text x="614" y="127" text-anchor="start" font-size="13" fill="#1e3a8a">العلامات الحيوية</text><rect x="16" y="56" width="298" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><rect x="16" y="56" width="298" height="30" rx="12" fill="#16a34a"/><text x="165" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">قيّم الوصلة الشريانية الوريدية (Fistula)</text><text x="304" y="108" text-anchor="start" font-size="13" fill="#14532d">حسّ الاهتزاز Thrill</text><text x="304" y="127" text-anchor="start" font-size="13" fill="#14532d">سماع الأزيز Bruit</text><rect x="326" y="158" width="298" height="166" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><rect x="326" y="158" width="298" height="30" rx="12" fill="#d97706"/><text x="475" y="179" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">احجز خافضات الضغط</text><text x="614" y="210" text-anchor="start" font-size="13" fill="#78350f">ACEi / ARBs: lisinopril، losartan</text><text x="614" y="229" text-anchor="start" font-size="13" fill="#78350f">حاصرات بيتا: atenolol</text><text x="614" y="248" text-anchor="start" font-size="13" fill="#78350f">حاصرات الكالسيوم: nifedipine، verapamil،</text><text x="614" y="267" text-anchor="start" font-size="13" fill="#78350f">diltiazem</text><text x="614" y="286" text-anchor="start" font-size="13" fill="#78350f">مدرات: furosemide، hydrochlorothiazide</text><text x="614" y="305" text-anchor="start" font-size="13" fill="#78350f">موسعات: nitroglycerin</text><rect x="16" y="158" width="298" height="166" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><rect x="16" y="158" width="298" height="30" rx="12" fill="#dc2626"/><text x="165" y="179" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ما يُزال بالغسيل</text><text x="304" y="210" text-anchor="start" font-size="13" fill="#7f1d1d">المضادات الحيوية</text><text x="304" y="229" text-anchor="start" font-size="13" fill="#7f1d1d">digoxin</text><text x="304" y="248" text-anchor="start" font-size="13" fill="#7f1d1d">الفيتامينات الذائبة في الماء (B وC وحمض</text><text x="304" y="267" text-anchor="start" font-size="13" fill="#7f1d1d">الفوليك)</text></svg>