<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="290" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أمثلة أمبولات يذكر الكتاب إنها تتخلط في سرنجة واحدة</text>
<g font-size="14" font-weight="700" text-anchor="middle">
<rect x="430" y="55" width="190" height="40" rx="10" fill="#dbeafe"/><text x="525" y="80">Zantac + Primperan</text>
<rect x="225" y="55" width="190" height="40" rx="10" fill="#dcfce7"/><text x="320" y="80">Zantac + Visceralgine</text>
<rect x="20" y="55" width="190" height="40" rx="10" fill="#fef9c3"/><text x="115" y="80">Zantac + Dexamethasone</text>
<rect x="225" y="110" width="190" height="40" rx="10" fill="#fee2e2"/><text x="320" y="135">Primperan + Dexamethasone</text></g>
<text x="320" y="190" text-anchor="middle" font-size="14" fill="#b91c1c" font-weight="700">أي عكارة / ترسيب / تغير لون = ارمِ السرنجة ولا تعطِها</text>
<text x="320" y="218" text-anchor="middle" font-size="13" fill="#334155">اختفاء التغير المرئي لا يعني بالضرورة توافقاً كيميائياً</text>
<text x="320" y="245" text-anchor="middle" font-size="12" fill="#64748b">الأصل: كل دواء في سرنجة منفصلة إلا لو التوافق مؤكد من جدول أو صيدلي</text></svg>