<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="340" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ورم الأرومة الشبكية (Retinoblastoma)</text><rect x="330" y="50" width="290" height="80" rx="10" fill="#6366f1"/><text x="475.0" y="75.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الآلية</text><text x="475.0" y="93.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">أشيع سرطان عين بالطفولة</text><text x="475.0" y="111.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">يُشخّص غالبًا قبل عمر سنتين</text><rect x="20" y="50" width="300" height="80" rx="10" fill="#ef4444"/><text x="170.0" y="75.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلامات</text><text x="170.0" y="92.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">حدقة بيضاء (Leukocoria)</text><text x="170.0" y="109.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">غياب الانعكاس الأحمر · الحول علامة متأخرة</text><rect x="20" y="145" width="300" height="90" rx="10" fill="#16a34a"/><text x="170.0" y="184.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التدخلات</text><text x="170.0" y="202.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">فحص عيون الإخوة (بعض الأنواع وراثية)</text><rect x="330" y="145" width="290" height="90" rx="10" fill="#0ea5e9"/><text x="475.0" y="175.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج</text><text x="475.0" y="192.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">علاج إشعاعي</text><text x="475.0" y="209.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">استئصال العين (Enucleation) وزرع عين صناعية</text><rect x="20" y="250" width="600" height="70" rx="10" fill="#334155"/><text x="320.0" y="288.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تظهر عادة حين يلاحظ الأهل بقعة بيضاء بصورة بفلاش</text></svg>