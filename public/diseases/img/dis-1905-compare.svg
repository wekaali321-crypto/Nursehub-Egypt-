<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 228" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="228" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">متلازمة داون ومتلازمة مارفان</text><rect x="325" y="48" width="295" height="164" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Down — تثلث الصبغي 21</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">كروموسوم 21 إضافي (Trisomy 21)</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">تأخر نمو جسدي وعقلي</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">نفخة قلبية (نقطة امتحان)</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">جسر أنف مسطح، أنف وفم وأذن صغيرة</text><text x="610" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">قصر وبنية ممتلئة، لسان بارز، قلة توتر عضلي</text><text x="610" y="200" text-anchor="start" font-size="12.5" fill="#1e293b">قبة حنك عالية وضيقة، فواصل جمجمة متباعدة</text><rect x="20" y="48" width="295" height="164" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Marfan — النسيج الضام</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">وراثي: القلب والعضلات والعظام والعيون</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">والأوعية</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">طول فارع ونحافة، أطراف وأصابع طويلة</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">Scoliosis وانحناء عمود S</text><text x="305" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">Aorta: أم دم/تمزق أورطي</text><text x="305" y="200" text-anchor="start" font-size="12.5" fill="#1e293b">تجنب الرياضات العنيفة</text>
</svg>
