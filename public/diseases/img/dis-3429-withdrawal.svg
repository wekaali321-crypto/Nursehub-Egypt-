<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 214" width="640" height="214" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="أدوية الانسحاب والإدمان: Methadone وDisulfiram"><rect width="640" height="214" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">أدوية الانسحاب والإدمان: Methadone وDisulfiram</text><rect x="326.0" y="46" width="302.0" height="152" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Methadone (انسحاب الأفيونات)</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• نصف عمر طويل</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• علامات سمية مبكرة: غثيان وقيء وخمول، قيء</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">   متكرر</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• راقب إطالة QT (ECG)</text><text x="616.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• راقب التشبع أقل من 90% (الطبيعي 95–100%)</text><text x="616.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">• المريض ينام بسهولة: خطر</text><rect x="12.0" y="46" width="302.0" height="134" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="12.0" y="60" width="302.0" height="14" fill="#a86a00"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Disulfiram (Antabuse)</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• يُستعمل لمنع معاودة الكحول (وليس لعلاج</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   الانسحاب)</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• تحذير: منتجات تحتوي كحولًا (كحول</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">   التدليك، مستحضرات التجميل/الحرف) قد تسبب</text><text x="302.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">   تفاعلًا</text></svg>