<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="600" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تشريح المفاصل</text>
<ellipse cx="320" cy="68" rx="16" ry="20" fill="#e7e2d3" stroke="#a8a08a" stroke-width="1.5"/><rect x="317" y="88" width="6" height="12" rx="2" fill="#e7e2d3" stroke="#a8a08a" stroke-width="1.5"/><rect x="296" y="100" width="48" height="70" rx="14" fill="#e7e2d3" stroke="#a8a08a" stroke-width="1.5"/><rect x="298" y="170" width="44" height="26" rx="8" fill="#e7e2d3" stroke="#a8a08a" stroke-width="1.5"/><rect x="272" y="104" width="12" height="80" rx="6" fill="#e7e2d3" stroke="#a8a08a" stroke-width="1.5"/><rect x="356" y="104" width="12" height="80" rx="6" fill="#e7e2d3" stroke="#a8a08a" stroke-width="1.5"/><rect x="300" y="196" width="14" height="90" rx="6" fill="#e7e2d3" stroke="#a8a08a" stroke-width="1.5"/><rect x="326" y="196" width="14" height="90" rx="6" fill="#e7e2d3" stroke="#a8a08a" stroke-width="1.5"/><rect x="8" y="68" width="124" height="50" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="1.5"/><text x="70" y="86" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">محوري Pivot</text><text x="70" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">دوران: C1-C2</text><line x1="132" y1="93" x2="210" y2="95" stroke="#0ea5e9" stroke-width="1.5"/><rect x="8" y="148" width="124" height="50" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="1.5"/><text x="70" y="166" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">سرجي Saddle</text><text x="70" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">قاعدة الإبهام</text><line x1="132" y1="173" x2="230" y2="170" stroke="#0ea5e9" stroke-width="1.5"/><rect x="8" y="233" width="124" height="50" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="1.5"/><text x="70" y="251" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">انزلاقي Plane</text><text x="70" y="269" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">الرسغ والقدم</text><line x1="132" y1="258" x2="250" y2="300" stroke="#0ea5e9" stroke-width="1.5"/><rect x="508" y="68" width="124" height="50" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="1.5"/><text x="570" y="86" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">مفصلي Hinge</text><text x="570" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">المرفق والركبة</text><line x1="508" y1="93" x2="395" y2="125" stroke="#0ea5e9" stroke-width="1.5"/><rect x="508" y="148" width="124" height="50" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="1.5"/><text x="570" y="166" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">لقمي Condyloid</text><text x="570" y="184" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">الرسغ (كعبرة-رسغيات)</text><line x1="508" y1="173" x2="405" y2="165" stroke="#0ea5e9" stroke-width="1.5"/><rect x="508" y="233" width="124" height="50" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="1.5"/><text x="570" y="251" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">كروي حقي Ball &amp; socket</text><text x="570" y="269" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">الكتف والورك</text><line x1="508" y1="258" x2="350" y2="175" stroke="#0ea5e9" stroke-width="1.5"/><rect x="20" y="350" width="600" height="240" rx="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="600" y="376" text-anchor="start" font-size="13" font-weight="800" fill="#0f172a">أنواع المفاصل حسب الحركة:</text><text x="600" y="400" text-anchor="start" font-size="12" font-weight="500" fill="#0f172a">Synarthrosis: ثابت (جمجمة، قص، حوض)</text><text x="600" y="420" text-anchor="start" font-size="12" font-weight="500" fill="#0f172a">Amphiarthrosis: حركة محدودة (أقراص الفقرات، الارتفاق العاني)</text><text x="600" y="440" text-anchor="start" font-size="12" font-weight="500" fill="#0f172a">Diarthrosis: حر الحركة (أطراف، كتف، مرفق، أصابع، ورك، ركبة)</text><text x="600" y="480" text-anchor="start" font-size="12" font-weight="500" fill="#0f172a">المفصل الزلالي:</text><text x="600" y="500" text-anchor="start" font-size="12" font-weight="500" fill="#0f172a">الطبقة الخارجية: محفظة ليفية تلتحم بسمحاق العظم</text><text x="600" y="520" text-anchor="start" font-size="12" font-weight="500" fill="#0f172a">الطبقة الداخلية: غشاء زلالي بلا أوعية دموية أو لمفية</text><text x="600" y="540" text-anchor="start" font-size="12" font-weight="500" fill="#0f172a">يفرز سائلاً زلالياً لامتصاص الصدمات والتزليق</text>
</svg>
