<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع المفاصل ومواضعها</text>
<rect x="326" y="48" width="294" height="82" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><rect x="326" y="48" width="294" height="28" rx="12" fill="#0ea5e9"/><rect x="326" y="64" width="294" height="12" fill="#0ea5e9"/><text x="473.0" y="67" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">مفصل مفصلي (Hinge)</text><text x="473.0" y="98" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">حركة في اتجاه واحد</text><text x="473.0" y="116" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">المرفق والركبة</text><rect x="20" y="48" width="294" height="82" rx="12" fill="#fff" stroke="#22c55e" stroke-width="2"/><rect x="20" y="48" width="294" height="28" rx="12" fill="#22c55e"/><rect x="20" y="64" width="294" height="12" fill="#22c55e"/><text x="167.0" y="67" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">كروي حقي (Ball &amp; socket)</text><text x="167.0" y="98" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">حركة في كل الاتجاهات</text><text x="167.0" y="116" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">الكتف والورك</text><rect x="326" y="142" width="294" height="82" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/><rect x="326" y="142" width="294" height="28" rx="12" fill="#f59e0b"/><rect x="326" y="158" width="294" height="12" fill="#f59e0b"/><text x="473.0" y="161" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">محوري (Pivot)</text><text x="473.0" y="192" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">دوران حول محور</text><text x="473.0" y="210" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">بين الفقرتين C1 وC2 وبين عظمتي الساعد</text><rect x="20" y="142" width="294" height="82" rx="12" fill="#fff" stroke="#ef4444" stroke-width="2"/><rect x="20" y="142" width="294" height="28" rx="12" fill="#ef4444"/><rect x="20" y="158" width="294" height="12" fill="#ef4444"/><text x="167.0" y="161" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">انزلاقي (Plane)</text><text x="167.0" y="192" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">انزلاق بين سطحين مسطحين</text><text x="167.0" y="210" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">الرسغ وعظام القدم</text><rect x="326" y="236" width="294" height="82" rx="12" fill="#fff" stroke="#8b5cf6" stroke-width="2"/><rect x="326" y="236" width="294" height="28" rx="12" fill="#8b5cf6"/><rect x="326" y="252" width="294" height="12" fill="#8b5cf6"/><text x="473.0" y="255" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">لقمي (Condyloid)</text><text x="473.0" y="286" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">حركة في اتجاهين</text><text x="473.0" y="304" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">الرسغ بين الكعبرة وعظام الرسغ</text><rect x="20" y="236" width="294" height="82" rx="12" fill="#fff" stroke="#14b8a6" stroke-width="2"/><rect x="20" y="236" width="294" height="28" rx="12" fill="#14b8a6"/><rect x="20" y="252" width="294" height="12" fill="#14b8a6"/><text x="167.0" y="255" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">سرجي (Saddle)</text><text x="167.0" y="286" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">حركة في اتجاهين مثل السرج</text><text x="167.0" y="304" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">قاعدة الإبهام</text>
