<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 385" direction="rtl" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="385" rx="12" fill="#f7fafc"/><text x="320" y="32" font-size="18" fill="#1a202c" text-anchor="middle" font-weight="bold">زاوية الحقن تحت الجلد</text><rect x="40" y="150" width="560" height="40" rx="4" fill="#fed7aa" stroke="#dd6b20" stroke-width="1.5"/><text x="320" y="176" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="normal">الجلد (Skin)</text><rect x="40" y="190" width="560" height="70" rx="4" fill="#fefcbf" stroke="#d69e2e" stroke-width="1.5"/><text x="320" y="230" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="normal">النسيج تحت الجلد (Subcutaneous): هنا يترسب الإنسولين</text><rect x="40" y="260" width="560" height="50" rx="4" fill="#fed7d7" stroke="#c53030" stroke-width="1.5"/><text x="320" y="291" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="normal">العضل (Muscle): تجنّبه في الحقن الروتيني</text><line x1="140" y1="40" x2="140" y2="215" stroke="#2b6cb0" stroke-width="5"/><text x="140" y="330" font-size="13" fill="#2b6cb0" text-anchor="middle" font-weight="normal">90° (إبرة قصيرة 4–6 مم)</text><line x1="330" y1="60" x2="420" y2="215" stroke="#2f855a" stroke-width="5" transform="rotate(0)"/><text x="380" y="330" font-size="13" fill="#2f855a" text-anchor="middle" font-weight="normal">45° (إبرة أطول أو شخص نحيف) مع قرص الجلد</text><text x="320" y="365" font-size="13" fill="#c53030" text-anchor="middle" font-weight="normal">حقنة الإنسولين الوريدي/العضلي: للإنسولين العادي فقط وفي الطوارئ (مثل DKA)</text></svg>