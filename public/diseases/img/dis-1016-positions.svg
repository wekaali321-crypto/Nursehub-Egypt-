<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أوضاع المريض</text>
<rect x="325" y="44" width="295" height="180" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><rect x="325" y="44" width="295" height="26" rx="10" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><rect x="325" y="57" width="295" height="13" rx="0" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="472" y="62" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Fowler (فاولر)</text><rect x="392" y="140" width="160" height="5" rx="2" fill="#64748b" stroke="none" stroke-width="1.5"/><circle cx="442" cy="84" r="10" fill="#f2c4a0" stroke="none" stroke-width="1.5"/><g transform="rotate(-60 450 106)"><rect x="425.0" y="97.0" width="50" height="18" rx="7.2" fill="#7ac0a8" stroke="#3a8a7a" stroke-width="1"/></g><g transform="rotate(0 492 128)"><rect x="464.0" y="120.0" width="56" height="16" rx="6.4" fill="#7ac0a8" stroke="#3a8a7a" stroke-width="1"/></g><text x="472" y="162" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">الرأس والجذع مرفوعان 40-90° (semi: 30-40°،</text><text x="472" y="178" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">high: 90°)</text><text x="472" y="196" text-anchor="middle" font-size="11" font-weight="500" fill="#0f766e">الاستعمال:</text><text x="472" y="212" text-anchor="middle" font-size="11" font-weight="500" fill="#0f766e">قلب، ضيق نفس، أنبوب أنفي معدي</text><rect x="20" y="44" width="295" height="180" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/><rect x="20" y="44" width="295" height="26" rx="10" fill="#22c55e" stroke="none" stroke-width="1.5"/><rect x="20" y="57" width="295" height="13" rx="0" fill="#22c55e" stroke="none" stroke-width="1.5"/><text x="167" y="62" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">جانبي Lateral</text><rect x="87" y="140" width="160" height="5" rx="2" fill="#64748b" stroke="none" stroke-width="1.5"/><circle cx="115" cy="118" r="11" fill="#f2c4a0" stroke="none" stroke-width="1.5"/><g transform="rotate(0 162 126)"><rect x="112.0" y="115.0" width="100" height="22" rx="8.8" fill="#7ac0a8" stroke="#3a8a7a" stroke-width="1"/></g><g transform="rotate(0 222 128)"><rect x="202.0" y="122.0" width="40" height="12" rx="4.8" fill="#7ac0a8" stroke="#3a8a7a" stroke-width="1"/></g><text x="167" y="162" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">يمين = الجانب الأيمن على السرير</text><text x="167" y="196" text-anchor="middle" font-size="11" font-weight="500" fill="#0f766e">الاستعمال:</text><text x="167" y="212" text-anchor="middle" font-size="11" font-weight="500" fill="#0f766e">مشكلات هضمية، جراحة المستقيم</text><rect x="325" y="234" width="295" height="180" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/><rect x="325" y="234" width="295" height="26" rx="10" fill="#f59e0b" stroke="none" stroke-width="1.5"/><rect x="325" y="247" width="295" height="13" rx="0" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="472" y="252" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Lithotomy</text><rect x="392" y="330" width="160" height="5" rx="2" fill="#64748b" stroke="none" stroke-width="1.5"/><circle cx="420" cy="310" r="10" fill="#f2c4a0" stroke="none" stroke-width="1.5"/><g transform="rotate(0 462 320)"><rect x="427.0" y="311.0" width="70" height="18" rx="7.2" fill="#7ac0a8" stroke="#3a8a7a" stroke-width="1"/></g><g transform="rotate(-50 510 300)"><rect x="488.0" y="294.0" width="44" height="12" rx="4.8" fill="#7ac0a8" stroke="#3a8a7a" stroke-width="1"/></g><g transform="rotate(10 534 280)"><rect x="516.0" y="274.0" width="36" height="12" rx="4.8" fill="#7ac0a8" stroke="#3a8a7a" stroke-width="1"/></g><text x="472" y="352" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">ظهر مسطح وركبتان مرفوعتان وحوض مستوٍ على</text><text x="472" y="368" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">حاملات</text><text x="472" y="386" text-anchor="middle" font-size="11" font-weight="500" fill="#0f766e">الاستعمال:</text><text 