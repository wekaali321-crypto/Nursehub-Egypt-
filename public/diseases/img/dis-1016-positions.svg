800" fill="#fff">منبطح Prone</text><rect x="392" y="520" width="160" height="5" rx="2" fill="#64748b" stroke="none" stroke-width="1.5"/><circle cx="416" cy="502" r="10" fill="#f2c4a0" stroke="none" stroke-width="1.5"/><g transform="rotate(0 472 508)"><rect x="417.0" y="499.0" width="110" height="18" rx="7.2" fill="#7ac0a8" stroke="#3a8a7a" stroke-width="1"/></g><g transform="rotate(0 530 510)"><rect x="513.0" y="504.0" width="34" height="12" rx="4.8" fill="#7ac0a8" stroke="#3a8a7a" stroke-width="1"/></g><text x="472" y="542" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">على البطن والظهر للأعلى والرأس لجانب</text><text x="472" y="576" text-anchor="middle" font-size="11" font-weight="500" fill="#0f766e">الاستعمال:</text><text x="472" y="592" text-anchor="middle" font-size="11" font-weight="500" fill="#0f766e">تصريف الفم بعد جراحة الفم/الرقبة، مد الورك</text><rect x="20" y="424" width="295" height="180" rx="10" fill="#fff" stroke="#14b8a6" stroke-width="2"/><rect x="20" y="424" width="295" height="26" rx="10" fill="#14b8a6" stroke="none" stroke-width="1.5"/><rect x="20" y="437" width="295" height="13" rx="0" fill="#14b8a6" stroke="none" stroke-width="1.5"/><text x="167" y="442" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">مستلقٍ Supine</text><rect x="87" y="520" width="160" height="5" rx="2" fill="#64748b" stroke="none" stroke-width="1.5"/><circle cx="105" cy="502" r="10" fill="#f2c4a0" stroke="none" stroke-width="1.5"/><g transform="rotate(0 167 508)"><rect x="117.0" y="499.0" width="100" height="18" rx="7.2" fill="#7ac0a8" stroke="#3a8a7a" stroke-width="1"/></g><g transform="rotate(0 225 510)"><rect x="205.0" y="504.0" width="40" height="12" rx="4.8" fill="#7ac0a8" stroke="#3a8a7a" stroke-width="1"/></g><text x="167" y="542" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">على الظهر، أكثر أوضاع الراحة</text><text x="167" y="576" text-anchor="middle" font-size="11" font-weight="500" fill="#0f766e">الاستعمال:</text><text x="167" y="592" text-anchor="middle" font-size="11" font-weight="500" fill="#0f766e">جراحات البطن والوجه والأطراف</text><rect x="325" y="614" width="295" height="180" rx="10" fill="#fff" stroke="#ec4899" stroke-width="2"/><rect x="325" y="614" width="295" height="26" rx="10" fill="#ec4899" stroke="none" stroke-width="1.5"/><rect x="325" y="627" width="295" height="13" rx="0" fill="#ec4899" stroke="none" stroke-width="1.5"/><text x="472" y="632" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Trendelenburg</text><rect x="392" y="710" width="160" height="5" rx="2" fill="#64748b" stroke="none" stroke-width="1.5"/><circle cx="422" cy="704" r="10" fill="#f2c4a0" stroke="none" stroke-width="1.5"/><g transform="rotate(-12 472 692)"><rect x="412.0" y="683.0" width="120" height="18" rx="7.2" fill="#7ac0a8" stroke="#3a8a7a" stroke-width="1"/></g><g transform="rotate(-12 532 676)"><rect x="512.0" y="670.0" width="40" height="12" rx="4.8" fill="#7ac0a8" stroke="#3a8a7a" stroke-width="1"/></g><text x="472" y="732" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">الرأس للأسفل بقوة والقدم للأعلى</text><text x="472" y="766" text-anchor="middle" font-size="11" font-weight="500" fill="#0f766e">الاستعمال:</text><text x="472" y="782" text-anchor="middle" font-size="11" font-weight="500" fill="#0f766e">هبوط ضغط، جراحات النساء وفتق البطن، القسطرة</text><rect x="20" y="614" width="295" height="180" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/><rect x="20" y="614" width="295" height="26" rx="10" fill="#64748b" stroke="none" stroke-width="1.5"/><rect x="20" y="627" width="295" height="13" rx="0" fill="#64748b" stroke="none" stroke-width="1.5"/><text x="167" y="632" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Reverse Trendelenburg</text><rect x="87" y="710" width="160" height="5" rx="2" fill="#64748b" stroke="none" stroke-width="1.5"/><circle cx="117" cy="676" r="10" fill="#f2c4a0" stroke="none" stroke-width="1.5"/><g transform="rotate(12 167 692)"><rect x="107.0" y="683.0" width="120" height="18" rx="7.2" fill="#7ac0a8" stroke="#3a8a7a" stroke-width="1"/></g><g transform="rotate(12 227 706)"><rect x="207.0" y="700.0" width="40" height="12" rx="4.8" fill="#7ac0a8" stroke="#3a8a7a" stroke-width="1"/></g><text x="167" y="732" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">الرأس للأعلى والقدم للأسفل</text><text x="167" y="766" text-anchor="middle" font-size="11" font-weight="500" fill="#0f766e">الاستعمال:</text><text x="167" y="782" text-anchor="middle" font-size="11" font-weight="500" fill="#0f766e">السمنة في الجراحة، الصمة الهوائية، منع</text>
