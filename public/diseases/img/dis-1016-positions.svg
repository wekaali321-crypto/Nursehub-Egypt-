<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 428" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="428" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أوضاع المريض واستعمالاتها</text>
<rect x="326" y="48" width="294" height="82" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><rect x="326" y="48" width="294" height="28" rx="12" fill="#0ea5e9"/><rect x="326" y="64" width="294" height="12" fill="#0ea5e9"/><text x="473.0" y="67" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Fowler</text><text x="473.0" y="98" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">الرأس والجذع مرفوعان 40-90°</text><text x="473.0" y="116" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">قلب، ضيق نفس، أنبوب أنفي معدي</text><rect x="20" y="48" width="294" height="82" rx="12" fill="#fff" stroke="#22c55e" stroke-width="2"/><rect x="20" y="48" width="294" height="28" rx="12" fill="#22c55e"/><rect x="20" y="64" width="294" height="12" fill="#22c55e"/><text x="167.0" y="67" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Lateral جانبي</text><text x="167.0" y="98" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">على الجانب الأيمن أو الأيسر</text><text x="167.0" y="116" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">مشكلات هضمية، جراحة المستقيم</text><rect x="326" y="142" width="294" height="82" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/><rect x="326" y="142" width="294" height="28" rx="12" fill="#f59e0b"/><rect x="326" y="158" width="294" height="12" fill="#f59e0b"/><text x="473.0" y="161" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Lithotomy</text><text x="473.0" y="192" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">ظهر مسطح، ركبتان مرفوعتان</text><text x="473.0" y="210" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">نساء وولادة</text><rect x="20" y="142" width="294" height="82" rx="12" fill="#fff" stroke="#ef4444" stroke-width="2"/><rect x="20" y="142" width="294" height="28" rx="12" fill="#ef4444"/><rect x="20" y="158" width="294" height="12" fill="#ef4444"/><text x="167.0" y="161" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Sim's</text><text x="167.0" y="192" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">جانب مع ثني الساق العليا نحو الصدر</text><text x="167.0" y="210" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">حقنة شرجية وفحص العجان</text><rect x="326" y="236" width="294" height="82" rx="12" fill="#fff" stroke="#8b5cf6" stroke-width="2"/><rect x="326" y="236" width="294" height="28" rx="12" fill="#8b5cf6"/><rect x="326" y="252" width="294" height="12" fill="#8b5cf6"/><text x="473.0" y="255" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Prone</text><text x="473.0" y="286" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">على البطن</text><text x="473.0" y="304" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">تصريف الفم بعد جراحات الفم والرقبة</text><rect x="20" y="236" width="294" height="82" rx="12" fill="#fff" stroke="#14b8a6" stroke-width="2"/><rect x="20" y="236" width="294" height="28" rx="12" fill="#14b8a6"/><rect x="20" y="252" width="294" height="12" fill="#14b8a6"/><text x="167.0" y="255" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Supine</text><text x="167.0" y="286" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">على الظهر</text><text x="167.0" y="304" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">جراحات البطن والوجه والأطراف</text><rect x="326" y="330" width="294" height="82" rx="12" fill="#fff" stroke="#ec4899" stroke-width="2"/><rect x="326" y="330" width="294" height="28" rx="12" fill="#ec4899"/><rect x="326" y="346" width="294" height="12" fill="#ec4899"/><text x="473.0" y="349" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Trendelenburg</text><text x="473.0" y="380" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">الرأس للأسفل والقدم للأعلى</text><text x="473.0" y="398" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">هبوط ضغط، قسطرة وريد مركزي</text><rect x="20" y="330" width="294" height="82" rx="12" fill="#fff" stroke="#64748b" stroke-width="2"/><rect x="20" y="330" width="294" height="28" rx="12" fill="#64748b"/><rect x="20" y="346" width="294" height="12" fill="#64748b"/><text x="167.0" y="349" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">Reverse Trendelenburg</text><text x="167.0" y="380" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">الرأس للأعلى والقدم للأسفل</text><text x="167.0" y="398" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">السمنة، الصمة الهوائية، منع الاستنشاق</text>
</svg>
