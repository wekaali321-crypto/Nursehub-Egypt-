<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
<rect width="640" height="420" rx="16" fill="#f8fafc"/>
<text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >حقن الهيبارين منخفض الوزن (إينوكسابارين) خطوة بخطوة</text>
<rect x="480" y="50" width="150" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="480" y="50" width="150" height="28" rx="10" fill="#0369a1"/>
<text x="555.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >1) الإبرة</text>
<text x="555.0" y="100" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >إبرة رفيعة 25G</text>
<text x="555.0" y="119" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >طولها 5/8 بوصة</text>
<rect x="320" y="50" width="150" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="320" y="50" width="150" height="28" rx="10" fill="#0369a1"/>
<text x="395.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >2) الزاوية</text>
<text x="395.0" y="100" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >حقنة تحت الجلد</text>
<text x="395.0" y="119" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >بزاوية 90 درجة</text>
<rect x="160" y="50" width="150" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="160" y="50" width="150" height="28" rx="10" fill="#15803d"/>
<text x="235.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >3) الموضع</text>
<text x="235.0" y="100" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >البطن، على بعد</text>
<text x="235.0" y="119" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >5 سم تقريباً من السرّة</text>
<rect x="10" y="50" width="140" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="50" width="140" height="28" rx="10" fill="#b91c1c"/>
<text x="80.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >ممنوع</text>
<text x="80.0" y="100" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >الفخذ ليست الموضع</text>
<text x="80.0" y="119" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >ولا في الوريد</text>
<rect x="330" y="175" width="300" height="95" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="330" y="175" width="300" height="28" rx="10" fill="#b91c1c"/>
<text x="480.0" y="194" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >لا تفعل أبداً</text>
<text x="480.0" y="225" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >لا تسحب (aspirate) قبل الحقن</text>
<text x="480.0" y="244" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >لا تفرك مكان الحقن بعدها</text>
<text x="480.0" y="263" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >ألم/كدمة/احمرار خفيف طبيعي</text>
<rect x="10" y="175" width="310" height="95" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="175" width="310" height="28" rx="10" fill="#7c3aed"/>
<text x="165.0" y="194" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >المتابعة المعملية</text>
<text x="165.0" y="225" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >الصفائح الدموية (Platelets) 150–400 ألف</text>
<text x="165.0" y="244" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >وليس aPTT أو INR</text>
<text x="165.0" y="263" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >أقل من 50 ألف: احجب الجرعة وبلّغ</text>
<rect x="10" y="285" width="620" height="120" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="320" y="312" text-anchor="middle" font-size="15" font-weight="800" fill="#b91c1c" >HIT: نقص الصفائح المحرَّض بالهيبارين</text>
<text x="320" y="340" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a" >انخفاض الصفائح إلى النصف تقريباً بعد بدء الهيبارين من أي نوع</text>
<text x="320" y="365" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c" >الإجراء الأول: بلّغ الطبيب فوراً واحجب الدواء (خطير جداً)</text>
<text x="320" y="390" text-anchor="middle" font-size="12.5" font-weight="600" fill="#15803d" >الفونداباريناكس لا يسبب HIT</text>
</svg>