<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="360" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ADHD: الآلية والأعراض والتعامل</text><rect x="20" y="50" width="290" height="80" rx="10" fill="#6366f1"/><text x="165.0" y="66.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الآلية</text><text x="165.0" y="84.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">نقص الدوبامين والنورإبينفرين ← ضعف التركيز</text><text x="165.0" y="102.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">وضبط الاندفاع والمزاج</text><text x="165.0" y="120.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">قلق وإدمان أكثر لاحقًا</text><rect x="330" y="50" width="290" height="80" rx="10" fill="#f59e0b"/><text x="475.0" y="66.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">الأعراض</text><text x="475.0" y="84.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">فرط حركة · قلة انتباه · اندفاع/كلام زائد</text><text x="475.0" y="102.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">تدنّي تقدير الذات ومهارات اجتماعية ضعيفة</text><text x="475.0" y="120.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">عامل خطر: إصابة رأس سابقة (TBI)</text><rect x="330" y="145" width="290" height="100" rx="10" fill="#16a34a"/><text x="475.0" y="171.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التواصل والتنظيم</text><text x="475.0" y="189.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">اتصال بالعين قبل الكلام · لغة بسيطة</text><text x="475.0" y="207.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">يعيد الطفل ما سمعه · مدح عند إتمام المهمة</text><text x="475.0" y="225.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">جدول مكتوب بالأنشطة اليومية</text><rect x="20" y="145" width="290" height="100" rx="10" fill="#0ea5e9"/><text x="165.0" y="171.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الفصل والسلوك</text><text x="165.0" y="189.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">فترات راحة منتظمة · تعليم لفظي + بصري</text><text x="165.0" y="207.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">قواعد ثابتة · تقليل الواجب المنزلي</text><text x="165.0" y="225.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">العدوانية: صرف انتباهه (نفخ بالون)</text><rect x="20" y="260" width="600" height="80" rx="10" fill="#dc2626"/><text x="320.0" y="284.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأولوية</text><text x="320.0" y="303.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">تشخيص التمريض الأهم: خطر الإصابة (Risk for Injury)</text><text x="320.0" y="322.5" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">التزم الهدوء مع الطفل دائمًا</text></svg>