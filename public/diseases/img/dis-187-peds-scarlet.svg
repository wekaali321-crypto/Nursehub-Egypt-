<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 288" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="288" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الحمى القرمزية والجرب: مراجعة NCLEX</text><rect x="325" y="48" width="295" height="224" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الحمى القرمزية</text><text x="610" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">مضاعفة التهاب الحلق العقدي</text><text x="610" y="120" text-anchor="end" font-size="12.5" fill="#1e293b">قد تنتقل للكلى (التهاب كبيبات) والقلب (حمى</text><text x="610" y="140" text-anchor="end" font-size="12.5" fill="#1e293b">روماتيزمية)</text><text x="610" y="160" text-anchor="end" font-size="12.5" fill="#1e293b">طفح أحمر حاك بالصدر والرقبة كحرق الشمس/ورق</text><text x="610" y="180" text-anchor="end" font-size="12.5" fill="#1e293b">الصنفرة، لسان فراولة</text><text x="610" y="200" text-anchor="end" font-size="12.5" fill="#1e293b">اختبار المستضد السريع للعقديات</text><text x="610" y="220" text-anchor="end" font-size="12.5" fill="#1e293b">أكمل المضاد كاملًا، سوائل باردة وغذاء طري،</text><text x="610" y="240" text-anchor="end" font-size="12.5" fill="#1e293b">غيّر فرشاة الأسنان بعد 24 ساعة من بدء</text><text x="610" y="260" text-anchor="end" font-size="12.5" fill="#1e293b">المضاد</text><rect x="20" y="48" width="295" height="224" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الجرب</text><text x="305" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">حشرات تحفر الجلد وتبيض تحته</text><text x="305" y="120" text-anchor="end" font-size="12.5" fill="#1e293b">حكة شديدة ومسارات رفيعة غير منتظمة</text><text x="305" y="140" text-anchor="end" font-size="12.5" fill="#1e293b">مواضع الرضع: فروة الرأس، راحتا اليدين</text><text x="305" y="160" text-anchor="end" font-size="12.5" fill="#1e293b">وباطن القدمين، خلف الركبتين</text><text x="305" y="180" text-anchor="end" font-size="12.5" fill="#1e293b">عالج كل المخالطين، اغسل الملابس والفراش</text><text x="305" y="200" text-anchor="end" font-size="12.5" fill="#1e293b">بماء ساخن، المقتنيات غير القابلة للغسل في</text><text x="305" y="220" text-anchor="end" font-size="12.5" fill="#1e293b">كيس مغلق أكثر من 3 أيام</text><text x="305" y="240" text-anchor="end" font-size="12.5" fill="#1e293b">بيرميثرين (Permethrin) كريم على كل الجلد —</text><text x="305" y="260" text-anchor="end" font-size="12.5" fill="#1e293b">راجع النشرة والصيدلي</text>
</svg>
