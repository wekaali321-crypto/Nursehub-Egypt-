<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 245" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="700" height="245" rx="16" fill="#f8fafc"/>
<text x="350.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ورم القواتم (الفيوكروموسيتوما)</text>
<rect x="356.0" y="52" width="330.0" height="165.5" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="356.0" y="52" width="330.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="521.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الآلية والأعراض</text>
<text x="676.0" y="96" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• ورم نادر بالكظر يفرز كاتيكولامينات (إبينفرين)</text>
<text x="676.0" y="112.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">فيحدث أزمة ضغط قد تقتل</text>
<text x="676.0" y="131.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• ارتفاع الضغط مع خفقان وألم صدر</text>
<text x="676.0" y="149.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• ارتفاع السكر وفرط الأيض</text>
<text x="676.0" y="168.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• تعرق، عدم تحمل الحرارة، رعشة، تشوش رؤية، غثيان</text>
<text x="676.0" y="184.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">وقيء</text>
<text x="676.0" y="203.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• قد يكون حميداً أو خبيثاً</text>
<rect x="14.0" y="52" width="330.0" height="165.5" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.2"/>
<rect x="14.0" y="52" width="330.0" height="26" rx="10" fill="#6366f1" fill-opacity="1" stroke="#6366f1" stroke-width="1.2"/>
<text x="179.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">التمريض</text>
<text x="334.0" y="96" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• راقب العلامات الحيوية خاصة الضغط</text>
<text x="334.0" y="114.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• لا منبهات: لا تدخين ولا كافيين</text>
<text x="334.0" y="133.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• لا تغيّر الوضعية بسرعة (الضغط على الورم قد يفرز</text>
<text x="334.0" y="149.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">كاتيكولامين)</text>
<text x="334.0" y="168.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• أعطِ حاصرات بيتا حسب الأمر (وغالباً بعد حاصرات</text>
<text x="334.0" y="184.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">ألفا)</text>
</svg>
