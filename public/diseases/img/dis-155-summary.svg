<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" width="640" height="340" direction="rtl" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="340" rx="14" fill="#f7fafc"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a5568"/></marker></defs><text x="320" y="28" font-size="19" fill="#1a365d" font-weight="bold" text-anchor="middle">أي احمرار في العين: التفريق السريع</text><rect x="190" y="45" width="260" height="50" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="320" y="66" font-size="14" fill="#1a202c" font-weight="normal" text-anchor="middle">إفراز أصفر/معكّر + رموش لازقة الصبح؟</text><text x="320" y="86" font-size="12" fill="#4a5568" font-weight="normal" text-anchor="middle">(Mucopurulent)</text><line x1="190" y1="70" x2="110" y2="115" stroke="#4a5568" stroke-width="2" marker-end="url(#ar)"/><line x1="450" y1="70" x2="530" y2="115" stroke="#4a5568" stroke-width="2" marker-end="url(#ar)"/><rect x="15" y="115" width="190" height="55" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/><text x="110" y="138" font-size="14" fill="#c53030" font-weight="bold" text-anchor="middle">آه</text><text x="110" y="160" font-size="15" fill="#9b2c2c" font-weight="bold" text-anchor="middle">التهاب بكتيري</text><rect x="435" y="115" width="190" height="55" rx="10" fill="#f0fff4" stroke="#2f855a" stroke-width="1.5"/><text x="530" y="138" font-size="14" fill="#2f855a" font-weight="bold" text-anchor="middle">لأ</text><text x="530" y="160" font-size="15" fill="#1a202c" font-weight="normal" text-anchor="middle">هرش شديد؟</text><line x1="530" y1="170" x2="530" y2="195" stroke="#4a5568" stroke-width="2" marker-end="url(#ar)"/><rect x="300" y="195" width="325" height="55" rx="10" fill="#faf5ff" stroke="#6b46c1" stroke-width="1.5"/><text x="462" y="218" font-size="13" fill="#1a202c" font-weight="normal" text-anchor="middle">آه + شمس/تراب + حساسية متكررة</text><text x="462" y="240" font-size="15" fill="#553c9a" font-weight="bold" text-anchor="middle">→ حساسية</text><rect x="435" y="265" width="190" height="50" rx="10" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/><text x="530" y="287" font-size="14" fill="#744210" font-weight="bold" text-anchor="middle">لأ → غالباً فيروسي</text><text x="530" y="307" font-size="12" fill="#1a202c" font-weight="normal" text-anchor="middle">غدة أمام الأذن ± نزلة برد</text><line x1="530" y1="250" x2="530" y2="265" stroke="#4a5568" stroke-width="2" marker-end="url(#ar)"/><rect x="15" y="195" width="260" height="100" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="145" y="222" font-size="13" fill="#1a202c" font-weight="normal" text-anchor="middle">كل التهابات الملتحمة لا تؤثر على الرؤية</text><text x="145" y="247" font-size="13" fill="#c53030" font-weight="bold" text-anchor="middle">أي مشكلة رؤية → عيادة الرمد</text><text x="145" y="272" font-size="12" fill="#1a202c" font-weight="normal" text-anchor="middle">لا تهمل العلاج (خطر التهاب القرنية)</text></svg>