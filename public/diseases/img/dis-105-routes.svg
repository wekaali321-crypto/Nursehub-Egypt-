<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 294" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="294" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">كيف تنتقل التوكسوبلازما (Toxoplasma gondii)</text><rect x="326" y="52" width="284" height="92" rx="12" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="468" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#9a3412">لحم غير مطهي جيداً</text><text x="468" y="102" text-anchor="middle" font-size="12.5" fill="#9a3412">أكياس في أنسجة الحيوان</text><text x="468" y="119" text-anchor="middle" font-size="12.5" fill="#9a3412">(المسار المذكور في المصدر)</text><rect x="30" y="52" width="284" height="92" rx="12" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="172" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#854d0e">فضلات القطط</text><text x="172" y="102" text-anchor="middle" font-size="12.5" fill="#854d0e">بويضات تخرج في البراز</text><text x="172" y="119" text-anchor="middle" font-size="12.5" fill="#854d0e">بعد التنظيف: غسل اليدين</text><rect x="326" y="156" width="284" height="92" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="468" y="184" text-anchor="middle" font-size="14.5" font-weight="800" fill="#166534">خضروات/مياه ملوثة</text><text x="468" y="206" text-anchor="middle" font-size="12.5" fill="#166534">غسل غير كافٍ</text><text x="468" y="223" text-anchor="middle" font-size="12.5" fill="#166534">تربة وبراز</text><rect x="30" y="156" width="284" height="92" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/><text x="172" y="184" text-anchor="middle" font-size="14.5" font-weight="800" fill="#991b1b">الأم للجنين</text><text x="172" y="206" text-anchor="middle" font-size="12.5" fill="#991b1b">عدوى أثناء الحمل</text><text x="172" y="223" text-anchor="middle" font-size="12.5" fill="#991b1b">إجهاض متكرر أو تشوهات</text><text x="320" y="282" text-anchor="middle" font-size="12.5" fill="#475569">معظم الأصحاء بلا أعراض، لكن المناعة الضعيفة والحامل أكثر خطراً</text></svg>