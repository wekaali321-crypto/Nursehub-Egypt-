<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="322" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أدوية وعلاج فرط الدرقية</text><rect x="325" y="48" width="295" height="104" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">SSKI (يوديد البوتاسيوم)</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">يقلّص الدرقية</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">يلوّن الأسنان: استعمل ماصة مع عصير</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">أبعده ساعة عن بقية الأدوية</text><rect x="20" y="48" width="295" height="104" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">PTU (بروبيل ثيويوراسيل)</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">"يضع الدرقية تحت الأرض" (حيلتنا)</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">أبلغ عن حمى والتهاب حلق</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">آمن نسبيًا بالحمل (راجع الطبيب)</text><rect x="325" y="162" width="295" height="144" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="162" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">حاصرات بيتا (بروبرانولول)</text><text x="610" y="214" text-anchor="start" font-size="12.5" fill="#1e293b">يخفض الضغط والنبض</text><rect x="20" y="162" width="295" height="144" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><rect x="20" y="162" width="295" height="30" rx="12" fill="#9333ea"/><text x="167.5" y="183" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">اليود المشع (RAIU)</text><text x="305" y="214" text-anchor="start" font-size="12.5" fill="#1e293b">قبل: اختبار حمل، إزالة حلي الرقبة وطقم</text><text x="305" y="234" text-anchor="start" font-size="12.5" fill="#1e293b">الأسنان، إيقاف مضادات الدرقية 5–7 أيام</text><text x="305" y="254" text-anchor="start" font-size="12.5" fill="#1e293b">NPO: 2–4 ساعات قبل و1–2 ساعة بعد</text><text x="305" y="274" text-anchor="start" font-size="12.5" fill="#1e293b">بعد: لا حوامل ولا زحام، لا نفس الحمام</text><text x="305" y="294" text-anchor="start" font-size="12.5" fill="#1e293b">(اسحب 3 مرات)، لا أدوات أكل أو غسيل مشترك</text>
</svg>
