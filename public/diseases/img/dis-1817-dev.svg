<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 327" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="327" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">معالم الدارج</text><rect x="326.0" y="50" width="294.0" height="133" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="326.0" y="50" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="473.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">جسدية</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="start">• قوس قطني (Lordosis) وبطن بارز</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="start">• مشي ثابت</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="start">• نمو أبطأ وأكثر استقراراً</text><text x="610.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="start">• عظام وعضلات غير ناضجة: تغذية وتمارين</text><rect x="20.0" y="50" width="294.0" height="133" rx="10" fill="#fff" stroke="#be185d" stroke-width="2"/><rect x="20.0" y="50" width="294.0" height="28" rx="10" fill="#be185d"/><text x="167.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">نفسية</text><text x="304.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="start">• تآزر عين-يد</text><text x="304.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="start">• مهارات دقيقة تتطور</text><text x="304.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="start">• بداية الرسم والكتابة</text><text x="304.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="start">• تحكم بالمثانة مع انتكاسات عرضية</text><text x="304.0" y="164" font-size="12.5" fill="#0f172a" text-anchor="start">• الدماغ 90% مكتمل بعمر 5</text><rect x="326.0" y="195" width="294.0" height="116" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="326.0" y="195" width="294.0" height="28" rx="10" fill="#ea580c"/><text x="473.0" y="20" dy="195" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">اجتماعية وعاطفية</text><text x="610.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="start">• لعب متواز (Parallel)، يقلد النماذج</text><text x="610.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="start">• لا يشارك بسهولة إلا لاحقاً</text><text x="610.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="start">• يتجاوز قلق الانفصال بسهولة</text><text x="610.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="start">• مشاعر كثيرة باليوم وفهم السبب والنتيجة</text><rect x="20.0" y="195" width="294.0" height="116" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="20.0" y="195" width="294.0" height="28" rx="10" fill="#7c3aed"/><text x="167.0" y="20" dy="195" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">اللغة</text><text x="304.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="start">• مفردات تزداد: أسماء أشياء وأعضاء</text><text x="304.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="start">وحيوانات وأماكن</text><text x="304.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="start">• الوسيلة الأساسية للتواصل وكثرة «لماذا»</text><text x="304.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="start">• يفضل ألعاباً تتكلم وجملاً قصيرة</text></svg>