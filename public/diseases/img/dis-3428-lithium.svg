<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 398" width="640" height="398" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="الليثيوم (Lithium): L-I-T-H"><rect width="640" height="398" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">الليثيوم (Lithium): L-I-T-H</text><rect x="326.0" y="46" width="302.0" height="98" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="326.0" y="60" width="302.0" height="14" fill="#b42318"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">L: Levels — المستوى</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• أعلى من 1.5 mEq/L = سام</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• سؤال شائع: المستوى علاجي؟ نعم ← استمر</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">   على الجرعة الحالية</text><rect x="12.0" y="46" width="302.0" height="134" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="12.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">I: Increase fluids &amp; sodium</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• زد السوائل والصوديوم</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• مانع: جفاف أو نقص صوديوم (أقل من 135)</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• لا تقيّد الملح ولا الماء</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• خطر عالٍ مع «إنفلونزا المعدة» (إسهال</text><text x="302.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">   وقيء)</text><rect x="326.0" y="156" width="302.0" height="116" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="326.0" y="156" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="326.0" y="170" width="302.0" height="14" fill="#a86a00"/><text x="477.0" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">T: Toxic signs</text><text x="616.0" y="204" text-anchor="start" font-size="12.5" fill="#1d2939">• بول غزير وعطش شديد</text><text x="616.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• قيء وإسهال</text><text x="616.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• رعشة وارتعاش عضلي (Myoclonic jerks)</text><text x="616.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• أبلغ الطبيب</text><rect x="12.0" y="192" width="302.0" height="98" rx="10" fill="#efe9fb" stroke="#6a4bb5" stroke-width="1.2"/><rect x="12.0" y="192" width="302.0" height="28" rx="10" fill="#6a4bb5"/><rect x="12.0" y="206" width="302.0" height="14" fill="#6a4bb5"/><text x="163.0" y="211" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">H: Hold NSAIDs</text><text x="302.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• Ibuprofen وNaproxen تقلل تروية الكلى</text><text x="302.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">   فتزيد سمية الليثيوم</text><text x="302.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">• تجنبها: تحتاج تعليمًا إضافيًا</text><rect x="326.0" y="284" width="302.0" height="98" rx="10" fill="#e0f5f3" stroke="#14756c" stroke-width="1.2"/><rect x="326.0" y="284" width="302.0" height="28" rx="10" fill="#14756c"/><rect x="326.0" y="298" width="302.0" height="14" fill="#14756c"/><text x="477.0" y="303" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">سمّية الكلى</text><text x="616.0" y="332" text-anchor="start" font-size="12.5" fill="#1d2939">• كرياتينين أعلى من 1.3 = كلى سيئة</text><text x="616.0" y="350" text-anchor="start" font-size="12.5" fill="#1d2939">• بول 30 مل/ساعة أو أقل = ضائقة كلوية</text><text x="616.0" y="368" text-anchor="start" font-size="12.5" fill="#1d2939">• طنين الأذن (Tinnitus)</text></svg>