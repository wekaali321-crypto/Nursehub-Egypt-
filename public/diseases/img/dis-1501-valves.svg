<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 605" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="605" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">اضطرابات الصمامات القلبية</text>
<rect x="346.0" y="52" width="320.0" height="186.0" rx="10" fill="#0e7490" fill-opacity="0.1" stroke="#0e7490" stroke-width="1.2"/>
<rect x="346.0" y="52" width="320.0" height="26" rx="10" fill="#0e7490" fill-opacity="1" stroke="#0e7490" stroke-width="1.2"/>
<text x="506.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الفكرة</text>
<text x="656.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• القلب كجناح بأربع غرف (حجرات) والصمامات</text>
<text x="656.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">أبوابها؛ إذا لم تُغلق جيداً حدث رجوع للدم وقلّ</text>
<text x="656.0" y="130.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">التدفق للجسم</text>
<text x="656.0" y="149.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تضيق (Stenosis): صمام متصلب ضيق</text>
<text x="656.0" y="169.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قصور/ارتجاع (Regurgitation): عودة الدم لأن</text>
<text x="656.0" y="186.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الصمام لا يغلق تماماً</text>
<text x="656.0" y="205.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• الأنواع: تضيق أورطي، ارتجاع أورطي، تضيق</text>
<text x="656.0" y="222.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">تاجي، ارتجاع تاجي</text>
<rect x="14.0" y="52" width="320.0" height="186.0" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="14.0" y="52" width="320.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="174.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأسباب</text>
<text x="324.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أي شيء يؤذي القلب: عيب خلقي (خدّج)، اعتلال</text>
<text x="324.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">عضلة، جلطة، روماتيزم قلبي، التهاب شغاف</text>
<rect x="564.4" y="258.0" width="105.6" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="617.1999999999999" y="278.0" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff"></text>
<rect x="300.4" y="258.0" width="264.0" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="432.4" y="278.0" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">ارتجاع Regurgitation</text>
<rect x="9.999999999999943" y="258.0" width="290.40000000000003" height="30" rx="0" fill="#0e7490" fill-opacity="1" stroke="#fff" stroke-width="1"/>
<text x="155.19999999999996" y="278.0" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">تضيق Stenosis</text>
<rect x="564.4" y="288.0" width="105.6" height="44.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="663.0" y="305.0" text-anchor="start" font-size="11.5" font-weight="800" fill="#0f172a">أورطي</text>
<rect x="300.4" y="288.0" width="264.0" height="44.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="557.4" y="305.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">تسرع قلب، ضيق نفس، إرهاق</text>
<rect x="9.999999999999943" y="288.0" width="290.40000000000003" height="44.5" rx="0" fill="#f1f5f9" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="293.4" y="305.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">ذبحة، لغط انقباضي، إغماء، إرهاق، ضيق نفس</text>
<text x="293.4" y="322.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">عند الاستلقاء</text>
<rect x="564.4" y="332.5" width="105.6" height="44.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="663.0" y="349.5" text-anchor="start" font-size="11.5" font-weight="800" fill="#0f172a">تاجي</text>
<rect x="300.4" y="332.5" width="264.0" height="44.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="557.4" y="349.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">وذمة، انصباب جنبي، تضخم أعضاء واستسقاء</text>
<rect x="9.999999999999943" y="332.5" width="290.40000000000003" height="44.5" rx="0" fill="#ffffff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1"/>
<text x="293.4" y="349.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">زرقة، عدم تحمل المجهود، لغط انبساطي،</text>
<text x="293.4" y="366.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">علامات قصور أيمن، رئتان صافيتان</text>
<rect x="346.0" y="391.0" width="320.0" height="186.0" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.2"/>
<rect x="346.0" y="391.0" width="320.0" height="26" rx="10" fill="#6366f1" fill-opacity="1" stroke="#6366f1" stroke-width="1.2"/>
<text x="506.0" y="409.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الدواء والجراحة</text>
<text x="656.0" y="435.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• مضادات تخثر: هيبارين ووارفارين</text>
<text x="656.0" y="454.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• مضادات صفائح: أسبرين وكلوبيدوجريل</text>
<text x="656.0" y="473.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• نيتروغليسرين لألم الصدر</text>
<text x="656.0" y="492.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• جراحة: تبديل صمام (وارفارين مدى الحياة) أو</text>
<text x="656.0" y="510.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">توسيع بالبالون للتضيق</text>
<rect x="14.0" y="391.0" width="320.0" height="186.0" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="14.0" y="391.0" width="320.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="174.0" y="409.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">التثقيف</text>
<text x="324.0" y="435.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تجنب إجراءات الأسنان 6 أشهر بعد الجراحة،</text>
<text x="324.0" y="452.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">ومضاد حيوي قبل الفحص</text>
<text x="324.0" y="471.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• وارفارين مدى الحياة وتحاليل دورية، INR</text>
<text x="324.0" y="488.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">2.5–3.5 للصمامات الميكانيكية</text>
<text x="324.0" y="508.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ثبّت كمية الخضرة الورقية (فيتامين ك) فلا</text>
<text x="324.0" y="525.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">تزيد ولا تقل</text>
<text x="324.0" y="544.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• النزف: فرشاة ناعمة، موسى كهربائي، لا سجاد</text>
<text x="324.0" y="561.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">وإضاءة جيدة</text>
</svg>
