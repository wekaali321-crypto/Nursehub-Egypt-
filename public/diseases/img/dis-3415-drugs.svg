<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 233" width="640" height="233" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="أدوية الرحم: الجدول"><rect width="640" height="233" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">أدوية الرحم: الجدول</text><rect x="10" y="48" width="620" height="28" rx="6" fill="#2b6a9e"/><text x="562.8333333333334" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الدواء</text><text x="433.66666666666663" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الاسم التجاري</text><text x="190.8333333333333" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الاستعمال</text><rect x="10" y="76" width="620" height="61" fill="#f4f8fc" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="95" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">Methylergonovine</text><text x="488.66666666666663" y="95" text-anchor="start" font-size="12.5"  fill="#1d2939">Methergine</text><text x="364.66666666666663" y="95" text-anchor="start" font-size="12.5"  fill="#1d2939">نزف ما بعد الولادة وارتخاء الرحم (0.2 ملغ</text><text x="364.66666666666663" y="112" text-anchor="start" font-size="12.5"  fill="#1d2939">عضليًا/وريديًا بعد المشيمة حسب الجدول) — راجع</text><text x="364.66666666666663" y="129" text-anchor="start" font-size="12.5"  fill="#1d2939">النشرة</text><rect x="10" y="137" width="620" height="44" fill="#fff" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="156" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">Misoprostol</text><text x="488.66666666666663" y="156" text-anchor="start" font-size="12.5"  fill="#1d2939">Cytotec</text><text x="364.66666666666663" y="156" text-anchor="start" font-size="12.5"  fill="#1d2939">نزف ما بعد الولادة ونضج عنق الرحم — الجرعة تُحدَّد</text><text x="364.66666666666663" y="173" text-anchor="start" font-size="12.5"  fill=