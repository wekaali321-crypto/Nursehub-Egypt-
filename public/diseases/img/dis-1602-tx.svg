<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="540" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الإيقاع والتعامل والأسباب في لمحة</text>
<rect x="14" y="44" width="612" height="32" rx="8" fill="#0f766e"/><text x="540" y="65" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >الإيقاع</text><text x="320" y="65" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >التعامل</text><text x="110" y="65" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >الأسباب</text><rect x="14" y="82" width="612" height="44" rx="8" fill="#fff" stroke="#16a34a" stroke-width="1.2"/><text x="600" y="109" text-anchor="start" font-size="12.5" font-weight="800" fill="#16a34a" >جيبي طبيعي</text><text x="480" y="101" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >لا شيء: استمر في المراقبة</text><text x="220" y="101" text-anchor="start" font-size="10.5" font-weight="600" fill="#334155" >الصحة</text><rect x="14" y="132" width="612" height="44" rx="8" fill="#fff" stroke="#0ea5e9" stroke-width="1.2"/><text x="600" y="159" text-anchor="start" font-size="12.5" font-weight="800" fill="#0ea5e9" >بطء القلب</text><text x="480" y="151" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >أتروبين فقط لو أعراض (شحوب، برودة، رطوبة، هبوط</text><text x="480" y="167" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" > ضغط)</text><text x="220" y="151" text-anchor="start" font-size="10.5" font-weight="600" fill="#334155" >فاجال: الزحر، أدوية: حاصرات كالسيوم </text><text x="220" y="166" text-anchor="start" font-size="10.5" font-weight="600" fill="#334155" >وبيتا</text><rect x="14" y="182" width="612" height="44" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.2"/><text x="600" y="209" text-anchor="start" font-size="12.5" font-weight="800" fill="#dc2626" >رجفان بطيني VF</text><text x="480" y="201" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >صدمة فورية غير متزامنة + CPR + أدوية</text><text x="220" y="201" text-anchor="start" font-size="10.5" font-weight="600" fill="#334155" >VT غير معالج، جلطة، أملاح، أدوية مسب</text><text x="220" y="216" text-anchor="start" font-size="10.5" font-weight="600" fill="#334155" >بة للنظم</text><rect x="14" y="232" width="612" height="44" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.2"/><text x="600" y="259" text-anchor="start" font-size="12.5" font-weight="800" fill="#dc2626" >تسرع بطيني VT</text><text x="480" y="251" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >بلا نبض: صدمة. بنبض: تحويل متزامن</text><text x="220" y="251" text-anchor="start" font-size="10.5" font-weight="600" fill="#334155" >جلطة، نقص أكسجين، نقص K وMg</text><rect x="14" y="282" width="612" height="44" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/><text x="600" y="309" text-anchor="start" font-size="12.5" font-weight="800" fill="#7c3aed" >رجفان أذيني AF</text><text x="480" y="301" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >تحويل متزامن، ديجوكسين، مميعات</text><text x="220" y="301" text-anchor="start" font-size="10.5" font-weight="600" fill="#334155" >صمامات، فشل قلب، ضغط رئوي، COPD، جرا</text><text x="220" y="316" text-anchor="start" font-size="10.5" font-weight="600" fill="#334155" >حة قلب</text><rect x="14" y="332" width="612" height="44" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.2"/><text x="600" y="359" text-anchor="start" font-size="12.5" font-weight="800" fill="#7c3aed" >رفرفة أذينية</text><text x="480" y="351" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >مثل AF</text><text x="220" y="351" text-anchor="start" font-size="10.5" font-weight="600" fill="#334155" >نفس أسباب AF</text><rect x="14" y="382" width="612" height="44" rx="8" fill="#fff" stroke="#ea580c" stroke-width="1.2"/><text x="600" y="409" text-anchor="start" font-size="12.5" font-weight="800" fill="#ea580c" >SVT</text><text x="480" y="401" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >فاجال، أدينوزين دفعة سريعة، تحويل متزامن</text><text x="220" y="401" text-anchor="start" font-size="10.5" font-weight="600" fill="#334155" >منبهات، مجهود، نقص أكسجين، أمراض قلب</text><rect x="14" y="432" width="612" height="44" rx="8" fill="#fff" stroke="#be185d" stroke-width="1.2"/><text x="600" y="459" text-anchor="start" font-size="12.5" font-weight="800" fill="#be185d" >تورساد</text><text x="480" y="451" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >كبريتات مغنيسيوم</text><text x="220" y="451" text-anchor="start" font-size="10.5" font-weight="600" fill="#334155" >جلطة، نقص أكسجين، نقص Mg</text><rect x="14" y="482" width="612" height="44" rx="8" fill="#fff" stroke="#111827" stroke-width="1.2"/><text x="600" y="509" text-anchor="start" font-size="12.5" font-weight="800" fill="#111827" >Asystole</text><text x="480" y="501" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >CPR + إبينفرين، لا صدمة</text><text x="220" y="501" text-anchor="start" font-size="10.5" font-weight="600" fill="#334155" >إيقاف قلب</text>
</svg>
