<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="318" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">العناية بالأسنان: 8 نقاط</text><rect x="325" y="48" width="295" height="132" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الغذاء</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">علكة بلا سكر</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">قلل الحلوى اللزجة والفاكهة المجففة</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">حبوب كاملة وخضار</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">ألبان</text><rect x="20" y="48" width="295" height="132" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الروتين</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">لا تنيم الرضيع بزجاجة حليب أو عصير</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">اغسل الفم بالماء بعد الوجبات</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">فرشاة وخيط مرتين يوميًا</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">ماء الصنبور (فلورايد)</text><rect x="325" y="190" width="295" height="112" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="190" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">أول زيارة</text><text x="610" y="242" text-anchor="start" font-size="12.5" fill="#1e293b">خلال 6 أشهر من أول سن أو عند السنة</text><text x="610" y="262" text-anchor="start" font-size="12.5" fill="#1e293b">التسنين من 6–24 شهرًا: هياج، لثة منتفخة</text><text x="610" y="282" text-anchor="start" font-size="12.5" fill="#1e293b">وحساسة</text><rect x="20" y="190" width="295" height="112" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><rect x="20" y="190" width="295" height="30" rx="12" fill="#9333ea"/><text x="167.5" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">مص الإبهام</text><text x="305" y="242" text-anchor="start" font-size="12.5" fill="#1e293b">يسبب سوء إطباق فقط إن استمر بعد بزوغ</text><text x="305" y="262" text-anchor="start" font-size="12.5" fill="#1e293b">الأسنان الدائمة</text><text x="305" y="282" text-anchor="start" font-size="12.5" fill="#1e293b">ذروته نحو 24 شهرًا</text>
</svg>
