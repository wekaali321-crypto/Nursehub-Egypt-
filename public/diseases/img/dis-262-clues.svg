<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">حموضة: التهاب معدة أم قرحة أم ارتجاع؟</text>
<g text-anchor="middle" font-size="13">
<rect x="440" y="48" width="180" height="230" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="530" y="76" font-size="16" font-weight="800" fill="#166534">عسر هضم / التهاب</text><text x="530" y="108" fill="#14532d">أول مرة غالباً</text><text x="530" y="130" fill="#14532d">أكلة تقيلة أو مسكنات</text><text x="530" y="152" fill="#14532d">ألم منتشر أعلى البطن</text><text x="530" y="174" fill="#14532d">ترجيع / تكريع</text>
<rect x="230" y="48" width="190" height="230" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="325" y="76" font-size="16" font-weight="800" fill="#854d0e">قرحة</text><text x="325" y="108" fill="#713f12">تتكرر</text><text x="325" y="130" fill="#713f12">يشاور بإصبع واحد</text><text x="325" y="152" fill="#713f12">المعدة: تزيد مع الأكل</text><text x="325" y="174" fill="#713f12">الإثنى عشر: ترتاح بالأكل</text>
<rect x="20" y="48" width="190" height="230" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="115" y="76" font-size="16" font-weight="800" fill="#1e3a8a">ارتجاع</text><text x="115" y="108" fill="#1e3a8a">تتكرر</text><text x="115" y="130" fill="#1e3a8a">حمو يطلع للصدر</text><text x="115" y="152" fill="#1e3a8a">يزيد مع النوم بالليل</text><text x="115" y="174" fill="#1e3a8a">كحة وتهيج زور</text>
</g><text x="320" y="292" text-anchor="middle" font-size="12" fill="#b91c1c">ألم حارق + تيبس البطن = بطن جراحي: بلّغ فوراً</text></svg>
