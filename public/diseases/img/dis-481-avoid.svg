<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 327" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="327" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أدوية ولقاحات الحمل</text><rect x="326.0" y="50" width="294.0" height="133" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><rect x="326.0" y="50" width="294.0" height="28" rx="10" fill="#b91c1c"/><text x="473.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">أدوية ممنوعة</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• NSAIDs: naproxen وaspirin وibuprofen</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">وindomethacin وketorolac</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• ACEi (-pril) وARB (-sartan)</text><text x="610.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• doxycycline وtetracycline</text><text x="610.0" y="164" font-size="12.5" fill="#0f172a" text-anchor="end">• carbamazepine</text><rect x="20.0" y="50" width="294.0" height="133" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20.0" y="50" width="294.0" height="28" rx="10" fill="#16a34a"/><text x="167.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">لقاحات آمنة</text><text x="304.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• إنفلونزا معطلة</text><text x="304.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• Tdap (أسبوع 27-36)</text><text x="304.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• Tetanus وDiphtheria وPertussis</text><rect x="326.0" y="195" width="294.0" height="116" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="326.0" y="195" width="294.0" height="28" rx="10" fill="#ea580c"/><text x="473.0" y="20" dy="195" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">لقاحات ممنوعة (حية)</text><text x="610.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="end">• الجديري (Varicella)</text><text x="610.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">• Rotavirus</text><text x="610.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• إنفلونزا حية</text><text x="610.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="end">• MMR (حصبة نكاف حصبة ألمانية)</text><rect x="20.0" y="195" width="294.0" height="116" rx="10" fill="#fff" stroke="#1e3a8a" stroke-width="2"/><rect x="20.0" y="195" width="294.0" height="28" rx="10" fill="#1e3a8a"/><text x="167.0" y="20" dy="195" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">للمولود</text><text x="304.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="end">• RhoGAM خلال 72 ساعة لأم Rh سالبة وطفل</text><text x="304.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">موجب</text><text x="304.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• لقاح التهاب الكبد B للمولود من أم</text><text x="304.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="end">مصابة</text></svg>