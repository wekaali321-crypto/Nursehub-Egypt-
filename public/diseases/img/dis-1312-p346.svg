<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 376" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="376" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الصمة الدهنية والتهاب العظم والنقي</text><rect x="330" y="52" width="300" height="129.0" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#dc2626"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الصمة الدهنية</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مضاعفة لكسور السحق والعظام الطويلة</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (فخذ، حوض، ورك)</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• كريات دهنية تدخل الدم وتسد</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  المخ/القلب/الرئة</text><text x="620" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أولوية التدخل: قلّل حركة موضع الكسر</text><rect x="10" y="52" width="310" height="146.39999999999998" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#0369a1"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلامات</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تغيّر الحالة العقلية: ارتباك وقلق (نقطة</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  امتحان)</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ضيق نفس وألم صدر</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• انخفاض الأكسجة</text><text x="310" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• نمش دموي على الرقبة والصدر</text><text x="310" y="182.00000000000003" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مؤشر شفاء: صفاء الذهن</text><rect x="330" y="206.39999999999998" width="300" height="146.39999999999998" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M330,216.39999999999998 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#ea580c"/><text x="480.0" y="225.39999999999998" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التهاب العظم (Osteomyelitis)</text><text x="620" y="249.39999999999998" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• عدوى بكتيرية عبر الدم من: كسر مفتوح،</text><text x="620" y="266.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  جراحة، جرح وخز (عضة كلب)، إبر ملوثة</text><text x="620" y="284.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (كبزل النخاع)</text><text x="620" y="301.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• حمى عالية، ألم، صديد أو إفراز أصفر</text><text x="620" y="318.9999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• سؤال: حرارة 103°ف وإفراز أصفر بعد بزل</text><text x="620" y="336.39999999999986" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  نقي العظم = التهاب عظم</text><rect x="10" y="206.39999999999998" width="310" height="129.0" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M10,216.39999999999998 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#16a34a"/><text x="165.0" y="225.39999999999998" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج</text><text x="310" y="249.39999999999998" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مضادات حيوية وريدية أسابيع أو شهورًا</text><text x="310" y="266.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (قسطرة PICC في المنزل وممرضة تزور)</text><text x="310" y="284.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تنضير جراحي لتصريف الخراج وإزالة العظم</text><text x="310" y="301.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الميت</text><text x="310" y="318.9999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• بتر إن لم يستجب</text></svg>