<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 438" width="640" height="438" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="الملينات (Laxatives) — خريطة سريعة"><rect width="640" height="438" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">الملينات (Laxatives) — خريطة سريعة</text><text x="320.0" y="54" text-anchor="middle" font-size="12.5" fill="#667085">مرجع تمريضي للتعلّم</text><rect x="326.0" y="68" width="302.0" height="152" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="68" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="82" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الهدف والاستعمال</text><text x="616.0" y="116" text-anchor="start" font-size="12.5" fill="#1d2939">• تخفيف الإمساك وإخلاء القولون قبل الفحوص</text><text x="616.0" y="134" text-anchor="start" font-size="12.5" fill="#1d2939">• منع الإجهاد بعد جراحة الشرج أو جلطة</text><text x="616.0" y="152" text-anchor="start" font-size="12.5" fill="#1d2939">   القلب (ملين/مرطب)</text><text x="616.0" y="170" text-anchor="start" font-size="12.5" fill="#1d2939">• Psyllium: القولون العصبي والرتج</text><text x="616.0" y="188" text-anchor="start" font-size="12.5" fill="#1d2939">• Lactulose: خفض الأمونيا في الاعتلال</text><text x="616.0" y="206" text-anchor="start" font-size="12.5" fill="#1d2939">   الدماغي الكبدي</text><rect x="12.0" y="68" width="302.0" height="116" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="12.0" y="68" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="12.0" y="82" width="302.0" height="14" fill="#b42318"/><text x="163.0" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">موانع الاستعمال</text><text x="302.0" y="116" text-anchor="start" font-size="12.5" fill="#1d2939">• حساسية معروفة</text><text x="302.0" y="134" text-anchor="start" font-size="12.5" fill="#1d2939">• ألم بطن مستمر</text><text x="302.0" y="152" text-anchor="start" font-size="12.5" fill="#1d2939">• غثيان أو قيء غير معروف السبب</text><text x="302.0" y="170" text-anchor="start" font-size="12.5" fill="#1d2939">• علامات التهاب زائدة حاد</text><rect x="12.0" y="196" width="302.0" height="80" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="12.0" y="196" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="12.0" y="210" width="302.0" height="14" fill="#a86a00"/><text x="163.0" y="215" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">تحفّظ</text><text x="302.0" y="244" text-anchor="start" font-size="12.5" fill="#1d2939">• المغنيسيوم: بحذر في أي درجة من القصور</text><text x="302.0" y="262" text-anchor="start" font-size="12.5" fill="#1d2939">   الكلوي</text><rect x="326.0" y="232" width="302.0" height="134" rx="10" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.2"/><rect x="326.0" y="232" width="302.0" height="28" rx="10" fill="#2e7d4f"/><rect x="326.0" y="246" width="302.0" height="14" fill="#2e7d4f"/><text x="477.0" y="251" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التمريض والتثقيف</text><text x="616.0" y="280" text-anchor="start" font-size="12.5" fill="#1d2939">• لا استعمال طويل (عادة الملين)</text><text x="616.0" y="298" text-anchor="start" font-size="12.5" fill="#1d2939">• لا للتنحيف</text><text x="616.0" y="316" text-anchor="start" font-size="12.5" fill="#1d2939">• سوائل + حركة + ألياف</text><text x="616.0" y="334" text-anchor="start" font-size="12.5" fill="#1d2939">• بلّغ لو استمر الإمساك أو نزف شرجي</text><text x="616.0" y="352" text-anchor="start" font-size="12.5" fill="#1d2939">• Senna/Cascara: بول وردي-أحمر/بني</text><rect x="12.0" y="288" width="302.0" height="134" rx="10" fill="#efe9fb" stroke="#6a4bb5" stroke-width="1.2"/><rect x="12.0" y="288" width="302.0" height="28" rx="10" fill="#6a4bb5"/><rect x="12.0" y="302" width="302.0" height="14" fill="#6a4bb5"/><text x="163.0" y="307" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التداخلات</text><text x="302.0" y="336" text-anchor="start" font-size="12.5" fill="#1d2939">• Mineral oil يعيق امتصاص فيتامينات A D E</text><text x="302.0" y="354" text-anchor="start" font-size="12.5" fill="#1d2939">   K</text><text x="302.0" y="372" text-anchor="start" font-size="12.5" fill="#1d2939">• الملينات تقلل امتصاص أدوية أخرى</text><text x="302.0" y="390" text-anchor="start" font-size="12.5" fill="#1d2939">• لبن/مضادات الحموضة/H2/PPI تذيب غلاف</text><text x="302.0" y="408" text-anchor="start" font-size="12.5" fill="#1d2939">   bisacodyl مبكرًا: افصل 1–2 ساعة</text></svg>