<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 244" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="244" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">الصفيحات والهيموجلوبين: أرقام تستدعي الإبلاغ مع مضادات الصفيحات</text><rect x="325.0" y="44" width="299.0" height="58.5" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.5"/><path d="M325.0 54a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#be123c"/><text x="474.5" y="66" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الهيموجلوبين</text><text x="474.5" y="94" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أقل من 7 غ/دل خطر</text><rect x="16.0" y="44" width="299.0" height="58.5" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><path d="M16.0 54a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#0f766e"/><text x="165.5" y="66" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الصفيحات الطبيعية</text><text x="165.5" y="94" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">حوالي 150,000 – 400,000</text><rect x="325.0" y="112.5" width="299.0" height="58.5" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.5"/><path d="M325.0 122.5a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#b45309"/><text x="474.5" y="134.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">أقل من 150,000</text><text x="474.5" y="162.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أبلغ الطبيب</text><rect x="16.0" y="112.5" width="299.0" height="58.5" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.5"/><path d="M16.0 122.5a10 10 0 0 1 10 -10h279.0a10 10 0 0 1 10 10v22h-299.0z" fill="#be123c"/><text x="165.5" y="134.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">أقل من 50,000</text><text x="165.5" y="162.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">خطر نزف شديد</text><rect x="16" y="181" width="608" height="47" rx="10" fill="#fef3c7" stroke="#f59e0b"/><text x="320" y="201" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">تنبيه: هذه الأدوية لا يجب أن تُنقص الصفيحات. لو الصفيحات 75,000 أو 40,000:</text><text x="320" y="217.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">احجب الدواء، راجع الوصفة، أبلغ الطبيب.</text></svg>