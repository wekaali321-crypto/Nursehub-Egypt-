<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="330" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الحثل العضلي (Duchenne) ومتى تشك</text><rect x="330" y="50" width="290" height="90" rx="10" fill="#6366f1"/><text x="475.0" y="71.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الآلية</text><text x="475.0" y="89.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">وراثي: تغير بالـDNA ← نقص ديستروفين</text><text x="475.0" y="107.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">استبدال الألياف العضلية بنسيج ضام/دهن</text><text x="475.0" y="125.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">يصيب الأولاد 2-5 سنوات</text><rect x="20" y="50" width="300" height="90" rx="10" fill="#f59e0b"/><text x="170.0" y="71.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">العلامات</text><text x="170.0" y="89.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">المشي على أطراف الأصابع</text><text x="170.0" y="107.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">عضلات سمانة كبيرة بالنسبة للحجم</text><text x="170.0" y="125.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">تعثر وسقوط · علامة غاور (Gower)</text><rect x="330" y="155" width="290" height="110" rx="10" fill="#16a34a"/><text x="475.0" y="186.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التمريض</text><text x="475.0" y="204.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">إزالة السجاجيد</text><text x="475.0" y="222.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">غذاء: سوائل وألياف</text><text x="475.0" y="240.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تمرين لطيف: سباحة يوغا مشي، لا أثقال</text><rect x="20" y="155" width="300" height="110" rx="10" fill="#0ea5e9"/><text x="170.0" y="186.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الدواء</text><text x="170.0" y="204.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">بريدنيزون (ستيرويد)</text><text x="170.0" y="222.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تتبع الانتفاخ والتورم</text><text x="170.0" y="240.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">بيكر أبطأ تطورًا من دوشين</text></svg>