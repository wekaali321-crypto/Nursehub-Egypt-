<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" width="640" height="306" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="Methotrexate: ممنوعات وتحذيرات"><rect width="640" height="306" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">Methotrexate: ممنوعات وتحذيرات</text><rect x="326.0" y="46" width="302.0" height="98" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="326.0" y="60" width="302.0" height="14" fill="#b42318"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">«Meth NOOO trexate»</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• لا حامل</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• لا زحام ولا لقاحات حية</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• لا شفرات حلاقة ولا فرشاة أسنان قاسية</text><rect x="12.0" y="46" width="302.0" height="116" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="12.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الاستعمال والآلية</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• التهاب المفاصل الروماتويدي (مناعة ذاتية)</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• يوقف استقلاب حمض الفوليك فيمنع تكاثر</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">   الخلايا</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• يثبط اللمفاويات B وT</text><rect x="326.0" y="156" width="302.0" height="98" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="326.0" y="156" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="326.0" y="170" width="302.0" height="14" fill="#a86a00"/><text x="477.0" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الآثار</text><text x="616.0" y="204" text-anchor="start" font-size="12.5" fill="#1d2939">• عدوى (مناعة منخفضة)</text><text x="616.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• نزف شديد (صفائح منخفضة)</text><text x="616.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• موت الجنين في الحمل</text><rect x="12.0" y="174" width="302.0" height="116" rx="10" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.2"/><rect x="12.0" y="174" width="302.0" height="28" rx="10" fill="#2e7d4f"/><rect x="12.0" y="188" width="302.0" height="14" fill="#2e7d4f"/><text x="163.0" y="193" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الحمل</text><text x="302.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• لا حمل حتى دورة حيض بعد انتهاء العلاج</text><text x="302.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• أو 3 أشهر بعد انتهاء العلاج</text><text x="302.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• الرجال: لا محاولة إنجاب 3 أشهر بعد</text><text x="302.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">   انتهاء العلاج</text></svg>