<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 482" width="640" height="482" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="482" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a" direction="rtl">فقر الدم الخبيث: من الجهاز المناعي إلى الأعراض العصبية</text><rect x="20" y="56" width="600" height="74" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="606" y="80" text-anchor="end" direction="rtl" font-size="16" font-weight="700" fill="#0f172a" style="unicode-bidi:plaintext" transform="translate(0,0)">هجوم مناعي ذاتي</text><text x="606" y="102" text-anchor="end" direction="rtl" font-size="14" fill="#334155">الجسم يدمّر الخلايا الجدارية في المعدة (Parietal</text><text x="606" y="122" text-anchor="end" direction="rtl" font-size="14" fill="#334155">cells)</text><path d="M320 130 v14" stroke="#64748b" stroke-width="2"/><path d="M314 139 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="20" y="150" width="600" height="54" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="606" y="174" text-anchor="end" direction="rtl" font-size="16" font-weight="700" fill="#0f172a" style="unicode-bidi:plaintext" transform="translate(0,0)">غياب العامل الداخلي (Intrinsic factor)</text><text x="606" y="196" text-anchor="end" direction="rtl" font-size="14" fill="#334155">الضروري لامتصاص فيتامين B12 في نهاية الأمعاء الدقيقة</text><path d="M320 204 v14" stroke="#64748b" stroke-width="2"/><path d="M314 213 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="20" y="224" width="600" height="74" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="606" y="248" text-anchor="end" direction="rtl" font-size="16" font-weight="700" fill="#0f172a" style="unicode-bidi:plaintext" transform="translate(0,0)">نقص B12</text><text x="606" y="270" text-anchor="end" direction="rtl" font-size="14" fill="#334155">كرات حمراء كبيرة غير ناضجة (Macrocytic) + تأثير على</text><text x="606" y="290" text-anchor="end" direction="rtl" font-size="14" fill="#334155">الأعصاب</text><path d="M320 298 v14" stroke="#64748b" stroke-width="2"/><path d="M314 307 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="20" y="318" width="600" height="74" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="606" y="342" text-anchor="end" direction="rtl" font-size="16" font-weight="700" fill="#0f172a" style="unicode-bidi:plaintext" transform="translate(0,0)">الأعراض</text><text x="606" y="364" text-anchor="end" direction="rtl" font-size="14" fill="#334155">شحوب وتعب + وخز القفاز والجورب + لسان أحمر لامع +</text><text x="606" y="384" text-anchor="end" direction="rtl" font-size="14" fill="#334155">اضطراب توازن</text><path d="M320 392 v14" stroke="#64748b" stroke-width="2"/><path d="M314 401 l6 8 l6 -8" fill="none" stroke="#64748b" stroke-width="2"/><rect x="20" y="412" width="600" height="54" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="606" y="436" text-anchor="end" direction="rtl" font-size="16" font-weight="700" fill="#0f172a" style="unicode-bidi:plaintext" transform="translate(0,0)">العلاج</text><text x="606" y="458" text-anchor="end" direction="rtl" font-size="14" fill="#334155">حقن B12 عضل مدى الحياة (الفم غير كافٍ في هذا النوع)</text></svg>