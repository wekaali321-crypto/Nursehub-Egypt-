<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 377" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="377" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">متلازمة شوغرن</text><text x="320" y="50" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">مناعة ذاتية تجفف الجسم</text><rect x="330" y="70" width="300" height="129.0" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,80 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="89" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الفكرة والخطورة</text><text x="620" y="113" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الجسم يهاجم الغدد المفرزة للرطوبة</text><text x="620" y="130.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• جفاف الجلد والعين والمفاصل والفم</text><text x="620" y="147.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• فوق 40 سنة</text><text x="620" y="165.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• النساء أكثر بـ 10 أضعاف</text><text x="620" y="182.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أمراض روماتيزمية مصاحبة</text><rect x="10" y="70" width="310" height="111.6" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.5"/><path d="M10,80 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#be123c"/><text x="165.0" y="89" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأعراض</text><text x="310" y="113" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• جفاف العين (نقطة اختبار)</text><text x="310" y="130.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• جفاف الفم</text><text x="310" y="147.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• جفاف الجلد والمهبل والحاجز الأنفي</text><text x="310" y="165.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ألم المفاصل</text><rect x="330" y="207.0" width="300" height="146.39999999999998" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M330,217.0 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#16a34a"/><text x="480.0" y="226.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التثقيف</text><text x="620" y="250.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• العين: دموع صناعية</text><text x="620" y="267.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الأنف: مرطب هواء</text><text x="620" y="284.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الجلد: لا صابون قاسٍ ولا استحمام ساخن</text><text x="620" y="302.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (فاتر)، ومرطبات (والمهبل مزلقات)</text><text x="620" y="319.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الفم: فحص أسنان منتظم، لعاب صناعي أو</text><text x="620" y="336.9999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  علكة، سوائل أكثر</text><rect x="10" y="207.0" width="310" height="94.19999999999999" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M10,217.0 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#7c3aed"/><text x="165.0" y="226.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأدوية</text><text x="310" y="250.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• كابتات المناعة</text><text x="310" y="267.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• هيدروكسي كلوروكين</text><text x="310" y="284.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ميثوتريكسات</text></svg>