<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="250" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مراحل آفة الهربس البسيط</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <!-- stage1 -->
    <g transform="translate(535,105)"><ellipse rx="52" ry="40" fill="#fecaca"/><text y="5" fill="#7f1d1d" font-size="12">حرقان فقط</text></g>
    <text x="535" y="175" fill="#0f172a">1) وخز وحرقان</text><text x="535" y="193" font-weight="400" font-size="12" fill="#475569">احمرار خفيف</text>
    <!-- stage2 -->
    <g transform="translate(375,105)"><ellipse rx="52" ry="40" fill="#fca5a5"/><circle cx="-18" cy="-8" r="6" fill="#fff" stroke="#b91c1c"/><circle cx="-4" cy="6" r="6" fill="#fff" stroke="#b91c1c"/><circle cx="10" cy="-10" r="6" fill="#fff" stroke="#b91c1c"/><circle cx="20" cy="8" r="6" fill="#fff" stroke="#b91c1c"/><circle cx="-14" cy="14" r="5" fill="#fff" stroke="#b91c1c"/></g>
    <text x="375" y="175" fill="#0f172a">2) حويصلات متجمعة</text><text x="375" y="193" font-weight="400" font-size="12" fill="#475569">على قاعدة حمراء</text>
    <!-- stage3 -->
    <g transform="translate(215,105)"><ellipse rx="52" ry="40" fill="#fdba74"/><path d="M-30,-6 Q-10,-24 14,-14 Q34,0 20,16 Q-6,28 -28,10 Z" fill="#a16207"/></g>
    <text x="215" y="175" fill="#0f172a">3) تقرح وقشرة</text><text x="215" y="193" font-weight="400" font-size="12" fill="#475569">الأشد عدوى</text>
    <!-- stage4 -->
    <g transform="translate(75,105)"><ellipse rx="44" ry="36" fill="#fde7d4"/></g>
    <text x="75" y="175" fill="#0f172a">4) شفاء</text><text x="75" y="193" font-weight="400" font-size="12" fill="#475569">خلال 1–2 أسبوع</text>
  </g>
  <text x="320" y="230" text-anchor="middle" font-size="12" fill="#475569">الفيروس يظل كامناً في العصب وقد يعود مع التوتر والشمس والحمى</text>
</svg>
