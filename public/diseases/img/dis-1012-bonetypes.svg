"12" font-weight="500" fill="#0f172a">الجبهي والجداري والصدغي والقذالي والوتدي</text><text x="472" y="262" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">والغربالي</text><rect x="20" y="174" width="295" height="120" rx="10" fill="#fff" stroke="#ef4444" stroke-width="2"/><rect x="20" y="174" width="295" height="28" rx="10" fill="#ef4444" stroke="none" stroke-width="1.5"/><rect x="20" y="188" width="295" height="14" rx="0" fill="#ef4444" stroke="none" stroke-width="1.5"/><text x="167" y="193" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">غير منتظمة Irregular</text><text x="167" y="226" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">الفقرات والحوض والعجز والعصعص، وعظام</text><text x="167" y="244" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">الجمجمة الوجنية والفك العلوي والحنكي</text><text x="167" y="262" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">واللامي والفك السفلي والصدغي</text><rect x="325" y="304" width="295" height="120" rx="10" fill="#fff" stroke="#8b5cf6" stroke-width="2"/><rect x="325" y="304" width="295" height="28" rx="10" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><rect x="325" y="318" width="295" height="14" rx="0" fill="#8b5cf6" stroke="none" stroke-width="1.5"/><text x="472" y="323" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">سمسمانية Sesamoid</text><text x="472" y="356" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">تتكوّن داخل الأوتار: الرضفة (عظمة</text><text x="472" y="374" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">الركبة)</text><ellipse cx="350" cy="374" rx="14" ry="16" fill="#e7e2d3" stroke="#a8a08a" stroke-width="1.5"/><rect x="325" y="304" width="275" height="120" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><ellipse cx="462" cy="364" rx="40" ry="16" fill="#e7e2d3" stroke="#a8a08a" stroke-width="1.5"/><text x="462" y="400" text-anchor="middle" 