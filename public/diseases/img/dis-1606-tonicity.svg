<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="380" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ثلاث أنواع من المحاليل وتأثيرها على الخلية</text>
<rect x="14" y="44" width="200" height="320" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><rect x="14" y="44" width="200" height="34" rx="12" fill="#16a34a"/><text x="114" y="66" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >متساوي التوتر</text><text x="114" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a" direction="ltr">Isotonic</text><circle cx="114" cy="160" r="28" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><line x1="64" y1="118" x2="64" y2="118" stroke="#334155" stroke-width="2" /><text x="114" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d" >مستقر</text><text x="114" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >ماء داخل = خارج</text><text x="114" y="246" text-anchor="middle" font-size="12" font-weight="800" fill="#16a34a" >لا انتقال</text><text x="114" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b" >أمثلة:</text><text x="114" y="302" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155" >0.9% ملحي، رينجر لاكتات</text><rect x="222" y="44" width="200" height="320" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><rect x="222" y="44" width="200" height="34" rx="12" fill="#2563eb"/><text x="322" y="66" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >منخفض التوتر</text><text x="322" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb" direction="ltr">Hypotonic</text><circle cx="322" cy="160" r="38" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="322" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d" >ينتفخ</text><text x="322" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >أسمولالية أقل من الدم</text><text x="322" y="246" text-anchor="middle" font-size="12" font-weight="800" fill="#2563eb" >الماء يدخل الخلية: تنتفخ</text><text x="322" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b" >أمثلة:</text><text x="322" y="302" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155" >0.45% ملحي، D5W، 0.33%</text><rect x="430" y="44" width="200" height="320" rx="12" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="430" y="44" width="200" height="34" rx="12" fill="#dc2626"/><text x="530" y="66" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >مرتفع التوتر</text><text x="530" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626" direction="ltr">Hypertonic</text><circle cx="530" cy="160" r="18" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="530" y="164" text-anchor="middle" font-size="9" font-weight="700" fill="#7f1d1d" >ينكمش</text><text x="530" y="225" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >أسمولالية أعلى من الدم</text><text x="530" y="246" text-anchor="middle" font-size="12" font-weight="800" fill="#dc2626" >الماء يخرج: تنكمش</text><text x="530" y="282" text-anchor="middle" font-size="11" font-weight="700" fill="#64748b" >أمثلة:</text><text x="530" y="302" text-anchor="middle" font-size="10.5" font-weight="600" fill="#334155" >3% ملحي، D10W، D5NS</text>
</svg>
