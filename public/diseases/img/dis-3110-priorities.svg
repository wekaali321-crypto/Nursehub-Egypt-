<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="640" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تحديد الأولويات بما يتجاوز A-B-C</text>
  <rect x="330" y="50" width="290" height="170" rx="10" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">المجرى الهوائي (الأعلى أولوية)</text><text x="608" y="96" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• صرير (Stridor) بعد جراحة الدرقية</text><text x="608" y="120" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• تورم الحلق في التحسس: إبينفرين أولًا</text><text x="608" y="144" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• نزف دوالي المريء: وضع الجنب</text><rect x="20" y="50" width="290" height="170" rx="10" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">التنفس</text><text x="298" y="96" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• PaO2 الطبيعي 80–100؛ ≤ 60 = فشل نقص أكسجة</text><text x="298" y="120" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• CO2 ≥ 50 = فشل احتباس CO2</text><text x="298" y="144" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• SpO2 الطبيعي 95–100%</text><text x="298" y="168" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• مريض COPD: 90% طبيعي له</text><rect x="330" y="235" width="290" height="190" rx="10" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="257" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الدورة</text><text x="608" y="281" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• نزف داخلي: هبوط ضغط، بطن قاسٍ، جلد بارد رطب</text><text x="608" y="305" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• صفائح 150–400 ألف؛ &lt; 50 ألف خطر شديد</text><text x="608" y="329" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• هيبارين: PTT 46–70</text><text x="608" y="353" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• وارفارين: INR 2–3 (حد أقصى 3)</text><rect x="20" y="235" width="290" height="190" rx="10" fill="#fce7f3" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="257" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الصدمة والقلب</text><text x="298" y="281" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• ضغط منخفض جدًا، بول ≤ 30 مل/س</text><text x="298" y="305" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• ألم صدر أي نوع: تروبونين &gt; 0.5</text><text x="298" y="329" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• أزمة ضغط &gt; 180 انقباضي</text><text x="298" y="353" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• جلد شاحب بارد رطب</text><rect x="20" y="440" width="190" height="185" rx="10" fill="#e0e7ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="115" y="462" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">العدوى</text><text x="198" y="486" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• جراحة: إفراز أحمر</text><text x="198" y="510" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• دافئ كريه الرائحة</text><text x="198" y="534" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• WBC &gt; 10,000</text><text x="198" y="558" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• قلة العدلات &lt; 1500:</text><text x="198" y="582" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• حمى خفيفة = خطر</text><rect x="225" y="440" width="190" height="185" rx="10" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="462" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">المختبر</text><text x="403" y="486" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• سكر &lt; 70</text><text x="403" y="510" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• كرياتينين &gt; 1.3</text><text x="403" y="534" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• بول ≤ 30 مل/س</text><text x="403" y="558" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• مسممات الكلى: صبغة CT،</text><text x="403" y="582" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• فانكومايسين، جنتامايسين</text><rect x="430" y="440" width="190" height="185" rx="10" fill="#fef9c3" stroke="#cbd5e1" stroke-width="1.5"/><text x="525" y="462" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الألم</text><text x="608" y="486" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• فقدان حياة أو طرف</text><text x="608" y="510" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• ألم الصدر أولوية 1</text><text x="608" y="534" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• ألم جبيرة لا يزول</text><text x="608" y="558" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• بالمسكنات: متلازمة الحيز</text>
</svg>
