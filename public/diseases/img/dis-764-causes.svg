<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 222" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="222" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">أنواع الفشل الكلوي الحاد حسب مكان المشكلة</text><rect x="12" y="44" width="616" height="30" rx="8" fill="#0f172a"/><text x="558.9655172413793" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">النوع</text><text x="431.51724137931035" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">السبب</text><text x="266.89655172413796" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">أمثلة</text><text x="86.34482758620695" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">العلاج</text><rect x="12" y="74" width="616" height="44" fill="#fff" stroke="#2563eb" stroke-width="0"/><rect x="623" y="74" width="5" height="44" fill="#2563eb"/><text x="558.9655172413793" y="92" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">قبل الكلية</text><text x="558.9655172413793" y="108" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">(Prerenal)</text><text x="431.51724137931035" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">نقص تروية</text><text x="266.89655172413796" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">نزيف، جفاف، مدرّات، فشل قلب،</text><text x="266.89655172413796" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">NSAIDs</text><text x="86.34482758620695" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">سوائل / علاج القلب</text><rect x="12" y="118" width="616" height="44" fill="#f1f5f9" stroke="#ea580c" stroke-width="0"/><rect x="623" y="118" width="5" height="44" fill="#ea580c"/><text x="558.9655172413793" y="136" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">داخل الكلية</text><text x="558.9655172413793" y="152" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">(Intrinsic)</text><text x="431.51724137931035" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">تلف أنسجة</text><text x="266.89655172413796" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">تنخر الأنابيب ATN، التهاب</text><text x="266.89655172413796" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">كبيبات، أدوية، صبغة</text><text x="86.34482758620695" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">إيقاف السبب + دعم</text><rect x="12" y="162" width="616" height="44" fill="#fff" stroke="#7c3aed" stroke-width="0"/><rect x="623" y="162" width="5" height="44" fill="#7c3aed"/><text x="558.9655172413793" y="180" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">بعد الكلية</text><text x="558.9655172413793" y="196" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">(Postrenal)</text><text x="431.51724137931035" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">انسداد خروج البول</text><text x="266.89655172413796" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">حصوة، تضخم بروستاتا، ورم، قسطرة</text><text x="266.89655172413796" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">مسدودة</text><text x="86.34482758620695" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">قسطرة / دعامة /</text><text x="86.34482758620695" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">نفروستومي</text></svg>