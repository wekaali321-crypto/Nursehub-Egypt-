<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" direction="rtl" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="432" fill="#fafafa"/><text x="320" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0d47a1">من الرتج إلى التهاب الرتج</text><rect x="40" y="60" width="560" height="66" rx="12" fill="#e3f2fd" stroke="#607d8b" stroke-width="1.2"/><text x="320" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">رتوج (Diverticulosis)</text><text x="320" y="110" text-anchor="middle" font-size="14" fill="#37474f">جيوب صغيرة بجدار القولون، غالباً السيني. غالباً بلا أعراض</text><path d="M320 126 v18" stroke="#607d8b" stroke-width="2"/><path d="M313 138 l7 8 l7 -8" fill="none" stroke="#607d8b" stroke-width="2"/><rect x="40" y="152" width="560" height="66" rx="12" fill="#fff8e1" stroke="#607d8b" stroke-width="1.2"/><text x="320" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">انحشار طعام + بكتيريا</text><text x="320" y="202" text-anchor="middle" font-size="14" fill="#37474f">التهاب رتج واحد أو أكثر = Diverticulitis</text><path d="M320 218 v18" stroke="#607d8b" stroke-width="2"/><path d="M313 230 l7 8 l7 -8" fill="none" stroke="#607d8b" stroke-width="2"/><rect x="40" y="244" width="560" height="66" rx="12" fill="#fce4ec" stroke="#607d8b" stroke-width="1.2"/><text x="320" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">ألم أسفل اليسار + حمى + WBC↑</text><text x="320" y="294" text-anchor="middle" font-size="14" fill="#37474f">CT يؤكد سماكة وخراج</text><path d="M320 310 v18" stroke="#607d8b" stroke-width="2"/><path d="M313 322 l7 8 l7 -8" fill="none" stroke="#607d8b" stroke-width="2"/><rect x="40" y="336" width="560" height="66" rx="12" fill="#e8f5e9" stroke="#607d8b" stroke-width="1.2"/><text x="320" y="364" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">مضاعفات</text><text x="320" y="386" text-anchor="middle" font-size="14" fill="#37474f">ثقب ← التهاب صفاق، خراج، ناسور (مثانة)، انسداد، نزف</text></svg>