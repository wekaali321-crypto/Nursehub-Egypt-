<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="300" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الاشتباه بإساءة معاملة طفل: التسلسل</text><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#475569"/></marker></defs><rect x="430" y="50" width="190" height="70" rx="10" fill="#0ea5e9"/><text x="525.0" y="70.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1) التقييم أولًا</text><text x="525.0" y="87.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">مقابلة وفحص جسدي</text><text x="525.0" y="104.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">تفاعل الوالد-الطفل</text><rect x="225" y="50" width="190" height="70" rx="10" fill="#7c3aed"/><text x="320.0" y="70.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2) التوثيق والإبلاغ</text><text x="320.0" y="87.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">بعد تقييم وتاريخ كامل</text><text x="320.0" y="104.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">أبلغ عن كل حالة اشتباه</text><rect x="20" y="50" width="190" height="70" rx="10" fill="#16a34a"/><text x="115.0" y="70.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3) التواصل مع الطفل</text><text x="115.0" y="87.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">ليست غلطتك ولا تلام</text><text x="115.0" y="104.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">لا وعود ولا أسرار</text><line x1="425" y1="85" x2="415" y2="85" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/><line x1="220" y1="85" x2="210" y2="85" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/><rect x="20" y="140" width="600" height="40" rx="10" fill="#f59e0b"/><text x="320.0" y="163.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">أسئلة مفتوحة تتطلب وصفًا · اسأل الطفل بمفرده بعد إخراج الوالد · لا تلمه</text><rect x="20" y="195" width="600" height="85" rx="10" fill="#fee2e2"/><text x="320.0" y="222.5" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">عوامل خطر المعتدي</text><text x="320.0" y="240.5" text-anchor="middle" font-size="12" font-weight="500" fill="#7f1d1d">• نشأة في بيئة عنف أسري  • تعاطي كحول/مخدرات  • تدنّي تقدير الذات واندفاعية</text><text x="320.0" y="258.5" text-anchor="middle" font-size="12" font-weight="500" fill="#7f1d1d">• أسلوب سلطوي ناقد  • والدان مراهقان أو أسرة بوالد واحد  • طفل بتأخر نمائي/خديج/توحد</text></svg>