<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 422" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="422" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">7 نصائح إنسولين</text><rect x="325" y="48" width="295" height="72" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1. الذروة = أكل</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">وقت الذروة لازم يكون فيه أكل لتجنب الهبوط</text><rect x="20" y="48" width="295" height="72" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2. بلا ذروة بلا خلط</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">الطويل (ديتميرا/جلارجين) لا يُخلط</text><rect x="325" y="130" width="295" height="72" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="130" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3. IV = Regular فقط</text><text x="610" y="182" text-anchor="start" font-size="12.5" fill="#1e293b">وحده "جاهز للوريد"</text><rect x="20" y="130" width="295" height="72" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><rect x="20" y="130" width="295" height="30" rx="12" fill="#9333ea"/><text x="167.5" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4. اسحب الصافي ثم العكر</text><text x="305" y="182" text-anchor="start" font-size="12.5" fill="#1e293b">Clear before Cloudy</text><rect x="325" y="212" width="295" height="72" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/><rect x="325" y="212" width="295" height="30" rx="12" fill="#dc2626"/><text x="472.5" y="233" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5. دوّر مواضع الحقن</text><text x="610" y="264" text-anchor="start" font-size="12.5" fill="#1e293b">البطن أفضل: على بعد 2 بوصة من السرة</text><rect x="20" y="212" width="295" height="72" rx="12" fill="#fff" stroke="#0891b2" stroke-width="2"/><rect x="20" y="212" width="295" height="30" rx="12" fill="#0891b2"/><text x="167.5" y="233" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">6. أيام المرض (DKA)</text><text x="305" y="264" text-anchor="start" font-size="12.5" fill="#1e293b">نوع 1 يحتاج إنسولين حتى بدون أكل</text><rect x="325" y="294" width="295" height="112" rx="12" fill="#fff" stroke="#ca8a04" stroke-width="2"/><rect x="325" y="294" width="295" height="30" rx="12" fill="#ca8a04"/><text x="472.5" y="315" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">7. الهبوط 70 أو أقل</text><text x="610" y="346" text-anchor="start" font-size="12.5" fill="#1e293b">صاحٍ: أطعمه (عصير، لبن قليل الدسم)</text><text x="610" y="366" text-anchor="start" font-size="12.5" fill="#1e293b">نائم/غير مستجيب: دكستروز IV (D50) أو</text><text x="610" y="386" text-anchor="start" font-size="12.5" fill="#1e293b">جلوكاجون حسب الأمر</text>
</svg>
