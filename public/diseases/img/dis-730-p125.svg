<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="200" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">هرمون النمو: العملقة وتقزم قصور النخامية</text><rect x="324" y="48" width="296" height="132" rx="12" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1.5"/><rect x="324" y="48" width="296" height="34" rx="12" fill="#ef4444"/><text x="472" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">فرط (Gigantism/Acromegaly)</text><text x="472" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">طول وأطراف كبيرة</text><text x="472" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">ضغط مرتفع</text><text x="472" y="152" text-anchor="middle" font-size="12.5" fill="#0f172a">تعرق وجلد دهني</text><text x="472" y="176" text-anchor="middle" font-size="12.5" fill="#0f172a">جراحة النخامية</text><rect x="20" y="48" width="296" height="132" rx="12" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-width="1.5"/><rect x="20" y="48" width="296" height="34" rx="12" fill="#0ea5e9"/><text x="168" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">قصور (Hypopituitarism)</text><text x="168" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">ضغط منخفض</text><text x="168" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">قصر قامة وخمول</text><text x="168" y="152" text-anchor="middle" font-size="12.5" fill="#0f172a">عقم وضعف رغبة</text><text x="168" y="176" text-anchor="middle" font-size="12.5" fill="#0f172a">تعويض هرموني</text>
</svg>
