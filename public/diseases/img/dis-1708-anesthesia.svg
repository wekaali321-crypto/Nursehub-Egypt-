<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="390" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">التخدير والتسكين أثناء الولادة: أين يعمل وبماذا يحذَّر</text><rect x="20" y="48" width="600" height="74" rx="10" fill="#dbeafe"/><text x="540" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">مسكنات أفيونية وريدية</text><text x="320" y="96" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">طور مبكر، 2–4 ساعات قبل الولادة</text><text x="320" y="113" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">الحذر: اكتئاب تنفس للأم والمولود: نالوكسون جاهز</text><rect x="20" y="132" width="600" height="74" rx="10" fill="#fef3c7"/><text x="540" y="156" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">فوق الجافية (Epidural)</text><text x="320" y="180" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">من السرة للأسفل، بعد 4 سم</text><text x="320" y="197" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">الحذر: هبوط ضغط وبطء نبض جنين، وصفائح أقل من 150 ألف خطر نزف</text><rect x="20" y="216" width="600" height="74" rx="10" fill="#dcfce7"/><text x="540" y="240" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">نخاعي (Spinal)</text><text x="320" y="264" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">قيصرية: فقد كامل للحركة والإحساس</text><text x="320" y="281" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">الحذر: هبوط ضغط: الوضع الجانبي الأيسر وسوائل</text><rect x="20" y="300" width="600" height="74" rx="10" fill="#fce7f3"/><text x="540" y="324" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">حصار العصب الفرجي (Pudendal)</text><text x="320" y="348" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">العجان والفرج والمستقيم</text><text x="320" y="365" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">الحذر: لا يسكن ألم الانقباض، مناسب للولادة الوشيكة</text>
</svg>
