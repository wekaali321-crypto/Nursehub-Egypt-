<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="310" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الدرن: الأعراض والتشخيص</text><rect x="469" y="50" width="155" height="32" fill="#d97706"/><text x="546" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الجانب</text><rect x="16" y="50" width="453" height="32" fill="#d97706"/><text x="242" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التفصيل</text><rect x="469" y="82" width="155" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="102" text-anchor="start" font-size="13" fill="#0f172a">الجرثومة</text><rect x="16" y="82" width="453" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="461" y="102" text-anchor="start" font-size="13" fill="#0f172a">المتفطرة السلية Mycobacterium tuberculosis تنتقل عبر الهواء ثم</text><text x="461" y="121" text-anchor="start" font-size="13" fill="#0f172a">تنتشر عبر الليمف والدم</text><rect x="469" y="132" width="155" height="50" fill="#fef3c7" stroke="#cbd5e1"/><text x="616" y="152" text-anchor="start" font-size="13" fill="#0f172a">الأعراض</text><rect x="16" y="132" width="453" height="50" fill="#fef3c7" stroke="#cbd5e1"/><text x="461" y="152" text-anchor="start" font-size="13" fill="#0f172a">تعرق ليلي، فقدان شهية ووزن، سعال مع بلغم مدمّى (Hemoptysis)،</text><text x="461" y="171" text-anchor="start" font-size="13" fill="#0f172a">ضيق نفس، حمى وقشعريرة</text><rect x="469" y="182" width="155" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="202" text-anchor="start" font-size="13" fill="#0f172a">اختبار التوبركولين</text><text x="616" y="221" text-anchor="start" font-size="13" fill="#0f172a">(Mantoux)</text><rect x="16" y="182" width="453" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="461" y="202" text-anchor="start" font-size="13" fill="#0f172a">حقن داخل الجلد وقراءة بعد 2–3 أيام؛ تصلب 15 mm أو أكثر =</text><text x="461" y="221" text-anchor="start" font-size="13" fill="#0f172a">إيجابي (عدوى TB). الحدود تختلف حسب عوامل الخطر</text><rect x="469" y="232" width="155" height="31" fill="#fef3c7" stroke="#cbd5e1"/><text x="616" y="252" text-anchor="start" font-size="13" fill="#0f172a">الشكل النشط</text><rect x="16" y="232" width="453" height="31" fill="#fef3c7" stroke="#cbd5e1"/><text x="461" y="252" text-anchor="start" font-size="13" fill="#0f172a">أشعة صدر + مزرعة بلغم</text><rect x="469" y="263" width="155" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="283" text-anchor="start" font-size="13" fill="#0f172a">مزرعة البلغم</text><rect x="16" y="263" width="453" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="461" y="283" text-anchor="start" font-size="13" fill="#0f172a">عينة معقمة في الصباح الباكر 3 أيام متتالية</text></svg>