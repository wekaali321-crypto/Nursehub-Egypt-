<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" font-family="Cairo, Tahoma, sans-serif">
<rect width="640" height="312" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">اختيار وسيلة منع الحمل المناسبة</text>
<rect x="20" y="44" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="44" width="160" height="54" rx="10" fill="#be185d"/><text x="540" y="76" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">عروس / أقل من 35</text><text x="448" y="67" text-anchor="end" font-size="12" fill="#0f172a">أقراص منع الحمل المركبة COC</text><text x="448" y="85" text-anchor="end" font-size="12" fill="#0f172a">(اللولب لا يُفضَّل في هذه الفئة حسب المصدر)</text><rect x="20" y="106" width="600" height="46" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="106" width="160" height="46" rx="10" fill="#7c3aed"/><text x="540" y="134" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">أكبر من 35 سنة</text><text x="448" y="134" text-anchor="end" font-size="12" fill="#0f172a">اللولب (IUD) هو المفضل</text><rect x="20" y="160" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="160" width="160" height="54" rx="10" fill="#0369a1"/><text x="540" y="192" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">مرضعة</text><text x="448" y="183" text-anchor="end" font-size="12" fill="#0f172a">أقراص البروجستيرون POPs (بعد 6 أسابيع من الولادة)</text><text x="448" y="201" text-anchor="end" font-size="12" fill="#0f172a">أو حقنة Depo-Provera · أو الرضاعة الطبيعية LAM</text><rect x="20" y="222" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="222" width="160" height="54" rx="10" fill="#0f766e"/><text x="540" y="254" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">سكر أو قلب</text><text x="448" y="245" text-anchor="end" font-size="12" fill="#0f172a">وسائل ميكانيكية مثل الواقي الذكري</text><text x="448" y="263" text-anchor="end" font-size="12" fill="#0f172a">(والقرار النهائي للطبيب)</text><text x="320" y="296" text-anchor="middle" font-size="12" fill="#64748b">اسأل أولاً: السن · أطفال؟ · رضاعة؟ · المدة المطلوبة · أمراض؟ · نمط الدورة</text>
</svg>
