<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 538" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="538" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">قائمة التحضير قبل العملية (Pre-op)</text><rect x="40" y="48" width="560" height="50" rx="12" fill="#fff" stroke="#dc2626" stroke-width="1.8"/><circle cx="576" cy="73" r="14" fill="#dc2626"/><text x="576" y="78" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="552" y="69" text-anchor="start" font-size="14" font-weight="800" fill="#dc2626">هوية وموافقة</text><text x="552" y="87" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">اسم + رقم + العملية + الجانب؛ موافقة موقّعة من مريض بالغ واعٍ وشاهد</text><text x="320" y="114" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="120" width="560" height="66" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><circle cx="576" cy="153" r="14" fill="#2563eb"/><text x="576" y="158" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="552" y="141" text-anchor="start" font-size="14" font-weight="800" fill="#2563eb">فحوصات</text><text x="552" y="159" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">CBC، كيمياء، بول، PT/INR/PTT، ECG، أشعة صدر، فصيلة دم وتطابق حسب</text><text x="552" y="175" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">الحاجة؛ حمل</text><text x="320" y="202" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="208" width="560" height="66" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.8"/><circle cx="576" cy="241" r="14" fill="#ea580c"/><text x="576" y="246" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="552" y="229" text-anchor="start" font-size="14" font-weight="800" fill="#ea580c">صيام وأدوية</text><text x="552" y="247" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">NPO حسب بروتوكول التخدير؛ أدوية الصباح المسموحة؛ سكر/ضغط/قلب حسب أمر</text><text x="552" y="263" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">الطبيب؛ مميعات</text><text x="320" y="290" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="296" width="560" height="66" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.8"/><circle cx="576" cy="329" r="14" fill="#16a34a"/><text x="576" y="334" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="552" y="317" text-anchor="start" font-size="14" font-weight="800" fill="#16a34a">تحضير الجلد والأمعاء</text><text x="552" y="335" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">استحمام مطهر؛ إزالة الشعر بالمقص الكهربائي فقط إن لزم؛ تحضير أمعاء</text><text x="552" y="351" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">لجراحات القولون</text><text x="320" y="378" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="384" width="560" height="66" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><circle cx="576" cy="417" r="14" fill="#7c3aed"/><text x="576" y="422" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text><text x="552" y="405" text-anchor="start" font-size="14" font-weight="800" fill="#7c3aed">مخرجات</text><text x="552" y="423" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">إزالة الأطقم والحلي والعدسات، علامات الجانب، خط وريدي، مضاد حيوي وقائي</text><text x="552" y="439" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">في موعده</text><text x="320" y="466" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="472" width="560" height="50" rx="12" fill="#fff" stroke="#475569" stroke-width="1.8"/><circle cx="576" cy="497" r="14" fill="#475569"/><text x="576" y="502" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">6</text><text x="552" y="493" text-anchor="start" font-size="14" font-weight="800" fill="#475569">نقل</text><text x="552" y="511" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">ملف كامل: موافقة، تحاليل، قائمة تحقق، أدوية؛ تسليم شفهي</text></svg>