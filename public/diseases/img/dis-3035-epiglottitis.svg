<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="400" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب لسان المزمار (Epiglottitis): طوارئ</text><rect x="430" y="50" width="190" height="100" rx="10" fill="#dc2626"/><text x="525.0" y="85.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الطارئة</text><text x="525.0" y="102.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">التهاب مفاجئ شديد يسد المجرى الهوائي</text><text x="525.0" y="119.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">قد يغلق المجرى كاملًا خلال ساعات</text><rect x="225" y="50" width="190" height="100" rx="10" fill="#f59e0b"/><text x="320.0" y="77.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">العلامات</text><text x="320.0" y="94.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">قلق وتوتر</text><text x="320.0" y="111.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">صرير (Stridor)</text><text x="320.0" y="128.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">حمى + سيلان لعاب + وضع ثلاثي القوائم</text><rect x="20" y="50" width="190" height="100" rx="10" fill="#6366f1"/><text x="115.0" y="77.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأسباب</text><text x="115.0" y="94.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">المستدمية النزلية ب (HiB)</text><text x="115.0" y="111.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">نقص التطعيمات</text><text x="115.0" y="128.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">أكثر عند الذكور</text><rect x="20" y="165" width="600" height="100" rx="10" fill="#16a34a"/><text x="320.0" y="191.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التمريض</text><text x="320.0" y="209.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">الأولوية: المجرى الهوائي ثم التنفس ثم الدورة (ABC)</text><text x="320.0" y="227.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ممنوع فحص الحلق وممنوع قياس الحرارة بالفم حتى يجهز التنبيب وطقم فغر القصبة</text><text x="320.0" y="245.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">وضع ثلاثي القوائم (Tripod) · تطعيمات قياسية</text><rect x="20" y="280" width="600" height="100" rx="10" fill="#7c3aed"/><text x="320.0" y="306.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج والمتابعة</text><text x="320.0" y="324.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">حالة شديدة: تنبيب أنفي رغامي أو فغر القصبة</text><text x="320.0" y="342.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">متابعة تشبع الأكسجين</text><text x="320.0" y="360.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">أهم علامة: سيلان اللعاب (Drooling)</text></svg>