<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 255" direction="rtl" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="255" fill="#fafafa"/><text x="320" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0d47a1">بعد جراحة الدرقية: ماذا تراقب؟</text><rect x="470" y="60" width="150" height="35" fill="#bbdefb" stroke="#90a4ae"/><text x="545" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">المضاعفة</text><rect x="370" y="60" width="100" height="35" fill="#bbdefb" stroke="#90a4ae"/><text x="420" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">متى</text><rect x="190" y="60" width="180" height="35" fill="#bbdefb" stroke="#90a4ae"/><text x="280" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">العلامة</text><rect x="20" y="60" width="170" height="35" fill="#bbdefb" stroke="#90a4ae"/><text x="105" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">الإجراء</text><rect x="470" y="95" width="150" height="35" fill="#f1f8ff" stroke="#90a4ae"/><text x="545" y="119" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">نزيف / ورم دموي بالرقبة</text><rect x="370" y="95" width="100" height="35" fill="#f1f8ff" stroke="#90a4ae"/><text x="420" y="119" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">أول 24 ساعة</text><rect x="190" y="95" width="180" height="35" fill="#f1f8ff" stroke="#90a4ae"/><text x="280" y="119" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">تورم رقبة، ضيق تنفس، ضمادة مبتلة</text><rect x="20" y="95" width="170" height="35" fill="#f1f8ff" stroke="#90a4ae"/><text x="105" y="119" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">فك الغرز حسب البروتوكول + بلّغ فوراً + مجرى هوائي</text><rect x="470" y="130" width="150" height="35" fill="#ffffff" stroke="#90a4ae"/><text x="545" y="154" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">انسداد مجرى الهواء / حنجرة</text><rect x="370" y="130" width="100" height="35" fill="#ffffff" stroke="#90a4ae"/><text x="420" y="154" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">فوراً</text><rect x="190" y="130" width="180" height="35" fill="#ffffff" stroke="#90a4ae"/><text x="280" y="154" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">بحة، صرير، عدم القدرة على الكلام</text><rect x="20" y="130" width="170" height="35" fill="#ffffff" stroke="#90a4ae"/><text x="105" y="154" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">أكسجين + شفط + طقم تراكيوستومي</text><rect x="470" y="165" width="150" height="35" fill="#f1f8ff" stroke="#90a4ae"/><text x="545" y="189" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">نقص كالسيوم (جارات الدرقية)</text><rect x="370" y="165" width="100" height="35" fill="#f1f8ff" stroke="#90a4ae"/><text x="420" y="189" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">24–72 ساعة</text><rect x="190" y="165" width="180" height="35" fill="#f1f8ff" stroke="#90a4ae"/><text x="280" y="189" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">تنميل حول الفم واليدين، Chvostek وTrousseau، تكزز</text><rect x="20" y="165" width="170" height="35" fill="#f1f8ff" stroke="#90a4ae"/><text x="105" y="189" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">Ca gluconate IV بطء + ECG</text><rect x="470" y="200" width="150" height="35" fill="#ffffff" stroke="#90a4ae"/><text x="545" y="224" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">عاصفة درقية</text><rect x="370" y="200" width="100" height="35" fill="#ffffff" stroke="#90a4ae"/><text x="420" y="224" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">أول 12–48 ساعة</text><rect x="190" y="200" width="180" height="35" fill="#ffffff" stroke="#90a4ae"/><text x="280" y="224" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">حمى > 38.5، نبض سريع، هياج</text><rect x="20" y="200" width="170" height="35" fill="#ffffff" stroke="#90a4ae"/><text x="105" y="224" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">طوارئ: بلّغ فوراً</text></svg>