<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" direction="rtl" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="350" fill="#fafafa"/><text x="320" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0d47a1">بعد جراحة الدرقية: ماذا تراقب؟</text><rect x="470" y="60" width="150" height="35" fill="#bbdefb" stroke="#90a4ae"/><text x="545" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">المضاعفة</text><rect x="370" y="60" width="100" height="35" fill="#bbdefb" stroke="#90a4ae"/><text x="420" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">متى</text><rect x="190" y="60" width="180" height="35" fill="#bbdefb" stroke="#90a4ae"/><text x="280" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">العلامة</text><rect x="20" y="60" width="170" height="35" fill="#bbdefb" stroke="#90a4ae"/><text x="105" y="84" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">الإجراء</text><rect x="470" y="95" width="150" height="73" fill="#f1f8ff" stroke="#90a4ae"/><text x="545" y="119" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">نزيف / ورم دموي</text><text x="545" y="138" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">بالرقبة</text><rect x="370" y="95" width="100" height="73" fill="#f1f8ff" stroke="#90a4ae"/><text x="420" y="119" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">أول 24 ساعة</text><rect x="190" y="95" width="180" height="73" fill="#f1f8ff" stroke="#90a4ae"/><text x="280" y="119" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">تورم رقبة، ضيق تنفس،</text><text x="280" y="138" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">ضمادة مبتلة</text><rect x="20" y="95" width="170" height="73" fill="#f1f8ff" stroke="#90a4ae"/><text x="105" y="119" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">فك الغرز حسب البروتوكول</text><text x="105" y="138" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">+ بلّغ فوراً + مجرى</text><text x="105" y="157" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">هوائي</text><rect x="470" y="168" width="150" height="54" fill="#ffffff" stroke="#90a4ae"/><text x="545" y="192" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">انسداد مجرى الهواء /</text><text x="545" y="211" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">حنجرة</text><rect x="370" y="168" width="100" height="54" fill="#ffffff" stroke="#90a4ae"/><text x="420" y="192" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">فوراً</text><rect x="190" y="168" width="180" height="54" fill="#ffffff" stroke="#90a4ae"/><text x="280" y="192" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">بحة، صرير، عدم القدرة على</text><text x="280" y="211" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">الكلام</text><rect x="20" y="168" width="170" height="54" fill="#ffffff" stroke="#90a4ae"/><text x="105" y="192" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">أكسجين + شفط + طقم</text><text x="105" y="211" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">تراكيوستومي</text><rect x="470" y="222" width="150" height="54" fill="#f1f8ff" stroke="#90a4ae"/><text x="545" y="246" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">نقص كالسيوم (جارات</text><text x="545" y="265" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">الدرقية)</text><rect x="370" y="222" width="100" height="54" fill="#f1f8ff" stroke="#90a4ae"/><text x="420" y="246" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">24–72 ساعة</text><rect x="190" y="222" width="180" height="54" fill="#f1f8ff" stroke="#90a4ae"/><text x="280" y="246" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">تنميل حول الفم واليدين،</text><text x="280" y="265" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">Chvostek وTrousseau، تكزز</text><rect x="20" y="222" width="170" height="54" fill="#f1f8ff" stroke="#90a4ae"/><text x="105" y="246" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">Ca gluconate IV بطء +</text><text x="105" y="265" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">ECG</text><rect x="470" y="276" width="150" height="54" fill="#ffffff" stroke="#90a4ae"/><text x="545" y="300" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">عاصفة درقية</text><rect x="370" y="276" width="100" height="54" fill="#ffffff" stroke="#90a4ae"/><text x="420" y="300" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">أول 12–48</text><text x="420" y="319" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">ساعة</text><rect x="190" y="276" width="180" height="54" fill="#ffffff" stroke="#90a4ae"/><text x="280" y="300" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">حمى > 38.5، نبض سريع،</text><text x="280" y="319" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">هياج</text><rect x="20" y="276" width="170" height="54" fill="#ffffff" stroke="#90a4ae"/><text x="105" y="300" text-anchor="middle" font-size="13.5" font-weight="400" fill="#263238">طوارئ: بلّغ فوراً</text></svg>