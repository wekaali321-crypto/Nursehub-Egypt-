<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="400" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">طريقة التخلص من السم: قرار سريع</text>
<g font-size="13" text-anchor="middle">
<rect x="170" y="45" width="300" height="42" rx="10" fill="#0f172a"/><text x="320" y="71" fill="#fff" font-weight="700">ABC أولاً ثم: ما المادة؟ وكام مر من الوقت؟</text>
<rect x="20" y="115" width="280" height="80" rx="10" fill="#fee2e2"/><text x="160" y="140" font-weight="800" fill="#7f1d1d">كاوي أو هيدروكربون</text><text x="160" y="162" fill="#7f1d1d">لا قيء، لا غسيل، لا فحم</text><text x="160" y="182" fill="#7f1d1d">لبن بارد + تحويل</text>
<rect x="340" y="115" width="280" height="80" rx="10" fill="#fef9c3"/><text x="480" y="140" font-weight="800" fill="#713f12">فاقد الوعي</text><text x="480" y="162" fill="#713f12">لا غسيل/فحم قبل حماية</text><text x="480" y="182" fill="#713f12">الطريق الهوائي (أنبوبة)</text>
<rect x="20" y="225" width="280" height="90" rx="10" fill="#dcfce7"/><text x="160" y="250" font-weight="800" fill="#14532d">خلال ساعة + كمية خطيرة</text><text x="160" y="272" fill="#14532d">غسيل معدة (جنب شمال، رأس منخفض)</text><text x="160" y="292" fill="#14532d">ثم فحم نشط 1 جم/كجم</text>
<rect x="340" y="225" width="280" height="90" rx="10" fill="#dbeafe"/><text x="480" y="250" font-weight="800" fill="#1e3a8a">بعد ساعة / كمية بسيطة</text><text x="480" y="272" fill="#1e3a8a">دعم وملاحظة</text><text x="480" y="292" fill="#1e3a8a">فحم لو مناسب</text>
<rect x="20" y="335" width="600" height="46" rx="10" fill="#ede9fe"/><text x="320" y="363" fill="#4c1d95" font-weight="700">ممنوع: القيء بمياه ملح • ملاحظة 6-24 ساعة</text></g>
</svg>
