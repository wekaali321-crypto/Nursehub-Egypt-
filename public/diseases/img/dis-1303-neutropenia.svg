<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="320" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قلة العدلات: ماذا نفعل وماذا نتجنب</text>
<rect x="20" y="50" width="600" height="56" rx="10" fill="#b91c1c"/>
<text x="320.0" y="83.0" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">حرارة 38 م (100.4 ف) أو أكثر مع قلة بيضاء = طوارئ: بلّغ فورًا</text>
<rect x="20" y="120" width="290" height="180" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
<text x="165" y="146" text-anchor="middle" font-size="15" font-weight="800" fill="#166534">افعل</text>
<text x="165" y="172" text-anchor="middle" font-size="12" font-weight="500" fill="#14532d">✔ غسل أيدي دقيق (الجميع)</text>
<text x="165" y="193" text-anchor="middle" font-size="12" font-weight="500" fill="#14532d">✔ غرفة خاصة وكمامة للزوار</text>
<text x="165" y="214" text-anchor="middle" font-size="12" font-weight="500" fill="#14532d">✔ فرشاة ناعمة وعناية بالفم</text>
<text x="165" y="235" text-anchor="middle" font-size="12" font-weight="500" fill="#14532d">✔ خضار وفاكهة مغسولة أو مطبوخة</text>
<text x="165" y="256" text-anchor="middle" font-size="12" font-weight="500" fill="#14532d">✔ قياس الحرارة بالفم أو الإبط</text>
<text x="165" y="277" text-anchor="middle" font-size="12" font-weight="500" fill="#14532d">✔ راقب العلامات الحيوية بانتظام</text>
<rect x="330" y="120" width="290" height="180" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="475" y="146" text-anchor="middle" font-size="15" font-weight="800" fill="#991b1b">تجنّب</text>
<text x="475" y="172" text-anchor="middle" font-size="12" font-weight="500" fill="#7f1d1d">✖ الزهور والنباتات بالغرفة</text>
<text x="475" y="193" text-anchor="middle" font-size="12" font-weight="500" fill="#7f1d1d">✖ الزحام والزوار المرضى</text>
<text x="475" y="214" text-anchor="middle" font-size="12" font-weight="500" fill="#7f1d1d">✖ حقن شرجية أو تحاميل أو حرارة شرجية</text>
<text x="475" y="235" text-anchor="middle" font-size="12" font-weight="500" fill="#7f1d1d">✖ لقاحات حية بدون أمر</text>
<text x="475" y="256" text-anchor="middle" font-size="12" font-weight="500" fill="#7f1d1d">✖ لمس القسطرة بدون تعقيم</text>
<text x="475" y="277" text-anchor="middle" font-size="12" font-weight="500" fill="#7f1d1d">✖ تأخير أول جرعة مضاد حيوي</text>
</svg>
