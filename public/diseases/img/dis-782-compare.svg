<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 266" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="266" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">الفوسفات: النقص مقابل الزيادة</text><rect x="12" y="44" width="616" height="30" rx="8" fill="#0f172a"/><text x="573.6470588235294" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">البند</text><text x="392.4705882352941" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">نقص (&lt; 2.5 مجم/دل)</text><text x="138.8235294117647" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">زيادة (&gt; 4.5–4.6 مجم/دل)</text><rect x="12" y="74" width="616" height="44" fill="#fff"/><text x="573.6470588235294" y="92" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">الأسباب</text><text x="392.4705882352941" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">كحول، COPD، تغذية (Refeeding)، DKA،</text><text x="392.4705882352941" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">مدرّات، ستيرويد</text><text x="138.8235294117647" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">قصور كلوي، مسهلات/حقن بالفوسفات،</text><text x="138.8235294117647" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">فيتامين D زائد، جار درقية</text><rect x="12" y="118" width="616" height="44" fill="#f1f5f9"/><text x="573.6470588235294" y="136" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">الأعراض</text><text x="392.4705882352941" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">ضعف عضلي، انحلال ربداء، فقر دم</text><text x="392.4705882352941" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">انحلالي، اعتلال دماغي، فشل تنفسي</text><text x="138.8235294117647" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">غالباً بلا أعراض؛ أعراض نقص الكالسيوم</text><text x="138.8235294117647" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">المصاحبة</text><rect x="12" y="162" width="616" height="44" fill="#fff"/><text x="573.6470588235294" y="180" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">العلاج</text><text x="392.4705882352941" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">فوسفات بالفم أو وريدي</text><text x="138.8235294117647" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">رابطات (Calcium acetate, Aluminum</text><text x="138.8235294117647" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">hydroxide, Lanthanum) + غسيل</text><rect x="12" y="206" width="616" height="44" fill="#f1f5f9"/><text x="573.6470588235294" y="224" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">غذاء</text><text x="392.4705882352941" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">غني بالفوسفور (ألبان، ديك رومي، فواكه</text><text x="392.4705882352941" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">مجففة)</text><text x="138.8235294117647" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">قليل الفوسفور</text></svg>