<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="330" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مثبطات الأنهيدراز الكربوني (CAI)</text><rect x="330" y="45" width="295" height="110" rx="10" fill="#dbeafe"/><text x="477.5" y="87" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">الآلية</text><text x="477.5" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">تثبّط إنزيم CAH</text><text x="477.5" y="123" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">تطرح Na و K و HCO3 والماء</text><rect x="15" y="45" width="305" height="110" rx="10" fill="#dcfce7"/><text x="167.5" y="87" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">الاستعمال</text><text x="167.5" y="105" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">ضغط الدم، وذمة، جلوكوما</text><text x="167.5" y="123" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">صرع، أمراض كلى</text><rect x="15" y="175" width="305" height="60" rx="10" fill="#fee2e2"/><text x="167.5" y="210" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">ممنوع: حساسية السلفا (sulfonamide)</text><rect x="330" y="175" width="295" height="60" rx="10" fill="#fef9c3"/><text x="477.5" y="210" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">خذه صباحًا مع الأكل أو الحليب عند اضطراب المعدة</text><rect x="15" y="255" width="610" height="60" rx="10" fill="#ede9fe"/><text x="320" y="281" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">acetazolamide (Diamox): 250–1000 ملجم/يوم | methazolamide (Neptazane): 50–100 ملجم 2–3×</text><text x="320" y="299" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">راقب بوتاسيوم الدم والوزن اليومي والوارد/المنصرف</text></svg>