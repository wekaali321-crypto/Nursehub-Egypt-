ر قابلة للتصنيف</text><rect x="528" y="440" width="92" height="100" rx="8" fill="#fff" stroke="#cbd5e1"/><rect x="532" y="444" width="84" height="6" fill="#e9c9a0"/><rect x="532" y="450" width="84" height="18" fill="#f9b4b4"/><rect x="532" y="468" width="84" height="22" fill="#fde68a"/><rect x="532" y="490" width="84" height="28" fill="#dc7a7a"/><rect x="532" y="518" width="84" height="18" fill="#e5e7eb"/><polygon points="556.0,444 592.0,444 586.0,484 562.0,484" fill="#78716c"/><rect x="558.0" y="444" width="32" height="12" fill="#1c1917"/><rect x="560.0" y="456" width="28" height="26" fill="#ca8a04"/><text x="520" y="458" text-anchor="end" font-size="14" font-weight="600" fill="#1e293b">قشرة أو سلخ يخفي</text><text x="520" y="478" text-anchor="end" font-size="14" font-weight="600" fill="#1e293b">القاع فلا يُعرف العمق</text><line x1="338" y1="504" x2="520" y2="504" stroke="#e2e8f0"/><text x="520" y="524" text-anchor="end" font-size="14" font-weight="800" fill="#57534e">كعب جاف ثابت: لا تنضّر</text><text x="520" y="544" text-anchor="end" font-size="14" font-weight="800" fill="#57534e">غيره: تنضير بأمر الطبيب</text><rect x="8" y="400" width="304" height="164" rx="12" fill="#fff" stroke="#6b21a8" stroke-width="2"/><rect x="8" y="400" width="304" height="30" rx="12" fill="#6b21a8"/><rect x="8" y="418" width="304" height="12" fill="#6b21a8"/><text x="160" y="421" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">إصابة أنسجة عميقة</text><rect x="208" y="440" width="92" height="100" rx="8" fill="#fff" stroke="#cbd5e1"/><rect x="212" y="444" width="84" height="6" fill="#e9c9a0"/><rect x="212" y="450" width="84" height="18" fill="#f9b4b4"/><rect x="212" y="468" width="84" height="22" fill="#fde68a"/><rect x="212" y="490" width="84" height="28" fill="#dc7a7a"/><rect x="212" y="518" width="84" height="18" fill="#e5e7eb"/><ellipse cx="254.0" cy="478" rx="24" ry="14" fill="#6b21a8" opacity=".85"/><text x="200" y="458" text-anchor="end" font-size="14" font-weight=