<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 227" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="227" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الانتباذ البطاني الرحمي (Endometriosis)</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="158.2" rx="10" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#ec4899"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">التعريف</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• نمو نسيج بطانة الرحم</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">خارج الرحم</text><text x="612" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• يصيب قناتي فالوب</text><text x="612" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">والمبيضين وأربطة الرحم</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="158.2" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#f59e0b"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">عوامل الخطر</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• تاريخ عائلي</text><text x="408.66666666666663" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• حيض مبكر</text><text x="408.66666666666663" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• لم تحمل من قبل</text><rect x="20" y="54" width="193.33333333333334" height="158.2" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الأعراض والعلاج</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• ألم حوضي، ألم أثناء</text><text x="205.33333333333334" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">الجماع، عقم، اضطراب</text><text x="205.33333333333334" y="135.4" text-anchor="start" font-size="13" fill="#0f172a">الطمث، ألم طمث</text><text x="205.33333333333334" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">• مسكنات + حبوب هرمونية</text><text x="205.33333333333334" y="176.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">(استروجين/بروجسترون) +</text><text x="205.33333333333334" y="195" text-anchor="start" font-size="13" fill="#0f172a">جراحة (استئصال رحم)</text></svg>
