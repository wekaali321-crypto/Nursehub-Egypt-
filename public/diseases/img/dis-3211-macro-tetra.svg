ight="30.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="143.5" y="124.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تثبّط تصنيع البروتين البكتيري</text><rect x="514.1" y="135.5" width="105.9" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="567.1" y="162.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">الخطر الأبرز</text><rect x="267.1" y="135.5" width="247.1" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="390.6" y="162.8" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">إطالة QT وسمّية الكبد (ALT/AST)</text><rect x="20.0" y="135.5" width="247.1" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="143.5" y="154.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أسنان ملوّنة وغير آمنة بالحمل؛</text><text x="143.5" y="171.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">حساسية للشمس</text><rect x="514.1" y="182.5" width="105.9" height="63.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="567.1" y="218.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">التعليمات</text><rect x="267.1" y="182.5" width="247.1" height="63.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="390.6" y="209.8" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">مراقبة ECG؛ حذر مع</text><text x="390.6" y="226.3" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">acetaminophen للحمى</text><rect x="20.0" y="182.5" width="247.1" height="63.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="143.5" y="201.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">على معدة فارغة، اجلس 30 دقيقة،</text><text x="143.5" y="218.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تجنّب الألبان ومضادات الحموضة</text><text x="143.5" y="234.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">والحديد</text><rect x="514.1" y="246" width="105.9" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="567.1" y="273.3" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">آثار متوقعة</text><rect x="267.1" y="246" width="247.1" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="390.6" y="265.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">غثيان وقيء وحرارة وانخفاض WBC</text><text x="390.6" y="281.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">مع تحسن العدوى</text><rect x="20.0" y="246" width="247.1" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="143.5" y="265.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">استعمل واقي شمس؛ يُستعمل لحب</text><text x="143.5" y="281.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الشباب</text></svg>