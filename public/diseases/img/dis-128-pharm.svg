<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 452" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="452" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أدوية فشل القلب والتمريض</text>
<rect x="14" y="44" width="300" height="310" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><rect x="14" y="44" width="300" height="26" rx="10" fill="#2563eb"/><text x="164.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >ABCDD</text><text x="304" y="89" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >A: ACE/ARB خفض الضغط (ليزينوبريل، لوزارتان)</text><text x="304" y="107" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >B: حاصر بيتا خفض النبض (أتينولول)</text><text x="304" y="125" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >C: حاصر كالسيوم خفض النبض والضغط</text><text x="304" y="143" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >D: ديجوكسين خفض النبض</text><text x="304" y="161" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >D: موسع أوعية: نيتروجليسرين</text><text x="304" y="179" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >D: مدرّات: تُفقد أو تُبقي البوتاسيوم</text><text x="304" y="197" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >ميلرينون: داعم انقباض للمراحل المتأخرة</text><rect x="326" y="44" width="300" height="310" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><rect x="326" y="44" width="300" height="26" rx="10" fill="#16a34a"/><text x="476.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >DRBEDSS</text><text x="616" y="89" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >D: صوديوم منخفض وسوائل 2 لتر</text><text x="616" y="107" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >R: خطر سقوط</text><text x="616" y="125" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >B: ضغط وBNP لا يرتفعان</text><text x="616" y="143" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >E: ارفع الساقين</text><text x="616" y="161" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >D: وزن يومي: 3 رطل/يوم أو 5/أسبوع = تدهور</text><text x="616" y="179" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >S: جنس سلمان بلا ضيق</text><text x="616" y="197" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >S: جوارب ضاغطة (TED)</text><rect x="14" y="366" width="612" height="70" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="320" y="392" text-anchor="middle" font-size="12.5" font-weight="800" fill="#7f1d1d" >لا أدوية بلا وصفة (سعال/برد/مضاد حموضة/NSAIDs) ولا أغذية معلبة أو مصنعة</text><text x="320" y="416" text-anchor="middle" font-size="12.5" font-weight="800" fill="#7f1d1d" >لا تدلّك سمانة مريض الفشل أبداً (خطر تحريك جلطة)</text>
</svg>
