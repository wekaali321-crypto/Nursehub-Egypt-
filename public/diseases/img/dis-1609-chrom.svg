<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 336" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="336" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الاضطرابات الكروموسومية والمصطلحات</text>
<rect x="14" y="44" width="200" height="210" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><rect x="14" y="44" width="200" height="26" rx="10" fill="#2563eb"/><text x="114.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >كلاينفلتر XXY</text><text x="204" y="89" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >ذكر بكروموسوم X زائد</text><text x="204" y="107.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >عقم</text><text x="204" y="126.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >خصيتان صغيرتان، تستوستيرون منخفض</text><text x="204" y="144.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >تثدي، بلوغ ناقص</text><rect x="224" y="44" width="200" height="210" rx="10" fill="#fff" stroke="#db2777" stroke-width="1.5"/><rect x="224" y="44" width="200" height="26" rx="10" fill="#db2777"/><text x="324.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >تيرنر (Monosomy X)</text><text x="414" y="89" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >أنثى بـX واحد فقط</text><text x="414" y="107.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >عقم، غياب البلوغ</text><text x="414" y="126.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >قصر القامة</text><text x="414" y="144.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >عنق مجنح (عريض)</text><rect x="434" y="44" width="192" height="210" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><rect x="434" y="44" width="192" height="26" rx="10" fill="#16a34a"/><text x="530.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >داون (Trisomy 21)</text><text x="616" y="89" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >نفخة قلب انقباضية</text><text x="616" y="107.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >50% عيوب قلب</text><text x="616" y="126.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >جسر أنف مسطح</text><text x="616" y="144.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >قصر القامة</text><rect x="14" y="266" width="612" height="56" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="290" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a" >Genotype: التركيب الجيني | Phenotype: الشكل الظاهر (جين + بيئة)</text><text x="320" y="312" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >Allele: شكل بديل للجين | Locus: موقعه | Carrier: حامل للأليل المتنحي</text>
</svg>
