<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 358" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="358" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب الزائدة</text>
<rect x="346.0" y="52" width="320.0" height="134.25" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="346.0" y="52" width="320.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="506.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأعراض</text>
<text x="656.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• التهاب الزائدة في الربع السفلي الأيمن (RLQ)</text>
<text x="656.0" y="115.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• حمى خفيفة</text>
<text x="656.0" y="134.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ألم يبدأ حول السرة ثم ينتقل للربع السفلي</text>
<text x="656.0" y="151.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الأيمن، مع ألم ارتدادي (Rebound tenderness)</text>
<text x="656.0" y="171.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا حرارة ولا ملينات ولا حقنة شرجية</text>
<rect x="14.0" y="52" width="320.0" height="134.25" rx="10" fill="#7f1d1d" fill-opacity="0.1" stroke="#7f1d1d" stroke-width="1.2"/>
<rect x="14.0" y="52" width="320.0" height="26" rx="10" fill="#7f1d1d" fill-opacity="1" stroke="#7f1d1d" stroke-width="1.2"/>
<text x="174.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">انثقاب = التهاب بريتوان (طارئ)</text>
<text x="324.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• حمى عالية وتسرع قلب وتنفس</text>
<text x="324.0" y="115.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• بطن صلب كاللوح (Board-like)</text>
<text x="324.0" y="134.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ألم ارتدادي</text>
<rect x="346.0" y="198.25" width="320.0" height="132.25" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="346.0" y="198.25" width="320.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="506.0" y="216.25" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">التدخل</text>
<text x="656.0" y="242.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• صيام NPO</text>
<text x="656.0" y="261.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• سوائل وريدية: ملحي 0.9% أو رينجر لاكتات</text>
<text x="656.0" y="280.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• مسكنات وريدية (مورفين/هيدرومورفون) بأمر</text>
<text x="656.0" y="298.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الطبيب؛ يقول المرجع لا مسكن قبل فحص الجراح</text>
<rect x="14.0" y="198.25" width="320.0" height="132.25" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="14.0" y="198.25" width="320.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="174.0" y="216.25" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">بعد الاستئصال</text>
<text x="324.0" y="242.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا رفع أشياء ثقيلة</text>
<text x="324.0" y="261.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ثقف الوقاية من الالتهاب الرئوي: مشي مبكر،</text>
<text x="324.0" y="278.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">تنفس عميق وسعال، مقياس التنفس</text>
<text x="324.0" y="298.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• الوقاية من العدوى: لا حمامات (دش فقط)، أبلغ</text>
<text x="324.0" y="315.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">عن احمرار وتورم وإفراز بالجرح</text>
</svg>
