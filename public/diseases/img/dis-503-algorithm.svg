<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="430" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">خطوات التعامل مع المسموم</text>
<g font-size="13" font-weight="700" text-anchor="middle" fill="#fff">
<rect x="170" y="44" width="300" height="38" rx="10" fill="#dc2626"/><text x="320" y="68">1) ABC: مجرى هواء، تنفس (أكسجين)، نبض/CPR، كانيولتين</text>
<rect x="170" y="98" width="300" height="38" rx="10" fill="#ea580c"/><text x="320" y="122">2) تاريخ سريع: ما هو السم؟ ومتى؟</text>
<rect x="170" y="152" width="300" height="38" rx="10" fill="#ca8a04"/><text x="320" y="176">3) فحص: علامات حيوية + GCS (RBG / ABG / ECG)</text>
<rect x="170" y="206" width="300" height="38" rx="10" fill="#16a34a"/><text x="320" y="230">4) علاج داعم: ضغط، تشنجات، حرارة، قسطرة</text>
</g>
<rect x="40" y="266" width="560" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7"/>
<g font-size="12" fill="#0c4a6e" text-anchor="middle" font-weight="700">
<text x="320" y="288" font-size="14">5) التخلص من السم (خلال ساعة، بعد حماية المجرى)</text>
<text x="165" y="316">غسيل معدة: ممنوع في الكاوي (إلا الفينيك)</text><text x="165" y="336">والهيدروكربونات وفاقد الوعي بدون أنبوبة</text>
<text x="470" y="316">فحم نشط 1 جم/كجم: ممنوع في فاقد الوعي</text><text x="470" y="336">والكاويات — قيء بالملح ممنوع</text>
</g>
<g fill="#475569" font-size="13" text-anchor="middle" font-weight="700"><text x="320" y="402">6) مراقبة 6–24 ساعة وتحويل للعناية عند اللزوم</text></g>
</svg>
