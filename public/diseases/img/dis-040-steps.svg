<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="380" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">سلّم علاج الربو المزمن عند البالغين (5 خطوات)</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="20" y="300" width="112" height="50" rx="8" fill="#bbf7d0"/><text x="76" y="322" fill="#14532d">خطوة 1</text><text x="76" y="341" font-size="11" fill="#14532d">موسع قصير عند اللزوم</text>
    <rect x="132" y="250" width="112" height="100" rx="8" fill="#fef08a"/><text x="188" y="272" fill="#713f12">خطوة 2</text><text x="188" y="293" font-size="11" fill="#713f12">+ كورتيزون استنشاق</text><text x="188" y="310" font-size="11" fill="#713f12">(ICS) منتظم</text>
    <rect x="244" y="200" width="112" height="150" rx="8" fill="#fed7aa"/><text x="300" y="222" fill="#7c2d12">خطوة 3</text><text x="300" y="243" font-size="11" fill="#7c2d12">+ LABA أو مضاعفة ICS</text><text x="300" y="260" font-size="11" fill="#7c2d12">أو ثيوفيلين / مضاد</text><text x="300" y="277" font-size="11" fill="#7c2d12">ليكوتريين</text>
    <rect x="356" y="150" width="112" height="200" rx="8" fill="#fdba74"/><text x="412" y="172" fill="#7c2d12">خطوة 4</text><text x="412" y="193" font-size="11" fill="#7c2d12">ICS جرعة أعلى +</text><text x="412" y="210" font-size="11" fill="#7c2d12">LABA + نوع ثالث</text>
    <rect x="468" y="100" width="112" height="250" rx="8" fill="#f87171"/><text x="524" y="122" fill="#fff">خطوة 5</text><text x="524" y="143" font-size="11" fill="#fff">+ أقراص كورتيزون</text><text x="524" y="160" font-size="11" fill="#fff">بجرعة قليلة</text><text x="524" y="185" font-size="11" fill="#fff">تحويل لأخصائي صدر</text>
  </g>
  <text x="76" y="290" text-anchor="middle" font-size="11" fill="#475569">ابدأ من هنا</text>
  <text x="320" y="62" text-anchor="middle" font-size="13" fill="#166534">↑ Step up: لو الأعراض مستمرة ويستخدم الموسع كتير</text>
  <text x="320" y="82" text-anchor="middle" font-size="13" fill="#9a3412">↓ Step down: لو السيطرة مستمرة 3 شهور</text>
  <text x="320" y="372" text-anchor="middle" font-size="11" fill="#64748b">من الخطوة 4 فأعلى يفضّل التحويل لأخصائي صدر (حسب إرشادات GINA الحديثة الموسّع وحده لا يُترك)</text>
</svg>
