<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="300" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >مراحل مرض الشرايين الطرفية</text><rect x="20" y="50" width="144" height="150" rx="10" fill="#22c55e"/><text x="92" y="80" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >1</text><text x="92" y="108" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >بدون أعراض</text><text x="92" y="134" text-anchor="middle" font-size="11" font-weight="400" fill="#fff" >أو برودة خفيفة</text><rect x="172" y="50" width="144" height="150" rx="10" fill="#eab308"/><text x="244" y="80" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >2</text><text x="244" y="108" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >عرج متقطع</text><text x="244" y="134" text-anchor="middle" font-size="11" font-weight="400" fill="#fff" >ألم عند المشي ويخف بالراحة</text><rect x="324" y="50" width="144" height="150" rx="10" fill="#f97316"/><text x="396" y="80" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >3</text><text x="396" y="108" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >ألم بالراحة</text><text x="396" y="134" text-anchor="middle" font-size="11" font-weight="400" fill="#fff" >خصوصاً بالليل</text><rect x="476" y="50" width="144" height="150" rx="10" fill="#dc2626"/><text x="548" y="80" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >4</text><text x="548" y="108" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >قرحة / غرغرينا</text><text x="548" y="134" text-anchor="middle" font-size="11" font-weight="400" fill="#fff" >فقدان نسيج</text><text x="320" y="235" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" >ABI = ضغط الكاحل ÷ ضغط الذراع</text><text x="320" y="260" text-anchor="middle" font-size="12" font-weight="500" fill="#475569" >أقل من 0.9 = مرض شرايين | أقل من 0.4 = تروية حرجة (تقدير)</text><text x="320" y="283" text-anchor="middle" font-size="11" font-weight="400" fill="#94a3b8" >مبسط من تصنيف Fontaine</text></svg>