<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع العضلات والبنية المجهرية</text>
<rect x="426" y="44" width="194" height="190" rx="10" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><rect x="426" y="44" width="194" height="28" rx="10" fill="#0ea5e9" stroke="none" stroke-width="1.5"/><text x="523" y="63" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">ملساء Smooth</text><ellipse cx="523" cy="100" rx="60" ry="16" fill="#e8a089" stroke="#a85a48" stroke-width="1.5"/><ellipse cx="523" cy="100" rx="10" ry="6" fill="#c36b5a" stroke="none" stroke-width="1.5"/><text x="523" y="140" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">لا إرادية (عصبي ذاتي)</text><text x="523" y="160" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">أعضاء مجوفة: معدة، أمعاء، رحم</text><text x="523" y="180" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">تدفع السوائل بالتمعّج</text><rect x="223" y="44" width="194" height="190" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/><rect x="223" y="44" width="194" height="28" rx="10" fill="#22c55e" stroke="none" stroke-width="1.5"/><text x="320" y="63" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">قلبية Cardiac</text><path d="M263,100 L298,90 L318,112 L348,92 L378,104" fill="none" stroke="#c2410c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" /><text x="320" y="140" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">لا إرادية (عصبي ذاتي)</text><text x="320" y="160" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">موجودة في القلب</text><text x="320" y="180" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">تحكم ذاتي، تفرعات ونواة واحدة</text><rect x="20" y="44" width="194" height="190" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/><rect x="20" y="44" width="194" height="28" rx="10" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="117" y="63" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">هيكلية Skeletal</text><rect x="50" y="88" width="14" height="30" rx="6" fill="#e8745a" stroke="#a8402a" stroke-width="1.5"/><rect x="68" y="88" width="14" height="30" rx="6" fill="#e8745a" stroke="#a8402a" stroke-width="1.5"/><rect x="86" y="88" width="14" height="30" rx="6" fill="#e8745a" stroke="#a8402a" stroke-width="1.5"/><rect x="104" y="88" width="14" height="30" rx="6" fill="#e8745a" stroke="#a8402a" stroke-width="1.5"/><rect x="122" y="88" width="14" height="30" rx="6" fill="#e8745a" stroke="#a8402a" stroke-width="1.5"/><rect x="140" y="88" width="14" height="30" rx="6" fill="#e8745a" stroke="#a8402a" stroke-width="1.5"/><rect x="158" y="88" width="14" height="30" rx="6" fill="#e8745a" stroke="#a8402a" stroke-width="1.5"/><text x="117" y="140" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">إرادية</text><text x="117" y="160" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">وضعية، توليد حرارة، حركة</text><text x="117" y="180" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">تدعم العظام والمفاصل</text><rect x="20" y="250" width="600" height="330" rx="12" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="320" y="274" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">البنية المجهرية للعضلة الهيكلية</text><rect x="150" y="300" width="230" height="70" rx="30" fill="#e8745a" stroke="#a8402a" stroke-width="1.5"/><ellipse cx="180" cy="335" rx="12" ry="22" fill="#f3a88f" stroke="#a8402a" stroke-width="1.5"/><ellipse cx="210" cy="335" rx="12" ry="22" fill="#f3a88f" stroke="#a8402a" stroke-width="1.5"/><ellipse cx="240" cy="335" rx="12" ry="22" fill="#f3a88f" stroke="#a8402a" stroke-width="1.5"/><ellipse cx="270" cy="335" rx="12" ry="22" fill="#f3a88f" stroke="#a8402a" stroke-width="1.5"/><ellipse cx="300" cy="335" rx="12" ry="22" fill="#f3a88f" stroke="#a8402a" stroke-width="1.5"/><ellipse cx="330" cy="335" rx="12" ry="22" fill="#f3a88f" stroke="#a8402a" stroke-width="1.5"/><ellipse cx="360" cy="335" rx="12" ry="22" fill="#f3a88f" stroke="#a8402a" stroke-width="1.5"/><rect x="380" y="320" width="60" height="30" rx="4" fill="#e8e8e8" stroke="#999" stroke-width="1.5"/><rect x="440" y="322" width="80" height="26" rx="4" fill="#d9c99a" stroke="#a8956a" stroke-width="1.5"/><line x1="500" y1="335" x2="594" y2="296" stroke="#64748b" stroke-width="1"/><text x="590" y="300" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">عظم (Bone)</text><line x1="410" y1="335" x2="594" y2="386" stroke="#64748b" stroke-width="1"/><text x="590" y="390" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">وتر (Tendon)</text><line x1="250" y1="300" x2="304" y2="288" stroke="#64748b" stroke-width="1"/><text x="300" y="292" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">غلاف الحزمة Perimysium</text><line x1="290" y1="372" x2="334" y2="396" stroke="#64748b" stroke-width="1"/><text x="330" y="400" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">حزمة Fascicle</text><line x1="190" y1="335" x2="154" y2="316" stroke="#64748b" stroke-width="1"/><text x="150" y="320" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">غلاف الليف Endomysium</text><line x1="350" y1="312" x2="156" y2="281" stroke="#64748b" stroke-width="1"/><text x="160" y="285" text-anchor="end" font-size="12" font-weight="600" fill="#0f172a">الغلاف الخارجي Epimysium</text><line x1="210" y1="345" x2="64" y2="366" stroke="#64748b" stroke-width="1"/><text x="60" y="370" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">ليف Myofibril</text><rect x="30" y="420" width="285" height="150" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="300" y="442" text-anchor="start" font-size="11" font-weight="500" fill="#0f172a">ترتيب الألياف:</text><text x="300" y="462" text-anchor="start" font-size="11" font-weight="500" fill="#0f172a">Endomysium: يغلف الليف العضلي</text><text x="300" y="482" text-anchor="start" font-size="11" font-weight="500" fill="#0f172a">Perimysium: يغلف حزمة الألياف</text><text x="300" y="502" text-anchor="start" font-size="11" font-weight="500" fill="#0f172a">Epimysium: الغلاف فوق الحزم ويتصل بالأوتار</text><rect x="325" y="420" width="285" height="150" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="600" y="442" text-anchor="start" font-size="11" font-weight="500" fill="#0f172a">ترتيب الخيوط:</text><text x="600" y="462" text-anchor="start" font-size="11" font-weight="500" fill="#0f172a">Sarcomere: ميوسين سميك وأكتين رقيق</text><text x="600" y="482" text-anchor="start" font-size="11" font-weight="500" fill="#0f172a">I-band: أكتين فقط</text><text x="600" y="502" text-anchor="start" font-size="11" font-weight="500" fill="#0f172a">A-band: ميوسين غامق</text><text x="600" y="522" text-anchor="start" font-size="11" font-weight="500" fill="#0f172a">H-zone: مركز A-band</text><text x="600" y="542" text-anchor="start" font-size="11" font-weight="500" fill="#0f172a">Z-disc: حدود الساركوميير</text>
</svg>
