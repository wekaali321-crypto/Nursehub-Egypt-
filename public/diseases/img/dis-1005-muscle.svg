<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 172" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="172" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع العضلات الثلاثة</text>
<rect x="428" y="48" width="192" height="108" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><rect x="428" y="48" width="192" height="28" rx="12" fill="#0ea5e9"/><rect x="428" y="64" width="192" height="12" fill="#0ea5e9"/><text x="524.0" y="67" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">ملساء (Smooth)</text><text x="524.0" y="98" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">لا إرادية، جهاز عصبي ذاتي</text><text x="524.0" y="116" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">الأعضاء المجوفة والأوعية</text><text x="524.0" y="134" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">تدفع السوائل بالتمعّج</text><rect x="224" y="48" width="192" height="108" rx="12" fill="#fff" stroke="#22c55e" stroke-width="2"/><rect x="224" y="48" width="192" height="28" rx="12" fill="#22c55e"/><rect x="224" y="64" width="192" height="12" fill="#22c55e"/><text x="320.0" y="67" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">قلبية (Cardiac)</text><text x="320.0" y="98" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">لا إرادية، جهاز عصبي ذاتي</text><text x="320.0" y="116" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">في القلب فقط</text><text x="320.0" y="134" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">تحكم ذاتي، نواة واحدة</text><rect x="20" y="48" width="192" height="108" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/><rect x="20" y="48" width="192" height="28" rx="12" fill="#f59e0b"/><rect x="20" y="64" width="192" height="12" fill="#f59e0b"/><text x="116.0" y="67" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">هيكلية (Skeletal)</text><text x="116.0" y="98" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">إرادية</text><text x="116.0" y="116" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">الوضعية وتوليد الحرارة</text><text x="116.0" y="134" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">تدعم العظام والمفاصل</text>
</svg>
