<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 328" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="328" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">إيقاف إدرار اللبن وتحفيزه والعناية بالثدي</text>
<rect x="20" y="44" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="44" width="160" height="54" rx="10" fill="#0369a1"/><text x="540" y="76" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">إيقاف اللبن</text><text x="448" y="67" text-anchor="end" font-size="13" fill="#0f172a">حمالة صدر مريحة · كمادات دافئة · تفريغ كمية بسيطة</text><text x="448" y="85" text-anchor="end" font-size="13" fill="#0f172a">Cabergoline (Dostinex): قرصان مرة واحدة · Bromocriptine</text><rect x="20" y="106" width="600" height="46" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="106" width="160" height="46" rx="10" fill="#7c3aed"/><text x="540" y="134" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">احتقان وألم</text><text x="448" y="134" text-anchor="end" font-size="13" fill="#0f172a">كمادات ساقعة + مسكن</text><rect x="20" y="160" width="600" height="46" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="160" width="160" height="46" rx="10" fill="#15803d"/><text x="540" y="188" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">تحفيز اللبن</text><text x="448" y="188" text-anchor="end" font-size="13" fill="#0f172a">8-10 أكواب ماء · أغذية بالكالسيوم · Lactomax / Herbana</text><rect x="20" y="214" width="600" height="46" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="214" width="160" height="46" rx="10" fill="#d97706"/><text x="540" y="242" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">تشقق الحلمة</text><text x="448" y="242" text-anchor="end" font-size="13" fill="#0f172a">Pure-Lan أو Panthenol · Fuciderm لو التهاب</text><rect x="20" y="268" width="600" height="46" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="268" width="160" height="46" rx="10" fill="#b91c1c"/><text x="540" y="296" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التهاب الثدي</text><text x="448" y="296" text-anchor="end" font-size="13" fill="#0f172a">احمرار · ألم · سخونة → Hibiotic 1 جم كل 12 ساعة لمدة أسبوع</text>
</svg>
