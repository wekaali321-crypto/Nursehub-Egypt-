<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 456" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="456" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">اضطراب الكلام والتفكير في الفصام</text><rect x="510.14084507042253" y="48" width="109.85915492957746" height="27.95" fill="#6d28d9" stroke="#cbd5e1"/><text x="565.0704225352113" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">النوع</text><rect x="290.4225352112676" y="48" width="219.7183098591549" height="27.95" fill="#6d28d9" stroke="#cbd5e1"/><text x="400.28169014084506" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">التعريف</text><rect x="20" y="48" width="270.4225352112676" height="27.95" fill="#6d28d9" stroke="#cbd5e1"/><text x="155.2112676056338" y="64" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">مثال</text><rect x="510.14084507042253" y="75.95" width="109.85915492957746" height="59.85" fill="#f8fafc" stroke="#cbd5e1"/><text x="565.0704225352113" y="91.95" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">ارتباطات مفككة</text><text x="565.0704225352113" y="107.9" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">⁦(Loose⁩</text><text x="565.0704225352113" y="123.85" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">⁦associations)⁩</text><rect x="290.4225352112676" y="75.95" width="219.7183098591549" height="59.85" fill="#f8fafc" stroke="#cbd5e1"/><text x="400.28169014084506" y="91.95" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">انتقال سريع للأفكار بلا ربط منطقي (نقطة</text><text x="400.28169014084506" y="107.9" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">امتحان)</text><rect x="20" y="75.95" width="270.4225352112676" height="59.85" fill="#f8fafc" stroke="#cbd5e1"/><text x="155.2112676056338" y="91.95" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">«الكون كزبيبة وهي منزل وركبت دراجتي»؛ «الزجاج</text><text x="155.2112676056338" y="107.9" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">ينكسر إذا رميت حجارة… أعيش في بيت زجاجي»</text><rect x="510.14084507042253" y="135.8" width="109.85915492957746" height="43.9" fill="#fff" stroke="#cbd5e1"/><text x="565.0704225352113" y="151.8" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">ألفاظ مبتكرة</text><text x="565.0704225352113" y="167.75" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">⁦(Neologisms)⁩</text><rect x="290.4225352112676" y="135.8" width="219.7183098591549" height="43.9" fill="#fff" stroke="#cbd5e1"/><text x="400.28169014084506" y="151.8" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">اختراع كلمات خيالية</text><rect x="20" y="135.8" width="270.4225352112676" height="43.9" fill="#fff" stroke="#cbd5e1"/><text x="155.2112676056338" y="151.8" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">«يجب أن أهرب، الـ⁦vomers⁩ قادمون ليعدموني»</text><rect x="510.14084507042253" y="179.70000000000002" width="109.85915492957746" height="43.9" fill="#f8fafc" stroke="#cbd5e1"/><text x="565.0704225352113" y="195.70000000000002" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">ارتباط بالقافية</text><text x="565.0704225352113" y="211.65" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">⁦(Clang)⁩</text><rect x="290.4225352112676" y="179.70000000000002" width="219.7183098591549" height="43.9" fill="#f8fafc" stroke="#cbd5e1"/><text x="400.28169014084506" y="195.70000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">سرد كلمات متقافية بلا معنى سوى للمريض</text><rect x="20" y="179.70000000000002" width="270.4225352112676" height="43.9" fill="#f8fafc" stroke="#cbd5e1"/><text x="155.2112676056338" y="195.70000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">«سنذهب للبحر، نسمع الشعر، نمشي في الفجر، ما</text><text x="155.2112676056338" y="211.65" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">رأيك»</text><rect x="510.14084507042253" y="223.60000000000002" width="109.85915492957746" height="43.9" fill="#fff" stroke="#cbd5e1"/><text x="565.0704225352113" y="239.60000000000002" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">سلطة كلمات (⁦Word⁩</text><text x="565.0704225352113" y="255.55" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">⁦salad)⁩</text><rect x="290.4225352112676" y="223.60000000000002" width="219.7183098591549" height="43.9" fill="#fff" stroke="#cbd5e1"/><text x="400.28169014084506" y="239.60000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">خلط كلمات بلا معنى</text><rect x="20" y="223.60000000000002" width="270.4225352112676" height="43.9" fill="#fff" stroke="#cbd5e1"/><text x="155.2112676056338" y="239.60000000000002" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">«هذا هو الكرسي، القمر، البرتقال، شرب كثيراً»</text><rect x="510.14084507042253" y="267.5" width="109.85915492957746" height="43.9" fill="#f8fafc" stroke="#cbd5e1"/><text x="565.0704225352113" y="283.5" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">تفكير حرفي</text><text x="565.0704225352113" y="299.45" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">⁦(Concrete)⁩</text><rect x="290.4225352112676" y="267.5" width="219.7183098591549" height="43.9" fill="#f8fafc" stroke="#cbd5e1"/><text x="400.28169014084506" y="283.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">أخذ الجملة حرفياً</text><rect x="20" y="267.5" width="270.4225352112676" height="43.9" fill="#f8fafc" stroke="#cbd5e1"/><text x="155.2112676056338" y="283.5" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">«العشب أخضر على الجانب الآخر» ← يفكر بعشب حقيقي؛</text><text x="155.2112676056338" y="299.45" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">«بيض في سلة»</text><rect x="510.14084507042253" y="311.4" width="109.85915492957746" height="43.9" fill="#fff" stroke="#cbd5e1"/><text x="565.0704225352113" y="327.4" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">استطراد</text><text x="565.0704225352113" y="343.34999999999997" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">⁦(Tangentiality)⁩</text><rect x="290.4225352112676" y="311.4" width="219.7183098591549" height="43.9" fill="#fff" stroke="#cbd5e1"/><text x="400.28169014084506" y="327.4" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">كلام في مواضيع غير مرتبطة بالموضوع</text><rect x="20" y="311.4" width="270.4225352112676" height="43.9" fill="#fff" stroke="#cbd5e1"/><text x="155.2112676056338" y="327.4" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">«كيف كان نومك؟» ← «عندما كنت في الخامسة قُتلت</text><text x="155.2112676056338" y="343.34999999999997" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">قطتي، أحب الكلاب»</text><rect x="510.14084507042253" y="355.29999999999995" width="109.85915492957746" height="43.9" fill="#f8fafc" stroke="#cbd5e1"/><text x="565.0704225352113" y="371.29999999999995" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">صدى الكلام</text><text x="565.0704225352113" y="387.24999999999994" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">⁦(Echolalia)⁩</text><rect x="290.4225352112676" y="355.29999999999995" width="219.7183098591549" height="43.9" fill="#f8fafc" stroke="#cbd5e1"/><text x="400.28169014084506" y="371.29999999999995" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">ترديد كلمات يسمعها (نقطة امتحان)</text><rect x="20" y="355.29999999999995" width="270.4225352112676" height="43.9" fill="#f8fafc" stroke="#cbd5e1"/><text x="155.2112676056338" y="371.29999999999995" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">الممرض: «سنأخذ علاماتك الحيوية» ← يكرر العبارة</text><rect x="510.14084507042253" y="399.19999999999993" width="109.85915492957746" height="43.9" fill="#fff" stroke="#cbd5e1"/><text x="565.0704225352113" y="415.19999999999993" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">إصرار</text><text x="565.0704225352113" y="431.1499999999999" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">⁦(Perseveration)⁩</text><rect x="290.4225352112676" y="399.19999999999993" width="219.7183098591549" height="43.9" fill="#fff" stroke="#cbd5e1"/><text x="400.28169014084506" y="415.19999999999993" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">تكرار نفس الكلمات عند أسئلة مختلفة</text><rect x="20" y="399.19999999999993" width="270.4225352112676" height="43.9" fill="#fff" stroke="#cbd5e1"/><text x="155.2112676056338" y="415.19999999999993" text-anchor="middle" font-size="11" font-weight="400" fill="#0f172a">«كيف تشعر؟» و«ما تاريخ اليوم؟» ← «رائع تماماً»</text></svg>