<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 339" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="339" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الالتهاب الرئوي ومضاعفاته الثلاث</text><rect x="477.5" y="54" width="142.5" height="270.59999999999997" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="477.5" y="54" width="142.5" height="29" rx="10" fill="#f59e0b"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">العلامات</text><text x="612" y="99" text-anchor="start" font-size="12" fill="#0f172a">• تغير الحالة</text><text x="612" y="115.8" text-anchor="start" font-size="12" fill="#0f172a">العقلية: قلق،</text><text x="612" y="132.6" text-anchor="start" font-size="12" fill="#0f172a">تهيّج، تشوش</text><text x="612" y="154.4" text-anchor="start" font-size="12" fill="#0f172a">• حمى أكثر من 38°م</text><text x="612" y="176.2" text-anchor="start" font-size="12" fill="#0f172a">• بلغم أصفر</text><text x="612" y="198" text-anchor="start" font-size="12" fill="#0f172a">• خراخر دقيقة أو</text><text x="612" y="214.8" text-anchor="start" font-size="12" fill="#0f172a">خشنة</text><text x="612" y="236.6" text-anchor="start" font-size="12" fill="#0f172a">• ضيق نفس</text><text x="612" y="258.4" text-anchor="start" font-size="12" fill="#0f172a">• ألم جنبي حاد مع</text><text x="612" y="275.2" text-anchor="start" font-size="12" fill="#0f172a">الشهيق/السعال</text><text x="612" y="292" text-anchor="start" font-size="12" fill="#0f172a">(احتكاك جنبي:</text><text x="612" y="308.79999999999995" text-anchor="start" font-size="12" fill="#0f172a">أبلغ)</text><rect x="325" y="54" width="142.5" height="270.59999999999997" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="325" y="54" width="142.5" height="48" rx="10" fill="#0ea5e9"/><text x="459.5" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">1) الانصباب</text><text x="459.5" y="91" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الجنبي</text><text x="459.5" y="118" text-anchor="start" font-size="12" fill="#0f172a">• سائل بالحيز</text><text x="459.5" y="134.8" text-anchor="start" font-size="12" fill="#0f172a">الجنبي يمنع التمدد</text><text x="459.5" y="156.6" text-anchor="start" font-size="12" fill="#0f172a">• ألم عند الشهيق،</text><text x="459.5" y="173.39999999999998" text-anchor="start" font-size="12" fill="#0f172a">ضيق نفس، نقص</text><text x="459.5" y="190.2" text-anchor="start" font-size="12" fill="#0f172a">الأصوات، كتامة</text><text x="459.5" y="212" text-anchor="start" font-size="12" fill="#0f172a">• أبلغ: حركة صدر</text><text x="459.5" y="228.8" text-anchor="start" font-size="12" fill="#0f172a">غير متماثلة ونقص</text><text x="459.5" y="245.6" text-anchor="start" font-size="12" fill="#0f172a">الأصوات</text><rect x="172.5" y="54" width="142.5" height="270.59999999999997" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="172.5" y="54" width="142.5" height="29" rx="10" fill="#ef4444"/><text x="307" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">2) ARDS</text><text x="307" y="99" text-anchor="start" font-size="12" fill="#0f172a">• رئتان متيبستان</text><text x="307" y="120.8" text-anchor="start" font-size="12" fill="#0f172a">• نقص أكسجة عنيد</text><text x="307" y="137.6" text-anchor="start" font-size="12" fill="#0f172a">(PaO₂ منخفض)</text><text x="307" y="159.39999999999998" text-anchor="start" font-size="12" fill="#0f172a">• أول علامة: تغير</text><text x="307" y="176.2" text-anchor="start" font-size="12" fill="#0f172a">الحالة العقلية</text><rect x="20" y="54" width="142.5" height="270.59999999999997" rx="10" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="1.5"/><rect x="20" y="54" width="142.5" height="29" rx="10" fill="#ec4899"/><text x="154.5" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">3) صدمة إنتانية</text><text x="154.5" y="99" text-anchor="start" font-size="12" fill="#0f172a">• ضغط انقباضي أقل من 90</text><text x="154.5" y="115.8" text-anchor="start" font-size="12" fill="#0f172a">وMAP أقل من 65</text><text x="154.5" y="137.6" text-anchor="start" font-size="12" fill="#0f172a">• تعبئة شعرية أكثر من </text><text x="154.5" y="154.39999999999998" text-anchor="start" font-size="12" fill="#0f172a">3–4 ث، تسارع قلب</text><text x="154.5" y="176.2" text-anchor="start" font-size="12" fill="#0f172a">• حمى مبكرة</text><text x="154.5" y="193" text-anchor="start" font-size="12" fill="#0f172a">وانخفاض حرارة</text><text x="154.5" y="209.79999999999998" text-anchor="start" font-size="12" fill="#0f172a">متأخر (أقل من 36°م)</text><text x="154.5" y="231.6" text-anchor="start" font-size="12" fill="#0f172a">• WBC مرتفع</text><text x="154.5" y="248.39999999999998" text-anchor="start" font-size="12" fill="#0f172a">(أكثر من 10,000)</text><text x="154.5" y="270.2" text-anchor="start" font-size="12" fill="#0f172a">• بول حتى 30 مل/س =</text><text x="154.5" y="287" text-anchor="start" font-size="12" fill="#0f172a">ضائقة كلوية</text></svg>
