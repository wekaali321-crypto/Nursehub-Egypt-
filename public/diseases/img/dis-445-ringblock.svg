<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="390" rx="14" fill="#f7fafc" stroke="#cbd5e0"/>
<text x="320" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1a365d">حقن تخدير الإصبع (Ring / Digital block)</text>
<g transform="translate(40,50)"><text x="130" y="14" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5282">أي إصبع: حقنتين</text>
<rect x="100" y="30" width="60" height="150" rx="28" fill="#fbd5b5" stroke="#c05621" stroke-width="2"/>
<rect x="60" y="180" width="140" height="60" rx="10" fill="#fbd5b5" stroke="#c05621" stroke-width="2"/>
<circle cx="98" cy="190" r="7" fill="#c53030"/><circle cx="162" cy="190" r="7" fill="#c53030"/>
<path d="M40 150 L92 188" stroke="#2b6cb0" stroke-width="3" marker-end="url(#a)"/><path d="M220 150 L168 188" stroke="#2b6cb0" stroke-width="3" marker-end="url(#a)"/>
<text x="30" y="142" font-size="14" fill="#2b6cb0">1</text><text x="226" y="142" font-size="14" fill="#2b6cb0">2</text>
<text x="130" y="262" text-anchor="middle" font-size="13" fill="#2d3748">الإبرة عمودية على ظهر الإصبع</text><text x="130" y="282" text-anchor="middle" font-size="13" fill="#2d3748">عند القاعدة، باتجاه الراحة</text></g>
<g transform="translate(340,50)"><text x="130" y="14" text-anchor="middle" font-size="15" font-weight="700" fill="#2c5282">الإبهام وإصبع القدم الكبير: +حقنة 3</text>
<rect x="100" y="30" width="60" height="150" rx="28" fill="#fbd5b5" stroke="#c05621" stroke-width="2"/>
<rect x="60" y="180" width="140" height="60" rx="10" fill="#fbd5b5" stroke="#c05621" stroke-width="2"/>
<circle cx="98" cy="190" r="7" fill="#c53030"/><circle cx="162" cy="190" r="7" fill="#c53030"/><circle cx="130" cy="190" r="7" fill="#2f855a"/>
<path d="M40 150 L92 188" stroke="#2b6cb0" stroke-width="3" marker-end="url(#a)"/><path d="M220 150 L168 188" stroke="#2b6cb0" stroke-width="3" marker-end="url(#a)"/><path d="M130 130 L130 180" stroke="#2f855a" stroke-width="3" marker-end="url(#b)"/>
<text x="136" y="124" font-size="14" fill="#2f855a">3 أفقية</text>
<text x="130" y="262" text-anchor="middle" font-size="13" fill="#2d3748">الحقنة الثالثة أفقية على ظهر القاعدة</text><text x="130" y="282" text-anchor="middle" font-size="13" fill="#2d3748">لتخدير العصب الحسي الظهري</text></g>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2b6cb0"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#2f855a"/></marker></defs>
<text x="320" y="372" text-anchor="middle" font-size="13" fill="#c53030">النقط الحمراء = العصب الإصبعي. لا أدرينالين في الأصابع.</text></svg>
