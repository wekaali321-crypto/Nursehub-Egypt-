<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">سرطان الجلد: ملخص</text>
<rect x="14" y="44" width="300" height="130" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><rect x="14" y="44" width="300" height="26" rx="10" fill="#7c3aed"/><text x="164.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >الأنواع</text><text x="304" y="89" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >خلايا قاعدية (Basal)</text><text x="304" y="110.5" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >خلايا حرشفية (Squamous)</text><text x="304" y="132.0" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >ساركوما</text><text x="304" y="153.5" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a" >الميلانوما (الأخطر)</text><rect x="326" y="44" width="300" height="136" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="326" y="44" width="300" height="26" rx="10" fill="#dc2626"/><text x="476.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >ABCDE للآفات</text><text x="616" y="89" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >A: عدم تماثل</text><text x="616" y="110" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >B: حدود غير منتظمة</text><text x="616" y="131" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >C: ألوان متعددة</text><text x="616" y="152" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >D: القطر فوق 6 مم (عملة)</text><text x="616" y="173" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >E: تطور وتغير</text><rect x="14" y="186" width="300" height="160" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><rect x="14" y="186" width="300" height="26" rx="10" fill="#ea580c"/><text x="164.0" y="204" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >عوامل الخطر</text><text x="304" y="231" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >الأشعة فوق البنفسجية، التسمير</text><text x="304" y="251.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >حروق شمس متكررة، عمل خارجي</text><text x="304" y="272.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >تاريخ عائلي (أب/أم ميلانوما)</text><text x="304" y="292.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >بشرة فاتحة، شامات كثيرة</text><text x="304" y="313.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >أدوية مثبطة للمناعة</text><rect x="326" y="186" width="300" height="160" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><rect x="326" y="186" width="300" height="26" rx="10" fill="#16a34a"/><text x="476.0" y="204" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >الوقاية</text><text x="616" y="231" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >واقي واسع الطيف SPF فوق 30 قبل 15 دقيقة</text><text x="616" y="251" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >أعد الدهان كل ساعتين وبعد السباحة</text><text x="616" y="271" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >الحروق تحدث بالأيام الغائمة أيضاً</text><text x="616" y="291" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >تجنب الشمس من 10 ص إلى 4 م</text><text x="616" y="311" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >تجنب أجهزة التسمير</text><rect x="14" y="358" width="612" height="44" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/><text x="320" y="386" text-anchor="middle" font-size="12.5" font-weight="700" fill="#713f12" >الخزعة تؤكد التشخيص، وللتغيرات غير المنتظمة فقط</text>
</svg>
