<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 359" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="359" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الأكزيما (Eczema)</text><rect x="330" y="52" width="300" height="111.6" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الفكرة</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• اضطراب جلدي مزمن: احمرار وحكة وجفاف</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• شائع عند الأطفال ويحدث في أي عمر</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• يتفاقم دوريًا عند التعرض للمهيجات</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (حساسية)</text><rect x="10" y="52" width="310" height="76.8" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#16a34a"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الهدف العلاجي</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• خطة العلاج تتمحور حول تقليل التعرض</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  لمسببات الحساسية</text><rect x="10" y="171.6" width="620" height="160" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/><text x="320" y="193.6" text-anchor="middle" font-size="14" font-weight="800" fill="#713f12">نقاط NCLEX للتدخل</text><text x="606" y="221.6" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">• قصّ الأظافر</text><text x="606" y="243.6" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">• حمام اسفنجي فاتر (Tepid) بالصابون</text><text x="606" y="265.6" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">• تجفيف بالتربيت بالمنشفة</text><text x="606" y="287.6" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">• ضع المرطب فورًا بعد الاستحمام</text><text x="606" y="309.6" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a">• ملابس قطنية ناعمة وليس صوفية</text></svg>