<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 378" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="378" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الهيموفيليا عند الأطفال: ملخص</text><rect x="325" y="48" width="295" height="132" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">النوع A و B</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">A: نقص العامل VIII</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">B: نقص العامل IX</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">اضطراب نزف وراثي: الدم لا يتخثر طبيعيًا</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">نزف مفرط حتى من جرح بسيط أو سقطة</text><rect x="20" y="48" width="295" height="132" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الأعراض</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">ألم وكدمات ونمش نزفي</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">ضعف تروية الأنسجة</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">تيبس المفاصل وقلة الحركة</text><rect x="325" y="190" width="295" height="172" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="190" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">العلاج</text><text x="610" y="242" text-anchor="start" font-size="12.5" fill="#1e293b">تجنب الحقن: وريدي/عضلي/تحت الجلد</text><text x="610" y="262" text-anchor="start" font-size="12.5" fill="#1e293b">عوامل تخثر بديلة</text><text x="610" y="282" text-anchor="start" font-size="12.5" fill="#1e293b">كمادات ثلج ورفع الطرف المصاب</text><rect x="20" y="190" width="295" height="172" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><rect x="20" y="190" width="295" height="30" rx="12" fill="#9333ea"/><text x="167.5" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">التثقيف</text><text x="305" y="242" text-anchor="start" font-size="12.5" fill="#1e293b">سوار طبي دائمًا</text><text x="305" y="262" text-anchor="start" font-size="12.5" fill="#1e293b">لا أسبرين</text><text x="305" y="282" text-anchor="start" font-size="12.5" fill="#1e293b">رياضات غير احتكاكية: سباحة، جري</text><text x="305" y="302" text-anchor="start" font-size="12.5" fill="#1e293b">تدمير المفاصل مضاعفة طويلة</text><text x="305" y="322" text-anchor="start" font-size="12.5" fill="#1e293b">لقاحات تحت الجلد بأصغر إبرة وضغط 5 دقائق</text><text x="305" y="342" text-anchor="start" font-size="12.5" fill="#1e293b">فأكثر</text>
</svg>
