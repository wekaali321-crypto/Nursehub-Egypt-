<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مراحل قرحة الضغط</text>
<rect x="20.0" y="48" width="193.33333333333334" height="100" rx="10" fill="#fca5a5"/>
<text x="116.66666666666667" y="83.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text>
<text x="116.66666666666667" y="102.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">احمرار لا يبيض</text>
<text x="116.66666666666667" y="121.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">جلد سليم</text>
<rect x="223.33333333333334" y="48" width="193.33333333333334" height="100" rx="10" fill="#f87171"/>
<text x="320.0" y="92.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text>
<text x="320.0" y="111.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">فقد جزئي: قاع وردي لامع</text>
<rect x="426.6666666666667" y="48" width="193.33333333333334" height="100" rx="10" fill="#ef4444"/>
<text x="523.3333333333334" y="92.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text>
<text x="523.3333333333334" y="111.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">فقد كامل للجلد، دهون ظاهرة</text>
<rect x="20.0" y="158" width="193.33333333333334" height="100" rx="10" fill="#b91c1c"/>
<text x="116.66666666666667" y="202.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text>
<text x="116.66666666666667" y="221.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">عضلة أو عظم أو وتر</text>
<rect x="223.33333333333334" y="158" width="193.33333333333334" height="100" rx="10" fill="#57534e"/>
<text x="320.0" y="202.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">غير قابلة للتصنيف</text>
<text x="320.0" y="221.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">قشرة سوداء أو سلخ أصفر</text>
<rect x="426.6666666666667" y="158" width="193.33333333333334" height="100" rx="10" fill="#6d28d9"/>
<text x="523.3333333333334" y="202.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">أنسجة عميقة</text>
<text x="523.3333333333334" y="221.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لون أرجواني كستنائي</text>
<text x="320" y="290" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">اشرب 2–3 لتر، قلّب كل 1–2 ساعة، قيّم بمقياس برادن</text>
</svg>
