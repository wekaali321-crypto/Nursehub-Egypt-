00001" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">لا يوجد دهون/عضلات</text><rect x="12" y="162" width="616" height="44" fill="#fff" stroke="#ea580c" stroke-width="0"/><rect x="623" y="162" width="5" height="44" fill="#ea580c"/><text x="572.56" y="180" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">3</text><text x="369.28" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">فقد كامل سمك الجلد، دهون مرئية، قد توجد</text><text x="369.28" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">نسيج حبيبي</text><text x="116.72000000000001" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">لا عظم/وتر/عضلة</text><rect x="12" y="206" width="616" height="28" fill="#f1f5f9" stroke="#dc2626" stroke-width="0"/><rect x="623" y="206" width="5" height="28" fill="#dc2626"/><text x="572.56" y="224" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">4</text><text x="369.28" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">عضلة، وتر، عظم أو غضروف مكشوف</text><text x="116.72000000000001" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">خطر التهاب عظم</text><rect x="12" y="234" width="616" height="44" fill="#fff" stroke="#475569" stroke-width="0"/><rect x="623" y="234" width="5" height="44" fill="#475569"/><text x="572.56" y="252" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">غير قابلة</text><text x="572.56" y="268" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">للتصنيف</text><text x="369.28" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">قشرة سوداء أو سلخة تغطي القاعدة</text><text x="116.72000000000001" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">تُزال لتحديد المرحلة</text><rect x="12" y="278" width="616" height="44" fill="#f1f5f9" stroke="#7c3aed" stroke-width="0"/><rect x="623" 