<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 217" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="217" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الباراسيتامول مقابل مضادات الالتهاب (NSAIDs)</text><rect x="326.0" y="48" width="294.0" height="149.0" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="326.0" y="48" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="473.0" y="67" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">Acetaminophen (Tylenol/Paracetamol)</text><text x="610.0" y="96.5" text-anchor="start" font-size="12.5" fill="#0f172a">• للحمى والألم الخفيف</text><text x="610.0" y="114.0" text-anchor="start" font-size="12.5" fill="#0f172a">• يُفضَّل عند خطر النزف (قرحة،</text><text x="610.0" y="131.5" text-anchor="start" font-size="12.5" fill="#0f172a">هيموفيليا)</text><text x="610.0" y="149.0" text-anchor="start" font-size="12.5" fill="#0f172a">• يمكن تبادله مع NSAIDs لخفض الحرارة</text><text x="610.0" y="166.5" text-anchor="start" font-size="12.5" fill="#0f172a">• سمّي للكبد: تجنب الكحول</text><text x="610.0" y="184.0" text-anchor="start" font-size="12.5" fill="#0f172a">• الترياق: acetylcysteine</text><rect x="20.0" y="48" width="294.0" height="149.0" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><rect x="20.0" y="48" width="294.0" height="28" rx="10" fill="#b91c1c"/><text x="167.0" y="67" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">NSAIDs (ibuprofen, naproxen...)</text><text x="304.0" y="96.5" text-anchor="start" font-size="12.5" fill="#0f172a">• مضاد التهاب وخافض حرارة</text><text x="304.0" y="114.0" text-anchor="start" font-size="12.5" fill="#0f172a">• يقلل البروستاغلاندين</text><text x="304.0" y="131.5" text-anchor="start" font-size="12.5" fill="#0f172a">• يزيد خطر النزف والقرحة والكلى</text><text x="304.0" y="149.0" text-anchor="start" font-size="12.5" fill="#0f172a">• خذه مع الطعام</text><text x="304.0" y="166.5" text-anchor="start" font-size="12.5" fill="#0f172a">• ممنوع مع القرحة والربو (حذر)</text></svg>