<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="310" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >التعويض: ثلاث حالات (مثال حماض تنفسي)</text><rect x="20" y="46" width="196" height="218" rx="12" fill="#fff" stroke="#dc2626" stroke-width="3"/><rect x="20" y="46" width="196" height="44" rx="12" fill="#dc2626" stroke="none" stroke-width="1"/><text x="118" y="75" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" >غير معوَّض</text><text x="118" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" >pH خارج الحدود</text><text x="118" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >HCO₃ طبيعي (لا تعويض بعد)</text><rect x="38" y="178" width="160" height="46" rx="8" fill="#f1f5f9" stroke="none" stroke-width="1"/><text x="118" y="198" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a" direction="ltr">7.28 / 60 / 24</text><text x="118" y="216" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569" >pH / PaCO₂ / HCO₃</text><text x="118" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626" >العضو الثاني لم يبدأ</text><rect x="222" y="46" width="196" height="218" rx="12" fill="#fff" stroke="#f97316" stroke-width="3"/><rect x="222" y="46" width="196" height="44" rx="12" fill="#f97316" stroke="none" stroke-width="1"/><text x="320" y="75" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" >معوَّض جزئيًا</text><text x="320" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" >pH خارج الحدود</text><text x="320" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >HCO₃ مرتفع (الكلى تحاول)</text><rect x="240" y="178" width="160" height="46" rx="8" fill="#f1f5f9" stroke="none" stroke-width="1"/><text x="320" y="198" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a" direction="ltr">7.32 / 60 / 30</text><text x="320" y="216" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569" >pH / PaCO₂ / HCO₃</text><text x="320" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#f97316" >يحاول ولم ينجح بعد</text><rect x="424" y="46" width="196" height="218" rx="12" fill="#fff" stroke="#16a34a" stroke-width="3"/><rect x="424" y="46" width="196" height="44" rx="12" fill="#16a34a" stroke="none" stroke-width="1"/><text x="522" y="75" text-anchor="middle" font-size="17" font-weight="800" fill="#fff" >معوَّض كليًا</text><text x="522" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a" >pH رجع للمدى الطبيعي</text><text x="522" y="150" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >CO₂ وHCO₃ كلاهما غير طبيعي</text><rect x="442" y="178" width="160" height="46" rx="8" fill="#f1f5f9" stroke="none" stroke-width="1"/><text x="522" y="198" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a" direction="ltr">7.37 / 60 / 34</text><text x="522" y="216" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569" >pH / PaCO₂ / HCO₃</text><text x="522" y="250" text-anchor="middle" font-size="13" font-weight="700" fill="#16a34a" >نجح في إعادة pH</text><text x="320" y="292" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >في التعويض الكامل: pH أقل من 7.40 يميل للحمضي وأكثر من 7.40 يميل للقلوي (هذا يدل على الأصل)</text>
</svg>
