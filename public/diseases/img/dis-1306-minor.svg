  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الإسعاف الأولي للحروق البسيطة: الـ 3 C</text>
  <rect x="430" y="50" width="190" height="180" rx="10" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.5"/><text x="525" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">1) برّد بالماء</text><text x="608" y="96" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• انقع قليلًا بماء بارد</text><text x="608" y="121" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• لا ثلج</text><text x="608" y="146" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• لا كريمات</text><text x="608" y="171" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• لا مرهم على الجلد المفتوح</text><rect x="225" y="50" width="190" height="180" rx="10" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">2) غطِّ المكان</text><text x="403" y="96" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• قطعة قماش</text><text x="403" y="121" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• نظيفة جافة</text><text x="403" y="146" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• تجنب الالتصاق بالجرح</text><rect x="20" y="50" width="190" height="180" rx="10" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/><text x="115" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">3) اخلع الملابس</text><text x="198" y="96" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• اخلع الملابس</text><text x="198" y="121" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• والمجوهرات</text><text x="198" y="146" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• لا تنزع ما التصق بالجلد</text><text x="198" y="171" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• (الطبيب يزيله)</text><rect x="20" y="250" width="600" height="150" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="320" y="278" text-anchor="middle" font-size="14" font-weight="800" fill="#1e293b">أسئلة نموذجية</text><text x="320" y="306" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">حرق القطران (Tar): الإجراء الفوري تبريد المنطقة بالماء</text><text x="320" y="332" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">حرق كيميائي: الأولوية خلع كل الملابس وأي ملابس داخلية</text><text x="320" y="358" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">حرق 20% سمك كامل بعد تأمين المجرى الهوائي: الأولوية السوائل الوريدية</text>
</svg>
