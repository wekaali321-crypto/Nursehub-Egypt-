<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="260" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">تمزق الأغشية قبل الطلق: PPROM وPROM</text><rect x="20" y="50" width="290" height="150" rx="12" fill="#fecaca"/><text x="165" y="80" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">PPROM</text><text x="165" y="106" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">Preterm Premature Rupture of Membranes</text><text x="165" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">قبل 37 أسبوعًا</text><text x="165" y="162" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">خطر ولادة مبكرة وعدوى</text><rect x="330" y="50" width="290" height="150" rx="12" fill="#bbf7d0"/><text x="475" y="80" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">PROM</text><text x="475" y="106" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">Premature Rupture of Membranes</text><text x="475" y="134" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">بعد 37 أسبوعًا</text><text x="475" y="162" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">90% يبدأ طلقهن خلال 24 ساعة</text><text x="320" y="235" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">خطر العدوى يزيد بعد 18 ساعة من الانفجار، والحرارة فوق 38 درجة، ومعها مضاد حيوي وقائي لـ GBS</text>
</svg>
