<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 234" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="234" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">أنواع الحصوات الكلوية وتنبيهات الغذاء</text><rect x="12" y="44" width="616" height="30" rx="8" fill="#0f172a"/><text x="546.2857142857142" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">النوع</text><text x="401.7142857142857" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">الأصل</text><text x="175.42857142857144" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">نقاط عملية</text><rect x="12" y="74" width="616" height="44" fill="#fff"/><text x="546.2857142857142" y="92" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">كالسيوم أوكسالات/فوسفات</text><text x="401.7142857142857" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">الأشهر</text><text x="175.42857142857144" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">سوائل كثيرة، تقليل الملح والأوكسالات (سبانخ، شاي</text><text x="175.42857142857144" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">مركز)؛ لا تقلل الكالسيوم الغذائي بشدة</text><rect x="12" y="118" width="616" height="44" fill="#f1f5f9"/><text x="546.2857142857142" y="136" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">حمض اليوريك (Uric acid)</text><text x="401.7142857142857" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">بول حمضي، نقرس</text><text x="175.42857142857144" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">تقليل اللحوم الحمراء؛ قلوية البول بأمر الطبيب</text><text x="175.42857142857144" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">(سيترات)؛ Allopurinol</text><rect x="12" y="162" width="616" height="28" fill="#fff"/><text x="546.2857142857142" y="180" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">ستروفيت (Struvite)</text><text x="401.7142857142857" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">عدوى (Proteus)</text><text x="175.42857142857144" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">علاج العدوى وإزالة الحصوة كاملة</text><rect x="12" y="190" width="616" height="28" fill="#f1f5f9"/><text x="546.2857142857142" y="208" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">سيستين (Cystine)</text><text x="401.7142857142857" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">وراثي</text><text x="175.42857142857144" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">سوائل غزيرة جداً وقلوية البول</text></svg>