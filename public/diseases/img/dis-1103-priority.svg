<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="342" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >أيّ مريض أو نتيجة أولًا؟</text><rect x="20" y="44" width="600" height="46" rx="10" fill="#fff" stroke="#dc2626" stroke-width="2"/><rect x="560" y="44" width="60" height="46" rx="10" fill="#dc2626" stroke="none" stroke-width="1"/><text x="590" y="74" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" >1</text><text x="300" y="64" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a" >مجرى الهواء والتنفس</text><text x="300" y="82" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >انسداد، PaO₂ منخفض، CO₂ مرتفع مع نعاس</text><rect x="20" y="98" width="600" height="46" rx="10" fill="#fff" stroke="#f97316" stroke-width="2"/><rect x="560" y="98" width="60" height="46" rx="10" fill="#f97316" stroke="none" stroke-width="1"/><text x="590" y="128" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" >2</text><text x="300" y="118" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a" >الدورة الدموية</text><text x="300" y="136" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >ألم صدر، نزيف، صدمة، ضغط أكبر من 180</text><rect x="20" y="152" width="600" height="46" rx="10" fill="#fff" stroke="#eab308" stroke-width="2"/><rect x="560" y="152" width="60" height="46" rx="10" fill="#eab308" stroke="none" stroke-width="1"/><text x="590" y="182" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" >3</text><text x="300" y="172" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a" >تهديد عضو أو حياة</text><text x="300" y="190" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >ألم جبيرة لا يستجيب (متلازمة الحيز)</text><rect x="20" y="206" width="600" height="46" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="560" y="206" width="60" height="46" rx="10" fill="#2563eb" stroke="none" stroke-width="1"/><text x="590" y="236" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" >4</text><text x="300" y="226" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a" >مريض هش المناعة</text><text x="300" y="244" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >حرارة بسيطة مع WBC أقل من 5000</text><rect x="20" y="260" width="600" height="46" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="560" y="260" width="60" height="46" rx="10" fill="#16a34a" stroke="none" stroke-width="1"/><text x="590" y="290" text-anchor="middle" font-size="20" font-weight="800" fill="#fff" >5</text><text x="300" y="280" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a" >بقية الحالات المستقرة</text><text x="300" y="298" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >التورم والكدمة والجروح البسيطة</text><text x="320" y="326" text-anchor="middle" font-size="14" font-weight="700" fill="#475569" >القاعدة: ما يقتل أسرع يُرى أولًا</text>
</svg>
