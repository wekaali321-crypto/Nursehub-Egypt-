<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 254" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="254" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تسلسل التحضير للتنبيب وعلاج الحمى الخبيثة</text><rect x="60" y="48" width="520" height="50" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><circle cx="580" cy="64" r="14" fill="#b91c1c"/><text x="580" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="556" y="68" text-anchor="start" font-size="14" font-weight="800" fill="#b91c1c">تسلسل التنبيب</text><text x="570" y="88" text-anchor="start" font-size="13" fill="#0f172a">تهدئة (مثل midazolam) أولًا ثم المرخي العضلي (succinylcholine) ثم التنبيب</text><path d="M320 100 L320 114 M314 108 L320 115 L326 108" stroke="#64748b" stroke-width="2" fill="none"/><rect x="60" y="118" width="520" height="50" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><circle cx="580" cy="134" r="14" fill="#b91c1c"/><text x="580" y="139" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="556" y="138" text-anchor="start" font-size="14" font-weight="800" fill="#b91c1c">الحمى الخبيثة MH</text><text x="570" y="158" text-anchor="start" font-size="13" fill="#0f172a">عضلات متيبسة + حرارة عالية جدًا بعد المرخي</text><path d="M320 170 L320 184 M314 178 L320 185 L326 178" stroke="#64748b" stroke-width="2" fill="none"/><rect x="60" y="188" width="520" height="50" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><circle cx="580" cy="204" r="14" fill="#b91c1c"/><text x="580" y="209" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="556" y="208" text-anchor="start" font-size="14" font-weight="800" fill="#b91c1c">العلاج</text><text x="570" y="228" text-anchor="start" font-size="13" fill="#0f172a">أبلغ الطبيب، dantrolene وريدي، أكسجين</text></svg>