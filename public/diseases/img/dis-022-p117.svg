<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="220" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع الإنسولين وقممها</text><rect x="476" y="48" width="144" height="152" rx="12" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1.5"/><rect x="476" y="48" width="144" height="34" rx="12" fill="#ef4444"/><text x="548" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">سريع المفعول</text><text x="548" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">aspart / lispro / glulisine</text><text x="548" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">بدء 15 دقيقة</text><text x="548" y="152" text-anchor="middle" font-size="12.5" fill="#0f172a">قمة 30–90 دقيقة (الأخطر بالقمة)</text><rect x="324" y="48" width="144" height="152" rx="12" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-width="1.5"/><rect x="324" y="48" width="144" height="34" rx="12" fill="#0ea5e9"/><text x="396" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">Regular</text><text x="396" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">قمة 2–4 ساعات</text><text x="396" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">الوحيد وريديًا (IV)</text><rect x="172" y="48" width="144" height="152" rx="12" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.5"/><rect x="172" y="48" width="144" height="34" rx="12" fill="#10b981"/><text x="244" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">NPH</text><text x="244" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">عكر؛ قمة 4–12 ساعة</text><text x="244" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">لا وريدي</text><rect x="20" y="48" width="144" height="152" rx="12" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-width="1.5"/><rect x="20" y="48" width="144" height="34" rx="12" fill="#8b5cf6"/><text x="92" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">طويل المفعول</text><text x="92" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">detemir / glargine</text><text x="92" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">بلا قمة</text><text x="92" y="152" text-anchor="middle" font-size="12.5" fill="#0f172a">لا يُخلط</text>
</svg>
