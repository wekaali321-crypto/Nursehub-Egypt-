"14" fill="#64748b">▼</text><rect x="60" y="298" width="520" height="44" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.5"/><circle cx="548" cy="320.0" r="14" fill="#ef4444"/><text x="548" y="325.0" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">5</text><text x="528" y="325.0" text-anchor="end" font-size="13.5" fill="#0f172a">انسداد: جلطة قلبية أو سكتة أو غرغرينا</text>
