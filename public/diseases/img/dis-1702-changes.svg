<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="330" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أهم التغيرات الجسمية في الحمل</text><g font-size="13" font-weight="700" text-anchor="middle"><rect x="20" y="50" width="190" height="75" rx="10" fill="#fecaca"/><text x="115" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">الدم</text><text x="115" y="100" text-anchor="middle" font-size="12" font-weight="500" fill="#7f1d1d">الحجم +45–50%، البلازما +50%</text><rect x="225" y="50" width="190" height="75" rx="10" fill="#fed7aa"/><text x="320" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">القلب</text><text x="320" y="100" text-anchor="middle" font-size="11" font-weight="500" fill="#7c2d12">النبض +10–15، النتاج يزيد، الضغط يقل قليلًا</text><rect x="430" y="50" width="190" height="75" rx="10" fill="#fde68a"/><text x="525" y="78" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">الجلد</text><text x="525" y="100" text-anchor="middle" font-size="12" font-weight="500" fill="#713f12">كلف، خط أسود، شقوق</text><rect x="20" y="140" width="190" height="75" rx="10" fill="#bbf7d0"/><text x="115" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">الهيكل</text><text x="115" y="190" text-anchor="middle" font-size="11" font-weight="500" fill="#14532d">انحناء قطني، تباعد عضلات البطن</text><rect x="225" y="140" width="190" height="75" rx="10" fill="#bae6fd"/><text x="320" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">التنفس</text><text x="320" y="190" text-anchor="middle" font-size="11" font-weight="500" fill="#0c4a6e">احتقان أنف، ضيق نفس بالثلث الثالث</text><rect x="430" y="140" width="190" height="75" rx="10" fill="#ddd6fe"/><text x="525" y="168" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">الهضمي</text><text x="525" y="190" text-anchor="middle" font-size="12" font-weight="500" fill="#4c1d95">حرقة وإمساك لضغط الرحم</text></g><text x="320" y="250" text-anchor="middle" font-size="12" font-weight="500" fill="#475569">الهيموجلوبين والهيماتوكريت ينخفضان (أنيميا فسيولوجية) لأن البلازما تزيد أكثر من الكرات الحمراء (+30%)</text><text x="320" y="280" text-anchor="middle" font-size="12" font-weight="500" fill="#475569">زيادة الوزن الكلية الموصى بها 25–35 رطلًا (11–16 كجم) لمن وزنها طبيعي</text><text x="320" y="305" text-anchor="middle" font-size="12" font-weight="500" fill="#475569">+300 سعر حراري يوميًا في الثلثين الثاني والثالث</text>
</svg>
