<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 338" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="338" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">نقص الصفائح: القيم والتدخل</text><rect x="325" y="48" width="295" height="132" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">القيم</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">الطبيعي 150000–400000</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">150000 أو أقل: نقص</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">100000: خطر كبير</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">50000 أو أقل: مميت</text><rect x="20" y="48" width="295" height="132" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">العلامات والأسباب</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">نزف اللثة، تسرع قلب، نمش نزفي (Petechiae)</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">أسباب: مثبطات مناعة، تليف/التهاب الكبد،</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">ITP</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">المضاعفة: نزف — الأولوية: خطر الإصابة</text><rect x="325" y="190" width="295" height="132" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="190" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">التدخل (أقل من 100 ألف)</text><text x="610" y="242" text-anchor="start" font-size="12.5" fill="#1e293b">احجز: هيبارين، أسبرين، كلوبيدوجريل،</text><text x="610" y="262" text-anchor="start" font-size="12.5" fill="#1e293b">إينوكسابارين</text><text x="610" y="282" text-anchor="start" font-size="12.5" fill="#1e293b">أبلغ الطبيب</text><text x="610" y="302" text-anchor="start" font-size="12.5" fill="#1e293b">خذ العلامات الحيوية</text><rect x="20" y="190" width="295" height="132" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><rect x="20" y="190" width="295" height="30" rx="12" fill="#9333ea"/><text x="167.5" y="211" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">التثقيف</text><text x="305" y="242" text-anchor="start" font-size="12.5" fill="#1e293b">لا شفرات حلاقة</text><text x="305" y="262" text-anchor="start" font-size="12.5" fill="#1e293b">لا مسكنات NSAIDs دون وصفة</text>
</svg>
