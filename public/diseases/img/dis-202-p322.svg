<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 461" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="461" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">فيروس نقص المناعة (HIV)</text><rect x="330" y="52" width="300" height="129.0" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#be123c"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الفكرة</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• فيروس ارتجاعي (RNA) يهاجم خلايا CD4 (T</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  مساعدة)</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ينتقل بالدم والسائل المنوي والمهبلي،</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الإبر، الأم لطفلها</text><text x="620" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• يلتصق بالخلية ويندمج بها ليتكاثر</text><rect x="10" y="52" width="310" height="111.6" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#0369a1"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأعراض</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• خلال أسابيع: إعياء، حمى وعرق ليلي</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• التهاب حلق، نقص وزن، إسهال</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ثم فترة بلا أعراض</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• عند الإيدز: عدوى متكررة</text><rect x="330" y="189.0" width="300" height="129.0" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M330,199.0 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#7c3aed"/><text x="480.0" y="208.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المراحل</text><text x="620" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• 1) العدوى الأولية: فترة النافذة،</text><text x="620" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الاختبار قد يكون سلبيًا كاذبًا والعدوى</text><text x="620" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  عالية</text><text x="620" y="284.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ثم كمون بلا أعراض</text><text x="620" y="301.59999999999997" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• 2) الإيدز: CD4 أقل من 200 خلية/مم³</text><rect x="10" y="189.0" width="310" height="129.0" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M10,199.0 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#16a34a"/><text x="165.0" y="208.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التشخيص</text><text x="310" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• EIA: كشف الأجسام المضادة وانتهاء فترة</text><text x="310" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  النافذة</text><text x="310" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• Western blot: لتأكيد EIA</text><text x="310" y="284.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• Viral load: RNA في البلازما</text><text x="310" y="301.59999999999997" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• CD4/CD8: العدّ الخلوي</text><rect x="330" y="326.0" width="300" height="76.8" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M330,336.0 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#16a34a"/><text x="480.0" y="345.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج</text><text x="620" y="369.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• HAART: عدة أدوية على أهداف مختلفة</text><text x="620" y="386.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• زيدوفودين للحامل لمنع العبور للمشيمة</text><rect x="10" y="326.0" width="310" height="111.6" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,336.0 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="345.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التمريض</text><text x="310" y="369.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• راقب الحمى والسعال والتهاب الحلق (قد تعني</text><text x="310" y="386.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  عدوى قاتلة)</text><text x="310" y="403.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• راقب نقص الوزن والعلامات الحيوية</text><text x="310" y="421.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الالتزام بالأدوية (HAART)</text></svg>