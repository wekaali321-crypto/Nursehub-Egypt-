<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 375" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="375" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قوة الكورتيزون الموضعي (من الأضعف للأقوى)</text>
  <rect x="170" y="50" width="300" height="48" rx="10" fill="#22c55e"/>
  <text x="320" y="69.55" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">خفيف (Mild)</text>
  <text x="320" y="87.55" text-anchor="middle" font-size="11" font-weight="500" fill="#fff" direction="ltr">Hydrocortisone 1% / 2.5%</text>
  <rect x="130" y="108" width="380" height="48" rx="10" fill="#84cc16"/>
  <text x="320" y="127.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1a2e05">متوسط (Moderate)</text>
  <text x="320" y="145.55" text-anchor="middle" font-size="11" font-weight="500" fill="#1a2e05" direction="ltr">Clobetasone (Eumovate) / Alclometasone (Perderm)</text>
  <rect x="90" y="166" width="460" height="48" rx="10" fill="#f97316"/>
  <text x="320" y="185.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">قوي (Potent)</text>
  <text x="320" y="201.85" text-anchor="middle" font-size="9" font-weight="500" fill="#fff" direction="ltr">Betnovate / Diprosone / Topicort / Elocon / Cutivate*</text>
  <rect x="50" y="224" width="540" height="48" rx="10" fill="#dc2626"/>
  <text x="320" y="243.55" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">قوي جداً (Very potent)</text>
  <text x="320" y="261.55" text-anchor="middle" font-size="11" font-weight="500" fill="#fff" direction="ltr">Clobetasol propionate 0.05% (Dermovate)</text>
  <rect x="30" y="288" width="580" height="40" rx="10" fill="#fef9c3"/>
  <text x="320" y="312.2" text-anchor="middle" font-size="12" font-weight="700" fill="#713f12">ابدأ بأضعف قوة تعالج المشكلة، ولأقصر مدة — وما تحطش القوي على الوجه والثنيات والأطفال</text>
  <text x="320" y="361" text-anchor="middle" font-size="12" fill="#64748b">* تصنيف المصدر وضع Fluticasone في المتوسط؛ في BNF هو قوي — راجع التحديث</text>
</svg>
