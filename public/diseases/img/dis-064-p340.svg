<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 557" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="557" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب الكبد الفيروسي</text><rect x="120" y="52" width="390" height="28.849999999999998" rx="0" fill="#0369a1" stroke="#cbd5e1" stroke-width="1"/><text x="455.0" y="71.95" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">النوع</text><line x1="400" y1="52" x2="400" y2="80.85" stroke="#cbd5e1" stroke-width="1"/><text x="260.0" y="71.95" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">طريقة العدوى</text><rect x="120" y="80.85" width="390" height="28.849999999999998" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="455.0" y="100.8" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">A</text><line x1="400" y1="80.85" x2="400" y2="109.69999999999999" stroke="#cbd5e1" stroke-width="1"/><text x="260.0" y="100.8" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">البراز-الفم (طعام ملوث)</text><rect x="120" y="109.69999999999999" width="390" height="28.849999999999998" rx="0" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="455.0" y="129.64999999999998" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">B</text><line x1="400" y1="109.69999999999999" x2="400" y2="138.54999999999998" stroke="#cbd5e1" stroke-width="1"/><text x="260.0" y="129.64999999999998" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">دم وسوائل الجسم</text><rect x="120" y="138.54999999999998" width="390" height="28.849999999999998" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="455.0" y="158.49999999999997" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">C</text><line x1="400" y1="138.54999999999998" x2="400" y2="167.39999999999998" stroke="#cbd5e1" stroke-width="1"/><text x="260.0" y="158.49999999999997" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">دم وسوائل الجسم</text><rect x="120" y="167.39999999999998" width="390" height="28.849999999999998" rx="0" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="455.0" y="187.34999999999997" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">D</text><line x1="400" y1="167.39999999999998" x2="400" y2="196.24999999999997" stroke="#cbd5e1" stroke-width="1"/><text x="260.0" y="187.34999999999997" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">عدوى مصاحبة لـ B</text><rect x="120" y="196.24999999999997" width="390" height="28.849999999999998" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="455.0" y="216.19999999999996" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">E</text><line x1="400" y1="196.24999999999997" x2="400" y2="225.09999999999997" stroke="#cbd5e1" stroke-width="1"/><text x="260.0" y="216.19999999999996" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">البراز-الفم (ماء شرب ملوث)</text><rect x="330" y="233.09999999999997" width="300" height="146.39999999999998" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.5"/><path d="M330,243.09999999999997 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#be123c"/><text x="480.0" y="252.09999999999997" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأعراض</text><text x="620" y="276.09999999999997" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• صداع، حمى، إعياء، غثيان وقيء</text><text x="620" y="293.49999999999994" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ارتفاع إنزيمات الكبد ALT وAST</text><text x="620" y="310.8999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  والبيليروبين</text><text x="620" y="328.2999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• حكة، يرقان، بول داكن، براز طيني</text><text x="620" y="345.6999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ارتفاع PT وaPTT، كدمات، ألبومين منخفض</text><text x="620" y="363.09999999999985" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  ووذمة</text><rect x="10" y="233.09999999999997" width="310" height="146.39999999999998" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M10,243.09999999999997 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#0369a1"/><text x="165.0" y="252.09999999999997" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الخطر والتشخيص</text><text x="310" y="276.09999999999997" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ينتقل بالدم: حقن الأدوية، وشم، ثقب الجسم،</text><text x="310" y="293.49999999999994" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  شفرات مشتركة، علاقة غير آمنة</text><text x="310" y="310.8999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• خزعة الكبد: بعدها استلقِ على الجانب</text><text x="310" y="328.2999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الأيمن</text><text x="310" y="345.6999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مضاعفات: فشل كبد حاد، تليف، سرطان كبد،</text><text x="310" y="363.09999999999985" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  مشاكل مرارة</text><rect x="330" y="387.49999999999994" width="300" height="76.8" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M330,397.49999999999994 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#16a34a"/><text x="480.0" y="406.49999999999994" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج</text><text x="620" y="430.49999999999994" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• A: يشفى غالبًا بالراحة</text><text x="620" y="447.8999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• B وC: أدوية مضادة للفيروسات</text><rect x="10" y="387.49999999999994" width="310" height="146.39999999999998" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,397.49999999999994 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="406.49999999999994" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التثقيف</text><text x="310" y="430.49999999999994" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• وجبات صغيرة متكررة، قليلة البروتين</text><text x="310" y="447.8999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  والدهون عند الغثيان</text><text x="310" y="465.2999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• فترات راحة</text><text x="310" y="482.6999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• علاقة محمية</text><text x="310" y="500.09999999999985" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تجنب الكحول والباراسيتامول</text><text x="310" y="517.4999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• لا مشاركة الشفرات والفرش</text></svg>