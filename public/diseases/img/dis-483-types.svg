<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 258" font-family="Cairo, Tahoma, sans-serif">
<rect width="640" height="258" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">أسباب النزيف حسب مرحلة الحمل</text>
<rect x="20" y="44" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="44" width="160" height="54" rx="10" fill="#0369a1"/><text x="540" y="76" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">أول 20 أسبوع</text><text x="448" y="67" text-anchor="end" font-size="12" fill="#0f172a">إجهاض (Abortion) · حمل عنقودي (Vesicular mole)</text><text x="448" y="85" text-anchor="end" font-size="12" fill="#0f172a">حمل خارج الرحم (Ectopic)</text><rect x="20" y="106" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="106" width="160" height="54" rx="10" fill="#d97706"/><text x="540" y="138" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">آخر 20 أسبوع (APH)</text><text x="448" y="129" text-anchor="end" font-size="12" fill="#0f172a">انفصال المشيمة (Abruption): نزيف داكن مؤلم أو ألم بطن</text><text x="448" y="147" text-anchor="end" font-size="12" fill="#0f172a">المشيمة المنزاحة (Previa): نزيف أحمر فاتح بدون ألم</text><rect x="20" y="168" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="168" width="160" height="54" rx="10" fill="#b91c1c"/><text x="540" y="200" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">بعد الولادة (PPH)</text><text x="448" y="191" text-anchor="end" font-size="12" fill="#0f172a">ارتخاء الرحم (Atonic): نزيف داكن متقطع على دفعات</text><text x="448" y="209" text-anchor="end" font-size="12" fill="#0f172a">إصابة/تمزق (Traumatic): نزيف أحمر فاتح مستمر بالتنقيط</text><text x="320" y="242" text-anchor="middle" font-size="12" fill="#64748b">الإسعاف الأولي للجميع: كانيولا كبير + سوائل + تحويل فوري</text>
</svg>
