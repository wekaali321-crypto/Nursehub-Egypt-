<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
<rect width="640" height="520" rx="16" fill="#f8fafc"/>
<text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >أدوية الغدة الدرقية والعلاج الإشعاعي باليود</text>
<rect x="330" y="50" width="300" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="330" y="50" width="300" height="28" rx="10" fill="#0369a1"/>
<text x="480.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >قصور الدرقية: ليفوثيروكسين</text>
<text x="480.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >مدى الحياة وتأثيره بطيء (3–4 أسابيع)</text>
<text x="480.0" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >صباحاً على معدة فارغة قبل الفطور بساعة</text>
<text x="480.0" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >لا تضاعف الجرعة بنفسك ولا توقفه فجأة</text>
<text x="480.0" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >الإيقاف المفاجئ قد يؤدي لغيبوبة الوذمة المخاطية</text>
<rect x="10" y="50" width="310" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="50" width="310" height="28" rx="10" fill="#b91c1c"/>
<text x="165.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >فرط الدرقية: الأدوية</text>
<text x="165.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >SSKI: محلول يود البوتاسيوم (قشة، بين الأدوية بساعة)</text>
<text x="165.0" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >ميثيمازول: غير آمن للحمل</text>
<text x="165.0" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >PTU: مفضل في الحمل؛ بلّغ عن حمى والتهاب حلق</text>
<text x="165.0" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >حاصرات بيتا (-lol): تخفض الضغط والنبض</text>
<rect x="330" y="215" width="300" height="165" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="330" y="215" width="300" height="28" rx="10" fill="#7c3aed"/>
<text x="480.0" y="234" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >قبل اليود المشع RAIU</text>
<text x="480.0" y="265" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >اختبار حمل</text>
<text x="480.0" y="289" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >انزع المجوهرات وطقم الأسنان</text>
<text x="480.0" y="313" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >أوقف أدوية الدرقية 5–7 أيام قبله</text>
<text x="480.0" y="337" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >صيام: قبل 2–4 ساعات وبعد ساعة إلى ساعتين</text>
<rect x="10" y="215" width="310" height="165" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="215" width="310" height="28" rx="10" fill="#7c3aed"/>
<text x="165.0" y="234" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >بعد اليود المشع</text>
<text x="165.0" y="265" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >تجنب الحوامل والأطفال والزحام</text>
<text x="165.0" y="291" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >حمام منفصل وإسدال الماء 3 مرات</text>
<text x="165.0" y="317" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >أدوات أكل وغسيل منفصلة</text>
<rect x="10" y="395" width="620" height="115" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="395" width="620" height="28" rx="10" fill="#0f766e"/>
<text x="320.0" y="414" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >العين والوقاية من العاصفة الدرقية</text>
<text x="320.0" y="445" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >جحوظ العين: تمارين حركة العين، دموع صناعية، نظارة داكنة، لاصق لإغلاق الجفن؛ لا تدليك</text>
<text x="320.0" y="471" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >لا ملح (تورم العين) مع رفع الرأس، لا منبهات، لا تدخين أو إجهاد أو عدوى، ولا تلمس الرقبة</text>
