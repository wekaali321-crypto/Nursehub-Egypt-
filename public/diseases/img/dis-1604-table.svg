<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 532" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="532" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">جدول الأملاح الستة (الطبيعي والزيادة والنقص)</text>
<rect x="10" y="44" width="620" height="32" rx="8" fill="#0f766e"/><text x="590" y="65" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >الملح</text><text x="512" y="65" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" >الطبيعي</text><text x="420" y="65" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" >وظيفته</text><text x="285" y="65" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" >الزيادة (Hyper)</text><text x="110" y="65" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" >النقص (Hypo)</text><rect x="10" y="82" width="620" height="64" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.3"/><text x="622" y="108" text-anchor="start" font-size="13" font-weight="800" fill="#7c3aed" >بوتاسيوم K⁺</text><text x="512" y="118" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a" >3.5–5.0</text><text x="455" y="108" text-anchor="start" font-size="11" font-weight="600" fill="#334155" >نبض القلب</text><text x="360" y="106" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >قمم T عالية، VF</text><text x="360" y="124" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >توقف قلب، ضعف وإسهال</text><text x="190" y="106" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >T مسطحة وU، ضعف</text><text x="190" y="124" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >شلل، إمساك، تنفس ضحل</text><rect x="10" y="152" width="620" height="64" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.3"/><text x="622" y="178" text-anchor="start" font-size="13" font-weight="800" fill="#2563eb" >صوديوم Na⁺</text><text x="512" y="188" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a" >135–145</text><text x="455" y="178" text-anchor="start" font-size="11" font-weight="600" fill="#334155" >ضغط وحجم الدم</text><text x="360" y="176" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >عطش، جفاف مخاطي</text><text x="360" y="194" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >هياج، DTR عالية</text><text x="190" y="176" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >صداع، ارتباك</text><text x="190" y="194" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >تشنجات، غيبوبة</text><rect x="10" y="222" width="620" height="64" rx="8" fill="#fff" stroke="#0891b2" stroke-width="1.3"/><text x="622" y="248" text-anchor="start" font-size="13" font-weight="800" fill="#0891b2" >كلوريد Cl⁻</text><text x="512" y="258" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a" >97–107</text><text x="455" y="248" text-anchor="start" font-size="11" font-weight="600" fill="#334155" >يتبع الصوديوم</text><text x="360" y="246" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >قريب من علامات زيادة Na</text><text x="360" y="264" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" ></text><text x="190" y="246" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >إرهاق، تقلصات</text><text x="190" y="264" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >قلاء مع القيء</text><rect x="10" y="292" width="620" height="64" rx="8" fill="#fff" stroke="#db2777" stroke-width="1.3"/><text x="622" y="318" text-anchor="start" font-size="13" font-weight="800" fill="#db2777" >مغنيسيوم Mg²⁺</text><text x="512" y="328" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a" >1.3–2.1</text><text x="455" y="318" text-anchor="start" font-size="11" font-weight="600" fill="#334155" >يرخّي العضلات</text><text x="360" y="316" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >حصار قلب، بطء</text><text x="360" y="334" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >ضغط منخفض، DTR منخفضة</text><text x="190" y="316" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >تورساد، VF</text><text x="190" y="334" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >DTR عالية، تشنج</text><rect x="10" y="362" width="620" height="64" rx="8" fill="#fff" stroke="#ea580c" stroke-width="1.3"/><text x="622" y="388" text-anchor="start" font-size="13" font-weight="800" fill="#ea580c" >كالسيوم Ca²⁺</text><text x="512" y="398" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a" >9.0–10.5</text><text x="455" y="388" text-anchor="start" font-size="11" font-weight="600" fill="#334155" >عظام ودم وقلب</text><text x="360" y="386" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >حصوات، إمساك</text><text x="360" y="404" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >ألم عظام، ضعف</text><text x="190" y="386" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >Trousseau وChvostek، تشنج</text><text x="190" y="404" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >نزف</text><rect x="10" y="432" width="620" height="64" rx="8" fill="#fff" stroke="#65a30d" stroke-width="1.3"/><text x="622" y="458" text-anchor="start" font-size="13" font-weight="800" fill="#65a30d" >فوسفات PO₄</text><text x="512" y="468" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a" >3.0–4.5</text><text x="455" y="458" text-anchor="start" font-size="11" font-weight="600" fill="#334155" >عكس الكالسيوم</text><text x="360" y="456" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >علامات نقص الكالسيوم</text><text x="360" y="474" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" ></text><text x="190" y="456" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" >علامات زيادة الكالسيوم</text><text x="190" y="474" text-anchor="start" font-size="10.5" font-weight="600" fill="#0f172a" ></text><text x="320" y="514" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569" >قاعدة: الأخطر هو الأكثر ظهوراً في الامتحان: القلب والتنفس أولاً</text>
</svg>
