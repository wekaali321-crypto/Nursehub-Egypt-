<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="388" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">سحب الكورتيزون بالتدريج (حسب المصدر)</text><rect x="50" y="52" width="540" height="54" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/><text x="320" y="74" text-anchor="middle" font-size="15" font-weight="800" fill="#991b1b">الجرعة العلاجية</text><text x="320" y="94" text-anchor="middle" font-size="12.5" fill="#991b1b">من 3 أقراص صباحاً + 2 مساءً إلى 7 صباحاً + 5 مساءً حسب الشدة</text><text x="320" y="123" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="130" width="540" height="54" rx="12" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="320" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#9a3412">أول خطوة للسحب</text><text x="320" y="172" text-anchor="middle" font-size="12.5" fill="#9a3412">إزالة قرص واحد من جرعة المساء</text><text x="320" y="201" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="208" width="540" height="54" rx="12" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="320" y="230" text-anchor="middle" font-size="15" font-weight="800" fill="#854d0e">الخطوة التالية</text><text x="320" y="250" text-anchor="middle" font-size="12.5" fill="#854d0e">إزالة قرص من جرعة الصباح</text><text x="320" y="279" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="286" width="540" height="54" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="320" y="308" text-anchor="middle" font-size="15" font-weight="800" fill="#166534">أقل جرعة فعالة أو إيقاف</text><text x="320" y="328" text-anchor="middle" font-size="12.5" fill="#166534">بأمر الطبيب فقط، لا يتوقف فجأة أبداً</text><text x="320" y="368" text-anchor="middle" font-size="12.5" fill="#475569">الكورتيزون للجسر المؤقت، والحديث يفضل جرعات أقل ومدة أقصر</text></svg>