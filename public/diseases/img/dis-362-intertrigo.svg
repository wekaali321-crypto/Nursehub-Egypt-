<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="280" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">طفح ثنيات الجلد: إزاي نفرّق بين التلاتة</text>
<g font-size="13" text-anchor="middle">
<rect x="15" y="50" width="200" height="210" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="115" y="76" font-size="15" font-weight="800" fill="#92400e">Erythrasma</text>
<text x="115" y="105" fill="#334155">بقعة بنية متقشرة</text><text x="115" y="127" fill="#334155">حدود واضحة سطحية</text><text x="115" y="149" fill="#334155">غالباً بدون هرش</text><text x="115" y="180" fill="#0369a1">بكتيريا → Erythrocin / Fucidin</text>
<rect x="220" y="50" width="200" height="210" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="320" y="76" font-size="15" font-weight="800" fill="#be123c">Candida intertrigo</text>
<text x="320" y="105" fill="#334155">أحمر + نقط (satellites)</text><text x="320" y="127" fill="#334155">على الأطراف</text><text x="320" y="149" fill="#334155">هرش، نادراً معدية</text><text x="320" y="180" fill="#0369a1">مضاد فطريات ± كورتيزون ضعيف</text>
<rect x="425" y="50" width="200" height="210" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="525" y="76" font-size="15" font-weight="800" fill="#047857">Tinea cruris</text>
<text x="525" y="105" fill="#334155">أحمر بحواف مرتفعة</text><text x="525" y="127" fill="#334155">مركز أفتح</text><text x="525" y="149" fill="#334155">هرش، معدية</text><text x="525" y="180" fill="#0369a1">مضاد فطريات موضعي/فموي</text></g></svg>