<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="230" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">درجات الجفاف (بالغ) وعلاماته</text><rect x="12" y="44" width="616" height="30" rx="8" fill="#0f172a"/><text x="568.7692307692307" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">العلامة</text><text x="438.46153846153845" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">خفيف</text><text x="284.4615384615385" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">متوسط</text><text x="106.7692307692308" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">شديد</text><rect x="12" y="74" width="616" height="28" fill="#fff" stroke="#ca8a04" stroke-width="0"/><rect x="623" y="74" width="5" height="28" fill="#ca8a04"/><text x="568.7692307692307" y="92" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">النبض</text><text x="438.46153846153845" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">طبيعي/خفيف</text><text x="284.4615384615385" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">أسرع 100–120</text><text x="106.7692307692308" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">أكثر من 120 وضعيف</text><rect x="12" y="102" width="616" height="28" fill="#f1f5f9" stroke="#ea580c" stroke-width="0"/><rect x="623" y="102" width="5" height="28" fill="#ea580c"/><text x="568.7692307692307" y="120" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">الضغط</text><text x="438.46153846153845" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">طبيعي</text><text x="284.4615384615385" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">هبوط وضعي</text><text x="106.7692307692308" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">هبوط واضح</text><rect x="12" y="130" width="616" height="28" fill="#fff" stroke="#dc2626" stroke-width="0"/><rect x="623" y="130" width="5" height="28" fill="#dc2626"/><text x="568.7692307692307" y="148" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">الجلد/الأغشية</text><text x="438.46153846153845" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">عطش، جفاف خفيف</text><text x="284.4615384615385" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">مرونة منخفضة، فم جاف</text><text x="106.7692307692308" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">جلد باهت بارد، تسطح</text><rect x="12" y="158" width="616" height="28" fill="#f1f5f9" stroke="#dc2626" stroke-width="0"/><rect x="623" y="158" width="5" height="28" fill="#dc2626"/><text x="568.7692307692307" y="176" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">البول</text><text x="438.46153846153845" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">أقل لونه داكن</text><text x="284.4615384615385" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">قليل</text><text x="106.7692307692308" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">أقل من 0.5 مل/كجم/س أو بلا</text><rect x="12" y="186" width="616" height="28" fill="#fff" stroke="#dc2626" stroke-width="0"/><rect x="623" y="186" width="5" height="28" fill="#dc2626"/><text x="568.7692307692307" y="204" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">الوعي</text><text x="438.46153846153845" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">طبيعي</text><text x="284.4615384615385" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">هياج/نعاس</text><text x="106.7692307692308" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">تشوش/غيبوبة</text></svg>