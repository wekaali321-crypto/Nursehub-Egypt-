<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a" >أعمدة علاج فشل القلب الانقباضي (HFrEF)</text><rect x="20" y="50" width="143" height="120" rx="12" fill="#0ea5e9"/><text x="91.5" y="96.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" >ACEi / ARB / ARNI</text><text x="91.5" y="114.2" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >Ramipril</text><text x="91.5" y="132.2" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >Captopril</text><rect x="173" y="50" width="143" height="120" rx="12" fill="#16a34a"/><text x="244.5" y="96.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" >حاصر بيتا</text><text x="244.5" y="114.2" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >Carvedilol</text><text x="244.5" y="132.2" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >Bisoprolol</text><rect x="326" y="50" width="143" height="120" rx="12" fill="#f97316"/><text x="397.5" y="96.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" >مضاد الألدوستيرون</text><text x="397.5" y="114.2" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >Spironolactone</text><text x="397.5" y="132.2" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >(Aldactone)</text><rect x="479" y="50" width="143" height="120" rx="12" fill="#7c3aed"/><text x="550.5" y="96.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" >SGLT2i</text><text x="550.5" y="114.2" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >Dapagliflozin</text><text x="550.5" y="132.2" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >Empagliflozin</text><rect x="20" y="185" width="600" height="45" rx="12" fill="#fde68a"/><text x="320.0" y="212.05" text-anchor="middle" font-size="13" font-weight="700" fill="#422006" >+ مدرّات لتخفيف الاحتقان · ديجوكسين عند اللزوم · علاج السبب</text><text x="320" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#475569" >المصدر ركّز على المدرّات والفازودايلاتور والديجوكسين؛ والأعمدة الأربعة إضافة حديثة</text>
