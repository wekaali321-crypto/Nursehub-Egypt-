<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" direction="rtl" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="432" fill="#fafafa"/><text x="320" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0d47a1">تسلسل SIADH</text><rect x="40" y="60" width="560" height="66" rx="12" fill="#e3f2fd" stroke="#607d8b" stroke-width="1.2"/><text x="320" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">إفراز زائد من ADH</text><text x="320" y="110" text-anchor="middle" font-size="14" fill="#37474f">أدوية / أورام / إصابة مخ</text><path d="M320 126 v18" stroke="#607d8b" stroke-width="2"/><path d="M313 138 l7 8 l7 -8" fill="none" stroke="#607d8b" stroke-width="2"/><rect x="40" y="152" width="560" height="66" rx="12" fill="#fff8e1" stroke="#607d8b" stroke-width="1.2"/><text x="320" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">كلى تحتفظ بالماء</text><text x="320" y="202" text-anchor="middle" font-size="14" fill="#37474f">بول مركز + صوديوم بول مرتفع</text><path d="M320 218 v18" stroke="#607d8b" stroke-width="2"/><path d="M313 230 l7 8 l7 -8" fill="none" stroke="#607d8b" stroke-width="2"/><rect x="40" y="244" width="560" height="66" rx="12" fill="#fce4ec" stroke="#607d8b" stroke-width="1.2"/><text x="320" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">تخفيف صوديوم الدم</text><text x="320" y="294" text-anchor="middle" font-size="14" fill="#37474f">Na منخفض + أسمولية دم منخفضة</text><path d="M320 310 v18" stroke="#607d8b" stroke-width="2"/><path d="M313 322 l7 8 l7 -8" fill="none" stroke="#607d8b" stroke-width="2"/><rect x="40" y="336" width="560" height="66" rx="12" fill="#e8f5e9" stroke="#607d8b" stroke-width="1.2"/><text x="320" y="364" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">أعراض عصبية</text><text x="320" y="386" text-anchor="middle" font-size="14" fill="#37474f">صداع، قيء، تشوش، تشنج</text></svg>