<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 564" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="700" height="564" rx="16" fill="#f8fafc"/>
<text x="350.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">فغر القولون والفغر اللفائفي</text>
<rect x="356.0" y="52" width="330.0" height="149.5" rx="10" fill="#0e7490" fill-opacity="0.1" stroke="#0e7490" stroke-width="1.2"/>
<rect x="356.0" y="52" width="330.0" height="26" rx="10" fill="#0e7490" fill-opacity="1" stroke="#0e7490" stroke-width="1.2"/>
<text x="521.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الفرق الأساسي</text>
<text x="676.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• الفغر فتحة جراحية في جدار البطن يمر منها</text>
<text x="676.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">البراز لتجاوز جزء مسدود أو مريض، وتُسمى Stoma</text>
<text x="676.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• Ileostomy: فتحة في اللفائفي (أمعاء دقيقة)</text>
<text x="676.0" y="149.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">بالربع السفلي الأيمن، براز أخضر/أصفر سائل</text>
<text x="676.0" y="169.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• Colostomy: فتحة في القولون، براز بني متماسك</text>
<text x="676.0" y="186.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">أكثر</text>
<rect x="14.0" y="52" width="330.0" height="149.5" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="14.0" y="52" width="330.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="179.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الفغر السليم والخطر</text>
<text x="334.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• سليم: أحمر "لحمي" بعد الجراحة، وردي على المدى</text>
<text x="334.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الطويل، رطب لامع</text>
<text x="334.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• خطر (أبلغ الطبيب): بارد، أو أي تغير لون: شاحب،</text>
<text x="334.0" y="149.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">رمادي، مظلم، أرجواني</text>
<rect x="14.0" y="221.5" width="672.0" height="95.75" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="14.0" y="221.5" width="672.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="350.0" y="239.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الحمية والسوائل</text>
<text x="676.0" y="265.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أول 4–6 أسابيع: قليل الألياف ولا غازات (لا بروكلي ولا ملفوف بروكسل ولا قرنبيط ولا فول ولا خبز متعدد</text>
<text x="676.0" y="282.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الحبوب ولا بيض ولا ألبان) ولا طعاماً عسير الهضم (فشار، بذور، مكسرات)</text>
<text x="676.0" y="302.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• سوائل 3000 مل/يوم (3 لتر)</text>
<rect x="14.0" y="329.25" width="672.0" height="117.0" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="14.0" y="329.25" width="672.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="350.0" y="347.25" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">العناية</text>
<text x="676.0" y="373.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• غسيل: 500–1000 مل ماء دافئ (لا بارد)، وعاء فوق الفغر بمستوى الكتف، أوقف السائل عند التشنج</text>
<text x="676.0" y="392.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أفرغ الكيس عند ثلثه</text>
<text x="676.0" y="411.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• نظف الجلد حول الفغر جيداً لمنع تقرحه</text>
<text x="676.0" y="431.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• خطر نفسي: اضطراب صورة الجسم</text>
<rect x="14.0" y="458.25" width="672.0" height="78.5" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="14.0" y="458.25" width="672.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="350.0" y="476.25" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">مضاعفات</text>
<text x="676.0" y="502.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• الأشيع بعد جراحة اللفائفي: اختلال سوائل وأملاح (Na وK وMg وCa)</text>
<text x="676.0" y="521.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تغير لون الفغر الأرجواني = تبليغ فوري</text>
</svg>
