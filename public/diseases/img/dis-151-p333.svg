<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="370" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">حب الشباب (Acne)</text><rect x="330" y="52" width="300" height="94.19999999999999" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الفكرة</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• انسداد الغدد الدهنية: رؤوس سوداء وبيضاء</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• وإذا استقرت البكتيريا: التهاب وبثور</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  وحطاطات (Pustules &amp; Papules)</text><rect x="10" y="52" width="310" height="111.6" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأسباب</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• البلوغ والحمل (انفجار هرموني)</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• فرط نمو البكتيريا</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الوراثة</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الإجهاد</text><rect x="330" y="171.6" width="300" height="111.6" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M330,181.6 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#dc2626"/><text x="480.0" y="190.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">تجنّب</text><text x="620" y="214.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الفرك والغسل العنيف</text><text x="620" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• العصر أو نتف الآفات</text><text x="620" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الصابون المضاد للبكتيريا</text><text x="620" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• التدخين</text><rect x="10" y="171.6" width="310" height="111.6" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M10,181.6 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#16a34a"/><text x="165.0" y="190.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">افعل</text><text x="310" y="214.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• اغسل الشعر والبشرة بانتظام وبلطف</text><text x="310" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مرطب ومنتجات «غير مسدّة للمسام»</text><text x="310" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• غذاء متوازن</text><text x="310" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• 8 أكواب ماء يوميًا</text><rect x="10" y="291.2" width="620" height="53.5" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/><text x="320" y="310.95" text-anchor="middle" font-size="12.5" font-weight="600" fill="#713f12">العلاج: تتراسيكلين وإيزوتريتينوين (Isotretinoin، من مشتقات فيتامين A). سؤال شائع:</text><text x="320" y="329.7" text-anchor="middle" font-size="12.5" font-weight="600" fill="#713f12">الامتناع عن التدخين، غسل البشرة بانتظام، ترطيب بعد الاستحمام، وشرب 8 أكواب ماء.</text></svg>