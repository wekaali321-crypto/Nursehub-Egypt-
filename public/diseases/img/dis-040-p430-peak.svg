<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 812" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="812" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مقياس ذروة التدفق ومناطقه والمحفزات</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="145" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">المنطقة الخضراء</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• أمان: الربو تحت</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">السيطرة (80–100%)</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="145" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#f59e0b"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">المنطقة الصفراء</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• غير تحت السيطرة</text><text x="408.66666666666663" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• دواء الإنقاذ كل 4</text><text x="408.66666666666663" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">ساعات لمدة 1–2 يوم</text><text x="408.66666666666663" y="163.6" text-anchor="start" font-size="13" fill="#0f172a">• أبلغ الطبيب: قد يحتاج</text><text x="408.66666666666663" y="181.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">أدوية إضافية</text><rect x="20" y="54" width="193.33333333333334" height="145" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">المنطقة الحمراء</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• طارئ: إن لم يعد للأصفر</text><text x="205.33333333333334" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">بعد دواء الإنقاذ يلزم</text><text x="205.33333333333334" y="135.4" text-anchor="start" font-size="13" fill="#0f172a">علاج فوري</text><rect x="30" y="209" width="580" height="40" rx="10" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="578" cy="229" r="14" fill="#0ea5e9"/><text x="578" y="234" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="554" y="234" text-anchor="start" font-size="13.5" fill="#0f172a">اجلس أو قف بوضع مستقيم</text><text x="320" y="260" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="263" width="580" height="40" rx="10" fill="#6366f1" fill-opacity="0.14" stroke="#6366f1" stroke-width="1.5"/><circle cx="578" cy="283" r="14" fill="#6366f1"/><text x="578" y="288" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="554" y="288" text-anchor="start" font-size="13.5" fill="#0f172a">ضع المؤشر على صفر</text><text x="320" y="314" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="317" width="580" height="40" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.5"/><circle cx="578" cy="337" r="14" fill="#f59e0b"/><text x="578" y="342" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="554" y="342" text-anchor="start" font-size="13.5" fill="#0f172a">تنفّس بعمق</text><text x="320" y="368" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="371" width="580" height="40" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="1.5"/><circle cx="578" cy="391" r="14" fill="#10b981"/><text x="578" y="396" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="554" y="396" text-anchor="start" font-size="13.5" fill="#0f172a">ضع المبسم بالفم وأحكم الشفتين</text><text x="320" y="422" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="425" width="580" height="40" rx="10" fill="#ec4899" fill-opacity="0.14" stroke="#ec4899" stroke-width="1.5"/><circle cx="578" cy="445" r="14" fill="#ec4899"/><text x="578" y="450" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">5</text><text x="554" y="450" text-anchor="start" font-size="13.5" fill="#0f172a">ازفر بأسرع وأقوى ما يمكن وسجّل القراءة</text><text x="320" y="476" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="479" width="580" height="40" rx="10" fill="#14b8a6" fill-opacity="0.14" stroke="#14b8a6" stroke-width="1.5"/><circle cx="578" cy="499" r="14" fill="#14b8a6"/><text x="578" y="504" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">6</text><text x="554" y="504" text-anchor="start" font-size="13.5" fill="#0f172a">كرّر مرتين بفاصل 5–10 ثوان</text><text x="320" y="530" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="533" width="580" height="40" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.5"/><circle cx="578" cy="553" r="14" fill="#ef4444"/><text x="578" y="558" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">7</text><text x="554" y="558" text-anchor="start" font-size="13.5" fill="#0f172a">سجّل أعلى قراءة من الثلاث</text><rect x="325" y="583" width="295" height="214.6" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="325" y="583" width="295" height="29" rx="10" fill="#f59e0b"/><text x="612" y="601" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">محفزات</text><text x="612" y="628" text-anchor="start" font-size="13" fill="#0f172a">• مواد مثيرة للحساسية (وبر، غبار، حبوب</text><text x="612" y="646.2" text-anchor="start" font-size="13" fill="#0f172a">لقاح)</text><text x="612" y="669.4" text-anchor="start" font-size="13" fill="#0f172a">• تدخين (سلبي أيضًا)</text><text x="612" y="692.6" text-anchor="start" font-size="13" fill="#0f172a">• توتر جسدي/نفسي</text><text x="612" y="715.8000000000001" text-anchor="start" font-size="13" fill="#0f172a">• مرض (إنفلونزا، التهاب علوي)</text><text x="612" y="739.0000000000001" text-anchor="start" font-size="13" fill="#0f172a">• طقس بارد شديد</text><text x="612" y="762.2000000000002" text-anchor="start" font-size="13" fill="#0f172a">• مجهود شديد (لا يُمنع؛ خذ الدواء</text><text x="612" y="780.4000000000002" text-anchor="start" font-size="13" fill="#0f172a">قبله)</text><rect x="20" y="583" width="295" height="214.6" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="20" y="583" width="295" height="29" rx="10" fill="#ef4444"/><text x="307" y="601" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">تجنب</text><text x="307" y="628" text-anchor="start" font-size="13" fill="#0f172a">• NSAIDs: naproxen وaspirin وibuprofen</text><text x="307" y="646.2" text-anchor="start" font-size="13" fill="#0f172a">وindomethacin وketorolac</text><text x="307" y="669.4" text-anchor="start" font-size="13" fill="#0f172a">• حاصرات بيتا: propranolol (غير</text><text x="307" y="687.6" text-anchor="start" font-size="13" fill="#0f172a">انتقائي) وatenolol (انتقائي)</text></svg>
