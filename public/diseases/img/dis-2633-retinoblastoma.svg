<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="320" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ورم الأرومة الشبكية Retinoblastoma</text><rect x="330" y="46" width="290" height="60" rx="10" fill="#7c3aed"/><text x="475.0" y="71.7" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">أشيع سرطان عين في الطفولة</text><text x="475.0" y="88.7" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">يُشخّص غالبًا قبل عمر سنتين</text><rect x="20" y="46" width="300" height="60" rx="10" fill="#dc2626"/><text x="170.0" y="71.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">العلامة الأولى: بؤبؤ أبيض (Leukocoria)</text><text x="170.0" y="87.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">غياب المنعكس الأحمر (يظهر في صورة الفلاش)</text><rect x="20" y="116" width="600" height="42" rx="10" fill="#fef3c7"/><text x="320.0" y="141.2" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">الحَوَل (Strabismus) أو انحراف العين علامة متأخرة</text><rect x="330" y="168" width="290" height="60" rx="10" fill="#16a34a"/><text x="475.0" y="193.7" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">العلاج</text><text x="475.0" y="210.7" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">إشعاع</text><rect x="20" y="168" width="300" height="60" rx="10" fill="#ea580c"/><text x="170.0" y="193.7" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">استئصال العين Enucleation</text><text x="170.0" y="210.7" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">ووضع طرف صناعي (Prosthesis)</text><rect x="20" y="238" width="600" height="64" rx="10" fill="#e0f2fe"/