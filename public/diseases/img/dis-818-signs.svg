<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 455" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="455" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">علامات الحمل: ثلاث درجات من اليقين</text><rect x="20.0" y="50" width="600.0" height="133" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20.0" y="50" width="600.0" height="28" rx="10" fill="#16a34a"/><text x="320.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">مفترضة (ذاتية: ربما حامل)</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• انقطاع الطمث</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• غثيان وقيء</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• شعور بحركة الجنين (Quickening)</text><text x="610.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• تكرار التبول</text><text x="610.0" y="164" font-size="12.5" fill="#0f172a" text-anchor="end">• ألم الثدي وإرهاق</text><rect x="20.0" y="195" width="600.0" height="133" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="20.0" y="195" width="600.0" height="28" rx="10" fill="#ea580c"/><text x="320.0" y="20" dy="195" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">محتملة (موضوعية: غالباً حامل)</text><text x="610.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="end">• علامة Goodell: لين عنق الرحم</text><text x="610.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">• علامة Chadwick: ازرقاق عنق الرحم/المهبل (8-10 أسابيع)</text><text x="610.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• علامة Hegar: لين الجزء السفلي من الرحم</text><text x="610.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="end">• Ballottement</text><text x="610.0" y="309" font-size="12.5" fill="#0f172a" text-anchor="end">• اختبار hCG إيجابي (قد يرتفع أيضاً في أمراض الأرومة الغاذية)</text><rect x="20.0" y="340" width="600.0" height="99" rx="10" fill="#fff" stroke="#1e3a8a" stroke-width="2"/><rect x="20.0" y="340" width="600.0" height="28" rx="10" fill="#1e3a8a"/><text x="320.0" y="20" dy="340" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">مؤكدة (تشخيصية: حامل قطعاً)</text><text x="610.0" y="386" font-size="12.5" fill="#0f172a" text-anchor="end">• نبض الجنين بالدوبلر (10-12 أسبوعاً)</text><text x="610.0" y="403" font-size="12.5" fill="#0f172a" text-anchor="end">• رؤية الجنين بالسونار</text><text x="610.0" y="420" font-size="12.5" fill="#0f172a" text-anchor="end">• حركة الجنين محسوسة أو مرئية للفاحص</text></svg>