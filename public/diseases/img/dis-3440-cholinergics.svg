<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" width="640" height="342" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="محاكيات الكولين (Cholinergics): Bethanechol وAmbenonium"><rect width="640" height="342" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">محاكيات الكولين (Cholinergics): Bethanechol وAmbenonium</text><rect x="326.0" y="46" width="302.0" height="98" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الأنواع</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• مباشرة (Direct): تقلد ACh وتقلّص عضلات</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   المثانة</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• غير مباشرة: تمدد نشاط ACh بتثبيط AChE</text><rect x="12.0" y="46" width="302.0" height="116" rx="10" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#2e7d4f"/><rect x="12.0" y="60" width="302.0" height="14" fill="#2e7d4f"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الاستعمال</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• احتباس البول غير الانسدادي (Bethanechol:</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   Duvoid/Urecholine)</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• الوهن العضلي الوبيل (Ambenonium:</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">   Mytelase)</text><rect x="326.0" y="156" width="302.0" height="98" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="326.0" y="156" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="326.0" y="170" width="302.0" height="14" fill="#b42318"/><text x="477.0" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">أزمة كولينية (Cholinergic crisis)</text><text x="616.0" y="204" text-anchor="start" font-size="12.5" fill="#1d2939">• مغص شديد، إسهال، لعاب غزير</text><text x="616.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• ضعف وتيبس وتشنج عضلي وانطباق الفك</text><text x="616.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• طوارئ: الترياق Atropine (بأمر الطبيب)</text><rect x="12.0" y="174" width="302.0" height="152" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="12.0" y="174" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="12.0" y="188" width="302.0" height="14" fill="#a86a00"/><text x="163.0" y="193" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">موانع</text><text x="302.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• الربو، قرحة الهضم، مرض شريان تاجي، فرط</text><text x="302.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">   الدرقية</text><text x="302.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• انسداد ميكانيكي هضمي أو بولي</text><text x="302.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">   (Bethanechol)</text><text x="302.0" y="294" text-anchor="start" font-size="12.5" fill="#1d2939">• جلوكوما ثانوية والتهاب القزحية وسحج</text><text x="302.0" y="312" text-anchor="start" font-size="12.5" fill="#1d2939">   القرنية (قطرات العين)</text></svg>