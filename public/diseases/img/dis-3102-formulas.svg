<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="400" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">صيغ حساب الجرعات والتنقيط</text>
  <rect x="330" y="50" width="290" height="160" rx="10" fill="#fce7f3" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">معدل التسريب mL/hr</text><text x="608" y="96" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• = الحجم الكلي ÷ عدد الساعات</text><text x="608" y="115" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• مثال: 500 mL خلال 120 دقيقة</text><text x="608" y="134" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• 120 دقيقة = ساعتان → 250 mL/hr</text><rect x="20" y="50" width="290" height="160" rx="10" fill="#fae8ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">قطرات/دقيقة gtt/min</text><text x="298" y="96" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• = (الحجم ÷ (الساعات × 60)) × معامل القطرة</text><text x="298" y="115" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• مثال: 1500 mL / 7 ساعات / معامل 20</text><text x="298" y="134" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• = 71.4 → تقريبًا 71 قطرة/دقيقة</text><rect x="330" y="225" width="290" height="160" rx="10" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="247" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الأقراص والكبسولات</text><text x="608" y="271" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• = (المطلوب ÷ المتوفر) × الوحدة</text><text x="608" y="290" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• مثال: المطلوب 50 mg والقرص 100 mg</text><text x="608" y="309" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• = 0.5 قرص (نصف قرص)</text><rect x="20" y="225" width="290" height="160" rx="10" fill="#ede9fe" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="247" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">جرعات الأطفال (بالوزن)</text><text x="298" y="271" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• الرطل ÷ 2.2 = كجم</text><text x="298" y="290" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• الوزن × الجرعة/كجم = المقدار</text><text x="298" y="309" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• قارن المجموع اليومي بالنطاق الآمن</text>
</svg>
