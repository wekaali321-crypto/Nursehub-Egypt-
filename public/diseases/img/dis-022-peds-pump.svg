<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 402" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="402" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مضخة الأنسولين والتثقيف والغذاء</text><rect x="325" y="48" width="295" height="164" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">المضخة</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">فائدتها الأولى: جرعة ثابتة وتقلب أقل في</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">السكر</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">مفيدة لمن ينسى الحقن</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">يضغط بلعة (Bolus) عند الوجبات</text><text x="610" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">الطفل لا يستطيع الاستغناء عن الأنسولين</text><rect x="20" y="48" width="295" height="164" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">التثقيف</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">من 5 سنوات يشارك في الرعاية والأهل ينقلون</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">المسؤولية تدريجيًا</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">أقل من 14 سنة: لا يعدّل الجرعة وحده</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">يتعلم أعراض الهبوط، تنظيف موضع الوخز،</text><text x="305" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">معرفة أماكن الحقن، الضغط على المكبس بعد</text><text x="305" y="200" text-anchor="start" font-size="12.5" fill="#1e293b">تثبيت الأهل للإبرة</text><rect x="325" y="222" width="295" height="164" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="222" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الغذاء</text><text x="610" y="274" text-anchor="start" font-size="12.5" fill="#1e293b">قليل السكر وسعرات وكربوهيدرات بسيطة</text><text x="610" y="294" text-anchor="start" font-size="12.5" fill="#1e293b">تجنب: صودا، حلوى، عصائر، خبز أبيض</text><text x="610" y="314" text-anchor="start" font-size="12.5" fill="#1e293b">الأفضل: ألياف وبني (فول، أرز بني، خبز</text><text x="610" y="334" text-anchor="start" font-size="12.5" fill="#1e293b">كامل)</text><text x="610" y="354" text-anchor="start" font-size="12.5" fill="#1e293b">وجبة خفيفة بالليل لـ NPH: كربوهيدرات معقدة</text><text x="610" y="374" text-anchor="start" font-size="12.5" fill="#1e293b">+ بروتين</text>
</svg>
