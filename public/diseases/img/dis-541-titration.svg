<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" direction="rtl" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="330" rx="12" fill="#f7fafc"/><text x="320" y="30" font-size="17" fill="#1a202c" text-anchor="middle" font-weight="bold">تعديل الجرعة: السكر المرتفع يدل على الجرعة السابقة له</text><rect x="20" y="50" width="600" height="42" rx="8" fill="#fff" stroke="#a0aec0" stroke-width="1.5"/><text x="560" y="77" font-size="14" fill="#2c5282" text-anchor="start" font-weight="bold">سكر الصايم عالي</text><text x="300" y="77" font-size="13" fill="#1a202c" text-anchor="start" font-weight="normal">جرعة الليل: N أو Lantus أو جرعة المساء من الأقراص/Mixtard</text><rect x="20" y="98" width="600" height="42" rx="8" fill="#fff" stroke="#a0aec0" stroke-width="1.5"/><text x="560" y="125" font-size="14" fill="#2c5282" text-anchor="start" font-weight="bold">قبل الغدا عالي (لوحده)</text><text x="300" y="125" font-size="13" fill="#1a202c" text-anchor="start" font-weight="normal">R الفطار (أو جرعة الصبح من المخلوط)</text><rect x="20" y="146" width="600" height="42" rx="8" fill="#fff" stroke="#a0aec0" stroke-width="1.5"/><text x="560" y="173" font-size="14" fill="#2c5282" text-anchor="start" font-weight="bold">قبل العشا عالي (لوحده)</text><text x="300" y="173" font-size="13" fill="#1a202c" text-anchor="start" font-weight="normal">R الغدا</text><rect x="20" y="194" width="600" height="42" rx="8" fill="#fff" stroke="#a0aec0" stroke-width="1.5"/><text x="560" y="221" font-size="14" fill="#2c5282" text-anchor="start" font-weight="bold">قبل الغدا والعشا عاليين</text><text x="300" y="221" font-size="13" fill="#1a202c" text-anchor="start" font-weight="normal">N الصبح</text><rect x="20" y="242" width="600" height="42" rx="8" fill="#fff" stroke="#a0aec0" stroke-width="1.5"/><text x="560" y="269" font-size="14" fill="#2c5282" text-anchor="start" font-weight="bold">كل القراءات عالية</text><text x="300" y="269" font-size="13" fill="#1a202c" text-anchor="start" font-weight="normal">راجع الأكل أولاً ثم الجرعة الكلية</text><text x="320" y="312" font-size="13" fill="#c53030" text-anchor="middle" font-weight="normal">قبل تعديل أي جرعة: اسأل عن هبوط الليل والأكل (هبوط ثم ارتفاع ارتدادي Somogyi)</text></svg>