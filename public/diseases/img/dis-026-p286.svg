<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 306" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="700" height="306" rx="16" fill="#f8fafc"/>
<text x="350.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">السكر الكاذب DI: "جفاف داخلي"</text>
<rect x="356.0" y="52" width="330.0" height="163.5" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="356.0" y="52" width="330.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="521.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأعراض والمعمل</text>
<text x="676.0" y="96" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• بول كثير جداً مخفف (وزن نوعي 1.005)</text>
<text x="676.0" y="114.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• ارتفاع أسمولية الدم وصوديوم فوق 145</text>
<text x="676.0" y="133.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• عطش شديد وجفاف أغشية وجلد</text>
<text x="676.0" y="151.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• هبوط ضغط (خطر)</text>
<text x="676.0" y="170.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• الصداع علامة؛ الصوديوم المنخفض خطر تشنج</text>
<rect x="14.0" y="52" width="330.0" height="163.5" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="14.0" y="52" width="330.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="179.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">العلاج والسبب</text>
<text x="334.0" y="96" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• السبب: تلف دماغي (أورام، رضوض، جراحة)</text>
<text x="334.0" y="114.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• ديسموبريسين/فازوبريسين (ADH صناعي) يقلل البول</text>
<text x="334.0" y="131.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">ويرفع الضغط</text>
<text x="334.0" y="149.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• أسئلة: ورم دماغ → ارتفاع أسمولية وعطش؛ لا بول</text>
<text x="334.0" y="166.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">داكن ولا وزن زائد</text>
<text x="334.0" y="184.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• تثقيف: صداع ليس طبيعياً؛ لا تقيّد الماء؛ سجّل</text>
<text x="334.0" y="201.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">البول؛ زن نفسك</text>
<rect x="14" y="233.5" width="672" height="50.5" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.4"/>
<text x="674" y="253.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الفرق الجوهري: SIADH احتباس ماء (صوديوم منخفض، بول قليل كثيف)، وDI فقد ماء (صوديوم مرتفع، بول كثير</text>
<text x="674" y="270.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">مخفف).</text>
</svg>
