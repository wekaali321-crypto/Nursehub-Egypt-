<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 303" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="303" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">مستويات العلاج في التيتانوس (حسب المصدر)</text><g text-anchor="middle"><rect x="80" y="46" width="480" height="74" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="320" y="68" font-size="14" font-weight="800" fill="#1e3a8a">كل الحالات</text><text x="320" y="86" font-size="12" font-weight="600" fill="#1e3a8a">تنظيف الجرح وفتحه + مضاد السم (TIG/TAT) + مضاد حيوي + مهدئ</text><text x="320" y="103" font-size="12" font-weight="600" fill="#1e3a8a">للتشنج</text><path d="M320 120 V136" stroke="#64748b" stroke-width="3"/><path d="M314 130 L320 137 L326 130" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="138" width="480" height="57" rx="10" fill="#fef9c3" stroke="#eab308"/><text x="320" y="160" font-size="14" font-weight="800" fill="#422006">حالات متوسطة (+)</text><text x="320" y="178" font-size="12" font-weight="600" fill="#422006">شق القصبة (Tracheostomy) + مراقبة ضغط الدم + تنفس صناعي</text><path d="M320 195 V211" stroke="#64748b" stroke-width="3"/><path d="M314 205 L320 212 L326 205" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="213" width="480" height="74" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="320" y="235" font-size="14" font-weight="800" fill="#7f1d1d">حالات شديدة (++)</text><text x="320" y="253" font-size="12" font-weight="600" fill="#7f1d1d">قسطرة المثانة + Pavulon بالتنقيط لإرخاء العضلات + غرفة هادئة</text><text x="320" y="270" font-size="12" font-weight="600" fill="#7f1d1d">معتمة</text></g></svg>