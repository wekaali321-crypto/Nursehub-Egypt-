<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="200" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مثلث كوشينج: علامة متأخرة خطيرة لارتفاع ICP</text><rect x="429" y="56" width="195" height="128" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><rect x="429" y="56" width="195" height="30" rx="12" fill="#dc2626"/><text x="527" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ارتفاع الضغط</text><text x="614" y="108" text-anchor="start" font-size="13" fill="#7f1d1d">ضغط انقباضي مرتفع</text><text x="614" y="127" text-anchor="start" font-size="13" fill="#7f1d1d">يتسع الفرق بين الانقباضي</text><text x="614" y="146" text-anchor="start" font-size="13" fill="#7f1d1d">والانبساطي (Widening pulse</text><text x="614" y="165" text-anchor="start" font-size="13" fill="#7f1d1d">pressure)</text><rect x="223" y="56" width="195" height="128" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><rect x="223" y="56" width="195" height="30" rx="12" fill="#d97706"/><text x="320" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">بطء القلب</text><text x="407" y="108" text-anchor="start" font-size="13" fill="#78350f">النبض ينخفض (Bradycardia)</text><rect x="16" y="56" width="195" height="128" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><rect x="16" y="56" width="195" height="30" rx="12" fill="#7c3aed"/><text x="113" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">بطء/عدم انتظام التنفس</text><text x="201" y="108" text-anchor="start" font-size="13" fill="#4c1d95">تنفس بطيء أو غير منتظم، قد</text><text x="201" y="127" text-anchor="start" font-size="13" fill="#4c1d95">يظهر Cheyne-Stokes</text></svg>