<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="300" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">الفرق بين الحصبة والحصبة الألمانية</text><g text-anchor="middle"><rect x="420" y="46" width="200" height="30" fill="#0f172a" stroke="#f8fafc"/><text x="520" y="66" font-size="13" font-weight="800" fill="#fff"></text><rect x="220" y="46" width="200" height="30" fill="#0f172a" stroke="#f8fafc"/><text x="320" y="66" font-size="13" font-weight="800" fill="#fff">الحصبة (Measles)</text><rect x="20" y="46" width="200" height="30" fill="#0f172a" stroke="#f8fafc"/><text x="120" y="66" font-size="13" font-weight="800" fill="#fff">الحصبة الألماني (Rubella)</text><rect x="420" y="76" width="200" height="29" fill="#ffffff" stroke="#cbd5e1"/><text x="520" y="96" font-size="12" font-weight="800" fill="#0f172a">فترة الحضانة</text><rect x="220" y="76" width="200" height="29" fill="#ffffff" stroke="#cbd5e1"/><text x="320" y="96" font-size="12" font-weight="600" fill="#0f172a">10–14 يوم</text><rect x="20" y="76" width="200" height="29" fill="#ffffff" stroke="#cbd5e1"/><text x="120" y="96" font-size="12" font-weight="600" fill="#0f172a">14–20 يوم</text><rect x="420" y="105" width="200" height="29" fill="#f1f5f9" stroke="#cbd5e1"/><text x="520" y="125" font-size="12" font-weight="800" fill="#0f172a">المسار</text><rect x="220" y="105" width="200" height="29" fill="#f1f5f9" stroke="#cbd5e1"/><text x="320" y="125" font-size="12" font-weight="600" fill="#0f172a">شديد</text><rect x="20" y="105" width="200" height="29" fill="#f1f5f9" stroke="#cbd5e1"/><text x="120" y="125" font-size="12" font-weight="600" fill="#0f172a">خفيف</text><rect x="420" y="134" width="200" height="46" fill="#ffffff" stroke="#cbd5e1"/><text x="520" y="154" font-size="12" font-weight="800" fill="#0f172a">فترة ما قبل الطفح</text><rect x="220" y="134" width="200" height="46" fill="#ffffff" stroke="#cbd5e1"/><text x="320" y="154" font-size="12" font-weight="600" fill="#0f172a">حمى، رشح، كحة، التهاب</text><text x="320" y="171" font-size="12" font-weight="600" fill="#0f172a">ملتحمة، بقع كوبليك</text><rect x="20" y="134" width="200" height="46" fill="#ffffff" stroke="#cbd5e1"/><text x="120" y="154" font-size="12" font-weight="600" fill="#0f172a">غير موجودة غالباً</text><rect x="420" y="180" width="200" height="46" fill="#f1f5f9" stroke="#cbd5e1"/><text x="520" y="200" font-size="12" font-weight="800" fill="#0f172a">الطفح</text><rect x="220" y="180" width="200" height="46" fill="#f1f5f9" stroke="#cbd5e1"/><text x="320" y="200" font-size="12" font-weight="600" fill="#0f172a">يتقشر ويترك لوناً بنياً</text><rect x="20" y="180" width="200" height="46" fill="#f1f5f9" stroke="#cbd5e1"/><text x="120" y="200" font-size="12" font-weight="600" fill="#0f172a">يزول في 3 أيام بدون تقشر أو</text><text x="120" y="217" font-size="12" font-weight="600" fill="#0f172a">تصبغ</text><rect x="420" y="226" width="200" height="29" fill="#ffffff" stroke="#cbd5e1"/><text x="520" y="246" font-size="12" font-weight="800" fill="#0f172a">تضخم الغدد</text><rect x="220" y="226" width="200" height="29" fill="#ffffff" stroke="#cbd5e1"/><text x="320" y="246" font-size="12" font-weight="600" fill="#0f172a">لا</text><rect x="20" y="226" width="200" height="29" fill="#ffffff" stroke="#cbd5e1"/><text x="120" y="246" font-size="12" font-weight="600" fill="#0f172a">موجود</text><rect x="420" y="255" width="200" height="29" fill="#f1f5f9" stroke="#cbd5e1"/><text x="520" y="275" font-size="12" font-weight="800" fill="#0f172a">الحمل</text><rect x="220" y="255" width="200" height="29" fill="#f1f5f9" stroke="#cbd5e1"/><text x="320" y="275" font-size="12" font-weight="600" fill="#0f172a">أقل خطورة على الجنين</text><rect x="20" y="255" width="200" height="29" fill="#f1f5f9" stroke="#cbd5e1"/><text x="120" y="275" font-size="12" font-weight="600" fill="#0f172a">شديد الخطورة (عيوب