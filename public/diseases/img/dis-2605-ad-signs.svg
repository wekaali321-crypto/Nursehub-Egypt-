<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="330" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">انعكاس ذاتي: ما فوق الإصابة وما تحتها (إصابة فوق T6)</text><rect x="20" y="50" width="300" height="120" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="170.0" y="80.2" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">فوق مستوى الإصابة (نظير الودّي يعمل)</text><text x="170.0" y="97.2" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">صداع نابض شديد</text><text x="170.0" y="114.2" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">بطء قلب أقل من 60</text><text x="170.0" y="131.2" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">تعرق واحمرار الوجه + احتقان أنف</text><text x="170.0" y="148.2" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">قشعريرة Piloerection</text><rect x="330" y="50" width="290" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="475.0" y="88.7" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">تحت مستوى الإصابة (الودّي)</text><text x="475.0" y="105.7" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">انقباض الأوعية</text><text x="475.0" y="122.7" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">ضغط يصل نحو 300 انقباضي</text><text x="475.0" y="139.7" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">جلد بارد شاحب</text><text x="320" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">المحفزات: مثانة ممتلئة/قسطرة منحنية • إمساك • ملابس ضيقة</text><rect x="20" y="218" width="600" height="100" rx="10" fill="#fef3c7"/><text x="320.0" y="255.2" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">الأولوية: عالج السبب أولًا</text><text x="320.0" y="272.2" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">اجلس المريض ورفع الرأس ثم افحص المثانة (جس/ماسح/التواء القسطرة) والأمعاء وأزل الضيق</text><text x="320.0" y="289.2" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">ثم قِس الضغط وأبلغ الطبيب، والأدوية بعد التقييم</text></svg>