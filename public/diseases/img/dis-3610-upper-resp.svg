<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="360" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أدوية الجهاز التنفسي العلوي</text><rect x="470.0" y="48" width="150.0" height="28.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="545.0" y="67.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">الدواء</text><rect x="320.0" y="48" width="150.0" height="28.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="395.0" y="67.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">الفئة</text><rect x="20.0" y="48" width="300.0" height="28.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="170.0" y="67.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">الملاحظة الأهم</text><rect x="470.0" y="76.5" width="150.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="545.0" y="96.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">guaifenesin (Mucinex)</text><rect x="320.0" y="76.5" width="150.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="395.0" y="96.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">مقشع</text><rect x="20.0" y="76.5" width="300.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="170.0" y="96.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">يرقق المخاط؛ زِد السوائل لـ 2 لتر/يوم على</text><text x="170.0" y="114.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الأقل؛ آمن للربو</text><rect x="470.0" y="123.5" width="150.0" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="545.0" y="143.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">acetylcysteine</text><text x="545.0" y="161.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">(Mucomyst)</text><rect x="320.0" y="123.5" width="150.0" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="395.0" y="143.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">مقشع/ترياق</text><text x="395.0" y="161.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">باراسيتامول</text><rect x="20.0" y="123.5" width="300.0" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="170.0" y="143.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">غير آمن للربو: قد يسبب أو يزيد تشنج</text><text x="170.0" y="161.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">القصبات</text><rect x="470.0" y="170.5" width="150.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="545.0" y="190.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">codeine</text><rect x="320.0" y="170.5" width="150.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="395.0" y="190.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">مثبط سعال</text><rect x="20.0" y="170.5" width="300.0" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="170.0" y="190.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تغيير الوضع ببطء، ليس لـ COPD، مع الطعام،</text><text x="170.0" y="208.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">سوائل 8 أكواب على الأقل</text><rect x="470.0" y="217.5" width="150.0" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="545.0" y="237.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">diphenhydramine</text><text x="545.0" y="255.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">(Benadryl)</text><rect x="320.0" y="217.5" width="150.0" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="395.0" y="237.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">مضاد هستامين مهدئ</text><rect x="20.0" y="217.5" width="300.0" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="170.0" y="237.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">ممنوع: جلوكوما زاوية ضيقة، احتباس بول،</text><text x="170.0" y="255.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">قرحة، انسداد معوي؛ يسبب نعاسًا فلا قيادة</text><rect x="470.0" y="264.5" width="150.0" height="28.5" fill="#fff" stroke="#cbd5e1"/><text x="545.0" y="284.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">loratadine (Claritin)</text><rect x="320.0" y="264.5" width="150.0" height="28.5" fill="#fff" stroke="#cbd5e1"/><text x="395.0" y="284.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">مضاد هستامين</text><rect x="20.0" y="264.5" width="300.0" height="28.5" fill="#fff" stroke="#cbd5e1"/><text x="170.0" y="284.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">نعاس أقل</text><rect x="470.0" y="293.0" width="150.0" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="545.0" y="312.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">fexofenadine</text><text x="545.0" y="331.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">(Allegra)</text><rect x="320.0" y="293.0" width="150.0" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="395.0" y="312.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">مضاد هستامين</text><rect x="20.0" y="293.0" width="300.0" height="47.0" fill="#eef2ff" stroke="#cbd5e1"/><text x="170.0" y="312.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">لا للجلوكوما (تأثير مضاد للكولين يرفع ضغط</text><text x="170.0" y="331.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">العين)</text></svg>