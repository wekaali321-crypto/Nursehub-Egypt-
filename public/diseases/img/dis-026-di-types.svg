<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="260" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">السكر الكاذب (Diabetes insipidus): نوعان</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="330" y="48" width="290" height="130" rx="12" fill="#dbeafe"/><text x="475" y="74" fill="#1e3a8a">مركزي (Cranial)</text><text x="475" y="98" font-size="12" font-weight="400" fill="#1e3a8a">الغدة النخامية مش بتفرز ADH</text><text x="475" y="120" font-size="12" font-weight="400" fill="#1e3a8a">العلاج: Desmopressin (Minirin)</text><text x="475" y="142" font-size="12" font-weight="400" fill="#1e3a8a">0.1 أو 0.2 مجم، من مرة لـ 3 مرات يومياً</text>
    <rect x="20" y="48" width="290" height="130" rx="12" fill="#fef3c7"/><text x="165" y="74" fill="#78350f">كلوي (Nephrogenic)</text><text x="165" y="98" font-size="12" font-weight="400" fill="#78350f">الكلى مش بتستجيب لـ ADH</text><text x="165" y="120" font-size="12" font-weight="400" fill="#78350f">Desmopressin (Minirin) نفس الجرعة</text><text x="165" y="142" font-size="12" font-weight="400" fill="#78350f">+ مدر ثيازيدي (Natrilix) مرة يومياً</text>
  </g>
  <rect x="20" y="195" width="600" height="50" rx="12" fill="#e2e8f0"/>
  <text x="320" y="218" text-anchor="middle" font-size="13" fill="#0f172a">الاثنين: تبول غزير (10–15 لتر/يوم) + عطش + جفاف، والبول مخفف جداً</text>
  <text x="320" y="236" text-anchor="middle" font-size="12" fill="#475569">اختبار الحرمان من الماء يفرّق: الكثافة ما تزيدش، وتزيد بعد الهرمون في النوع المركزي</text>
</svg>
