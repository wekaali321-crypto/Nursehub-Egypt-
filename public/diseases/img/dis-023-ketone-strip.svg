<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="230" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قراءة شريط الأسيتون في البول (طريقة الميدان)</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="30" y="50" width="130" height="90" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><rect x="60" y="62" width="70" height="30" rx="4" fill="#fde68a"/><text x="95" y="118" fill="#0f172a">سالب</text><text x="95" y="134" font-size="11" font-weight="400" fill="#475569">لون الشريط ما اتغيرش</text>
    <rect x="175" y="50" width="130" height="90" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><rect x="205" y="62" width="70" height="30" rx="4" fill="#f9a8d4"/><text x="240" y="118" fill="#0f172a">(+)</text><text x="240" y="134" font-size="11" font-weight="400" fill="#475569">لون موف / وردي</text>
    <rect x="320" y="50" width="130" height="90" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><rect x="350" y="62" width="70" height="30" rx="4" fill="#9333ea"/><text x="385" y="118" fill="#0f172a">(++)</text><text x="385" y="134" font-size="11" font-weight="400" fill="#475569">بنفسجي</text>
    <rect x="465" y="50" width="145" height="90" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><rect x="502" y="62" width="70" height="30" rx="4" fill="#3b0764"/><text x="537" y="118" fill="#0f172a">(+++)</text><text x="537" y="134" font-size="11" font-weight="400" fill="#475569">بنفسجي غامق / أسود</text>
  </g>
  <text x="320" y="175" text-anchor="middle" font-size="13" fill="#0f172a">الخطوات: عينة بول ← غمس الشريط ← انتظر الوقت المكتوب على العلبة ← قارن بالجدول</text>
  <text x="320" y="200" text-anchor="middle" font-size="12" fill="#64748b">ألوان مختلف حسب الشركة؛ اعتمد على مفتاح الألوان في علبة الشرائط</text>
</svg>
