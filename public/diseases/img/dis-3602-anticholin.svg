<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 273" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="273" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مضادات الكولين (benztropine، atropine)</text><rect x="326.0" y="48" width="294.0" height="96.5" rx="10" fill="#fff" stroke="#1e3a8a" stroke-width="2"/><rect x="326.0" y="48" width="294.0" height="28" rx="10" fill="#1e3a8a"/><text x="473.0" y="67" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الآلية</text><text x="610.0" y="96.5" text-anchor="start" font-size="12.5" fill="#0f172a">• تغلق الجهاز نظير الودي (PNS) بمنع</text><text x="610.0" y="114.0" text-anchor="start" font-size="12.5" fill="#0f172a">المبهم</text><text x="610.0" y="131.5" text-anchor="start" font-size="12.5" fill="#0f172a">• فيغلب الودي: يسرّع القلب ويجفف الجسم</text><rect x="20.0" y="48" width="294.0" height="96.5" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="20.0" y="48" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="167.0" y="67" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الاستطبابات</text><text x="304.0" y="96.5" text-anchor="start" font-size="12.5" fill="#0f172a">• بطء القلب العرضي (atropine)</text><text x="304.0" y="114.0" text-anchor="start" font-size="12.5" fill="#0f172a">• ترياق الأزمة الكولينية</text><text x="304.0" y="131.5" text-anchor="start" font-size="12.5" fill="#0f172a">• رعاش باركنسون (benztropine)</text><rect x="326.0" y="156.5" width="294.0" height="96.5" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><rect x="326.0" y="156.5" width="294.0" height="28" rx="10" fill="#b91c1c"/><text x="473.0" y="175.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">موانع/حذر</text><text x="610.0" y="205.0" text-anchor="start" font-size="12.5" fill="#0f172a">• انسداد معوي</text><text x="610.0" y="222.5" text-anchor="start" font-size="12.5" fill="#0f172a">• جلوكوما زاوية ضيقة</text><text x="610.0" y="240.0" text-anchor="start" font-size="12.5" fill="#0f172a">• تضخم البروستاتا واحتباس البول</text><rect x="20.0" y="156.5" width="294.0" height="96.5" rx="10" fill="#fff" stroke="#15803d" stroke-width="2"/><rect x="20.0" y="156.5" width="294.0" height="28" rx="10" fill="#15803d"/><text x="167.0" y="175.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">تثقيف</text><text x="304.0" y="205.0" text-anchor="start" font-size="12.5" fill="#0f172a">• أبلغ عن احتباس البول</text><text x="304.0" y="222.5" text-anchor="start" font-size="12.5" fill="#0f172a">• قلة التعرق: لا تتعرض للحرارة</text><text x="304.0" y="240.0" text-anchor="start" font-size="12.5" fill="#0f172a">• قم ببطء</text></svg>