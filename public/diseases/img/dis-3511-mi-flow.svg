<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="470" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الاحتشاء: العلاج والتمريض وما بعده</text><rect x="330" y="45" width="295" height="110" rx="10" fill="#fee2e2"/><text x="477.5" y="69" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">أثناء النوبة (MONA)</text><text x="477.5" y="87" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">O: أكسجين (حسب SpO₂)</text><text x="477.5" y="105" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">A: أسبرين</text><text x="477.5" y="123" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">N: نيترو تحت اللسان</text><text x="477.5" y="141" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">M: مورفين لتسكين الألم</text><rect x="15" y="45" width="305" height="110" rx="10" fill="#fef9c3"/><text x="167.5" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">تشخيص</text><text x="167.5" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">1: ECG: ارتفاع/انخفاض ST</text><text x="167.5" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">2: التروبونين (أعلى من 0.5 ng/mL حسب المراجع)</text><text x="167.5" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">CK-MB، ميوغلوبين، CRP</text><rect x="330" y="175" width="295" height="120" rx="10" fill="#dbeafe"/><text x="477.5" y="204" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">بعد الجلطة: دعم القلب</text><text x="477.5" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تثبيت الجلطة (heparin)</text><text x="477.5" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">حاصرات بيتا -olol</text><text x="477.5" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">حاصرات الكالسيوم، النترات</text><text x="477.5" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">ACE (-pril) / ARB (-sartan)</text><rect x="15" y="175" width="305" height="120" rx="10" fill="#dcfce7"/><text x="167.5" y="204" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">الكوليسترول (حدود مرغوبة)</text><text x="167.5" y="222" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">الكلي ≤ 200</text><text x="167.5" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">TG ≤ 150</text><text x="167.5" y="258" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">LDL ≤ 100</text><text x="167.5" y="276" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">HDL ≥ 40</text><rect x="15" y="320" width="610" height="130" rx="10" fill="#ede9fe"/><text x="320" y="363" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">مضاعفات: حادة (أسابيع): صدمة قلبية، VF/VT بلا نبض (صدمة غير متزامنة)</text><text x="320" y="381" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">مزمنة: فشل القلب (زيادة وزن سريعة، خراخر رئوية، وذمة)</text><text x="320" y="399" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">الأولوية: مدرات وريدية furosemide / bumetanide (وليس isosorbide)</text><text x="320" y="417" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تثقيف DRESS: حمية قليلة الملح والسوائل، راحة من الضغط، رياضة، إقلاع عن التدخين، العلاقة بدون ضيق نفس</text></svg>