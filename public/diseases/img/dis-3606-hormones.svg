<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 227" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="227" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أعراض زيادة ونقص الهرمونات في وسائل منع الحمل</text><rect x="510.9" y="48" width="109.1" height="28.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="565.5" y="67.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">الهرمون</text><rect x="238.2" y="48" width="272.7" height="28.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="374.5" y="67.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">زيادة</text><rect x="20.0" y="48" width="218.2" height="28.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="129.1" y="67.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">نقص</text><rect x="510.9" y="76.5" width="109.1" height="65.5" fill="#fff" stroke="#cbd5e1"/><text x="565.5" y="96.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الإستروجين</text><rect x="238.2" y="76.5" width="272.7" height="65.5" fill="#fff" stroke="#cbd5e1"/><text x="374.5" y="96.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">غثيان، انتفاخ، إفرازات عنق الرحم،</text><text x="374.5" y="114.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">سلائل، ارتفاع ضغط، صداع نصفي، ألم ثدي،</text><text x="374.5" y="133.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">وذمة</text><rect x="20.0" y="76.5" width="218.2" height="65.5" fill="#fff" stroke="#cbd5e1"/><text x="129.1" y="96.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">نزف اختراقي مبكر أو منتصف</text><text x="129.1" y="114.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الدورة، تنقيط، قلة الطمث، كلف</text><text x="129.1" y="133.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">(melasma)</text><rect x="510.9" y="142.0" width="109.1" height="65.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="565.5" y="161.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">البروجستين</text><rect x="238.2" y="142.0" width="272.7" height="65.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="374.5" y="161.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">زيادة شهية ووزن، تعب، قلة طمث، حب</text><text x="374.5" y="180.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">شباب، شعر دهني، تساقط شعر، شعرانية،</text><text x="374.5" y="198.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">اكتئاب، فطريات مهبل، انحسار ثدي</text><rect x="20.0" y="142.0" width="218.2" height="65.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="129.1" y="161.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">نزف اختراقي متأخر، انقطاع طمث،</text><text x="129.1" y="180.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">قلة طمث</text></svg>