ext x="160" y="113" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="normal">N</text><text x="60" y="175" font-size="14" fill="#9c4221" text-anchor="middle" font-weight="bold">Lantus &amp; R</text><rect x="465" y="155" width="110" height="36" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5"/><text x="520" y="178" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="normal">R</text><rect x="345" y="155" width="110" height="36" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5"/><text x="400" y="178" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="normal">R</text><rect x="225" y="155" width="110" height="36" rx="8" fill="#c6f6d5" stroke="#38a169" stroke-width="1.5"/><text x="280" y="178" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="normal">R</text><rect x="105" y="155" width="110" height="36" rx="8" fill="#fbd38d" stroke="#dd6b20" stroke-width="1.5"/><text x="160" y="178" font-size="14" fill="#1a202c" text-anchor="middle" font-weight="normal">Lantus</text><text x="320" y="225" font-size="12" fill="#4a5568" text-anchor="middle" font-weight="normal">R = إنسولين قصير (Humulin R / Actrapid) · N = متوسط (Humulin N / Insulatard) · Lantus = طويل</text><text x="320" y="250" font-size="13" fill="#c53030" text-anchor="middle" font-weight="normal">مثال طفل 40 كجم: الجرعة الكلية 0.5 × 40 = 20 وحدة ← 50% أساسي (10) + 50% وجبات (10)</text></svg>