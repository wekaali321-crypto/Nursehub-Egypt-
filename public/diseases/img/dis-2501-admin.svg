<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="560" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">إعطاء الدم ومشتقاته: التقييم والمخاطر والمحاليل</text>
  <rect x="20" y="50" width="600" height="80" rx="10" fill="#cffafe" stroke="#06b6d4" stroke-width="1.5"/><text x="320" y="76" text-anchor="middle" font-size="12" font-weight="500" fill="#1e293b">الغرض: كرات حمراء للنزف وفقر الدم والأزمة المنجلية، بلازما طازجة لعكس مضادات التجلط، صفائح لمنع النزف</text><text x="320" y="98" text-anchor="middle" font-size="12" font-weight="500" fill="#1e293b">يتحقق من التوافق شخصان مؤهلان؛ اسأل عن تفاعل سابق؛ منتجات مُشعّعة لضعيفي المناعة</text><rect x="330" y="145" width="290" height="190" rx="10" fill="#ede9fe" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="167" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">التقييم</text><text x="608" y="191" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• المعتقدات الثقافية والدينية (مثل شهود يهوه)</text><text x="608" y="216" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• الموافقة المستنيرة</text><text x="608" y="241" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• العلامات الحيوية والكلى والرئة والمختبر</text><text x="608" y="266" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• الحرارة: الحمى قد توقف النقل</text><text x="608" y="291" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• راقب كل 15 دقيقة أول ساعة</text><rect x="20" y="145" width="290" height="190" rx="10" fill="#fed7aa" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="167" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">المخاطر</text><text x="298" y="191" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• عدوى، تفاعل انحلالي، إنتان</text><text x="298" y="216" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• زيادة الحديد</text><text x="298" y="241" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• نقل أمراض</text><text x="298" y="266" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• حمل زائد على الدورة</text><text x="298" y="291" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• اضطراب الأملاح</text><rect x="330" y="350" width="290" height="195" rx="10" fill="#fef9c3" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="372" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">العدة</text><text x="608" y="396" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• ملح 0.9% كيس 250 مل</text><text x="608" y="421" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• طقم دم بفلتر وفرع Y</text><text x="608" y="446" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• قفازات، مضخة غالبًا، مدفئ دم عند اللزوم</text><rect x="20" y="350" width="290" height="195" rx="10" fill="#bfdbfe" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="372" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">ملاحظة مهمة</text><text x="298" y="396" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• فقط محلول ملح متساوي التوتر</text><text x="298" y="421" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• الجلوكوز يحلل الكرات</text><text x="298" y="446" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• كالسيوم رينجر يسبب تخثرًا</text><text x="298" y="471" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• لا تسخّن الدم بماء ساخن أو ميكروويف</text>
</svg>
