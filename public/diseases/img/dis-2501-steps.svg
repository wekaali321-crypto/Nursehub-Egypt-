<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 496" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="496" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">خمس خطوات للنقل الآمن + النقل الذاتي</text><rect x="10" y="52" width="620" height="114.5" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h600 a10,10 0 0 1 10,10 v18 h-620 z" fill="#0369a1"/><text x="320.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">قبل النقل</text><text x="620" y="95" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a">• 1) ممرضان مرخّصان يتحققان من الأمر والاسم والمنتج (فصيلة وRh)</text><text x="620" y="113.125" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a">• 2) علامات حيوية أساسية (وتُكرَّر كل 15 دقيقة في أول ساعة)</text><text x="620" y="131.25" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a">• 3) تجهيز: كانيولا 18G + أنبوبان: أنبوب دم بفلتر + محلول 0.9% صوديوم كلوريد فقط</text><text x="620" y="149.375" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a">• لا رينجر لاكتات ولا دكستروز</text><rect x="10" y="174.5" width="620" height="78.25" rx="10" fill="#fff" stroke="#d97706" stroke-width="1.5"/><path d="M10,184.5 a10,10 0 0 1 10,-10 h600 a10,10 0 0 1 10,10 v18 h-620 z" fill="#d97706"/><text x="320.0" y="193.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">أثناء النقل</text><text x="620" y="217.5" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a">• 4) ابقَ بجانب المريض أول 15 دقيقة</text><text x="620" y="235.625" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a">• لو ظهر تفاعل: أبطئ أو أوقف النقل</text><rect x="10" y="260.75" width="620" height="60.125" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M10,270.75 a10,10 0 0 1 10,-10 h600 a10,10 0 0 1 10,10 v18 h-620 z" fill="#16a34a"/><text x="320.0" y="279.75" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">بعد النقل</text><text x="620" y="303.75" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a">• 5) اغسل الخط بمحلول 0.9% صوديوم كلوريد</text><rect x="10" y="328.875" width="620" height="120" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text x="320" y="350.875" text-anchor="middle" font-size="14" font-weight="800" fill="#9a3412">النقل الذاتي (Autologous)</text><text x="606" y="374.875" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a">• دم يُجمَع من المريض نفسه ويُعاد له عند الحاجة</text><text x="606" y="393.875" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a">• مناسب لمن يرفض دم الغير (مثل شهود يهوه)</text><text x="606" y="412.875" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a">• يُخزَّن مجمدًا حتى 3 سنوات تقريبًا</text><text x="606" y="431.875" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a">• لا يرفضه جهاز المناعة لأنه دمه هو</text><text x="320" y="468.875" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">سؤال شائع: أول إجراء قبل النقل = التحقق من الفصيلة وعدد الوحدات مع ممرض آخر</text></svg>