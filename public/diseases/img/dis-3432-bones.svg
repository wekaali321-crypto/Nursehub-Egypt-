<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 232" width="640" height="232" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="أدوية العظام: Calcium وBisphosphonates"><rect width="640" height="232" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">أدوية العظام: Calcium وBisphosphonates</text><rect x="326.0" y="46" width="302.0" height="152" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Calcium carbonate</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• هشاشة العظام وصحة العظام</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• جرعات مقسمة: أقل من 500 ملغ في المرة</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• أكثر من 500 ملغ في وقت واحد لا يُمتص</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• لا حاجة لتحاليل متكررة</text><text x="616.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• إمساك متوقع: أكثر السوائل والمشي</text><text x="616.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">• Ca مرتفع = أمعاء صلبة (وسيلتنا)</text><rect x="12.0" y="46" width="302.0" height="170" rx="10" fill="#e0f5f3" stroke="#14756c" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#14756c"/><rect x="12.0" y="60" width="302.0" height="14" fill="#14756c"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">-dronate: Alendronate وRisedronate</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• هشاشة العظام</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• تثبط امتصاص العظم بتقليل الخلايا الكاسرة</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">   (Osteoclasts)</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• معدة فارغة</text><text x="302.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• 8 أونصات ماء (كوب كامل)</text><text x="302.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">• التهاب مريء: ابقَ جالسًا 30 دقيقة</text><text x="302.0" y="202" text-anchor="start" font-size="12.5" fill="#1d2939">• راقب كثافة العظم</text></svg>