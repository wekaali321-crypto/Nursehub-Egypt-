<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 237" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="237" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب البروستاتا: الأعراض والعلاج والتثقيف</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="168.2" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الأعراض</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• حمى وإرهاق</text><text x="612" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• ألم أسفل الحوض</text><text x="612" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• حرقة بول</text><text x="612" y="168.6" text-anchor="start" font-size="13" fill="#0f172a">• إلحاح وتردد وجهد أثناء</text><text x="612" y="186.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">التبول</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="168.2" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">العلاج</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• terazosin وtamsulosin</text><text x="408.66666666666663" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• ciprofloxacin</text><text x="408.66666666666663" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">وlevofloxacin</text><text x="408.66666666666663" y="163.6" text-anchor="start" font-size="13" fill="#0f172a">• لا تتوقف عن المضاد عند</text><text x="408.66666666666663" y="181.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">التحسن</text><rect x="20" y="54" width="193.33333333333334" height="168.2" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#0ea5e9"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">التثقيف</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• زد السوائل (ماء، عصير)</text><text x="205.33333333333334" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• تجنب الكافيين (شاي،</text><text x="205.33333333333334" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">صودا، قهوة)</text><text x="205.33333333333334" y="163.6" text-anchor="start" font-size="13" fill="#0f172a">• الجنس مفيد</text><text x="205.33333333333334" y="186.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">• ملين docusate لمنع</text><text x="205.33333333333334" y="204.99999999999997" text-anchor="start" font-size="13" fill="#0f172a">الإمساك وتجنب الشد</text></svg>
