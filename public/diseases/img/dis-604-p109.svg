<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="210" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع اعتلال عضلة القلب</text><rect x="425" y="48" width="195" height="142" rx="12" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-width="1.5"/><rect x="425" y="48" width="195" height="34" rx="12" fill="#0ea5e9"/><text x="523" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">متوسع (Dilated)</text><text x="523" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">عضلة منتفخة ومتمددة</text><text x="523" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">ليف بالعضلة والشغاف</text><text x="523" y="152" text-anchor="middle" font-size="12.5" fill="#0f172a">سمع S3 وتضخم قلب</text><rect x="223" y="48" width="195" height="142" rx="12" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-width="1.5"/><rect x="223" y="48" width="195" height="34" rx="12" fill="#6366f1"/><text x="320" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">مقيَّد (Restrictive)</text><text x="320" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">عضلة «صلبة كالصخر»</text><text x="320" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">لا يمتلئ القلب جيدًا</text><text x="320" y="152" text-anchor="middle" font-size="12.5" fill="#0f172a">جلطات شائعة</text><rect x="20" y="48" width="195" height="142" rx="12" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1.5"/><rect x="20" y="48" width="195" height="34" rx="12" fill="#ef4444"/><text x="117" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ضخامي (Hypertrophic)</text><text x="117" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">سماكة بالحاجز</text><text x="117" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">قد يسد الأبهر (انسدادي)</text><text x="117" y="152" text-anchor="middle" font-size="12.5" fill="#0f172a">قد يموت بعد مجهود</text>
</svg>
