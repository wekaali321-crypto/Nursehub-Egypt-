<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="430" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">متى نفوّض لممرض مرخص؟ ونماذج أسئلة</text>
  <rect x="330" y="50" width="290" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="475" y="78" text-anchor="middle" font-size="16" font-weight="800" fill="#166534">نعم</text><text x="475" y="110" text-anchor="middle" font-size="13" font-weight="500" fill="#1e293b">مريض طويل الأمد</text><text x="475" y="138" text-anchor="middle" font-size="13" font-weight="500" fill="#1e293b">مريض في طريقه للتخريج</text><rect x="20" y="50" width="290" height="130" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="165" y="78" text-anchor="middle" font-size="16" font-weight="800" fill="#991b1b">لا</text><text x="165" y="104" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">قبول جديد، بعد عملية جديدة</text><text x="165" y="126" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">تقييم (مختبر، علامات)</text><text x="165" y="148" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">تقييم أولي، تثقيف أول</text><rect x="20" y="195" width="600" height="225" rx="10" fill="#fef9c3" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="217" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">أسئلة شائعة</text><text x="608" y="241" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• يمكن تفويض: حقن الإنسولين تحت الجلد، تعزيز التثقيف، القسطرة البولية، تقييم ثانوي لألم صدر</text><text x="608" y="275" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• لا يفوّض: تقييم مريض عائد من ERCP، بدء دواء وريدي (حسب نطاق الممارسة)</text><text x="608" y="309" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• لمريض احتشاء جديد: المساعد يسجل الداخل/الخارج ويساعد على المشي ويبلغ ألم الصدر</text><text x="608" y="343" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• لكن لا يثقف عن الأطعمة العالية بالصوديوم</text>
</svg>
