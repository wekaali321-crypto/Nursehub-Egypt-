<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="372" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قواعد النوم الصحي</text>
<rect x="24" y="48" width="592" height="300" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="44" y="70" width="552" height="56" rx="12" fill="#f1f5f9" stroke="#dc2626" stroke-width="1.5"/><text x="580" y="94" text-anchor="end" font-size="15" font-weight="800" fill="#dc2626">قبل النوم بـ 3 ساعات</text><text x="580" y="115" text-anchor="end" font-size="13" font-weight="600" fill="#0f172a">لا شاي ولا قهوة ولا كولا ولا تدخين</text><rect x="44" y="138" width="552" height="56" rx="12" fill="#f1f5f9" stroke="#7c3aed" stroke-width="1.5"/><text x="580" y="162" text-anchor="end" font-size="15" font-weight="800" fill="#7c3aed">قبل النوم بساعة</text><text x="580" y="183" text-anchor="end" font-size="13" font-weight="600" fill="#0f172a">دواء النوم إن وصفه الطبيب</text><rect x="44" y="206" width="552" height="56" rx="12" fill="#f1f5f9" stroke="#2563eb" stroke-width="1.5"/><text x="580" y="230" text-anchor="end" font-size="15" font-weight="800" fill="#2563eb">الغرفة</text><text x="580" y="251" text-anchor="end" font-size="13" font-weight="600" fill="#0f172a">هادئة ومظلمة وباردة، السرير للنوم فقط</text><rect x="44" y="274" width="552" height="56" rx="12" fill="#f1f5f9" stroke="#d97706" stroke-width="1.5"/><text x="580" y="298" text-anchor="end" font-size="15" font-weight="800" fill="#d97706">المدة</text><text x="580" y="319" text-anchor="end" font-size="13" font-weight="600" fill="#0f172a">المنوم الصناعي لا يزيد عن أسبوعين</text>
</svg>