<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="360" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب السحايا: العلامات والفحص</text><rect x="330" y="46" width="290" height="78" rx="10" fill="#dc2626"/><text x="475.0" y="72.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">صداع ورهاب الضوء</text><text x="475.0" y="88.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">تيبس رقبة وحمى</text><text x="475.0" y="104.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">رضيع: بكاء حاد وفونتانيل منتفخ؛ كبير: اهتياج وتغير وعي</text><rect x="20" y="46" width="300" height="78" rx="10" fill="#2563eb"/><text x="170.0" y="80.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Kernig: على الظهر يؤلم فرد الساق</text><text x="170.0" y="96.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Brudzinski: ثني الرقبة فتنثني الورك والركبة</text><rect x="20" y="134" width="600" height="56" rx="10" fill="#e0f2fe"/><text x="320.0" y="157.7" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">CT أولًا ثم بزل قطني: فيروسي رائق، بكتيري عكر، كلاهما WBC مرتفع</text><text x="320.0" y="174.7" text-anchor="middle" font-size="12" font-weight="600" fill="#0c4a6e">بعد البزل راقب مكان الإبرة لتسرب سائل رائق</text><rect x="20" y="200" width="600" height="48" rx="10" fill="#fef3c7"/><text x="320.0" y="228.2" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">أول إجراء: احتياطات رذاذية + معدات وقاية • تيبس الرقبة مع ثني الورك = أبلغ فورًا</text><rect x="20" y="258" width="600" height="90" rx="10" fill="#dcfce7"/><text x="320.0" y="290.85" text-anchor="middle" font-size="11