<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 422" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="422" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مشتقات الدم: ماذا نعطي ومتى؟</text><text x="320" y="50" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">PRBC وصفائح وبلازما: لكل منها غرض مختلف</text><rect x="440" y="70" width="190" height="170" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M440,80 a10,10 0 0 1 10,-10 h170 a10,10 0 0 1 10,10 v18 h-190 z" fill="#dc2626"/><text x="535.0" y="89" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">كرات حمراء مركّزة PRBC</text><text x="620" y="113" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">• ترفع الهيموجلوبين</text><text x="620" y="129.675" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">  والهيماتوكريت (H&amp;H)</text><text x="620" y="146.35000000000002" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">• للأنيميا أو النزف أو بعد</text><text x="620" y="163.02500000000003" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">  الجراحة</text><text x="620" y="179.70000000000005" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">• تُعطى خلال 4 ساعات من</text><text x="620" y="196.37500000000006" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">  خروجها من الثلاجة</text><text x="620" y="213.05000000000007" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">• Hgb أقل من 7 = لازم نقل</text><rect x="225" y="70" width="190" height="170" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M225,80 a10,10 0 0 1 10,-10 h170 a10,10 0 0 1 10,10 v18 h-190 z" fill="#7c3aed"/><text x="320.0" y="89" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">صفائح دموية PLT</text><text x="405" y="113" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">• بروتينات/خلايا تساعد على</text><text x="405" y="129.675" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">  التجلط</text><text x="405" y="146.35000000000002" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">• لنقص الصفائح (سرطان وبعض</text><text x="405" y="163.02500000000003" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">  الأنيميات)</text><text x="405" y="179.70000000000005" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">• 150,000 أو أقل = قلة</text><text x="405" y="196.37500000000006" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">  صفائح</text><text x="405" y="213.05000000000007" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">• 50,000 أو أقل = خطر شديد</text><rect x="10" y="70" width="190" height="192.07500000000002" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M10,80 a10,10 0 0 1 10,-10 h170 a10,10 0 0 1 10,10 v18 h-190 z" fill="#16a34a"/><text x="105.0" y="89" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">بلازما طازجة مجمدة FFP</text><text x="190" y="113" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">• فيها عوامل التجلط</text><text x="190" y="129.675" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">  (الغراء الذي يربط</text><text x="190" y="146.35000000000002" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">  الصفائح)</text><text x="190" y="163.02500000000003" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">• لنقص عوامل التجلط:</text><text x="190" y="179.70000000000005" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">  الهيموفيليا</text><text x="190" y="196.37500000000006" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">• وأمراض الكبد (تليف</text><text x="190" y="213.05000000000007" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">  والتهاب كبدي)</text><text x="190" y="229.72500000000008" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">• صفائح كتيرة لا تنفع مع</text><text x="190" y="246.4000000000001" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a">  نقص العوامل</text><text x="320" y="258" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">مقياس الهيموجلوبين (جم/دل)</text><rect x="330" y="266" width="140" height="44" rx="8" fill="#16a34a"/><text x="400" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">طبيعي</text><text x="400" y="303" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" direction="ltr">12 – 18</text><rect x="190" y="266" width="140" height="44" rx="8" fill="#f97316"/><text x="260" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">خطر</text><text x="260" y="303" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" direction="ltr">8 – 11</text><rect x="50" y="266" width="140" height="44" rx="8" fill="#dc2626"/><text x="120" y="285" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">أقل من</text><text x="120" y="303" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" direction="ltr">7</text><text x="320" y="332" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">أعراض الصدمة مع نقص الدم: جلد شاحب رمادي، جلد بارد ولزج، تعب وضعف</text><rect x="20" y="346" width="600" height="48" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/><text x="320" y="366.0" text-anchor="middle" font-size="12" font-weight="600" fill="#713f12">ملاحظة: فرق بين نقص الصفائح (نزف سطحي) ونقص عوامل التجلط (نزف عميق ومفصلي). كل منهما</text><text x="320" y="384.0" text-anchor="middle" font-size="12" font-weight="600" fill="#713f12">يحتاج منتجًا مختلفًا.</text></svg>