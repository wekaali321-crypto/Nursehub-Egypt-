<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" width="640" height="342" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="أدوية الولادة: Terbutaline وOxytocin"><rect width="640" height="342" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">أدوية الولادة: Terbutaline وOxytocin</text><rect x="326.0" y="46" width="302.0" height="152" rx="10" fill="#efe9fb" stroke="#6a4bb5" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#6a4bb5"/><rect x="326.0" y="60" width="302.0" height="14" fill="#6a4bb5"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Terbutaline</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• يؤخر الولادة لحظيًا بتثبيط التقلصات</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• ينشّط مستقبلات بيتا 2 فيُفعّل الودي</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">   ويثبط المخاض</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• قد يُستعمل حتى 48 ساعة لتثبيط الولادة</text><text x="616.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">   المبكرة</text><text x="616.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">• وسيلتنا: «يهدّئ التقلصات المتلاطمة»</text><rect x="12.0" y="46" width="302.0" height="134" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="12.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Oxytocin: الاستعمال</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• يحرّض الولادة وينشّط التقلصات</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• يُعطى بعد 6–12 ساعة من آخر جرعة</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">   dinoprostone</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• تسريب piggyback على المحلول الرئيسي</text><text x="302.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• مرافقة ممرضة واحدة لمريضة (1:1)</text><rect x="12.0" y="192" width="302.0" height="134" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="12.0" y="192" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="12.0" y="206" width="302.0" height="14" fill="#b42318"/><text x="163.0" y="211" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">متى توقف الأوكسيتوسين؟</text><text x="302.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• تقلصات أطول من 60 ثانية</text><text x="302.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• تقلصات مستمرة أكثر من دقيقتين</text><text x="302.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">• 3 تباطؤات متأخرة متتالية في FHR: أوقف</text><text x="302.0" y="294" text-anchor="start" font-size="12.5" fill="#1d2939">   الأوكسيتوسين (أولوية)</text><text x="302.0" y="312" text-anchor="start" font-size="12.5" fill="#1d2939">• اقلب الأم على جنبها</text><rect x="326.0" y="210" width="302.0" height="80" rx="10" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.2"/><rect x="326.0" y="210" width="302.0" height="28" rx="10" fill="#2e7d4f"/><rect x="326.0" y="224" width="302.0" height="14" fill="#2e7d4f"/><text x="477.0" y="229" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">تقييم</text><text x="616.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• متأخرة (Late decelerations) ← قلّب الأم</text><text x="616.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">   ثم أوقف التسريب</text></svg>