<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 344" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="700" height="344" rx="16" fill="#f8fafc"/>
<text x="350.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أديسون مقابل كوشينج</text>
<rect x="356.0" y="52" width="330.0" height="264.5" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="356.0" y="52" width="330.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="521.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">أديسون: نقص هرمونات الكظر</text>
<text x="676.0" y="96" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• قلة الكورتيزول والألدوستيرون، والإجهاد الإضافي</text>
<text x="676.0" y="112.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">قد يقتل</text>
<text x="676.0" y="131.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• الأسباب: مناعة ذاتية، أمراض (سرطان، سل، HIV)،</text>
<text x="676.0" y="147.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">تلف (نزف كظر/إصابة)</text>
<text x="676.0" y="166.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• العلامات: انخفاض ضغط ووزن وسكر وحرارة وشعر ومزاج</text>
<text x="676.0" y="182.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">وصوديوم (≤135) وطاقة، وارتفاع لون الجلد (برونزي)</text>
<text x="676.0" y="199.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">وارتفاع K فوق 5.0 وفقد ماء ورغبة في الملح</text>
<text x="676.0" y="217.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• العلاج: ستيرويدات (-sone) مدى الحياة تُرفع</text>
<text x="676.0" y="234.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">جرعتها أثناء الإجهاد والجراحة والإنتان، غذاء عالٍ</text>
<text x="676.0" y="250.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">بالبروتين والكربوهيدرات والصوديوم، لا تُوقف فجأة،</text>
<text x="676.0" y="267.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">ولا يُشفى المرض</text>
<text x="676.0" y="285.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• أزمة أديسون: هبوط ضغط (نحو 89/40) والتصرف الأول:</text>
<text x="676.0" y="302.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">ستيرويد وريدي (هيدروكورتيزون أو بريدنيزولون)</text>
<rect x="14.0" y="52" width="330.0" height="264.5" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="14.0" y="52" width="330.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="179.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">كوشينج: فرط الكورتيزول</text>
<text x="334.0" y="96" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• "وسادة الستيرويد": وجه قمري وسنام جاموسي وسمنة</text>
<text x="334.0" y="112.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">جذعية وطرف نحيف</text>
<text x="334.0" y="131.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• الأسباب: ستيرويدات طويلة (ربو وروماتويد)، ورم</text>
<text x="334.0" y="147.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">النخامية/الكظر، سرطان رئة صغير الخلايا</text>
<text x="334.0" y="166.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• العلامات: ضغط ووزن وسكر مرتفعة، عدوى متكررة،</text>
<text x="334.0" y="182.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">عظام هشة، كدمات سهلة، شعرانية (Hirsutism)، خطوط</text>
<text x="334.0" y="199.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">أرجوانية، جلد رقيق، ارتفاع محيط البطن، انخفاض</text>
<text x="334.0" y="215.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">البوتاسيوم</text>
<text x="334.0" y="234.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• العلاج: جراحة لاستئصال الورم وبدائل ستيرويد،</text>
<text x="334.0" y="250.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">وتخفيض الستيرويد تدريجياً (Taper)</text>
</svg>
