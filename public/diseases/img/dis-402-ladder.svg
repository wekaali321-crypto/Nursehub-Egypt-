<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="350" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب الأذن الخارجية: التشخيص والخطوات</text>
  <rect x="20" y="50" width="300" height="70" rx="10" fill="#fee2e2"/>
  <text x="170" y="80.55" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">علامة الـ Tragus</text>
  <text x="170" y="98.55" text-anchor="middle" font-size="11" font-weight="500" fill="#7f1d1d">ضغط على القطعة الغضروفية أمام الأذن = ألم شديد</text>
  <rect x="330" y="50" width="290" height="70" rx="10" fill="#fee2e2"/>
  <text x="475" y="80.55" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">منظار الأذن</text>
  <text x="475" y="98.55" text-anchor="middle" font-size="11" font-weight="500" fill="#7f1d1d">القناة محمرة ومتورمة، إفراز أو قشور</text>
  <path d="M320 120 L320 140" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M314 138 L320 146 L326 138 Z" fill="#64748b"/>
  <rect x="40" y="146" width="560" height="40" rx="10" fill="#dbeafe"/>
  <text x="320" y="170.55" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">خفيف: مسكن + قطرة أذن (٣ نقط × ٣ مرات، ٥ دقائق على الجنب)</text>
  <path d="M320 186 L320 206" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M314 204 L320 212 L326 204 Z" fill="#64748b"/>
  <rect x="40" y="212" width="560" height="48" rx="10" fill="#fef3c7"/>
  <text x="320" y="231.55" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">متوسط/شديد أو ما نفعتش القطرة: تنظيف (Aural toilet)</text>
  <text x="320" y="249.55" text-anchor="middle" font-size="11" font-weight="500" fill="#78350f">شاش مبلل بمرهم مضاد حيوي (Garamycin / Fucidin) + متابعة بعد ٣ أيام</text>
  <path d="M320 260 L320 280" stroke="#64748b" stroke-width="2.5" fill="none"/><path d="M314 278 L320 286 L326 278 Z" fill="#64748b"/>
  <rect x="40" y="286" width="560" height="40" rx="10" fill="#fecaca"/>
  <text x="320" y="310.55" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">حالات شديدة: مضاد حيوي بالفم (Hibiotic / Ceporex 1 g كل ١٢ ساعة × أسبوع)</text>
  <text x="320" y="336" text-anchor="middle" font-size="12" fill="#64748b">أكتر سبب لإفراز الأذن في العيادة العامة</text>
</svg>
