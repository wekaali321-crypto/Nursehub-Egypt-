<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="270" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تحضير تخطيط المخ EEG (والفرق عن ECG)</text><rect x="330" y="50" width="290" height="90" rx="10" fill="#16a34a"/><text x="475.0" y="82.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">افعل</text><text x="475.0" y="99.2" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">اغسل الشعر قبل وبعد (لتثبيت الأقطاب)</text><text x="475.0" y="116.2" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">يمكنك الأكل قبل الفحص (بلا صيام)</text><rect x="20" y="50" width="300" height="90" rx="10" fill="#dc2626"/><text x="170.0" y="82.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">لا تفعل</text><text x="170.0" y="98.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">كافيين (شاي/قهوة/صودا) ومنبهات قبل 12-24 س</text><text x="170.0" y="114.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">لا تتوقف عن أدوية النوبات، ولا حرمان نوم (الأفضل عدمه)</text><rect x="20" y="155" width="600" height="40" rx="10" fill="#e2e8f0"/><text x="320.0" y="179.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">EEG = كهرباء المخ (فكّر في رأس البيضة Egg) • ECG = إيقاع القلب</text><rect x="20" y="205" width="600" height="48" rx="10" fill="#fef3c7"/><text x="320.0" y="224.7" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">MRI أو CT للبحث عن شذوذات بنيوية</text><text x="320.0" y="241.7" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Phenytoin: سمّي فوق 20 (امسك الجرعة وأبلغ) • Levetiracetam: القيادة بإذن الطبيب</text></svg>