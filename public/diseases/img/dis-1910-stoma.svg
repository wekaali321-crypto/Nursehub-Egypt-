<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">لونا فتحة الفغر (Stoma): ما يُبلَّغ</text><rect x="325" y="48" width="295" height="92" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">طبيعي</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">وردي إلى أحمر رطب</text><rect x="20" y="48" width="295" height="92" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">يُبلَّغ فورًا</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">حواف رمادية (Gray-tinged)</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">أزرق، بنفسجي، شاحب، داكن (Dusky)</text><text x="320" y="164" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">تغير اللون = نقص تروية</text>
