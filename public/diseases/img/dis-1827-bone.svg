<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 293" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="293" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ساركوما عظمية مقابل ساركوما إيوينغ</text><rect x="326.0" y="50" width="294.0" height="116" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="326.0" y="50" width="294.0" height="28" rx="10" fill="#7c3aed"/><text x="473.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">Osteosarcoma</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• ينشأ من البانيات العظمية (Osteoblasts)</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• قرب نهايات العظام الطويلة</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• ينتج نسيجاً عظمياً زائداً وورماً</text><text x="610.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">كبيراً</text><rect x="20.0" y="50" width="294.0" height="116" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="20.0" y="50" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="167.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">Ewing Sarcoma</text><text x="304.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• عظم الفخذ والعجز أو غضاريف وأعصاب</text><text x="304.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">قريبة</text><text x="304.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• أشيع بين 10-20 سنة</text><rect x="326.0" y="178" width="294.0" height="99" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="326.0" y="178" width="294.0" height="28" rx="10" fill="#ea580c"/><text x="473.0" y="20" dy="178" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلامات المشتركة</text><text x="610.0" y="224" font-size="12.5" fill="#0f172a" text-anchor="end">• ألم عظم وتورم وكسور</text><text x="610.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="end">• حمى وتعب ونقص وزن</text><rect x="20.0" y="178" width="294.0" height="99" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20.0" y="178" width="294.0" height="28" rx="10" fill="#16a34a"/><text x="167.0" y="20" dy="178" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التشخيص والعلاج</text><text x="304.0" y="224" font-size="12.5" fill="#0f172a" text-anchor="end">• أشعة وCT وMRI وخزعة ورم أو نخاع وCBC</text><text x="304.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="end">• كيماوي وإشعاع</text><text x="304.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">• جراحة وقد يلزم بتر</text></svg>