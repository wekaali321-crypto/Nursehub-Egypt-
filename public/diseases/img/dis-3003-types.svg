<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="380" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع إساءة معاملة الأطفال وأمثلة الدلالة</text><rect x="330" y="50" width="290" height="100" rx="10" fill="#0ea5e9"/><text x="475.0" y="77.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الإهمال (Neglect)</text><text x="475.0" y="94.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">تقصير الوالد في الغذاء والكساء والمأوى والرقابة</text><text x="475.0" y="111.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">سوء تغذية · ملابس متسخة مهترئة · أسنان غير معالجة</text><text x="475.0" y="128.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">عدم استخدام مقعد السلامة في السيارة (الأكثر شيوعًا)</text><rect x="20" y="50" width="300" height="100" rx="10" fill="#dc2626"/><text x="170.0" y="77.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الإساءة الجسدية</text><text x="170.0" y="94.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">أي إصابة غير عرضية: ضرب، ركل، حرق، عض</text><text x="170.0" y="111.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">حروق باليدين · كسر لولبي بالساعد</text><text x="170.0" y="128.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">علامة سوط على الظهر · حروق سجائر</text><rect x="20" y="165" width="600" height="100" rx="10" fill="#7c3aed"/><text x="320.0" y="191.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الإساءة/الإهمال العاطفي</text><text x="320.0" y="209.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">أذى للاستقرار العاطفي: قلق، اكتئاب، انسحاب أو عدوانية</text><text x="320.0" y="227.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">مثال: الأب يقول للطفل «لا تستحق نظرة ثانية»</text><text x="320.0" y="245.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">الإهمال العاطفي: لا يمدحه حتى حين يمدحه المعلم</text><rect x="20" y="280" width="600" height="80" rx="10" fill="#fef3c7"/><text x="320.0" y="305.0" text-anchor="middle" font-size="14" font-weight="800" fill="#78350f">تنبيه لتقييم التمريض</text><text x="320.0" y="323.0" text-anchor="middle" font-size="12" font-weight="500" fill="#78350f">ركّز على: عدم توافق القصة مع الإصابة · تغيّر الرواية · تأخر طلب الرعاية</text><text x="320.0" y="341.0" text-anchor="middle" font-size="12" font-weight="500" fill="#78350f">الحروق المتماثلة أو الكدمات بأشكال أدوات تثير الشك</text></svg>