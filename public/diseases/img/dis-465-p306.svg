<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 397" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="397" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">انسداد الأمعاء الدقيقة</text>
<rect x="346.0" y="52" width="320.0" height="115.0" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="346.0" y="52" width="320.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="506.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأسباب</text>
<text x="656.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• غير ميكانيكي: شلل معوي (Paralytic ileus)</text>
<text x="656.0" y="115.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ميكانيكي: التصاقات (ندوب جراحية)، فتق،</text>
<text x="656.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">انغلاف (Intussusception)، ورم، التواء</text>
<text x="656.0" y="149.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">(Volvulus)</text>
<rect x="14.0" y="52" width="320.0" height="115.0" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="14.0" y="52" width="320.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="174.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">العلامات: بداية سريعة</text>
<text x="324.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قيء متكرر وغثيان</text>
<text x="324.0" y="115.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• انتفاخ بطن وألم مغصي متقطع</text>
<text x="324.0" y="134.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أصوات الأمعاء: نشطة فوق الانسداد، وخاملة</text>
<text x="324.0" y="151.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">تحته</text>
<rect x="346.0" y="179.0" width="320.0" height="190.0" rx="10" fill="#7f1d1d" fill-opacity="0.1" stroke="#7f1d1d" stroke-width="1.2"/>
<rect x="346.0" y="179.0" width="320.0" height="26" rx="10" fill="#7f1d1d" fill-opacity="1" stroke="#7f1d1d" stroke-width="1.2"/>
<text x="506.0" y="197.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">مضاعفة: التهاب بريتوان</text>
<text x="656.0" y="223.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• حمى وتسرع قلب وتنفس وانتفاخ بطن وبطن صلب</text>
<text x="656.0" y="240.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">كاللوح</text>
<text x="656.0" y="259.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• سؤال: تسرع مفاجئ + حمى عالية = انثقاب فأبلغ</text>
<text x="656.0" y="276.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الطبيب</text>
<rect x="14.0" y="179.0" width="320.0" height="190.0" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="14.0" y="179.0" width="320.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="174.0" y="197.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">العلاج</text>
<text x="324.0" y="223.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• صيام NPO</text>
<text x="324.0" y="242.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أنبوب أنفي معدي NGT</text>
<text x="324.0" y="261.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• سوائل وريدية</text>
<text x="324.0" y="280.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• وضع شبه جالس (Semi-Fowler)</text>
<text x="324.0" y="300.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تحكم بالألم بغير الأفيونات حسب المرجع</text>
<text x="324.0" y="317.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">(يُتجنب مورفين وهيدروكودون وهيدرومورفون)</text>
<text x="324.0" y="336.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• جراحة: استئصال جزء من الأمعاء وقد يُركّب فغر</text>
<text x="324.0" y="353.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">مؤقت</text>
</svg>
