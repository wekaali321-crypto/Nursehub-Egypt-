<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 208" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="208" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الحقن عند الأطفال: تحت الجلد وعضلي</text><rect x="325" y="48" width="295" height="144" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">تحت الجلد (SQ)</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">بطن، خلف الذراع (الجانب الخارجي)، وسط</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">الفخذ الأمامي</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">إبرة 25–30، حجم صغير</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">MMR لطفل 5 سنوات: SQ بالجزء الخارجي من</text><text x="610" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">أعلى الذراع</text><rect x="20" y="48" width="295" height="144" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">عضلي (IM)</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">إبرة 22–25، طول 1–1.5 بوصة، زاوية 90°</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">عضلة فاستس لاتيرالس (الفخذ)، الألوية أو</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">الدالية</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">الرضع 0–12 شهر: فاستس لاتيرالس</text>
</svg>
