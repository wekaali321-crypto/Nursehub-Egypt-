<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 361" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="361" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تسمم الحمل: العلامات والمضاعفات والمغنيسيوم</text><rect x="326.0" y="50" width="294.0" height="150" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><rect x="326.0" y="50" width="294.0" height="28" rx="10" fill="#b91c1c"/><text x="473.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلامات</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• ضغط مرتفع (140/90 فأكثر) وارتفاع نحو</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">15 ملم زئبق عن الزيارة السابقة</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• بروتين بالبول</text><text x="610.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• وذمة بالوجه والأصابع</text><text x="610.0" y="164" font-size="12.5" fill="#0f172a" text-anchor="end">• زيادة وزن (أكثر من رطل/أسبوع = ماء)</text><text x="610.0" y="181" font-size="12.5" fill="#0f172a" text-anchor="end">• تشنجات = ارتجاج</text><rect x="20.0" y="50" width="294.0" height="150" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="20.0" y="50" width="294.0" height="28" rx="10" fill="#7c3aed"/><text x="167.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">HELLP</text><text x="304.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• انحلال دم (Hemolysis)</text><text x="304.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• إنزيمات كبد مرتفعة</text><text x="304.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• نقص صفائح</text><text x="304.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• ألم ربع علوي أيمن وغثيان وقيء وألم فوق</text><text x="304.0" y="164" font-size="12.5" fill="#0f172a" text-anchor="end">المعدة</text><rect x="326.0" y="212" width="294.0" height="133" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="326.0" y="212" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="473.0" y="20" dy="212" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">مغنيسيوم سلفات</text><text x="610.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">• المدى العلاجي 4-7 mEq/L</text><text x="610.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• سمّية فوق 7</text><text x="610.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="end">• اختفاء ردود الأوتار 0/4</text><text x="610.0" y="309" font-size="12.5" fill="#0f172a" text-anchor="end">• تنفس أقل من 12 وبول 30 مل/ساعة فأقل</text><text x="610.0" y="326" font-size="12.5" fill="#0f172a" text-anchor="end">• الترياق: calcium gluconate</text><rect x="20.0" y="212" width="294.0" height="133" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20.0" y="212" width="294.0" height="28" rx="10" fill="#16a34a"/><text x="167.0" y="20" dy="212" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">خافضات الضغط المسموحة</text><text x="304.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">• labetalol (حاصر بيتا)</text><text x="304.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• nifedipine وdiltiazem (CCB)</text><text x="304.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="end">• hydralazine (موسع أوعية)</text><text x="304.0" y="309" font-size="12.5" fill="#0f172a" text-anchor="end">• تجنب ACEi (lisinopril وenalapril) وARB</text><text x="304.0" y="326" font-size="12.5" fill="#0f172a" text-anchor="end">(losartan وvalsartan)</text></svg>