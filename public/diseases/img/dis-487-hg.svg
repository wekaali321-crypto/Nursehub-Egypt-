<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 298" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="298" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">غثيان الحمل البسيط والقيء المفرط</text>
<rect x="20" y="44" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="44" width="160" height="54" rx="10" fill="#15803d"/><text x="540" y="76" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">غثيان الصباح (Emesis)</text><text x="448" y="67" text-anchor="end" font-size="13" fill="#0f172a">من نهاية الشهر 1 حتى نهاية الشهر 3</text><text x="448" y="85" text-anchor="end" font-size="13" fill="#0f172a">لا يؤثر على الحالة العامة ولا جفاف</text><rect x="20" y="106" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="106" width="160" height="54" rx="10" fill="#0369a1"/><text x="540" y="138" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج</text><text x="448" y="129" text-anchor="end" font-size="13" fill="#0f172a">طمأنة · وجبات صغيرة بالنشويات · تجنب الدهون</text><text x="448" y="147" text-anchor="end" font-size="13" fill="#0f172a">Cortigen B6 عضل أو Navidoxine / Ezadoxine / Emetrex</text><rect x="20" y="168" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="168" width="160" height="54" rx="10" fill="#b91c1c"/><text x="540" y="200" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">القيء المفرط (Hyperemesis)</text><text x="448" y="191" text-anchor="end" font-size="13" fill="#0f172a">مستمر وشديد بعد 3 شهور أو يؤثر على الحالة</text><text x="448" y="209" text-anchor="end" font-size="13" fill="#0f172a">علامات جفاف: ترهل جلد · غور عين · عطش · لسان جاف</text><rect x="20" y="230" width="600" height="54" rx="10" fill="#fff" stroke="#e2e8f0"/><rect x="460" y="230" width="160" height="54" rx="10" fill="#7c3aed"/><text x="540" y="262" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج</text><text x="448" y="253" text-anchor="end" font-size="13" fill="#0f172a">كانيولا + محاليل (Ringer / ملح 0.9%)</text><text x="448" y="271" text-anchor="end" font-size="13" fill="#0f172a">Cortigen B6 عضل + تحويل للمستشفى</text>
</svg>
