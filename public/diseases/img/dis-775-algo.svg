<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 362" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="362" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">خطوات علاج زيادة الصوديوم</text><rect x="40" y="48" width="560" height="66" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.8"/><circle cx="576" cy="81" r="14" fill="#2563eb"/><text x="576" y="86" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="552" y="69" text-anchor="start" font-size="14" font-weight="800" fill="#2563eb">شخّص السبب والحجم</text><text x="552" y="87" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">جفاف (فقد ماء)، فقد أملاح مع ماء، أو زيادة ملح (محاليل مركزة، أدوية).</text><text x="552" y="103" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">السكر الكاذب (DI)؟</text><text x="320" y="130" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="136" width="560" height="66" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.8"/><circle cx="576" cy="169" r="14" fill="#16a34a"/><text x="576" y="174" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="552" y="157" text-anchor="start" font-size="14" font-weight="800" fill="#16a34a">اختَر المحلول</text><text x="552" y="175" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">ماء بالفم أو أنبوب أنفي لو ممكن؛ وريدياً: ملحي 0.45% أو جلوكوز 5%؛ لو</text><text x="552" y="191" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">صدمة ابدأ بملحي 0.9% ثم عدّل</text><text x="320" y="218" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="224" width="560" height="50" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.8"/><circle cx="576" cy="249" r="14" fill="#ea580c"/><text x="576" y="254" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="552" y="245" text-anchor="start" font-size="14" font-weight="800" fill="#ea580c">خفّض ببطء</text><text x="552" y="263" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">لا أكثر من 10–12 ملي مول/لتر في 24 ساعة (≈0.5 ملي مول/ساعة)</text><text x="320" y="290" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="40" y="296" width="560" height="50" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="1.8"/><circle cx="576" cy="321" r="14" fill="#7c3aed"/><text x="576" y="326" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="552" y="317" text-anchor="start" font-size="14" font-weight="800" fill="#7c3aed">تابع</text><text x="552" y="335" text-anchor="start" font-size="12" font-weight="600" fill="#1e293b">صوديوم كل 4–6 ساعات، سجل سوائل، وعي، وزن</text></svg>