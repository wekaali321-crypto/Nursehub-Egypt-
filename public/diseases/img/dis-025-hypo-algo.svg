<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="380" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">خوارزمية هبوط السكر (أقل من 70 mg/dl)</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="190" y="44" width="260" height="40" rx="10" fill="#0f172a"/><text x="320" y="69" fill="#fff">قيس السكر فوراً (لا تخمّن)</text>
    <rect x="330" y="116" width="290" height="100" rx="12" fill="#dcfce7"/><text x="475" y="140" fill="#14532d">واعي وبيبلع</text><text x="475" y="162" font-size="12" font-weight="400" fill="#14532d">15–20 جم سكر سريع (عصير نص كوب،</text><text x="475" y="180" font-size="12" font-weight="400" fill="#14532d">3–4 أقراص جلوكوز، معلقة سكر كبيرة)</text><text x="475" y="200" font-size="12" font-weight="400" fill="#14532d">أعد القياس بعد 15 دقيقة وكرر</text>
    <rect x="20" y="116" width="290" height="100" rx="12" fill="#fee2e2"/><text x="165" y="140" fill="#7f1d1d">فاقد الوعي أو مش بيبلع</text><text x="165" y="162" font-size="12" font-weight="400" fill="#7f1d1d">خط وريدي ثم دكستروز وريدي (10% أو 25%)</text><text x="165" y="180" font-size="12" font-weight="400" fill="#7f1d1d">لو مفيش وريد: جلوكاجون (Glucagon) عضل</text><text x="165" y="200" font-size="12" font-weight="400" fill="#7f1d1d">لا شيء بالفم أبداً</text>
    <rect x="130" y="250" width="380" height="50" rx="10" fill="#fef3c7"/><text x="320" y="273" fill="#78350f">أعد قياس السكر بعد 5–15 دقيقة (حسب الطريق)</text><text x="320" y="291" font-size="12" font-weight="400" fill="#78350f">مستهدف: أكتر من 70 mg/dl ثم وجبة فيها نشويات</text>
    <rect x="130" y="318" width="380" height="46" rx="10" fill="#dbeafe"/><text x="320" y="338" fill="#1e3a8a">اعرف السبب وسجّل وثقّف المريض</text><text x="320" y="354" font-size="12" font-weight="400" fill="#1e3a8a">راجع جرعة الإنسولين/الأقراص وموعد الأكل</text>
  </g>
  <g stroke="#64748b" stroke-width="2" fill="none"><path d="M260 84 L165 116"/><path d="M380 84 L475 116"/><path d="M165 216 L260 250"/><path d="M475 216 L380 250"/><path d="M320 300 L320 318"/></g>
</svg>
