<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="330" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">تعليق الحديد الوريدي</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="20" y="45" width="600" height="38" rx="10" fill="#0f172a"/><text x="320" y="69" fill="#fff">محلول ملح فقط • أمبول لكل 100 سم³ كحد أقصى</text>
    <rect x="20" y="95" width="600" height="46" rx="10" fill="#fef9c3" stroke="#eab308"/><text x="320" y="116" fill="#422006">اختبار تحمل: أمبولين بمعدل 10 نقاط/دقيقة ثم وقف 10 دقائق</text><text x="320" y="133" font-size="11" fill="#422006">راقب حساسية: طفح، ضيق نفس، هبوط ضغط</text>
    <path d="M170 141 L120 168 M470 141 L520 168" stroke="#64748b" stroke-width="3"/>
    <rect x="20" y="168" width="270" height="50" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="155" y="190" fill="#7f1d1d">حساسية: أوقف فوراً</text><text x="155" y="208" font-size="11" fill="#450a0a">Avil + Solucortif وريدي + بروتوكول الحساسية</text>
    <rect x="350" y="168" width="270" height="50" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="485" y="190" fill="#14532d">لا حساسية: كمل باقي الأمبولات</text><text x="485" y="208" font-size="11" fill="#14532d">أمبول لكل 100 سم³ ملح</text>
    <rect x="20" y="240" width="190" height="46" rx="10" fill="#dbeafe"/><text x="115" y="262" fill="#1e3a8a">أول نص ساعة</text><text x="115" y="278" font-size="12" fill="#1e3a8a">تنقيط بطيء</text>
    <rect x="225" y="240" width="190" height="46" rx="10" fill="#bfdbfe"/><text x="320" y="262" fill="#1e3a8a">تاني نص ساعة</text><text x="320" y="278" font-size="12" fill="#1e3a8a">تنقيط متوسط</text>
    <rect x="430" y="240" width="190" height="46" rx="10" fill="#93c5fd"/><text x="525" y="262" fill="#1e3a8a">تالت نص ساعة</text><text x="525" y="278" font-size="12" fill="#1e3a8a">تنقيط سريع</text>
  </g>
  <text x="320" y="312" text-anchor="middle" font-size="12" fill="#475569">أعد CBC بعد أسبوع إلى 10 أيام من آخر جرعة</text>
</svg>
