<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 192" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="192" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">أنواع سلس البول عند الأطفال (Enuresis)</text><g text-anchor="middle"><rect x="330" y="46" width="290" height="57" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="475" y="68" font-size="14" font-weight="800" fill="#1e3a8a">أولي (Primary)</text><text x="475" y="86" font-size="12" font-weight="600" fill="#1e3a8a">طفل لم يجف أبداً لمدة 6 شهور متصلة</text><rect x="20" y="46" width="290" height="57" rx="10" fill="#fef9c3" stroke="#eab308"/><text x="165" y="68" font-size="14" font-weight="800" fill="#422006">ثانوي (Secondary)</text><text x="165" y="86" font-size="12" font-weight="600" fill="#422006">بدأ التبول بعد جفاف 6 شهور على الأقل</text><rect x="330" y="115" width="290" height="57" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="475" y="137" font-size="14" font-weight="800" fill="#1e3a8a">ليلي (Nocturnal)</text><text x="475" y="155" font-size="12" font-weight="600" fill="#1e3a8a">التبول أثناء النوم (بول الفراش)</text><rect x="20" y="115" width="290" height="57" rx="10" fill="#fef9c3" stroke="#eab308"/><text x="165" y="137" font-size="14" font-weight="800" fill="#422006">نهاري (Diurnal)</text><text x="165" y="155" font-size="12" font-weight="600" fill="#422006">التبول وهو صاحي (سلس نهاري)</text></g></svg>