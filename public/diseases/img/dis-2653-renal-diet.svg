<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="430" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">حمية الفشل الكلوي والأدوية الضارة</text><rect x="330" y="46" width="290" height="70" rx="10" fill="#2563eb"/><text x="475.0" y="76.7" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">قلة الصوديوم</text><text x="475.0" y="93.7" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">لا معلبات ولا لحوم مصنعة</text><rect x="20" y="46" width="300" height="70" rx="10" fill="#16a34a"/><text x="170.0" y="76.7" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">قلة البوتاسيوم</text><text x="170.0" y="93.7" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">التفاح أفضل خيار • لا بدائل ملح</text><rect x="20" y="126" width="600" height="50" rx="10" fill="#fee2e2"/><text x="320.0" y="155.2" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">ممنوع بوتاسيوم: سبانخ، أفوكادو، جزر، طماطم، فراولة، برتقال، موز</text><rect x="330" y="186" width="290" height="50" rx="10" fill="#f59e0b"/><text x="475.0" y="214.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">قلة فوسفور: لا ألبان (زبادي، بودنج، حليب)</text><rect x="20" y="186" width="300" height="50" rx="10" fill="#7c3aed"/><text x="170.0" y="214.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">قلة بروتين: للحفاظ على الوظيفة، تجنب اللحوم الحمراء</text><rect x="20" y="246" width="600" height="60" rx="10" fill="#fef3c7"/><text x="320.0" y="280.55" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">وزن يومي: 1 كجم = 1 لتر سوائل محتجزة</text><rect x="20" y="316" width="600" height="100" rx="10" fill="#fee2e