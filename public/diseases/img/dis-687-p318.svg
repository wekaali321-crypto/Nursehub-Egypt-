<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="370" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الأنيميا المنجلية والخبيثة</text><rect x="330" y="52" width="300" height="94.19999999999999" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#be123c"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المنجلية: الفكرة</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• كريات تتحول من مستديرة إلى شكل منجل</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تموت أسرع وتسد الأوعية الصغيرة</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• نقص أكسجة وألم شديد (أزمة انسداد وعائي)</text><rect x="10" y="52" width="310" height="111.6" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">أعراض ومضاعفات</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ضعف في ذراع واحدة (جلطة دماغية)</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تورم القدمين واليدين (Dactylitis)</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أي شلل جديد أو عدم الاستيقاظ = طوارئ</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• احتجاز الطحال: تضخم سريع وهبوط ضغط</text><rect x="10" y="171.6" width="620" height="53.5" rx="10" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/><text x="320" y="191.35" text-anchor="middle" font-size="12.5" font-weight="600" fill="#881337">العلاج: سوائل وريدية، راحة بالفراش، مسكن عبر مضخة PCA، وبلّغ الطبيب لرفع الجرعة.</text><text x="320" y="210.1" text-anchor="middle" font-size="12.5" font-weight="600" fill="#881337">التقييم العصبي المنتظم في أزمة الانسداد.</text><rect x="330" y="235.1" width="300" height="94.19999999999999" rx="10" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><path d="M330,245.1 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#4f46e5"/><text x="480.0" y="254.1" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الخبيثة: الفكرة</text><text x="620" y="278.1" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الجسم لا يمتص B12 لغياب العامل الداخلي</text><text x="620" y="295.5" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• العامل الداخلي تفرزه بطانة المعدة</text><text x="620" y="312.9" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• يحدث بعد استئصال المعدة</text><rect x="10" y="235.1" width="310" height="111.6" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M10,245.1 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#16a34a"/><text x="165.0" y="254.1" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأعراض والعلاج</text><text x="310" y="278.1" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• التهاب لسان أحمر أملس (Glossitis)</text><text x="310" y="295.5" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ضعف شديد، اصفرار الجلد</text><text x="310" y="312.9" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• B12 حقن عضلي (IM) مدى الحياة</text><text x="310" y="330.29999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ليس فمويًا (PO)</text></svg>