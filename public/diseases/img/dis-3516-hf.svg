<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="500" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">فشل القلب: أعراض اليمين واليسار وأدويته (ACTS + D)</text><rect x="330" y="45" width="295" height="150" rx="10" fill="#fee2e2"/><text x="477.5" y="83" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">فشل القلب الأيسر (L: Lung)</text><text x="477.5" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">سائل رئوي: خراخر لا تزول بالسعال</text><text x="477.5" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">بلغم رغوي وردي</text><text x="477.5" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">ضيق نفس عند الاستلقاء (orthopnea)</text><text x="477.5" y="167" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">السبب: احتشاء، مرض تاجي</text><rect x="15" y="45" width="305" height="150" rx="10" fill="#dbeafe"/><text x="167.5" y="83" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">فشل القلب الأيمن (R: Rocks the Body)</text><text x="167.5" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">وذمة الأطراف وزيادة الوزن</text><text x="167.5" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">احتقان أوردة العنق (JVD)</text><text x="167.5" y="146" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">استسقاء وتضخم الكبد والطحال</text><text x="167.5" y="167" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">السبب: الفشل الأيسر، ارتفاع ضغط رئوي</text><rect x="500" y="215" width="120" height="34" fill="#0e7490" stroke="#cbd5e1"/><text x="560" y="236" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">الدواء</text><rect x="300" y="215" width="200" height="34" fill="#0e7490" stroke="#cbd5e1"/><text x="400" y="236" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">نقطة تعلّم</text><rect x="20" y="215" width="280" height="34" fill="#0e7490" stroke="#cbd5e1"/><text x="160" y="236" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">تحذير</text><rect x="500" y="249" width="120" height="46" fill="#e0f2fe" stroke="#cbd5e1"/><text x="560" y="276" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">ACE/ARB</text><rect x="300" y="249" width="200" height="46" fill="#ffffff" stroke="#cbd5e1"/><text x="400" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">-pril اختيار أول؛ -sartan ثانيًا</text><rect x="20" y="249" width="280" height="46" fill="#ffffff" stroke="#cbd5e1"/><text x="160" y="276" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">تجنب الحمل؛ ACE سعال ووذمة وعائية؛ K مرتفع</text><rect x="500" y="295" width="120" height="46" fill="#e0f2fe" stroke="#cbd5e1"/><text x="560" y="322" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">حاصر بيتا</text><rect x="300" y="295" width="200" height="46" fill="#f1f5f9" stroke="#cbd5e1"/><text x="400" y="322" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">-lol؛ يخفض المعدل والضغط</text><rect x="20" y="295" width="280" height="46" fill="#f1f5f9" stroke="#cbd5e1"/><text x="160" y="322" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">أوقف عند أقل من 60 أو 90/60 أو ربو</text><rect x="500" y="341" width="120" height="46" fill="#e0f2fe" stroke="#cbd5e1"/><text x="560" y="368" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">مدرات</text><rect x="300" y="341" width="200" height="46" fill="#ffffff" stroke="#cbd5e1"/><text x="400" y="368" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">furosemide و spironolactone</text><rect x="20" y="341" width="280" height="46" fill="#ffffff" stroke="#cbd5e1"/><text x="160" y="368" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">K: فقد مقابل توفير</text><rect x="500" y="387" width="120" height="46" fill="#e0f2fe" stroke="#cbd5e1"/><text x="560" y="414" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">موسعات/ digoxin</text><rect x="300" y="387" width="200" height="46" fill="#f1f5f9" stroke="#cbd5e1"/><text x="400" y="414" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">nitrates / انقباض أعمق</text><rect x="20" y="387" width="280" height="46" fill="#f1f5f9" stroke="#cbd5e1"/><text x="160" y="414" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">تجنب -afil؛ سُمّية digoxin &gt; 2.0</text><text x="320" y="485" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">الأولوية: furosemide وريدي + رفع الرأس 45° + أكسجين + إيقاف السوائل والملح</text></svg>