<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 416" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="416" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">استئصال الدرقية: الأولويات بعد الجراحة</text>
<rect x="14.0" y="52" width="652.0" height="97.75" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="14.0" y="52" width="652.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="340.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">A: المجرى الهوائي (الأولوية الأولى)</text>
<text x="656.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• خطر العاصفة الدرقية</text>
<text x="656.0" y="115.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• طقم تنبيب وفغر القصبة بجانب المريض</text>
<text x="656.0" y="134.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• شهيق صارخ (Stridor) = صوت مسموع: راقب قوة وجودة الصوت</text>
<rect x="14.0" y="161.75" width="652.0" height="117.0" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="14.0" y="161.75" width="652.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="340.0" y="179.75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">B و C: التنفس والدورة</text>
<text x="656.0" y="205.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• النزف حول الوسادة (خلف الرقبة) وفي موضع الجرح</text>
<text x="656.0" y="225.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• حافظ على رأس ورقبة في وضع محايد</text>
<text x="656.0" y="244.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ليس مستلقياً: ارفع الرأس 30–45 درجة</text>
<text x="656.0" y="263.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا ثني ولا بسط للرقبة</text>
<rect x="14.0" y="290.75" width="652.0" height="97.75" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.2"/>
<rect x="14.0" y="290.75" width="652.0" height="26" rx="10" fill="#6366f1" fill-opacity="1" stroke="#6366f1" stroke-width="1.2"/>
<text x="340.0" y="308.75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الكالسيوم (جارات الدرقية)</text>
<text x="656.0" y="334.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• كالسيوم منخفض أقل من 8.6 (الطبيعي 8.6–10.2)</text>
<text x="656.0" y="354.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• Chvostek وTrousseau (التواء اليد) وتنميل حول الفم وتشنج عضلي</text>
<text x="656.0" y="373.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا تنسَ إزالة الغدة (T) فافحص الكالسيوم (C)</text>
</svg>
