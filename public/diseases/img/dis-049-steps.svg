<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="330" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">نزيف؟ ست خطوات بالترتيب</text>
  <g text-anchor="middle" font-size="13" font-weight="700">
    <rect x="445" y="50" width="175" height="115" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <circle cx="470" cy="75" r="14" fill="#dc2626"/><text x="470" y="80" fill="#fff">1</text>
    <text x="545" y="105" fill="#7f1d1d">اضغط على مكان</text><text x="545" y="125" fill="#7f1d1d">النزيف</text><text x="545" y="148" font-weight="400" font-size="11" fill="#475569">+ ارفع الطرف</text>
    <rect x="232" y="50" width="195" height="115" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <circle cx="257" cy="75" r="14" fill="#ea580c"/><text x="257" y="80" fill="#fff">2</text>
    <text x="330" y="105" fill="#7c2d12">قس الضغط والنبض</text><text x="330" y="125" fill="#7c2d12">(+ SpO2 وأكسجين)</text><text x="330" y="148" font-weight="400" font-size="11" fill="#475569">قارن بالعلامات السابقة</text>
    <rect x="20" y="50" width="195" height="115" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <circle cx="45" cy="75" r="14" fill="#ca8a04"/><text x="45" y="80" fill="#fff">3</text>
    <text x="118" y="105" fill="#713f12">ركّب كانيولتين</text><text x="118" y="125" fill="#713f12">يمين وشمال</text><text x="118" y="148" font-weight="400" font-size="11" fill="#475569">أكبر مقاس متاح</text>
    <rect x="445" y="180" width="175" height="115" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <circle cx="470" cy="205" r="14" fill="#16a34a"/><text x="470" y="210" fill="#fff">4</text>
    <text x="545" y="235" fill="#14532d">خد عينة واعرف</text><text x="545" y="255" fill="#14532d">الفصيلة</text><text x="545" y="278" font-weight="400" font-size="11" fill="#475569">CBC + تطابق + تجلط</text>
    <rect x="232" y="180" width="195" height="115" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <circle cx="257" cy="205" r="14" fill="#2563eb"/><text x="257" y="210" fill="#fff">5</text>
    <text x="330" y="235" fill="#1e3a8a">ركّب المحلول</text><text x="330" y="255" fill="#1e3a8a">(رينجر 500 + أدوية)</text><text x="330" y="278" font-weight="400" font-size="11" fill="#475569">حسب أمر الطبيب</text>
    <rect x="20" y="180" width="195" height="115" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="45" cy="205" r="14" fill="#7c3aed"/><text x="45" y="210" fill="#fff">6</text>
    <text x="118" y="235" fill="#4c1d95">فكّر في نقل الدم</text><text x="118" y="255" fill="#4c1d95">نبض فوق 100 أو ضغط تحت 100</text><text x="118" y="278" font-weight="400" font-size="11" fill="#475569">Hb أقل من 7 (8 قلب/صدر)</text>
  </g>
  <text x="320" y="318" text-anchor="middle" font-size="12" fill="#b91c1c" font-weight="700">رد فعل أثناء النقل = أوقف النقل فورًا</text>
</svg>
