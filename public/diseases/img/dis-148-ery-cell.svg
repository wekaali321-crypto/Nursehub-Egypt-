<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="300" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الحمرة (Erysipelas) مقابل الالتهاب الخلوي (Cellulitis)</text>
  <rect x="330" y="46" width="290" height="40" rx="10" fill="#f87171"/><text x="475" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">الحمرة Erysipelas</text>
  <rect x="20" y="46" width="290" height="40" rx="10" fill="#fb923c"/><text x="165" y="72" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">الالتهاب الخلوي Cellulitis</text>
  <g font-size="13" fill="#0f172a" text-anchor="middle">
    <rect x="330" y="92" width="290" height="120" rx="10" fill="#fee2e2"/>
    <text x="475" y="118">عدوى سطحية (الأدمة)</text><text x="475" y="142">حدود واضحة ومرفوعة</text><text x="475" y="166">أحمر لامع ساخن مؤلم</text><text x="475" y="190">غالباً سبحية (Strept)</text>
    <rect x="20" y="92" width="290" height="120" rx="10" fill="#ffedd5"/>
    <text x="165" y="118">عدوى أعمق (تحت الجلد)</text><text x="165" y="142">حدود غير واضحة</text><text x="165" y="166">تورم وحرارة أكتر من اللون</text><text x="165" y="190">سبحية أو عنقودية</text>
  </g>
  <rect x="20" y="224" width="600" height="60" rx="10" fill="#e0f2fe"/>
  <text x="320" y="248" text-anchor="middle" font-size="13" fill="#0c4a6e">الفرق صعب أحياناً لكن العلاج واحد: ارفع الطرف + مضاد حيوي + مسكن/خافض حرارة</text>
  <text x="320" y="270" text-anchor="middle" font-size="12" fill="#0c4a6e">رجل واحدة متورمة ومؤلمة؟ فكّر في جلطة وريدية عميقة (DVT) واطلب دوبلر</text>
</svg>
