<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
<rect width="640" height="470" rx="16" fill="#f8fafc"/>
<text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >العلاج الإشعاعي والعلاج الإشعاعي الداخلي (Brachytherapy)</text>
<rect x="330" y="50" width="300" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="330" y="50" width="300" height="28" rx="10" fill="#0369a1"/>
<text x="480.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >إشعاع خارجي</text>
<text x="480.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >يُستخدم غالباً مع الكيماوي لتقليص الورم قبل الجراحة</text>
<text x="480.0" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >الجلد: أحمر وجاف ويحكّ</text>
<text x="480.0" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >لا فرك ولا لاصق ولا مزيل عرق</text>
<text x="480.0" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >لا حلاقة ولا لوشن ولا بودرة ولا مكياج</text>
<text x="480.0" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >اغسل بيدك لا بقطعة قماش</text>
<rect x="10" y="50" width="310" height="170" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="50" width="310" height="28" rx="10" fill="#b91c1c"/>
<text x="165.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >إشعاع داخلي (Brachytherapy)</text>
<text x="165.0" y="100" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >زرع مادة مشعة داخل الورم 24–72 ساعة</text>
<text x="165.0" y="124" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >لسرطان بطانة الرحم وعنق الرحم</text>
<text x="165.0" y="148" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >المريض مصدر إشعاع</text>
<text x="165.0" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >سلامتك أولاً</text>
<rect x="10" y="235" width="620" height="205" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="235" width="620" height="28" rx="10" fill="#7c3aed"/>
<text x="320.0" y="254" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >قواعد السلامة (وقت - مسافة - حماية)</text>
<text x="320.0" y="285" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >الوقت: 30 دقيقة لكل نوبة، وجمّع الرعاية (Cluster care)، وارتد شارة قياس الإشعاع</text>
<text x="320.0" y="319" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >المسافة: الزوار 6 أقدام (حوالي 2 متر) على الأقل، لا حوامل ولا أقل من 18 سنة</text>
<text x="320.0" y="353" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >غرفة خاصة وحمام خاص، الباب مغلق دائماً، لافتة تحذير إشعاع على الباب</text>
<text x="320.0" y="387" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >الحماية: مريلة الرصاص عند التماس المباشر</text>
</svg>