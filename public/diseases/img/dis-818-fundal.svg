<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 283" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="283" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ارتفاع قاع الرحم (Fundal Height) حسب الأسبوع</text><rect x="470.0" y="50" width="150.0" height="31" fill="#1e3a8a" stroke="#cbd5e1"/><text x="545.0" y="70.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الأسبوع</text><rect x="20.0" y="50" width="450.0" height="31" fill="#1e3a8a" stroke="#cbd5e1"/><text x="245.0" y="70.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الموضع</text><rect x="470.0" y="81" width="150.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="545.0" y="101.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">12</text><rect x="20.0" y="81" width="450.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="245.0" y="101.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">فوق عظم العانة</text><rect x="470.0" y="112" width="150.0" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="545.0" y="132.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">16</text><rect x="20.0" y="112" width="450.0" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="245.0" y="132.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">منتصف المسافة بين العانة والسرة</text><rect x="470.0" y="143" width="150.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="545.0" y="163.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">20</text><rect x="20.0" y="143" width="450.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="245.0" y="163.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">عند السرة</text><rect x="470.0" y="174" width="150.0" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="545.0" y="194.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">36</text><rect x="20.0" y="174" width="450.0" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="245.0" y="194.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">عند الناتئ الخنجري (Xiphoid)</text><rect x="470.0" y="205" width="150.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="545.0" y="225.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">38-40</text><rect x="20.0" y="205" width="450.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="245.0" y="225.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">ينزل رأس الجنين ويهبط القاع</text><rect x="470.0" y="236" width="150.0" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="545.0" y="256.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">القاعدة</text><rect x="20.0" y="236" width="450.0" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="245.0" y="256.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">الارتفاع بالسم ≈ عدد الأسابيع ± 2 (مثال: أسبوع 24 ≈ 26 ± 2 سم)</text></svg>