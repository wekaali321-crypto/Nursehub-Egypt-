<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 182" width="640" height="182" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="الخرف مقابل الهذيان (Dementia vs Delirium)"><rect width="640" height="182" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">الخرف مقابل الهذيان (Dementia vs Delirium)</text><rect x="10" y="48" width="620" height="28" rx="6" fill="#2b6a9e"/><text x="578.3333333333334" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff"></text><text x="397.5" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الهذيان (Delirium)</text><text x="139.16666666666666" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الخرف (Dementia)</text><rect x="10" y="76" width="620" height="27" fill="#f4f8fc" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="95" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">البداية</text><text x="519.6666666666666" y="95" text-anchor="start" font-size="12.5"  fill="#1d2939">تغيّر مفاجئ</text><text x="261.3333333333333" y="95" text-anchor="start" font-size="12.5"  fill="#1d2939">تغيّر تدريجي</text><rect x="10" y="103" width="620" height="27" fill="#fff" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="122" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">العرض</text><text x="519.6666666666666" y="122" text-anchor="start" font-size="12.5"  fill="#1d2939">يؤثر على الإدراك والحواس</text><text x="261.3333333333333" y="122" text-anchor="start" font-size="12.5"  fill="#1d2939">يؤثر على الذاكرة والحكم</text><rect x="10" y="130" width="620" height="44" fill="#f4f8fc" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="149" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">قابلية العكس</text><text x="519.6666666666666" y="149" text-anchor="start" font-size="12.5"  fill="#1d2939">نعم عند علاج السبب (نقص أكسجين، خلل</text><text x="519.6666666666666" y="166" text-anchor="start" font-size="12.5"  fill="#1d2939">أملاح، عدوى)</text><text x="261.3333333333333" y="149" text-anchor="start" font-size="12.5"  fill="#1d2939">لا؛ يمكن إبطاء التقدم بالأدوية</text><text x="261.3333333333333" y="166" text-anchor="start" font-size="12.5"  fill="#1d2939">وتغيير البيئة لسلامة المريض</text></svg>