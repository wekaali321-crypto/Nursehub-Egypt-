<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="640" height="430" rx="16" fill="#f8fafc"/>
<text x="320.0" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مسار DKA بالساعات: سوائل ثم إنسولين وبوتاسيوم</text>
<rect x="20" y="44" width="195" height="36" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
<text x="117.5" y="66.16666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">أول 30–60 دقيقة</text>
<rect x="20" y="86" width="195" height="190" rx="10" fill="#fff" stroke="#2563eb"/>
<text x="117" y="112" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">خطان وريديان</text>
<text x="117" y="146" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">سحب: يوريا، WBC، K، سكر</text>
<text x="117" y="180" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">محلول ملح لتر خلال 30 د</text>
<text x="117" y="214" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">ثم لتر خلال ساعة</text>
<text x="117" y="248" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">إنسولين مائي 10 وحدات عضل (بديل المضخة)</text>
<rect x="225" y="44" width="195" height="36" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="322.5" y="66.16666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">بعد ساعة</text>
<rect x="225" y="86" width="195" height="190" rx="10" fill="#fff" stroke="#d97706"/>
<text x="322" y="112" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">قس السكر والبوتاسيوم</text>
<text x="322" y="146" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">اسأل: هل بال المريض؟</text>
<text x="322" y="180" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">كمّل ملح لتر ثاني وثالث</text>
<text x="322" y="214" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">إنسولين 5 وحدات/ساعة (عضل)</text>
<text x="322" y="248" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">ابدأ البوتاسيوم في اللتر الثاني</text>
<rect x="430" y="44" width="195" height="36" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="527.5" y="66.16666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">عند سكر 250 mg/dl</text>
<rect x="430" y="86" width="195" height="190" rx="10" fill="#fff" stroke="#16a34a"/>
<text x="527" y="112" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">بدّل لجلوكوز 10%</text>
<text x="527" y="146" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">كل باينت على 4 ساعات</text>
<text x="527" y="180" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">استمر إنسولين وبوتاسيوم</text>
<text x="527" y="214" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">هدف نزول 55–110/ساعة</text>
<text x="527" y="248" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">لا تسرّع (استسقاء مخ)</text>
<rect x="20" y="292" width="600" height="44" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="320.0" y="309.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">كل ساعة: ضغط • نبض • تنفس • SpO₂ • إخراج بول • سكر</text>
<text x="320.0" y="326.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">بلا بول خلال 3 ساعات ⟵ قسطرة بولية</text>
<rect x="20" y="348" width="600" height="56" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="320.0" y="371.5833333333333" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7f1d1d">البوتاسيوم: أكثر من 5.5 ⟵ لا تعطِ ‑ 3.5–5.5 ⟵ أعطِ (حسب البروتوكول)</text>
<text x="320.0" y="388.0833333333333" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7f1d1d">أقل من 3.5 (3.3 حديثاً) ⟵ استشارة وتصحيح قبل الإنسولين</text>
<text x="320" y="424" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">الأرقام بالـmmol/L للبوتاسيوم؛ نفّذ حسب بروتوكول المستشفى</text></svg>