<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 382" width="640" height="382" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="المكمّلات العشبية: الاستعمال والمخاطر"><rect width="640" height="382" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">المكمّلات العشبية: الاستعمال والمخاطر</text><text x="320.0" y="54" text-anchor="middle" font-size="12.5" fill="#667085">الأولوية: تقييم التداخلات الدوائية</text><rect x="326.0" y="68" width="302.0" height="170" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="326.0" y="68" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="326.0" y="82" width="302.0" height="14" fill="#b42318"/><text x="477.0" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">خطر النزف (E-G-G-G-G-O)</text><text x="616.0" y="116" text-anchor="start" font-size="12.5" fill="#1d2939">• فيتامين E</text><text x="616.0" y="134" text-anchor="start" font-size="12.5" fill="#1d2939">• Ginger (زنجبيل)</text><text x="616.0" y="152" text-anchor="start" font-size="12.5" fill="#1d2939">• Garlic (ثوم)</text><text x="616.0" y="170" text-anchor="start" font-size="12.5" fill="#1d2939">• Ginkgo biloba</text><text x="616.0" y="188" text-anchor="start" font-size="12.5" fill="#1d2939">• Ginseng</text><text x="616.0" y="206" text-anchor="start" font-size="12.5" fill="#1d2939">• Omega-3</text><text x="616.0" y="224" text-anchor="start" font-size="12.5" fill="#1d2939">• أوقفها 2–3 أسابيع قبل الجراحة</text><rect x="12.0" y="68" width="302.0" height="116" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="12.0" y="68" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="12.0" y="82" width="302.0" height="14" fill="#2b6a9e"/><text x="163.0" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">مفاصل وقلب وجلد</text><text x="302.0" y="116" text-anchor="start" font-size="12.5" fill="#1d2939">• Glucosamine: التهاب المفاصل؛ راقب هبوط</text><text x="302.0" y="134" text-anchor="start" font-size="12.5" fill="#1d2939">   السكر مع أدوية السكري</text><text x="302.0" y="152" text-anchor="start" font-size="12.5" fill="#1d2939">• Hawthorn: القلب</text><text x="302.0" y="170" text-anchor="start" font-size="12.5" fill="#1d2939">• Evening primrose: الأكزيما</text><rect x="12.0" y="196" width="302.0" height="80" rx="10" fill="#e0f5f3" stroke="#14756c" stroke-width="1.2"/><rect x="12.0" y="196" width="302.0" height="28" rx="10" fill="#14756c"/><rect x="12.0" y="210" width="302.0" height="14" fill="#14756c"/><text x="163.0" y="215" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">البروستاتا والسن اليأس</text><text x="302.0" y="244" text-anchor="start" font-size="12.5" fill="#1d2939">• Saw palmetto: تضخم البروستاتا الحميد BPH</text><text x="302.0" y="262" text-anchor="start" font-size="12.5" fill="#1d2939">• Black cohosh: هبّات الحرارة</text><rect x="326.0" y="250" width="302.0" height="116" rx="10" fill="#efe9fb" stroke="#6a4bb5" stroke-width="1.2"/><rect x="326.0" y="250" width="302.0" height="28" rx="10" fill="#6a4bb5"/><rect x="326.0" y="264" width="302.0" height="14" fill="#6a4bb5"/><text x="477.0" y="269" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">النوم والمزاج</text><text x="616.0" y="298" text-anchor="start" font-size="12.5" fill="#1d2939">• Valerian: الأرق</text><text x="616.0" y="316" text-anchor="start" font-size="12.5" fill="#1d2939">• St. John wort: يرفع السيروتونين</text><text x="616.0" y="334" text-anchor="start" font-size="12.5" fill="#1d2939">• لا يُدمج مع مضادات الاكتئاب</text><text x="616.0" y="352" text-anchor="start" font-size="12.5" fill="#1d2939">• متلازمة السيروتونين</text></svg>