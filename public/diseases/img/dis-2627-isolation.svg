<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="380" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">العزل: رذاذي مقابل هوائي والبس/اخلع</text><rect x="330" y="46" width="290" height="110" rx="10" fill="#2563eb"/><text x="475.0" y="88.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">رذاذي Droplet</text><text x="475.0" y="104.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">سعال شاهق، إنفلونزا، سحايا، التهاب رئوي</text><text x="475.0" y="120.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">كمامة جراحية + نظارة، غرفة مفردة</text><rect x="20" y="46" width="300" height="110" rx="10" fill="#dc2626"/><text x="170.0" y="80.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">هوائي Airborne</text><text x="170.0" y="96.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">حصبة، سل، جدري مائي/حزام</text><text x="170.0" y="112.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">N95، غرفة ضغط سالب، باب مغلق</text><text x="170.0" y="128.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">المريض يرتدي كمامة جراحية عند النقل</text><text x="320" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">ترتيب اللبس (Gown → Mask → Goggles → Gloves)</text><rect x="500" y="196" width="115" height="34" rx="10" fill="#16a34a"/><text x="557.5" y="217.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1 رداء</text><rect x="375" y="196" width="115" height="34" rx="10" fill="#16a34a"/><text x="432.5" y="217.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2 كمامة</text><rect x="250" y="196" width="115"