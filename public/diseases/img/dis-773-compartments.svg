<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 258" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="258" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">أماكن السوائل في الجسم</text><rect x="324" y="50" width="302" height="84" rx="12" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><rect x="324" y="50" width="302" height="28" rx="12" fill="#2563eb"/><text x="475" y="69" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">داخل الخلايا (ICF)</text><text x="475" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">حوالي ثلثي ماء الجسم</text><text x="475" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">بوتاسيوم ومغنيسيوم وفوسفات عالي</text><rect x="14" y="50" width="302" height="84" rx="12" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><rect x="14" y="50" width="302" height="28" rx="12" fill="#16a34a"/><text x="165" y="69" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">خارج الخلايا (ECF)</text><text x="165" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">حوالي الثلث</text><text x="165" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">صوديوم وكلوريد عالي</text><rect x="324" y="142" width="302" height="100" rx="12" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><rect x="324" y="142" width="302" height="44" rx="12" fill="#ea580c"/><text x="475" y="161" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">بين الخلايا (Interstitial) — «الفراغ</text><text x="475" y="177" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">الثالث»</text><text x="475" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">سائل النسيج</text><text x="475" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">يتجمع فيه الورم عند الزيادة</text><rect x="14" y="142" width="302"