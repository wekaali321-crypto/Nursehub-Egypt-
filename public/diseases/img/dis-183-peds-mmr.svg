<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 438" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="438" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الحصبة والنكاف والحصبة الألمانية (مراجعة)</text><rect x="325" y="48" width="295" height="212" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الحصبة (Measles)</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">شديدة العدوى هوائيًا؛ الفيروس يبقى</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">بالهواء/الأسطح ساعتين</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">تظهر الأعراض بعد 7–14 يومًا: سعال، رشح،</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">التهاب عيون، التهاب حلق، حمى، طفح أحمر</text><text x="610" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">&lt;b&gt;غير حاك&lt;/b&gt; (الحاك يخص الجدري المائي)</text><text x="610" y="200" text-anchor="start" font-size="12.5" fill="#1e293b">عزل هوائي: ضغط سالب، N95، باب مغلق</text><text x="610" y="220" text-anchor="start" font-size="12.5" fill="#1e293b">فيتامين A يقلل الوفيات</text><text x="610" y="240" text-anchor="start" font-size="12.5" fill="#1e293b">تطعيم أفراد الأسرة المعرضين</text><rect x="20" y="48" width="295" height="212" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">النكاف (Mumps)</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">التهاب الغدد اللعابية وينتقل باللعاب</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">حمى، ألم عضلي، قلة شهية، تورم مؤلم بالغدد؛</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">قد لا تظهر أعراض</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">علاج داعم: أطعمة طرية وسوائل، تجنب العصائر</text><text x="305" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">(تنشط اللعاب)، شفاء نحو أسبوعين</text><rect x="325" y="270" width="295" height="152" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="270" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="291" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الحصبة الألمانية (Rubella)</text><text x="610" y="322" text-anchor="start" font-size="12.5" fill="#1e293b">تنتقل بالرذاذ والمخاط؛ الأعراض بعد 2–3</text><text x="610" y="342" text-anchor="start" font-size="12.5" fill="#1e293b">أسابيع</text><text x="610" y="362" text-anchor="start" font-size="12.5" fill="#1e293b">رشح وعطس وسعال وحمى</text><text x="610" y="382" text-anchor="start" font-size="12.5" fill="#1e293b">لا علاج بعد الإصابة؛ الوقاية بـ MMR</text><rect x="20" y="270" width="295" height="152" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><rect x="20" y="270" width="295" height="30" rx="12" fill="#9333ea"/><text x="167.5" y="291" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">MMR</text><text x="305" y="322" text-anchor="start" font-size="12.5" fill="#1e293b">رضيع أقل من 12 شهرًا غير مطعّم تعرّض</text><text x="305" y="342" text-anchor="start" font-size="12.5" fill="#1e293b">للحصبة: يُطعَّم خلال 72 ساعة من التعرض</text><text x="305" y="362" text-anchor="start" font-size="12.5" fill="#1e293b">جرعة مبكرة من 6 أشهر في التفشي، والروتينية</text><text x="305" y="382" text-anchor="start" font-size="12.5" fill="#1e293b">12–15 شهرًا ثم 4–6 سنوات</text><text x="305" y="402" text-anchor="start" font-size="12.5" fill="#1e293b">نيومايسين: حساسية؛ أثر جانبي: التهاب مفاصل</text>
</svg>
