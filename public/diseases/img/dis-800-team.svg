<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="324" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أدوار فريق العمليات</text><rect x="420" y="48" width="200" height="31" fill="#1e3a8a" stroke="#cbd5e1"/><text x="520" y="67.66666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">الدور</text><rect x="20" y="48" width="400" height="31" fill="#1e3a8a" stroke="#cbd5e1"/><text x="220" y="67.66666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">المسؤولية الأساسية</text><rect x="420" y="79" width="200" height="31" fill="#fff" stroke="#cbd5e1"/><text x="520" y="98.66666666666667" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الجراح</text><rect x="20" y="79" width="400" height="31" fill="#fff" stroke="#cbd5e1"/><text x="220" y="98.66666666666667" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">يجري العملية ويقود الفريق</text><rect x="420" y="110" width="200" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="520" y="129.66666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">المساعد الجراحي</text><rect x="20" y="110" width="400" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="220" y="129.66666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">جراح آخر/مقيم/ممرض مساعد أول/مساعد طبيب</text><rect x="420" y="141" width="200" height="31" fill="#fff" stroke="#cbd5e1"/><text x="520" y="160.66666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">طبيب أو فني التخدير</text><rect x="20" y="141" width="400" height="31" fill="#fff" stroke="#cbd5e1"/><text x="220" y="160.66666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">يعطي التخدير ويراقب العلامات الحيوية طول العملية</text><rect x="420" y="172" width="200" height="48" fill="#eef2ff" stroke="#cbd5e1"/><text x="520" y="200.16666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الممرضة الدوارة (Circulating)</text><rect x="20" y="172" width="400" height="48" fill="#eef2ff" stroke="#cbd5e1"/><text x="220" y="191.91666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">غير معقمة: مدافعة عن المريض، تجهز المستلزمات والدم، تضع</text><text x="220" y="208.41666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">المريض، تنظف الجلد</text><rect x="420" y="220" width="200" height="31" fill="#fff" stroke="#cbd5e1"/><text x="520" y="239.66666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الممرضة المعقمة (Scrub)</text><rect x="20" y="220" width="400" height="31" fill="#fff" stroke="#cbd5e1"/><text x="220" y="239.66666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تجهز الحقل المعقم وتسلم الأدوات وتستلمها</text><rect x="420" y="251" width="200" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="520" y="270.6666666666667" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">ممرضة منطقة الانتظار</text><rect x="20" y="251" width="400" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="220" y="270.6666666666667" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">ترعى المرضى قبل دخول الغرفة وتساعد في النقل</text><text x="320" y="306" text-anchor="middle" font-size="12" fill="#475569">العدّ (شاش، أدوات، إبر) يتم قبل العملية وأثناءها وعند القفل</text></svg>