<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="210" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">القوباء المعدية (Impetigo)</text>
<rect x="20.0" y="48" width="193.33333333333334" height="140" rx="10" fill="#ca8a04"/>
<text x="116.66666666666667" y="103.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">السبب</text>
<text x="116.66666666666667" y="122.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">عقدية أو عنقودية</text>
<text x="116.66666666666667" y="141.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">شائعة بالأطفال</text>
<rect x="223.33333333333334" y="48" width="193.33333333333334" height="140" rx="10" fill="#b91c1c"/>
<text x="320.0" y="84.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">العلامات</text>
<text x="320.0" y="103.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تقرحات حاكة حول الأنف</text>
<text x="320.0" y="122.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">والفم</text>
<text x="320.0" y="141.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">قشور بلون العسل = أشد عدوى</text>
<text x="320.0" y="160.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Ecthyma أعمق وأشد</text>
<rect x="426.6666666666667" y="48" width="193.33333333333334" height="140" rx="10" fill="#0f766e"/>
<text x="523.3333333333334" y="93.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">التمريض</text>
<text x="523.3333333333334" y="112.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لا مدرسة أو حضانة</text>
<text x="523.3333333333334" y="131.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">غسل الأيدي، أظافر قصيرة</text>
<text x="523.3333333333334" y="150.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">غسيل منفصل بماء ساخن</text>
</svg>
