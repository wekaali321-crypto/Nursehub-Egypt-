<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >فونداباريناكس (Fondaparinux): الميزة والمحاذير</text>
<rect x="330" y="50" width="300" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="330" y="50" width="300" height="28" rx="10" fill="#15803d"/>
<text x="480.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >الميزة</text>
<text x="480.0" y="100" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >لا يسبب HIT</text>
<text x="480.0" y="119" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >قريب من الهيبارين منخفض الوزن</text>
<rect x="10" y="50" width="310" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="50" width="310" height="28" rx="10" fill="#b91c1c"/>
<text x="165.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >العيب</text>
<text x="165.0" y="100" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >خطر نزيف فوق الجافية (Epidural hematoma)</text>
<text x="165.0" y="119" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >خصوصاً مع القسطرة الشوكية</text>
<rect x="10" y="175" width="620" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="175" width="620" height="28" rx="10" fill="#b91c1c"/>
<text x="320.0" y="194" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >متى لا تعطيه؟ احجب الجرعة وبلّغ الطبيب</text>
<text x="320.0" y="225" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >ألم ظهر شديد أو تنميل/ضعف الساقين أو انخفاض الوعي أو شلل</text>
<text x="320.0" y="249" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >لا يُعطى قبل 6 ساعات على الأقل بعد الجراحة</text>
<text x="320.0" y="273" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >لا مضادات تخثر مع قسطرة فوق الجافية دون أمر واضح</text>
</svg>