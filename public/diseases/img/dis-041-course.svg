<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="230" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مسار نزلة البرد المعتاد</text>
  <line x1="40" y1="110" x2="600" y2="110" stroke="#94a3b8" stroke-width="3"/>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <circle cx="540" cy="110" r="14" fill="#f59e0b"/><text x="540" y="115" fill="#fff">1</text>
    <text x="540" y="75" fill="#0f172a">اليوم 1–2</text><text x="540" y="150" fill="#475569" font-weight="400" font-size="12">حكة وجفاف حلق</text><text x="540" y="168" fill="#475569" font-weight="400" font-size="12">وعطس</text>
    <circle cx="410" cy="110" r="14" fill="#ef4444"/><text x="410" y="115" fill="#fff">2</text>
    <text x="410" y="75" fill="#0f172a">اليوم 3–4</text><text x="410" y="150" fill="#475569" font-weight="400" font-size="12">رشح غزير وكحة</text><text x="410" y="168" fill="#475569" font-weight="400" font-size="12">وتكسير (أشد فترة)</text>
    <circle cx="280" cy="110" r="14" fill="#f97316"/><text x="280" y="115" fill="#fff">3</text>
    <text x="280" y="75" fill="#0f172a">اليوم 5–7</text><text x="280" y="150" fill="#475569" font-weight="400" font-size="12">انسداد أنف وبلغم</text><text x="280" y="168" fill="#475569" font-weight="400" font-size="12">وتحسن تدريجي</text>
    <circle cx="150" cy="110" r="14" fill="#22c55e"/><text x="150" y="115" fill="#fff">4</text>
    <text x="150" y="75" fill="#0f172a">اليوم 7–10</text><text x="150" y="150" fill="#475569" font-weight="400" font-size="12">شفاء، وقد تبقى</text><text x="150" y="168" fill="#475569" font-weight="400" font-size="12">كحة خفيفة</text>
  </g>
  <rect x="60" y="188" width="520" height="30" rx="8" fill="#fee2e2"/>
  <text x="320" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">أكتر من 10 أيام أو حرارة عالية أو ضيق نفس = ليست نزلة برد بسيطة</text>
</svg>
