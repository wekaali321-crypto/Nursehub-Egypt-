<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 378" width="640" height="378" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="منبّهات الجهاز العصبي المركزي (CNS Stimulants)"><rect width="640" height="378" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">منبّهات الجهاز العصبي المركزي (CNS Stimulants)</text><rect x="326.0" y="46" width="302.0" height="188" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Amphetamines</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• مقلّدة للودي (Sympathomimetic): تسرّع</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   الجهاز العصبي المركزي</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• ارتفاع ضغط، يقظة، نبض أسرع/أبطأ</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• ADHD، النوم القهري، انقطاع التنفس</text><text x="616.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">   الانسدادي النومي، السمنة الخارجية</text><text x="616.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">   المنشأ، التعب (كافيين)</text><text x="616.0" y="202" text-anchor="start" font-size="12.5" fill="#1d2939">• Dexmethylphenidate (Focalin)،</text><text x="616.0" y="220" text-anchor="start" font-size="12.5" fill="#1d2939">   Methamphetamine (Desoxyn)</text><rect x="12.0" y="46" width="302.0" height="152" rx="10" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#2e7d4f"/><rect x="12.0" y="60" width="302.0" height="14" fill="#2e7d4f"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Analeptics</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• تنبه مركز التنفس والقلب</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• Armodafinil (Nuvigil)، Modafinil</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">   (Provigil): نوم قهري وانقطاع تنفس نوم،</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">   نعاس العمل بنوبات</text><text x="302.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• Doxapram (Dopram): تثبيط التنفس بعد</text><text x="302.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">   التخدير أو بالأدوية</text><rect x="12.0" y="210" width="302.0" height="152" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="12.0" y="210" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="12.0" y="224" width="302.0" height="14" fill="#a86a00"/><text x="163.0" y="229" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Anorexiants</text><text x="302.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• تشبه الأمفيتامين؛ تكبح الشهية بتأثير</text><text x="302.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">   الوطاء</text><text x="302.0" y="294" text-anchor="start" font-size="12.5" fill="#1d2939">• Benzphetamine (Didrex)، Phendimetrazine</text><text x="302.0" y="312" text-anchor="start" font-size="12.5" fill="#1d2939">   (Bontril)</text><text x="302.0" y="330" text-anchor="start" font-size="12.5" fill="#1d2939">• للسمنة (BMI 30 فأكثر أو 27 مع أمراض</text><text x="302.0" y="348" text-anchor="start" font-size="12.5" fill="#1d2939">   مصاحبة) مع حمية ونشاط</text><rect x="326.0" y="246" width="302.0" height="116" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="326.0" y="246" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="326.0" y="260" width="302.0" height="14" fill="#b42318"/><text x="477.0" y="265" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">موانع مشتركة</text><text x="616.0" y="294" text-anchor="start" font-size="12.5" fill="#1d2939">• فرط حساسية، تشنجات</text><text x="616.0" y="312" text-anchor="start" font-size="12.5" fill="#1d2939">• COPD/اضطراب التهوية، أمراض القلب</text><text x="616.0" y="330" text-anchor="start" font-size="12.5" fill="#1d2939">• ارتفاع الضغط، فرط الدرقية</text><text x="616.0" y="348" text-anchor="start" font-size="12.5" fill="#1d2939">• الجلوكوما، الحمل</text></svg>