<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 242" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="242" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">فيروس الورم الحليمي البشري (HPV)</text><rect x="325" y="54" width="295" height="173.2" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.5"/><rect x="325" y="54" width="295" height="29" rx="10" fill="#6366f1"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">ما هو؟</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• أشيع الأمراض المنقولة جنسيًا</text><text x="612" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• يرتبط بسرطان عنق الرحم والثآليل</text><text x="612" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">التناسلية</text><text x="612" y="163.6" text-anchor="start" font-size="13" fill="#0f172a">• لا أعراض غالبًا: لا يعرف المصاب أنه</text><text x="612" y="181.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">مصاب</text><rect x="20" y="54" width="295" height="173.2" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="20" y="54" width="295" height="29" rx="10" fill="#10b981"/><text x="307" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الوقاية</text><text x="307" y="99" text-anchor="start" font-size="13" fill="#0f172a">• اللقاح من 9 إلى 26 سنة</text><text x="307" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• مسحة بابانيكولاو سنويًا</text><text x="307" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• الانتقال بالتلامس الجلدي (بما فيه</text><text x="307" y="163.6" text-anchor="start" font-size="13" fill="#0f172a">الفموي)</text><text x="307" y="186.8" text-anchor="start" font-size="13" fill="#0f172a">• الواقي لا يحمي 100%</text><text x="307" y="210" text-anchor="start" font-size="13" fill="#0f172a">• ينتقل حتى بلا أعراض</text></svg>
