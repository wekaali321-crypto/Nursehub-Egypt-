<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 288" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="288" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">العزل: القطيرات مقابل الهوائي</text><rect x="325" y="54" width="295" height="219.6" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="325" y="54" width="295" height="29" rx="10" fill="#0ea5e9"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">القطيرات (Droplet)</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• السعال الديكي (Pertussis)</text><text x="612" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• الإنفلونزا</text><text x="612" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• التهاب السحايا (Meningitis)</text><text x="612" y="168.6" text-anchor="start" font-size="13" fill="#0f172a">• الالتهاب الرئوي (Pneumonia)</text><text x="612" y="191.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">• كمامة جراحية ونظارات واقية</text><text x="612" y="214.99999999999997" text-anchor="start" font-size="13" fill="#0f172a">• غرفة منفردة</text><text x="612" y="238.19999999999996" text-anchor="start" font-size="13" fill="#0f172a">• علّم الأفراد غير المرخصين ارتداء</text><text x="612" y="256.4" text-anchor="start" font-size="13" fill="#0f172a">الكمامة</text><rect x="20" y="54" width="295" height="219.6" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="20" y="54" width="295" height="29" rx="10" fill="#10b981"/><text x="307" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الهوائي (Airborne)</text><text x="307" y="99" text-anchor="start" font-size="13" fill="#0f172a">• الحصبة (Measles)</text><text x="307" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• السل (TB)</text><text x="307" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• الجديري/الحزام (Varicella)</text><text x="307" y="168.6" text-anchor="start" font-size="13" fill="#0f172a">• قناع N95 للطاقم</text><text x="307" y="191.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">• غرفة ضغط سالب</text><text x="307" y="214.99999999999997" text-anchor="start" font-size="13" fill="#0f172a">• الباب مغلق</text><text x="307" y="238.19999999999996" text-anchor="start" font-size="13" fill="#0f172a">• عند النقل: المريض يرتدي كمامة جراحية</text></svg>
