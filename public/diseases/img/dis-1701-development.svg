<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="260" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مراحل النمو قبل الولادة</text><rect x="20" y="55" width="190" height="110" rx="12" fill="#bae6fd"/><text x="115" y="85" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">ما قبل الجنين (Pre-embryonic)</text><text x="115" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">الأسبوع 1 إلى 4</text><text x="115" y="140" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">إخصاب وانغراس وانقسام</text><rect x="225" y="55" width="190" height="110" rx="12" fill="#bbf7d0"/><text x="320" y="85" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">مرحلة الجنين المبكر (Embryonic)</text><text x="320" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">الأسبوع 5 إلى 10</text><text x="320" y="140" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">تكوّن الأعضاء الرئيسية</text><rect x="430" y="55" width="190" height="110" rx="12" fill="#fde68a"/><text x="525" y="85" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">مرحلة الجنين (Fetal)</text><text x="525" y="115" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">الأسبوع 11 إلى 40</text><text x="525" y="140" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">نمو ونضج الأعضاء</text><text x="320" y="200" text-anchor="middle" font-size="12" font-weight="500" fill="#475569">الأعضاء أكثر عرضة للتشوّه من الأدوية والعدوى في مرحلة تكوّنها (أول 10 أسابيع تقريبًا)</text><text x="320" y="225" text-anchor="middle" font-size="12" font-weight="500" fill="#475569">الخلايا الجسدية: 23 زوج كروموسوم (46)، والخلايا الجنسية: 23 كروموسوم فقط</text>
</svg>
