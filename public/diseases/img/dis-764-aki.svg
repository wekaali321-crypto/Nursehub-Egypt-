<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 229" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="229" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أسباب الفشل الكلوي الحاد حسب المكان</text><rect x="475" y="50" width="149" height="32" fill="#dc2626"/><text x="550" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">النوع</text><rect x="326" y="50" width="149" height="32" fill="#dc2626"/><text x="401" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المعنى</text><rect x="16" y="50" width="310" height="32" fill="#dc2626"/><text x="171" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأمثلة</text><rect x="475" y="82" width="149" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="102" text-anchor="start" font-size="13" fill="#0f172a">قبل الكلية Prerenal</text><rect x="326" y="82" width="149" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="467" y="102" text-anchor="start" font-size="13" fill="#0f172a">نقص التروية للكلية</text><rect x="16" y="82" width="310" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="318" y="102" text-anchor="start" font-size="13" fill="#0f172a">هبوط ضغط (صدمة)، قصور القلب (نقص النتاج</text><text x="318" y="121" text-anchor="start" font-size="13" fill="#0f172a">القلبي)، جفاف</text><rect x="475" y="132" width="149" height="50" fill="#fee2e2" stroke="#cbd5e1"/><text x="616" y="152" text-anchor="start" font-size="13" fill="#0f172a">داخل الكلية</text><text x="616" y="171" text-anchor="start" font-size="13" fill="#0f172a">Intrarenal</text><rect x="326" y="132" width="149" height="50" fill="#fee2e2" stroke="#cbd5e1"/><text x="467" y="152" text-anchor="start" font-size="13" fill="#0f172a">تلف النسيج الكلوي</text><text x="467" y="171" text-anchor="start" font-size="13" fill="#0f172a">نفسه</text><rect x="16" y="132" width="310" height="50" fill="#fee2e2"