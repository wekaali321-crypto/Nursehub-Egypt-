<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 392" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="392" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >الوقت = عضلة القلب: الأهداف الزمنية في STEMI</text><rect x="30" y="50" width="580" height="52" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="498" y="50" width="112" height="52" rx="12" fill="#2563eb"/><text x="554" y="82" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >10 دقائق</text><text x="488" y="81" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a" >من الوصول: تخطيط قلب وقراءته</text><rect x="30" y="112" width="580" height="52" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="498" y="112" width="112" height="52" rx="12" fill="#16a34a"/><text x="554" y="144" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >90 دقيقة</text><text x="488" y="143" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a" >أول اتصال طبي → قسطرة أولية (PCI)  — 120 د لو نقل لمستشفى</text><rect x="30" y="174" width="580" height="52" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="498" y="174" width="112" height="52" rx="12" fill="#ea580c"/><text x="554" y="206" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >30 دقيقة</text><text x="488" y="205" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a" >وصول → بدء المُذيب (لو PCI مش متاح خلال 120 د)</text><rect x="30" y="236" width="580" height="52" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="498" y="236" width="112" height="52" rx="12" fill="#dc2626"/><text x="554" y="268" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >60–90 دقيقة</text><text x="488" y="267" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a" >بعد المُذيب: تأكد من هبوط ST ≥ 50%، وإلا فشل التذويب</text><rect x="30" y="298" width="580" height="52" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="498" y="298" width="112" height="52" rx="12" fill="#7c3aed"/><text x="554" y="330" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >12 ساعة</text><text x="488" y="329" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a" >أقصى مدة من بداية الألم لاستفادة المُذيب (أفضل أول 3 ساعات)</text><text x="320" y="374" text-anchor="middle" font-size="12.5" font-weight="700" fill="#64748b" >كل تأخير 30 دقيقة = زيادة واضحة في الوفيات: بلّغ فوراً وسجّل الأوقات</text>
</svg>
