<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="236" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الحمى الروماتيزمية مقابل كاواساكي عند الأطفال</text><rect x="325" y="48" width="295" height="172" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الحمى الروماتيزمية</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">بعد عدوى بكتيريا السبحية (التهاب حلق/حمى</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">قرمزية) لم تُعالج جيدًا</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">احتمال تلف الصمامات ونفخة قلبية</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">تحاليل: ESR وCRP مرتفعة، ASO، عزل بكتيريا</text><text x="610" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">Group A</text><text x="610" y="200" text-anchor="start" font-size="12.5" fill="#1e293b">علاج: مضاد حيوي + مضاد التهاب</text><rect x="20" y="48" width="295" height="172" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">كاواساكي</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">التهاب أوعية تاجية</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">حمى، لسان فراولة، تقشر جلد</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">علاج IVIG ± أسبرين</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">لا لقاحات حية 11 شهرًا</text>
</svg>
