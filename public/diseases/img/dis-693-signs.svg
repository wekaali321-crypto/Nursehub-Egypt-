<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="248" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">علامات ارتفاع الضغط داخل الجمجمة حسب المرحلة</text><rect x="486" y="50" width="138" height="32" fill="#dc2626"/><text x="555" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المرحلة</text><rect x="16" y="50" width="470" height="32" fill="#dc2626"/><text x="251" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلامات</text><rect x="486" y="82" width="138" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="102" text-anchor="end" font-size="13" fill="#0f172a">مبكرة (مهمة جدًا)</text><rect x="16" y="82" width="470" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="478" y="102" text-anchor="end" font-size="13" fill="#0f172a">تغيّر الوعي: تهيج وقلق وعدم استقرار، تراجع الحالة الذهنية، نعاس،</text><text x="478" y="121" text-anchor="end" font-size="13" fill="#0f172a">تبلد انفعالي</text><rect x="486" y="132" width="138" height="31" fill="#fee2e2" stroke="#cbd5e1"/><text x="616" y="152" text-anchor="end" font-size="13" fill="#0f172a">متوسطة</text><rect x="16" y="132" width="470" height="31" fill="#fee2e2" stroke="#cbd5e1"/><text x="478" y="152" text-anchor="end" font-size="13" fill="#0f172a">صداع مستمر؛ قيء مفاجئ بلا غثيان (بلّغ الطبيب)</text><rect x="486" y="163" width="138" height="69" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="183" text-anchor="end" font-size="13" fill="#0f172a">متأخرة قاتلة</text><rect x="16" y="163" width="470" height="69" fill="#ffffff" stroke="#cbd5e1"/><text x="478" y="183" text-anchor="end" font-size="13" fill="#0f172a">تنفس غير منتظم (شيني ستوكس)؛ تيبّس الرقبة؛ حدقتان ثابتتان متسعتان</text><text x="478" y="202" text-anchor="end" font-size="13" fill="#0f172a">(8 mm) وغير متساويتين؛ عين الدمية؛ علامة بابنسكي؛ تشنجات وغيبوبة؛</text><text x="478" y="221" text-anchor="end" font-size="13" fill="#0f172a">وضعيات Decorticate/Decerebrate؛ مثلث كوشينج</text></svg>