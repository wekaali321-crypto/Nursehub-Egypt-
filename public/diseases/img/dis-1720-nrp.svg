<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 224" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="224" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">الإنعاش الأولي للمولود (NRP)</text><rect x="426" y="46" width="193" height="132" rx="12" fill="#bae6fd"/><text x="522.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الخطوات الأولى</text><text x="522.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">ضعه على الدفاية</text><text x="522.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">وضع الشم (Sniffing position)</text><text x="522.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">اشفط مجرى الهواء</text><text x="522.5" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">جفف ونشّط 30 ثانية</text><rect x="223" y="46" width="193" height="132" rx="12" fill="#bbf7d0"/><text x="319.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">النبض 60–100</text><text x="319.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">تهوية بضغط إيجابي (PPV)</text><rect x="20" y="46" width="193" height="132" rx="12" fill="#fde68a"/><text x="116.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">النبض أقل من 60</text><text x="116.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">ابدأ التدليك الصدري</text><text x="116.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">بعد 30 ثانية من PPV جيد</text><text x="116.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">والنبض ما زال أقل من 60</text><text x="116.5" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">وأدرينالين (Epinephrine)</text><text x="320" y="212" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">أي مولود غير مستجيب أو رخو بلا تنفس تلقائي يُعامل فورًا</text>
</svg>
