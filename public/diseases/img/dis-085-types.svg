<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="276" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع القرح القلاعية</text>
<rect x="450" y="48" width="170" height="44" fill="#0ea5e9" stroke="#cbd5e1"/><text x="535" y="75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">النوع</text><rect x="350" y="48" width="100" height="44" fill="#0ea5e9" stroke="#cbd5e1"/><text x="400" y="75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الحجم</text><rect x="260" y="48" width="90" height="44" fill="#0ea5e9" stroke="#cbd5e1"/><text x="305" y="75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">العدد</text><rect x="140" y="48" width="120" height="44" fill="#0ea5e9" stroke="#cbd5e1"/><text x="200" y="75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الشفاء</text><rect x="20" y="48" width="120" height="44" fill="#0ea5e9" stroke="#cbd5e1"/><text x="80" y="75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">ندبة</text>
<rect x="450" y="92" width="170" height="44" fill="#fff" stroke="#cbd5e1"/><text x="535" y="111" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">صغرى (Minor)</text><text x="535" y="127" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">الأشيع ~80%</text><rect x="350" y="92" width="100" height="44" fill="#fff" stroke="#cbd5e1"/><text x="400" y="119" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أقل من 1 سم</text><rect x="260" y="92" width="90" height="44" fill="#fff" stroke="#cbd5e1"/><text x="305" y="119" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">1–5</text><rect x="140" y="92" width="120" height="44" fill="#fff" stroke="#cbd5e1"/><text x="200" y="119" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">7–14 يوم</text><rect x="20" y="92" width="120" height="44" fill="#fff" stroke="#cbd5e1"/><text x="80" y="119" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">لا</text>
<rect x="450" y="136" width="170" height="44" fill="#f1f5f9" stroke="#cbd5e1"/><text x="535" y="163" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">كبرى (Major)</text><rect x="350" y="136" width="100" height="44" fill="#f1f5f9" stroke="#cbd5e1"/><text x="400" y="163" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أكبر من 1 سم</text><rect x="260" y="136" width="90" height="44" fill="#f1f5f9" stroke="#cbd5e1"/><text x="305" y="163" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">1–3</text><rect x="140" y="136" width="120" height="44" fill="#f1f5f9" stroke="#cbd5e1"/><text x="200" y="163" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أسابيع–شهور</text><rect x="20" y="136" width="120" height="44" fill="#f1f5f9" stroke="#cbd5e1"/><text x="80" y="163" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">غالباً</text>
<rect x="450" y="180" width="170" height="44" fill="#fff" stroke="#cbd5e1"/><text x="535" y="199" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">هربتيفورم</text><text x="535" y="215" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f172a">(Herpetiform)</text><rect x="350" y="180" width="100" height="44" fill="#fff" stroke="#cbd5e1"/><text x="400" y="207" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">1–3 مم مجمعة</text><rect x="260" y="180" width="90" height="44" fill="#fff" stroke="#cbd5e1"/><text x="305" y="207" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">10–100</text><rect x="140" y="180" width="120" height="44" fill="#fff" stroke="#cbd5e1"/><text x="200" y="207" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">7–14 يوم</text><rect x="20" y="180" width="120" height="44" fill="#fff" stroke="#cbd5e1"/><text x="80" y="207" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">لا</text>
<text x="320" y="264" text-anchor="middle" font-size="12.5" fill="#475569">كلها غير معدية وتختلف عن الهربس الذي يصيب الشفة والحنك الصلب</text></svg>