<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="366" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أجهزة الأكسجين</text><rect x="20" y="54" width="600" height="27.5" fill="#0ea5e9"/><text x="614" y="70.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#fff">الجهاز</text><text x="467.0612244897959" y="70.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#fff">المعدل والتركيز</text><text x="307.8775510204082" y="70.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#fff">ملاحظات</text><rect x="20" y="81.5" width="600" height="45" fill="#0ea5e9" fill-opacity="0.07" stroke="#0ea5e9" stroke-opacity="0.3"/><text x="614" y="98.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">القنية الأنفية (NC)</text><text x="467.0612244897959" y="98.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">1–6 لتر/د — 25–45%</text><text x="307.8775510204082" y="98.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">قصيرة الأمد بعد الجراحة؛ الطويلة تجفف</text><text x="307.8775510204082" y="115.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">المخاط فتحتاج ترطيبًا</text><rect x="20" y="126.5" width="600" height="27.5" fill="#fff" fill-opacity="1" stroke="#0ea5e9" stroke-opacity="0.3"/><text x="614" y="143.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">قناع الوجه البسيط</text><text x="467.0612244897959" y="143.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">6–10 لتر/د — 40–60%</text><text x="307.8775510204082" y="143.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">يُستعمل بدل القناع الجزئي/غير المعيد</text><rect x="20" y="154" width="600" height="45" fill="#0ea5e9" fill-opacity="0.07" stroke="#0ea5e9" stroke-opacity="0.3"/><text x="614" y="170.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">القناع الجزئي</text><text x="614" y="188.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">المعيد</text><text x="467.0612244897959" y="170.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">6–10 لتر/د — 35–60%</text><text x="307.8775510204082" y="170.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">يشبه غير المعيد؛ الفرق: صمامات الرفرفة</text><text x="307.8775510204082" y="188.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الجانبية</text><rect x="20" y="199" width="600" height="80" fill="#fff" fill-opacity="1" stroke="#0ea5e9" stroke-opacity="0.3"/><text x="614" y="215.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">غير المعيد (NRB)</text><text x="467.0612244897959" y="215.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">10–15 لتر/د — 60–100%</text><text x="307.8775510204082" y="215.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">طوارئ، تسمم CO؛ الكيس يجب ألا ينكمش</text><text x="307.8775510204082" y="233.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">كليًا عند الشهيق (إن انكمش: زد التدفق)؛</text><text x="307.8775510204082" y="250.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لا تفتح الصمامات؛ لا تشد الأحزمة قبل</text><text x="307.8775510204082" y="268.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">امتلاء الكيس</text><rect x="20" y="279" width="600" height="45" fill="#0ea5e9" fill-opacity="0.07" stroke="#0ea5e9" stroke-opacity="0.3"/><text x="614" y="295.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">قناع فنتوري</text><text x="467.0612244897959" y="295.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الأدق في تحديد</text><text x="467.0612244897959" y="313.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">التركيز</text><text x="307.8775510204082" y="295.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لمرضى COPD غير المستقرين الذين لا</text><text x="307.8775510204082" y="313.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">يتحملون تغير التركيز</text><rect x="20" y="324" width="600" height="27.5" fill="#fff" fill-opacity="1" stroke="#0ea5e9" stroke-opacity="0.3"/><text x="614" y="340.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">خيمة الوجه</text><text x="467.0612244897959" y="340.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ترطيب عالٍ</text><text x="307.8775510204082" y="340.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">رضوض الوجه والحروق</text></svg>
