<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 248" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="248" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مناطق جهاز قياس ذروة التدفق (PEFR)</text><rect x="527" y="50" width="97" height="32" fill="#16a34a"/><text x="575" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المنطقة</text><rect x="284" y="50" width="243" height="32" fill="#16a34a"/><text x="405" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المعنى</text><rect x="16" y="50" width="268" height="32" fill="#16a34a"/><text x="150" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الإجراء</text><rect x="527" y="82" width="97" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="102" text-anchor="end" font-size="13" fill="#0f172a">خضراء</text><rect x="284" y="82" width="243" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="519" y="102" text-anchor="end" font-size="13" fill="#0f172a">الربو تحت السيطرة (نحو 80–100% من</text><text x="519" y="121" text-anchor="end" font-size="13" fill="#0f172a">أفضل قياس)</text><rect x="16" y="82" width="268" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="276" y="102" text-anchor="end" font-size="13" fill="#0f172a">استمر على الخطة</text><rect x="527" y="132" width="97" height="50" fill="#dcfce7" stroke="#cbd5e1"/><text x="616" y="152" text-anchor="end" font-size="13" fill="#0f172a">صفراء</text><rect x="284" y="132" width="243" height="50" fill="#dcfce7" stroke="#cbd5e1"/><text x="519" y="152" text-anchor="end" font-size="13" fill="#0f172a">الربو غير منضبط: احتياج لدواء</text><text x="519" y="171" text-anchor="end" font-size="13" fill="#0f172a">إضافي</text><rect x="16" y="132" width="268" height="50" fill="#dcfce7" stroke="#cbd5e1"/><text x="276" y="152" text-anchor="end" font-size="13" fill="#0f172a">دواء الإسعاف كل 4 ساعات لمدة 1–2 يوم</text><text x="276" y="171" text-anchor="end" font-size="13" fill="#0f172a">+ اتصل بالطبيب</text><rect x="527" y="182" width="97" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="202" text-anchor="end" font-size="13" fill="#0f172a">حمراء</text><rect x="284" y="182" width="243" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="519" y="202" text-anchor="end" font-size="13" fill="#0f172a">خطر شديد</text><rect x="16" y="182" width="268" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="276" y="202" text-anchor="end" font-size="13" fill="#0f172a">علاج طارئ فورًا إن لم يعد القياس</text><text x="276" y="221" text-anchor="end" font-size="13" fill="#0f172a">للأصفر مباشرة بعد دواء الإسعاف</text></svg>