<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 279" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="279" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">مضادات الديدان (Anthelmintics)</text><rect x="515.7" y="44" width="104.3" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="567.8" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">الدواء</text><rect x="346.1" y="44" width="169.6" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="430.9" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">الآلية</text><rect x="176.5" y="44" width="169.6" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="261.3" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">الاستعمال</text><rect x="20.0" y="44" width="156.5" height="30.5" fill="#1e3a8a" stroke="#cbd5e1"/><text x="98.3" y="63.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">جرعة للتعلّم</text><rect x="515.7" y="74.5" width="104.3" height="80.0" fill="#fff" stroke="#cbd5e1"/><text direction="ltr" x="567.8" y="110.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">albendazole</text><text direction="ltr" x="567.8" y="126.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">(Albenza)</text><rect x="346.1" y="74.5" width="169.6" height="80.0" fill="#fff" stroke="#cbd5e1"/><text x="430.9" y="101.8" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">يعطّل تصنيع</text><text x="430.9" y="118.3" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الأنيبيبات الدقيقة</text><text x="430.9" y="134.8" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">للطفيل فتموت اليرقات</text><rect x="176.5" y="74.5" width="169.6" height="80.0" fill="#fff" stroke="#cbd5e1"/><text x="261.3" y="93.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">يرقات دودة الخنزير</text><text x="261.3" y="110.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">(neurocysticercosis)،</text><text x="261.3" y="126.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">كيس عُداري (دودة</text><text x="261.3" y="143.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الكلب)</text><rect x="20.0" y="74.5" width="156.5" height="80.0" fill="#fff" stroke="#cbd5e1"/><text x="98.3" y="93.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">60 كغ فأكثر: 400</text><text x="98.3" y="110.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">مغ؛ أقل: 15</text><text x="98.3" y="126.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">مغ/كغ/يوم (راجع</text><text x="98.3" y="143.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">النشرة)</text><rect x="515.7" y="154.5" width="104.3" height="63.5" fill="#eef2ff" stroke="#cbd5e1"/><text direction="ltr" x="567.8" y="190.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">mebendazole</text><rect x="346.1" y="154.5" width="169.6" height="63.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="430.9" y="173.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">يمنع امتصاص الطفيل</text><text x="430.9" y="190.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">للجلوكوز فينفد</text><text x="430.9" y="206.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">جليكوجينه</text><rect x="176.5" y="154.5" width="169.6" height="63.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="261.3" y="173.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الدودة السوطية،</text><text x="261.3" y="190.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الدبوسية، الأسكارس،</text><text x="261.3" y="206.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الأنكلستوما</text><rect x="20.0" y="154.5" width="156.5" height="63.5" fill="#eef2ff" stroke="#cbd5e1"/><text x="98.3" y="173.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">100 مغ صباحًا</text><text x="98.3" y="190.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">ومساءً 3 أيام؛</text><text x="98.3" y="206.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">للدبوسية 100 مغ مرة</text><rect x="515.7" y="218" width="104.3" height="47.0" fill="#fff" stroke="#cbd5e1"/><text direction="ltr" x="567.8" y="237.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">pyrantel</text><text direction="ltr" x="567.8" y="253.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">(Antiminth)</text><rect x="346.1" y="218" width="169.6" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="430.9" y="245.3" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">يشلّ الدودة</text><rect x="176.5" y="218" width="169.6" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="261.3" y="245.3" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">الدبوسية والأسكارس</text><rect x="20.0" y="218" width="156.5" height="47.0" fill="#fff" stroke="#cbd5e1"/><text x="98.3" y="237.0" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">11 مغ/كغ مرة (حد</text><text x="98.3" y="253.5" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أقصى 1 غ)</text></svg>