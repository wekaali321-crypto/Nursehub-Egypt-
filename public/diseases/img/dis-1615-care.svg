<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="260" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الممنوعات والفحوص والأدوية</text>
<rect x="14" y="44" width="300" height="200" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="14" y="44" width="300" height="26" rx="10" fill="#dc2626"/><text x="164.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >ممنوع (حرف C)</text><text x="304" y="89" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >Constriction: ضغط على الأوعية</text><text x="304" y="109.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >Cross legs: تقاطع الساقين</text><text x="304" y="130.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >Constrictive clothing: ملابس ضيقة</text><text x="304" y="150.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >Cigarettes: تدخين</text><text x="304" y="171.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >Caffeine: كافيين</text><text x="304" y="191.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >Cold: برد</text><text x="304" y="212.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >وT: أظافر القدم يقصها الطبيب فقط</text><rect x="326" y="44" width="300" height="200" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><rect x="326" y="44" width="300" height="26" rx="10" fill="#2563eb"/><text x="476.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >الفحص والأدوية</text><text x="616" y="89" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >Doppler سونار</text><text x="616" y="109.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >ABI: مؤشر الكاحل والعضد (للشرايين)</text><text x="616" y="130.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >أسبرين، كلوبيدوجريل: نزف</text><text x="616" y="150.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >ستاتين: كبد، بلا جريب فروت</text>
</svg>
