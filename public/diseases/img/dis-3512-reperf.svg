<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="450" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">إعادة فتح الشريان: قسطرة، جراحة، مُذيب، واختبار الجهد</text><rect x="330" y="45" width="295" height="150" rx="10" fill="#dbeafe"/><text x="477.5" y="85" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">القسطرة (PCI) / رأب الشريان</text><text x="477.5" y="105" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">قبل: صيام 6–12 ساعة</text><text x="477.5" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">بعد: لا رفع أحمال والاستلقاء مسطحًا</text><text x="477.5" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">الاستحمام بالدش مسموح بلا نقع</text><text x="477.5" y="165" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">راقب الجرح: احمرار، سخونة، إفراز</text><rect x="15" y="45" width="305" height="150" rx="10" fill="#dcfce7"/><text x="167.5" y="95" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">جراحة المجازة (CABG)</text><text x="167.5" y="115" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تجاوز موضع الانسداد</text><text x="167.5" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">العناية بالشق الجراحي بعد العملية</text><text x="167.5" y="155" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">(نفس تعليمات الجرح)</text><rect x="15" y="215" width="305" height="225" rx="10" fill="#fee2e2"/><text x="167.5" y="256.5" text-anchor="middle" font-size="11" font-weight="800" fill="#0f172a">مُذيبات الجلطة (t-PA)</text><text x="167.5" y="275.5" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">alteplase وstreptokinase (خطر حساسية)</text><text x="167.5" y="294.5" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">تذيب الجلطة فقط (heparin لا يذيبها)</text><text x="167.5" y="313.5" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">خطر النزيف (مدة 8 ساعات)</text><text x="167.5" y="332.5" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">لا حقن (وريدي/تحت الجلد/عضلي/غازات دم)</text><text x="167.5" y="351.5" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">لا عبر الخط المركزي</text><text x="167.5" y="370.5" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">فقط مواضع قابلة للضغط (IV, PICC)</text><text x="167.5" y="389.5" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">ممنوع: نزيف نشط، قرح هضمية، تشوهات وريدية</text><text x="167.5" y="408.5" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">نزف دماغي، ضغط &gt; 180/110، نقص سكر (نسبي)</text><rect x="330" y="215" width="295" height="225" rx="10" fill="#fef9c3"/><text x="477.5" y="269.5" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">اختبار الجهد</text><text x="477.5" y="290.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">للتحري عن الضيق لا لحالة النوبة</text><text x="477.5" y="311.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">جهاز المشي: يُوقف عند ألم صدر أو ارتفاع ST</text><text x="477.5" y="332.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">كيميائي (نووي): قبله 24–48 ساعة</text><text x="477.5" y="353.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">بلا تدخين وكافيين (حتى decaf)</text><text x="477.5" y="374.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">بلا نترات وحاصرات بيتا وtheophylline</text><text x="477.5" y="395.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">صيام 4 ساعات قبل وبعد</text></svg>