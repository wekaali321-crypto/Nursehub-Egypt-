<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 366" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="366" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">فحص المولود: طبيعي مقابل غير طبيعي</text><rect x="426" y="46" width="193" height="132" rx="12" fill="#bae6fd"/><text x="522.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الجلد</text><text x="522.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">طبيعي: Vernix، زغب، بقع منغولية،</text><text x="522.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">ازرقاق الأطراف، تقشر ثالث يوم</text><text x="522.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">غير طبيعي: جفاف وتشقق، يرقان،</text><text x="522.5" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">ازرقاق مركزي (بلّغ)</text><rect x="223" y="46" width="193" height="132" rx="12" fill="#bbf7d0"/><text x="319.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الرأس والليّنات</text><text x="319.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">أمامية معينية، خلفية مثلثة</text><text x="319.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">تشوّه الرأس يزول 3–7 أيام</text><text x="319.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">غير طبيعي: Caput succedaneum</text><text x="319.5" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">ورم دموي رأسي (Cephalohematoma)</text><rect x="20" y="46" width="193" height="132" rx="12" fill="#fde68a"/><text x="116.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">عين وأذن وأنف</text><text x="116.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">Milia (حبوب بيضاء) على الأنف</text><text x="116.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">عين مفتوحة وأذن مرنة</text><text x="116.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">غير طبيعي: تدلّي الجفن، إعتام،</text><text x="116.5" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">يرقان صلبة العين أول 24 ساعة</text><rect x="426" y="188" width="193" height="132" rx="12" fill="#fecaca"/><text x="522.5" y="214" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الفم</text><text x="522.5" y="238" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">لآلئ إبشتاين على اللثة والحنك</text><text x="522.5" y="258" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">غير طبيعي: شق شفة أو حنك</text><rect x="223" y="188" width="193" height="132" rx="12" fill="#ddd6fe"/><text x="319.5" y="214" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الصدر</text><text x="319.5" y="238" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">أصوات فرقعة بعد الولادة مباشرة تُتوقع</text><text x="319.5" y="258" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">غير طبيعي: صفير، وزيز، تراجعات،</text><text x="319.5" y="278" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">خُنخنة، تسرع تنفس > 60</text><rect x="20" y="188" width="193" height="132" rx="12" fill="#fed7aa"/><text x="116.5" y="214" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الحبل السري</text><text x="116.5" y="238" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">وريد + شريانان (AVA)</text><text x="116.5" y="258" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">غير طبيعي: شريان واحد</text><text x="320" y="354" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">بلّغ الطبيب عن أي نتيجة غير طبيعية</text>
</svg>
