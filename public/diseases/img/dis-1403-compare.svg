<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="272" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الخرف مقابل الهذيان</text><rect x="483" y="50" width="141" height="32" fill="#0d9488"/><text x="553" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">وجه المقارنة</text><rect x="271" y="50" width="212" height="32" fill="#0d9488"/><text x="377" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الخرف Dementia</text><rect x="16" y="50" width="255" height="32" fill="#0d9488"/><text x="143" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الهذيان Delirium</text><rect x="483" y="82" width="141" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="102" text-anchor="start" font-size="13" fill="#0f172a">البداية</text><rect x="271" y="82" width="212" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="475" y="102" text-anchor="start" font-size="13" fill="#0f172a">تدريجية بطيئة</text><rect x="16" y="82" width="255" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="263" y="102" text-anchor="start" font-size="13" fill="#0f172a">مفاجئة خلال ساعات أو أيام</text><rect x="483" y="113" width="141" height="31" fill="#ccfbf1" stroke="#cbd5e1"/><text x="616" y="133" text-anchor="start" font-size="13" fill="#0f172a">المسار</text><rect x="271" y="113" width="212" height="31" fill="#ccfbf1" stroke="#cbd5e1"/><text x="475" y="133" text-anchor="start" font-size="13" fill="#0f172a">مزمن وغير قابل للشفاء</text><rect x="16" y="113" width="255" height="31" fill="#ccfbf1" stroke="#cbd5e1"/><text x="263" y="133" text-anchor="start" font-size="13" fill="#0f172a">مؤقت وقابل للعلاج</text><rect x="483" y="144" width="141" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="164" text-anchor="start" font-size="13" fill="#0f172a">السبب</text><rect x="271" y="144" width="212" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="475" y="164" text-anchor="start" font-size="13" fill="#0f172a">ألزهايمر، باركنسون، إصابة رأس</text><rect x="16" y="144" width="255" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="263" y="164" text-anchor="start" font-size="13" fill="#0f172a">عدوى، نقص أكسجين، أدوية، اضطراب سكر</text><text x="263" y="183" text-anchor="start" font-size="13" fill="#0f172a">أو صوديوم</text><rect x="483" y="194" width="141" height="31" fill="#ccfbf1" stroke="#cbd5e1"/><text x="616" y="214" text-anchor="start" font-size="13" fill="#0f172a">العلاج</text><rect x="271" y="194" width="212" height="31" fill="#ccfbf1" stroke="#cbd5e1"/><text x="475" y="214" text-anchor="start" font-size="13" fill="#0f172a">دعم ورعاية وسلامة وإلهاء</text><rect x="16" y="194" width="255" height="31" fill="#ccfbf1" stroke="#cbd5e1"/><text x="263" y="214" text-anchor="start" font-size="13" fill="#0f172a">تصحيح السبب = زوال الهذيان</text><rect x="483" y="225" width="141" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="245" text-anchor="start" font-size="13" fill="#0f172a">الأولوية</text><rect x="271" y="225" width="212" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="475" y="245" text-anchor="start" font-size="13" fill="#0f172a">سلامة وتهدئة</text><rect x="16" y="225" width="255" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="263" y="245" text-anchor="start" font-size="13" fill="#0f172a">قيّم المريض واكتشف السبب فورًا</text></svg>