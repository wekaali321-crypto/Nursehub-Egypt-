<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="330" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مستوى إصابة الحبل الشوكي وما يُفقد</text><rect x="470" y="50" width="150" height="44" rx="10" fill="#16a34a"/><text x="545.0" y="67.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">رقبي Cervical (7)</text><text x="545.0" y="83.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">شلل رباعي + خطر التنفس</text><rect x="470" y="104" width="150" height="44" rx="10" fill="#db2777"/><text x="545.0" y="121.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">صدري Thoracic (12)</text><text x="545.0" y="137.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">شلل سفلي: الساقان والجذع</text><rect x="470" y="158" width="150" height="44" rx="10" fill="#ea580c"/><text x="545.0" y="175.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">قطني Lumbar (5)</text><text x="545.0" y="191.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">الساقان والمثانة</text><rect x="470" y="212" width="150" height="44" rx="10" fill="#64748b"/><text x="545.0" y="229.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">عجزي + عصعصي (5+4)</text><text x="545.0" y="245.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">الحوض والمستقيم</text><text x="240" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">تذكّر: C = Can't move (لا يتحرك)</text><text x="240" y="124" text-anchor="middle" font-size="14" font-weight="700" fill="#be185d">T = Trunk &amp; legs (الجذع والساقان)</text><text x="240" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">L = Legs &amp; Leaky bladder (ساقان + مثانة متسرّبة)</text><text x="240" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">كلما علا مستوى الإصابة اتسع العجز</text><rect x="20" y="270" width="600" height="44" rx="10" fill="#fef3c7"/><text x="320.0" y="296.55" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">الرقبي يعني Quadriplegia (4 أطراف) وتنفس مختل = يهدد الحياة</text></svg>