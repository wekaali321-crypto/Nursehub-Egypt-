<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="360" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أثناء النوبة وبعدها وحالة الصرع المستمر</text><rect x="20" y="45" width="600" height="50" rx="10" fill="#dc2626"/><text x="320.0" y="65.7" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">حالة صرعية (Status Epilepticus) = طوارئ</text><text x="320.0" y="82.7" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">نوبة 5 دقائق أو أكثر، أو نوبات متكررة لمدة 30 دقيقة</text><rect x="20" y="108" width="600" height="42" rx="10" fill="#fee2e2"/><text x="320.0" y="133.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">1. الممر الهوائي: أدر المريض على جنبه، جهّز الشفط</text><rect x="20" y="156" width="600" height="42" rx="10" fill="#ffedd5"/><text x="320.0" y="181.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">2. اطلب المساعدة: وابقَ بجانبه وسجّل الوقت</text><rect x="20" y="204" width="600" height="42" rx="10" fill="#fef3c7"/><text x="320.0" y="229.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">3. أوقف النوبة: Lorazepam أو Diazepam وريدي/شرجي بأمر</text><rect x="20" y="252" width="600" height="42" rx="10" fill="#dcfce7"/><text x="320.0" y="277.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">4. أرخِ الملابس: الرقبة والصدر وأبعد الأشياء ووسّد الحواجز</text><rect x="20" y="302" width="600" height="46" rx="10" fill="#e0f2fe"/><text x="320.0" y="320.7" text-anchor="middle" font-size="12" font-weight="700" fill="#0c4a6e">ممنوع: وضع أي شيء في الفم أو تقييد الأذرع</text><text x="320.0" y="337.7" text-anchor="middle" font-size="12" font-weight="600" fill="#0c4a6e">بعد النوبة: سجّل الوقت، قيّم الوعي والعلامات العصبية والحيوية وجهّز الشفط</text></svg>