<rect x="20.0" y="48" width="193.33333333333334" height="130" rx="10" fill="#b91c1c"/>
<text x="116.66666666666667" y="98.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">عدوى الأدمة العميقة</text>
