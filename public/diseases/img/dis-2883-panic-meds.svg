ont-size="12.5" font-weight="400" fill="#0f172a">تعرق وهبّات حرارة</text><text x="610" y="223.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="223.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">غثيان وإحساس بالاختناق</text><rect x="20" y="50" width="294" height="185.875" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><path d="M20 60a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#15803d"/><text x="167" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التدخل (الأولوية)</text><text x="304" y="96.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="96.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ابقَ مع المريض (الأولوية رقم ⁦1⁩)</text><text x="304" y="117.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="117.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ضعه في غرفة هادئة واجلس بجانبه</text><text x="304" y="138.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="138.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">كلّمه بهدوء وكلمات بسيطة وواضحة</text><text x="304" y="159.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="159.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">«سأساعدك للعودة إلى غرفتك»</text><text x="304" y="181" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="181" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">اسأل: «متى لاحظت أنك قلق؟»</text><rect x="450.188679245283" y="247.875" width="169.81132075471697" height="29.4" fill="#6d28d9" stroke="#cbd5e1"/><text x="535.0943396226415" y="264.875" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الفئة</text><rect x="20" y="247.875" width="430.188679245283" height="29.4" fill="#6d28d9" stroke="#cbd5e1"/><text x="235.0943396226415" y="264.875" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الأدوية</text><rect x="450.188679245283" y="277.275" width="169.81132075471697" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="535.0943396226415" y="294.275" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">حاصرات بيتا</text><rect x="20" y="277.275" width="430.188679245283" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="235.0943396226415" y="294.275" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">أتينولول (⁦Atenolol⁩) وأخواتها المنتهية بـ -⁦olol⁩</text><rect x="450.188679245283" y="306.67499999999995" width="169.81132075471697" height="29.4" fill="#fff" stroke="#cbd5e1"/><text x="535.0943396226415" y="323.67499999999995" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">⁦SSRI⁩</text><rect x="20" y="306.67499999999995" width="430.188679245283" height="29.4" fill="#fff" stroke="#cbd5e1"/><text x="235.0943396226415" y="323.67499999999995" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">⁦Sertraline, Paroxetine⁩</text><rect x="450.188679245283" y="336.07499999999993" width="169.81132075471697" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="535.0943396226415" y="353.07499999999993" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">⁦TCA⁩</text><rect x="20" y="336.07499999999993" width="430.188679245283" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="235.0943396226415" y="353.07499999999993" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">⁦Amitriptyline, Imipramine⁩</text><rect x="450.188679245283" y="365.4749999999999" width="169.81132075471697" height="29.4" fill="#fff" stroke="#cbd5e1"/><text x="535.0943396226415" y="382.4749999999999" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">⁦MAO