<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="360" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الفرق بين التهاب المسالك السفلي والعلوي</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
<rect x="330" y="50" width="280" height="36" rx="10" fill="#0ea5e9"/><text x="470.0" y="73.25" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">التهاب المسالك السفلي (مثانة)</text>
<rect x="30" y="50" width="280" height="36" rx="10" fill="#dc2626"/><text x="170.0" y="73.25" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">التهاب المسالك العلوي (كلى)</text>
<rect x="330" y="100" width="280" height="36" rx="10" fill="#e0f2fe"/><text x="470.0" y="122.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">أعراض موضعية غالباً</text>
<rect x="330" y="144" width="280" height="36" rx="10" fill="#e0f2fe"/><text x="470.0" y="166.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">لا حرارة أو خفيفة</text>
<rect x="330" y="188" width="280" height="36" rx="10" fill="#e0f2fe"/><text x="470.0" y="210.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">ألم فوق العانة</text>
<rect x="330" y="232" width="280" height="36" rx="10" fill="#e0f2fe"/><text x="470.0" y="254.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">حرقان وعسر تبول (Dysuria)</text>
<rect x="330" y="276" width="280" height="36" rx="10" fill="#e0f2fe"/><text x="470.0" y="298.9" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">سلس بول (Incontinence)</text>
<rect x="30" y="100" width="280" height="36" rx="10" fill="#fee2e2"/><text x="170.0" y="122.9" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">أعراض عامة أساساً</text>
<rect x="30" y="144" width="280" height="36" rx="10" fill="#fee2e2"/><text x="170.0" y="166.9" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">حرارة عالية</text>
<rect x="30" y="188" width="280" height="36" rx="10" fill="#fee2e2"/><text x="170.0" y="210.9" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">ألم في الخاصرة (Loin)</text>
<rect x="30" y="232" width="280" height="36" rx="10" fill="#fee2e2"/><text x="170.0" y="254.9" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">قيء</text>
<rect x="30" y="276" width="280" height="36" rx="10" fill="#fee2e2"/><text x="170.0" y="298.9" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">رعشة وقشعريرة (Rigor)</text>
<text x="320" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">علاقة العلوي = أخطر: لازم تقييم وعلاج أسرع وأحياناً حقن وريدي</text>
</svg>
