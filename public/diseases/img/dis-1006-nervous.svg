nd" font-size="11" font-weight="500" fill="#0f172a">والجسم.</text><text x="90" y="247" text-anchor="end" font-size="11" font-weight="500" fill="#0f172a">الجسدي: حسي وارد وحركي صادر</text><text x="90" y="263" text-anchor="end" font-size="11" font-weight="500" fill="#0f172a">ومنعكسات.</text>
