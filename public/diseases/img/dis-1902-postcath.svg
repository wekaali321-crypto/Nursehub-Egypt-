<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 302" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="302" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قسطرة القلب وصرف الصدر: متابعة</text><rect x="325" y="48" width="295" height="124" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">قبل القسطرة</text><text x="610" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">حساسية اليود</text><text x="610" y="120" text-anchor="end" font-size="12.5" fill="#1e293b">صيام 4–6 ساعات للأطفال (أقل للرضع)</text><text x="610" y="140" text-anchor="end" font-size="12.5" fill="#1e293b">التهاب حفاض شديد يُبلَّغ للطبيب</text><rect x="20" y="48" width="295" height="124" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">بعد القسطرة</text><text x="305" y="100" text-anchor="end" font-size="12.5" fill="#1e293b">نبض الطرف البعيد عن موضع القسطرة</text><text x="305" y="120" text-anchor="end" font-size="12.5" fill="#1e293b">البارد/الشاحب/نبض ضعيف = غير طبيعي</text><text x="305" y="140" text-anchor="end" font-size="12.5" fill="#1e293b">إبقاء الساق مفرودة 4–8 ساعات</text><text x="305" y="160" text-anchor="end" font-size="12.5" fill="#1e293b">نزف وعدوى بالجرح ولا استحمام</text><rect x="325" y="182" width="295" height="104" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="182" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="203" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">صرف الصدر بعد الجراحة</text><text x="610" y="234" text-anchor="end" font-size="12.5" fill="#1e293b">خلال ساعة: أكثر من 5–10 مل/كجم = أبلغ</text><text x="610" y="254" text-anchor="end" font-size="12.5" fill="#1e293b">3 ساعات: أكثر من 3 مل/كجم/ساعة</text><text x="610" y="274" text-anchor="end" font-size="12.5" fill="#1e293b">مثال طفل 6 كجم: 18 مل/ساعة (54 مل/3 ساعات)</text><rect x="20" y="182" width="295" height="104" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><rect x="20" y="182" width="295" height="30" rx="12" fill="#9333ea"/><text x="167.5" y="203" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الخروج من المستشفى</text><text x="305" y="234" text-anchor="end" font-size="12.5" fill="#1e293b">رفع رأس السرير</text><text x="305" y="254" text-anchor="end" font-size="12.5" fill="#1e293b">لا مجهود شديد أو رفع ثقيل 3–4 أسابيع</text><text x="305" y="274" text-anchor="end" font-size="12.5" fill="#1e293b">حمى أو سخونة بالجرح أو صديد = أبلغ</text>
</svg>
