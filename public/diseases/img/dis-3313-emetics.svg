<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
<rect width="640" height="400" rx="16" fill="#f8fafc"/>
<text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >مقيئات، مضادات الغازات، فحم نشط</text>
<rect x="330" y="50" width="300" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="330" y="50" width="300" height="28" rx="10" fill="#b91c1c"/>
<text x="480.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >مقيئات (Ipecac)</text>
<text x="480.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >لإفراغ المعدة بعد تسمم أو جرعة زائدة</text>
<text x="480.0" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >لا للواعي تماماً: لا للمغمى عليه أو تشنجات</text>
<text x="480.0" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >لا للمواد الكاوية والبترول</text>
<text x="480.0" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >تحت إشراف طبي واستشر مركز السموم</text>
<rect x="10" y="50" width="310" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="50" width="310" height="28" rx="10" fill="#0369a1"/>
<text x="165.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >مضادات الغازات</text>
<text x="165.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >سيميثيكون (Simethicone): يفتت الفقاعات</text>
<text x="165.0" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >للتهاب/غازات بعد الجراحة وعسر هضم</text>
<text x="165.0" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >القولون العصبي</text>
<text x="165.0" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >بعد الوجبات وعند النوم</text>
<rect x="10" y="215" width="620" height="175" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="215" width="620" height="28" rx="10" fill="#0f766e"/>
<text x="320.0" y="234" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >فحم نشط (Charcoal)</text>
<text x="320.0" y="265" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >للغازات المعوية والإسهال وترياق للتسمم</text>
<text x="320.0" y="291" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >الإيبيكاك: الفحم يقلل أثره</text>
<text x="320.0" y="317" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >قد يخفف حكة غسيل الكلى</text>
<text x="320.0" y="343" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >يقلل فعالية أدوية أخرى</text>
</svg>