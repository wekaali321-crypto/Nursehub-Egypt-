<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="540" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">معدات الوقاية الشخصية: اللبس والخلع وقواعد العزل</text>
  <rect x="330" y="50" width="290" height="170" rx="10" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">ترتيب اللبس (Donning)</text><text x="608" y="96" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• 1) غسل اليدين</text><text x="608" y="121" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• 2) الجاون</text><text x="608" y="146" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• 3) الكمامة</text><text x="608" y="171" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• 4) النظارات الواقية</text><text x="608" y="196" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• 5) القفازات</text><rect x="20" y="50" width="290" height="170" rx="10" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">ترتيب الخلع (Removing)</text><text x="298" y="96" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• 1) القفازات</text><text x="298" y="121" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• 2) النظارات</text><text x="298" y="146" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• 3) الجاون</text><text x="298" y="171" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• 4) الكمامة</text><text x="298" y="196" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• 5) غسل اليدين</text><rect x="430" y="235" width="190" height="290" rx="10" fill="#fef3c7" stroke="#cbd5e1" stroke-width="1.5"/><text x="525" y="257" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">التلامس</text><text x="608" y="281" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• كائنات مقاومة (MDR)</text><text x="608" y="305" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• عدوى تنفسية</text><text x="608" y="329" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• عدوى جلدية والجروح</text><text x="608" y="353" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• عدوى معوية وعينية</text><text x="608" y="377" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• جدري مائي</text><text x="608" y="401" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• دفتيريا جلدية</text><text x="608" y="425" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• هربس بسيط، قوباء</text><text x="608" y="449" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• قمل وجرب</text><rect x="225" y="235" width="190" height="290" rx="10" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="257" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الهوائي</text><text x="403" y="281" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• الحصبة (Measles)</text><text x="403" y="311" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• السل (TB)</text><text x="403" y="341" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• الجدري المائي (Varicella)</text><rect x="20" y="235" width="190" height="290" rx="10" fill="#e0e7ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="115" y="257" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">القطرات</text><text x="198" y="281" text-anchor="start" font-size="11" font-weight="500" fill="#1e293b">• إنتان/حمى قرمزية/عقدية</text><text x="198" y="305" text-anchor="start" font-size="11" font-weight="500" fill="#1e293b">• Parvovirus، التهاب رئوي، سعال ديكي</text><text x="198" y="329" text-anchor="start" font-size="11" font-weight="500" fill="#1e293b">• إنفلونزا، دفتيريا، التهاب لسان المزمار</text><text x="198" y="353" text-anchor="start" font-size="11" font-weight="500" fill="#1e293b">• حصبة ألمانية</text><text x="198" y="377" text-anchor="start" font-size="11" font-weight="500" fill="#1e293b">• نكاف، سحايا، ميكوبلازما</text><text x="198" y="401" text-anchor="start" font-size="11" font-weight="500" fill="#1e293b">• فيروس غدي</text>
</svg>
