<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 507" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="507" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">الاضطراب ثنائي القطب (⁦Bipolar⁩): الاكتئاب والهوس وأنواعه</text><rect x="20" y="50" width="290" height="92" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/><text x="165" y="76" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">الاكتئاب (⁦Depression⁩)</text><text x="165" y="100" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">مزاج منخفض، طاقة ودافع قليلان</text><text x="165" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">خطر انتحار مرتفع</text><rect x="330" y="50" width="290" height="92" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="475" y="76" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">الهوس الحاد (⁦Acute Mania⁩)</text><text x="475" y="100" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">طاقة عالية، فرط نشاط، مزاج مرتفع</text><text x="475" y="122" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">قد يصل لعدوان وعنف</text><rect x="464.44444444444446" y="156" width="155.55555555555554" height="29.4" fill="#6d28d9" stroke="#cbd5e1"/><text x="542.2222222222222" y="173" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">النوع</text><rect x="20.000000000000057" y="156" width="444.4444444444444" height="29.4" fill="#6d28d9" stroke="#cbd5e1"/><text x="242.22222222222226" y="173" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الوصف</text><rect x="464.44444444444446" y="185.4" width="155.55555555555554" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="542.2222222222222" y="202.4" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">⁦Bipolar I⁩</text><rect x="20.000000000000057" y="185.4" width="444.4444444444444" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="242.22222222222226" y="202.4" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">نوبة هوس تدوم أكثر من أسبوع أو تستدعي التنويم</text><rect x="464.44444444444446" y="214.8" width="155.55555555555554" height="29.4" fill="#fff" stroke="#cbd5e1"/><text x="542.2222222222222" y="231.8" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">⁦Bipolar II⁩</text><rect x="20.000000000000057" y="214.8" width="444.4444444444444" height="29.4" fill="#fff" stroke="#cbd5e1"/><text x="242.22222222222226" y="231.8" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">نوبات هوس خفيف (⁦Hypomania⁩) أخف، مع نوبات اكتئاب</text><rect x="464.44444444444446" y="244.20000000000002" width="155.55555555555554" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="542.2222222222222" y="261.20000000000005" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">⁦Cyclothymia⁩</text><rect x="20.000000000000057" y="244.20000000000002" width="444.4444444444444" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="242.22222222222226" y="261.20000000000005" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">انخفاضات وارتفاعات مزاجية أخف تتناوب على مدى سنتين</text><rect x="464.44444444444446" y="273.6" width="155.55555555555554" height="29.4" fill="#fff" stroke="#cbd5e1"/><text x="542.2222222222222" y="290.6" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">⁦Rapid cycling⁩</text><rect x="20.000000000000057" y="273.6" width="444.4444444444444" height="29.4" fill="#fff" stroke="#cbd5e1"/><text x="242.22222222222226" y="290.6" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">⁦4⁩ نوبات اكتئاب وهوس أو أكثر خلال ⁦12⁩ شهراً (مثال ⁦ATI⁩: ⁦5⁩ نوبات هوس في سنة)</text><rect x="326" y="315" width="294" height="179.875" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/><path d="M326 325a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#0e7490"/><text x="473" y="336" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الأسباب</text><text x="610" y="361.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="361.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">السبب غير معروف</text><text x="610" y="382.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="382.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الوراثة: قريب مصاب = احتمال أعلى بعشرة</text><text x="598" y="400.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أضعاف</text><text x="610" y="421.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="421.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">مضادات الاكتئاب ⁦SSRI⁩ قد تحفز نوبة هوس</text><rect x="20" y="315" width="294" height="179.875" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><path d="M20 325a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#c2410c"/><text x="167" y="336" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">علامات الهوس (⁦MANIA⁩)</text><text x="304" y="361.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="292" y="361.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">طاقة وتقلب مزاج، اندفاع، عظمة، هلاوس</text><text x="292" y="379.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">وأوهام عظمة</text><text x="304" y="400.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="292" y="400.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">هياج: ضع حدوداً وبيئة منظمة</text><text x="304" y="421.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="292" y="421.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">كلام متواصل وتطاير أفكار وملابس ملونة</text><text x="292" y="440" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">غريبة</text><text x="304" y="461.125" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="292" y="461.125" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أرق لأيام</text><text x="304" y="482.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="292" y="482.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ضعف الانتباه وسرعة التشتت</text></svg>