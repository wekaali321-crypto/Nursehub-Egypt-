<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
<rect width="640" height="370" rx="16" fill="#f8fafc"/>
<text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >اللاكتيولوز وصوديوم بوليستيرين سلفونات</text>
<rect x="330" y="50" width="300" height="160" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="330" y="50" width="300" height="28" rx="10" fill="#0369a1"/>
<text x="480.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >Lactulose</text>
<text x="480.0" y="100" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >يخفض الأمونيا في تليف الكبد</text>
<text x="480.0" y="124" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >يعالج اعتلال الدماغ الكبدي</text>
<text x="480.0" y="148" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >هدف: 2–3 براز لين يومياً</text>
<text x="480.0" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >تحسن الإدراك دليل نجاح</text>
<rect x="10" y="50" width="310" height="160" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="50" width="310" height="28" rx="10" fill="#0f766e"/>
<text x="165.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >Sodium polystyrene sulfonate</text>
<text x="165.0" y="100" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >لخفض البوتاسيوم أعلى من 5.0</text>
<text x="165.0" y="124" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >يُخرج K من الأمعاء الغليظة</text>
<text x="165.0" y="148" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >اشرب سوائل بعده</text>
<text x="165.0" y="172" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e293b" >اقيّم البطن والبراز والبوتاسيوم</text>
<rect x="10" y="225" width="620" height="130" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
<text x="320" y="253" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c" >اللاكتيولوز ليس مدراً</text>
<text x="320" y="283" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b" >لا يزيد إخراج الكلى للأمونيا، لا يخفض ضغط البوابة، ولا يحسّن انتفاخ البطن</text>
</svg>