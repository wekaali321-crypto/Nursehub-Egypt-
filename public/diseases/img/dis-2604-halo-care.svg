<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="250" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">جهاز الهالو (Halo) لتثبيت العنق</text><rect x="20" y="50" width="190" height="70" rx="10" fill="#dc2626"/><text x="115.0" y="80.55" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الأولوية: خطر العدوى</text><text x="115.0" y="98.55" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">تفقد مواضع الدبابيس</text><rect x="225" y="50" width="190" height="70" rx="10" fill="#ea580c"/><text x="320.0" y="80.55" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ممنوع الاستحمام بالدش</text><text x="320.0" y="98.55" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">مسح بالإسفنجة فقط</text><rect x="430" y="50" width="190" height="70" rx="10" fill="#16a34a"/><text x="525.0" y="80.7" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">علامات العدوى</text><text x="525.0" y="97.7" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">احمرار ودفء وإفراز كريه الرائحة</text><text x="320" y="165" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">لا تستعمل الجزء المثبّت كمقبض لتحريك المريض</text><text x="320" y="195" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">احتفظ بمفتاح/أداة الفك بجانب المريض لحالة الإنعاش</text><text x="320" y="225" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">أبلغ الطبيب عند خروج دبوس أو تغير الوعي أو ألم جديد</text></svg>