<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="330" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >أنواع اعتلال عضلة القلب</text><rect x="20" y="50" width="196" height="215" rx="10" fill="#2563eb"/><text x="118" y="80" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >متوسع</text><text x="118" y="106" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >Dilated — الأشيع</text><text x="118" y="134" text-anchor="middle" font-size="12" font-weight="400" fill="#fff" >الجدار رفيع والبطين واسع</text><text x="118" y="158" text-anchor="middle" font-size="12" font-weight="400" fill="#fff" >ضعف انقباض</text><text x="118" y="182" text-anchor="middle" font-size="12" font-weight="400" fill="#fff" >فشل قلب</text><rect x="224" y="50" width="196" height="215" rx="10" fill="#dc2626"/><text x="322" y="80" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >متضخم</text><text x="322" y="106" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >Hypertrophic</text><text x="322" y="134" text-anchor="middle" font-size="12" font-weight="400" fill="#fff" >جدار سميك (الحاجز)</text><text x="322" y="158" text-anchor="middle" font-size="12" font-weight="400" fill="#fff" >انسداد خروج الدم</text><text x="322" y="182" text-anchor="middle" font-size="12" font-weight="400" fill="#fff" >موت مفاجئ للرياضيين</text><rect x="428" y="50" width="196" height="215" rx="10" fill="#7c3aed"/><text x="526" y="80" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >مقيد</text><text x="526" y="106" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >Restrictive — نادر</text><text x="526" y="134" text-anchor="middle" font-size="12" font-weight="400" fill="#fff" >جدار متيبس</text><text x="526" y="158" text-anchor="middle" font-size="12" font-weight="400" fill="#fff