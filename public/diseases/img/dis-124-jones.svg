<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="380" rx="16" fill="#f8fafc"/>
<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a" >معايير جونز (Jones) — تشخيص الحمى الروماتيزمية</text><rect x="20" y="50" width="300" height="45" rx="12" fill="#0f172a"/><text x="170.0" y="77.05" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" >دليل عدوى بكتيريا streptococcus (ASOT / مسحة)</text><rect x="340" y="50" width="280" height="45" rx="12" fill="#475569"/><text x="480.0" y="77.05" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" >+ (معيار كبير ×2) أو (كبير + صغيرين)</text><rect x="20" y="110" width="300" height="225" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="170" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b" >المعايير الكبرى (Major)</text><text x="170" y="170" text-anchor="middle" font-size="12.5" font-weight="600" fill="#450a0a" >• التهاب مفاصل كبيرة متنقل (Arthritis)</text><text x="170" y="200" text-anchor="middle" font-size="12.5" font-weight="600" fill="#450a0a" >• التهاب القلب (Carditis)</text><text x="170" y="230" text-anchor="middle" font-size="12.5" font-weight="600" fill="#450a0a" >• رقص (Chorea) حركات لا إرادية</text><text x="170" y="260" text-anchor="middle" font-size="12.5" font-weight="600" fill="#450a0a" >• عقد تحت الجلد (Nodules)</text><text x="170" y="290" text-anchor="middle" font-size="12.5" font-weight="600" fill="#450a0a" >• احمرار حلقي على الجذع (E. marginatum)</text><rect x="340" y="110" width="280" height="225" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/><text x="480" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#713f12" >المعايير الصغرى (Minor)</text><text x="480" y="170" text-anchor="middle" font-size="12.5" font-weight="600" fill="#422006" >• ألم مفاصل (Arthralgia)</text><text x="480" y="200" text-anchor="middle" font-size="12.5" font-weight="600" fill="#422006" >• حرارة (Fever)</text><text x="480" y="230" text-anchor="middle" font-size="12.5" font-weight="600" fill="#422006" >• ارتفاع CRP / ESR / كرات بيضاء</text><text x="480" y="260" text-anchor="middle" font-size="12.5" font-weight="600" fill="#422006" >• ارتفاع ASOT</text><text x="480" y="290" text-anchor="middle" font-size="12.5" font-weight="600" fill="#422006" >• طول PR في ECG</text><text x="320" y="360" text-anchor="middle" font-size="12" font-weight="600" fill="#475569" >الأعراض بتظهر بعد التهاب حلق ببكتيريا (Group A Strep) بـ 2–4 أسابيع</text>
</svg>
