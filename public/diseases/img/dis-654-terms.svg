<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 513" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="513" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مصطلحات تنفسية مفتاحية</text><rect x="16" y="56" width="608" height="71" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><rect x="16" y="56" width="608" height="30" rx="12" fill="#2563eb"/><text x="320" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التهوية Ventilation</text><text x="614" y="108" text-anchor="end" font-size="13" fill="#1e3a8a">الشهيق والزفير (التنفس الفعّال)</text><rect x="16" y="139" width="608" height="90" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><rect x="16" y="139" width="608" height="30" rx="12" fill="#dc2626"/><text x="320" y="160" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">فرط ثاني أكسيد الكربون Hypercapnia</text><text x="614" y="191" text-anchor="end" font-size="13" fill="#7f1d1d">PaCO2 أعلى من 45 mmHg</text><text x="614" y="210" text-anchor="end" font-size="13" fill="#7f1d1d">ارتفاع CO2 مع زيادة معدل وعمق التنفس (Hyper C = High CO2)</text><rect x="16" y="241" width="608" height="71" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><rect x="16" y="241" width="608" height="30" rx="12" fill="#16a34a"/><text x="320" y="262" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">نقص CO2 Hypocapnia</text><text x="614" y="293" text-anchor="end" font-size="13" fill="#14532d">قد ينتج من فرط التهوية (طرد CO2)</text><rect x="16" y="324" width="608" height="71" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/><rect x="16" y="324" width="608" height="30" rx="12" fill="#0d9488"/><text x="320" y="345" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">تبادل الغازات Gas exchange</text><text x="614" y="376" text-anchor="end" font-size="13" fill="#134e4a">خروج CO2 ودخول O2 بين هواء الحويصلات والدم</text><rect x="16" y="407" width="608" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><rect x="16" y="407" width="608" height="30" rx="12" fill="#7c3aed"/><text x="320" y="428" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">نقص الأكسجة Hypoxemia</text><text x="614" y="459" text-anchor="end" font-size="13" fill="#4c1d95">PaO2 أقل من 80 mmHg</text><text x="614" y="478" text-anchor="end" font-size="13" fill="#4c1d95">دافع نقص الأكسجين (Hypoxic drive) عند مرضى COPD المزمنين</text></svg>