<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="470" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">اضطرابات العين الخمسة عند الأطفال</text><rect x="330" y="50" width="290" height="50" rx="10" fill="#6366f1"/><text x="475.0" y="69.0" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">قصر النظر (Myopia)</text><text x="475.0" y="86.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">صورة تتركز أمام الشبكية؛ يرى القريب بوضوح</text><rect x="20" y="50" width="300" height="50" rx="10" fill="#ec4899"/><text x="170.0" y="69.0" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">طول النظر (Hyperopia)</text><text x="170.0" y="86.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">صورة تتركز خلف الشبكية؛ يرى البعيد أوضح</text><rect x="330" y="110" width="290" height="60" rx="10" fill="#f59e0b"/><text x="475.0" y="134.0" text-anchor="middle" font-size="12" font-weight="800" fill="#422006">علامات قصر النظر</text><text x="475.0" y="150.0" text-anchor="middle" font-size="10" font-weight="500" fill="#422006">تقطيب · كتاب قريب · قرب التلفاز · صداع ودوار</text><rect x="20" y="110" width="300" height="60" rx="10" fill="#0ea5e9"/><text x="170.0" y="134.0" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">علامات طول النظر</text><text x="170.0" y="151.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">قريب مضبب · تقطيب · صداع · حرقان وألم بالعين</text><rect x="330" y="180" width="290" height="80" rx="10" fill="#ef4444"/><text x="475.0" y="197.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الحول (Strabismus)</text><text x="475.0" y="214.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">العينان غير متوازيتين</text><text x="475.0" y="231.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">إن لم يعالج بعمر 5-6: كسل العين (Amblyopia) فقد دائم</text><text x="475.0" y="248.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">العلاج: رقعة على العين القوية</text><rect x="20" y="180" width="300" height="80" rx="10" fill="#7c3aed"/><text x="170.0" y="205.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الغمش (Amblyopia)</text><text x="170.0" y="222.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">كسل العين: انخفاض حدة الإبصار رغم التصحيح</text><text x="170.0" y="239.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">العلاج: رقعة · قطرات · نظارة/عدسة · جراحة أحيانًا</text><rect x="20" y="270" width="600" height="80" rx="10" fill="#14b8a6"/><text x="320.0" y="287.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الاستجماتيزم (Astigmatism)</text><text x="320.0" y="304.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">خطأ انكساري يمنع تركيز الضوء بالتساوي على الشبكية</text><text x="320.0" y="321.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">ضبابية بأي مسافة · إجهاد وتقطيب وصداع وصعوبة قيادة ليلًا</text><text x="320.0" y="338.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">العلاج: نظارات · عدسات · جراحة</text><rect x="20" y="365" width="600" height="95" rx="10" fill="#334155"/><text x="320.0" y="415.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">طول النظر: عدسات مصححة أو جراحة انكسار · قصر النظر: نظارات/عدسات</text></svg>