<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 273" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="273" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع اللولب وتثقيفه</text><rect x="326.0" y="48" width="294.0" height="79.0" rx="10" fill="#fff" stroke="#b45309" stroke-width="2"/><rect x="326.0" y="48" width="294.0" height="28" rx="10" fill="#b45309"/><text x="473.0" y="67" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">اللولب النحاسي (Copper IUD)</text><text x="610.0" y="96.5" text-anchor="start" font-size="12.5" fill="#0f172a">• انزعاج خفيف عند التركيب (تنقيط وتقلص)</text><text x="610.0" y="114.0" text-anchor="start" font-size="12.5" fill="#0f172a">• طمث أغزر وتقلص أكثر</text><rect x="20.0" y="48" width="294.0" height="79.0" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="20.0" y="48" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="167.0" y="67" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">اللولب الهرموني (levonorgestrel)</text><text x="304.0" y="96.5" text-anchor="start" font-size="12.5" fill="#0f172a">• نوعان أساسيان للولب</text><text x="304.0" y="114.0" text-anchor="start" font-size="12.5" fill="#0f172a">• تثقيف مشترك</text><rect x="326.0" y="139.0" width="294.0" height="114.0" rx="10" fill="#fff" stroke="#1e3a8a" stroke-width="2"/><rect x="326.0" y="139.0" width="294.0" height="28" rx="10" fill="#1e3a8a"/><text x="473.0" y="158.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">تثقيف الاثنين</text><text x="610.0" y="187.5" text-anchor="start" font-size="12.5" fill="#0f172a">• فحص الخيوط شهريًا بعد الطمث</text><text x="610.0" y="205.0" text-anchor="start" font-size="12.5" fill="#0f172a">• خيط أطول أو أقصر أو مفقود: أبلغ الطبيب</text><rect x="20.0" y="139.0" width="294.0" height="114.0" rx="10" fill="#fff" stroke="#15803d" stroke-width="2"/><rect x="20.0" y="139.0" width="294.0" height="28" rx="10" fill="#15803d"/><text x="167.0" y="158.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">معلومات إضافية</text><text x="304.0" y="187.5" text-anchor="start" font-size="12.5" fill="#0f172a">• لا يتأثر بالمزلقات</text><text x="304.0" y="205.0" text-anchor="start" font-size="12.5" fill="#0f172a">• لا يتأثر بزيادة/نقص الوزن</text><text x="304.0" y="222.5" text-anchor="start" font-size="12.5" fill="#0f172a">• غياب الطمث العشوائي ليس طبيعيًا: قد</text><text x="304.0" y="240.0" text-anchor="start" font-size="12.5" fill="#0f172a">يعني حمل</text></svg>