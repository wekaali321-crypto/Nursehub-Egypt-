<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="330" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">شدّ باك (Buck's) والعناية بعد جراحة المفصل</text>
<rect x="30" y="200" width="360" height="14" rx="10" fill="#cbd5e1"/>
<rect x="30" y="214" width="360" height="50" rx="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
<rect x="60" y="170" width="230" height="30" rx="10" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
<text x="175" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">الطرف في وضع محايد</text>
<line x1="290" y1="185" x2="420" y2="150" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
<circle cx="425" cy="148" r="9" fill="#94a3b8"/>
<line x1="425" y1="157" x2="425" y2="230" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
<rect x="405" y="230" width="40" height="36" rx="10" fill="#0f766e"/>
<text x="425" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">أوزان</text>
<text x="425" y="285" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">تتدلى حرة بلا ملامسة للأرض</text>
<rect x="460" y="60" width="160" height="60" rx="10" fill="#0369a1"/>
<text x="540.0" y="84.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الحبال مشدودة</text>
<text x="540.0" y="103.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">والأوزان معلّقة</text>
<rect x="20" y="60" width="200" height="62" rx="10" fill="#b91c1c"/>
<text x="120.0" y="85.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">فحص الدورة والأعصاب</text>
<text x="120.0" y="104.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">(نبض، حركة، إحساس، لون)</text>
<rect x="235" y="60" width="210" height="62" rx="10" fill="#7c3aed"/>
<text x="340.0" y="85.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">السرير مسطح تقريبًا</text>
<text x="340.0" y="104.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لا ترفع الرأس أكثر من 30°</text>
<text x="215" y="310" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">يُستعمل مؤقتًا قبل الجراحة لتثبيت كسور الفخذ والورك وتخفيف التشنج</text>
</svg>
