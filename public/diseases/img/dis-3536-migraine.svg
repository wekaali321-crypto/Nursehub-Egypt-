<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="360" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أدوية الصداع النصفي: sumatriptan وergotamine</text><rect x="330" y="45" width="295" height="110" rx="10" fill="#dbeafe"/><text x="477.5" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">sumatriptan</text><text x="477.5" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">للصداع النصفي والصداع العنقودي</text><text x="477.5" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تضيّق أوعية الدماغ</text><text x="477.5" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">ممنوع: مرض الشريان التاجي والضغط غير المضبوط</text><rect x="15" y="45" width="305" height="110" rx="10" fill="#dcfce7"/><text x="167.5" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">ergotamine تحت اللسان</text><text x="167.5" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">للصداع النصفي</text><text x="167.5" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تضيّق أوعية الدماغ</text><text x="167.5" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">قرص واحد فور بدء الصداع</text><rect x="15" y="175" width="610" height="60" rx="10" fill="#fee2e2"/><text x="320" y="210" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">sumatriptan: ابحث عن تاريخ ضغط غير مضبوط وأبلغ عنه؛ بلّغ عن الذبحة (تشنج الأوعية التاجية)</text><rect x="15" y="250" width="610" height="60" rx="10" fill="#fef9c3"/><text x="320" y="285" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">ergotamine: العلامة الأولوية = شحوب الأطراف (انقباض الأوعية الطرفية)</text></svg>