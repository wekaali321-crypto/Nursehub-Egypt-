<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 292" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="292" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الأنيميا: أسباب ونقص الحديد عند الأطفال</text><rect x="20" y="46" width="600" height="30" rx="8" fill="#1e3a8a"/><text x="535.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">البند</text><text x="235.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">التفاصيل</text><rect x="20" y="76" width="600" height="30" fill="#e0e7ff"/><text x="535.0" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">الهيموجلوبين</text><text x="235.0" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">طبيعي 12 فأكثر؛ سيئ 8–9؛ أقل من 7 خطر شديد</text><rect x="20" y="106" width="600" height="66" fill="#fff"/><text x="535.0" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">أسباب نقص الحديد</text><text x="535.0" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">(رضع/أطفال)</text><text x="235.0" y="126" text-anchor="middle" font-size="12.5"  fill="#0f172a">ولادة مبكرة، قلة الغذاء، إفراط الحليب (أكثر من 24 أوقية/يوم)، رضع</text><text x="235.0" y="144" text-anchor="middle" font-size="12.5"  fill="#0f172a">خدّج رضاعة صناعية بدون حديد، حمية نباتية صارمة (دعمها: حديد +</text><text x="235.0" y="162" text-anchor="middle" font-size="12.5"  fill="#0f172a">فيتامين C + كالسيوم وD)</text><rect x="20" y="172" width="600" height="30" fill="#e0e7ff"/><text x="535.0" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">مصادر الحديد</text><text x="235.0" y="192" text-anchor="middle" font-size="12.5"  fill="#0f172a">لحوم، أسماك، دواجن، سبانخ، حبوب كاملة، كبدة، بصل</text><rect x="20" y="202" width="600" height="30" fill="#fff"/><text x="535.0" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">الدواء</text><text x="235.0" y="222" text-anchor="middle" font-size="12.5"  fill="#0f172a">Ferrous sulfate فموي؛ Iron dextran (وريدي/عضلي)</text><rect x="20" y="232" width="600" height="48" fill="#e0e7ff"/><text x="535.0" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">نقاط الدواء</text><text x="235.0" y="252" text-anchor="middle" font-size="12.5"  fill="#0f172a">براز داكن/أسود = طبيعي وليس نزيفًا؛ معدة فارغة قبل بساعة؛ السائل</text><text x="235.0" y="270" text-anchor="middle" font-size="12.5"  fill="#0f172a">بقشة (يلون الأسنان)</text>
</svg>
