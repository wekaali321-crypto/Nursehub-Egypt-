<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="420" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">neostigmine وpyridostigmine: الأزمة الكولينية</text><rect x="330" y="45" width="295" height="80" rx="10" fill="#dbeafe"/><text x="477.5" y="72" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">الآلية</text><text x="477.5" y="90" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تزيد الأستيل كولين فتزداد الإفرازات</text><text x="477.5" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">(-stigmine: Secretions MINE)</text><rect x="15" y="45" width="305" height="80" rx="10" fill="#dcfce7"/><text x="167.5" y="72" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">الاستعمال</text><text x="167.5" y="90" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">الوهن العضلي الوبيل</text><text x="167.5" y="108" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">ضعف وقلة حركة</text><rect x="15" y="140" width="610" height="40" rx="10" fill="#fee2e2"/><text x="320" y="165" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">أزمة كولينية = أزمة إفرازات: Cholinergic Crisis (CCC)</text><rect x="500" y="195" width="115" height="70" rx="10" fill="#ffedd5"/><text x="557.5" y="235" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">حدقة ضيقة</text><rect x="380" y="195" width="115" height="70" rx="10" fill="#ffedd5"/><text x="437.5" y="235" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">دمع</text><rect x="260" y="195" width="115" height="70" rx="10" fill="#ffedd5"/><text x="317.5" y="235" text-anchor