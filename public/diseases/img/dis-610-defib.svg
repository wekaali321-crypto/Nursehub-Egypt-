<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="250" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >الرجفان البطيني: الوقت أهم من أي حاجة</text><rect x="20" y="60" width="140" height="110" rx="10" fill="#22c55e"/><text x="90" y="95" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >0 – 3 د</text><text x="90" y="125" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >نجاة عالية</text><rect x="170" y="60" width="140" height="110" rx="10" fill="#eab308"/><text x="240" y="95" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >3 – 5 د</text><text x="240" y="125" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >تقل</text><rect x="320" y="60" width="140" height="110" rx="10" fill="#f97316"/><text x="390" y="95" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >5 – 8 د</text><text x="390" y="125" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >ضعيفة</text><rect x="470" y="60" width="140" height="110" rx="10" fill="#dc2626"/><text x="540" y="95" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >+10 د</text><text x="540" y="125" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >نادرة</text><text x="320" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#475569" >كل دقيقة تأخير في الصدمة تقلل النجاة تقريباً 7–10%</text></svg>