<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="430" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قسطرة فولي: الخطوات والمقاسات</text>
  <path d="M180 70 C140 70 130 130 150 160 C170 190 230 190 250 160 C270 130 260 70 220 70 Z" fill="#fecaca" stroke="#ef4444" stroke-width="2"/><rect x="195" y="160" width="20" height="70" rx="6" fill="#fbbf24"/><circle cx="205" cy="150" r="10" fill="#f87171" stroke="#b91c1c" stroke-width="1.5"/><path d="M205 230 C205 280 330 280 330 320" fill="none" stroke="#f59e0b" stroke-width="5"/><rect x="290" y="320" width="110" height="90" rx="12" fill="#fef3c7" stroke="#eab308" stroke-width="1.5"/><text x="345" y="370" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">كيس البول</text><rect x="300" y="55" width="320" height="215" rx="10" fill="#e0e7ff" stroke="#cbd5e1" stroke-width="1.5"/><text x="460" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الخطوات المهمة</text><text x="608" y="101" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• اغسل اليدين وهيئ الوضع: ظهر، ركبتان مثنيتان وساقان مبعدتان</text><text x="608" y="131" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• عقّم: قفازات معقمة، ستارة، مطهر</text><text x="608" y="161" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• اختبر البالون، نظّف المهبل بثلاث مسحات من الأمام للخلف</text><text x="608" y="191" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• أدخل حتى يظهر البول ثم 2–3 بوصة</text><text x="608" y="221" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• انفخ البالون كاملًا وثبّت الأنبوب</text><rect x="20" y="290" width="250" height="120" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="145" y="315" text-anchor="middle" font-size="14" font-weight="800" fill="#1e293b">المقاسات</text><text x="145" y="345" text-anchor="middle" font-size="13" font-weight="500" fill="#1e293b">من 12 إلى 48 French</text><text x="145" y="372" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">تحقق من سياسة المستشفى</text><text x="145" y="396" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">قد يُسحب 1000 mL فأكثر فيُشبَك</text>
</svg>
