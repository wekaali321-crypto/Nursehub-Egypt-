<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="560" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التفويض: ما لا يفوّضه الممرض المسجّل (UEAT) وما يفوّض</text>
  <rect x="330" y="50" width="290" height="200" rx="10" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">لا يُفوَّض أبدًا: UEAT</text><text x="608" y="96" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• U: مريض غير مستقر (جديد، عائد من إجراء،</text><text x="608" y="126" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• بعد عملية، تغيّر مفاجئ)</text><text x="608" y="156" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• E: التقييم (تفسير نتائج وألم وعلامات)</text><text x="608" y="186" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• A: التقييم الأولي (قبول جديد، بعد عملية)</text><text x="608" y="216" text-anchor="start" font-size="11.5" font-weight="500" fill="#1e293b">• T: التثقيف الأولي (الأول)</text><rect x="20" y="50" width="290" height="200" rx="10" fill="#ffedd5" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">للممرض المسجل فقط</text><text x="298" y="96" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• دفع وريدي IV push</text><text x="298" y="126" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• نقل الدم ومشتقاته</text><text x="298" y="156" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• أدوية الخط المركزي: كيماوي وTPN</text><rect x="20" y="265" width="290" height="275" rx="10" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="287" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">ممرض مرخص (LPN/LVN)</text><text x="298" y="311" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• يقيّم ويثقّف ويراقب</text><text x="298" y="339" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• تقييم ثانوي، تدعيم، متابعة</text><text x="298" y="367" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• لا غير مستقر ولا أولي</text><text x="298" y="395" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• لا دفع وريدي</text><text x="298" y="423" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• يعطي: فموي وتحت الجلد وعضلي</text><text x="298" y="451" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• وريدي مخفف: لكن لا يغير المعدل</text><rect x="330" y="265" width="290" height="275" rx="10" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="287" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">مساعد تمريض (CNA/UAP)</text><text x="608" y="311" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• V: العلامات الحيوية</text><text x="608" y="338" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• A: المشي والتحريك</text><text x="608" y="365" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• P: تغيير الوضع والحمام</text><text x="608" y="392" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• E: الأكل</text><text x="608" y="419" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• R: تسجيل الداخل والخارج</text><text x="608" y="446" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• لا تثقيف ولا تقييم ولا أدوية</text>
</svg>
