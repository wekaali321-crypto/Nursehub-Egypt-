<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 725" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="700" height="725" rx="16" fill="#f8fafc"/>
<text x="350.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">احتشاء العضلة والذبحة وأمراض الشرايين التاجية (CAD)</text>
