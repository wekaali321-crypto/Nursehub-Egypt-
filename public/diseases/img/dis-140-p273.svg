<text x="126.0" y="124" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">طبيعي</text>
<rect x="246" y="60" width="200" height="70" rx="6" fill="#fff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1.2"/>
<polyline fill="none" stroke="#0f172a" stroke-width="1.6" points="246.0,100.0 256.0,100.0 260.7,92.0 266.0,100.0 271.3,100.0 274.0,106.0 277.3,68.0 280.7,86.0 287.3,82.0 299.3,90.0 312.7,100.0 312.7,100.0 322.7,100.0 327.3,92.0 332.7,100.0 338.0,100.0 340.7,106.0 344.0,68.0 347.3,86.0 354.0,82.0 366.0,90.0 379.3,100.0 379.3,100.0 389.3,100.0 394.0,92.0 399.3,100.0 404.7,100.0 407.3,106.0 410.7,68.0 414.0,86.0 420.7,82.0 432.7,90.0 446.0,100.0"/>
<text x="346.0" y="124" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">ارتفاع ST (جلطة)</text>
<rect x="466" y="60" width="200" height="70" rx="6" fill="#fff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1.2"/>
<polyline fill="none" stroke="#0f172a" stroke-width="1.6" points="466.0,100.0 476.0,100.0 480.7,92.0 486.0,100.0 491.3,100.0 494.0,106.0 497.3,68.0 500.7,112.0 507.3,114.0 519.3,106.0 532.7,100.0 532.7,100.0 542.7,100.0 547.3,92.0 552.7,100.0 558.0,100.0 560.7,106.0 564.0,68.0 567.3,112.0 574.0,114.0 586.0,106.0 599.3,100.0 599.3,100.0 609.3,100.0 614.0,92.0 619.3,100.0 624.7,100.0 627.3,106.0 630.7,68.0 634.0,112.0 640.7,114.0 652.7,106.0 666.0,100.0"/>
<text x="566.0" y="124" text-anchor="middle" font-size="11.5" font-weight="700" fill="#475569">انخفاض ST (نقص تروية)</text>
<rect x="356.0" y="168" width="330.0" height="147.0" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="356.0" y="168" width="330.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="521.0" y="186" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الآلية والتطور CAD → ACS → MI</text>
<text x="676.0" y="212" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• انسداد الشرايين التاجية يحرم عضلة القلب من</text>
<text x="676.0" y="228.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">الأكسجين فتموت (نخر)</text>
<text x="676.0" y="247.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• CAD: مرض الشريان التاجي</text>
<text x="676.0" y="265.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• ACS: ذبحة مستقرة (تخف بالراحة) أو غير مستقرة (لا</text>
<text x="676.0" y="282.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">تخف بالراحة)</text>
<text x="676.0" y="300.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• MI: موت العضلة</text>
<rect x="14.0" y="168" width="330.0" height="147.0" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="14.0" y="168" width="330.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="179.0" y="186" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأعراض</text>
<text x="334.0" y="212" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• ألم فك أو ظهر أو كتف أو حرقة بالمعدة أو خلف</text>
<text x="334.0" y="228.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">القص: "مفاجئ"، "ساحق"، "ينتشر" (كلمات الأولوية)</text>
<text x="334.0" y="247.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• ضيق نفس، غثيان وقيء وألم بطن</text>
<text x="334.0" y="265.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• تعرق، جلد شاحب بارد، قلق</text>
<rect x="356.0" y="327.0" width="330.0" height="178.0" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.2"/>
<rect x="356.0" y="327.0" width="330.0" height="26" rx="10" fill="#6366f1" fill-opacity="1" stroke="#6366f1" stroke-width="1.2"/>
<text x="521.0" y="345.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأسباب والوقاية</text>
<text x="676.0" y="371.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• توتر وتدخين ومنبهات، سمنة (BMI فوق 25)، سكر وضغط</text>
<text x="676.0" y="387.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">فوق 140/90، دهون حيوانية</text>
<text x="676.0" y="406.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• رجال وعمر فوق 50 (والنساء أيضاً)</text>
<text x="676.0" y="424.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• تثقيف: غذاء 2 غ ملح/2 لتر سوائل يومياً، راقب</text>
<text x="676.0" y="441.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">زيادة الوزن السريعة (قصور قلب)، تقليل التوتر</text>
<text x="676.0" y="457.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">والكحول والكافيين، مشي 30 د × 5، لا تدخين، جنس آمن</text>
<text x="676.0" y="474.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">إن صعد سلمين دون ضيق نفس، وتجنب NSAIDs لأنها ترفع</text>
<text x="676.0" y="490.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">خطر التجلط</text>
<rect x="14.0" y="327.0" width="330.0" height="178.0" rx="10" fill="#0e7490" fill-opacity="0.1" stroke="#0e7490" stroke-width="1.2"/>
<rect x="14.0" y="327.0" width="330.0" height="26" rx="10" fill="#0e7490" fill-opacity="1" stroke="#0e7490" stroke-width="1.2"/>
<text x="179.0" y="345.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">التشخيص</text>
<text x="334.0" y="371.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• أول خطوة ECG لأي ألم صدر</text>
<text x="334.0" y="389.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• ثانياً المعمل: التروبونين (فوق 0.5 ng/mL في</text>
<text x="334.0" y="406.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">المرجع المستعمل؛ يختلف حسب المعمل) هو المؤشر</text>
<text x="334.0" y="422.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">المميز للجلطة، وCK-MB والميوغلوبين وCRP مساعدة</text>
<rect x="356.0" y="517.0" width="330.0" height="180.0" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="356.0" y="517.0" width="330.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="521.0" y="535.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">أثناء ألم الصدر</text>
<text x="676.0" y="561.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• أكسجين، أسبرين، نيترو تحت اللسان حتى 3 جرعات كحد</text>
<text x="676.0" y="577.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">أقصى، مورفين لأي ألم بعد الجلطة</text>
<rect x="14.0" y="517.0" width="330.0" height="180.0" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="14.0" y="517.0" width="330.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="179.0" y="535.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">أثناء الإقامة وبعد الجلطة</text>
<text x="334.0" y="561.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• هيبارين يمنع نمو الخثرة (لا يذيبها؛ الـtPA فقط</text>
<text x="334.0" y="577.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">يذيب)، المقابل الدوائي: بروتامين سلفات</text>
<text x="334.0" y="596.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• حاصرات بيتا لراحة القلب (احذر في قصور القلب أو</text>
<text x="334.0" y="612.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">بطء &lt;60 أو ضغط منخفض أو ربو/COPD أو سكر)</text>
<text x="334.0" y="631.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• حاصرات الكالسيوم، موسّعات (نيترو، أيزوسوربيد)</text>
<text x="334.0" y="649.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• عند الخروج: ACE أو ARB وانتبه من الحمل والوذمة</text>
<text x="334.0" y="666.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">الوعائية والسعال وارتفاع K (تجنب بدائل الملح</text>
<text x="334.0" y="682.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">والخضرة الورقية الكثيرة)</text>
</svg>
