<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="410" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنماط الوراثة</text>
<rect x="14" y="44" width="300" height="170" rx="10" fill="#fff" stroke="#f97316" stroke-width="1.5"/><rect x="14" y="44" width="300" height="26" rx="10" fill="#f97316"/><text x="164.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >الوراثة السائدة الجسمية Autosomal Dominant</text><text x="304" y="89" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >يكفي أليل واحد معيب لحدوث المرض</text><text x="304" y="107.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >أمثلة: فرط كوليسترول عائلي، كلى متعددة الكيسات (البالغين)، هنتنغتون، مارفان</text><rect x="326" y="44" width="300" height="170" rx="10" fill="#fff" stroke="#6366f1" stroke-width="1.5"/><rect x="326" y="44" width="300" height="26" rx="10" fill="#6366f1"/><text x="476.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >المتنحية الجسمية Autosomal Recessive</text><text x="616" y="89" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >تحتاج أليلين معيبين (من الأبوين)</text><text x="616" y="107.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >متغاير: حامل بلا مرض</text><text x="616" y="126.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >أمثلة: تليف كيسي، أنيميا منجلية، كلى متعددة الكيسات، تاي-ساكس</text><rect x="14" y="226" width="300" height="170" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><rect x="14" y="226" width="300" height="26" rx="10" fill="#16a34a"/><text x="164.0" y="244" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >المرتبطة بـX المتنحية</text><text x="304" y="271" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >الذكر XY إذا ورث X معيب أصيب</text><text x="304" y="289.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >الأنثى XX تحتاج الاثنين</text><text x="304" y="308.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >أمثلة: ضمور دوشين العضلي، هيموفيليا A</text><rect x="326" y="226" width="300" height="170" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><rect x="326" y="226" width="300" height="26" rx="10" fill="#7c3aed"/><text x="476.0" y="244" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >متعددة العوامل Multifactorial</text><text x="616" y="271" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >بيئة + تاريخ عائلي (وراثة)</text><text x="616" y="289.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >مؤثرات مشوِّهة: دخان، كحول، أدوية</text><text x="616" y="308.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >أمثلة: شق الحنك، عيوب القلب الخلقية، سكر النوع 2، خلع الورك الخلقي</text>
</svg>
