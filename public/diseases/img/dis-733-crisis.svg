<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 524" direction="rtl" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="524" fill="#fafafa"/><text x="320" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#0d47a1">أزمة أديسون: خطوات الطوارئ</text><rect x="40" y="60" width="560" height="66" rx="12" fill="#e3f2fd" stroke="#607d8b" stroke-width="1.2"/><text x="320" y="88" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">اشتبه</text><text x="320" y="110" text-anchor="middle" font-size="14" fill="#37474f">قيء + ألم بطن + ضغط منخفض + حمى/عدوى/جراحة في مريض أديسون أو على كورتيزون</text><path d="M320 126 v18" stroke="#607d8b" stroke-width="2"/><path d="M313 138 l7 8 l7 -8" fill="none" stroke="#607d8b" stroke-width="2"/><rect x="40" y="152" width="560" height="66" rx="12" fill="#fff8e1" stroke="#607d8b" stroke-width="1.2"/><text x="320" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">خط وريدي واسع + أخذ عينات</text><text x="320" y="202" text-anchor="middle" font-size="14" fill="#37474f">سكر، Na/K، كرياتينين، كورتيزول (لا تؤخر العلاج)</text><path d="M320 218 v18" stroke="#607d8b" stroke-width="2"/><path d="M313 230 l7 8 l7 -8" fill="none" stroke="#607d8b" stroke-width="2"/><rect x="40" y="244" width="560" height="66" rx="12" fill="#fce4ec" stroke="#607d8b" stroke-width="1.2"/><text x="320" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">Hydrocortisone 100 مجم وريدي فوراً</text><text x="320" y="294" text-anchor="middle" font-size="14" fill="#37474f">ثم 200 مجم/24 ساعة (بأمر الطبيب)</text><path d="M320 310 v18" stroke="#607d8b" stroke-width="2"/><path d="M313 322 l7 8 l7 -8" fill="none" stroke="#607d8b" stroke-width="2"/><rect x="40" y="336" width="560" height="66" rx="12" fill="#e8f5e9" stroke="#607d8b" stroke-width="1.2"/><text x="320" y="364" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">محلول ملحي 0.9% بسرعة</text><text x="320" y="386" text-anchor="middle" font-size="14" fill="#37474f">حوالي 1 لتر في أول ساعة، ودكستروز لو سكر منخفض</text><path d="M320 402 v18" stroke="#607d8b" stroke-width="2"/><path d="M313 414 l7 8 l7 -8" fill="none" stroke="#607d8b" stroke-width="2"/><rect x="40" y="428" width="560" height="66" rx="12" fill="#e3f2fd" stroke="#607d8b" stroke-width="1.2"/><text x="320" y="456" text-anchor="middle" font-size="17" font-weight="700" fill="#263238">مراقبة قلب وبوتاسيوم وسكر</text><text x="320" y="478" text-anchor="middle" font-size="14" fill="#37474f">ابحث عن المحفز (عدوى) وعالجه</text></svg>