<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="330" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >المحاليل الوريدية: ماذا يحدث للخلية؟</text><rect x="20" y="46" width="196" height="244" rx="12" fill="#fff" stroke="#16a34a" stroke-width="3"/><rect x="20" y="46" width="196" height="38" rx="12" fill="#16a34a" stroke="none" stroke-width="1"/><text x="118" y="72" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" >متساوي التوتر</text><ellipse cx="118" cy="130" rx="54.54545454545454" ry="35.294117647058826" fill="#16a34a" opacity="0.25" stroke="#16a34a" stroke-width="3"/><text x="118" y="196" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >حجم الخلية ثابت</text><text x="118" y="224" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >NaCl 0.9%، الرينجر اللاكتاتي</text><text x="118" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#16a34a" >يزيد الحجم خارج الخلايا</text><rect x="222" y="46" width="196" height="244" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="3"/><rect x="222" y="46" width="196" height="38" rx="12" fill="#0ea5e9" stroke="none" stroke-width="1"/><text x="320" y="72" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" >ناقص التوتر</text><ellipse cx="320" cy="130" rx="68.18181818181817" ry="47.05882352941177" fill="#0ea5e9" opacity="0.25" stroke="#0ea5e9" stroke-width="3"/><text x="320" y="196" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >الخلية تنتفخ</text><text x="320" y="224" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >NaCl 0.45%، NaCl 0.225%</text><text x="320" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0ea5e9" >ببطء: خطر وذمة الخلايا</text><rect x="424" y="46" width="196" height="244" rx="12" fill="#fff" stroke="#f97316" stroke-width="3"/><rect x="424" y="46" width="196" height="38" rx="12" fill="#f97316" stroke="none" stroke-width="1"/><text x="522" y="72" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" >عالي التوتر</text><ellipse cx="522" cy="130" rx="31.818181818181817" ry="23.529411764705884" fill="#f97316" opacity="0.25" stroke="#f97316" stroke-width="3"/><text x="522" y="196" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >الخلية تنكمش</text><text x="522" y="224" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >NaCl 3%، D10W، D5NS</text><text x="522" y="252" text-anchor="middle" font-size="12.5" font-weight="700" fill="#f97316" >يسحب الماء: راقب عن قرب</text><text x="320" y="312" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >D5W متساوي في الكيس لكنه يتصرف كناقص التوتر بعد استهلاك السكر</text>
</svg>
