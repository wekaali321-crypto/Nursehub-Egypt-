<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="420" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع الكسور وعناية الجبس</text><rect x="20" y="50" width="195" height="52" rx="10" fill="#0ea5e9"/><text x="117.5" y="70.0" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">مغلق (Closed)</text><text x="117.5" y="87.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">لا يخترق الجلد</text><rect x="225" y="50" width="195" height="52" rx="10" fill="#dc2626"/><text x="322.5" y="70.0" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">مفتوح (Open/Compound)</text><text x="322.5" y="87.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">الجلد مكسور</text><rect x="430" y="50" width="195" height="52" rx="10" fill="#7c3aed"/><text x="527.5" y="70.0" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">كامل / غير كامل</text><text x="527.5" y="87.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">غير الكامل: غصن أخضر (Greenstick)</text><rect x="20" y="110" width="195" height="52" rx="10" fill="#f59e0b"/><text x="117.5" y="130.0" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">لولبي (Spiral)</text><text x="117.5" y="147.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">دوران العظم</text><rect x="225" y="110" width="195" height="52" rx="10" fill="#14b8a6"/><text x="322.5" y="130.0" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">مائل (Oblique)</text><text x="322.5" y="147.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">خط مائل</text><rect x="430" y="110" width="195" height="52" rx="10" fill="#334155"/><text x="527.5" y="130.0" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">انضغاطي (Compression)</text><text x="527.5" y="147.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">سحق بالضغط</text><rect x="20" y="180" width="300" height="100" rx="10" fill="#16a34a"/><text x="170.0" y="198.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">عناية الجبس الجديد</text><text x="170.0" y="215.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">C: جاف ونظيف، غطِّه بكيس عند الاستحمام</text><text x="170.0" y="232.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">A: ارفعه فوق مستوى القلب أول 48 ساعة</text><text x="170.0" y="249.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">S: للهرش استعمل مجفف شعر على بارد</text><text x="170.0" y="266.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">T: لا تحميل وزن ولا ضغط ولا سطح صلب</text><rect x="330" y="180" width="290" height="100" rx="10" fill="#f59e0b"/><text x="475.0" y="207.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">فحوص الأعصاب والأوعية</text><text x="475.0" y="224.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">تحقق من النبض والحركة والإحساس واللون</text><text x="475.0" y="241.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">ملء الشعيرات أقل من 3 ثوانٍ</text><text x="475.0" y="258.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">لا وخز/تنميل ولا شحوب ولا برودة</text><rect x="20" y="295" width="600" height="110" rx="10" fill="#dc2626"/><text x="320.0" y="326.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">مضاعفات تستدعي الإبلاغ الفوري</text><text x="320.0" y="344.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ألم لا يزول بالمورفين أو شديد مع الحركة السلبية</text><text x="320.0" y="362.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تنميل ووخز أو صعوبة تحريك الأصابع</text><text x="320.0" y="380.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">النقاط الساخنة تدل على عدوى؛ متلازمة الحيز = نقص تروية</text></svg>