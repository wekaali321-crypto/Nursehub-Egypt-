<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="322" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">خيارات علاج سرطان البروستاتا حسب الحالة</text><rect x="12" y="44" width="616" height="30" rx="8" fill="#0f172a"/><text x="525.3333333333333" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">الخيار</text><text x="326.0392156862745" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">متى؟</text><text x="120.7058823529411" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">ملاحظة تمريضية</text><rect x="12" y="74" width="616" height="44" fill="#fff"/><text x="525.3333333333333" y="92" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">مراقبة نشطة (Watchful waiting)</text><text x="326.0392156862745" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">ورم صغير بطيء أو مريض كبير</text><text x="326.0392156862745" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">أو مرضه كتير</text><text x="120.7058823529411" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">PSA دوري + فحص + طمأنة</text><rect x="12" y="118" width="616" height="28" fill="#f1f5f9"/><text x="525.3333333333333" y="136" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">استئصال البروستاتا الجذري</text><text x="326.0392156862745" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">محصور في البروستاتا</text><text x="120.7058823529411" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">قسطرة، سلس بول، ضعف انتصاب</text><rect x="12" y="146" width="616" height="44" fill="#fff"/><text x="525.3333333333333" y="164" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">إشعاع خارجي (EBRT) / زرع مصدر</text><text x="525.3333333333333" y="180" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">(Brachytherapy)</text><text x="326.0392156862745" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">بديل للجراحة أو بعدها</text><text x="120.7058823529411" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">حماية الجلد، التهاب</text><text x="120.7058823529411" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">مثانة/مستقيم</text><rect x="12" y="190" width="616" height="28" fill="#f1f5f9"/><text x="525.3333333333333" y="208" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">تجميد (Cryosurgery)</text><text x="326.0392156862745" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">حالات مختارة</text><text x="120.7058823529411" y="208" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">سوائل ومراقبة بول</text><rect x="12" y="218" width="616" height="60" fill="#fff"/><text x="525.3333333333333" y="236" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">حرمان من الأندروجين</text><text x="525.3333333333333" y="252" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">(Leuprolide / Goserelin /</text><text x="525.3333333333333" y="268" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">استئصال خصيتين)</text><text x="326.0392156862745" y="236" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">منتشر أو متقدم</text><text x="120.7058823529411" y="236" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">هبّات سخونة، نقص عظام، زيادة</text><text x="120.7058823529411" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">الوزن</text><rect x="12" y="278" width="616" height="28" fill="#f1f5f9"/><text x="525.3333333333333" y="296" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">كيماوي</text><text x="326.0392156862745" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">مقاوم للهرمونات</text><text x="120.7058823529411" y="296" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">حسب البروتوكول</text></svg>