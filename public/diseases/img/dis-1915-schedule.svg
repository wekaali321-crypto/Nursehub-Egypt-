<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 448" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="448" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">جدول التطعيمات حسب اللقاح (مراجعة الامتحانات الأمريكية)</text><rect x="20" y="46" width="600" height="30" rx="8" fill="#1e3a8a"/><text x="535.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">اللقاح</text><text x="235.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">المواعيد</text><rect x="20" y="76" width="600" height="30" fill="#e0e7ff"/><text x="535.0" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">HepB (كبد B)</text><text x="235.0" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">عند الولادة، 1–2 شهر، 6–18 شهرًا (0-1/2-6)</text><rect x="20" y="106" width="600" height="30" fill="#fff"/><text x="535.0" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">RV (روتا)</text><text x="235.0" y="126" text-anchor="middle" font-size="12.5"  fill="#0f172a">2، 4، 6 أشهر</text><rect x="20" y="136" width="600" height="30" fill="#e0e7ff"/><text x="535.0" y="156" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">IPV (شلل مُعطَّل)</text><text x="235.0" y="156" text-anchor="middle" font-size="12.5"  fill="#0f172a">2، 4، 6–18 شهرًا، 4–6 سنوات</text><rect x="20" y="166" width="600" height="30" fill="#fff"/><text x="535.0" y="186" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">PCV (رئوي مكورات)</text><text x="235.0" y="186" text-anchor="middle" font-size="12.5"  fill="#0f172a">2، 4، 6، 12 شهرًا</text><rect x="20" y="196" width="600" height="30" fill="#e0e7ff"/><text x="535.0" y="216" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Hib</text><text x="235.0" y="216" text-anchor="middle" font-size="12.5"  fill="#0f172a">2، 4، 6، 12 شهرًا</text><rect x="20" y="226" width="600" height="30" fill="#fff"/><text x="535.0" y="246" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">DTaP (ثلاثي)</text><text x="235.0" y="246" text-anchor="middle" font-size="12.5"  fill="#0f172a">2، 4، 6، 12–18 شهرًا، 4–6 سنوات (مهم)</text><rect x="20" y="256" width="600" height="30" fill="#e0e7ff"/><text x="535.0" y="276" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">إنفلونزا</text><text x="235.0" y="276" text-anchor="middle" font-size="12.5"  fill="#0f172a">من 6 أشهر ثم سنويًا</text><rect x="20" y="286" width="600" height="30" fill="#fff"/><text x="535.0" y="306" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">MMR</text><text x="235.0" y="306" text-anchor="middle" font-size="12.5"  fill="#0f172a">12–18 شهرًا و4–6 سنوات</text><rect x="20" y="316" width="600" height="30" fill="#e0e7ff"/><text x="535.0" y="336" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Varicella (جدري مائي)</text><text x="235.0" y="336" text-anchor="middle" font-size="12.5"  fill="#0f172a">12–18 شهرًا و4–6 سنوات</text><rect x="20" y="346" width="600" height="30" fill="#fff"/><text x="535.0" y="366" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">HepA (كبد A)</text><text x="235.0" y="366" text-anchor="middle" font-size="12.5"  fill="#0f172a">12–23 شهرًا: جرعتان بينهما 6 أشهر قبل سنتين</text><rect x="20" y="376" width="600" height="30" fill="#e0e7ff"/><text x="535.0" y="396" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">HPV</text><text x="235.0" y="396" text-anchor="middle" font-size="12.5"  fill="#0f172a">9–12 سنة (ذكور وإناث)</text><rect x="20" y="406" width="600" height="30" fill="#fff"/><text x="535.0" y="426" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">MCV (سحائي)</text><text x="235.0" y="426" text-anchor="middle" font-size="12.5"  fill="#0f172a">11–12 سنة وتنشيطية 16–18 سنة</text>
</svg>
