<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 294" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="294" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">طرق العدوى بالحمى المالطية (Brucellosis)</text><rect x="326" y="52" width="284" height="92" rx="12" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="468" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#854d0e">منتجات الألبان الملوثة</text><text x="468" y="102" text-anchor="middle" font-size="12.5" fill="#854d0e">لبن/جبن غير مبستر</text><text x="468" y="119" text-anchor="middle" font-size="12.5" fill="#854d0e">الأكثر شيوعاً في مصر</text><rect x="30" y="52" width="284" height="92" rx="12" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="172" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#9a3412">لحوم غير مطهية جيداً</text><text x="172" y="102" text-anchor="middle" font-size="12.5" fill="#9a3412">أكل لحم نيئ أو ناقص الطهي</text><rect x="326" y="156" width="284" height="92" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/><text x="468" y="184" text-anchor="middle" font-size="14.5" font-weight="800" fill="#991b1b">مخالطة إفرازات الحيوان</text><text x="468" y="206" text-anchor="middle" font-size="12.5" fill="#991b1b">ولادة الماشية، دم، أنسجة</text><text x="468" y="223" text-anchor="middle" font-size="12.5" fill="#991b1b">الرعاة والبياطرة وعمال المجازر</text><rect x="30" y="156" width="284" height="92" rx="12" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.5"/><text x="172" y="184" text-anchor="middle" font-size="14.5" font-weight="800" fill="#5b21b6">عدوى مهنية</text><text x="172" y="206" text-anchor="middle" font-size="12.5" fill="#5b21b6">العاملون بالمعامل</text><text x="172" y="223" text-anchor="middle" font-size="12.5" fill="#5b21b6">(استنشاق/ملامسة عينات)</text><text x="320" y="282" text-anchor="middle" font-size="12.5" fill="#475569">العدوى من إنسان لإنسان نادرة جداً</text></svg>