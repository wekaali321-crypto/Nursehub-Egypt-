<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="400" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">هبوط الضغط: تقييم سريع</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="170" y="45" width="300" height="40" rx="10" fill="#0f172a"/><text x="320" y="70" fill="#fff" direction="ltr">BP &lt; 90/60</text>
    <path d="M320 85 V105" stroke="#64748b" stroke-width="3"/>
    <rect x="130" y="105" width="380" height="46" rx="10" fill="#fef9c3" stroke="#eab308"/><text x="320" y="125" fill="#422006">أعراض صدمة؟ نبض سريع، جلد بارد، قلة بول، نعاس</text><text x="320" y="142" font-size="11" fill="#422006">MAP أقل من 65</text>
    <path d="M250 151 L150 185 M390 151 L490 185" stroke="#64748b" stroke-width="3"/>
    <rect x="25" y="185" width="290" height="150" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="170" y="207" fill="#7f1d1d">نعم: طارئ</text>
    <text x="170" y="232" font-size="12" fill="#450a0a" font-weight="600">نيّم المريض ورجليه مرفوعة</text>
    <text x="170" y="252" font-size="12" fill="#450a0a" font-weight="600">بلّغ + أكسجين + خط وريدي كبير</text>
    <text x="170" y="272" font-size="12" fill="#450a0a" font-weight="600">Saline infusion بأمر الطبيب</text>
    <text x="170" y="292" font-size="12" fill="#450a0a" font-weight="600">Dexa / Solucortif حسب الأمر</text>
    <text x="170" y="312" font-size="12" fill="#450a0a" font-weight="600">مراقبة بول ونبض وضغط متكررة</text>
    <rect x="325" y="185" width="290" height="150" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="470" y="207" fill="#14532d">لا: هبوط خفيف أو مزمن</text>
    <text x="470" y="232" font-size="12" fill="#14532d" font-weight="600">قيس نايم ثم واقف</text>
    <text x="470" y="252" font-size="12" fill="#14532d" font-weight="600">سوائل وأملاح باعتدال</text>
    <text x="470" y="272" font-size="12" fill="#14532d" font-weight="600">Effortil نقط (10–15 في نص كوب)</text>
    <text x="470" y="292" font-size="12" fill="#14532d" font-weight="600">Astonin H لو شديد ومقاوم</text>
    <text x="470" y="312" font-size="12" fill="#14532d" font-weight="600">قيام ببطء + ابحث عن السبب</text>
    <rect x="25" y="347" width="590" height="40" rx="10" fill="#eff6ff" stroke="#3b82f6"/><text x="320" y="372" font-size="12" fill="#1e3a8a">الأسباب: أنيميا، نزيف/جفاف، هرمونات، موسعات أوعية، فشل قلب</text>
  </g>
</svg>
