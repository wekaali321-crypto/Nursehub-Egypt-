<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" direction="rtl" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="300" rx="14" fill="#f7fafc"/><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4a5568"/></marker></defs><text x="320" y="32" font-size="20" fill="#1a365d" font-weight="bold" text-anchor="middle">الشعيرة مقابل البردة</text><rect x="340" y="50" width="280" height="230" rx="10" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/><text x="480" y="80" font-size="18" fill="#c53030" font-weight="bold" text-anchor="middle">الشعيرة (Stye)</text><text x="480" y="112" font-size="15" fill="#1a202c" font-weight="normal" text-anchor="middle">مؤلمة وحمراء</text><text x="480" y="138" font-size="15" fill="#1a202c" font-weight="normal" text-anchor="middle">قريبة من جذور الرموش</text><text x="480" y="164" font-size="15" fill="#1a202c" font-weight="normal" text-anchor="middle">نقطة صديد في القمة</text><text x="480" y="190" font-size="15" fill="#1a202c" font-weight="normal" text-anchor="middle">تكبر بسرعة</text><text x="480" y="216" font-size="15" fill="#1a202c" font-weight="normal" text-anchor="middle">تخف في أسبوع</text><text x="480" y="250" font-size="15" fill="#744210" font-weight="bold" text-anchor="middle">كمادات دافئة + قطرة/مرهم</text><rect x="20" y="50" width="300" height="230" rx="10" fill="#ebf8ff" stroke="#2b6cb0" stroke-width="1.5"/><text x="170" y="80" font-size="18" fill="#2b6cb0" font-weight="bold" text-anchor="middle">البردة (Chalazion)</text><text x="170" y="112" font-size="15" fill="#1a202c" font-weight="normal" text-anchor="middle">كتلة صلبة</text><text x="170" y="138" font-size="15" fill="#1a202c" font-weight="normal" text-anchor="middle">بدون ألم غالباً</text><text x="170" y="164" font-size="15" fill="#1a202c" font-weight="normal" text-anchor="middle">بعيدة عن الرموش (داخل الجفن)</text><text x="170" y="190" font-size="15" fill="#