<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 348" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="348" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مراحل الفشل الكلوي الحاد الأربع</text><rect x="20" y="54" width="600" height="53" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><circle cx="590" cy="76" r="14" fill="#2563eb"/><text x="590" y="81" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="566" y="80" text-anchor="end" font-size="15" font-weight="800" fill="#1e3a8a">بداية الإصابة</text><text x="566" y="100" text-anchor="end" font-size="13" fill="#1e3a8a">تبدأ الإصابة الكلوية.</text><text x="320" y="123" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="129" width="600" height="53" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><circle cx="590" cy="151" r="14" fill="#2563eb"/><text x="590" y="156" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="566" y="155" text-anchor="end" font-size="15" font-weight="800" fill="#1e3a8a">مرحلة قلة البول Oliguric</text><text x="566" y="175" text-anchor="end" font-size="13" fill="#1e3a8a">أقل من 400 mL/24 ساعة، بول مركز ولزج.</text><text x="320" y="198" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="204" width="600" height="53" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><circle cx="590" cy="226" r="14" fill="#2563eb"/><text x="590" y="231" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="566" y="230" text-anchor="end" font-size="15" font-weight="800" fill="#1e3a8a">مرحلة الإدرار Diuresis</text><text x="566" y="250" text-anchor="end" font-size="13" fill="#1e3a8a">بيلة غزيرة 3–6 لتر/يوم (Polyuric)، خطر جفاف وفقد كهارل.</text><text x="320" y="273" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="279" width="600" height="53" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><circle cx="590" cy="301" r="14" fill="#2563eb"/><text x="590" y="306" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="566" y="305" text-anchor="end" font-size="15" font-weight="800" fill="#1e3a8a">مرحلة التعافي Recovery</text><text x="566" y="325" text-anchor="end" font-size="13" fill="#1e3a8a">بطيئة وقد تصل إلى سنة.</text></svg>