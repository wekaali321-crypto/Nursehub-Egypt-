<text x="171" y="352" text-anchor="middle" font-size="12.5" font-weight="600" fill="#64748b">الخطوط موازية للأضلاع (الشكل المائل للأسفل)</text>
<rect x="334" y="52" width="280" height="100" rx="12" fill="#fff1f2" stroke="#be123c" stroke-width="1.8"/>
<text x="474.0" y="76" text-anchor="middle" font-size="15" font-weight="800" fill="#be123c">1) بقعة الإنذار (Herald)</text>
<text x="474.0" y="98" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">بيضاوية 2–5 سم، وردية</text>
<text x="474.0" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">فيها قشرة رفيعة على الحافة</text>
<text x="474.0" y="136" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">غالباً على البطن أو الظهر</text>
<line x1="474" y1="154" x2="474" y2="172" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="334" y="174" width="280" height="100" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8"/>
<text x="474.0" y="198" text-anchor="middle" font-size="15" font-weight="800" fill="#ea580c">2) بعد 1–2 أسبوع</text>
<text x="474.0" y="220" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">بقع أصغر على الجذع والأطراف</text>
<text x="474.0" y="239" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">توزيع «شجرة كريسماس»</text>
<text x="474.0" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">حكة خفيفة أحياناً</text>
<line x1="474" y1="276" x2="474" y2="294" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="334" y="296" width="280" height="66" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
<text x="474.0" y="320" text-anchor="middle" font-size="15" font-weight="800" fill="#16a34a">3) تختفي لوحدها</text>
<text x="474.0" y="342" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">خلال 6–8 أسابيع (وقد تصل 3 شهور)</text>
