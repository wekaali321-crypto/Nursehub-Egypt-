<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 252" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="252" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قصور الدرقية: حالات الطوارئ والتمريض</text>
<rect x="346.0" y="52" width="320.0" height="172.75" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="346.0" y="52" width="320.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="506.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">أولويات غيبوبة الوذمة</text>
<text x="656.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• انخفاض شديد في التنفس فيحدث فشل تنفسي</text>
<text x="656.0" y="115.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ضع طقم فغر القصبة بجانب السرير وجهّز التنبيب</text>
<text x="656.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الرغامي</text>
<text x="656.0" y="151.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• هبوط ضغط وبطء نبض (&lt;60) وانخفاض حرارة (عدم</text>
<text x="656.0" y="169.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">تحمل برد) فلا بطانيات كهربائية</text>
<text x="656.0" y="188.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• استمر في ليفوثيروكسين</text>
<rect x="14.0" y="52" width="320.0" height="172.75" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="14.0" y="52" width="320.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="174.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">أعراض متوقعة</text>
<text x="324.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• خمول وضعف وزيادة وزن ووذمة (حول العين)</text>
<text x="324.0" y="115.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• إمساك لا إسهال</text>
<text x="324.0" y="134.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تساقط شعر لا شعرانية</text>
<text x="324.0" y="153.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• نسيان واكتئاب وقلة رغبة وعقم</text>
<text x="324.0" y="173.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• جلد جاف</text>
<text x="324.0" y="192.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• دورة غائبة (Amenorrhea) أو غزيرة</text>
<text x="324.0" y="209.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">(Hypermenorrhea)</text>
</svg>
