<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="372" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التلف الخلوي: النخر والغرغرينا والتبرمج</text>
<rect x="14" y="44" width="300" height="170" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="14" y="44" width="300" height="26" rx="10" fill="#dc2626"/><text x="164.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >نخر Necrosis</text><text x="304" y="89" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >موت خلايا من إصابة أو نقص أكسجين (إقفار)</text><text x="304" y="110" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >مثال: احتشاء عضلة القلب</text><text x="304" y="131" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >يسمى النسيج الميت: Necrotic tissue</text><rect x="326" y="44" width="300" height="170" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="326" y="44" width="300" height="26" rx="10" fill="#dc2626"/><text x="476" y="62" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >أنواع النخر</text><text x="616" y="95" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >سائل (Liquefaction): النسيج يلين مثل عجينة، مثال: خراج</text><text x="616" y="125" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >متجبن (Coagulative): إقفار/احتشاء، مثال: الجلطة القلبية</text><text x="616" y="155" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >جبني (Caseous): شكل جبن، محاط بالتهاب حبيبي، مثال: السل</text><rect x="14" y="226" width="300" height="130" rx="10" fill="#fff" stroke="#7f1d1d" stroke-width="1.5"/><rect x="14" y="226" width="300" height="26" rx="10" fill="#7f1d1d"/><text x="164.0" y="244" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >غرغرينا Gangrene</text><text x="304" y="271" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >موت نسيج بسبب عدوى أو انقطاع دم</text><text x="304" y="292" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >مثال: القدم السكري والأصابع</text><rect x="326" y="226" width="300" height="130" rx="10" fill="#fff" stroke="#475569" stroke-width="1.5"/><rect x="326" y="226" width="300" height="26" rx="10" fill="#475569"/><text x="476.0" y="244" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >موت الخلايا المبرمج Apoptosis</text><text x="616" y="271" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >انتحار خلوي طبيعي أثناء النمو</text><text x="616" y="292" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a" >مثال: انفصال أصابع الجنين</text>
</svg>
