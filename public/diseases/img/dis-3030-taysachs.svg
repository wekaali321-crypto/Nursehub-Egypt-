<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="320" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مرض تاي-ساكس (Tay-Sachs)</text><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#475569"/></marker></defs><rect x="430" y="50" width="190" height="90" rx="10" fill="#6366f1"/><text x="525.0" y="72.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الآلية</text><text x="525.0" y="89.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">غياب إنزيم هيكسوزامينيداز</text><text x="525.0" y="106.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">تراكم الدهون وتلف خلايا الدماغ والحبل الشوكي</text><text x="525.0" y="123.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">يظهر حوالي 6 أشهر</text><rect x="225" y="50" width="190" height="90" rx="10" fill="#ef4444"/><text x="320.0" y="72.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلامات</text><text x="320.0" y="89.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">فقد المهارات الحركية: التقلب والزحف والجلوس</text><text x="320.0" y="106.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">نوبات · فقد البصر والسمع</text><text x="320.0" y="123.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">بقعة «كرزية حمراء» بالعين</text><rect x="20" y="50" width="190" height="90" rx="10" fill="#0ea5e9"/><text x="115.0" y="80.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التشخيص</text><text x="115.0" y="98.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تحليل دم لمستوى</text><text x="115.0" y="116.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">إنزيم الهيكسوزامينيداز</text><line x1="425" y1="95" x2="415" y2="