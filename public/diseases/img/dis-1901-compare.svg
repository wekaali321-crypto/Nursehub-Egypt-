<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 282" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="282" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ورم الأرومة العصبية مقابل ورم ويلمز</text><rect x="325" y="48" width="295" height="192" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Neuroblastoma — الأرومة العصبية</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">أصله: خلايا عصبية غير ناضجة (عمود</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">فقري/الغدة الكظرية)</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">الكتلة بالبطن مع ألم وتورم</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">انتشار مبكر: نخاع عظم وكبد وعقد</text><text x="610" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">عظام: ألم وكسور وقلة كرات حمراء</text><text x="610" y="200" text-anchor="start" font-size="12.5" fill="#1e293b">حول العين: كدمات وجحوظ</text><text x="610" y="220" text-anchor="start" font-size="12.5" fill="#1e293b">كاتيكولامينات في البول والدم</text><rect x="20" y="48" width="295" height="192" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Wilms — الأرومة الكلوية</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">أصله: خلايا كلوية لم تكتمل نضجها</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">كتلة بطنية في جانب واحد فقط</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">حمى وتعب ودم في البول</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">الأهم: ممنوع جس البطن</text><text x="305" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">العلاج: استئصال كلية ثم كيماوي ± إشعاع</text><text x="320" y="264" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">الفرق الأشهر: ويلمز في جانب واحد من البطن</text>
</svg>
