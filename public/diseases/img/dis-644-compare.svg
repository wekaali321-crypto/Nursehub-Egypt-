<rect x="326" y="46" width="294" height="110" rx="12" fill="#dbeafe" stroke="#3b82f6"/><rect x="326" y="46" width="294" height="28" rx="12" fill="#3b82f6"/><text x="473" y="65" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">انتفاخ (Pink puffer)</text><text x="612" y="94" text-anchor="start" font-size="12" fill="#1e3a8a">• تدمير حويصلات</text><text x="612" y="111" text-anchor="start" font-size="12" fill="#1e3a8a">• نحيف وصدر برميلي</text><text x="612" y="128" text-anchor="start" font-size="12" fill="#1e3a8a">• ضيق نفس واضح</text><text x="612" y="145" text-anchor="start" font-size="12" fill="#1e3a8a">• سعال قليل</text><rect x="20" y="46" width="294" height="110" rx="12" fill="#dcfce7" stroke="#16a34a"/><rect x="20" y="46" width="294" height="28" rx="12" fill="#16a34a"/><text x="167" y="65" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">التهاب مزمن (Blue bloater)</text><text x="306" y="94" text-anchor="start" font-size="12" fill="#14532d">• مخاط زائد</text><text x="306" y="111" text-anchor="start" font-size="12" fill="#14532d">• سعال منتج 3 شهور / سنتين</text><text x="306" y="128" text-anchor="start" font-size="12" fill="#14532d">• زرقة ووذمة</text><text x="306" y="145" text-anchor="start" font-size="12" fill="#14532d">• قلب رئوي</text><text x="320" y="184" text-anchor="middle" font-size="12" fill="#475569">الاتنين = COPD والتدخين السبب الأول</text>
