<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 208" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="208" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">استئصال الرحم: الدواعي والرعاية</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="140" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الدواعي</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• سرطان الرحم</text><text x="612" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• الانتباذ البطاني</text><text x="612" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• التهاب الحوض (PID)</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="140" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">ما بعد العملية</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• منع الانخماص</text><text x="408.66666666666663" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">(atelectasis): TCDB —</text><text x="408.66666666666663" y="135.4" text-anchor="start" font-size="13" fill="#0f172a">سعال وتنفس عميق ومقياس</text><text x="408.66666666666663" y="153.6" text-anchor="start" font-size="13" fill="#0f172a">تنفس حافز كل ساعة</text><text x="408.66666666666663" y="176.8" text-anchor="start" font-size="13" fill="#0f172a">• المضاعفة الأولى: النزف</text><rect x="20" y="54" width="193.33333333333334" height="140" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#f59e0b"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">النزف المهبلي</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• فوطة مشبعة تُغيَّر:</text><text x="205.33333333333334" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">أكثر من واحدة خلال ساعة</text><text x="205.33333333333334" y="135.4" text-anchor="start" font-size="13" fill="#0f172a">= أبلغ</text></svg>
