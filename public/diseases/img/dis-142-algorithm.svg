<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="350" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >VT: ابدأ من النبض والاستقرار</text><rect x="180" y="44" width="280" height="44" rx="12" fill="#1e293b"/><text x="320" y="72" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff" >تسرع بطيني على المونيتور — جس النبض!</text><rect x="20" y="120" width="190" height="140" rx="12" fill="#fee2e2" stroke="#7f1d1d" stroke-width="1.5"/><text x="115.0" y="142" text-anchor="middle" font-size="13.5" font-weight="800" fill="#7f1d1d" >لا يوجد نبض</text><text x="115.0" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >ابدأ إنعاش قلبي رئوي</text><text x="115.0" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >صدمة (Defibrillation) غير متزامنة</text><text x="115.0" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >إبينفرين 1 مجم كل 3–5 د</text><text x="115.0" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >أميودارون 300 ثم 150 مجم</text><rect x="225" y="120" width="190" height="140" rx="12" fill="#ffedd5" stroke="#b91c1c" stroke-width="1.5"/><text x="320.0" y="142" text-anchor="middle" font-size="13.5" font-weight="800" fill="#b91c1c" >نبض لكن غير مستقر</text><text x="320.0" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >هبوط ضغط/ألم صدر/وذمة/وعي</text><text x="320.0" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >صدمة متزامنة فوراً</text><text x="320.0" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >تخدير لو واعي</text><text x="320.0" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >ثم لِيدوكايين/أميودارون</text><rect x="430" y="120" width="190" height="140" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="525.0" y="142" text-anchor="middle" font-size="13.5" font-weight="800" fill="#166534" >نبض ومستقر</text><text x="525.0" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >ECG كامل + خط وريدي</text><text x="525.0" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >أميودارون 150 مجم/10 د</text><text x="525.0" y="204" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >أو لِيدوكايين (بديل)</text><text x="525.0" y="224" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a" >تصحيح K/Mg</text><line x1="260" y1="88" x2="115" y2="120" stroke="#475569" stroke-width="2"/><line x1="320" y1="88" x2="320" y2="120" stroke="#475569" stroke-width="2"/><line x1="380" y1="88" x2="525" y2="120" stroke="#475569" stroke-width="2"/><rect x="60" y="280" width="520" height="56" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="320" y="304" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a" >بعد الاستقرار: صيانة (أميودارون / Concor) + علاج السبب + تقييم ICD أو الكي</text><text x="320" y="324" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b" >اعرف توقيت آخر دواء وسجّل كل صدمة (الطاقة والنتيجة)</text>
</svg>
