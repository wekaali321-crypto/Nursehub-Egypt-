<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 334" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="334" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تنظير القصبات الهوائية (Bronchoscopy)</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="181.4" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#0ea5e9"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">لماذا يُجرى؟</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• خزعة نسيج (مثل الشك</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">بسرطان)</text><text x="612" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• غسل رئوي (Lavage)</text><text x="612" y="163.6" text-anchor="start" font-size="13" fill="#0f172a">• شفط بلغم عميق أو جسم</text><text x="612" y="181.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">غريب</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="181.4" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#f59e0b"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">قبل الإجراء</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• تهدئة خفيفة (تُبطئ</text><text x="408.66666666666663" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">العلامات الحيوية)</text><text x="408.66666666666663" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• مخدر موضعي كـlidocaine</text><text x="408.66666666666663" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">على الحلق لمنع منعكس</text><text x="408.66666666666663" y="176.8" text-anchor="start" font-size="13" fill="#0f172a">التهوّع</text><rect x="20" y="54" width="193.33333333333334" height="181.4" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">بعد الإجراء</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• NPO حتى يستيقظ ويعود</text><text x="205.33333333333334" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">منعكس التهوّع</text><text x="205.33333333333334" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• متوقع: بطء تنفس</text><text x="205.33333333333334" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">وانخفاض أكسجة خفيف مؤقت</text><text x="205.33333333333334" y="176.8" text-anchor="start" font-size="13" fill="#0f172a">(تهدئة)</text><text x="205.33333333333334" y="200" text-anchor="start" font-size="13" fill="#0f172a">• متوقع: غياب منعكس</text><text x="205.33333333333334" y="218.2" text-anchor="start" font-size="13" fill="#0f172a">التهوّع (التخدير)</text><rect x="20" y="245.4" width="600" height="74" rx="10" fill="#ef4444" fill-opacity="0.13" stroke="#ef4444" stroke-width="1.5"/><text x="610" y="265.4" text-anchor="start" font-size="13.5" font-weight="800" fill="#ef4444">أولوية</text><text x="610" y="285.4" text-anchor="start" font-size="13" fill="#0f172a">أبلغ فورًا: تشنج الحنجرة (صرير) وزيادة ضيق النفس، أو بصاق مدمّم أحمر قانٍ</text><text x="610" y="304.4" text-anchor="start" font-size="13" fill="#0f172a">(hemoptysis).</text></svg>
