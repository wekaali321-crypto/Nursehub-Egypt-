<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="260" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">النخالة البيضاء مقابل النخالة الوردية</text>
<g font-size="13" text-anchor="middle">
<rect x="20" y="50" width="295" height="190" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="167" y="75" font-size="16" font-weight="800" fill="#0369a1">Pityriasis alba — البيضاء</text>
<text x="167" y="105" fill="#334155">بقعة فاتحة جافة على وجه الأطفال (50%)</text>
<text x="167" y="130" fill="#334155">وأحياناً الرقبة والذراع (30%)</text>
<text x="167" y="155" fill="#334155">تحليل براز + CBC + حديد/فيتامينات</text>
<text x="167" y="180" fill="#334155">كورتيزون خفيف + تجنب الشمس</text>
<text x="167" y="215" fill="#64748b">تروح لوحدها في شهور</text>
<rect x="325" y="50" width="295" height="190" rx="12" fill="#fff" stroke="#cbd5e1"/>
<text x="472" y="75" font-size="16" font-weight="800" fill="#be123c">Pityriasis rosea — الوردية</text>
<text x="472" y="105" fill="#334155">بقع بيضاوية (Herald) على البطن والظهر</text>
<text x="472" y="130" fill="#334155">غالباً بعد نزلة برد ± هرش</text>
<text x="472" y="155" fill="#334155">تبعد عن المهيّجات + كورتيزون قوي موضعي</text>
<text x="472" y="180" fill="#334155">± مضاد هيستامين ± Erythromycin</text>
<text x="472" y="215" fill="#64748b">بتخف لوحدها لكن ممكن تتكرر</text></g></svg>