<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 395" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="395" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">خطوات غسيل الأذن (Ear Wash)</text>
  <rect x="60" y="48" width="520" height="38" rx="10" fill="#dbeafe"/>
  <text x="320" y="71.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">١) قطرة مليّنة للشمع ٣ أيام (Remowax)</text>
  <rect x="60" y="94" width="520" height="38" rx="10" fill="#e0f2fe"/>
  <text x="320" y="117.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">٢) ماء دافئ (بدرجة حرارة الجسم) في السرنجة</text>
  <rect x="60" y="140" width="520" height="38" rx="10" fill="#dbeafe"/>
  <text x="320" y="163.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">٣) الطبق الكلوي تحت الأذن لتجميع الماء</text>
  <rect x="60" y="186" width="520" height="38" rx="10" fill="#e0f2fe"/>
  <text x="320" y="209.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">٤) شد الصيوان لأعلى وللخلف وإدخال سن السرنجة بلطف</text>
  <rect x="60" y="232" width="520" height="38" rx="10" fill="#dbeafe"/>
  <text x="320" y="255.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">٥) حقن الماء ببطء على جدار القناة (مش على الطبلة)</text>
  <rect x="60" y="278" width="520" height="38" rx="10" fill="#e0f2fe"/>
  <text x="320" y="301.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">٦) كرر ٣–٤ مرات كحد أقصى، ثم قطرة بعد الغسيل (Dexatrol)</text>
  <rect x="60" y="330" width="520" height="40" rx="10" fill="#fee2e2"/>
  <text x="320" y="354.55" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">ممنوع: ثقب بالطبلة، التهاب أذن خارجية، فطريات، جسم غريب نباتي</text>
  <text x="320" y="381" text-anchor="middle" font-size="12" fill="#64748b">ما تغسلش من غير ما تتأكد إن الطبلة سليمة</text>
</svg>
