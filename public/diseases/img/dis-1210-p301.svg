<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 558" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="558" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">متلازمة الإغراق وجراحات المعدة</text>
<rect x="346.0" y="52" width="320.0" height="184.0" rx="10" fill="#0e7490" fill-opacity="0.1" stroke="#0e7490" stroke-width="1.2"/>
<rect x="346.0" y="52" width="320.0" height="26" rx="10" fill="#0e7490" fill-opacity="1" stroke="#0e7490" stroke-width="1.2"/>
<text x="506.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الآلية</text>
<text x="656.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تفرغ المعدة بسرعة كبيرة في الاثني عشر بعد</text>
<text x="656.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الأكل، فينتقل سائل بكثرة (Fluid shift)</text>
<text x="656.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• يحدث ألم شديد وهبوط ضغط وغثيان وقيء بعد نحو</text>
<text x="656.0" y="149.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">30 دقيقة من الأكل</text>
<text x="656.0" y="169.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• يُرى بعد أي جراحة بدانة أو استئصال معدة:</text>
<text x="656.0" y="186.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">تحويل المعدة (Bypass)، استئصال المعدة جزئياً</text>
<text x="656.0" y="203.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">أو كمياً، تكميم المعدة، وفغر المعدة الصائمي</text>
<text x="656.0" y="220.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">(Billroth II)</text>
<rect x="14.0" y="52" width="320.0" height="184.0" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="14.0" y="52" width="320.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="174.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">العلامات والإجراء الأول</text>
<text x="324.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• هبوط ضغط وتسارع قلب (&gt;100)، تعرق ودوخة، ألم</text>
<text x="324.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">بطن شديد وغثيان وقيء بعد 30 دقيقة من الأكل</text>
<text x="324.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أبلغ الطبيب/الجراح فوراً</text>
<text x="324.0" y="151.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• سؤال: بعد استئصال معدة جزئي، قيء وألم شديد</text>
<text x="324.0" y="169.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">وضغط 105/62 ونبض 122 وحرارة 100.5ف → أبلغ</text>
<text x="324.0" y="186.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الطبيب فوراً (شبهة تسرب/التهاب)</text>
<rect x="346.0" y="248.0" width="320.0" height="117.0" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="346.0" y="248.0" width="320.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="506.0" y="266.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">رعاية ما بعد استئصال المعدة</text>
<text x="656.0" y="292.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• صيام حتى عودة أصوات الأمعاء</text>
<text x="656.0" y="311.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• جهاز ضغط متقطع SCD، مشي مبكر، مقياس التنفس</text>
<text x="656.0" y="330.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ثبّت الجرح بيدك (Splinting) عند السعال</text>
<rect x="14.0" y="248.0" width="320.0" height="117.0" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="14.0" y="248.0" width="320.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="174.0" y="266.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">تفكك الجرح أو بروز الأحشاء (Evisceration)</text>
<text x="324.0" y="292.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ابقَ مع المريض واستدعِ المساعدة</text>
<text x="324.0" y="311.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• وضع فاولر منخفض مع ثني الركبتين</text>
<text x="324.0" y="330.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• غطِّ بشاش معقم مبلل بمحلول ملحي</text>
<text x="324.0" y="349.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أبلغ الجراح (حالة طارئة ولا تترك المريض)</text>
<rect x="346.0" y="377.0" width="320.0" height="153.5" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="346.0" y="377.0" width="320.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="506.0" y="395.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">تثقيف 4 نقاط</text>
<text x="656.0" y="421.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• بروتين وألياف ودهون عالية وكربوهيدرات قليلة</text>
<text x="656.0" y="440.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• وجبات صغيرة متكررة (6 وجبات صغيرة)</text>
<text x="656.0" y="459.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• استلق بعد الأكل على الجانب الأيسر</text>
<text x="656.0" y="478.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا سوائل مع الوجبات (قبلها أو بعدها بـ30</text>
<text x="656.0" y="496.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">دقيقة)</text>
<text x="656.0" y="515.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تابع فيتامين B12 بعد استئصال المعدة الجزئي</text>
</svg>
