<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="400" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">القوباء (Impetigo) مقابل الإكثيما (Ecthyma)</text><rect x="330" y="50" width="290" height="100" rx="10" fill="#f59e0b"/><text x="475.0" y="67.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">القوباء</text><text x="475.0" y="85.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">عدوى جلدية شديدة العدوى (رضّع وأطفال)</text><text x="475.0" y="103.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">بكتيريا عقدية (Strep) أو عنقودية (Staph)</text><text x="475.0" y="121.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">قروح حمراء حاكّة حول الأنف والفم</text><text x="475.0" y="139.0" text-anchor="middle" font-size="12" font-weight="500" fill="#422006">تتجفف إلى قشرة بلون العسل = أشد عدوى</text><rect x="20" y="50" width="300" height="100" rx="10" fill="#b91c1c"/><text x="170.0" y="76.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الإكثيما (Ecthyma)</text><text x="170.0" y="94.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">شكل أعمق وأخطر</text><text x="170.0" y="112.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">يخترق الجلد لطبقات أعمق</text><text x="170.0" y="130.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">قروح مؤلمة تتحول إلى تقرحات عميقة</text><rect x="20" y="170" width="600" height="52" rx="10" fill="#7c3aed"/><text x="320.0" y="190.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المضاعفة المهمة</text><text x="320.0" y="209.0" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">العدوى العقدية قد تنزل للكلى ← التهاب كبيبات الكلى (Glomerulonephritis)</text><rect x="20" y="238" width="195" height="62" rx="10" fill="#16a34a"/><text x="117.5" y="263.0" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">منع المدرسة/الحضانة</text><text x="117.5" y="280.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">حتى انتهاء العدوى</text><rect x="225" y="238" width="195" height="62" rx="10" fill="#16a34a"/><text x="322.5" y="263.0" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">غسل الأيدي</text><text x="322.5" y="280.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">قبل وبعد لمس المنطقة</text><rect x="430" y="238" width="195" height="62" rx="10" fill="#16a34a"/><text x="527.5" y="263.0" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">عزل الملابس والمناشف</text><text x="527.5" y="280.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">وغسلها بماء ساخن</text><rect x="20" y="310" width="195" height="62" rx="10" fill="#16a34a"/><text x="117.5" y="335.0" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">أظافر قصيرة مبرودة</text><text x="117.5" y="352.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">تقلل الخدش</text><rect x="225" y="310" width="195" height="62" rx="10" fill="#16a34a"/><text x="322.5" y="335.0" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">إزالة القشور</text><text x="322.5" y="352.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">بلطف</text><rect x="430" y="310" width="195" height="62" rx="10" fill="#16a34a"/><text x="527.5" y="335.0" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">إبلاغ الطبيب</text><text x="527.5" y="352.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">عند ظهور بول داكن/ورم</text></svg>