<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="640" height="440" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">الوصلة العصبية العضلية والأستيل كولين (ACh)</text>
<!-- nerve terminal -->
<path d="M60 60 Q60 50 80 50 L330 50 Q350 50 350 70 L350 130 Q350 160 320 165 L90 165 Q60 160 60 130 Z" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
<text x="205" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#78350f">نهاية العصب الحركي</text>
<g fill="#fff" stroke="#b45309" stroke-width="1.5"><circle cx="110" cy="115" r="14"/><circle cx="160" cy="125" r="14"/><circle cx="210" cy="115" r="14"/><circle cx="260" cy="125" r="14"/><circle cx="305" cy="115" r="14"/></g>
<g fill="#dc2626"><circle cx="106" cy="113" r="3"/><circle cx="114" cy="118" r="3"/><circle cx="156" cy="123" r="3"/><circle cx="165" cy="128" r="3"/><circle cx="206" cy="113" r="3"/><circle cx="214" cy="118" r="3"/><circle cx="256" cy="123" r="3"/><circle cx="265" cy="128" r="3"/></g>
<text x="205" y="153" text-anchor="middle" font-size="12" fill="#78350f">حويصلات تحمل ACh</text>
<!-- cleft -->
<rect x="60" y="165" width="290" height="50" fill="#e0f2fe"/>
<text x="205" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#075985">الشق المشبكي</text>
<g fill="#dc2626"><circle cx="110" cy="182" r="4"/><circle cx="160" cy="205" r="4"/><circle cx="225" cy="180" r="4"/><circle cx="290" cy="205" r="4"/></g>
<g stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#ar)"><path d="M110 168 L110 208"/><path d="M225 168 L225 208"/></g>
<!-- muscle membrane -->
<rect x="60" y="215" width="290" height="20" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
<g fill="#15803d" stroke="#166534"><path d="M100 214 l14 0 l-7 12 z"/><path d="M218 214 l14 0 l-7 12 z"/><path d="M280 214 l14 0 l-7 12 z"/></g>

<rect x="60" y="235" width="290" height="70" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="205" y="258" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7f1d1d">غشاء العضلة + مستقبلات ACh (مثلثات خضراء)</text><text x="205" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="#7f1d1d">الليفة العضلية: انقباض</text>
<!-- AChE note -->
<rect x="60" y="318" width="290" height="46" rx="10" fill="#dcfce7" stroke="#166534"/>
<text x="205" y="338" text-anchor="middle" font-size="12.5" fill="#14532d">إنزيم AChE يفكك ACh بسرعة بعد التأثير</text>
<text x="205" y="355" text-anchor="middle" font-size="12.5" fill="#14532d">مثبطاته (الكولينيات غير المباشرة) تُبقي ACh أطول</text>
<!-- ACh structure -->
<rect x="380" y="50" width="240" height="190" rx="12" fill="#fff" stroke="#94a3b8"/>
<text x="500" y="72" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">بنية الأستيل كولين (مبسّطة)</text>
<g direction="ltr" font-family="Arial, sans-serif" font-size="15" fill="#0f172a" text-anchor="middle">
<text x="395" y="185">H₃C</text><text x="428" y="159">C</text><text x="428" y="115">O</text><text x="462" y="185">O</text><text x="497" y="159">CH₂</text><text x="531" y="185">CH₂</text><text x="570" y="159">N⁺</text><text x="570" y="117">CH₃</text><text x="610" y="185">CH₃</text><text x="570" y="212">CH₃</text></g>
<g stroke="#0f172a" stroke-width="1.6" fill="none"><path d="M409 175 L421 163"/><path d="M425 145 L425 124"/><path d="M431 145 L431 124"/><path d="M436 160 L454 174"/><path d="M470 174 L487 162"/><path d="M509 162 L524 174"/><path d="M539 174 L558 162"/><path d="M570 146 L570 124"/><path d="M579 162 L596 176"/><path d="M570 166 L570 198"/></g>
<text x="500" y="228" text-anchor="middle" font-size="11.5" fill="#475569">مجموعة أستيل + كولين مع نيتروجين موجب</text>
<!-- drug effects box -->
<rect x="380" y="256" width="240" height="116" rx="12" fill="#fef3c7" stroke="#b45309"/>
<text x="500" y="278" text-anchor="middle" font-size="13.5" font-weight="700" fill="#78350f">أثر الدواء على الوصلة</text>
<text x="500" y="300" text-anchor="middle" font-size="12.5" fill="#78350f">مباشر: يقلّد ACh (bethanechol)</text>
<text x="500" y="320" text-anchor="middle" font-size="12.5" fill="#78350f">غير مباشر: يثبط AChE (ambenonium)</text>
<text x="500" y="340" text-anchor="middle" font-size="12.5" fill="#78350f">الجرعة الزائدة: أزمة كولينية</text>
<text x="500" y="362" text-anchor="middle" font-size="12.5" fill="#78350f">الترياق: atropine</text>
<text x="320" y="410" text-anchor="middle" font-size="12" fill="#64748b">رسم تعليمي مبسّط وليس بمقياس حقيقي</text>
</svg>
