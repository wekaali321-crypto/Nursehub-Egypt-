<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="450" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">دورة الدودة الشريطية (Taenia)</text>
<rect x="340" y="50" width="270" height="96" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="2.5"/><circle cx="592" cy="68" r="12" fill="#0ea5e9"/><text x="592" y="73" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="572" y="73" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">براز المصاب</text><text x="596" y="96" text-anchor="start" font-size="12.5" fill="#334155">قطع ناضجة (Proglottids) وبيض</text><text x="596" y="114" text-anchor="start" font-size="12.5" fill="#334155">تخرج مع البراز أو من الشرج</text><text x="320" y="104" text-anchor="middle" font-size="22" fill="#64748b">←</text>
<rect x="30" y="50" width="270" height="96" rx="12" fill="#fff" stroke="#22c55e" stroke-width="2.5"/><circle cx="282" cy="68" r="12" fill="#22c55e"/><text x="282" y="73" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="262" y="73" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">المضيف الوسيط</text><text x="286" y="96" text-anchor="start" font-size="12.5" fill="#334155">بقرة (T. saginata) أو خنزير (T. solium)</text><text x="286" y="114" text-anchor="start" font-size="12.5" fill="#334155">تبلع البيض مع العلف الملوث</text><text x="485" y="164" text-anchor="middle" font-size="18" fill="#64748b">↓</text>
<rect x="340" y="168" width="270" height="96" rx="12" fill="#fff" stroke="#eab308" stroke-width="2.5"/><circle cx="592" cy="186" r="12" fill="#eab308"/><text x="592" y="191" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="572" y="191" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">العضلات</text><text x="596" y="214" text-anchor="start" font-size="12.5" fill="#334155">البيض يفقس ويتحول لحويصلة</text><text x="596" y="232" text-anchor="start" font-size="12.5" fill="#334155">(Cysticercus) داخل لحم الحيوان</text><text x="320" y="222" text-anchor="middle" font-size="22" fill="#64748b">←</text>
<rect x="30" y="168" width="270" height="96" rx="12" fill="#fff" stroke="#f97316" stroke-width="2.5"/><circle cx="282" cy="186" r="12" fill="#f97316"/><text x="282" y="191" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="262" y="191" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">أكل اللحم</text><text x="286" y="214" text-anchor="start" font-size="12.5" fill="#334155">لحم نيء أو غير ناضج</text><text x="286" y="232" text-anchor="start" font-size="12.5" fill="#334155">الحويصلة تبلع مع اللحم</text><text x="485" y="282" text-anchor="middle" font-size="18" fill="#64748b">↓</text>
<rect x="340" y="286" width="270" height="96" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2.5"/><circle cx="592" cy="304" r="12" fill="#dc2626"/><text x="592" y="309" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">5</text><text x="572" y="309" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">الأمعاء الدقيقة</text><text x="596" y="332" text-anchor="start" font-size="12.5" fill="#334155">الرأس يلتصق ويكبر الجسم</text><text x="596" y="350" text-anchor="start" font-size="12.5" fill="#334155">دودة بطول عدة أمتار</text><text x="320" y="340" text-anchor="middle" font-size="22" fill="#64748b">←</text>
<rect x="30" y="286" width="270" height="96" rx="12" fill="#fff" stroke="#8b5cf6" stroke-width="2.5"/><circle cx="282" cy="304" r="12" fill="#8b5cf6"/><text x="282" y="309" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">6</text><text x="262" y="309" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">تحذير T. solium</text><text x="286" y="332" text-anchor="start" font-size="12.5" fill="#334155">بلع البيض نفسه (أيدي ملوثة)</text><text x="286" y="350" text-anchor="start" font-size="12.5" fill="#334155">← كيسة مذنبة في المخ والعضلات</text>
<text x="320" y="438" text-anchor="middle" font-size="12.5" fill="#475569">طبخ اللحم جيداً + نظافة اليدين + علاج المصاب</text></svg>