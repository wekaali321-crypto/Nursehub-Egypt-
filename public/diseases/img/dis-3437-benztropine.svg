<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" width="640" height="324" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="حاصرات الكولين (Anticholinergics): Benztropine وDiphenhydramine"><rect width="640" height="324" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">حاصرات الكولين (Anticholinergics): Benztropine وDiphenhydramine</text><rect x="326.0" y="46" width="302.0" height="116" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الآلية والاستعمال</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• تحجب الأسيتيل كولين بالجهاز العصبي</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   المركزي فتعزز الدوبامين</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• علاج مساعد لأعراض باركنسون وللاضطرابات</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">   خارج الهرمية (EPS) الناتجة عن الأدوية</text><rect x="12.0" y="46" width="302.0" height="134" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="12.0" y="60" width="302.0" height="14" fill="#a86a00"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">آثار</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• جفاف فم، تغيّش رؤية</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• دوخة، غثيان، عصبية</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• طفح، شرى</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• احتباس بول، عسر تبول</text><text x="302.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• تسرع قلب، ضعف، تشوش</text><rect x="326.0" y="174" width="302.0" height="116" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="326.0" y="174" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="326.0" y="188" width="302.0" height="14" fill="#b42318"/><text x="477.0" y="193" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">موانع</text><text x="616.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• الجلوكوما (زاوية مغلقة)</text><text x="616.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• انسداد البواب أو الاثني عشر</text><text x="616.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• قرحة معدة، تضخم بروستاتا، achalasia،</text><text x="616.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">   myasthenia gravis، megacolon</text><rect x="12.0" y="192" width="302.0" height="116" rx="10" fill="#efe9fb" stroke="#6a4bb5" stroke-width="1.2"/><rect x="12.0" y="192" width="302.0" height="28" rx="10" fill="#6a4bb5"/><rect x="12.0" y="206" width="302.0" height="14" fill="#6a4bb5"/><text x="163.0" y="211" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">تداخلات</text><text x="302.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• Amantadine: ↑ مضاد الكولين</text><text x="302.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• Digoxin: ↑ مستوى</text><text x="302.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">• Haloperidol: ↑ الذهان</text><text x="302.0" y="294" text-anchor="start" font-size="12.5" fill="#1d2939">• Phenothiazines: ↑ مضاد الكولين</text></svg>