<defs><marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#64748b"/></marker></defs><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a" >محور الكالسيوم و PTH: الطبيعي مقابل فرط الجار درقية</text><rect x="30" y="55" width="270" height="120" rx="12" fill="#16a34a"/><text x="165.0" y="91.05" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" >الوضع الطبيعي</text><text x="165.0" y="110.05" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >كالسيوم يعلى ← PTH يقل</text><text x="165.0" y="129.05" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >كالسيوم يقل ← PTH يزيد</text><text x="165.0" y="148.05" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >فوسفات مستقر</text><rect x="340" y="55" width="270" height="120" rx="12" fill="#dc2626"/><text x="475.0" y="91.05" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" >فرط الجار درقية الأولي</text><text x="475.0" y="110.05" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >PTH عالي (أو «طبيعي غير مناسب»)</text><text x="475.0" y="129.05" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >كالسيوم عالي</text><text x="475.0" y="148.05" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >فوسفات منخفض</text><rect x="30" y="195" width="580" height="40" rx="12" fill="#fde68a"/><text x="320.0" y="219.55" text-anchor="middle" font-size="13" font-weight="700" fill="#422006" >العظم يفقد كالسيوم + الكلى تطلّع كالسيوم وتخزّن حصوات + الأمعاء تمتص أكتر</text><text x="320" y="262" text-anchor="middle" font-size="12" font-weight="600" fill="#475569" >لو الكالسيوم عالي والـ PTH واطي أو مكبوت: دوّر على سبب تاني (ورم، فيتامين D زيادة…)</text>
