<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 382" width="640" height="382" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="البوتاسيوم والماغنسيوم: مكمّلات وأدوية"><rect width="640" height="382" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">البوتاسيوم والماغنسيوم: مكمّلات وأدوية</text><text x="320.0" y="54" text-anchor="middle" font-size="12.5" fill="#667085">دليل سريع</text><rect x="326.0" y="68" width="302.0" height="170" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="326.0" y="68" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="326.0" y="82" width="302.0" height="14" fill="#a86a00"/><text x="477.0" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">البوتاسيوم (K+)</text><text x="616.0" y="116" text-anchor="start" font-size="12.5" fill="#1d2939">• الاستعمال: نقص البوتاسيوم (أقل من 3.5)</text><text x="616.0" y="134" text-anchor="start" font-size="12.5" fill="#1d2939">• الطبيعي 3.5–5.0</text><text x="616.0" y="152" text-anchor="start" font-size="12.5" fill="#1d2939">• البوتاسيوم يضخ العضلات والقلب</text><text x="616.0" y="170" text-anchor="start" font-size="12.5" fill="#1d2939">• مدرّات تفقد K: furosemide و</text><text x="616.0" y="188" text-anchor="start" font-size="12.5" fill="#1d2939">   hydrochlorothiazide (-ide)</text><text x="616.0" y="206" text-anchor="start" font-size="12.5" fill="#1d2939">• مدرّات/أدوية تحفظ K: spironolactone</text><text x="616.0" y="224" text-anchor="start" font-size="12.5" fill="#1d2939">   وأدوية -sartan و-pril</text><rect x="12.0" y="68" width="302.0" height="116" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="12.0" y="68" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="12.0" y="82" width="302.0" height="14" fill="#b42318"/><text x="163.0" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">البوتاسيوم الوريدي</text><text x="302.0" y="116" text-anchor="start" font-size="12.5" fill="#1d2939">• أولًا: مراقبة قلب</text><text x="302.0" y="134" text-anchor="start" font-size="12.5" fill="#1d2939">• لا تدفعه IV push أبدًا: قد يقتل</text><text x="302.0" y="152" text-anchor="start" font-size="12.5" fill="#1d2939">• فقط 10–20 mEq/ساعة بمضخة</text><text x="302.0" y="170" text-anchor="start" font-size="12.5" fill="#1d2939">• إذا حرقت الذراع: أبطئ التسريب</text><rect x="12.0" y="196" width="302.0" height="116" rx="10" fill="#efe9fb" stroke="#6a4bb5" stroke-width="1.2"/><rect x="12.0" y="196" width="302.0" height="28" rx="10" fill="#6a4bb5"/><rect x="12.0" y="210" width="302.0" height="14" fill="#6a4bb5"/><text x="163.0" y="215" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">كبريتات المغنيسيوم</text><text x="302.0" y="244" text-anchor="start" font-size="12.5" fill="#1d2939">• الولادة المبكرة: تهدئ الانقباضات</text><text x="302.0" y="262" text-anchor="start" font-size="12.5" fill="#1d2939">• مضاد تشنج (تسمم الحمل)</text><text x="302.0" y="280" text-anchor="start" font-size="12.5" fill="#1d2939">• Torsades de Pointes</text><text x="302.0" y="298" text-anchor="start" font-size="12.5" fill="#1d2939">• نقص Mg (أقل من 1.5): تعويض</text><rect x="326.0" y="250" width="302.0" height="116" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="326.0" y="250" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="326.0" y="264" width="302.0" height="14" fill="#b42318"/><text x="477.0" y="269" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">علامات التسمم بالمغنيسيوم</text><text x="616.0" y="298" text-anchor="start" font-size="12.5" fill="#1d2939">• التنفس أقل من 12/دقيقة</text><text x="616.0" y="316" text-anchor="start" font-size="12.5" fill="#1d2939">• نقص منعكسات الأوتار (DTR)</text><text x="616.0" y="334" text-anchor="start" font-size="12.5" fill="#1d2939">• ثبّت الدواء وابلّغ فورًا</text><text x="616.0" y="352" text-anchor="start" font-size="12.5" fill="#1d2939">• المولود: ارتخاء عضلي وتثبيط تنفس</text></svg>