<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 508" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="508" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أصوات الرئة غير الطبيعية: المقارنة السريعة</text><rect x="20" y="54" width="600" height="26.799999999999997" fill="#14b8a6"/><text x="614" y="70.2" text-anchor="start" font-size="12" font-weight="700" fill="#fff">الصوت</text><text x="519.7142857142857" y="70.2" text-anchor="start" font-size="12" font-weight="700" fill="#fff">الوصف والمكان</text><text x="382.57142857142856" y="70.2" text-anchor="start" font-size="12" font-weight="700" fill="#fff">الآلية</text><text x="271.1428571428571" y="70.2" text-anchor="start" font-size="12" font-weight="700" fill="#fff">الأمراض</text><text x="142.57142857142853" y="70.2" text-anchor="start" font-size="12" font-weight="700" fill="#fff">العلاج</text><rect x="20" y="80.8" width="600" height="77.19999999999999" fill="#14b8a6" fill-opacity="0.07" stroke="#14b8a6" stroke-opacity="0.3"/><text x="614" y="97" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">صفير</text><text x="614" y="113.8" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">(Wheeze)</text><text x="519.7142857142857" y="97" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">عالٍ موسيقي؛ كل</text><text x="519.7142857142857" y="113.8" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">الرئة؛ في الزفير</text><text x="382.57142857142856" y="97" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">تضيق الشعب</text><text x="382.57142857142856" y="113.8" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">(تشنج)</text><text x="271.1428571428571" y="97" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">الربو وCOPD</text><text x="142.57142857142853" y="97" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">نوبة ربو:</text><text x="142.57142857142853" y="113.8" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">albuterol</text><text x="142.57142857142853" y="130.6" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">وipratropium</text><text x="142.57142857142853" y="147.39999999999998" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">وmethylprednisolone</text><rect x="20" y="158" width="600" height="77.19999999999999" fill="#fff" fill-opacity="1" stroke="#14b8a6" stroke-opacity="0.3"/><text x="614" y="174.2" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">صرير</text><text x="614" y="191" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">(Stridor)</text><text x="519.7142857142857" y="174.2" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">عالٍ خشن في</text><text x="519.7142857142857" y="191" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">الشهيق؛ منطقة</text><text x="519.7142857142857" y="207.79999999999998" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">الحلق</text><text x="382.57142857142856" y="174.2" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">انسداد الحنجرة</text><text x="382.57142857142856" y="191" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">أو القصبة —</text><text x="382.57142857142856" y="207.79999999999998" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">طارئ</text><text x="271.1428571428571" y="174.2" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">اختناق، التهاب</text><text x="271.1428571428571" y="191" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">لسان المزمار،</text><text x="271.1428571428571" y="207.79999999999998" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">خناق، بعد جراحة</text><text x="271.1428571428571" y="224.59999999999997" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">الغدة الدرقية</text><text x="142.57142857142853" y="174.2" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">تنبيب رغامي،</text><text x="142.57142857142853" y="191" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">جراحة</text><rect x="20" y="235.2" width="600" height="77.19999999999999" fill="#14b8a6" fill-opacity="0.07" stroke="#14b8a6" stroke-opacity="0.3"/><text x="614" y="251.39999999999998" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">خراخر</text><text x="614" y="268.2" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">دقيقة/خشنة</text><text x="614" y="285" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">(Crackles)</text><text x="519.7142857142857" y="251.39999999999998" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">فقاعات: دقيقة</text><text x="519.7142857142857" y="268.2" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">عالية، خشنة</text><text x="519.7142857142857" y="285" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">منخفضة؛ قواعد</text><text x="519.7142857142857" y="301.79999999999995" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">الرئتين</text><text x="382.57142857142856" y="251.39999999999998" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">فتح حويصلات</text><text x="382.57142857142856" y="268.2" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">ملتهبة/محتقنة</text><text x="271.1428571428571" y="251.39999999999998" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">وذمة رئوية (فشل</text><text x="271.1428571428571" y="268.2" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">قلب)، التهاب رئوي</text><text x="142.57142857142853" y="251.39999999999998" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">مدرات</text><text x="142.57142857142853" y="268.2" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">(furosemide)،</text><text x="142.57142857142853" y="285" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">مضاد حيوي</text><rect x="20" y="312.4" width="600" height="60.4" fill="#fff" fill-opacity="1" stroke="#14b8a6" stroke-opacity="0.3"/><text x="614" y="328.59999999999997" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">صفير غليظ</text><text x="614" y="345.4" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">(Rhonchi)</text><text x="519.7142857142857" y="328.59999999999997" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">منخفض كالشخير؛ في</text><text x="519.7142857142857" y="345.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">الشعب (لا</text><text x="519.7142857142857" y="362.19999999999993" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">الحويصلات)</text><text x="382.57142857142856" y="328.59999999999997" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">إفرازات</text><text x="382.57142857142856" y="345.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">مخاطية/انسداد</text><text x="271.1428571428571" y="328.59999999999997" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">التهاب شعب، COPD،</text><text x="271.1428571428571" y="345.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">التهاب رئوي، تليف</text><text x="271.1428571428571" y="362.19999999999993" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">كيسي</text><text x="142.57142857142853" y="328.59999999999997" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">قرع الصدر (سترة</text><text x="142.57142857142853" y="345.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">اهتزاز) وسوائل</text><text x="142.57142857142853" y="362.19999999999993" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">لتخفيف المخاط</text><rect x="20" y="372.79999999999995" width="600" height="60.4" fill="#14b8a6" fill-opacity="0.07" stroke="#14b8a6" stroke-opacity="0.3"/><text x="614" y="388.99999999999994" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">احتكاك الجنب</text><text x="519.7142857142857" y="388.99999999999994" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">منخفض جاف كحجرين؛</text><text x="519.7142857142857" y="405.79999999999995" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">مقدمة الصدر؛ شهيق</text><text x="519.7142857142857" y="422.5999999999999" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">وزفير</text><text x="382.57142857142856" y="388.99999999999994" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">التهاب الغشاء</text><text x="382.57142857142856" y="405.79999999999995" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">الجنبي</text><text x="271.1428571428571" y="388.99999999999994" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">تفاقم الالتهاب</text><text x="271.1428571428571" y="405.79999999999995" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">الرئوي</text><text x="142.57142857142853" y="388.99999999999994" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">TCDB، مقياس</text><text x="142.57142857142853" y="405.79999999999995" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">التنفس، مضاد حيوي</text><rect x="20" y="433.19999999999993" width="600" height="60.4" fill="#fff" fill-opacity="1" stroke="#14b8a6" stroke-opacity="0.3"/><text x="614" y="449.3999999999999" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">تنفس</text><text x="614" y="466.19999999999993" text-anchor="start" font-size="12" font-weight="700" fill="#0f172a">شاين-ستوكس</text><text x="519.7142857142857" y="449.3999999999999" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">نمط تنفس: ازدياد</text><text x="519.7142857142857" y="466.19999999999993" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">ثم نقص في المعدل</text><text x="519.7142857142857" y="482.9999999999999" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">مع توقف</text><text x="382.57142857142856" y="449.3999999999999" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">انقطاع نفس ثم</text><text x="382.57142857142856" y="466.19999999999993" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">فرط تهوية لطرد</text><text x="382.57142857142856" y="482.9999999999999" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">CO₂</text><text x="271.1428571428571" y="449.3999999999999" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">حالات خطيرة</text><text x="142.57142857142853" y="449.3999999999999" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">تنبيب وتهوية</text><text x="142.57142857142853" y="466.19999999999993" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">ميكانيكية</text></svg>
