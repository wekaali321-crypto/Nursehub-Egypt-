<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 378" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="378" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">سلامة الدارج</text><rect x="326.0" y="50" width="294.0" height="150" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><rect x="326.0" y="50" width="294.0" height="28" rx="10" fill="#b91c1c"/><text x="473.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الاختناق</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="start">• قطّع الطعام قطعاً صغيرة</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="start">• اجلس الطفل أثناء الأكل</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="start">• تجنب الأطعمة المستديرة</text><text x="610.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="start">• تجنب تحت 4: نقانق، جزر، تفاح، عنب،</text><text x="610.0" y="164" font-size="12.5" fill="#0f172a" text-anchor="start">زبدة فول سوداني، زبيب، مارشميلو، مكسرات</text><text x="610.0" y="181" font-size="12.5" fill="#0f172a" text-anchor="start">وبذور، فشار، كرفس، علكة، حلوى صلبة</text><rect x="20.0" y="50" width="294.0" height="150" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="20.0" y="50" width="294.0" height="28" rx="10" fill="#ea580c"/><text x="167.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الحروق والغرق</text><text x="304.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="start">• غطِّ مقابس الكهرباء</text><text x="304.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="start">• مقابض الأواني للداخل</text><text x="304.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="start">• واقٍ شمس SPF 15+ قبل الخروج ويُعاد كل</text><text x="304.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="start">2-3 ساعات</text><text x="304.0" y="164" font-size="12.5" fill="#0f172a" text-anchor="start">• لا تترك الطفل قرب الماء</text><rect x="326.0" y="212" width="294.0" height="150" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="326.0" y="212" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="473.0" y="20" dy="212" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">سرير الطفل</text><text x="610.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="start">• الرضيع على ظهره (SIDS)</text><text x="610.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="start">• لا ينام على بطنه دون مراقبة</text><text x="610.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="start">• لا نوم برضاعة زجاجة (نخر أسنان)</text><text x="610.0" y="309" font-size="12.5" fill="#0f172a" text-anchor="start">• أزل الألعاب المعلقة بعمر 4-5 أشهر</text><rect x="20.0" y="212" width="294.0" height="150" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="20.0" y="212" width="294.0" height="28" rx="10" fill="#7c3aed"/><text x="167.0" y="20" dy="212" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">مقعد السيارة</text><text x="304.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="start">• مواجه للخلف بالخلف بزاوية 45°</text><text x="304.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="start">• لا مقعد أمامي ولا وسائد تحته</text><text x="304.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="start">• في مراجع قديمة: حتى 30 رطلاً (13.6 كجم)</text><text x="304.0" y="309" font-size="12.5" fill="#0f172a" text-anchor="start">والأحدث حسب حد الشركة</text><text x="304.0" y="326" font-size="12.5" fill="#0f172a" text-anchor="start">• Booster 8-12 سنة وطول 4 أقدام 9 بوصات،</text><text x="304.0" y="343" font-size="12.5" fill="#0f172a" text-anchor="start">وزن 35-80 رطلاً</text></svg>