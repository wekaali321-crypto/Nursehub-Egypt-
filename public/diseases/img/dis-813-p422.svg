<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 403" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="403" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">سن اليأس: العلامات والعلاج الهرموني والتثقيف</text><rect x="20" y="54" width="600" height="74" rx="10" fill="#0ea5e9" fill-opacity="0.13" stroke="#0ea5e9" stroke-width="1.5"/><text x="610" y="74" text-anchor="start" font-size="13.5" font-weight="800" fill="#0ea5e9">الفيزيولوجيا</text><text x="610" y="94" text-anchor="start" font-size="13" fill="#0f172a">جزء طبيعي من الشيخوخة: بعد سن 50 يقل عمل المبيضين وينخفض الاستروجين، ويغيب</text><text x="610" y="113" text-anchor="start" font-size="13" fill="#0f172a">الطمث أكثر من 12 شهرًا (انقطاع الطمث).</text><rect x="426.66666666666663" y="138" width="193.33333333333334" height="251" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="426.66666666666663" y="138" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="612" y="156" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">العلامات</text><text x="612" y="183" text-anchor="start" font-size="13" fill="#0f172a">• هبّات ساخنة</text><text x="612" y="206.2" text-anchor="start" font-size="13" fill="#0f172a">• هشاشة عظام (قلة كثافة</text><text x="612" y="224.39999999999998" text-anchor="start" font-size="13" fill="#0f172a">العظام)</text><text x="612" y="247.6" text-anchor="start" font-size="13" fill="#0f172a">• فقد مرونة الجلد</text><text x="612" y="270.8" text-anchor="start" font-size="13" fill="#0f172a">• انقطاع الطمث أكثر من</text><text x="612" y="289" text-anchor="start" font-size="13" fill="#0f172a">12 شهرًا</text><text x="612" y="312.2" text-anchor="start" font-size="13" fill="#0f172a">• نزف/تنقيط بعد انقطاع</text><text x="612" y="330.4" text-anchor="start" font-size="13" fill="#0f172a">الطمث: أبلغ الطبيب</text><text x="612" y="353.59999999999997" text-anchor="start" font-size="13" fill="#0f172a">• زيادة وزن، مرض شرايين</text><text x="612" y="371.79999999999995" text-anchor="start" font-size="13" fill="#0f172a">قلبية، اكتئاب وقلق</text><rect x="223.33333333333331" y="138" width="193.33333333333334" height="251" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="223.33333333333331" y="138" width="193.33333333333334" height="29" rx="10" fill="#f59e0b"/><text x="408.66666666666663" y="156" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">العلاج الهرموني (HRT)</text><text x="408.66666666666663" y="183" text-anchor="start" font-size="13" fill="#0f172a">• استروجين + بروجسترون</text><text x="408.66666666666663" y="206.2" text-anchor="start" font-size="13" fill="#0f172a">• خطر الصمّات: جلطة ساق</text><text x="408.66666666666663" y="224.39999999999998" text-anchor="start" font-size="13" fill="#0f172a">DVT، احتشاء، صمة رئوية،</text><text x="408.66666666666663" y="242.6" text-anchor="start" font-size="13" fill="#0f172a">سكتة</text><text x="408.66666666666663" y="265.79999999999995" text-anchor="start" font-size="13" fill="#0f172a">• أوقف التدخين وراقب</text><text x="408.66666666666663" y="283.99999999999994" text-anchor="start" font-size="13" fill="#0f172a">تورم ساق واحدة</text><text x="408.66666666666663" y="307.19999999999993" text-anchor="start" font-size="13" fill="#0f172a">• علم المريضة: ألم</text><text x="408.66666666666663" y="325.3999999999999" text-anchor="start" font-size="13" fill="#0f172a">الساق، تنميل الذراع،</text><text x="408.66666666666663" y="343.5999999999999" text-anchor="start" font-size="13" fill="#0f172a">صداع شديد = بلّغ</text><rect x="20" y="138" width="193.33333333333334" height="251" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="20" y="138" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="205.33333333333334" y="156" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">التثقيف</text><text x="205.33333333333334" y="183" text-anchor="start" font-size="13" fill="#0f172a">• مرض القلب: متابعة</text><text x="205.33333333333334" y="201.2" text-anchor="start" font-size="13" fill="#0f172a">الكوليسترول</text><text x="205.33333333333334" y="224.4" text-anchor="start" font-size="13" fill="#0f172a">• الوزن: حافظ عليه</text><text x="205.33333333333334" y="247.6" text-anchor="start" font-size="13" fill="#0f172a">• الاكتئاب: اطلب الدعم</text><text x="205.33333333333334" y="270.8" text-anchor="start" font-size="13" fill="#0f172a">• العظام: تمارين تحمل</text><text x="205.33333333333334" y="289" text-anchor="start" font-size="13" fill="#0f172a">الوزن يوميًا + ورقيات</text><text x="205.33333333333334" y="307.2" text-anchor="start" font-size="13" fill="#0f172a">خضراء + ألبان</text><text x="205.33333333333334" y="330.4" text-anchor="start" font-size="13" fill="#0f172a">• الهبّات: قلّل الكافيين</text><text x="205.33333333333334" y="348.59999999999997" text-anchor="start" font-size="13" fill="#0f172a">(شاي، صودا، قهوة)</text></svg>
