<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 694" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="694" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">COPD: التمريض والتثقيف</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="305.6" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">نوبة تفاقم: ممنوع</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• أفيونات: morphine،</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">hydromorphone،</text><text x="612" y="135.4" text-anchor="start" font-size="13" fill="#0f172a">hydrocodone، oxycodone</text><text x="612" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">• بنزوديازيبينات:</text><text x="612" y="176.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">diazepam، lorazepam</text><text x="612" y="200" text-anchor="start" font-size="13" fill="#0f172a">• سبب المنع: كبت التنفس</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="305.6" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الغذاء والسوائل</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• نظافة الفم قبل الوجبة</text><text x="408.66666666666663" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• وجبات صغيرة متكررة</text><text x="408.66666666666663" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">عالية السعرات والبروتين</text><text x="408.66666666666663" y="163.6" text-anchor="start" font-size="13" fill="#0f172a">• قلل الكربوهيدرات</text><text x="408.66666666666663" y="181.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">العالية</text><text x="408.66666666666663" y="205" text-anchor="start" font-size="13" fill="#0f172a">• لا مجهود قبل/بعد</text><text x="408.66666666666663" y="223.2" text-anchor="start" font-size="13" fill="#0f172a">الوجبة بساعة</text><text x="408.66666666666663" y="246.4" text-anchor="start" font-size="13" fill="#0f172a">• لا غازات: لا مشروبات</text><text x="408.66666666666663" y="264.6" text-anchor="start" font-size="13" fill="#0f172a">غازية ولا ألياف عالية</text><text x="408.66666666666663" y="282.8" text-anchor="start" font-size="13" fill="#0f172a">(بروكلي، فول)</text><text x="408.66666666666663" y="306" text-anchor="start" font-size="13" fill="#0f172a">• 8 أكواب (2–3 لتر)</text><text x="408.66666666666663" y="324.2" text-anchor="start" font-size="13" fill="#0f172a">يوميًا، بدون شرب أثناء</text><text x="408.66666666666663" y="342.4" text-anchor="start" font-size="13" fill="#0f172a">الأكل</text><rect x="20" y="54" width="193.33333333333334" height="305.6" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#0ea5e9"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الوقاية</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• أبلغ عن زيادة البلغم</text><text x="205.33333333333334" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">أو الحمى أو ضيق النفس</text><text x="205.33333333333334" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• لقاح الالتهاب الرئوي</text><text x="205.33333333333334" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">المكوّري (حسب إرشادات</text><text x="205.33333333333334" y="176.8" text-anchor="start" font-size="13" fill="#0f172a">التطعيم)</text><text x="205.33333333333334" y="200" text-anchor="start" font-size="13" fill="#0f172a">• لقاح الإنفلونزا سنويًا</text><text x="205.33333333333334" y="223.2" text-anchor="start" font-size="13" fill="#0f172a">• albuterol عند الضيق</text><rect x="30" y="369.6" width="580" height="40" rx="10" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="578" cy="389.6" r="14" fill="#0ea5e9"/><text x="578" y="394.6" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="554" y="394.6" text-anchor="start" font-size="13.5" fill="#0f172a">تنفس بالشفاه المزمومة: شهيق من الأنف ثانيتين (فم مغلق)</text><text x="320" y="420.6" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="423.6" width="580" height="40" rx="10" fill="#6366f1" fill-opacity="0.14" stroke="#6366f1" stroke-width="1.5"/><circle cx="578" cy="443.6" r="14" fill="#6366f1"/><text x="578" y="448.6" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="554" y="448.6" text-anchor="start" font-size="13.5" fill="#0f172a">زفير بشفاه مزمومة 4 ثوان — يمنع احتباس الهواء وانهيار الشعب</text><text x="320" y="474.6" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="477.6" width="580" height="40" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.5"/><circle cx="578" cy="497.6" r="14" fill="#f59e0b"/><text x="578" y="502.6" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="554" y="502.6" text-anchor="start" font-size="13.5" fill="#0f172a">سعال الهف: جلوس مستقيم وقدمان متباعدتان</text><text x="320" y="528.6" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="531.6" width="580" height="40" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="1.5"/><circle cx="578" cy="551.6" r="14" fill="#10b981"/><text x="578" y="556.6" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="554" y="556.6" text-anchor="start" font-size="13.5" fill="#0f172a">شهيق بطيء عميق بالحجاب الحاجز</text><text x="320" y="582.6" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="585.6" width="580" height="40" rx="10" fill="#ec4899" fill-opacity="0.14" stroke="#ec4899" stroke-width="1.5"/><circle cx="578" cy="605.6" r="14" fill="#ec4899"/><text x="578" y="610.6" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">5</text><text x="554" y="610.6" text-anchor="start" font-size="13.5" fill="#0f172a">احبس 2–3 ثوان ثم ازفر بقوة؛ كرر مرة أو مرتين</text><text x="320" y="636.6" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="639.6" width="580" height="40" rx="10" fill="#14b8a6" fill-opacity="0.14" stroke="#14b8a6" stroke-width="1.5"/><circle cx="578" cy="659.6" r="14" fill="#14b8a6"/><text x="578" y="664.6" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">6</text><text x="554" y="664.6" text-anchor="start" font-size="13.5" fill="#0f172a">استرح 5–10 أنفاس عادية وكرر حتى تنظف الإفرازات</text></svg>
