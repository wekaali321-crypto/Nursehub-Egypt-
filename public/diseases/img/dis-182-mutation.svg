<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 347" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="347" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">ليه ممكن نصاب بالإنفلونزا أكثر من مرة؟</text><g text-anchor="middle"><rect x="80" y="46" width="480" height="57" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="320" y="68" font-size="14" font-weight="800" fill="#14532d">1) الشخص المصاب بالفيروس يكوّن أجساماً مضادة</text><text x="320" y="86" font-size="12" font-weight="600" fill="#14532d">ضد هذا الفيروس تحديداً</text><path d="M320 103 V119" stroke="#64748b" stroke-width="3"/><path d="M314 113 L320 120 L326 113" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="121" width="480" height="57" rx="10" fill="#fef9c3" stroke="#eab308"/><text x="320" y="143" font-size="14" font-weight="800" fill="#422006">2) الفيروس يتحور (Mutation) ويتغير</text><text x="320" y="161" font-size="12" font-weight="600" fill="#422006">تغيرات في البروتينين H و N</text><path d="M320 178 V194" stroke="#64748b" stroke-width="3"/><path d="M314 188 L320 195 L326 188" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="196" width="480" height="60" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="320" y="218" font-size="14" font-weight="800" fill="#7f1d1d">3) الأجسام المضادة القديمة لا تتعرف على الفيروس</text><text x="320" y="238" font-size="14" font-weight="800" fill="#7f1d1d">الجديد</text><path d="M320 256 V272" stroke="#64748b" stroke-width="3"/><path d="M314 266 L320 273 L326 266" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="274" width="480" height="57" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="320" y="296" font-size="14" font-weight="800" fill="#1e3a8a">4) تحدث عدوى جديدة</text><text x="320" y="314" font-size="12" font-weight="600" fill="#1e3a8a">والأجسام القديمة تعطي حماية جزئية فقط</text></g></svg>