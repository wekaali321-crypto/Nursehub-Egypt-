<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 411" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="411" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">العكازات والعصا</text><rect x="330" y="52" width="300" height="216.0" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العكاز</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الوزن على اليدين والذراعين وليس الإبط</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (إصابة الضفيرة العضدية)</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• لا تستعمل عكاز غيرك</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الحافة العلوية تبعد 1–2 إنش (≈ 2.5–5</text><text x="620" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  سم) عن الإبط</text><text x="620" y="182.00000000000003" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• المشي: العكازان للأمام مع الساق المصابة</text><text x="620" y="199.40000000000003" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  ثم السليمة</text><text x="620" y="216.80000000000004" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أنماط المشي: نقطتان، ثلاث نقاط، أربع</text><text x="620" y="234.20000000000005" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  نقاط (الأكثر تقدمًا ويشبه المشي</text><text x="620" y="251.60000000000005" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الطبيعي)</text><rect x="10" y="52" width="310" height="129.0" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#16a34a"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">السلالم (عكاز)</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الصعود: السليمة أولًا (UP with the GOOD)</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• النزول: المصابة أولًا (Down with the BAD)</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الصعود: ثقّل على العكازين ثم قدّم السليمة</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  ثم العكازين والمصابة</text><text x="310" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• النزول: العكازان والمصابة معًا ثم السليمة</text><rect x="330" y="276.0" width="300" height="94.19999999999999" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M330,286.0 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#7c3aed"/><text x="480.0" y="295.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العصا</text><text x="620" y="319.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تُمسك بالجانب الأقوى</text><text x="620" y="336.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• حرّك العصا أولًا ثم الساق الضعيفة</text><text x="620" y="353.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• للحفظ: Cane Comes first</text><rect x="10" y="276.0" width="310" height="111.6" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,286.0 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="295.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">السلالم (عصا)</text><text x="310" y="319.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• صعود: القوية ثم العصا ثم الضعيفة</text><text x="310" y="336.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• نزول: العصا ثم الضعيفة ثم القوية</text><text x="310" y="353.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• سؤال استبدال الركبة: الأولى القوية؛ نزول:</text><text x="310" y="371.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  العصا والمصابة ثم القوية</text></svg>