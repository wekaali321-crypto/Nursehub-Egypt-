<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >إصابات العين: ماذا تفعل أولاً؟</text><rect x="24" y="46" width="592" height="50" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="470" y="46" width="146" height="50" rx="12" fill="#dc2626"/><text x="543" y="76.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff" >حرق كيميائي</text><text x="460" y="76.0" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a" >اغسل فوراً بماء/ملح بغزارة 15–30 د ثم أحِل</text><rect x="24" y="104" width="592" height="50" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="470" y="104" width="146" height="50" rx="12" fill="#b91c1c"/><text x="543" y="134.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff" >اشتباه تمزق مقلة</text><text x="460" y="134.0" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a" >لا ضغط ولا غسل: غطاء صلب + NPO + جراح</text><rect x="24" y="162" width="592" height="50" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="470" y="162" width="146" height="50" rx="12" fill="#ea580c"/><text x="543" y="192.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff" >Hyphema</text><text x="460" y="192.0" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a" >رأس مرفوع 45° + غطاء + ضغط العين + عيون</text><rect x="24" y="220" width="592" height="50" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="470" y="220" width="146" height="50" rx="12" fill="#ca8a04"/><text x="543" y="250.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff" >جسم غريب</text><text x="460" y="250.0" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a" >قلب الجفن + مخدر + إزالة بمتخصص + تغطية</text><rect x="24" y="278" width="592" height="50" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="470" y="278" width="146" height="50" rx="12" fill="#16a34a"/><text x="543" y="308.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff" >خدش قرنية</text><text x="460" y="308.0" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a" >فلورسين + ضوء أزرق + بلا كورتيزون</text><rect x="24" y="336" width="592" height="50" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="470" y="336" width="146" height="50" rx="12" fill="#2563eb"/><text x="543" y="366.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff" >Black eye</text><text x="460" y="366.0" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a" >كمادات باردة أول يوم ثم دافئة</text>
