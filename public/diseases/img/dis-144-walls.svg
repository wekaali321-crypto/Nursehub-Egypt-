<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 372" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="372" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >أي اشتقاقات تشوف أي جدار في القلب</text><text x="590" y="48" text-anchor="start" font-size="12.5" font-weight="800" fill="#64748b" >الجدار</text><text x="420" y="48" text-anchor="start" font-size="12.5" font-weight="800" fill="#64748b" >الاشتقاقات</text><text x="250" y="48" text-anchor="start" font-size="12.5" font-weight="800" fill="#64748b" >الشريان المحتمل</text><rect x="30" y="62" width="580" height="48" rx="10" fill="#dbeafe"/><text x="596" y="91" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a" >سفلي (Inferior)</text><text x="430" y="91" text-anchor="start" font-size="13" font-weight="800" fill="#1d4ed8" >II · III · aVF</text><text x="250" y="91" text-anchor="start" font-size="12" font-weight="700" fill="#334155" >الشريان التاجي الأيمن RCA (غالباً)</text><rect x="30" y="118" width="580" height="48" rx="10" fill="#fee2e2"/><text x="596" y="147" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a" >أمامي-حاجزي (Septal)</text><text x="430" y="147" text-anchor="start" font-size="13" font-weight="800" fill="#1d4ed8" >V1 · V2</text><text x="250" y="147" text-anchor="start" font-size="12" font-weight="700" fill="#334155" >الشريان الأمامي النازل LAD</text><rect x="30" y="174" width="580" height="48" rx="10" fill="#fee2e2"/><text x="596" y="203" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a" >أمامي (Anterior)</text><text x="430" y="203" text-anchor="start" font-size="13" font-weight="800" fill="#1d4ed8" >V3 · V4</text><text x="250" y="203" text-anchor="start" font-size="12" font-weight="700" fill="#334155" >LAD</text><rect x="30" y="230" width="580" height="48" rx="10" fill="#dcfce7"/><text x="596" y="259" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a" >جانبي (Lateral)</text><text x="430" y="259" text-anchor="start" font-size="13" font-weight="800" fill="#1d4ed8" >I · aVL · V5 · V6</text><text x="250" y="259" text-anchor="start" font-size="12" font-weight="700" fill="#334155" >الشريان الملتف LCx (أو فرع من LAD)</text><rect x="30" y="286" width="580" height="48" rx="10" fill="#fef3c7"/><text x="596" y="315" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a" >خلفي (Posterior)</text><text x="430" y="315" text-anchor="start" font-size="13" font-weight="800" fill="#1d4ed8" >V1–V3: ST هابط + R عالية</text><text x="250" y="315" text-anchor="start" font-size="12" font-weight="700" fill="#334155" >RCA أو LCx — تُؤكد باشتقاقات V7–V9</text><text x="320" y="352" text-anchor="middle" font-size="13" font-weight="800" fill="#dc2626" >ارتفاع ST في اشتقاقين متجاورين أو أكثر = جلطة STEMI في هذا الجدار</text>
</svg>
