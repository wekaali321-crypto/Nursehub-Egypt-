<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="330" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >أماكن تمدد الأورطي وأخطر مضاعفاته</text><path d="M200 60 C200 40 260 40 260 70 L260 300" stroke="#ef4444" stroke-width="30" fill="none" stroke-linecap="round" opacity=".85"/><ellipse cx="236" cy="105" rx="42" ry="30" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><ellipse cx="260" cy="235" rx="40" ry="34" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><text x="120" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d" >تمدد الأورطي الصدري</text><text x="120" y="238" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d" >تمدد الأورطي البطني (الأشيع)</text><text x="120" y="128" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b" >(Thoracic)</text><text x="120" y="258" text-anchor="middle" font-size="11" font-weight="400" fill="#64748b" >(AAA) تحت الشريان الكلوي غالباً</text><rect x="340" y="55" width="280" height="64" rx="10" fill="#fee2e2"/><text x="480" y="80" text-anchor="middle" font-size="13" font-weight="800" fill="#991b1b" >علامة تنذر بالانفجار</text><text x="480" y="102" text-anchor="middle" font-size="12" font-weight="500" fill="#7f1d1d" >ألم ظهر/بطن شديد + ضغط واطي + إغماء</text><rect x="340" y="135" width="280" height="64" rx="10" fill="#e0f2fe"/><text x="480" y="160" text-anchor="middle" font-size="13" font-weight="800" fill="#075985" >الحجم والتمدد</text><text x="480" y="182" text-anchor="middle" font-size="12" font-weight="500" fill="#0c4a6e" >كل ما زاد القطر زاد خطر الانفجار</text><rect x="340" y="215" width="280" height="64" rx="10" fill="#fef3c7"/><text x="480" y="240" text-anchor="middle" font-size="13" font-weight="800" fill="#92400e" >المراقبة بالتصوير الدوري</text><text x="480" y="262" text-anchor="middle" font-size="12" font-weight="500" fill="#78350f" >الصغير غالباً متابعة، والكبير جراحة</text><text x="320" y="318" text-anchor="middle" font-size="11" font-weight="400" fill="#94a3b8" >رسم توضيحي من إعداد الموقع — ليس لمقياس حقيقي</text></svg>