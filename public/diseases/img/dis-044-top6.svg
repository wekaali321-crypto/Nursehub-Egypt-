<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 328" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="328" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أهم 6 مظاهر للالتهاب الرئوي</text><rect x="326" y="56" width="298" height="71" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><rect x="326" y="56" width="298" height="30" rx="12" fill="#dc2626"/><text x="475" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="614" y="108" text-anchor="end" font-size="13" fill="#7f1d1d">تغيّر الحالة الذهنية: قلق وهياج وارتباك</text><rect x="16" y="56" width="298" height="71" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><rect x="16" y="56" width="298" height="30" rx="12" fill="#ea580c"/><text x="165" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="304" y="108" text-anchor="end" font-size="13" fill="#7c2d12">حمى أعلى من 38°م (100.4°F)</text><rect x="326" y="139" width="298" height="71" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><rect x="326" y="139" width="298" height="30" rx="12" fill="#d97706"/><text x="475" y="160" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="614" y="191" text-anchor="end" font-size="13" fill="#78350f">سعال منتج ببلغم أصفر</text><rect x="16" y="139" width="298" height="71" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><rect x="16" y="139" width="298" height="30" rx="12" fill="#2563eb"/><text x="165" y="160" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="304" y="191" text-anchor="end" font-size="13" fill="#1e3a8a">خرخرة دقيقة أو خشنة (Crackles)</text><rect x="326" y="222" width="298" height="90" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><rect x="326" y="222" width="298" height="30" rx="12" fill="#7c3aed"/><text x="475" y="243" text