<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 298" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="298" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">عامل Rh: الأم سالبة والجنين موجب</text><text x="320" y="50" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">لماذا نعطي RhoGAM (Anti-D)؟</text><rect x="330" y="72" width="290" height="110" rx="10" fill="#fff" stroke="#2563eb" stroke-width="1.5"/><path d="M330,82 a10,10 0 0 1 10,-10 h270 a10,10 0 0 1 10,10 v18 h-290 z" fill="#2563eb"/><text x="475.0" y="91" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الحمل الأول</text><text x="610" y="115" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a">• الأم Rh سالب والجنين Rh موجب</text><text x="610" y="133.125" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a">• اختلاط بسيط بالدم أثناء الولادة</text><text x="610" y="151.25" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a">• جسم الأم يكوّن أجسامًا مضادة</text><rect x="20" y="72" width="290" height="110" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M20,82 a10,10 0 0 1 10,-10 h270 a10,10 0 0 1 10,10 v18 h-290 z" fill="#dc2626"/><text x="165.0" y="91" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الحمل الثاني</text><text x="300" y="115" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a">• أجسام الأم المضادة تعبر المشيمة</text><text x="300" y="133.125" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a">• تهاجم كرات الجنين Rh موجب</text><text x="300" y="151.25" text-anchor="start" font-size="12.5" font-weight="600" fill="#0f172a">• انحلال دم وأنيميا انحلالية (HDN)</text><line x1="330" y1="134" x2="310" y2="134" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="194" width="600" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="320" y="216" text-anchor="middle" font-size="14" font-weight="800" fill="#166534">الوقاية: حقنة RhoGAM للأم Rh سالب</text><text x="320" y="236.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14532d">تحمي الجنين القادم من تكوين الأجسام المضادة. اختبار كومبس غير المباشر يكشف</text><text x="320" y="254.75" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14532d">الأجسام المضادة الدائرة ضد كرات الدم الحمراء.</text></svg>