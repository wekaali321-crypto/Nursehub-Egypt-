<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="190" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">درجات الحروق ومظهرها</text><rect x="12" y="44" width="616" height="30" rx="8" fill="#0f172a"/><text x="581.8000000000001" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">الدرجة</text><text x="458.6" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">العمق</text><text x="268.6666666666667" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">المظهر</text><text x="83.86666666666669" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">الألم</text><rect x="12" y="74" width="616" height="28" fill="#fff" stroke="#ca8a04" stroke-width="0"/><rect x="623" y="74" width="5" height="28" fill="#ca8a04"/><text x="581.8000000000001" y="92" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">الأولى</text><text x="458.6" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">البشرة فقط</text><text x="268.6666666666667" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">أحمر، ورم خفيف، بدون فقاعات</text><text x="83.86666666666669" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">مؤلمة</text><rect x="12" y="102" width="616" height="28" fill="#f1f5f9" stroke="#ea580c" stroke-width="0"/><rect x="623" y="102" width="5" height="28" fill="#ea580c"/><text x="581.8000000000001" y="120" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">الثانية</text><text x="458.6" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">البشرة + جزء من الأدمة</text><text x="268.6666666666667" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">أحمر عميق/أبيض، فقاعات، إفراز</text><text x="83.86666666666669" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">ألم شديد</text><rect x="12" y="130" width="616" height="44" fill="#fff" stroke="#dc2626" stroke-width="0"/><rect x="623" y="130" width="5" height="44" fill="#dc2626"/><text x="581.8000000000001" y="148" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">الثالثة</text><text x="458.6" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">كل الطبقات وقد تصل لما</text><text x="458.6" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">تحتها</text><text x="268.6666666666667" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">أسود متفحم (Eschar) أو أبيض جاف</text><text x="83.86666666666669" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">غالباً بدون ألم (تلف</text><text x="83.86666666666669" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">الأعصاب)</text></svg>