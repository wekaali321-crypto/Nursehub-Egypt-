<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 311" width="640" height="311" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="مضادات الذهان: مقارنة"><rect width="640" height="311" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">مضادات الذهان: مقارنة</text><rect x="10" y="48" width="620" height="28" rx="6" fill="#2b6a9e"/><text x="564.2424242424242" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الدواء</text><text x="423.33333333333337" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الاستعمال</text><text x="282.4242424242425" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">متوقع</text><text x="113.33333333333341" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">أخطر</text><rect x="10" y="76" width="620" height="61" fill="#f4f8fc" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="95" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">Haloperidol</text><text x="623" y="112" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">(الجيل الأول)</text><text x="491.4848484848485" y="95" text-anchor="start" font-size="12.5"  fill="#1d2939">فصام، Tourette (ضبط</text><text x="491.4848484848485" y="112" text-anchor="start" font-size="12.5"  fill="#1d2939">الحركات)</text><text x="341.18181818181824" y="95" text-anchor="start" font-size="12.5"  fill="#1d2939">أعراض خارج هرمية،</text><text x="341.18181818181824" y="112" text-anchor="start" font-size="12.5"  fill="#1d2939">dystonia</text><text x="209.66666666666674" y="95" text-anchor="start" font-size="12.5"  fill="#1d2939">متلازمة NMS: حمّى، تعرق،</text><text x="209.66666666666674" y="112" text-anchor="start" font-size="12.5"  fill="#1d2939">تغير وعي، تيبس، رعشة ← أوقف</text><text x="209.66666666666674" y="129" text-anchor="start" font-size="12.5"  fill="#1d2939">وأبلغ</text><rect x="10" y="137" width="620" height="61" fill="#fff" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="156" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">Clozapine (الجيل</text><text x="623" y="173" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">الثاني)</text><text x="491.4848484848485" y="156" text-anchor="start" font-size="12.5"  fill="#1d2939">فصام وفصام وجداني</text><text x="491.4848484848485" y="173" text-anchor="start" font-size="12.5"  fill="#1d2939">لا يستجيبان لغيرهما</text><text x="341.18181818181824" y="156" text-anchor="start" font-size="12.5"  fill="#1d2939">زيادة وزن، سيلان</text><text x="341.18181818181824" y="173" text-anchor="start" font-size="12.5"  fill="#1d2939">لعاب، نعاس</text><text x="209.66666666666674" y="156" text-anchor="start" font-size="12.5"  fill="#1d2939">نقص البيض: التهاب حلق،</text><text x="209.66666666666674" y="173" text-anchor="start" font-size="12.5"  fill="#1d2939">حمّى، أعراض إنفلونزا ← أبلغ</text><text x="209.66666666666674" y="190" text-anchor="start" font-size="12.5"  fill="#1d2939">فورًا</text><rect x="10" y="198" width="620" height="61" fill="#f4f8fc" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="217" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">Risperidone</text><text x="491.4848484848485" y="217" text-anchor="start" font-size="12.5"  fill="#1d2939">فصام</text><text x="341.18181818181824" y="217" text-anchor="start" font-size="12.5"  fill="#1d2939">—</text><text x="209.66666666666674" y="217" text-anchor="start" font-size="12.5"  fill="#1d2939">مريض خرف (Dementia): خطر</text><text x="209.66666666666674" y="234" text-anchor="start" font-size="12.5"  fill="#1d2939">وفيات؛ HESI: يحتاج تدخل</text><text x="209.66666666666674" y="251" text-anchor="start" font-size="12.5"  fill="#1d2939">الممرض</text><rect x="10" y="259" width="620" height="44" fill="#fff" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="278" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">Ziprasidone</text><text x="623" y="295" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">(Geodon)</text><text x="491.4848484848485" y="278" text-anchor="start" font-size="12.5"  fill="#1d2939">هوس ثنائي القطب،</text><text x="491.4848484848485" y="295" text-anchor="start" font-size="12.5"  fill="#1d2939">ذهان حاد، هياج</text><text x="341.18181818181824" y="278" text-anchor="start" font-size="12.5"  fill="#1d2939">—</text><text x="209.66666666666674" y="278" text-anchor="start" font-size="12.5"  fill="#1d2939">هبوط ضغط وإطالة QT</text></svg>