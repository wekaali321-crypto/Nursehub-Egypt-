<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 463" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="463" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">شد باك (Buck's traction) وجراحة الورك</text><rect x="330" y="52" width="300" height="163.79999999999998" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">نقاط الشد</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الأوزان معلّقة بحرية دائمًا</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• حبال الشد مشدودة (لا ترتخي ولا تستند</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  على السرير أو الأرض)</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الطرف في وضع محايد</text><text x="620" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قيّم تقرّح الجلد</text><text x="620" y="182.00000000000003" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• فحوص عصبية وعائية P,M,S,C</text><text x="620" y="199.40000000000003" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مسطح (رأس السرير لا يرتفع أكثر من 25°)</text><rect x="10" y="52" width="310" height="146.39999999999998" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#16a34a"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الاستخدام</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مؤقت قبل الجراحة لإعادة محاذاة كسور الورك</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  والفخذ</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• يوقف التشنج العضلي</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أسئلة: الأهم أن تتدلى الأوزان بحرية؛</text><text x="310" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الحبال لا تلمس قاعدة السرير؛ تأكد أن</text><text x="310" y="182.00000000000003" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الأوزان بعيدة عن الأرض</text><rect x="330" y="223.79999999999998" width="300" height="216.0" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M330,233.79999999999998 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#7c3aed"/><text x="480.0" y="242.79999999999998" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">بعد جراحة الورك</text><text x="620" y="266.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الترتيب: 1) النزف 2) العدوى 3) تعليم</text><text x="620" y="284.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الوضعيات</text><text x="620" y="301.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• Hgb أقل من 7 = حرج؛ أبلغ (Kaplan: Hgb</text><text x="620" y="318.9999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  8)</text><text x="620" y="336.39999999999986" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• راقب النبض البعيد، هبوط ضغط، سرعة قلب</text><text x="620" y="353.79999999999984" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• WBC مرتفع (طبيعي 5000–10000)</text><text x="620" y="371.1999999999998" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تقييم الجرح: لون وكمية ورائحة الإفراز</text><text x="620" y="388.5999999999998" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• نظّف مواضع الدبابيس 3 مرات يوميًا</text><text x="620" y="405.9999999999998" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  بمحلول معقم</text><text x="620" y="423.39999999999975" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• إفراز أصفر سميك عند الدبابيس = قلق</text><rect x="10" y="223.79999999999998" width="310" height="146.39999999999998" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,233.79999999999998 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="242.79999999999998" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الوضعيات (استبدال الورك)</text><text x="310" y="266.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ساقان متباعدتان (Abducted) بوسادة بينهما</text><text x="310" y="284.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• لا تقاطع الساقين</text><text x="310" y="301.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• لا انحناء للأمام (لا ربط الحذاء)</text><text x="310" y="318.9999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• لا جلوس على كرسي منخفض (زاوية 90°)</text><text x="310" y="336.39999999999986" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مفيد: قلب كل ساعتين، مشاية، لا رفع للرأس</text><text x="310" y="353.79999999999984" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  45° (حسب السؤال)</text></svg>