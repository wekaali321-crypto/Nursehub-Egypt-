<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 390" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="390" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مواضع الأقطاب: ٥ أقطاب و١٢ قطباً</text>
<rect x="30" y="50" width="260" height="320" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/><text x="160" y="76" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >٥ أقطاب (أطراف)</text><rect x="115" y="98" width="90" height="200" rx="40" fill="#fde8e0" stroke="#f1b8a8" stroke-width="1.5"/><circle cx="125" cy="125" r="13" fill="#f8fafc"/><circle cx="125" cy="125" r="13" fill="none" stroke="#334155" stroke-width="1.2"/><text x="125" y="129" text-anchor="middle" font-size="10" font-weight="800" fill="#0f172a" direction="ltr">RA</text><circle cx="195" cy="125" r="13" fill="#111827"/><circle cx="195" cy="125" r="13" fill="none" stroke="#334155" stroke-width="1.2"/><text x="195" y="129" text-anchor="middle" font-size="10" font-weight="800" fill="#fff" direction="ltr">LA</text><circle cx="140" cy="260" r="13" fill="#16a34a"/><circle cx="140" cy="260" r="13" fill="none" stroke="#334155" stroke-width="1.2"/><text x="140" y="264" text-anchor="middle" font-size="10" font-weight="800" fill="#fff" direction="ltr">RL</text><circle cx="180" cy="260" r="13" fill="#dc2626"/><circle cx="180" cy="260" r="13" fill="none" stroke="#334155" stroke-width="1.2"/><text x="180" y="264" text-anchor="middle" font-size="10" font-weight="800" fill="#fff" direction="ltr">LL</text><text x="160" y="330" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155" >أبيض يمين، أسود يسار فوق (ذراعان)</text><text x="160" y="350" text-anchor="middle" font-size="11.5" font-weight="600" fill="#334155" >أخضر يمين، أحمر يسار تحت (ساقان)</text><rect x="310" y="50" width="320" height="320" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><text x="470" y="76" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a" >١٢ قطب: الأقطاب الصدرية</text><circle cx="606" cy="102" r="10" fill="#dc2626"/><text x="606" y="106" text-anchor="middle" font-size="8.5" font-weight="800" fill="#fff" direction="ltr">V1</text><text x="590" y="106" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >المسافة 4 يمين القص</text><circle cx="606" cy="138" r="10" fill="#eab308"/><text x="606" y="142" text-anchor="middle" font-size="8.5" font-weight="800" fill="#fff" direction="ltr">V2</text><text x="590" y="142" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >المسافة 4 يسار القص</text><circle cx="606" cy="174" r="10" fill="#16a34a"/><text x="606" y="178" text-anchor="middle" font-size="8.5" font-weight="800" fill="#fff" direction="ltr">V3</text><text x="590" y="178" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >بين V2 وV4</text><circle cx="606" cy="210" r="10" fill="#92400e"/><text x="606" y="214" text-anchor="middle" font-size="8.5" font-weight="800" fill="#fff" direction="ltr">V4</text><text x="590" y="214" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >المسافة 5 خط منتصف الترقوة</text><circle cx="606" cy="246" r="10" fill="#111827"/><text x="606" y="250" text-anchor="middle" font-size="8.5" font-weight="800" fill="#fff" direction="ltr">V5</text><text x="590" y="250" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >بمحاذاة V4 عند الإبط الأمامي</text><circle cx="606" cy="282" r="10" fill="#7c3aed"/><text x="606" y="286" text-anchor="middle" font-size="8.5" font-weight="800" fill="#fff" direction="ltr">V6</text><text x="590" y="286" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >بمحاذاة V4 عند منتصف الإبط</text><circle cx="606" cy="318" r="10" fill="#92400e"/><text x="606" y="322" text-anchor="middle" font-size="8.5" font-weight="800" fill="#fff" direction="ltr">V4R</text><text x="590" y="322" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >المسافة 5 منتصف الترقوة يمين</text>
</svg>
