<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="300" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >ثالوث بيك وانحباس القلب</text><circle cx="150" cy="150" r="70" fill="#fecaca" stroke="#b91c1c" stroke-width="4"/><circle cx="150" cy="150" r="42" fill="#ef4444"/><text x="150" y="155" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >القلب</text><text x="150" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d" >سائل/دم حول القلب</text><rect x="330" y="55" width="280" height="56" rx="10" fill="#dc2626"/><text x="470" y="80" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >هبوط الضغط</text><text x="470" y="100" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >الدم بيقل لكل الجسم</text><rect x="330" y="123" width="280" height="56" rx="10" fill="#f97316"/><text x="470" y="148" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >أصوات قلب مكتومة</text><text x="470" y="168" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >السائل يكتم الصوت</text><rect x="330" y="191" width="280" height="56" rx="10" fill="#2563eb"/><text x="470" y="216" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" >احتقان أوردة الرقبة (JVD)</text><text x="470" y="236" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >الدم عايز يدخل القلب</text><text x="320" y="282" text-anchor="middle" font-size="12" font-weight="600" fill="#475569" >+ نبض متناقض Pulsus paradoxus (هبوط ≥10 ملم زئبق عند الشهيق)</text></svg>