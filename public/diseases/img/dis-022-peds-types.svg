<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="280" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع الأنسولين: بداية وذروة</text><rect x="20" y="46" width="600" height="30" rx="8" fill="#1e3a8a"/><text x="572.5" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">النوع</text><text x="450.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الأمثلة</text><text x="335.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">البداية</text><text x="237.5" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الذروة (خطر الهبوط)</text><text x="100.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ملاحظات</text><rect x="20" y="76" width="600" height="48" fill="#e0e7ff"/><text x="572.5" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">سريع جدًا</text><text x="450.0" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">أسبارت، ليسبرو،</text><text x="450.0" y="114" text-anchor="middle" font-size="12.5"  fill="#0f172a">جلوليزين</text><text x="335.0" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">15 دقيقة</text><text x="237.5" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">30–90 دقيقة</text><text x="100.0" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">الأخطر لخطر الهبوط؛ مع</text><text x="100.0" y="114" text-anchor="middle" font-size="12.5"  fill="#0f172a">الوجبة</text><rect x="20" y="124" width="600" height="48" fill="#fff"/><text x="572.5" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">عادي (Regular)</text><text x="450.0" y="144" text-anchor="middle" font-size="12.5"  fill="#0f172a">Regular</text><text x="335.0" y="144" text-anchor="middle" font-size="12.5"  fill="#0f172a">—</text><text x="237.5" y="144" text-anchor="middle" font-size="12.5"  fill="#0f172a">2–4 ساعات</text><text x="100.0" y="144" text-anchor="middle" font-size="12.5"  fill="#0f172a">الوحيد الذي يُعطى</text><text x="100.0" y="162" text-anchor="middle" font-size="12.5"  fill="#0f172a">IV/وريديًا</text><rect x="20" y="172" width="600" height="48" fill="#e0e7ff"/><text x="572.5" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">متوسط (NPH)</text><text x="450.0" y="192" text-anchor="middle" font-size="12.5"  fill="#0f172a">NPH</text><text x="335.0" y="192" text-anchor="middle" font-size="12.5"  fill="#0f172a">—</text><text x="237.5" y="192" text-anchor="middle" font-size="12.5"  fill="#0f172a">4–12 ساعة</text><text x="100.0" y="192" text-anchor="middle" font-size="12.5"  fill="#0f172a">عكر؛ لا يُعطى IV أبدًا؛</text><text x="100.0" y="210" text-anchor="middle" font-size="12.5"  fill="#0f172a">مرتان يوميًا</text><rect x="20" y="220" width="600" height="48" fill="#fff"/><text x="572.5" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">طويل</text><text x="450.0" y="240" text-anchor="middle" font-size="12.5"  fill="#0f172a">ديتميرا (Detemir)،</text><text x="450.0" y="258" text-anchor="middle" font-size="12.5"  fill="#0f172a">جلارجين (Glargine)</text><text x="335.0" y="240" text-anchor="middle" font-size="12.5"  fill="#0f172a">—</text><text x="237.5" y="240" text-anchor="middle" font-size="12.5"  fill="#0f172a">بلا ذروة</text><text x="100.0" y="240" text-anchor="middle" font-size="12.5"  fill="#0f172a">لا يُخلط مع غيره</text>
</svg>
