<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 288" width="640" height="288" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="مثبطات استرداد السيروتونين الانتقائية (SSRIs)"><rect width="640" height="288" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">مثبطات استرداد السيروتونين الانتقائية (SSRIs)</text><rect x="326.0" y="46" width="302.0" height="152" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الأدوية والاستعمال</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• Sertraline، Citalopram، Escitalopram</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   (اللاحقة -pram)</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• Paroxetine، Fluoxetine</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• اكتئاب، قلق، PTSD</text><text x="616.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• الآلية: تمنع إعادة امتصاص السيروتونين</text><text x="616.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">   فيزداد</text><rect x="12.0" y="46" width="302.0" height="98" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="12.0" y="60" width="302.0" height="14" fill="#a86a00"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">آثار جانبية</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• خلل جنسي</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• زيادة وزن</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• أرق (وليس نعاسًا): لا تنخدع</text><rect x="12.0" y="156" width="302.0" height="116" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="12.0" y="156" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="12.0" y="170" width="302.0" height="14" fill="#b42318"/><text x="163.0" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">قواعد الأمان</text><text x="302.0" y="204" text-anchor="start" font-size="12.5" fill="#1d2939">• خطر انتحار أعلى في البداية</text><text x="302.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• بدء بطيء (2–4 أسابيع) وإيقاف بطيء</text><text x="302.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• متلازمة السيروتونين: تعرّق وحمّى، تيبس</text><text x="302.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">   وهياج، تسرع قلب</text></svg>