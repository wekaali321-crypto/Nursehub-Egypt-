<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="330" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">phenytoin: المستوى العلاجي وإعطاؤه عبر الأنبوب الأنفي المعدي</text>
<text x="320" y="56" text-anchor="middle" font-size="13" fill="#475569">مستوى الدواء في الدم (mcg/mL)</text>
<rect x="40" y="70" width="187" height="34" fill="#fde68a" stroke="#d97706"/>
<rect x="227" y="70" width="187" height="34" fill="#bbf7d0" stroke="#16a34a"/>
<rect x="414" y="70" width="186" height="34" fill="#fecaca" stroke="#dc2626"/>
<text x="133" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">أقل من 10</text>
<text x="320" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#166534">10 – 20 علاجي</text>
<text x="507" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">أكثر من 20</text>
<text x="133" y="124" text-anchor="middle" font-size="12.5" fill="#0f172a">خطر نوبات</text>
<text x="133" y="142" text-anchor="middle" font-size="12.5" fill="#0f172a">بلّغ الطبيب</text>
<text x="320" y="124" text-anchor="middle" font-size="12.5" fill="#0f172a">المدى المطلوب</text>
<text x="320" y="142" text-anchor="middle" font-size="12.5" fill="#0f172a">تحاليل دم دورية</text>
<text x="507" y="124" text-anchor="middle" font-size="12.5" fill="#0f172a">سمّي (مثل 26): احجب الجرعة</text>
<text x="507" y="142" text-anchor="middle" font-size="12.5" fill="#0f172a">وبلّغ الطبيب فورًا</text>
<text x="320" y="180" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">إعطاء phenytoin عبر NG tube</text>
<rect x="470" y="194" width="150" height="72" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="545" y="218" text-anchor="middle" font-size="13" font-weight="800" fill="#1e3a8a">1</text>
<text x="545" y="238" text-anchor="middle" font-size="12.5" fill="#0f172a">أوقف التغذية ساعة</text>
<text x="545" y="256" text-anchor="middle" font-size="12.5" fill="#0f172a">على الأقل قبل الدواء</text>
<rect x="245" y="194" width="150" height="72" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="320" y="218" text-anchor="middle" font-size="13" font-weight="800" fill="#1e3a8a">2</text>
<text x="320" y="238" text-anchor="middle" font-size="12.5" fill="#0f172a">اغسل الأنبوب بـ 30 مل</text>
<text x="320" y="256" text-anchor="middle" font-size="12.5" fill="#0f172a">ماء قبل الدواء وبعده</text>
<rect x="20" y="194" width="150" height="72" rx="10" fill="#dbeafe" stroke="#2563eb"/>
<text x="95" y="218" text-anchor="middle" font-size="13" font-weight="800" fill="#1e3a8a">3</text>
<text x="95" y="238" text-anchor="middle" font-size="12.5" fill="#0f172a">تابع وظائف الكبد</text>
<text x="95" y="256" text-anchor="middle" font-size="12.5" fill="#0f172a">ومستوى الدواء دوريًا</text>
<path d="M468 230 L398 230" stroke="#64748b" stroke-width="2" fill="none"/><path d="M404 224 L396 230 L404 236" stroke="#64748b" stroke-width="2" fill="none"/>
<path d="M243 230 L173 230" stroke="#64748b" stroke-width="2" fill="none"/><path d="M179 224 L171 230 L179 236" stroke="#64748b" stroke-width="2" fill="none"/>
<rect x="40" y="282" width="560" height="32" rx="8" fill="#fee2e2" stroke="#dc2626"/>
<text x="320" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">phenytoin دواء وقائي بجرعات منتظمة: لا يُعطى كعلاج فوري عند بدء نوبة جديدة</text>
</svg>
