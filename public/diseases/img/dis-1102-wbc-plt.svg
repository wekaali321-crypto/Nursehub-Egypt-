<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="256" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >كرات الدم البيضاء والصفائح: حدود التصرف</text><rect x="20" y="46" width="290" height="190" rx="12" fill="#fff" stroke="#2563eb" stroke-width="3"/><rect x="20" y="46" width="290" height="36" rx="12" fill="#2563eb" stroke="none" stroke-width="1"/><text x="165" y="71" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >WBC (طبيعي 5,000 – 10,000)</text><rect x="36" y="98" width="126" height="56" rx="10" fill="#dc2626" stroke="none" stroke-width="1"/><text x="99" y="122" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" direction="ltr">< 5,000</text><text x="99" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff" >Leukopenia</text><rect x="178" y="98" width="116" height="56" rx="10" fill="#94a3b8" stroke="none" stroke-width="1"/><text x="236" y="122" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >طبيعي</text><text x="236" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff" >5–10 ألف</text><text x="165" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626" >حرارة خفيفة (نحو 100.4°F) = أولوية</text><text x="165" y="206" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >غرفة خاصة، لا زهور ولا فاكهة طازجة</text><text x="165" y="226" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >لا تجمّع الماء الراكد ولا زحام</text><rect x="330" y="46" width="290" height="190" rx="12" fill="#fff" stroke="#16a34a" stroke-width="3"/><rect x="330" y="46" width="290" height="36" rx="12" fill="#16a34a" stroke="none" stroke-width="1"/><text x="475" y="71" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >الصفائح (طبيعي 150 – 400 ألف)</text><rect x="346" y="98" width="126" height="56" rx="10" fill="#f97316" stroke="none" stroke-width="1"/><text x="409" y="122" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" direction="ltr">< 150k</text><text x="409" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff" >نقص صفائح</text><rect x="488" y="98" width="116" height="56" rx="10" fill="#dc2626" stroke="none" stroke-width="1"/><text x="546" y="122" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" direction="ltr">< 50k</text><text x="546" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff" >خطر نزيف</text><text x="475" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a" >أسبرين وكلوبيدوجريل وإنوكسابارين</text><text x="475" y="206" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >تعمل على الصفائح أو التجلط</text><text x="475" y="226" text-anchor="middle" font-size="12.5" font-weight="700" fill="#dc2626" >ركّز على ما يقتل المريض أولًا</text>
</svg>
