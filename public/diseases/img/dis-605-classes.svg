<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="310" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >درجات صدمة النزف (ATLS)</text><rect x="20" y="50" width="600" height="48" rx="10" fill="#22c55e"/><text x="560" y="80" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >درجة I</text><text x="420" y="74" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >فقد الدم: أقل من 15% (≤750 مل)</text><text x="420" y="92" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >النبض: طبيعي</text><text x="180" y="80" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >الحالة: قلق خفيف</text><rect x="20" y="105" width="600" height="48" rx="10" fill="#eab308"/><text x="560" y="135" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >درجة II</text><text x="420" y="129" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >فقد الدم: 15–30%</text><text x="420" y="147" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >النبض: 100–120</text><text x="180" y="135" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >الحالة: قلق، بول 20–30</text><rect x="20" y="160" width="600" height="48" rx="10" fill="#f97316"/><text x="560" y="190" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >درجة III</text><text x="420" y="184" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >فقد الدم: 30–40%</text><text x="420" y="202" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >النبض: 120–140</text><text x="180" y="190" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >الحالة: ارتباك، بول 5–15</text><rect x="20" y="215" width="600" height="48" rx="10" fill="#dc2626"/><text x="560" y="245" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >درجة IV</text><text x="420" y="239" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >فقد الدم: أكتر من 40%</text><text x="420" y="257" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >النبض: أكتر من 140</text><text x="180" y="245" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >الحالة: خمول/غيبوبة، بول صفر</text><text x="320" y="290" text-anchor="middle" font-size="11" font-weight="400" fill="#94a3b8" >للتوجيه فقط — القيم تقريبية لبالغ 70 كجم</text></svg>