<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 374" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="374" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">مرض مينيير (Ménière's Disease)</text><text x="320" y="52" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b">تجمع سوائل في الأذن الداخلية: نوبات مفاجئة وتأتي وتذهب</text><rect x="20" y="62" width="600" height="70" rx="10" fill="#e0f2fe" stroke="#0e7490" stroke-width="1.5"/><text x="320" y="88" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">سوائل زائدة في الأذن الداخلية (غالباً أذن واحدة) → نوبات مفاجئة</text><text x="320" y="112" text-anchor="middle" font-size="12.5" font-weight="400" fill="#b91c1c">قد تؤدي مع الوقت إلى صمم دائم</text><rect x="434.66666666666663" y="146" width="185.33333333333334" height="75.8" rx="10" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><path d="M434.66666666666663 156a10 10 0 0 1 10-10h165.33333333333334a10 10 0 0 1 10 10v22h-185.33333333333334z" fill="#6d28d9"/><text x="527.3333333333333" y="167" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">طنين</text><text x="610" y="192" text-anchor="start" font-size="12" font-weight="700" fill="#6d28d9">•</text><text x="598" y="192" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">رنين في الأذن (Tinnitus)</text><line x1="432.66666666666663" y1="183.9" x2="414.66666666666663" y2="183.9" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="227.3333333333333" y="146" width="185.33333333333334" height="75.8" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><path d="M227.3333333333333 156a10 10 0 0 1 10-10h165.33333333333334a10 10 0 0 1 10 10v22h-185.33333333333334z" fill="#c2410c"/><text x="319.99999999999994" y="167" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">فقد سمع</text><text x="402.66666666666663" y="192" text-anchor="start" font-size="12" font-weight="700" fill="#c2410c">•</text><text x="390.66666666666663" y="192" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">من جانب واحد (Unilateral)</text><line x1="225.3333333333333" y1="183.9" x2="207.3333333333333" y2="183.9" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="19.999999999999943" y="146" width="185.33333333333334" height="75.8" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M19.999999999999943 156a10 10 0 0 1 10-10h165.33333333333334a10 10 0 0 1 10 10v22h-185.33333333333334z" fill="#b91c1c"/><text x="112.66666666666661" y="167" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">دوار</text><text x="195.3333333333333" y="192" text-anchor="start" font-size="12" font-weight="700" fill="#b91c1c">•</text><text x="183.3333333333333" y="192" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">دوخة وفقدان توازن</text><text x="183.3333333333333" y="209.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">(Vertigo)</text><text x="320" y="243.8" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">الثلاثي الكلاسيكي</text><rect x="327" y="259.8" width="293" height="101.375" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><path d="M327 269.8a10 10 0 0 1 10-10h273a10 10 0 0 1 10 10v22h-293z" fill="#15803d"/><text x="473.5" y="280.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التثقيف</text><text x="610" y="306.3" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">•</text><text x="598" y="306.3" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الوقاية من السقوط: غيّر وضعيتك ببطء</text><text x="610" y="327.425" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">•</text><text x="