<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="340" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >الأسطر الثلاثة: pH ثم PaCO₂ ثم HCO₃</text><text x="70" y="98" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >pH</text><rect x="130" y="60" width="160" height="56" rx="8" fill="#dc2626" stroke="none" stroke-width="1"/><rect x="295" y="60" width="160" height="56" rx="8" fill="#94a3b8" stroke="none" stroke-width="1"/><rect x="460" y="60" width="160" height="56" rx="8" fill="#2563eb" stroke="none" stroke-width="1"/><text x="210" y="84" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >حمضي</text><text x="210" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >أقل من 7.35</text><text x="375" y="84" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >طبيعي</text><text x="375" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >7.35 – 7.45</text><text x="540" y="84" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >قلوي</text><text x="540" y="104" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >أكبر من 7.45</text><text x="70" y="174" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >PaCO₂</text><rect x="130" y="136" width="160" height="56" rx="8" fill="#2563eb" stroke="none" stroke-width="1"/><rect x="295" y="136" width="160" height="56" rx="8" fill="#94a3b8" stroke="none" stroke-width="1"/><rect x="460" y="136" width="160" height="56" rx="8" fill="#dc2626" stroke="none" stroke-width="1"/><text x="210" y="160" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >قلوي</text><text x="210" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >أقل من 35</text><text x="375" y="160" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >طبيعي</text><text x="375" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >35 – 45</text><text x="540" y="160" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >حمضي</text><text x="540" y="180" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >أكبر من 45</text><text x="70" y="250" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >HCO₃</text><rect x="130" y="212" width="160" height="56" rx="8" fill="#dc2626" stroke="none" stroke-width="1"/><rect x="295" y="212" width="160" height="56" rx="8" fill="#94a3b8" stroke="none" stroke-width="1"/><rect x="460" y="212" width="160" height="56" rx="8" fill="#2563eb" stroke="none" stroke-width="1"/><text x="210" y="236" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >حمضي</text><text x="210" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >أقل من 22</text><text x="375" y="236" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >طبيعي</text><text x="375" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >22 – 26</text><text x="540" y="236" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >قلوي</text><text x="540" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" >أكبر من 26</text><text x="320" y="300" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >اللون الأحمر = حمضي، الأزرق = قلوي. الرئة تظهر في السطر الأوسط والكلى في الأسفل</text><text x="320" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >ضع قيمة المريض على كل سطر وانظر في أي لون وقعت</text>
</svg>
