<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 422" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="422" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التسمم بأول أكسيد الكربون</text><rect x="30" y="54" width="580" height="54" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.5"/><circle cx="578" cy="81" r="14" fill="#f59e0b"/><text x="578" y="86" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="554" y="76" text-anchor="start" font-size="13.5" fill="#0f172a">استنشاق CO من عوادم السيارات (ورش الميكانيكا)، المدافئ، أو حرق</text><text x="554" y="95.575" text-anchor="start" font-size="13.5" fill="#0f172a">الوقود/الخشب في أماكن سيئة التهوية</text><text x="320" y="119" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="122" width="580" height="40" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.5"/><circle cx="578" cy="142" r="14" fill="#ef4444"/><text x="578" y="147" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="554" y="147" text-anchor="start" font-size="13.5" fill="#0f172a">CO يرتبط بالهيموغلوبين أسهل من الأكسجين فيحل محله → نقص أكسجة شديد</text><text x="320" y="173" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="176" width="580" height="40" rx="10" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="578" cy="196" r="14" fill="#0ea5e9"/><text x="578" y="201" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="554" y="201" text-anchor="start" font-size="13.5" fill="#0f172a">أعراض غامضة: صداع خفيف، دوار، ضيق نفس، غثيان</text><text x="320" y="227" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="230" width="580" height="40" rx="10" fill="#ec4899" fill-opacity="0.14" stroke="#ec4899" stroke-width="1.5"/><circle cx="578" cy="250" r="14" fill="#ec4899"/><text x="578" y="255" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="554" y="255" text-anchor="start" font-size="13.5" fill="#0f172a">مقياس التأكسج يعطي قراءة عالية كاذبة بينما المريض شديد النقص</text><text x="320" y="281" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="284" width="580" height="40" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="1.5"/><circle cx="578" cy="304" r="14" fill="#10b981"/><text x="578" y="309" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">5</text><text x="554" y="309" text-anchor="start" font-size="13.5" fill="#0f172a">الأولوية: أكسجين 100% بقناع غير معيد للتنفس بمعدل 15 لتر/د</text><rect x="20" y="334" width="600" height="74" rx="10" fill="#0ea5e9" fill-opacity="0.13" stroke="#0ea5e9" stroke-width="1.5"/><text x="610" y="354" text-anchor="start" font-size="13.5" font-weight="800" fill="#0ea5e9">أسئلة مفتاحية</text><text x="610" y="374" text-anchor="start" font-size="13" fill="#0f172a">أسئلة التقييم: هل تعمل ميكانيكي سيارات أو قرب عادم المحركات؟ كيف تُدفّئ</text><text x="610" y="393" text-anchor="start" font-size="13" fill="#0f172a">منزلك؟</text></svg>
