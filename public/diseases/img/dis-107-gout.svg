<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">النقرس: الغذاء والدواء</text>
<rect x="20.0" y="48" width="295.0" height="110" rx="10" fill="#b91c1c"/>
<text x="167.5" y="97.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">البيورينات</text>
<text x="167.5" y="116.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لحوم وكبدة، كحول وبيرة، مأكولات بحرية</text>
<rect x="325.0" y="48" width="295.0" height="110" rx="10" fill="#ca8a04"/>
<text x="472.5" y="88.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">المفاصل</text>
<text x="472.5" y="107.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">إصبع القدم الكبير أولًا</text>
<text x="472.5" y="126.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ثم الكاحل والركبة والرسغ</text>
<rect x="20.0" y="168" width="295.0" height="110" rx="10" fill="#0f766e"/>
<text x="167.5" y="208.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الوقاية</text>
<text x="167.5" y="227.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">فقد وزن، تجنب البيورين</text>
<text x="167.5" y="246.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">زيادة السوائل</text>
<rect x="325.0" y="168" width="295.0" height="110" rx="10" fill="#7c3aed"/>
<text x="472.5" y="208.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الأدوية</text>
<text x="472.5" y="227.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Allopurinol: يمنع النوبات</text>
<text x="472.5" y="246.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Colchicine: النوبة الحادة</text>
</svg>
