<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 406" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="406" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">العلامات الحيوية والقياسات الطبيعية للمولود</text><rect x="426" y="46" width="193" height="152" rx="12" fill="#bae6fd"/><text x="522.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">نبض القلب</text><text x="522.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">110–160/د (يقاس 1 دقيقة بسماعة)</text><text x="522.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">عند الراحة قد يهبط 80</text><text x="522.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">عند البكاء يصل 180</text><text x="522.5" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">الوضع: الفراغ الرابع بين الأضلاع</text><text x="522.5" y="176" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">عند الخط منتصف الترقوة الأيسر</text><rect x="223" y="46" width="193" height="152" rx="12" fill="#bbf7d0"/><text x="319.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">التنفس</text><text x="319.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">30–60/د</text><text x="319.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">يقاس دقيقة كاملة</text><rect x="20" y="46" width="193" height="152" rx="12" fill="#fde68a"/><text x="116.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الحرارة</text><text x="116.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">إبطية 36.5–37.5 م</text><text x="116.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">97.7–99.5 ف</text><text x="116.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">لا مستقيمية</text><rect x="426" y="208" width="193" height="152" rx="12" fill="#fecaca"/><text x="522.5" y="234" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الضغط</text><text x="522.5" y="258" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">73/55 ملم زئبق</text><rect x="223" y="208" width="193" height="152" rx="12" fill="#ddd6fe"/><text x="319.5" y="234" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">قياسات الجسم</text><text x="319.5" y="258" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">محيط الرأس 33–35 سم</text><text x="319.5" y="278" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">محيط الصدر 30–33 سم</text><text x="319.5" y="298" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">الطول 45–55 سم</text><text x="319.5" y="318" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">الوزن 2500–4300 جم</text><rect x="20" y="208" width="193" height="152" rx="12" fill="#fed7aa"/><text x="116.5" y="234" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">تصنيف الوزن</text><text x="116.5" y="258" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">SGA أقل من 10%</text><text x="116.5" y="278" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">AGA بين 10% و90%</text><text x="116.5" y="298" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">LGA أكثر من 90%</text><text x="116.5" y="318" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">ماكروسوميا أكثر من 4000 جم</text><text x="116.5" y="338" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">وزن منخفض (LBW): أقل من 2500 جم</text><text x="320" y="394" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">العلامات: كل 30 دقيقة أول ساعتين ثم كل 4–8 ساعات</text>
</svg>
