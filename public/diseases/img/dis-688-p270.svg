<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 472" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="472" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الخثار الوريدي العميق وريناود وبيرجر</text>
<rect x="14.0" y="52" width="652.0" height="136.0" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="14.0" y="52" width="652.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="340.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">DVT: خثرة في وريد عميق</text>
<text x="656.0" y="96" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• علامات: ألم وتشنج بالربلة، تورم في ساق واحدة، دفء واحمرار (تجمع دم)، وضيق نفس + ألم صدر =</text>
<text x="656.0" y="114.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">انصمام رئوي فأبلغ الطبيب فوراً</text>
<text x="656.0" y="134.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• أثناء وجود الخثرة: راحة بالسرير (لا تمشِ) وارفع الطرف لتحسين العود الوريدي</text>
<text x="656.0" y="154.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• بعد زوالها: تمارين الربلة والعضلات الثابتة، ترطيب، مشي مبكر، لا جلوس طويل</text>
<text x="656.0" y="172.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">(سيارة/طائرة/سرير)، وجوارب TED وأجهزة الضغط SCD بعد استقرار الخثرة</text>
<rect x="346.0" y="208.0" width="320.0" height="98.0" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.2"/>
<rect x="346.0" y="208.0" width="320.0" height="26" rx="10" fill="#6366f1" fill-opacity="1" stroke="#6366f1" stroke-width="1.2"/>
<text x="506.0" y="226.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">ريناود Raynaud</text>
<text x="656.0" y="252.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• تغير لون الأصابع: أبيض ثم أزرق/بنفسجي ثم</text>
<text x="656.0" y="270.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">أحمر</text>
<text x="656.0" y="290.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• يصيب الأصابع غالباً</text>
<rect x="14.0" y="208.0" width="320.0" height="98.0" rx="10" fill="#334155" fill-opacity="0.1" stroke="#334155" stroke-width="1.2"/>
