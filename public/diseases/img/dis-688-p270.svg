<text x="324.0" y="252.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• أصابع اليد والقدم تسود (غنغرينا)</text>
<text x="324.0" y="272.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• ارتباط قوي بالتدخين</text>
