<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 632" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="632" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">احتياطات العزل</text>
<rect x="325" y="44" width="295" height="240" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/><rect x="325" y="44" width="295" height="28" rx="10" fill="#64748b" stroke="none" stroke-width="1.5"/><rect x="325" y="58" width="295" height="14" rx="0" fill="#64748b" stroke="none" stroke-width="1.5"/><text x="472" y="63" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">قياسية Standard</text><text x="472" y="96" text-anchor="middle" font-size="12" font-weight="800" fill="#64748b">كل المرضى</text><text x="472" y="122" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">قفازات: دم وسوائل وإفرازات وأغشية وجلد غير</text><text x="472" y="139" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">سليم</text><rect x="20" y="44" width="295" height="240" rx="10" fill="#fff" stroke="#ec4899" stroke-width="2"/><rect x="20" y="44" width="295" height="28" rx="10" fill="#ec4899" stroke="none" stroke-width="1.5"/><rect x="20" y="58" width="295" height="14" rx="0" fill="#ec4899" stroke="none" stroke-width="1.5"/><text x="167" y="63" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">قطرات Droplet</text><text x="167" y="96" text-anchor="middle" font-size="12" font-weight="800" fill="#ec4899">كمامة جراحية خلال نحو متر</text><text x="167" y="122" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">حمى قرمزية، التهاب بلعوم عقدي، سعال ديكي،</text><text x="167" y="139" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">parvovirus، إنفلونزا (+تلامس)، دفتيريا</text><text x="167" y="156" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">بلعومية، Hib لسان المزمار، حصبة ألمانية،</text><text x="167" y="173" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">نكاف، سحايا بالمكورات، ميكوبلازما، غدّي</text><text x="167" y="190" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">(+تلامس)، رينوفيروس</text><rect x="325" y="294" width="295" height="240" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/><rect x="325" y="294" width="295" height="28" rx="10" fill="#f59e0b" stroke="none" stroke-width="1.5"/><rect x="325" y="308" width="295" height="14" rx="0" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="472" y="313" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">هوائية Airborne</text><text x="472" y="346" text-anchor="middle" font-size="12" font-weight="800" fill="#f59e0b">قناع N95 وغرفة ضغط سلبي</text><text x="472" y="372" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">حصبة، سل، جدري مائي (+تلامس)، هربس نطاقي</text><text x="472" y="389" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">منتشر (+تلامس)</text><rect x="20" y="294" width="295" height="240" rx="10" fill="#fff" stroke="#14b8a6" stroke-width="2"/><rect x="20" y="294" width="295" height="28" rx="10" fill="#14b8a6" stroke="none" stroke-width="1.5"/><rect x="20" y="308" width="295" height="14" rx="0" fill="#14b8a6" stroke="none" stroke-width="1.5"/><text x="167" y="313" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">تلامس Contact</text><text x="167" y="346" text-anchor="middle" font-size="12" font-weight="800" fill="#14b8a6">جاون وقفازات (وأحياناً لدخول البيئة)</text><text x="167" y="372" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">كائنات مقاومة MRSA وVRE، تنفسي RSV</text><text x="167" y="389" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">وparainfluenza، جلد: قوباء وقمل وجرب وهربس</text><text x="167" y="406" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">بسيط، جروح غزيرة الإفراز، معوي C. diff</text><text x="167" y="423" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">ونوروفيروس وروتا (صابون وماء)، التهاب ملتحمة</text><rect x="20" y="548" width="600" height="70" rx="10" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="320" y="572" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">ملاحظة: غسل اليدين بالماء والصابون (وليس المطهر) في إسهال C. diff والنوروفيروس</text><text x="320" y="594" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">التهاب الكبد A ينتقل بالبراز: انتبه مع المرضى المصابين بالسلس</text>
</svg>
