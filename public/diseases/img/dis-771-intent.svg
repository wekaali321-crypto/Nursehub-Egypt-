<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="190" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">طرق الالتئام</text><rect x="12" y="44" width="616" height="30" rx="8" fill="#0f172a"/><text x="544.5833333333333" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">النوع</text><text x="332.83333333333326" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">متى؟</text><text x="108.24999999999994" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">مثال</text><rect x="12" y="74" width="616" height="28" fill="#fff"/><text x="544.5833333333333" y="92" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">أولي (Primary)</text><text x="332.83333333333326" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">حواف متقاربة نظيفة</text><text x="108.24999999999994" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">جرح جراحي مخيط</text><rect x="12" y="102" width="616" height="28" fill="#f1f5f9"/><text x="544.5833333333333" y="120" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">ثانوي (Secondary)</text><text x="332.83333333333326" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">جرح كبير/ملوث/عضة تترك مفتوحاً</text><text x="108.24999999999994" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">قرح الضغط، العضات</text><rect x="12" y="130" width="616" height="44" fill="#fff"/><text x="544.5833333333333" y="148" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">أولي متأخر (Tertiary)</text><text x="332.83333333333326" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">يُترك أياماً ثم يُغلق بعد التأكد من</text><text x="332.83333333333326" y="164" text-anchor="middle" font-siz