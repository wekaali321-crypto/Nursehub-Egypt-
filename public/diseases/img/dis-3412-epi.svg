<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" width="640" height="324" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="الإبينفرين وقلم الحقن (Epi-Pen) في التأق"><rect width="640" height="324" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">الإبينفرين وقلم الحقن (Epi-Pen) في التأق</text><rect x="326.0" y="46" width="302.0" height="152" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="326.0" y="60" width="302.0" height="14" fill="#b42318"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الاستعمال والآلية</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• التأق (Anaphylaxis): تفاعل تحسسي شديد</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• رافع ضغط يرفع الضغط والتنفس والنبض</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• أول دواء في التأق</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• أول علامات التأق (شرى، ضيق نفس، هبوط</text><text x="616.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">   ضغط): استعمل Epi-Pen</text><text x="616.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">• كرّر كل 5–15 دقيقة حتى تزول الأعراض</text><rect x="12.0" y="46" width="302.0" height="98" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="12.0" y="60" width="302.0" height="14" fill="#a86a00"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">تأثيرات متوقعة</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• تسرع القلب (فوق 100)</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• خفقان</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• دوخة</text><rect x="12.0" y="156" width="302.0" height="134" rx="10" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.2"/><rect x="12.0" y="156" width="302.0" height="28" rx="10" fill="#2e7d4f"/><rect x="12.0" y="170" width="302.0" height="14" fill="#2e7d4f"/><text x="163.0" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">كيف تستعمل Epi-Pen</text><text x="302.0" y="204" text-anchor="start" font-size="12.5" fill="#1d2939">• حقن في الفخذ الخارجي بزاوية 90° عند أول</text><text x="302.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">   عرض</text><text x="302.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• اضغط وثبّت 10 ثوانٍ (حسب النشرة)</text><text x="302.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• اذهب للمستشفى فورًا</text><text x="302.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">• خزّنه في مكان معتم بحرارة الغرفة</text><rect x="326.0" y="210" width="302.0" height="98" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="210" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="224" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="229" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">ترتيب العلاج</text><text x="616.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• 1) Epinephrine</text><text x="616.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">• 2) Diphenhydramine</text><text x="616.0" y="294" text-anchor="start" font-size="12.5" fill="#1d2939">• 3) Albuterol + ستيرويد</text></svg>