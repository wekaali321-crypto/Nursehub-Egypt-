<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="340" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">المفصل السليم مقابل خشونة المفصل (Osteoarthritis)</text><rect x="125" y="60" width="90" height="70" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="125" y="130" width="90" height="12" rx="6" fill="#7dd3fc"/><rect x="125" y="156" width="90" height="12" rx="6" fill="#7dd3fc"/><rect x="125" y="168" width="90" height="70" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="425" y="60" width="90" height="70" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><rect x="425" y="130" width="90" height="12" rx="6" fill="#7dd3fc"/><rect x="425" y="138" width="90" height="12" rx="6" fill="#7dd3fc"/><rect x="425" y="150" width="90" height="70" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><polygon points="420,135 412,125 420,148" fill="#f97316"/><polygon points="520,135 528,125 520,148" fill="#f97316"/><polygon points="420,150 410,160 420,175" fill="#f97316"/><polygon points="520,150 530,160 520,175" fill="#f97316"/><text x="170" y="275" text-anchor="middle" font-size="15" font-weight="800" fill="#166534">مفصل سليم</text><text x="170" y="295" text-anchor="middle" font-size="12.5" fill="#166534">غضروف سميك، فراغ مفصلي واسع</text><text x="470" y="275" text-anchor="middle" font-size="15" font-weight="800" fill="#9a3412">خشونة المفصل</text><text x="470" y="295" text-anchor="middle" font-size="12.5" fill="#9a3412">غضروف رقيق، فراغ ضيّق، نتوءات عظمية (Osteophytes)</text><text x="320" y="325" text-anchor="middle" font-size="12.5" fill="#475569">الأشعة العادية تكشف ضيق الفراغ والنتوءات، والرنين يوضح الغضروف</text></svg>