<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 356" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="356" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >الفطريات الجلدية: ثلاث مجموعات</text><rect x="240" y="44" width="160" height="40" rx="12" fill="#1e293b"/><text x="320" y="70" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" direction="ltr">Fungal skin infections</text><line x1="320" y1="84" x2="115" y2="120" stroke="#475569" stroke-width="2"/><rect x="20" y="120" width="190" height="190" rx="14" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><text x="115" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#16a34a" direction="ltr">Tinea</text><text x="115" y="174" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a" >فطريات جلدية</text><text x="115" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" direction="ltr">capitis (فروة الرأس)</text><text x="115" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" direction="ltr">corporis (الجسم)</text><text x="115" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" direction="ltr">onychomycosis (الأظافر)</text><text x="115" y="278" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" direction="ltr">pedis &amp; manum (قدم ويد)</text><line x1="320" y1="84" x2="320" y2="120" stroke="#475569" stroke-width="2"/><rect x="225" y="120" width="190" height="190" rx="14" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><text x="320" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#ea580c" direction="ltr">TVC</text><text x="320" y="174" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a" >Pityriasis versicolor</text><text x="320" y="215" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155" >بقع فاتحة/داكنة</text><text x="320" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155" >الرقبة والظهر</text><line x1="320" y1="84" x2="525" y2="120" stroke="#475569" stroke-width="2"/><rect x="430" y="120" width="190" height="190" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><text x="525" y="150" text-anchor="middle" font-size="17" font-weight="800" fill="#7c3aed" direction="ltr">Candida</text><text x="525" y="174" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a" >Moniliasis</text><text x="525" y="215" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155" >نقط بيضاء + التهاب</text><text x="525" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#334155" >الحفاض والفم</text><text x="320" y="336" text-anchor="middle" font-size="13" font-weight="700" fill="#475569" >التشخيص من الشكل والمكان ← يحدد الدواء والمدة</text>
</svg>
