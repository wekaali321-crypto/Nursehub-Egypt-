<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 589" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="589" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تفاعلات نقل الدم الأربعة: حروف FACH</text><text x="320" y="50" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">وأولويات التصرف عند حدوثها</text><rect x="325" y="70" width="305" height="94.19999999999999" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M325,80 a10,10 0 0 1 10,-10 h285 a10,10 0 0 1 10,10 v18 h-305 z" fill="#16a34a"/><text x="477.5" y="89" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">F — حموي/تحسسي خفيف</text><text x="620" y="113" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• احمرار وتورد الجلد</text><text x="620" y="130.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• حكة</text><text x="620" y="147.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• (الحمى والرعشة في النوع الحموي)</text><rect x="10" y="70" width="305" height="94.19999999999999" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,80 a10,10 0 0 1 10,-10 h285 a10,10 0 0 1 10,10 v18 h-305 z" fill="#ea580c"/><text x="162.5" y="89" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">A — تحسسي شديد (Anaphylaxis)</text><text x="305" y="113" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أزيز صدر (Wheezing)</text><text x="305" y="130.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• شرى (Hives)</text><text x="305" y="147.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• هبوط ضغط</text><rect x="325" y="172.2" width="305" height="129.0" rx="10" fill="#fff" stroke="#db2777" stroke-width="1.5"/><path d="M325,182.2 a10,10 0 0 1 10,-10 h285 a10,10 0 0 1 10,10 v18 h-305 z" fill="#db2777"/><text x="477.5" y="191.2" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">C — حمل زائد دورة (Overload)</text><text x="620" y="215.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• خراخر رئوية (Crackles)</text><text x="620" y="232.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قلق وعدم ارتياح</text><text x="620" y="250.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• بول غامق، ضيق نفس</text><text x="620" y="267.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• احتقان أوردة الرقبة JVD</text><text x="620" y="284.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الخطر: قصور قلب/سوائل كثيرة</text><rect x="10" y="172.2" width="305" height="111.6" rx="10" fill="#fff" stroke="#4f46e5" stroke-width="1.5"/><path d="M10,182.2 a10,10 0 0 1 10,-10 h285 a10,10 0 0 1 10,10 v18 h-305 z" fill="#4f46e5"/><text x="162.5" y="191.2" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">H — انحلالي (Hemolytic)</text><text x="305" y="215.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• هبوط ضغط وحمى</text><text x="305" y="232.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ألم أسفل الظهر</text><text x="305" y="250.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• سرعة قلب</text><text x="305" y="267.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• عيّنة بول: فحص انحلال RBC</text><rect x="10" y="311.2" width="620" height="66" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><text x="320" y="331.2" text-anchor="middle" font-size="14" font-weight="800" fill="#155e75">حمل زائد: HOPE</text><circle cx="608" cy="354.2" r="11" fill="#0891b2"/><text x="608" y="359.2" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" direction="ltr">H</text><text x="592" y="358.2" text-anchor="start" font-size="11.5" font-weight="700" fill="#0f172a">ارفع الرأس</text><circle cx="456" cy="354.2" r="11" fill="#0891b2"/><text x="456" y="359.2" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" direction="ltr">O</text><text x="440" y="358.2" text-anchor="start" font-size="11.5" font-weight="700" fill="#0f172a">أكسجين</text><circle cx="304" cy="354.2" r="11" fill="#0891b2"/><text x="304" y="359.2" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" direction="ltr">P</text><text x="288" y="358.2" text-anchor="start" font-size="11.5" font-weight="700" fill="#0f172a">مدرّات (فوروسيمايد)</text><circle cx="152" cy="354.2" r="11" fill="#0891b2"/><text x="152" y="359.2" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" direction="ltr">E</text><text x="136" y="358.2" text-anchor="start" font-size="11.5" font-weight="700" fill="#0f172a">أوقف كل السوائل</text><rect x="10" y="389.2" width="620" height="152" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="320" y="409.2" text-anchor="middle" font-size="14" font-weight="800" fill="#991b1b">الأولويات عند الشك في أي تفاعل (خصوصًا الانحلالي)</text><text x="606" y="431.2" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">1) أبطئ أو أوقف النقل فورًا</text><text x="606" y="452.2" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">2) غيّر الأنبوب (Tubing) جديد وعلّق محلول 0.9% صوديوم كلوريد</text><text x="606" y="473.2" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">3) بلّغ الطبيب فورًا</text><text x="606" y="494.2" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">4) قيّم العلامات الحيوية (ضغط/نبض/تنفس)</text><text x="606" y="515.2" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">5) خذ عيّنة بول وعيّنة دم، وراقب البوتاسيوم</text><text x="320" y="561.2" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">انحلال الكرات يرفع البوتاسيوم (أعلى من 5.0): موجة T مدببة وخطر على القلب</text></svg>