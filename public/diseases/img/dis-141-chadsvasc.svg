<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 444" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="444" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a" >تقدير خطر الجلطة المخية في AF (CHA₂DS₂-VASc)</text><rect x="30" y="44" width="580" height="34" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="556" y="44" width="54" height="34" rx="8" fill="#2563eb"/><text x="583" y="67" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >+1</text><text x="540" y="66" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a" >C — فشل القلب / ضعف البطين</text><rect x="30" y="84" width="580" height="34" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="556" y="84" width="54" height="34" rx="8" fill="#2563eb"/><text x="583" y="107" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >+1</text><text x="540" y="106" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a" >H — ارتفاع الضغط</text><rect x="30" y="124" width="580" height="34" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="556" y="124" width="54" height="34" rx="8" fill="#2563eb"/><text x="583" y="147" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >+2</text><text x="540" y="146" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a" >A₂ — السن 75 سنة أو أكتر</text><rect x="30" y="164" width="580" height="34" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="556" y="164" width="54" height="34" rx="8" fill="#2563eb"/><text x="583" y="187" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >+1</text><text x="540" y="186" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a" >D — السكر</text><rect x="30" y="204" width="580" height="34" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="556" y="204" width="54" height="34" rx="8" fill="#2563eb"/><text x="583" y="227" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >+2</text><text x="540" y="226" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a" >S₂ — سكتة / نوبة إقفارية / انصمام سابق</text><rect x="30" y="244" width="580" height="34" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="556" y="244" width="54" height="34" rx="8" fill="#2563eb"/><text x="583" y="267" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >+1</text><text x="540" y="266" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a" >V — مرض أوعية (جلطة قلب، شرايين طرفية)</text><rect x="30" y="284" width="580" height="34" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="556" y="284" width="54" height="34" rx="8" fill="#2563eb"/><text x="583" y="307" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >+1</text><text x="540" y="306" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a" >A — السن 65–74</text><rect x="30" y="324" width="580" height="34" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="556" y="324" width="54" height="34" rx="8" fill="#2563eb"/><text x="583" y="347" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >+1</text><text x="540" y="346" text-anchor="start" font-size="13.5" font-weight="700" fill="#0f172a" >Sc — الجنس: أنثى</text><rect x="30" y="368" width="580" height="62" rx="10" fill="#fef3c7"/><text x="320" y="392" text-anchor="middle" font-size="12.5" font-weight="800" fill="#92400e" >0 (رجال) أو 1 (نساء): غالباً لا يحتاج مضاد تجلط  |  1 (رجال): يُنظر فيه  |  2 فأكثر: مضاد تجلط موصى به</text><text x="320" y="414" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e" >القرار للطبيب مع تقدير خطر النزيف</text>
</svg>
