<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 324" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="324" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">البتر وعناية الجذع المتبقي</text><rect x="330" y="52" width="300" height="94.19999999999999" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الفكرة</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• بتر طرف، شائع في السكري مع عدوى شديدة</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الأكثر اختبارًا: البتر تحت الركبة</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (دوران ودة أفضل والتئام أفضل)</text><rect x="10" y="52" width="310" height="129.0" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#dc2626"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">بعد الجراحة</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• لا ترفع الطرف (نقطة امتحان)</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• يبقى في وضع متدلٍّ حسب الحالة</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ألم الطرف الشبح (Phantom limb)</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• القلق عند ألم مستمر بموضع الجراحة</text><text x="310" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (Kaplan)</text><rect x="330" y="189.0" width="300" height="111.6" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M330,199.0 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#16a34a"/><text x="480.0" y="208.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">تثقيف الخروج: الرعاية اليومية</text><text x="620" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قيّم الاحمرار والتهيج</text><text x="620" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• اغسل الجذع يوميًا بالماء والصابون</text><text x="620" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• عرّضه للهواء</text><text x="620" y="284.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الجوارب واللفافات نظيفة وجافة</text><rect x="10" y="189.0" width="310" height="111.6" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M10,199.0 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#7c3aed"/><text x="165.0" y="208.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الوضعية</text><text x="310" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الاستلقاء على البطن (Prone) 30 دقيقة × 3</text><text x="310" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  مرات يوميًا</text><text x="310" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ادفع الجذع نحو السرير</text><text x="310" y="284.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• سؤال: ضماد مؤرخ منذ يومين = تدخل</text></svg>