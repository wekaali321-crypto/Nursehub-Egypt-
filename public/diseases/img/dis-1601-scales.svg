<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 370" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="370" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أداة الأطراف لقراءة ABG (pH وCO₂ وHCO₃)</text>
<text x="320" y="60" text-anchor="middle" font-size="13" font-weight="700" fill="#475569" >أداة الأطراف: كل مؤشر له طرف حمضي (A) وطرف قاعدي (B)</text><text x="560" y="98" text-anchor="middle" font-size="15" font-weight="800" fill="#7c3aed" >pH</text><line x1="110" y1="90" x2="400" y2="90" stroke="#334155" stroke-width="3" /><circle cx="110" cy="90" r="7" fill="#334155"/><circle cx="110" cy="64" r="13" fill="#dc2626"/><text x="110" y="69" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >A</text><text x="110" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a" direction="ltr">7.35</text><circle cx="400" cy="90" r="7" fill="#334155"/><circle cx="400" cy="64" r="13" fill="#6366f1"/><text x="400" y="69" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >B</text><text x="400" y="114" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a" direction="ltr">7.45</text><text x="560" y="176" text-anchor="middle" font-size="15" font-weight="800" fill="#0ea5e9" >PaCO₂ (رئة)</text><line x1="110" y1="168" x2="400" y2="168" stroke="#334155" stroke-width="3" /><circle cx="110" cy="168" r="7" fill="#334155"/><circle cx="110" cy="142" r="13" fill="#6366f1"/><text x="110" y="147" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >B</text><text x="110" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a" direction="ltr">35</text><circle cx="400" cy="168" r="7" fill="#334155"/><circle cx="400" cy="142" r="13" fill="#dc2626"/><text x="400" y="147" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >A</text><text x="400" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a" direction="ltr">45</text><text x="560" y="254" text-anchor="middle" font-size="15" font-weight="800" fill="#f59e0b" >HCO₃ (كلى)</text><line x1="110" y1="246" x2="400" y2="246" stroke="#334155" stroke-width="3" /><circle cx="110" cy="246" r="7" fill="#334155"/><circle cx="110" cy="220" r="13" fill="#dc2626"/><text x="110" y="225" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >A</text><text x="110" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a" direction="ltr">22</text><circle cx="400" cy="246" r="7" fill="#334155"/><circle cx="400" cy="220" r="13" fill="#6366f1"/><text x="400" y="225" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" >B</text><text x="400" y="270" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a" direction="ltr">26</text><text x="320" y="330" text-anchor="middle" font-size="12.5" font-weight="600" fill="#475569" >القيمة خارج الخط على ناحية A تعني حمضاً، وعلى ناحية B تعني قلوياً. المنتصف طبيعي.</text><text x="320" y="352" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e" >مثال: pH 7.25 وCO₂ 55 يقعان على ناحية A معاً = حماض تنفسي</text>
</svg>
