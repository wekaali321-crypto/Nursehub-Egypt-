<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 314" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="314" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">اضطراب الهوية التفارقي (⁦Dissociative Identity Disorder⁩)</text><rect x="434.66666666666663" y="50" width="185.33333333333334" height="75.8" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M434.66666666666663 60a10 10 0 0 1 10-10h165.33333333333334a10 10 0 0 1 10 10v22h-185.33333333333334z" fill="#b91c1c"/><text x="527.3333333333333" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">صدمة نفسية</text><text x="610" y="96" text-anchor="start" font-size="12" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="598" y="96" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">اعتداء أو اغتصاب</text><line x1="432.66666666666663" y1="87.9" x2="414.66666666666663" y2="87.9" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="227.3333333333333" y="50" width="185.33333333333334" height="75.8" rx="10" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><path d="M227.3333333333333 60a10 10 0 0 1 10-10h165.33333333333334a10 10 0 0 1 10 10v22h-185.33333333333334z" fill="#6d28d9"/><text x="319.99999999999994" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">آلية حماية</text><text x="402.66666666666663" y="96" text-anchor="start" font-size="12" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="390.66666666666663" y="96" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">هويات متعددة وفجوات ذاكرة</text><line x1="225.3333333333333" y1="87.9" x2="207.3333333333333" y2="87.9" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="19.999999999999943" y="50" width="185.33333333333334" height="75.8" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><path d="M19.999999999999943 60a10 10 0 0 1 10-10h165.33333333333334a10 10 0 0 1 10 10v22h-185.33333333333334z" fill="#c2410c"/><text x="112.66666666666661" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">مثير</text><text x="195.3333333333333" y="96" text-anchor="start" font-size="12" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="183.3333333333333" y="96" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">توتر أو قلق يذكّر بالصدمة</text><text x="183.3333333333333" y="113.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">فتظهر الهويات</text><rect x="326" y="139.8" width="294" height="161.75" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><path d="M326 149.8a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#15803d"/><text x="473" y="160.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التمريض (⁦5⁩ نقاط)</text><text x="610" y="186.3" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="186.3" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">تقنيات التأريض: تنفس عميق، عدّ العملات،</text><text x="598" y="204.425" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">إمساك مكعب ثلج</text><text x="610" y="225.55" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="225.55" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">يوميات للمشاعر والمثيرات</text><text x="610" y="246.675" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="246.675" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">بناء ثقة مع كل هوية</text><text x="610" y="267.8" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="267.8" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">راقب وأنصت لتعبيرات إيذاء الذات</text><text x="610" y="288.925" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="288.925" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لا تطلب أبداً من المريض استرجاع الذكريات</text><rect x="20" y="139.8" width="294" height="161.75" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/><path d="M20 149.8a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#0e7490"/><text x="167" y="160.8" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الهدف ومؤشر النجاح</text><text x="304" y="186.3" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="292" y="186.3" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">دمج الهويات في شخصية واحدة بدمج الأحداث</text><text x="292" y="204.425" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الماضية</text><text x="304" y="225.55" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="292" y="225.55" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">النجاح: المريض دمج أحداثه الماضية</text></svg>