<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="270" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">متى نقول «سكر»؟ (مجرد معيار واحد يكفي)</text>
  <g text-anchor="middle" font-size="14" font-weight="700">
    <rect x="20" y="52" width="190" height="120" rx="12" fill="#2563eb"/><text x="115" y="82" fill="#fff">1) سكر صايم</text><text x="115" y="112" fill="#fff" direction="ltr">≥ 126 mg/dl</text><text x="115" y="140" font-size="12" fill="#dbeafe">في مناسبتين مختلفتين</text>
    <rect x="225" y="52" width="190" height="120" rx="12" fill="#7c3aed"/><text x="320" y="82" fill="#fff">2) بعد ساعتين من الأكل</text><text x="320" y="112" fill="#fff" direction="ltr">≥ 200 mg/dl</text><text x="320" y="140" font-size="12" fill="#ede9fe">(2-hr post-prandial)</text>
    <rect x="430" y="52" width="190" height="120" rx="12" fill="#dc2626"/><text x="525" y="82" fill="#fff">3) أعراض + سكر عشوائي</text><text x="525" y="112" fill="#fff" direction="ltr">≥ 200 mg/dl</text><text x="525" y="140" font-size="12" fill="#fecaca">(عطش، تبول، جوع...)</text>
  </g>
  <rect x="20" y="190" width="600" height="60" rx="12" fill="#e2e8f0"/>
  <text x="320" y="215" text-anchor="middle" font-size="13" fill="#0f172a">الطبيعي: صايم 70–110 ، بعد ساعتين أقل من 140 (المعيار التقليدي)</text>
  <text x="320" y="238" text-anchor="middle" font-size="13" fill="#475569">والتراكمي HbA1c ≥ 6.5% يُستخدم أيضاً في التشخيص حسب الإرشادات الحديثة</text>
</svg>
