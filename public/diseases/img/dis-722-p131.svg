<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">كرون مقابل التهاب القولون التقرحي</text><rect x="425" y="48" width="195" height="182" rx="12" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-width="1.5"/><rect x="425" y="48" width="195" height="34" rx="12" fill="#22c55e"/><text x="523" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">القولون التقرحي (UC)</text><text x="523" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">التهاب وتقرحات بالقولون</text><text x="523" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">15–20 براز دموي سائل/يوم</text><text x="523" y="152" text-anchor="middle" font-size="12.5" fill="#0f172a">فقر دم، هيموجلوبين وهيماتوكريت منخفضان</text><text x="523" y="176" text-anchor="middle" font-size="12.5" fill="#0f172a">ألم ارتدادي: أبلغ</text><rect x="223" y="48" width="195" height="182" rx="12" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1.5"/><rect x="223" y="48" width="195" height="34" rx="12" fill="#ef4444"/><text x="320" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">كرون (Crohn)</text><text x="320" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">من الفم للشرج وأكثره الدقيقة</text><text x="320" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">بقع متفرقة (Skip lesions)</text><text x="320" y="152" text-anchor="middle" font-size="12.5" fill="#0f172a">حبيبومات وناسور وخراج</text><text x="320" y="176" text-anchor="middle" font-size="12.5" fill="#0f172a">نحو 5 مرات/يوم مخاط/قيح، دهنيات</text><rect x="20" y="48" width="195" height="182" rx="12" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-width="1.5"/><rect x="20" y="48" width="195" height="34" rx="12" fill="#6366f1"/><text x="117" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المشتركات</text><text x="117" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">IBD مناعة ذاتية</text><text x="117" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">محفزات: توتر، تدخين، عدوى</text>
