<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="400" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أنواع الملينات: سرعة المفعول والاستخدام</text>
  <g font-size="13" text-anchor="middle">
    <rect x="20" y="48" width="600" height="68" rx="10" fill="#dbeafe"/>
    <text x="520" y="72" font-weight="800" fill="#1e3a8a">محجِّمة (Bulk)</text><text x="520" y="92" font-size="11" fill="#1e3a8a">Agiolax, Biolax, Evaculax, النخالة</text>
    <text x="250" y="72" fill="#1e3a8a">يبدأ مفعولها بعد 1–3 أيام: وقاية وإمساك مزمن</text><text x="250" y="94" font-size="11" fill="#1e3a8a">لازم ماء كتير</text>
    <rect x="20" y="124" width="600" height="68" rx="10" fill="#dcfce7"/>
    <text x="520" y="148" font-weight="800" fill="#14532d">أسموزية (Osmotic)</text><text x="520" y="168" font-size="11" fill="#14532d">Lactulose / Duphalac</text>
    <text x="250" y="148" fill="#14532d">1–3 أيام: إمساك مزمن، آمن في الحمل</text><text x="250" y="170" font-size="11" fill="#14532d">حذر في السكر</text>
    <rect x="20" y="200" width="600" height="68" rx="10" fill="#fef9c3"/>
    <text x="520" y="224" font-weight="800" fill="#713f12">ملحية (Saline)</text><text x="520" y="244" font-size="11" fill="#713f12">Laxel أكياس، Enemax حقنة</text>
    <text x="250" y="224" fill="#713f12">30 دقيقة (حقنة) – 5 ساعات (أكياس): إمساك حاد</text><text x="250" y="246" font-size="11" fill="#713f12">ليست للقلب/الضغط/الكلى/الأطفال</text>
    <rect x="20" y="276" width="600" height="68" rx="10" fill="#fee2e2"/>
    <text x="520" y="300" font-weight="800" fill="#7f1d1d">منبّهة (Stimulant)</text><text x="520" y="320" font-size="11" fill="#7f1d1d">Sennalax, Bisadyl, Abilaxine, Picolax</text>
    <text x="250" y="300" fill="#7f1d1d">لبوس: سريع • أقراص: بطيء (ليلاً)</text><text x="250" y="322" font-size="11" fill="#7f1d1d">لا تزيد عن أسبوع: إسهال وإدمان</text>
    <rect x="20" y="352" width="600" height="38" rx="10" fill="#f1f5f9"/>
    <text x="320" y="376" fill="#334155" font-size="12">مطرّي: Glycerin لبوس (للكبار والأطفال) • التهاب موضعي لو أُفرط فيه</text>
  </g>
</svg>
