<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="430" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">nitroglycerin: أقراص/بخاخ مقابل اللصقة</text><rect x="330" y="45" width="295" height="45" rx="10" fill="#fee2e2"/><text x="477.5" y="72.5" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">O2 للقلب: يوسّع الأوعية ويخفف الحمل</text><rect x="330" y="105" width="295" height="215" rx="10" fill="#dbeafe"/><text x="477.5" y="137.5" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">أقراص تحت اللسان / بخاخ</text><text x="477.5" y="157.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">للذبحة المستقرة (Stable)</text><text x="477.5" y="177.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تُؤخذ قبل المجهود الشديد</text><text x="477.5" y="197.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">الهدف: لا ألم صدر في الأنشطة اليومية</text><text x="477.5" y="217.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">لو ألم بعد أول جرعة بـ 5 د: اتصل بالإسعاف</text><text x="477.5" y="237.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">حد أقصى 3 جرعات بفاصل 5 دقائق</text><text x="477.5" y="257.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">لا تبلع: تحت اللسان</text><text x="477.5" y="277.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">احفظ بعيدًا عن الضوء والحرارة</text><text x="477.5" y="297.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">استبدل كل 6 أشهر</text><rect x="15" y="105" width="295" height="215" rx="10" fill="#dcfce7"/><text x="162.5" y="137.5" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">لصقة جلدية</text><text x="162.5" y="157.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">للذبحة غير المستقرة</text><text x="162.5" y="177.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">مرة يوميًا (ليست عند اللزوم)</text><text x="162.5" y="197.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">لصقة واحدة فقط</text><text x="162.5" y="217.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">الاستحمام مسموح</text><text x="162.5" y="237.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">بدّل الموضع يوميًا</text><text x="162.5" y="257.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">جلد نظيف جاف غير مشعّر</text><text x="162.5" y="277.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">أعلى الجسم (تحت الترقوة، الذراع، الصدر)</text><text x="162.5" y="297.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">ليس جلدًا مجروحًا أو متكلسًا</text><rect x="15" y="340" width="610" height="75" rx="10" fill="#fef9c3"/><text x="320" y="373.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تحذير: ممنوع مع sildenafil وأخواته (-afil): خطر هبوط ضغط مميت</text><text x="320" y="391.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">عرَض طبيعي: صداع؛ عرَض ضار: هبوط الضغط فعلّم تغيير الوضع ببطء</text></svg>