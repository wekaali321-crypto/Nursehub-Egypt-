<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 318" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="318" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >اختبار الضوء المتأرجح: RAPD</text><circle cx="110" cy="130" r="48" fill="#fff" stroke="#94a3b8" stroke-width="2"/><circle cx="250" cy="130" r="48" fill="#fff" stroke="#94a3b8" stroke-width="2"/><circle cx="110" cy="130" r="12" fill="#111827"/><circle cx="250" cy="130" r="12" fill="#111827"/><text x="180" y="215" text-anchor="middle" font-size="13" font-weight="800" fill="#16a34a" >الضوء على العين السليمة (يسار الصورة): الحدقتان تضيقان</text><circle cx="390" cy="130" r="48" fill="#fff" stroke="#94a3b8" stroke-width="2"/><circle cx="530" cy="130" r="48" fill="#fff" stroke="#94a3b8" stroke-width="2"/><circle cx="390" cy="130" r="26" fill="#111827"/><circle cx="530" cy="130" r="12" fill="#111827"/><text x="460" y="215" text-anchor="middle" font-size="13" font-weight="800" fill="#dc2626" >الضوء ينتقل للمريضة: تتّسع</text><rect x="30" y="240" width="580" height="60" rx="12" fill="#fef3c7"/><text x="320" y="264" text-anchor="middle" font-size="13" font-weight="800" fill="#92400e" >العين المريضة تتسع عند وصول الضوء إليها (لا يوجد direct reflex) — Marcus Gunn pupil</text><text x="320" y="286" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e" >عند الضوء على العين السليمة تضيق الحدقتان طبيعياً (consensual)</text>
</svg>
