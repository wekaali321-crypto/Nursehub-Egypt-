<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 252" width="640" height="252" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="NMS: متلازمة الذهان الخبيث"><rect width="640" height="252" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">NMS: متلازمة الذهان الخبيث</text><rect x="326.0" y="46" width="302.0" height="116" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="326.0" y="60" width="302.0" height="14" fill="#b42318"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">علامات NMS (Haloperidol)</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• حمّى عالية وتعرق غزير</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• تغير الحالة العقلية</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• تيبّس عضلي</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• رعشة</text><rect x="12.0" y="46" width="302.0" height="116" rx="10" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#2e7d4f"/><rect x="12.0" y="60" width="302.0" height="14" fill="#2e7d4f"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الإجراء (3 خطوات)</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• 1) أوقف/احجب Haloperidol</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• 2) قيّم المريض</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• 3) أبلغ الطبيب فورًا — الحالة تهدد</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">   الحياة</text><rect x="326.0" y="174" width="302.0" height="62" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="326.0" y="174" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="326.0" y="188" width="302.0" height="14" fill="#a86a00"/><text x="477.0" y="193" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">مثال لا يحتاج إبلاغ فوريًا لـ Clozapine</text><text x="616.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• زيادة وزن، سيلان لعاب، نعاس</text></svg>