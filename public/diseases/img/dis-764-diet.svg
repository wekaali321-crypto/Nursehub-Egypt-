<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 283" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="283" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">حمية الفشل الكلوي</text><rect x="326" y="56" width="298" height="128" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><rect x="326" y="56" width="298" height="30" rx="12" fill="#2563eb"/><text x="475" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">صوديوم منخفض</text><text x="614" y="108" text-anchor="end" font-size="13" fill="#1e3a8a">لا أطعمة معلبة أو مصنعة أو لحوم مصنعة</text><rect x="16" y="56" width="298" height="128" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><rect x="16" y="56" width="298" height="30" rx="12" fill="#d97706"/><text x="165" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">بوتاسيوم منخفض</text><text x="304" y="108" text-anchor="end" font-size="13" fill="#78350f">أفضل خيار: التفاح</text><text x="304" y="127" text-anchor="end" font-size="13" fill="#78350f">ممنوع: بدائل الملح، السبانخ، الأفوكادو،</text><text x="304" y="146" text-anchor="end" font-size="13" fill="#78350f">الجزر، الطماطم، الفراولة، البرتقال،</text><text x="304" y="165" text-anchor="end" font-size="13" fill="#78350f">الموز</text><rect x="326" y="196" width="298" height="71" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><rect x="326" y="196" width="298" height="30" rx="12" fill="#16a34a"/><text x="475" y="217" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">فوسفور منخفض</text><text x="614" y="248" text-anchor="end" font-size="13" fill="#14532d">لا ألبان: زبادي، بودينغ، حليب</text><rect x="16" y="196" width="298" height="71" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><rect x="16" y="196" width="298" height="30" rx="12" fill="#7c3aed"/><text x="165" y="217" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">بروتين منخفض</text><text x="304" y="248" text-anchor="end" font-size="13" fill="#4c1d95">تقليل البروتين</text></svg>