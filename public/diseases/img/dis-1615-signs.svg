<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="290" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">علامات PVD وPAD وتدخلات التمريض</text>
<rect x="14" y="44" width="300" height="230" rx="10" fill="#fff" stroke="#0891b2" stroke-width="1.5"/><rect x="14" y="44" width="300" height="26" rx="10" fill="#0891b2"/><text x="164.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >علامات PVD (الأوردة)</text><text x="304" y="89" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >نبض واضح وساق دافئة</text><text x="304" y="107.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >وذمة (تجمع دم)</text><text x="304" y="126.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >قرح غير منتظمة الشكل</text><text x="304" y="144.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >ألم خفيف (ممل) وليس حاداً</text><text x="304" y="163.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >بقع صفراء وبنية حول الكاحل</text><text x="304" y="181.5" text-anchor="start" font-size="11.5" font-weight="600" fill="#0f172a" >العلاج: ارفع الساقين (Elevate)</text><rect x="326" y="44" width="300" height="230" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><rect x="326" y="44" width="300" height="26" rx="10" fill="#dc2626"/><text x="476.0" y="62" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff" >علامات PAD (الشرايين)</text><text x="616" y="89" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >غياب النبض وجلد لامع بارد وفقد شعر</text><text x="616" y="107" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >قرح مستديرة عميقة</text><text x="616" y="125" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >أصابع/قدم شاحبة أو سوداء (نخر)</text><text x="616" y="143" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >ألم حاد بالسمانة (عرج متقطع) يزيد بالمجهود</text><text x="616" y="161" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a" >العلاج: تدلية الساقين (Hang) لا رفع</text>
</svg>
