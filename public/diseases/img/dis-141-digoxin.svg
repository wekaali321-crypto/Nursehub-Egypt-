<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="640" height="400" rx="16" fill="#f8fafc"/>
<text x="320.0" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">جدول الديجوكسين الوريدي في AF (مثال لمسار الجرعة الكلية 1–1.5 مجم/يوم)</text>
<rect x="30" y="44" width="580" height="50" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="320.0" y="64.41666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#78350f">الخطوة 1: دفعة 0.5 مجم (أمبول واحد) في 100 مل ملح أو جلوكوز 5%</text>
<text x="320.0" y="81.91666666666667" text-anchor="middle" font-size="12.5" font-weight="600" fill="#78350f">على 30 دقيقة</text>
<line x1="320" y1="94" x2="320" y2="112" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="30" y="112" width="580" height="50" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="320.0" y="132.41666666666666" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">انتظر 8 ساعات ثم اعمل ECG وقيس النبض</text>
<text x="320.0" y="149.91666666666666" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">هل وصل النبض للهدف (60–90 راحة)؟</text>
<line x1="210" y1="162" x2="130" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="430" y1="162" x2="510" y2="190" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="200" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#15803d">نعم</text>
<text x="440" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#b91c1c">لا</text>
<rect x="30" y="190" width="260" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="160.0" y="217.41666666666666" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">كفاية: اوقف التحميل</text>
<text x="160.0" y="234.91666666666666" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14532d">وانتقل للجرعة الفموية للصيانة</text>
<rect x="350" y="190" width="260" height="64" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="480.0" y="217.41666666666666" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">كمل الصيانة وريدي</text>
<text x="480.0" y="234.91666666666666" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7f1d1d">(حسب الجرعة الكلية المقررة)</text>
<line x1="480" y1="254" x2="480" y2="272" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="30" y="272" width="580" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
<text x="320.0" y="297.5833333333333" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">الصيانة: إما 0.5 مجم لكل زجاجة سوائل (500 مل) على 8 ساعات مرتين (المجموع 1.5 مجم)</text>
<text x="320.0" y="314.0833333333333" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">أو 0.25 مجم (نصف أمبول) لكل 500 مل على 8 ساعات مرتين (المجموع 1 مجم)</text>
<text x="320" y="356" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">اخفض الجرعة في كبار السن وفشل الكلى • نقص البوتاسيوم يزيد خطر التسمم</text>
<text x="320" y="380" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">الجرعة والمدة بأمر الطبيب وبروتوكول المستشفى</text></svg>