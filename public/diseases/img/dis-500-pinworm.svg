<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="196" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الديدان الدبوسية (Pinworm): التشخيص والعلاج</text><rect x="325" y="48" width="295" height="132" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الأعراض والتشخيص</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">حكة شرجية تزيد ليلًا</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">اختبار الشريط: يُلصق صباحًا عند الاستيقاظ</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">على فتحة الشرج ويُرسل للمختبر</text><rect x="20" y="48" width="295" height="132" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الأدوية</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">ميبيندازول (Mebendazole)</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">ألبيندازول (Albendazole)</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">بيرانتيل باموات (Pyrantel pamoate) — راجع</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">الطبيب/الصيدلي</text>
</svg>
