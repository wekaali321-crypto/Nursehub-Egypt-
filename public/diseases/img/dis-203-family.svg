<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="400" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">عائلة البنسلينات (β-Lactam): الأنواع والأمثلة</text>
  <rect x="215" y="42" width="210" height="36" rx="10" fill="#0f766e"/><text x="320" y="65" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">البنسلينات Penicillins</text>
  <g stroke="#94a3b8" stroke-width="2"><line x1="320" y1="78" x2="320" y2="96"/><line x1="80" y1="96" x2="560" y2="96"/>
   <line x1="80" y1="96" x2="80" y2="112"/><line x1="200" y1="96" x2="200" y2="112"/><line x1="320" y1="96" x2="320" y2="112"/><line x1="440" y1="96" x2="440" y2="112"/><line x1="560" y1="96" x2="560" y2="112"/></g>
  <g font-size="12" font-weight="700" text-anchor="middle" fill="#fff">
   <rect x="20" y="112" width="120" height="44" rx="8" fill="#2563eb"/><text x="80" y="131">طبيعية</text><text x="80" y="147" font-size="11">Pen G · Pen V</text>
   <rect x="140" y="112" width="120" height="44" rx="8" fill="#7c3aed"/><text x="200" y="131">طويلة المفعول</text><text x="200" y="147" font-size="11">Procaine / Benz.</text>
   <rect x="260" y="112" width="120" height="44" rx="8" fill="#ea580c"/><text x="320" y="131">مقاومة للإنزيم</text><text x="320" y="147" font-size="11">Cloxacillin</text>
   <rect x="380" y="112" width="120" height="44" rx="8" fill="#16a34a"/><text x="440" y="131">واسعة الطيف</text><text x="440" y="147" font-size="11">Ampi / Amoxi</text>
   <rect x="500" y="112" width="120" height="44" rx="8" fill="#dc2626"/><text x="560" y="131">ضد الزائفة</text><text x="560" y="147" font-size="11">Pipril / Ticar.</text></g>
  <g font-size="11" fill="#0f172a" text-anchor="middle">
   <text x="80" y="178">4–6 ساعات</text><text x="80" y="194">تتحطم بالحمض</text><text x="80" y="210">Pen V فموي</text>
   <text x="200" y="178">Procaine: 12–24 س</text><text x="200" y="194">Benzathine: 1–4 أسبوع</text><text x="200" y="210">عضل فقط</text>
   <text x="320" y="178">ضد Staph</text><text x="320" y="194">Oxa / Clox / Fluclox</text><text x="320" y="210">Methicillin: MRSA</text>
   <text x="440" y="178">موجبة وسالبة</text><text x="440" y="194">ليس Pseudomonas</text><text x="440" y="210">Mecillinam (Amidino)</text>
   <text x="560" y="178">Carbenicillin</text><text x="560" y="194">Mezlo / Azlo / Pipera</text><text x="560" y="210">+ Gentamicin تآزر</text></g>
  <rect x="20" y="240" width="600" height="60" rx="10" fill="#fef3c7"/>
  <text x="320" y="264" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">مثبطات β-lactamase: Clavulanic acid · Sulbactam · Tazobactam</text>
  <text x="320" y="286" text-anchor="middle" font-size="12" fill="#92400e">تحمي البنسلين من الإنزيم: Augmentin (Amox + Clav) · Unasyn (Ampi + Sulbactam)</text>
  <rect x="20" y="314" width="600" height="68" rx="10" fill="#fee2e2"/>
  <text x="320" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">قبل أي بنسلين: اسأل عن الحساسية دائماً</text>
  <text x="320" y="360" text-anchor="middle" font-size="12" fill="#991b1b">صدمة تحسسية: 1 من كل 50 ألف · العلاج: أدرينالين + كورتيزون + مضاد هستامين</text>
</svg>
