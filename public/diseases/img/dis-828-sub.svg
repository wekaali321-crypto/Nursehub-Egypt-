<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 331" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="331" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">علامات المواد الشائعة الاستعمال</text><rect x="420" y="48" width="200" height="31" fill="#1e3a8a" stroke="#cbd5e1"/><text x="520" y="67.66666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">المادة</text><rect x="20" y="48" width="400" height="31" fill="#1e3a8a" stroke="#cbd5e1"/><text x="220" y="67.66666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">أبرز العلامات</text><rect x="420" y="79" width="200" height="48" fill="#fff" stroke="#cbd5e1"/><text x="520" y="107.16666666666667" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">كحول</text><rect x="20" y="79" width="400" height="48" fill="#fff" stroke="#cbd5e1"/><text x="220" y="98.91666666666667" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">كلام متلعثم، ضعف توازن، قلة كبح، عدم انتظام نبض، قلق،</text><text x="220" y="115.41666666666667" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">تشنج، فشل كبدي</text><rect x="420" y="127" width="200" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="520" y="146.66666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">منشطات (كوكايين، أمفيتامين)</text><rect x="20" y="127" width="400" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="220" y="146.66666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">حدقة متغيرة، شك، سرعة نبض، ضغط عالٍ، سكتة، ذهان، غيبوبة</text><rect x="420" y="158" width="200" height="31" fill="#fff" stroke="#cbd5e1"/><text x="520" y="177.66666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">أفيونات (هيروين)</text><rect x="20" y="158" width="400" height="31" fill="#fff" stroke="#cbd5e1"/><text x="220" y="177.66666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">حدقة دبوسية، قيء، ارتباك، بطء تنفس</text><rect x="420" y="189" width="200" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="520" y="208.66666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">بنزوديازبين/باربيتورات</text><rect x="20" y="189" width="400" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="220" y="208.66666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">هبوط ضغط، تخدير، ارتباك</text><rect x="420" y="220" width="200" height="31" fill="#fff" stroke="#cbd5e1"/><text x="520" y="239.66666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">ماريجوانا</text><rect x="20" y="220" width="400" height="31" fill="#fff" stroke="#cbd5e1"/><text x="220" y="239.66666666666666" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">ضعف ذاكرة وتناسق</text><rect x="420" y="251" width="200" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="520" y="270.6666666666667" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">مهلوسات (LSD)</text><rect x="20" y="251" width="400" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="220" y="270.6666666666667" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">هلوسة، سرعة نبض، هذيان</text><rect x="420" y="282" width="200" height="31" fill="#fff" stroke="#cbd5e1"/><text x="520" y="301.6666666666667" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">مستنشقات</text><rect x="20" y="282" width="400" height="31" fill="#fff" stroke="#cbd5e1"/><text x="220" y="301.6666666666667" text-anchor="middle" font-size="12.5" font-weight="500" fill="#0f172a">نشوة، ارتباك، هلوسة، فقد ذاكرة، قيء</text></svg>