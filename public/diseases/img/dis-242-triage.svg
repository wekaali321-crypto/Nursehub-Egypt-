<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="640" height="420" rx="16" fill="#f8fafc"/>
<text x="320.0" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ألم الصدر: 3 أنواع ومسار كل نوع</text>
<rect x="200" y="42" width="240" height="44" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
<text x="320.0" y="59.333333333333336" text-anchor="middle" font-size="13" font-weight="700" fill="12">ألم صدر (ممكن إقفاري؟)</text>
<text x="320.0" y="77.33333333333334" text-anchor="middle" font-size="13" font-weight="600" fill="12" direction="ltr">ECG خلال 10 دقائق + تروبونين</text>
<line x1="320" y1="86" x2="320" y2="104" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<text x="320" y="120" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">اسأل عن 3 صفات: خلف القص • يزيد بالمجهود • يخف بالراحة/النيترات</text>
<line x1="130" y1="128" x2="110" y2="152" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="320" y1="128" x2="320" y2="152" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="510" y1="128" x2="530" y2="152" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="20" y="152" width="180" height="64" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="110.0" y="179.33333333333334" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">إقفاري (Ischemic)</text>
<text x="110.0" y="197.33333333333334" text-anchor="middle" font-size="13" font-weight="600" fill="#7f1d1d">3 صفات</text>
<rect x="230" y="152" width="180" height="64" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="320.0" y="179.33333333333334" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">غير نمطي (Atypical)</text>
<text x="320.0" y="197.33333333333334" text-anchor="middle" font-size="13" font-weight="600" fill="#78350f">صفتان من 3</text>
<rect x="440" y="152" width="180" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
<text x="530.0" y="179.33333333333334" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">غير إقفاري</text>
<text x="530.0" y="197.33333333333334" text-anchor="middle" font-size="13" font-weight="600" fill="#14532d">ولا صفة</text>
<line x1="110" y1="216" x2="110" y2="236" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="320" y1="216" x2="320" y2="236" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="530" y1="216" x2="530" y2="236" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="20" y="236" width="180" height="70" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="110.0" y="251.25" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">ECG + تروبونين</text>
<text x="110.0" y="266.75" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">ارتفاع ST + تروبونين ↑ = STEMI</text>
<text x="110.0" y="282.25" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">تغيّر ST/T + تروبونين ↑ = NSTEMI</text>
<text x="110.0" y="297.75" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0f172a">تروبونين طبيعي = ذبحة غير مستقرة</text>
<rect x="230" y="236" width="180" height="70" rx="10" fill="#fff" stroke="#d97706" stroke-width="1.5"/>
<text x="320.0" y="258.6666666666667" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">ECG + تروبونين</text>
<text x="320.0" y="274.6666666666667" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">لو الاثنين طبيعيين: مونيتور 12 ساعة</text>
<text x="320.0" y="290.6666666666667" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">وإعادة ECG وتروبونين</text>
<rect x="440" y="236" width="180" height="70" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/>
<text x="530.0" y="258.6666666666667" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">علاج الأعراض</text>
<text x="530.0" y="274.6666666666667" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">وابحث عن سبب آخر</text>
<text x="530.0" y="290.6666666666667" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">(عضلي/هضمي/رئوي...)</text>
<line x1="110" y1="306" x2="110" y2="326" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<line x1="320" y1="306" x2="320" y2="326" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
<rect x="20" y="326" width="180" height="40" rx="10" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/>
<text x="110.0" y="349.8333333333333" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7f1d1d">العناية المركزة (CCU) / علاج ACS</text>
<rect x="230" y="326" width="180" height="60" rx="10" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
<text x="320.0" y="344.0" text-anchor="middle" font-size="10.5" font-weight="600" fill="#78350f">زاد الألم أو ECG تغيّر أو تروبونين ↑</text>
<text x="320.0" y="359.5" text-anchor="middle" font-size="10.5" font-weight="600" fill="#78350f">= ACS ← الإنعاش (CCU)</text>
<text x="320.0" y="375.0" text-anchor="middle" font-size="10.5" font-weight="600" fill="#78350f">ظلّ طبيعي = اختبار مجهود (ECG)</text>
<text x="320" y="404" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">ألم صدر فجأة مع علامات خطر: فكّر في تسلخ الأبهر والجلطة الرئوية واسترواح الصدر</text></svg>