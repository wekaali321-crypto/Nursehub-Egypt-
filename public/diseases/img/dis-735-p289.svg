<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 262" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="700" height="262" rx="16" fill="#f8fafc"/>
<text x="350.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">فرط الألدوستيرون</text>
<rect x="356.0" y="52" width="330.0" height="182.0" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="356.0" y="52" width="330.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="521.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الآلية والأعراض</text>
<text x="676.0" y="96" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• الألدوستيرون يحبس الصوديوم والماء ويطرد</text>
<text x="676.0" y="112.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">البوتاسيوم</text>
<text x="676.0" y="131.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• ارتفاع ضغط (فوق 140/90)</text>
<text x="676.0" y="149.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• صوديوم فوق 145: عطش وتورم لسان جاف وزيادة توتر</text>
<text x="676.0" y="166.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">عضلي</text>
<text x="676.0" y="184.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• بوتاسيوم أقل من 3.5: ST منخفض وموجة U، ضعف</text>
<text x="676.0" y="201.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">المنعكسات، إمساك وخمول أمعاء، بول كثير ووزن نوعي</text>
<text x="676.0" y="217.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">منخفض</text>
<rect x="14.0" y="52" width="330.0" height="182.0" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="14.0" y="52" width="330.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="179.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأسباب والعلاج</text>
<text x="334.0" y="96" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• أولي (داخل الكظر): متلازمة كون (ورم حميد)، وراثة</text>
<text x="334.0" y="114.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• ثانوي (خارجه): قصور قلب، تضيق الشريان الكلوي</text>
<text x="334.0" y="133.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• الهدف: خفض الحجم ورفع البوتاسيوم: مكملات K،</text>
<text x="334.0" y="149.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">سبيرونولاكتون (حافظ K)، استئصال الكظر + ستيرويد</text>
<text x="334.0" y="166.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">بديل</text>
<text x="334.0" y="184.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• احذر أزمة أديسون: ضغط منخفض قاتل</text>
<text x="334.0" y="203.0" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">• التمريض: تقييد الصوديوم، مراقبة الضغط والداخل</text>
<text x="334.0" y="219.5" text-anchor="start" font-size="11" font-weight="400" fill="#0f172a">والخارج وK وNa</text>
</svg>
