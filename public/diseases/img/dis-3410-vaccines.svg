<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 378" width="640" height="378" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="اللقاحات والتوكسويدات (Vaccines &amp; Toxoids)"><rect width="640" height="378" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">اللقاحات والتوكسويدات (Vaccines &amp; Toxoids)</text><rect x="326.0" y="46" width="302.0" height="98" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">ما هي؟</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• مستضدات ضعيفة أو ميتة لا تسبب المرض</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• التوكسويد: سم مخفف ينتج مضادات سموم</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• قد لا تنتج كل جرعة حماية عند الجميع</text><rect x="12.0" y="46" width="302.0" height="152" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="12.0" y="60" width="302.0" height="14" fill="#b42318"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">موانع</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• حساسية للدواء أو أحد مكوناته (البيض مع</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   بعض اللقاحات)</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• MMR والحماق: حساسية للجيلاتين أو</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">   neomycin أو جرعة سابقة</text><text x="302.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• حمّى حادة، لوكيميا، ليمفوما، ضعف مناعة</text><text x="302.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">   أو علاج مثبط، سرطان غير موضعي</text><rect x="326.0" y="156" width="302.0" height="134" rx="10" fill="#efe9fb" stroke="#6a4bb5" stroke-width="1.2"/><rect x="326.0" y="156" width="302.0" height="28" rx="10" fill="#6a4bb5"/><rect x="326.0" y="170" width="302.0" height="14" fill="#6a4bb5"/><text x="477.0" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التداخلات</text><text x="616.0" y="204" text-anchor="start" font-size="12.5" fill="#1d2939">• لقاح حي بعد IG بثلاثة أشهر (راجع الجدول)</text><text x="616.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• Corticosteroids والكيماوي والإشعاع تضعف</text><text x="616.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">   الاستجابة</text><text x="616.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• الساليسيلات مع لقاح الحماق: خطر متلازمة</text><text x="616.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">   راي</text><rect x="12.0" y="210" width="302.0" height="152" rx="10" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.2"/><rect x="12.0" y="210" width="302.0" height="28" rx="10" fill="#2e7d4f"/><rect x="12.0" y="224" width="302.0" height="14" fill="#2e7d4f"/><text x="163.0" y="229" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التمريض</text><text x="302.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• تحفظ في الثلاجة؛ خطة بديلة عند انقطاع</text><text x="302.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">   الكهرباء</text><text x="302.0" y="294" text-anchor="start" font-size="12.5" fill="#1d2939">• راقب المريض قبل المغادرة</text><text x="302.0" y="312" text-anchor="start" font-size="12.5" fill="#1d2939">• سجّل التاريخ، الطريق والموضع، النوع،</text><text x="302.0" y="330" text-anchor="start" font-size="12.5" fill="#1d2939">   الشركة، رقم الدفعة والانتهاء، واسم</text><text x="302.0" y="348" text-anchor="start" font-size="12.5" fill="#1d2939">   وعنوان وظيفة المُعطي</text></svg>