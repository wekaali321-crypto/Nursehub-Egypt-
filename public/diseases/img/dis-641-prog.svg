<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 393" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="393" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">من التعرض إلى المضاعفات</text>
<rect x="30" y="44" width="580" height="47" rx="10" fill="#fef9c3" stroke="#eab308"/><text x="320" y="65" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">استنشاق ألياف الأسبستوس</text><text x="320" y="83" text-anchor="middle" font-size="12" fill="#422006">مهنة أو بيئة</text><path d="M320 93 L320 107 M313 101 L320 108 L327 101" stroke="#64748b" stroke-width="2" fill="none"/><rect x="30" y="111" width="580" height="47" rx="10" fill="#dbeafe" stroke="#3b82f6"/><text x="320" y="132" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a">التهاب القصيبات وجدران الحويصلات</text><text x="320" y="150" text-anchor="middle" font-size="12" fill="#1e3a8a">بعد سنوات</text><path d="M320 160 L320 174 M313 168 L320 175 L327 168" stroke="#64748b" stroke-width="2" fill="none"/><rect x="30" y="178" width="580" height="47" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="320" y="199" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">تليّف + لويحات جنبية</text><text x="320" y="217" text-anchor="middle" font-size="12" fill="#7f1d1d">رئة تقييدية، ضيق نفس، كراكلز</text><path d="M320 227 L320 241 M313 235 L320 242 L327 235" stroke="#64748b" stroke-width="2" fill="none"/><rect x="30" y="245" width="580" height="47" rx="10" fill="#ede9fe" stroke="#7c3aed"/><text x="320" y="266" text-anchor="middle" font-size="14" font-weight="800" fill="#4c1d95">10–15 سنة+</text><text x="320" y="284" text-anchor="middle" font-size="12" fill="#4c1d95">أعراض واضحة</text><path d="M320 294 L320 308 M313 302 L320 309 L327 302" stroke="#64748b" stroke-width="2" fill="none"/><rect x="30" y="312" width="580" height="47" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="320" y="333" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">2–4 عقود</text><text x="320" y="351" text-anchor="middle" font-size="12" fill="#7f1d1d">خطر ورم المتوسطة وسرطان الرئة (يتضاعف بالتدخين)</text><text x="320" y="381" text-anchor="middle" font-size="12" fill="#475569">الوقاية: تطعيمات + إقلاع تدخين + متابعة</text>
</svg>
