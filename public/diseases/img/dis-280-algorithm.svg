<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 375" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="375" rx="16" fill="#f8fafc"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التعامل مع القيء الدموي (Hematemesis) في الطوارئ</text><rect x="40" y="45" width="560" height="40" rx="10" fill="#dc2626" stroke="none"/><text x="320" y="70" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">1. أمّن: مجرى الهواء + وضع جانبي/نصف جالس + أكسجين</text><line x1="320" y1="85" x2="320" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="40" y="100" width="560" height="40" rx="10" fill="#f97316" stroke="none"/><text x="320" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">2. خطّين وريديين كبار (14-16G) + سحب عينات (CBC، فصيلة وتوافق، كبد، كلى، سكر)</text><line x1="320" y1="140" x2="320" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="40" y="155" width="560" height="40" rx="10" fill="#eab308" stroke="none"/><text x="320" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#422006">3. سوائل: ملح 0.9% + طلب دم بعد الفصيلة والتوافق</text><line x1="320" y1="195" x2="320" y2="210" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="40" y="210" width="560" height="40" rx="10" fill="#22c55e" stroke="none"/><text x="320" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">4. أدوية بأمر الطبيب: مثبط مضخة البروتون (Pantazol) ± مرقئ (Dycinone/Kapron)</text><line x1="320" y1="250" x2="320" y2="265" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="40" y="265" width="560" height="40" rx="10" fill="#0ea5e9" stroke="none"/><text x="320" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">5. قيّم الصدمة: ضغط/نبض/جلد/بول/Capillary refill ثم أبلغ الباطنة/المناظير</text><rect x="40" y="320" width="560" height="38" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/><text x="320" y="344" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">اشتباه دوالي (مريض كبد): أبلغ فوراً — Terlipressin/Octreotide + مضاد حيوي بأمر الطبيب</text></svg>