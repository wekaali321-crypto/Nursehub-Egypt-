<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 374" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="374" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">نوبة حمى البحر المتوسط العائلية (FMF)</text><rect x="326" y="52" width="284" height="84" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/><text x="468" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#991b1b">حرارة</text><text x="468" y="102" text-anchor="middle" font-size="12.5" fill="#991b1b">ترتفع فجأة</text><text x="468" y="119" text-anchor="middle" font-size="12.5" fill="#991b1b">وتنزل خلال 12–72 ساعة</text><rect x="30" y="52" width="284" height="84" rx="12" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="172" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#9a3412">البطن</text><text x="172" y="102" text-anchor="middle" font-size="12.5" fill="#9a3412">ألم شديد يشبه التهاب الصفاق</text><text x="172" y="119" text-anchor="middle" font-size="12.5" fill="#9a3412">(Peritonitis)</text><rect x="326" y="148" width="284" height="84" rx="12" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="468" y="176" text-anchor="middle" font-size="14.5" font-weight="800" fill="#854d0e">الصدر</text><text x="468" y="198" text-anchor="middle" font-size="12.5" fill="#854d0e">ألم عند التنفس</text><text x="468" y="215" text-anchor="middle" font-size="12.5" fill="#854d0e">التهاب غشاء الرئة (Pleurisy)</text><rect x="30" y="148" width="284" height="84" rx="12" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.5"/><text x="172" y="176" text-anchor="middle" font-size="14.5" font-weight="800" fill="#5b21b6">المفاصل</text><text x="172" y="198" text-anchor="middle" font-size="12.5" fill="#5b21b6">التهاب مفصل لحد أسبوع</text><rect x="326" y="244" width="284" height="84" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="468" y="272" text-anchor="middle" font-size="14.5" font-weight="800" fill="#166534">بين النوبات</text><text x="468" y="294" text-anchor="middle" font-size="12.5" fill="#166534">المريض سليم تماماً</text><text x="468" y="311" text-anchor="middle" font-size="12.5" fill="#166534">والالتهاب (ESR/CRP) بيرجع طبيعي</text><rect x="30" y="244" width="284" height="84" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="172" y="272" text-anchor="middle" font-size="14.5" font-weight="800" fill="#1e40af">الخطر الصامت</text><text x="172" y="294" text-anchor="middle" font-size="12.5" fill="#1e40af">الأميلويد (Amyloid A)</text><text x="172" y="311" text-anchor="middle" font-size="12.5" fill="#1e40af">بروتين بالبول ثم فشل كلوي</text><text x="320" y="362" text-anchor="middle" font-size="12.5" fill="#475569">الكولشيسين الدوري بيمنع النوبات والأميلويد</text></svg>