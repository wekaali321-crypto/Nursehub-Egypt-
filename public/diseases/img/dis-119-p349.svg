<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 496" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="496" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">هشاشة العظام</text><rect x="330" y="52" width="300" height="146.39999999999998" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الفكرة</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• عظام هشة مسامية وكثافة منخفضة بسبب</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  زيادة الامتصاص</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• Osteopenia: نقص كتلة وضعف</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• Osteomalacia: لين العظم بسبب نقص حاد في</text><text x="620" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  فيتامين D</text><text x="620" y="182.00000000000003" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• Osteoporosis: مسامية العظم</text><rect x="10" y="52" width="310" height="146.39999999999998" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">عوامل الخطر</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أنثى، كبار السن، بعد انقطاع الطمث (نقطة</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  امتحان)، قوقازي وآسيوي</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• كافيين زائد، تدخين، كحول</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أدوية: مضادات التشنج، الستيرويدات</text><text x="310" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (بريدنيزون)</text><text x="310" y="182.00000000000003" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أمراض: فرط الجار درقية، كوشنج، السكري</text><rect x="330" y="206.39999999999998" width="300" height="111.6" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M330,216.39999999999998 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#dc2626"/><text x="480.0" y="225.39999999999998" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأعراض</text><text x="620" y="249.39999999999998" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• عظام مسامية</text><text x="620" y="266.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• كسور متكررة</text><text x="620" y="284.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• انخفاض الطول</text><text x="620" y="301.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• حدب (Kyphosis) خاصة عند المسنين</text><rect x="10" y="206.39999999999998" width="310" height="76.8" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M10,216.39999999999998 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#7c3aed"/><text x="165.0" y="225.39999999999998" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الدواء</text><text x="310" y="249.39999999999998" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• كالسيوم وفيتامين D</text><text x="310" y="266.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ألندرونات (Alendronate) -nate</text><rect x="330" y="326.0" width="300" height="146.39999999999998" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M330,336.0 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#16a34a"/><text x="480.0" y="345.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج والتثقيف</text><text x="620" y="369.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مكملات كالسيوم وD، والتعرض للشمس</text><text x="620" y="386.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تمارين حمل الوزن (مشي 30 دقيقة، 4 مرات</text><text x="620" y="403.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  أسبوعيًا) ومشي متكرر</text><text x="620" y="421.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• سقوط: حصائر مطاطية بالحمام، إضاءة</text><text x="620" y="438.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الممرات، لا سجاد منزلق</text><text x="620" y="455.9999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• توقف عن التدخين وقلّل الكافيين</text><rect x="10" y="326.0" width="310" height="129.0" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M10,336.0 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#0369a1"/><text x="165.0" y="345.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">أسئلة اختبارات</text><text x="310" y="369.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• دواء يزيد الخطر: بريدنيزون</text><text x="310" y="386.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• عوامل الخطر: ستيرويد، كافيين، أبيض/آسيوي،</text><text x="310" y="403.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  بعد سن اليأس، مضادات التشنج</text><text x="310" y="421.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• للمسن: حصائر مطاطية، تمارين حمل الوزن،</text><text x="310" y="438.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الإقلاع عن التدخين</text></svg>