<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="330" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">DKA مقابل HHS</text>
  <rect x="320" y="46" width="300" height="34" rx="10" fill="#dc2626"/><text x="470" y="69" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">DKA — حموضة كيتونية</text>
  <rect x="20" y="46" width="290" height="34" rx="10" fill="#7c3aed"/><text x="165" y="69" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">HHS — فرط أسمولية</text>
  <g font-size="13" fill="#0f172a" text-anchor="middle">
    <g fill="#fee2e2"><rect x="320" y="88" width="300" height="28" rx="6"/><rect x="320" y="122" width="300" height="28" rx="6"/><rect x="320" y="156" width="300" height="28" rx="6"/><rect x="320" y="190" width="300" height="28" rx="6"/><rect x="320" y="224" width="300" height="28" rx="6"/><rect x="320" y="258" width="300" height="28" rx="6"/></g>
    <g fill="#ede9fe"><rect x="20" y="88" width="290" height="28" rx="6"/><rect x="20" y="122" width="290" height="28" rx="6"/><rect x="20" y="156" width="290" height="28" rx="6"/><rect x="20" y="190" width="290" height="28" rx="6"/><rect x="20" y="224" width="290" height="28" rx="6"/><rect x="20" y="258" width="290" height="28" rx="6"/></g>
    <text x="470" y="107">غالباً النوع الأول، شباب</text><text x="165" y="107">غالباً النوع الثاني، كبار السن</text>
    <text x="470" y="141">بداية سريعة (ساعات–أيام)</text><text x="165" y="141">بداية تدريجية (أيام–أسابيع)</text>
    <text x="470" y="175">سكر عادةً أكتر من 200</text><text x="165" y="175" direction="ltr">glucose ≥ 600 mg/dl</text>
    <text x="470" y="209">pH أقل من 7.3 / HCO3 أقل من 18*</text><text x="165" y="209" direction="ltr">pH &gt; 7.3 / HCO3 &gt; 15</text>
    <text x="470" y="243">كيتونات موجودة بوضوح</text><text x="165" y="243">كيتونات قليلة أو معدومة</text>
    <text x="470" y="277">تنفس كوسماول وريحة أسيتون</text><text x="165" y="277" direction="ltr">Osmolarity &gt; 320 mosmol/L</text>
  </g>
  <text x="320" y="312" text-anchor="middle" font-size="11" fill="#64748b">* HCO3 أقل من 18 وpH أقل من 7.3 حسب إجماع ADA/EASD الحديث؛ قيم HHS هنا تقليدية</text>
</svg>
