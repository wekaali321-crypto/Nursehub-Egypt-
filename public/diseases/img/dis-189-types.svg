<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 339" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="339" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">أنواع الحمى الريكتسية (Rickettsial diseases)</text><g text-anchor="middle"><rect x="420" y="46" width="200" height="30" fill="#0f172a" stroke="#f8fafc"/><text x="520" y="66" font-size="13" font-weight="800" fill="#fff">النوع</text><rect x="220" y="46" width="200" height="30" fill="#0f172a" stroke="#f8fafc"/><text x="320" y="66" font-size="13" font-weight="800" fill="#fff">الناقل</text><rect x="20" y="46" width="200" height="30" fill="#0f172a" stroke="#f8fafc"/><text x="120" y="66" font-size="13" font-weight="800" fill="#fff">ملاحظات</text><rect x="420" y="76" width="200" height="46" fill="#ffffff" stroke="#cbd5e1"/><text x="520" y="96" font-size="12" font-weight="800" fill="#0f172a">التيفوس الوبائي (Epidemic)</text><rect x="220" y="76" width="200" height="46" fill="#ffffff" stroke="#cbd5e1"/><text x="320" y="96" font-size="12" font-weight="600" fill="#0f172a">قمل الإنسان (براز القمل</text><text x="320" y="113" font-size="12" font-weight="600" fill="#0f172a">يُستنشق أو يدخل عبر الجلد)</text><rect x="20" y="76" width="200" height="46" fill="#ffffff" stroke="#cbd5e1"/><text x="120" y="96" font-size="12" font-weight="600" fill="#0f172a">حضانة 2–23 يوم، متوطن في</text><text x="120" y="113" font-size="12" font-weight="600" fill="#0f172a">مصر (حسب المصدر)</text><rect x="420" y="122" width="200" height="46" fill="#f1f5f9" stroke="#cbd5e1"/><text x="520" y="142" font-size="12" font-weight="800" fill="#0f172a">التيفوس المتوطن (Murine)</text><rect x="220" y="122" width="200" height="46" fill="#f1f5f9" stroke="#cbd5e1"/><text x="320" y="142" font-size="12" font-weight="600" fill="#0f172a">براغيث الجرذان للإنسان</text><rect x="20" y="122" width="200" height="46" fill="#f1f5f9" stroke="#cbd5e1"/><text x="120" y="142" font-size="12" font-weight="600" fill="#0f172a">أكثر في الموانئ الساحلية</text><text x="120" y="159" font-size="12" font-weight="600" fill="#0f172a">الدافئة، علاجه نفسه</text><rect x="420" y="168" width="200" height="46" fill="#ffffff" stroke="#cbd5e1"/><text x="520" y="188" font-size="12" font-weight="800" fill="#0f172a">تيفوس الأدغال (Scrub)</text><rect x="220" y="168" width="200" height="46" fill="#ffffff" stroke="#cbd5e1"/><text x="320" y="188" font-size="12" font-weight="600" fill="#0f172a">R. orientia tsutsugamushi</text><rect x="20" y="168" width="200" height="46" fill="#ffffff" stroke="#cbd5e1"/><text x="120" y="188" font-size="12" font-weight="600" fill="#0f172a">شائع جنوب شرق آسيا، يُعالج</text><text x="120" y="205" font-size="12" font-weight="600" fill="#0f172a">كالوبائي</text><rect x="420" y="214" width="200" height="46" fill="#f1f5f9" stroke="#cbd5e1"/><text x="520" y="234" font-size="12" font-weight="800" fill="#0f172a">حمى الجبال الصخرية المتبقعة</text><rect x="220" y="214" width="200" height="46" fill="#f1f5f9" stroke="#cbd5e1"/><text x="320" y="234" font-size="12" font-weight="600" fill="#0f172a">القراد</text><rect x="20" y="214" width="200" height="46" fill="#f1f5f9" stroke="#cbd5e1"/><text x="120" y="234" font-size="12" font-weight="600" fill="#0f172a">الطفح يبدأ باليدين والقدمين</text><text x="120" y="251" font-size="12" font-weight="600" fill="#0f172a">ثم ينزفي</text><rect x="420" y="260" width="200" height="63" fill="#ffffff" stroke="#cbd5e1"/><text x="520" y="280" font-size="12" font-weight="800" fill="#0f172a">تيفوس القراد (R. conorii)</text><rect x="220" y="260" width="200" height="63" fill="#ffffff" stroke="#cbd5e1"/><text x="320" y="280" font-size="12" font-weight="600" fill="#0f172a">القراد</text><rect x="20" y="260" width="200" height="63" fill="#ffffff" stroke="#cbd5e1"/><text x="120" y="280" font-size="12" font-weight="600" fill="#0f172a">أشهر مرض ريكتسي مستورد في</text><text x="120" y="297" font-size="12" font-weight="600" fill="#0f172a">بريطانيا؛ إسكار أسود في</text><text x="120" y="314" font-size="12" font-weight="600" fill="#0f172a">مكان اللدغة</text></g></svg>