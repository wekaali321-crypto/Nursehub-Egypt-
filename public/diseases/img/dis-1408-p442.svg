<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="388" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">BiPAP والتنبيب</text><rect x="30" y="54" width="580" height="40" rx="10" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="578" cy="74" r="14" fill="#0ea5e9"/><text x="578" y="79" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="554" y="79" text-anchor="start" font-size="13.5" fill="#0f172a">BiPAP: الأكثر اختبارًا لمريض COPD متفاقم مع احتباس CO₂ (أكثر من 45)</text><text x="320" y="105" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="108" width="580" height="40" rx="10" fill="#6366f1" fill-opacity="0.14" stroke="#6366f1" stroke-width="1.5"/><circle cx="578" cy="128" r="14" fill="#6366f1"/><text x="578" y="133" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="554" y="133" text-anchor="start" font-size="13.5" fill="#0f172a">يدفع الهواء بعمق مع طرد CO₂؛ آخر جهاز قبل التنبيب</text><text x="320" y="159" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="162" width="580" height="40" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="1.5"/><circle cx="578" cy="182" r="14" fill="#10b981"/><text x="578" y="187" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="554" y="187" text-anchor="start" font-size="13.5" fill="#0f172a">التنبيب: حل نهائي لفتح المجرى الهوائي؛ أنبوب في القصبة للتهوية</text><text x="320" y="213" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="216" width="580" height="74" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.5"/><circle cx="578" cy="253" r="14" fill="#ef4444"/><text x="578" y="258" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="554" y="238" text-anchor="start" font-size="13.5" fill="#0f172a">الالتهاب الرئوي المرتبط بالتنفس الصناعي (VAP): غيّر الوضع جانبيًا</text><text x="554" y="257.575" text-anchor="start" font-size="13.5" fill="#0f172a">كل ساعتين، عناية فموية بـchlorhexidine كل ساعتين، وراقب: بلغم موجب</text><text x="554" y="277.15" text-anchor="start" font-size="13.5" fill="#0f172a">الزرع، حمى، ارتشاح جديد بالأشعة</text><rect x="20" y="300" width="600" height="74" rx="10" fill="#f59e0b" fill-opacity="0.13" stroke="#f59e0b" stroke-width="1.5"/><text x="610" y="320" text-anchor="start" font-size="13.5" font-weight="800" fill="#f59e0b">سؤال امتحان</text><text x="610" y="340" text-anchor="start" font-size="13" fill="#0f172a">مريض في الإفاقة بعد جراحة أصبح مشوشًا وانخفض تشبعه من 98% إلى 90% بهواء</text><text x="610" y="359" text-anchor="start" font-size="13" fill="#0f172a">الغرفة. الإجراء المناسب: قنية أنفية (لا قناع غير معيد).</text></svg>
