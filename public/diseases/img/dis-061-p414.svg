<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 331" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="331" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أسباب وتثقيف التهاب المسالك البولية</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="178.2" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الأسباب</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• احتباس البول: BPH، حبس</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">البول طويلًا، حصوات</text><text x="612" y="135.4" text-anchor="start" font-size="13" fill="#0f172a">كلوية</text><text x="612" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">• قسطرة فولي</text><text x="612" y="181.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">• E. coli الأشيع: المسح</text><text x="612" y="199.99999999999997" text-anchor="start" font-size="13" fill="#0f172a">من الخلف للأمام</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="178.2" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">افعل</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• 2000 مل ماء يوميًا</text><text x="408.66666666666663" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• التبول بعد الجماع</text><text x="408.66666666666663" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• مكملات التوت البري</text><text x="408.66666666666663" y="163.6" text-anchor="start" font-size="13" fill="#0f172a">(حسب التثقيف)</text><text x="408.66666666666663" y="186.8" text-anchor="start" font-size="13" fill="#0f172a">• المسح من الأمام للخلف</text><rect x="20" y="54" width="193.33333333333334" height="178.2" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#f59e0b"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">تجنّب</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• الغسول المهبلي</text><text x="205.33333333333334" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• مبيد الحيوانات المنوية</text><text x="205.33333333333334" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• مزيل الروائح الشرجي</text><text x="205.33333333333334" y="168.6" text-anchor="start" font-size="13" fill="#0f172a">• ملابس نايلون وسباندكس</text><text x="205.33333333333334" y="191.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">• حمامات الفقاعات</text><text x="205.33333333333334" y="214.99999999999997" text-anchor="start" font-size="13" fill="#0f172a">• الكافيين والكحول</text><rect x="20" y="242.2" width="600" height="74" rx="10" fill="#ef4444" fill-opacity="0.13" stroke="#ef4444" stroke-width="1.5"/><text x="610" y="262.2" text-anchor="start" font-size="13.5" font-weight="800" fill="#ef4444">انتبه</text><text x="610" y="282.2" text-anchor="start" font-size="13" fill="#0f172a">مريض مسن أصبح فجأة مشوشًا: ابحث عن التهاب مسالك بولية، فقد يتحول سريعًا إلى</text><text x="610" y="301.2" text-anchor="start" font-size="13" fill="#0f172a">إنتان بولي. تذكّر: مسن + تشوش مفاجئ = فتش عن التهاب.</text></svg>
