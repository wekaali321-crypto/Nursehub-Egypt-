<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 438" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="438" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">غثيان الحمل: بسيط ومفرط</text><rect x="20.0" y="50" width="600.0" height="116" rx="10" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20.0" y="50" width="600.0" height="28" rx="10" fill="#16a34a"/><text x="320.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الصباحي (الثلث الأول)</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="start">• وجبات صغيرة متكررة كل 2-3 ساعات</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="start">• سناك غني بالبروتين عند الاستيقاظ</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="start">• السوائل بين الوجبات (قبلها/بعدها بـ 30 د)</text><text x="610.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="start">• زنجبيل وفيتامين B6</text><rect x="20.0" y="178" width="600.0" height="116" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><rect x="20.0" y="178" width="600.0" height="28" rx="10" fill="#b91c1c"/><text x="320.0" y="20" dy="178" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المفرط (Hyperemesis)</text><text x="610.0" y="224" font-size="12.5" fill="#0f172a" text-anchor="start">• قيء مستمر وفقد وزن 5% من وزن ما قبل الحمل</text><text x="610.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="start">• جفاف واختلال أملاح (نقص بوتاسيوم)</text><text x="610.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="start">• كيتونات في البول وكثافة بول عالية</text><text x="610.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="start">• اضطراب تغذية</text><rect x="20.0" y="306" width="600.0" height="116" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="20.0" y="306" width="600.0" height="28" rx="10" fill="#0e7490"/><text x="320.0" y="20" dy="306" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج</text><text x="610.0" y="352" font-size="12.5" fill="#0f172a" text-anchor="start">• مراقبة الوزن والداخل/الخارج I&amp;O</text><text x="610.0" y="369" font-size="12.5" fill="#0f172a" text-anchor="start">• محاليل وريدية</text><text x="610.0" y="386" font-size="12.5" fill="#0f172a" text-anchor="start">• ondansetron وpyridoxine (B6)</text><text x="610.0" y="403" font-size="12.5" fill="#0f172a" text-anchor="start">• ألبان وماء بالليمون وبروتين</text></svg>