<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 291" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="291" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الدرن الرئوي: التشخيص والتمريض</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="222.79999999999998" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">العدوى والأعراض</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• بكتيريا M.</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">tuberculosis تنتقل</text><text x="612" y="135.4" text-anchor="start" font-size="13" fill="#0f172a">بالهواء، تدخل الرئتين</text><text x="612" y="153.6" text-anchor="start" font-size="13" fill="#0f172a">وتنتشر للغدد والدم</text><text x="612" y="176.8" text-anchor="start" font-size="13" fill="#0f172a">• عرق ليلي، فقدان شهية</text><text x="612" y="195" text-anchor="start" font-size="13" fill="#0f172a">ووزن، سعال مع بصاق</text><text x="612" y="213.20000000000002" text-anchor="start" font-size="13" fill="#0f172a">مدمّم، ضيق نفس، حمى</text><text x="612" y="231.4" text-anchor="start" font-size="13" fill="#0f172a">وقشعريرة</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="222.79999999999998" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#0ea5e9"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">التشخيص</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• حقن جلدي (Mantoux):</text><text x="408.66666666666663" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">قراءة بعد 48–72 ساعة</text><text x="408.66666666666663" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• تصلب أكثر من 15 مم = إيجابي</text><text x="408.66666666666663" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">(عدوى TB)</text><text x="408.66666666666663" y="181.8" text-anchor="start" font-size="13" fill="#0f172a">• أشعة صدر + مزرعة بلغم</text><text x="408.66666666666663" y="200" text-anchor="start" font-size="13" fill="#0f172a">للمرض النشط</text><text x="408.66666666666663" y="223.20000000000002" text-anchor="start" font-size="13" fill="#0f172a">• بلغم: عيّنة معقمة</text><text x="408.66666666666663" y="241.4" text-anchor="start" font-size="13" fill="#0f172a">صباحًا مبكرًا لمدة 3</text><text x="408.66666666666663" y="259.6" text-anchor="start" font-size="13" fill="#0f172a">أيام متتالية</text><rect x="20" y="54" width="193.33333333333334" height="222.79999999999998" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#10b981"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">التمريض</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• أول إجراء: احتياطات</text><text x="205.33333333333334" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">هوائية</text><text x="205.33333333333334" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• معظم المصابين</text><text x="205.33333333333334" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">بالجرثومة لا يتطور عندهم</text><text x="205.33333333333334" y="176.8" text-anchor="start" font-size="13" fill="#0f172a">المرض النشط</text><text x="205.33333333333334" y="200" text-anchor="start" font-size="13" fill="#0f172a">• مزارع البلغم حتى 3</text><text x="205.33333333333334" y="218.2" text-anchor="start" font-size="13" fill="#0f172a">مزارع سلبية</text><text x="205.33333333333334" y="241.4" text-anchor="start" font-size="13" fill="#0f172a">• فحص أفراد الأسرة</text></svg>
