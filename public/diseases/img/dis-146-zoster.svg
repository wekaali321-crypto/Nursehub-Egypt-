<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الحزام الناري (Shingles)</text>
<rect x="20.0" y="48" width="295.0" height="110" rx="10" fill="#7c3aed"/>
<text x="167.5" y="88.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">السبب</text>
<text x="167.5" y="107.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">إعادة تنشيط فيروس الجدري المائي</text>
<text x="167.5" y="126.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">عند ضعف المناعة</text>
<rect x="325.0" y="48" width="295.0" height="110" rx="10" fill="#b91c1c"/>
<text x="472.5" y="78.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الطفح</text>
<text x="472.5" y="97.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">حزام أفقي على جانب الجذع</text>
<text x="472.5" y="116.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">حويصلات وقشور</text>
<text x="472.5" y="135.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">وخز وحرقان وتنميل</text>
<rect x="20.0" y="168" width="295.0" height="110" rx="10" fill="#ca8a04"/>
<text x="167.5" y="208.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">من أكثر عرضة</text>
<text x="167.5" y="227.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">مثبطات مناعة، كيماوي</text>
<text x="167.5" y="246.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">عدوى أخرى، إجهاد، سوء تغذية</text>
<rect x="325.0" y="168" width="295.0" height="110" rx="10" fill="#0f766e"/>
<text x="472.5" y="208.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الاحتياط</text>
<text x="472.5" y="227.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تجنب المصابين</text>
<text x="472.5" y="246.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">عزل بحسب الحالة</text>
</svg>
