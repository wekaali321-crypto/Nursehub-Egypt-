<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مستوى الجنين (Station) في الحوض</text><line x1="60" y1="150" x2="580" y2="150" stroke="#0f172a" stroke-width="3"/><circle cx="110" cy="150" r="8" fill="#ef4444"/><circle cx="320" cy="150" r="8" fill="#f59e0b"/><circle cx="540" cy="150" r="8" fill="#22c55e"/><text x="110" y="125" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">−1 إلى −5</text><text x="110" y="185" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">فوق الشوكة الإسكية</text><text x="110" y="205" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">(مدخل الحوض)</text><text x="320" y="125" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">صفر (0)</text><text x="320" y="185" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">مستوى الشوكة الإسكية</text><text x="320" y="205" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">الرأس مثبّت (Engaged)</text><text x="540" y="125" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">+1 إلى +5</text><text x="540" y="185" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">تتويج (Crowning)</text><text x="540" y="205" text-anchor="middle" font-size="12" font-weight="500" fill="#334155">ابدئي الدفع</text><text x="320" y="250" text-anchor="middle" font-size="12" font-weight="500" fill="#475569">الأفضل للولادة: وضع رأسي أمامي (OA)، الجنين مثني، الاتجاه طولي</text>
