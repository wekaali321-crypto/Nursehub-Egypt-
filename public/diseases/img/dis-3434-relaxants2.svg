<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" width="640" height="432" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="مرخيات العضلات: نصائح الامتحان وأدوية محددة"><rect width="640" height="432" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">مرخيات العضلات: نصائح الامتحان وأدوية محددة</text><rect x="326.0" y="46" width="302.0" height="98" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="326.0" y="60" width="302.0" height="14" fill="#b42318"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">3 نصائح كبرى</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• الدوخة عند تغيير الوضع متوقعة</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• لا كحول</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• لا إيقاف مفاجئ</text><rect x="12.0" y="46" width="302.0" height="170" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="12.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Dantrolene</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• إصابة الحبل الشوكي، الشلل الدماغي،</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   التصلب المتعدد</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• يعمل مباشرة على العضلة بمنع تحرر</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">   الكالسيوم (كالسيوم أقل = انقباض أقل)</text><text x="302.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• سمية كبدية ونعاس</text><text x="302.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">• ممنوع في التصلب المتعدد والتليف الكبدي</text><text x="302.0" y="202" text-anchor="start" font-size="12.5" fill="#1d2939">   (HESI)</text><rect x="326.0" y="156" width="302.0" height="98" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="326.0" y="156" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="326.0" y="170" width="302.0" height="14" fill="#a86a00"/><text x="477.0" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Cyclobenzaprine وCarisoprodol</text><text x="616.0" y="204" text-anchor="start" font-size="12.5" fill="#1d2939">• تقلل التشنج بعد جراحة الكسور المفتوحة</text><text x="616.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• Carisoprodol: خطر الاعتماد ونعاس</text><text x="616.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• خفّض تدريجيًا ولا توقف فجأة</text><rect x="12.0" y="228" width="302.0" height="188" rx="10" fill="#efe9fb" stroke="#6a4bb5" stroke-width="1.2"/><rect x="12.0" y="228" width="302.0" height="28" rx="10" fill="#6a4bb5"/><rect x="12.0" y="242" width="302.0" height="14" fill="#6a4bb5"/><text x="163.0" y="247" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Baclofen</text><text x="302.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">• يعزز GABA فيبطئ كل شيء</text><text x="302.0" y="294" text-anchor="start" font-size="12.5" fill="#1d2939">• يقلل تيبس العضلات المثنية والباسطة</text><text x="302.0" y="312" text-anchor="start" font-size="12.5" fill="#1d2939">   (إصابة نخاع، MS، شلل دماغي)</text><text x="302.0" y="330" text-anchor="start" font-size="12.5" fill="#1d2939">• إمساك، انخفاض ضغط انتصابي</text><text x="302.0" y="348" text-anchor="start" font-size="12.5" fill="#1d2939">• وسيلتنا: Baclofen ← Back off slowly</text><text x="302.0" y="366" text-anchor="start" font-size="12.5" fill="#1d2939">   (توقف تدريجيًا)</text><text x="302.0" y="384" text-anchor="start" font-size="12.5" fill="#1d2939">• سمّية قاتلة محتملة: انحلال عضلات وفشل</text><text x="302.0" y="402" text-anchor="start" font-size="12.5" fill="#1d2939">   أعضاء</text></svg>