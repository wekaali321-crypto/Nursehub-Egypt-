<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">نختار المضاد الحيوي حسب الميكروب المتوقع</text>
<g font-size="13" text-anchor="middle" font-weight="700">
<rect x="430" y="50" width="190" height="55" rx="10" fill="#0ea5e9"/><text x="525" y="73" fill="#fff">Gram +ve</text><text x="525" y="93" fill="#e0f2fe" font-size="11">Streptococci · Staphylococci (anti-staph)</text>
<rect x="225" y="50" width="190" height="55" rx="10" fill="#f97316"/><text x="320" y="73" fill="#fff">Gram -ve</text><text x="320" y="93" fill="#ffedd5" font-size="11">E. coli · Pseudomonas (anti-pseudomonal)</text>
<rect x="20" y="50" width="190" height="55" rx="10" fill="#8b5cf6"/><text x="115" y="73" fill="#fff">Atypical</text><text x="115" y="93" fill="#ede9fe" font-size="11">Mycoplasma · Chlamydia</text>
<rect x="430" y="125" width="190" height="80" rx="10" fill="#e0f2fe" stroke="#0ea5e9"/><text x="525" y="148" fill="#0f172a">التهابات تنفس علوي</text><text x="525" y="168" fill="#0f172a">وجلد وحنجرة</text><text x="525" y="190" fill="#0369a1" font-size="11">→ مضاد قوي على Gram+</text>
<rect x="225" y="125" width="190" height="80" rx="10" fill="#ffedd5" stroke="#f97316"/><text x="320" y="148" fill="#0f172a">نزلة معوية · مسالك</text><text x="320" y="168" fill="#0f172a">بولية · التهاب رئوي</text><text x="320" y="190" fill="#c2410c" font-size="11">→ مضاد قوي على Gram-</text>
<rect x="20" y="125" width="190" height="80" rx="10" fill="#ede9fe" stroke="#8b5cf6"/><text x="115" y="153" fill="#0f172a">ماكروليدات</text><text x="115" y="175" fill="#0f172a">(Azithromycin)</text></g>
<text x="320" y="240" text-anchor="middle" font-size="13" fill="#334155">لازم المضاد يشتغل كـ Anti-Staph لو بيغطي Gram+ ، وكـ Anti-Pseudomonal لو بيغطي Gram-</text>
<text x="320" y="268" text-anchor="middle" font-size="12" fill="#64748b">الاختيار النهائي بأمر الطبيب وحسب المزرعة والمقاومة المحلية</text></svg>