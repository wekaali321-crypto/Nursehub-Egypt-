<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 531" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="531" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب البنكرياس الحاد</text><rect x="330" y="52" width="300" height="146.39999999999998" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الفكرة</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• التهاب يحدث عندما تبدأ الإنزيمات بهضم</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  البنكرياس نفسه (Autodigestion)</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• إنزيمات: Protease (بروتين)، Lipase</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (دهون)، Amylase (نشويات)</text><text x="620" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• وظيفتان: إفرازية خارجية (إنزيمات) وغدية</text><text x="620" y="182.00000000000003" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (إنسولين وجلوكاجون)</text><rect x="10" y="52" width="310" height="111.6" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأسباب</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الكحول</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أمراض المرارة</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• التليف الكيسي</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• إجراء ERCP</text><rect x="330" y="206.39999999999998" width="300" height="146.39999999999998" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M330,216.39999999999998 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#dc2626"/><text x="480.0" y="225.39999999999998" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأعراض</text><text x="620" y="249.39999999999998" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ألم شرسوفي وفي الربع العلوي الأيسر LUQ</text><text x="620" y="266.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  يمتد إلى الظهر</text><text x="620" y="284.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• كدمات: علامة تيرنر (Turner) وعلامة كالن</text><text x="620" y="301.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (Cullen)</text><text x="620" y="318.9999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• يرقان، هبوط ضغط (نزيف داخلي)، استسقاء</text><text x="620" y="336.39999999999986" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• حراسة بطنية وتحسس</text><rect x="10" y="206.39999999999998" width="310" height="129.0" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M10,216.39999999999998 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#7c3aed"/><text x="165.0" y="225.39999999999998" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التحاليل</text><text x="310" y="249.39999999999998" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أميلاز وليباز مرتفعان</text><text x="310" y="266.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• سكر مرتفع</text><text x="310" y="284.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• WBC أكثر من 10000 وحمى</text><text x="310" y="301.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تطوّل PT وaPTT</text><text x="310" y="318.9999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• بيليروبين مرتفع</text><rect x="330" y="360.79999999999995" width="300" height="146.39999999999998" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M330,370.79999999999995 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#16a34a"/><text x="480.0" y="379.79999999999995" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التدخلات</text><text x="620" y="403.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• NPO</text><text x="620" y="421.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أنبوب أنفي معدي للشفط</text><text x="620" y="438.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مسكنات وريدية: هيدرومورفون، وليس مورفين</text><text x="620" y="455.9999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• سوائل وريدية، راقب السكر (إنسولين)</text><text x="620" y="473.39999999999986" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مضادات حموضة، PPI (بانتوبرازول)، H2</text><text x="620" y="490.79999999999984" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (فاموتيدين)</text><rect x="10" y="360.79999999999995" width="310" height="146.39999999999998" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.5"/><path d="M10,370.79999999999995 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#be123c"/><text x="165.0" y="379.79999999999995" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المضاعفات والغذاء</text><text x="310" y="403.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ARDS</text><text x="310" y="421.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• التهاب الصفاق: حمى أكثر من 100.3°ف، ألم</text><text x="310" y="438.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  ارتدادي، بطن صلب كالخشب، قلق، سرعة نبض</text><text x="310" y="455.9999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  وتنفس</text><text x="310" y="473.39999999999986" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• غذاء قليل الدهون والسكريات، مع إنزيمات مع</text><text x="310" y="490.79999999999984" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الوجبات</text></svg>