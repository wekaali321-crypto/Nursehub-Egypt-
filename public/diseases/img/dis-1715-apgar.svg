<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="330" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">درجة أبغار (APGAR)</text><rect x="495" y="44" width="130" height="30" fill="#e2e8f0" stroke="#fff"/><text x="560" y="65" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">العلامة</text><rect x="365" y="44" width="130" height="30" fill="#fecaca" stroke="#fff"/><text x="430" y="65" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">0</text><rect x="235" y="44" width="130" height="30" fill="#fed7aa" stroke="#fff"/><text x="300" y="65" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">1</text><rect x="105" y="44" width="130" height="30" fill="#bbf7d0" stroke="#fff"/><text x="170" y="65" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">2</text><rect x="495" y="78" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="560" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">المظهر (لون الجلد)</text><rect x="365" y="78" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="430" y="100" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">أزرق/شاحب</text><rect x="235" y="78" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="300" y="100" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">جسم وردي وأطراف زرقاء</text><rect x="105" y="78" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="170" y="100" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">وردي كامل</text><rect x="495" y="114" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="560" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">النبض</text><rect x="365" y="114" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="430" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">منعدم</text><rect x="235" y="114" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="300" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">أقل من 100</text><rect x="105" y="114" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="170" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">أكثر من 100</text><rect x="495" y="150" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="560" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">ردة الفعل (Grimace)</text><rect x="365" y="150" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="430" y="172" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">منعدمة</text><rect x="235" y="150" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="300" y="172" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">تكشير</text><rect x="105" y="150" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="170" y="172" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">بكاء وسحب</text><rect x="495" y="186" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="560" y="208" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">النشاط (التوتر العضلي)</text><rect x="365" y="186" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="430" y="208" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">رخو</text><rect x="235" y="186" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="300" y="208" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">انثناء خفيف</text><rect x="105" y="186" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="170" y="208" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">حركة نشطة</text><rect x="495" y="222" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="560" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">التنفس</text><rect x="365" y="222" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="430" y="244" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">منعدم</text><rect x="235" y="222" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="300" y="244" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">بكاء ضعيف</text><rect x="105" y="222" width="130" height="34" fill="#fff" stroke="#e2e8f0"/><text x="170" y="244" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">بكاء قوي</text><text x="320" y="285" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">عند 1 و5 دقائق؛ و10 دقائق إن كانت أقل من 7</text><text x="320" y="308" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">0–3 ضائقة شديدة: إنعاش كامل | 4–6 متوسطة: إنعاش جزئي | 7–10 كافٍ</text>
</svg>
