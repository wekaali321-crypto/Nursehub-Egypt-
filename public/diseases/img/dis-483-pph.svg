<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="344" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">نزيف ما بعد الولادة: الأسباب والإجراءات</text><rect x="326.0" y="50" width="294.0" height="133" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/><rect x="326.0" y="50" width="294.0" height="28" rx="10" fill="#b91c1c"/><text x="473.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">أسباب الرحم</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• ارتخاء الرحم (Atony)</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• طفل كبير أو توائم أو سائل زائد</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• طلق طويل أكثر من 24 ساعة أو سريع جداً</text><text x="610.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• تمزق أو انقلاب الرحم</text><rect x="20.0" y="50" width="294.0" height="133" rx="10" fill="#fff" stroke="#c2410c" stroke-width="2"/><rect x="20.0" y="50" width="294.0" height="28" rx="10" fill="#c2410c"/><text x="167.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">أسباب أخرى</text><text x="304.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• بقايا مشيمة أو التصاق مفرط</text><text x="304.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• magnesium sulfate وterbutaline</text><text x="304.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">والتخدير العام</text><text x="304.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• تمزق مهبلي وورم دموي</text><text x="304.0" y="164" font-size="12.5" fill="#0f172a" text-anchor="end">• اضطراب تجلط: DIC وITP</text><rect x="326.0" y="195" width="294.0" height="133" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="326.0" y="195" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="473.0" y="20" dy="195" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الإجراءات</text><text x="610.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="end">• تدليك قاع الرحم</text><text x="610.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">• تفريغ المثانة وخط وريدي ثانٍ</text><text x="610.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• سوائل ودم عند الحاجة</text><text x="610.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="end">• oxytocin ثم methylergonovine أو</text><text x="610.0" y="309" font-size="12.5" fill="#0f172a" text-anchor="end">misoprostol</text><rect x="20.0" y="195" width="294.0" height="133" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="20.0" y="195" width="294.0" height="28" rx="10" fill="#7c3aed"/><text x="167.0" y="20" dy="195" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">علامات الصدمة</text><text x="304.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="end">• نبض سريع وضغط منخفض</text><text x="304.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">• جلد بارد رطب</text><text x="304.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• امتلاء شعيري أبطأ من 3-4 ثوانٍ</text><text x="304.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="end">• Hb أقل من 7 g/dL</text></svg>