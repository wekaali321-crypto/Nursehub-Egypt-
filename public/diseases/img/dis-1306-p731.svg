<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="560" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الحرق الكبير: التغيرات والعلاج وأهداف الإنعاش</text>
  <rect x="330" y="50" width="290" height="170" rx="10" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">الفسيولوجيا المرضية</text><text x="608" y="96" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• تلف نسيجي واسع والتهاب جهازي</text><text x="608" y="121" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• تسرب الأوعية (كالبالون المتسرب)</text><text x="608" y="146" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• هبوط حجم الدم ← صدمة نقص حجم</text><text x="608" y="171" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• ذروة انتقال السوائل بين 18 و24 ساعة</text><rect x="20" y="50" width="290" height="170" rx="10" fill="#fef9c3" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="72" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">أول 24 ساعة (مخبريًا)</text><text x="298" y="96" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• بوتاسيوم &gt; 5.0 (موجات T مدببة)</text><text x="298" y="121" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• صوديوم &lt; 135</text><text x="298" y="146" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• هيموجلوبين 12–18 ومرتفع</text><text x="298" y="171" text-anchor="start" font-size="12.5" font-weight="500" fill="#1e293b">• هيماتوكريت 36–54% ومرتفع (مثال 60%)</text><rect x="20" y="235" width="290" height="150" rx="10" fill="#dcfce7" stroke="#cbd5e1" stroke-width="1.5"/><text x="165" y="257" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">العلاج الأول</text><text x="298" y="281" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• رينجر لاكتات (LR) أو ملح 0.9%</text><text x="298" y="306" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• تغذية معوية بعد عودة الأمعاء</text><text x="298" y="331" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• بول قليل وضغط 90/50 ونبض 110</text><text x="298" y="356" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">• ← زيادة معدل LR</text><rect x="330" y="235" width="290" height="150" rx="10" fill="#dbeafe" stroke="#cbd5e1" stroke-width="1.5"/><text x="475" y="257" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">أهداف الإنعاش (3)</text><text x="608" y="281" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• بول ≥ 30 مل/ساعة</text><text x="608" y="309" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• ضغط انقباضي ≥ 90</text><text x="608" y="337" text-anchor="start" font-size="13" font-weight="500" fill="#1e293b">• نبض &lt; 120/دقيقة</text><rect x="20" y="400" width="600" height="140" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="320" y="428" text-anchor="middle" font-size="14" font-weight="800" fill="#1e293b">مريض الحرق ضعيف المناعة</text><text x="320" y="458" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">تجنب الزهور والنباتات الطازجة في غرفته</text><text x="320" y="486" text-anchor="middle" font-size="13" font-weight="700" fill="#4c1d95">Parkland: 4 مل × وزن (كجم) × %TBSA خلال 24 ساعة</text><text x="320" y="512" text-anchor="middle" font-size="12.5" font-weight="500" fill="#1e293b">نصف الكمية في أول 8 ساعات ونصفها في الـ 16 التالية</text>
</svg>
