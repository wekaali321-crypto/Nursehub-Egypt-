<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="250" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">روتا فيروس والوردية (Roseola) والمرض الخامس</text><rect x="20" y="46" width="600" height="30" rx="8" fill="#1e3a8a"/><text x="570.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">المرض</text><text x="445.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">العامل/العمر</text><text x="275.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الأعراض</text><text x="100.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">النقاط الأساسية</text><rect x="20" y="76" width="600" height="66" fill="#e0e7ff"/><text x="570.0" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Rotavirus</text><text x="445.0" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">أكثر سبب إسهال عند</text><text x="445.0" y="114" text-anchor="middle" font-size="12.5"  fill="#0f172a">الأطفال؛ انتقال برازي</text><text x="445.0" y="132" text-anchor="middle" font-size="12.5"  fill="#0f172a">فموي</text><text x="275.0" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">إسهال وقيء وجفاف: قلة بول،</text><text x="275.0" y="114" text-anchor="middle" font-size="12.5"  fill="#0f172a">جفاف أغشية، هبوط ضغط وضعي</text><text x="100.0" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">أولوية: خط وريدي وسوائل؛</text><text x="100.0" y="114" text-anchor="middle" font-size="12.5"  fill="#0f172a">غسل أيدي</text><rect x="20" y="142" width="600" height="48" fill="#fff"/><text x="570.0" y="162" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">Roseola</text><text x="445.0" y="162" text-anchor="middle" font-size="12.5"  fill="#0f172a">فيروسي؛ 6–24 شهرًا؛</text><text x="445.0" y="180" text-anchor="middle" font-size="12.5"  fill="#0f172a">إفرازات تنفسية ولعاب</text><text x="275.0" y="162" text-anchor="middle" font-size="12.5"  fill="#0f172a">حمى عالية ثم انخفاضها ثم طفح</text><text x="100.0" y="162" text-anchor="middle" font-size="12.5"  fill="#0f172a">راحة وسوائل وخافض حرارة؛</text><text x="100.0" y="180" text-anchor="middle" font-size="12.5"  fill="#0f172a">لا مشاركة أكواب</text><rect x="20" y="190" width="600" height="48" fill="#e0e7ff"/><text x="570.0" y="210" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">المرض الخامس</text><text x="445.0" y="210" text-anchor="middle" font-size="12.5"  fill="#0f172a">Parvovirus B19</text><text x="275.0" y="210" text-anchor="middle" font-size="12.5"  fill="#0f172a">طفح أحمر بالخدين + ألم مفاصل</text><text x="100.0" y="210" text-anchor="middle" font-size="12.5"  fill="#0f172a">بعد ظهور الطفح لم يعد</text><text x="100.0" y="228" text-anchor="middle" font-size="12.5"  fill="#0f172a">معديًا؛ لا مضاد حيوي</text>
</svg>
