<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 589" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="589" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تليف الكبد (2): العلامات والمضاعفات والتحاليل</text><rect x="10" y="52" width="620" height="28.125" rx="0" fill="#0369a1" stroke="#cbd5e1" stroke-width="1"/><text x="525.0" y="71.375" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">المظهر</text><line x1="420" y1="52" x2="420" y2="80.125" stroke="#cbd5e1" stroke-width="1"/><text x="215.0" y="71.375" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">التفسير</text><rect x="10" y="80.125" width="620" height="28.125" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="525.0" y="99.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">يرقان</text><line x1="420" y1="80.125" x2="420" y2="108.25" stroke="#cbd5e1" stroke-width="1"/><text x="215.0" y="99.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">اصفرار الجلد والعين من تراكم البيليروبين</text><rect x="10" y="108.25" width="620" height="46.25" rx="0" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="525.0" y="127.625" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">ارتفاع ضغط البوابة (&gt;10 ملم</text><text x="525.0" y="145.75" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">زئبق)</text><line x1="420" y1="108.25" x2="420" y2="154.5" stroke="#cbd5e1" stroke-width="1"/><text x="215.0" y="127.625" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">احتقان وريد الباب فيتسرب سائل إلى البطن</text><rect x="10" y="154.5" width="620" height="28.125" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="525.0" y="173.875" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">استسقاء (Ascites)</text><line x1="420" y1="154.5" x2="420" y2="182.625" stroke="#cbd5e1" stroke-width="1"/><text x="215.0" y="173.875" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">بطن ممتلئ بالسائل: يبدو كالحامل</text><rect x="10" y="182.625" width="620" height="28.125" rx="0" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="525.0" y="202.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">دوالي المريء</text><line x1="420" y1="182.625" x2="420" y2="210.75" stroke="#cbd5e1" stroke-width="1"/><text x="215.0" y="202.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">تضخم أوردة المريء وقد تنفجر وتسد المجرى (مميت)</text><rect x="10" y="210.75" width="620" height="28.125" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="525.0" y="230.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">اعتلال دماغي كبدي</text><line x1="420" y1="210.75" x2="420" y2="238.875" stroke="#cbd5e1" stroke-width="1"/><text x="215.0" y="230.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">أمونيا عالية: رعشة اليدين (Asterixis)، ارتباك، نعاس</text><rect x="330" y="246.875" width="300" height="129.0" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M330,256.875 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#dc2626"/><text x="480.0" y="265.875" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">دوالي المريء: الأولويات</text><text x="620" y="289.875" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قيء دموي: قيس العلامات الحيوية ثم أمّن</text><text x="620" y="307.275" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  المجرى الهوائي</text><text x="620" y="324.67499999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ضع المريض على الجانب</text><text x="620" y="342.07499999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• لا أنبوب أنفي معدي جديد (NGT)</text><text x="620" y="359.4749999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• لا ضغط/زحر (Straining) عند التبرز</text><rect x="10" y="246.875" width="310" height="146.39999999999998" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M10,256.875 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#7c3aed"/><text x="165.0" y="265.875" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">اعتلال المخ الكبدي</text><text x="310" y="289.875" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• لاحظ رعشة الذراعين الممدودتين (Asterixis)</text><text x="310" y="307.275" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قيّم الحالة العقلية وقارنها بالمناوبة</text><text x="310" y="324.67499999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  السابقة</text><text x="310" y="342.07499999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• اسأل عن الاسم والتاريخ والمكان</text><text x="310" y="359.4749999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• راجع نتائج الأمونيا</text><text x="310" y="376.8749999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قلّل البروتين في الغذاء</text><rect x="330" y="401.275" width="300" height="146.39999999999998" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,411.275 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="420.275" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">تحاليل فشل الكبد (ABC)</text><text x="620" y="444.275" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الأمونيا مرتفعة</text><text x="620" y="461.67499999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• A: ألبومين منخفض (أقل من 3.5) ← كالسيوم</text><text x="620" y="479.07499999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  منخفض وصفائح منخفضة</text><text x="620" y="496.4749999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• B: بيليروبين مرتفع</text><text x="620" y="513.8749999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• C: تجلط: PT وPTT وINR مرتفعة</text><text x="620" y="531.2749999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ارتفاع ALT وAST</text><rect x="10" y="401.275" width="310" height="163.79999999999998" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,411.275 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="420.275" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">نقص الكالسيوم</text><text x="310" y="444.275" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• علامة تروسو (Trousseau): تقلص اليد عند</text><text x="310" y="461.67499999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  ضغط الكفة</text><text x="310" y="479.07499999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• علامة شفوستك (Chvostek): انقباض الوجه عند</text><text x="310" y="496.4749999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الطرق على العصب</text><text x="310" y="513.8749999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• سؤال: المتوقع ارتفاعه: الأمونيا،</text><text x="310" y="531.2749999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  البيليروبين، PT؛ أما الألبومين والكالسيوم</text><text x="310" y="548.6749999999998" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  فيقلان</text></svg>