<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">درجة بيشوب (Bishop Score): جاهزية العنق للتحريض</text><rect x="510" y="46" width="100" height="30" fill="#e2e8f0" stroke="#fff"/><text x="560" y="67" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">العنصر</text><rect x="400" y="46" width="100" height="30" fill="#fecaca" stroke="#fff"/><text x="450" y="67" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">0</text><rect x="290" y="46" width="100" height="30" fill="#fed7aa" stroke="#fff"/><text x="340" y="67" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">1</text><rect x="180" y="46" width="100" height="30" fill="#fde68a" stroke="#fff"/><text x="230" y="67" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">2</text><rect x="70" y="46" width="100" height="30" fill="#bbf7d0" stroke="#fff"/><text x="120" y="67" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">3</text><rect x="510" y="80" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="560" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">القوام</text><rect x="400" y="80" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="450" y="101" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">صلب</text><rect x="290" y="80" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="340" y="101" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">متوسط</text><rect x="180" y="80" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="230" y="101" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">طري</text><rect x="70" y="80" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="120" y="101" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">—</text><rect x="510" y="114" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="560" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">الوضع</text><rect x="400" y="114" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="450" y="135" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">خلفي</text><rect x="290" y="114" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="340" y="135" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">متوسط</text><rect x="180" y="114" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="230" y="135" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">أمامي</text><rect x="70" y="114" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="120" y="135" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">—</text><rect x="510" y="148" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="560" y="169" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">الاتساع</text><rect x="400" y="148" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="450" y="169" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">0 سم</text><rect x="290" y="148" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="340" y="169" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">1–2</text><rect x="180" y="148" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="230" y="169" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">3–4</text><rect x="70" y="148" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="120" y="169" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">5 سم فأكثر</text><rect x="510" y="182" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="560" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">المحو</text><rect x="400" y="182" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="450" y="203" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">0–30%</text><rect x="290" y="182" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="340" y="203" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">40–50%</text><rect x="180" y="182" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="230" y="203" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">60–70%</text><rect x="70" y="182" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="120" y="203" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">80% فأكثر</text><rect x="510" y="216" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="560" y="237" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">المستوى</text><rect x="400" y="216" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="450" y="237" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">−3</text><rect x="290" y="216" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="340" y="237" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">−2</text><rect x="180" y="216" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="230" y="237" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">−1 أو 0</text><rect x="70" y="216" width="100" height="32" fill="#fff" stroke="#e2e8f0"/><text x="120" y="237" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">+1 أو +2</text><text x="320" y="275" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">مجموع أكثر من 6–8 يعني أن التحريض سينجح غالبًا</text>
