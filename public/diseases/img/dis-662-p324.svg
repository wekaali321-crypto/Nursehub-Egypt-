<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 398" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="398" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الذئبة الحمراء (SLE)</text><rect x="330" y="52" width="300" height="111.6" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#7c3aed"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الفكرة</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مرض مناعة ذاتية: الجسم يهاجم نفسه</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• التهاب بالجلد والمفاصل والكلى والقلب</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• فشل أعضاء مع الوقت (غالبًا الكلى)</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الأكثر: النساء 14–45 سنة، السبب مجهول</text><rect x="10" y="52" width="310" height="129.0" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#be123c"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلامات</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• طفح فراشة على الخدين والأنف</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• حمى فوق 100°ف (≈37.8°م): أبلغ الطبيب</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مفاصل مؤلمة ومتورمة</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• كرياتينين فوق 1.3 = كلى متأثرة</text><text x="310" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• انخفاض WBC، ارتفاع ESR وCRP</text><rect x="10" y="189.0" width="620" height="118" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="320" y="211.0" text-anchor="middle" font-size="14" font-weight="800" fill="#991b1b">تجنّب الـ S الأربعة</text><text x="606" y="233.0" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">S — Sun: التعرض للشمس والأشعة فوق البنفسجية</text><text x="606" y="253.0" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">S — Smoking: التدخين</text><text x="606" y="273.0" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">S — Stress: الإجهاد الجسدي والنفسي</text><text x="606" y="293.0" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">S — Sepsis: العدوى — أبلغ عن الحمى</text><rect x="10" y="319.0" width="620" height="53.5" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><text x="320" y="338.75" text-anchor="middle" font-size="12.5" font-weight="600" fill="#155e75">الأدوية: ستيرويدات (بريدنيزون)، كابتات المناعة: هيدروكسي كلوروكين، ميثوتريكسات،</text><text x="320" y="357.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#155e75">إنفليكسيماب، أزاثيوبرين.</text></svg>