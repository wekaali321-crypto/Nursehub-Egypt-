<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="420" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">phenytoin: المستوى والسمّية والتعليمات</text><rect x="15" y="45" width="610" height="70" rx="10" fill="#dbeafe"/><text x="320" y="76" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">المدى العلاجي: 10–20 ميكروجرام/ديسيلتر</text><text x="320" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">أقل من 10: خطر نوبات (أبلغ) | أعلى من 20: سُمّية (احبس الدواء وأبلغ)</text><rect x="330" y="135" width="295" height="100" rx="10" fill="#fee2e2"/><text x="477.5" y="163" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">علامات السمّية المبكرة</text><text x="477.5" y="181" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">ترنّح (Ataxia)</text><text x="477.5" y="199" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">رعشة اليدين</text><text x="477.5" y="217" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">كلام متلعثم</text><rect x="15" y="135" width="305" height="100" rx="10" fill="#fef9c3"/><text x="167.5" y="172" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">أعراض أخرى</text><text x="167.5" y="190" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">أفكار انتحارية</text><text x="167.5" y="208" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">طفح جلدي جديد مؤلم = أولوية</text><rect x="330" y="255" width="295" height="70" rx="10" fill="#dcfce7"/><text x="477.5" y="286" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">متوقعة: بطء قلب وهبوط ضغط</text><text x="477.5" y="304" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تضخم اللثة: فرشاة ناعمة ونظافة فم</text><rect x="15" y="255" width="305" height="70" rx="10" fill="#ede9fe"/><text x="167.5" y="286" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">أوقف التغذية بالأنبوب 1–2 ساعة</text><text x="167.5" y="304" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">قبل وبعد الجرعة</text><rect x="15" y="345" width="610" height="60" rx="10" fill="#ccfbf1"/><text x="320" y="380" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">لا موانع حمل فموية | لا إيقاف مفاجئ | حمض الفوليك وفيتامين D | أخبر طبيب الأسنان</text></svg>