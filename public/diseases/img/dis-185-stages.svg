<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 327" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="327" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">مراحل السعال الديكي</text><g text-anchor="middle"><rect x="80" y="46" width="480" height="40" rx="10" fill="#f1f5f9" stroke="#94a3b8"/><text x="320" y="68" font-size="14" font-weight="800" fill="#0f172a">حضانة (حسب المصدر 1–3 أسابيع)</text><path d="M320 86 V102" stroke="#64748b" stroke-width="3"/><path d="M314 96 L320 103 L326 96" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="104" width="480" height="57" rx="10" fill="#fef9c3" stroke="#eab308"/><text x="320" y="126" font-size="14" font-weight="800" fill="#422006">مرحلة الزكام (Catarrhal)</text><text x="320" y="144" font-size="12" font-weight="600" fill="#422006">عطس، رشح، حرارة، دموع، كحة خفيفة — أكثر مرحلة معدية</text><path d="M320 161 V177" stroke="#64748b" stroke-width="3"/><path d="M314 171 L320 178 L326 171" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="179" width="480" height="57" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="320" y="201" font-size="14" font-weight="800" fill="#7f1d1d">مرحلة النوبات (Paroxysmal)</text><text x="320" y="219" font-size="12" font-weight="600" fill="#7f1d1d">نوبات كحة متتالية تنتهي بشهقة (Whoop) وقد يصاحبها زرقة وقيء</text><path d="M320 236 V252" stroke="#64748b" stroke-width="3"/><path d="M314 246 L320 253 L326 246" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="254" width="480" height="57" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="320" y="276" font-size="14" font-weight="800" fill="#14532d">مرحلة النقاهة</text><text x="320" y="294" font-size="12" font-weight="600" fill="#14532d">تتحسن الكحة تدريجياً وقد تستمر حتى 10 أسابيع</text></g></svg>