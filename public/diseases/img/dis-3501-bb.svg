<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="420" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">حاصرات بيتا (Beta-blockers) في لمحة</text><rect x="240" y="50" width="160" height="56" rx="10" fill="#dbeafe"/><text x="320" y="74" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">حاصر بيتا</text><text x="320" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">أسماؤها تنتهي بـ -olol</text><rect x="440" y="130" width="185" height="110" rx="10" fill="#dcfce7"/><text x="532.5" y="163" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">الآلية</text><text x="532.5" y="181" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">يقلل استثارة القلب</text><text x="532.5" y="199" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">يقلل الشغل والأكسجين</text><text x="532.5" y="217" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">يثبّت الغشاء (مضاد اضطراب)</text><rect x="15" y="130" width="185" height="110" rx="10" fill="#fef9c3"/><text x="107.5" y="163" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">الاستعمالات</text><text x="107.5" y="181" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">ضغط، اضطراب نظم</text><text x="107.5" y="199" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">ذبحة، فشل قلب</text><text x="107.5" y="217" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">صداع نصفي، جلوكوما (قطرة)</text><rect x="440" y="270" width="185" height="120" rx="10" fill="#fee2e2"/><text x="532.5" y="308" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">موانع الاستعمال</text><text x="532.5" y="326" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">حساسية منها</text><text x="532.5" y="344" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">بطء جيبي، حصار درجة 2-3</text><text x="532.5" y="362" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">ربو/انتفاخ رئوي، هبوط ضغط</text><rect x="15" y="270" width="185" height="120" rx="10" fill="#ffedd5"/><text x="107.5" y="299" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">أعراض جانبية</text><text x="107.5" y="317" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">هبوط ضغط وضعي، بطء</text><text x="107.5" y="335" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">دوخة، صداع</text><text x="107.5" y="353" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">غثيان، إسهال، ارتفاع سكر</text><text x="107.5" y="371" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تشنج قصبي</text><rect x="240" y="160" width="160" height="160" rx="10" fill="#ede9fe"/><text x="320" y="209" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">الأولوية التمريضية</text><text x="320" y="227" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">قس النبض والضغط قبل الجرعة</text><text x="320" y="245" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">لا توقف الدواء فجأة</text><text x="320" y="263" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">بلّغ عن علامات فشل القلب</text><text x="320" y="281" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تحمّل: دوخة ونعاس</text><line x1="440" y1="185" x2="400" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><line x1="200" y1="185" x2="240" y2="200" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><line x1="440" y1="330" x2="400" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><line x1="200" y1="330" x2="240" y2="300" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><line x1="320" y1="106" x2="320" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/></svg>