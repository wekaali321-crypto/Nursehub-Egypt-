<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 541" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="541" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">مضاعفات التغذية الوريدية والمعوية ومتلازمة إعادة التغذية</text><rect x="326" y="50" width="294" height="161.75" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><path d="M326 60a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#15803d"/><text x="473" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">⁦TPN⁩ (الوريدية)</text><text x="610" y="96.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="96.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">العدوى (عبر القسطرة المركزية ⁦CVC⁩)</text><text x="610" y="117.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="117.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">قرح الإجهاد (⁦Stress ulcers⁩)</text><text x="610" y="138.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="598" y="138.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">فرط السكر ونقص السكر</text><rect x="20" y="50" width="294" height="161.75" rx="10" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><path d="M20 60a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#6d28d9"/><text x="167" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">المعوية (⁦NGT, PEG, G-tube⁩)</text><text x="304" y="96.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="96.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">انزياح الأنبوب</text><text x="304" y="117.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="117.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">انتفاخ البطن</text><text x="304" y="138.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="138.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">انسداد الأنبوب</text><text x="304" y="159.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="159.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">استنشاق (⁦Aspiration⁩) / انسداد مجرى الهواء</text><text x="304" y="181" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="292" y="181" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لا تغذية دفعية (⁦Bolus⁩) عبر أنبوب أنفي معدي</text><text x="292" y="199.125" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لمريض على جهاز التنفس</text><rect x="20" y="221.75" width="600" height="48" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="320" y="241.75" text-anchor="middle" font-size="13" font-weight="700" fill="#713f12">للوقاية من الاستنشاق: اطلب التغذية المستمرة (⁦Continuous⁩)</text><text x="320" y="260.75" text-anchor="middle" font-size="12.5" font-weight="400" fill="#713f12">أنبوب ⁦PEG⁩ انزاح وعمره أقل من ⁦7⁩ أيام: أبلغ الطبيب الذي وضعه</text><text x="320" y="297.75" text-anchor="middle" font-size="15" font-weight="800" fill="#b91c1c">متلازمة إعادة التغذية (⁦Refeeding Syndrome⁩)</text><rect x="434.66666666666663" y="307.75" width="185.33333333333334" height="93.19999999999999" rx="10" fill="#fff" stroke="#475569" stroke-width="1.5"/><path d="M434.66666666666663 317.75a10 10 0 0 1 10-10h165.33333333333334a10 10 0 0 1 10 10v22h-185.33333333333334z" fill="#475569"/><text x="527.3333333333333" y="328.75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">سوء تغذية شديد</text><text x="610" y="353.75" text-anchor="start" font-size="12" font-weight="700" fill="#475569">⁦•⁩</text><text x="598" y="353.75" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">مثل: القهم العصبي، إدمان</text><text x="598" y="371.15" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">الكحول المزمن</text><line x1="432.66666666666663" y1="354.35" x2="414.66666666666663" y2="354.35" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="227.3333333333333" y="307.75" width="185.33333333333334" height="93.19999999999999" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><path d="M227.3333333333333 317.75a10 10 0 0 1 10-10h165.33333333333334a10 10 0 0 1 10 10v22h-185.33333333333334z" fill="#c2410c"/><text x="319.99999999999994" y="328.75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">تغذية مفرطة وسريعة</text><text x="402.66666666666663" y="353.75" text-anchor="start" font-size="12" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="390.66666666666663" y="353.75" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">خلال ⁦24–48⁩ ساعة من بدء</text><text x="390.66666666666663" y="371.15" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">التغذية المعوية أو</text><text x="390.66666666666663" y="388.54999999999995" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">الوريدية</text><line x1="225.3333333333333" y1="354.35" x2="207.3333333333333" y2="354.35" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="19.999999999999943" y="307.75" width="185.33333333333334" height="93.19999999999999" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M19.999999999999943 317.75a10 10 0 0 1 10-10h165.33333333333334a10 10 0 0 1 10 10v22h-185.33333333333334z" fill="#b91c1c"/><text x="112.66666666666661" y="328.75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الأملاح تنتقل للأنسجة</text><text x="195.3333333333333" y="353.75" text-anchor="start" font-size="12" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="183.3333333333333" y="353.75" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">نقص حاد في البوتاسيوم</text><text x="183.3333333333333" y="371.15" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">والمغنيسيوم والفوسفات</text><rect x="475.17241379310343" y="410.95" width="144.82758620689657" height="29.4" fill="#b91c1c" stroke="#cbd5e1"/><text x="547.5862068965517" y="427.95" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الملح</text><rect x="330.34482758620686" y="410.95" width="144.82758620689657" height="29.4" fill="#b91c1c" stroke="#cbd5e1"/><text x="402.7586206896551" y="427.95" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الطبيعي</text><rect x="19.999999999999943" y="410.95" width="310.3448275862069" height="29.4" fill="#b91c1c" stroke="#cbd5e1"/><text x="175.1724137931034" y="427.95" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">نقصه يسبب</text><rect x="475.17241379310343" y="440.34999999999997" width="144.82758620689657" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="547.5862068965517" y="457.34999999999997" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">البوتاسيوم ⁦K⁩</text><rect x="330.34482758620686" y="440.34999999999997" width="144.82758620689657" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="402.7586206896551" y="457.34999999999997" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">⁦3.5–5.0 mEq/L⁩</text><rect x="19.999999999999943" y="440.34999999999997" width="310.3448275862069" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="175.1724137931034" y="457.34999999999997" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">أقل من ⁦3.5⁩: رجفان بطيني وتوقف القلب</text><rect x="475.17241379310343" y="469.74999999999994" width="144.82758620689657" height="29.4" fill="#fff" stroke="#cbd5e1"/><text x="547.5862068965517" y="486.74999999999994" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">المغنيسيوم ⁦Mg⁩</text><rect x="330.34482758620686" y="469.74999999999994" width="144.82758620689657" height="29.4" fill="#fff" stroke="#cbd5e1"/><text x="402.7586206896551" y="486.74999999999994" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">⁦1.3–2.1 mEq/L⁩</text><rect x="19.999999999999943" y="469.74999999999994" width="310.3448275862069" height="29.4" fill="#fff" stroke="#cbd5e1"/><text x="175.1724137931034" y="486.74999999999994" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">⁦Torsades de Pointes⁩؛ علاجه كبريتات المغنيسيوم</text><rect x="475.17241379310343" y="499.1499999999999" width="144.82758620689657" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="547.5862068965517" y="516.1499999999999" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">الفوسفات ⁦P⁩</text><rect x="330.34482758620686" y="499.1499999999999" width="144.82758620689657" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="402.7586206896551" y="516.1499999999999" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">⁦2.4–4.4 mg/dL⁩</text><rect x="19.999999999999943" y="499.1499999999999" width="310.3448275862069" height="29.4" fill="#f8fafc" stroke="#cbd5e1"/><text x="175.1724137931034" y="516.1499999999999" text-anchor="middle" font-size="12" font-weight="400" fill="#0f172a">ضعف عضلي وتنفسي</text></svg>