<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="360" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تدابير تمريضية لخفض ICP</text><rect x="330" y="46" width="290" height="100" rx="10" fill="#f97316"/><text x="475.0" y="91.7" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">تثبيت الرأس</text><text x="475.0" y="108.7" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">وضع محايد، قلب كوحدة (Log roll)</text><rect x="20" y="46" width="290" height="100" rx="10" fill="#6366f1"/><text x="165.0" y="91.7" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">خفض CO2</text><text x="165.0" y="108.7" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">فرط التهوية يخفض CO2 فيضيق الأوعية ويقل التورم</text><rect x="330" y="156" width="290" height="100" rx="10" fill="#2563eb"/><text x="475.0" y="201.7" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الوضع</text><text x="475.0" y="218.7" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">رأس 30-35° أو أكثر، لا ثني الوركين/الرقبة</text><rect x="20" y="156" width="290" height="100" rx="10" fill="#16a34a"/><text x="165.0" y="201.7" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">الشفط</text><text x="165.0" y="218.7" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">10 ثوانٍ أو أقل + 100% O2 قبل وبعد</text><rect x="20" y="270" width="600" height="76" rx="10" fill="#fee2e2"/><text x="320.0" y="295.2" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">تجنب: السعال، العطس، نفخ الأنف، مناورة فالسالفا وحبس النفس</text><text x="320.0" y="312.2" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">علّم المريض الزفير عند التقلب (لا يقول «سأسعل وأتنفس بعمق»)</text><text x="320.0" y="329.2" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">ارتفاع PaCO2 = ارتفاع ICP؛ ارفع التهوية</text></svg>