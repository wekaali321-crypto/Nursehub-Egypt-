<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 356" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="356" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أمراض الأوعية الطرفية: الأوردة مقابل الشرايين</text>
<rect x="346.0" y="52" width="320.0" height="176.0" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="346.0" y="52" width="320.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="506.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">PVD: وريدية (تضيق وريد)</text>
<text x="656.0" y="96" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• نبض واضح وأرجل دافئة</text>
<text x="656.0" y="116.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• وذمة (تجمع دم)</text>
<text x="656.0" y="136.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• قرح ضحلة غير منتظمة الشكل</text>
<text x="656.0" y="156.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• ألم خفيف لا حاد</text>
<text x="656.0" y="176.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• ثنايا الكاحل صفراء/بنية</text>
<text x="656.0" y="196.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• الوضعية: ارفع الساقين (Elevate)</text>
<rect x="14.0" y="52" width="320.0" height="176.0" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="14.0" y="52" width="320.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="174.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">PAD: شريانية (تضيق شريان)</text>
<text x="324.0" y="96" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• نبض غائب وشعر غائب وجلد لامع وأرجل باردة</text>
<text x="324.0" y="116.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• قرح مستديرة (تجمع دم)</text>
<text x="324.0" y="136.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• أصابع وقدم شاحبة أو سوداء (إسكار)</text>
<text x="324.0" y="156.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• ألم عرجي حاد بالربلة عند المشي</text>
<text x="324.0" y="174.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">(Claudication)؛ التمرين يفيد والرفع المستمر</text>
<text x="324.0" y="192.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">لا</text>
<text x="324.0" y="212.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• الوضعية: دلِّ الساقين لأسفل (Dangle)</text>
<rect x="14.0" y="248.0" width="652.0" height="80.0" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.2"/>
<rect x="14.0" y="248.0" width="652.0" height="26" rx="10" fill="#6366f1" fill-opacity="1" stroke="#6366f1" stroke-width="1.2"/>
<text x="340.0" y="266.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">تثقيف مشترك (PVD وPAD)</text>
<text x="656.0" y="292.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• تجنب الضيق: لا ملابس ضيقة، لا تربيع الساقين، لا كافيين ولا سجائر ولا برد</text>
<text x="656.0" y="312.0" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">• قص أظافر القدم بواسطة الطبيب/مختص فقط</text>
</svg>
