<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 530" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="530" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التقييم من الرأس إلى القدم</text>
<rect x="250" y="60" width="140" height="380" rx="40" fill="#e6edf3" stroke="#94a3b8" stroke-width="1.5"/><circle cx="320" cy="90" r="24" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5"/><rect x="20" y="50" width="190" height="112" rx="10" fill="#fff" stroke="#a78bfa" stroke-width="2"/><rect x="20" y="50" width="190" height="24" rx="10" fill="#a78bfa" stroke="none" stroke-width="1.5"/><rect x="20" y="62" width="190" height="12" rx="0" fill="#a78bfa" stroke="none" stroke-width="1.5"/><text x="115" y="67" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">البداية</text><text x="115" y="92" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">عرّف بنفسك، خصوصية، اغسل يديك،</text><text x="115" y="107" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">موافقة، حساسية، تقييم نفسي</text><text x="115" y="122" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">اجتماعي</text><line x1="210" y1="106" x2="320" y2="126" stroke="#a78bfa" stroke-width="1.5"/><rect x="20" y="170" width="190" height="112" rx="10" fill="#fff" stroke="#f59e0b" stroke-width="2"/><rect x="20" y="170" width="190" height="24" rx="10" fill="#f59e0b" stroke="none" stroke-width="1.5"/><rect x="20" y="182" width="190" height="12" rx="0" fill="#f59e0b" stroke="none" stroke-width="1.5"/><text x="115" y="187" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">المعدلات الطبيعية</text><text x="115" y="212" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">ضغط أقل من 120/80 | نبض 60-100</text><text x="115" y="227" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">| تنفس 12-20 | حرارة 37°م |</text><text x="115" y="242" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">SpO2 ≥ 95%</text><line x1="210" y1="226" x2="320" y2="246" stroke="#f59e0b" stroke-width="1.5"/><rect x="20" y="290" width="190" height="112" rx="10" fill="#fff" stroke="#ec4899" stroke-width="2"/><rect x="20" y="290" width="190" height="24" rx="10" fill="#ec4899" stroke="none" stroke-width="1.5"/><rect x="20" y="302" width="190" height="12" rx="0" fill="#ec4899" stroke="none" stroke-width="1.5"/><text x="115" y="307" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">الدورة الدموية والجلد</text><text x="115" y="332" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">نبضات: سباتي (لا تفحص الجانبين</text><text x="115" y="347" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">معاً)، كعبري، عضدي، فخذي،</text><text x="115" y="362" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">ركبي، ظهر القدم، ظنبوب | ملء</text><text x="115" y="377" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">شعيري أقل من 3 ث | مرونة الجلد</text><text x="115" y="392" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">3 ث</text><line x1="210" y1="346" x2="320" y2="386" stroke="#ec4899" stroke-width="1.5"/><rect x="430" y="50" width="190" height="112" rx="10" fill="#fff" stroke="#06b6d4" stroke-width="2"/><rect x="430" y="50" width="190" height="24" rx="10" fill="#06b6d4" stroke="none" stroke-width="1.5"/><rect x="430" y="62" width="190" height="12" rx="0" fill="#06b6d4" stroke="none" stroke-width="1.5"/><text x="525" y="67" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">الرأس والرقبة</text><text x="525" y="92" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">شعر، أعصاب قحفية، عين PERRLA،</text><text x="525" y="107" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">أنف، فم، لسان في الوسط، عقد</text><text x="525" y="122" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">لمفية</text><line x1="430" y1="106" x2="320" y2="126" stroke="#06b6d4" stroke-width="1.5"/><rect x="430" y="170" width="190" height="112" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/><rect x="430" y="170" width="190" height="24" rx="10" fill="#22c55e" stroke="none" stroke-width="1.5"/><rect x="430" y="182" width="190" height="12" rx="0" fill="#22c55e" stroke="none" stroke-width="1.5"/><text x="525" y="187" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">الصدر</text><text x="525" y="212" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">قلب: 5 مناطق إصغاء | رئة: تنفس</text><text x="525" y="227" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">منتظم | ثدي: كتل وإفراز</text><line x1="430" y1="226" x2="320" y2="246" stroke="#22c55e" stroke-width="1.5"/><rect x="430" y="290" width="190" height="112" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/><rect x="430" y="290" width="190" height="24" rx="10" fill="#3b82f6" stroke="none" stroke-width="1.5"/><rect x="430" y="302" width="190" height="12" rx="0" fill="#3b82f6" stroke="none" stroke-width="1.5"/><text x="525" y="307" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">البطن</text><text x="525" y="332" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">أصوات الأمعاء في 4 أرباع</text><text x="525" y="347" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">(استمع 5 دقائق إن غابت)، شكل</text><text x="525" y="362" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">مسطح، ألم عند الجس</text><line x1="430" y1="346" x2="320" y2="386" stroke="#3b82f6" stroke-width="1.5"/><rect x="210" y="450" width="220" height="60" rx="10" fill="#ccfbf1" stroke="#14b8a6" stroke-width="1.5"/><text x="320" y="472" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">مدى حركة كل المفاصل</text><text x="320" y="488" text-anchor="middle" font-size="11" font-weight="500" fill="#0f172a">والمنعكسات الوترية العميقة</text>
</svg>
