<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 367" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="367" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">متلازمة ستيفنز جونسون (SJS)</text><text x="320" y="50" text-anchor="middle" font-size="12.5" font-weight="700" fill="#475569">وصورتها الأشد: التقشر البشروي السمي TEN</text><rect x="330" y="70" width="300" height="94.19999999999999" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.5"/><path d="M330,80 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#be123c"/><text x="480.0" y="89" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الفكرة</text><text x="620" y="113" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• اضطراب جلدي مميت قد يتطور إلى TEN</text><text x="620" y="130.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• غالبًا مرتبط بتفاعل دوائي</text><text x="620" y="147.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• المضاعفة الكبرى: تسمم الدم (Sepsis)</text><rect x="10" y="70" width="310" height="111.6" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M10,80 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#0369a1"/><text x="165.0" y="89" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأعراض</text><text x="310" y="113" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أعراض شبيهة بالإنفلونزا</text><text x="310" y="130.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• طفح مؤلم وحمامى منتشرة</text><text x="310" y="147.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تقشر الجلد وفقاعات</text><text x="310" y="165.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• جلد وأغشية مخاطية مجردة (Denuded)</text><rect x="10" y="189.6" width="620" height="150" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/><text x="320" y="211.6" text-anchor="middle" font-size="14" font-weight="800" fill="#155e75">نقاط NCLEX (التدخل يشبه الحروق الشديدة)</text><text x="606" y="237.6" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">1) الوقاية من العدوى: عزل عكسي (Reverse isolation)</text><text x="606" y="258.6" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">2) العناية بالجروح: معقمة وضمادات رطبة</text><text x="606" y="279.6" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">3) غرفة دافئة (فقد الحرارة عبر الجلد المتقشر)</text><text x="606" y="300.6" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">4) العين: كمادات باردة ومرطبات (Lubricants)</text><text x="606" y="321.6" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">كل شيء يجب أن يكون معقمًا لمنع العدوى</text></svg>