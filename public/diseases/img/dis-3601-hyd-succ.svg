<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 234" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="234" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الهيدانتوين مقابل السكسينيميد</text><rect x="326.0" y="48" width="294.0" height="166.5" rx="10" fill="#fff" stroke="#1e3a8a" stroke-width="2"/><rect x="326.0" y="48" width="294.0" height="28" rx="10" fill="#1e3a8a"/><text x="473.0" y="67" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الهيدانتوين (phenytoin, fosphenytoin)</text><text x="610.0" y="96.5" text-anchor="start" font-size="12.5" fill="#0f172a">• يثبّت فرط استثارة القشرة الحركية بعد</text><text x="610.0" y="114.0" text-anchor="start" font-size="12.5" fill="#0f172a">المشبك</text><text x="610.0" y="131.5" text-anchor="start" font-size="12.5" fill="#0f172a">• كل أنواع النوبات + ألم عصبي + اضطراب</text><text x="610.0" y="149.0" text-anchor="start" font-size="12.5" fill="#0f172a">ثنائي القطب</text><text x="610.0" y="166.5" text-anchor="start" font-size="12.5" fill="#0f172a">• تضخم لثة، رأرأة، رنح، كلام متثاقل</text><text x="610.0" y="184.0" text-anchor="start" font-size="12.5" fill="#0f172a">• مضاد استطباب: بطء جيبي، block قلبي</text><rect x="20.0" y="48" width="294.0" height="166.5" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="20.0" y="48" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="167.0" y="67" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">السكسينيميد (ethosuximide, methsuximide)</text><text x="304.0" y="96.5" text-anchor="start" font-size="12.5" fill="#0f172a">• يخفّض استثارة القشرة الحركية فيرفع</text><text x="304.0" y="114.0" text-anchor="start" font-size="12.5" fill="#0f172a">عتبة التشنج</text><text x="304.0" y="131.5" text-anchor="start" font-size="12.5" fill="#0f172a">• النوبات الجزئية</text><text x="304.0" y="149.0" text-anchor="start" font-size="12.5" fill="#0f172a">• نفس التأثيرات الجانبية العصبية</text><text x="304.0" y="166.5" text-anchor="start" font-size="12.5" fill="#0f172a">واللثوية</text><text x="304.0" y="184.0" text-anchor="start" font-size="12.5" fill="#0f172a">• مضاد استطباب: تثبيط نخاع العظم، فشل</text><text x="304.0" y="201.5" text-anchor="start" font-size="12.5" fill="#0f172a">كبدي/كلوي، ذئبة</text></svg>