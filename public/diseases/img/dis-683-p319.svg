<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="388" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الهيموفيليا (A وB)</text><rect x="330" y="52" width="300" height="111.6" rx="10" fill="#fff" stroke="#be123c" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#be123c"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">النوعان</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• A: نقص العامل VIII (الأكثر شيوعًا)</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• B: نقص العامل IX</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• اضطراب وراثي: الدم لا يتجلط جيدًا</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أي جرح صغير ينزف طويلًا</text><rect x="10" y="52" width="310" height="111.6" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#0369a1"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأعراض</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ألم وكدمات ونمش دموي (Petechiae)</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ضعف تروية الأنسجة</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تيبس المفاصل وقلة الحركة</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مشاكل التمريض: ألم، قلق، نقص حجم السوائل</text><rect x="330" y="171.6" width="300" height="129.0" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M330,181.6 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#16a34a"/><text x="480.0" y="190.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج</text><text x="620" y="214.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ممنوع الحقن (وريدي/عضلي/تحت الجلد) ما</text><text x="620" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  لم يلزم</text><text x="620" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• عوامل التجلط البديلة</text><text x="620" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• كمادات ثلج مع رفع المنطقة</text><text x="620" y="284.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ركبة متورمة بعد صدمة: ثلج + رفع</text><rect x="10" y="171.6" width="310" height="111.6" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,181.6 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="190.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التثقيف</text><text x="310" y="214.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ممنوع NSAIDs</text><text x="310" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ممنوع الشفرات: ماكينة كهربائية</text><text x="310" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ممنوع رياضات الاحتكاك</text><text x="310" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تجنب أي دواء يمنع التجلط</text><rect x="10" y="308.6" width="620" height="53.5" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="320" y="328.35" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7f1d1d">فخ اختبار: ميبيريدين 75 مجم عضلي كل 4 ساعات لمريض هيموفيليا = اسأل عنه (الحقن العضلي</text><text x="320" y="347.1" text-anchor="middle" font-size="12.5" font-weight="600" fill="#7f1d1d">خطر).</text></svg>