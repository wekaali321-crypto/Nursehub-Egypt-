<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="300" rx="14" fill="#f7fafc" stroke="#cbd5e0"/>
<text x="320" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#1a365d">أقصى جرعة للبالغ من المخدر الموضعي (بدون أدرينالين)</text>
<g font-size="14" fill="#2d3748"><text x="620" y="85" text-anchor="end" font-weight="700">ليدوكايين 2% (Xylocaine)</text><text x="620" y="145" text-anchor="end" font-weight="700">ميبيفاكايين 1% (Mepacaine)</text><text x="620" y="205" text-anchor="end" font-weight="700">بوبيفاكايين 0.25% (Marcaine)</text></g>
<rect x="150" y="95" width="64" height="22" rx="4" fill="#2b6cb0"/><text x="144" y="112" text-anchor="end" font-size="14" fill="#2d3748">15 مل = 300 مجم</text>
<rect x="150" y="155" width="171" height="22" rx="4" fill="#2f855a"/><text x="144" y="172" text-anchor="end" font-size="14" fill="#2d3748">40 مل = 400 مجم</text>
<rect x="150" y="215" width="300" height="22" rx="4" fill="#c05621"/><text x="144" y="232" text-anchor="end" font-size="14" fill="#2d3748">70 مل = 175 مجم</text>
<text x="320" y="272" text-anchor="middle" font-size="13" fill="#c53030">قاعدة: 1% = 10 مجم/مل، 2% = 20 مجم/مل، 0.25% = 2.5 مجم/مل. احسب دايماً بالوزن للأطفال.</text></svg>
