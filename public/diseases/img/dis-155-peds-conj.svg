<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 228" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="228" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب الملتحمة (العين الوردية) عند الأطفال</text><rect x="325" y="48" width="295" height="164" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الأسباب والعلامات</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">فيروسات وبكتيريا وحساسية</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">عند الرضع: انسداد قناة الدمع يؤدي لتراكم</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">البكتيريا</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">احمرار وحكة وتورم، شعور بالرمل، إفراز</text><text x="610" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">صديدي يكوّن قشرة (بكتيري)</text><rect x="20" y="48" width="295" height="164" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">العلاج</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">اغسل يديك قبل وبعد القطرة</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">بكتيري: مضادات حيوية (سلفاسيتاميد،</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">فلوروكينولون مثل ليفوفلوكساسين)</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">تحسسي: ستيرويد ومضادات هيستامين</text><text x="305" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">امسح من الزاوية الداخلية للأسفل وللخارج</text><text x="305" y="200" text-anchor="start" font-size="12.5" fill="#1e293b">بعيدًا عن العين الأخرى</text>
</svg>
