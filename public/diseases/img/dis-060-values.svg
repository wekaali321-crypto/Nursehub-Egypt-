<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 272" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="272" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">القيم الكلوية المهمة</text><rect x="374" y="50" width="250" height="32" fill="#0d9488"/><text x="499" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">القيمة</text><rect x="16" y="50" width="358" height="32" fill="#0d9488"/><text x="195" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الطبيعي / الدلالة</text><rect x="374" y="82" width="250" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="102" text-anchor="start" font-size="13" fill="#0f172a">GFR معدل الترشيح الكبيبي</text><rect x="16" y="82" width="358" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="366" y="102" text-anchor="start" font-size="13" fill="#0f172a">أكثر من 90 mL/min طبيعي</text><rect x="374" y="113" width="250" height="31" fill="#ccfbf1" stroke="#cbd5e1"/><text x="616" y="133" text-anchor="start" font-size="13" fill="#0f172a">BUN يوريا الدم</text><rect x="16" y="113" width="358" height="31" fill="#ccfbf1" stroke="#cbd5e1"/><text x="366" y="133" text-anchor="start" font-size="13" fill="#0f172a">10–20 mg/dL</text><rect x="374" y="144" width="250" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="164" text-anchor="start" font-size="13" fill="#0f172a">الكرياتينين Creatinine</text><rect x="16" y="144" width="358" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="366" y="164" text-anchor="start" font-size="13" fill="#0f172a">أعلى من 1.3 = خلل كلوي (ناتج من تآكل العضلات</text><text x="366" y="183" text-anchor="start" font-size="13" fill="#0f172a">الطبيعي)</text><rect x="374" y="194" width="250" height="31" fill="#ccfbf1" stroke="#cbd5e1"/><text x="616" y="214" text-anchor="start" font-size="13" fill="#0f172a">إخراج البول</text><rect x="16" y="194" width="358" height="31" fill="#ccfbf1" stroke="#cbd5e1"/><text x="366" y="214" text-anchor="start" font-size="13" fill="#0f172a">30 mL/ساعة أو أقل = إجهاد كلوي</text><rect x="374" y="225" width="250" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="245" text-anchor="start" font-size="13" fill="#0f172a">الأس الهيدروجيني pH الدم</text><rect x="16" y="225" width="358" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="366" y="245" text-anchor="start" font-size="13" fill="#0f172a">أقل من 7.35 = حماض (H+ زائد)</text></svg>