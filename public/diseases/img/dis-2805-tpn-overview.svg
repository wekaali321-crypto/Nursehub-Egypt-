<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="360" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">التغذية الوريدية الكاملة (⁦TPN⁩)</text><text x="320" y="52" text-anchor="middle" font-size="12.5" font-weight="400" fill="#64748b">كل الغذاء في كيس وريدي يتجاوز الجهاز الهضمي: عبر خط مركزي فقط</text><rect x="426.66666666666663" y="62" width="193.33333333333334" height="154.4" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/><path d="M426.66666666666663 72a10 10 0 0 1 10-10h173.33333333333334a10 10 0 0 1 10 10v22h-193.33333333333334z" fill="#0e7490"/><text x="523.3333333333333" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الخط المركزي (⁦CVC⁩)</text><text x="610" y="108" text-anchor="start" font-size="12" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="108" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">خط ⁦PICC⁩</text><text x="610" y="128.4" text-anchor="start" font-size="12" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="128.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">قسطرة تحت الترقوة</text><text x="610" y="148.8" text-anchor="start" font-size="12" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="148.8" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">وريد وداجي داخلي</text><text x="610" y="169.20000000000002" text-anchor="start" font-size="12" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="169.20000000000002" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">المحلول سميك: لا يُعطى بخط</text><text x="598" y="186.60000000000002" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">طرفي</text><rect x="223.3333333333333" y="62" width="193.33333333333334" height="154.4" rx="10" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><path d="M223.3333333333333 72a10 10 0 0 1 10-10h173.33333333333334a10 10 0 0 1 10 10v22h-193.33333333333334z" fill="#6d28d9"/><text x="319.99999999999994" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الاستطبابات</text><text x="406.66666666666663" y="108" text-anchor="start" font-size="12" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="394.66666666666663" y="108" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">التهاب البنكرياس / كرون</text><text x="394.66666666666663" y="125.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">⁦(NPO)⁩</text><text x="406.66666666666663" y="145.8" text-anchor="start" font-size="12" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="394.66666666666663" y="145.8" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">حروق شديدة وصدمات (استقلاب</text><text x="394.66666666666663" y="163.20000000000002" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">مفرط)</text><text x="406.66666666666663" y="183.60000000000002" text-anchor="start" font-size="12" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="394.66666666666663" y="183.60000000000002" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">الأورام</text><text x="406.66666666666663" y="204.00000000000003" text-anchor="start" font-size="12" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="394.66666666666663" y="204.00000000000003" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">سوء امتصاص مزمن</text><rect x="19.999999999999943" y="62" width="193.33333333333334" height="154.4" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><path d="M19.999999999999943 72a10 10 0 0 1 10-10h173.33333333333334a10 10 0 0 1 10 10v22h-193.33333333333334z" fill="#15803d"/><text x="116.66666666666661" y="83" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">رعاية تمريضية</text><text x="203.3333333333333" y="108" text-anchor="start" font-size="12" font-weight="700" fill="#15803d">⁦•⁩</text><text x="191.3333333333333" y="108" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">وزن يومي</text><text x="203.3333333333333" y="128.4" text-anchor="start" font-size="12" font-weight="700" fill="#15803d">⁦•⁩</text><text x="191.3333333333333" y="128.4" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">متابعة سكر الدم</text><text x="203.3333333333333" y="148.8" text-anchor="start" font-size="12" font-weight="700" fill="#15803d">⁦•⁩</text><text x="191.3333333333333" y="148.8" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">ارتفاع السكر: بوال، عطش</text><text x="191.3333333333333" y="166.20000000000002" text-anchor="start" font-size="12" font-weight="400" fill="#0f172a">شديد، غثيان، صداع، ألم بطن</text><rect x="326" y="228.4" width="294" height="119.5" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><path d="M326 238.4a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#c2410c"/><text x="473" y="249.4" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">قواعد الإعطاء</text><text x="610" y="274.9" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="598" y="274.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ممنوع أي دواء وريدي عبر خط ⁦TPN⁩ (دفعة أو</text><text x="598" y="293.025" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">⁦Piggyback)⁩</text><text x="610" y="314.15" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="598" y="314.15" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ابدأ وأوقف ببطء، لا تتوقف فجأة</text><text x="610" y="335.275" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="598" y="335.275" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">غيّر الكيس والأنابيب كل ⁦24⁩ ساعة</text><rect x="20" y="228.4" width="294" height="119.5" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="1.5"/><path d="M20 238.4a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#b91c1c"/><text x="167" y="249.4" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الكيس فرغ ولا يوجد بديل؟</text><text x="304" y="274.9" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="292" y="274.9" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">علّق ديكستروز ⁦10%⁩ في الماء (⁦D10W⁩)</text><text x="304" y="296.025" text-anchor="start" font-size="12.5" font-weight="700" fill="#b91c1c">⁦•⁩</text><text x="292" y="296.025" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لمنع نقص سكر الدم المفاجئ</text></svg>