<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="360" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">القولون التقرحي وكرون (1)</text>
<rect x="346.0" y="52" width="320.0" height="134.25" rx="10" fill="#0e7490" fill-opacity="0.1" stroke="#0e7490" stroke-width="1.2"/>
<rect x="346.0" y="52" width="320.0" height="26" rx="10" fill="#0e7490" fill-opacity="1" stroke="#0e7490" stroke-width="1.2"/>
<text x="506.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الفكرة والمحفزات</text>
<text x="656.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• كلاهما مرضا التهاب أمعاء مناعي ذاتي (IBD):</text>
<text x="656.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">تأتي الأعراض وتذهب</text>
<text x="656.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• المحفزات: توتر (نقطة امتحان)، تدخين، عدوى</text>
<text x="656.0" y="149.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">(Sepsis)</text>
<rect x="14.0" y="52" width="320.0" height="134.25" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="14.0" y="52" width="320.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="174.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">القولون التقرحي UC</text>
<text x="324.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• التهاب وتقرحات بالقولون (قرحات مفتوحة طويلة</text>
<text x="324.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">تنزف) فانخفاض الهيموجلوبين</text>
<text x="324.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• 15–20 براز سائل دموي يومياً</text>
<text x="324.0" y="151.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• فقر دم: انخفاض H/H</text>
<text x="324.0" y="171.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ألم ارتدادي (أبلغ الطبيب)</text>
<rect x="346.0" y="198.25" width="320.0" height="134.25" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="346.0" y="198.25" width="320.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="506.0" y="216.25" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">مرض كرون</text>
<text x="656.0" y="242.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• حبيبيات التهابية من الفم للشرج وأكثرها</text>
<text x="656.0" y="259.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">بالأمعاء الدقيقة ولا تنزف</text>
<text x="656.0" y="278.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• التهاب عميق قد يسبب نواسير (Fistulas)</text>
<text x="656.0" y="298.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• نحو 5 براز رخو يومياً (مخاط/صديد)</text>
<text x="656.0" y="317.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• إسهال دهني (Steatorrhea)</text>
<rect x="14.0" y="198.25" width="320.0" height="134.25" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.2"/>
<rect x="14.0" y="198.25" width="320.0" height="26" rx="10" fill="#6366f1" fill-opacity="1" stroke="#6366f1" stroke-width="1.2"/>
<text x="174.0" y="216.25" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">أسئلة شائعة</text>
<text x="324.0" y="242.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• UC: ما النتيجة المتسقة؟ انخفاض الهيموجلوبين</text>
<text x="324.0" y="261.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• UC: ما الذي تُبلغ عنه؟ ألم ارتدادي</text>
</svg>
