<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">خشونة المفاصل: الأعراض والعناية بعد استبدال الركبة</text>
<rect x="20.0" y="48" width="295.0" height="110" rx="10" fill="#b91c1c"/>
<text x="167.5" y="88.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">العلامات</text>
<text x="167.5" y="107.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">طقطقة (Crepitus)</text>
<text x="167.5" y="126.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ألم يزيد بالنشاط ويقل بالراحة</text>
<rect x="325.0" y="48" width="295.0" height="110" rx="10" fill="#ca8a04"/>
<text x="472.5" y="97.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">عوامل الخطر</text>
<text x="472.5" y="116.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">سمنة، تدخين، إجهاد متكرر</text>
<rect x="20.0" y="168" width="295.0" height="110" rx="10" fill="#0369a1"/>
<text x="167.5" y="217.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">دواء</text>
<text x="167.5" y="236.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">NSAIDs، ستيرويدات، glucosamine</text>
<rect x="325.0" y="168" width="295.0" height="110" rx="10" fill="#0f766e"/>
<text x="472.5" y="198.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">بعد استبدال الركبة</text>
<text x="472.5" y="217.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لا وسادة تحت الركبة</text>
<text x="472.5" y="236.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">حركة مبكرة وتحريك القدم كل ساعة</text>
<text x="472.5" y="255.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">مميعات</text>
</svg>
