<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 430" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs>
<rect width="640" height="430" rx="16" fill="#f8fafc"/>
<text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >مضادات الإسهال ومضاد التشنج (دايسيكلومين)</text>
<rect x="330" y="50" width="300" height="145" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="330" y="50" width="300" height="28" rx="10" fill="#0369a1"/>
<text x="480.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >مضادات الإسهال</text>
<text x="480.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >لوبراميد (Loperamide): تقلل الحركة، قولون عصبي</text>
<text x="480.0" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >ديفينوكسين/ديفينوكسيلات: قريبان من الأفيون</text>
<text x="480.0" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >بزموث (Bismuth)</text>
<text x="480.0" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >تينكتشر الأفيون (Paregoric): الإسهال الشديد</text>
<rect x="10" y="50" width="310" height="145" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="50" width="310" height="28" rx="10" fill="#b91c1c"/>
<text x="165.0" y="69" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >ممنوع إذا</text>
<text x="165.0" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >إسهال بكتيري (E. coli، سالمونيلا، شيجيلا)</text>
<text x="165.0" y="124" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >التهاب قولون غشائي كاذب</text>
<text x="165.0" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >ألم بطني مجهول أو يرقان انسدادي</text>
<text x="165.0" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >أطفال أقل من سنتين</text>
<rect x="330" y="210" width="300" height="205" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="330" y="210" width="300" height="28" rx="10" fill="#7c3aed"/>
<text x="480.0" y="229" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >دايسيكلومين (Bentyl)</text>
<text x="480.0" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >للقولون العصبي مع إسهال كثير</text>
<text x="480.0" y="286" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >يريح العضلة الملساء ويجفف الإفرازات</text>
<text x="480.0" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >جفاف: إمساك، فم جاف، احتباس بول</text>
<rect x="10" y="210" width="310" height="205" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="10" y="210" width="310" height="28" rx="10" fill="#b91c1c"/>
<text x="165.0" y="229" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff" >متى تتجنبه (جاف)</text>
<text x="165.0" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >لا لانسداد/شلل أمعاء</text>
<text x="165.0" y="286" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >لا لزرق ضيق الزاوية (الساد مقبول)</text>
<text x="165.0" y="312" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >لا للمثانة الممتلئة (أكثر من 400 مل)</text>
<text x="165.0" y="338" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b" >مواد: NO pee, NO see, NO spit</text>
