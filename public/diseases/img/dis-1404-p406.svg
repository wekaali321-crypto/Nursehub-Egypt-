<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 464" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="464" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الغسيل البريتوني: ماذا تفعل ومتى تبلّغ</text><rect x="30" y="54" width="580" height="54" rx="10" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="578" cy="81" r="14" fill="#0ea5e9"/><text x="578" y="86" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="554" y="76" text-anchor="start" font-size="13.5" fill="#0f172a">قبل البدء: وزن المريض ثم تدفئة المحلول (dialysate) — أول إجراء هو</text><text x="554" y="95.575" text-anchor="start" font-size="13.5" fill="#0f172a">التدفئة</text><text x="320" y="119" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="122" width="580" height="54" rx="10" fill="#6366f1" fill-opacity="0.14" stroke="#6366f1" stroke-width="1.5"/><circle cx="578" cy="149" r="14" fill="#6366f1"/><text x="578" y="154" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="554" y="144" text-anchor="start" font-size="13.5" fill="#0f172a">العدوى: التقنية المعقمة أولوية. الحمى + تسارع القلب + تصريف عكر =</text><text x="554" y="163.575" text-anchor="start" font-size="13.5" fill="#0f172a">التهاب بريتوني، يُبلَّغ الطبيب</text><text x="320" y="187" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="190" width="580" height="54" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.5"/><circle cx="578" cy="217" r="14" fill="#f59e0b"/><text x="578" y="222" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="554" y="212" text-anchor="start" font-size="13.5" fill="#0f172a">ضيق التنفس بعد ضخ سريع أو امتلاء البطن: خراخر بالقواعد + تنفس سريع</text><text x="554" y="231.575" text-anchor="start" font-size="13.5" fill="#0f172a">+ لهاث → ارفع رأس السرير أولاً (التنفس قبل الدورة)</text><text x="320" y="255" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="258" width="580" height="54" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="1.5"/><circle cx="578" cy="285" r="14" fill="#10b981"/><text x="578" y="290" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="554" y="280" text-anchor="start" font-size="13.5" fill="#0f172a">ضعف الخارج من البطن: افحص البطن (انتفاخ/إمساك) ثم افحص القسطرة</text><text x="554" y="299.575" text-anchor="start" font-size="13.5" fill="#0f172a">(انثناء/انسداد) ثم غيّر الوضع إلى الاستلقاء الجانبي</text><rect x="426.66666666666663" y="322" width="193.33333333333334" height="127.6" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="426.66666666666663" y="322" width="193.33333333333334" height="48" rx="10" fill="#ef4444"/><text x="612" y="340" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">علامات الالتهاب</text><text x="612" y="359" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">البريتوني</text><text x="612" y="386" text-anchor="start" font-size="13" fill="#0f172a">• حمى</text><text x="612" y="409.2" text-anchor="start" font-size="13" fill="#0f172a">• تسارع القلب</text><text x="612" y="432.4" text-anchor="start" font-size="13" fill="#0f172a">• تصريف عكر</text><rect x="223.33333333333331" y="322" width="193.33333333333334" height="127.6" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="223.33333333333331" y="322" width="193.33333333333334" height="48" rx="10" fill="#f59e0b"/><text x="408.66666666666663" y="340" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">علامات الزيادة في</text><text x="408.66666666666663" y="359" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الامتلاء</text><text x="408.66666666666663" y="386" text-anchor="start" font-size="13" fill="#0f172a">• خراخر بالقواعد</text><text x="408.66666666666663" y="409.2" text-anchor="start" font-size="13" fill="#0f172a">• تنفس سريع</text><text x="408.66666666666663" y="432.4" text-anchor="start" font-size="13" fill="#0f172a">• لهاث</text><rect x="20" y="322" width="193.33333333333334" height="127.6" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.5"/><rect x="20" y="322" width="193.33333333333334" height="29" rx="10" fill="#0ea5e9"/><text x="205.33333333333334" y="340" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">إذا لم يخرج السائل</text><text x="205.33333333333334" y="367" text-anchor="start" font-size="13" fill="#0f172a">• بطن منتفخ؟ إمساك؟</text><text x="205.33333333333334" y="390.2" text-anchor="start" font-size="13" fill="#0f172a">• القسطرة منثنية؟</text><text x="205.33333333333334" y="413.4" text-anchor="start" font-size="13" fill="#0f172a">• وضع جانبي</text></svg>
