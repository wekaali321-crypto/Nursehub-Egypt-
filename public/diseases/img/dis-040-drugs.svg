<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 302" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="302" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أدوية الربو: موسعات القصبات ومضادات الالتهاب</text><rect x="16" y="56" width="608" height="109" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><rect x="16" y="56" width="608" height="30" rx="12" fill="#16a34a"/><text x="320" y="77" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">موسعات القصبات (BAM)</text><text x="614" y="108" text-anchor="start" font-size="13" fill="#14532d">B: ناهضات بيتا 2 مثل albuterol (دواء الإسعاف الأول والوحيد للنوبات)</text><text x="614" y="127" text-anchor="start" font-size="13" fill="#14532d">A: مضادات الكولين مثل ipratropium</text><text x="614" y="146" text-anchor="start" font-size="13" fill="#14532d">M: ميثيل زانثين مثل theophylline (سام وسريع القلب؛ المستوى العلاجي 10–20)</text><rect x="16" y="177" width="608" height="109" rx="12" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/><rect x="16" y="177" width="608" height="30" rx="12" fill="#db2777"/><text x="320" y="198" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">مضادات الالتهاب (SLM)</text><text x="614" y="229" text-anchor="start" font-size="13" fill="#831843">S: ستيرويدات مثل beclomethasone</text><text x="614" y="248" text-anchor="start" font-size="13" fill="#831843">L: مثبطات اللوكوترين مثل montelukast</text><text x="614" y="267" text-anchor="start" font-size="13" fill="#831843">M: مثبتات الخلايا البدينة مثل cromolyn</text></svg>