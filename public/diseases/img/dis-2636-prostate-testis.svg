<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="440" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">سرطان البروستاتا والخصية</text><rect x="330" y="46" width="290" height="130" rx="10" fill="#7c3aed"/><text x="475.0" y="84.5" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">البروستاتا</text><text x="475.0" y="99.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">ذكور فقط، فوق 50، رجال أفارقة أمريكان، تاريخ عائلي، لحوم حمراء</text><text x="475.0" y="114.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">شحوب وإرهاق وضعف (فقر دم) • عسر وألم تبول</text><text x="475.0" y="129.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">تشخيص: دم + موجات صوتية عبر المستقيم + فحص شرجي</text><text x="475.0" y="144.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">جراحة: استئصال البروستاتا أو TURP</text><rect x="20" y="46" width="300" height="130" rx="10" fill="#0891b2"/><text x="170.0" y="84.5" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">الخصية</text><text x="170.0" y="99.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">أشيع سرطان بين 15-35 سنة</text><text x="170.0" y="114.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">عامل خطر: خصية غير هابطة في الصغر</text><text x="170.0" y="129.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">فحص ذاتي TSE: شهريًا في نفس اليوم</text><text x="170.0" y="144.5" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">أثناء/بعد دش دافئ، بالإبهام وإصبعين، كل خصية على حدة</text><rect x="20" y="186" width="300" height="70" rx="10" fill="#fee2e2"/><text x="170.0" y="208.85" text-anchor="middle" font-size="11" font-weight="700" fill="#7f1d1d">أبلغ الطبيب</text><text x="170.0" y="224.85" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">كتلة صلبة (غير مؤلمة) • ألم خفيف</text><text x="170.0" y="240.85" text-anchor="middle" font-size="11" font-weight="600" fill="#7f1d1d">تورم الصفن (قيلة مائية Hydrocele)</text><rect x="330" y="186" width="290" height="70" rx="10" fill="#dcfce7"/><text x="475.0" y="208.85" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">الطبيعي</text><text x="475.0" y="224.85" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">ناعمة ومستديرة كالبيضة</text><text x="475.0" y="240.85" text-anchor="middle" font-size="11" font-weight="600" fill="#14532d">خصية أكبر قليلًا من الأخرى</text><rect x="20" y="266" width="600" height="56" rx="10" fill="#fef3c7"/><text x="320.0" y="289.7" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">كتلة بحجم حبة البازلاء: أبلغ حتى لو بدت بسيطة</text><text x="320.0" y="306.7" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">«الخصيتان صلبتان» = يحتاج تثقيفًا</text><rect x="20" y="332" width="600" height="96" rx="10" fill="#e0f2fe"/><text x="320.0" y="375.85" text-anchor="middle" font-size="11" font-weight="700" fill="#0c4a6e">HESI: مريض ضعف وإرهاق وشحوب بتحليل فقر دم: اسأل عن آخر فحص بروستاتا</text><text x="320.0" y="391.85" text-anchor="middle" font-size="11" font-weight="600" fill="#0c4a6e">مرحلة 4: انتشار واسع (Widespread metastasis)</text></svg>