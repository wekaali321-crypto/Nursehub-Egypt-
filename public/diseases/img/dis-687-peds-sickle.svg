<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 398" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="398" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الأنيميا المنجلية والخبيثة: ملخص أطفال</text><rect x="325" y="48" width="295" height="192" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">منجلية</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">كرات حمراء هلالية تموت أسرع وتسد الأوعية</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">أزمة انسداد وعائي: ألم شديد</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">ضعف ذراع من جانب واحد، تورم اليدين</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">والقدمين (Dactylitis)</text><text x="610" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">شلل جديد بالأطراف أو عدم القدرة على</text><text x="610" y="200" text-anchor="start" font-size="12.5" fill="#1e293b">الإيقاظ: طوارئ</text><text x="610" y="220" text-anchor="start" font-size="12.5" fill="#1e293b">حجز طحالي: تضخم سريع بالطحال وهبوط ضغط</text><rect x="20" y="48" width="295" height="192" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">العلاج والتثقيف</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">سوائل وريدية وراحة</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">مسكن PCA أو جرعات أعلى؛ أبلغ الطبيب</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">ابتعد عن المرضى وارتفاع الأماكن العالية،</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">زد السوائل</text><rect x="325" y="250" width="295" height="132" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="250" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="271" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الأنيميا الخبيثة</text><text x="610" y="302" text-anchor="start" font-size="12.5" fill="#1e293b">عدم امتصاص B12 لغياب العامل الداخلي</text><text x="610" y="322" text-anchor="start" font-size="12.5" fill="#1e293b">لسان أحمر أملس ملتهب (Glossitis)، ضعف</text><text x="610" y="342" text-anchor="start" font-size="12.5" fill="#1e293b">شديد، يرقان (أصفر شاحب)</text><text x="610" y="362" text-anchor="start" font-size="12.5" fill="#1e293b">علاج: حقن B12 عضلي/وريدي وليس بالفم</text><rect x="20" y="250" width="295" height="132" rx="12" fill="#fff" stroke="#9333ea" stroke-width="2"/><rect x="20" y="250" width="295" height="30" rx="12" fill="#9333ea"/><text x="167.5" y="271" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">تثقيف الخبيثة</text><text x="305" y="302" text-anchor="start" font-size="12.5" fill="#1e293b">حقن مدى الحياة</text><text x="305" y="322" text-anchor="start" font-size="12.5" fill="#1e293b">بعد استئصال معدة كلي: B12 حقن (وليس فموي)</text>
</svg>
