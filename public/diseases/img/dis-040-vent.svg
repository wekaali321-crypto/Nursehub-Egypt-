<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320.0" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مؤشرات التنفس الصناعي المساعد في الربو الحاد الشديد</text>
<rect x="30" y="48" width="280" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="170.0" y="75.16666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">غيبوبة (Coma)</text>
<rect x="330" y="48" width="280" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="470.0" y="75.16666666666667" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">توقف تنفس (Respiratory arrest)</text>
<rect x="30" y="106" width="280" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="170.0" y="133.16666666666666" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">تدهور غازات الدم رغم العلاج الأمثل</text>
<rect x="330" y="106" width="280" height="46" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
<text x="470.0" y="133.16666666666666" text-anchor="middle" font-size="12.5" font-weight="700" fill="#7f1d1d">إرهاق أو تشوش أو نعاس</text>
<rect x="30" y="176" width="580" height="64" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/>
<text x="320.0" y="203.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تفاصيل غازات الدم:  PaO₂ أقل من 8 kPa (60 مم زئبق) وفي تراجع</text>
<text x="320.0" y="220.5" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">PaCO₂ أكثر من 6 kPa (45 مم زئبق) وفي ارتفاع • pH منخفض وينخفض (H⁺ مرتفع)</text>
<text x="320" y="270" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">ارتفاع CO₂ في الربو الحاد علامة تعب المريض — لا تتأخر في التصعيد</text></svg>