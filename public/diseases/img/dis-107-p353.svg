<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="342" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">النقرس (Gout)</text><rect x="330" y="52" width="300" height="111.6" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الفكرة</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تراكم حمض اليوريك فيسبب ألم والتهاب</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  المفاصل ثم تدمير وارتجاع</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أكثر المفاصل تأثرًا: إصبع القدم الكبير</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• العلامة: احمرار بالقدم</text><rect x="10" y="52" width="310" height="111.6" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">عوامل الخطر</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أطعمة غنية بالبيورين (Purines)</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• لحوم: دجاج، ستيك، كبدة</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• كحول: نبيذ، بيرة، مشروبات</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مأكولات بحرية: سلطعون، جمبري</text><rect x="330" y="171.6" width="300" height="111.6" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M330,181.6 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#16a34a"/><text x="480.0" y="190.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التشخيص والعلاج</text><text x="620" y="214.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تحليل حمض اليوريك بالدم</text><text x="620" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• وقاية: خفض الوزن بشكل صحي</text><text x="620" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تجنب اللحوم والكحول والمأكولات البحرية</text><text x="620" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• زيادة السوائل ومراقبة المدخل والمخرج</text><rect x="10" y="171.6" width="310" height="146.39999999999998" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M10,181.6 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#7c3aed"/><text x="165.0" y="190.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأدوية</text><text x="310" y="214.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ألوبيورينول (Allopurinol): يمنع النقرس</text><text x="310" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (Prevents)</text><text x="310" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• كولشيسين (Colchicine): نوبة النقرس الحادة</text><text x="310" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (ACute)</text><text x="310" y="284.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• HESI: زد السوائل، سجّل المدخل والمخرج،</text><text x="310" y="301.59999999999997" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  راقب الآثار الجانبية</text></svg>