<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="388" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">كيف يحدث النقرس؟</text><rect x="50" y="52" width="540" height="54" rx="12" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="320" y="74" text-anchor="middle" font-size="15" font-weight="800" fill="#854d0e">ارتفاع حمض اليوريك في الدم</text><text x="320" y="94" text-anchor="middle" font-size="12.5" fill="#854d0e">زيادة إنتاج أو قلة طرح (كلى، أدوية مدرّة، بيورينات)</text><text x="320" y="123" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="130" width="540" height="54" rx="12" fill="#ffedd5" stroke="#9a3412" stroke-width="1.5"/><text x="320" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#9a3412">ترسب بلورات اليورات (Urate crystals)</text><text x="320" y="172" text-anchor="middle" font-size="12.5" fill="#9a3412">في المفصل والأنسجة تحت الجلد والعظم والغضروف</text><text x="320" y="201" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="208" width="540" height="54" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/><text x="320" y="230" text-anchor="middle" font-size="15" font-weight="800" fill="#991b1b">التهاب حاد مفاجئ</text><text x="320" y="250" text-anchor="middle" font-size="12.5" fill="#991b1b">غالباً ليلاً: إصبع القدم الكبير، أحمر، ساخن، متورم، شديد الألم</text><text x="320" y="279" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="286" width="540" height="54" rx="12" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.5"/><text x="320" y="308" text-anchor="middle" font-size="15" font-weight="800" fill="#5b21b6">نوبات متكررة وترسبات (Tophi)</text><text x="320" y="328" text-anchor="middle" font-size="12.5" fill="#5b21b6">تلف المفاصل وحصوات اليورات في الكلى</text><text x="320" y="368" text-anchor="middle" font-size="12.5" fill="#475569">القاعدة: تخفيض اليوريك طويل الأمد بيمنع النوبات</text></svg>