<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">علامات السرطان السبع المبكرة (CAUTION)</text>
<rect x="14" y="44" width="612" height="42" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><rect x="570" y="44" width="56" height="42" rx="8" fill="#dc2626"/><text x="598" y="72" text-anchor="middle" font-size="22" font-weight="800" fill="#fff" >C</text><text x="560" y="70" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >تغير في عادات الأمعاء أو المثانة</text><text x="100" y="70" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b" direction="ltr">Change</text><rect x="14" y="92" width="612" height="42" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><rect x="570" y="92" width="56" height="42" rx="8" fill="#dc2626"/><text x="598" y="120" text-anchor="middle" font-size="22" font-weight="800" fill="#fff" >A</text><text x="560" y="118" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >قرحة لا تلتئم</text><text x="100" y="118" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b" direction="ltr">A sore</text><rect x="14" y="140" width="612" height="42" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><rect x="570" y="140" width="56" height="42" rx="8" fill="#dc2626"/><text x="598" y="168" text-anchor="middle" font-size="22" font-weight="800" fill="#fff" >U</text><text x="560" y="166" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >نزف غير معتاد (براز، بول..)</text><text x="100" y="166" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b" direction="ltr">Unusual bleeding</text><rect x="14" y="188" width="612" height="42" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><rect x="570" y="188" width="56" height="42" rx="8" fill="#dc2626"/><text x="598" y="216" text-anchor="middle" font-size="22" font-weight="800" fill="#fff" >T</text><text x="560" y="214" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >سماكة أو كتلة بالثدي أو الخصية</text><text x="100" y="214" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b" direction="ltr">Thickening</text><rect x="14" y="236" width="612" height="42" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><rect x="570" y="236" width="56" height="42" rx="8" fill="#dc2626"/><text x="598" y="264" text-anchor="middle" font-size="22" font-weight="800" fill="#fff" >I</text><text x="560" y="262" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >عسر هضم أو صعوبة بلع</text><text x="100" y="262" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b" direction="ltr">Indigestion</text><rect x="14" y="284" width="612" height="42" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><rect x="570" y="284" width="56" height="42" rx="8" fill="#dc2626"/><text x="598" y="312" text-anchor="middle" font-size="22" font-weight="800" fill="#fff" >O</text><text x="560" y="310" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >تغير في ثؤلول أو شامة / قشر البرتقال بالجلد</text><text x="100" y="310" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b" direction="ltr">Obvious change</text><rect x="14" y="332" width="612" height="42" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><rect x="570" y="332" width="56" height="42" rx="8" fill="#dc2626"/><text x="598" y="360" text-anchor="middle" font-size="22" font-weight="800" fill="#fff" >N</text><text x="560" y="358" text-anchor="start" font-size="13" font-weight="700" fill="#0f172a" >إرهاق، سعال مزمن أو بحة صوت</text><text x="100" y="358" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b" direction="ltr">Nagging</text>
</svg>
