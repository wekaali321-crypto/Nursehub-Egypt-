  <g stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none">
    <line x1="320" y1="50" x2="320" y2="110"/>
    <path d="M320,110 L250,150 L215,200"/><path d="M250,150 L270,210"/>
    <path d="M320,110 L390,150 L425,200"/><path d="M390,150 L370,210"/>
  </g>
  <g stroke="#ef4444" stroke-width="12" stroke-linecap="round" fill="none"><path d="M320,110 L250,150"/><path d="M320,110 L390,150"/></g>
  <g fill="#fbcfe8" stroke="#be185d" stroke-width="2"><circle cx="215" cy="215" r="22"/><circle cx="270" cy="225" r="20"/><circle cx="425" cy="215" r="22"/><circle cx="370" cy="225" r="20"/></g>
  <text x="345" y="85" text-anchor="end" font-size="12" fill="#0369a1">القصبة الهوائية</text>
  <text x="545" y="115" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">الشعب (التهاب + بلغم)</text>
  <line x1="500" y1="122" x2="405" y2="138" stroke="#b91c1c" stroke-width="2"/>
  <text x="560" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#be185d">الحويصلات الهوائية</text>
  <text x="560" y="246" text-anchor="middle" font-size="12" fill="#475569">سليمة في الشعبي</text>
  <text x="80" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#be185d">إذا امتلأت بالصديد</text>
  <text x="80" y="246" text-anchor="middle" font-size="12" fill="#475569">= التهاب رئوي</text>
  <text x="320" y="275" text-anchor="middle" font-size="12" fill="#475569">الأحمر: موضع الالتهاب في الشعبي الحاد</text>
