<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="400" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التليف الكيسي (Cystic Fibrosis)</text><rect x="430" y="50" width="190" height="100" rx="10" fill="#6366f1"/><text x="525.0" y="85.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الآلية</text><text x="525.0" y="102.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">مخاط سميك يسد الرئتين والهضمي</text><text x="525.0" y="119.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">وراثي: جين من كل والد</text><rect x="225" y="50" width="190" height="100" rx="10" fill="#f59e0b"/><text x="320.0" y="77.0" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">العلامات</text><text x="320.0" y="94.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">نقص أكسجة وعدوى تنفسية</text><text x="320.0" y="111.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">انسداد معوي ونقص فيتامينات</text><text x="320.0" y="128.0" text-anchor="middle" font-size="11" font-weight="500" fill="#422006">نقص وزن وفشل نمو · سكري</text><rect x="20" y="50" width="190" height="100" rx="10" fill="#0ea5e9"/><text x="115.0" y="77.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التشخيص</text><text x="115.0" y="94.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">كلوريد العرق من عمر أسبوعين</text><text x="115.0" y="111.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">80 ملي مكافئ/لتر فأكثر يؤكده</text><text x="115.0" y="128.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">أو عينة دم</text><rect x="330" y="165" width="290" height="100" rx="10" fill="#ef4444"/><text x="475.0" y="200.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المضاعفات</text><text x="475.0" y="217.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">العقي (Meconium ileus) = أول مظهر بعد الولادة</text><text x="475.0" y="234.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">السكري: المخاط يسد البنكرياس فلا يخرج الإنسولين</text><rect x="20" y="165" width="300" height="100" rx="10" fill="#16a34a"/><text x="170.0" y="192.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التمريض</text><text x="170.0" y="209.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">سعرات عالية ودهون وبروتين وكربوهيدرات</text><text x="170.0" y="226.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">علاج طبيعي للصدر</text><text x="170.0" y="243.0" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">إنزيمات البنكرياس مع الوجبة</text><rect x="20" y="280" width="600" height="90" rx="10" fill="#334155"/><text x="320.0" y="319.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">انتبه</text><text x="320.0" y="337.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">خطأ شائع: لا تمنح الإنزيمات بعد الأكل بساعة؛ تُعطى مع الوجبة</text></svg>