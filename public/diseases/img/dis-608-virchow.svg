<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="260" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >ثالوث فيرشو — ليه الجلطة بتتكون</text><rect x="30" y="60" width="180" height="110" rx="10" fill="#2563eb"/><text x="120" y="100" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >ركود الدم</text><text x="120" y="130" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >سرير، سفر، شلل</text><rect x="230" y="60" width="180" height="110" rx="10" fill="#dc2626"/><text x="320" y="100" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >تلف الجدار</text><text x="320" y="130" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >إصابة، قسطرة، جراحة</text><rect x="430" y="60" width="180" height="110" rx="10" fill="#7c3aed"/><text x="520" y="100" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >زيادة التجلط</text><text x="520" y="130" text-anchor="middle" font-size="12" font-weight="500" fill="#fff" >أدوية، حمل، سرطان</text><text x="320" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >اجتماع عاملين أو أكتر يرفع الخطر</text></svg>