<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="290" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >فشل التنفس: نقص أكسجة مقابل احتباس CO₂</text><rect x="20" y="46" width="290" height="200" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="3"/><rect x="20" y="46" width="290" height="40" rx="12" fill="#0ea5e9" stroke="none" stroke-width="1"/><text x="165" y="73" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" >نقص الأكسجة (Hypoxemic)</text><text x="165" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a" >PaO₂ ≤ 60 مم زئبق</text><text x="165" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >أول علامة: قلق وتهيج وارتباك</text><text x="165" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >السلامة: أكسجين، تقييم A-B-C</text><text x="165" y="192" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >النبض بالجهاز لا يكفي: اعتمد الغازات</text><rect x="330" y="46" width="290" height="200" rx="12" fill="#fff" stroke="#dc2626" stroke-width="3"/><rect x="330" y="46" width="290" height="40" rx="12" fill="#dc2626" stroke="none" stroke-width="1"/><text x="475" y="73" text-anchor="middle" font-size="16" font-weight="800" fill="#fff" >احتباس CO₂ (Hypercapnic)</text><text x="475" y="112" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a" >PaCO₂ ≥ 50 مم زئبق</text><text x="475" y="140" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >نعاس، ارتباك، صداع</text><text x="475" y="166" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >BiPAP أولًا ثم التنبيب لو فشل</text><text x="475" y="192" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626" >مثال: pH 6.9 مع CO₂ 65 = شديد</text><text x="320" y="272" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >تغيّر الوعي ورقم الغازات أهم من قراءة الجهاز وحدها</text>
</svg>
