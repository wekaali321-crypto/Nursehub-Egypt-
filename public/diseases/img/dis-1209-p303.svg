<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 373" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="373" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">سرطان المريء والقولون والمستقيم</text>
<rect x="346.0" y="52" width="320.0" height="130.25" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="346.0" y="52" width="320.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="506.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">سرطان المريء</text>
<text x="656.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• عوامل الخطر: ارتجاع حمضي (GERD)، سمنة (BMI</text>
<text x="656.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">فوق 30)، كحول، تبغ (تدخين/مضغ)</text>
<rect x="14.0" y="52" width="320.0" height="130.25" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="14.0" y="52" width="320.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="174.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">سرطان القولون والمستقيم</text>
<text x="324.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• عوامل الخطر: رتوج، قولون تقرحي طويل، تاريخ</text>
<text x="324.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">عائلي، سمنة، كحول، تدخين (سجائر وسيجار)</text>
<text x="324.0" y="132.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• الأعراض: فقد وزن غير مفسر (نقطة امتحان)، ألم</text>
<text x="324.0" y="149.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">بطن، نزف (دم بالبراز وفقر دم)، تغير عادات</text>
<text x="324.0" y="167.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الأمعاء</text>
<rect x="346.0" y="194.25" width="320.0" height="151.5" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="346.0" y="194.25" width="320.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="506.0" y="212.25" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">التنظير</text>
<text x="656.0" y="238.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قبله: سوائل صافية، ملينات، بوليإيثيلين</text>
<text x="656.0" y="255.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">جلايكول (GoLytely)، صيام بعد منتصف الليل</text>
<text x="656.0" y="274.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• بعده: انثقاب الأمعاء = التهاب بريتوان</text>
<text x="656.0" y="292.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">(طارئ): حمى، تسرع قلب وتنفس، انتفاخ بطن وصلابة</text>
<text x="656.0" y="309.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">كاللوح</text>
<rect x="14.0" y="194.25" width="320.0" height="151.5" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="14.0" y="194.25" width="320.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="174.0" y="212.25" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">أسئلة وتثقيف</text>
<text x="324.0" y="238.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• مسن بتاريخ رتوج ونزف شرجي → اشتبه بسرطان</text>
<text x="324.0" y="255.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">القولون</text>
<text x="324.0" y="274.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تاريخ عائلي + فقد وزن + تغير أمعاء +</text>
<text x="324.0" y="292.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">هيموجلوبين 14 إلى 9 → تنظير القولون</text>
<text x="324.0" y="311.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• إضافة الملفوف تقلل خطر سرطان القولون</text>
<text x="324.0" y="330.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• قلل الوزن وأوقف الكحول والتدخين وزد الألياف</text>
</svg>
