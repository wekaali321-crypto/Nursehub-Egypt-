<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 388" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="388" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تقييم الحالة المشتبه فيها قولون عصبي</text><rect x="50" y="52" width="540" height="54" rx="12" fill="#dbeafe" stroke="#1e40af" stroke-width="1.5"/><text x="320" y="74" text-anchor="middle" font-size="15" font-weight="800" fill="#1e40af">أعراض متكررة: ألم بطن + تغير في التبرز</text><text x="320" y="94" text-anchor="middle" font-size="12.5" fill="#1e40af">الأعراض من 6 شهور أو أكثر</text><text x="320" y="123" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="130" width="540" height="54" rx="12" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="320" y="152" text-anchor="middle" font-size="15" font-weight="800" fill="#854d0e">هل في علامات إنذار؟</text><text x="320" y="172" text-anchor="middle" font-size="12.5" fill="#854d0e">نزيف، نزول وزن، أنيميا، حرارة، بداية بعد 50، إسهال ليلي</text><text x="320" y="201" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="208" width="540" height="54" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/><text x="320" y="230" text-anchor="middle" font-size="15" font-weight="800" fill="#991b1b">نعم: فحوصات لاستبعاد سبب عضوي</text><text x="320" y="250" text-anchor="middle" font-size="12.5" fill="#991b1b">تحليل براز، سونار، منظار، حقنة باريوم، تحاليل دم</text><text x="320" y="279" text-anchor="middle" font-size="18" fill="#64748b">↓</text><rect x="50" y="286" width="540" height="54" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="320" y="308" text-anchor="middle" font-size="15" font-weight="800" fill="#166534">لا: تشخيص إكلينيكي</text><text x="320" y="328" text-anchor="middle" font-size="12.5" fill="#166534">تطمين + نظام غذاء + علاج الأعراض</text><text x="320" y="368" text-anchor="middle" font-size="12.5" fill="#475569">القولون العصبي تشخيص إكلينيكي، والفحوص لاستبعاد الأسباب العضوية</text></svg>