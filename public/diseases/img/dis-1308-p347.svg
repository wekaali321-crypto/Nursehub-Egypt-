<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 429" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="429" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">رعاية الجبس والمضاعفات</text><rect x="330" y="52" width="300" height="198.6" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">CAST: رعاية الجبس</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• C: نظيف وجاف أبدًا لا يُبلل — غطاء</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  بلاستيكي للاستحمام</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• A: ارفع الطرف فوق القلب (أول 48 ساعة)</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• S: للحكة استخدم مجفف الشعر على الهواء</text><text x="620" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  البارد</text><text x="620" y="182.00000000000003" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• T: لا تحمّل وزنًا على الجبس، ولا تضغط</text><text x="620" y="199.40000000000003" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  بالأصابع، ولا أسطح صلبة</text><text x="620" y="216.80000000000004" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الجبس الجبسي (Plaster) يحتاج 24–72 ساعة</text><text x="620" y="234.20000000000005" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  ليجف</text><rect x="10" y="52" width="310" height="163.79999999999998" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#dc2626"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">مضاعفات</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• النقاط الساخنة (Hot spots) = عدوى: إحساس</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  بالسخونة ورائحة كريهة — أبلغ</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• متلازمة الحيز (Compartment): ضغط عضلي</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  ينقص التروية</text><text x="310" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ألم لا يهدأ بالمورفين (نقطة امتحان) ولا</text><text x="310" y="182.00000000000003" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  يزول بالدواء، ويزداد بالحركة السلبية</text><text x="310" y="199.40000000000003" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تنميل وحرقان، صعوبة تحريك الأصابع</text><rect x="330" y="258.6" width="300" height="146.39999999999998" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M330,268.6 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#16a34a"/><text x="480.0" y="277.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">تقييم P-M-S-C</text><text x="620" y="301.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• P: النبض (Pulses) — غير ملموس = خطر</text><text x="620" y="319.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• M: الحركة (Movement) والقبضة</text><text x="620" y="336.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• S: الإحساس (Sensation): لا تنميل</text><text x="620" y="353.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• C: ملء الشعيرات (Cap refill): ليس أكثر</text><text x="620" y="371.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  من 3 ثوانٍ؛ لون وردي ودرجة حرارة (ليس</text><text x="620" y="388.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  شاحبًا ولا باردًا)</text><rect x="10" y="258.6" width="310" height="146.39999999999998" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M10,268.6 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#7c3aed"/><text x="165.0" y="277.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الإجراءات</text><text x="310" y="301.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أبلغ الطبيب فورًا عند أي ضعف تروية</text><text x="310" y="319.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قيّم الأصابع/أصابع القدم (فحص عصبي وعائي)</text><text x="310" y="336.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• عند «Hot spot»: قيّم الدورة الدموية وغيّر</text><text x="310" y="353.79999999999995" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الوضع ثم أبلغ</text><text x="310" y="371.19999999999993" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ساق بجبس: ارفعها على وسائد واتركها مفتوحة</text><text x="310" y="388.5999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  للهواء</text></svg>