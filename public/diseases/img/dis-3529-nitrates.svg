<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="360" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">النترات: الآلية والتمريض</text><rect x="330" y="45" width="295" height="100" rx="10" fill="#dbeafe"/><text x="477.5" y="73" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">الآلية</text><text x="477.5" y="91" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">ترخي العضلة الملساء للأوعية</text><text x="477.5" y="109" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">توسّع الشريان والشُّريّن</text><text x="477.5" y="127" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">يزيد تدفق الدم</text><rect x="15" y="45" width="305" height="100" rx="10" fill="#dcfce7"/><text x="167.5" y="73" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">الاستعمال</text><text x="167.5" y="91" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تسكين نوبة الذبحة الحادة</text><text x="167.5" y="109" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">الوقاية من نوبات الذبحة</text><text x="167.5" y="127" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">الذبحة المزمنة المستقرة</text><rect x="15" y="165" width="610" height="60" rx="10" fill="#fee2e2"/><text x="320" y="200" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">ممنوع مع مثبطات PDE5 (أدوية ضعف الانتصاب): هبوط ضغط شديد</text><rect x="15" y="240" width="610" height="100" rx="10" fill="#fef9c3"/><text x="320" y="286" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">sublingual: كل 5 دقائق حتى 3 جرعات خلال 15 دقيقة | بخاخ: 1–2 رشة حتى 3 جرعات مقننة/15 دقيقة</text><text x="320" y="304" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">المرهم: لا تدلكه، وتجنب ملامسة أصابعك | أبلغ الطبيب: نبض أعلى بـ 20 نبضة، زيادة وزن 5 رطل، تورّم، ضيق نفس، ذبحة، إغماء</text></svg>