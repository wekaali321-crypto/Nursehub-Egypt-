<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="350" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">ألزهايمر: المراحل وسلامة المريض</text><rect x="430" y="48" width="190" height="56" rx="10" fill="#16a34a"/><text x="525.0" y="71.55" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">المرحلة 1</text><text x="525.0" y="89.55" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">لا خلل ظاهر</text><rect x="225" y="48" width="190" height="56" rx="10" fill="#f59e0b"/><text x="320.0" y="71.55" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">المرحلة 2</text><text x="320.0" y="89.55" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">نسيان ونقص ذاكرة قريبة</text><rect x="20" y="48" width="190" height="56" rx="10" fill="#dc2626"/><text x="115.0" y="71.55" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">المرحلة 3</text><text x="115.0" y="89.55" text-anchor="middle" font-size="13" font-weight="600" fill="#fff">فقد الذاكرة بعيدة المدى</text><rect x="510" y="120" width="110" height="32" rx="10" fill="#0891b2"/><text x="565.0" y="140.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">السقوط</text><rect x="20" y="120" width="480" height="32" rx="10" fill="#f1f5f9"/><text x="260.0" y="140.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">أزل السجاد والفوضى، قضبان إمساك، إضاءة ليلية</text><rect x="510" y="158" width="110" height="32" rx="10" fill="#0891b2"/><text x="565.0" y="178.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">التيه</text><rect x="20" y="158" width="480" height="32" rx="10" fill="#f1f5f9"/><text x="260.0" y="178.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">سوار «العودة الآمنة»، أقفال أبواب السلالم والمخارج</text><rect x="510" y="196" width="110" height="32" rx="10" fill="#0891b2"/><text x="565.0" y="216.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">المخاطر</text><rect x="20" y="196" width="480" height="32" rx="10" fill="#f1f5f9"/><text x="260.0" y="216.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">قفل المواد السامة والأدوات الحادة؛ الأدوية بعيدة وليست في علبة</text><rect x="510" y="234" width="110" height="32" rx="10" fill="#0891b2"/><text x="565.0" y="254.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">البيئة</text><rect x="20" y="234" width="480" height="32" rx="10" fill="#f1f5f9"/><text x="260.0" y="254.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">حرية حركة، أشياء متكررة قريبة، رموز وصور، لافتة ساخن/بارد</text><rect x="510" y="272" width="110" height="32" rx="10" fill="#0891b2"/><text x="565.0" y="292.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">التواصل</text><rect x="20" y="272" width="480" height="32" rx="10" fill="#f1f5f9"/><text x="260.0" y="292.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">أسئلة نعم/لا، خيارات قليلة، لا تستعجله، عامله كبالغ</text><rect x="510" y="310" width="110" height="32" rx="10" fill="#0891b2"/><text x="565.0" y="330.2" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">التغذية</text><rect x="20" y="310" width="480" height="32" rx="10" fill="#f1f5f9"/><text x="260.0" y="330.2" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">أعطِ نصف الساندويتش أولًا والنصف الآخر لاحقًا</text></svg>