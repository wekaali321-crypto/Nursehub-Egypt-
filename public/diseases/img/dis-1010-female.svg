<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="600" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الجهاز التناسلي الأنثوي</text>
<rect x="20" y="44" width="600" height="330" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><path d="M270,90 C270,60 370,60 370,90 L350,250 L320,270 L290,250 Z" fill="#f2a5a5" stroke="#b85c5c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M290,130 L350,130" fill="none" stroke="#b85c5c" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M260,95 C200,70 150,90 120,110" fill="none" stroke="#e8a0a0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M380,95 C440,70 490,90 520,110" fill="none" stroke="#e8a0a0" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="150" cy="130" rx="26" ry="18" fill="#f2e3c2" stroke="#b8a070" stroke-width="1.5"/><ellipse cx="490" cy="130" rx="26" ry="18" fill="#f2e3c2" stroke="#b8a070" stroke-width="1.5"/><rect x="300" y="270" width="40" height="70" rx="10" fill="#e08a8a" stroke="#b85c5c" stroke-width="1.5"/><line x1="320" y1="70" x2="556" y2="51" stroke="#64748b" stroke-width="1"/><text x="560" y="55" text-anchor="end" font-size="12" font-weight="600" fill="#0f172a">الرحم (Uterus)</text><line x1="520" y1="110" x2="556" y2="91" stroke="#64748b" stroke-width="1"/><text x="560" y="95" text-anchor="end" font-size="12" font-weight="600" fill="#0f172a">قناة فالوب</text><line x1="490" y1="130" x2="556" y2="131" stroke="#64748b" stroke-width="1"/><text x="560" y="135" text-anchor="end" font-size="12" font-weight="600" fill="#0f172a">المبيض (Ovary)</text><line x1="340" y1="150" x2="556" y2="176" stroke="#64748b" stroke-width="1"/><text x="560" y="180" text-anchor="end" font-size="12" font-weight="600" fill="#0f172a">بطانة الرحم Endometrium</text><line x1="350" y1="200" x2="556" y2="211" stroke="#64748b" stroke-width="1"/><text x="560" y="215" text-anchor="end" font-size="12" font-weight="600" fill="#0f172a">عضلة الرحم Myometrium</text><line x1="325" y1="262" x2="556" y2="251" stroke="#64748b" stroke-width="1"/><text x="560" y="255" text-anchor="end" font-size="12" font-weight="600" fill="#0f172a">عنق الرحم Cervix</text><line x1="320" y1="320" x2="556" y2="306" stroke="#64748b" stroke-width="1"/><text x="560" y="310" text-anchor="end" font-size="12" font-weight="600" fill="#0f172a">المهبل (Vagina)</text><line x1="310" y1="130" x2="64" y2="106" stroke="#64748b" stroke-width="1"/><text x="60" y="110" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">الرباط العريض</text><line x1="300" y1="265" x2="84" y2="256" stroke="#64748b" stroke-width="1"/><text x="80" y="260" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">الفتحة الداخلية والخارجية</text><rect x="20" y="386" width="600" height="200" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="1.5"/><rect x="24" y="392" width="592" height="34" rx="4" fill="#e0f2fe" stroke="none" stroke-width="1.5"/><text x="600" y="414" text-anchor="start" font-size="12" font-weight="800" fill="#0f172a">المبيضان</text><text x="470" y="414" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a">البويضات ونقل الإستروجين والبروجسترون لتهيئة الحمل والحفاظ عليه</text><rect x="24" y="430" width="592" height="34" rx="4" fill="#fff" stroke="none" stroke-width="1.5"/><text x="600" y="452" text-anchor="start" font-size="12" font-weight="800" fill="#0f172a">قناتا فالوب</text><text x="470" y="452" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a">نقل البويضة من المبيض إلى الرحم</text><rect x="24" y="468" width="592" height="34" rx="4" fill="#e0f2fe" stroke="none" stroke-width="1.5"/><text x="600" y="490" text-anchor="start" font-size="12" font-weight="800" fill="#0f172a">الرحم</text><text x="470" y="490" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a">احتضان وتغذية الجنين ودفعه بالانقباضات عند الولادة</text><rect x="24" y="506" width="592" height="34" rx="4" fill="#fff" stroke="none" stroke-width="1.5"/><text x="600" y="528" text-anchor="start" font-size="12" font-weight="800" fill="#0f172a">المهبل</text><text x="470" y="528" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a">مخرج دم وأنسجة الطمث ومسلك الولادة والجماع</text><rect x="24" y="544" width="592" height="34" rx="4" fill="#e0f2fe" stroke="none" stroke-width="1.5"/><text x="600" y="566" text-anchor="start" font-size="12" font-weight="800" fill="#0f172a">الفرج</text><text x="470" y="566" text-anchor="start" font-size="11" font-weight="600" fill="#0f172a">أعضاء خارجية: بظر، غدد بارثولين (مخاط مزلق)، غدد سكين (سائل مائي)</text>
</svg>
