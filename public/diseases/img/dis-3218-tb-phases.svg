<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 378" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="378" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">مراحل علاج السل ودواء ethambutol</text><rect x="30" y="44" width="580" height="69" rx="10" fill="#fff" stroke="#1e3a8a" stroke-width="1.5"/><rect x="540" y="44" width="70" height="69" rx="10" fill="#1e3a8a"/><text x="575" y="83.5" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">مكثفة</text><text x="525" y="74" text-anchor="start" font-size="12.5" font-weight="500" fill="#0f172a">4 أدوية: rifampin + isoniazid + pyrazinamide + ethambutol لمدة</text><text x="525" y="90.5" text-anchor="start" font-size="12.5" font-weight="500" fill="#0f172a">شهرين على الأقل.</text><path d="M320 115v14m-6 -6l6 7l6 -7" stroke="#64748b" stroke-width="2" fill="none"/><rect x="30" y="133" width="580" height="52.5" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><rect x="540" y="133" width="70" height="52.5" rx="10" fill="#0f766e"/><text x="575" y="164.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">استمرار</text><text x="525" y="163" text-anchor="start" font-size="12.5" font-weight="500" fill="#0f172a">rifampin + isoniazid فقط؛ 4 أشهر أو حتى 7 أشهر في حالات خاصة.</text><path d="M320 187.5v14m-6 -6l6 7l6 -7" stroke="#64748b" stroke-width="2" fill="none"/><rect x="30" y="205.5" width="580" height="69" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.5"/><rect x="540" y="205.5" width="70" height="69" rx="10" fill="#b45309"/><text x="575" y="245" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">خاصة</text><text x="525" y="235.5" text-anchor="start" font-size="12.5" font-weight="500" fill="#0f172a">مزرعة بلغم إيجابية بعد انتهاء العلاج، مرض كهفي، عدم تضمين</text><text x="525" y="252" text-anchor="start" font-size="12.5" font-weight="500" fill="#0f172a">pyrazinamide، أو إيجابية في مريض HIV.</text><path d="M320 276.5v14m-6 -6l6 7l6 -7" stroke="#64748b" stroke-width="2" fill="none"/><rect x="30" y="294.5" width="580" height="69" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><rect x="540" y="294.5" width="70" height="69" rx="10" fill="#7c3aed"/><text x="575" y="334" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">Ethambutol</text><text x="525" y="324.5" text-anchor="start" font-size="12.5" font-weight="500" fill="#0f172a">15–25 مغ/كغ/يوم (للتعلّم)؛ أبلغ عن تشوش الرؤية أو تغير</text><text x="525" y="341" text-anchor="start" font-size="12.5" font-weight="500" fill="#0f172a">الألوان؛ فحص بصري دوري.</text></svg>