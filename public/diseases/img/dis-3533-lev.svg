<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="300" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">levetiracetam</text><rect x="330" y="45" width="295" height="90" rx="10" fill="#dcfce7"/><text x="477.5" y="68" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">الاستعمال</text><text x="477.5" y="86" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">الوقاية من النوبات وعلاجها</text><text x="477.5" y="104" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">يُفضَّل غالبًا على phenytoin</text><text x="477.5" y="122" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">لقلة التداخلات الدوائية</text><rect x="15" y="45" width="305" height="90" rx="10" fill="#fee2e2"/><text x="167.5" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">آثار شديدة (مثل phenytoin)</text><text x="167.5" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">أفكار انتحارية</text><text x="167.5" y="113" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">متلازمة ستيفنز-جونسون</text><rect x="15" y="155" width="610" height="60" rx="10" fill="#fef9c3"/><text x="320" y="190" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">آثار شائعة: مثبّط للجهاز العصبي: بطء ونعاس وإرهاق</text><rect x="15" y="230" width="610" height="55" rx="10" fill="#dbeafe"/><text x="320" y="262.5" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">بلّغ: قلق جديد، هياج، اكتئاب، تغيّر مزاج، طفح، تقرّح جلد، ألم عضلي/مفصلي | القيادة: بإذن الطبيب</text></svg>