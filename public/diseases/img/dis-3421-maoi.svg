<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="مثبطات MAO (MAOIs): تذكّر M-A-O-O-I"><rect width="640" height="330" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">مثبطات MAO (MAOIs): تذكّر M-A-O-O-I</text><text x="320.0" y="54" text-anchor="middle" font-size="12.5" fill="#667085">phenelzine • selegiline • isocarboxazid • tranylcypromine</text><rect x="326.0" y="68" width="302.0" height="80" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="326.0" y="68" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="326.0" y="82" width="302.0" height="14" fill="#b42318"/><text x="477.0" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">M: أزمة ارتفاع ضغط</text><text x="616.0" y="116" text-anchor="start" font-size="12.5" fill="#1d2939">• خطر هائل لأزمة ارتفاع ضغط</text><text x="616.0" y="134" text-anchor="start" font-size="12.5" fill="#1d2939">• علامات: صداع وزيادة هياج</text><rect x="12.0" y="68" width="302.0" height="98" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="12.0" y="68" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="12.0" y="82" width="302.0" height="14" fill="#a86a00"/><text x="163.0" y="87" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">A: تجنّب Tyramine</text><text x="302.0" y="116" text-anchor="start" font-size="12.5" fill="#1d2939">• نبيذ وجبن</text><text x="302.0" y="134" text-anchor="start" font-size="12.5" fill="#1d2939">• بيرة ونقانق وسلامي</text><text x="302.0" y="152" text-anchor="start" font-size="12.5" fill="#1d2939">• شوكولاتة</text><rect x="326.0" y="160" width="302.0" height="80" rx="10" fill="#efe9fb" stroke="#6a4bb5" stroke-width="1.2"/><rect x="326.0" y="160" width="302.0" height="28" rx="10" fill="#6a4bb5"/><rect x="326.0" y="174" width="302.0" height="14" fill="#6a4bb5"/><text x="477.0" y="179" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">O: أدوية بدون وصفة</text><text x="616.0" y="208" text-anchor="start" font-size="12.5" fill="#1d2939">• قد تسبب أزمة ضغط</text><text x="616.0" y="226" text-anchor="start" font-size="12.5" fill="#1d2939">• اسأل الصيدلي قبل أي دواء/مزيل احتقان</text><rect x="12.0" y="178" width="302.0" height="116" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="12.0" y="178" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="12.0" y="192" width="302.0" height="14" fill="#2b6a9e"/><text x="163.0" y="197" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">O: مضادات اكتئاب أخرى</text><text x="302.0" y="226" text-anchor="start" font-size="12.5" fill="#1d2939">• متلازمة السيروتونين</text><text x="302.0" y="244" text-anchor="start" font-size="12.5" fill="#1d2939">• انتظر أسبوعين (Wash-out) بين الأدوية</text><text x="302.0" y="262" text-anchor="start" font-size="12.5" fill="#1d2939">• لا escitalopram (SSRI)، لا imipramine</text><text x="302.0" y="280" text-anchor="start" font-size="12.5" fill="#1d2939">   (TCA)</text><rect x="326.0" y="252" width="302.0" height="62" rx="10" fill="#e0f5f3" stroke="#14756c" stroke-width="1.2"/><rect x="326.0" y="252" width="302.0" height="28" rx="10" fill="#14756c"/><rect x="326.0" y="266" width="302.0" height="14" fill="#14756c"/><text x="477.0" y="271" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">I: زيادة خطر الانتحار</text><text x="616.0" y="300" text-anchor="start" font-size="12.5" fill="#1d2939">• عند البدء أو زيادة الجرعة</text></svg>