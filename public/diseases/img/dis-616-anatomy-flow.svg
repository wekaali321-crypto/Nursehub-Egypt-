<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 813" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="720" height="813" rx="16" fill="#f8fafc"/>
<text x="360.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تشريح القلب وتدفق الدم وجهاز التوصيل</text>
<rect x="20" y="60" width="680" height="250" rx="14" fill="#fff" fill-opacity="1" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="250" y="100" width="110" height="70" rx="28" fill="#0ea5e9" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="2"/>
<text x="305.0" y="135.0" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">أذين أيمن RA</text>
<text x="305.0" y="153.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#334155">دم غير مؤكسج</text>
<rect x="370" y="100" width="110" height="70" rx="28" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="2"/>
<text x="425.0" y="135.0" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">أذين أيسر LA</text>
<text x="425.0" y="153.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#334155">دم مؤكسج</text>
<rect x="250" y="195" width="110" height="95" rx="28" fill="#0ea5e9" fill-opacity="0.25" stroke="#0ea5e9" stroke-width="2"/>
<text x="305.0" y="242.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">بطين أيمن RV</text>
<rect x="370" y="195" width="110" height="95" rx="28" fill="#ef4444" fill-opacity="0.25" stroke="#ef4444" stroke-width="2"/>
<text x="425.0" y="242.5" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">بطين أيسر LV</text>
<text x="425.0" y="260.5" text-anchor="middle" font-size="11.5" font-weight="400" fill="#334155">"المضخة الكبرى"</text>
<text x="305" y="184" text-anchor="middle" font-size="11" font-weight="700" fill="#0e7490">ثلاثي الشرفات</text>
<text x="425" y="184" text-anchor="middle" font-size="11" font-weight="700" fill="#be123c">التاجي (ثنائي الشرفات)</text>
<text x="85" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#0ea5e9">① وريدا الجسم الأجوفان</text>
<text x="85" y="135" text-anchor="middle" font-size="12" font-weight="400" fill="#0ea5e9">(علوي وسفلي) ←</text>
<text x="630" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#be123c">④ الأوردة الرئوية</text>
<text x="630" y="135" text-anchor="middle" font-size="12" font-weight="400" fill="#be123c">← من الرئتين</text>
<text x="85" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#0ea5e9">③ الشريان الرئوي</text>
<text x="85" y="250" text-anchor="middle" font-size="11.5" font-weight="400" fill="#0ea5e9">→ إلى الرئتين</text>
<text x="630" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#be123c">⑥ الأورطي ← إلى الجسم</text>
<text x="630" y="250" text-anchor="middle" font-size="11.5" font-weight="400" fill="#be123c">(شرايين = تضخ بعيداً)</text>
<text x="360" y="304" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">المسار: الأجوف ← RA ← ثلاثي الشرفات ← RV ← رئوي ← رئتان ← أوردة رئوية ← LA ← تاجي ← LV ← أورطي</text>
<rect x="366.0" y="330" width="340.0" height="166.75" rx="10" fill="#0e7490" fill-opacity="0.1" stroke="#0e7490" stroke-width="1.2"/>
<rect x="366.0" y="330" width="340.0" height="26" rx="10" fill="#0e7490" fill-opacity="1" stroke="#0e7490" stroke-width="1.2"/>
<text x="536.0" y="348" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الطبقات والتامور</text>
<text x="696.0" y="374" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• غشاء التامور (Pericardium) كيس يحمي القلب</text>
<text x="696.0" y="391.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">ويزلّقه ويحوي 5–20 مل سائل، وله طبقتان: جداري</text>
<text x="696.0" y="408.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">خارجي وحشوي ملتصق بالقلب</text>
<text x="696.0" y="427.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• البشرة الخارجية Epicardium، العضلة المنقبضة</text>
<text x="696.0" y="445.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">Myocardium، البطانة الداخلية Endocardium تبطن</text>
<text x="696.0" y="462.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الحجرات والصمامات</text>
<text x="696.0" y="481.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• القلب مخروطي في منتصف الصدر (المنصف)</text>
<rect x="14.0" y="330" width="340.0" height="166.75" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.2"/>
<rect x="14.0" y="330" width="340.0" height="26" rx="10" fill="#6366f1" fill-opacity="1" stroke="#6366f1" stroke-width="1.2"/>
<text x="184.0" y="348" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الصمامات الأربعة</text>
<text x="344.0" y="374" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أذينية بطينية تُغلق عند بدء انقباض البطين:</text>
<text x="344.0" y="391.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">ثلاثي الشرفات (يمين) وثنائي الشرفات التاجي (يسار)</text>
<text x="344.0" y="410.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• هلالية تمنع رجوع الدم للبطين أثناء الارتخاء:</text>
<text x="344.0" y="427.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الرئوي (بين RV والشريان الرئوي) والأورطي (بين LV</text>
<text x="344.0" y="445.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">والأورطي)</text>
<rect x="366.0" y="508.75" width="340.0" height="117.0" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="366.0" y="508.75" width="340.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="536.0" y="526.75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الحجرات الأربع</text>
<text x="696.0" y="552.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• RA يستقبل دم الجسم من الأجوفين</text>
<text x="696.0" y="572.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• RV يضخه للرئتين عبر الشريان الرئوي</text>
<text x="696.0" y="591.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• LA يستقبل الدم المؤكسج من الأوردة الرئوية</text>
<text x="696.0" y="610.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• LV يضخه للجسم عبر الأورطي</text>
<rect x="14.0" y="508.75" width="340.0" height="117.0" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="14.0" y="508.75" width="340.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="184.0" y="526.75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">التوصيل الكهربائي</text>
<text x="344.0" y="552.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• العقدة الجيبية SA: منظم الضربات 60–100/د</text>
<text x="344.0" y="572.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• العقدة الأذينية البطينية AV: 40–60/د</text>
<text x="344.0" y="591.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• حزمة هس ثم الفرعان ثم ألياف بركنجي: تعمل كمنظم</text>
<text x="344.0" y="608.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">احتياطي عند فشل SA وAV بمعدل 20–40/د</text>
<rect x="366.0" y="637.75" width="340.0" height="147.5" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="366.0" y="637.75" width="340.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="536.0" y="655.75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الشرايين التاجية</text>
<text x="696.0" y="681.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• التاجي الأيمن: الأذين والبطين الأيمنان، الجدار</text>
<text x="696.0" y="699.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">السفلي للأيسر، الحاجز الخلفي، وعقدتا SA وAV (عند</text>
<text x="696.0" y="716.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">أغلب الناس)</text>
<text x="696.0" y="735.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• التاجي الأيسر: ينقسم إلى الأمامي النازل (LAD)</text>
<text x="696.0" y="752.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">يغذي البطين الأيسر والحاجز، والملتف (Circumflex)</text>
<text x="696.0" y="770.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">يغذي الأذين الأيسر والجدار الجانبي/الخلفي</text>
<rect x="14.0" y="637.75" width="340.0" height="147.5" rx="10" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="1.2"/>
<rect x="14.0" y="637.75" width="340.0" height="26" rx="10" fill="#ec4899" fill-opacity="1" stroke="#ec4899" stroke-width="1.2"/>
<text x="184.0" y="655.75" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">وظيفة الدورة</text>
<text x="344.0" y="681.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تحمل O₂ والمغذيات والهرمونات والأجسام المضادة</text>
<text x="344.0" y="699.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">للأنسجة</text>
<text x="344.0" y="718.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تزيل نواتج الأيض</text>
<text x="344.0" y="737.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• القلب يضخ الدم الغني بالأكسجين للشرايين ويدفع</text>
<text x="344.0" y="754.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الدم الفقير بالأكسجين عبر الرئتين لإعادة التأكسج</text>
</svg>
