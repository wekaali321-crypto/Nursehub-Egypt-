<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="360" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">من العَرَض إلى مجموعة الدواء (بأمر الطبيب)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="440" y="48" width="180" height="56" rx="10" fill="#dbeafe"/><text x="530" y="72" fill="#1e3a8a" font-weight="700">مغص وتقلصات</text><text x="530" y="92" font-size="11" fill="#1e3a8a">مضاد تشنج (Mebeverine)</text>
    <rect x="230" y="48" width="180" height="56" rx="10" fill="#dcfce7"/><text x="320" y="72" fill="#14532d" font-weight="700">سوء هضم</text><text x="320" y="92" font-size="11" fill="#14532d">إنزيمات (Digestin)</text>
    <rect x="20" y="48" width="180" height="56" rx="10" fill="#fef9c3"/><text x="110" y="72" fill="#713f12" font-weight="700">بطء حركة / غثيان</text><text x="110" y="92" font-size="11" fill="#713f12">منظم حركة (Domperidone)</text>
    <rect x="440" y="124" width="180" height="56" rx="10" fill="#fee2e2"/><text x="530" y="148" fill="#7f1d1d" font-weight="700">انتفاخ وغازات</text><text x="530" y="168" font-size="11" fill="#7f1d1d">Simethicone / فحم</text>
    <rect x="230" y="124" width="180" height="56" rx="10" fill="#ede9fe"/><text x="320" y="148" fill="#4c1d95" font-weight="700">إسهال</text><text x="320" y="168" font-size="11" fill="#4c1d95">مضاد إسهال معوي + سوائل</text>
    <rect x="20" y="124" width="180" height="56" rx="10" fill="#ffedd5"/><text x="110" y="148" fill="#7c2d12" font-weight="700">إمساك</text><text x="110" y="168" font-size="11" fill="#7c2d12">ملين (يُفضّل غير اللاكتيولوز في IBS)</text>
  </g>
  <rect x="20" y="206" width="600" height="130" rx="12" fill="#fff1f2"/>
  <text x="320" y="232" text-anchor="middle" font-size="14" font-weight="800" fill="#9f1239">قبل أي دواء أعراضي استبعد الخطر</text>
  <g font-size="12.5" fill="#881337" text-anchor="middle">
    <text x="320" y="256">سن فوق 50 • نزول وزن • دم في البراز • قرح بالفم • تاريخ عائلي لالتهاب أمعاء</text>
    <text x="320" y="280">ألم بطن مستمر لا يستجيب = سونار على البطن والحوض</text>
    <text x="320" y="304">لا تعالج العَرَض فقط وتتجاهل السبب</text>
  </g>
</svg>
