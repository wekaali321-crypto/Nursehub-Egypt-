<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">درجات الضائقة التنفسية</text>
<g font-size="13" font-weight="700" text-anchor="middle">
<rect x="20" y="130" width="140" height="120" rx="12" fill="#16a34a"/><text x="90" y="160" fill="#fff">درجة 1</text><text x="90" y="188" font-size="12" fill="#dcfce7">تسرع تنفس</text><text x="90" y="210" font-size="12" fill="#dcfce7">± ترفرف الأنف</text>
<rect x="170" y="100" width="140" height="150" rx="12" fill="#eab308"/><text x="240" y="130" fill="#422006">درجة 2</text><text x="240" y="160" font-size="12" fill="#422006">انسحاب أسفل/بين</text><text x="240" y="182" font-size="12" fill="#422006">الأضلاع</text>
<rect x="320" y="70" width="140" height="180" rx="12" fill="#f97316"/><text x="390" y="100" fill="#fff">درجة 3</text><text x="390" y="130" font-size="12" fill="#ffedd5">أنين (Grunting)</text>
<rect x="470" y="50" width="150" height="200" rx="12" fill="#dc2626"/><text x="545" y="80" fill="#fff">درجة 4</text><text x="545" y="110" font-size="12" fill="#fee2e2">زرقة (Cyanosis)</text><text x="545" y="140" font-size="12" fill="#fee2e2">دخول عناية</text>
</g>
<text x="320" y="280" text-anchor="middle" font-size="13" fill="#475569">أي درجة = علاج في الاستقبال قبل العودة للبيت</text>
</svg>
