<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 419" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="419" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">مضاعفات النكاف</text><g text-anchor="middle"><rect x="80" y="46" width="480" height="57" rx="10" fill="#fef9c3" stroke="#eab308"/><text x="320" y="68" font-size="14" font-weight="800" fill="#422006">التهاب الغدة النكفية</text><text x="320" y="86" font-size="12" font-weight="600" fill="#422006">تورم مؤلم أمام وتحت الأذن</text><path d="M320 103 V119" stroke="#64748b" stroke-width="3"/><path d="M314 113 L320 120 L326 113" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="121" width="480" height="57" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="320" y="143" font-size="14" font-weight="800" fill="#7f1d1d">التهاب السحايا (Meningitis)</text><text x="320" y="161" font-size="12" font-weight="600" fill="#7f1d1d">صداع، رقبة متيبسة، قيء</text><path d="M320 178 V194" stroke="#64748b" stroke-width="3"/><path d="M314 188 L320 195 L326 188" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="196" width="480" height="57" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="320" y="218" font-size="14" font-weight="800" fill="#7f1d1d">التهاب الخصية (Orchitis)</text><text x="320" y="236" font-size="12" font-weight="600" fill="#7f1d1d">ألم وتورم الصفن، حرارة</text><path d="M320 253 V269" stroke="#64748b" stroke-width="3"/><path d="M314 263 L320 270 L326 263" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="271" width="480" height="57" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="320" y="293" font-size="14" font-weight="800" fill="#1e3a8a">التهاب الثدي / المبيض</text><text x="320" y="311" font-size="12" font-weight="600" fill="#1e3a8a">Mastitis / Oophoritis</text><path d="M320 328 V344" stroke="#64748b" stroke-width="3"/><path d="M314 338 L320 345 L326 338" fill="none" stroke="#64748b" stroke-width="3"/><rect x="80" y="346" width="480" height="57" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="320" y="368" font-size="14" font-weight="800" fill="#1e3a8a">التهاب البنكرياس</text><text x="320" y="386" font-size="12" font-weight="600" fill="#1e3a8a">ألم بطن علوي وقيء</text></g></svg>