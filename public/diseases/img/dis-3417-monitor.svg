<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="مراقبة المرأة تحت مثبطات المخاض (كل 15–30 دقيقة)"><rect width="640" height="270" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">مراقبة المرأة تحت مثبطات المخاض (كل 15–30 دقيقة)</text><rect x="326.0" y="46" width="302.0" height="116" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">قياسات</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• ضغط الدم والنبض والتنفس</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• نبض الجنين FHR</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• معدل التسريب الوريدي</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• موضع الوريد: ارتشاح؟</text><rect x="12.0" y="46" width="302.0" height="98" rx="10" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#2e7d4f"/><rect x="12.0" y="60" width="302.0" height="14" fill="#2e7d4f"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">وظائف</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• تقلصات الرحم: التكرار والشدة والمدة</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• حصيلة السوائل (داخل/خارج)</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• منعكسات الأم (عند Mg)</text><rect x="12.0" y="156" width="302.0" height="98" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="12.0" y="156" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="12.0" y="170" width="302.0" height="14" fill="#b42318"/><text x="163.0" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">طوارئ Mg</text><text x="302.0" y="204" text-anchor="start" font-size="12.5" fill="#1d2939">• جهّز كالسيوم جلوكونات</text><text x="302.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• جهّز مطرقة المنعكسات</text><text x="302.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• لا يُعطى خلال ساعتين من الولادة (مانع)</text></svg>