<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 302" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="302" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">سن مقلوع (Avulsion): 3 خطوات R</text><rect x="20" y="48" width="600" height="58" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><circle cx="596" cy="68" r="13" fill="#2563eb"/><text x="596" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="570" y="73" text-anchor="start" font-size="14" font-weight="700" fill="#0f172a">Remove — استرد السن</text><text x="570" y="94" text-anchor="start" font-size="12.5" fill="#334155">أمسكه من التاج لا الجذر</text><text x="320" y="120" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="126" width="600" height="58" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><circle cx="596" cy="146" r="13" fill="#16a34a"/><text x="596" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="570" y="151" text-anchor="start" font-size="14" font-weight="700" fill="#0f172a">Rinse — اشطف</text><text x="570" y="172" text-anchor="start" font-size="12.5" fill="#334155">بماء أو محلول ملحي إن كان متسخًا؛ لا تفرك ولا تلفّه بشاش معقم</text><text x="320" y="198" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="204" width="600" height="58" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><circle cx="596" cy="224" r="13" fill="#ea580c"/><text x="596" y="229" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="570" y="229" text-anchor="start" font-size="14" font-weight="700" fill="#0f172a">Reinsert — أعد غرسه</text><text x="570" y="250" text-anchor="start" font-size="12.5" fill="#334155">في تجويف اللثة خلال 15 دقيقة وثبّته (الطفل يمسكه)</text><text x="320" y="284" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">إن تعذر الغرس: أبقه رطبًا في حليب بارد أو ملح معقم أو لعاب</text>
</svg>
