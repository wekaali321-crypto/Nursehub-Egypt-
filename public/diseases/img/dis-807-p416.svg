<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 352" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="352" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الدورة الشهرية: المبيض والرحم والهرمونات</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="199.6" rx="10" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="29" rx="10" fill="#ec4899"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الدورة المبيضية</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• المرحلة الجرابية: ما</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">قبل الإباضة</text><text x="612" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• المهاد (Hypothalamus)</text><text x="612" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">يفرز GnRH → النخامية</text><text x="612" y="176.8" text-anchor="start" font-size="13" fill="#0f172a">الأمامية تفرز FSH وLH →</text><text x="612" y="195" text-anchor="start" font-size="13" fill="#0f172a">تنمو الجريبات</text><text x="612" y="218.2" text-anchor="start" font-size="13" fill="#0f172a">• الإباضة تبدأ المرحلة</text><text x="612" y="236.39999999999998" text-anchor="start" font-size="13" fill="#0f172a">الأصفرية</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="199.6" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#6366f1"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">المرحلة الأصفرية</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• الجسم الأصفر يفرز</text><text x="408.66666666666663" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">استروجين وبروجسترون</text><text x="408.66666666666663" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• يُثخّن بطانة الرحم</text><text x="408.66666666666663" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">ويكبح FSH وLH</text><text x="408.66666666666663" y="181.8" text-anchor="start" font-size="13" fill="#0f172a">• إن لم يحدث إخصاب خلال</text><text x="408.66666666666663" y="200" text-anchor="start" font-size="13" fill="#0f172a">14 يومًا: تموت البويضة</text><text x="408.66666666666663" y="218.20000000000002" text-anchor="start" font-size="13" fill="#0f172a">وتنزف البطانة</text><rect x="20" y="54" width="193.33333333333334" height="199.6" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الدورة الرحمية</text><text x="205.33333333333334" y="99" text-anchor="start" font-size="13" fill="#0f172a">• «مرحلة الاستعداد</text><text x="205.33333333333334" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">للقبض»</text><text x="205.33333333333334" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• بطانة الرحم تسمك</text><text x="205.33333333333334" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">لاستقبال بويضة مخصبة</text><text x="205.33333333333334" y="181.8" text-anchor="start" font-size="13" fill="#0f172a">• الطبقة الوظيفية تنسلخ</text><text x="205.33333333333334" y="200" text-anchor="start" font-size="13" fill="#0f172a">والقاعدية تغذيها</text><rect x="20" y="263.6" width="600" height="74" rx="10" fill="#0ea5e9" fill-opacity="0.13" stroke="#0ea5e9" stroke-width="1.5"/><text x="610" y="283.6" text-anchor="start" font-size="13.5" font-weight="800" fill="#0ea5e9">أساسيات</text><text x="610" y="303.6" text-anchor="start" font-size="13" fill="#0f172a">دورة 28 يومًا، أول حيض (menarche) وتستمر حتى سن اليأس (50–55 سنة). ترتيب</text><text x="610" y="322.6" text-anchor="start" font-size="13" fill="#0f172a">الهرمونات: GnRH ← FSH/LH ← إباضة ← استروجين وبروجسترون.</text></svg>
