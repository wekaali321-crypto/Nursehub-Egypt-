<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="400" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">atropine لبطء القلب المصحوب بأعراض</text><rect x="380" y="45" width="245" height="90" rx="10" fill="#fee2e2"/><text x="502.5" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">بطء قلب مصحوب بأعراض</text><text x="502.5" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">النبض أقل من 60</text><text x="502.5" y="113" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">ارتباك، هياج، شحوب</text><rect x="15" y="45" width="345" height="90" rx="10" fill="#dbeafe"/><text x="187.5" y="77" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">الآلية</text><text x="187.5" y="95" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">يحجب العصب الحائر (PNS: راحة وهضم)</text><text x="187.5" y="113" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">فيرتفع نشاط الودي (SNS) ويزيد معدل القلب</text><rect x="230" y="170" width="180" height="50" rx="10" fill="#dcfce7"/><text x="320" y="200" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">الخطوة 1: atropine</text><line x1="320" y1="135" x2="320" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/><rect x="230" y="255" width="180" height="50" rx="10" fill="#fef9c3"/><text x="320" y="276" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">الخطوة 2: تنظيم خارجي</text><text x="320" y="294" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">(external pacing)</text><line x1="320" y1="220" x2="320" y2="255" stroke="#64748b" stroke-width="2" 