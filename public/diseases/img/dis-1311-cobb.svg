<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الجنف وزاوية كوب (Cobb) والخطة</text>
<line x1="120" y1="60" x2="130" y2="100" stroke="#b91c1c" stroke-width="9" stroke-linecap="round"/>
<line x1="130" y1="100" x2="150" y2="140" stroke="#b91c1c" stroke-width="9" stroke-linecap="round"/>
<line x1="150" y1="140" x2="140" y2="180" stroke="#b91c1c" stroke-width="9" stroke-linecap="round"/>
<line x1="140" y1="180" x2="120" y2="215" stroke="#b91c1c" stroke-width="9" stroke-linecap="round"/>
<line x1="120" y1="215" x2="125" y2="250" stroke="#b91c1c" stroke-width="9" stroke-linecap="round"/>
<text x="120" y="280" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تقوس جانبي</text>
<rect x="240" y="50" width="380" height="50" rx="10" fill="#16a34a"/>
<text x="430.0" y="79.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">أقل من 10° لا يُعد جنفًا</text>
<rect x="240" y="108" width="380" height="50" rx="10" fill="#ca8a04"/>
<text x="430.0" y="137.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">10–25°: مراقبة بالأشعة والفحص</text>
<rect x="240" y="166" width="380" height="50" rx="10" fill="#ea580c"/>
<text x="430.0" y="195.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">حوالي 25–40°: مشد (Brace)</text>
<rect x="240" y="224" width="380" height="50" rx="10" fill="#b91c1c"/>
<text x="430.0" y="253.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">أكثر من 40–50°: جراحة تثبيت العمود</text>
</svg>
