<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 464" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="464" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تجمع الدم والهواء بالجنب</text><rect x="20" y="54" width="600" height="27.5" fill="#0ea5e9"/><text x="614" y="70.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#fff">الحالة</text><text x="454" y="70.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#fff">ما يحدث</text><text x="240.66666666666666" y="70.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#fff">العلامة المفتاحية</text><rect x="20" y="81.5" width="600" height="45" fill="#0ea5e9" fill-opacity="0.07" stroke="#0ea5e9" stroke-opacity="0.3"/><text x="614" y="98.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">تجمع دم بالجنب</text><text x="614" y="115.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">(Hemothorax)</text><text x="454" y="98.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">دم في الحيز الجنبي يسبب</text><text x="454" y="115.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">انهيار الرئة</text><text x="240.66666666666666" y="98.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">رنين مكتوم (dull) عند القرع:</text><text x="240.66666666666666" y="115.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">سائل/دم</text><rect x="20" y="126.5" width="600" height="45" fill="#fff" fill-opacity="1" stroke="#0ea5e9" stroke-opacity="0.3"/><text x="614" y="143.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">استرواح الصدر</text><text x="614" y="160.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">(Pneumothorax)</text><text x="454" y="143.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">هواء في الحيز الجنبي يسبب</text><text x="454" y="160.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">انهيار الرئة</text><text x="240.66666666666666" y="143.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">رنين مفرط (hyperresonance):</text><text x="240.66666666666666" y="160.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">كطرق طبل أجوف، هواء مرتفع</text><rect x="20" y="171.5" width="600" height="62.5" fill="#0ea5e9" fill-opacity="0.07" stroke="#0ea5e9" stroke-opacity="0.3"/><text x="614" y="188.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">استرواح الصدر الضاغط</text><text x="614" y="205.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">(Tension)</text><text x="454" y="188.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">من استرواح مفتوح (جرح ماص):</text><text x="454" y="205.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">يدخل الهواء بالشهيق ولا يخرج</text><text x="454" y="223.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">فيدفع الأعضاء</text><text x="240.66666666666666" y="188.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">انحراف الرغامى إلى جانب واحد</text><rect x="325" y="244" width="295" height="121.8" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="325" y="244" width="295" height="29" rx="10" fill="#ef4444"/><text x="612" y="262" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">العلامات</text><text x="612" y="289" text-anchor="start" font-size="13" fill="#0f172a">• ضيق نفس</text><text x="612" y="312.2" text-anchor="start" font-size="13" fill="#0f172a">• تسارع القلب</text><text x="612" y="335.4" text-anchor="start" font-size="13" fill="#0f172a">• تسارع التنفس</text><rect x="20" y="244" width="295" height="121.8" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="20" y="244" width="295" height="29" rx="10" fill="#10b981"/><text x="307" y="262" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">العلاج</text><text x="307" y="289" text-anchor="start" font-size="13" fill="#0f172a">• أنبوب صدري (أولًا)</text><text x="307" y="312.2" text-anchor="start" font-size="13" fill="#0f172a">• الاسترواح المفتوح ("صوت مص"): غطِّ</text><text x="307" y="330.4" text-anchor="start" font-size="13" fill="#0f172a">الجرح بضمادة محكمة (غيار فازلين) والصق</text><text x="307" y="348.59999999999997" text-anchor="start" font-size="13" fill="#0f172a">من 3 جهات</text><rect x="20" y="375.8" width="600" height="74" rx="10" fill="#f59e0b" fill-opacity="0.13" stroke="#f59e0b" stroke-width="1.5"/><text x="610" y="395.8" text-anchor="start" font-size="13.5" font-weight="800" fill="#f59e0b">سؤال HESI</text><text x="610" y="415.8" text-anchor="start" font-size="13" fill="#0f172a">أثناء تركيب قسطرة مركزية ظهر ضيق نفس وتسارع تنفس وطلب الطبيب صينية أنبوب</text><text x="610" y="434.8" text-anchor="start" font-size="13" fill="#0f172a">صدري: يُشتبه باسترواح الصدر.</text></svg>
