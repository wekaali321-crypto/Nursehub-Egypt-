<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="260" rx="16" fill="#f8fafc"/>
  <text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مواعيد الأورليستات والفيتامينات</text>
  <line x1="40" y1="120" x2="600" y2="120" stroke="#94a3b8" stroke-width="3"/>
  <g font-size="13" text-anchor="middle">
    <rect x="450" y="90" width="110" height="60" rx="10" fill="#fcd34d"/><text x="505" y="115" fill="#451a03" font-weight="700">وجبة دسمة</text><text x="505" y="135" font-size="11" fill="#451a03">كبسولة قبل/وسط الأكل</text>
    <rect x="250" y="90" width="110" height="60" rx="10" fill="#fcd34d"/><text x="305" y="115" fill="#451a03" font-weight="700">وجبة دسمة</text><text x="305" y="135" font-size="11" fill="#451a03">كبسولة مع الوجبة</text>
    <rect x="60" y="90" width="110" height="60" rx="10" fill="#e5e7eb"/><text x="115" y="115" fill="#334155" font-weight="700">وجبة بلا دهون</text><text x="115" y="135" font-size="11" fill="#334155">اترك الكبسولة</text>
    <rect x="250" y="180" width="140" height="48" rx="10" fill="#86efac"/><text x="320" y="202" fill="#14532d" font-weight="700">فيتامينات متعددة</text><text x="320" y="219" font-size="11" fill="#14532d">بعد ≥ 2–3 ساعات (أو قبل النوم)</text>
  </g>
  <text x="320" y="60" text-anchor="middle" font-size="12" fill="#475569">اتبع الفاصل الذي حدده الطبيب/الصيدلي (≥ 3 ساعات عن أي دواء آخر حسب المصدر)</text>
</svg>
