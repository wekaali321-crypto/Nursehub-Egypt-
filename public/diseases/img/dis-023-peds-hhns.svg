<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">DKA مقابل HHNS</text><rect x="20" y="46" width="600" height="30" rx="8" fill="#1e3a8a"/><text x="565.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">النقطة</text><text x="380.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">DKA</text><text x="135.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">HHNS</text><rect x="20" y="76" width="600" height="30" fill="#e0e7ff"/><text x="565.0" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">العمر والنوع</text><text x="380.0" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">نوع 1، أسرع، أصغر عمرًا</text><text x="135.0" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">نوع 2، أبطأ، أكبر عمرًا</text><rect x="20" y="106" width="600" height="66" fill="#fff"/><text x="565.0" y="126" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">المحفزات (S)</text><text x="380.0" y="126" text-anchor="middle" font-size="12.5"  fill="#0f172a">عدوى (Sepsis)، مرض (إنفلونزا/نزلة)،</text><text x="380.0" y="144" text-anchor="middle" font-size="12.5"  fill="#0f172a">ضغط/جراحة (Stress)، ترك الإنسولين</text><text x="380.0" y="162" text-anchor="middle" font-size="12.5"  fill="#0f172a">(Skip)</text><text x="135.0" y="126" text-anchor="middle" font-size="12.5"  fill="#0f172a">مرض وعدوى وكبر السن</text><rect x="20" y="172" width="600" height="30" fill="#e0e7ff"/><text x="565.0" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">السكر</text><text x="380.0" y="192" text-anchor="middle" font-size="12.5"  fill="#0f172a">250–500 فأكثر</text><text x="135.0" y="192" text-anchor="middle" font-size="12.5"  fill="#0f172a">أعلى من 600</text><rect x="20" y="202" width="600" height="48" fill="#fff"/><text x="565.0" y="222" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">الكيتونات</text><text x="565.0" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">والحموضة</text><text x="380.0" y="222" text-anchor="middle" font-size="12.5"  fill="#0f172a">كيتونات، تنفس كوسماول، رائحة فواكه، ألم</text><text x="380.0" y="240" text-anchor="middle" font-size="12.5"  fill="#0f172a">بطن، pH أقل من 7.35</text><text x="135.0" y="222" text-anchor="middle" font-size="12.5"  fill="#0f172a">لا كيتونات ولا حمض</text><rect x="20" y="250" width="600" height="30" fill="#e0e7ff"/><text x="565.0" y="270" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">العقل</text><text x="380.0" y="270" text-anchor="middle" font-size="12.5"  fill="#0f172a">—</text><text x="135.0" y="270" text-anchor="middle" font-size="12.5"  fill="#0f172a">تغير وعي وارتباك</text><rect x="20" y="280" width="600" height="30" fill="#fff"/><text x="565.0" y="300" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">البوتاسيوم</text><text x="380.0" y="300" text-anchor="middle" font-size="12.5"  fill="#0f172a">ارتفاع مبدئي</text><text x="135.0" y="300" text-anchor="middle" font-size="12.5"  fill="#0f172a">ثابت 3.5–5.0</text>
