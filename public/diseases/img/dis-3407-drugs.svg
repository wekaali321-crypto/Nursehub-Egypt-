<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="Cyclophosphamide مقابل Chlorambucil"><rect width="640" height="240" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">Cyclophosphamide مقابل Chlorambucil</text><rect x="10" y="48" width="620" height="28" rx="6" fill="#2b6a9e"/><text x="570.0" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الدواء</text><text x="385.0" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الآثار</text><text x="135.0" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الاستعمال</text><rect x="10" y="76" width="620" height="112" fill="#f4f8fc" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="95" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">Cyclophosphamide</text><text x="503.0" y="95" text-anchor="start" font-size="12.5"  fill="#1d2939">فوري: غثيان وقيء. أثناء الدورات:</text><text x="503.0" y="112" text-anchor="start" font-size="12.5"  fill="#1d2939">قلة بيض، التهاب مثانة نزفي، قلة</text><text x="503.0" y="129" text-anchor="start" font-size="12.5"  fill="#1d2939">صفائح. طويل: خصوبة وسرطانات ثانوية</text><text x="253.0" y="95" text-anchor="start" font-size="12.5"  fill="#1d2939">لوكيميا/ليمفوما (ALL، AML، CLL،</text><text x="253.0" y="112" text-anchor="start" font-size="12.5"  fill="#1d2939">هودجكن)، أورام صلبة (ثدي، مبيض،</text><text x="253.0" y="129" text-anchor="start" font-size="12.5"  fill="#1d2939">neuroblastoma، retinoblastoma)،</text><text x="253.0" y="146" text-anchor="start" font-size="12.5"  fill="#1d2939">وغير ورمية (mycosis fungoides،</text><text x="253.0" y="163" text-anchor="start" font-size="12.5"  fill="#1d2939">nephrotic syndrome للأطفال، RA،</text><text x="253.0" y="180" text-anchor="start" font-size="12.5"  fill="#1d2939">SLE، MS)</text><rect x="10" y="188" width="620" height="44" fill="#fff" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="207" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">Chlorambucil</text><text x="503.0" y="207" text-anchor="start" font-size="12.5"  fill="#1d2939">أثناء الدورات: أنيميا، قلة بيض،</text><text x="503.0" y="224" text-anchor="start" font-size="12.5"  fill="#1d2939">قلة صفائح. طويل: مشاكل خصوبة</text><text x="253.0" y="207" text-anchor="start" font-size="12.5"  fill="#1d2939">CLL، الليمفوما، هودجكن</text></svg>