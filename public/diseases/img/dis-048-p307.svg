<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 425" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="425" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الارتجاع المعدي المريئي GERD</text>
<rect x="346.0" y="52" width="320.0" height="186.0" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="346.0" y="52" width="320.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="506.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الآلية والأعراض</text>
<text x="656.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• ارتجاع أحماض المعدة يحرق المريء ويسبب ألماً</text>
<text x="656.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">والتهاباً، وقد يتطور (إن أُهمل) إلى مريء باريت</text>
<text x="656.0" y="130.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">وسرطان</text>
<text x="656.0" y="149.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• حرقة (Heartburn) وتزداد عند الاستلقاء</text>
<text x="656.0" y="169.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• السبب: ضعف أو تلف العضلة العاصرة السفلية</text>
<text x="656.0" y="186.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">للمريء (LES)</text>
<text x="656.0" y="205.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• عوامل الخطر: توتر، سمنة (BMI فوق 30)، فتق</text>
<text x="656.0" y="222.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">حجابي</text>
<rect x="14.0" y="52" width="320.0" height="186.0" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="14.0" y="52" width="320.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="174.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">تجنب وتثقيف</text>
<text x="324.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تجنب: مقليات، دهون (قليل الدسم أفضل)،</text>
<text x="324.0" y="113.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">حمضيات، ألبان، شوكولاتة، نعناع، قهوة/كافيين،</text>
<text x="324.0" y="130.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">تدخين، كحول</text>
<text x="324.0" y="149.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• لا تستلقِ قبل 3 ساعات من الأكل، اجلس بعد</text>
<text x="324.0" y="167.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الوجبات، ارفع رأس السرير ليلاً، وجبات صغيرة</text>
<rect x="346.0" y="250.0" width="320.0" height="147.5" rx="10" fill="#0ea5e9" fill-opacity="0.1" stroke="#0ea5e9" stroke-width="1.2"/>
<rect x="346.0" y="250.0" width="320.0" height="26" rx="10" fill="#0ea5e9" fill-opacity="1" stroke="#0ea5e9" stroke-width="1.2"/>
<text x="506.0" y="268.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأدوية والفحص</text>
<text x="656.0" y="294.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• مخفضات الحمض: مضادات حموضة، حاصرات مستقبلات</text>
<text x="656.0" y="311.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">الهيستامين (رانيتيدين وغيره؛ راجع الصيدلي</text>
<text x="656.0" y="328.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">لتوفر الدواء)، مثبطات مضخة البروتون</text>
<text x="656.0" y="345.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">(أوميبرازول)</text>
<text x="656.0" y="365.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• المنظار العلوي (EGD) يقيّم كفاءة LES عند</text>
<text x="656.0" y="382.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">استمرار الأعراض رغم العلاج</text>
<rect x="14.0" y="250.0" width="320.0" height="147.5" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="14.0" y="250.0" width="320.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="174.0" y="268.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الجراحة ومضاعفة البريتوان</text>
<text x="324.0" y="294.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• هدف الجراحة شد LES: إجراء Stretta (موجات</text>
<text x="324.0" y="311.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">راديوية) أو لف قاع المعدة حول المريء</text>
<text x="324.0" y="328.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">(Fundoplication)</text>
<text x="324.0" y="347.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أبلغ فوراً: حمى فوق 100.3ف، ألم ارتدادي، بطن</text>
<text x="324.0" y="365.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">صلب كاللوح، ألم متزايد، قلق، تسرع قلب وتنفس</text>
</svg>
