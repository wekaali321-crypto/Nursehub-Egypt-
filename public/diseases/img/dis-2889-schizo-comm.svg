<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 431" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#64748b"/></marker></defs><rect width="640" height="431" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="19" font-weight="800" fill="#0f172a">الفصام: التواصل العلاجي والتمريض</text><rect x="326" y="50" width="294" height="161.75" rx="10" fill="#fff" stroke="#0e7490" stroke-width="1.5"/><path d="M326 60a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#0e7490"/><text x="473" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التقييم (أسئلة مفتوحة)</text><text x="610" y="96.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="96.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">«ماذا تقول الأصوات؟ ماذا ترى؟»</text><text x="610" y="117.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="117.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">«أخبرني بما تشعر به الآن»</text><text x="610" y="138.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="138.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">«صف لي ما تراه الآن»</text><text x="610" y="159.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="159.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">«كيف تشعر وأنت تظن أنك مراقب؟»</text><text x="610" y="181" text-anchor="start" font-size="12.5" font-weight="700" fill="#0e7490">⁦•⁩</text><text x="598" y="181" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">«ما الأنشطة التي كنت تستمتع بها سابقاً؟»</text><rect x="20" y="50" width="294" height="161.75" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.5"/><path d="M20 60a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#15803d"/><text x="167" y="71" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">قرر الحقائق</text><text x="304" y="96.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="96.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">«أراك خائفاً، لنذهب لغرفتك ونتحدث»</text><text x="304" y="117.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="117.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">«قد يكون مخيفاً أن تظن أن الآخرين يريدون</text><text x="292" y="135.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">إيذاءك»</text><text x="304" y="156.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="156.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">«لا أسمع أصواتاً، لكنني أعلم أنها مخيفة لك»</text><text x="304" y="178" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="178" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">«أفهم أن الأصوات حقيقية لك لكنني لا أسمعها»</text><text x="304" y="199.125" text-anchor="start" font-size="12.5" font-weight="700" fill="#15803d">⁦•⁩</text><text x="292" y="199.125" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">«ترى نفسك المنقذ، وأنا أراك مريضي»</text><rect x="326" y="223.75" width="294" height="195" rx="10" fill="#fff" stroke="#6d28d9" stroke-width="1.5"/><path d="M326 233.75a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#6d28d9"/><text x="473" y="244.75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">نقاط امتحان</text><text x="610" y="270.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="598" y="270.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">ركّز على الواقع وعزّزه لفظياً</text><text x="610" y="291.375" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="598" y="291.375" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">اعترف بمشاعر المريض</text><text x="610" y="312.5" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="598" y="312.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">لا تسمِّ الأصوات ولا تجادل: قدّم الواقع</text><text x="598" y="330.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">دائماً</text><text x="610" y="351.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#6d28d9">⁦•⁩</text><text x="598" y="351.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">بيئة آمنة ومنظمة وقلل المنبهات وراقب خطر</text><text x="598" y="369.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">الانتحار</text><rect x="20" y="223.75" width="294" height="195" rx="10" fill="#fff" stroke="#c2410c" stroke-width="1.5"/><path d="M20 233.75a10 10 0 0 1 10-10h274a10 10 0 0 1 10 10v22h-294z" fill="#c2410c"/><text x="167" y="244.75" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">أنواع تُسأل</text><text x="304" y="270.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="292" y="270.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">كتاتوني: جمود، أوضاع غريبة (تصلب عضلي)،</text><text x="292" y="288.375" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">صمت، سلبية شديدة، تحديق؛ الأولوية: السوائل</text><text x="292" y="306.5" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">والتغذية</text><text x="304" y="327.625" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="292" y="327.625" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">بارانويدي: أوهام اضطهاد؛ ركّز على الواقع</text><text x="292" y="345.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">واعترف بالمشاعر</text><text x="304" y="366.875" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="292" y="366.875" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">المريض الذي يغادر الغرفة حين تدخل: دعه</text><text x="292" y="385" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">يغادر ويجلس بهدوء</text><text x="304" y="406.125" text-anchor="start" font-size="12.5" font-weight="700" fill="#c2410c">⁦•⁩</text><text x="292" y="406.125" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">مراحل: بادرية، نشطة، متبقية (غير مركزية)</text></svg>