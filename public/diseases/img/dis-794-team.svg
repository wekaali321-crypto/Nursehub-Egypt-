<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 274" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="274" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">فريق العمليات ودور كل عضو</text><rect x="12" y="44" width="616" height="30" rx="8" fill="#0f172a"/><text x="541.76" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">العضو</text><text x="233.76" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">الدور</text><rect x="12" y="74" width="616" height="28" fill="#fff"/><text x="541.76" y="92" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">الجراح</text><text x="233.76" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">ينفذ العملية</text><rect x="12" y="102" width="616" height="28" fill="#f1f5f9"/><text x="541.76" y="120" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">المساعد</text><text x="233.76" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">جراح آخر / مقيم / ممرض مساعد</text><rect x="12" y="130" width="616" height="28" fill="#fff"/><text x="541.76" y="148" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">طبيب/فني التخدير</text><text x="233.76" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">يعطي التخدير ويراقب العلامات الحيوية</text><rect x="12" y="158" width="616" height="44" fill="#f1f5f9"/><text x="541.76" y="176" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">الممرض الدوار</text><text x="541.76" y="192" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">(Circulating)</text><text x="233.76" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">مناصر للمريض، يجهز المستلزمات والدم والتحاليل، يضع المريض ويحمي</text><text x="233.76" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">نتوءاته، ينظف الجلد ويضع الستائر؛ &lt;b&gt;لا يعقم يديه&lt;/b&gt; (غير معقم)</text><rect x="12" y="202" width="616" height="28" fill="#fff"/><text x="541.76" y="220" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">ممرض/فني المعدات (Scrub)</text><text x="233.76" y="220" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">يجهز الحقل المعقم، يساعد في الستائر، يناول الأدوات ويستلمها</text><rect x="12" y="230" width="616" height="28" fill="#f1f5f9"/><text x="541.76" y="248" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">ممرض منطقة الانتظار</text><text x="233.76" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">يرعى المرضى قبل دخول الغرفة وينقلهم</text></svg>