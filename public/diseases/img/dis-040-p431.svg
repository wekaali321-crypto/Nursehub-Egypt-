<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 416" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="416" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أدوية الربو: BAM وSLM ونوبة الربو الحادة</text><rect x="325" y="54" width="295" height="145" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="325" y="54" width="295" height="29" rx="10" fill="#10b981"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">موسّعات الشعب (BAM)</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• B: منبه بيتا 2 — albuterol (دواء</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">الإنقاذ الوحيد)</text><text x="612" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• A: مضاد كولين — ipratropium</text><text x="612" y="163.6" text-anchor="start" font-size="13" fill="#0f172a">• M: ميثيل زانثين — theophylline (سام</text><text x="612" y="181.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">جدًا؛ المستوى العلاجي 10–20 mg/dL)</text><rect x="20" y="54" width="295" height="145" rx="10" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="1.5"/><rect x="20" y="54" width="295" height="29" rx="10" fill="#ec4899"/><text x="307" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">مضادات الالتهاب (SLM)</text><text x="307" y="99" text-anchor="start" font-size="13" fill="#0f172a">• S: ستيرويد — beclomethasone</text><text x="307" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• L: مثبط ليكوترين — montelukast</text><text x="307" y="145.4" text-anchor="start" font-size="13" fill="#0f172a">• M: مثبت الخلايا البدينة — cromolyn</text><rect x="20" y="209" width="600" height="55" rx="10" fill="#f59e0b" fill-opacity="0.13" stroke="#f59e0b" stroke-width="1.5"/><text x="610" y="229" text-anchor="start" font-size="13.5" font-weight="800" fill="#f59e0b">AIM</text><text x="610" y="249" text-anchor="start" font-size="13" fill="#0f172a">نوبة ربو حادة: الأول albuterol، ثم ipratropium، ثم methylprednisolone.</text><rect x="20" y="274" width="600" height="27.5" fill="#ec4899"/><text x="614" y="290.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#fff">آثار الستيرويد المستنشق</text><text x="383.2307692307692" y="290.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#fff">التدبير</text><rect x="20" y="301.5" width="600" height="45" fill="#ec4899" fill-opacity="0.07" stroke="#ec4899" stroke-opacity="0.3"/><text x="614" y="318.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">قروح الفم (مونيليا)</text><text x="383.2307692307692" y="318.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">مضمضة وبصق بعد كل استعمال وتنظيف البخاخة مرتين</text><text x="383.2307692307692" y="335.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">أسبوعيًا</text><rect x="20" y="346.5" width="600" height="27.5" fill="#fff" fill-opacity="1" stroke="#ec4899" stroke-opacity="0.3"/><text x="614" y="363.25" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">العدوى وارتفاع الكريات البيض</text><text x="383.2307692307692" y="363.25" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">انتبه لعلامات العدوى</text><rect x="20" y="374" width="600" height="27.5" fill="#ec4899" fill-opacity="0.07" stroke="#ec4899" stroke-opacity="0.3"/><text x="614" y="390.75" text-anchor="start" font-size="12.5" font-weight="700" fill="#0f172a">ارتفاع السكر</text><text x="383.2307692307692" y="390.75" text-anchor="start" font-size="12.5" font-weight="400" fill="#0f172a">راقب الجلوكوز</text></svg>
