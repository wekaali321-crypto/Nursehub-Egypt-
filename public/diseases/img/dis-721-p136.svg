<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 190" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="190" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الألبومين والصفراء والتجلط في تليف الكبد</text><rect x="425" y="48" width="195" height="122" rx="12" fill="#0ea5e9" fill-opacity="0.12" stroke="#0ea5e9" stroke-width="1.5"/><rect x="425" y="48" width="195" height="34" rx="12" fill="#0ea5e9"/><text x="523" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ألبومين</text><text x="523" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">ينقل الأدوية</text><text x="523" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">يجذب الماء بالأوعية</text><text x="523" y="152" text-anchor="middle" font-size="12.5" fill="#0f172a">يرتبط بالكالسيوم</text><rect x="223" y="48" width="195" height="122" rx="12" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="1.5"/><rect x="223" y="48" width="195" height="34" rx="12" fill="#f59e0b"/><text x="320" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">صفراء (Bile)</text><text x="320" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">تحمل الكوليسترول والبيليروبين</text><text x="320" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">نقصها: يرقان</text><rect x="20" y="48" width="195" height="122" rx="12" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-width="1.5"/><rect x="20" y="48" width="195" height="34" rx="12" fill="#ef4444"/><text x="117" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">عوامل التجلط</text><text x="117" y="104" text-anchor="middle" font-size="12.5" fill="#0f172a">نقصها = خطر نزف</text><text x="117" y="128" text-anchor="middle" font-size="12.5" fill="#0f172a">أهم هاجس: النزف</text>
</svg>
