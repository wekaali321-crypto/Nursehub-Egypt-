<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker></defs><rect width="640" height="330" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">رعاية ما بعد السكتة: H و C و F</text><rect x="430" y="50" width="190" height="120" rx="10" fill="#7c3aed"/><text x="525.0" y="89.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">H: نقص الرؤية النصفي</text><text x="525.0" y="105.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">ألبس الجانب الضعيف أولًا</text><text x="525.0" y="121.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">امسح بالنظر وأدر الرأس للجانب المصاب</text><text x="525.0" y="137.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">اقترب من الجانب السليم</text><rect x="225" y="50" width="190" height="120" rx="10" fill="#0891b2"/><text x="320.0" y="89.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">C: التواصل</text><text x="320.0" y="105.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Broca تعبيرية: يفهم ولا ينطق</text><text x="320.0" y="121.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Wernicke استقبالية: ينطق ولا يفهم</text><text x="320.0" y="137.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">جمل قصيرة وأسئلة نعم/لا</text><rect x="20" y="50" width="190" height="120" rx="10" fill="#16a34a"/><text x="115.0" y="89.85" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">F: التغذية</text><text x="115.0" y="105.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">NPO حتى فحص البلع</text><text x="115.0" y="121.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">ارفع الرأس (HOB) وثني العنق</text><text x="115.0" y="137.85" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">غذاء مهروس + مُثخّن</text><rect x="20" y="185" width="600" height="52" rx="10" fill="#e2e8f0"/><text x="320.0" y="215.55" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">نقل المريض: حزام نقل، دائمًا نحو الجانب الأقوى</text><rect x="20" y="245" width="600" height="70" rx="10" fill="#fee2e2"/><text x="320.0" y="275.7" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">ممنوع: إنجاز المهام عنه • الصراخ • التعليمات المعقدة</text><text x="320.0" y="292.7" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">أعطِه وقتًا + إيماءات وصور + نبرة عادية + تجميع الرعاية لتقليل الإفراط الحسي</text></svg>