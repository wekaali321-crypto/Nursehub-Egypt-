<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 204" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="204" rx="16" fill="#f8fafc"/>
<text x="320" y="28" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">الوقاية من متلازمة موت الرضيع المفاجئ: A B C</text><rect x="426" y="46" width="193" height="112" rx="12" fill="#bae6fd"/><text x="522.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">A وحيد (Alone)</text><text x="522.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">بلا وسائد</text><text x="522.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">بلا بطانيات</text><text x="522.5" y="136" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">بلا دمى محشوة</text><rect x="223" y="46" width="193" height="112" rx="12" fill="#bbf7d0"/><text x="319.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">B على الظهر (Back)</text><text x="319.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">وضع الاستلقاء Supine</text><rect x="20" y="46" width="193" height="112" rx="12" fill="#fde68a"/><text x="116.5" y="72" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">C سرير (Crib)</text><text x="116.5" y="96" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">لا مشاركة سرير</text><text x="116.5" y="116" text-anchor="middle" font-size="11" font-weight="500" fill="#1e293b">لا نوم مشترك</text><text x="320" y="192" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">سطح نوم صلب، لا حشوات جانبية، بيئة بلا تدخين</text>
</svg>
