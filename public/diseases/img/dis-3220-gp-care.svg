<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="345" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">العناية التمريضية بمريض مثبطات GP IIb/IIIa</text><rect x="30" y="44" width="580" height="52.5" rx="10" fill="#fff" stroke="#1e3a8a" stroke-width="1.5"/><rect x="540" y="44" width="70" height="52.5" rx="10" fill="#1e3a8a"/><text x="575" y="75.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">1</text><text x="525" y="74" text-anchor="start" font-size="12.5" font-weight="500" fill="#0f172a">قيّم: الهيموجلوبين، الصفيحات.</text><path d="M320 98.5v14m-6 -6l6 7l6 -7" stroke="#64748b" stroke-width="2" fill="none"/><rect x="30" y="116.5" width="580" height="69" rx="10" fill="#fff" stroke="#0f766e" stroke-width="1.5"/><rect x="540" y="116.5" width="70" height="69" rx="10" fill="#0f766e"/><text x="575" y="156" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">2</text><text x="525" y="146.5" text-anchor="start" font-size="12.5" font-weight="500" fill="#0f172a">قيّم النزف: بول وردي، براز أسود أو دموي، موضع إدخال القسطرة</text><text x="525" y="163" text-anchor="start" font-size="12.5" font-weight="500" fill="#0f172a">بالفخذ.</text><path d="M320 187.5v14m-6 -6l6 7l6 -7" stroke="#64748b" stroke-width="2" fill="none"/><rect x="30" y="205.5" width="580" height="52.5" rx="10" fill="#fff" stroke="#b45309" stroke-width="1.5"/><rect x="540" y="205.5" width="70" height="52.5" rx="10" fill="#b45309"/><text x="575" y="236.75" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">3</text><text x="525" y="235.5" text-anchor="start" font-size="12.5" font-weight="500" fill="#0f172a">ضع المريض على مراقب القلب وانتبه لتغيّرات ECG.</text><path d="M320 260v14m-6 -6l6 7l6 -7" stroke="#64748b" stroke-width="2" fill="none"/><rect x="30" y="278" width="580" height="52.5" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><rect x="540" y="278" width="70" height="52.5" rx="10" fill="#7c3aed"/><text x="575" y="309.25" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">4</text><text x="525" y="308" text-anchor="start" font-size="12.5" font-weight="500" fill="#0f172a">لا حقن جديدة: لا وريدي ولا عضلي بلا ضرورة.</text></svg>