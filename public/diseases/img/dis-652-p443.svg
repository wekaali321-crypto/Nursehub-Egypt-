<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="480" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الجلطة الرئوية (PE)</text><rect x="30" y="54" width="580" height="40" rx="10" fill="#ef4444" fill-opacity="0.14" stroke="#ef4444" stroke-width="1.5"/><circle cx="578" cy="74" r="14" fill="#ef4444"/><text x="578" y="79" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">1</text><text x="554" y="79" text-anchor="start" font-size="13.5" fill="#0f172a">جلطة غالبًا من DVT بالساق تنفلت وتسد شريانًا رئويًا</text><text x="320" y="105" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="108" width="580" height="54" rx="10" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-width="1.5"/><circle cx="578" cy="135" r="14" fill="#f59e0b"/><text x="578" y="140" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">2</text><text x="554" y="130" text-anchor="start" font-size="13.5" fill="#0f172a">لا يصل الدم للحويصلات → نقص أكسجة قاتل (ضعف تبادل الغازات: أعلى</text><text x="554" y="149.575" text-anchor="start" font-size="13.5" fill="#0f172a">أولوية)</text><text x="320" y="173" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="176" width="580" height="54" rx="10" fill="#ec4899" fill-opacity="0.14" stroke="#ec4899" stroke-width="1.5"/><circle cx="578" cy="203" r="14" fill="#ec4899"/><text x="578" y="208" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">3</text><text x="554" y="198" text-anchor="start" font-size="13.5" fill="#0f172a">عوامل الخطر: تدخين، سمنة، عدم حركة، رجفان أذيني أو اضطراب صمامات،</text><text x="554" y="217.575" text-anchor="start" font-size="13.5" fill="#0f172a">وموانع الحمل الهرمونية (استروجين)</text><text x="320" y="241" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="244" width="580" height="54" rx="10" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-width="1.5"/><circle cx="578" cy="271" r="14" fill="#0ea5e9"/><text x="578" y="276" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">4</text><text x="554" y="266" text-anchor="start" font-size="13.5" fill="#0f172a">الأعراض: نقص الأكسجة أولًا (قلق، تهيّج، تغير وعي)، ألم صدر، ضيق</text><text x="554" y="285.575" text-anchor="start" font-size="13.5" fill="#0f172a">نفس، تسارع تنفس وقلب</text><text x="320" y="309" text-anchor="middle" font-size="12" fill="#64748b">▼</text><rect x="30" y="312" width="580" height="40" rx="10" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-width="1.5"/><circle cx="578" cy="332" r="14" fill="#10b981"/><text x="578" y="337" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">5</text><text x="554" y="337" text-anchor="start" font-size="13.5" fill="#0f172a">D-dimer مرتفع (الطبيعي 68–494 ng/dL)</text><rect x="325" y="362" width="295" height="103.6" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="325" y="362" width="295" height="29" rx="10" fill="#10b981"/><text x="612" y="380" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الأدوية</text><text x="612" y="407" text-anchor="start" font-size="13" fill="#0f172a">• مضادات تخثر: heparin، warfarin</text><text x="612" y="430.2" text-anchor="start" font-size="13" fill="#0f172a">• حالّات خثرة: tPA، alteplase،</text><text x="612" y="448.4" text-anchor="start" font-size="13" fill="#0f172a">streptokinase</text><rect x="20" y="362" width="295" height="103.6" rx="10" fill="#6366f1" fill-opacity="0.1" stroke="#6366f1" stroke-width="1.5"/><rect x="20" y="362" width="295" height="29" rx="10" fill="#6366f1"/><text x="307" y="380" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">الجراحة</text><text x="307" y="407" text-anchor="start" font-size="13" fill="#0f172a">• استئصال الصمة (Embolectomy)</text><text x="307" y="430.2" text-anchor="start" font-size="13" fill="#0f172a">• فلتر الوريد الأجوف السفلي: شبكة</text><text x="307" y="448.4" text-anchor="start" font-size="13" fill="#0f172a">تصطاد الجلطات الجديدة</text></svg>
