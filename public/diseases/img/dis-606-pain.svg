<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="270" rx="16" fill="#f8fafc"/><text x="320.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a" >ألم التهاب التامور مقابل الجلطة</text><rect x="20" y="50" width="300" height="150" rx="10" fill="#dbeafe"/><text x="170" y="80" text-anchor="middle" font-size="16" font-weight="800" fill="#1e3a8a" >التهاب التامور</text><text x="170" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a" >ألم حاد يزيد بالشهيق والاستلقاء</text><text x="170" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a" >يخف بالانحناء للأمام والجلوس</text><text x="170" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a" >احتكاك التامور (Rub)</text><text x="170" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a" >ارتفاع ST منتشر + هبوط PR</text><rect x="330" y="50" width="290" height="150" rx="10" fill="#fee2e2"/><text x="475" y="80" text-anchor="middle" font-size="16" font-weight="800" fill="#7f1d1d" >الجلطة القلبية</text><text x="475" y="108" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d" >ضغط وثقل لا يتأثر بالتنفس</text><text x="475" y="130" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d" >لا يخف بالجلوس أو الراحة</text><text x="475" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d" >عرق وغثيان</text><text x="475" y="174" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d" >ارتفاع ST موضعي</text><text x="320" y="235" text-anchor="middle" font-size="12" font-weight="600" fill="#475569" >تمييز مبسط — القرار للطبيب</text></svg>