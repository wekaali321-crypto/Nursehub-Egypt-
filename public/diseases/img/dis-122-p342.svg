<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 444" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="444" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب المرارة (Cholecystitis)</text><rect x="330" y="52" width="300" height="94.19999999999999" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الفكرة</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• التهاب المرارة غالبًا من الحصوات</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  (Cholelithiasis) التي تسد القنوات</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• احتباس الصفراء ثم التهاب</text><rect x="10" y="52" width="310" height="111.6" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#dc2626"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأعراض (كثيرة الاختبار)</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ألم الربع العلوي الأيمن RUQ ينتشر للكتف</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الأيمن</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• حمى مع رعشة</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• سرعة قلب</text><rect x="330" y="171.6" width="300" height="94.19999999999999" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M330,181.6 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#ea580c"/><text x="480.0" y="190.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">عوامل الخطر</text><text x="620" y="214.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• غذاء عالي الدهون</text><text x="620" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• سمنة</text><text x="620" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• عمر فوق 40</text><rect x="10" y="171.6" width="310" height="111.6" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M10,181.6 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#16a34a"/><text x="165.0" y="190.6" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج</text><text x="310" y="214.6" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• NPO فورًا (الأكل يزيد الألم)</text><text x="310" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تفتيت الحصوات (Lithotripsy) بالموجات، وإن</text><text x="310" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  كبرت: جراحة</text><text x="310" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• استئصال المرارة: مفتوح أو بالمنظار</text><rect x="330" y="291.2" width="300" height="111.6" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="1.5"/><path d="M330,301.2 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#7c3aed"/><text x="480.0" y="310.2" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">بعد الجراحة</text><text x="620" y="334.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مشي مبكر</text><text x="620" y="351.59999999999997" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تنفس عميق وسعال (منع الالتهاب الرئوي)</text><text x="620" y="368.99999999999994" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• لا استحمام في البانيو، دش فقط</text><text x="620" y="386.3999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• أبلغ عن احمرار/تورم الجرح</text><rect x="10" y="291.2" width="310" height="129.0" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M10,301.2 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#0369a1"/><text x="165.0" y="310.2" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التثقيف</text><text x="310" y="334.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• خفّض الوزن</text><text x="310" y="351.59999999999997" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تجنب الدهون والمقليات</text><text x="310" y="368.99999999999994" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• بعد الاستئصال: صعوبة هضم الدهون</text><text x="310" y="386.3999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• بعد المنظار: دش، العودة للعمل بعد نحو</text><text x="310" y="403.7999999999999" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  أسبوع</text></svg>