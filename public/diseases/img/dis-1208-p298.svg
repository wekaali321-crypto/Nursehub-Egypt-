<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 376" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="680" height="376" rx="16" fill="#f8fafc"/>
<text x="340.0" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">السيلياك (حساسية الجلوتين)</text>
<rect x="14.0" y="52" width="652.0" height="78.5" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.2"/>
<rect x="14.0" y="52" width="652.0" height="26" rx="10" fill="#ef4444" fill-opacity="1" stroke="#ef4444" stroke-width="1.2"/>
<text x="340.0" y="70" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الآلية</text>
<text x="656.0" y="96" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• رد مناعي للجلوتين (قمح كامل وحبوب وشعير وجاودار وبيرة: خبز، لحم مفتت بالتغليف، معكرونة)</text>
<text x="656.0" y="115.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• تلف التهابي في الأمعاء الدقيقة (اختفاء الزغابات) فسوء امتصاص للدهون والمغذيات وبطء نمو الأطفال</text>
<rect x="14.0" y="142.5" width="652.0" height="78.5" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.2"/>
<rect x="14.0" y="142.5" width="652.0" height="26" rx="10" fill="#f59e0b" fill-opacity="1" stroke="#f59e0b" stroke-width="1.2"/>
<text x="340.0" y="160.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">الأعراض</text>
<text x="656.0" y="186.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• إسهال، إسهال دهني (Steatorrhea) لأن الدهون غير ممتصة، ألم بطن</text>
<text x="656.0" y="205.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أطفال: نقص وزن وتأخر نمو وتأخر بلوغ</text>
<rect x="14.0" y="233.0" width="652.0" height="115.0" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.2"/>
<rect x="14.0" y="233.0" width="652.0" height="26" rx="10" fill="#10b981" fill-opacity="1" stroke="#10b981" stroke-width="1.2"/>
<text x="340.0" y="251.0" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">التثقيف</text>
<text x="656.0" y="277.0" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• فيتامينات ذائبة بالدهون (A, D, E, K) لعدم امتصاصها</text>
<text x="656.0" y="296.25" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• أطعمة خالية من الجلوتين: لحوم عادية، أرز وذرة وبطاطس وصويا وكينوا، مكسرات وفول وبقوليات، فواكه</text>
<text x="656.0" y="313.5" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">وخضار</text>
<text x="656.0" y="332.75" text-anchor="start" font-size="11.5" font-weight="400" fill="#0f172a">• وجبة تحوي معكرونة قمح كاملة = بحاجة لتعليم إضافي</text>
</svg>
