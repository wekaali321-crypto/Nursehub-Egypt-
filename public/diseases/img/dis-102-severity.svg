<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="286" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">شدة النوبة (معايير Truelove–Witts مبسطة)</text><rect x="326" y="52" width="284" height="88" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="468" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#166534">خفيفة</text><text x="468" y="102" text-anchor="middle" font-size="12.5" fill="#166534">أقل من 4 مرات تبرز دموي في اليوم</text><text x="468" y="119" text-anchor="middle" font-size="12.5" fill="#166534">بدون علامات تسمم</text><rect x="30" y="52" width="284" height="88" rx="12" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="172" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#854d0e">متوسطة</text><text x="172" y="102" text-anchor="middle" font-size="12.5" fill="#854d0e">4 إلى 6 مرات في اليوم</text><text x="172" y="119" text-anchor="middle" font-size="12.5" fill="#854d0e">علامات خفيفة</text><rect x="326" y="152" width="284" height="88" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/><text x="468" y="180" text-anchor="middle" font-size="14.5" font-weight="800" fill="#991b1b">شديدة</text><text x="468" y="202" text-anchor="middle" font-size="12.5" fill="#991b1b">6 مرات أو أكثر + نبض فوق 90</text><text x="468" y="219" text-anchor="middle" font-size="12.5" fill="#991b1b">حرارة فوق 37.8 • هيموجلوبين أقل من 10.5 • ESR فوق 30</text><rect x="30" y="152" width="284" height="88" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/><text x="172" y="180" text-anchor="middle" font-size="14.5" font-weight="800" fill="#991b1b">مُنذرة بالخطر</text><text x="172" y="202" text-anchor="middle" font-size="12.5" fill="#991b1b">أكثر من 10 مرات + نزيف مستمر</text><text x="172" y="219" text-anchor="middle" font-size="12.5" fill="#991b1b">انتفاخ