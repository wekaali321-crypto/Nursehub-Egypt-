<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" direction="rtl" font-family="Cairo, Tahoma, sans-serif"><rect width="640" height="420" rx="12" fill="#f7fafc"/><rect x="20" y="20" width="600" height="150" rx="8" fill="#ebf8ff" stroke="#3182ce" stroke-width="1.5"/><text x="320" y="48" font-size="17" fill="#2c5282" text-anchor="middle" font-weight="bold">إنسولين 40 وحدة/مل في سرنجة 100 (التركيز أصغر من السرنجة)</text><text x="320" y="80" font-size="16" fill="#1a202c" text-anchor="middle" font-weight="normal">الوحدات المطلوبة × 2.5 = الرقم اللي تسحب لحده على السرنجة</text><text x="320" y="112" font-size="16" fill="#c53030" text-anchor="middle" font-weight="bold">مثال: عايز 20 وحدة ← 20 × 2.5 = 50 (نص السرنجة)</text><text x="320" y="145" font-size="13" fill="#4a5568" text-anchor="middle" font-weight="normal">(السرنجة 100 مقسمة 100 شرطة لكل 1 مل، والإنسولين 40 أضعف)</text><rect x="20" y="190" width="600" height="150" rx="8" fill="#fffaf0" stroke="#dd6b20" stroke-width="1.5"/><text x="320" y="218" font-size="17" fill="#9c4221" text-anchor="middle" font-weight="bold">إنسولين 100 وحدة/مل في سرنجة 40 (التركيز أكبر من السرنجة)</text><text x="320" y="250" font-size="16" fill="#1a202c" text-anchor="middle" font-weight="normal">الوحدات المطلوبة ÷ 2.5 = الرقم اللي تسحب لحده على السرنجة</text><text x="320" y="282" font-size="16" fill="#c53030" text-anchor="middle" font-weight="bold">مثال: عايز 20 وحدة ← 20 ÷ 2.5 = 8 شرطات</text><text x="320" y="315" font-size="13" fill="#4a5568" text-anchor="middle" font-weight="normal">(الأفضل دايماً: سرنجة تطابق تركيز الفيال، والتحويل للضرورة فقط)</text><rect x="20" y="355" width="600" height="45" rx="8" fill="#fff5f5" stroke="#c53030" stroke-width="1.5"/><text x="320" y="384" font-size="15" fill="#c53030" text-anchor="middle" font-weight="bold">اتأكد من اتنين: تركيز الفيال (40 أو 100) + نوع السرنجة، قبل ما تسحب</text></svg>