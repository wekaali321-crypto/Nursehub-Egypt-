<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="260" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تقييم الدورة والأعصاب (5 P) لمتلازمة الحيز</text>
<rect x="20" y="50" width="112" height="100" rx="10" fill="#b91c1c"/>
<text x="76.0" y="85.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Pain</text>
<text x="76.0" y="104.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ألم شديد لا</text>
<text x="76.0" y="123.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">يستجيب للمسكن</text>
<rect x="142" y="50" width="112" height="100" rx="10" fill="#b91c1c"/>
<text x="198.0" y="94.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Paresthesia</text>
<text x="198.0" y="113.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تنميل وخدر</text>
<rect x="264" y="50" width="112" height="100" rx="10" fill="#7f1d1d"/>
<text x="320.0" y="94.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Pallor</text>
<text x="320.0" y="113.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">شحوب وبرودة</text>
<rect x="386" y="50" width="112" height="100" rx="10" fill="#7f1d1d"/>
<text x="442.0" y="85.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Pulselessness</text>
<text x="442.0" y="104.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">غياب النبض</text>
<text x="442.0" y="123.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">(متأخر)</text>
<rect x="508" y="50" width="112" height="100" rx="10" fill="#7f1d1d"/>
<text x="564.0" y="85.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Paralysis</text>
<text x="564.0" y="104.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">شلل أو صعوبة</text>
<text x="564.0" y="123.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">تحريك</text>
<rect x="20" y="165" width="600" height="60" rx="10" fill="#0f766e"/>
<text x="320.0" y="189.33333333333334" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">وقت الحيز طارئ: بلّغ فورًا، لا ترفع الطرف فوق القلب، وجهّز لفتح الجبس أو الشق</text>
<text x="320.0" y="209.33333333333334" text-anchor="middle" font-size="13" font-weight="500" fill="#fff">الجراحي (Fasciotomy)</text>
<text x="320" y="248" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">نبض ظاهر لا ينفي المتلازمة؛ الألم هو الإنذار الأبكر</text>
</svg>
