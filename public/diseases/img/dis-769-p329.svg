<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 369" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="369" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">التهاب النسيج الخلوي (Cellulitis)</text><rect x="330" y="52" width="300" height="129.0" rx="10" fill="#fff" stroke="#0369a1" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#0369a1"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الفكرة</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• عدوى بكتيرية في الأدمة العميقة وتحت</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الجلد</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• العامل الأشيع: المكورات العنقودية</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الذهبية</text><text x="620" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• غالبًا الأطراف السفلية (قرب الظنبوب)</text><rect x="10" y="52" width="310" height="129.0" rx="10" fill="#fff" stroke="#ea580c" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#ea580c"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">عوامل الخطر</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• إصابة (Trauma)، سكري، تاريخ التهاب سابق</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قدم الرياضي (Tinea pedis)</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• وذمة لمفاوية (Lymphedema)</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• سمنة</text><text x="310" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• قصور وريدي</text><rect x="330" y="189.0" width="300" height="111.6" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M330,199.0 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#dc2626"/><text x="480.0" y="208.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأعراض</text><text x="620" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• حمى واحمرار وألم</text><text x="620" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• دفء وحنان (Tenderness)</text><text x="620" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تورم وحمامى</text><text x="620" y="284.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• خراج لو تُرك دون علاج</text><rect x="10" y="189.0" width="310" height="111.6" rx="10" fill="#fff" stroke="#16a34a" stroke-width="1.5"/><path d="M10,199.0 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#16a34a"/><text x="165.0" y="208.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العلاج والمتابعة</text><text x="310" y="232.0" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• مضادات حيوية: بنسلين، سيفالوسبورين،</text><text x="310" y="249.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  كليندامايسين</text><text x="310" y="266.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• ارسم حدود الالتهاب بقلم وحدد التاريخ ثم</text><text x="310" y="284.2" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  قارن اتساعه أو ضيقه</text><rect x="10" y="308.6" width="620" height="34.75" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/><text x="320" y="328.35" text-anchor="middle" font-size="12.5" font-weight="600" fill="#713f12">مضاعفات: تسمم دم (Sepsis) وخراج؛ وتنتقل بالتلامس المباشر مع جرح مفتوح لشخص مصاب.</text></svg>