<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 342" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="342" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الإمساك وسلس البراز (Encopresis)</text><rect x="325" y="48" width="295" height="164" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><rect x="325" y="48" width="295" height="30" rx="12" fill="#2563eb"/><text x="472.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">الإمساك</text><text x="610" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">أقل من 3 مرات أسبوعيًا</text><text x="610" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">براز جاف متكتل</text><text x="610" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">شد أثناء الإخراج</text><text x="610" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">أسباب: توتر وقلة سوائل وألياف</text><rect x="20" y="48" width="295" height="164" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><rect x="20" y="48" width="295" height="30" rx="12" fill="#16a34a"/><text x="167.5" y="69" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">العلاج</text><text x="305" y="100" text-anchor="start" font-size="12.5" fill="#1e293b">سوائل وألياف عالية</text><text x="305" y="120" text-anchor="start" font-size="12.5" fill="#1e293b">مشي (Ambulation)</text><text x="305" y="140" text-anchor="start" font-size="12.5" fill="#1e293b">استبدال المكرونة بالمكرونة الكاملة</text><text x="305" y="160" text-anchor="start" font-size="12.5" fill="#1e293b">تغيير العادات: زيارات منتظمة للحمام بعد</text><text x="305" y="180" text-anchor="start" font-size="12.5" fill="#1e293b">الوجبات، سجل يومي، مكافأة الجهد وليس كل</text><text x="305" y="200" text-anchor="start" font-size="12.5" fill="#1e293b">إخراج</text><rect x="325" y="222" width="295" height="104" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="325" y="222" width="295" height="30" rx="12" fill="#ea580c"/><text x="472.5" y="243" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">Encopresis</text><text x="610" y="274" text-anchor="start" font-size="12.5" fill="#1e293b">مضاعفة الانحشار البرازي</text><text x="610" y="294" text-anchor="start" font-size="12.5" fill="#1e293b">3 خطوات: ملينات ومليّنات براز، سوائل</text><text x="610" y="314" text-anchor="start" font-size="12.5" fill="#1e293b">وألياف، تغيير العادات</text>
</svg>
