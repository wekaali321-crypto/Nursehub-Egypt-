<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
  <rect width="640" height="330" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">زوايا الحقن وعمق الإبرة: جلدي وتحت الجلد وعضلي</text>
  <rect x="30" y="60" width="580" height="230" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/><rect x="30" y="150" width="580" height="28" rx="0" fill="#fecaca"/><rect x="30" y="178" width="580" height="50" rx="0" fill="#fde68a"/><rect x="30" y="228" width="580" height="62" rx="0" fill="#fca5a5"/><text x="590" y="168" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">البشرة والأدمة (Dermis)</text><text x="590" y="208" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">النسيج تحت الجلد (Subcutaneous)</text><text x="590" y="262" text-anchor="start" font-size="12" font-weight="500" fill="#1e293b">العضلة (Muscle)</text><line x1="120" y1="140" x2="210" y2="160" stroke="#0369a1" stroke-width="5" /><text x="165" y="120" text-anchor="middle" font-size="14" font-weight="800" fill="#0369a1">جلدي ID</text><text x="165" y="104" text-anchor="middle" font-size="12" font-weight="500" fill="#1e293b">زاوية 5–15° (فقاعة صغيرة)</text><line x1="250" y1="100" x2="310" y2="196" stroke="#b45309" stroke-width="5" /><line x1="300" y1="180" x2="300" y2="180" stroke="#475569" stroke-width="2" /><line x1="380" y1="100" x2="380" y2="196" stroke="#b45309" stroke-width="5" /><text x="300" y="86" text-anchor="middle" font-size="14" font-weight="800" fill="#b45309">تحت الجلد SC</text><text x="340" y="70" text-anchor="middle" font-size="12" font-weight="500" fill="#1e293b">زاوية 45° أو 90°</text><line x1="480" y1="100" x2="480" y2="258" stroke="#b91c1c" stroke-width="5" /><text x="480" y="86" text-anchor="middle" font-size="14" font-weight="800" fill="#b91c1c">عضلي IM</text><text x="480" y="70" text-anchor="middle" font-size="12" font-weight="500" fill="#1e293b">زاوية 90° + تقنية Z-track</text><text x="320" y="315" text-anchor="middle" font-size="12.5" font-weight="500" fill="#475569">جلدي: الساعد، 25–27G | تحت الجلد: 25–27G | عضلي: يختلف حسب الموضع والوزن</text>
