<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="Folic acid وBetamethasone قبل الولادة"><rect width="640" height="160" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">Folic acid وBetamethasone قبل الولادة</text><rect x="326.0" y="46" width="302.0" height="98" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="326.0" y="60" width="302.0" height="14" fill="#a86a00"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Folic acid</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• يمنع عيوب الأنبوب العصبي (السنسنة</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   المشقوقة Spina bifida)</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• يبدأ قبل الحمل ويستمر خلاله</text><rect x="12.0" y="46" width="302.0" height="98" rx="10" fill="#e0f5f3" stroke="#14756c" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#14756c"/><rect x="12.0" y="60" width="302.0" height="14" fill="#14756c"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">Betamethasone</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• يساعد نضج رئة الجنين الخديج</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• يزيد إنتاج surfactant فتتمدد الرئتان</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• تقييم الفعالية: نمط تنفس طبيعي للمولود</text></svg>