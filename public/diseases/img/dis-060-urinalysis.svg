<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 384" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="384" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تحليل البول: ماذا تعني كل نتيجة؟</text><rect x="411" y="50" width="213" height="32" fill="#d97706"/><text x="518" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">البند</text><rect x="16" y="50" width="395" height="32" fill="#d97706"/><text x="214" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الدلالة</text><rect x="411" y="82" width="213" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="102" text-anchor="end" font-size="13" fill="#0f172a">اللون</text><rect x="16" y="82" width="395" height="50" fill="#ffffff" stroke="#cbd5e1"/><text x="403" y="102" text-anchor="end" font-size="13" fill="#0f172a">فاتح = ترطيب جيد؛ داكن = جفاف أو بيليروبين أو دم (ما</text><text x="403" y="121" text-anchor="end" font-size="13" fill="#0f172a">لم يكن مدرّات أو SIADH أو DI)</text><rect x="411" y="132" width="213" height="31" fill="#fef3c7" stroke="#cbd5e1"/><text x="616" y="152" text-anchor="end" font-size="13" fill="#0f172a">الوزن النوعي 1.003–1.030</text><rect x="16" y="132" width="395" height="31" fill="#fef3c7" stroke="#cbd5e1"/><text x="403" y="152" text-anchor="end" font-size="13" fill="#0f172a">منخفض = سوائل زائدة؛ مرتفع = جفاف</text><rect x="411" y="163" width="213" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="183" text-anchor="end" font-size="13" fill="#0f172a">كرات حمراء RBC (بيلة دموية)</text><rect x="16" y="163" width="395" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="403" y="183" text-anchor="end" font-size="13" fill="#0f172a">حصوات كلى، سرطان مثانة، بعد عملية TURP</text><rect x="411" y="194" width="213" height="31" fill="#fef3c7" stroke="#cbd5e1"/><text x="616" y="214" text-anchor="end" font-size="13" fill="#0f172a">كرات بيضاء WBC</text><rect x="16" y="194" width="395" height="31" fill="#fef3c7" stroke="#cbd5e1"/><text x="403" y="214" text-anchor="end" font-size="13" fill="#0f172a">عدوى بولية UTI</text><rect x="411" y="225" width="213" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="245" text-anchor="end" font-size="13" fill="#0f172a">نيتريت Nitrite</text><rect x="16" y="225" width="395" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="403" y="245" text-anchor="end" font-size="13" fill="#0f172a">عدوى الكلى (التهاب الحويضة والكلية)</text><rect x="411" y="256" width="213" height="50" fill="#fef3c7" stroke="#cbd5e1"/><text x="616" y="276" text-anchor="end" font-size="13" fill="#0f172a">مزرعة وحساسية</text><rect x="16" y="256" width="395" height="50" fill="#fef3c7" stroke="#cbd5e1"/><text x="403" y="276" text-anchor="end" font-size="13" fill="#0f172a">المزرعة تحدد الجرثومة؛ الحساسية تحدد المضاد الحيوي</text><text x="403" y="295" text-anchor="end" font-size="13" fill="#0f172a">المناسب</text><rect x="411" y="306" width="213" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="326" text-anchor="end" font-size="13" fill="#0f172a">بروتين مرتفع</text><rect x="16" y="306" width="395" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="403" y="326" text-anchor="end" font-size="13" fill="#0f172a">المتلازمة الكلوية (فقد بروتين)</text><rect x="411" y="337" width="213" height="31" fill="#fef3c7" stroke="#cbd5e1"/><text x="616" y="357" text-anchor="end" font-size="13" fill="#0f172a">سكر مرتفع</text><rect x="16" y="337" width="395" height="31" fill="#fef3c7" stroke="#cbd5e1"/><text x="403" y="357" text-anchor="end" font-size="13" fill="#0f172a">السكري</text></svg>