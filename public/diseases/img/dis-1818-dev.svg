<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 344" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="344" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">معالم ما قبل المدرسة</text><rect x="326.0" y="50" width="294.0" height="133" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="326.0" y="50" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="473.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">جسدية</text><text x="610.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• يعي هويته الجنسية</text><text x="610.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• قد ينجذب لوالد الجنس الآخر</text><text x="610.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• علّمه الفرق بين اللمس الجيد والسيئ</text><text x="610.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• تعامل بهدوء مع الاستمناء</text><text x="610.0" y="164" font-size="12.5" fill="#0f172a" text-anchor="end">• علّمه السلامة وخصوصية الأعضاء</text><rect x="20.0" y="50" width="294.0" height="133" rx="10" fill="#fff" stroke="#be185d" stroke-width="2"/><rect x="20.0" y="50" width="294.0" height="28" rx="10" fill="#be185d"/><text x="167.0" y="20" dy="50" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">نفسية</text><text x="304.0" y="96" font-size="12.5" fill="#0f172a" text-anchor="end">• خيال وصديق وهمي</text><text x="304.0" y="113" font-size="12.5" fill="#0f172a" text-anchor="end">• تفكير سحري وخوف من الظلام وكوابيس</text><text x="304.0" y="130" font-size="12.5" fill="#0f172a" text-anchor="end">• نوبات غضب عمر 4: دفع وضرب</text><text x="304.0" y="147" font-size="12.5" fill="#0f172a" text-anchor="end">• الانضباط: علّم المسؤولية والضبط، وسحب</text><text x="304.0" y="164" font-size="12.5" fill="#0f172a" text-anchor="end">الشيء المفضل أفضل من الضرب</text><rect x="326.0" y="195" width="294.0" height="133" rx="10" fill="#fff" stroke="#ea580c" stroke-width="2"/><rect x="326.0" y="195" width="294.0" height="28" rx="10" fill="#ea580c"/><text x="473.0" y="20" dy="195" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">اجتماعية: أنواع اللعب</text><text x="610.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="end">• درامي: تمثيل مواقف</text><text x="610.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">• تعاوني: مجموعات منظمة</text><text x="610.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• مشارك: يلعبون معاً دون تنظيم</text><text x="610.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="end">• فردي: بعيداً عن المجموعات</text><rect x="20.0" y="195" width="294.0" height="133" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="20.0" y="195" width="294.0" height="28" rx="10" fill="#7c3aed"/><text x="167.0" y="20" dy="195" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">اللغة</text><text x="304.0" y="241" font-size="12.5" fill="#0f172a" text-anchor="end">• 3-4: لا يتواصل جيداً بالكلام</text><text x="304.0" y="258" font-size="12.5" fill="#0f172a" text-anchor="end">• 4: يتواصل</text><text x="304.0" y="275" font-size="12.5" fill="#0f172a" text-anchor="end">• 4-5: ألفاظ سيئة</text><text x="304.0" y="292" font-size="12.5" fill="#0f172a" text-anchor="end">• يتحاور بما يفهمه</text><text x="304.0" y="309" font-size="12.5" fill="#0f172a" text-anchor="end">• التأخر: ضعف سمع أو قلة تحفيز</text></svg>