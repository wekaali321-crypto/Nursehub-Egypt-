<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="262" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قراءة فحص DEXA (T-score)</text><rect x="326" y="52" width="284" height="76" rx="12" fill="#dcfce7" stroke="#166534" stroke-width="1.5"/><text x="468" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#166534">طبيعي</text><text x="468" y="102" text-anchor="middle" font-size="12.5" fill="#166534">⁦T-score &gt; −1⁩</text><rect x="30" y="52" width="284" height="76" rx="12" fill="#fef9c3" stroke="#854d0e" stroke-width="1.5"/><text x="172" y="80" text-anchor="middle" font-size="14.5" font-weight="800" fill="#854d0e">نقص كثافة العظم (Osteopenia)</text><text x="172" y="102" text-anchor="middle" font-size="12.5" fill="#854d0e">⁦T-score: −1 to −2.5⁩</text><rect x="326" y="140" width="284" height="76" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/><text x="468" y="168" text-anchor="middle" font-size="14.5" font-weight="800" fill="#991b1b">هشاشة عظام (Osteoporosis)</text><text x="468" y="190" text-anchor="middle" font-size="12.5" fill="#991b1b">⁦T-score ≤ −2.5⁩</text><rect x="30" y="140" width="284" height="76" rx="12" fill="#fee2e2" stroke="#991b1b" stroke-width="1.5"/><text x="172" y="168" text-anchor="middle" font-size="14.5" font-weight="800" fill="#991b1b">هشاشة شديدة</text><text x="172" y="190" text-anchor="middle" font-size="12.5" fill="#991b1b">⁦T-score ≤ −2.5⁩ + كسر هشاشي</text><text x="320" y="250" text-anchor="middle" font-size="12.5" fill="#475569">كسر هشاشي في الفقرات أو الحوض يؤكد التشخيص حتى لو الفحص ما أكّد</text></svg>