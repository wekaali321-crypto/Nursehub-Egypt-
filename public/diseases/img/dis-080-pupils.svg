<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">العين والإفرازات: مهيّج (غاز مسيل للدموع) مقابل سمّية كولينية</text>
<ellipse cx="480" cy="125" rx="70" ry="38" fill="#fff" stroke="#334155" stroke-width="3"/><circle cx="480" cy="125" r="28" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/><circle cx="480" cy="125" r="19" fill="#0f172a"/><ellipse cx="160" cy="125" rx="70" ry="38" fill="#fff" stroke="#334155" stroke-width="3"/><circle cx="160" cy="125" r="28" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/><circle cx="160" cy="125" r="7" fill="#0f172a"/><text x="480" y="190" text-anchor="middle" font-size="15" font-weight="800" fill="#b45309">حدقة متّسعة (حسب البروتوكول المتبع)</text><text x="480" y="212" text-anchor="middle" font-size="12.5" fill="#334155">دموع، حرقان، إغلاق الجفن، سعال</text><text x="480" y="232" text-anchor="middle" font-size="12.5" fill="#334155">مهيّج: لا يوجد ترياق → هواء نقي + غسيل</text><text x="160" y="190" text-anchor="middle" font-size="15" font-weight="800" fill="#b91c1c">حدقة ضيّقة (pinpoint) = خطر</text><text x="160" y="212" text-anchor="middle" font-size="12.5" fill="#334155">لعاب وإفرازات كتير، ضيق نفس، تشنج</text><text x="160" y="232" text-anchor="middle" font-size="12.5" fill="#334155">سمّية كولينية → أتروبين تحت إشراف الطبيب</text><text x="320" y="125" text-anchor="middle" font-size="26" fill="#64748b">≠</text><text x="320" y="280" text-anchor="middle" font-size="12.5" fill="#475569">أول خطوة دايماً: افحص حجم الحدقة والإفرازات قبل ما تختار العلاج</text></svg>
