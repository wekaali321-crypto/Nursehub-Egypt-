<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 251" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="251" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">نقص الأكسجة ومخاطر الأكسجين</text><rect x="426.66666666666663" y="54" width="193.33333333333334" height="182.2" rx="10" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-width="1.5"/><rect x="426.66666666666663" y="54" width="193.33333333333334" height="48" rx="10" fill="#f59e0b"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">علامات مبكرة (PaO₂ أقل من </text><text x="612" y="91" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">80)</text><text x="612" y="118" text-anchor="start" font-size="13" fill="#0f172a">• دماغ: تغير الحالة</text><text x="612" y="136.2" text-anchor="start" font-size="13" fill="#0f172a">العقلية، قلق/تهيّج، تشوش</text><text x="612" y="159.4" text-anchor="start" font-size="13" fill="#0f172a">• قياسات مرتفعة: تنفس أكثر من </text><text x="612" y="177.6" text-anchor="start" font-size="13" fill="#0f172a">20، نبض أكثر من 100، ضغط أكثر من 140</text><text x="612" y="200.8" text-anchor="start" font-size="13" fill="#0f172a">• وضعية: عضلات مساعدة،</text><text x="612" y="219" text-anchor="start" font-size="13" fill="#0f172a">تنفس متناقض، tripod</text><rect x="223.33333333333331" y="54" width="193.33333333333334" height="182.2" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="223.33333333333331" y="54" width="193.33333333333334" height="29" rx="10" fill="#ef4444"/><text x="408.66666666666663" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">علامات متأخرة</text><text x="408.66666666666663" y="99" text-anchor="start" font-size="13" fill="#0f172a">• قياسات منخفضة: بطء</text><text x="408.66666666666663" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">تنفس (أقل من 12)، بطء قلب (أقل من </text><text x="408.66666666666663" y="135.4" text-anchor="start" font-size="13" fill="#0f172a">60)، هبوط ضغط</text><text x="408.66666666666663" y="158.6" text-anchor="start" font-size="13" fill="#0f172a">• زرقة الجلد</text><text x="408.66666666666663" y="181.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">• اضطراب نظم بالتخطيط</text><rect x="20" y="54" width="193.33333333333334" height="182.2" rx="10" fill="#14b8a6" fill-opacity="0.1" stroke="#14b8a6" stroke-width="1.5"/><rect x="20" y="54" width="193.33333333333334" height="48" rx="10" fill="#14b8a6"/><text x="205.33333333333334" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">احتياطات الأكسجين (قابل</text><text x="205.33333333333334" y="91" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">للاشتعال)</text><text x="205.33333333333334" y="118" text-anchor="start" font-size="13" fill="#0f172a">• لا تدخين أو لهب</text><text x="205.33333333333334" y="141.2" text-anchor="start" font-size="13" fill="#0f172a">• كهرباء ساكنة: قطن فقط</text><text x="205.33333333333334" y="159.39999999999998" text-anchor="start" font-size="13" fill="#0f172a">(لا مواد صناعية/صوف)</text><text x="205.33333333333334" y="182.6" text-anchor="start" font-size="13" fill="#0f172a">• لا مواد قابلة</text><text x="205.33333333333334" y="200.79999999999998" text-anchor="start" font-size="13" fill="#0f172a">للاشتعال: كحول، أسيتون</text><text x="205.33333333333334" y="219" text-anchor="start" font-size="13" fill="#0f172a">(مزيل الطلاء)</text></svg>
