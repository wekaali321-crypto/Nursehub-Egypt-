<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="640" height="360" rx="16" fill="#f8fafc"/>
<text x="320.0" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">تحضير الدوبامين وحساب المعدل (مريض 70 كجم)</text>
<rect x="30" y="48" width="280" height="70" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="170.0" y="70.33333333333333" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">التحضير</text>
<text x="170.0" y="86.83333333333333" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">أمبولان (200 مجم/5 مل لكل واحد) = 400 مجم</text>
<text x="170.0" y="103.33333333333333" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">في 400 مل ملح ⟵ التركيز 1 مجم/مل = 1000 مكجم/مل</text>
<rect x="330" y="48" width="280" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="470.0" y="70.33333333333333" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">القاعدة</text>
<text x="470.0" y="86.83333333333333" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">المعدل مكجم/د = الوزن × الجرعة</text>
<text x="470.0" y="103.33333333333333" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">مل/د = المعدل ÷ التركيز</text>
<text x="580" y="150" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0f172a">الجرعة</text>
<text x="470" y="150" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0f172a">المعدل</text>
<text x="350" y="150" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0f172a">نقط/د (15 نقطة/مل)</text>
<text x="225" y="150" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0f172a">مل/ساعة</text>
<text x="100" y="150" text-anchor="middle" font-size="11.5" font-weight="800" fill="#0f172a">التأثير</text>
<line x1="30" y1="158" x2="610" y2="158" stroke="#94a3b8" stroke-width="1.5"/>
<text x="580" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">3–5 مكجم/كجم/د</text>
<text x="470" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">210–350 مكجم/د</text>
<text x="350" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">~3–5 نقطة/د</text>
<text x="225" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">~13–21 مل/س</text>
<text x="100" y="182" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">تأثير مدر خفيف*</text>
<text x="580" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">5–10 مكجم/كجم/د</text>
<text x="470" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">350–700 مكجم/د</text>
<text x="350" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">~5–10 نقطة/د</text>
<text x="225" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">~21–42 مل/س</text>
<text x="100" y="214" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">مقوٍّ للقلب (Inotrope)</text>
<text x="580" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">10–15 مكجم/كجم/د</text>
<text x="470" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">700–1050 مكجم/د</text>
<text x="350" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">~10–15 نقطة/د</text>
<text x="225" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">~42–63 مل/س</text>
<text x="100" y="246" text-anchor="middle" font-size="11" font-weight="600" fill="#0f172a">قابض للأوعية</text>
<text x="320" y="298" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">ابدأ بجرعة صغيرة وارفع تدريجياً حتى الضغط المطلوب (بأمر الطبيب)</text>
<text x="320" y="320" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b45309">*تأثير «الجرعة الكلوية» غير مثبت بالأدلة الحديثة • المضخة أدق من النقط</text>
<text x="320" y="342" text-anchor="middle" font-size="11.5" font-weight="600" fill="#b91c1c">الآثار: تسرع قلب واضطراب نظم • تعوّد بعد 3 أيام • دخول CCU</text></svg>