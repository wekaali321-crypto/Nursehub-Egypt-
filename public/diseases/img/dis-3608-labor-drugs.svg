<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 273" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="273" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">أدوية الولادة والحمل: مقارنة سريعة</text><rect x="326.0" y="48" width="294.0" height="96.5" rx="10" fill="#fff" stroke="#0e7490" stroke-width="2"/><rect x="326.0" y="48" width="294.0" height="28" rx="10" fill="#0e7490"/><text x="473.0" y="67" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">terbutaline</text><text x="610.0" y="96.5" text-anchor="start" font-size="12.5" fill="#0f172a">• ينشّط مستقبلات بيتا 2 فيؤخر الولادة</text><text x="610.0" y="114.0" text-anchor="start" font-size="12.5" fill="#0f172a">لحظيًا</text><text x="610.0" y="131.5" text-anchor="start" font-size="12.5" fill="#0f172a">• حتى 48 ساعة لتثبيط الولادة المبكرة</text><rect x="20.0" y="48" width="294.0" height="96.5" rx="10" fill="#fff" stroke="#b45309" stroke-width="2"/><rect x="20.0" y="48" width="294.0" height="28" rx="10" fill="#b45309"/><text x="167.0" y="67" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">oxytocin</text><text x="304.0" y="96.5" text-anchor="start" font-size="12.5" fill="#0f172a">• يحرّض الولادة وينشّط التقلصات</text><rect x="326.0" y="156.5" width="294.0" height="96.5" rx="10" fill="#fff" stroke="#15803d" stroke-width="2"/><rect x="326.0" y="156.5" width="294.0" height="28" rx="10" fill="#15803d"/><text x="473.0" y="175.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">folic acid</text><text x="610.0" y="205.0" text-anchor="start" font-size="12.5" fill="#0f172a">• يمنع عيوب الأنبوب العصبي (السنسنة</text><text x="610.0" y="222.5" text-anchor="start" font-size="12.5" fill="#0f172a">المشقوقة)</text><text x="610.0" y="240.0" text-anchor="start" font-size="12.5" fill="#0f172a">• يبدأ قبل الحمل</text><rect x="20.0" y="156.5" width="294.0" height="96.5" rx="10" fill="#fff" stroke="#1e3a8a" stroke-width="2"/><rect x="20.0" y="156.5" width="294.0" height="28" rx="10" fill="#1e3a8a"/><text x="167.0" y="175.5" text-anchor="middle" font-size="13.5" font-weight="800" fill="#fff">betamethasone</text><text x="304.0" y="205.0" text-anchor="start" font-size="12.5" fill="#0f172a">• ينضج رئة الجنين بزيادة surfactant</text><text x="304.0" y="222.5" text-anchor="start" font-size="12.5" fill="#0f172a">• التقييم: تنفس طبيعي للمولود</text></svg>