<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="300" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الارتجاع المثانوي الحالبي (VUR)</text><defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#475569"/></marker></defs><rect x="430" y="50" width="190" height="90" rx="10" fill="#6366f1"/><text x="525.0" y="80.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الآلية</text><text x="525.0" y="97.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">رجوع البول من المثانة للحالب والكلية</text><text x="525.0" y="114.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">غالبًا بسبب صمام معيب</text><rect x="225" y="50" width="190" height="90" rx="10" fill="#ef4444"/><text x="320.0" y="80.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المضاعفات</text><text x="320.0" y="97.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">التهابات بولية وكلوية متكررة</text><text x="320.0" y="114.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">استسقاء الكلية (Hydronephrosis)</text><rect x="20" y="50" width="190" height="90" rx="10" fill="#16a34a"/><text x="115.0" y="80.5" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الجراحة</text><text x="115.0" y="97.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">بعد الجراحة: أنبوب حالب</text><text x="115.0" y="114.5" text-anchor="middle" font-size="11" font-weight="500" fill="#fff">لا بول = أولوية وأبلغ فورًا</text><line x1="425" y1="95" x2="415" y2="95" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/><line x1="220" y1="95" x2="210" y2="95" stroke="#475569" stroke-width="2.5" marker-end="url(#ah)"/><rect x="20" y="155" width="600" height="100" rx="10" fill="#0ea5e9"/><text x="320.0" y="190.0" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">معنى الاسم</text><text x="320.0" y="208.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Vesico = مثانة · Ureteral = حالب · Reflux = رجوع</text><text x="320.0" y="226.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">سؤال اختبار: الارتجاع المثانوي الحالبي يرتبط بالتهابات الكلى المتكررة</text></svg>