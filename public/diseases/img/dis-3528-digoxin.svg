<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="420" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">digoxin والأدوية المقوية للقلب</text><rect x="330" y="45" width="295" height="110" rx="10" fill="#dbeafe"/><text x="477.5" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">الآلية</text><text x="477.5" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تزيد النتاج القلبي (انقباض أقوى)</text><text x="477.5" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تبطئ التوصيل في العقدة AV</text><text x="477.5" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تقلل المعدل (سلبي زمنيًا)</text><rect x="15" y="45" width="305" height="110" rx="10" fill="#dcfce7"/><text x="167.5" y="78" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">الاستعمال</text><text x="167.5" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">فشل القلب</text><text x="167.5" y="114" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">الرجفان الأذيني</text><text x="167.5" y="132" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">milrinone: فشل قلب شديد قصير المدى</text><rect x="15" y="175" width="610" height="70" rx="10" fill="#fee2e2"/><text x="320" y="206" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">مستوى digoxin العلاجي: 0.8–2 نانوجرام/مل | أعلى من 2 = سام: بلّغ</text><text x="320" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">سحب العينة قبل الجرعة التالية أو بعد 6–8 ساعات من آخر جرعة | نقص K+ يزيد الحساسية</text><rect x="15" y="260" width="300" height="70" rx="10" fill="#fef9c3"/><text x="165" y="291" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">أطفال: احبس الجرعة إذا النبض القمّي</text><text x="165" y="309" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">أقل من 70 (طفل) أو أقل من 90 (رضيع)</text><rect x="330" y="260" width="295" height="70" rx="10" fill="#ffedd5"/><text x="477.5" y="282" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">أعراض: صداع، ضعف، نعاس</text><text x="477.5" y="300" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">هالات صفراء/زغللة، اضطراب نظم</text><text x="477.5" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">غثيان وفقدان شهية</text><text x="320" y="365" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">الجرعات: راجع الطبيب والصيدلي والنشرة (للتعلّم فقط)</text></svg>