<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 222" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="222" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مستوى الإصابة وما يتأثر به</text><rect x="465" y="50" width="159" height="32" fill="#2563eb"/><text x="545" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">المستوى</text><rect x="360" y="50" width="106" height="32" fill="#2563eb"/><text x="413" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">العدد</text><rect x="16" y="50" width="344" height="32" fill="#2563eb"/><text x="188" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">التأثير</text><rect x="465" y="82" width="159" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="102" text-anchor="end" font-size="13" fill="#0f172a">رقبي Cervical</text><rect x="360" y="82" width="106" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="457" y="102" text-anchor="end" font-size="13" fill="#0f172a">7 فقرات</text><rect x="16" y="82" width="344" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="352" y="102" text-anchor="end" font-size="13" fill="#0f172a">شلل رباعي (4 أطراف) وتنفس مختل وخطر على الحياة</text><rect x="465" y="113" width="159" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="616" y="133" text-anchor="end" font-size="13" fill="#0f172a">صدري Thoracic</text><rect x="360" y="113" width="106" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="457" y="133" text-anchor="end" font-size="13" fill="#0f172a">12 فقرة</text><rect x="16" y="113" width="344" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="352" y="133" text-anchor="end" font-size="13" fill="#0f172a">شلل نصفي سفلي: الساقان والجذع وأعضاء الحوض</text><rect x="465" y="144" width="159" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="616" y="164" text-anchor="end" font-size="13" fill="#0f172a">قطني Lumbar</text><rect x="360" y="144" width="106" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="457" y="164" text-anchor="end" font-size="13" fill="#0f172a">5 فقرات</text><rect x="16" y="144" width="344" height="31" fill="#ffffff" stroke="#cbd5e1"/><text x="352" y="164" text-anchor="end" font-size="13" fill="#0f172a">ضعف الساقين وسلس أو احتباس المثانة</text><rect x="465" y="175" width="159" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="616" y="195" text-anchor="end" font-size="13" fill="#0f172a">عجزي وعصعصي</text><rect x="360" y="175" width="106" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="457" y="195" text-anchor="end" font-size="13" fill="#0f172a">5 + 4</text><rect x="16" y="175" width="344" height="31" fill="#dbeafe" stroke="#cbd5e1"/><text x="352" y="195" text-anchor="end" font-size="13" fill="#0f172a">تحكم المثانة والأمعاء والوظيفة الجنسية</text></svg>