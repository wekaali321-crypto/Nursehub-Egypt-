<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 548" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="548" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">خطوات تجهيز الأدوات المعقمة ولبس القفازات</text>
<rect x="40" y="48" width="560" height="52" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><circle cx="575" cy="74" r="14" fill="#0ea5e9"/><text x="575" y="79" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">1</text><text x="550" y="70" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">تحقق</text><text x="550" y="89" text-anchor="start" font-size="12" font-weight="500" fill="#334155">تاريخ الصلاحية وغسل اليدين</text><text x="320" y="114" text-anchor="middle" font-size="16" fill="#64748b">↓</text><rect x="40" y="120" width="560" height="52" rx="12" fill="#fff" stroke="#22c55e" stroke-width="2"/><circle cx="575" cy="146" r="14" fill="#22c55e"/><text x="575" y="151" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2</text><text x="550" y="142" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">افتح الطقم</text><text x="550" y="161" text-anchor="start" font-size="12" font-weight="500" fill="#334155">بعيداً عنك ولا تلمس الداخل، الحافة 2.5 سم غير معقمة</text><text x="320" y="186" text-anchor="middle" font-size="16" fill="#64748b">↓</text><rect x="40" y="192" width="560" height="52" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/><circle cx="575" cy="218" r="14" fill="#f59e0b"/><text x="575" y="223" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">3</text><text x="550" y="214" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">جهّز القفازات</text><text x="550" y="233" text-anchor="start" font-size="12" font-weight="500" fill="#334155">ضعها بجوار الطقم على سطح نظيف جاف</text><text x="320" y="258" text-anchor="middle" font-size="16" fill="#64748b">↓</text><rect x="40" y="264" width="560" height="52" rx="12" fill="#fff" stroke="#ef4444" stroke-width="2"/><circle cx="575" cy="290" r="14" fill="#ef4444"/><text x="575" y="295" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">4</text><text x="550" y="286" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">اغسل يديك مجدداً</text><text x="550" y="305" text-anchor="start" font-size="12" font-weight="500" fill="#334155">وجفّفهما بمنديل نظيف</text><text x="320" y="330" text-anchor="middle" font-size="16" fill="#64748b">↓</text><rect x="40" y="336" width="560" height="52" rx="12" fill="#fff" stroke="#8b5cf6" stroke-width="2"/><circle cx="575" cy="362" r="14" fill="#8b5cf6"/><text x="575" y="367" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">5</text><text x="550" y="358" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">البس القفاز الأول</text><text x="550" y="377" text-anchor="start" font-size="12" font-weight="500" fill="#334155">أمسكه من الثنية عند المعصم</text><text x="320" y="402" text-anchor="middle" font-size="16" fill="#64748b">↓</text><rect x="40" y="408" width="560" height="52" rx="12" fill="#fff" stroke="#14b8a6" stroke-width="2"/><circle cx="575" cy="434" r="14" fill="#14b8a6"/><text x="575" y="439" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">6</text><text x="550" y="430" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">البس الثاني</text><text x="550" y="449" text-anchor="start" font-size="12" font-weight="500" fill="#334155">بإدخال الأصابع المقفّزة تحت ثنية القفاز</text><text x="320" y="474" text-anchor="middle" font-size="16" fill="#64748b">↓</text><rect x="40" y="480" width="560" height="52" rx="12" fill="#fff" stroke="#ec4899" stroke-width="2"/><circle cx="575" cy="506" r="14" fill="#ec4899"/><text x="575" y="511" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">7</text><text x="550" y="502" text-anchor="start" font-size="14" font-weight="800" fill="#0f172a">لا تلمس غير المعقم</text><text x="550" y="521" text-anchor="start" font-size="12" font-weight="500" fill="#334155">وإلا غيّر القفازات</text>
</svg>
