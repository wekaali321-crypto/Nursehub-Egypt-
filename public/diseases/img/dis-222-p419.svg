<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 256" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="256" rx="16" fill="#f8fafc"/><text x="320" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">السيلان: نقاط الامتحان</text><rect x="325" y="54" width="295" height="103.6" rx="10" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1.5"/><rect x="325" y="54" width="295" height="29" rx="10" fill="#ef4444"/><text x="612" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">نقطة أساسية</text><text x="612" y="99" text-anchor="start" font-size="13" fill="#0f172a">• عدوى الكلاميديا والسيلان غير</text><text x="612" y="117.2" text-anchor="start" font-size="13" fill="#0f172a">المعالجة تؤدي إلى العقم وPID</text><text x="612" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">• فحص سنوي</text><rect x="20" y="54" width="295" height="103.6" rx="10" fill="#10b981" fill-opacity="0.1" stroke="#10b981" stroke-width="1.5"/><rect x="20" y="54" width="295" height="29" rx="10" fill="#10b981"/><text x="307" y="72" text-anchor="start" font-size="13.5" font-weight="800" fill="#fff">التثقيف</text><text x="307" y="99" text-anchor="start" font-size="13" fill="#0f172a">• يجب تقييم الشريك وعلاجه</text><text x="307" y="122.2" text-anchor="start" font-size="13" fill="#0f172a">• تجنب كل أنواع الجماع حتى انتهاء</text><text x="307" y="140.4" text-anchor="start" font-size="13" fill="#0f172a">العلاج</text><rect x="20" y="167.6" width="600" height="74" rx="10" fill="#f59e0b" fill-opacity="0.13" stroke="#f59e0b" stroke-width="1.5"/><text x="610" y="187.6" text-anchor="start" font-size="13.5" font-weight="800" fill="#f59e0b">سؤال امتحان</text><text x="610" y="207.6" text-anchor="start" font-size="13" fill="#0f172a">عبارة تدل على الحاجة لمزيد من التثقيف: «لو الشريك مصاب بالسيلان فسأتجنب</text><text x="610" y="226.6" text-anchor="start" font-size="13" fill="#0f172a">الجماع المهبلي لكن الفموي آمن». الفموي غير آمن.</text></svg>
