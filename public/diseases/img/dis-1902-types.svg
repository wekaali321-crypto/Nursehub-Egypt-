<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="280" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">عيوب القلب الخلقية: مصنفة حسب مسار الدم</text><rect x="20" y="46" width="600" height="30" rx="8" fill="#1e3a8a"/><text x="565.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">النوع</text><text x="435.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الأمثلة</text><text x="260.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">المشكلة الأساسية</text><text x="90.0" y="66" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">أهم علامة</text><rect x="20" y="76" width="600" height="48" fill="#e0e7ff"/><text x="565.0" y="96" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">يمين لشمال</text><text x="565.0" y="114" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">(زرقة)</text><text x="435.0" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">TOF، TGA، Tricuspid</text><text x="435.0" y="114" text-anchor="middle" font-size="12.5"  fill="#0f172a">atresia، Truncus</text><text x="260.0" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">تحويل الدم بعيدًا عن الرئة</text><text x="260.0" y="114" text-anchor="middle" font-size="12.5"  fill="#0f172a">فيقل الأكسجين</text><text x="90.0" y="96" text-anchor="middle" font-size="12.5"  fill="#0f172a">زرقة ونقص أكسجين</text><rect x="20" y="124" width="600" height="48" fill="#fff"/><text x="565.0" y="144" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">شمال ليمين (فشل</text><text x="565.0" y="162" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">قلب)</text><text x="435.0" y="144" text-anchor="middle" font-size="12.5"  fill="#0f172a">ASD، VSD، PDA، AVSD</text><text x="260.0" y="144" text-anchor="middle" font-size="12.5"  fill="#0f172a">زيادة تدفق الدم للرئتين</text><text x="90.0" y="144" text-anchor="middle" font-size="12.5"  fill="#0f172a">تعرق أثناء الرضاعة،</text><text x="90.0" y="162" text-anchor="middle" font-size="12.5"  fill="#0f172a">نفخة، قلة وزن</text><rect x="20" y="172" width="600" height="66" fill="#e0e7ff"/><text x="565.0" y="192" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">تضيق (انسداد)</text><text x="435.0" y="192" text-anchor="middle" font-size="12.5"  fill="#0f172a">تضيق رئوي، تضيق أورطي،</text><text x="435.0" y="210" text-anchor="middle" font-size="12.5"  fill="#0f172a">تضيق برزخ الأورطي</text><text x="260.0" y="192" text-anchor="middle" font-size="12.5"  fill="#0f172a">انسداد خروج الدم، انخفاض</text><text x="260.0" y="210" text-anchor="middle" font-size="12.5"  fill="#0f172a">الناتج القلبي</text><text x="90.0" y="192" text-anchor="middle" font-size="12.5"  fill="#0f172a">عدم تحمل مجهود،</text><text x="90.0" y="210" text-anchor="middle" font-size="12.5"  fill="#0f172a">ضغط/نبض مختلف بين</text><text x="90.0" y="228" text-anchor="middle" font-size="12.5"  fill="#0f172a">الأطراف</text><text x="320" y="260" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">القاعدة: عيوب T = Trouble = أولوية نقص أكسجين</text>
</svg>
