<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 226" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="226" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الصعود والنزول بالعكاز: الجيدة لأعلى والمصابة لأسفل</text>
<rect x="333.0" y="48" width="287.0" height="120" rx="10" fill="#0f766e"/>
<text x="476.5" y="83.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">صعود</text>
<text x="476.5" y="102.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">الساق السليمة أولًا</text>
<text x="476.5" y="121.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ثم العكاز/العصا</text>
<text x="476.5" y="140.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ثم الساق المصابة</text>
<line x1="333.0" y1="108.0" x2="307.0" y2="108.0" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
<polygon points="307.0,108.0 315.1,104.1 315.1,111.9" fill="#475569"/>
<rect x="20.0" y="48" width="287.0" height="120" rx="10" fill="#0369a1"/>
<text x="163.5" y="83.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">نزول</text>
<text x="163.5" y="102.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">العكاز/العصا أولًا</text>
