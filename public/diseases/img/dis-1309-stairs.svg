<text x="163.5" y="140.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ثم الساق السليمة</text>
<text x="320" y="218" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">السليمة تصعد أولًا والمصابة تنزل أولًا</text>
