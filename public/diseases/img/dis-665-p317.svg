<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 395" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="640" height="395" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الأنيميا: نظرة عامة على الأسباب والأولويات</text><rect x="330" y="52" width="300" height="129.0" rx="10" fill="#fff" stroke="#dc2626" stroke-width="1.5"/><path d="M330,62 a10,10 0 0 1 10,-10 h280 a10,10 0 0 1 10,10 v18 h-300 z" fill="#dc2626"/><text x="480.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">ما هي؟</text><text x="620" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• نقص كرات الدم الحمراء فينقص الأكسجين</text><text x="620" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  للأنسجة</text><text x="620" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• تعب وإجهاد وشحوب وضيق نفس ودوخة</text><text x="620" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• الأكثر اختبارًا: نقص الحديد، المنجلية،</text><text x="620" y="164.60000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  الخبيثة</text><rect x="10" y="52" width="310" height="111.6" rx="10" fill="#fff" stroke="#0891b2" stroke-width="1.5"/><path d="M10,62 a10,10 0 0 1 10,-10 h290 a10,10 0 0 1 10,10 v18 h-310 z" fill="#0891b2"/><text x="165.0" y="71" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">الأسباب</text><text x="310" y="95" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• فقد دم: جراحة، إصابة، حيض غزير</text><text x="310" y="112.4" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• العلاج الكيماوي والكابتات للمناعة (تثبّط</text><text x="310" y="129.8" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">  النخاع)</text><text x="310" y="147.20000000000002" text-anchor="start" font-size="12" font-weight="600" fill="#0f172a">• نقص مواد البناء: حديد وB12</text><rect x="60" y="189.0" width="500" height="28.849999999999998" rx="0" fill="#0369a1" stroke="#cbd5e1" stroke-width="1"/><text x="450.0" y="208.95" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">الهيموجلوبين</text><line x1="340" y1="189.0" x2="340" y2="217.85" stroke="#cbd5e1" stroke-width="1"/><text x="200.0" y="208.95" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">الدلالة</text><rect x="60" y="217.85" width="500" height="28.849999999999998" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="450.0" y="237.79999999999998" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">12 فأكثر</text><line x1="340" y1="217.85" x2="340" y2="246.7" stroke="#cbd5e1" stroke-width="1"/><text x="200.0" y="237.79999999999998" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">طبيعي</text><rect x="60" y="246.7" width="500" height="28.849999999999998" rx="0" fill="#fff" stroke="#cbd5e1" stroke-width="1"/><text x="450.0" y="266.65" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">8 – 9 (أو 8 – 11)</text><line x1="340" y1="246.7" x2="340" y2="275.55" stroke="#cbd5e1" stroke-width="1"/><text x="200.0" y="266.65" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">خطر ويُبلَّغ الطبيب</text><rect x="60" y="275.55" width="500" height="28.849999999999998" rx="0" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><text x="450.0" y="295.5" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">أقل من 7</text><line x1="340" y1="275.55" x2="340" y2="304.40000000000003" stroke="#cbd5e1" stroke-width="1"/><text x="200.0" y="295.5" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">حالة حرجة: يحتاج نقل دم</text><rect x="10" y="316.40000000000003" width="620" height="53.5" rx="10" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/><text x="320" y="336.15000000000003" text-anchor="middle" font-size="12.5" font-weight="600" fill="#713f12">نقطة اختبار: أي هيموجلوبين أقل من 7 يعني تدخلًا عاجلًا، وإن كان قبل جراحة فأبلغ</text><text x="320" y="354.90000000000003" text-anchor="middle" font-size="12.5" font-weight="600" fill="#713f12">الطبيب والجراح عند 8 – 11.</text></svg>