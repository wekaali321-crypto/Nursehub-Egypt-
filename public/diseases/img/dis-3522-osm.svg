<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="640" height="320" rx="16" fill="#f8fafc"/><text x="320" y="28" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">المدر الأسموزي: mannitol</text><rect x="330" y="45" width="295" height="100" rx="10" fill="#dbeafe"/><text x="477.5" y="82" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">الآلية</text><text x="477.5" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">يرفع كثافة الراشح الكبيبي</text><text x="477.5" y="118" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">يمنع إعادة امتصاص الماء فيخرج مع البول</text><rect x="15" y="45" width="305" height="100" rx="10" fill="#dcfce7"/><text x="167.5" y="73" text-anchor="middle" font-size="12" font-weight="800" fill="#0f172a">الاستعمال</text><text x="167.5" y="91" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">فشل كلوي حاد قليل البول</text><text x="167.5" y="109" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">وذمة، ضغط الجمجمة أو العين</text><text x="167.5" y="127" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">تسمم زائد، غسل المثانة (2.5–5%)</text><rect x="15" y="165" width="610" height="60" rx="10" fill="#fef9c3"/><text x="320" y="200" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">الجرعة الإرشادية: 50–100 جم كمحلول 5–25% وريديًا (Osmitrol)</text><rect x="15" y="240" width="610" height="60" rx="10" fill="#fee2e2"/><text x="320" y="275" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">ممنوع: نزيف دماغي نشط، جفاف، انقطاع بول، وذمة رئوية شديدة</text></svg>