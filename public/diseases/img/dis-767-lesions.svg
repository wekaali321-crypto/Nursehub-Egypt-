<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 398" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="398" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">مصطلحات الآفات الجلدية</text><rect x="12" y="44" width="616" height="30" rx="8" fill="#0f172a"/><text x="538.1666666666666" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">المصطلح</text><text x="320" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">الوصف</text><text x="101.83333333333329" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">مثال</text><rect x="12" y="74" width="616" height="28" fill="#fff"/><text x="538.1666666666666" y="92" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">بقعة (Macule)</text><text x="320" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">مسطحة أقل من 1 سم</text><text x="101.83333333333329" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">نمش، بقعة ملونة</text><rect x="12" y="102" width="616" height="28" fill="#f1f5f9"/><text x="538.1666666666666" y="120" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">حطاطة (Papule)</text><text x="320" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">مرتفعة أقل من 1 سم</text><text x="101.83333333333329" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">حبوب صلبة</text><rect x="12" y="130" width="616" height="28" fill="#fff"/><text x="538.1666666666666" y="148" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">لويحة (Plaque)</text><text x="320" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">مرتفعة مسطحة أكبر من 1 سم</text><text x="101.83333333333329" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">الصدفية</text><rect x="12" y="158" width="616" height="28" fill="#f1f5f9"/><text x="538.1666666666666" y="176" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">عقيدة (Nodule)</text><text x="320" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">صلبة بعمق حتى 1 سم</text><text x="101.83333333333329" y="176" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">كيس صغير</text><rect x="12" y="186" width="616" height="28" fill="#fff"/><text x="538.1666666666666" y="204" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">ورم (Tumor)</text><text x="320" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">صلبة أكبر من 1 سم بعمق</text><text x="101.83333333333329" y="204" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">كتل</text><rect x="12" y="214" width="616" height="28" fill="#f1f5f9"/><text x="538.1666666666666" y="232" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">بثرة (Pustule)</text><text x="320" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">مرتفعة بها صديد</text><text x="101.83333333333329" y="232" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">حب الشباب</text><rect x="12" y="242" width="616" height="28" fill="#fff"/><text x="538.1666666666666" y="260" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">حويصلة (Vesicle)</text><text x="320" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">فقاعة سوائل أقل من 1 سم</text><text x="101.83333333333329" y="260" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">الحزام الناري</text><rect x="12" y="270" width="616" height="28" fill="#f1f5f9"/><text x="538.1666666666666" y="288" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">فقاعة (Bulla)</text><text x="320" y="288" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">فقاعة سوائل أكبر من 1 سم</text><text x="101.83333333333329" y="288" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">حروق، فقاعات</text><rect x="12" y="298" width="616" height="28" fill="#fff"/><text x="538.1666666666666" y="316" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">وحمة/شرى (Wheal)</text><text x="320" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">منطقة بارزة مؤقتة</text><text x="101.83333333333329" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">الأرتيكاريا</text><rect x="12" y="326" width="616" height="28" fill="#f1f5f9"/><text x="538.1666666666666" y="344" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">نمشات دموية (Petechiae)</text><text x="320" y="344" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">نقط دم أقل من 1 سم</text><text x="101.83333333333329" y="344" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">نقص صفائح</text><rect x="12" y="354" width="616" height="28" fill="#fff"/><text x="538.1666666666666" y="372" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">فرفرية (Purpura)</text><text x="320" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">نمشة دموية كبيرة</text><text x="101.83333333333329" y="372" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">نزف تحت الجلد</text></svg>