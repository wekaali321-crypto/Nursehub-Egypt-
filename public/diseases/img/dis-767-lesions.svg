<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="300" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">مصطلحات الآفات الجلدية</text>
<rect x="20.0" y="48" width="142.5" height="110" rx="10" fill="#7c3aed"/>
<text x="91.25" y="88.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">بقعة (Macule)</text>
<text x="91.25" y="107.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">مسطحة أقل من 1 سم</text>
<text x="91.25" y="126.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">نمش، وشم</text>
<rect x="172.5" y="48" width="142.5" height="110" rx="10" fill="#b91c1c"/>
<text x="243.75" y="69.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">حطاطة (Papule)</text>
<text x="243.75" y="88.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">مرتفعة حمراء نحو 1</text>
<text x="243.75" y="107.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">سم</text>
<text x="243.75" y="126.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">حب شباب، ثؤلول،</text>
<text x="243.75" y="145.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">لدغة</text>
<rect x="325.0" y="48" width="142.5" height="110" rx="10" fill="#0369a1"/>
<text x="396.25" y="78.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">عقيدة (Nodule)</text>
<text x="396.25" y="97.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">كتلة تحت الجلد 1</text>
<text x="396.25" y="116.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">سم فأكثر</text>
<text x="396.25" y="135.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">عقد الروماتويد</text>
<rect x="477.5" y="48" width="142.5" height="110" rx="10" fill="#ca8a04"/>
<text x="548.75" y="78.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">لويحة (Plaque)</text>
<text x="548.75" y="97.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">نمو سريع للخلايا</text>
<text x="548.75" y="116.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">ببقع</text>
<text x="548.75" y="135.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">صدفية وأكزيما</text>
<rect x="20.0" y="168" width="142.5" height="110" rx="10" fill="#0f766e"/>
<text x="91.25" y="198.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">شرى (Urticaria /</text>
<text x="91.25" y="217.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">Wheal)</text>
<text x="91.25" y="236.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">انتفاخ وردي زائل</text>
<text x="91.25" y="255.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">دقائق إلى 24 ساعة</text>
<rect x="172.5" y="168" width="142.5" height="110" rx="10" fill="#334155"/>
<text x="243.75" y="198.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">حويصلة (Vesicle)</text>
<text x="243.75" y="217.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">فقاعة صغيرة مملوءة</text>
<text x="243.75" y="236.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">بسائل</text>
<text x="243.75" y="255.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">حروق</text>
<rect x="325.0" y="168" width="142.5" height="110" rx="10" fill="#92400e"/>
<text x="396.25" y="208.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">خال (Nevus)</text>
<text x="396.25" y="227.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">قد يكون خبيثًا لو</text>
<text x="396.25" y="246.0" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">غير منتظم</text>
<rect x="477.5" y="168" width="142.5" height="110" rx="10" fill="#be185d"/>
<text x="548.75" y="217.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">ورم (Neoplasm)</text>
<text x="548.75" y="236.5" text-anchor="middle" font-size="12" font-weight="500" fill="#fff">حميد أو خبيث</text>
</svg>
