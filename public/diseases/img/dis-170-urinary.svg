<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
  <rect width="640" height="380" rx="16" fill="#f8fafc"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الجهاز البولي: مين بيتحكم في التبول؟</text>
  <g transform="translate(105,0)">
  <ellipse cx="270" cy="85" rx="26" ry="38" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <ellipse cx="370" cy="85" rx="26" ry="38" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <path d="M278 122 C285 170 300 200 308 232" fill="none" stroke="#f59e0b" stroke-width="5"/>
  <path d="M362 122 C355 170 340 200 332 232" fill="none" stroke="#f59e0b" stroke-width="5"/>
  <path d="M290 232 Q320 220 350 232 Q362 275 320 292 Q278 275 290 232Z" fill="#bae6fd" stroke="#0369a1" stroke-width="2.5"/>
  <text x="320" y="262" text-anchor="middle" font-size="13" font-weight="700" fill="#0c4a6e">المثانة</text>
  <rect x="308" y="292" width="24" height="12" rx="5" fill="#16a34a"/>
  <path d="M320 304 L320 345" stroke="#f59e0b" stroke-width="6"/>
  </g>
  <g font-size="13" fill="#0f172a" text-anchor="middle">
    <text x="150" y="80" font-weight="700">الكليتين: بتصنّع البول</text>
    <line x1="270" y1="85" x2="370" y2="85" stroke="#94a3b8"/>
    <text x="150" y="180" font-weight="700">الحالب: بينقل البول للمثانة</text>
    <line x1="270" y1="185" x2="395" y2="185" stroke="#94a3b8"/>
    <text x="150" y="250" font-weight="700">عضلة المثانة (Detrusor)</text>
    <text x="150" y="268">بتتقلص وقت التفريغ</text>
    <line x1="270" y1="255" x2="400" y2="255" stroke="#94a3b8"/>
    <text x="150" y="305" font-weight="700">العاصرة (Sphincter)</text>
    <text x="150" y="323">بتفضل مقفولة لحد وقت التبول</text>
    <line x1="270" y1="298" x2="410" y2="298" stroke="#94a3b8"/>
    <text x="150" y="352" font-weight="700">الإحليل (Urethra)</text>
    <line x1="270" y1="347" x2="420" y2="347" stroke="#94a3b8"/>
  </g>
  <g font-size="12.5" fill="#475569" text-anchor="middle">
    <text x="565" y="120">المخ والنخاع</text><text x="565" y="138">والأعصاب بتستقبل</text><text x="565" y="156">إشارة «المثانة امتلت»</text><text x="565" y="174">وتقرر وقت التبول.</text>
    <text x="565" y="215" fill="#b45309" font-weight="700">لما التنسيق ده</text><text x="565" y="233" fill="#b45309" font-weight="700">يتأخر في النضج</text><text x="565" y="251" fill="#b45309" font-weight="700">يحصل تبول لا إرادي.</text>
  </g>
</svg>
