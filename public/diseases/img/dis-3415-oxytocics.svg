<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 432" width="640" height="432" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="أدوية الرحم المقوّية (Oxytocics)"><rect width="640" height="432" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">أدوية الرحم المقوّية (Oxytocics)</text><rect x="326.0" y="46" width="302.0" height="188" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الفكرة والاستعمال</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• تزيد قوة ومدة وتكرار تقلصات الرحم وتقلل</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   نزف الرحم</text><text x="616.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• تُعطى بعد خروج المشيمة لمنع نزف ما بعد</text><text x="616.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">   الولادة (ارتخاء الرحم)</text><text x="616.0" y="166" text-anchor="start" font-size="12.5" fill="#1d2939">• تحريض الولادة المبكرة عند وجود دواعٍ</text><text x="616.0" y="184" text-anchor="start" font-size="12.5" fill="#1d2939">   (سكري، جنين كبير، Rh، تمزق مبكر للأغشية،</text><text x="616.0" y="202" text-anchor="start" font-size="12.5" fill="#1d2939">   خمول رحم، تسمم حمل)</text><text x="616.0" y="220" text-anchor="start" font-size="12.5" fill="#1d2939">• تدبير الإجهاض المحتوم أو الناقص</text><rect x="12.0" y="46" width="302.0" height="98" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="12.0" y="60" width="302.0" height="14" fill="#b42318"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">آثار جانبية (Oxytocin)</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• بطء قلب الجنين، تمزق الرحم، فرط انقباض</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• غثيان، قيء، اضطراب نظم، تأق</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• تسمم مائي (تشبه vasopressin: مضاد إدرار)</text><rect x="12.0" y="156" width="302.0" height="170" rx="10" fill="#fff4d6" stroke="#a86a00" stroke-width="1.2"/><rect x="12.0" y="156" width="302.0" height="28" rx="10" fill="#a86a00"/><rect x="12.0" y="170" width="302.0" height="14" fill="#a86a00"/><text x="163.0" y="175" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">موانع (Oxytocin)</text><text x="302.0" y="204" text-anchor="start" font-size="12.5" fill="#1d2939">• عدم تناسب الحوض والجنين (CPD)</text><text x="302.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• وضع جنين غير ملائم</text><text x="302.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">• طوارئ توليدية وكرب جنيني مع ولادة غير</text><text x="302.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">   وشيكة</text><text x="302.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">• تسمم حمل شديد/إكلامبسيا وفرط ضغط</text><text x="302.0" y="294" text-anchor="start" font-size="12.5" fill="#1d2939">• مشيمة سادّة كاملة</text><text x="302.0" y="312" text-anchor="start" font-size="12.5" fill="#1d2939">• أي حالة تمنع الولادة المهبلية</text><rect x="326.0" y="246" width="302.0" height="170" rx="10" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.2"/><rect x="326.0" y="246" width="302.0" height="28" rx="10" fill="#2e7d4f"/><rect x="326.0" y="260" width="302.0" height="14" fill="#2e7d4f"/><text x="477.0" y="265" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التمريض</text><text x="616.0" y="294" text-anchor="start" font-size="12.5" fill="#1d2939">• مراقبة مستمرة للأم والجنين وطبيب متاح</text><text x="616.0" y="312" text-anchor="start" font-size="12.5" fill="#1d2939">• أوقف الأوكسيتوسين وأبلغ إذا: تغير FHR،</text><text x="616.0" y="330" text-anchor="start" font-size="12.5" fill="#1d2939">   انقباض أطول من 60 ثانية أو أسرع من كل</text><text x="616.0" y="348" text-anchor="start" font-size="12.5" fill="#1d2939">   2–3 دقائق أو بلا ارتخاء، تغير كبير في</text><text x="616.0" y="366" text-anchor="start" font-size="12.5" fill="#1d2939">   الضغط/النبض</text><text x="616.0" y="384" text-anchor="start" font-size="12.5" fill="#1d2939">• قبل الأدوية بعد الولادة: قس الضغط والنبض</text><text x="616.0" y="402" text-anchor="start" font-size="12.5" fill="#1d2939">   والتنفس</text></svg>