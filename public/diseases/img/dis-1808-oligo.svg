<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 252" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="252" rx="16" fill="#f8fafc"/><text x="320" y="32" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قلة السائل الأمنيوسي (Oligohydramnios)</text><rect x="470.0" y="50" width="150.0" height="31" fill="#1e3a8a" stroke="#cbd5e1"/><text x="545.0" y="70.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">البند</text><rect x="20.0" y="50" width="450.0" height="31" fill="#1e3a8a" stroke="#cbd5e1"/><text x="245.0" y="70.0" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">التفصيل</text><rect x="470.0" y="81" width="150.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="545.0" y="101.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">التعريف</text><rect x="20.0" y="81" width="450.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="245.0" y="101.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">حجم سائل قليل يهدد الجنين؛ ينخفض تدريجياً بعد 41 أسبوعاً</text><rect x="470.0" y="112" width="150.0" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="545.0" y="132.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">الأسباب</text><rect x="20.0" y="112" width="450.0" height="31" fill="#eef2ff" stroke="#cbd5e1"/><text x="245.0" y="132.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">تمزق أغشية غير مشخَّص، تشوه كلى الجنين</text><rect x="470.0" y="143" width="150.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="545.0" y="163.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">المضاعفات</text><rect x="20.0" y="143" width="450.0" height="31" fill="#fff" stroke="#cbd5e1"/><text x="245.0" y="163.0" text-anchor="middle" font-size="13" font-weight="500" fill="#0f172a">Pulmonary hypoplasia وانضغاط الحبل السري</text><rect x="470.0" y="174" width="150.0" height="31" fill="#eef2ff" stroke