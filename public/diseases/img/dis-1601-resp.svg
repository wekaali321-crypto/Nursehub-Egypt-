<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="396" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">الحماض والقلاء التنفسي: أسباب ومظاهر وتعويض</text>
<rect x="14" y="48" width="300" height="330" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><rect x="326" y="48" width="300" height="330" rx="10" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/><text x="164" y="76" text-anchor="middle" font-size="14" font-weight="800" fill="#92400e" >الحماض التنفسي (pH أقل من 7.35)</text><text x="476" y="76" text-anchor="middle" font-size="14" font-weight="800" fill="#1e3a8a" >القلاء التنفسي (pH أكبر من 7.45)</text><text x="164" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#92400e" >تنفس بطيء وسطحي = CO₂ يرتفع</text><text x="476" y="98" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a" >تنفس سريع = CO₂ ينخفض</text><text x="300" y="124" text-anchor="start" font-size="12.5" font-weight="600" fill="#451a03" >• انقطاع النفس أثناء النوم</text><text x="300" y="151" text-anchor="start" font-size="12.5" font-weight="600" fill="#451a03" >• إصابة الرأس (فقدان وعي)</text><text x="300" y="178" text-anchor="start" font-size="12.5" font-weight="600" fill="#451a03" >• ما بعد العملية</text><text x="300" y="205" text-anchor="start" font-size="12.5" font-weight="600" fill="#451a03" >• مثبطات: أفيونات، كحول، بنزوديازيبين</text><text x="300" y="232" text-anchor="start" font-size="12.5" font-weight="600" fill="#451a03" >• التهاب رئوي</text><text x="300" y="259" text-anchor="start" font-size="12.5" font-weight="600" fill="#451a03" >• نوبة ربو أو COPD</text><text x="300" y="286" text-anchor="start" font-size="12.5" font-weight="600" fill="#451a03" >• تغير الوعي</text><text x="300" y="313" text-anchor="start" font-size="12.5" font-weight="600" fill="#451a03" >• PaCO₂ مرتفع وHCO₃ مرتفع (تعويض)</text><text x="300" y="340" text-anchor="start" font-size="12.5" font-weight="600" fill="#451a03" >• الكلى تطرح H⁺ وتحتفظ بـHCO₃</text><text x="612" y="124" text-anchor="start" font-size="12.5" font-weight="600" fill="#172554" >• نوبة هلع</text><text x="612" y="151" text-anchor="start" font-size="12.5" font-weight="600" fill="#172554" >• PaCO₂ منخفض</text><text x="612" y="178" text-anchor="start" font-size="12.5" font-weight="600" fill="#172554" >• HCO₃ منخفض (تعويض)</text><text x="612" y="205" text-anchor="start" font-size="12.5" font-weight="600" fill="#172554" >• الكلى تطرح HCO₃ أقل وتحتفظ بـH⁺ أقل (تعويض)</text>
</svg>
