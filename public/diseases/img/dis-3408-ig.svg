<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" width="640" height="306" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="الغلوبيولينات المناعية ومضادات السموم"><rect width="640" height="306" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">الغلوبيولينات المناعية ومضادات السموم</text><rect x="326.0" y="46" width="302.0" height="80" rx="10" fill="#e3f0fa" stroke="#2b6a9e" stroke-width="1.2"/><rect x="326.0" y="46" width="302.0" height="28" rx="10" fill="#2b6a9e"/><rect x="326.0" y="60" width="302.0" height="14" fill="#2b6a9e"/><text x="477.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">الغلوبيولين المناعي (IG)</text><text x="616.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• أجسام مضادة جاهزة من دم بشري/حيواني</text><text x="616.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">• مناعة سلبية (Passive) ضد المرض</text><rect x="12.0" y="46" width="302.0" height="116" rx="10" fill="#e6f4ea" stroke="#2e7d4f" stroke-width="1.2"/><rect x="12.0" y="46" width="302.0" height="28" rx="10" fill="#2e7d4f"/><rect x="12.0" y="60" width="302.0" height="14" fill="#2e7d4f"/><text x="163.0" y="65" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">مضاد السم (Antivenin)</text><text x="302.0" y="94" text-anchor="start" font-size="12.5" fill="#1d2939">• حماية مؤقتة من سموم لدغات العناكب</text><text x="302.0" y="112" text-anchor="start" font-size="12.5" fill="#1d2939">   (الأرملة السوداء) والأفاعي</text><text x="302.0" y="130" text-anchor="start" font-size="12.5" fill="#1d2939">• أفضل استجابة خلال 4 ساعات من التعرض</text><text x="302.0" y="148" text-anchor="start" font-size="12.5" fill="#1d2939">• لا تداخلات معروفة</text><rect x="326.0" y="138" width="302.0" height="134" rx="10" fill="#fde8e8" stroke="#b42318" stroke-width="1.2"/><rect x="326.0" y="138" width="302.0" height="28" rx="10" fill="#b42318"/><rect x="326.0" y="152" width="302.0" height="14" fill="#b42318"/><text x="477.0" y="157" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">موانع الاستعمال</text><text x="616.0" y="186" text-anchor="start" font-size="12.5" fill="#1d2939">• حساسية سابقة لمستحضرات الغلوبيولين</text><text x="616.0" y="204" text-anchor="start" font-size="12.5" fill="#1d2939">• نقص IgA المعزول (خطر تأق)</text><text x="616.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• IGIV: يرتبط بقصور/فشل كلوي، وموت؛ تجنّبه</text><text x="616.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">   في القصور الكلوي، السكري، فوق 65 سنة،</text><text x="616.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">   أدوية سامة للكلى</text><rect x="12.0" y="174" width="302.0" height="116" rx="10" fill="#efe9fb" stroke="#6a4bb5" stroke-width="1.2"/><rect x="12.0" y="174" width="302.0" height="28" rx="10" fill="#6a4bb5"/><rect x="12.0" y="188" width="302.0" height="14" fill="#6a4bb5"/><text x="163.0" y="193" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fff">التداخلات</text><text x="302.0" y="222" text-anchor="start" font-size="12.5" fill="#1d2939">• قد تتداخل مع اللقاحات الحية (خصوصًا</text><text x="302.0" y="240" text-anchor="start" font-size="12.5" fill="#1d2939">   الحصبة، النكاف، الحصبة الألمانية)</text><text x="302.0" y="258" text-anchor="start" font-size="12.5" fill="#1d2939">• لقاح حي قبل IG بـ14–30 يومًا، أو بعده</text><text x="302.0" y="276" text-anchor="start" font-size="12.5" fill="#1d2939">   بـ6–12 أسبوعًا</text></svg>