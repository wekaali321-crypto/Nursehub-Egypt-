<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 278" font-family="Cairo, Tahoma, sans-serif" direction="rtl"><rect width="640" height="278" rx="16" fill="#f8fafc"/><text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a">فقدان الشهية العصبي مقابل النهم العصبي</text><rect x="12" y="44" width="616" height="30" rx="8" fill="#0f172a"/><text x="571.4285714285714" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">البند</text><text x="389.1428571428572" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">فقدان الشهية العصبي (Anorexia)</text><text x="137.7142857142858" y="64" text-anchor="middle" font-size="12.5" font-weight="800" fill="#fff">النهم العصبي (Bulimia)</text><rect x="12" y="74" width="616" height="28" fill="#fff"/><text x="571.4285714285714" y="92" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">الوزن</text><text x="389.1428571428572" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">منخفض جداً</text><text x="137.7142857142858" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">غالباً طبيعي أو أعلى</text><rect x="12" y="102" width="616" height="60" fill="#f1f5f9"/><text x="571.4285714285714" y="120" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">السلوك</text><text x="389.1428571428572" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">تقييد السعرات ± نوبات أكل وتطهير</text><text x="137.7142857142858" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">نوبات أكل كبيرة مع فقدان تحكم ثم</text><text x="137.7142857142858" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">تعويض (قيء، رياضة، مسهلات، مدرّات،</text><text x="137.7142857142858" y="152" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">حقن شرجية، صيام)</text><rect x="12" y="162" width="616" height="44" fill="#fff"/><text x="571.4285714285714" y="180" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">علامات</text><text x="389.1428571428572" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">نحول، حويصلات شعر لانوجو، بطء نبض،</text><text x="389.1428571428572" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">هبوط ضغط، انقطاع طمث</text><text x="137.7142857142858" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">بلى مينا الأسنان، قشرة (Russell) على</text><text x="137.7142857142858" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">مفاصل الأصابع، تضخم غدد لعابية</text><rect x="12" y="206" width="616" height="28" fill="#f1f5f9"/><text x="571.4285714285714" y="224" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">الأملاح</text><text x="389.1428571428572" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">K وNa وCl وCO₂ وCa وMg وPO₄ مضطربة</text><text x="137.7142857142858" y="224" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">هبوط K وقلاء أيضي، أميلاز مرتفع</text><rect x="12" y="234" width="616" height="28" fill="#fff"/><text x="571.4285714285714" y="252" text-anchor="middle" font-size="12" font-weight="800" fill="#1e293b">العلاج</text><text x="389.1428571428572" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">CBT، علاج أسري، SSRIs، تغذية تدريجية</text><text x="137.7142857142858" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#1e293b">CBT، علاج بين شخصي، SSRIs</text></svg>