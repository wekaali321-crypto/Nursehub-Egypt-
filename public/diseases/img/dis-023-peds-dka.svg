<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 338" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="338" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">علاج DKA: DKA = D K A</text><rect x="20" y="48" width="600" height="58" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><circle cx="596" cy="68" r="13" fill="#2563eb"/><text x="596" y="73" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="570" y="73" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">D — الجفاف أولًا</text><text x="570" y="94" text-anchor="end" font-size="12.5" fill="#334155">محلول ملحي 0.9% كأول خطوة</text><text x="320" y="120" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="126" width="600" height="76" rx="12" fill="#fff" stroke="#16a34a" stroke-width="2"/><circle cx="596" cy="146" r="13" fill="#16a34a"/><text x="596" y="151" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="570" y="151" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">K — اقتل السكر ببطء</text><text x="570" y="172" text-anchor="end" font-size="12.5" fill="#334155">قياس السكر كل ساعة؛ فوق 250: إنسولين Regular وريدي فقط (بلعة أولًا)؛</text><text x="570" y="190" text-anchor="end" font-size="12.5" fill="#334155">تحت 200 أو اختفاء الكيتونات: إنسولين تحت الجلد + محلول ½ ملحي مع D5W</text><text x="320" y="216" text-anchor="middle" font-size="16" fill="#64748b">▼</text><rect x="20" y="222" width="600" height="76" rx="12" fill="#fff" stroke="#ea580c" stroke-width="2"/><circle cx="596" cy="242" r="13" fill="#ea580c"/><text x="596" y="247" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="570" y="247" text-anchor="end" font-size="14" font-weight="700" fill="#0f172a">A — أضف البوتاسيوم</text><text x="570" y="268" text-anchor="end" font-size="12.5" fill="#334155">حتى لو طبيعي 3.5–5.0 أثناء الإنسولين الوريدي (الإنسولين يُدخل السكر</text><text x="570" y="286" text-anchor="end" font-size="12.5" fill="#334155">والبوتاسيوم للخلية)</text><text x="320" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b91c1c">في أيام المرض أعطِ الإنسولين حتى لو لا يأكل</text>
</svg>
