<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" font-family="Cairo, Tahoma, sans-serif" direction="rtl">
<rect width="640" height="276" rx="16" fill="#f8fafc"/>
<text x="320" y="30" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">قواعد ميكانيكا الجسم عند رفع المريض</text>
<rect x="326" y="48" width="294" height="100" rx="12" fill="#fff" stroke="#0ea5e9" stroke-width="2"/><rect x="326" y="48" width="294" height="28" rx="12" fill="#0ea5e9"/><rect x="326" y="64" width="294" height="12" fill="#0ea5e9"/><text x="473.0" y="67" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">قبل الحركة</text><text x="473.0" y="98" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">رتّب مساعدة</text><text x="473.0" y="116" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">شجّع المريض على التعاون</text><text x="473.0" y="134" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">اقترب من المريض</text><rect x="20" y="48" width="294" height="100" rx="12" fill="#fff" stroke="#22c55e" stroke-width="2"/><rect x="20" y="48" width="294" height="28" rx="12" fill="#22c55e"/><rect x="20" y="64" width="294" height="12" fill="#22c55e"/><text x="167.0" y="67" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">وضع الجسم</text><text x="167.0" y="98" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">ثنِ الركبتين</text><text x="167.0" y="116" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">باعد القدمين</text><text x="167.0" y="134" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">ظهر وعنق وحوض في خط واحد</text><rect x="326" y="160" width="294" height="100" rx="12" fill="#fff" stroke="#f59e0b" stroke-width="2"/><rect x="326" y="160" width="294" height="28" rx="12" fill="#f59e0b"/><rect x="326" y="176" width="294" height="12" fill="#f59e0b"/><text x="473.0" y="179" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">أثناء الرفع</text><text x="473.0" y="210" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">استخدم الذراعين والساقين</text><text x="473.0" y="228" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">شدّ البطن والأرداف</text><text x="473.0" y="246" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">اسحب بملاءة السحب</text><rect x="20" y="160" width="294" height="100" rx="12" fill="#fff" stroke="#ef4444" stroke-width="2"/><rect x="20" y="160" width="294" height="28" rx="12" fill="#ef4444"/><rect x="20" y="176" width="294" height="12" fill="#ef4444"/><text x="167.0" y="179" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">التنسيق</text><text x="167.0" y="210" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">لا تلتفّ بالجذع</text><text x="167.0" y="228" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">الأقرب للحمل الأثقل يقود العدّ</text><text x="167.0" y="246" text-anchor="middle" font-size="12" font-weight="500" fill="#0f172a">تحرّكوا معاً على العدّ ثلاثة</text>
</svg>
