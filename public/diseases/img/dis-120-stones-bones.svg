<text x="320" y="30" text-anchor="middle" font-size="17" font-weight="800" fill="#0f172a" >حفظ الأعراض: «حصوات · عظام · بطن · نفسية»</text><rect x="30" y="55" width="138" height="150" rx="12" fill="#0ea5e9"/><text x="99" y="90" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >حصوات</text><text x="99" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >مغص كلوي</text><text x="99" y="149" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >تبول كتير</text><text x="99" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >دم في البول</text><rect x="178" y="55" width="138" height="150" rx="12" fill="#f97316"/><text x="247" y="90" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >عظام</text><text x="247" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >ألم عظام</text><text x="247" y="149" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >هشاشة</text><text x="247" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >كسور</text><rect x="326" y="55" width="138" height="150" rx="12" fill="#a855f7"/><text x="395" y="90" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >بطن</text><text x="395" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >إمساك</text><text x="395" y="149" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >غثيان</text><text x="395" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >قرحة</text><text x="395" y="197" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >التهاب بنكرياس</text><rect x="474" y="55" width="138" height="150" rx="12" fill="#14b8a6"/><text x="543" y="90" text-anchor="middle" font-size="15" font-weight="800" fill="#fff" >نفسية وعضلات</text><text x="543" y="125" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >اكتئاب</text><text x="543" y="149" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >ضعف عضلات</text><text x="543" y="173" text-anchor="middle" font-size="12" font-weight="600" fill="#fff" >تشوش</text><text x="320" y="235" text-anchor="middle" font-size="13" font-weight="600" fill="#475569" >+ جفاف وعطش وضغط عالي (كلها من زيادة الكالسيوم)</text>
