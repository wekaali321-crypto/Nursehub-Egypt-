<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 287" width="640" height="287" direction="rtl" font-family="Cairo, Tahoma, sans-serif" role="img" aria-label="DMARDs: الأدوية والاستعمال"><rect width="640" height="287" fill="#fff"/><text x="320.0" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1d2939">DMARDs: الأدوية والاستعمال</text><rect x="10" y="48" width="620" height="28" rx="6" fill="#2b6a9e"/><text x="542.8125" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الدواء</text><text x="368.4375" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">الاستعمال</text><text x="145.625" y="67" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">ملاحظة</text><rect x="10" y="76" width="620" height="27" fill="#f4f8fc" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="95" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">Methotrexate</text><text x="448.625" y="95" text-anchor="start" font-size="12.5"  fill="#1d2939">RA وأمراض مناعية</text><text x="274.25" y="95" text-anchor="start" font-size="12.5"  fill="#1d2939">راجع دليله؛ سلفا ترفع سميته</text><rect x="10" y="103" width="620" height="44" fill="#fff" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="122" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">Sulfasalazine</text><text x="448.625" y="122" text-anchor="start" font-size="12.5"  fill="#1d2939">RA ومرض كرون</text><text x="274.25" y="122" text-anchor="start" font-size="12.5"  fill="#1d2939">آثار: غثيان، تغيرات عين، اضطراب هضمي،</text><text x="274.25" y="139" text-anchor="start" font-size="12.5"  fill="#1d2939">pancytopenia خفيف</text><rect x="10" y="147" width="620" height="44" fill="#f4f8fc" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="166" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">Adalimumab (Humira)</text><text x="448.625" y="166" text-anchor="start" font-size="12.5"  fill="#1d2939">RA، كرون</text><text x="274.25" y="166" text-anchor="start" font-size="12.5"  fill="#1d2939">جرعة نمطية في المصدر: 40 ملغ تحت</text><text x="274.25" y="183" text-anchor="start" font-size="12.5"  fill="#1d2939">الجلد كل أسبوعين (راجع النشرة)</text><rect x="10" y="191" width="620" height="44" fill="#fff" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="210" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">Etanercept (Enbrel)</text><text x="448.625" y="210" text-anchor="start" font-size="12.5"  fill="#1d2939">RA</text><text x="274.25" y="210" text-anchor="start" font-size="12.5"  fill="#1d2939">25 ملغ مرتين أسبوعيًا أو 50 ملغ</text><text x="274.25" y="227" text-anchor="start" font-size="12.5"  fill="#1d2939">أسبوعيًا (راجع النشرة)</text><rect x="10" y="235" width="620" height="44" fill="#f4f8fc" stroke="#d0d9e2" stroke-width=".7"/><text x="623" y="254" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">Hydroxychloroquine</text><text x="623" y="271" text-anchor="start" font-size="12.5" font-weight="700" fill="#1d2939">(Plaquenil)</text><text x="448.625" y="254" text-anchor="start" font-size="12.5"  fill="#1d2939">RA ومضاد ملاريا</text><text x="274.25" y="254" text-anchor="start" font-size="12.5"  fill="#1d2939">راجع النشرة</text></svg>