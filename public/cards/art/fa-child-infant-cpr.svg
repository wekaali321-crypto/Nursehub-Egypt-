<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 194" width="608" height="388" fill="none" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, Helvetica, sans-serif"><defs><marker id="at" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#168C91"/></marker><marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3B6FB6"/></marker><marker id="an" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#153448"/></marker><marker id="ay" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B8860B"/></marker><marker id="ap" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8E6BBF"/></marker></defs><g transform="translate(22 2)"><ellipse cx="66" cy="110" rx="46" ry="38" fill="#F4E3D7" stroke="#B9C6CE" stroke-width="2"/><path d="M66 78 V140" stroke="#B9C6CE" stroke-width="2"/><ellipse cx="66" cy="112" rx="14" ry="10" fill="#E7B795" stroke="#153448" stroke-width="1.2"/><text x="66" y="30" font-size="10" font-weight="700" fill="#153448" text-anchor="middle">Child</text><text x="66" y="44" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">1 – 2 hands, lower half of sternum</text><text x="66" y="164" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">start with 2 rescue breaths</text><ellipse cx="194" cy="110" rx="34" ry="28" fill="#F4E3D7" stroke="#B9C6CE" stroke-width="2"/><path d="M194 86 V134" stroke="#B9C6CE" stroke-width="2"/><path d="M188 100 v20 M200 100 v20" stroke="#E7B795" stroke-width="7"/><text x="194" y="30" font-size="10" font-weight="700" fill="#153448" text-anchor="middle">Baby (&lt; 1 year)</text><text x="194" y="44" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">2 fingers, just below the nipple line</text><text x="194" y="164" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">gentle head tilt — do NOT over-extend</text><text x="130" y="186" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">if unsure, doing something is far better than nothing</text></g></svg>