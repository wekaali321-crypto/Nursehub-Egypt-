ill="#153448" text-anchor="start">Head tilted back — airway open</text><path d="M58 136 L20 172" stroke="#B9C6CE" stroke-width="1"/><circle cx="58" cy="136" r="1.6" fill="#153448"/><text x="22" y="175" font-size="8.5" font-weight="700" fill="#153448" text-anchor="start">Hand under the cheek</text><path d="M200 100 L250 60" stroke="#B9C6CE" stroke-width="1"/><circle cx="200" cy="100" r="1.6" fill="#153448"/><text x="248" y="63" font-size="8.5" font-weight="700" fill="#153448" text-anchor="end">Top knee bent = stable</text><path d="M110 148 L130 178" stroke="#B9C6CE" stroke-width="1"/><circle cx="110" cy="148" r="1.6" fill="#153448"/><text x="132" y="181" font-size="8.5" font-weight="700" fill="#153448" text-anchor="start">Lower arm out</text><text x="130" y="18" font-size="9" font-weight="700" fill="#153448" text-anchor="middle">Recovery position (unconscious, breathing)</text><text x="130" y="32" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">roll the casualty toward you, then keep checking breathing</text></g></svg>