<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 194" width="608" height="388" fill="none" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, Helvetica, sans-serif"><defs><marker id="at" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#168C91"/></marker><marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3B6FB6"/></marker><marker id="an" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#153448"/></marker><marker id="ay" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B8860B"/></marker><marker id="ap" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8E6BBF"/></marker></defs><g transform="translate(22 2)"><circle cx="26" cy="54" r="22" fill="#DCEFF0" stroke="#153448" stroke-width="1.4"/><text x="26" y="60" font-size="17" font-weight="700" fill="#153448" text-anchor="middle">A</text><text x="26" y="92" font-size="8.5" font-weight="700" fill="#153448" text-anchor="middle">Absorption</text><text x="26" y="103" font-size="6.8" font-weight="400" fill="#5b6b75" text-anchor="middle">site → blood</text><text x="26" y="112" font-size="6.8" font-weight="400" fill="#5b6b75" text-anchor="middle">IV = 100%</text><path d="M50 54 H70" stroke="#153448" stroke-width="1.6" marker-end="url(#an)"/><circle cx="96" cy="54" r="22" fill="#DCE7F5" stroke="#153448" stroke-width="1.4"/><text x="96" y="60" font-size="17" font-weight="700" fill="#153448" text-anchor="middle">D</text><text x="96" y="92" font-size="8.5" font-weight="700" fill="#153448" text-anchor="middle">Distribution</text><text x="96" y="103" font-size="6.8" font-weight="400" fill="#5b6b75" text-anchor="middle">blood → tissues</text><text x="96" y="112" font-size="6.8" font-weight="400" fill="#5b6b75" text-anchor="middle">free or bound</text><path d="M120 54 H140" stroke="#153448" stroke-width="1.6" marker-end="url(#an)"/><circle cx="166" cy="54" r="22" fill="#F6D98B" stroke="#153448" stroke-width="1.4"/><text x="166" y="60" font-size="17" font-weight="700" fill="#153448" text-anchor="middle">M</text><text x="166" y="92" font-size="8.5" font-weight="700" fill="#153448" text-anchor="middle">Metabolism</text><text x="166" y="103" font-size="6.8" font-weight="400" fill="#5b6b75" text-anchor="middle">mainly liver</text><text x="166" y="112" font-size="6.8" font-weight="400" fill="#5b6b75" text-anchor="middle">first-pass (oral)</text><path d="M190 54 H210" stroke="#153448" stroke-width="1.6" marker-end="url(#an)"/><circle cx="236" cy="54" r="22" fill="#F8DADA" stroke="#153448" stroke-width="1.4"/><text x="236" y="60" font-size="17" font-weight="700" fill="#153448" text-anchor="middle">E</text><text x="236" y="92" font-size="8.5" font-weight="700" fill="#153448" text-anchor="middle">Excretion</text><text x="236" y="103" font-size="6.8" font-weight="400" fill="#5b6b75" text-anchor="middle">mainly kidney</text><text x="236" y="112" font-size="6.8" font-weight="400" fill="#5b6b75" text-anchor="middle">urine</text><rect x="4" y="136" width="256" height="40" rx="6" fill="#E3EAEE"/><text x="132" y="152" font-size="8.5" font-weight="700" fill="#168C91" text-anchor="middle">Pharmacokinetics = what the BODY does to the drug</text><text x="132" y="168" font-size="8.5" font-weight="700" fill="#8E6BBF" text-anchor="middle">Pharmacodynamics = what the DRUG does to the body</text></g></svg>