<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 194" width="608" height="388" fill="none" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, Helvetica, sans-serif"><defs><marker id="at" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#168C91"/></marker><marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3B6FB6"/></marker><marker id="an" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#153448"/></marker><marker id="ay" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B8860B"/></marker><marker id="ap" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8E6BBF"/></marker></defs><g transform="translate(22 2)"><rect x="4" y="8" width="122" height="38" rx="7" fill="#DCEFF0"/><text x="12" y="32" font-size="11" font-weight="700" fill="#168C91" text-anchor="start">1</text><text x="26" y="25" font-size="7.5" font-weight="700" fill="#153448" text-anchor="start">Dry the baby</text><text x="26" y="37" font-size="7.5" font-weight="400" fill="#153448" text-anchor="start">clamp the cord</text><rect x="132" y="8" width="122" height="38" rx="7" fill="#FBE3C8"/><text x="140" y="32" font-size="11" font-weight="700" fill="#168C91" text-anchor="start">2</text><text x="154" y="25" font-size="7.5" font-weight="700" fill="#153448" text-anchor="start">Cold receptors</text><text x="154" y="37" font-size="7.5" font-weight="400" fill="#153448" text-anchor="start">↑CO₂ ↓O₂ ↑acidosis</text><rect x="4" y="54" width="122" height="38" rx="7" fill="#DCEFF0"/><text x="12" y="78" font-size="11" font-weight="700" fill="#168C91" text-anchor="start">3</text><text x="26" y="78" font-size="7.5" font-weight="700" fill="#153448" text-anchor="start">FIRST BREATH</text><rect x="132" y="54" width="122" height="38" rx="7" fill="#DCE7F5"/><text x="140" y="78" font-size="11" font-weight="700" fill="#168C91" text-anchor="start">4</text><text x="154" y="71" font-size="7.5" font-weight="700" fill="#153448" text-anchor="start">Pulmonary artery</text><text x="154" y="83" font-size="7.5" font-weight="400" fill="#153448" text-anchor="start">pressure falls</text><rect x="4" y="100" width="122" height="38" rx="7" fill="#F8DADA"/><text x="12" y="124" font-size="11" font-weight="700" fill="#168C91" text-anchor="start">5</text><text x="26" y="117" font-size="7.5" font-weight="700" fill="#153448" text-anchor="start">↑PO₂ →</text><text x="26" y="129" font-size="7.5" font-weight="400" fill="#153448" text-anchor="start">ductus arteriosus closes</text><rect x="132" y="100" width="122" height="38" rx="7" fill="#F8DADA"/><text x="140" y="124" font-size="11" font-weight="700" fill="#168C91" text-anchor="start">6</text><text x="154" y="117" font-size="7.5" font-weight="700" fill="#153448" text-anchor="start">Left &gt; right pressure →</text><text x="154" y="129" font-size="7.5" font-weight="400" fill="#153448" text-anchor="start">foramen ovale closes</text><rect x="4" y="146" width="122" height="38" rx="7" fill="#F8DADA"/><text x="12" y="170" font-size="11" font-weight="700" fill="#168C91" text-anchor="start">7</text><text x="26" y="163" font-size="7.5" font-weight="700" fill="#153448" text-anchor="start">Ductus venosus</text><text x="26" y="175" font-size="7.5" font-weight="400" fill="#153448" text-anchor="start">closes</text><rect x="132" y="146" width="122" height="38" rx="7" fill="#E3EAEE"/><text x="140" y="170" font-size="11" font-weight="700" fill="#168C91" text-anchor="start">8</text><text x="154" y="163" font-size="7.5" font-weight="700" fill="#153448" text-anchor="start">Umbilical vessels</text><text x="154" y="175" font-size="7.5" font-weight="400" fill="#153448" text-anchor="start">close</text><path d="M126 25 H130" stroke="#153448" stroke-width="1.5" marker-end="url(#an)"/><path d="M126 71 H130" stroke="#153448" stroke-width="1.5" marker-end="url(#an)"/><path d="M126 117 H130" stroke="#153448" stroke-width="1.5" marker-end="url(#an)"/><path d="M126 163 H130" stroke="#153448" stroke-width="1.5" marker-end="url(#an)"/></g></svg>