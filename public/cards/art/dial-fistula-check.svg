 fill="#168C91" text-anchor="middle">3 LISTEN</text><text x="220" y="31" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">bruit (whoosh) — stethoscope</text><path d="M130 48 l-6 18 M136 48 l0 20 M142 48 l6 18" stroke="#153448" stroke-width="2"/><circle cx="214" cy="62" r="7" stroke="#153448" stroke-width="2"/><path d="M214 55 Q214 40 230 36" stroke="#153448" stroke-width="2"/><path d="M60 140 h70" stroke="#D64545" stroke-width="2"/><text x="130" y="160" font-size="8.5" font-weight="700" fill="#D64545" text-anchor="middle">Never on the fistula arm:</text><text x="130" y="172" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">BP cuff · blood samples · tight clothes or jewelry · sleeping on it</text></g></svg>