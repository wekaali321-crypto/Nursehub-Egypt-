<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 194" width="608" height="388" fill="none" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, Helvetica, sans-serif"><defs><marker id="at" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#168C91"/></marker><marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3B6FB6"/></marker><marker id="an" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#153448"/></marker><marker id="ay" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B8860B"/></marker><marker id="ap" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8E6BBF"/></marker></defs><g transform="translate(22 2)"><path d="M10 120 H120" stroke="#B9C6CE" stroke-width="3"/><ellipse cx="66" cy="96" rx="44" ry="22" fill="#F4E3D7" stroke="#B9C6CE"/><ellipse cx="70" cy="80" rx="30" ry="22" fill="#F2C9C3" stroke="#D64545"/><path d="M30 110 H110" stroke="#3B6FB6" stroke-width="6"/><path d="M56 110 H86" stroke="#D64545" stroke-width="3"/><text x="66" y="24" font-size="9.5" font-weight="700" fill="#D64545" text-anchor="middle">On the back</text><text x="66" y="36" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">uterus presses on the IVC</text><text x="66" y="140" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">↓ venous return → ↓ BP, dizzy, pale</text><path d="M140 120 H250" stroke="#B9C6CE" stroke-width="3"/><ellipse cx="196" cy="94" rx="40" ry="26" fill="#F4E3D7" stroke="#B9C6CE"/><ellipse cx="206" cy="102" rx="26" ry="18" fill="#F2C9C3" stroke="#D64545"/><path d="M160 80 H232" stroke="#3B6FB6" stroke-width="6"/><text x="196" y="24" font-size="9.5" font-weight="700" fill="#168C91" text-anchor="middle">LEFT side</text><text x="196" y="36" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">uterus falls away from the IVC</text><text x="196" y="140" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">blood flow back to the heart restored</text><text x="130" y="176" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">2nd–3rd trimester: rest and lie tilted to the left</text></g></svg>