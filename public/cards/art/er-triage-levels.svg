/text><text x="66.5" y="51" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">Emergent</text><text x="66.5" y="61" font-size="7" font-weight="400" fill="#fff" text-anchor="middle">within minutes</text><text x="164" y="50" font-size="7.2" font-weight="400" fill="#5b6b75" text-anchor="start">head injury · overdose</text><text x="164" y="60" font-size="7.2" font-weight="400" fill="#5b6b75" text-anchor="start">chest pain · GI bleed</text><rect x="0" y="72" width="122" height="28" rx="5" fill="#E8B931"/><text x="12" y="90" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">III</text><text x="73" y="85" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">Urgent</text><text x="73" y="95" font-size="7" font-weight="400" fill="#fff" text-anchor="middle">can wait a little</text><text x="164" y="84" font-size="7.2" font-weight="400" fill="#5b6b75" text-anchor="start">moderate asthma</text><text x="164" y="94" font-size="7.2" font-weight="400" fill="#5b6b75" text-anchor="start">GI bleed, stable vitals</text><rect x="0" y="106" width="135" height="28" rx="5" fill="#4CAF50"/><text x="12" y="124" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">IV</text><text x="79.5" y="119" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">Less urgent</text><text x="79.5" y="129" font-size="7" font-weight="400" fill="#fff" text-anchor="middle">can wait</text><text x="164" y="118" font-size="7.2" font-weight="400" fill="#5b6b75" text-anchor="start">minor trauma</text><text x="164" y="128" font-size="7.2" font-weight="400" fill="#5b6b75" text-anchor="start">earache</text><rect x="0" y="140" width="148" height="28" rx="5" fill="#3B6FB6"/><text x="12" y="158" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">V</text><text x="86" y="153" font-size="8.5" font-weight="700" fill="#fff" text-anchor="middle">Non-urgent</text><text x="86" y="163" font-size="7" font-weight="400" fill="#fff" text-anchor="middle">can wait longest</text><text x="164" y="152" font-size="7.2" font-weight="400" fill="#5b6b75" text-anchor="start">sore throat</text><text x="164" y="162" font-size="7.2" font-weight="400" fill="#5b6b75" text-anchor="start">minor symptoms</text><text x="0" y="186" font-size="8" font-weight="700" fill="#168C91" text-anchor="start">ESI: sort by severity, not by arrival time</text></g></svg>