<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 194" width="608" height="388" fill="none" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, Helvetica, sans-serif"><defs><marker id="at" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#168C91"/></marker><marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3B6FB6"/></marker><marker id="an" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#153448"/></marker><marker id="ay" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B8860B"/></marker><marker id="ap" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8E6BBF"/></marker></defs><g transform="translate(22 2)"><text x="130" y="12" font-size="9.5" font-weight="700" fill="#153448" text-anchor="middle">Where does the fluid stay?</text><rect x="4" y="22" width="64" height="92" rx="6" fill="#F8DADA" stroke="#153448" stroke-width="1.3"/><text x="36" y="40" font-size="8.5" font-weight="700" fill="#153448" text-anchor="middle">Vessels</text><text x="36" y="51" font-size="7" font-weight="400" fill="#5b6b75" text-anchor="middle">intravascular</text><rect x="74" y="22" width="78" height="92" rx="6" fill="#DCE7F5" stroke="#153448" stroke-width="1.3"/><text x="113" y="40" font-size="8.5" font-weight="700" fill="#153448" text-anchor="middle">Interstitial</text><text x="113" y="51" font-size="7" font-weight="400" fill="#5b6b75" text-anchor="middle">between cells</text><rect x="158" y="22" width="98" height="92" rx="6" fill="#DCEFF0" stroke="#153448" stroke-width="1.3"/><text x="207" y="40" font-size="8.5" font-weight="700" fill="#153448" text-anchor="middle">Inside cells</text><text x="207" y="51" font-size="7" font-weight="400" fill="#5b6b75" text-anchor="middle">intracellular</text><path d="M28 70 q-6 9 0 13 q6 -4 0 -13Z" fill="#D64545"/><path d="M40 70 q-6 9 0 13 q6 -4 0 -13Z" fill="#D64545"/><text x="36" y="100" font-size="7.5" font-weight="700" fill="#D64545" text-anchor="middle">COLLOIDS</text><text x="36" y="109" font-size="6.5" font-weight="400" fill="#5b6b75" text-anchor="middle">stay longer</text><path d="M104 70 q-6 9 0 13 q6 -4 0 -13Z" fill="#3B6FB6"/><path d="M118 70 q-6 9 0 13 q6 -4 0 -13Z" fill="#3B6FB6"/><text x="112" y="100" font-size="7.5" font-weight="700" fill="#3B6FB6" text-anchor="middle">NS · Ringer</text><text x="112" y="109" font-size="6.5" font-weight="400" fill="#5b6b75" text-anchor="middle">spread out fast</text><path d="M200 70 q-6 9 0 13 q6 -4 0 -13Z" fill="#168C91"/><path d="M214 70 q-6 9 0 13 q6 -4 0 -13Z" fill="#168C91"/><text x="207" y="100" font-size="7.5" font-weight="700" fill="#168C91" text-anchor="middle">Dextrose 5%</text><text x="207" y="109" font-size="6.5" font-weight="400" fill="#5b6b75" text-anchor="middle">sugar used → free water</text><text x="4" y="136" font-size="8" font-weight="700" fill="#D64545" text-anchor="start">Shock / bleeding:</text><text x="84" y="136" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="start">colloids raise blood volume fast</text><text x="4" y="152" font-size="8" font-weight="700" fill="#3B6FB6" text-anchor="start">Crystalloids:</text><text x="84" y="152" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="start">short effect — they leave the vessels</text><text x="130" y="176" font-size="7" font-weight="400" fill="#5b6b75" text-anchor="middle">colloids raise volume but do NOT replace red cells or clotting factors</text></g></svg>