anchor="middle">≈ 23%</text><text x="98" y="138" font-size="6.6" font-weight="400" fill="#5b6b75" text-anchor="middle">triangular, male-like</text><g transform="translate(162 70)"><ellipse cx="0" cy="0" rx="17" ry="26" fill="#DCE7F5" stroke="#3B6FB6" stroke-width="2"/></g><text x="162" y="116" font-size="8.5" font-weight="700" fill="#153448" text-anchor="middle">Anthropoid</text><text x="162" y="128" font-size="6.6" font-weight="400" fill="#5b6b75" text-anchor="middle">≈ 24%</text><text x="162" y="138" font-size="6.6" font-weight="400" fill="#5b6b75" text-anchor="middle">long front-to-back</text><g transform="translate(226 70)"><ellipse cx="0" cy="0" rx="30" ry="13" fill="#F8DADA" stroke="#D64545" stroke-width="2"/></g><text x="226" y="116" font-size="8.5" font-weight="700" fill="#153448" text-anchor="middle">Platypelloid</text><text x="226" y="128" font-size="6.6" font-weight="400" fill="#5b6b75" text-anchor="middle">≈ 3%</text><text x="226" y="138" font-size="6.6" font-weight="400" fill="#5b6b75" text-anchor="middle">wide, shallow — hardest</text><text x="130" y="22" font-size="9" font-weight="700" fill="#153448" text-anchor="middle">Pelvic inlet seen from above (Caldwell–Moloy)</text><text x="130" y="36" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">front ↑</text><text x="130" y="184" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">easiest → hardest for a vaginal birth: left → right</text></g></svg>