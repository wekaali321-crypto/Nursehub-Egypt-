/text><text x="130" y="20" font-size="10" font-weight="700" fill="#153448" text-anchor="middle">Lay down, raise the legs</text><text x="130" y="34" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">unless it worsens another injury (e.g. a broken leg)</text><text x="130" y="48" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">loosen tight clothing · call for help · nothing by mouth</text><text x="130" y="176" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">keep checking breathing and response</text></g></svg>