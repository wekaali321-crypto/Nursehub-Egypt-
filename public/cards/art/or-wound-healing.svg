<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 194" width="608" height="388" fill="none" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, Helvetica, sans-serif"><defs><marker id="at" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#168C91"/></marker><marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3B6FB6"/></marker><marker id="an" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#153448"/></marker><marker id="ay" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B8860B"/></marker><marker id="ap" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8E6BBF"/></marker></defs><g transform="translate(22 2)"><rect x="6" y="40" width="80" height="54" rx="8" fill="#F8DADA"/><text x="46" y="60" font-size="9" font-weight="700" fill="#153448" text-anchor="middle">Inflammatory</text><text x="46" y="74" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">first days</text><path d="M86 67 H92" stroke="#153448" stroke-width="2" marker-end="url(#an)"/><text x="46" y="112" font-size="6.5" font-weight="400" fill="#5b6b75" text-anchor="middle">clot stops bleeding</text><text x="46" y="123" font-size="6.5" font-weight="400" fill="#5b6b75" text-anchor="middle">cells clean</text><text x="46" y="134" font-size="6.5" font-weight="400" fill="#5b6b75" text-anchor="middle">mild redness normal</text><rect x="90" y="40" width="80" height="54" rx="8" fill="#FBE3C8"/><text x="130" y="60" font-size="9" font-weight="700" fill="#153448" text-anchor="middle">Proliferative</text><text x="130" y="74" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">several weeks</text><path d="M170 67 H176" stroke="#153448" stroke-width="2" marker-end="url(#an)"/><text x="130" y="112" font-size="6.5" font-weight="400" fill="#5b6b75" text-anchor="middle">new tissue</text><text x="130" y="123" font-size="6.5" font-weight="400" fill="#5b6b75" text-anchor="middle">new vessels</text><text x="130" y="134" font-size="6.5" font-weight="400" fill="#5b6b75" text-anchor="middle">fill the wound</text><rect x="174" y="40" width="80" height="54" rx="8" fill="#DCEFF0"/><text x="214" y="60" font-size="9" font-weight="700" fill="#153448" text-anchor="middle">Maturation</text><text x="214" y="74" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">months</text><text x="214" y="112" font-size="6.5" font-weight="400" fill="#5b6b75" text-anchor="middle">scar gets stronger</text><text x="214" y="123" font-size="6.5" font-weight="400" fill="#5b6b75" text-anchor="middle">and flatter</text><text x="130" y="22" font-size="9.5" font-weight="700" fill="#153448" text-anchor="middle">Surgical wound healing</text><text x="130" y="180" font-size="7.5" font-weight="400" fill="#5b6b75" text-anchor="middle">redness that spreads, pus or fever after day 3 = suspect infection</text></g></svg>