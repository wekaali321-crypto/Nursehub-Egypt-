<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 304 194" width="608" height="388" fill="none" stroke-linecap="round" stroke-linejoin="round" font-family="Arial, Helvetica, sans-serif"><defs><marker id="at" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#168C91"/></marker><marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#D64545"/></marker><marker id="ab" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3B6FB6"/></marker><marker id="an" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#153448"/></marker><marker id="ay" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#B8860B"/></marker><marker id="ap" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8E6BBF"/></marker></defs><g transform="translate(22 2)"><rect x="6" y="10" width="80" height="170" rx="10" fill="#DCEFF0"/><text x="46" y="32" font-size="10" font-weight="700" fill="#153448" text-anchor="middle">Contact</text><path d="M28 80 q12 -18 24 0 v14 h-24z" fill="#E8B931" stroke="#153448"/><text x="46" y="116" font-size="6.6" font-weight="400" fill="#5b6b75" text-anchor="middle">touch</text><text x="46" y="140" font-size="6.6" font-weight="400" fill="#5b6b75" text-anchor="middle">(e.g. resistant bacteria)</text><text x="46" y="164" font-size="7.5" font-weight="700" fill="#168C91" text-anchor="middle">gloves</text><text x="46" y="174" font-size="6.5" font-weight="700" fill="#168C91" text-anchor="middle">+ gown</text><rect x="90" y="10" width="80" height="170" rx="10" fill="#FBE3C8"/><text x="130" y="32" font-