<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif">
<rect width="800" height="450" fill="#f8fafc"/>
<text x="400" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">كيف ينقلب الاعتياد على الجرعات المتتابعة إلى انسحاب</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="#475569">From round-the-clock dosing to withdrawal</text>
<text x="60" y="100" font-size="14" font-weight="bold" fill="#334155">نمط التعاطي</text>
<text x="740" y="100" text-anchor="end" font-size="12" fill="#64748b">dosing pattern</text>
<line x1="60" y1="190" x2="520" y2="190" stroke="#94a3b8" stroke-width="2"/>
<g fill="#2563eb">
<rect x="70" y="140" width="10" height="50" rx="3"/><rect x="100" y="140" width="10" height="50" rx="3"/><rect x="130" y="140" width="10" height="50" rx="3"/><rect x="160" y="140" width="10" height="50" rx="3"/><rect x="190" y="140" width="10" height="50" rx="3"/><rect x="220" y="140" width="10" height="50" rx="3"/><rect x="250" y="140" width="10" height="50" rx="3"/><rect x="280" y="140" width="10" height="50" rx="3"/><rect x="310" y="140" width="10" height="50" rx="3"/><rect x="340" y="140" width="10" height="50" rx="3"/>
</g>
<g fill="#7c3aed"><rect x="390" y="165" width="10" height="25" rx="3"/><rect x="430" y="165" width="10" height="25" rx="3"/><rect x="470" y="165" width="10" height="25" rx="3"/></g>
<text x="205" y="215" text-anchor="middle" font-size="13" fill="#1e3a8a">كل ساعة نهاراً</text>
<text x="205" y="233" text-anchor="middle" font-size="11" fill="#1e3a8a">every hour by day</text>
<text x="430" y="215" text-anchor="middle" font-size="13" fill="#5b21b6">كل 3 ساعات ليلاً</text>
<text x="430" y="233" text-anchor="middle" font-size="11" fill="#5b21b6">every 3 h at night</text>
<rect x="540" y="130" width="200" height="70" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="640" y="158" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">توقف 24 ساعة</text>
<text x="640" y="178" text-anchor="middle" font-size="12" fill="#991b1b">no dose for 24 h</text>
<line x1="640" y1="200" x2="640" y2="255" stroke="#475569" stroke-width="3"/><polygon points="640,265 631,250 649,250" fill="#475569"/>
<rect x="60" y="270" width="680" height="95" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="400" y="298" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a3412">انسحاب: هياج، تخليط، رعاش شديد</text>
<text x="400" y="320" text-anchor="middle" font-size="13" fill="#9a3412">agitation, confusion, marked tremor</text>
<text x="400" y="344" text-anchor="middle" font-size="13" fill="#9a3412">38.2 °C · HR 114 · SpO₂ 99%</text>
<text x="400" y="396" text-anchor="middle" font-size="13" fill="#334155">يبدأ خلال ساعات من آخر جرعة ويستمر نحو 10 إلى 14 يوماً</text>
<text x="400" y="416" text-anchor="middle" font-size="12" fill="#64748b">begins within hours of the last dose and lasts about 10-14 days</text>
</svg>