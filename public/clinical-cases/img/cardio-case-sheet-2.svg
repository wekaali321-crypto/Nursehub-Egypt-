<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="Tahoma, Arial, sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs><rect width="800" height="520" rx="18" fill="#f1f5f9"/><text x="400" y="40" font-size="26" fill="#0f172a" font-weight="bold" text-anchor="middle" direction="rtl">من الشكوى إلى الصمام المحتمل</text><rect x="540" y="70" width="230" height="60" rx="12" fill="#1d4ed8"/><text x="655" y="108" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle" direction="rtl">ضيق نفس</text><line x1="655" y1="130" x2="655" y2="160" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="540" y="165" width="230" height="56" rx="12" fill="#fff" stroke="#1d4ed8" stroke-width="2.5"/><text x="655" y="201" font-size="20" fill="#1d4ed8" font-weight="bold" text-anchor="middle" direction="rtl">صمام ميترالي</text><rect x="540" y="240" width="230" height="50" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="655" y="272" font-size="17" fill="#334155" font-weight="normal" text-anchor="middle" direction="rtl">خفقان؟ لا → ضيق</text><rect x="540" y="302" width="230" height="50" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="655" y="334" font-size="17" fill="#334155" font-weight="normal" text-anchor="middle" direction="rtl">منتظم → ارتجاع</text><rect x="540" y="364" width="230" height="50" rx="10" fill="#fff" stroke="#cbd5e1"/><text x="655" y="396" font-size="17" fill="#334155" font-weight="normal" text-anchor="middle" direction="rtl">غير منتظم → رجفان</text><rect x="290" y="70" width="230" height="60" rx="12" fill="#047857"/><text x="405" y="108" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle" direction="rtl">تورم الساقين</text><line x1="405" y1="130" x2="405" y2="160" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="290" y="165" width="230" height="56" rx="12" fill="#fff" str