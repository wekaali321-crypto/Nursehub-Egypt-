<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><rect width="800" height="450" fill="#f8fafc"/><text x="400" y="34" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="bold" direction="rtl" >أين الخلل؟ العصب البصري خلف العين</text><text x="400" y="58" font-size="14" fill="#475569" text-anchor="middle" font-weight="normal" >Where is the problem? The optic nerve behind the eye</text><circle cx="190" cy="230" r="85" fill="#f8fafc" stroke="#475569" stroke-width="4"/><path d="M105 230 Q125 190 150 190 Q125 230 150 270 Q125 270 105 230Z" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/><circle cx="205" cy="230" r="30" fill="#e2e8f0"/><circle cx="205" cy="230" r="17" fill="#0f172a"/><circle cx="272" cy="236" r="9" fill="#fde68a" stroke="#d97706" stroke-width="2"/><path d="M278 236 L520 236" stroke="#fbbf24" stroke-width="22" stroke-linecap="round"/><path d="M520 236 L610 200 M520 236 L610 272" stroke="#fbbf24" stroke-width="16" stroke-linecap="round"/><rect x="340" y="218" width="110" height="36" rx="16" fill="#ef4444" opacity=".75"/><text x="395" y="172" font-size="16" fill="#7f1d1d" text-anchor="middle" font-weight="bold" direction="rtl" >التهاب خلف المقلة</text><text x="395" y="191" font-size="11.5" fill="#7f1d1d" text-anchor="middle" font-weight="normal" >inflamed segment (retrobulbar)</text><line x1="395" y1="200" x2="395" y2="216" stroke="#dc2626" stroke-width="3" /><polygon points="395,216 391.1,206.8 398.9,206.8" fill="#dc2626"/><text x="272" y="300" font-size="14" fill="#92400e" text-anchor="middle" font-weight="bold" direction="rtl" >القرص البصري يبدو طبيعيًا</text><text x="272" y="318" font-size="11.5" fill="#92400e" text-anchor="middle" font-weight="normal" >optic disc looks normal</text><line x1="272" y1="285" x2="272" y2="250" stroke="#d97706" stroke-width="3" /><polygon points="272,250 275.9,259.2 268.1,259.2" fill="#d97706"/><text x="190" y="350" font-size="14" fill="#334155" text-anchor="middle" font-weight="normal" direction="rtl" >العين اليمنى</text><text x="190" y="367" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal" >right eye</text><text x="650" y="290" font-size="14" fill="#334155" text-anchor="middle" font-weight="normal" direction="rtl" >نحو الدماغ</text><text x="650" y="307" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal" >towards the brain</text><text x="560" y="120" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="bold" direction="rtl" >النتيجة: ضعف الحدّة، ضعف الألوان، بقعة مركزية</text><text x="560" y="138" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="normal" >Result: low acuity, washed-out colours, central scotoma</text><text x="400" y="425" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal" direction="rtl" >رسم توضيحي من إعداد الموقع — ليس صورة مريض</text><text x="400" y="442" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="normal" >Schematic illustration by the site — not a real patient image</text></svg>