<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 538" width="800" height="538" font-family="Tahoma, Arial, sans-serif"><defs><marker id="a" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs><rect width="800" height="538" rx="18" fill="#f1f5f9"/><text x="400" y="40" font-size="26" fill="#0f172a" font-weight="bold" text-anchor="middle" direction="rtl">ترتيب كتابة قصة مريض القلب</text><rect x="40" y="65" width="720" height="62" rx="12" fill="#fff" stroke="#1d4ed8" stroke-width="2.5"/><circle cx="725" cy="96" r="20" fill="#1d4ed8"/><text x="725" y="104" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle" direction="rtl">١</text><text x="690" y="92" font-size="22" fill="#1d4ed8" font-weight="bold" text-anchor="start" direction="rtl">البيانات الشخصية</text><text x="690" y="117" font-size="16" fill="#475569" font-weight="normal" text-anchor="start" direction="rtl">الاسم، السن، النوع، المهنة، السكن، الحالة الاجتماعية، العادات</text><line x1="725" y1="127" x2="725" y2="143" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="143" width="720" height="62" rx="12" fill="#fff" stroke="#0f766e" stroke-width="2.5"/><circle cx="725" cy="174" r="20" fill="#0f766e"/><text x="725" y="182" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle" direction="rtl">٢</text><text x="690" y="170" font-size="22" fill="#0f766e" font-weight="bold" text-anchor="start" direction="rtl">الشكوى</text><text x="690" y="195" font-size="16" fill="#475569" font-weight="normal" text-anchor="start" direction="rtl">أهم عرض ومدته بكلمات المريض</text><line x1="725" y1="205" x2="725" y2="221" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="221" width="720" height="62" rx="12" fill="#fff" stroke="#c2410c" stroke-width="2.5"/><circle cx="725" cy="252" r="20" fill="#c2410c"/><text x="725" y="260" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle" direction="rtl">٣</text><text x="690" y="248" font-size="22" fill="#c2410c" font-weight="bold" text-anchor="start" direction="rtl">القصة المرضية الحالية</text><text x="690" y="273" font-size="16" fill="#475569" font-weight="normal" text-anchor="start" direction="rtl">تحليل الشكوى، ثم أعراض القلب، ثم الأجهزة الأخرى، ثم الفحوصات والعلاج</text><line x1="725" y1="283" x2="725" y2="299" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="299" width="720" height="62" rx="12" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/><circle cx="725" cy="330" r="20" fill="#7c3aed"/><text x="725" y="338" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle" direction="rtl">٤</text><text x="690" y="326" font-size="22" fill="#7c3aed" font-weight="bold" text-anchor="start" direction="rtl">التاريخ المرضي السابق</text><text x="690" y="351" font-size="16" fill="#475569" font-weight="normal" text-anchor="start" direction="rtl">روماتيزم، سكر، ضغط، عمليات، نقل دم، أدوية، حساسية</text><line x1="725" y1="361" x2="725" y2="377" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="377" width="720" height="62" rx="12" fill="#fff" stroke="#b45309" stroke-width="2.5"/><circle cx="725" cy="408" r="20" fill="#b45309"/><text x="725" y="416" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle" direction="rtl">٥</text><text x="690" y="404" font-size="22" fill="#b45309" font-weight="bold" text-anchor="start" direction="rtl">التاريخ العائلي</text><text x="690" y="429" font-size="16" fill="#475569" font-weight="normal" text-anchor="start" direction="rtl">هل لدى أحد من الأسرة نفس الشكوى؟ قرابة الأبوين؟</text><line x1="725" y1="439" x2="725" y2="455" stroke="#475569" stroke-width="2.5" marker-end="url(#a)"/><rect x="40" y="455" width="720" height="62" rx="12" fill="#fff" stroke="#be123c" stroke-width="2.5"/><circle cx="725" cy="486" r="20" fill="#be123c"/><text x="725" y="494" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle" direction="rtl">٦</text><text x="690" y="482" font-size="22" fill="#be123c" font-weight="bold" text-anchor="start" direction="rtl">التاريخ الشهري (للسيدات)</text><text x="690" y="507" font-size="16" fill="#475569" font-weight="normal" text-anchor="start" direction="rtl">أول دورة، انتظامها، الحمل، موانع الحمل</text></svg>