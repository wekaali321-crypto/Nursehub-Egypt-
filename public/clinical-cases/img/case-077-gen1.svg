<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#51606f"/></marker></defs>
<rect width="800" height="450" fill="#fff"/>
<g text-anchor="middle">
<rect x="270" y="14" width="260" height="62" rx="14" fill="#fde8e6" stroke="#c0392b" stroke-width="2"/>
<text x="400" y="42" font-size="18" font-weight="700" fill="#7f1d1d">اشتباه بانصمام رئوي</text><text x="400" y="64" font-size="13" fill="#7f1d1d">Suspected PE: score with Wells</text>
<line x1="330" y1="76" x2="200" y2="130" stroke="#51606f" stroke-width="3" marker-end="url(#a)"/>
<line x1="470" y1="76" x2="600" y2="130" stroke="#51606f" stroke-width="3" marker-end="url(#a)"/>
<text x="215" y="98" font-size="14" fill="#1f7a52" font-weight="700" text-anchor="end">احتمال منخفض</text><text x="205" y="118" font-size="12" fill="#1f7a52" text-anchor="end">Low probability</text><text x="585" y="98" font-size="14" fill="#b36a0a" font-weight="700" text-anchor="start">احتمال متوسط أو مرتفع</text><text x="595" y="118" font-size="12" fill="#b36a0a" text-anchor="start">Moderate or high</text>
<rect x="60" y="130" width="280" height="62" rx="14" fill="#dff5ea" stroke="#2e9e6b" stroke-width="2"/>
<text x="200" y="158" font-size="17" font-weight="700" fill="#14532d">فحص ثنائي الدايمر</text><text x="200" y="179" font-size="13" fill="#14532d">D-dimer test</text>
<rect x="460" y="130" width="280" height="62" rx="14" fill="#fff3dc" stroke="#e08a1e" stroke-width="2"/>
<text x="600" y="158" font-size="17" font-weight="700" fill="#78350f">هيبارين + تصوير</text><text x="600" y="179" font-size="13" fill="#78350f">LMWH, then CTPA or V/Q</text>
<line x1="150" y1="192" x2="110" y2="258" stroke="#51606f" stroke-width="3" marker-end="url(#a)"/>
<line x1="250" y1="192" x2="290" y2="258" stroke="#51606f" stroke-width="3" marker-end="url(#a)"/>
<text x="108" y="222" font-size="13" fill="#1f7a52" font-weight="700" text-anchor="end">طبيعي</text><text x="108" y="238" font-size="12" fill="#1f7a52" text-anchor="end">Normal</text><text x="296" y="222" font-size="13" fill="#c0392b" font-weight="700" text-anchor="start">مرتفع</text><text x="296" y="238" font-size="12" fill="#c0392b" text-anchor="start">Raised</text>
<rect x="20" y="258" width="190" height="70" rx="14" fill="#eaf6ee" stroke="#2e9e6b" stroke-width="2"/>
<text x="115" y="287" font-size="16" font-weight="700" fill="#14532d">الانصمام مستبعد غالباً</text><text x="115" y="310" font-size="13" fill="#14532d">PE excluded in most</text>
<rect x="230" y="258" width="190" height="70" rx="14" fill="#fff3dc" stroke="#e08a1e" stroke-width="2"/>
<text x="325" y="287" font-size="16" font-weight="700" fill="#78350f">لا يؤكد شيئاً: صوّر</text><text x="325" y="310" font-size="13" fill="#78350f">Proves nothing: image</text>
<line x1="600" y1="192" x2="600" y2="258" stroke="#51606f" stroke-width="3" marker-end="url(#a)"/>
<rect x="470" y="258" width="260" height="70" rx="14" fill="#fde8e6" stroke="#c0392b" stroke-width="2"/>
<text x="600" y="287" font-size="16" font-weight="700" fill="#7f1d1d">إن تأكد: مميّعات 3 أشهر فأكثر</text><text x="600" y="310" font-size="13" fill="#7f1d1d">If confirmed: anticoagulate ≥ 3 months</text>
<text x="400" y="400" font-size="13" fill="#51606f">رسم توضيحي من إعداد الموقع — Site illustration</text>
