<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif">
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2d3d">CURB-65 — شدة ذات الرئة المكتسبة من المجتمع</text>
<text x="400" y="62" text-anchor="middle" font-size="14" fill="#51606f">(CURB-65: severity of community-acquired pneumonia)</text>
<g font-weight="700" text-anchor="middle">
<rect x="30" y="90" width="136" height="230" rx="12" fill="#2f80c9"/><text x="98" y="160" font-size="56" fill="#fff">C</text>
<rect x="176" y="90" width="136" height="230" rx="12" fill="#2e9e6b"/><text x="244" y="160" font-size="56" fill="#fff">U</text>
<rect x="322" y="90" width="136" height="230" rx="12" fill="#e08a1e"/><text x="390" y="160" font-size="56" fill="#fff">R</text>
<rect x="468" y="90" width="136" height="230" rx="12" fill="#c0392b"/><text x="536" y="160" font-size="56" fill="#fff">B</text>
<rect x="614" y="90" width="156" height="230" rx="12" fill="#6c4fb3"/><text x="692" y="160" font-size="56" fill="#fff">65</text>
</g>
<g text-anchor="middle" fill="#fff">
<text x="98" y="210" font-size="20" font-weight="700">ارتباك</text><text x="98" y="236" font-size="14">Confusion</text>
<text x="244" y="210" font-size="20" font-weight="700">اليوريا</text><text x="244" y="236" font-size="14">Urea</text><text x="244" y="272" font-size="16" font-weight="700">&gt; 7 mmol/L</text>
<text x="390" y="210" font-size="16" font-weight="700">التنفس</text><text x="390" y="236" font-size="14">Respiratory rate</text><text x="390" y="272" font-size="16" font-weight="700">≥ 30 /min</text>
<text x="536" y="205" font-size="16" font-weight="700">ضغط الدم</text><text x="536" y="228" font-size="14">Blood pressure</text><text x="536" y="260" font-size="12" font-weight="700">الانقباضي أقل من 90</text><text x="536" y="282" font-size="12" font-weight="700">أو الانبساطي 60 فأقل</text>
<text x="692" y="210" font-size="20" font-weight="700">العمر</text><text x="692" y="236" font-size="14">Age</text><text x="692" y="272" font-size="13" font-weight="700">65 سنة فأكثر</text>
</g>
<text x="400" y="372" text-anchor="middle" font-size="14" fill="#1f2d3d">أداة مساعدة لتحديد مكان العلاج، ولا تحل محل التقييم السريري الشامل</text>
<text x="400" y="394" text-anchor="middle" font-size="12" fill="#51606f">(an aid to deciding where to treat; it does not replace full clinical assessment)</text>
<text x="400" y="430" text-anchor="middle" font-size="13" fill="#51606f">رسم توضيحي من إعداد الموقع (site illustration)</text>
</svg>
