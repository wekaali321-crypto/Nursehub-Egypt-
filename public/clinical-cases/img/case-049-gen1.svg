<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><rect width="800" height="450" fill="#f8fafc"/><text x="400" y="34" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="bold" direction="rtl" >لماذا يكون المفصل المصاب بالروماتويد عرضة للعدوى؟</text><text x="400" y="58" font-size="14" fill="#475569" text-anchor="middle" font-weight="normal" >Why a rheumatoid joint is open to infection</text><path d="M470 90 Q540 90 560 150 L560 230 Q520 245 490 220 L470 160Z" fill="#e5e7eb" stroke="#6b7280" stroke-width="3"/><circle cx="430" cy="235" r="62" fill="#fde68a" stroke="#d97706" stroke-width="3"/><path d="M395 290 L380 380 L460 380 L450 290Z" fill="#fde68a" stroke="#d97706" stroke-width="3"/><path d="M470 190 Q500 225 470 285" fill="none" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/><circle cx="492" cy="215" r="6" fill="#16a34a"/><circle cx="500" cy="240" r="6" fill="#16a34a"/><circle cx="492" cy="265" r="6" fill="#16a34a"/><text x="600" y="250" font-size="14" fill="#7f1d1d" text-anchor="end" font-weight="bold" direction="rtl" >التهاب وجراثيم داخل المفصل</text><text x="600" y="268" font-size="11.5" fill="#7f1d1d" text-anchor="start" font-weight="normal" >infection inside the joint</text><line x1="595" y1="245" x2="515" y2="240" stroke="#dc2626" stroke-width="3" /><polygon points="515,240 524.4,236.7 523.9,244.5" fill="#dc2626"/><rect x="40" y="88" width="270" height="50" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" /><text x="175" y="108" font-size="14" fill="#7f1d1d" text-anchor="middle" font-weight="bold" direction="rtl" >التهاب الروماتويد نفسه</text><text x="175" y="126" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="normal" >the underlying inflammation</text><line x1="312" y1="113" x2="380" y2="188.0" stroke="#ef4444" stroke-width="2.5" /><polygon points="380,188.0 370.9,183.8 376.7,178.6" fill="#ef4444"/><rect x="40" y="150" width="270" height="50" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" /><text x="175" y="170" font-size="14" fill="#7f1d1d" text-anchor="middle" font-weight="bold" direction="rtl" >قلة الحركة</text><text x="175" y="188" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="normal" >immobility</text><line x1="312" y1="175" x2="380" y2="206.0" stroke="#ef4444" stroke-width="2.5" /><polygon points="380,206.0 370.0,205.7 373.2,198.6" fill="#ef4444"/><rect x="40" y="212" width="270" height="50" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" /><text x="175" y="232" font-size="14" fill="#7f1d1d" text-anchor="middle" font-weight="bold" direction="rtl" >الستيرويدات والميثوتريكسات</text><text x="175" y="250" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="normal" >steroids and methotrexate</text><line x1="312" y1="237" x2="380" y2="224.0" stroke="#ef4444" stroke-width="2.5" /><polygon points="380,224.0 371.7,229.6 370.2,221.9" fill="#ef4444"/><rect x="40" y="274" width="270" height="50" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" /><text x="175" y="294" font-size="14" fill="#7f1d1d" text-anchor="middle" font-weight="bold" direction="rtl" >أمراض مرافقة مثل الكلى المزمنة</text><text x="175" y="312" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="normal" >co-morbidity (e.g. CKD)</text><line x1="312" y1="299" x2="380" y2="242.0" stroke="#ef4444" stroke-width="2.5" /><polygon points="380,242.0 375.4,250.9 370.4,244.9" fill="#ef4444"/><text x="570" y="340" font-size="14" fill="#0f172a" text-anchor="end" font-weight="bold" direction="rtl" >قد تبقى كريات الدم البيض طبيعية</text><text x="570" y="358" font-size="11.5" fill="#475569" text-anchor="start" font-weight="normal" >The white count can stay normal</text><text x="400" y="425" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal" direction="rtl" >رسم توضيحي من إعداد الموقع — ليس صورة مريض</text><text x="400" y="442" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="normal" >Schematic illustration by the site — not a real patient image</text></svg>