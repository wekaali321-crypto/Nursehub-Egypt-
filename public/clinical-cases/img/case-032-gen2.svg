<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif">
<rect width="800" height="450" fill="#f8fafc"/>
<text x="400" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">الأزمة الوهنية: قرار في دقائق</text>
<text x="400" y="54" text-anchor="middle" font-size="13" fill="#475569">Myasthenic crisis: decisions in minutes</text>
<rect x="260" y="75" width="280" height="62" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="400" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">صعوبة بلع وتنفس سريع وسطحي</text><text x="400" y="121" text-anchor="middle" font-size="12" fill="#991b1b">RR 28, shallow, weak swallow</text>
<line x1="400" y1="137" x2="400" y2="165" stroke="#475569" stroke-width="3"/><polygon points="400,175 391,160 409,160" fill="#475569"/>
<rect x="240" y="180" width="320" height="55" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="400" y="204" text-anchor="middle" font-size="14" font-weight="bold" fill="#854d0e">نقيس السعة الحيوية القسرية</text><text x="400" y="224" text-anchor="middle" font-size="12" fill="#854d0e">measure forced vital capacity (FVC)</text>
<line x1="330" y1="235" x2="180" y2="270" stroke="#475569" stroke-width="3"/><line x1="470" y1="235" x2="620" y2="270" stroke="#475569" stroke-width="3"/>
<rect x="40" y="275" width="280" height="90" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="180" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">15 مل/كغ أو أقل</text><text x="180" y="324" text-anchor="middle" font-size="12" fill="#991b1b">يحتاج جهاز تنفس اصطناعي</text><text x="180" y="346" text-anchor="middle" font-size="11" fill="#991b1b">needs mechanical ventilation</text>
<rect x="480" y="275" width="280" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="620" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">فوق هذا الحد</text><text x="620" y="324" text-anchor="middle" font-size="12" fill="#1e3a8a">رعاية مركزة ومتابعة السعة كل فترة</text><text x="620" y="346" text-anchor="middle" font-size="11" fill="#1e3a8a">ICU, serial FVC, ready to intubate</text>
<rect x="150" y="385" width="500" height="45" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="400" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">في الحالتين: غلوبولين مناعي وريدي أو تبديل البلازما</text><text x="400" y="421" text-anchor="middle" font-size="11" fill="#166534">in both: IV immunoglobulin or plasma exchange</text>
</svg>