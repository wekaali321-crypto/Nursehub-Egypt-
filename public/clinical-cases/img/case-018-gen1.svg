<text x="315" y="140" text-anchor="middle" font-size="12" fill="#9a3412">bloody diarrhoea</text>
<text x="315" y="160" text-anchor="middle" font-size="12" fill="#9a3412">مع قيء وألم بطن</text>
<line x1="390" y1="130" x2="435" y2="130" stroke="#475569" stroke-width="3"/><polygon points="445,130 431,122 431,138" fill="#475569"/>
