<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif">
<rect width="800" height="450" fill="#f8fafc"/>
<text x="400" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">مسار المرض: من الأمعاء إلى الكلى</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="#475569">From gut infection to kidney failure</text>
<rect x="30" y="85" width="150" height="90" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="105" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">طعام ملوّث</text>
<text x="105" y="140" text-anchor="middle" font-size="12" fill="#7f1d1d">contaminated food</text>
<text x="105" y="160" text-anchor="middle" font-size="12" fill="#7f1d1d">E. coli O157</text>
<line x1="180" y1="130" x2="225" y2="130" stroke="#475569" stroke-width="3"/><polygon points="235,130 221,122 221,138" fill="#475569"/>
<rect x="240" y="85" width="150" height="90" rx="16" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
