<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif">
<rect width="800" height="450" fill="#f8fafc"/>
<text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">ثالوث HUS (the HUS triad)</text>
<rect x="290" y="60" width="220" height="70" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="400" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">إسهال دموي (bloody diarrhoea)</text>
<text x="400" y="112" text-anchor="middle" font-size="13" fill="#7f1d1d">E. coli O157</text>
<line x1="400" y1="130" x2="400" y2="165" stroke="#475569" stroke-width="3"/>
<polygon points="400,175 390,160 410,160" fill="#475569"/>
<rect x="60" y="190" width="200" height="110" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="160" y="225" text-anchor="middle" font-size="17" font-weight="bold" fill="#075985">انحلال الدم</text><text x="160" y="248" text-anchor="middle" font-size="13" fill="#075985">haemolysis</text><text x="160" y="276" text-anchor="middle" font-size="13" fill="#334155">Hb 8 + شظايا كريات</text>
<rect x="300" y="190" width="200" height="110" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="400" y="225" text-anchor="middle" font-size="17" font-weight="bold" fill="#854d0e">نقص الصفيحات</text><text x="400" y="248" text-anchor="middle" font-size="13" fill="#854d0e">thrombocytopenia</text><text x="400" y="276" text-anchor="middle" font-size="13" fill="#334155">الصفيحات 48</text>
<rect x="540" y="190" width="200" height="110" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="640" y="225" text-anchor="middle" font-size="17" font-weight="bold" fill="#5b21b6">قصور كلوي</text><text x="640" y="248" text-anchor="middle" font-size="13" fill="#5b21b6">renal failure</text><text x="640" y="276" text-anchor="middle" font-size="13" fill="#334155">الكرياتينين 280، K 7.2</text>
<line x1="400" y1="165" x2="160" y2="190" stroke="#475569" stroke-width="2"/><line x1="400" y1="165" x2="640" y2="190" stroke="#475569" stroke-width="2"/>
<rect x="150" y="340" width="500" height="64" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="400" y="368" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">الخطوة الأولى: فرط البوتاسيوم ← غلوكونات الكالسيوم</text>
<text x="400" y="390" text-anchor="middle" font-size="13" fill="#9a3412">first step: hyperkalaemia, calcium gluconate</text>
</svg>
