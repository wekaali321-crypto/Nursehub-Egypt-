<text x="525" y="140" text-anchor="middle" font-size="12" fill="#854d0e">toxin damages</text>
<text x="525" y="160" text-anchor="middle" font-size="12" fill="#854d0e">small vessels</text>
<line x1="525" y1="175" x2="525" y2="205" stroke="#475569" stroke-width="3"/>
<line x1="150" y1="205" x2="650" y2="205" stroke="#475569" stroke-width="3"/>
<line x1="150" y1="205" x2="150" y2="235" stroke="#475569" stroke-width="3"/><polygon points="150,245 142,231 158,231" fill="#475569"/>
<line x1="400" y1="205" x2="400" y2="235" stroke="#475569" stroke-width="3"/><polygon points="400,245 392,231 408,231" fill="#475569"/>
<line x1="650" y1="205" x2="650" y2="235" stroke="#475569" stroke-width="3"/><polygon points="650,245 642,231 658,231" fill="#475569"/>
<rect x="55" y="250" width="190" height="105" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="150" y="282" text-anchor="middle" font-size="16" font-weight="bold" fill="#075985">كريات حمراء ممزّقة</text>
<text x="150" y="303" text-anchor="middle" font-size="12" fill="#075985">haemolysis</text>
<text x="150" y="330" text-anchor="middle" font-size="13" fill="#334155">Hb 8 g/dl</text>
<rect x="305" y="250" width="190" height="105" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="400" y="282" text-anchor="middle" font-size="16" font-weight="bold" fill="#5b21b6">صفيحات تُستهلك</text>
<text x="400" y="303" text-anchor="middle" font-size="12" fill="#5b21b6">thrombocytopenia</text>
<text x="400" y="330" text-anchor="middle" font-size="13" fill="#334155">48 ×10⁹/L</text>
<rect x="555" y="250" width="190" height="105" rx="16" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
<text x="650" y="282" text-anchor="middle" font-size="16" font-weight="bold" fill="#9d174d">كلى تتوقف</text>
<text x="650" y="303" text-anchor="middle" font-size="12" fill="#9d174d">acute renal failure</text>
<text x="650" y="330" text-anchor="middle" font-size="13" fill="#334155">Cr 280 · K 7.2</text>
<rect x="150" y="385" width="500" height="44" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="400" y="413" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">الخطر الفوري: البوتاسيوم المرتفع يهدد نظم القلب</text>
