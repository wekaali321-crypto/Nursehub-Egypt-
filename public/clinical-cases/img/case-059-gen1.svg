<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><rect width="800" height="450" fill="#ffffff"/><text x="400" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2d3d">خمس شوارد منخفضة في آن واحد</text><text x="400" y="64" text-anchor="middle" font-size="15" font-weight="400" fill="#51606f" >قيمة كل شاردة كنسبة من الحد الأدنى الطبيعي (100% = الحد الأدنى)</text><line x1="720" y1="90" x2="720" y2="390" stroke="#2f7d4f" stroke-width="2" stroke-dasharray="6 5"/><text x="720" y="84" text-anchor="middle" font-size="13" font-weight="400" fill="#2f7d4f" >الحد الأدنى الطبيعي</text><rect x="200" y="100" width="520" height="32" rx="8" fill="#eef2f7" stroke="none" stroke-width="1"/><rect x="200" y="100" width="493.03703703703707" height="32" rx="8" fill="#d64545" stroke="none" stroke-width="1"/><text x="683.0370370370371" y="122" text-anchor="end" font-size="15" font-weight="700" fill="#fff" >95%</text><text x="180" y="122" text-anchor="end" font-size="16" font-weight="700" fill="#1f2d3d" >الصوديوم</text><rect x="200" y="158" width="520" height="32" rx="8" fill="#eef2f7" stroke="none" stroke-width="1"/><rect x="200" y="158" width="445.71428571428567" height="32" rx="8" fill="#d64545" stroke="none" stroke-width="1"/><text x="635.7142857142857" y="180" text-anchor="end" font-size="15" font-weight="700" fill="#fff" >86%</text><text x="180" y="180" text-anchor="end" font-size="16" font-weight="700" fill="#1f2d3d" >البوتاسيوم</text><rect x="200" y="216" width="520" height="32" rx="8" fill="#eef2f7" stroke="none" stroke-width="1"/><rect x="200" y="216" width="472.7272727272727" height="32" rx="8" fill="#d64545" stroke="none" stroke-width="1"/><text x="662.7272727272727" y="238" text-anchor="end" font-size="15" font-weight="700" fill="#fff" >91%</text><text x="180" y="238" text-anchor="end" font-size="16" font-weight="700" fill="#1f2d3d" >الكالسيوم المصحَّح</text><rect x="200" y="274" width="520" height="32" rx="8"