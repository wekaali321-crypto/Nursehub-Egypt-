<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><rect width="800" height="450" fill="#ffffff"/><text x="400" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2d3d">معايير المتلازمة الخبيثة ومريضنا</text><rect x="40" y="70" width="350" height="330" rx="16" fill="#fdeeee" stroke="#d64545" stroke-width="2"/><text x="215" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#b02a2a" >معايير كبرى (يلزم ثلاثة)</text><rect x="60" y="135" width="310" height="40" rx="10" fill="#fff" stroke="#e4b4b4" stroke-width="1"/><text x="335" y="162" text-anchor="end" font-size="17" font-weight="700" fill="#1f2d3d" >حمى</text><text x="90" y="163" text-anchor="middle" font-size="22" font-weight="400" fill="#2f7d4f" >✔</text><rect x="60" y="185" width="310" height="40" rx="10" fill="#fff" stroke="#e4b4b4" stroke-width="1"/><text x="335" y="212" text-anchor="end" font-size="17" font-weight="700" fill="#1f2d3d" >تيبس عضلي</text><text x="90" y="213" text-anchor="middle" font-size="22" font-weight="400" fill="#2f7d4f" >✔</text><rect x="60" y="235" width="310" height="40" rx="10" fill="#fff" stroke="#e4b4b4" stroke-width="1"/><text x="335" y="262" text-anchor="end" font-size="17" font-weight="700" fill="#1f2d3d" >ارتفاع كرياتين كيناز</text><text x="90" y="263" text-anchor="middle" font-size="22" font-weight="400" fill="#2f7d4f" >✔</text><text x="215" y="320" text-anchor="middle" font-size="17" font-weight="700" fill="#2f7d4f" >مريضنا: ثلاثة من ثلاثة</text><rect x="410" y="70" width="350" height="330" rx="16" fill="#e8f0ff" stroke="#4b7bec" stroke-width="2"/><text x="585" y="100" text-anchor="middle" font-size="18" font-weight="700" fill="#2c4fb0" >معايير صغرى</text><rect x="430" y="115" width="310" height="36" rx="10" fill="#fff" stroke="#b8c9ee" stroke-width="1"/><text x="715" y="140" text-anchor="end" font-size="16" font-weight="700" fill="#1f2d3d" >تسرع قلب</text><text x="460" y="141" text-anchor="middle" font-size="20" font-weight="400" fill="#2f7d4f" >✔</text><rect x="430" y="158" width="310" height="36" rx="10" fill="#fff" stroke="#b8c9ee" stroke-width="1"/><text x="715" y="183" text-anchor="end" font-size="16" font-weight="700" fill="#1f2d3d" >اضطراب الوعي</text><text x="460" y="184" text-anchor="middle" font-size="20" font-weight="400" fill="#2f7d4f" >✔</text><rect x="430" y="201" width="310" height="36" rx="10" fill="#fff" stroke="#b8c9ee" stroke-width="1"/><text x="715" y="226" text-anchor="end" font-size="16" font-weight="700" fill="#1f2d3d" >زيادة الكريات البيض</text><text x="460" y="227" text-anchor="middle" font-size="20" font-weight="400" fill="#2f7d4f" >✔</text><rect x="430" y="244" width="310" height="36" rx="10" fill="#fff" stroke="#b8c9ee" stroke-width="1"/><text x="715" y="269" text-anchor="end" font-size="16" font-weight="700" fill="#1f2d3d" >اضطراب الضغط</text><text x="460" y="270" text-anchor="middle" font-size="20" font-weight="400" fill="#8da0b4" >—</text><rect x="430" y="287" width="310" height="36" rx="10" fill="#fff" stroke="#b8c9ee" stroke-width="1"/><text x="715" y="312" text-anchor="end" font-size="16" font-weight="700" fill="#1f2d3d" >تسرع تنفس</text><text x="460" y="313" text-anchor="middle" font-size="20" font-weight="400" fill="#8da0b4" >—</text><rect x="430" y="330" width="310" height="36" rx="10" fill="#fff" stroke="#b8c9ee" stroke-width="1"/><text x="715" y="355" text-anchor="end" font-size="16" font-weight="700" fill="#1f2d3d" >تعرق شديد</text><text x="460" y="356" text-anchor="middle" font-size="20" font-weight="400" fill="#8da0b4" >—</text><text x="585" y="385" text-anchor="middle" font-size="13" font-weight="400" fill="#51606f" >✔ موجود    — غير مذكور في المصدر</text><text x="400" y="432" text-anchor="middle" font-size="14" font-weight="400" fill="#51606f" >التشخيص: ثلاثة كبرى، أو اثنان كبيران مع أربعة صغرى</text></svg>