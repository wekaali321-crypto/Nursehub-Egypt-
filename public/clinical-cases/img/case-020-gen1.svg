<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif">
<rect width="800" height="450" fill="#f8fafc"/>
<text x="400" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">شلل يصعد من القدمين نحو الحجاب الحاجز</text>
<text x="400" y="54" text-anchor="middle" font-size="13" fill="#475569">Ascending weakness heading for the diaphragm</text>
<circle cx="200" cy="100" r="28" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<rect x="160" y="132" width="80" height="130" rx="30" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<rect x="110" y="136" width="44" height="100" rx="20" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<rect x="246" y="136" width="44" height="100" rx="20" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
<rect x="162" y="258" width="34" height="150" rx="16" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
<rect x="204" y="258" width="34" height="150" rx="16" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
<rect x="165" y="190" width="70" height="14" rx="7" fill="#fca5a5"/>
<path d="M200 400 L200 300" stroke="#dc2626" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/>
<path d="M200 270 L200 215" stroke="#b91c1c" stroke-width="6" stroke-linecap="round"/><polygon points="200,170 186,210 214,210" fill="#b91c1c"/>
<path d="M170 168 Q200 150 230 168" fill="none" stroke="#2563eb" stroke-width="4"/>
<text x="200" y="440" text-anchor="middle" font-size="11" fill="#64748b">schematic body, not a real patient</text>
<line x1="256" y1="170" x2="330" y2="150" stroke="#2563eb" stroke-width="2"/>
<rect x="335" y="125" width="270" height="56" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="470" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">الحجاب الحاجز: الخطر الأكبر</text>
<text x="470" y="169" text-anchor="middle" font-size="12" fill="#1e3a8a">diaphragm: respiratory arrest risk</text>
<line x1="238" y1="197" x2="330" y2="230" stroke="#dc2626" stroke-width="2"/>
<rect x="335" y="205" width="270" height="56" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="470" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">الضعف يصعد: ساقان ثم أعلى</text>
<text x="470" y="249" text-anchor="middle" font-size="12" fill="#991b1b">weakness climbs from the feet</text>
<line x1="238" y1="350" x2="330" y2="320" stroke="#475569" stroke-width="2"/>
<rect x="335" y="290" width="270" height="62" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="470" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#854d0e">تنميل وغياب المنعكسات في الساقين</text>
<text x="470" y="337" text-anchor="middle" font-size="12" fill="#854d0e">numbness, absent knee and ankle reflexes</text>
<rect x="335" y="370" width="270" height="52" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="470" y="393" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">قياس السعة الحيوية كل 4 ساعات</text>
<text x="470" y="411" text-anchor="middle" font-size="12" fill="#166534">spirometry every 4 hours</text>
</svg>