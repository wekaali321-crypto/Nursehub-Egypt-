<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif">
<rect width="800" height="450" fill="#f8fafc"/>
<text x="400" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">سرعة تصحيح الصوديوم (Sodium correction speed)</text>
<line x1="90" y1="380" x2="740" y2="380" stroke="#475569" stroke-width="2"/>
<line x1="90" y1="380" x2="90" y2="70" stroke="#475569" stroke-width="2"/>
<g font-size="14" fill="#475569" text-anchor="end"><text x="80" y="384">110</text><text x="80" y="301">120</text><text x="80" y="218">130</text><text x="80" y="136">140</text></g>
<rect x="91" y="90" width="649" height="83" fill="#dcfce7" opacity="0.7"/>
<text x="730" y="84" font-size="13" fill="#15803d" text-anchor="end">المجال الطبيعي 135-145 (normal range)</text>
<circle cx="190" cy="347" r="9" fill="#dc2626"/><text x="190" y="330" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold">114</text>
<text x="260" y="365" font-size="13" fill="#334155">عند القبول (admission)</text>
<circle cx="560" cy="148" r="9" fill="#d97706"/><text x="560" y="130" font-size="15" text-anchor="middle" fill="#d97706" font-weight="bold">138</text>
<text x="430" y="200" font-size="13" fill="#334155">بعد 24 ساعة (24 h later)</text>
<line x1="198" y1="343" x2="552" y2="152" stroke="#d97706" stroke-width="4"/>
<line x1="140" y1="347" x2="140" y2="264" stroke="#16a34a" stroke-width="5"/>
<text x="150" y="300" font-size="13" fill="#16a34a">+10 الحد الآمن</text><text x="150" y="318" font-size="12" fill="#16a34a">(safe limit)</text>
<line x1="620" y1="347" x2="620" y2="148" stroke="#dc2626" stroke-width="3"/><line x1="610" y1="347" x2="630" y2="347" stroke="#dc2626" stroke-width="3"/><line x1="610" y1="148" x2="630" y2="148" stroke="#dc2626" stroke-width="3"/>
<text x="635" y="252" font-size="16" fill="#dc2626" font-weight="bold">+24</text>
<text x="400" y="425" text-anchor="middle" font-size="14" fill="#334155">الحد الأقصى: 10 ملمول/ل يومياً (max 10 mmol/L per day)</text>
</svg>
