<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif">
<rect width="800" height="450" fill="#f8fafc"/>
<text x="400" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">لماذا تنهار عند المشي السريع؟</text>
<text x="400" y="54" text-anchor="middle" font-size="13" fill="#475569">Why does she collapse when she walks briskly?</text>
<path d="M110 120 C60 140 60 260 110 300 C170 340 250 300 250 220 C250 150 190 90 110 120 Z" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/>
<text x="150" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#7f1d1d">البطين الأيسر</text><text x="150" y="235" text-anchor="middle" font-size="12" fill="#7f1d1d">left ventricle</text>
<rect x="245" y="165" width="26" height="30" fill="#e2e8f0" stroke="#475569"/><path d="M247 165 L268 180 L247 195" fill="#334155"/>
<text x="258" y="150" text-anchor="middle" font-size="12" fill="#334155">valve</text>
<path d="M271 180 C330 180 360 120 400 90" fill="none" stroke="#dc2626" stroke-width="16" stroke-linecap="round" opacity=".8"/>
<text x="330" y="215" text-anchor="middle" font-size="13" fill="#991b1b">الصمام الأبهري ضيّق</text><text x="330" y="233" text-anchor="middle" font-size="12" fill="#991b1b">narrowed aortic valve</text>
<circle cx="430" cy="75" r="26" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/><text x="430" y="80" text-anchor="middle" font-size="12" fill="#854d0e">brain</text>
<rect x="480" y="95" width="280" height="70" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="620" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">المجهود: تتمدد أوعية العضلات</text><text x="620" y="143" text-anchor="middle" font-size="12" fill="#991b1b">exercise: muscle vessels dilate, output should rise</text>
<rect x="480" y="185" width="280" height="70" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="620" y="212" text-anchor="middle" font-size="14" font-weight="bold" fill="#854d0e">الضيق يمنع زيادة النتاج القلبي</text><text x="620" y="233" text-anchor="middle" font-size="12" fill="#854d0e">stenosis: cardiac output cannot rise</text>
<rect x="480" y="275" width="280" height="70" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="620" y="302" text-anchor="middle" font-size="14" font-weight="bold" fill="#5b21b6">ينخفض ضخ الدم إلى الدماغ</text><text x="620" y="323" text-anchor="middle" font-size="12" fill="#5b21b6">cerebral perfusion falls: dizziness, faint</text>
<rect x="60" y="360" width="700" height="60" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="410" y="386" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">العلاج الجذري: استبدال الصمام، أو زرعه بالقسطرة عند الهشّين</text>
<text x="410" y="406" text-anchor="middle" font-size="12" fill="#166534">definitive: valve replacement, or transcatheter implantation if frail</text>
</svg>