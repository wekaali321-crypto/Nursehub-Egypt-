<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif">
<rect width="800" height="450" fill="#f8fafc"/>
<text x="400" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">طريقان من الأذين إلى البطين</text>
<text x="400" y="54" text-anchor="middle" font-size="13" fill="#475569">Two roads from atrium to ventricle</text>
<ellipse cx="250" cy="130" rx="150" ry="50" fill="#fecaca" stroke="#b91c1c" stroke-width="2.5"/><text x="250" y="136" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">الأذينان</text>
<ellipse cx="250" cy="330" rx="150" ry="60" fill="#fda4af" stroke="#9f1239" stroke-width="2.5"/><text x="250" y="336" text-anchor="middle" font-size="15" font-weight="bold" fill="#881337">البطينان</text>
<rect x="165" y="185" width="170" height="40" rx="10" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/><text x="250" y="210" text-anchor="middle" font-size="13" fill="#854d0e">العقدة الأذينية البطينية</text>
<line x1="250" y1="225" x2="250" y2="270" stroke="#ca8a04" stroke-width="5"/>
<path d="M375 140 C420 190 420 270 375 320" fill="none" stroke="#7c3aed" stroke-width="7" stroke-linecap="round"/>
<text x="418" y="235" font-size="14" font-weight="bold" fill="#5b21b6">مسار إضافي</text><text x="418" y="254" font-size="11" fill="#5b21b6">accessory pathway</text>
<text x="250" y="262" text-anchor="middle" font-size="12" fill="#854d0e" transform="translate(40 0)"> </text>
<rect x="520" y="90" width="250" height="100" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="645" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">في الإيقاع الجيبي</text><text x="645" y="140" text-anchor="middle" font-size="12" fill="#1e3a8a">الطريقان معاً فيقصر الفاصل</text><text x="645" y="160" text-anchor="middle" font-size="12" fill="#1e3a8a">وتميل بداية المركّب (دلتا)</text><text x="645" y="180" text-anchor="middle" font-size="11" fill="#1e3a8a">short PR + delta wave</text>
<rect x="520" y="210" width="250" height="110" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="645" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">عند الرجفان الأذيني</text><text x="645" y="260" text-anchor="middle" font-size="12" fill="#991b1b">العقدة الأذينية تبطّئ الإشارات</text><text x="645" y="280" text-anchor="middle" font-size="12" fill="#991b1b">لكن المسار الإضافي لا يفعل</text><text x="645" y="302" text-anchor="middle" font-size="11" fill="#991b1b">rapid ventricular rate, collapse</text>
<rect x="520" y="340" width="250" height="80" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="645" y="368" text-anchor="middle" font-size="13" font-weight="bold" fill="#9a3412">لا تعطِ حاصرات العقدة الأذينية البطينية</text><text x="645" y="388" text-anchor="middle" font-size="11" fill="#9a3412">no digoxin, adenosine, CCB, beta-blocker</text><text x="645" y="406" text-anchor="middle" font-size="11" fill="#9a3412">when the rhythm is AF</text>
</svg>