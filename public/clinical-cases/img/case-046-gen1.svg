<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><rect width="800" height="450" fill="#f8fafc"/><text x="400" y="34" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="bold" direction="rtl" >خريطة الجسم: ماذا وجدنا عند مريضنا؟</text><text x="400" y="58" font-size="14" fill="#475569" text-anchor="middle" font-weight="normal" >Body map: what we found in this patient</text><circle cx="400" cy="120" r="34" fill="#fca5a5" stroke="#dc2626" stroke-width="3"/><rect x="372" y="150" width="56" height="20" fill="#fca5a5"/><path d="M330 172 Q400 160 470 172 L490 300 L455 300 L450 390 L420 390 L400 320 L380 390 L350 390 L345 300 L310 300 Z" fill="#fca5a5" stroke="#dc2626" stroke-width="3"/><path d="M330 172 L270 290 L292 300 L345 210" fill="#fca5a5" stroke="#dc2626" stroke-width="3"/><path d="M470 172 L530 290 L508 300 L455 210" fill="#fca5a5" stroke="#dc2626" stroke-width="3"/><line x1="390" y1="160" x2="225" y2="136" stroke="#475569" stroke-width="2" /><circle cx="390" cy="160" r="9" fill="#1d4ed8" stroke="#fff" stroke-width="2"/><text x="215" y="140" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold" direction="rtl" >عقد الرقبة المتضخمة</text><text x="215" y="157" font-size="11" fill="#475569" text-anchor="end" font-weight="normal" >Enlarged neck nodes</text><line x1="345" y1="195" x2="225" y2="211" stroke="#475569" stroke-width="2" /><circle cx="345" cy="195" r="9" fill="#1d4ed8" stroke="#fff" stroke-width="2"/><text x="215" y="215" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold" direction="rtl" >عقد الإبط المتضخمة</text><text x="215" y="232" font-size="11" fill="#475569" text-anchor="end" font-weight="normal" >Enlarged axillary nodes</text><line x1="385" y1="250" x2="225" y2="286" stroke="#475569" stroke-width="2" /><circle cx="385" cy="250" r="9" fill="#7c3aed" stroke="#fff" stroke-width="2"/><text x="215" y="290" font-size="15" fill="#0f172a" text-anchor="start" font-weight="bold" direction="rtl" >تضخم الكبد والطحال</text><text x="215" y="307" font-size="11" fill="#475569" text-anchor="end" font-weight="normal" >Hepatosplenomegaly</text><line x1="400" y1="100" x2="575" y2="91" stroke="#475569" stroke-width="2" /><circle cx="400" cy="100" r="9" fill="#374151" stroke="#fff" stroke-width="2"/><text x="585" y="95" font-size="15" fill="#0f172a" text-anchor="end" font-weight="bold" direction="rtl" >تساقط الشعر</text><text x="585" y="112" font-size="11" fill="#475569" text-anchor="start" font-weight="normal" >Alopecia</text><line x1="400" y1="230" x2="575" y2="181" stroke="#475569" stroke-width="2" /><circle cx="400" cy="230" r="9" fill="#dc2626" stroke="#fff" stroke-width="2"/><text x="585" y="185" font-size="15" fill="#0f172a" text-anchor="end" font-weight="bold" direction="rtl" >احمرار الجلد كله</text><text x="585" y="202" font-size="11" fill="#475569" text-anchor="start" font-weight="normal" >Whole-skin redness (erythroderma)</text><line x1="286" y1="295" x2="575" y2="341" stroke="#475569" stroke-width="2" /><circle cx="286" cy="295" r="9" fill="#b45309" stroke="#fff" stroke-width="2"/><text x="585" y="345" font-size="15" fill="#0f172a" text-anchor="end" font-weight="bold" direction="rtl" >راحتان وأخمصان متثخنان</text><text x="585" y="362" font-size="11" fill="#475569" text-anchor="start" font-weight="normal" >Thickened palms and soles</text><text x="400" y="425" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal" direction="rtl" >رسم توضيحي من إعداد الموقع — ليس صورة مريض</text><text x="400" y="442" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="normal" >Schematic illustration by the site — not a real patient image</text></svg>