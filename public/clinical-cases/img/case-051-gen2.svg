<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><rect width="800" height="450" fill="#f8fafc"/><text x="400" y="34" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="bold" direction="rtl" >المنطق: صوديوم منخفض مع صوديوم بولي مستمر</text><text x="400" y="58" font-size="14" fill="#475569" text-anchor="middle" font-weight="normal" >Reasoning: low blood sodium, sodium still in the urine</text><rect x="40" y="150" width="160" height="100" rx="18" fill="#dbeafe" stroke="#1e40af" stroke-width="3" /><text x="120" y="195" font-size="15" fill="#1e40af" text-anchor="middle" font-weight="bold" direction="rtl" >صوديوم الدم 125</text><text x="120" y="218" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="normal" >blood Na 125 mmol/L</text><line x1="202" y1="200" x2="228" y2="200" stroke="#475569" stroke-width="3" /><polygon points="228,200 218.8,203.9 218.8,196.1" fill="#475569"/><rect x="230" y="150" width="160" height="100" rx="18" fill="#dcfce7" stroke="#166534" stroke-width="3" /><text x="310" y="195" font-size="15" fill="#166534" text-anchor="middle" font-weight="bold" direction="rtl" >حجم السوائل طبيعي</text><text x="310" y="218" font-size="11" fill="#166534" text-anchor="middle" font-weight="normal" >looks euvolaemic</text><line x1="392" y1="200" x2="418" y2="200" stroke="#475569" stroke-width="3" /><polygon points="418,200 408.8,203.9 408.8,196.1" fill="#475569"/><rect x="420" y="150" width="160" height="100" rx="18" fill="#fef3c7" stroke="#92400e" stroke-width="3" /><text x="500" y="195" font-size="15" fill="#92400e" text-anchor="middle" font-weight="bold" direction="rtl" >صوديوم البول 45</text><text x="500" y="218" font-size="11" fill="#92400e" text-anchor="middle" font-weight="normal" >urine sodium 45 mmol/L</text><line x1="582" y1="200" x2="608" y2="200" stroke="#475569" stroke-width="3" /><polygon points="608,200 598.8,203.9 598.8,196.1" fill="#475569"/><rect x="610" y="150" width="160" height="100" rx="18" fill="#fee2e2" stroke="#991b1b" stroke-width="3" /><text x="690" y="195" font-size="15" fill="#991b1b" text-anchor="middle" font-weight="bold" >SIADH</text><text x="690" y="218" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="normal" >inappropriate ADH</text><text x="400" y="300" font-size="16" fill="#0f172a" text-anchor="middle" font-weight="bold" direction="rtl" >ثم نبحث عن السبب: الدماغ، الرئة، الأدوية</text><text x="400" y="322" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal" >then look for the cause: brain, lung, drugs</text><text x="400" y="360" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="normal" direction="rtl" >هنا: ورم دموي تحت الجافية يُرى بالتصوير المقطعي</text><text x="400" y="378" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal" >Here: a subdural haematoma on CT</text><text x="400" y="425" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal" direction="rtl" >رسم توضيحي من إعداد الموقع — ليس صورة مريض</text><text x="400" y="442" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="normal" >Schematic illustration by the site — not a real patient image</text></svg>