<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif">
<rect width="800" height="450" fill="#f8fafc"/>
<text x="400" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">رحلة الجدّة: من المعدة إلى الرئة</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="#475569">A grandmother's course: from gut to lung</text>
<line x1="70" y1="150" x2="730" y2="150" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
<circle cx="120" cy="150" r="13" fill="#f59e0b"/><circle cx="300" cy="150" r="13" fill="#0ea5e9"/><circle cx="480" cy="150" r="13" fill="#16a34a"/><circle cx="670" cy="150" r="13" fill="#dc2626"/>
<text x="120" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">قبل الدخول</text><text x="120" y="126" text-anchor="middle" font-size="12" fill="#92400e">48 h</text>
<text x="300" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#075985">عند الدخول</text><text x="300" y="126" text-anchor="middle" font-size="12" fill="#075985">admission</text>
<text x="480" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">اليومان الأولان</text><text x="480" y="126" text-anchor="middle" font-size="12" fill="#166534">days 1-2</text>
<text x="670" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">اليوم الثالث</text><text x="670" y="126" text-anchor="middle" font-size="12" fill="#991b1b">day 3</text>
<rect x="40" y="185" width="165" height="120" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="122" y="212" text-anchor="middle" font-size="13" fill="#92400e">قيء وإسهال</text><text x="122" y="232" text-anchor="middle" font-size="13" fill="#92400e">لا تحتمل حتى الماء</text><text x="122" y="256" text-anchor="middle" font-size="12" fill="#92400e">norovirus in the vomit</text><text x="122" y="280" text-anchor="middle" font-size="12" fill="#92400e">عدوى في العائلة</text>
<rect x="215" y="185" width="170" height="120" rx="14" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
<text x="300" y="212" text-anchor="middle" font-size="13" fill="#075985">جفاف متوسط إلى شديد</text><text x="300" y="236" text-anchor="middle" font-size="12" fill="#075985">BP 84/40 · HR 98</text><text x="300" y="258" text-anchor="middle" font-size="12" fill="#075985">dry mucosa, RR 24</text><text x="300" y="282" text-anchor="middle" font-size="13" fill="#075985">سوائل وريدية</text>
<rect x="395" y="185" width="170" height="120" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="480" y="225" text-anchor="middle" font-size="14" fill="#166534">تحسّن واضح</text><text x="480" y="250" text-anchor="middle" font-size="12" fill="#166534">improved well</text>
<rect x="575" y="185" width="190" height="120" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="670" y="212" text-anchor="middle" font-size="13" fill="#991b1b">ضيق نفس وسعال أخضر</text><text x="670" y="236" text-anchor="middle" font-size="13" fill="#991b1b">خراخر في قاعدة اليسرى</text><text x="670" y="262" text-anchor="middle" font-size="12" fill="#991b1b">left basal crackles</text><text x="670" y="286" text-anchor="middle" font-size="12" fill="#991b1b">aspiration pneumonia?</text>
<rect x="100" y="335" width="600" height="80" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="400" y="362" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">مضاد حيوي مبكراً + لا شيء بالفم حتى يُقيَّم البلع</text>
<text x="400" y="384" text-anchor="middle" font-size="12" fill="#9a3412">early antibiotics, nil by mouth until a swallow assessment</text>
<text x="400" y="404" text-anchor="middle" font-size="12" fill="#9a3412">السوائل عبر الوريد في هذه الأثناء</text>
</svg>