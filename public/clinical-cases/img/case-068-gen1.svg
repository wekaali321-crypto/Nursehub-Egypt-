<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><rect width="800" height="450" fill="#ffffff"/><text x="400" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2d3d">مسار المتلازمة الخبيثة بمضادات الذهان</text><rect x="150" y="58" width="500" height="56" rx="14" fill="#e8f0ff" stroke="#4b7bec" stroke-width="2"/><text x="400" y="82" text-anchor="middle" font-size="18" font-weight="700" fill="#4b7bec" >حصار مستقبلات الدوبامين</text><text x="400" y="103" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2d3d" >مضاد ذهان (هالوبيريدول)</text><line x1="400" y1="114" x2="400" y2="126" stroke="#51606f" stroke-width="3" /><polygon points="400,134 392,122 408,122" fill="#51606f"/><rect x="150" y="134" width="500" height="56" rx="14" fill="#fff4d6" stroke="#c9961a" stroke-width="2"/><text x="400" y="158" text-anchor="middle" font-size="18" font-weight="700" fill="#c9961a" >حرارة وتيبس عضلي</text><text x="400" y="179" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2d3d" >اضطراب ضبط الحرارة وتوتر العضلات</text><line x1="400" y1="190" x2="400" y2="202" stroke="#51606f" stroke-width="3" /><polygon points="400,210 392,198 408,198" fill="#51606f"/><rect x="150" y="210" width="500" height="56" rx="14" fill="#fdeeee" stroke="#d64545" stroke-width="2"/><text x="400" y="234" text-anchor="middle" font-size="18" font-weight="700" fill="#d64545" >انحلال العضلات</text><text x="400" y="255" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2d3d" >ارتفاع إنزيمات العضل وخروج الميوغلوبين</text><line x1="400" y1="266" x2="400" y2="278" stroke="#51606f" stroke-width="3" /><polygon points="400,286 392,274 408,274" fill="#51606f"/><rect x="150" y="286" width="500" height="56" rx="14" fill="#f1e8fa" stroke="#8e6bbf" stroke-width="2"/><text x="400" y="310" text-anchor="middle" font-size="18" font-weight="700" fill="#8e6bbf" >اضطرابات استقلابية</text><text x="400" y="331" text-anchor="mid