<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><rect width="800" height="450" fill="#ffffff"/><text x="400" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2d3d">لماذا حاصر ألفا قبل حاصر بيتا؟</text><rect x="300" y="60" width="200" height="70" rx="35" fill="#f0a04b" stroke="none" stroke-width="1"/><text x="400" y="102" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" >ورم يفرز كاتيكولامينات</text><line x1="450" y1="130" x2="600" y2="200" stroke="#51606f" stroke-width="3" /><line x1="350" y1="130" x2="200" y2="200" stroke="#51606f" stroke-width="3" /><rect x="460" y="200" width="280" height="90" rx="16" fill="#e8f0ff" stroke="#4b7bec" stroke-width="2"/><text x="600" y="232" text-anchor="middle" font-size="20" font-weight="700" fill="#2c4fb0" >مستقبِلات ألفا</text><text x="600" y="262" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2d3d" >الأوعية: تضيّق وارتفاع الضغط</text><rect x="60" y="200" width="280" height="90" rx="16" fill="#fdeeee" stroke="#d64545" stroke-width="2"/><text x="200" y="232" text-anchor="middle" font-size="20" font-weight="700" fill="#b02a2a" >مستقبِلات بيتا</text><text x="200" y="262" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2d3d" >القلب: تسرّع وخفقان</text><rect x="460" y="320" width="280" height="70" rx="16" fill="#d9f2e3" stroke="#2f7d4f" stroke-width="2"/><text x="600" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#1f6b40" >أولاً: حاصر ألفا</text><text x="600" y="376" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2d3d" >مع ترطيب كافٍ بالسوائل</text><rect x="60" y="320" width="280" height="70" rx="16" fill="#fff4d6" stroke="#c9961a" stroke-width="2"/><text x="200" y="350" text-anchor="middle" font-size="18" font-weight="700" fill="#8a6500" >ثانياً: حاصر بيتا</text><text x="200" y="376" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2d3d" >بعد تأمين حصار ألفا</text><line x1="600" y1="290" x2="600" y2="320" stroke="#2f7d4f" stroke-width="3" /><line x1="200" y1="290" x2="200" y2="320" stroke="#c9961a" stroke-width="3" /><line x1="460" y1="355" x2="352" y2="355" stroke="#51606f" stroke-width="3" /><polygon points="340,355 354,347 354,363" fill="#51606f"/><text x="400" y="345" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2d3d" >ثم</text><text x="400" y="425" text-anchor="middle" font-size="14" font-weight="400" fill="#b02a2a" >عكس الترتيب قد يترك ألفا بلا مقاومة فتشتدّ الأزمة</text></svg>