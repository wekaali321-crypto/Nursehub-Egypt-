<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif">
<rect width="800" height="450" fill="#f8fafc"/>
<text x="400" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">نوعا تسلخ الأبهر (Aortic dissection types)</text>
<path d="M300 400 L300 200 Q300 90 400 90 Q500 90 500 160 L500 400" fill="none" stroke="#dc2626" stroke-width="34" stroke-linecap="round"/>
<path d="M300 400 L300 200 Q300 90 400 90 Q500 90 500 160 L500 400" fill="none" stroke="#fecaca" stroke-width="18" stroke-linecap="round"/>
<rect x="268" y="85" width="170" height="130" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 5" rx="10"/>
<rect x="465" y="200" width="70" height="195" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="7 5" rx="10"/>
<text x="260" y="130" font-size="18" text-anchor="end" fill="#1d4ed8" font-weight="bold">النوع A</text>
<text x="260" y="154" font-size="14" text-anchor="end" fill="#334155">الأبهر الصاعد و/أو القوس</text>
<text x="260" y="174" font-size="13" text-anchor="end" fill="#334155">ascending aorta and/or arch</text>
<text x="560" y="290" font-size="18" fill="#15803d" font-weight="bold">النوع B</text>
<text x="560" y="314" font-size="14" fill="#334155">الأبهر الهابط</text>
<text x="560" y="334" font-size="13" fill="#334155">descending aorta</text>
<text x="400" y="430" text-anchor="middle" font-size="14" fill="#334155">تمزق البطانة الداخلية يفصل طبقات الجدار (intimal tear separates the wall layers)</text>
</svg>
