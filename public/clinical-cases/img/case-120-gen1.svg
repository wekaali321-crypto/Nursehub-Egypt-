<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><rect width="800" height="450" fill="#f8fafc"/><text x="400" y="34" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">بعد استبدال الصمام التاجي</text><text x="400" y="60" text-anchor="middle" font-size="17" fill="#475569">After mitral valve replacement</text><defs><marker id="ar" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#ea580c"/></marker><marker id="ab" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1d4ed8"/></marker></defs><g transform="translate(30,85)"><path d="M230,170 C215,95 220,40 262,32 C305,25 345,50 345,100" fill="none" stroke="#f87171" stroke-width="26" stroke-linecap="round"/><path d="M150,175 C140,110 170,62 215,62" fill="none" stroke="#60a5fa" stroke-width="24" stroke-linecap="round"/><ellipse cx="95" cy="120" rx="58" ry="52" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/><ellipse cx="120" cy="245" rx="75" ry="68" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"/><ellipse cx="310" cy="125" rx="58" ry="50" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/><ellipse cx="280" cy="250" rx="88" ry="78" fill="#fca5a5" stroke="#b91c1c" stroke-width="3"/><rect x="70" y="170" width="50" height="10" rx="4" fill="#475569"/><rect x="270" y="176" width="64" height="10" rx="4" fill="#ea580c"/><rect x="222" y="165" width="30" height="10" rx="4" fill="#475569"/><rect x="130" y="168" width="30" height="10" rx="4" fill="#475569"/><text x="95" y="125" text-anchor="middle" font-size="20" fill="#1e3a8a" font-weight="bold">RA</text><text x="120" y="255" text-anchor="middle" font-size="22" fill="#1e3a8a" font-weight="bold">RV</text><text x="310" y="130" text-anchor="middle" font-size="20" fill="#7f1d1d" font-weight="bold">LA</text><text x="285" y="260" text-anchor="middle" font-size="22" fill="#7f1d1d" font-weight="bold">LV</text></g><circle cx="335" cy="266" r="21" fill="#fde68a" stroke="#b45309" stroke-width="4"/><line x1="320" y1="266" x2="350" y2="266" stroke="#b45309" stroke-width="5"/><line x1="356" y1="266" x2="432" y2="160" stroke="#c2410c" stroke-width="3"/><circle cx="356" cy="266" r="5" fill="#c2410c"/><text x="440" y="162" text-anchor="start" font-size="20" fill="#c2410c" font-weight="bold">صمام تاجي صناعي (ميكانيكي)</text><text x="440" y="182" text-anchor="start" font-size="15" fill="#475569">Mechanical mitral prosthesis</text><line x1="350" y1="300" x2="432" y2="230" stroke="#c2410c" stroke-width="3"/><circle cx="350" cy="300" r="5" fill="#c2410c"/><text x="440" y="232" text-anchor="start" font-size="20" fill="#c2410c" font-weight="bold">يحتاج وارفارين ما دام الصمام ميكانيكياً</text><text x="440" y="252" text-anchor="start" font-size="15" fill="#475569">Needs warfarin for life</text><line x1="400" y1="170" x2="432" y2="300" stroke="#c2410c" stroke-width="3"/><circle cx="400" cy="170" r="5" fill="#c2410c"/><text x="440" y="302" text-anchor="start" font-size="20" fill="#c2410c" font-weight="bold">رجفان أذيني: خطر جلطة على الصمام</text><text x="440" y="322" text-anchor="start" font-size="15" fill="#475569">AF adds clot risk on valve</text><text x="600" y="395" text-anchor="middle" font-size="19" fill="#0f172a" font-weight="bold">الوريد الودجي منتفخ: ضغط الأيمن عالٍ</text></svg>