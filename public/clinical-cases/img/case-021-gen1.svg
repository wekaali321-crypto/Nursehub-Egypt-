<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif">
<rect width="800" height="450" fill="#f8fafc"/>
<text x="400" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">خط زمني: من آخر كأس إلى الهذيان الارتعاشي</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="#475569">Timeline: from the last drink to delirium tremens</text>
<line x1="60" y1="215" x2="740" y2="215" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
<circle cx="110" cy="215" r="14" fill="#94a3b8"/>
<circle cx="290" cy="215" r="14" fill="#f59e0b"/>
<circle cx="470" cy="215" r="14" fill="#dc2626"/>
<circle cx="650" cy="215" r="14" fill="#7f1d1d"/>
<rect x="30" y="80" width="160" height="105" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="110" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#334155">قبل التوقف</text>
<text x="110" y="130" text-anchor="middle" font-size="12" fill="#334155">قنينة فودكا يومياً</text>
<text x="110" y="148" text-anchor="middle" font-size="12" fill="#334155">75 cl, about 30 units/day</text>
<text x="110" y="168" text-anchor="middle" font-size="12" fill="#334155">يحاول الإقلاع</text>
<rect x="210" y="245" width="160" height="105" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="290" y="273" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">بعد 48 ساعة</text>
<text x="290" y="295" text-anchor="middle" font-size="12" fill="#92400e">no alcohol for 48 h</text>
<text x="290" y="316" text-anchor="middle" font-size="12" fill="#92400e">نوبة صرع كبرى في الشارع</text>
<text x="290" y="334" text-anchor="middle" font-size="12" fill="#92400e">tonic-clonic seizure</text>
<rect x="390" y="80" width="160" height="105" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="470" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">في الجناح</text>
<text x="470" y="130" text-anchor="middle" font-size="12" fill="#991b1b">تصوير الرأس المقطعي طبيعي</text>
<text x="470" y="148" text-anchor="middle" font-size="12" fill="#991b1b">normal CT head</text>
<text x="470" y="168" text-anchor="middle" font-size="12" fill="#991b1b">تهيّج ملحوظ</text>
<rect x="570" y="245" width="170" height="125" rx="14" fill="#fecaca" stroke="#7f1d1d" stroke-width="2"/>
<text x="655" y="273" text-anchor="middle" font-size="15" font-weight="bold" fill="#7f1d1d">اليوم التالي</text>
<text x="655" y="295" text-anchor="middle" font-size="12" fill="#7f1d1d">قيء، تعرق، رعاش</text>
<text x="655" y="313" text-anchor="middle" font-size="12" fill="#7f1d1d">HR 104 · RR 28</text>
<text x="655" y="334" text-anchor="middle" font-size="12" fill="#7f1d1d">هلوسة: حشرات على الجدار</text>
<text x="655" y="352" text-anchor="middle" font-size="12" fill="#7f1d1d">delirium tremens</text>
<text x="400" y="415" text-anchor="middle" font-size="13" fill="#475569">الوقاية: مقياس تقييم الانسحاب، ثم البنزوديازيبينات والثيامين</text>
<text x="400" y="434" text-anchor="middle" font-size="12" fill="#64748b">prevention: CIWA scoring, benzodiazepines, thiamine</text>
</svg>