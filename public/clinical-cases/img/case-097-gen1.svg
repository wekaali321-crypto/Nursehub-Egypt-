<text x="205" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#9f1239">اللسان يسقط للخلف</text>
<line x1="200" y1="196" x2="205" y2="224" stroke="#9f1239" stroke-width="1.5" stroke-linecap="round"/>
<path d="M118,222 Q175,208 235,238" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="120" y="268" text-anchor="middle" font-size="12.5" font-weight="700" fill="#166534">مجرى هواء مساعد</text>
<line x1="135" y1="258" x2="165" y2="222" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round"/>
<text x="228" y="320" text-anchor="middle" font-size="13" font-weight="400" fill="#334155">القصبة</text>
</g>
<rect x="380" y="80" width="380" height="120" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="570" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">ما رأيناه عندها</text>
<text x="570" y="134" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">وعي منخفض: غلاسكو 6 من 15</text>
<text x="570" y="158" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2937">أكسجين منخفض والإشباع 92 بالمئة</text>
<text x="570" y="182" text-anchor="middle" font-size="13" font-weight="400" fill="#1f2937">نوبة تشنج بعد 4 أيام من احتشاء وتحليل خثرة</text>
<rect x="380" y="214" width="380" height="48" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
<text x="570" y="234" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">الخطوة 1</text>
<text x="570" y="253" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2937">مجرى هواء مساعد وأكسجين عالي التدفق</text>
<rect x="380" y="272" width="380" height="48" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
<text x="570" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">الخطوة 2</text>
<text x="570" y="311" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2937">سكر الدم، ثم إعادة تقييم المجرى والتنفس والدوران</text>
<rect x="380" y="330" width="380" height="48" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
<text x="570" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">الخطوة 3</text>
<text x="570" y="369" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2937">تخطيط قلب ثم تصوير دماغ عاجل بعد الاستقرار</text>
<text x="400" y="438" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">رسم توضيحي من إعداد الموقع — ليس صورة مريض حقيقي</text></svg>