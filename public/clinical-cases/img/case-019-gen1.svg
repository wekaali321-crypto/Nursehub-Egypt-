<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif">
<rect width="800" height="450" fill="#f8fafc"/>
<text x="400" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">من الورم إلى الأعراض وزيادة الوزن</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="#475569">From tumour to symptoms and weight gain</text>
<rect x="290" y="80" width="220" height="80" rx="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="400" y="112" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">ورم في جزر البنكرياس</text>
<text x="400" y="134" text-anchor="middle" font-size="12" fill="#7f1d1d">islet-cell tumour (insulinoma)</text>
<text x="400" y="150" text-anchor="middle" font-size="12" fill="#7f1d1d">يفرز إنسولين زائداً</text>
<path d="M510 120 C600 120 640 150 650 200" fill="none" stroke="#475569" stroke-width="3"/><polygon points="650,215 640,198 660,198" fill="#475569"/>
<rect x="545" y="220" width="210" height="90" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="650" y="252" text-anchor="middle" font-size="16" font-weight="bold" fill="#075985">الجلوكوز يُسحب للخلايا</text>
<text x="650" y="274" text-anchor="middle" font-size="12" fill="#075985">glucose driven into cells</text>
<text x="650" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#b91c1c">1.2 mmol/L</text>
<path d="M650 310 C640 360 560 375 500 375" fill="none" stroke="#475569" stroke-width="3"/><polygon points="485,375 502,366 502,384" fill="#475569"/>
<rect x="290" y="335" width="200" height="80" rx="16" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="390" y="365" text-anchor="middle" font-size="16" font-weight="bold" fill="#854d0e">أعراض: نعاس وصداع</text>
<text x="390" y="386" text-anchor="middle" font-size="12" fill="#854d0e">drowsiness, headache,</text>
<text x="390" y="402" text-anchor="middle" font-size="12" fill="#854d0e">palpitations</text>
<path d="M290 375 C230 375 150 360 140 310" fill="none" stroke="#475569" stroke-width="3"/><polygon points="140,295 130,312 150,312" fill="#475569"/>
<rect x="45" y="220" width="210" height="90" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="150" y="252" text-anchor="middle" font-size="16" font-weight="bold" fill="#166534">تأكل لتخف الأعراض</text>
<text x="150" y="274" text-anchor="middle" font-size="12" fill="#166534">eats to relieve symptoms</text>
<text x="150" y="296" text-anchor="middle" font-size="13" fill="#166534">فيزداد وزنها</text>
</svg>