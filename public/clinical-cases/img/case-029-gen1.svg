<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif">
<rect width="800" height="450" fill="#f8fafc"/>
<text x="400" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">أين تذهب صفيحاتها؟ آلية المرض بخطوات</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="#475569">Where do her platelets go? The mechanism in steps</text>
<g fill="#fde68a" stroke="#ca8a04" stroke-width="2"><circle cx="90" cy="130" r="14"/><circle cx="130" cy="160" r="14"/><circle cx="70" cy="180" r="14"/><circle cx="125" cy="105" r="14"/></g>
<g stroke="#dc2626" stroke-width="3" fill="none"><path d="M76 115 l-8 -12 m8 12 l-10 -2"/><path d="M118 148 l-8 -12"/><path d="M60 168 l-10 -8"/></g>
<text x="105" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">صفيحات تُغلَّف</text><text x="105" y="244" text-anchor="middle" font-size="12" fill="#92400e">platelets coated by autoantibody</text>
<line x1="170" y1="150" x2="250" y2="150" stroke="#475569" stroke-width="3"/><polygon points="262,150 247,142 247,158" fill="#475569"/>
<path d="M300 100 C260 110 250 190 300 215 C350 235 400 200 390 150 C385 110 340 90 300 100 Z" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
<text x="325" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">الطحال</text><text x="325" y="172" text-anchor="middle" font-size="12" fill="#5b21b6">spleen</text>
<text x="325" y="252" text-anchor="middle" font-size="13" fill="#5b21b6">تُدمَّر هناك</text><text x="325" y="270" text-anchor="middle" font-size="12" fill="#5b21b6">destroyed by macrophages</text>
<line x1="400" y1="150" x2="470" y2="150" stroke="#475569" stroke-width="3"/><polygon points="482,150 467,142 467,158" fill="#475569"/>
<rect x="490" y="105" width="270" height="90" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="625" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">نقص صفيحات شديد</text><text x="625" y="157" text-anchor="middle" font-size="12" fill="#991b1b">marked thrombocytopenia</text><text x="625" y="178" text-anchor="middle" font-size="13" fill="#991b1b">كدمات كبيرة وبقع حبرية على الساقين</text>
<rect x="40" y="300" width="340" height="110" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="210" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">ما الذي يرجّح التشخيص؟</text>
<text x="210" y="352" text-anchor="middle" font-size="13" fill="#166534">مريضة بصحة جيدة، بلا أدوية ولا عدوى</text><text x="210" y="374" text-anchor="middle" font-size="13" fill="#166534">تخثر طبيعي ولطاخة بلا خلايا شاذة</text><text x="210" y="396" text-anchor="middle" font-size="13" fill="#166534">لا تضخم طحال ولا عقد</text>
<rect x="410" y="300" width="350" height="110" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
<text x="585" y="328" text-anchor="middle" font-size="15" font-weight="bold" fill="#9a3412">العلاج</text>
<text x="585" y="352" text-anchor="middle" font-size="13" fill="#9a3412">غلوبولين مناعي وريدي + بريدنيزولون</text><text x="585" y="374" text-anchor="middle" font-size="13" fill="#9a3412">حمض الترانيكساميك</text><text x="585" y="396" text-anchor="middle" font-size="13" fill="#9a3412">نزف مهدد للحياة: نقل صفيحات</text>
</svg>