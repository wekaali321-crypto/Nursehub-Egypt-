<text x="780" y="170" text-anchor="end" font-size="16" font-weight="700" fill="#1f2d3d">تجمّع هلالي تحت الجافية</text>
<text x="780" y="192" text-anchor="end" font-size="14" fill="#4a5a6a">أقتم من نسيج الدماغ (مزمن)</text>
