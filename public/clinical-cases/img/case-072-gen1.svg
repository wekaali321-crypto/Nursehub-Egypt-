<text x="400" y="440" text-anchor="middle" font-size="14" fill="#4a5a6a">اصطلاح الأشعة: جانب المريض الأيمن يظهر على يسار الصورة</text>
<text x="400" y="45" text-anchor="middle" font-size="12" fill="#7a8794">رسم توضيحي من إعداد الموقع وليس صورة مريض حقيقية</text>
