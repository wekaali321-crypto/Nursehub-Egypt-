<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif">
<rect width="800" height="450" fill="#fff"/>
<text x="400" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2d3d">الخط الزمني للتأق</text>
<text x="400" y="60" text-anchor="middle" font-size="14" fill="#51606f">Anaphylaxis timeline</text>
<line x1="60" y1="200" x2="740" y2="200" stroke="#51606f" stroke-width="5" stroke-linecap="round"/>
<g font-size="15" text-anchor="middle">
<circle cx="90" cy="200" r="14" fill="#c0392b"/><circle cx="260" cy="200" r="14" fill="#e08a1e"/><circle cx="470" cy="200" r="14" fill="#6c4fb3"/><circle cx="700" cy="200" r="14" fill="#2e9e6b"/>
<text x="90" y="170" font-weight="700" fill="#c0392b">0</text>
<text x="260" y="170" font-weight="700" fill="#b36a0a">~15 min</text>
<text x="470" y="170" font-weight="700" fill="#6c4fb3">4–8 h</text>
<text x="700" y="170" font-weight="700" fill="#1f7a52">24 h</text>
<rect x="20" y="230" width="165" height="110" rx="12" fill="#fde8e6"/>
<text x="102" y="262" font-weight="700" fill="#7f1d1d">أدرينالين عضلي</text><text x="102" y="284" font-size="13" fill="#7f1d1d">IM adrenaline 0.5 mg</text><text x="102" y="312" font-size="13" fill="#7f1d1d">ABC + أكسجين + سوائل</text><text x="102" y="330" font-size="12" fill="#7f1d1d">oxygen + fluids</text>
<rect x="200" y="230" width="160" height="110" rx="12" fill="#fff3dc"/>
<text x="270" y="262" font-weight="700" fill="#78350f">يزول أثر الأدرينالين</text><text x="270" y="284" font-size="13" fill="#78350f">Adrenaline wears off</text><text x="270" y="312" font-size="13" fill="#78350f">فكّر بجرعة أخرى</text><text x="270" y="330" font-size="12" fill="#78350f">consider repeat dose</text>
<rect x="390" y="230" width="160" height="110" rx="12" fill="#ece8fa"/>
<text x="470" y="262" font-weight="700" fill="#3b2a73">تفاعل متأخر محتمل</text><text x="470" y="284" font-size="13" fill="#3b2a73">Possible late phase</text><text x="470" y="312" font-size="13" fill="#3b2a73">حوالي 1 من 5</text><text x="470" y="330" font-size="12" fill="#3b2a73">about 1 in 5</text>
<rect x="620" y="230" width="160" height="110" rx="12" fill="#dff5ea"/>
<text x="700" y="262" font-weight="700" fill="#14532d">انتهاء المراقبة</text><text x="700" y="284" font-size="13" fill="#14532d">End of observation</text><text x="700" y="312" font-size="13" fill="#14532d">تثقيف وتوثيق</text><text x="700" y="330" font-size="12" fill="#14532d">education + records</text>
</g>
<text x="400" y="400" text-anchor="middle" font-size="13" fill="#51606f">رسم توضيحي من إعداد الموقع — Site illustration</text>
</svg>
