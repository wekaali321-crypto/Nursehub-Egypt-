<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><rect width="800" height="450" fill="#f8fafc"/><text x="400" y="34" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="bold" direction="rtl" >رئتان وكليتان: هدف واحد يهاجمه الجسم</text><text x="400" y="58" font-size="14" fill="#475569" text-anchor="middle" font-weight="normal" >Lungs and kidneys: one target under autoimmune attack</text><g transform="translate(-30,0)"><path d="M110 130 Q70 140 70 230 Q70 300 110 305 Q150 305 160 260 L160 150 Q150 125 110 130Z" fill="#bfdbfe" stroke="#3b82f6" stroke-width="3"/><path d="M260 130 Q300 140 300 230 Q300 300 260 305 Q220 305 210 260 L210 150 Q220 125 260 130Z" fill="#bfdbfe" stroke="#3b82f6" stroke-width="3"/><path d="M185 100 L185 190 M185 190 L160 215 M185 190 L210 215" stroke="#64748b" stroke-width="6" fill="none" stroke-linecap="round"/><ellipse cx="110" cy="275" rx="38" ry="22" fill="#ef4444" opacity=".55"/><ellipse cx="260" cy="275" rx="38" ry="22" fill="#ef4444" opacity=".55"/></g><text x="155" y="335" font-size="15" fill="#1e3a8a" text-anchor="middle" font-weight="bold" direction="rtl" >الرئتان: نزف في الحويصلات</text><text x="155" y="353" font-size="12" fill="#1e3a8a" text-anchor="middle" font-weight="normal" >Lungs: bleeding into air sacs (lower zones)</text><g transform="translate(30,0)"><path d="M600 120 Q700 110 710 200 Q715 290 640 300 Q620 300 625 270 Q640 240 625 215 Q640 190 625 165 Q615 130 600 120Z" fill="#fdba74" stroke="#ea580c" stroke-width="3"/><circle cx="665" cy="200" r="30" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><circle cx="665" cy="200" r="18" fill="none" stroke="#7c3aed" stroke-width="4"/></g><text x="670" y="335" font-size="15" fill="#7c2d12" text-anchor="middle" font-weight="bold" direction="rtl" >الكلية: التهاب كبيبات</text><text x="670" y="353" font-size="12" fill="#7c2d12" text-anchor="middle" font-weight="normal" >Kidney: glomerulonephritis, red-cell casts</text><g fill="#7c3aed"><path d="M375 150 l12 -14 l12 14 M387 136 v38" stroke="#7c3aed" stroke-width="4" fill="none"/></g><rect x="310" y="190" width="180" height="70" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" /><text x="400" y="216" font-size="16" fill="#4c1d95" text-anchor="middle" font-weight="bold" direction="rtl" >كولاجين من النوع 4</text><text x="400" y="240" font-size="12" fill="#4c1d95" text-anchor="middle" font-weight="normal" >Type 4 collagen</text><text x="400" y="128" font-size="14" fill="#6d28d9" text-anchor="middle" font-weight="normal" direction="rtl" >جسم مضاد ذاتي</text><text x="400" y="112" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="normal" >autoantibody</text><line x1="310" y1="225" x2="278" y2="225" stroke="#7c3aed" stroke-width="3" /><polygon points="278,225 287.2,221.1 287.2,228.9" fill="#7c3aed"/><line x1="490" y1="225" x2="625" y2="225" stroke="#7c3aed" stroke-width="3" /><polygon points="625,225 615.8,228.9 615.8,221.1" fill="#7c3aed"/><text x="400" y="285" font-size="12" fill="#6d28d9" text-anchor="middle" font-weight="normal" direction="rtl" >هدف الجسم المضاد (anti-GBM)</text><text x="400" y="320" font-size="13" fill="#334155" text-anchor="middle" font-weight="normal" direction="rtl" >يوجد في الحويصلات الرئوية وفي الغشاء القاعدي للكبيبة</text><text x="400" y="425" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal" direction="rtl" >رسم توضيحي من إعداد الموقع — ليس صورة مريض</text><text x="400" y="442" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="normal" >Schematic illustration by the site — not a real patient image</text></svg>