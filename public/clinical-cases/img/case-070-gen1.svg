<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif">
<rect width="800" height="450" fill="#ffffff"/>
<text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2d3d">آفة مركزية في النخاع الشوكي (central cord lesion)</text>
<g transform="translate(20,10)">
<ellipse cx="170" cy="235" rx="130" ry="115" fill="#e8eef6" stroke="#51606f" stroke-width="3"/>
<path d="M170 235 C 110 190 60 185 60 215 C 60 250 110 258 170 242 C 230 258 280 250 280 215 C 280 185 230 190 170 235 Z" fill="#c9d6e8" stroke="#6b7c93" stroke-width="2"/>
<path d="M170 235 C 130 262 95 320 125 335 C 155 345 168 295 170 255 C 172 295 185 345 215 335 C 245 320 210 262 170 235 Z" fill="#c9d6e8" stroke="#6b7c93" stroke-width="2"/>
<ellipse cx="170" cy="235" rx="24" ry="30" fill="#2f80c9"/>
<text x="170" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">syrinx</text>
<line x1="136" y1="208" x2="204" y2="208" stroke="#c0392b" stroke-width="5"/>
<circle cx="90" cy="320" r="9" fill="#1b9e77"/><circle cx="250" cy="320" r="9" fill="#1b9e77"/>
<circle cx="170" cy="118" r="9" fill="#7570b3"/><circle cx="262" cy="150" r="9" fill="#d95f02"/><circle cx="78" cy="150" r="9" fill="#d95f02"/>
</g>
<g font-size="16" fill="#1f2d3d" text-anchor="end">
<circle cx="340" cy="86" r="0"/>
<text x="780" y="100" font-weight="700" fill="#c0392b">● الألياف المتصالبة للسبيل النخاعي المهادي</text>
<text x="780" y="120" font-size="13" fill="#51606f">(crossing spinothalamic fibres: pain and temperature lost on both sides at the level)</text>
<text x="780" y="170" font-weight="700" fill="#1b9e77">● القرن الأمامي: ضمور وضعف عضلات اليد</text>
<text x="780" y="190" font-size="13" fill="#51606f">(anterior horn: lower motor neuron signs, hand wasting)</text>
<text x="780" y="240" font-weight="700" fill="#d95f02">● السبل الطويلة الهابطة: شلل تشنجي في الساقين</text>
<text x="780" y="260" font-size="13" fill="#51606f">(corticospinal tracts: upper motor neuron signs in the legs)</text>
<text x="780" y="310" font-weight="700" fill="#7570b3">● العمود الخلفي: يتأثر متأخراً</text>
<text x="780" y="330" font-size="13" fill="#51606f">(dorsal column: affected late)</text>
<text x="780" y="395" font-size="13" fill="#51606f">رسم تخطيطي مبسّط، غير مقيّس (simplified schematic, not to scale)</text>
</g>
</svg>
