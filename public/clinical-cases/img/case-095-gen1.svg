<text x="130" y="284" text-anchor="middle" font-size="13" font-weight="400" fill="#475569">وحلقة شاحبة وحلقة حمراء</text>
<text x="560" y="98" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">الشدة ومساحة الجسم المصابة</text>
