<text x="675.0" y="151" text-anchor="middle" font-size="12" font-weight="400" fill="#374151">جلد فقط بلا أغشية</text>
<text x="675.0" y="165" text-anchor="middle" font-size="10.5" font-weight="400" fill="#475569" direction="ltr">EM minor</text>
<rect x="540" y="177" width="210" height="54" rx="10" fill="#fdba74" stroke="#ea580c" stroke-width="2"/>
<text x="645.0" y="197" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">الحمامى الكبرى</text>
<text x="645.0" y="213" text-anchor="middle" font-size="12" font-weight="400" fill="#374151">أغشية مخاطية، أقل من 10 بالمئة</text>
<text x="645.0" y="227" text-anchor="middle" font-size="10.5" font-weight="400" fill="#475569" direction="ltr">EM major / SJS</text>
<rect x="480" y="239" width="270" height="54" rx="10" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
<text x="615.0" y="259" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">منطقة التداخل</text>
<text x="615.0" y="275" text-anchor="middle" font-size="12" font-weight="400" fill="#374151">بين 10 و30 بالمئة</text>
<text x="615.0" y="289" text-anchor="middle" font-size="10.5" font-weight="400" fill="#475569" direction="ltr">SJS / TEN</text>
<rect x="420" y="301" width="330" height="54" rx="10" fill="#f87171" stroke="#991b1b" stroke-width="2"/>
