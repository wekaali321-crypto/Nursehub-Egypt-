<text x="585.0" y="351" text-anchor="middle" font-size="10.5" font-weight="400" fill="#475569" direction="ltr">TEN</text>
<rect x="250" y="376" width="520" height="40" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="510" y="401" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">مريضنا: آفات هدفية + إصابة الفم والعينين + هبوط ضغط</text>
<text x="400" y="438" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">رسم توضيحي من إعداد الموقع — ليس صورة مريض حقيقي</text></svg>