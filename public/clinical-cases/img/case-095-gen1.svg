<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="800" height="450" fill="#ffffff"/><text x="400" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">الطيف: من الحمامى عديدة الأشكال إلى التحلل البشروي السمي</text>
<text x="400" y="54" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b" direction="ltr">Spectrum: EM minor → SJS → TEN (schematic)</text>
