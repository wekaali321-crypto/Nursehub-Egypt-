<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><rect width="800" height="450" fill="#f8fafc"/><text x="400" y="34" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="bold" direction="rtl" >رسم تخطيطي: استرواح صدر توتّري أيمن</text><text x="400" y="58" font-size="14" fill="#475569" text-anchor="middle" font-weight="normal" >Schematic chest film: right tension pneumothorax</text><rect x="150" y="75" width="500" height="325" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2" /><path d="M200 110 Q300 90 370 120 L375 330 Q290 380 205 340 Q175 220 200 110Z" fill="#020617" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4"/><path d="M355 160 Q335 190 345 245 Q362 262 372 240 L372 170Z" fill="#94a3b8"/><path d="M600 110 Q520 95 470 125 L462 330 Q530 375 598 340 Q630 220 600 110Z" fill="#64748b" stroke="#94a3b8" stroke-width="2"/><path d="M395 250 Q440 215 470 260 Q480 320 430 345 Q390 335 395 250Z" fill="#cbd5e1"/><rect x="408" y="90" width="22" height="115" rx="9" fill="#020617" stroke="#e2e8f0" stroke-width="2"/><path d="M160 150 Q230 132 290 154" fill="none" stroke="#475569" stroke-width="2"/><path d="M640 150 Q570 132 510 154" fill="none" stroke="#475569" stroke-width="2"/><path d="M160 200 Q230 182 290 204" fill="none" stroke="#475569" stroke-width="2"/><path d="M640 200 Q570 182 510 204" fill="none" stroke="#475569" stroke-width="2"/><path d="M160 250 Q230 232 290 254" fill="none" stroke="#475569" stroke-width="2"/><path d="M640 250 Q570 232 510 254" fill="none" stroke="#475569" stroke-width="2"/><path d="M160 300 Q230 282 290 304" fill="none" stroke="#475569" stroke-width="2"/><path d="M640 300 Q570 282 510 304" fill="none" stroke="#475569" stroke-width="2"/><text x="262" y="270" font-size="15" fill="#7dd3fc" text-anchor="middle" font-weight="bold" direction="rtl" >هواء محبوس: شفافية زائدة</text><text x="262" y="290" font-size="11.5" fill="#7dd3fc" text-anchor="middle" font-weight="normal" >trapped air — no lung markings</text><text x="262" y="100" font-size="13" fill="#94a3b8" text-anchor="middle" font-weight="normal" direction="rtl" >الرئة اليمنى</text><line x1="660" y1="180" x2="436" y2="150" stroke="#f97316" stroke-width="3" /><polygon points="436,150 445.6,147.4 444.6,155.1" fill="#f97316"/><text x="715" y="165" font-size="13" fill="#fdba74" text-anchor="middle" font-weight="normal" direction="rtl" >الرغامى منزاحة لليسار</text><text x="715" y="184" font-size="11" fill="#fdba74" text-anchor="middle" font-weight="normal" >trachea pushed left</text><line x1="660" y1="300" x2="440" y2="300" stroke="#f97316" stroke-width="3" /><polygon points="440,300 449.2,296.1 449.2,303.9" fill="#f97316"/><text x="715" y="290" font-size="13" fill="#fdba74" text-anchor="middle" font-weight="normal" direction="rtl" >المنصف يُدفع</text><text x="715" y="309" font-size="11" fill="#fdba74" text-anchor="middle" font-weight="normal" >mediastinal shift</text><line x1="110" y1="185" x2="342" y2="170" stroke="#38bdf8" stroke-width="3" /><polygon points="342,170 333.1,174.5 332.6,166.7" fill="#38bdf8"/><text x="80" y="150" font-size="13" fill="#7dd3fc" text-anchor="middle" font-weight="normal" direction="rtl" >رئة منكمشة</text><text x="80" y="168" font-size="11" fill="#7dd3fc" text-anchor="middle" font-weight="normal" >collapsed lung</text><text x="110" y="255" font-size="26" fill="#334155" text-anchor="middle" font-weight="bold" >R</text><text x="690" y="255" font-size="26" fill="#334155" text-anchor="middle" font-weight="bold" >L</text><text x="400" y="425" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal" direction="rtl" >رسم توضيحي من إعداد الموقع — ليس صورة أشعة حقيقية</text><text x="400" y="442" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="normal" >Schematic illustration by the site — not a real radiograph</text></svg>