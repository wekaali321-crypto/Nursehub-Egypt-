<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><rect width="800" height="450" fill="#ffffff"/><text x="400" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2d3d">مقطع في القصبة الهوائية (رسم تخطيطي)</text><circle cx="140" cy="232" r="80" fill="#f4c9c9" stroke="#8d4b4b" stroke-width="3"/><circle cx="140" cy="232" r="60" fill="#ffffff" stroke="#c98a8a" stroke-width="2"/><text x="140" y="95" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2d3d" >قصبة سليمة</text><text x="140" y="122" text-anchor="middle" font-size="14" font-weight="400" fill="#51606f" >جدار رقيق ومجرى واسع</text><circle cx="400" cy="232" r="88" fill="#e58f8f" stroke="#8d4b4b" stroke-width="3"/><circle cx="400" cy="232" r="28" fill="#ffffff" stroke="#c98a8a" stroke-width="2"/><text x="400" y="95" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2d3d" >أثناء نوبة الربو</text><text x="400" y="122" text-anchor="middle" font-size="14" font-weight="400" fill="#51606f" >جدار متورم ومجرى ضيق</text><circle cx="660" cy="232" r="92" fill="#d86f6f" stroke="#8d4b4b" stroke-width="3"/><circle cx="660" cy="232" r="58" fill="#fdf3c8" stroke="#c98a8a" stroke-width="2"/><path d="M619.4,243.6 q40.599999999999994,-63.800000000000004 81.19999999999999,0 q-40.599999999999994,46.400000000000006 -81.19999999999999,0z" fill="#b08a1d" opacity="0.9"/><text x="660" y="95" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2d3d" >ما نشتبه به هنا</text><text x="660" y="122" text-anchor="middle" font-size="14" font-weight="400" fill="#51606f" >جدار سميك وسدادة مخاط</text><rect x="40" y="345" width="720" height="80" rx="14" fill="#f7f9fc" stroke="#8da0b4" stroke-width="2"/><text x="400" y="374" text-anchor="middle" font-size="16" font-weight="700" fill="#1f2d3d" >التهاب مزمن طويل ← تغيّرات دائمة في الجدار وتوسع في القصبات</text><text x="400" y="404" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2d3d" 