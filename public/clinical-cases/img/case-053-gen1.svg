<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><rect width="800" height="450" fill="#f8fafc"/><text x="400" y="34" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="bold" direction="rtl" >رحلة فيتامين B12 وأين تنكسر عند فقر الدم الخبيث</text><text x="400" y="58" font-size="14" fill="#475569" text-anchor="middle" font-weight="normal" >The B12 journey and where pernicious anaemia breaks it</text><path d="M120 120 Q70 130 70 190 Q70 250 135 255 Q190 250 190 200 L190 150 Q180 115 120 120Z" fill="#fecaca" stroke="#dc2626" stroke-width="3"/><text x="130" y="195" font-size="15" fill="#7f1d1d" text-anchor="middle" font-weight="bold" direction="rtl" >المعدة</text><text x="130" y="213" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="normal" >stomach</text><rect x="205" y="150" width="150" height="70" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2" /><text x="280" y="178" font-size="14" fill="#7f1d1d" text-anchor="middle" font-weight="bold" direction="rtl" >الخلايا الجدارية</text><text x="280" y="196" font-size="11" fill="#7f1d1d" text-anchor="middle" font-weight="normal" >parietal cells → intrinsic factor</text><text x="280" y="238" font-size="13" fill="#991b1b" text-anchor="middle" font-weight="bold" direction="rtl" >أجسام مضادة تدمّرها</text><text x="280" y="254" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="normal" >autoantibodies destroy them</text><path d="M370 185 L440 185" stroke="#dc2626" stroke-width="3" stroke-dasharray="6 5"/><text x="405" y="170" font-size="24" fill="#dc2626" text-anchor="middle" font-weight="normal" >✗</text><rect x="450" y="150" width="150" height="70" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2" /><text x="525" y="178" font-size="14" fill="#14532d" text-anchor="middle" font-weight="bold" direction="rtl" >اللفائفي (الأمعاء)</text><text x="525" y="196" font-size="11" fill="#14532d" text-anchor="middle" font-weight="normal" >ileum: B12 absorption</text><line x1="600" y1="185" x2="660" y2="185" stroke="#16a34a" stroke-width="3" /><polygon points="660,185 650.8,188.9 650.8,181.1" fill="#16a34a"/><rect x="660" y="150" width="110" height="70" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="2" /><text x="715" y="178" font-size="14" fill="#92400e" text-anchor="middle" font-weight="bold" direction="rtl" >نقص B12</text><text x="715" y="196" font-size="11" fill="#92400e" text-anchor="middle" font-weight="normal" >B12 deficiency</text><line x1="715" y1="225" x2="715" y2="275" stroke="#d97706" stroke-width="3" /><polygon points="715,275 711.1,265.8 718.9,265.8" fill="#d97706"/><rect x="560" y="285" width="210" height="60" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" /><text x="665" y="312" font-size="13" fill="#4c1d95" text-anchor="middle" font-weight="bold" direction="rtl" >دم: كريات حمراء كبيرة</text><text x="665" y="330" font-size="11" fill="#4c1d95" text-anchor="middle" font-weight="normal" >blood: macrocytic anaemia</text><rect x="300" y="285" width="230" height="60" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2" /><text x="415" y="312" font-size="13" fill="#1e3a8a" text-anchor="middle" font-weight="bold" direction="rtl" >أعصاب: خدر وضعف وتشوش</text><text x="415" y="330" font-size="11" fill="#1e3a8a" text-anchor="middle" font-weight="normal" >nerves: numbness, weakness, confusion</text><line x1="558" y1="315" x2="534" y2="315" stroke="#d97706" stroke-width="2.5" /><polygon points="534,315 543.2,311.1 543.2,318.9" fill="#d97706"/><text x="150" y="320" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal" direction="rtl" >أسباب أخرى للنقص: نظام نباتي،</text><text x="150" y="338" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal" direction="rtl" >ميتفورمين، مثبطات مضخة البروتون</text><text x="150" y="360" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="normal" >other causes: vegetarian diet, metformin, PPIs</text><text x="400" y="425" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal" direction="rtl" >رسم توضيحي من إعداد الموقع — ليس صورة مريض</text><text x="400" y="442" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="normal" >Schematic illustration by the site — not a real patient image</text></svg>