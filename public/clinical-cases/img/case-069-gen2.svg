<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><rect width="800" height="450" fill="#ffffff"/><text x="400" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2d3d">كيف يسبب التضيق ارتفاعاً عنيداً في الضغط</text><rect x="150" y="70" width="500" height="64" rx="14" fill="#e8f0ff" stroke="#4b7bec" stroke-width="2"/><text x="400" y="98" text-anchor="middle" font-size="18" font-weight="700" fill="#4b7bec" >تضيق الشريان الكلوي</text><text x="400" y="120" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2d3d" >قلة التروية الكلوية</text><line x1="400" y1="134" x2="400" y2="152" stroke="#51606f" stroke-width="3" /><polygon points="400,160 392,148 408,148" fill="#51606f"/><rect x="150" y="160" width="500" height="64" rx="14" fill="#fff4d6" stroke="#c9961a" stroke-width="2"/><text x="400" y="188" text-anchor="middle" font-size="18" font-weight="700" fill="#c9961a" >ارتفاع الرينين</text><text x="400" y="210" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2d3d" >ثم الأنجيوتنسين والألدوستيرون</text><line x1="400" y1="224" x2="400" y2="242" stroke="#51606f" stroke-width="3" /><polygon points="400,250 392,238 408,238" fill="#51606f"/><rect x="150" y="250" width="500" height="64" rx="14" fill="#fdeeee" stroke="#d64545" stroke-width="2"/><text x="400" y="278" text-anchor="middle" font-size="18" font-weight="700" fill="#d64545" >تضيق الأوعية واحتباس الملح والماء</text><text x="400" y="300" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2d3d" >ارتفاع ضغط الدم</text><line x1="400" y1="314" x2="400" y2="332" stroke="#51606f" stroke-width="3" /><polygon points="400,340 392,328 408,328" fill="#51606f"/><rect x="150" y="340" width="500" height="64" rx="14" fill="#f1e8fa" stroke="#8e6bbf" stroke-width="2"/><text x="400" y="368" text-anchor="middle" font-size="18" font-weight="700" fill="#8e6bbf" >حمل زائد على القلب</text><text x="400" y="390" text-anchor="middle" font-size="14" font-weight="400" fill="#1f2d3d" >ضغط لا يستجيب للأدوية ووذمة رئة</text></svg>