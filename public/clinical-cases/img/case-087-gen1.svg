<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><rect width="800" height="450" fill="#fff"/>
<text x="400" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2d3d">معايير كينغز كوليدج للزراعة</text><text x="400" y="55" text-anchor="middle" font-size="13" fill="#51606f">King's College criteria (non-paracetamol)</text>
<rect x="440" y="80" width="340" height="300" rx="16" fill="#fde8e6" stroke="#c0392b" stroke-width="2"/><text x="610" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#7f1d1d">معيار واحد يكفي</text><text x="610" y="132" text-anchor="middle" font-size="13" fill="#7f1d1d">ONE is enough</text><text x="610" y="210" text-anchor="middle" font-size="44" font-weight="700" fill="#c0392b">100 s</text><text x="610" y="245" text-anchor="middle" font-size="17" fill="#7f1d1d">زمن البروثرومبين أكثر من</text><text x="610" y="268" text-anchor="middle" font-size="13" fill="#7f1d1d">Prothrombin time above</text><text x="610" y="320" text-anchor="middle" font-size="14" fill="#7f1d1d">مهما كانت درجة الاعتلال الدماغي</text><text x="610" y="340" text-anchor="middle" font-size="12" fill="#7f1d1d">whatever the encephalopathy grade</text>
<rect x="20" y="80" width="400" height="300" rx="16" fill="#eef4fb" stroke="#2f80c9" stroke-width="2"/><text x="220" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#1f3b5c">أو ثلاثة من الخمسة</text><text x="220" y="132" text-anchor="middle" font-size="13" fill="#1f3b5c">OR any THREE of five</text>
<circle cx="395" cy="160" r="13" fill="#2f80c9"/><text x="395" y="165" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="375" y="160" text-anchor="end" font-size="14" font-weight="700" fill="#1f2d3d">العمر أقل من 10 أو أكثر من 40</text><text x="375" y="176" text-anchor="end" font-size="11" fill="#51606f">Age under 10 or over 40</text>
<circle cx="395" cy="204" r="13" fill="#2f80c9"/><text x="395" y="209" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="375" y="204" text-anchor="end" font-size="14" font-weight="700" fill="#1f2d3d">التهاب كبد غير A وغير B أو دواء</text><text x="375" y="220" text-anchor="end" font-size="11" fill="#51606f">Non-A non-B, halothane, idiosyncratic drug</text>
<circle cx="395" cy="248" r="13" fill="#2f80c9"/><text x="395" y="253" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="375" y="248" text-anchor="end" font-size="14" font-weight="700" fill="#1f2d3d">يرقان أكثر من 7 أيام قبل الاعتلال</text><text x="375" y="264" text-anchor="end" font-size="11" fill="#51606f">Jaundice more than 7 days before encephalopathy</text>
<circle cx="395" cy="292" r="13" fill="#2f80c9"/><text x="395" y="297" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="375" y="292" text-anchor="end" font-size="14" font-weight="700" fill="#1f2d3d">زمن البروثرومبين أكثر من 50 ثانية</text><text x="375" y="308" text-anchor="end" font-size="11" fill="#51606f">Prothrombin time above 50 s</text>
<circle cx="395" cy="336" r="13" fill="#2f80c9"/><text x="395" y="341" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">5</text><text x="375" y="336" text-anchor="end" font-size="14" font-weight="700" fill="#1f2d3d">البيليروبين أكثر من 308</text><text x="375" y="352" text-anchor="end" font-size="11" fill="#51606f">Bilirubin above 308 µmol/L</text>
<text x="400" y="420" text-anchor="middle" font-size="12" fill="#51606f">رسم توضيحي من إعداد الموقع — Site illustration</text></svg>