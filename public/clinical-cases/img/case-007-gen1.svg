<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Tahoma, Arial, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c2410c"/></marker><marker id="ak" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker></defs><rect width="800" height="450" rx="18" fill="#f1f5f9"/><rect x="30" y="20" width="740" height="410" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2" /><text x="400" y="55" font-size="18" text-anchor="middle" fill="#0f172a" font-weight="bold" >خط زمني بعد جرعة باراسيتامول زائدة (المقياس غير متناسب)</text><line x1="80" y1="200" x2="740" y2="200" stroke="#334155" stroke-width="4" stroke-linecap="round" /><circle cx="110" cy="200" r="9" fill="#fff" stroke="#334155" stroke-width="3"/><text x="110" y="235" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold" >0</text><circle cx="230" cy="200" r="9" fill="#fff" stroke="#334155" stroke-width="3"/><text x="230" y="235" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold" >ساعة</text><circle cx="350" cy="200" r="9" fill="#fff" stroke="#334155" stroke-width="3"/><text x="350" y="235" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold" >4 ساعات</text><circle cx="470" cy="200" r="9" fill="#fff" stroke="#334155" stroke-width="3"/><text x="470" y="235" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold" >8 ساعات</text><circle cx="590" cy="200" r="9" fill="#fff" stroke="#334155" stroke-width="3"/><text x="590" y="235" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold" >24 ساعة</text><circle cx="700" cy="200" r="9" fill="#fff" stroke="#334155" stroke-width="3"/><text x="700" y="235" font-size="15" text-anchor="middle" fill="#0f172a" font-weight="bold" >3–5 أيام</text><rect x="110" y="120" width="120" height="34" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" /><text x="170" y="142" font-size="12" text-anchor="middle" fill="#0c4a6e" font-weight="normal" >فحم منشَّط (إن توفّر)</text><rect x="110" y="160" width="360" height="28" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" /><text x="290" y="180" font-size="14" text-anchor="middle" fill="#14532d" font-weight="bold" >أفضل فعالية للترياق: أسيتيل سيستئين</text><rect x="470" y="160" width="230" height="28" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" /><text x="585" y="180" font-size="13" text-anchor="middle" fill="#7f1d1d" font-weight="normal" >بعد 8 ساعات: خطر أكبر</text><line x1="350" y1="268" x2="350" y2="248" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" /><rect x="260" y="268" width="180" height="40" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" /><text x="350.0" y="292.6666666666667" font-size="14" text-anchor="middle" fill="#4c1d95" font-weight="bold" >مريضتنا هنا (4 ساعات)</text><rect x="540" y="268" width="190" height="66" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2" /><text x="635" y="292" font-size="14" text-anchor="middle" fill="#7c2d12" font-weight="bold" >مختبر: وظائف الكبد</text><text x="635" y="314" font-size="13" text-anchor="middle" fill="#7c2d12" font-weight="normal" >والكلى والسكر وتخثر الدم</text><line x1="590" y1="268" x2="590" y2="248" stroke="#ea580c" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)" /><rect x="640" y="345" width="100" height="0.1" rx="0" fill="#fff" stroke="#fff" stroke-width="0" /><rect x="500" y="350" width="230" height="50" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2" /><text x="615.0" y="379.6666666666667" font-size="14" text-anchor="middle" fill="#7f1d1d" font-weight="bold" >نخر الكبد وفشل أعضاء</text><line x1="700" y1="350" x2="700" y2="248" stroke="#b91c1c" stroke-width="2" stroke-linecap="round" marker-end="url(#ah)" /><rect x="60" y="345" width="420" height="50" rx="10" fill="#fffbeb" stroke="#d9