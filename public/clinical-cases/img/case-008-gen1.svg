<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="Tahoma, Arial, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c2410c"/></marker><marker id="ak" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker></defs><rect width="800" height="450" rx="18" fill="#f1f5f9"/><rect x="30" y="20" width="740" height="410" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2" /><text x="400" y="55" font-size="18" text-anchor="middle" fill="#0f172a" font-weight="bold" >أين نقف على الخط الزمني؟ (مقياس غير متناسب)</text><line x1="70" y1="180" x2="730" y2="180" stroke="#334155" stroke-width="5" stroke-linecap="round" /><circle cx="110" cy="180" r="12" fill="#7c3aed" stroke="#fff" stroke-width="3"/><text x="110" y="150" font-size="15" text-anchor="middle" fill="#7c3aed" font-weight="bold" >خلال الرحلة</text><text x="110" y="212" font-size="13" text-anchor="middle" fill="#334155" font-weight="normal" >علاقة</text><text x="110" y="232" font-size="13" text-anchor="middle" fill="#334155" font-weight="normal" >غير محمية</text><circle cx="265" cy="180" r="12" fill="#0369a1" stroke="#fff" stroke-width="3"/><text x="265" y="150" font-size="15" text-anchor="middle" fill="#0369a1" font-weight="bold" >قبل أسبوعين</text><text x="265" y="212" font-size="13" text-anchor="middle" fill="#334155" font-weight="normal" >العودة</text><text x="265" y="232" font-size="13" text-anchor="middle" fill="#334155" font-weight="normal" >من السفر</text><circle cx="420" cy="180" r="12" fill="#ea580c" stroke="#fff" stroke-width="3"/><text x="420" y="150" font-size="15" text-anchor="middle" fill="#ea580c" font-weight="bold" >قبل 3–4 أيام</text><text x="420" y="212" font-size="13" text-anchor="middle" fill="#334155" font-weight="normal" >ظهور الطفح</text><text x="420" y="232" font-size="13" text-anchor="middle" fill="#334155" font-weight="normal" >وألم الحلق</text><circle cx="570" cy="180" r="12" fill="#dc2626" stroke="#fff" stroke-width="3"/><text x="570" y="150" font-size="15" text-anchor="middle" fill="#dc2626" font-weight="bold" >اليوم</text><text x="570" y="212" font-size="13" text-anchor="middle" fill="#334155" font-weight="normal" >حمّى وغدد</text><text x="570" y="232" font-size="13" text-anchor="middle" fill="#334155" font-weight="normal" >متضخمة</text><circle cx="700" cy="180" r="12" fill="#059669" stroke="#fff" stroke-width="3"/><text x="700" y="150" font-size="15" text-anchor="middle" fill="#059669" font-weight="bold" >بعد 6 أسابيع</text><text x="700" y="212" font-size="13" text-anchor="middle" fill="#334155" font-weight="normal" >إعادة الفحص</text><rect x="600" y="250" width="110" height="0" rx="0" fill="#fff" stroke="#fff" stroke-width="0" /><rect x="130" y="262" width="580" height="34" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" /><text x="420" y="285" font-size="15" text-anchor="middle" fill="#78350f" font-weight="bold" >فترة النافذة: قد يبقى الفحص سلبياً حتى نحو 6 أسابيع</text><rect x="100" y="330" width="300" height="60" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" /><text x="250.0" y="357.0" font-size="15" text-anchor="middle" fill="#14532d" font-weight="bold" >إن كان الفحص سلبياً اليوم</text><text x="250.0" y="378.0" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" >لا يكفي: يُعاد بعد 6 أسابيع</text><rect x="430" y="330" width="300" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="580.0" y="357.0" font-size="15" text-anchor="middle" fill="#1e3a8a" font-weight="bold" >إن كان إيجابياً</text><text x="580.0" y="378.0" font-size="13" text-anchor="middle" fill="#475569" font-weight="normal" >إحالة إلى فريق فيروس نقص المناعة</text></svg>