<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif">
<rect width="800" height="450" fill="#f8fafc"/>
<text x="400" y="34" text-anchor="middle" font-size="21" font-weight="bold" fill="#0f172a">لماذا الآن؟ مناعة تتعافى فتكشف عدوى كامنة</text>
<text x="400" y="56" text-anchor="middle" font-size="13" fill="#475569">Why now? A recovering immune system unmasks a hidden infection</text>
<rect x="40" y="90" width="180" height="90" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="130" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#991b1b">قبل 5 سنوات</text><text x="130" y="142" text-anchor="middle" font-size="12" fill="#991b1b">HIV diagnosed</text><text x="130" y="162" text-anchor="middle" font-size="12" fill="#991b1b">وهبطت الخلايا التائية</text>
<rect x="260" y="90" width="180" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="350" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">قبل 6 أسابيع</text><text x="350" y="142" text-anchor="middle" font-size="12" fill="#1e3a8a">HAART started</text><text x="350" y="162" text-anchor="middle" font-size="12" fill="#1e3a8a">الحمل الفيروسي يهبط بسرعة</text>
<rect x="480" y="90" width="280" height="90" rx="14" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
<text x="620" y="120" text-anchor="middle" font-size="15" font-weight="bold" fill="#854d0e">متلازمة إعادة البناء المناعي</text><text x="620" y="142" text-anchor="middle" font-size="12" fill="#854d0e">typically 4-12 weeks after starting</text><text x="620" y="162" text-anchor="middle" font-size="12" fill="#854d0e">استجابة قوية لعدوى قديمة</text>
<g stroke="#475569" stroke-width="3"><line x1="220" y1="135" x2="250" y2="135"/><line x1="440" y1="135" x2="470" y2="135"/></g>
<polygon points="258,135 244,127 244,143" fill="#475569"/><polygon points="478,135 464,127 464,143" fill="#475569"/>
<line x1="620" y1="180" x2="620" y2="225" stroke="#475569" stroke-width="3"/><polygon points="620,235 611,220 629,220" fill="#475569"/>
<rect x="470" y="240" width="290" height="80" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="615" y="270" text-anchor="middle" font-size="15" font-weight="bold" fill="#5b21b6">التهاب شبكية بمضخّم الخلايا</text><text x="615" y="292" text-anchor="middle" font-size="12" fill="#5b21b6">CMV retinitis: blurred vision, flashes</text><text x="615" y="310" text-anchor="middle" font-size="12" fill="#5b21b6">ومعها حمى متقطعة</text>
<rect x="60" y="250" width="340" height="140" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="230" y="280" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">العلاج</text>
<text x="230" y="308" text-anchor="middle" font-size="13" fill="#166534">• مضاد فيروسي فوراً (غانسيكلوفير)</text>
<text x="230" y="332" text-anchor="middle" font-size="13" fill="#166534">• فريق الإيدز وطبيب العيون</text>
<text x="230" y="356" text-anchor="middle" font-size="13" fill="#166534">• متابعة العيون بانتظام</text>
<text x="230" y="380" text-anchor="middle" font-size="13" fill="#166534">• الاستمرار على العلاج المضاد للفيروس</text>
<line x1="470" y1="280" x2="410" y2="280" stroke="#475569" stroke-width="3"/><polygon points="402,280 416,272 416,288" fill="#475569"/>
</svg>