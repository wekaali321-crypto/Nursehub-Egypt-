<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><rect width="800" height="450" fill="#f8fafc"/><text x="400" y="34" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">نبض الوريد الودجي</text><text x="400" y="60" text-anchor="middle" font-size="17" fill="#475569">Jugular venous pulse</text><rect x="30" y="85" width="360" height="330" rx="14" fill="#fff" stroke="#cbd5e1"/><rect x="410" y="85" width="360" height="330" rx="14" fill="#fff" stroke="#cbd5e1"/><text x="210" y="120" text-anchor="middle" font-size="22" fill="#0f172a" font-weight="bold">وريد رقبة طبيعي</text><text x="210" y="142" text-anchor="middle" font-size="14" fill="#475569">Normal neck vein pulse</text><text x="590" y="120" text-anchor="middle" font-size="22" fill="#991b1b" font-weight="bold">رجفان + تسرّب ثلاثي</text><text x="590" y="142" text-anchor="middle" font-size="14" fill="#475569">AF with tricuspid regurgitation</text><path d="M50,300 L80,300 L95,265 L115,285 L135,300 L150,285 L170,240 L200,262 L225,300 L250,300 L265,265 L285,285 L305,300 L320,285 L340,240 L370,262" fill="none" stroke="#1d4ed8" stroke-width="4" stroke-linejoin="round"/><text x="95" y="250" text-anchor="middle" font-size="20" fill="#1d4ed8" font-weight="bold">a</text><text x="170" y="225" text-anchor="middle" font-size="20" fill="#1d4ed8" font-weight="bold">v</text><text x="265" y="250" text-anchor="middle" font-size="20" fill="#1d4ed8" font-weight="bold">a</text><text x="210" y="350" text-anchor="middle" font-size="18" fill="#1d4ed8">موجة a قبل الانقباض</text><text x="210" y="372" text-anchor="middle" font-size="13" fill="#475569">a wave present</text><path d="M430,300 L470,296 L500,250 L540,200 L560,290 L600,300 L640,250 L670,190 L690,285 L730,300 L750,298" fill="none" stroke="#dc2626" stroke-width="4" stroke-linejoin="round"/><text x="540" y="180" text-anchor="middle" font-size="17" fill="#dc2626" font-weight="bold">v كبيرة مع الانقباض</text><text x="670" y="170" text-anchor="middle" font-size="20" fill="#dc2626" font-weight="bold">v</text><text x="590" y="350" text-anchor="middle" font-size="18" fill="#dc2626">لا توجد موجة a (الأذين لا ينقبض)</text><text x="590" y="372" text-anchor="middle" font-size="13" fill="#475569">no a wave; systolic expansion</text></svg>