mal" >lateral corticospinal tract</text><line x1="575" y1="250" x2="532" y2="250" stroke="#dc2626" stroke-width="3" /><polygon points="532,250 541.2,246.1 541.2,253.9" fill="#dc2626"/><text x="400" y="392" font-size="13" fill="#334155" text-anchor="middle" font-weight="normal" direction="rtl" >الأعمدة الخلفية: الإحساس بالاهتزاز ووضع المفصل · القشري الشوكي: القوة</text><text x="400" y="409" font-size="11" fill="#64748b" text-anchor="middle" font-weight="normal" >Dorsal columns: vibration / position sense. Corticospinal: strength.</text><text x="400" y="425" font-size="13" fill="#64748b" text-anchor="middle" font-weight="normal" direction="rtl" >رسم توضيحي من إعداد الموقع — ليس صورة مريض</text><text x="400" y="442" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="normal" >Schematic illustration by the site — not a real patient image</text></svg>