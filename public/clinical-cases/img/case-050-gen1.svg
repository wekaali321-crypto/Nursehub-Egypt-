<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><rect width="800" height="450" fill="#f8fafc"/><text x="400" y="34" font-size="24" fill="#0f172a" text-anchor="middle" font-weight="bold" direction="rtl" >نمط الالتهاب: عدوى أم نوبة ذئبة؟</text><text x="400" y="58" font-size="14" fill="#475569" text-anchor="middle" font-weight="normal" >Inflammatory markers: infection or lupus flare? (qualitative)</text><rect x="40" y="90" width="330" height="280" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /><text x="205" y="122" font-size="17" fill="#7f1d1d" text-anchor="middle" font-weight="bold" direction="rtl" >عدوى: التهاب نسيج الوجه</text><text x="205" y="141" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal" >Infection (erysipelas / cellulitis)</text><rect x="95" y="170" width="70" height="130" rx="10" fill="#ef4444" stroke="none" stroke-width="2" /><text x="130" y="322" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold" >CRP</text><rect x="220" y="255" width="70" height="45" rx="10" fill="#3b82f6" stroke="none" stroke-width="2" /><text x="255" y="322" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold" >ESR</text><rect x="430" y="90" width="330" height="280" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" /><text x="595" y="122" font-size="17" fill="#1e3a8a" text-anchor="middle" font-weight="bold" direction="rtl" >نوبة ذئبة حادة</text><text x="595" y="141" font-size="12" fill="#475569" text-anchor="middle" font-weight="normal" >Acute lupus flare</text><rect x="485" y="265" width="70" height="35" rx="10" fill="#ef4444" stroke="none" stroke-width="2" /><text x="520" y="322" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold" >CRP</text><rect x="610" y="175" width="70" height="125" rx="10" fill="#3b82f6" stroke="none" stroke-width="2" /><text x="645" y="322" font-size="15" fill="#0f172a" text-anchor="middle" font-weight="bold" >ESR</text><text x="205" y="350" font-size="13" fill="#334155" text-anchor="middle" font-weight="normal" direction="rtl" >CRP مرتفع جدًا وESR أقل ارتفاعًا</text><text x="595" y="350" font-size="13" fill="#334155" text-anchor="middle" font-weight="normal" direction="rtl" >CRP شبه طبيعي وESR مرتفع بوضوح</text><text x="400" y="405" font-size="12" fill="#64748b" text-anchor="middle" font-weight="normal" direction="rtl" >ارتفاعات نوعية توضيحية، وليست أرقام المريضة · رسم من إعداد الموقع</text><text x="400" y="425" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="normal" >Qualitative illustration, not the patient's numbers — schematic by the site</text></svg>