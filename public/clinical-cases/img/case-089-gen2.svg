<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Tahoma, Arial, sans-serif"><defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><rect width="800" height="450" fill="#ffffff"/><text x="400" y="32" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">أين يقع الخلل؟ ثلاثة مواقع للأذية الكلوية الحادة</text>
<text x="400" y="54" text-anchor="middle" font-size="13" font-weight="400" fill="#64748b" direction="ltr">Where is the problem? Pre-, intrinsic, post-renal</text>
<rect x="40" y="84" width="220" height="58" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="150.0" y="110.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">قبل الكلية</text>
<text x="150.0" y="129.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569" direction="ltr">Pre-renal</text>
<rect x="40" y="160" width="220" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="150" y="187" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">هبوط الضغط</text>
<rect x="40" y="212" width="220" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="150" y="239" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">نقص حجم الدم</text>
<rect x="40" y="264" width="220" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="150" y="291" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">مرض وعائي كلوي</text>
<rect x="290" y="84" width="220" height="58" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="400.0" y="110.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">داخل الكلية</text>
<text x="400.0" y="129.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569" direction="ltr">Intrinsic</text>
<rect x="290" y="160" width="220" height="42" rx="9" fill="#fde68a" stroke="#b45309" stroke-width="3"/>
<text x="400" y="187" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">نخر أنبوبي حاد (ATN)</text>
<rect x="290" y="212" width="220" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="400" y="239" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">التهاب أوعية كبيبي</text>
<rect x="290" y="264" width="220" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="400" y="291" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">اضطراب خلالي/أنبوبي</text>
<rect x="540" y="84" width="220" height="58" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="650.0" y="110.0" text-anchor="middle" font-size="18" font-weight="700" fill="#1f2937">بعد الكلية</text>
<text x="650.0" y="129.0" text-anchor="middle" font-size="11.5" font-weight="400" fill="#475569" direction="ltr">Post-renal</text>
<rect x="540" y="160" width="220" height="42" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="650" y="187" text-anchor="middle" font-size="15" font-weight="400" fill="#1f2937">انسداد مجرى البول</text>
<rect x="40" y="335" width="720" height="70" rx="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
<text x="400" y="364" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">مريضتنا: إنتان شديد وجنتامايسين لمدة 7 أيام على كلية سكرية، والأقرب نخر أنبوبي حاد</text>
<text x="400" y="388" text-anchor="middle" font-size="12" font-weight="400" fill="#475569" direction="ltr">Most likely ATN: severe sepsis + 7 days of gentamicin in a diabetic</text>
<text x="400" y="438" text-anchor="middle" font-size="12" font-weight="400" fill="#94a3b8">رسم توضيحي من إعداد الموقع — ليس صورة مريض حقيقي</text></svg>