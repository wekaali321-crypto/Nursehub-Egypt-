<text x="595" y="108" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">الجانب الأيسر: الوريد الخصوي</text>
<text x="595" y="132" text-anchor="middle" font-size="13.5" font-weight="400" fill="#1f2937">يصب في الوريد الكلوي الأيسر عالي الضغط</text>
