<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NurseHub Egypt - منصة عربية متخصصة في تعليم التمريض: مقالات، ملخصات، أدوية، مهارات، خطط رعاية، كتب وأدوات حسابية طبية." />
    <meta name="keywords" content="تمريض, تعليم التمريض, ملخصات تمريض, أدوية, مهارات تمريضية, خطط رعاية, NurseHub Egypt" />
    <meta name="author" content="NurseHub Egypt — RN. Ali Ashour" />
    <meta name="theme-color" content="#0284c7" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NurseHub Egypt" />
    <meta property="og:title" content="NurseHub Egypt | منصة تعليم التمريض" />
    <meta property="og:description" content="منصة عربية متخصصة في تعليم التمريض" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_EG" />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:site_name" content="NurseHub Egypt" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NurseHub Egypt | منصة تعليم التمريض" />
    <meta name="twitter:description" content="منصة عربية متخصصة في تعليم التمريض" />
    <meta name="twitter:image" content="/og-image.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <title>NurseHub Egypt | منصة تعليم التمريض</title>
  </head>
  <body>
    <div id="root">
      <!-- Splash screen shows while React loads -->
      <div id="splash" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0284c7,#14b8a6);z-index:9999;transition:opacity 0.3s">
        <div style="text-align:center;color:white">
          <div style="width:80px;height:80px;margin:0 auto 16px;border-radius:20px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,0.2)">
            <img src="/icon-512.png" width="80" height="80" alt="NurseHub Egypt" style="display:block;width:100%;height:100%;object-fit:cover" />
          </div>
          <div style="font-family:'Cairo',sans-serif;font-weight:800;font-size:24px;letter-spacing:-0.5px">NurseHub <span style="color:#0ea5e9">Egypt</span></div>
          <div style="font-family:'Cairo',sans-serif;font-size:12px;opacity:0.9;margin-top:4px">منصة تعليم التمريض</div>
          <div style="margin-top:20px;display:flex;justify-content:center;gap:6px">
            <div style="width:8px;height:8px;border-radius:50%;background:white;animation:bounce 1s infinite 0s"></div>
            <div style="width:8px;height:8px;border-radius:50%;background:white;animation:bounce 1s infinite 0.2s"></div>
            <div style="width:8px;height:8px;border-radius:50%;background:white;animation:bounce 1s infinite 0.4s"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Hide splash when React mounts
      window.addEventListener('load', function() {
        setTimeout(function() {
          var splash = document.getElementById('splash');
          if (splash) {
            splash.style.opacity = '0';
            setTimeout(function() { splash.style.display = 'none'; }, 300);
          }
        }, 800);
      });
      // Global error handler for production debugging
      window.addEventListener('error', function(e) {
        console.error('[NurseHub Error]', e.message, e.filename, e.lineno);
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('[NurseHub Promise Error]', e.reason);
      });
    </script>
    <style>
      @keyframes bounce {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
        40% { transform: translateY(-8px); opacity: 1; }
      }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
