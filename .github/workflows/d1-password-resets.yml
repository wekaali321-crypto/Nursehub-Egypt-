name: D1 password-reset table
# Manual only. Creates the table + 2 indexes of cloudflare/migrations/0003_password_resets.sql on the production D1
# (e-mail OTP password reset). Idempotent (CREATE ... IF NOT EXISTS): no existing table or row is changed.
# "check" only reads whether the table exists.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: check (read only) / apply
        required: true
        default: check
        type: choice
        options: [check, apply]

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate file (create-if-not-exists only)
        run: |
          f=cloudflare/migrations/0003_password_resets.sql
          if grep -iE '\b(DROP|DELETE|UPDATE|INSERT|ALTER|REPLACE)\b' "$f" | grep -v '^\s*--'; then echo "unexpected statement"; exit 1; fi
          grep -q 'CREATE TABLE IF NOT EXISTS password_resets' "$f"
      - name: Before
        run: npx --yes wrangler@4 d1 execute nursehub --remote --command "SELECT name FROM sqlite_master WHERE name LIKE '%password_resets%' ORDER BY name"
      - name: Apply
        if: inputs.mode == 'apply'
        run: npx --yes wrangler@4 d1 execute nursehub --remote --file=cloudflare/migrations/0003_password_resets.sql
      - name: After
        if: inputs.mode == 'apply'
        run: |
          out=$(npx --yes wrangler@4 d1 execute nursehub --remote --json --command "SELECT name FROM sqlite_master WHERE name LIKE '%password_resets%' ORDER BY name")
          echo "$out"
          echo "$out" | grep -q '"password_resets"' || { echo "table missing"; exit 1; }
